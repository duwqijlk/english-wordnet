simpleMeaning: The leaves of a shrub called khat, chewed like tobacco or brewed as tea, which act as a
  stimulant and lift the mood.
scope: A plant product chewed or drunk for its stimulating effect, not the animal and not the earth-moving
  machine.
examples:
- Traders sold bundles of fresh cat beside tea and spices in the market.
- He brewed cat like tea and drank it before the long drive.
