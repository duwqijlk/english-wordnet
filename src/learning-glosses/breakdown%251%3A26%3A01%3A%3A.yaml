senseId: 'breakdown%1:26:01::'
synsetId: 14089974-n
simpleMeaning: a failure of the mind or body, so that a person can no longer cope
scope: A failure of the mind or body that leaves a person unable to cope, not a chemical splitting apart,
  not rotting, and not a list of parts.
examples:
- After months of strain, he had a breakdown and could not work.
- The breakdown left her unable to get out of bed for weeks.
