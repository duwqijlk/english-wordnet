simpleMeaning: The process that happens in speech when a sound or a word is left out of a spoken word
  or a short group of words
scope: 'Another name for deletion: the leaving out of sounds or words in speech, not a failure to do something
  and not leaving a thing off a list.'
examples:
- The omission of the middle sound made the spoken word hard to hear.
- This omission happens when a word in a phrase loses its last sound in speech.
