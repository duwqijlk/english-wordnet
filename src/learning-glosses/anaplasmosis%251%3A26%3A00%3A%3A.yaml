simpleMeaning: Ticks that live on cattle spread this sickness among them, a sickness much like Texas fever.
scope: Cattle catch this sickness from the ticks that live on them, and it is much like Texas fever, not
  Texas fever itself.
examples:
- Several cows caught anaplasmosis from the ticks that live on them.
- Cattle ticks gave the herd anaplasmosis.
