simpleMeaning: A group in the Interior Department in charge of the national parks.
scope: This word is for the group that runs the parks of the United States, not for the department it
  sits inside and not for one park alone.
examples:
- The National Park Service closed the road into the park after the storm.
- The National Park Service hired more staff to look after the parks.
