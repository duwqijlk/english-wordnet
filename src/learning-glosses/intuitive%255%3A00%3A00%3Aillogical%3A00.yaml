simpleMeaning: known at once, from a feeling inside, not by thinking it through or by looking closely
scope: Known by a feeling rather than by thought or looking, not a feeling that comes on its own from
  a natural urge.
examples:
- She had an intuitive sense that something was wrong.
- His intuitive answer came before he could explain it.
