simpleMeaning: A substance from the pituitary gland and from nerve endings in the brain that narrows blood
  vessels, raising blood pressure, and helps the kidneys hold water, reducing urine flow.
scope: The pituitary substance that narrows vessels and makes the kidneys keep water, raising blood pressure
  as a result; it is the same thing as vasopressin, not adrenaline, and not a sex hormone.
examples:
- The doctor measured his antidiuretic hormone levels to find out why his body was losing so much water.
- Antidiuretic hormone tells the kidneys to hold on to water, so less of it is lost in urine.
