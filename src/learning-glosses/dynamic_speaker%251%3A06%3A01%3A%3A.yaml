senseId: 'dynamic_speaker%1:06:01::'
synsetId: 92463739-n
simpleMeaning: A loudspeaker in which a thin cone, hung on a flexible ring in a stiff frame, is driven
  by a wire coil sliding through a magnetic gap to make sound.
scope: 'Another name for dynamic loudspeaker and moving-coil loudspeaker: the coil-and-cone loudspeaker
  that turns an electrical signal into sound. Not a microphone, which works the same way in reverse, nor
  an electrostatic speaker, which moves a charged film rather than a coil.'
examples:
- A dynamic speaker turned the amplifier's electrical signal into music.
- He swapped the blown dynamic speaker for a spare one of the same size.
