senseId: 'freedom_of_the_seas%1:26:00::'
synsetId: 14017499-n
simpleMeaning: The right to go where they want on the open water between countries belongs to ships that
  carry goods for sale
scope: The right of trading ships to move on the open water, not a right set down in the US Constitution
  and not a right about carrying weapons.
examples:
- The freedom of the seas lets merchant ships cross the oceans.
- Nations agreed to respect the freedom of the seas.
