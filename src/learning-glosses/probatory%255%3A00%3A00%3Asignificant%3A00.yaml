simpleMeaning: Makes you believe a claim that something is true, by showing an idea put forward to be
  true
scope: What tends to win you over to a claim or prove an idea; probative is another name for this sense,
  not what only makes something seem likely.
examples:
- The probatory force of the photograph was clear to the jury.
- His testimony was probatory, helping to show the claim was true.
