simpleMeaning: This wound length of wire offers little fight to a current and stores its push, passing
  a steady current in a circuit but holding back one that keeps changing direction
scope: Also called a choke and a choke coil, it is a wound length of wire in an electric circuit that
  offers little fight to a current and stores its push.
examples:
- The choking coil passes direct current but holds back alternating current.
- The choking coil sits in the circuit and weakens the alternating current.
