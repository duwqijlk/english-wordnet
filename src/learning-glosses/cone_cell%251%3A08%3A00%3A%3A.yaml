simpleMeaning: A tiny part in the back of the eye that picks up bright light and colour.
scope: Also called cone; a light-sensing part in the back of the eye, not the rod that works in dim light
  and not the lens.
examples:
- Cone cells let us see colour in bright daylight.
- Damage to a cone cell makes bright light hard to bear.
