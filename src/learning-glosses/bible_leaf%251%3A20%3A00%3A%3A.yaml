simpleMeaning: A perennial Eurasian herb smelling of tansy, with button-like yellow flowers; eaten as
  a cooked green or salad, sometimes used for potpourri, tea or flavoring, and sometimes placed in Chrysanthemum.
scope: Another name for the aromatic herb called alecost and balsam herb; not tansy itself, though it
  smells like it.
examples:
- Bible leaf is dried and used in potpourri.
- He grew bible leaf in a pot on the kitchen windowsill.
