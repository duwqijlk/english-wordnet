simpleMeaning: 'Spreading European weed, common in the southwestern United States and Mexico: reddish
  trailing stems, fern-like leaves, small reddish-lavender flowers and upright narrow fruits; often grown
  to feed animals.'
scope: This is the low forage weed also called pin grass, not the similar musk clover and not a garden
  geranium.
examples:
- Filaree came up first in the burned pasture.
- Cattle grazed the filaree on the hillside all spring.
