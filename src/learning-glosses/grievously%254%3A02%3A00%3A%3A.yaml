simpleMeaning: in a way that is very serious and causes great pain or harm
scope: This word tells how badly or painfully a thing happens, with great pain or harm; it does not mean
  only a little, and it does not name a thing or a person.
examples:
- He was grievously wounded in the battle and could not stand.
- The flood grievously damaged homes across the village.
