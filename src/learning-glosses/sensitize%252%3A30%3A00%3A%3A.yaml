senseId: 'sensitize%2:30:00::'
synsetId: 00273190-v
simpleMeaning: To make a person quick to notice and feel things.
scope: To make a person notice and feel things, not to make a material take light by coating it, not to
  make a person react to a drug or something that stirs allergy, and not to get a person to notice a thing.
examples:
- The course sensitized the staff to the needs of new pupils.
- Travel sensitized her to how other people live.
