synsetId: 05080080-n
simpleMeaning: the quality of a line or surface that is curved and has no sharp corners
scope: This is about a line or surface being curved with no sharp corners, not about a body being full
  and curved, and not about numbers being round.
examples:
- The roundness of the circle made it smooth to the touch.
- She liked the smooth roundness of the river stones.
