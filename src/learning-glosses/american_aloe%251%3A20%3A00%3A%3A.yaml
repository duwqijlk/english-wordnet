simpleMeaning: Tropical plants of the Americas with low rings of fibrous, sword-shaped leaves and flowers
  on tall spikes; some are grown for show or for fiber.
scope: Not a yucca or a true aloe, other rosette plants; also called agave and a century plant.
examples:
- American aloe grows in the dry garden.
- The American aloe sent up a tall flower spike.
