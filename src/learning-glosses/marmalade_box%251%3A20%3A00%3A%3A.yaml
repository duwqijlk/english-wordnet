simpleMeaning: Juicy fruit the size of an orange, good to eat, hangs from a tree of the West Indies and
  the north of South America.
scope: People also call it genipap fruit and jagua, and the word names the tree, not the fruit alone.
examples:
- The marmalade box grows in the West Indies and bears juicy orange-sized fruit.
- We ate the fruit of the marmalade box, juicy and the size of an orange.
