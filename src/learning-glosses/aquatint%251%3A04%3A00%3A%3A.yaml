senseId: 'aquatint%1:04:00::'
synsetId: 00940907-n
simpleMeaning: a way of making a print on metal with acid, so the print looks like wide strokes of paint
  mixed with water
scope: A print-making method that copies the look of watercolour washes, not a drawing in pencil and not
  a plain line print.
examples:
- She learned aquatint to give her prints the soft look of watercolour.
- The aquatint showed broad washes of grey like a watercolour painting.
