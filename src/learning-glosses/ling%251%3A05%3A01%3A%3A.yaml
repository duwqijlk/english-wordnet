simpleMeaning: a long thin sea fish from Greenland and northern Europe that people eat, often put in salt
  and dried
scope: This sense is the sea fish that people eat, often salted and dried; it is not the fresh water fish
  with the same name and not a plant with the same name.
examples:
- Ling from the northern sea is often salted and dried.
- The fishermen caught ling near Greenland and sold it as food.
