simpleMeaning: to make a split or break appear in something
scope: To make something split on its surface, not the intransitive sense where it splits by itself, the
  sense of hitting something hard, or the mark that remains.
examples:
- The sudden heat cracked the paint on the old door.
- Years of frost had cracked the stone steps.
