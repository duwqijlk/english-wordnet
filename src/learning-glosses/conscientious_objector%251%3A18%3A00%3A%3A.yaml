simpleMeaning: a person who will not serve in the armed forces because their beliefs will not let them
scope: This is a person who will not serve in the armed forces for reasons of belief, not a person who
  dodges service for other reasons and not a soldier.
examples:
- As a conscientious objector, he refused to join the army.
- The court accepted her claim as a conscientious objector.
