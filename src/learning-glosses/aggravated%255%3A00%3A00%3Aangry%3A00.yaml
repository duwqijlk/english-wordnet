simpleMeaning: made angry because someone stirred you up, especially on purpose
scope: 'Also called provoked: this is about a person or animal made angry, especially on purpose, not
  about a problem or illness made worse.'
examples:
- He felt aggravated by their repeated teasing.
- The aggravated dog barked at the man who had poked it.
