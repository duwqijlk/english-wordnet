simpleMeaning: a person who is the best example of a kind, with no one else as good
scope: 'Also called ideal, saint, apotheosis and nonpareil: a person who is the best of a kind, not a
  perfect example that only shows an idea.'
examples:
- She is a paragon of kindness, and no one at the school is as kind.
- As a paragon of honesty, he was trusted by everyone who knew him.
