simpleMeaning: Tied by the government to a thing of worth like gold, this set value for swapping one kind
  of money for another does not move with the market
scope: A set value for swapping one kind of money for another, tied to a thing of worth like gold, not
  a value that moves up or down with the market.
examples:
- The fixed exchange rate kept the country's money tied to gold.
- Under a fixed exchange rate, the value of the money did not move with the market.
