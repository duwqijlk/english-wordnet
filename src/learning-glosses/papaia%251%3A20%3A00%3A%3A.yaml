simpleMeaning: Big long yellow fruit grows on this warm-American shrub or small tree, whose huge leaves
  are cut deep like fingers.
scope: 'It is also called papaya, pawpaw, melon tree and papaya tree: the warm-American shrub or small
  tree with huge finger-cut leaves and big long yellow fruit.'
examples:
- The papaia bears big yellow fruit in warm America.
- Its huge papaia leaves are cut deep like fingers.
