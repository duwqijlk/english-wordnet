senseId: 'motion%1:19:00::'
synsetId: 11445202-n
simpleMeaning: The false sense that something is moving when still pictures of it pass before the eyes
  very fast.
scope: This is only the illusion of movement produced by film or a fast run of still images (also called
  apparent movement), not a proposal put to a meeting, not hand signals, and not real physical movement.
examples:
- The old film's spinning wheel seemed to turn, but the motion was only an illusion.
- The flashing lights on the sign created the illusion of motion.
