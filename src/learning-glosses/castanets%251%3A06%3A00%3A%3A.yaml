senseId: 'castanets%1:06:00::'
synsetId: 02872589-n
simpleMeaning: A pair of hollow wooden or bone pieces that a dancer clicks together, holding them between
  thumb and fingers, to keep the rhythm of Spanish dancing.
scope: The clicking percussion instrument itself, another name for bones, clappers and finger cymbals;
  the word is always plural.
examples:
- The flamenco dancer raised her castanets above her head.
- A sharp rattle of castanets started the next song.
