simpleMeaning: a loud low warning sound that ships in thick mist can hear
scope: 'Also called fogsignal: this is the warning sound itself, not the horn that makes such a sound.'
examples:
- The foghorn's loud, low sound reached the ships that could not see the coast.
- Far out at sea, ships heard the foghorn's deep sound through the fog.
