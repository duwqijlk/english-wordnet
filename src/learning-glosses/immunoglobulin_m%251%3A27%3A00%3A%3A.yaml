simpleMeaning: One of the five big groups of body defence proteins that fight blood infection and start
  the production of the G kind.
scope: One of five big groups of body defence proteins, also called IgM, that fight blood infection and
  start the making of the G kind; not the G kind itself.
examples:
- The lab test showed a high level of immunoglobulin M after the blood infection.
- Immunoglobulin M starts the making of immunoglobulin G when the body fights infection.
