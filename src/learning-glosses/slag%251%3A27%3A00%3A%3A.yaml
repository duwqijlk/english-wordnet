simpleMeaning: the waste matter that forms on top of melted metal when air acts on it
scope: The waste matter that forms on top of melted metal when air acts on it; not ash from a fire, and
  not the metal itself.
examples:
- The workers skimmed slag from the melted iron.
- Slag floated on the surface of the hot metal.
