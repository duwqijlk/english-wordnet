simpleMeaning: to make or leave a dirty or colored mark on something
scope: To make or leave marks, as wine does on cloth; not coloring something on purpose with a liquid
  color, and not the dye used under a microscope (a tool for seeing very small things).
examples:
- Red wine stains light cloth very easily.
- Be careful — this juice will stain your shirt if you spill it.
