simpleMeaning: Much like the palm with a silver top, this small palm grows in southern Florida and the
  West Indies.
scope: Also called silver thatch, thatch palm, and thatch tree, it is a small palm of southern Florida
  and the West Indies, much like the palm with a silver top, not a tall palm of cold lands.
examples:
- The broom palm grows in southern Florida.
- A broom palm looks much like the palm with a silver top.
