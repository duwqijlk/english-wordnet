simpleMeaning: A group outing to a museum, the woods, or some old place, to look at things with one's
  own eyes.
scope: A group outing to a museum, the woods, or some old place, to look at things with one's own eyes;
  not a holiday outing for fun and not a class held in school.
examples:
- The class went on a field trip to the museum.
- Our field trip to the woods let us see the trees up close.
