synsetId: 00915402-s
simpleMeaning: With a sharp, rough edge or face.
scope: This sense is also called jagged and scraggy, for having a sharp, rough edge or face, where jagged
  is with a surface or edge that goes up and down in sharp points, unlike the sense for having a raggedly
  nicked or toothed edge, as though gnawed.
examples:
- The edge was jaggy, sharp and rough.
- The face was jaggy, with a sharp edge.
