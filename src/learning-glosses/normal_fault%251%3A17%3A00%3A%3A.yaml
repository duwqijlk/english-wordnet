simpleMeaning: It looks as if the rock above a slanting split has slipped down past the rock below it.
scope: Also called a common fault and a gravity fault, it is the slanting kind of split in rock, not one
  that runs straight up and down, whose upper side looks as if it has slipped down.
examples:
- Along the normal fault, the upper rock looks as if it has slipped down past the lower rock.
- The normal fault runs at a slant through the rock.
