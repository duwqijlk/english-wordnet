simpleMeaning: Ruined or badly harmed by fire.
scope: 'Means the same as burnt, burned-out, burned-over and burnt-out: something ruined or badly harmed
  by fire, not material merely processed with heat or food spoiled by overcooking.'
examples:
- Rows of burned houses lined the road after the wildfire.
- The burned shell of the factory stood roofless for years.
