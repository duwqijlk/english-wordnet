simpleMeaning: trouble that no one needed and no one saw coming, caused by an event that went wrong
scope: 'Also called misfortune: trouble no one needed and no one saw coming, not a lasting unhappy state
  and not trouble caused by a person''s own choice.'
examples:
- It was bad luck that the storm hit on the day of the fair.
- The roof leaked during the party, and that was pure bad luck.
