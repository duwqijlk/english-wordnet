simpleMeaning: A white mushroom that can be eaten, growing in thick bunches; its thin plates underneath
  are narrow and close together, and its stem is fleshy and dull.
scope: This is the white mushroom that grows in thick bunches and can be eaten; among white mushrooms
  it stands out by its narrow close-set gills and its fleshy dull stem.
examples:
- We picked Clitocybe subconnexa growing in a dense cluster under the trees.
- Clitocybe subconnexa has narrow crowded gills and a fleshy stem.
