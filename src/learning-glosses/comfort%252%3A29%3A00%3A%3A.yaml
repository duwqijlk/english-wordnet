simpleMeaning: to make pain or an unpleasant feeling easier to bear
scope: 'Another name for the verb ease in its physical sense: making pain less severe, not giving someone
  moral support or naming a calm, restful state.'
examples:
- A warm compress can comfort a sore back.
- The lotion can comfort dry, itchy skin.
