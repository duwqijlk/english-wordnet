simpleMeaning: a sea reptile of long ago with a small head on a long neck, a short tail, and four paddle-shaped
  limbs, from the Jurassic and Cretaceous ages
scope: Also called a plesiosaur; not a dinosaur that walked on land and not a modern sea reptile.
examples:
- Plesiosaurus fossils show a small head on a very long neck.
- The plesiosaurus lived in the seas of the Jurassic age long before people.
