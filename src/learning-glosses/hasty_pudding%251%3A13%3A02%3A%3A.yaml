simpleMeaning: A sweet soft food made of tapioca, flour, or oatmeal, cooked fast in milk or water.
scope: This is a sweet soft food made of tapioca, flour, or oatmeal cooked fast in milk or water, not
  a baked cake or the cornmeal kind.
examples:
- She served hasty pudding with cream.
- Hasty pudding was ready in minutes.
