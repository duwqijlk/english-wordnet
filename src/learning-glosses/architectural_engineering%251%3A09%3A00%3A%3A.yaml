simpleMeaning: the part of building work that plans how buildings are put up, not the art of designing
  how they look
scope: A branch of engineering about how buildings are put up; designing how they look is architecture,
  not this.
examples:
- She studied architectural engineering at university.
- The firm hired an expert in architectural engineering to plan the new library.
