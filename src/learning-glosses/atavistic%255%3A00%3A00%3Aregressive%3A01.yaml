simpleMeaning: Of a person or a thing that shows the traits of a distant ancestor.
scope: Showing the traits of a distant ancestor, as a throwback to an earlier time.
examples:
- His tastes were atavistic, more like those of his grandfather's time.
- The custom was atavistic, a holdover from an older age.
