simpleMeaning: A tower with a light that warns ships of shallow water in their path.
scope: A tower with a light that warns ships of shallow water in their path; beacon, lighthouse and beacon
  light are other names for this sense, not a house light and not a ship's own lamp.
examples:
- The pharos guided ships past the rocks at night.
- Sailors steered by the light of the pharos.
