simpleMeaning: A thin, flat, bendable strip that you wear around your body or a limb, mostly to make yourself
  look nicer.
scope: A strip worn on a person's body or limb as decoration; not a people group, an orchestra or pop
  dance group, a radio frequency range, a stripe or stripes of contrasting color, a trim sewn onto a garment,
  a loop around an object, a restraint, a bird's leg marker, a finger ring, an anatomical cord, a machine
  drive belt, or a verb (tying things together, fastening a ring to a bird's foot).
examples:
- She wore a bright band around her wrist to match her dress.
- The dancers wore bands of colored cloth on their arms.
