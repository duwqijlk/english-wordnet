simpleMeaning: A speckled trout of the rivers of Europe, brought by people to North America.
scope: Also called brown trout or salmon trout, this is a speckled trout of European rivers brought to
  North America, not a trout of North American rivers alone.
examples:
- Salmo trutta swims in the rivers of Europe.
- Anglers catch Salmo trutta in North America too.
