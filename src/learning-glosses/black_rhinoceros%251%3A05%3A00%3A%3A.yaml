simpleMeaning: an African animal with a horn on its nose, in danger of dying out
scope: An African animal with a horn on its nose that is in danger of dying out, not a white rhinoceros
  and not an elephant.
examples:
- A black rhinoceros crossed the dry plain at dusk.
- Poachers threaten the black rhinoceros, which is in danger of dying out.
