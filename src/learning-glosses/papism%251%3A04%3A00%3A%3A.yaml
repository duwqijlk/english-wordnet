simpleMeaning: A hostile name for the ways and rites of the Roman Catholic Church.
scope: A hostile name for Roman Catholic ways and rites, not a neutral name for the Church and not a name
  for its beliefs alone.
examples:
- He called the old rites papism, a word Catholics find insulting.
- The writer used papism when attacking the Church's rituals.
