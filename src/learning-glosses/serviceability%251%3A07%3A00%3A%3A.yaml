simpleMeaning: How well someone or something can do work that helps others
scope: How well someone or something can do work that helps others; serviceableness is another name for
  this sense, not how long a thing lasts, and not how well it is made.
examples:
- The serviceability of the old pump was still high after years of use.
- We tested the serviceability of the new chairs in the hall.
