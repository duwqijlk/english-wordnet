simpleMeaning: open land, usually with dark soil of dead plants, covered with heather (a low plant with
  small purple flowers), bracken (a tall fern) and moss
scope: This is open land covered with low plants, not the act of tying a boat to a place with ropes or
  keeping a boat at a dock.
examples:
- We walked across the moor for hours, past low purple flowers.
- Mist covered the moor early in the morning.
