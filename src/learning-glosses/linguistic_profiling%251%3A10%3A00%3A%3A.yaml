simpleMeaning: Telling a person's race, faith or place in society from the way they speak
scope: Guessing who a person is from how they speak, not from what they say and not from how they look.
examples:
- The researcher used linguistic profiling to work out the speaker's social class from his dialect.
- Critics say linguistic profiling can judge a person by the way they speak.
