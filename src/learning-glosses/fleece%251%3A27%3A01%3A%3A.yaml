simpleMeaning: the skin of a sheep, treated so that it will not rot and can be used, with its hair left
  on, used for clothing
scope: 'Also called sheepskin: a sheep''s skin with its hair on, used for clothes, not the hair alone
  on a live animal and not the soft cloth.'
examples:
- This fleece, a whole sheepskin with the wool left on, was sold for making coats.
- She wore a warm coat made from a fleece, with the skin and the wool still together.
