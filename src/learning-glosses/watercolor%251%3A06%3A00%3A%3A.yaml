simpleMeaning: a picture painted with paint that is mixed with water
scope: A finished picture made with paint mixed with water, also called watercolour; not the paint itself
  and not the act of painting.
examples:
- She hung a watercolor of the sea on the wall.
- The gallery sold a small watercolor of a garden.
