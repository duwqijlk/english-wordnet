simpleMeaning: a vehicle or system used to move people or goods from place to place.
scope: This is the vehicle or system that carries people or goods, not the physical process of molecules
  crossing a boundary.
examples:
- Buses are the main form of transport in the city.
- The company provides transport for its workers.
