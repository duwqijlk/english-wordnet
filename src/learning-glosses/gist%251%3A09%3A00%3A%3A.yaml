simpleMeaning: the best, most important and most needed part of an idea or of something a person lives
  through
scope: 'Also called heart, center, core, centre, meat, sum, substance, marrow, essence, kernel, nub, pith
  and inwardness: the main point of an idea or experience, not all the small details around it.'
examples:
- I did not hear every word, but I got the gist of his story.
- The gist of her argument was that the plan would cost too much.
