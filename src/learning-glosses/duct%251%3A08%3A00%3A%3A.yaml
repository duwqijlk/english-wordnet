simpleMeaning: a tube or passage inside the body, with walls of surface cells, that carries a liquid the
  body makes or some other thing
scope: 'Also called channel, canal, and epithelial duct: a tube inside the body that carries a liquid
  the body makes. Not a tube in a plant, and not a tube for air or water in a building.'
examples:
- The tear duct in the corner of her eye was blocked.
- Poison moves through a duct in the snake's fang.
