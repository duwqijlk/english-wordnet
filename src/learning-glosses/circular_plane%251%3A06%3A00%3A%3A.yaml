simpleMeaning: a wood tool with a bendy face that can smooth wood that curves in or curves out
scope: This is a wood tool with a bendy face that can smooth wood that curves in or curves out; compass
  plane is another name for this sense, and it is not a flat tool for smoothing flat wood.
examples:
- He used the circular plane to smooth the curved edge of the board.
- The circular plane worked well on the bowl-shaped piece of wood.
