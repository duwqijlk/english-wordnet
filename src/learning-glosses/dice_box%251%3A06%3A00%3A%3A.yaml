simpleMeaning: a small open cup in which the spotted cubes are shaken by hand and then thrown out
scope: A small open cup for shaking the spotted cubes by hand and throwing them out, also called a dice
  cup, and not a flat tray for rolling the cubes and not a bag for keeping them in.
examples:
- He shook the dice box and threw the dice onto the board.
- She kept the dice box beside the board for the next round.
