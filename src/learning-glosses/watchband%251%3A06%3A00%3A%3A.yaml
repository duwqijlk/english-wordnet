simpleMeaning: Worn round the wrist, a strap of cloth, leather, or linked metal that holds a wristwatch
  in place.
scope: Also called a bracelet, a wristband, a watchstrap, or a watch bracelet, a strap that holds a wristwatch
  and goes round the wrist.
examples:
- He tightened the watchband on his wrist.
- The leather watchband was soft and worn.
