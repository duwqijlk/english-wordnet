simpleMeaning: the state of not having enough of something
scope: This is about not having enough of something, not about a rude, short way of speaking, and not
  about how short a person, a time, or a thing is.
examples:
- There was no shortness of money to pay for the work.
- Shortness of breath made it hard for him to climb the stairs.
