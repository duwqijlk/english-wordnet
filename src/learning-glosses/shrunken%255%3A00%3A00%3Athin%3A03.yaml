simpleMeaning: thin and wrinkled, the way skin and flesh grow smaller and dry out with age or illness
scope: 'Also called withered or shriveled: a body made thin and wrinkled by age or illness, not a thing
  made smaller in size or weaker in force.'
examples:
- The shrunken old man leaned on his stick as he crossed the room.
- Her shrunken hands shook as she poured the tea.
