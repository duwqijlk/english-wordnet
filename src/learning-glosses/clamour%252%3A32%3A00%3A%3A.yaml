simpleMeaning: to say or shout something in a loud way, again and again, and not stop
scope: 'Also called clamor: to shout something loudly again and again; it is not the noun for a loud,
  long shout from many people.'
examples:
- The workers clamoured for higher pay outside the office.
- The crowd clamoured for the gates to open.
