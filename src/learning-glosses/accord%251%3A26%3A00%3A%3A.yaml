simpleMeaning: a state in which people's views, acts, and ways of being fit well together
scope: 'Also called agreement: a state in which people''s views, acts, and ways of being fit well together,
  not a fight or a clash of views.'
examples:
- The two sides worked in accord on the new plan.
- They lived in accord with their neighbours for many years.
