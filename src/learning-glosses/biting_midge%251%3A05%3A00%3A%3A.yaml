simpleMeaning: Mammals, birds, and other insects lose blood to this tiny flying insect with two wings.
scope: This tiny two-winged insect that drinks the blood of mammals, birds, and other insects is also
  called punky, no-see-um, punkey, and punkie.
examples:
- The biting midge drank blood from the bird.
- The cattle were bitten by biting midges.
