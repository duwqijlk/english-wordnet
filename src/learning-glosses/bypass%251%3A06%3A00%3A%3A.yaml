simpleMeaning: a road built around a town or city, so traffic can get past it without driving through
  its middle
scope: This is the road sense of bypass, not the electrical part that lets current flow around a device
  and not the tube made in surgery to go around a damaged part.
examples:
- The new bypass lets trucks go around the town instead of through the center.
- We took the bypass to avoid the morning traffic.
