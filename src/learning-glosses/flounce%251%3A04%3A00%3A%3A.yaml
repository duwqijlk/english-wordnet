simpleMeaning: the act of walking with movements that are too big and sudden and uneven
scope: This is a way of walking, not a strip of cloth with folds sewn on clothes as a pretty edge.
examples:
- He left the room in a flounce, swinging his arms with each step.
- With a sudden flounce, she turned and walked away in big, jerky steps.
