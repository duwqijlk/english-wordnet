simpleMeaning: Long tails that usually grip branches, hairy faces, and wide-set nostrils mark these monkeys
  that live in trees.
scope: Tree monkeys with hairy faces, wide-set nostrils and long tails that usually grip branches; platyrrhine
  is another name for them, not a monkey that lives on the ground.
examples:
- The platyrrhinian hung by its tail from a branch.
- Platyrrhinian monkeys live high in the trees, gripping branches with their tails.
