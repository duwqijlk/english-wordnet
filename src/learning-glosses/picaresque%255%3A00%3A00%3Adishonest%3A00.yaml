simpleMeaning: About clever rogues or people who seek adventure, above all in stories of that kind.
scope: This word is used of stories about clever rogues and people who seek adventure; not of stories
  about honest heroes, and not of true tales of travel.
examples:
- He loved picaresque novels about rogues on the road.
- The picaresque hero lived by his wits.
