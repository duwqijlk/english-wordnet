senseId: 'suffer%2:39:02::'
synsetId: 02114536-v
simpleMeaning: to experience or live through an event or fate
scope: This is going through an event or fate, for which meet is another name (as in meet a violent death),
  not being made to endure something imposed by someone else and not having an injury or illness.
examples:
- The mountaineers suffered a terrible fate when the storm struck.
- The company suffered a serious setback after losing the contract.
