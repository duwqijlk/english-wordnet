simpleMeaning: blood vessels that carry blood away from the lips of the vulva, the outer part of a woman's
  sex organs
scope: Blood vessels that drain the lips of the vulva, not the veins of the leg and not an artery.
examples:
- The labial vein carries blood away from the vulva.
- Injury to a labial vein can cause heavy bleeding.
