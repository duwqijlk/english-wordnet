simpleMeaning: Orders to a computer are set out in more than one direction in this way of giving them
scope: A way of giving orders to a computer set out in more than one direction, not a way of giving orders
  in one straight line and not a spoken language.
examples:
- She wrote the program in a multidimensional language.
- The multidimensional language set out its orders in two directions at once.
