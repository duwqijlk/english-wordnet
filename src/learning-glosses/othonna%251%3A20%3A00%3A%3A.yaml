simpleMeaning: A South African plant of one kind with smooth, often thick, leaves and heads of yellow
  blooms
scope: A South African plant with smooth, often thick, leaves and heads of yellow blooms, not a tree and
  not a garden rose.
examples:
- The othonna grew in dry ground in South Africa.
- Her othonna had smooth leaves and heads of yellow blooms.
