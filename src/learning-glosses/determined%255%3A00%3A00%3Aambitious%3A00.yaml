senseId: determined%5:00:00:ambitious:00
synsetId: 00105498-s
simpleMeaning: having a strong wish to do well and to keep trying hard to reach a goal
scope: 'Also called driven: this is about wanting strongly to do well, not about a choice already made
  by someone in charge, and not about a fact found out.'
examples:
- She is a determined student who studies every day to pass her tests.
- The determined young runner trained hard to win the race.
