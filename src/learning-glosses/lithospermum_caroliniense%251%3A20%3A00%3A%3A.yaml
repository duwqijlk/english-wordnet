simpleMeaning: A plant that lives for years in the east of North America, with hairy leaves that give
  a red or yellow colouring.
scope: This is a long-lived plant of eastern North America whose hairy leaves give a red or yellow colour;
  puccoon is another name for this sense, and it is not the European gromwell.
examples:
- The Lithospermum caroliniense grew along the edge of the field, its hairy leaves bright in the sun.
- People once got a red dye from Lithospermum caroliniense leaves.
