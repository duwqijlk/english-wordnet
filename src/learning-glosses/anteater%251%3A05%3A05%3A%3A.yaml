simpleMeaning: A small Australian marsupial — a pouched animal — with a long snout and strong claws for
  feeding on termites, nearly gone.
scope: Also called a banded anteater or numbat; the small Australian marsupial that feeds on termites,
  not the toothless mammals of warm America, not the African burrower, and not the spiny or scaly ones.
examples:
- The anteater dug for termites with its strong claws.
- An anteater is nearly gone from the wild in Australia.
