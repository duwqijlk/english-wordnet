simpleMeaning: A small leaf or leaf-like part that shields a bud or a catkin (a slim flower cluster).
scope: This is a small plant part covering a bud or flower cluster, not a hard plate on an animal's skin
  and not a sheet of metal armour.
examples:
- The bud scales split open as the first warm days arrived.
- Tiny scales shield the developing flowers on the willow.
