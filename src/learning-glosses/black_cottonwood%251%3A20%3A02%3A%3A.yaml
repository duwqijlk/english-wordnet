simpleMeaning: With large rounded leaves with wavy edges and brownish bark and wood, this North American
  poplar stands apart from its western namesake.
scope: Also called downy poplar, swamp cottonwood, and swamp poplar, this North American poplar is not
  the western tree with dark green leaves that shine above.
examples:
- We saw a black cottonwood with large rounded leaves.
- We saw a black cottonwood with brownish bark.
