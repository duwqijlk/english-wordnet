simpleMeaning: to move fast and lightly, moving over a surface without going deep into it
scope: 'Also called flutter and fleet: this means moving fast and lightly, not the small pointed thing
  that is thrown or shot, and not the small fold sewn into clothing.'
examples:
- The small bird darted from tree to tree in the garden.
- A fish darted across the clear water and was gone.
