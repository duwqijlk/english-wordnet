simpleMeaning: In the East, people pay to ride in a three-wheeled cab, usually moved by pedals.
scope: Also called pedicab, it is a cab for hire in the East.
examples:
- We hired a cycle rickshaw to cross the old town.
- The cycle rickshaw driver pedalled us to the market.
