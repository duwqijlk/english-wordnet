simpleMeaning: A syringe with a soft rubber bulb that does the work of a plunger, used to rinse an opening
  like the ear canal or clear a stuffy nose.
scope: Another name for this rinsing device with a rubber bulb, also called nasal aspirator and nasal
  syringe; not a regular plunger syringe used for injections.
examples:
- The nurse used a bulb syringe to rinse wax from the ear canal.
- She squeezed the bulb syringe gently to clear the baby's stuffy nose.
