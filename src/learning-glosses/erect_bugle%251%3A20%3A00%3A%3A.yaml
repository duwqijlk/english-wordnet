simpleMeaning: A plant that lives for years, stands straight up, and has bright blue flowers, with stems
  that spread sideways under the ground, from southern Europe.
scope: A blue-flowered plant of southern Europe that stands straight up, also called blue bugle; not a
  low ground plant and not a yellow-flowered plant.
examples:
- The erect bugle stood tall among the rocks with its blue flowers open.
- In the garden, erect bugle spreads by its sideways roots.
