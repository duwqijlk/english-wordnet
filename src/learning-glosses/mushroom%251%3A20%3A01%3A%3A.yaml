simpleMeaning: soft, fleshy fungi and others like them, such as toadstools, puffballs, morels, and coral
  fungi
scope: This is the wide group sense, for many kinds of fleshy fungi together. It is not one single kind
  with a cap and stem, and not the cloud after a blast.
examples:
- Mushrooms, toadstools, and puffballs are all listed in this wide group.
- The book puts mushrooms and morels together with other fleshy fungi.
