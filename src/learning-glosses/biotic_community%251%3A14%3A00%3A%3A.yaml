simpleMeaning: In ecology, a group of living things that share one place and depend on and affect one
  another.
scope: A group of living things that share one place and depend on and affect one another; community is
  another name for this sense, not a group of one kind of living thing and not the place itself.
examples:
- The biotic community of the pond includes fish, frogs, and water plants.
- Scientists study how the biotic community changes when a new plant arrives.
