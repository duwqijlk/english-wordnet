simpleMeaning: soap in the form of fine dry grains, mixed with chemicals that help it clean
scope: 'Also called soap powder and built-soap powder: soap in the form of fine dry grains mixed with
  chemicals that help it clean, not a liquid soap and not a bar of soap.'
examples:
- She put a scoop of washing powder in the machine.
- The washing powder dissolved in the hot water.
