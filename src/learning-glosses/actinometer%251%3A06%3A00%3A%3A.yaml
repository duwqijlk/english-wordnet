simpleMeaning: A tool that tells how strong light and other waves are, most often from the change light
  brings about in a chemical.
scope: This is the tool that does the measuring, not the measuring itself, and it works most often through
  the change light brings about in a chemical.
examples:
- The scientist used an actinometer to measure how strong the sunlight was.
- With an actinometer, the class found the lamp gave off weak rays.
