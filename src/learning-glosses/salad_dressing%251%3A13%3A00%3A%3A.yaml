simpleMeaning: either a thin French sauce of oil and vinegar or a thick creamy sauce like mayonnaise,
  both tasty sauces poured over salad
scope: Also called a dressing; a sauce for salad, not a sauce for meat.
examples:
- She shook the salad dressing before pouring it on the greens.
- This salad dressing tastes of oil and vinegar.
