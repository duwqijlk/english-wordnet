simpleMeaning: In electricity, the nature of the pole, one end of a device, that has the minus charge
scope: The quality of the minus electric pole. It is not a person's habit of doubting or saying no, and
  not the pull that an atom has on small charged parts in chemistry.
examples:
- The negativity of this pole was shown by the minus sign beside it.
- They measured the negativity of the electric pole before joining the wires.
