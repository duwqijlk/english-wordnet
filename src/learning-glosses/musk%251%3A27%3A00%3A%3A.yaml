simpleMeaning: a strong-smelling substance made by a gland (a small body part that makes liquid) in a
  male deer, used in perfume to make the smell last longer
scope: The substance itself, taken from a male deer and used in perfume, not the smell of that substance
  and not the perfume itself.
examples:
- The perfume maker added a little musk to help the scent last.
- Real musk comes from a gland in the male deer.
