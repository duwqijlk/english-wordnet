senseId: 'incapability%1:07:00::'
synsetId: 05214838-n
simpleMeaning: The body, the mind, or the law can stop you from doing a thing
scope: This is being unable to do a thing, in body, in mind, or by law; incapableness is another name
  for this sense, not a lack of will to act.
examples:
- His incapability after the accident kept him from working.
- The court ruled on her legal incapability to sign the contract.
