simpleMeaning: a soldier in a unit named for its protective role
scope: This is a soldier of a unit called 'the Guard' or 'the Guards', not a person merely keeping watch,
  not the military unit itself, and not a football or basketball player.
examples:
- He served in the Guards for ten years before leaving the army.
- The Guards marched past the palace in full ceremonial dress.
