simpleMeaning: lacking firmness of moral character, courage or willpower, or simply having human qualities
  rather than divine ones
scope: About moral firmness and being human rather than divine, not physical strength, skill, or faint
  light or sound; frail, imperfect and fallible are other names.
examples:
- He was too weak to stand up to his boss.
- The story shows its heroes as weak, ordinary people rather than gods.
