simpleMeaning: A part of a molecule, CH3-, with one free link, that comes from methane.
scope: A part of a molecule, CH3-, with one free link, that comes from methane, also called methyl or
  a methyl group; not the whole methane molecule and not a part with two free links.
examples:
- A methyl radical is the CH3- part that comes from methane.
- The methyl radical has one free link.
