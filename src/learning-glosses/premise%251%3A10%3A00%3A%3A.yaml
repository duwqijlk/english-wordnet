simpleMeaning: A claim taken as true at the start, from which a later claim is worked out.
scope: Also called an assumption, this is a claim taken as true so a conclusion can follow, not the act
  of putting words before a talk.
examples:
- Her premise was that the road would stay open all winter.
- If we accept his premise, the rest of his case follows.
