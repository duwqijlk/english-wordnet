simpleMeaning: The power to make things grow in great numbers and keep them growing strong and full
scope: The power to make things grow in great numbers and keep them growing strong and full; not money
  or wealth and not the taste of food.
examples:
- He praised the richness of the soil in the valley.
- The richness of the field showed in the tall corn.
