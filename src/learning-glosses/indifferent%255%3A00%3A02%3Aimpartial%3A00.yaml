senseId: indifferent%5:00:02:impartial:00
synsetId: 01728286-s
simpleMeaning: showing no special liking or dislike for one thing over another, and no choice between
  them
scope: Showing no special liking or dislike for one thing over another, not a thing that will not react
  with other things, not a refusal to pay heed, and not a thing that does not matter.
examples:
- She was indifferent about which book to lend them.
- He was indifferent to their acceptance or rejection of his invitation.
