simpleMeaning: a British measure for liquids or dry goods, equal to 2 pints or 1.136 litres
scope: A British measure for liquids or dry goods, not the US liquid measure and not the US dry measure.
examples:
- The recipe calls for a quart of cream.
- He bought a quart of milk at the shop.
