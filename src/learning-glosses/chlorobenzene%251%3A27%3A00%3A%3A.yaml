simpleMeaning: A clear, flammable liquid that evaporates quickly and smells of almonds, made from chlorine
  and benzene; used to dissolve substances and to make phenol, DDT and other carbon-based compounds.
scope: The chlorine-and-benzene solvent; not benzene itself and not phenol, which is made from it.
examples:
- Chlorobenzene is handled in a fume hood because its vapour is flammable.
- The factory uses chlorobenzene as a solvent when making phenol.
