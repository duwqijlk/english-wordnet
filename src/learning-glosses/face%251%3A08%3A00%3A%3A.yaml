simpleMeaning: the front part of a person's head, from the top of the forehead down to the chin and across
  from one ear to the other
scope: This is the front of the head itself, not the whole head and not the look on someone's face.
examples:
- She washed her face with cold water.
- A fly landed on his face and he brushed it away.
