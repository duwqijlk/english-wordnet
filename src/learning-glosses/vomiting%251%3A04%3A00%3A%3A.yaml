senseId: 'vomiting%1:04:00::'
synsetId: 00119553-n
simpleMeaning: When the body on its own pushes what is in the stomach up and out through the mouth
scope: This is the body's own act of pushing what is in the stomach out through the mouth; vomit is another
  name for this sense, and it is not a cough or a deliberate act of spitting.
examples:
- The vomiting began soon after he ate the bad fish.
- She felt sick, and the vomiting would not stop.
