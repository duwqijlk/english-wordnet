simpleMeaning: Blood, lymph, or urine passes out of a tube in the body into the flesh around it.
scope: Here, blood, lymph, or urine passes out of a tube in the body into the flesh around it, not lava
  pouring from a volcano and not the leaked liquid itself.
examples:
- Extravasation of blood into the tissues around the vessel was found.
- Extravasation of lymph from the vessel into the tissues around it was noted.
