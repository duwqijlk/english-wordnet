simpleMeaning: In animals with a backbone, one of usually two body parts that make eggs and give out two
  body chemicals, estrogen and progesterone
scope: The body part in a female animal, not the part of a flower that holds its young seeds.
examples:
- The doctor checked her ovaries during the scan.
- An ovary makes eggs that can grow into a baby.
