simpleMeaning: A sticky plant with heads of pink flowers, in sandy desert soil; after rains it may cover
  miles of desert in pink, from the southwest United States to north Mexico.
scope: Not other desert plants, nor other pink-flowered plants of sandy soil; also called desert sand
  verbena.
examples:
- Abronia villosa carpets the desert after rain.
- The pink flowers of Abronia villosa are bright.
