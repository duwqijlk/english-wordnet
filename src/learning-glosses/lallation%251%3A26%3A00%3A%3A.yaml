senseId: 'lallation%1:26:00::'
synsetId: 14425892-n
simpleMeaning: Faulty speech in which the /l/ sound is made badly, or the /r/ sound is pronounced as /l/
scope: This fault of speech turns the sound /r/ into /l/, or makes the sound /l/ badly.
examples:
- The child's lallation turned every /r/ into an /l/ sound.
- Her lallation showed when she said the /l/ sound badly.
