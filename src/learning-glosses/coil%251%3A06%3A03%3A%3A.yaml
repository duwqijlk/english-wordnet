simpleMeaning: A thing put inside a woman's womb to stop her getting pregnant
scope: A thing put inside a woman's womb to stop her getting pregnant, not a tube wound in a spiral and
  not a spiral of wire in a circuit.
examples:
- The doctor fitted her with a coil to stop her getting pregnant.
- She had a coil put in after her second child was born.
