simpleMeaning: In criminal law, a claim by a person on trial that they are not guilty because their mind
  was not working right at the time
scope: Also called an insanity plea, this is a claim in a court case that a person is not guilty because
  their mind was not working right, not a plain claim of not guilty and not a request for mercy.
examples:
- His lawyer entered a plea of insanity after doctors said his mind had not been working right at the
  time.
- The court heard a plea of insanity from the man on trial for the robbery.
