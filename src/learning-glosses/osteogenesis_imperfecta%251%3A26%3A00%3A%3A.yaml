senseId: 'osteogenesis_imperfecta%1:26:00::'
synsetId: 14181906-n
simpleMeaning: Bones break easily in a condition passed down in families in which the joining tissue of
  the body is faulty.
scope: A condition passed down in families in which the bones break easily, not ordinary broken bones
  from a fall.
examples:
- Osteogenesis imperfecta makes her bones break easily.
- The child with osteogenesis imperfecta broke a bone in a small fall.
