simpleMeaning: a person or a firm whose work is moving people, goods, or messages from one place to another
scope: A person or firm in the transport business, not a vehicle that carries things and not a worker
  whose job is simply carrying something.
examples:
- The carrier delivered the parcel the next day.
- Which carrier moves the freight for your firm?
