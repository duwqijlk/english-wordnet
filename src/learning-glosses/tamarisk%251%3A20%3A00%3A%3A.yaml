simpleMeaning: Any shrub or small tree of genus Tamarix, with tiny scale-like or needle-shaped leaves
  and feathery clusters of small white or pinkish flowers, mostly in salty coastal soil.
scope: The general plant name for shrubs and small trees of genus Tamarix. It is not the tamarind, a tropical
  fruit tree with a similar-sounding name.
examples:
- Tamarisk grew in thick stands along the dry riverbed.
- The tamarisk's feathery pink flower spikes swayed in the hot wind.
