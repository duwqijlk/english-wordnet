simpleMeaning: In law, a ruling comes at the end of a set of steps that starts when a court case is begun
scope: 'Also called proceedings and proceeding: in law, the start of a court case and the steps that follow
  it, not one hearing and not the ruling itself.'
examples:
- The legal proceeding began with the filing of the claim.
- Both sides hired lawyers for the legal proceeding.
