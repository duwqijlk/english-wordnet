simpleMeaning: A general word for any object that, when held, entitles the holder to a way in or a means
  of reaching something.
scope: This is a broad label for objects that grant access, not a lever you press or a musical scale.
examples:
- Staff carry a key in the form of a badge that opens every door in the lab.
- 'The rental company gives you a key to the boat: an electronic fob that unlocks the cabin door.'
