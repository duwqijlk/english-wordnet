simpleMeaning: a liquid that turns to gas, made by heating sticky juice from pine and other trees and
  catching its steam; used to thin paint, dissolve things, and as medicine
scope: Also called turps, oil of turpentine, and spirit of turpentine, this is the liquid made from the
  sticky juice of pine trees; it is not that sticky juice itself.
examples:
- She thinned the old paint with a little turpentine.
- He cleaned the brushes in turpentine after painting the fence.
