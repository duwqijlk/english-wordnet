simpleMeaning: Blood tubes on both sides of the body that carry blood away from the muscles of the buttock
scope: Blood tubes that drain the buttock muscles on both sides of the body, not the muscles themselves
  and not tubes that bring blood to the buttock.
examples:
- The gluteal vein carries blood away from the muscles of the buttock.
- The surgeon tied off a torn gluteal vein on the left side.
