simpleMeaning: to send out or change waves of electric and magnetic power in short bursts, or to make
  a machine do so
scope: To send out or change waves of electric and magnetic power in short bursts, not to swell and shrink
  in a steady beat and not a seed or a heart beat.
examples:
- The radio pulsed its signal across the valley.
- Engineers pulsed the waves in short bursts.
