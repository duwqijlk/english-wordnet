simpleMeaning: With a long, thin, hooked beak whose edges are toothed, this big crested duck dives after
  fish.
scope: Merganser, fish duck, and sawbill are other names for this big crested duck that dives after fish.
examples:
- The sheldrake dived under the water after a fish.
- The sheldrake came up from its dive with a fish.
