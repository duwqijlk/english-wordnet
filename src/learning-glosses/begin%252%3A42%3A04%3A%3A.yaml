senseId: 'begin%2:42:04::'
synsetId: 02615238-v
simpleMeaning: To start at a particular moment in time, as an event or period does.
scope: This is an event or period starting at a point in time, not something opening with a named first
  part and not being the first item in a series.
examples:
- The concert begins at eight o'clock.
- The war began in the spring of 1914.
