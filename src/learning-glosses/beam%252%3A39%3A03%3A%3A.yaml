simpleMeaning: to have a face with a strong, bright color, such as red or pink
scope: 'Also called glow or shine: this is about a face showing a strong, bright color. It is not smiling
  with joy, and not a long thick piece of wood or a line of light.'
examples:
- After the sauna, her face beamed with a bright pink color.
- His cheeks beamed red after his run in the hot sun.
