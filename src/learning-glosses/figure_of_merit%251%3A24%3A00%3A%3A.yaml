senseId: 'figure_of_merit%1:24:00::'
synsetId: 13843330-n
simpleMeaning: A number that shows how well a system, a thing it is made from, or a way to do things works.
scope: A number that shows how well a system, a thing it is made from, or a way to do things works; not
  a plain count of things and not a mark for quality alone.
examples:
- The figure of merit for the new engine was high.
- Engineers use a figure of merit to compare two designs.
