simpleMeaning: a loose coat with a hood, worn with a half mask as part of a dress-up party outfit
scope: A loose coat with a hood worn with a half mask for a party outfit; it is not the small block used
  in a game, and not the mask for the eyes on its own.
examples:
- She wore a domino over her dress at the masked party.
- His black domino covered his clothes, and the half mask covered the top of his face.
