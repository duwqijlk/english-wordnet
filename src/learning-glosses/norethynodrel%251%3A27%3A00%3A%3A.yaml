simpleMeaning: Taken by mouth in pills, this form of the body chemical progesterone stops pregnancy, keeps
  monthly bleeding in order, and treats unusual bleeding from the womb.
scope: This form of the body chemical progesterone comes in pills taken by mouth to stop pregnancy, to
  keep monthly bleeding in order, and to treat unusual bleeding from the womb.
examples:
- Her doctor gave her norethynodrel to keep her monthly bleeding in order.
- Norethynodrel treated her unusual bleeding from the womb.
