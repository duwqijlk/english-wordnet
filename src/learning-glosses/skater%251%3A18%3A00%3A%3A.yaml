simpleMeaning: a person who moves over ice or a smooth surface while wearing special boots with a blade
  or wheels
scope: This names the person who moves in this way, not the special boots they wear and not the act itself.
examples:
- The skater spun quickly across the ice.
- He is a skilled roller skater at the park.
