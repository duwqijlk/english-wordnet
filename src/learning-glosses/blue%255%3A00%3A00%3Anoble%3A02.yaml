simpleMeaning: Belonging to, or typical of, families of noble or upper-class rank.
scope: This describes noble birth or aristocratic style, not the color, the drug, the butterfly, or strict
  morals.
examples:
- She married into a blue-blooded family with a country estate.
- The club's blue-blooded members had little time for new money.
