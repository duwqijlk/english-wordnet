simpleMeaning: The soft body tissue of the heart, made to keep beating in a steady beat.
scope: The soft body tissue of the heart, made to keep beating in a steady beat; heart muscle is another
  name for this sense, not the muscle of the arm and not the heart's outer skin.
examples:
- The cardiac muscle beats without rest.
- Damage to the cardiac muscle weakens the heart.
