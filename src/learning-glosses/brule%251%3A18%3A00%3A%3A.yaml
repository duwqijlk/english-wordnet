simpleMeaning: A Siouan person, part of the Teton Sioux, now living on the Rosebud Reservation in southwest
  South Dakota and a second one by the Missouri River in central South Dakota.
scope: A member of a Siouan people, one part of the Teton Sioux, not a member of another Sioux group and
  not a person from a different tribe.
examples:
- The Brule live on reservations in South Dakota.
- He is a Brule from the Rosebud Reservation.
