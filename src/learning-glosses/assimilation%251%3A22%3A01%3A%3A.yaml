simpleMeaning: How the nourishing parts of food, once broken down in the gut, pass into the body.
scope: Also called absorption, how the nourishing parts of food, once broken down in the gut, pass into
  the body, not the fitting of one case to a general pattern in a child's mind, not the taking in of new
  ideas, and not the blending of peoples into one nation.
examples:
- Assimilation of nutrients begins once food leaves the stomach.
- Poor assimilation left him weak despite eating well.
