simpleMeaning: Taking pictures with rays other than the light we can see
scope: The kind of picture-taking that uses rays other than the light we can see, not the process of making
  one picture on a surface that reacts to such rays.
examples:
- Radiography lets doctors see bones without cutting the skin.
- The course in radiography taught her to take pictures with rays other than the light we can see.
