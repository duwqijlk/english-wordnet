simpleMeaning: A small house where a gatekeeper or gardener usually lives, at the entrance to the grounds
  of a large country house
scope: A small house at the gate of a large country house, not a hotel for travelers, not a rough small
  house for a short stay, and not the act of staying somewhere for a time.
examples:
- The gardener lived in the lodge by the main gate.
- We passed the old lodge at the entrance to the big house.
