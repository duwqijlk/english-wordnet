simpleMeaning: to do wrong against God or against what is right, by breaking a law of God or a rule of
  good conduct
scope: 'Also called sin: to break a law of God or a rule of right and wrong, not to go onto someone else''s
  land without leave and not the noun sense of such a wrong.'
examples:
- She felt she had trespassed when she lied to her friend.
- The priest warned them not to trespass against God's law.
