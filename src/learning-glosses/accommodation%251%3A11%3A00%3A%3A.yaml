simpleMeaning: Making a thing fit a new need, or a thing coming to fit where it is, by changing it to
  suit what is around it.
scope: Also called fitting; not the Piaget sense of changing the pictures in the mind, nor the eye's change
  of focus.
examples:
- The accommodation of the old hall to its new use took months.
- The accommodation of the rules to local needs made the work easier.
