simpleMeaning: Cloth gets a fancy trim when small folds are pressed into it, only to make it look nice
scope: A fancy trim made by pressing small folds into cloth, also called gauffer, not a plain edge of
  cloth and not a fold made for fit.
examples:
- The collar had a goffer pressed into its edge.
- She ironed a goffer along the hem of the dress.
