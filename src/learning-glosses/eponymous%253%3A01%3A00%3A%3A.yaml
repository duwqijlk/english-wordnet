senseId: 'eponymous%3:01:00::'
synsetId: 03048109-a
simpleMeaning: having or linked to the name of a person or thing from which the name comes
scope: This word describes a thing that has, or is linked to, the name it takes from a person or thing;
  it does not name the person or thing itself.
examples:
- The band's eponymous first album has the same name as the band.
- In the play, the eponymous hero Hamlet is the person the play is named for.
