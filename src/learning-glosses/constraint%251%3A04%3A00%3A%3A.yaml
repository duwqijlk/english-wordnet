simpleMeaning: the act of forcing people to do or think as you want, by threats or by force
scope: The act of forcing people to think or act as you want, by threats or by force, not a device that
  slows a thing and not the state of being held back.
examples:
- The new rules were a constraint on free speech.
- They lived under the constraint of strict laws.
