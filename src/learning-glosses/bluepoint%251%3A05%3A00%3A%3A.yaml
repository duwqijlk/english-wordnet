simpleMeaning: a small oyster that can be eaten, usually from the south shore of Long Island
scope: 'Also called blue point: a small oyster from the south shore of Long Island, not the wider bluepoint
  oyster now found all along the north-east coast and usually eaten raw.'
examples:
- The bluepoint on the half shell came from Long Island.
- We ordered a dozen bluepoint oysters at the shore restaurant.
