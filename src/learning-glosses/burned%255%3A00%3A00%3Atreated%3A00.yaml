simpleMeaning: Processed with intense heat that stays below the point where it melts or fuses.
scope: 'Means the same as burnt: a material processed by strong heat that stays short of melting, not
  something ruined by fire or food spoiled by overcooking.'
examples:
- Burned sienna has a deeper, warmer tone than raw sienna.
- The pigment was burned at high heat, though not enough to melt it.
