simpleMeaning: the small raised tip on the part of the body that makes milk
scope: 'Also called pap, nipple, and teat: the small raised tip on the part of the body that makes milk,
  not the whole milk-making part itself.'
examples:
- The newborn latched onto the tit to nurse.
- The tit is the small point at the centre of the milk-making part.
