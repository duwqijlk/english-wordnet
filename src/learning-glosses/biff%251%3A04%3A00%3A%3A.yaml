simpleMeaning: A hard blow from a boxer's fist.
scope: This sense is also called a punch, a poke, a lick, a slug, and a clout, for a hard blow from a
  boxer's fist, where a punch is a boxing hit with a closed hand, a poke is a boxing hit made with the
  fist, and a lick is a boxing hit with the fist.
examples:
- The biff caught him on the chin.
- Biffs fly fast in the ring.
