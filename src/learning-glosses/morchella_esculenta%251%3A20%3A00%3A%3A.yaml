simpleMeaning: A morel good to eat and much prized, with a round to long head marked by an uneven pattern
  of pits and ridges.
scope: This is a morel good to eat and much prized, with a round to long head marked by an uneven pattern
  of pits and ridges; common morel, sponge morel and sponge mushroom are other names for this sense, not
  a morel with a smooth head and not a morel that is not safe to eat.
examples:
- We fried the Morchella esculenta we had gathered that morning.
- Morchella esculenta is much prized by cooks.
