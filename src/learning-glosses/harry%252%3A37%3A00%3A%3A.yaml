simpleMeaning: to keep on annoying someone again and again over a long time
scope: To keep on annoying someone again and again over a long time; provoke, harass, plague, hassle and
  molest are other names for this sense, not to raid and damage a place in war.
examples:
- He is known to harry his staff when he is overworked.
- The children harried their mother with questions all day.
