senseId: 'endocrine_system%1:08:00::'
synsetId: 05337081-n
simpleMeaning: The set of tube-free parts of the body that make body chemicals which help to control how
  the body uses food and keeps itself going.
scope: The whole set of tube-free parts that make body chemicals to control how the body works, not one
  such part alone and not the chemicals themselves.
examples:
- The endocrine system helps control how her body uses food.
- When the endocrine system fails, the body cannot keep its balance.
