simpleMeaning: paper so thin that you can see through it, yet strong and light, kept most of all for making
  carbon copies
scope: Thin, strong paper you can see through, used for carbon copies, not the adjective sense of something
  weak or without weight.
examples:
- She typed the letter on flimsy so she could keep a carbon copy.
- The office kept a stack of flimsy for making copies.
