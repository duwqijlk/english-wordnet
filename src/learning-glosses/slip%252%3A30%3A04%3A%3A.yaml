simpleMeaning: to put something into a place quickly, quietly, or in a way that no one sees
scope: This is putting something in quickly or without being seen, not sliding or falling, and not a piece
  of paper or clothing.
examples:
- He slipped some money into the waiter's hand.
- She slipped the note into my pocket while no one was looking.
