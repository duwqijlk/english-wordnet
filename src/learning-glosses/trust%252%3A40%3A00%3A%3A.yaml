simpleMeaning: To give someone the responsibility of caring for or managing something for another person's
  benefit.
scope: This is about handing someone a duty or responsibility, not about believing that a person is honest.
examples:
- The lawyer was trusted with the family's savings.
- The board trusted the museum's collection to a seasoned curator.
