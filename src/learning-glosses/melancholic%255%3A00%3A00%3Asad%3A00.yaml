simpleMeaning: sad, or showing sadness, or making other people feel sad
scope: 'Also called melancholy: sad, showing sadness, or making others feel sad. It is not the noun sense
  that names a person who is often sad.'
examples:
- He gave a melancholic smile and looked out at the rain.
- The song has a slow, melancholic sound that made us all quiet.
