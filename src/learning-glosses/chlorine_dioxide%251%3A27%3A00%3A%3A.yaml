simpleMeaning: Paper, starch, soap or flour are made white, and water is cleaned, with this gas, ClO2,
  which can blow up.
scope: It is an explosive gas used chiefly to bleach paper, starch, soap or flour and to purify water.
examples:
- The chlorine dioxide bleached the paper white.
- Chlorine dioxide cleaned the water.
