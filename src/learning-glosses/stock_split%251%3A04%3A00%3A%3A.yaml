simpleMeaning: a company makes more shares for people to own, but the total value owned by the owners
  stays the same
scope: 'Also called split and split up: more shares are issued, but the total worth owned does not change,
  not a sale of new shares for new money and not a company closing.'
examples:
- The company announced a two-for-one stock split.
- After the stock split, each owner held twice as many shares but the same total worth.
