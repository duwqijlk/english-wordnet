simpleMeaning: a spin, usually of a ball in motion, that slows it down or turns it back
scope: A spin, usually of a ball in motion, that slows it down or turns it back, not a spin that drives
  the ball forward.
examples:
- Her backspin made the ball stop dead and roll back toward her.
- A good backspin on the shot kept the ball from running past the hole.
