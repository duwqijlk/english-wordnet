simpleMeaning: muscles that turn the shoulder blade and lift the ribs
scope: 'Also called the anterior serratus muscle, the serratus anterior, or the serratus magnus: muscles
  that turn the shoulder blade and lift the ribs; not the chest muscle that pulls the shoulder down and
  not a back muscle.'
examples:
- The musculus serratus anterior turns the shoulder blade as the arm rises.
- The musculus serratus anterior lifts the ribs when you breathe in.
