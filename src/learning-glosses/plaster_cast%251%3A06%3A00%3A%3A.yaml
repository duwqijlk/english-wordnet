simpleMeaning: Often made from a white powder mixed with water that sets hard, this firm cover holds a
  broken bone still while it heals.
scope: Also called cast and plaster bandage, it is the firm cover that holds a broken bone still while
  it heals.
examples:
- She signed her name on his plaster cast.
- The nurse cut the plaster cast off his leg.
