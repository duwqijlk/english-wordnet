simpleMeaning: to burn something a little, only on the outside, so its colour changes
scope: Also called blacken and sear, this is burning a thing a little on the outside; it is not a thing
  itself getting burned in strong heat, and not a plant disease that turns plant parts brown.
examples:
- The hot pan scorched the bread a little on one side.
- She scorched the shirt with an iron that was too hot.
