simpleMeaning: Every point on a map with the same number for a thing that can change sits on this line
scope: A line on a map joining points that share one number for a thing that can change, also called isarithm
  or isogram; not a line marking where a word is used and not a line marking how a sound is said.
examples:
- The isopleth on the rainfall map joined all the places with the same amount of rain.
- On the weather map, an isopleth linked the towns with the same temperature.
