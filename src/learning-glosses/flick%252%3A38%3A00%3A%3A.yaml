simpleMeaning: to make something move with a quick, light push of a finger or the hand
scope: This means making something move with a quick, light push, not taking something away with the hand
  and not a movie.
examples:
- He flicked the switch to turn on the light.
- She flicked the small ball across the table with one finger.
