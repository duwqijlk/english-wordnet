simpleMeaning: A piece of computer equipment that sits outside the main board holding the computer's brain.
scope: A piece of computer equipment that sits outside the main board holding the computer's brain; not
  a place at the edge of a town, and not the outer edge of a thing.
examples:
- Disk drives and printers are important peripherals.
- The shop sells peripherals such as keyboards and mice.
