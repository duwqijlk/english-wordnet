simpleMeaning: the act or result of distributing or extending something over a wide area of space.
scope: This is the act or result of extending over space, not a farm and not the action of scattering
  separate things.
examples:
- The spread of the city into the countryside worried local farmers.
- Satellite images showed the spread of the wildfire across the valley.
