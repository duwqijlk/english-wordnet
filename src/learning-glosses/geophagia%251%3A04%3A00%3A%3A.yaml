simpleMeaning: Some early peoples eat soil, clay or chalk, and at times people short of food or with a
  fixed habit of mind do too.
scope: This is the eating of soil, clay or chalk, also called geophagy.
examples:
- Geophagia was seen in some early peoples.
- Geophagia was seen in a child short of food.
