simpleMeaning: Long thin jaws mark the male of this large soft-bodied insect, whose young live in water
  and are often used as bait
scope: Also called a dobson fly or a dobsonfly, long thin jaws mark the male of this large soft-bodied
  insect, whose young live in water and are often used as bait, not the young itself.
examples:
- A dobson settled on the porch light.
- A dobson flew in through the open window.
