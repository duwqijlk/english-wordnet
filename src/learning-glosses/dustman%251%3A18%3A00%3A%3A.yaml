simpleMeaning: a male worker whose job is to take away rubbish and get rid of it
scope: 'Also called a garbage man and a garbageman: a male worker who takes away rubbish, not a woman
  who does the same job and not a cleaner who works inside a house.'
examples:
- The dustman came early and took the bins from the front of the house.
- Our dustman knows every street on his round by heart.
