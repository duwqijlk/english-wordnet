simpleMeaning: a tree from warm America, grown in the south of the United States, with whitish fruit tinged
  with pink
scope: A warm-American tree with whitish pink-tinged fruit; ilama tree is another name for this sense,
  not the fruit itself and not a custard apple tree.
examples:
- The ilama grew tall behind the house in Florida.
- Fruit from the ilama ripened in late summer.
