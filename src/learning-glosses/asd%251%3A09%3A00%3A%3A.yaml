simpleMeaning: A wide-ranging condition of the mind marked by its own ways of talking with others, taking
  in sense signals in their own way, keen interests, and repeated ways of acting.
scope: 'Also called autism, autism spectrum condition, and autism spectrum disorder: a wide-ranging condition
  of the mind shaping talk with others, taking in sense signals in their own way, keen interests, and
  repeated ways of acting.'
examples:
- Children with ASD may take in sounds and sights in their own way.
- His ASD means he has keen interests and likes set ways of doing things.
