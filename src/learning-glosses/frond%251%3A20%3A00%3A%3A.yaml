senseId: 'frond%1:20:00::'
synsetId: 13175289-n
simpleMeaning: a leaf that is made up of many smaller parts, as on a fern, a palm tree, or a cycad (a
  plant like a palm)
scope: This sense is one large leaf made of many small parts on a fern, palm, or cycad, not a branch and
  not a single small leaf.
examples:
- A long frond hung over the path from the palm tree.
- Each frond of the fern is made up of many tiny leaf parts.
