simpleMeaning: In rhetoric, the second part of a formal speech, in which the facts are set out
scope: The second part of a formal speech where facts are set out, not a story or message that tells what
  happened.
examples:
- In his speech, the narration came after the opening and set out the facts of the case.
- The teacher showed how the narration in a speech should be clear and in order.
