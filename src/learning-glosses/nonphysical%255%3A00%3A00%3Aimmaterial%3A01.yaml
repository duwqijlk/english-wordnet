simpleMeaning: You cannot touch it or see it, because it has no body and no true being
scope: Something with no body and no true being, that you cannot touch or see; intangible is another name
  for this sense, not a thing made of matter.
examples:
- The soul is a nonphysical thing that cannot be touched or seen.
- Some people believe in a nonphysical life after death.
