simpleMeaning: Mostly found in Black people, this is a blood problem present from birth, in which the
  red bits of the blood bend into the shape of a thin crescent moon.
scope: Doctors also call it crescent-cell anaemia, crescent-cell anemia, drepanocytic anaemia, drepanocytic
  anemia, sickle-cell anaemia, and sickle-cell anemia, and it is one of the blood problems a person is
  born with rather than one caught later in life.
examples:
- The baby was born with sickle-cell disease.
- Doctors see sickle-cell disease mostly in Black people.
