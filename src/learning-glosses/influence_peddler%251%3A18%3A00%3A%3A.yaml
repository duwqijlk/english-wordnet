simpleMeaning: For a fee, this person steps in with the people in charge to help someone in trouble, most
  often by unfair or unlawful means
scope: A person who steps in with the people in charge to help someone in trouble, for a fee, also called
  a fixer; not a lawyer and not an honest go-between.
examples:
- The mayor warned that an influence peddler was offering to fix parking fines for cash.
- He paid an influence peddler to get his brother out of jail.
