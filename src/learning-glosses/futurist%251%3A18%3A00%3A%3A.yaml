simpleMeaning: a person who says what will happen in the years ahead
scope: This is a person who says what life will be like in years to come, not a religion thinker who reads
  old holy writings, and not the art sense.
examples:
- The futurist said cities will one day grow food on tall buildings.
- As a futurist, he writes about how work will change in the next fifty years.
