simpleMeaning: Body material from the embryo's middle layer, made of collagen, fibre-making cells and
  fat cells; it supports organs, fills gaps between them and forms tendons and ligaments.
scope: This is the body's supporting and filling material, not muscle, nerve or the skin's outer layer.
examples:
- Connective tissue holds organs such as the kidneys in place.
- The surgeon cut through connective tissue to reach the bone.
