simpleMeaning: In microscopy (looking at very small things with a microscope), a dye or other coloring
  stuff used to make small parts easy to see
scope: A dye or coloring stuff used with a microscope to make tiny parts easy to see; not a mark of shame,
  and not the verb for coloring something or for leaving dirty marks on it.
examples:
- The scientist put a stain on the cells so they could be seen under the microscope.
- This stain turns the tiny parts dark blue.
