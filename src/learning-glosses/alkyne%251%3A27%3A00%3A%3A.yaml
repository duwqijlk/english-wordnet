simpleMeaning: With no colour and a readiness to catch fire, this gas joins metals with heat and builds
  carbon stuffs.
scope: Also called acetylene and ethyne, it is the name for the gas itself, whatever job it is put to.
examples:
- The welder lit the alkyne torch to join the broken gate.
- The lab used alkyne to build new carbon stuffs.
