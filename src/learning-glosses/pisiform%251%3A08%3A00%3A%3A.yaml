simpleMeaning: A small bone in the wrist that joins to one other wrist bone, and to no other
scope: Also called pisiform bone and os pisiforme, this small wrist bone joins to only one other wrist
  bone, unlike the wrist bones that join to several.
examples:
- The pisiform joins to only one other wrist bone.
- A fracture of the pisiform can make the wrist hurt.
