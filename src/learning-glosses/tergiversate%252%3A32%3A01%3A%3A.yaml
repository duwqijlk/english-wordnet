simpleMeaning: to speak in a vague way on purpose, so that others are misled or kept from the facts
scope: 'Also called equivocate, prevaricate, palter, and beat around the bush: speaking in a vague way
  on purpose to mislead, not answering straight or speaking plainly.'
examples:
- When asked about the cost, he tergiversated instead of giving a straight answer.
- She tergiversated for an hour rather than admit what had happened.
