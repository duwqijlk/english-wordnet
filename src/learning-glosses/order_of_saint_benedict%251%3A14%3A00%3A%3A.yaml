simpleMeaning: A group of Roman Catholic monks and nuns founded in the sixth century, known for their
  church services and for their study and writing
scope: This is a whole group of monks and nuns under one name, also called the Benedictine order, not
  a single house and not a lay group.
examples:
- The order of Saint Benedict runs schools and libraries in many lands.
- A monk of the order of Saint Benedict spends much of his day in prayer and study.
