simpleMeaning: Long-range flying weapons sent from far away are knocked down by this weapon, which is
  made to stop them while they are still on their way in.
scope: This flying weapon is also called antiballistic missile, and it is made to knock down long-range
  flying weapons sent from far away while they are still on their way in.
examples:
- The anti-ballistic missile rose to meet the long-range weapon sent from far away.
- The talks placed limits on how many anti-ballistic missiles each side could keep.
