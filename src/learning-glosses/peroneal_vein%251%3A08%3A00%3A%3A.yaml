simpleMeaning: blood vessels beside the arteries of the lower leg, starting at the heel and running up
  the back of the leg to join the blood vessels behind the knee
scope: 'Also called fibular vein and vena peroneus: blood vessels that run up the back of the leg from
  the heel, not the arteries beside them and not the blood vessels of the front of the leg.'
examples:
- The peroneal vein runs up the back of the leg.
- A peroneal vein joins the vessels behind the knee.
