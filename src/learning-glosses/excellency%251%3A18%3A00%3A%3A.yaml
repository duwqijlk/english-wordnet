senseId: 'excellency%1:18:00::'
synsetId: 10088735-n
simpleMeaning: A high title used when speaking to great officers of state, such as envoys or governors,
  most often with Your, His, or Her before it.
scope: This is a high title for great officers of state, not a name or a rank in itself.
examples:
- Your Excellency, the envoy has arrived.
- They addressed the governor as Her Excellency.
