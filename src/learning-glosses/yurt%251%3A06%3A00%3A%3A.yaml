simpleMeaning: a round domed home that stands on its own and can be moved, first used by wandering Mongol
  and Turkic peoples of central Asia, now cheap or short-term housing
scope: A round domed home that can be moved, not a house built to stay put and not a flat tent.
examples:
- The family put up their yurt in a day.
- Nomads still live in yurts on the steppe.
