simpleMeaning: a fault in a plan, an idea, or a legal document that makes it fail or makes it work less
  well
scope: This is a fault in a plan, an idea, or a legal document, not a weak part of a person's character,
  and not the act of making something less than perfect.
examples:
- A flaw in the plan caused the whole project to fail.
- Lawyers found a flaw in the legal document that made it work less well.
