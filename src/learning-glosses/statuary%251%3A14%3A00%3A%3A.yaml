simpleMeaning: figures of people or animals made as solid objects, taken together as a group
scope: A group of statues taken together as a whole; not the adjective sense of statuary, which means
  of, about, or fit for statues.
examples:
- The museum's statuary fills two large halls.
- Fine Greek statuary drew crowds to the new show.
