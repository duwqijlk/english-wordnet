senseId: 'ominousness%1:07:01::'
synsetId: 92423933-n
simpleMeaning: The quality of pointing to bad things to come, as a bad sign does, in a way that threatens.
scope: For something that gives sign of a coming ill, like an evil omen, and feels threatening.
examples:
- The ominousness of the dark sky made them hurry home.
- There was an ominousness in his warning that she could not shake off.
