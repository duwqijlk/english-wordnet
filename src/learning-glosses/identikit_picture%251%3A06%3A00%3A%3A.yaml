simpleMeaning: A face made from words told to the police, built up from clear sheets showing parts of
  faces that can be put together.
scope: This is a face made from words told to the police, built up from clear sheets showing parts of
  faces; Identikit is another name for it; not a photograph and not a drawing made from life.
examples:
- The police built an Identikit picture from the witness's words.
- The Identikit picture helped them find the man they sought.
