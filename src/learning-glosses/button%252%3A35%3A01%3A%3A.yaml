simpleMeaning: to put small round fasteners on a piece of clothing
scope: To add these fasteners to clothes; it is not to close clothes by using fasteners that are already
  there, and not the fastener itself as a noun.
examples:
- The maker buttons each coat by hand, sewing the fasteners on one by one.
- She learned to button a dress, adding six small fasteners down the back.
