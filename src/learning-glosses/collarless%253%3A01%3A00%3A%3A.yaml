simpleMeaning: having no part that goes around the neck, for a shirt, coat, or other clothing
scope: This describes a shirt, coat, or other clothing with no part around the neck, not the neck part
  itself when it is there.
examples:
- She wore a collarless jacket over her dress.
- He prefers collarless shirts in hot weather.
