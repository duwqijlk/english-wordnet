simpleMeaning: a hurt to the outside of the body that leaves the important parts inside the body unharmed
  and does not break any bones
scope: A hurt to the outside of the body, not a deep injury to the parts inside and not a broken bone.
examples:
- The soldier's flesh wound healed in a week.
- A flesh wound looks bad but leaves the bones safe.
