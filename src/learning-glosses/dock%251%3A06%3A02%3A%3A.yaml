simpleMeaning: A fenced-off place in a court of law where the person on trial sits
scope: The place in a court where the person on trial sits, not a platform for ships or trucks and not
  a part of an animal's tail.
examples:
- The prisoner sat in the dock as the judge read the charge.
- She stood in the dock and listened to the trial.
