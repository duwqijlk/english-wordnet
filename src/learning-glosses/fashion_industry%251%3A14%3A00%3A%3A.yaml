simpleMeaning: All the work of making and selling clothes in the latest style, done by many firms together
scope: 'Also called the fashion business, the apparel industry, the garment industry and the rag trade:
  all the work of making and selling clothes in the latest style, not one firm and not the clothes themselves.'
examples:
- The fashion industry employs millions of people around the world.
- New rules changed how the fashion industry makes its clothes.
