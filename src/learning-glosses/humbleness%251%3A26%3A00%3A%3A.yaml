senseId: 'humbleness%1:26:00::'
synsetId: 14459904-n
simpleMeaning: The state of being low in rank and of little importance
scope: The state of being low in rank and of little importance, also called unimportance; not a modest
  feeling, and not a wish to be humble.
examples:
- His humbleness in the company meant that no one asked him for his view.
- The humbleness of her post kept her out of the talks where the big choices were made.
