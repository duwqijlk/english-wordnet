simpleMeaning: a device, such as an ear ring, dark glasses or a microphone, that fastens by gripping tight
scope: A device, such as an ear ring, dark glasses or a microphone, that fastens by gripping tight; not
  a thing fixed with a screw and not a thing worn through a pierced ear.
examples:
- She wore clip-on earrings to the party.
- The clip-on microphone caught every word he said.
