simpleMeaning: Songs and tunes made by Black people in the United States; early kinds had a clear tune
  and a strong beat with choruses that came back again and again
scope: This is the tunes made by Black musicians in the United States, also called black music, and not
  the tunes of other peoples.
examples:
- African-American music filled the hall with tunes that had a strong beat.
- She studied African-American music and its early songs with choruses that came back again and again.
