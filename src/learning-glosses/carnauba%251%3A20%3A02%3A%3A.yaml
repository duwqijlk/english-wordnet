simpleMeaning: Floor waxes and polishes get their shine above all from this hard wax, yellowish to brownish,
  taken from the leaves of a palm tree
scope: Also called carnauba wax, this hard wax from palm leaves is used above all in floor waxes and polishes,
  not the palm tree it comes from.
examples:
- The floor shone after it was polished with carnauba.
- Carnauba gives a hard shine to the floor.
