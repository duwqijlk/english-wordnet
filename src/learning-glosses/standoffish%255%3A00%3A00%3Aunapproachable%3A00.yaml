simpleMeaning: not warm and not friendly in how you are with other people
scope: This describes a person who is not warm or friendly with others; it is not just being quiet or
  being alone.
examples:
- She seemed standoffish at the party and gave only short answers.
- He is warm with his family but standoffish with new people at work.
