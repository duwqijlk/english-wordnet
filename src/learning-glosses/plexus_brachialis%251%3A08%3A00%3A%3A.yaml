synsetId: 05513685-n
simpleMeaning: The arm and parts of the shoulder are served by a net of thin cords that carry signals,
  made from nerves of the neck and upper back.
scope: Also called the brachial plexus, it is set apart from other nets of nerves by the neck and upper
  back nerves that form it and the arm and shoulder it serves.
examples:
- The plexus brachialis runs from the neck to the arm.
- Signals reach the arm through the plexus brachialis.
