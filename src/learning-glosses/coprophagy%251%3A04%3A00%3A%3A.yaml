simpleMeaning: eating waste that leaves the body, which in a person is a sign of some kinds of madness
scope: This is eating waste that leaves the body, which in a person is a sign of some kinds of madness;
  coprophagia is another name for this sense, and it is not eating dirt or a normal way to feed.
examples:
- Coprophagy was seen in the animal, which kept eating its own waste.
- Doctors take coprophagy in a person as a sign of some kinds of madness.
