schema: oewn-learning-gloss-v2
senseId: 'ergative-absolutive_language%1:10:01::'
synsetId: 92460658-n
simpleMeaning: A kind of speech with a special case form, or where the thing acted on shares its form
  with the doer of an act with no thing acted on.
scope: A kind of speech that marks the doer and the thing acted on in this set way, also called ergative
  language; not a kind of speech that marks all doers the same and not a word list.
examples:
- In an ergative-absolutive language, the thing acted on and the doer of a one-part act share one form.
- The teacher showed how an ergative-absolutive language marks the doer of a two-part act in its own way.
