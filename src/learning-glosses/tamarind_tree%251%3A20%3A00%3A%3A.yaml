senseId: 'tamarind_tree%1:20:00::'
synsetId: 12521707-n
simpleMeaning: A long-lived tropical species that keeps its leaves all year, with feathery foliage, fragrant
  flowers, hard yellowish wood and long pods full of edible sour pulp.
scope: The whole plant, not the pods it produces or the tart pulp used in cooking.
examples:
- They planted a tamarind tree beside the well, and now it shades the whole yard.
- The tamarind tree in the schoolyard is older than the school itself.
