simpleMeaning: the way something is laid out in space, considered separately from the material it is made
  of
scope: This is arrangement apart from material, not the outline seen from outside and not a printed sheet
  to fill in.
examples:
- The sculptor spoke of form as something separate from the stone.
- Philosophers argued about whether form could exist apart from matter.
