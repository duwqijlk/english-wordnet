simpleMeaning: the amount that a small flat pan with a short handle, used for sweeping up dust, will hold
scope: This is the amount that the pan holds, not the pan itself, which is a small flat pan with a short
  handle used for sweeping up dust.
examples:
- She swept up a dustpan of broken glass from the kitchen floor.
- He carried three dustpans of dirt to the bin.
