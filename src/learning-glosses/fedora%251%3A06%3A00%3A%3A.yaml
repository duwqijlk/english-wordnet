simpleMeaning: A hat made of felt (a thick, soft cloth), with a fold pressed into the top
scope: This hat is also called a trilby; it is not a flat cap and not a hat with a wide, hard edge.
examples:
- He wore a brown fedora with his grey suit.
- The old man lifted his fedora as we walked past.
