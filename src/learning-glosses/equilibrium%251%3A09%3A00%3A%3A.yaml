simpleMeaning: the sense in the inner ear that tells a person which way the head is turned
scope: The sense in the inner ear that tells which way the head is turned; not a state of balance between
  things, and not a balance of forces in a chemical change.
examples:
- Damage to the ear upset her equilibrium.
- His equilibrium failed and he felt dizzy.
