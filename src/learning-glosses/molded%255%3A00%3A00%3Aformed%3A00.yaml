simpleMeaning: made to fit a shape by pressing soft stuff into a new shape with hard work, or as if that
  had been done
scope: Also called shaped and wrought; made to fit by pressing, not simply cut or carved.
examples:
- The molded steel plates fit the curve of the ship's hull.
- She wore a molded silver bracelet that hugged her wrist.
