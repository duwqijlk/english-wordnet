simpleMeaning: Chains of flowers hung in curves between two points to decorate a place.
scope: Chains of flowers hung in curves between two points to decorate a place, also called festoon; not
  a single round wreath and not lines of flags.
examples:
- Festoonery hung in curves across the hall for the wedding.
- The festoonery of fresh flowers brightened the street.
