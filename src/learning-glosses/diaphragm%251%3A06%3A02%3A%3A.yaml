simpleMeaning: a flexible, dome-shaped cup of rubber or plastic, put inside a woman over the opening of
  her womb, with something that kills sperm, to stop her having a baby
scope: 'Also called contraceptive diaphragm and pessary: this is a thing used to stop a woman having a
  baby. It is not the muscle that helps you breathe, not a part in a camera, and not a part that makes
  sound.'
examples:
- She fitted the diaphragm before sex and left it in for several hours afterwards.
- The nurse showed her how to clean and store her diaphragm.
