simpleMeaning: A payment or reward, above all from a government, for acts such as catching criminals,
  killing animals that hunt other animals, or joining the armed forces.
scope: A reward paid for a public act, also called a premium, and not a gift given out of kindness.
examples:
- The town offered a bounty for the capture of the thief.
- A bounty was paid for every wolf killed.
