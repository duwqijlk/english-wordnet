simpleMeaning: showing good judgment and common sense when you deal with real, everyday matters
scope: 'Also called wise, and another name for it is heady: it means showing good judgment and common
  sense in real matters, not just knowing many facts.'
examples:
- She made a judicious choice and saved most of her money.
- A judicious use of time helped him finish the work well.
