simpleMeaning: a tree of the east and middle of North America whose leaves have five parts and turn a
  deep red and yellow in the fall
scope: This is a tree of the east and middle of North America whose leaves turn deep red and yellow in
  the fall; red maple and swamp maple are other names for this sense, not a sugar maple and not a silver
  maple.
examples:
- The scarlet maple in the yard turned deep red in the fall.
- We planted a scarlet maple because its leaves glow red and yellow each autumn.
