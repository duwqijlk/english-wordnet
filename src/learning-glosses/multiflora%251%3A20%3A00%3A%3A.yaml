simpleMeaning: a fast-growing rose with bunches of many small flowers, used to make hedges and as stock
  for grafting
scope: 'Also called a baby rose or a multiflora rose: a fast-growing rose with bunches of many small flowers,
  used to make hedges and as stock for grafting; not a single large rose and not a wild rose.'
examples:
- Multiflora makes a thick hedge.
- The multiflora bore bunches of many small flowers.
