simpleMeaning: to do with the back teeth that grind food in the mouth of a mammal
scope: To do with the back teeth that grind food; not a tooth itself, and not to do with a chemical liquid.
examples:
- Molar teeth grind food at the back of the mouth.
- The molar teeth of the animal were worn down.
