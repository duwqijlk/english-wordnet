simpleMeaning: a court paper that gives the reasons for what the court has decided
scope: A court paper giving the reasons for a ruling; opinion and judgment are other names for this sense,
  and it is not the act of judging itself or a court order that settles a case.
examples:
- The judgement was read aloud in court.
- Lawyers studied the judgement for the reasons behind the ruling.
