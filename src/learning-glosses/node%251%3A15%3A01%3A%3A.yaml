simpleMeaning: In physics, the point in a system that moves again and again where there is the least movement
scope: In physics, this is the point of least movement in a system that moves again and again, not a lump
  on the body and not a point where a path in space crosses a flat surface.
examples:
- At the node, the string hardly moves at all.
- The wave has a node in the middle, where the movement is smallest.
