simpleMeaning: Blood tubes that run back from the outer folds at the opening of a woman's body to the
  deep blood tube near the hips
scope: Blood tubes that run back from the outer folds at the opening of a woman's body to the deep blood
  tube near the hips; venae labiales posteriores is another name for this sense, not blood tubes in the
  leg and not blood tubes near the heart.
examples:
- The posterior labial veins drain blood from the outer folds.
- Damage to the posterior labial veins can cause swelling.
