simpleMeaning: a hand tool like a short thick stick with a round end, used to crush and mix things in
  a mortar (a strong deep bowl)
scope: A hand tool for crushing in a small bowl, not the large machine with a heavy bar and not the act
  of crushing.
examples:
- She used a pestle to grind the spices in the mortar.
- He picked up the pestle and mixed the paste.
