simpleMeaning: A liquid that smells very bad and gives off fumes, with no colour, that can blow up and
  harm the body.
scope: It is a colourless liquid that blows up easily and harms the body, also called hydrazoic acid and
  hydrogen azide.
examples:
- Even a drop of azoimide gave off a foul smell.
- They handled the azoimide with great care because it is poisonous.
