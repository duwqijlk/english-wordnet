simpleMeaning: a tasty mixture or liquid that small pieces of food are put into before they are eaten
scope: This is the tasty food itself that other food is put into, not the exercise on two bars and not
  the act of putting something briefly into a liquid.
examples:
- She served the chips with a warm cheese dip.
- The vegetable dip was made with yogurt and herbs.
