senseId: 'pause%1:28:00::'
synsetId: 15295994-n
simpleMeaning: A span of time when something stops happening for a while.
scope: Another name for this sense is break; it names the interval itself, not the verb for stopping briefly
  or the state of being inactive.
examples:
- After a long pause, she went on with her story.
- There was an awkward pause before anyone answered.
