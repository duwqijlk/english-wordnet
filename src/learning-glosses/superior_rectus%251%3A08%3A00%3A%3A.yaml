simpleMeaning: The eye muscle whose pull turns the eyeball up and toward the middle.
scope: The eye muscle that turns the eyeball up and toward the middle; also called rectus superior and
  superior rectus muscle; not a muscle that turns the eye down and not a muscle that moves the eye sideways.
examples:
- The superior rectus lifts the eyeball when you look up.
- Damage to the superior rectus makes it hard to look upward.
