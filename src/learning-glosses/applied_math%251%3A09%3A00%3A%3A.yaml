simpleMeaning: the parts of number work that are used to study the real world of things, living things,
  and how people live together
scope: 'Also called applied mathematics: the use of number work to learn about the physical world, living
  things, and human life, not number work studied on its own.'
examples:
- She took applied math to learn how numbers help in physics.
- The applied math course covered models of population growth.
