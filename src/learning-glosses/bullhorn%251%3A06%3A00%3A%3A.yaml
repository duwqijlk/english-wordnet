simpleMeaning: a thing you can carry and speak into that makes your voice loud for people far away
scope: A speaker you carry and speak into so people far away can hear you, not a fixed speaker set up
  in a building.
examples:
- The police officer used a bullhorn to speak to the crowd.
- She lifted the bullhorn and told everyone to move back.
