simpleMeaning: An amino acid found in the central nervous system, which slows down nerve signals
scope: 'Also called gamma aminobutyric acid: an amino acid found in the central nervous system, which
  slows down nerve signals, to be told apart from other amino acids and from nerve chemicals that speed
  signals up.'
examples:
- GABA slows down nerve signals in the brain.
- The brain uses GABA to calm nerve activity.
