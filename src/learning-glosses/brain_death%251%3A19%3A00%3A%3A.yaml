simpleMeaning: No longer breathing, with no quick body answers and no awareness, though parts of the body
  can still be taken out for another person before the heart stops.
scope: Also called cerebral death, this is the state in which breathing, quick body answers, and awareness
  are all gone, while the heart may still beat.
examples:
- Brain death had come, though his heart still beat.
- After brain death, parts of the body can be taken out for another person.
