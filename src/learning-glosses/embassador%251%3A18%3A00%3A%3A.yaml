simpleMeaning: the highest-ranking person sent by one country to speak and act for it in another country
scope: 'Also called ambassador: the highest-ranking person sent by one country to speak and act for it
  in another country, not a lower-ranking diplomat and not a messenger sent by a business.'
examples:
- The embassador presented his papers to the queen.
- She was named embassador to France last year.
