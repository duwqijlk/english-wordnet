simpleMeaning: a false charge of wrongdoing, or a spiteful twisting of what someone said or did
scope: A false charge of wrongdoing, or a spiteful twisting of what someone said or did; calumny, defamation,
  calumniation, hatchet job and traducement are other names for this sense, not a true charge and not
  fair criticism.
examples:
- The obloquy heaped on the writer was based on a false charge.
- She answered the obloquy with proof that her words had been twisted.
