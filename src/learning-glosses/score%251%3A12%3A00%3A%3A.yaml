simpleMeaning: Anger over a wrong, strong enough that a person feels owed payback.
scope: This is a personal grievance calling for payback, not the points in a contest and not an unpaid
  bill at a bar.
examples:
- The two families had a score to settle that went back decades.
- He felt he had a score to settle after the vote.
