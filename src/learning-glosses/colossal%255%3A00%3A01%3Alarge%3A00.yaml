simpleMeaning: so big, strong, or wide in reach that it fills people with wonder
scope: A thing so huge or powerful that it fills people with wonder, not just large in an ordinary way.
examples:
- The colossal ruins of the old temple filled them with awe.
- A colossal storm swept across the coast.
