simpleMeaning: in the way of life, art and thought of old Greece and Rome
scope: Done in the style of old Greece and Rome, not just in any old or well-known style.
examples:
- The hall was classically built, with tall stone columns like those in old Rome.
- The statue has a classically shaped body, like art from old Greece.
