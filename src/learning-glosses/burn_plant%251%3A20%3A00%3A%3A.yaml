simpleMeaning: A very short-stemmed plant whose thick leaves hold soothing jelly-like sap and gain spiny
  edges with age; native to the Mediterranean, widely grown in the tropics and as a houseplant.
scope: The soothing succulent grown as a houseplant, not a plant that causes burns and not a burn remedy
  you buy.
examples:
- She kept a burn plant on the kitchen sill for small scalds.
- The burn plant's thick leaves ooze a clear gel when cut.
