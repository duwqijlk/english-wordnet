simpleMeaning: A mix of a mercury drug and water with lime in it, put on sores from syphilis, an illness
  spread by sex.
scope: A mix of a mercury drug and lime water put on sores from syphilis; black lotion is another name
  for this sense, not a wash for ordinary cuts and not a skin cream.
examples:
- The doctor put blackwash on the sore.
- Blackwash was used on syphilitic sores.
