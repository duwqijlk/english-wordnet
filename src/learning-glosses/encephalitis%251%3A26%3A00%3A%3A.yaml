simpleMeaning: A swelling of the brain, usually from a virus, bringing headache, neck pain, sleepiness,
  sickness, and fever; doctors no longer call it phrenitis
scope: 'Also called cephalitis and phrenitis: a swelling of the brain, usually from a virus, not a swelling
  of the lining round the brain.'
examples:
- The child was kept in hospital with encephalitis.
- Encephalitis left him drowsy for days.
