simpleMeaning: In Hinduism, one of a people living in Bangladesh and West Bengal, most of them Hindus.
scope: One of a people of Bangladesh and West Bengal, in Hinduism, set apart from the tongue of the same
  name by being a person, not a way of speaking.
examples:
- He is a Bengali from West Bengal.
- The Bengali community gathered for the festival.
