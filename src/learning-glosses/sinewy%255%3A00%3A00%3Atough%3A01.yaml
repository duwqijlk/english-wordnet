simpleMeaning: Of meat, full of tough cords that run through it, and above all impossible to chew
scope: Of meat full of tough cords, above all impossible to chew; stringy is another name for this sense,
  not meat that is merely tough and not the sense of a body made of tendons.
examples:
- The sinewy steak was so hard to chew that he left half of it.
- This cut is sinewy, full of cords that run through the meat.
