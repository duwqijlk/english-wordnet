senseId: 'unregenerate%3:00:01::'
synsetId: 02334687-a
simpleMeaning: Refusing to give in, and holding on to that refusal no matter what.
scope: 'Also called stubborn and obstinate: refusing to give in no matter what, not a person who changes
  their mind easily and not a person who is merely slow to decide.'
examples:
- He stayed unregenerate, refusing to give in even after the long talks.
- The unregenerate old man would not change his mind.
