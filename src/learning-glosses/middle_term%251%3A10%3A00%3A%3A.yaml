senseId: 'middle_term%1:10:00::'
synsetId: 06767683-n
simpleMeaning: Two starting points of a chain of reasoning share one word or phrase, and the last point
  leaves it out
scope: The word shared by both starting points of a chain of reasoning, not the word that shows up in
  the last point.
examples:
- The middle term of the syllogism was 'animal', found in both starting points but not in the last point.
- 'She spotted the middle term at once: the word that joined the two starting points.'
