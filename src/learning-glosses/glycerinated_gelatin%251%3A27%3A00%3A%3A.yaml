simpleMeaning: A soft mix of a substance that sets firm when cool, a sweet thick liquid and water, used
  as a base for creams and solid medicines put in the body
scope: A soft mix used as a base for creams and solid medicines, not a food jelly and not a drink.
examples:
- The chemist spread glycerinated gelatin as a base for the ointment.
- Glycerinated gelatin can carry medicine in a suppository.
