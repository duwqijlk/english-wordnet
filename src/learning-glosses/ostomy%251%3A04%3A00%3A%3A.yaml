simpleMeaning: So waste can leave the body, an operation makes a new opening for it to pass through.
scope: This operation makes a new opening in the body so waste can leave it, not one of the openings the
  body already has.
examples:
- After the ostomy, waste left the body through the new opening.
- The ostomy was done so waste could leave the body.
