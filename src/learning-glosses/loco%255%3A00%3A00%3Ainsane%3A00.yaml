simpleMeaning: A joking word, used in everyday talk, for a mind that has lost its normal working.
scope: Also called cracked, nuts, buggy, bats, crackers, daft, nutty, dotty, loopy, fruity, balmy, batty,
  wacky, bonkers, haywire, loony, barmy, and kooky, a joking word, used in everyday talk, for a mind that
  has lost its normal working.
examples:
- After the long night, he felt quite loco.
- He went a little loco after days without sleep.
