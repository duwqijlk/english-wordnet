simpleMeaning: To spread over a thing a hard, shiny coat of varnish made from lac, the sticky stuff left
  by small insects.
scope: Also called shellack, this is the act of coating a thing with shellac, not the lac itself and not
  the thin varnish made from it.
examples:
- He decided to shellac the old table.
- They shellacked the wooden floor.
