simpleMeaning: a unit used by pharmacists when weighing, equal to twelve troy ounces.
scope: A pharmacist's weight of twelve troy ounces, not the everyday sixteen-ounce pound or the pound
  used to measure force.
examples:
- The old recipe lists the medicine in pounds of apothecary weight.
- The pharmacist weighed the dried roots in pounds on the old apothecary scale.
