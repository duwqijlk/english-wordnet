simpleMeaning: A thin skin that is one of the hard layers that make up bone.
scope: A thin skin that is one of the hard layers that make up bone, not the thin gill plates under a
  mushroom cap and not the outer skin of a bone.
examples:
- Each lamella is a thin layer of bone.
- The lamellae of the bone were seen under the microscope.
