simpleMeaning: A dish made by mashing dried seeds that were cooked, then frying them again in pig fat
  with spices.
scope: It is also called frijoles refritos, a dish of dried seeds mashed and cooked again in pig fat with
  spices.
examples:
- They asked for more refried beans with the meal.
- The refried beans were soft, mashed, and well seasoned.
