simpleMeaning: Sickness from eating grain foods spoiled by a fungus, bringing thirst, loose stools, vomiting,
  cramps and an uneven heartbeat, and in bad cases fits and limbs that rot.
scope: This is poisoning from grain that a fungus has spoiled, not food poisoning from bacteria, not the
  fungus itself, and not a single bout of stomach upset.
examples:
- The villagers came down with ergotism after a damp summer left the rye mouldy.
- In the Middle Ages, outbreaks of ergotism were sometimes blamed on curses.
