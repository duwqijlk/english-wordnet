synsetId: 03428629-n
simpleMeaning: A ring used to close a join tightly and stop leaks, around a moving part in a machine (a
  piston) or where two pipes join
scope: This is a ring that closes a join in a machine or between pipes and stops leaks; it is not glue
  or tape used to close a gap.
examples:
- The worker replaced the old gasket between the two pipes.
- A worn gasket let oil leak out of the engine.
