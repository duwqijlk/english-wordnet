simpleMeaning: A big fungus with pale scales on its cap and bits of its thin cover still hanging from
  the cap, with a thick hard stalk
scope: One big fungus with pale scales on its cap and a thick hard stalk, beside other fungi with scaly
  caps and other fungi with thick stalks, known by bits of its thin cover still hanging from its cap.
examples:
- We found a Pholiota destruens with pale scales on its cap.
- The Pholiota destruens had a thick hard stalk and bits of its cover on the cap.
