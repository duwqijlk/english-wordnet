simpleMeaning: white or pink flowers grow on a weakly climbing European plant that lives for years; in
  North America it has settled in and spreads fast as a weed
scope: Also called field bindweed; a weakly climbing European plant now wild in North America, not the
  garden climber grown for bright flowers, and not the common Eurasian and American climber with pink
  flowers.
examples:
- The wild morning-glory climbs weakly over the fence.
- Wild morning-glory has spread through the field as a weed.
