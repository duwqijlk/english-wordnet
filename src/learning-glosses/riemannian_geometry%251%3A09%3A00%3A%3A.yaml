scope: In mathematics, a kind of shape study, not flat like Euclid's, that treats space as round like
  a ball and a straight path as a big ring round it, also called elliptic geometry, not flat shape study
  and not the study of numbers.
examples:
- Riemannian geometry treats space as round like a ball.
- In Riemannian geometry, a straight path is a great circle.
