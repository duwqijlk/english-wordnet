simpleMeaning: when the edges of a thing cannot be made out, so the whole thing looks blurred
scope: A blurred look with no clear edges, not a gentle manner and not mild weather.
examples:
- The softness of the photo made the faces hard to pick out.
- There was a softness to the hills in the morning mist, with no sharp lines.
