simpleMeaning: In one class, at set times, a teacher takes the register and deals with school business
  while the pupils of one year group, or part of one, meet there
scope: A class where the pupils of one year group meet with their teacher at set times, also called a
  homeroom; not a room where pupils study one subject, and not the school office.
examples:
- Our home room meets first thing every morning.
- The home room teacher handed out the permission slips.
