simpleMeaning: A metal implement with two prongs that gives a fixed tone when struck, used to tune musical
  instruments.
scope: Among tools for setting musical instruments in tune, this metal one with two points gives one note
  that never changes when hit.
examples:
- The tuning fork gave one note that never changed when it was struck.
- A tuning fork was struck to set a musical instrument in tune.
