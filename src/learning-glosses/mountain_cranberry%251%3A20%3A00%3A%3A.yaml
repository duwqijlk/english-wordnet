simpleMeaning: A low bush with green leaves all year, from the cool far north of Europe, Asia, and America,
  that bears red berries you can eat.
scope: This is the low northern bush with red berries you can eat, also called cowberry, foxberry, lingberry,
  lingenberry, or lingonberry — not taller berry bushes or bushes with berries you cannot eat.
examples:
- Mountain cranberries grow low on the hillside.
- She picked mountain cranberries for jam.
