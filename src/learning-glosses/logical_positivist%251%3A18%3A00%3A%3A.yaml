simpleMeaning: A person who says a claim means nothing unless it can be checked by what is seen or measured
scope: A person who holds that a claim means nothing unless it can be checked in the world; not someone
  who merely doubts claims and not a scientist.
examples:
- As a logical positivist, she held that claims about the unseen mean nothing.
- The logical positivist argued that only statements that can be tested have meaning.
