simpleMeaning: a large deer that lives in the north, with very big, wide, flat antlers on the male, known
  in Europe by this name and as a moose in North America
scope: A large northern deer with wide, flat antlers on the male, called elk in Europe and moose in North
  America, not the large North American deer with large antlers that branch in many places and not the
  common deer of Europe and Asia.
examples:
- An elk stood at the edge of the northern forest.
- The male elk had huge, flat antlers.
