simpleMeaning: Wetting the front of the eyeball and keeping it smooth is the work of this salty water
  from the tear glands.
scope: Also called lachrymal secretion, this salty water from the tear glands wets the front of the eyeball
  and keeps it smooth.
examples:
- The front of the eyeball was wet with lacrimal secretion.
- A lacrimal secretion spread over the front of the eyeball.
