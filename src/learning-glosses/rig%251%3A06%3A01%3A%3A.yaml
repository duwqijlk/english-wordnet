simpleMeaning: the set of tall poles, crossbars, sails, and other such parts put up on a ship
scope: The masts, spars, and sails set up on a ship, not a truck, not a horse-drawn vehicle, and not a
  trick or a swindle.
examples:
- The old sailing ship had a tall rig of masts and sails.
- Sailors climbed up to repair the rig after the storm.
