simpleMeaning: A political theory that seeks to abolish the state, capitalism, wages and private property,
  respects personal belongings, and favours common ownership of production, direct democracy, voluntary
  associations and workers' councils.
scope: 'Another name for anarcho-communism: the anarchist theory that wants the state and capitalism abolished
  and production held in common; not anarcho-syndicalism, and not democratic socialism.'
examples:
- Kropotkin argued that anarchist communism could replace both the state and private ownership of industry.
- The group split over whether anarchist communism or collectivism should guide the movement.
