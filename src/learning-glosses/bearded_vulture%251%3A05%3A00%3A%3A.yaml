simpleMeaning: The biggest hunting bird of Europe and Asia, with black feathers hanging around its beak
scope: The biggest hunting bird of Europe and Asia, with black feathers around its beak, also called lammergeier
  and lammergeyer, not an eagle and not a small falcon.
examples:
- The bearded vulture soared over the high cliffs, the largest of its kind in Eurasia.
- You can tell a bearded vulture by the black feathers hanging around its bill.
