simpleMeaning: In living things, a move from a more complex form to a simpler one.
scope: A living form passing to a simpler shape, not a loss of power or quality, and not a low state of
  mind or morals.
examples:
- Degeneration left the cave fish without eyes.
- The degeneration of the organ made it simpler in form.
