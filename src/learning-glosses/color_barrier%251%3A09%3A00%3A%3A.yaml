simpleMeaning: A block that stops Black people from taking part in jobs and other parts of life shared
  with white people
scope: A block that stops Black people from taking part in shared work and social life, not a wall and
  not a rule aimed at one single person.
examples:
- The color barrier kept Black families out of the neighbourhood pool.
- He spoke out against the color barrier in hiring.
