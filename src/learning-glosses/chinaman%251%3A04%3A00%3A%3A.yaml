simpleMeaning: In cricket, a ball sent by a left-handed bowler to a right-handed batsman, which turns
  from off to leg.
scope: In cricket, this is a ball sent by a left-handed bowler to a right-handed batsman, which turns
  from off to leg; it is not the slur for a man of Chinese descent and not a straight ball.
examples:
- The Chinaman turned sharply from off to leg and beat the bat.
- He bowled a Chinaman that spun away from the right-handed batsman.
