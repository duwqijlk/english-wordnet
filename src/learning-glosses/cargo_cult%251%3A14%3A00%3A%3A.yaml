simpleMeaning: In Melanesia, members of millenarian cults who expected salvation as wealth, called cargo,
  brought by westerners; some treated westerners on first contact, especially missionaries, as divine.
scope: This is the Melanesian movement that expected goods from westerners, not the general religious
  sense of a cult awaiting salvation.
examples:
- The cargo cult built a wooden runway, hoping goods would arrive from the sky.
- Anthropologists described how the cargo cult blended traditional beliefs with new objects.
