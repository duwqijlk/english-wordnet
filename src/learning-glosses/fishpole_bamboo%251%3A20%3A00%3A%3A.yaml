simpleMeaning: A small cane plant of south-east China, with thin stems that bend when young
scope: This is a small cane plant of south-east China with thin stems that bend when young; gosan-chiku
  and hotei-chiku are other names for this sense, not a tall cane and not a hard-wood tree.
examples:
- Fishpole bamboo grew along the stream.
- The fishpole bamboo bent in the wind.
