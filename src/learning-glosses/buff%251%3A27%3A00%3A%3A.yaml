simpleMeaning: a soft, thick leather with no dye on it, made from the skins of oxen or similar large animals
scope: A soft, thick, undyed leather; not a tool for polishing, and not the yellowish-beige colour.
examples:
- The gloves were made of buff, soft and thick.
- The saddle was covered in buff, soft and thick.
