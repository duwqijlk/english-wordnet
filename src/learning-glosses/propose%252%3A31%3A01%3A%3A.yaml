simpleMeaning: To plan to do something, or to have it in mind to do it
scope: To plan or mean to do something, not to put an idea before people for them to judge and not to
  declare a plan.
examples:
- I propose to leave at noon and get there by one.
- She proposed to finish the job by Friday.
