simpleMeaning: a small meat-eating animal of the north half of the earth, with white fur in winter; it
  is in the same family as a weasel
scope: The animal itself, with white fur in winter; not the white fur of this animal when it is used to
  make clothes.
examples:
- An ermine ran across the snow in its white winter coat.
- In winter, the ermine is hard to see against the snow.
