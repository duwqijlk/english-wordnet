simpleMeaning: A long-lived vine of dry parts of central and south-western America and Mexico, bearing
  small hard green fruit with marks of different colours that cannot be eaten.
scope: 'Also called buffalo gourd, calabazilla, prairie gourd, prairie gourd vine, wild pumpkin and Missouri
  gourd: a long-lived vine of dry country bearing small hard green fruit that cannot be eaten, distinct
  from vines bearing fruit people eat.'
examples:
- Cucurbita foetidissima grows wild in the dry lands of the south-west.
- The small hard fruit of Cucurbita foetidissima is not fit to eat.
