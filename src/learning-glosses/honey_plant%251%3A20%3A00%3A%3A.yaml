simpleMeaning: Bees get the sweet juice they need from this growing thing, and turn it into the food they
  store
scope: This is a plant bees visit for the sweet juice they turn into honey, not a plant grown for its
  fruit or leaves; it is not the honey itself.
examples:
- Lavender is a honey plant that bees love.
- The farmer grew honey plants to help his bees.
