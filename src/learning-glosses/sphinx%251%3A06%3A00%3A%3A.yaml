simpleMeaning: A great stone figure made by the old Egyptians, with the body of a lion and the head of
  a man
scope: A great stone lion-man made by the old Egyptians, not a person who speaks in riddles and not a
  mere statue of a lion.
examples:
- The sphinx stands guard before the great pyramid.
- Tourists gazed up at the sphinx with its lion body and human head.
