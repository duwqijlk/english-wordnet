simpleMeaning: A short piece in a newspaper about one particular man, woman or group.
scope: It is not a private letter or a long news report; it is only a short newspaper item about a particular
  man, woman or group.
examples:
- The editor asked him to write a personal about the new coach.
- The paper printed a short personal about the village's oldest resident.
