simpleMeaning: A juicy, sharp, scarlet fruit often used in jellies or preserves grows on a thorny tree
  of the southern United States.
scope: 'Summer haw is another name for it: it is a thorny tree of the southern United States bearing a
  juicy, sharp, scarlet fruit often used in jellies or preserves.'
examples:
- The mayhaw bore scarlet fruit that we made into jelly.
- Mayhaws grow on a thorny tree of the southern United States.
