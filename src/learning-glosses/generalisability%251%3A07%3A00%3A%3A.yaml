senseId: 'generalisability%1:07:00::'
synsetId: 04771667-n
simpleMeaning: How widely something fits or works for many people or cases, not just one
scope: 'Also called generalizability and generality: how widely something fits or works, not how true
  it is in one case and not how useful it is.'
examples:
- The generalisability of the study was limited by its small sample.
- Critics questioned the generalisability of the findings to other countries.
