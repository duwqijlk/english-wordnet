senseId: 'immobilise%2:30:01::'
synsetId: 00270309-v
simpleMeaning: To make it against the rules for money or goods to be changed into cash or spent
scope: 'Also called block or freeze, and spelled immobilize: to forbid money or goods from being changed
  or used, not the sense of holding money back as a reserve.'
examples:
- The government moved to immobilise the funds of the hostile regime.
- They immobilised his assets while the case was heard.
