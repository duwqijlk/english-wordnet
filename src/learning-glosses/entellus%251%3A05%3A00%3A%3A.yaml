simpleMeaning: A langur, a kind of monkey, of southern Asia that people in India hold holy.
scope: 'Also called a hanuman: a monkey of southern Asia that people in India hold holy, not any monkey
  and not a monkey kept only in zoos.'
examples:
- The entellus sat in the temple yard in India.
- People in India hold the entellus holy.
