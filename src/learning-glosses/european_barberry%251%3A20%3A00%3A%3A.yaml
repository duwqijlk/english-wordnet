simpleMeaning: An upright bush of Europe that loses its leaves each year, now growing wild in many parts
  of the United States, with bunches of juicy berries.
scope: An upright European bush that loses its leaves each year, also called common barberry and Berberis
  vulgaris; it now grows wild in many parts of the United States and bears bunches of juicy berries.
examples:
- European barberry grows along the hedge with bunches of juicy berries.
- The European barberry by the wall loses its leaves each autumn.
