simpleMeaning: to put a small group of atoms, the butyl group, into a chemical made by joining parts together
scope: To put a chemical group into a chemical made by joining parts together, not to take a group out
  and not to mix two chemicals together.
examples:
- The chemist will butylate the compound in the next step.
- They butylate the compound in the lab.
