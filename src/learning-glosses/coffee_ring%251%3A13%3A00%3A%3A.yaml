simpleMeaning: A round cake with fruit or nuts in it, often topped with icing.
scope: This is a round cake with fruit or nuts in it, often topped with icing; not a plain round cake
  and not the mark a cup leaves on a table.
examples:
- She cut a slice of coffee ring for breakfast.
- The coffee ring was studded with nuts and fruit.
