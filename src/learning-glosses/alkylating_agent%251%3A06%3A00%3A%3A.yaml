simpleMeaning: a drug used to treat some kinds of cancer by fixing a small chemical group onto DNA, the
  stuff in a cell that carries its instructions
scope: A cancer drug that works on DNA, not a drug that kills germs and not a treatment that uses rays.
examples:
- The doctor gave her an alkylating agent to treat the cancer.
- This alkylating agent works by joining a small chemical group to the DNA of the cancer cells.
