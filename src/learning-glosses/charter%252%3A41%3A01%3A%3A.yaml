simpleMeaning: to take and use goods or services that belong to someone else, paying for them under a
  set deal
scope: To hold goods or services under a pay-to-use deal, also called hire, rent and lease; not the noun
  deal to hire transport and not giving a group its official rights.
examples:
- The company chartered cleaning services for a month.
- She chartered office space for a month.
