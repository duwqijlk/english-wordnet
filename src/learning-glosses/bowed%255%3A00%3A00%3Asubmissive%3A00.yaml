senseId: bowed%5:00:00:submissive:00
synsetId: 00792947-s
simpleMeaning: acting in a way that shows too much respect for others and is too ready to obey them
scope: This is about a person who shows too much respect and is too ready to obey. It is not about a curved
  shape, not about legs that curve out at the knees, and not about a string instrument played with a bow.
examples:
- The bowed clerk nodded at every word his boss said and never disagreed.
- She spoke in a bowed way, always ready to obey people above her.
