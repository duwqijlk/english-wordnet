simpleMeaning: the part of a church where the singers sit, between the holy place at the front and the
  main part where people sit
scope: The part of a church where singers sit, not the group of singers themselves and not the whole church
  building.
examples:
- The singers took their places in the choir.
- The choir of the old church was rebuilt in stone.
