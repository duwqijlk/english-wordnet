  year and grows low in Europe, the British Isles, and North Africa
scope: 'Also called ground pine: a low plant that lives one year, not a pine tree and not a tall shrub.'
examples:
- Yellow bugle grows low along the path in spring.
- The yellow bugle in the meadow has gold flowers dotted with red.
