senseId: 'res_gestae%1:10:00::'
synsetId: 06748010-n
simpleMeaning: In law, a rule that words said close to an event count as part of it, so telling them in
  court does not break the rule against second-hand talk.
scope: In law, a rule that words said close to an event count as part of it, so telling them in court
  does not break the rule against second-hand talk; not a rule that lets any second-hand talk in.
examples:
- The cry was part of the res gestae, the court ruled.
- Res gestae let the witness repeat the words cried at the time.
