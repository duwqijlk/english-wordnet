simpleMeaning: the particular radio frequency on which a broadcaster sends out its programs
scope: This is the frequency a listener tunes to, not the building that sends programs, not a stop on
  a railway, and not a guard's assigned post.
examples:
- She tuned the dial to the station at 101.7 FM.
- The station comes in clearly at 98.5 FM.
