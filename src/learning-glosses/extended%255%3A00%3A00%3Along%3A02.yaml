simpleMeaning: Lasting a fairly long time, so long that it grows dull and hard to bear
scope: For a talk or a struggle that goes on and on, not a thing that is big in size and not a limb held
  out straight.
examples:
- They had an extended discussion that lasted all night.
- The extended visit from her mother-in-law wore them out.
