simpleMeaning: to attack with fire from heavy weapons or with bombs
scope: Also called nuke, zap and atomise, this is an attack with fire from heavy weapons or with bombs,
  not breaking a thing into very small parts.
examples:
- The planes atomized the enemy base with bombs.
- They planned to atomize the fort with heavy fire from guns and bombs.
