simpleMeaning: Where the air has too little oxygen of its own, a craft is driven forward by burning with
  oxygen carried on board
scope: It carries its own oxygen for burning, so a craft can be driven forward where the air has too little
  oxygen of its own.
examples:
- The craft used rocket propulsion to climb beyond the air.
- With rocket propulsion, the ship could fly where the air was too thin.
