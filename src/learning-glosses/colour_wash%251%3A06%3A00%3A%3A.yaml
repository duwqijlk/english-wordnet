simpleMeaning: a thin coat of water-based paint with a dye in it that gives a surface a tint
scope: A thin coat of paint made with water and a dye; color wash is another name for this sense; not
  a thick coat of paint, and not plain white paint.
examples:
- They gave the wall a pale colour wash.
- A colour wash softened the bright white wall.
