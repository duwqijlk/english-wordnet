simpleMeaning: to take a place, a car, or a person's help for your use for a set time, under an agreement
scope: This is to take something or a person's help for a set time under an agreement, not to give a person
  a job and not to fight in a war.
examples:
- They engaged a guide in Rome under an agreement for three days.
- He engaged a car for the holiday under a short contract.
