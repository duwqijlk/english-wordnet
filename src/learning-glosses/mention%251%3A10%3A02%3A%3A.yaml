simpleMeaning: a short note that names where a piece of information or a quotation came from.
scope: This is not a brief spoken or written comment about a person or thing, and not the act of naming
  something in passing; it is a short note that credits the source of information or of a quotation.
examples:
- There is a mention of the original study in the footnote.
- Each quotation in the essay is followed by a mention of its source.
