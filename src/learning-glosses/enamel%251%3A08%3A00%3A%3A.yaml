simpleMeaning: the hard white stuff that covers the top of a tooth
scope: The hard white stuff covering the top of a tooth, not the glossy coating on metal or pottery and
  not a paint that dries hard and shiny.
examples:
- Acid can wear away the enamel on your teeth.
- The enamel of a healthy tooth feels smooth.
