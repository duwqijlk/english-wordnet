simpleMeaning: the crime of forcing someone to take part in sex although they do not want to
scope: 'Also called rape and assault: forcing a person to have sex against their will, not a failure to
  follow a law or rule.'
examples:
- He was charged with violation after the woman said he had forced her to have sex.
- The court heard that the violation took place after she had said no.
