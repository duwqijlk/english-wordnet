simpleMeaning: the food and liquid that come up from the stomach and out of the mouth
scope: This is the food and liquid that come out. It is not the act of bringing it up, not a medicine
  that makes a person do that, and not the verb itself.
examples:
- There was vomit on the floor beside the bed.
- She cleaned the vomit off her shoes.
