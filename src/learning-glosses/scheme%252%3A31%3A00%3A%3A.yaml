simpleMeaning: to make secret plans in a dishonest way to get what you want
scope: 'Also called intrigue: making secret, dishonest plans to get something. This is not a plain plan
  or system, and not thinking up a new system.'
examples:
- They schemed for months to take control of the company.
- She was scheming to get her brother's share of the money.
