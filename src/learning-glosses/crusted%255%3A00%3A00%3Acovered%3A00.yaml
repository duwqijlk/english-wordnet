simpleMeaning: a thing whose outside has gone hard, with a firm layer of crust over it
scope: 'Also called crusty: a thing whose outside has gone hard, with a firm layer of crust over it; not
  a soft covering, and not a crust that is still soft.'
examples:
- The crusted snow held his weight as he walked across it.
- She scraped the crusted mud off her boots.
