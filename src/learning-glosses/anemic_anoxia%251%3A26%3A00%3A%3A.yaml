simpleMeaning: A lack of oxygen in the body caused by too little of the stuff in blood that carries oxygen.
scope: A lack of oxygen in the body caused by too little of the stuff in blood that carries oxygen, not
  a lack of oxygen from thin mountain air and not a lack of oxygen from blocked lungs.
examples:
- Anemic anoxia starved her body of oxygen.
- The patient had anemic anoxia from low blood levels.
