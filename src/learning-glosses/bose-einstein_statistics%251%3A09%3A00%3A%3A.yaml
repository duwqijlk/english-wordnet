simpleMeaning: 'In physics, a rule for tiny bits: when two swap places, the wave picture stays the same,
  and the rule keeping two bits out of one state does not hold.'
scope: In physics, a rule for tiny bits where two swapping places leaves the wave picture the same, not
  the rule for bits that cannot share one state.
examples:
- Bose-Einstein statistics says that swapping two particles leaves the wave picture unchanged.
- Under Bose-Einstein statistics, the rule keeping two bits out of one state does not hold.
