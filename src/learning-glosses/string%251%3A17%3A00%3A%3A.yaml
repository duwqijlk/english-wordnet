simpleMeaning: In cosmology, a bit not proven to be real, smaller than an atom, with length but no width
  and much energy in it, that moves and bends like a loop
scope: In cosmology, a very small bit that may be real and bends like a loop; not a cord on a music instrument
  or tennis racket, and not a thin cord for tying things.
examples:
- In this theory, a string is smaller than an atom and holds much energy.
- Scientists who study the universe talk about a string that bends like a small loop.
