simpleMeaning: A free-standing United States body, not tied to any party, that checks the state's running
  arm for Congress and holds the state to account for the people
scope: A United States body that checks the state's running arm for Congress, not a court or a law-making
  body; also called GAO and the United States Government Accounting Office.
examples:
- The Government Accounting Office looked into the work of the executive branch for Congress.
- Congress asked the Government Accounting Office to check the new program.
