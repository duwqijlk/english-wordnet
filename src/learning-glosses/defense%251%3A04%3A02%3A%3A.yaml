simpleMeaning: the accused person's formal reply in court rejecting the charges brought against them
scope: A court reply rejecting charges; not the accused and their lawyers as a group, a hidden mental
  reaction, a justification, a spoken rebuttal of an accusation, a sports team, military action, a defender
  group, a barrier, or protection from harm.
examples:
- His defense was a flat denial of every charge.
- The court rejected the defense that the contract had never been signed.
