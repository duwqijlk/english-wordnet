simpleMeaning: the act of fixing a hole in clothing by sewing a small piece of cloth over it
scope: The act of fixing a hole in clothing with a sewn-on piece of cloth, not the piece of cloth itself
  and not fixing something that is not clothing.
examples:
- 'Her patching saved the shirt: she sewed a small piece of cloth over the hole.'
- Patching is a useful skill when clothes get holes in them.
