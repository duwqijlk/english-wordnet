simpleMeaning: the handling of facts by machines with power, done on its own, with no use of cards or
  tapes with holes
scope: The handling of facts by machines with power, not work done by hand and not the use of cards with
  holes.
examples:
- Electronic data processing replaced the old punched cards.
- The bank used electronic data processing for its accounts.
