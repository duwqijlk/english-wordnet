simpleMeaning: the act of telling things apart by putting them side by side and looking at how they are
  not the same
scope: This is the act of comparing things to see how they differ, not the noun for a clear difference
  itself and not the brightness range in a photo or on a screen.
examples:
- His careful contrast of the two plans showed which one cost less.
- The teacher's contrast of summer and winter made the differences between the seasons clear.
