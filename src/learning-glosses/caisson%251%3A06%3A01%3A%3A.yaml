simpleMeaning: A sunk-in panel in a ceiling or dome, put there to look fine.
scope: A sunk-in panel in a ceiling or dome, also called a coffer or lacunar; not a flat panel and not
  a beam.
examples:
- The caisson in the dome caught the light.
- Painters gilded each caisson in the ceiling.
