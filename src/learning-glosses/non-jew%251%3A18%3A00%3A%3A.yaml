simpleMeaning: A Christian, in contrast with a person of the other faith.
scope: Also called gentile and goy; this is a Christian, not a Jew and not a person who follows no faith.
examples:
- The non-Jew joined the Christian service on Sunday.
- As a non-Jew, she went to church rather than to the synagogue.
