simpleMeaning: a clear, oily liquid that is the small building block (a monomer) from which polystyrene
  is made
scope: 'Also called cinnamene, phenylethylene and styrene: a clear liquid used to make polystyrene, not
  an oil for cooking and not a finished plastic.'
examples:
- The factory stores vinylbenzene in sealed drums before making polystyrene.
- A small spill of vinylbenzene left an oily film on the floor.
