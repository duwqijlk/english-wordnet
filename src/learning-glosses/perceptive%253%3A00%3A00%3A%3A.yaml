simpleMeaning: Able to notice and understand things well, and good at judging what is true or important
scope: This describes a person or a remark that is good at noticing and understanding things; not the
  sense that means only about noticing and understanding in general.
examples:
- She is a perceptive teacher who sees at once when a child is unhappy.
- His perceptive remark showed he understood the problem better than the rest of us.
