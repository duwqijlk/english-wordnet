simpleMeaning: a cloth sign that most often shows a white skull and crossed bones on black, and marks
  a ship of sea robbers
scope: 'Also called blackjack and black flag: a cloth sign most often showing a white skull and crossed
  bones on black, marking a ship of sea robbers, not a national cloth sign and not a plain black cloth.'
examples:
- The pirate flag flew from the mast of the ship.
- A pirate flag warned other ships to keep away.
