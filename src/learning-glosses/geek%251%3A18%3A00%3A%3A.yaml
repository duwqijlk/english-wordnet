simpleMeaning: a person who acts or thinks in a strange way that is not like most people
scope: 'Also called flake, eccentric, and oddball: a person who acts or thinks in a strange way, not a
  show performer who does very unpleasant acts for a crowd.'
examples:
- He was seen as a geek because his habits and clothes were so different from everyone else.
- The new boy was called a geek, as he always acted in an odd way.
