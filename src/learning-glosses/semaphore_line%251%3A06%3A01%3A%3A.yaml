simpleMeaning: With turning shutters on towers standing in set places, this way of passing on word by
  sights gives each part of the word its own place.
scope: Also called shutter telegraph chain, this way of passing on word by sights uses towers with turning
  shutters that stand in set places.
examples:
- The semaphore line passed the word from tower to tower.
- Turning shutters on the semaphore line passed the word along.
