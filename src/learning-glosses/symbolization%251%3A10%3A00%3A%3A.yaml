simpleMeaning: using signs to pass on a meaning
scope: The use of signs to pass on a meaning, with symbolisation as another name for this sense; not the
  practice of giving things a hidden meaning, and not a thing that stands for something else.
examples:
- Symbolization helps the writer say much in few words.
- Her symbolization of dawn as a new start is clear.
