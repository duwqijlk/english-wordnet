simpleMeaning: Most of the spit made at night comes from a spit gland inside the lower jaw on both sides,
  which lets it out into the mouth under the tongue.
scope: 'Also called submandibular gland, submandibular salivary gland, submaxillary gland, and submaxillary
  salivary gland: a spit gland inside the lower jaw that makes most of the spit made at night.'
examples:
- The mandibular gland makes most of our spit at night.
- Spit from the mandibular gland flows into the mouth under the tongue.
