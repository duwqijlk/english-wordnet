simpleMeaning: The power to make much new growth and to keep it strong, thick, and full of life
scope: 'Also called richness, fertility, and rankness: the power to make much new growth and keep it strong,
  not the act of planting seeds and not the size of one plant.'
examples:
- The prolificacy of the garden filled every bed with flowers.
- Farmers prize the prolificacy of rich black soil.
