simpleMeaning: a large tree or bush of the southeastern United States that loses leaves each winter, with
  huge leaves in dense false rings and creamy flowers tinged purple at the base
scope: 'Also called great-leaved macrophylla and large-leaved magnolia: a large tree or bush of the southeastern
  United States, not a cucumber plant and not a tree grown for fruit.'
examples:
- The large-leaved cucumber tree had huge leaves in thick rings.
- In spring the large-leaved cucumber tree bore big creamy flowers.
