simpleMeaning: the job of a doctor who is getting special training in a hospital, usually after finishing
  an internship (an earlier time of training there)
scope: This is a doctor's training job in a hospital, not the act of living in a place and not a person's
  home.
examples:
- Her residency in the hospital lasted three years of special training.
- After medical school, he started his residency to train as a heart doctor.
