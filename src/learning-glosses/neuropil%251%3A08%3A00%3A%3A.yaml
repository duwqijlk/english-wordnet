simpleMeaning: The tangled web of bare axons, dendrites and glial offshoots that make up most of the main
  nerve web's grey stuff, in which nerve-cell bodies sit.
scope: This sense is also called neuropile, for the tangled web of bare axons, dendrites and glial offshoots
