simpleMeaning: To do with the few at the top of society, or showing their ways.
scope: Also called blue, gentle, or aristocratic; to do with the few at the top of society, not a person
  of fine manners, and close in sense to befitting one of noble birth.
examples:
- The patrician families of the town held all the land.
- She spoke with a patrician air that put others at ease.
