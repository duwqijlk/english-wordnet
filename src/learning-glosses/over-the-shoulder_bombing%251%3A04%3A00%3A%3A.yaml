simpleMeaning: A way of dropping a bomb from a plane flying past the straight-up point, so the bomb is
  thrown back to its mark.
scope: A way of dropping a bomb past the straight-up point so it is thrown back; not a plain drop from
  above and not a bomb thrown forward.
examples:
- The pilot used over-the-shoulder bombing to hit the bridge behind him.
- Over-the-shoulder bombing lets the plane drop its load and turn away before the blast.
