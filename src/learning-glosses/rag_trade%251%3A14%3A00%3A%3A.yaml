simpleMeaning: The people who make and sell clothes that are in style
scope: 'Also called the apparel industry, the fashion business, the fashion industry, and the garment
  industry: the people who make and sell clothes that are in style, not the people who make cloth and
  not the shops that sell old clothes.'
examples:
- She worked in the rag trade for twenty years, making coats and dresses.
- The rag trade in the city employs thousands of people.
