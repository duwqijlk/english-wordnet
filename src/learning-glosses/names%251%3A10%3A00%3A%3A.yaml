simpleMeaning: Insults and rude words spoken to someone, used instead of a real argument.
scope: This is not the plural of the word for what people or things are called; it means insulting language
  used in a quarrel.
examples:
- The debate turned into names and shouting.
- He answered the criticism with names rather than reasons.
