simpleMeaning: a program, a command, a file, or an idea on a computer can be shown as a small picture
  on the screen, most often a simple one
scope: A small picture on a computer screen that stands for a program or file, not a religious painting
  and not a picture made on any surface.
examples:
- Click the icon to open the program.
- She tapped the icon for her mail on the screen.
