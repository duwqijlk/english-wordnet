simpleMeaning: the red liquid in animals with a backbone that the heart pumps around the body and that
  contains plasma, cells, and platelets
scope: This is the bodily fluid, not family descent, not temperament, not a fashionable rake, not new
  members brought into a group, and not the verb for smearing someone with it.
examples:
- Blood carries oxygen to every part of the body.
- The nurse took a sample of blood from his arm.
