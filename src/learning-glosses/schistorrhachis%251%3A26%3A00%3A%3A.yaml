simpleMeaning: A fairly common birth defect where a vertebra forms wrongly, with few signs unless several
  vertebrae are hit or myelomeningocele is present, found by amniocentesis.
scope: This sense is also called rachischisis and spina bifida, for a fairly common birth defect where
  a vertebra forms wrongly.
examples:
- Schistorrhachis left the vertebra malformed.
- Schistorrhachis can be found by amniocentesis.
