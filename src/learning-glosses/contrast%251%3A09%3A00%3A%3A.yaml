simpleMeaning: what you see when very different colors are placed side by side
scope: This is about how colors look when placed side by side, not the act of comparing things and not
  a clear line in thought between two ideas.
examples:
- The contrast between the black letters and the white page makes them easy to read.
- The bright red door stands out in contrast to the pale wall.
