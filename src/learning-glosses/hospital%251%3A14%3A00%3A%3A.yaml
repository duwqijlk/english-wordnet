simpleMeaning: a place where doctors and nurses treat people who are ill or hurt.
scope: This is not a pharmacy where you only buy medicine, and not a care home for older people; it is
  a place where ill or injured people receive treatment, often staying overnight.
examples:
- She was taken to hospital after the accident.
- The hospital has a new unit for children.
