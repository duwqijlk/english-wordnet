simpleMeaning: With a strip or raised patch of ground down the middle, keeping traffic going one way apart
  from traffic going the other way
scope: A road with a strip down the middle keeping the two ways apart, not shares given out by a plan.
examples:
- They drove along a divided highway.
- The divided road keeps the two streams of cars apart.
