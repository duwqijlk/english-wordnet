simpleMeaning: In the later part of the day, people say these set words when they meet or part, to wish
  the other person well for the rest of the day
scope: 'Also called afternoon: the set words said when meeting or leaving someone in the later part of
  the day, not the time of day itself and not a morning greeting.'
examples:
- He said good afternoon as he stepped into the shop.
- She answered with a warm good afternoon before she left.
