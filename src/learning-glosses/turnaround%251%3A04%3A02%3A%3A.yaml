simpleMeaning: the work of taking things off a ship or plane, putting things on, and doing needed work
  on it so it can make its trip back
scope: The work done to get a ship or plane ready for its trip back; not a complete change in a situation,
  and not a place where cars turn round.
examples:
- The plane's turnaround took forty minutes before it left again.
- A fast turnaround of the ship let it sail back the same day.
