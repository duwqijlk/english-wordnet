simpleMeaning: a plant that bears small fruits shaped like acorns, with yellow flesh and a dark green
  or yellow skin with lines running down it
scope: A small fruit with yellow flesh and a ridged dark rind, not a pumpkin and not a gourd.
examples:
- We grew acorn squash behind the house this year.
- The acorn squash on the table has yellow flesh inside its dark green skin.
