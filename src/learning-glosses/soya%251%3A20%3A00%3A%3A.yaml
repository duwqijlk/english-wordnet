simpleMeaning: A bushy, hairy annual plant with leaves in threes and pink to purple blooms, grown for
  food, feed and soil improvement, chiefly for its nutritious oily seeds; native to Asia.
scope: This is the growing plant, not the protein-rich seed eaten as food or the oil pressed from those
  seeds.
examples:
- Farmers in the region plant soya as a rotation crop to put nitrogen back in the soil.
- Soya grows into a bushy plant about a meter tall with small purple flowers.
