simpleMeaning: the shrinking of a swelling, as a swollen part goes back down
scope: This is a swelling going down, not a swelling growing larger and not the pain that comes with a
  swelling.
examples:
- The doctor watched the detumescence of the sprained ankle over the next few days.
- After the ice pack, detumescence set in and the knee looked almost normal again.
