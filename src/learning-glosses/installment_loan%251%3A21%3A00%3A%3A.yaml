simpleMeaning: You borrow a sum and pay it off over time, giving back the same sum each time plus interest
scope: A sum borrowed and paid back in the same amount each time, with interest, also called installment
  credit; not a loan paid back all at once and not money given for free.
examples:
- He signed an installment loan for the new roof and paid it monthly.
- An installment loan lets you spread the cost over many equal payments.
