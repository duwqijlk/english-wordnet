simpleMeaning: A leaf with narrow parts that stay joined, cut almost to the middle rib and not split into
  separate small leaves.
scope: This leaf shape has narrow parts, unlike the wide parts of pinnatifid.
examples:
- The pinnatisect leaf was cut almost to the middle rib.
- A pinnatisect leaf keeps its narrow parts joined.
