simpleMeaning: The group of millions of stars that holds our sun, seen as a pale band of light across
  the night sky
scope: Also called the Milky Way Galaxy and the Milky Way System; the group of stars that holds our sun,
  not a single star and not a group of stars far from our sun.
examples:
- The Milky Way stretches across the night sky.
- Our sun is one star in the Milky Way.
