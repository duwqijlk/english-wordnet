senseId: 'tranquilizer%1:06:00::'
synsetId: 04477467-n
simpleMeaning: A drug used to make a person feel less stressed or tense, but still able to think clearly
scope: Also called tranquillizer. This is a drug for stress or tension that keeps the mind clear, not
  a drug that makes you sleep.
examples:
- The doctor gave her a tranquilizer to help her feel calm before the operation.
- He took a tranquilizer for his tension, and his mind stayed clear.
