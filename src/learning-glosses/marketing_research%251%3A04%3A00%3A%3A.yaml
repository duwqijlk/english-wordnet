simpleMeaning: The facts about how goods and services pass from the people who make them to the people
  who buy them are gathered and looked at with care
scope: Also called market research, this is a careful study of how goods and services pass from makers
  to buyers, not selling and not a list of prices.
examples:
- Marketing research told the firm which colours sold best.
- She works in marketing research for a food company.
