simpleMeaning: 'The whole value of all the money a country earns in a set time, most often one year: pay,
  gains, interest, rents and pension payments.'
scope: The whole value of all the money a country earns in a set time, most often one year; not the money
  one person earns and not what a country spends.
examples:
- The national income rose as wages and profits grew.
- National income counts pay, interest, rents and pension payments.
