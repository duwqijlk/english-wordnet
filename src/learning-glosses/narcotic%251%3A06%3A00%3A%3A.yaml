simpleMeaning: a drug that stops feeling or makes a person dull and sleepy; often taken for pleasure or
  to make pain less; much use can make a person unable to stop
scope: This is the drug itself, named by a noun. It is not the adjective senses of narcotic, which describe
  things linked to such drugs or that bring on a dull, sleepy state.
examples:
- The police found a narcotic hidden in his bag.
- He was given a strong narcotic, and soon he felt no pain.
