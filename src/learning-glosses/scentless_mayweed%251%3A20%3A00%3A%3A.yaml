simpleMeaning: A European weed everywhere, living one year, with white flower-heads and finely split leaves,
  rooted and sometimes tended across eastern North American lands, sometimes counted in the genus Matricaria.
scope: This sense is also called corn mayweed, scentless camomile, scentless false camomile, and scentless
  hayweed, for a European weed everywhere, living one year, with white flower-heads and finely split leaves.
examples:
- Scentless mayweed bears white flower-heads.
- Scentless mayweed grows across eastern North American lands.
