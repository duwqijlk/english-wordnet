simpleMeaning: thinking about something in a quiet, careful way for a long time
scope: 'Also called reflection, contemplation, thoughtfulness and rumination: quiet, long, careful thinking,
  not a quick thought or a short daydream.'
examples:
- His musing lasted all afternoon as he thought about the problem.
- She sat in quiet musing, thinking carefully about her future.
