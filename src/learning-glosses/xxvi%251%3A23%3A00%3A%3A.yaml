simpleMeaning: The number that comes from adding twenty-five and one.
scope: Also called 26 and twenty-six; the number after twenty-five, not twenty-five and not twenty-seven.
examples:
- XXVI in Roman numerals means twenty-six.
- There were XXVI chairs in the hall.
