simpleMeaning: having the perfect happiness of heaven
scope: Having the perfect happiness of heaven after death; not the happy and lucky sense for life on earth,
  and not the swear-word sense used to make a word stronger.
examples:
- She believed her kind mother was now among the blessed in heaven.
- The old song tells of blessed souls living in heaven with God.
