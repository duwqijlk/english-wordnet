senseId: 'unskilled%3:00:00::'
synsetId: 02236080-a
simpleMeaning: not having, showing, or needing a special ability to do something well
scope: This is the wider sense, for a person with no special ability, work that shows none, or a job that
  needs none; it is not only about work done without a trained worker's knowledge.
examples:
- Unskilled workers were hired for the simple cleaning jobs that needed no special training.
- He is unskilled in speaking to large groups and finds it very hard.
