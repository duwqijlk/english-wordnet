synsetId: 05478833-n
simpleMeaning: a lump that grows on a plant or animal, such as the flap under a bird's beak or a bump
  by the scar of certain seeds
scope: A growth, also called caruncle; not a wart and not a fruit.
examples:
- The caruncula on the hen's throat wobbled as she pecked.
- A caruncula can be seen near the scar of the seed.
