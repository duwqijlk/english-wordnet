simpleMeaning: A train engine moved by liquid pressure from an oil-burning motor
scope: A train engine driven by oil power through liquid pressure, not a steam engine and not an electric
  engine; diesel-hydraulic locomotive is another name for this sense.
examples:
- The diesel-hydraulic pulled the freight cars up the hill.
- A diesel-hydraulic works by pumping liquid under pressure.
