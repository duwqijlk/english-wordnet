simpleMeaning: A short, sharp sound like a small explosion, such as a gunshot or a cork leaving a bottle.
scope: This is not the sweet drink or the act of bursting; it is the noise itself.
examples:
- There was a loud pop as the balloon burst.
- We heard the pop of a cork from the kitchen.
