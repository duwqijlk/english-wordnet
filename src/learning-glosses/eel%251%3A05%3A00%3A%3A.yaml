simpleMeaning: A snake-shaped, greedy saltwater or freshwater fish, usually scaleless; its skin is smooth
  and slimy, and one fin runs down its back and belly, with no paired fins below.
scope: This is the snake-shaped fish itself, in the sea or in fresh water. Not the flesh sold as food,
  and not a snake or worm, despite the similar shape.
examples:
- An eel slid through the muddy water, its long body twisting like a snake.
- Eels hunt at night in rivers and coastal waters.
