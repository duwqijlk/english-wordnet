simpleMeaning: A drug that can make the gut clear out the small worms living inside it
scope: Also called vermifuge, anthelmintic, and helminthic, this is the drug itself, not the power to
  expel worms.
examples:
- The doctor gave her an anthelminthic to clear the worms from her gut.
- She took an anthelminthic for the worms in her gut.
