simpleMeaning: set out in a regular beat, with word parts (syllables) placed in a fixed pattern
scope: 'Also called metric: about a regular beat in word parts; it is not about finding the size of something,
  and not about slow, careful action.'
examples:
- The poem has a clear, measured beat in each line.
- She read the verse in a measured rhythm, with each word part in its place.
