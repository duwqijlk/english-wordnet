simpleMeaning: A piece of material that lets electric current pass only in some cases, made of two joined
  layers that meet at one place.
scope: A piece of material that lets electric current pass only in some cases, made of two joined layers
  that meet at one place; diode and crystal rectifier are other names for it, not a plain wire and not
  a battery.
examples:
- The junction rectifier joins two layers of material in the circuit.
- A junction rectifier sits in the radio's power supply.
