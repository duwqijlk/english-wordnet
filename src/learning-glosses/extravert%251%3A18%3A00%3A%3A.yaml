simpleMeaning: In psychology, someone who gives most of their mind to real things in the world around
  them, not to their own thoughts and feelings
scope: 'Also called an extrovert: a person turned toward the world outside, not a shy person turned inward
  and not a person lost in thought.'
examples:
- As an extravert, she loved meeting new people at every party.
- The extravert chose a busy sales job over quiet work alone.
