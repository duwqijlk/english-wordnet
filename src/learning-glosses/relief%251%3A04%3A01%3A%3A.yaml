senseId: 'relief%1:04:01::'
synsetId: 00355710-n
simpleMeaning: The act of making something bad or painful less severe.
scope: This is the act of making something unpleasant less severe, also called easing, alleviation, or
  easement. It is not help given to people in need, not the calm feeling that follows, and not a carved
  artwork.
examples:
- The doctor gave him an injection for quick relief from the pain.
- A hot bath brought some relief to her aching back.
