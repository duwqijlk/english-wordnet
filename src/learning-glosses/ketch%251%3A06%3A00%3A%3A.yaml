simpleMeaning: A sailing ship with two masts, with the back mast — the mizzen — set in front of the rudder
  post.
scope: A two-masted sailing ship with the back mast forward of the rudder post, not a one-masted boat.
examples:
- The ketch sailed slowly into the harbour.
- Two men worked the sails of the ketch.
