senseId: 'false_truffle%1:20:02::'
synsetId: 12992160-n
simpleMeaning: One of several fungi of the Rhizopogonaceae family whose fruiting bodies grow underground
  and look like the underground fungus.
scope: An underground fungus of the Rhizopogonaceae family, not a true truffle and not an ordinary mushroom
  that grows above ground.
examples:
- The false truffle grows its fruiting bodies below the soil surface.
- We dug up a false truffle that looked much like a truffle.
