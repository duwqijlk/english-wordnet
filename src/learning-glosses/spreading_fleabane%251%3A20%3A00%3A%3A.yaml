simpleMeaning: a much-branched plant of western North America with hairy leaves and stems, each stem holding
  one flower head with thin white, pink, or pale purple rays
scope: A well-branched plant of western North America, not a tall fleabane of eastern fields and not a
  daisy with broad petals.
examples:
- The spreading fleabane grew in thick clumps along the dry road.
- Each spreading fleabane stem held a single head of narrow white rays.
