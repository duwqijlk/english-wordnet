simpleMeaning: a harmless tan and brown king snake with a mark on the back of its head like an arrow;
  those in the south-east have red stripes like coral snakes
scope: 'Also called checkered adder, house snake, and milk snake: a harmless tan and brown king snake,
  not a snake with venom and not a coral snake.'
examples:
- The milk adder in the garden was tan and brown with an arrow-shaped mark on its head.
- A milk adder from the south-east had red stripes like a coral snake.
