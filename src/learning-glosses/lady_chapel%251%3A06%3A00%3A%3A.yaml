simpleMeaning: Set apart for the Virgin Mary, this is a small room for prayer inside a church
scope: A small place for prayer in a church, set apart for the Virgin Mary, not the main body of the church
  and not a side room for other uses.
examples:
- The lady chapel stands at the east end of the church.
- Candles burned in the lady chapel all morning.
