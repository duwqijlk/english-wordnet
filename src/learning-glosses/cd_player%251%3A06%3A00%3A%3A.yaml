simpleMeaning: It either has its own screen or joins to a television set, and it stands on its own as
  a piece of electronic equipment
scope: This is a piece of electronic equipment that stands on its own, not a television set and not a
  machine that makes discs.
examples:
- The CD player sits on the shelf next to the television.
- She turned on the CD player and the music started.
