simpleMeaning: a person who murders many people one after another over a short time
scope: A person who murders many people over a short time, not one who kills only once and not one who
  kills over many years.
examples:
- The police said the spree killer had struck three times in one week.
- The spree killer was caught after a string of killings in two days.
