simpleMeaning: To remove a physical object, for example by lifting it, pushing it, or pulling it off,
  or to remove something that has no physical form.
scope: This is not eating or drinking something, not beginning a job or role, and not understanding a
  remark in a particular way.
examples:
- Please take the books off the table.
- The new law took away our freedom to choose.
