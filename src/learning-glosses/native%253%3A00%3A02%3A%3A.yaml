simpleMeaning: relating to the peoples who have lived in a region since the earliest times.
scope: This concerns long-settled human communities, not plants, animals, or goods that merely come from
  a place, and not talents someone is born with.
examples:
- The museum displays native art from the region's first inhabitants.
- She studies the native languages of the Amazon.
