simpleMeaning: A bug killer that gets in the way of how a bug's nerves work
scope: A bug killer that stops a bug's nerves from working as they should; not a bug killer that traps
  bugs and not a spray for germs.
examples:
- The farmer sprayed organophosphate on the field.
- Organophosphate works by upsetting the insect's nerves.
