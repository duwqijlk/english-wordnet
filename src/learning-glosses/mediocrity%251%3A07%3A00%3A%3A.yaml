simpleMeaning: the quality of being only average and not standing out as very good
scope: This is the quality of being average and not very good. It is not a single bad thing and not a
  single average person.
examples:
- The mediocrity of the hotel surprised us; nothing about it was very good.
- His work showed a clear mediocrity, with no new or strong ideas.
