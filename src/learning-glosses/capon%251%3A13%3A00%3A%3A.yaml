simpleMeaning: the meat of a male chicken that has had its sex parts taken out
scope: This is the meat of that male chicken, eaten as food. It is not meat from a female chicken or from
  another kind of bird.
examples:
- They served roast capon for the main meal.
- He bought a capon at the market to cook for dinner.
