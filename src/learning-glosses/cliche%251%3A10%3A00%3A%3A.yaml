senseId: 'cliche%1:10:00::'
synsetId: 07168754-n
simpleMeaning: a remark used so often, or so well known, that it sounds stale and has lost its force
scope: A remark used so often it sounds stale; commonplace is another name for this sense, not a fresh
  remark and not a wise saying.
examples:
- His speech was full of clichés about hard work.
- '''Time heals all wounds'' is a cliché we have all heard.'
