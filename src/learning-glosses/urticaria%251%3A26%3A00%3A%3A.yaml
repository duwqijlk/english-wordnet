simpleMeaning: An itchy skin break-out marked by weals with pale middles and clear-cut red rims, usually
  the fruit of an allergic answer to bug bites, food, or drugs.
scope: This sense is also called hives, nettle rash, and urtication.
examples:
- Urticaria itched and reddened the skin.
- An urticaria came from a bug bite.
