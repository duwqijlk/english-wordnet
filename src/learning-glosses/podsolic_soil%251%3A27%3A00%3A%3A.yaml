simpleMeaning: A grey, washed-out layer under a dark mat of decaying plant litter marks this soil of cool
  or cold, wet conifer woods and heaths.
scope: Another name for the cool-climate ground also called podsol, podzol and podzol soil; it is not
  a general word for fertile garden earth.
examples:
- Podsolic soil is common under heather on sandy ground.
- The podsolic soil here is too acid for most crops.
