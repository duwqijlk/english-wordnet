senseId: 'act_of_god%1:11:00::'
synsetId: 07329950-n
simpleMeaning: A natural disaster that cannot be avoided, breaking the course of things people expect
scope: 'Also called force majeure, inevitable accident, unavoidable casualty, and vis major: a natural
  disaster that cannot be avoided and breaks the course of things people expect, not a disaster that people
  cause.'
examples:
- The storm was called an act of God by the insurance company.
- His house was not insured against acts of God.
