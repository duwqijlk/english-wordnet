simpleMeaning: a white stuff made when oxygen joins with another element, forming clear hard bits, used
  to make the burning stuff got from heating a kind of rock
scope: Also called burnt lime, calcined lime, calx, fluxing lime, lime and quicklime; it is the stuff
  used to make the burning stuff got from heating a kind of rock, not that burning stuff itself and not
  the stuff found in bones.
examples:
- The kiln turned out white calcium oxide.
- They used calcium oxide to make calcium hydroxide.
