simpleMeaning: 'A computer circuit built as an electronic unit: thin copper tracks are bonded onto an
  insulating board or card, and parts are pushed through holes and dip-soldered in place.'
scope: This is the finished board carrying its copper wiring and soldered parts, not the bare board before
  parts are fitted or a circuit design on paper.
examples:
- A cracked copper track on the printed circuit was causing the fault, not a bad chip.
- Machines place the parts on the printed circuit before it is dipped in the solder bath.
