simpleMeaning: a way of swimming like the crawl (the fast way of swimming on your front), except that
  the person lies on his or her back
scope: This is swimming on your back, not swimming on your front like the crawl or the breaststroke.
examples:
- She won the race swimming backstroke.
- He does the backstroke slowly, lying on his back in the pool.
