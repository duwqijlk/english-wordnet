senseId: 'uremia%1:26:00::'
synsetId: 14234453-n
simpleMeaning: a build-up in the blood of waste that holds nitrogen, urea, that most often leaves the
  body in urine
scope: 'Also called azotaemia, azotemia and uraemia: waste that stays in the blood, not waste that leaves
  the body as it should and not a blood disease of another kind.'
examples:
- Her uremia came from kidneys that could no longer clear waste from her blood.
- The doctor treated his uremia by helping his body get rid of the waste in his blood.
