simpleMeaning: A fish shaped like an eel, from the fresh waters of South America, with parts in its body
  that give shocks.
scope: Also called electric eel; a fish shaped like an eel, from the fresh waters of South America, with
  parts in its body that give shocks, not a sea eel and not a plain river fish.
examples:
- The Electrophorus electricus gave the swimmer a shock.
- An Electrophorus electricus lives in the slow rivers of South America.
