senseId: 'conservator%1:18:01::'
synsetId: 09634752-n
simpleMeaning: a person chosen by a court to look after the affairs of a child who is not yet an adult
  or of someone who cannot look after their own affairs
scope: This is the court-chosen person for a child or for someone who cannot manage his or her own affairs,
  not a person who looks after art or old things in a museum.
examples:
- The court named a conservator to look after the child's money.
- As conservator, she paid his bills and kept his house safe.
