simpleMeaning: in a natural way that is linked to living things and how they grow
scope: In a natural way linked to living things, not in the chemistry sense about a thing made with carbon.
examples:
- This food is grown organically, without man-made chemicals.
- The garden was grown organically, with no sprays to kill insects.
