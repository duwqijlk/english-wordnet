simpleMeaning: Slanting in direction, course or position; not running in the same direction as another
  line, and not meeting another line at a square corner
scope: This describes a slanted direction or position, not a muscle at the side of the body and not a
  way of speaking that is not direct.
examples:
- The oblique rays of the winter sun came in low through the window.
- Cut the wood at an oblique angle, not straight across.
