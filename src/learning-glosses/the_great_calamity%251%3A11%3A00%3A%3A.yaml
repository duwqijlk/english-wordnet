simpleMeaning: A famine in Ireland from potato blight; between 1846 and 1851 a million people starved
  to death and 1.6 million left, most for America.
scope: 'Also called the Great Hunger, the Great Starvation and the Irish Famine: the Irish famine of 1846
  to 1851, caused by potato blight, in which a million people starved and 1.6 million left.'
examples:
- The Great Calamity drove 1.6 million people from Ireland.
- During the Great Calamity, potato blight left Ireland hungry.
