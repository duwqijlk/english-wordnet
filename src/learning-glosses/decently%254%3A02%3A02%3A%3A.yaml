senseId: 'decently%4:02:02::'
synsetId: 00197608-r
simpleMeaning: in the right way, with no mistakes, and in a way that fits the place and time
scope: Also called right, properly, and decent. This sense is about doing a thing in the correct way that
  fits, not just in a good or polite way.
examples:
- She did the work decently, with no mistakes at all.
- They set the table decently for their guests.
