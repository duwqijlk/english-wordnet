synsetId: 10199542-n
simpleMeaning: A person who holds a cheque, note, bond, or paper of ownership that is signed over to them
  or to whoever holds it.
scope: 'Also called holder: a person holding a cheque, note, bond, or paper of ownership signed over to
  them, not a messenger, not a coffin carrier, and not a person whose job is carrying things.'
examples:
- The bond was marked "payable to bearer".
- The bearer of the cheque may cash it at any bank.
