simpleMeaning: the work of rubbing or putting wax on something to make it smooth and bright
scope: The work of rubbing or putting wax on a thing to make it bright. It is not the word for very good,
  and not the word for bright after rubbing.
examples:
- The shining of his shoes took ten minutes each morning.
- He earned a little money from the shining of shoes.
