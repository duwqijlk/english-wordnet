simpleMeaning: Thought to work less well than the plant it is named for, this one-year herb of Europe
  and Asia smells and heals much the same, but tastes more bitter.
scope: Also called sweet false chamomile, this herb stands apart from the plant it is named for by a more
  bitter taste and a weaker effect.
examples:
- The wild chamomile smells much like the plant it is named for.
- The taste of wild chamomile is more bitter than that of the plant it is named for.
