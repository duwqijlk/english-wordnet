simpleMeaning: big and with plenty of room inside; this use is old and no longer in common use
scope: This sense means big with plenty of room inside, not easy to use or handy for a job.
examples:
- They rented a convenient hall with room for two hundred guests.
- The old house had a convenient kitchen where ten people could cook at once.
