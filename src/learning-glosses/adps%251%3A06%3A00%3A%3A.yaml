senseId: 'adps%1:06:00::'
synsetId: 03089957-n
simpleMeaning: One place to keep data is shared by one or more computers and the programs that go with
  them, working together as one set-up
scope: 'Another name for this sense is ADP system, and also automatic data processing system, computer
  system, and computing system: one or more computers and their programs that share one place to keep
  data, not a computer that keeps its data to itself.'
examples:
- The company moved all its records onto the new ADPS.
- Our ADPS keeps the data in one shared store.
