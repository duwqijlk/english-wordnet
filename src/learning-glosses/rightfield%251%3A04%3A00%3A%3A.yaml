simpleMeaning: In baseball, the place where the player stands to catch balls hit to the far third of the
  outer part of the ground, as seen from home plate
scope: 'Also called right field: the place in baseball where a player stands to catch balls hit to the
  far side of the outer ground, not the left side and not the middle.'
examples:
- The rightfield caught the ball near the fence.
- She played rightfield for the school team.
