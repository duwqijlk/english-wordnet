simpleMeaning: too sure of yourself in a way that upsets others, or ready to use power over others, usually
  without a good reason
scope: 'Also called bossy, dominating, peremptory and magisterial: a person who is too sure of themselves
  in a way that upsets others, or who is ready to use power over others. It is not about a ruler who holds
  all power in a country.'
examples:
- His autocratic manner made the workers afraid to speak.
- She gave orders in an autocratic way and never listened.
