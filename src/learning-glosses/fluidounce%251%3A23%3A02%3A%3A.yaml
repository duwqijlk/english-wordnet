simpleMeaning: the British imperial measure of how much a container holds, liquid or dry, equal to eight
  drams, or 28.416 cubic centimetres (1.734 cubic inches)
scope: The British imperial unit of capacity, also called fluid ounce, not a unit of weight.
examples:
- The bottle held eight fluidounces of juice.
- A fluidounce is a small unit of capacity.
