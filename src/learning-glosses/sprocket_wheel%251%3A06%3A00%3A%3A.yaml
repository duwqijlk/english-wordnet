simpleMeaning: a thin round part with teeth round its edge that catch on a chain to turn it
scope: A thin round part with teeth that works with a chain, also called a sprocket, not a plain smooth
  wheel and not a gear that works with another wheel.
examples:
- The sprocket wheel turned the chain on his bike.
- A worn sprocket wheel can make the chain slip.
