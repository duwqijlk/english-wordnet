simpleMeaning: in damp ground this leafy plant lives one or two years, sometimes eaten in salads or cooked
  as a green, and a troublesome weed in some places
scope: This leafy plant of damp ground, also called marsh cress, is a troublesome weed in some places.
examples:
- We picked yellow watercress in the damp ground for a salad.
- Yellow watercress is a troublesome weed in some places, though it is sometimes cooked as a green.
