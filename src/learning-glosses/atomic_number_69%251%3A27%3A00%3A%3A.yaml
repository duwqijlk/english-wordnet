simpleMeaning: A soft silvery metal of the rare-earth group; its form 170 gives off X-rays and is used
  in small portable X-ray machines; it is found in monazite, apatite and xenotime.
scope: Also called Tm and thulium; a soft silvery metal of the rare earth group, not iron, a common metal,
  and not a metal used for building.
examples:
- Atomic number 69 is the element thulium.
- The sample contained atomic number 69.
