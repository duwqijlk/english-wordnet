simpleMeaning: Close kin to Larix occidentalis, a tree of the west, this tree of middle size grows in
  the Rocky Mountains.
scope: This tree grows in the Rocky Mountains and is close kin to the western tree, not that tree itself.
examples:
- A subalpine larch grew in the Rocky Mountains.
- We passed a subalpine larch in the Rocky Mountains.
