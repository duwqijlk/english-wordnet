simpleMeaning: a line of guards or army posts around a place or thing, put there to guard it
scope: A line of guards or army posts around a place, not a ribbon or cord worn for beauty, and not a
  cord or ribbon worn to show honor or rank.
examples:
- Soldiers formed a cordon around the palace to guard it.
- A cordon of guards kept people away from the place.
