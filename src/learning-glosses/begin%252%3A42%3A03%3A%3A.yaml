simpleMeaning: To open in a stated way, so that the first part or first action is the one named.
scope: This is the way something opens, naming its first part or action, not the moment when an event
  starts and not being the first item in a list.
examples:
- Her day begins with a long walk.
- The film begins with a quiet scene in a kitchen.
