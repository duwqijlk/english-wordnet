simpleMeaning: the head and neck are turned, bent, and stretched by one of a pair of flat muscles that
  run from the upper back to the base of the skull
scope: Also called splenius, it is one of the pair of flat muscles of the neck.
examples:
- The splenius muscle helps to turn the head.
- The splenius muscle moves the head and neck.
