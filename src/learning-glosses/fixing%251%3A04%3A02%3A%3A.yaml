senseId: 'fixing%1:04:02::'
synsetId: 00277186-n
simpleMeaning: In histology, keeping a piece of body tissue from changing and making it hard, to keep
  its parts in nearly the same arrangement as in the living body
scope: This is about keeping a piece of body tissue for study, not a thing that holds something in place
  and not mending something that is broken.
examples:
- Fixing the tissue sample kept its parts in place for study under a microscope.
- The lab's fixing of the sample made it hard before it was cut into thin slices.
