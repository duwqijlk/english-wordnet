simpleMeaning: a small moth from India that lives on and harms plants such as tea and coffee
scope: This is a small moth from India that lives on plants such as tea and coffee; tea tortrix is another
  name for this sense. Not a moth that eats cloth and not a butterfly.
examples:
- The tortrix laid its eggs on the tea bushes.
- Tortrix caterpillars damaged the coffee plants in the valley.
