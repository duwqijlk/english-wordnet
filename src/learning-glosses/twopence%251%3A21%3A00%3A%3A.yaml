simpleMeaning: An old United Kingdom coin made of silver, or a bronze United Kingdom coin worth two pennies,
  counted in decimals
scope: Also called tuppence, this is a single United Kingdom coin worth two pennies, not a one-penny coin.
examples:
- She paid twopence for the bread in the old story.
- A twopence lay on the table next to the other coins.
