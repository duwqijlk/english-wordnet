simpleMeaning: to cut open and look closely at a dead body to find out why the person died
scope: The act of cutting open a dead body to find the cause of death; not the noun of the same name for
  that act, and not a check on a living person.
examples:
- The doctors will autopsy the body to find the cause of death.
- They autopsied him the day after he died.
