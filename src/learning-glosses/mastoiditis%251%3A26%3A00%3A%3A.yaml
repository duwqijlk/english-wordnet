simpleMeaning: Swelling and soreness of the bony bump behind the ear.
scope: A sore swelling of the bony bump behind the ear, not a general ear infection and not a swelling
  of the ear itself.
examples:
- The child had mastoiditis after a bad ear infection.
- Mastoiditis made the bump behind his ear tender and swollen.
