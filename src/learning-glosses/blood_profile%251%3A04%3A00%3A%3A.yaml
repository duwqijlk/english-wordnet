simpleMeaning: a count of the white and red cells and the tiny bits that help red liquid thicken, taken
  from one tiny cube of red liquid
scope: A count of the cells and clotting bits in a tiny amount of red liquid, also called a complete blood
  count, not a test of sugar in red liquid and not a test for one disease.
examples:
- The doctor ordered a blood profile to check her cell counts.
- The blood profile showed low white cell numbers.
