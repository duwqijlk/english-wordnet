senseId: 'understudy%2:31:00::'
synsetId: 00606325-v
simpleMeaning: to learn an actor's part in a play so that you can play it if that actor cannot
scope: Another name for this sense is alternate. It is learning a part so you can take an actor's place,
  not the person who does this job.
examples:
- She understudied the lead role in the play this spring.
- He understudies for the main actor every night.
