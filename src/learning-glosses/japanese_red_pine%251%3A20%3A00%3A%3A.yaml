simpleMeaning: A pine native to Japan and Korea, with a broad, uneven crown when mature, grown for decoration.
scope: This is a tree grown for its looks, with a broad, uneven top when fully grown; Japanese table pine
  and Pinus densiflora are other names for this sense.
examples:
- The Japanese red pine in the park has a wide, uneven crown.
- They planted a Japanese red pine as an ornamental tree in the garden.
