simpleMeaning: A mix of germ-killing drugs put on the sick part to treat ills caused by germs of one kind,
  the kind that stains purple in a test.
scope: This is a mix of germ-killing drugs put on the sick part, not a pill and not a drug for germs of
  every kind.
examples:
- Tyrothricin was put on the sore twice a day.
- The doctor used tyrothricin for the skin infection.
