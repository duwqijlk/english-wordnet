simpleMeaning: salt and smog do not hurt this big Japanese tree grown for show, whose long needles grow
  in pairs; it is widely planted in the United States
scope: A big Japanese tree grown for show, not the New Zealand timber tree or the two-needled pine of
  south-east Europe with the same name.
examples:
- The black pine at the gate has long needles in pairs.
- Black pines line the road because they stand up to salt and smog.
