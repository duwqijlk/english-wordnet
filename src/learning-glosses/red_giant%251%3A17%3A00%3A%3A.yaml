simpleMeaning: A big old star that gives out a lot of light, with a cool surface and a width far greater
  than the sun
scope: 'Also called red giant star: a big old star that shines with a cool surface, not a small hot young
  star and not a white dwarf.'
examples:
- The red giant shone brightly in the night sky.
- Astronomers found that the red giant was far wider than the sun.
