simpleMeaning: People guard this thing from any touch or change, because they hold it most dear
scope: This is a thing people treat as too dear to touch or change, not the innermost room of the temple
  where the Ark was kept.
examples:
- No leader dares to touch that holy of holies, the health care plan.
- The team's holy of holies was its long-kept playbook.
