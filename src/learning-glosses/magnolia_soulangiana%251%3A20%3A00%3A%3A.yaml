simpleMeaning: A large shrub or small tree that loses its leaves each year, with big open pink to purple
  flowers, from Asia, loved as a garden plant in eastern North America.
scope: 'Also called saucer magnolia and Chinese magnolia: a large shrub or small tree with big open pink
  to purple flowers, loved as a garden plant, not the evergreen magnolia.'
examples:
- Magnolia soulangiana bloomed early, its big pink flowers open to the spring sun.
- We planted Magnolia soulangiana by the house for its purple flowers.
