simpleMeaning: A single perceived shape that has a clear, connected structure and stands out from its
  background as the thing you are looking at.
scope: Not a number or amount, and not a geometric drawing.
examples:
- In the optical illusion, the vase becomes the figure while the faces fade into the background.
- Psychologists study how the eye picks out a figure from a busy pattern.
