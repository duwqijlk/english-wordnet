simpleMeaning: The arm muscle with three starting points that straightens the lower arm when it tightens
scope: The arm muscle with three starting points that straightens the lower arm, also called musculus
  triceps brachii; not the muscle that bends the arm and not a shoulder muscle.
examples:
- The triceps brachii straightens the arm when you push.
- He felt his triceps brachii work as he lifted the weight.
