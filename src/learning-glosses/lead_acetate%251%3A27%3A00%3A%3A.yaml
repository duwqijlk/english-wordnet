simpleMeaning: Used to colour cotton and to make shiny coats, this white solid, Pb[CH3CO]2, can poison.
scope: Also called sugar of lead, this white solid can poison and is used to colour cotton and to make
  shiny coats.
examples:
- The dyer used lead acetate to colour the cotton.
- Lead acetate went into the making of the varnish.
