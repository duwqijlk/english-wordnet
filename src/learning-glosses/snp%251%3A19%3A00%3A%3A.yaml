simpleMeaning: In genetics, one building block of the DNA code changed, usually seen as a tiny change
  that has lasted and spread through a large share of a species.
scope: Not a change to a whole gene or a whole chromosome; also called a single nucleotide polymorphism.
examples:
- The SNP in her DNA explains why the medicine works differently for her.
- Scientists found an SNP that is common in this group of people.
