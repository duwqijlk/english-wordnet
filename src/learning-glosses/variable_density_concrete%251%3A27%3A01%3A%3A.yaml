simpleMeaning: Concrete filled with air, with a catcher of air added, or light stuffing of puffed clay,
  cork grains, and vermiculite.
scope: This sense is also called cellular concrete, foamed concrete, lightweight aerated concrete, lightweight
  concrete, and ultra-lightweight concrete.
examples:
- Variable density concrete filled the wall.
- Variable density concretes are air-filled.
