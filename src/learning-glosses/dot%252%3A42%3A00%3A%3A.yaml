simpleMeaning: To spread things here and there over a place, mixed in among what is already there, like
  small spots or studs
scope: To spread things about, not the short Morse signal and not the street name for a drug.
examples:
- Lights dotted the hills at night.
- Flowers dotted the green field after the rain.
