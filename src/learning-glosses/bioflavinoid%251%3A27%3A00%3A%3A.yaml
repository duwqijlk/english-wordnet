simpleMeaning: This vitamin keeps the walls of cells and tiny blood tubes firm, so little passes through
  them.
scope: Also called citrin, it is the vitamin that keeps the walls of cells and tiny blood tubes firm.
examples:
- The bioflavinoid kept the cell walls firm.
- Without enough bioflavinoid, the walls let too much through.
