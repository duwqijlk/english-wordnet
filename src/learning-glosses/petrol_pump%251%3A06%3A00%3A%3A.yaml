simpleMeaning: a device in a filling station that draws gasoline from tanks stored below the ground
scope: A device at a filling station that draws fuel from tanks below the ground; gas pump, gasoline pump
  and island dispenser are other names for this sense, not the tank itself and not the hose alone.
examples:
- She filled the tank at the petrol pump before the long drive.
- The petrol pump at the corner was out of order, so we drove on to the next station.
