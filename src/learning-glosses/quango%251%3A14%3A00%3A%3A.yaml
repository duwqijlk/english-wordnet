simpleMeaning: a group paid for by the government that still makes its own choices and acts on its own
scope: A body paid for by the government but free to act on its own, not a government office and not a
  fully private group.
examples:
- 'The arts council is a quango: the government pays for it but does not run it.'
- Critics said the new quango answered to no minister.
