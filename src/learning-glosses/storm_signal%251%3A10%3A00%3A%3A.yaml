senseId: 'storm_signal%1:10:00::'
synsetId: 06805221-n
simpleMeaning: a sign that tells people bad weather is coming, most of all a strong and violent one
scope: A warning that bad weather is coming, not a storm cone raised to warn of high winds, and not a
  weather report that gives the day's forecast.
examples:
- The storm signal went up over the harbour before the gale hit.
- Fishermen watched for the storm signal before they put out to sea.
