simpleMeaning: The waste opening of this small body lies outside its ring of feelers; it is a water animal
  like moss, fixed in one place.
scope: This name covers a water animal like moss, fixed in one place, with its small body's waste opening
  outside the ring of feelers.
examples:
- The ectoproct stayed fixed in one place in the water.
- We watched the ectoproct in the water.
