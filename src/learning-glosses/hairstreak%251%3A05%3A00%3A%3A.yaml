simpleMeaning: Thin lines of colour mark the underside of the wings of this small kind of butterfly
scope: Also called a hairstreak butterfly, a small butterfly with thin lines of colour under its wings,
  not a large butterfly and not one with plain wings.
examples:
- A hairstreak rested on the leaf, its striped wings folded.
- We saw several hairstreaks, their wings marked with thin lines, among the wildflowers.
