simpleMeaning: Without its engines, a plane or rocket is left with this frame and outer shell.
scope: What is left of a plane or rocket when the engines are taken away is its frame and outer shell.
examples:
- Workers built the airframe before they fitted the engines.
- They stripped the plane down to its airframe.
