simpleMeaning: One of a people of old Greece, one of four speech groups, on Asia Minor's west coast, on
  Chios and Samos, on Aegean islands, and on Euboea north of Athens.
scope: One of a people of old Greece, not a Greek of Athens and not a speaker of modern Greek.
examples:
- The Ionian farmer lived on Euboea.
- An Ionian trader sailed from Chios.
