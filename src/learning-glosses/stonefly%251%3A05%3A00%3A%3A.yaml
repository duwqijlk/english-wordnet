simpleMeaning: An ancient winged insect with a flattened body, used as bait by fishermen, whose gilled
  young live in water, eat meat and live beneath stones.
scope: Also called plecopteran and stone fly, this is an ancient winged insect with a flattened body,
  used as bait by fishermen, whose gilled young live in water, eat meat and live beneath stones, where
  plecopteran is an old sort of winged insect with a flat body which fishermen use for bait, its young
  in water having gills, eating other creatures and living under stones.
examples:
- The stonefly is a primitive insect.
- Stoneflies hatch near streams.
