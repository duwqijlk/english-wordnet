simpleMeaning: behavior that shows no respect for holy things; the act of taking away the holy nature
  of something
scope: 'Also called blasphemy, sacrilege, and profanation: showing no respect for holy things or taking
  away their holy nature, not just plain damage to a building.'
examples:
- The desecration of the temple angered the whole town.
- Burning the holy books was seen as an act of desecration.
