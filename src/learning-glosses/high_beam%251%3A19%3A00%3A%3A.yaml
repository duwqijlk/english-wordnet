simpleMeaning: The bright light from a car's front lights that reaches far down the road.
scope: The bright setting of car front lights that reaches far down the road, not the low beam for near
  light and not fog lights.
examples:
- Switch to high beam when the road ahead is empty.
- The high beam lit up the trees far ahead.
