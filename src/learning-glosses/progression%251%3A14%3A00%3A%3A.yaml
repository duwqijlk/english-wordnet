simpleMeaning: a set of things in a row that follow a clear pattern of moving forward
scope: A set of things in a row that follow a clear pattern of moving forward, not just one move forward
  and not a set with no clear pattern.
examples:
- The progression of numbers 2, 4, 6, 8 follows a clear pattern.
- We watched the progression of the song from soft notes to loud ones.
