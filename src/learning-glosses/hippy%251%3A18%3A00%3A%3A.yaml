simpleMeaning: a person who turns away from the way most people live, and speaks up for very free ideas
  about politics and the way to live
scope: 'Also called hippie, hipster, and flower child: a person who turns away from the common way of
  life, not a person who only dresses in a free or old style.'
examples:
- The hippy left city life and lived with a small group who shared his free ideas.
- Many hippies spoke up for peace and a very free way of life.
