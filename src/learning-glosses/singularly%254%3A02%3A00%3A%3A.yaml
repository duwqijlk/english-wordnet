simpleMeaning: in an unusual way, or to an unusually high degree
scope: In an unusual way or to an unusual degree; not in the sense of being single or alone, and not the
  grammar word for one person or thing.
examples:
- She is singularly good at solving hard problems.
- He was singularly calm while everyone else was worried.
