simpleMeaning: to show a person or thing in words, so a reader sees what they are like
scope: This is about showing someone in words, not about painting or drawing a picture of them.
examples:
- The book portrays the actor as a selfish person.
- In her letter she portrays her village as a quiet, happy place.
