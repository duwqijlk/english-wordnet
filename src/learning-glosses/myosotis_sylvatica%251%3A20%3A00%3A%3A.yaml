simpleMeaning: A small herb of Europe, northern Africa and western Asia that lives two years or longer,
  with blue, purple or white flowers.
scope: This is a small herb of Europe, northern Africa and western Asia, also called garden forget-me-not,
  not a tall herb and not a herb from the Americas.
examples:
- The Myosotis sylvatica in the border had small blue flowers.
- We planted Myosotis sylvatica along the shady path.
