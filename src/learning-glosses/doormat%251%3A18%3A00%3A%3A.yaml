simpleMeaning: a person who is weak in body and has little effect on what happens around them
scope: 'Also called weakling and wuss: a weak person with little effect, not the mat by a door for cleaning
  shoes.'
examples:
- In the team he was a doormat, too weak to lift the boxes and too quiet to be heard.
- The new worker was treated as a doormat because he was frail and his words had no effect.
