senseId: 'scsi%1:06:00::'
synsetId: 04252346-n
simpleMeaning: A standard link between a computer and the things joined to it, used in some computers.
scope: Small computer system interface is another name for this sense; this is a standard link for joining
  outside parts to a computer, not a way of joining two computers to each other.
examples:
- The printer was joined to the computer by SCSI.
- This old machine still uses a SCSI link for its hard drive.
