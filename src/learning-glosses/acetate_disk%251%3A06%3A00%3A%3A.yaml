simpleMeaning: a flat round plate with a coat of plastic made from plant fibre
scope: This is a round plate coated with a plant-based plastic, also called a phonograph recording disk;
  not a plain paper record sleeve and not a metal plate.
examples:
- The old acetate disk still played after fifty years.
- She found an acetate disk in the attic.
