simpleMeaning: a tiny part inside a cell that holds the things that speed up the work that makes the cell's
  power
scope: A tiny part inside a cell that makes the cell's power; mitochondrion is another name for this sense,
  not the whole cell and not the cell's outer skin.
examples:
- Each chondriosome in the cell helps make power.
- The chondriosome in each cell makes the power the cell needs to work.
