simpleMeaning: In American football, a position on the line where each play starts, for a player at either
  outer edge of the defensive line.
scope: This is not the last part or tip of something and not an aim; it is only the football position.
examples:
- He played end for the college team for three seasons.
- As an end, he spent most of the game blocking and rushing the passer.
