simpleMeaning: A quick-drying paint for the finger and toe tips, to give them colour or a shine.
scope: A quick-drying paint for the finger and toe tips; nail polish and nail varnish are other names
  for this, and it is not a paint for walls or a hand cream.
examples:
- She put on red nail enamel.
- The nail enamel dried in minutes.
