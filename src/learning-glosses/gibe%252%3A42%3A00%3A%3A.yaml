simpleMeaning: to be alike or agree, fit well together without going against each other, and match in
  their features and details
scope: This is the verb sense where things match or agree, also called agree, match, check, fit, correspond,
  tally, and jibe. It is not the noun sense of a sharp, angry remark aimed at a person.
examples:
- His account does not gibe with the facts.
- The two reports gibe with each other in most details.
