simpleMeaning: the young form of an insect that builds a hard cover around its body to keep safe
scope: The young form of an insect that builds a cover around its body, not a grown insect and not a worm
  that lives in the ground.
examples:
- The caseworm built its cover from bits of leaves.
- A caseworm hung from the branch inside its hard cover.
