simpleMeaning: to say words aloud in a singing voice, as in a chant or a prayer song
scope: To say words aloud in a singing voice, as in a chant or a prayer song; chant, intone and intonate
  are other names for this sense, not plain speaking and not singing a tune without words.
examples:
- The rabbi cantillated the prayer at dusk.
- The choir cantillated the psalm in turn.
