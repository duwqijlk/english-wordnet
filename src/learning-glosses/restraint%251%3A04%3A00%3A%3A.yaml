simpleMeaning: The act of holding a person or thing back so it cannot move or act freely
scope: The act of holding a person or thing back, not a device fitted to slow or stop movement.
examples:
- The guard's restraint of the prisoner lasted all night.
- Restraint of trade is against the law in this country.
