simpleMeaning: A tree of low land near the sea in the south-east of the United States, with shiny leaves
  and bunches of sweet-smelling white flowers
scope: A tree of low land near the sea in the south-east United States; buckwheat tree is another name
  for this sense, and not the shrubby tree of eastern North America with sour leaves.
examples:
- The titi grows in low land near the coast.
- White flowers covered the titi in spring.
