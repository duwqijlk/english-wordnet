simpleMeaning: information, facts or remarks that cannot be understood because they are irrelevant or
  meaningless
scope: Meaningless or irrelevant information that blocks understanding, not unwanted sound, a loud public
  complaint, or electrical interference.
examples:
- His report was mostly noise, full of figures that had nothing to do with the question.
- 'The interview was noise: irrelevant facts and empty remarks that hid the real issue.'
