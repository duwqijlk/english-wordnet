simpleMeaning: People are trusted to act in a fair way and not to cheat others
scope: This is a way of behaving where people are trusted not to cheat, not a set of written rules with
  punishments and not a test of honesty.
examples:
- The students are on the honor system.
- Under the honor system, pupils mark their own work.
