simpleMeaning: Parts that must take a hard pull without breaking and not wear away in air and water are
  made from this mix of copper and a light metal.
scope: The name aluminium bronze means the same hard mix.
examples:
- The builder chose aluminum bronze for the gate hinges that take a hard pull.
- Pipes of aluminum bronze showed no wear in damp air.
