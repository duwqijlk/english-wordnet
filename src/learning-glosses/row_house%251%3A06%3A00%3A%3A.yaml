simpleMeaning: one of a line of homes built side by side, all the same and sharing walls between them
scope: 'Also called a town house: one of a line of homes built side by side that share walls, not a single
  home standing alone and not a block of flats.'
examples:
- We bought a row house with a small garden at the back.
- Their row house shares a wall with the neighbours on both sides.
