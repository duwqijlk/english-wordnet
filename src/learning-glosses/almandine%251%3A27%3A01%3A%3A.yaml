simpleMeaning: a deep red stone used as a gem, of the kind called garnet, made of iron, aluminium, silicon
  and oxygen
scope: This is a deep red gem stone of the garnet kind, with almandite as another name for this sense,
  and not a ruby or any other red stone.
examples:
- The ring was set with a large almandine.
- She chose an almandine for the center of the necklace.
