simpleMeaning: The situation around a process that affects how well it works or how it ends.
scope: This is not about someone's living standards or well-being; it is about the setting in which a
  process or activity happens.
examples:
- The experiment was repeated under the same conditions.
- Weather conditions made the flight dangerous.
