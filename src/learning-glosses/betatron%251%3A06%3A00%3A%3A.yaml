simpleMeaning: By using the force made when a magnetic field keeps changing, this machine drives a steady
  stream of tiny charged bits to high speeds.
scope: Induction accelerator is another name for this machine, which uses a changing magnetic field to
  drive tiny charged bits to high speeds.
examples:
- The betatron sped up the stream of electrons to great speed.
- Scientists used the betatron to push the tiny charged bits faster.
