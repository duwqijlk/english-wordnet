simpleMeaning: The black opening in the middle of the eye grows smaller when a person takes this medicine
scope: 'Also called miotic, myotic or a myotic drug: a drug that makes the black opening in the middle
  of the eye grow smaller, not a drug that makes it grow larger.'
examples:
- The nurse gave him a miotic drug to narrow the pupil.
- This miotic drug makes the pupil smaller for a few hours.
