simpleMeaning: A Roman Catholic order begun by Saint Ignatius Loyola in 1534 to defend Catholicism against
  the Reformation and do mission work among non-Christians, strongly tied to teaching and study.
scope: Not the Franciscans or the Dominicans, other Catholic orders; also called the Jesuit order.
examples:
- He joined the Society of Jesus after college.
- The Society of Jesus runs schools all over the world.
