simpleMeaning: Shaken with water, these plant substances make a soapy foam, and go into cleaners, foaming
  agents, and things that mix oil and water.
scope: A plant substance that makes a soapy foam in water, used in cleaners.
examples:
- When saponin is mixed and shaken with water, it forms a soapy lather.
- Makers put saponin in detergents to make them foam.
