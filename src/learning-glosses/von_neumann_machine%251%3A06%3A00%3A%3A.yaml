simpleMeaning: Any digital computer that keeps its programs in store and counts through them in order,
  as first set out in 1946.
scope: Any digital computer of this stored-program kind, whatever its size or use, in which programs are
  kept in store and run through in order, as first set out in 1946.
examples:
- The von Neumann machine stores its programs in memory.
- A von Neumann machine runs one step at a time.
