simpleMeaning: Strong string made of three strands, used to sew or tie up parcels
scope: Strong string of three strands for sewing or tying parcels; not ordinary thread for clothes and
  not rope for heavy loads.
examples:
- She tied the parcel with packthread.
- The shopkeeper cut a length of packthread for the box.
