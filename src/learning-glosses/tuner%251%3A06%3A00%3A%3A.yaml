simpleMeaning: An electronic device that picks up signals sent through the air, picks out the sound part
  and makes it stronger
scope: Also called radio, wireless, radio receiver, radio set and receiving set, this is the electronic
  device, not a person who tunes a musical instrument.
examples:
- He bought a new tuner to listen to radio stations at home.
- She turned on the tuner and listened to the news.
