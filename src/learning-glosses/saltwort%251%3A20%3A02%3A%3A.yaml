simpleMeaning: People burn this bushy plant to make rough soda ash; it grows on marshes by the sea and
  sea beaches of Europe, Asia, and Africa, with prickly leaves
scope: A bushy plant of marshes by the sea and sea beaches, also called barilla, glasswort, kali and kelpwort,
  not the low strong-smelling coastal bush of the warm Americas.
examples:
- Saltwort was burned to make rough soda ash.
- The saltwort had prickly leaves.
