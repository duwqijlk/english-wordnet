senseId: 'farsightedness%1:26:00::'
synsetId: 14577603-n
simpleMeaning: A wrong state where sight for far things is better than for near things.
scope: A wrong state where sight for far things is better than for near things; also called hypermetropia,
  hypermetropy, hyperopia, or longsightedness; not a lessened power to fix on near things, brought on
  by loss of spring in the eye's lens after age 45.
examples:
- Their farsightedness blurred the book.
- The farsightedness was plain in the test.
