simpleMeaning: A Mexican orchid that grows on trees, with pale green or yellow-green flowers and a white
  lip marked with purple veins
scope: An orchid that grows on trees, not a ground orchid and not a garden flower; also called butterfly
  orchid, butterfly orchis and Epidendrum venosum.
examples:
- Encyclia venosa grew on the tree in the warm forest.
- The Encyclia venosa had pale green flowers with a purple-veined lip.
