simpleMeaning: A clear, deadly, eating-away liquid made by the work of sulphuric acid on calcium fluoride,
  whose watery mixes are hydrofluoric acid.
scope: 'A factory chemical: a corrosive liquid whose water solution is hydrofluoric acid.'
examples:
- Hydrogen fluoride is a deadly liquid.
- Hydrogen fluoride in water is hydrofluoric acid.
