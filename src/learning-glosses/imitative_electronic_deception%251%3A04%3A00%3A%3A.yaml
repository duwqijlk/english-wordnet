simpleMeaning: The other side's systems get fake signals that look like their own, because energy in the
  form of waves has been sent into them
scope: Putting fake signals into the other side's systems, also called electronic imitative deception;
  not a real attack that breaks the systems and not the other side's own signals.
examples:
- Imitative electronic deception can fool a radar into seeing planes that are not there.
- The unit used imitative electronic deception to copy the enemy's radio signals.
