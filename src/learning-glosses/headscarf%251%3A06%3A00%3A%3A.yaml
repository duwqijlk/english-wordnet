simpleMeaning: a piece of cloth worn over the head and tied under the chin
scope: A cloth that covers the head and is tied under the chin, not a hat and not a scarf worn around
  the neck.
examples:
- She wore a blue headscarf tied under her chin.
- The old woman's headscarf kept her hair covered in the wind.
