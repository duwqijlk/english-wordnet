senseId: 'calcitonin%1:08:00::'
synsetId: 05420808-n
simpleMeaning: Bone stops being taken back into the body, and the calcium in the liquid part of the blood
  tends to fall, under this hormone from the thyroid.
scope: This hormone from the thyroid that brings down blood calcium is also called thyrocalcitonin, not
  a hormone that raises the calcium in the blood.
examples:
- Calcitonin helped bring down the calcium in his blood.
- With calcitonin, the calcium in her blood fell.
