simpleMeaning: The law will not let this lager be sold as beer, because it has too much alcohol in it
scope: Also called malt, this is a strong drink with so much alcohol that the law bars it from sale as
  beer, not an ordinary beer and not a spirit.
examples:
- The malt liquor on the shelf was far stronger than the regular beer.
- He bought a bottle of malt liquor, which the law does not count as beer.
