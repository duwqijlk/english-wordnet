simpleMeaning: A drug given by needle, one of the cephalosporins, a family of drugs that kill germs, used
  for bad infections of the lungs, throat, ears or water passage.
scope: A drug given by needle for severe infections of the lungs, throat, ears or water passage; also
  called ceftriaxone.
examples:
- Rocephin cleared the severe infection in his lungs.
- The doctor gave her Rocephin for an ear infection.
