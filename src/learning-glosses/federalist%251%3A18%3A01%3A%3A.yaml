simpleMeaning: This person wanted a strong central federal government, and belonged to a political party
  of the past in the United States.
scope: A person who belonged to a past political party in the United States that wanted a strong central
  federal government; not a member of a party of today.
examples:
- He was a Federalist who wanted a strong central government.
- She joined the Federalists because she wanted a strong central government.
