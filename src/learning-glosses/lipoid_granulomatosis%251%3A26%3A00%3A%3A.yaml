simpleMeaning: Yellow lumps show up over much of the body, most of all on the elbows and knees, in a state
  that often goes with the body mishandling fat.
scope: This state, in which yellow lumps show up over much of the body, most of all on the elbows and
  knees, and the body often mishandles fat, is also called cholesterosis cutis, lipid granulomatosis,
  xanthoma multiplex, and xanthomatosis.
examples:
- The yellow lumps of lipoid granulomatosis were worst on the elbows and knees.
- Yellow lumps all over the body pointed to lipoid granulomatosis.
