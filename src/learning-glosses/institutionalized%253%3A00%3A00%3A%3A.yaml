simpleMeaning: put in a special place by an official decision, for people with a particular need
scope: 'Also called institutionalised: this is about a person sent to live in such a place, not about
  a way of doing things becoming a fixed part of a system.'
examples:
- The institutionalized boy lived in a care home run by the city.
- After the court order, he joined the institutionalized young people at the centre.
