simpleMeaning: This man is not known by name, or his name is made up, and he is one side in a case in
  court.
scope: An unknown man, or a man with a made-up name, who is one side in a case in court, not a known man
  and not Jane Doe, the woman of the same kind.
examples:
- The John Doe in the case refused to give his name.
- John Doe was listed as a party to the court case.
