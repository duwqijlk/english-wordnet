simpleMeaning: to train a person or animal so that a particular response becomes automatic whenever a
  signal is given.
scope: This is the technical psychology sense; it is not the general sense of training a child or animal
  to behave well.
examples:
- Pavlov conditioned dogs to salivate when they heard a bell.
- The rats were conditioned to fear the light.
