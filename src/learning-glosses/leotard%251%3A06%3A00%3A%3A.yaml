simpleMeaning: Tight stretchy clothing covering the body from shoulders to thighs, sometimes with long
  sleeves or legs to the ankles; worn by ballet dancers and acrobats for practice or performance.
scope: 'Another name for body suit, cat suit and unitard: the tight stretchy garment that dancers and
  acrobats wear for practice or performance.'
examples:
- She rehearsed in a black leotard and soft shoes.
- He pulled on a leotard and tights before the show.
