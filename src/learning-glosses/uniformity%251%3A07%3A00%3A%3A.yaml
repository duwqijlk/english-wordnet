simpleMeaning: the quality of being all the same, with no change or difference between parts, even to
  a point where it becomes boring
scope: All things being the same in this way, not matching clothes worn by a group and not people agreeing
  with each other.
examples:
- The uniformity of the houses made the whole street look dull.
- He disliked the uniformity of school meals, with the same food each day.
