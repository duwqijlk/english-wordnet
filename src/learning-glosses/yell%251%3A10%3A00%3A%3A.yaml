simpleMeaning: A loud voiced outburst, often expressing objection or resistance.
scope: 'Another name for shout, call and cry: a loud spoken outburst, often of protest, not the wordless
  cry of strong feeling or the verb for shouting loudly.'
examples:
- A yell of protest came from the back of the hall.
- The crowd's yell drowned out the speaker.
