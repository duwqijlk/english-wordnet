simpleMeaning: A soft metal, silver-white or yellowish, of the alkali metal group; it turns yellow in
  the air and is found in celestite and strontianite.
scope: Also called Sr and strontium; a soft metal of the alkali metal group, not a hard metal of the same
  group.
examples:
- Atomic number 38 is a soft metal that turns yellow in the air.
- The sample of atomic number 38 was found in celestite.
