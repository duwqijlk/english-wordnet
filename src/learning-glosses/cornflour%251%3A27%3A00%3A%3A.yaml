simpleMeaning: Starch made from the grains of maize, used in cooking to make liquids thicker.
scope: This is starch made from the grains of maize, used in cooking to make liquids thicker; cornstarch
  is another name for this sense, not flour made from wheat and not sugar.
examples:
- She stirred cornflour into the sauce to thicken it.
- Cornflour is made from the grains of maize.
