simpleMeaning: Any of several birds from the Australian lands whose males build fancy structures like
  bowers to draw in females.
scope: Also called bowerbird, any of several Australian birds whose males build fancy bowers to draw in
  females; not the North American songbird whose call sounds like a cat's mewing.
examples:
- The male catbird built a bower of sticks and bright shells.
- Catbirds from Australia build bowers to draw in females.
