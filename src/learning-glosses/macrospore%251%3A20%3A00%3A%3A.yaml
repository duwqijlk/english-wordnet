simpleMeaning: The larger of the two kinds of tiny seed-like cells some plants make; it grows in the seed
  case into the female part that can make a new plant
scope: The larger of the two kinds of tiny seed-like cell in some plants, not the smaller kind and not
  a seed; megaspore is another name for this sense.
examples:
- The macrospore grows inside the ovule of the plant.
- Each macrospore can grow into the female part that makes seeds.
