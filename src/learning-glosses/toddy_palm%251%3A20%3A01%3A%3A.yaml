simpleMeaning: One fishtail palm of India and Malaya, its sap giving brown sugar, jaggery, and trunk pith
  giving sago.
scope: Also called jaggery palm, kittul, kitul, kitul tree, and wine palm, this is one fishtail palm of
  India and Malaya, its sap giving brown sugar, jaggery, and trunk pith giving sago, where jaggery palm
  is a palm of fishtail type, India and Malaya, its sap giving brown sugar, its trunk's soft core giving
  sago, kittul is a palm of fishtail type, India across to Malaya, its sap giving brown sugar called jaggery,
  its soft trunk core yielding sago, kitul is a palm of fishtail type found in India and Malaya, its sap
  yielding jaggery, brown sugar, sago coming from its trunk pith, and kitul tree is a fishtail-type palm
  growing in India and Malaya, its sap yielding jaggery, brown sugar, its trunk core yielding sago, unlike
  the sense for a tall fan palm of Africa and India and Malaysia yielding a hard wood and sweet sap that
  is a source of palm wine and sugar, with leaves used for thatching and weaving.
examples:
- The toddy palm grows in India.
- Toddy palms give sago.
