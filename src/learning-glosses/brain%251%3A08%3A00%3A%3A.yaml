simpleMeaning: the main organ of your nervous system, inside your skull and joined to your spinal cord,
  that controls your body and thoughts.
scope: This is not the mind or your ability to reason; it is the physical organ inside the head.
examples:
- The brain needs oxygen to keep working.
- The scan showed damage to the brain.
