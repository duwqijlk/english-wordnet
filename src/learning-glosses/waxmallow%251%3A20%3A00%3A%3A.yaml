senseId: 'waxmallow%1:20:00::'
synsetId: 12204612-n
simpleMeaning: bright bells, drooping like hibiscus flowers still half shut, hang from any of several
  plants of the group Malvaviscus
scope: Also called sleeping hibiscus or wax mallow; a plant with drooping bright flowers shaped like bells,
  like hibiscus buds still half shut, not a hibiscus itself.
examples:
- The waxmallow's bright flowers hung down like half-open hibiscus buds.
- We planted a waxmallow by the wall for its drooping bells.
