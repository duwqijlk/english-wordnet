simpleMeaning: Large shrub from tropical Africa and Asia with hand-shaped leaves and spiny capsules whose
  seeds yield a thick oil and the poison ricin; now widely spread through the tropics.
scope: Another name for the same tropical shrub, also called the castor-oil plant; not the seed known
  as a castor bean.
examples:
- The castor bean plant produces spiny capsules that split open to release its seeds.
- Every seed of the castor bean plant contains ricin, a powerful poison.
