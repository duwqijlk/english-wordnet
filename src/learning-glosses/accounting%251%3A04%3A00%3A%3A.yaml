simpleMeaning: the job of keeping a business's money records in order, checking them, and writing reports
  about its money
scope: This is the job of keeping and checking a business's money records, not a list of debits and credits
  and not an explanation of why something happened.
examples:
- She works in accounting for a small firm.
- He studied accounting before he took the job.
