simpleMeaning: A hard metal mix with a good deal (10-14%) of a grey metal in it, standing up well to wear
  and shock
scope: Also called austenitic manganese steel; a hard metal mix with much grey metal in it, not plain
  iron and not a soft metal.
examples:
- Manganese steel is used for railway points.
- The crusher jaws are made of manganese steel.
