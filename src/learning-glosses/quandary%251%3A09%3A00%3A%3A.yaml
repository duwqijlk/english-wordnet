senseId: 'quandary%1:09:00::'
synsetId: 05693891-n
simpleMeaning: a state of not knowing what to do, especially when you must pick between two choices that
  are both bad
scope: 'Also called dilemma: a state of not knowing what to pick when both choices are bad, not just any
  small doubt or worry.'
examples:
- Faced with two bad roads home, she was in a quandary about which one to take.
- 'The town was in a quandary: cut the bus service or close the library.'
