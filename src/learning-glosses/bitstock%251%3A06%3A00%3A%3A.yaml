simpleMeaning: A woodworker's tool with a bent handle for turning and a holder for the cutting part that
  bores holes.
scope: A woodworker's tool with a bent handle and a holder for the cutting part; brace is another name
  for this sense, not a power drill and not a simple hand drill with a straight handle.
examples:
- He turned the bitstock to bore a hole in the beam.
- The bitstock sat beside the chisels on the bench.
