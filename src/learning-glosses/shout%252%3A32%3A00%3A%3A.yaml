simpleMeaning: To speak in a loud voice, often as a person's usual way of talking.
scope: Loud speech, often a person's normal manner, rather than one sudden loud cry or a brief exclamation
  of surprise, horror or joy.
examples:
- Grandma shouts when she talks on the phone.
- You don't have to shout; I'm right here.
