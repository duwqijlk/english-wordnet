simpleMeaning: to change a thing so that what is wrong with it is put right and it works better
scope: To change a thing so that what is wrong with it is put right; not the campaign to put right abuses,
  and not getting a person to give up a wrong life.
examples:
- They reformed the health system in this country.
- She worked to reform the old school rules.
