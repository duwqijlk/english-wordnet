simpleMeaning: a part of applied maths that deals with gathering and making sense of numbers, and with
  using chance to guess facts about a whole group of people or things
scope: A branch of maths that works with numbers, not the numbers themselves and not a single study of
  chance.
examples:
- She took a course in statistics to learn how to study survey results.
- Statistics helps doctors guess how well a new drug will work for many people.
