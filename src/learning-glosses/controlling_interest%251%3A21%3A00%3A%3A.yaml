simpleMeaning: owning more than half of the shares of a firm that carry a vote
scope: Owning more than half of a firm's voting shares, enough to decide its course, not a small stake
  and not mere day-to-day management.
examples:
- With a controlling interest in the firm, she could pick the board.
- He bought a controlling interest so the firm would follow his plans.
