simpleMeaning: often not doing as one is told, and going against what others want or say, as a habit
scope: 'Also called willful and headstrong: a person who, as a habit, does not do as they are told and
  goes against others; not just doing one thing on purpose once.'
examples:
- The wilful child would not follow any rule at school.
- He is a wilful young man who always goes against his teachers.
