simpleMeaning: the top part of a parachute that fills with air and looks like an umbrella
scope: This sense is the top part of a parachute; it is not a cloth roof over an area, and not the clear
  cover over the front part of a plane.
examples:
- The parachute canopy opened and filled with air above him.
- She checked the canopy for tears before packing the parachute.
