simpleMeaning: A compass points at two spots on Earth, and a line that is not real runs through them
scope: An imaginary line through both magnetic poles of the Earth, not a real line on the ground and not
  the line through the north and south geographic poles.
examples:
- The magnetic meridian runs through both magnetic poles of the Earth.
- On the old chart, the magnetic meridian was drawn from pole to pole.
