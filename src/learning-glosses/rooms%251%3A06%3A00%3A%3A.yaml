simpleMeaning: A place to live that is several spaces joined together as one home, for example in a hotel
scope: Another name for this sense is suite. It is a set of joined spaces used as a home, as in a hotel,
  not one single space on its own.
examples:
- Their hotel rooms included a bedroom and a small sitting area.
- The rooms they rented as one home had a kitchen and two bedrooms.
