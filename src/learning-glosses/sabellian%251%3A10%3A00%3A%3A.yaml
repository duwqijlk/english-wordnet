simpleMeaning: A dead tongue of old Italy, of the Osco-Umbrian group, known only from a few short texts
  cut in stone
scope: Osco-Umbrian and Sabellian language are other names for this sense, and it is set apart from living
  tongues of Italy by having no living speakers.
examples:
- Sabellian survives only in a few short texts cut in stone.
- Scholars read Sabellian in old writing from ancient Italy.
