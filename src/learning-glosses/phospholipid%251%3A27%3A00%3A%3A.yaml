simpleMeaning: A key part of the thin skins round cells is any of several kinds of compound made of oily
  acids, an acid that holds phosphorus, and a base with nitrogen.
scope: Any of several compounds made of oily acids, an acid that holds phosphorus, and a base with nitrogen,
  a key part of the thin skins round cells.
examples:
- Phospholipids form part of the thin skin round each cell.
- The phospholipid in the sample came from the thin skin round the cell.
