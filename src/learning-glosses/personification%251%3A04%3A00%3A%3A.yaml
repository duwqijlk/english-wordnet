simpleMeaning: Ideas and other things that are not human are given human traits
scope: 'Another name for incarnation: ideas and things that are not human are given human traits, not
  just said to be like a person.'
examples:
- The poet's personification of death as a kind old man made the poem gentle.
- Her personification of the wind as a wild singer runs through the whole story.
