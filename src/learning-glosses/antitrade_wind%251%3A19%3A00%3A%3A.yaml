simpleMeaning: a stream of air in the warm lands near the equator that moves from west to east high above
  the air below that blows the other way
scope: 'Another name for antitrade: winds that blow from west to east above the trade winds, not the trade
  winds themselves and not the winds near the ground.'
examples:
- The antitrade wind carried the balloon eastward across the tropics.
- An antitrade wind blows from west to east high above the trade winds.
