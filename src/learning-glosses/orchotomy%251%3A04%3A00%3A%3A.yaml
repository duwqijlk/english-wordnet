simpleMeaning: A cut made by a doctor into a man's testis to take a sample for tests, as when the number
  of sperm is very low
scope: A doctor's cut into the testis to take a sample for tests, not the removal of the testis and not
  a cut made for another reason.
examples:
- The doctor did an orchotomy to take a sample for tests.
- An orchotomy may be done when the number of sperm is very low.
