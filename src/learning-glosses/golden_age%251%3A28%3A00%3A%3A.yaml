simpleMeaning: In Greek and Roman stories, the first and best time of the world, full of joy, wealth and
  goodness; by extension, any time when a thing flowers and stands out
scope: The first and best time in old Greek and Roman stories, or any time of full flowering, not a real
  past time in history.
examples:
- The Golden Age was a time of joy and goodness in the old stories.
- Her youth was a Golden Age for the town's music.
