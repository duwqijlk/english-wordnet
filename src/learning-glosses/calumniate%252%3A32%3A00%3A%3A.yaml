simpleMeaning: to say false things about a person to harm them, and to spoil how other people think of
  them
scope: 'Also called smear, sully, slander, besmirch, defame, denigrate and asperse: to make false claims
  that harm a person''s good name, not to accuse someone truly or to give honest criticism.'
examples:
- The paper tried to calumniate the mayor with false claims about her past.
- His rivals calumniated him to hurt his good name.
