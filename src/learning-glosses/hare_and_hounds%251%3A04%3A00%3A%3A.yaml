simpleMeaning: One group runs ahead dropping bits of paper as a scent while another group chases them
  to catch them before the set spot, in an outdoor game.
scope: It is also called paper chase, and it is an outdoor game in which one group runs ahead dropping
  paper while another group chases them.
examples:
- The children played hare and hounds.
- In hare and hounds, the hares dropped bits of paper for the hounds to follow.
