simpleMeaning: Creeping animals that died out long ago, taking in the dinosaurs, the plesiosaurs, the
  pterosaurs, the ichthyosaurs, and the thecodonts.
scope: It is also called archosaur and archosaurian, and it names the creeping animals that died out long
  ago, taking in the dinosaurs, the plesiosaurs, the pterosaurs, the ichthyosaurs, and the thecodonts,
  not the creeping animals alive today.
examples:
- The dinosaurs were archosaurian reptiles, long-dead creeping animals.
- The archosaurian reptiles died out long before people lived.
