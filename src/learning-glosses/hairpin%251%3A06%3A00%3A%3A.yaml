simpleMeaning: A thin pin bent back on itself, with two prongs, that keeps a woman's hair in place
scope: A two-pronged pin that keeps hair in place; not a pin worn for show on clothes, and not a pin that
  holds papers.
examples:
- She fixed her bun with a hairpin.
- A hairpin slipped from her hair onto the floor.
