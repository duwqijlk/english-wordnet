simpleMeaning: To study a thing closely by splitting it into its parts, as in maths, chemistry, or grammar,
  to find what matters most about it.
scope: To study a thing by splitting it into its parts; analyze, dissect, and analyse are other names
  for this sense, not smashing a thing and not breaking up a meeting.
examples:
- The teacher asked us to break down the sentence into its parts.
- Scientists break down the compound to see what it is made of.
