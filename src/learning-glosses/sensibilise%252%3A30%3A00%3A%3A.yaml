simpleMeaning: to make someone notice and feel things that they did not notice before
scope: To make someone notice and feel things they did not notice before; sensibilize, sensify, sensitise
  and sensitize are other names for this act, not causing a thing to sense light and not making a person
  react to a drug.
examples:
- The talk sensibilised us to the problem.
- Travel sensibilised him to other ways of life.
