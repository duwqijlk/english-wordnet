simpleMeaning: a tool with a sharp point, used to mark wood or metal where it will be cut
scope: This is the sharp tool for marking wood or metal, not the person whose job is to copy papers by
  hand and not the act of marking a line.
examples:
- He used a scribe to mark the wood before he cut it.
- She drew a thin line on the metal with a scribe.
