senseId: 'secretory_phase%1:28:00::'
synsetId: 15314444-n
simpleMeaning: 'The second half of the menstrual cycle, after an egg is released: a temporary gland releases
  progesterone to prepare the womb lining for a fertilized egg; without one, bleeding starts.'
scope: Another name for that same second half of the cycle; it is not the first half, when an egg matures,
  and luteal phase means the same thing.
examples:
- During the secretory phase, the womb lining is prepared for a possible pregnancy.
- If no embryo implants, the secretory phase ends in bleeding.
