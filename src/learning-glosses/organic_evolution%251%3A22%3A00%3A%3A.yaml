simpleMeaning: In biology, the change of a kind of living thing, or a group of them, through a set of
  steps over time
scope: 'In biology, also called evolution, phylogenesis, or phylogeny: the change of living kinds over
  time, not a sickness of the body and not a theory about how life works.'
examples:
- Organic evolution shaped the finch into many kinds.
- The book traces organic evolution from the first small sea life.
