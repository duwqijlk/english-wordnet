simpleMeaning: A small yellow spot in the middle of the retina, the layer at the back of the eye, full
  of cone cells that give sharp, clear sight.
scope: A small yellow spot in the middle of the retina that gives sharp sight, also called macula lutea,
  macular area, or yellow spot, not the whole retina and not the blind spot.
examples:
- The macula lets us read fine print.
- Damage to the macula makes the centre of sight go dim.
