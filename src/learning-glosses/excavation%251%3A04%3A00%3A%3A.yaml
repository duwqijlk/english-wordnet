simpleMeaning: the act of taking coal, stone with metal in it, and other such things out of the earth
scope: 'Also called mining: the act of taking things out of the earth, not a hole in the ground made by
  digging.'
examples:
- Excavation of coal from the deep mine took many workers and machines.
- The excavation of stone with metal in it went on for years at this place.
