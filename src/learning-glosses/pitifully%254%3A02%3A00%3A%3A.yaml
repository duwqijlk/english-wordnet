simpleMeaning: to a very great and sad point, in a way that makes people feel sorry
scope: About how bad or how small something is, in a sad way; it is not about feeling sorry for a person.
examples:
- Wages were pitifully low for such hard work.
- The team played pitifully and lost by a very large score.
