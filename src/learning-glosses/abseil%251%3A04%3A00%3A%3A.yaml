simpleMeaning: on a rope folded double, tied to a point above and wound round the body, a way of getting
  down a steep rock face or wall in climbing
scope: It is also called rappel, and it is the name for going down a steep rock face or wall on a rope,
  not for climbing up it.
examples:
- The climbers made an abseil down the steep wall.
- The abseil began at the top of the cliff.
