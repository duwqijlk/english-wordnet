synsetId: 01731369-v
simpleMeaning: To bring back a tune heard earlier in a piece of music, and play it again.
scope: To play an earlier tune again in a piece of music, also called repeat or recapitulate, not to sing
  a whole song again.
examples:
- The orchestra will reprise the opening theme at the end.
- She reprised the first melody in the last part of the piece.
