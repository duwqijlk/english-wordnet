simpleMeaning: In a fixed, unchanging way.
scope: This sense is also called unalterably and unchangeably, for a fixed, unchanging way, unlike the
  sense for a set, unchanging way, and unlike the sense for a firm, unchanging way.
examples:
- They spoke unassailably, in a fixed way.
- They stood unassailably, unchanging.
