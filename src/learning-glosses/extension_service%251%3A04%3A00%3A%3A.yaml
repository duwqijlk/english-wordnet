simpleMeaning: classes and help given by a college or university to people who are not signed up as full
  students
scope: This is learning help from a college or university for people outside its full student body, also
  called extension; not a course for full students and not a club run by students.
examples:
- She took a gardening class through the extension service.
- The local extension service offers free talks on farming.
