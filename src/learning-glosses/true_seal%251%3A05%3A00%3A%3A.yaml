senseId: 'true_seal%1:05:00::'
synsetId: 02082041-n
simpleMeaning: A seal whose ears lack outer flaps, whose coat is stiff and bristly, and whose hind legs
  serve as flippers for swimming.
scope: 'Another name for earless seal and hair seal: seals with no outer ear flaps, a stiff coat and hind
  flippers for swimming. Not an eared seal such as a sea lion, which has small ear flaps, nor a walrus,
  which has tusks.'
examples:
- True seals include the harbour seal, the grey seal and the elephant seal.
- A true seal swims by sweeping its hind flippers from side to side.
