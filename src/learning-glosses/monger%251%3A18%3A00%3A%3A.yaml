simpleMeaning: a person who buys goods and keeps a stock of them to sell
scope: 'Also called trader, dealer and bargainer: a person who buys and keeps goods to sell, not a person
  who makes goods and not a buyer for their own use.'
examples:
- The monger kept a large stock of cloth to sell.
- As a monger, he bought grain and held it until buyers came.
