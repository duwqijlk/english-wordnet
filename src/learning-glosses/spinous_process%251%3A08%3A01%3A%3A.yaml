simpleMeaning: a part of a back bone that sticks out and holds muscles and the cords that join bone to
  bone in place
scope: A part of a back bone that sticks out and holds muscles and cords in place; not the whole back
  bone and not a soft pad between bones.
examples:
- The spinous process of each vertebra can be felt along the back.
- A sore spinous process made it hard for her to bend.
