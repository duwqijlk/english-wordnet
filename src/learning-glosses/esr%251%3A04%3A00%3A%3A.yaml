simpleMeaning: A way of studying matter with very short radio waves, in which a weakly magnetic substance
  takes in rays at set points.
scope: 'Also called electron paramagnetic resonance and electron spin resonance: a way of studying matter
  with very short radio waves, not the blood test that measures how fast red cells settle.'
examples:
- The lab used ESR to study the sample.
- ESR showed how the substance took in the rays.
