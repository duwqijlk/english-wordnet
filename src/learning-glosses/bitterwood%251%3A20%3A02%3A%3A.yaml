simpleMeaning: a tree from the West Indies that gives a drug called Jamaica quassia
scope: A West Indian tree that gives a drug called Jamaica quassia, not the bitterwood tree with bitter
  wood and bark and not the large tropical bitterwood of the Americas.
examples:
- The bitterwood grew near the coast of Jamaica.
- Doctors once used bitterwood to make Jamaica quassia.
