simpleMeaning: Round the small tubes that carry blood lies a thin layer of tissue, and this word is said
  of that layer
scope: Said of the layer of tissue round the small tubes that carry blood, not of the tubes themselves
  and not of the blood inside them.
examples:
- The perithelial cells wrap around the tiny vessels.
- Damage to perithelial tissue can harm the small blood vessels.
