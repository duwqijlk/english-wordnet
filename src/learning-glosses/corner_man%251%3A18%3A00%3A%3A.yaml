schema: oewn-learning-gloss-v2
senseId: 'corner_man%1:18:00::'
synsetId: 10076527-n
simpleMeaning: a joker at one end of a line of performers in a minstrel show, who keeps up funny talk
  with the talker in the middle
scope: A joker at one end of a line of performers in a minstrel show; end man is another name for this
  sense, not the talker in the middle, and not any other singer in the line.
examples:
- The corner man traded jokes with the middle talker all night.
- As corner man, he sat at the end of the line in the minstrel show.
