simpleMeaning: a raised part in one place that is bigger than it should be and is not normal
scope: 'Also called a lump: a raised part in one place that is not normal. It is not a thing getting bigger
  when heated, and not any raised shape that sticks out from what is around it.'
examples:
- There was a swelling on his knee after he fell.
- The doctor looked at the swelling on her ankle.
