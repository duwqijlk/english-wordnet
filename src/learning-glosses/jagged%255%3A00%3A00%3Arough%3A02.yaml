simpleMeaning: With an edge cut into uneven points and gaps, as if it had been bitten away.
scope: An edge with uneven points and gaps, not a smooth edge and not a surface that is only rough to
  the touch.
examples:
- The jagged edge of the rock tore his sleeve.
- Jagged teeth of broken glass lined the window frame.
