simpleMeaning: of a baby, to grow the first teeth and have them push through the soft part inside the
  mouth
scope: This is about a baby growing its first teeth. It is not about an older child losing teeth, and
  not about pain in an adult's teeth.
examples:
- The baby is teething now and cries through the night.
- Our son teethed early and had two teeth by five months.
