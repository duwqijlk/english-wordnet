senseId: 'jaws_of_life%1:06:00::'
synsetId: 03599710-n
simpleMeaning: A tool worked by fluid pressure, pushed into a wrecked vehicle and used to force the wreck
  apart so people caught inside can be reached.
scope: A tool worked by fluid pressure, pushed into a wrecked vehicle and used to force the wreck apart
  so people caught inside can be reached; not a ladder, a hose, or a stretcher, which are other rescue
  gear.
examples:
- Firefighters used the Jaws of Life to free the driver.
- The Jaws of Life pried open the crushed door.
