simpleMeaning: A wave of energy tied to unseen forces of power and moving charge comes from a charged
  bit of matter that speeds up
scope: This wave, also called electromagnetic radiation and nonparticulate radiation, carries energy from
  a charged bit of matter that speeds up.
examples:
- Radio is an electromagnetic wave that carries sound through the air.
- The electromagnetic wave from the lamp travels at the speed of light.
