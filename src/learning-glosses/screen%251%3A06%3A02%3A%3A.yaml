simpleMeaning: A sieve-like tool that sorts lumps out of powder or grades particles by size.
scope: This is the tool that strains out lumps or grades particles, not the mesh guard fitted in a frame
  and not the act of sifting grain.
examples:
- Pass the flour through a screen to break up the lumps.
- The workers graded the gravel with a screen before mixing it.
