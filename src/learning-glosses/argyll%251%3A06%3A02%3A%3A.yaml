simpleMeaning: Hot water in a cup inside that comes out keeps the gravy warm in this covered jug, made
  of silver or another metal.
scope: Also called argyle, this is a covered jug for gravy with a cup inside holding hot water, not the
  diamond pattern of the same name.
examples:
- The argyll on the table kept the gravy warm.
- The gravy came from the argyll, still warm from the hot water inside.
