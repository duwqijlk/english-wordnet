simpleMeaning: connect a piece of electrical equipment to the earth, or to a wire that leads to it
scope: This is about electrical safety wiring, not about punishing a child, stopping an aircraft, crushing
  something into powder, hitting the ground, or bringing something down.
examples:
- The electrician grounded the metal casing to prevent a shock.
- Make sure the new outlet is properly grounded before you plug anything in.
