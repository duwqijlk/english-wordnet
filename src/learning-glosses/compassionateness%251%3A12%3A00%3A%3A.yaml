simpleMeaning: a deep sense of what another person feels in pain, with care for them
scope: A deep sense of another person's pain with care for them, also called compassion; not pity from
  a distance and not sorrow for oneself.
examples:
- Her compassionateness moved her to sit with the sick man.
- His compassionateness showed in the gentle way he spoke to the grieving family.
