simpleMeaning: A flowering plant with one seed leaf in the seed, whose stem grows by adding layers on
  its inside
scope: Endogen, monocot and monocotyledon are other names for this flowering plant with one seed leaf;
  it is not a plant with two seed leaves and not a plant without flowers.
examples:
- The liliopsid has a single seed leaf.
- Grasses are liliopsids, with stems that grow from the inside.
