simpleMeaning: Reports about what has happened reach papers by electronic means from this body that gathers
  them
scope: A body that gathers reports about what has happened and sends them out by electronic means to papers;
  news organisation, news organization, press agency and press association are other names for this sense,
  not a single paper and not a body that makes the news.
examples:
- The news agency sent the story to papers across the country.
- She works for a news agency that shares reports with papers by electronic means.
