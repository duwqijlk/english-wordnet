simpleMeaning: Giving a strong plant chemical that can poison yet is used as a medicine, this plant of
  North America bears big leaves and pale green-yellow flowers in long clusters.
scope: Also called white hellebore, a North American plant that gives a healing poison, not the bugbane
  whose flowers insects are said to dislike.
examples:
- The bugbane had big leaves and pale green-yellow flowers in long clusters.
- People use bugbane as a medicine, though its chemical can poison.
