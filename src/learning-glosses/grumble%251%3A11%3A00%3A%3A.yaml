simpleMeaning: A sound that rolls on without a stop, low and flat and loud
scope: Also called rumble, this is a long low noise, not a word of complaint and not the act of making
  such a sound.
examples:
- We heard a grumble of thunder roll across the sky.
- The grumble of the old truck filled the street.
