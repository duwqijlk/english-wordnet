simpleMeaning: Of a part of the body, grown smaller or weaker after illness, hurt, or long lack of use
scope: Of a part of the body grown smaller or weaker after illness, hurt, or lack of use, not the general
  sense of being made less and not the musical sense of a smaller interval.
examples:
- His arm was diminished after the long illness.
- Her legs were diminished and weak after years in bed.
