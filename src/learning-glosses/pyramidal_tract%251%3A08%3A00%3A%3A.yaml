senseId: 'pyramidal_tract%1:08:00::'
synsetId: 05499264-n
simpleMeaning: A bundle of motor nerve fibers on either side of the central nervous system, carrying movement
  signals from the cortex through the brainstem to spinal and cranial motor neurons.
scope: The nerve pathway carrying movement commands from the cortex down to motor neurons, also called
  the corticospinal tract; not the wider movement system it belongs to, and not connective tissue.
examples:
- Damage to the pyramidal tract can cause weakness on the opposite side of the body.
- The scan showed that the pyramidal tract was intact on both sides of the brainstem.
