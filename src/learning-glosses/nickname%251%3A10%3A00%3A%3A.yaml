simpleMeaning: a name people who know a person use for them, often a short form of their given name
scope: This is a name used for a person by people who know them, not the person's full given name itself
  and not the act of giving such a name.
examples:
- Everyone calls him Slim, but that is only his nickname.
- Her nickname at school was Bee, short for Beatrice.
