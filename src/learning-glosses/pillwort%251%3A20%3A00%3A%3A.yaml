simpleMeaning: With small round cases that hold its spores, this European water fern grows at the edges
  of waters or in wet sour earth.
scope: It is a European water fern of wet places, not a fern of dry ground.
examples:
- We found pillwort at the edge of the water.
- Its small round cases held the pillwort's spores.
