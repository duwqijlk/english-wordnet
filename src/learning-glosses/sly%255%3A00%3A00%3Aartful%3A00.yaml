simpleMeaning: good at tricking other people and at hiding what you are really doing
scope: 'Also called slick, tricky and cunning: this describes a person who is good at tricking others,
  not a person who is honest and open about what they do.'
examples:
- He gave a sly smile and hid the card behind his back.
- The sly salesman did not tell them about the extra cost.
