simpleMeaning: Stealing money or goods left in your care, though they belong to someone else.
scope: The dishonest taking of money or goods left in your care, also called defalcation and misappropriation;
  not open theft from a stranger.
examples:
- The clerk was charged with embezzlement of the firm's funds.
- Embezzlement came to light when the books were checked.
