simpleMeaning: Be of a certain height, measured from the ground, as when a person is said to be six feet
  tall.
scope: This is only about measured height, not about staying upright, refusing to yield, or holding an
  opinion on a question.
examples:
- The oak tree stands over thirty meters tall.
- He stands just under six feet in his boots.
