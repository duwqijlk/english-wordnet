simpleMeaning: a lamp with a wide beam of light made by people, not by nature, used for taking photos
scope: A wide lamp used for photos, not water rising over dry land, not water coming in with the tide,
  and not the act of filling with too much water.
examples:
- The photographer set up a flood on each side of the model.
- A bright flood lit the stage for the photo shoot.
