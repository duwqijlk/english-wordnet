simpleMeaning: A body substance in the liquid part of blood that turns into the tough threads of a clot
  when blood clots.
scope: A body substance in the liquid part of blood that turns into the tough threads of a clot when blood
  clots, not a blood cell and not the clot itself.
examples:
- Fibrinogen in the blood helps a cut to close.
- The lab measured the fibrinogen in her blood sample.
