simpleMeaning: Made in part or wholly of cotton or man-made fibre, this cloth has a smooth, shiny face
  like satin.
scope: Also called satinette, it is a cloth with a smooth face like satin, made in part or wholly of cotton
  or man-made fibre.
examples:
- The dress was sewn from satinet.
- The satinet shone like satin in the light.
