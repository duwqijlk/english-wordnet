simpleMeaning: Insecticide comes from this perennial Asian garden plant, which opens white to pink-purple
  blooms in spring above fragrant, finely divided leaves; sometimes classed with the chrysanthemums.
scope: Another name for the pyrethrum plant, not the insecticide of that name, the white-flowered Balkan
  plant, or the other plants also called painted daisy.
examples:
- Painted daisies opened white and deep pink along the border in May.
- Gardeners grow painted daisy for its bright spring flowers.
