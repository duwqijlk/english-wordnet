simpleMeaning: To be the same in the details, so that two things fit together and agree.
scope: To be the same in the details, so that two things fit together and agree, with agree, match, check,
  fit and correspond as other names for this sense, and not a point in baseball or the act of counting.
examples:
- The two stories don't tally in many details.
- The handwriting tallies with the signature on the form.
