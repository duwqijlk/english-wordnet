simpleMeaning: taxes, utility bills, and cover against loss are the running costs of a place kept in use,
  not its fall in worth, loan costs, or tax on money made
scope: The running costs of a place kept in use, not counting its fall in worth; overhead, operating cost
  and operating expense are other names for this sense.
examples:
- The budget items for the hall came to more than the rent.
- She listed taxes and light under budget items, not under repairs.
