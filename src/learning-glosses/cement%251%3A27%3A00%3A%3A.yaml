simpleMeaning: A powder for building, made by heating limestone and clay, that is mixed with water and
  sand or stones to make concrete and mortar
scope: A powder for building that is mixed with water to make concrete, not the hard bone-like stuff round
  a tooth root and not the flat hard ground by a pool.
examples:
- They mixed cement with water and sand to lay the floor.
- Bags of cement stood beside the building site.
