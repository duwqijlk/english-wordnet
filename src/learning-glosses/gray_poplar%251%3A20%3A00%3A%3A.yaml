simpleMeaning: From Europe, this large poplar now grows wild in other places; it grows fast, with leaves
  that have faint lobes and teeth and are pale underneath
scope: Also called grey poplar, this is a large fast-growing poplar from Europe, not a poplar of North
  America and not a small slow-growing tree.
examples:
- The gray poplar grew fast beside the river.
- A gray poplar's leaves are pale underneath.
