simpleMeaning: A bird that lives on or near water, with long wings and feet joined by skin, in the same
  group as gulls.
scope: A bird that lives on or near water, with long wings and feet joined by skin, in the same group
  as gulls; not a short-winged bird, and not a bird that lives only on land.
examples:
- A larid swept over the water on long wings.
- The larid used its webbed feet to swim over the water.
