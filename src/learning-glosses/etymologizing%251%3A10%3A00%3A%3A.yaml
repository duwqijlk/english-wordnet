simpleMeaning: In historical linguistics, an account of where a word or phrase came from in the past
scope: 'Also called derivation and deriving: in historical linguistics, an account of where a word or
  phrase came from, not a guess at what a word means now and not a list of words that sound alike.'
examples:
- Her etymologizing showed that the word came from an old word for 'house'.
- The book's etymologizing traces the phrase back hundreds of years.
