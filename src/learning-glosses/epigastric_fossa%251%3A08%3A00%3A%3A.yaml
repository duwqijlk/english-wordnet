simpleMeaning: Where a hard hit can upset the bundle of nerves in the belly, just under the breastbone,
  there is a small dip in the middle
scope: It is also called the pit of the stomach, a shallow dip in the belly just below the breastbone.
examples:
- A blow to the epigastric fossa can upset the nerves there.
- The epigastric fossa lies just below the breastbone.
