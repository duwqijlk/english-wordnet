simpleMeaning: a person whose job is to make or mend timepieces and watches
scope: 'Also called a clockmaker: a person who makes or mends timepieces, not a person who sells them
  and not a person who makes other tools.'
examples:
- The clocksmith fixed the old wall timepiece in a day.
- She took her broken watch to the clocksmith for repair.
