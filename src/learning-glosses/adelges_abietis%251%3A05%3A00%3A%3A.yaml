simpleMeaning: A kind of small sap-sucking insect that harms the Norway spruce and other North American
  spruces, above all the white spruce and black spruce.
scope: A small sap-sucking insect that harms spruces, also called spruce gall aphid; its nearest kin are
  other small insects that harm trees, such as aphids and scale insects.
examples:
- Adelges abietis harmed the Norway spruce in the garden.
- The forester found Adelges abietis on the white spruce.
