simpleMeaning: Flat flowers, usually pale yellow, grow on this low woody plant of the Canary Islands,
  which lives for years; plant books often put it with the chrysanthemums.
scope: Also called marguerite; a low woody plant of the Canary Islands with flat flowers that are usually
  pale yellow.
examples:
- The marguerite daisy by the wall has pale yellow flowers.
- She grew the marguerite daisy in a pot on the terrace.
