simpleMeaning: about the study of heat and energy and how one can change into the other
scope: This word is about things to do with the study of heat and energy. It does not mean hot by itself,
  and it is not the name of a machine that uses heat.
examples:
- The thermodynamic rules show that heat moves from hot things to cold ones.
- Engineers use thermodynamic ideas when they design engines.
