simpleMeaning: a plant of the eastern United States with thin leaves set in rings around the stem and
  pale green-white flowers
scope: A plant of the eastern United States with thin leaves in rings and pale green-white flowers, not
  a garden plant and not a common roadside weed.
examples:
- The whorled milkweed grew along the edge of the field.
- We saw whorled milkweed with pale flowers near the road.
