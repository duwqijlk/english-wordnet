simpleMeaning: the act of paying for things or for work done, or paying someone back for a loss
scope: This is the act of paying. It is not the money or thing that is paid, and it is not a gift with
  nothing in return.
examples:
- Remuneration for the repair work was made the next day.
- The company delayed remuneration for the services until the end of the month.
