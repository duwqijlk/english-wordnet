simpleMeaning: A kind of matter heavier than uranium, that gives off rays and is listed as number one
  hundred and fifteen
scope: This is one of the kinds of matter past uranium, listed as number one hundred and fifteen; atomic
  number 115, ununpentium and Uup are other names for this sense, and its nearest rivals are element 116
  and the other kinds in the set.
examples:
- Scientists made element 115 in a laboratory.
- Element 115 gives off rays that can harm living things.
