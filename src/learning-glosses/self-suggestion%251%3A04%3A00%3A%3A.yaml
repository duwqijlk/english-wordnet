simpleMeaning: a way of getting better, made by Emile Coue and much used in the 1920s and 1930s
scope: This is a way of getting better; auto-suggestion and autosuggestion are other names for this sense.
  Not a medical treatment and not ordinary advice.
examples:
- She used self-suggestion to help herself stay calm before the exam.
- He used self-suggestion to build his confidence before the match.
