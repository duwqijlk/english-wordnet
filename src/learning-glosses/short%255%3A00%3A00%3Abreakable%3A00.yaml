simpleMeaning: Said of pastry that is likely to crumble or break into small flat pieces because it contains
  a lot of fat.
scope: This is not about height or time; it describes a pastry's texture, which crumbles easily because
  of its high fat content.
examples:
- The pie crust is short and crumbles at the touch of a fork.
- This shortbread has the short, flaky texture that comes from plenty of butter.
