scope: Dystrophy is another name for one of these sicknesses, passed down in families, that weaken the
  muscles that move the bones.
examples:
- Muscular dystrophy made his muscles weak and waste away.
- Muscular dystrophy runs in families and weakens the muscles that move the bones.
