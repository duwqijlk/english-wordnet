simpleMeaning: Wood fibre treated with caustic soda, a chemical that can burn the skin, turns into a stuff
  of the ester kind.
scope: Also called cellulose xanthate, it is the stuff got by treating wood fibre with caustic soda, not
  the cloth made from it.
examples:
- This viscose is made by treating wood fibre with caustic soda.
- The viscose came from wood fibre treated with caustic soda.
