simpleMeaning: a tower that is part of a castle or other strong place built to keep people safe from attack
scope: A tower built as part of a castle to help keep it safe, not the whole castle and not a tall building
  for living in.
examples:
- Guards stood in the barbican and watched the road to the castle.
- The old barbican still stands at the front of the castle walls.
