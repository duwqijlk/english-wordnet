simpleMeaning: a boat used for catching fish, which pulls a net behind it through the water
scope: 'Also called dragger: a boat that pulls a net through the water to catch fish. Not the person who
  catches fish in this way.'
examples:
- The trawler came back to port early in the morning with its nets full of fish.
- From the hill we could see a trawler pulling its net through the grey sea.
