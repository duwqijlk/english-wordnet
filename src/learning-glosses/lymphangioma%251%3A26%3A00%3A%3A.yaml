simpleMeaning: A harmless growth made of a mass of small tubes that carry the body's clear fluid.
scope: A harmless growth made of a mass of small tubes that carry the body's clear fluid; not a harmful
  growth and not a growth of blood tubes.
examples:
- The child had a lymphangioma on her cheek that caused no pain.
- Doctors watched the lymphangioma but did not remove it.
