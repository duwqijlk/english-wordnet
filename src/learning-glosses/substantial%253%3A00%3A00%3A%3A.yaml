simpleMeaning: Not a dream or a fancy, but a thing that is truly there, with force enough to be counted
  as fact
scope: Real and able to be treated as fact, also called real and material, not only in the mind.
examples:
- The wind felt substantial enough to lean against.
- They wanted substantial proof, not mere talk.
