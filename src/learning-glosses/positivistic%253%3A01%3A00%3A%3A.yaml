simpleMeaning: Relating to the view that true knowledge comes only from things seen and tested by science
scope: This is about the view that true knowledge comes only from things seen and tested; positive and
  positivist are other names for this sense, not a view based on faith, and not the person who holds the
  view.
examples:
- The positivistic thinkers trusted only what could be tested.
- He wrote a positivistic account of the study.
