simpleMeaning: A spot kept free for someone to sit in, as in a theater, train, or plane.
scope: This is a reserved spot to sit, not a general area or location, a job, a home, a public square,
  or an item in a list.
examples:
- I saved you a place next to me on the train.
- The usher showed us to our places in the front row.
