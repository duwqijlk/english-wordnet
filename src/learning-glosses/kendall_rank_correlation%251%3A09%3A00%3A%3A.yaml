simpleMeaning: How much two lists in order agree is what this way of judging shows, and it uses no set
  numbers.
scope: Also called Kendall's tau and tau coefficient of correlation; not a way of judging one list on
  its own, and not a measure that uses set numbers.
examples:
- The Kendall rank correlation showed the two lists agreed well.
- They worked out the Kendall rank correlation for the two sets of scores.
