simpleMeaning: To make the end of something narrow and sharp.
scope: This is not aiming at a target, repairing the spaces between bricks, or adding marks to writing;
  it is shaping a sharp tip.
examples:
- The carpenter pointed each wooden stake with a knife.
- The smith pointed the iron rods on the anvil.
