scope: One who puts forth a word of some sort, as a plea, a speech, a cheque, or a stone, or the like;
  not a backer who puts forth a person, for a prize, a high mark, first greetings, or the like.
examples:
- Their presenter spoke at dawn.
- The presenter was heard at noon.
