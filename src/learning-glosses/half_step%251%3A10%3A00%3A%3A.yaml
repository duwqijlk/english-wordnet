simpleMeaning: In music, the gap in pitch between two keys that sit next to each other on a keyboard.
scope: In music, this is the gap in pitch between two keys that sit next to each other, not a whole tone;
  also called semitone.
examples:
- A half step separates C from C sharp.
- The tune moves up by a half step.
