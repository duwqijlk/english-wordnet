simpleMeaning: A machine makes a set of lines that show the waves of power in the brain.
scope: 'Also called an electroencephalogram and an encephalogram: a record of the brain''s work, not a
  picture of the brain itself and not a test of the heart.'
examples:
- The doctor ordered an EEG to check the activity in her brain.
- His EEG showed lines that moved up and down as his brain worked.
