simpleMeaning: In music, the written marks that show players or singers which notes to play or sing and
  how long to hold them
scope: Written marks that show players or singers what to play or sing, not the printed words of a song
  and not a recording.
examples:
- She is learning musical notation so she can read new pieces.
- Musical notation tells the player how long each sound lasts.
