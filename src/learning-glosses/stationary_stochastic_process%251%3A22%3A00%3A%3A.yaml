senseId: 'stationary_stochastic_process%1:22:00::'
synsetId: 13582401-n
simpleMeaning: A run of chance events in which the spread of possible results stays the same whatever
  the value of the changing factor
scope: A run of chance events whose spread of possible results stays the same whatever the value of the
  changing factor; not a run whose results drift and not a single chance event.
examples:
- A stationary stochastic process keeps the same spread of results over time.
- The teacher used a stationary stochastic process to show how chance events behave.
