simpleMeaning: In economics, the making, extracting, or growing of things for sale, often in large amounts.
scope: This is the economic activity of making or extracting goods for sale, not the general act of creating
  something, not a stage, screen, or broadcast presentation, not a thing that has been made, not the legal
  showing of documents in court, not the amount made in a period, not an overelaborate display, and not
  the creation of value or wealth through goods and services.
examples:
- The country's wealth comes from the production of oil and grain.
- They moved production of the parts to a cheaper plant overseas.
