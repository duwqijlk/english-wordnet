simpleMeaning: A tall, showy tropical American one-year plant with hairy stems and long spikes of mostly
  red flowers above leaves deeply flushed with purple; its seeds are often used as grain.
scope: Not pigweed or love-lies-bleeding, other amaranths; also called a gentleman's-cane, a prince's-feather,
  a prince's-plume, purple amaranth, red amaranth, Amaranthus cruentus, and Amaranthus hybridus erythrostachys.
examples:
- Amaranthus hybridus hypochondriacus grew tall in the garden.
- We ground the seeds of Amaranthus hybridus hypochondriacus into flour.
