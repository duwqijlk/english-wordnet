simpleMeaning: walking in a way that scrapes or drags your feet along the ground
scope: Scraping or dragging your feet as you walk, not a soft shoe and not a mark made by rubbing.
examples:
- We could hear the scuff of his shoes on the floor.
- The scuff of feet on the stairs woke her up.
