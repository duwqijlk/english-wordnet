simpleMeaning: to think carefully and for a long time about something, or discuss it seriously with others
scope: This sense is thinking carefully about something or discussing it with others; not fighting in
  a sport match, not struggling against a force, and not twisting the body while struggling.
examples:
- I wrestled with this decision for years.
- They wrestled with the question of how to pay for the new school.
