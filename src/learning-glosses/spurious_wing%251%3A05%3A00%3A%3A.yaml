simpleMeaning: a tuft of small stiff feathers on the first finger of a bird's flying part
scope: A tuft of small stiff feathers on the first finger of a bird's flying part; alula and bastard wing
  are other names for this sense, not the main flight feathers and not a tuft on the tail.
examples:
- The spurious wing helps the bird fly slowly.
- A spurious wing sits at the front edge of the wing.
