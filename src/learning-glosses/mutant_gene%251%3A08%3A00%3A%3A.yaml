simpleMeaning: A piece of the living stuff that carries a trait, which has changed so the trait is passed
  on and shows itself in a changed way.
scope: A piece of living stuff that carries a trait and has changed, so the trait is passed on and shown
  in a changed way; not a normal carrier of a trait, and not the change itself.
examples:
- The mutant gene made the flower a new colour.
- Scientists traced the trait to a mutant gene.
