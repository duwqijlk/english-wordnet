simpleMeaning: Various drugs used to treat high blood pressure or uneven heartbeat, lowering heartbeats
  in force and pace, blocking beta-adrenergic receptors of self-working nerves.
scope: Also called beta-adrenergic blocking agent, beta-blocking agent, and beta blocker, various drugs
  used to treat high blood pressure or uneven heartbeat, lowering heartbeats in force and pace, blocking
  beta-adrenergic receptors of self-working nerves.
examples:
- Beta-adrenergic blockers treat high blood pressure.
- Beta-adrenergic blocker lowers the heartbeat rate.
