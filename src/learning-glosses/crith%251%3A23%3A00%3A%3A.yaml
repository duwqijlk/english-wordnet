simpleMeaning: the weight of one litre of hydrogen at zero degrees centigrade and a pressure of 760 millimetres
scope: This is the weight of one litre of hydrogen at zero degrees centigrade and a pressure of 760 millimetres,
  not a measure of volume and not a weight for any other gas.
examples:
- One crith is the weight of a litre of hydrogen at 0 degrees centigrade and 760 millimetres pressure.
- The old book gave the weight of hydrogen in criths.
