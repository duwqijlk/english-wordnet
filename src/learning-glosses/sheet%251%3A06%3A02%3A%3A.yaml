simpleMeaning: In sailing, a rope or chain that sets the angle of a sail to the wind
scope: The rope that sets a sail's angle; mainsheet, weather sheet, shroud and tack are other names for
  this same rope, not the cloth of the sail itself and not a bed covering.
examples:
- The crew eased the sheet as the wind shifted.
- He pulled the sheet tight to change the sail's angle.
