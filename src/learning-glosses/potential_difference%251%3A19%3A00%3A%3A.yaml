simpleMeaning: How much more electric charge one place in a wire loop has than another, counted in volts
scope: 'Also called potential, voltage, electric potential and potential drop: how much more electric
  charge one place in a wire loop has than another, counted in volts; not the charge at one place alone
  and not the flow of charge.'
examples:
- The potential difference across the battery was twelve volts.
- A meter showed the potential difference between the two wires.
