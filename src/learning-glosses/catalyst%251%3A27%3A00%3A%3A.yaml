simpleMeaning: In chemistry, a substance that starts a chemical reaction or makes it go faster, while
  the substance itself stays the same
scope: 'Also called accelerator: a substance that starts or speeds up a chemical change and stays the
  same itself; not the wider use for a person or event that starts a change in society.'
examples:
- The catalyst made the chemical reaction go much faster.
- Without a catalyst, this reaction would start very slowly.
