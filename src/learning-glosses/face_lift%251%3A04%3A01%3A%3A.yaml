simpleMeaning: This work makes the outside of something look better, usually without big changes
scope: 'Also called a facelift and face lifting: work that makes the outside of something look better,
  not a new building and not surgery to make a face look young.'
examples:
- The old hotel got a face lift last year and now looks fresh again.
- A face lift gave the shop a new front without changing its size.
