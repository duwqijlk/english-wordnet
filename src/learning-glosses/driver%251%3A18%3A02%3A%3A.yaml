simpleMeaning: a person who guides animals that pull a cart, wagon or other vehicle.
scope: This is not a golfer using a long club, and not a person operating a motor vehicle; it names someone
  who leads animals pulling a load.
examples:
- The driver urged the oxen forward along the dusty road.
- A skilled driver can keep a team of horses moving together.
