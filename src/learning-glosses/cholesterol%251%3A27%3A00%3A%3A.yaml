simpleMeaning: a fatty substance that the liver normally makes, and the commonest of its kind in the bodies
  of animals
scope: A fatty substance made by the body, not a drug or a vitamin, and not the fat in food alone.
examples:
- The doctor said my cholesterol level was too high.
- Too much cholesterol can clog the arteries.
