simpleMeaning: a low-growing swamp plant of eastern North America that lives for years, sheds its leaves,
  and smells bad, with tiny flowers inside a mottled greenish or purple hood-shaped sheath.
scope: This is the low, bad-smelling swamp plant of eastern North America; 'foetid pothos' is another
  name for it, not a different species.
examples:
- Polecat weed filled the wet hollow behind the barn.
- The children pinched their noses when they walked past the polecat weed.
