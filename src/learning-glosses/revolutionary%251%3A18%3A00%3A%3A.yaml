simpleMeaning: a person who strongly supports complete change in how a country is ruled or how society
  is set up
scope: A person who strongly supports complete change in government or society, not the describing word
  for people who back such change and not the sense that means very new.
examples:
- The young revolutionary spoke to the crowd about a new government.
- Many revolutionaries were put in prison after the fighting ended.
