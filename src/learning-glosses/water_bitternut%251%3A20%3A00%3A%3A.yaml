simpleMeaning: a hickory tree of the southern United States with many narrow small leaves and rather bitter
  nuts
scope: 'Also called bitter pecan and water hickory: a southern hickory with many narrow leaves and bitter
  nuts, not the sweet-nut hickories and not other nut trees of the south.'
examples:
- The water bitternut drops bitter nuts in the fall.
- A water bitternut grew at the edge of the southern wood.
