simpleMeaning: able to see the truth of a thing and judge it well
scope: 'Also called clear-eyed and perspicacious: a mind that sees the truth well, not good eyes and not
  wishful thought.'
examples:
- Only clear-sighted leadership could have seen the danger ahead.
- He gave a clear-sighted account of what had gone wrong.
