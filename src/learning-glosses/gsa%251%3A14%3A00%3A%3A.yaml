simpleMeaning: The Federal government buys things, looks after its land and buildings, and takes care
  of the information it holds, all by rules that this central office makes.
scope: 'Also called the General Services Administration: the office that makes Federal rules for buying,
  land and buildings, and information, not a state or local office.'
examples:
- The GSA sets the rules for how the government buys office supplies.
- She called the GSA about the lease on a Federal building.
