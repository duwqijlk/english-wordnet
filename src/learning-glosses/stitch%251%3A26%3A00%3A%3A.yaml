simpleMeaning: a sudden, sharp pain in the side of the body that comes on when a person runs
scope: This is pain in the side from running, not a loop made with a needle and thread and not the act
  of sewing.
examples:
- She had to stop running when she got a stitch in her side.
- A sharp stitch slowed him down near the end of the race.
