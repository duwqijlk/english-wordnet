simpleMeaning: Any of several white drinks made from grapes grown in the valley of the German river they
  are named for, called hock in Britain
scope: Any of several white wines from the valley of the Rhine in Germany, also called hock and Rhenish,
  not a red wine and not a wine from another river valley.
examples:
- This Rhine wine is a white wine from the Rhine valley.
- She ordered a bottle of Rhine wine with her fish dinner.
