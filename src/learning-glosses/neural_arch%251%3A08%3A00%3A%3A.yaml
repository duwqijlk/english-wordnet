simpleMeaning: A bony curve grows from the back of one of the bones of the spine and helps to enclose
  the cord of nerves running down the spine.
scope: Vertebral arch is another name for it, the bony curve that grows from the back of one of the bones
  of the spine and helps to enclose the cord of nerves, so it is not the backbone itself and not the cord.
examples:
- The neural arch grows from the back of a spine bone.
- Each neural arch helps to enclose the cord of nerves.
