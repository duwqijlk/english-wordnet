simpleMeaning: Pointed leaves edged with sharp teeth grow on a tall, strong-smelling plant that lives
  year after year, bearing loose sprays of pale yellow flowers in the eastern United States.
scope: 'Also called horse balm, horseweed, richweed, stone-root, and stoneroot: a strong-smelling plant
  that stands tall and lives year after year in the eastern United States, not a plant that lives only
  one year.'
examples:
- Stone root has loose sprays of pale yellow flowers.
- The stone root grows tall in the eastern United States.
