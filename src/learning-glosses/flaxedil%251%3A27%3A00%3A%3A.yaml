senseId: 'flaxedil%1:27:00::'
synsetId: 14883773-n
simpleMeaning: A drug that blocks the nerves to the muscles, used to relax the muscles when a patient
  is put to sleep for an operation.
scope: 'Also called gallamine: a drug that blocks the nerves to the muscles and relaxes them for an operation,
  not a drug that puts a patient to sleep.'
examples:
- Flaxedil relaxes the muscles during an operation.
- The doctor gave Flaxedil before the operation.
