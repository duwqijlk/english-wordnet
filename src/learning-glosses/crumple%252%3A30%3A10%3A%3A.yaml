simpleMeaning: To get small lines and folds in it, so it no longer lies flat and smooth
scope: A thing getting lines and folds in it, not a person gathering a thing up into folds on purpose;
  also called wrinkle.
examples:
- This fabric won't crumple even after a long day.
- The paper crumpled in his pocket.
