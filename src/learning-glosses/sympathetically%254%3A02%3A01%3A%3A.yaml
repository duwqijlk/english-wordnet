simpleMeaning: in a kind way, showing that you understand and share how someone feels
scope: Acting with kindness and shared feeling, not the sense about the nerve system that works without
  thought.
examples:
- She listened to him sympathetically and held his hand.
- He spoke sympathetically to the woman who had lost her job.
