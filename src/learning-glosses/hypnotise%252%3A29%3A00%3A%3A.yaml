simpleMeaning: to put a person into a sleep-like state in which they are more ready to take in ideas that
  another person gives them
scope: Also called hypnotize. This is putting a person into a sleep-like state in which they are more
  ready to take in ideas from another person, not just making them sleep or making them relax.
examples:
- The doctor hypnotised the patient to help her stop smoking.
- He learned how to hypnotise people for his stage show.
