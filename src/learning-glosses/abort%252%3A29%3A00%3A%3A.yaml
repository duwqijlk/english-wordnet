simpleMeaning: to have a pregnancy ended on purpose before the baby is born
scope: This is a person choosing to end a pregnancy before birth. It is not a young living thing stopping
  its growth and dying on its own, and it is not stopping a plan early.
examples:
- She went to the clinic to abort the pregnancy.
- They talked for a long time before she chose to abort.
