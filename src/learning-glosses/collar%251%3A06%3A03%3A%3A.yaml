simpleMeaning: the line of stitches that makes the top edge of a shoe or boot
scope: The line of stitches that makes the top edge of a shoe or boot, not the band at the neck of a shirt
  and not the strip round an animal's neck.
examples:
- The collar of his boot had come loose.
- She sewed a new collar round the top of the shoe.
