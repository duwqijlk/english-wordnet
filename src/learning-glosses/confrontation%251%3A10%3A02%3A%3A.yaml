simpleMeaning: bad feeling that comes when people with different ideas or views come up against each other
scope: Bad feeling from a clash of ideas or opinions, not a careful side-by-side comparison.
examples:
- The confrontation over the new rules split the committee.
- Their confrontation began when their opinions clashed in the meeting.
