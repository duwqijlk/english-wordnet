simpleMeaning: a showy climbing plant of eastern Asia with yellow fruit that can be eaten and leaves marked
  with pale white
scope: A showy climbing plant of eastern Asia with yellow fruit that can be eaten and leaves marked with
  pale white, also called silvervine; not a climbing plant with red fruit and not a climbing plant with
  plain green leaves.
examples:
- A silver vine climbed the garden wall.
- The silver vine had yellow fruit and leaves with pale white marks.
