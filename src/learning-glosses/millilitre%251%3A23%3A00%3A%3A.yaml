simpleMeaning: One thousandth of the main unit of volume, this metric unit counts how much room a thing
  takes up
scope: A metric unit for counting how much room a thing takes up, one thousandth of the main unit, also
  called cc, a cubic centimeter, mil, milliliter and ml; not the main unit itself and not a measure of
  weight.
examples:
- Pour 30 millilitres of milk into the jug.
- Each millilitre of the medicine was measured with care.
