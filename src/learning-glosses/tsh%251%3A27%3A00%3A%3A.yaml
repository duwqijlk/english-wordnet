simpleMeaning: A chemical made by the front of the small gland at the base of the brain, which starts
  the neck gland that controls how fast the body works
scope: A chemical made by the front of the small gland at the base of the brain, also called thyroid-stimulating
  hormone, thyrotrophic hormone, thyrotrophin, thyrotropic hormone and thyrotropin; not a chemical made
  by the neck gland itself and not a chemical that slows the body down.
examples:
- The doctor ordered a TSH test to check her neck gland.
- A high TSH level can mean the neck gland is working too slowly.
