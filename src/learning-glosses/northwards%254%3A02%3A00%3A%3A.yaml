simpleMeaning: in the direction towards the top of a map
scope: Moving in this direction, also called north, northward, and northerly; it is not moving towards
  the bottom of a map, or to the left or right side of a map.
examples:
- The birds flew northwards in spring.
- We drove northwards along the coast all day.
