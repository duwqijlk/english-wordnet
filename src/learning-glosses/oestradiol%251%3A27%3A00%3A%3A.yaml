simpleMeaning: This strongest of the body's female chemicals also occurs in the body, and its lab-made
  form treats a lack of it and cancer of the breast.
scope: Also called estradiol, it is the lab-made form of the body's strongest female chemical, given for
  a lack of it and for breast cancer.
examples:
- A low level of the hormone was treated with oestradiol.
- Treatment for breast cancer included oestradiol.
