simpleMeaning: A state in which people's views, behaviour or natures fit well together.
scope: This is not a contract or arrangement between parties; it is the state of people getting on well
  together.
examples:
- There was complete agreement among the members about the plan.
- The two neighbours live in quiet agreement about the fence.
