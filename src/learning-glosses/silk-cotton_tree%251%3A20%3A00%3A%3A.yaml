simpleMeaning: A huge hot-land tree with deep ridges on its huge trunk, bearing big pods of seeds wrapped
  in silky floss, the source of silky kapok fibre.
scope: This sense is also called kapok, ceiba tree, and white silk-cotton tree.
examples:
- A silk-cotton tree towered over the grove.
- Silk-cotton trees bear big pods.
