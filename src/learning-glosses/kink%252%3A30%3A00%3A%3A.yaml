simpleMeaning: to take the shape of a tight ring, a bend, or a sharp twist
scope: 'Also called curl and curve: to form a tight ring, a bend or a sharp twist, not a person with unusual
  likes in sex and not a pain in the neck or back.'
examples:
- The garden hose kinked and the water stopped.
- The thin wire kinked when she pulled it tight.
