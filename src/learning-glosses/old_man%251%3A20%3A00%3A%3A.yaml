simpleMeaning: Used to make the strong drink absinthe, this bitter-tasting herb gives off a sweet smell
  and grows in the mild lands of Eurasia and North Africa.
scope: It is also called absinthe, common wormwood and lad's love, and it is a herb used to make the drink
  absinthe.
examples:
- The old man grows in the mild lands of Eurasia.
- People use the old man to make the drink absinthe.
