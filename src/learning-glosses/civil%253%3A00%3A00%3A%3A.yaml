simpleMeaning: A person described this way is not rude but is only as polite as usual social rules require,
  showing others an ordinary amount of care rather than special attention.
scope: It describes polite behaviour, not the sense of ordinary people as opposed to the armed forces.
examples:
- The clerk was civil, though not especially friendly.
- They managed a civil greeting before the meeting began.
