simpleMeaning: A small touch that quietly changes a thing, making it lighter or different.
scope: A small touch that quietly changes a thing, making it lighter or different, not the stuff used
  to make dough or liquid ferment, and not the act of puffing dough up.
examples:
- A leaven of humor lightened his long sermons.
- Her leaven of kindness changed the cold room.
