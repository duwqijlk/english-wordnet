simpleMeaning: To dig something, such as stones, out of a pit where stone is dug, or as if out of one.
scope: To dig stones or other things out of a pit where stone is dug, or as if out of one, not the pit
  itself and not a person hunted.
examples:
- They quarried marble from the hillside.
- The firm quarries slate for roofs.
