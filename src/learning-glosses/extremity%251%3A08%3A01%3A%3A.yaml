simpleMeaning: the end part of an arm or a leg, the part farthest from the main part of the body
scope: The end part of an arm or a leg, not a very bad state or condition, which is another sense of the
  same word.
examples:
- Cold weather made her extremities feel numb, especially her hands and feet.
- The doctor checked the patient's extremities for swelling.
