simpleMeaning: A person who makes or sells greasy liquid fuel from the ground
scope: A person who makes or sells greasy liquid fuel from the ground; not a person who oils machines,
  and not a female worker in the same trade.
examples:
- The oil worker spent the day on the drilling platform.
- Many oil workers lost their jobs when the price of fuel fell.
