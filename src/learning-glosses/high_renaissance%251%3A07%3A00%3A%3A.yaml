scope: The art style of painting in Florence and Rome in the early 1500s, known for great skill, grand
  scenes and ideas about people; other art styles of the same cities and century lack its grand scenes
  or its ideas about people.
examples:
- The High Renaissance brought grand scenes to painting in Florence and Rome.
- Leonardo painted in the High Renaissance style.
