simpleMeaning: In physics, a rule that sets out how heat energy is spread across the colours given off
  by a perfect dark body.
scope: A physics equation giving how energy is spread across the radiated spectrum of an ideal black body,
  not a description of the glow of a real object.
examples:
- Planck's radiation law tells how a hot body gives off heat energy.
- Scientists use Planck's radiation law to work out the heat given off by stars.
