simpleMeaning: A bushy, hairy annual plant with leaves in threes and pink to purple blooms, grown for
  food, feed and soil improvement, chiefly for its nutritious oily seeds; native to Asia.
scope: This is the growing plant, not the protein-rich bean eaten as food or the seed crop grown for oil.
examples:
- Farmers rotate soya bean with maize to keep their fields fertile.
- A field of soya bean turns pale purple when the flowers open in midsummer.
