simpleMeaning: a short knife from Malaya with a blade that waves back and forth
scope: A short knife from Malaya with a wavy blade; crease and kris are other names for this sense, and
  it is not a sword or a straight knife.
examples:
- He held up the creese to show its wavy blade.
- The museum keeps a creese from Malaya in its collection.
