synsetId: 05242241-n
simpleMeaning: In skull measurement, the furthest forward spot in the middle line on the bony ridge of
  the upper jaw that holds the tooth sockets.
scope: In skull measurement, the furthest forward spot in the middle of the bony ridge of the upper jaw,
  not a spot on the lower jaw and not a spot at the back of the skull.
examples:
- The alveolar point marks the front of the upper jaw in the skull chart.
- They measured from the alveolar point to the back of the skull.
