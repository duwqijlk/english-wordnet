simpleMeaning: someone who argues by picking at small points and raising petty objections that annoy
scope: Someone who argues by quibbling over small points; caviler, pettifogger and quibbler are other
  names for this sense, not a fair debater and not someone who raises a real objection.
examples:
- The caviller found fault with every line of the report.
- A caviller can stall any plan with endless small objections.
