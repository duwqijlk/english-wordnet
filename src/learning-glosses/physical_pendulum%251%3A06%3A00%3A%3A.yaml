simpleMeaning: Around a level bar, a real thing can turn freely, swinging to and fro.
scope: Also called compound pendulum, this real thing turns freely on its level bar and swings to and
  fro.
examples:
- The physical pendulum swung back and forth on its level bar.
- The physical pendulum turned freely round the level bar.
