simpleMeaning: A feeling of envy toward a person who has what you want, especially a rival.
scope: A feeling of envy toward a person who has what you want, especially a rival, not simple anger and
  not fear of losing what you have.
examples:
- Jealousy grew between the two singers as each won praise.
- His jealousy of his rival made him bitter.
