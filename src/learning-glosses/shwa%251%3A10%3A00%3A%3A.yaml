senseId: 'shwa%1:10:00::'
synsetId: 07128731-n
simpleMeaning: the plain middle sound of a word, heard in parts of a word said with no stress
scope: Also called schwa; a middle sound heard in the weak parts of words, not a strong vowel like a or
  e.
examples:
- The shwa is the soft sound at the start of 'about'.
- You can hear a shwa in the first part of 'banana'.
