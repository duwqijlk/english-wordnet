simpleMeaning: A black-and-white sea animal with teeth and a tall fin on its back, which hunts other sea
  animals in cold seas
scope: This black-and-white toothed whale is also called killer, orca, killer whale and sea wolf, and
  is not the grey blunt-nosed dolphin of northern seas.
examples:
- A grampus hunted seals in the cold sea near the shore.
- The grampus showed its tall fin as it swam past the boat.
