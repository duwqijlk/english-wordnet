scope: Also called maikoa, this is the plant grown for big sweet-smelling blooms, not the kind whose blooms
  smell sweet only at night.
examples:
- People grow angel's trumpet in the garden for its big blooms.
- The angel's trumpet by the wall has blooms shaped like a horn.
