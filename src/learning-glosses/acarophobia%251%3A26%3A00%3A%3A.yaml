simpleMeaning: a sick, overstrong fear of small insects, mites and worms
scope: This is a sick fear of small insects, mites and worms, not a fear of spiders and not a fear of
  snakes.
examples:
- Her acarophobia made her shake at the sight of a tiny mite.
- His acarophobia kept him from gardening, where worms live in the soil.
