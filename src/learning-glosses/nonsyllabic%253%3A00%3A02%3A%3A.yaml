simpleMeaning: A speech sound that cannot be the middle of a syllable on its own.
scope: A speech sound that cannot be the middle of a syllable on its own, not a vowel sound that makes
  the central part of a syllable and not a pause between sounds.
examples:
- The first 'l' in 'little' is nonsyllabic.
- A nonsyllabic sound cannot be the centre of a syllable.
