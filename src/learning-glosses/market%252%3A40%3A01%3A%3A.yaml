simpleMeaning: to trade in goods at a public place where buyers and sellers meet
scope: This is not promoting and selling a company's products, buying household supplies, or making something
  commercial, but trading at a market.
examples:
- Small traders market in the old square every morning.
- Stallholders market at the county fair each autumn.
