simpleMeaning: any of various trees of warm Asia whose trunks give a starchy food
scope: A tree of warm Asia whose trunk gives a starchy food, not the small palm-like tree of Japan and
  not a coconut tree.
examples:
- The sago palm grows in the warm forests of Asia.
- Workers cut the sago palm trunk to get the starchy food.
