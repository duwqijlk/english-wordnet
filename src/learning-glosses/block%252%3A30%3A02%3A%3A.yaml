simpleMeaning: To forbid money or property from being converted or put to use.
scope: To ban the exchange or use of money or property; not to get in the way of a road or passage, not
  to stop a broadcast signal, not to prevent an action in general, and not a noun for a memory lapse,
  a data unit or a blockage in a pipe.
examples:
- The bank blocked the transfer of the disputed funds.
- Authorities blocked the use of the frozen accounts.
