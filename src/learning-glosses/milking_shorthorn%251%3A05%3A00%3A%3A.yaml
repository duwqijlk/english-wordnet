simpleMeaning: A breed of cattle grown from beef cattle with short horns.
scope: A breed of cattle grown from beef cattle with short horns, not the beef shorthorn it came from
  and not a long-horned cattle breed.
examples:
- The milking shorthorn is a breed that came from shorthorn beef cattle.
- Milking shorthorns have short horns like the beef cattle they came from.
