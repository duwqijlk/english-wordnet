simpleMeaning: a box for fuel lumps, shaped so the lumps can be tipped onto the fire
scope: A box for fuel lumps, shaped so the lumps can be tipped onto the fire; scuttle is another name
  for this, not an open bucket and not a tool for stirring the fire.
examples:
- She filled the coal scuttle before lighting the fire.
- He tipped the coal scuttle and poured the lumps onto the flames.
