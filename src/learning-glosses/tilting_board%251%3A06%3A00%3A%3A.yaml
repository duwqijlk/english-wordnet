simpleMeaning: a play thing made of a long flat piece set on a middle support, with children at each end
  going up and down
scope: 'Also called a seesaw, teeter, dandle board, teeter-totter, teeterboard and teetertotter: a play
  thing children ride up and down on, not a swing and not a slide.'
examples:
- The children took turns on the tilting board at the playground.
- She sat on one end of the tilting board while her brother sat on the other.
