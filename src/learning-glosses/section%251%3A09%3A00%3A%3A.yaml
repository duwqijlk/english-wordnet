simpleMeaning: one of the parts that something is thought of as being divided into, which together make
  up the whole
scope: A part of a whole such as a document or machine, not a surgical cut, a fruit segment, or an orchestra
  group.
examples:
- The book is divided into three sections.
- Each section of the machine can be replaced separately.
