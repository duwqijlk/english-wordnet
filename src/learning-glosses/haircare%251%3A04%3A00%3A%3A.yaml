simpleMeaning: The strands on a person's head are washed, cut, curled or set in place as part of this
  work
scope: Also called hair care and hairdressing, this is the work of washing, cutting, curling or setting
  the strands on a person's head, not one wash on its own and not a finished style.
examples:
- Good haircare starts with a gentle wash and a careful cut.
- She spends an hour on haircare every Sunday morning.
