simpleMeaning: A kind of fungus that makes brown-orange spots on fruit, for example on pears, and on other
  fruit too
scope: Also called cedar-apple rust, it is a fungus that spots fruit, not the brown coating that forms
  on old metal.
examples:
- The apple rust on the tree left brown spots on the fruit.
- Apple rust had marked the pears with brown spots.
