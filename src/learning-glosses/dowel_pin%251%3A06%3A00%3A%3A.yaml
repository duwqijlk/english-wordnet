simpleMeaning: A small rod pushed into holes in two pieces next to each other to hold them together.
scope: A small rod that holds two pieces together; dowel and joggle are other names for this sense, not
  a nail and not a screw.
examples:
- He tapped the dowel pin into the holes to join the boards.
- The dowel pin holds the two pieces of wood together.
