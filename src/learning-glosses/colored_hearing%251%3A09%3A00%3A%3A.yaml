simpleMeaning: A condition in which a sound heard also brings a sense of a shade to mind
scope: A condition in which sounds bring shades to mind; colored audition is another name for this sense,
  not imagining a shade and not a fault of the ears.
examples:
- His colored hearing gave each bell its own shade.
- Colored hearing made each note bring a different shade to mind.
