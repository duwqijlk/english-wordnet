simpleMeaning: The outer bump of the elbow is this point of the forearm bone, which fits into the hollow
  of the upper arm bone when the arm is straight.
scope: It is also called olecranon process, and it is the point of the forearm bone that makes the outer
  bump of the elbow.
examples:
- He felt the olecranon at the outer bump of his elbow.
- When she straightened her arm, the olecranon fit into the hollow of the upper arm bone.
