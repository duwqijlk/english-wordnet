simpleMeaning: to arrange for a seat, room or ticket to be kept for someone before the time they need
  it
scope: This is about reserving something in advance, not about writing a person's name in a police record.
examples:
- I booked a table for four at the restaurant.
- She booked us seats on the morning train.
