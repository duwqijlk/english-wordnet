simpleMeaning: a Yiddish word for a person who is easily fooled and simple, and who makes you feel sorry
  for them more than angry at them
scope: A person who is easily fooled and simple, also called a shnook; not a fool you hate, and not a
  clever trickster.
examples:
- Don't be such a schnook - check the deal before you pay.
- The kind old schnook believed every story the salesman told him.
