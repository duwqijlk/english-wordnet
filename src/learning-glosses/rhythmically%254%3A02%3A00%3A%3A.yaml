simpleMeaning: in a way that has a steady, repeating beat
scope: This describes how something moves or sounds with a steady beat, not how loud it is and not how
  fast it is on its own.
examples:
- She tapped her foot rhythmically to the music.
- The dancers moved rhythmically, step after step in time with the beat.
