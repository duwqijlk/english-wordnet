senseId: 'routine%1:04:00::'
synsetId: 01028424-n
simpleMeaning: A set way of doing things, done in the same order again and again, out of habit.
scope: A fixed way of doing things done the same way each time, not a one-off job and not a set of rules
  for others.
examples:
- His morning routine never changed.
- The routine of the office kept the work moving.
