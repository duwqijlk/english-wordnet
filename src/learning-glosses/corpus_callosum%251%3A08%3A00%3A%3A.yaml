simpleMeaning: Running across, it joins the two halves of the brain, a wide band of nerve fibres.
scope: This band of nerve fibres runs across the brain and joins its two halves.
examples:
- Signals cross from one side of the brain to the other through the corpus callosum.
- The corpus callosum carries signals between the two halves of the brain.
