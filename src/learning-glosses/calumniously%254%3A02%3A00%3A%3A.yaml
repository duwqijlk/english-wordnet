simpleMeaning: in a lying and harmful way, speaking ill of someone to hurt them
scope: In a lying and harmful way, speaking ill of someone to hurt them; slanderously is another name
  for this sense, not speaking the plain truth.
examples:
- He spoke calumniously of his rival to the press.
- She was accused of writing calumniously about the firm.
