simpleMeaning: in a way that is right for the situation
scope: 'Also called properly, appropriately, suitably, fitly and fittingly: done in the right way for
  the situation, not just done on time.'
examples:
- The visitors were duly welcomed in a way that fit the formal occasion.
- She duly wore a warm coat, as the cold day required.
