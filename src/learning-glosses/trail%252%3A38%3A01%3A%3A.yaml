simpleMeaning: to move along at a slow, dragging pace
scope: Slow, dragging movement; the verb shack is another name for this same sense, not hanging down,
  not pulling something along the ground, and not lingering behind.
examples:
- The tired hikers trailed behind the guide for the last mile.
- The old dog trailed along the path, stopping to sniff every bush.
