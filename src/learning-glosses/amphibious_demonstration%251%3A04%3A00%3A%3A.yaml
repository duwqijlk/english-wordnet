simpleMeaning: a move by land and sea forces meant to trick the enemy into taking a course of action that
  works against them
scope: A feint from land and sea, not a real landing and not a show of force meant to impress allies.
examples:
- The amphibious demonstration drew enemy troops away from the real landing beach.
- Planners staged an amphibious demonstration to make the enemy guard the wrong coast.
