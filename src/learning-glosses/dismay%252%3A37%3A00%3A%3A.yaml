simpleMeaning: to make someone feel worried and afraid, and give them a bad surprise
scope: 'Also called alarm, and another name for horrify and appall: to make someone worried, afraid and
  badly surprised, not the feeling of fear itself and not to make someone lose hope.'
examples:
- The news of more job losses dismayed the workers and left them fearing the future.
- She was dismayed by the sudden change in the plan.
