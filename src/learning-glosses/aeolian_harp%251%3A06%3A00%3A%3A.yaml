simpleMeaning: A set of strings all tuned to the same note, which sound when the wind moves over them.
scope: A set of strings tuned to one note that sound in the wind, also called an aeolian lyre; not a harp
  played by hand and not a set of bells in the wind.
examples:
- The aeolian harp sang softly as the wind rose.
- She hung an aeolian harp by the open window.
