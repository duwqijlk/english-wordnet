simpleMeaning: a person or thing that makes another thing's good points stand out by being different from
  it
scope: 'Also called foil: a person or thing that makes another thing''s good points stand out by contrast,
  not a thing that makes something better itself and not a thing that covers up the other thing''s good
  points.'
examples:
- The quiet room was an enhancer for the bright painting, making its colours stand out.
- She chose a dull frame as an enhancer so the bright picture would catch the eye.
