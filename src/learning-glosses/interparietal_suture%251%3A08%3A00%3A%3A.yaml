synsetId: 05552680-n
simpleMeaning: The line where the two bones at the top of the skull join together
scope: The join between the two bones at the top of the skull; not a crack in a bone and not the join
  between other bones of the head.
examples:
- The interparietal suture joins the two parietal bones.
- The interparietal suture can be seen on the top of the skull.
