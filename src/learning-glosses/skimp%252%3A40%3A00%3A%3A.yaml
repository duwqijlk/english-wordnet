simpleMeaning: To get by on very little money.
scope: To get by on very little money, also called stint and scrimp, not to give out too little of something,
  and not to work in a hasty, careless way.
examples:
- They had to skimp for months after the pay cut.
- We skimped on food so the rent could be paid.
