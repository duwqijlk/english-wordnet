simpleMeaning: A blissful feeling with a tingling like static on the skin, most often starting on the
  head and moving down the back of the neck and upper spine, bringing calm.
scope: 'Also called autonomous sensory meridian response: a feeling, not a sound or a medical state, and
  not a headache.'
examples:
- ASMR gave her a soft tingle down her neck.
- He watched a video to feel ASMR before sleep.
