simpleMeaning: To shape a child's or animal's behaviour through instruction and practice, especially so
  that it learns self-control.
scope: This is the old sense of training a child or animal to behave. It is not the sense of restraining
  something or slowing its growth, as in checking the spread of disease; not the everyday sense of inspecting;
  not the sense of marking cloth or paper into squares; and not the sense of writing a bank check. Dated
  and formal; today people say 'train' or 'discipline'.
examples:
- The puppy was checked with patient repetition until it walked quietly at heel.
- In the old manual, parents were told to check their children early in obedience.
