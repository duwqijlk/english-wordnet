simpleMeaning: In ships, a set of steps hung down over the side of a ship so people can climb aboard
scope: A set of steps hung over a ship's side for climbing aboard, also called sea steps; not a fixed
  stair inside the ship and not a rope used for climbing.
examples:
- The crew lowered the sea ladder so the visitors could come aboard.
- He steadied himself on the sea ladder as the boat rocked.
