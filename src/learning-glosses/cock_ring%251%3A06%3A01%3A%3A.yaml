simpleMeaning: Chiefly to slow blood flow from the stiff male tissue and keep it stiff for much longer,
  this band goes round the male organ, usually at its base
scope: Also called an erection ring or a tension ring, this is a band put round the male organ to slow
  blood flow and keep it stiff for much longer.
examples:
- He put on a cock ring to keep his erection for much longer.
- A cock ring slows blood flow from the stiff male tissue.
