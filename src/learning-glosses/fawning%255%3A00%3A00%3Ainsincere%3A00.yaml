senseId: fawning%5:00:00:insincere:00
synsetId: 02188861-s
simpleMeaning: trying to win help or liking from people with power by praising them more than you really
  mean
scope: Also called sycophantic, obsequious, and bootlicking. This is praising people with power more than
  you really mean, to win their help or liking; it is not honest praise or normal politeness.
examples:
- His fawning praise of the boss made his workmates turn away.
- She gave the director a fawning smile and kept saying how great his plan was.
