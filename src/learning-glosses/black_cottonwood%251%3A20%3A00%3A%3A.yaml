simpleMeaning: In western North America grows a tree whose dark green leaves shine above and look rust-coloured
  or pale white beneath.
scope: This is the western North American tree with shining dark green leaves above, not the poplar with
  large rounded leaves and brownish bark.
examples:
- A black cottonwood grew in the yard.
- A black cottonwood grew in western North America.
