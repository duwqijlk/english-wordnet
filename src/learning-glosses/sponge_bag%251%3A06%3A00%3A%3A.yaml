simpleMeaning: a water-proof case for holding soap, toothpaste and other wash things when you travel
scope: A water-proof case for holding soap, toothpaste and other wash things when you travel; toilet bag
  is another name for this sense, not a bag for clothes and not a bag for food.
examples:
- She packed her sponge bag for the trip.
- His sponge bag held soap and a toothbrush.
