simpleMeaning: A green bush that keeps its leaves all year, growing wild along the south coast of the
  United States as far as southern Florida and Louisiana, also called inkberry.
scope: This is a green bush that keeps its leaves all year, growing wild along the south coast of the
  United States, not a tall tree and not a bush that loses its leaves in winter; inkberry is another name
  for this sense.
examples:
- Low gallberry holly grows wild along the Florida coast.
- We planted low gallberry holly as a low hedge.
