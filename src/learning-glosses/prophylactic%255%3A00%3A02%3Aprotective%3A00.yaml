senseId: prophylactic%5:00:02:protective:00
synsetId: 01893918-s
simpleMeaning: Able to stop a woman from becoming with child.
scope: Also called contraceptive, this is the use for a thing that can stop a woman from becoming with
  child, not a thin sheath worn during sex, not a drug that stops or slows an illness, and not the use
  for a thing that helps stop disease.
examples:
- The pill is prophylactic, stopping conception before it can start.
- This device is prophylactic, keeping the woman from becoming with child.
