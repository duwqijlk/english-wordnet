simpleMeaning: A very small animal from Argentina, covered by a hard shell, with pink plates on its head
  and neck and pale silky hair.
scope: Also called a chlamyphore, a pichiciago, or a pichiciego, this very small Argentine animal has
  a hard shell, pink plates on its head and neck, and pale silky hair.
examples:
- She pointed out the pink plates on the fairy armadillo's head and neck.
- The fairy armadillo's pale silky hair showed against its hard shell.
