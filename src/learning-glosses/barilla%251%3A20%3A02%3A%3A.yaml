simpleMeaning: a bushy plant of the Old World's salt marshes and sea shores, with sharp leaves; people
  burn it to make rough soda ash
scope: 'Also called glasswort, kali, kelpwort, and saltwort: the bushy Old World marsh plant burned for
  soda ash, not the Algerian plant burned for calcium carbonate.'
examples:
- Barilla grows in the salt marshes along the shore.
- Workers burned barilla to make soda ash.
