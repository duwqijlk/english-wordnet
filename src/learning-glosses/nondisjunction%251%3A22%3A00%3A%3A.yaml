simpleMeaning: a fault in the cell division that makes sex cells, where matching pairs of threads carrying
  the body's plans fail to part, so new cells get the wrong number
scope: A fault in the cell division that makes sex cells, where matching pairs fail to part; not the normal
  parting of the pairs and not a fault in the copying of single threads.
examples:
- Nondisjunction can lead to a child with an extra chromosome.
- The lab found nondisjunction in the dividing cells.
