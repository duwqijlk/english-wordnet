simpleMeaning: a bowl-shaped mirror that gathers the sun's rays into one spot, and can make great heat
scope: Also called solar collector and solar furnace; a bowl-shaped mirror that gathers the sun's rays
  to make heat, not a dish for food and not a flat mirror.
examples:
- The solar dish focused the sun's rays onto one small spot.
- Workers aimed the solar dish at the sun to test how hot it could get.
