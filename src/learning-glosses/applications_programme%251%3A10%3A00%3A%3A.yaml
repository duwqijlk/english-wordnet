simpleMeaning: A set of orders for a computer that gives the user tools to get a job done.
scope: A set of computer orders that give the user tools to get a job done; application and application
  program are other names for it, and it is not the computer itself and not a single order.
examples:
- He uses an applications programme to write letters.
- The applications programme helps her keep the accounts.
