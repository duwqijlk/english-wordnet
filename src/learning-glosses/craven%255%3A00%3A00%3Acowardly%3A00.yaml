simpleMeaning: With no courage at all, and afraid in the lowest, most cringing way
scope: A total lack of courage and low fear, not ordinary fear or a fair worry.
examples:
- The craven fellow turned and ran at the first sound.
- It was a craven choice to give in without a fight.
