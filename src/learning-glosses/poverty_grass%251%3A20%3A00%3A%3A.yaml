simpleMeaning: A small plant like a low bush, covered with soft white hairs, grows on sandy shores in
  the north-east of North America
scope: A small low plant covered with soft white hairs, also called beach heather, not a grass and not
  a plant of gardens or fields.
examples:
- Poverty grass spread over the sandy shore, its white hairs catching the light.
- We found poverty grass growing among the dunes in the north-east.
