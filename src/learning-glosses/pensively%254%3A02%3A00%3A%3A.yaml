simpleMeaning: in a way that shows deep, quiet thought
scope: This is about doing something in a deep, quiet, thinking way, not quickly, not happily, and not
  in a worried or fearful way.
examples:
- She looked pensively at the old photograph, thinking about her childhood.
- He sat pensively by the window and said nothing for a long time.
