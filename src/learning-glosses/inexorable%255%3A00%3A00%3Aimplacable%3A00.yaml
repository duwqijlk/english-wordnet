simpleMeaning: impossible to soften or move, even when people beg and plead
scope: 'Also called grim, stern, relentless, or unrelenting: not to be softened by begging or pleading,
  not just a person who will not change their mind when given reasons.'
examples:
- The inexorable judge refused every plea for mercy.
- Time moved on with inexorable certainty, and nothing could slow it.
