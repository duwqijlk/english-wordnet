simpleMeaning: 'the SI unit for flat angles, about 57.3 degrees: the angle at a circle''s center cut off
  by an arc as long as the line from center to edge.'
scope: The plane-angle unit, the same thing as a radian; not the radiation-dose unit also abbreviated
  rad, and not the informal word for a radical.
examples:
- The motor turned through 0.4 rad before the sensor triggered.
- He converted the angle from degrees to rad for the calculation.
