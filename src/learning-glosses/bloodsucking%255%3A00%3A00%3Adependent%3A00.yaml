simpleMeaning: Said of plants or people, living off another like a parasite or a leech.
scope: Said of plants or people, living off another like a parasite or a leech, also called parasitic
  or parasitical; not the use for drawing blood from the body of another.
examples:
- The vines were bloodsucking, strangling the trees they grew on.
- His rule was bloodsucking, living off the work of others.
