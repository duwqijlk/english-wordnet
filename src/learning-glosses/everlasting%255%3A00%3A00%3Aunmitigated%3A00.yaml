senseId: everlasting%5:00:00:unmitigated:00
synsetId: 01524174-s
simpleMeaning: a word put before another word in everyday talk to make it stronger, meaning total and
  with no limit, often when speaking ill of something
scope: A word used to strengthen another word, meaning complete, with perfect, complete, staring, utter,
  pure, thorough, gross and stark as other names for this sense, and not the plant or a word meaning lasting
  for ever.
examples:
- What an everlasting nuisance that dog is!
- It was an everlasting mess after the party.
