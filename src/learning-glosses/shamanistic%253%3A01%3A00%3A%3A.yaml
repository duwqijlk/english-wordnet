scope: 'Also called shamanist: to do with a belief in spirits and a holy person who speaks with them,
  not a belief in one god alone and not a trick or show.'
examples:
- The shamanistic healer spoke with the spirits for the sick child.
- Shamanistic art shows spirits in the shape of birds and beasts.
