simpleMeaning: to mark something with thin lines or narrow bands
scope: This is the act of making thin lines on something; it is not the word for a thing that already
  has thin lines on it.
examples:
- The artist striated the wet clay with a fine tool.
- Wind and water striated the rock face over many years.
