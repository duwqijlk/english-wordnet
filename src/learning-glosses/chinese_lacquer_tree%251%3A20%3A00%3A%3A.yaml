simpleMeaning: A small woody plant of Asia that gives off a poisonous juice from which a hard shiny coating
  is made.
scope: Also called the lacquer tree, the varnish tree, the Japanese lacquer tree, Japanese sumac, the
  Japanese varnish tree, Rhus verniciflua or Toxicodendron vernicifluum; its poisonous juice is what lacquer
  is made from.
examples:
- The Chinese lacquer tree stood at the edge of the wood, its bark scored for the juice.
- Workers tapped the Chinese lacquer tree for the poisonous juice used in lacquer.
