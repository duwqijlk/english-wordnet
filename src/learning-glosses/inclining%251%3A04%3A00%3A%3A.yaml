synsetId: 00336210-n
simpleMeaning: the act of leaning or bending forward
scope: Another name for this sense is inclination. This sense is the act of bending forward, not a liking
  for something and not a slope, which are other meanings the name inclination can have.
examples:
- A slight inclining of his head showed that he agreed.
- Her inclining forward a little helped her hear the speaker better.
