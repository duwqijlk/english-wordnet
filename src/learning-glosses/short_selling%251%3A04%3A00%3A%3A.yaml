simpleMeaning: shares, or goods to be traded at a later date, that the trader does not own yet, hoping
  to buy them back for less money later
scope: Selling shares or goods you do not own, also called a short sale; not an ordinary sale of what
  you own, and not buying shares to keep them.
examples:
- Short selling is risky when prices rise instead of fall.
- She tried short selling during the market drop.
