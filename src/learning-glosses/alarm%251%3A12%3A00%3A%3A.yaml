senseId: 'alarm%1:12:00::'
synsetId: 07535012-n
simpleMeaning: fear that comes when a person knows there is danger
scope: This is the fear you feel when you know there is danger; it is not a thing that gives a warning
  sign, not a warning sound, and not a clock that wakes you.
examples:
- Alarm filled her when she saw the fire near the house.
- He felt a sudden alarm when he heard glass break and thought danger was near.
