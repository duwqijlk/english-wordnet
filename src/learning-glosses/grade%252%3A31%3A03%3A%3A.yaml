simpleMeaning: to put people or things in an order, or give them a rating, based on how good or important
  they are
scope: This is about placing someone or something on a scale or in an order, not about giving a mark to
  a piece of work.
examples:
- The judges graded the entries from best to worst.
- The hotels were graded by comfort and location.
