simpleMeaning: an orchid of the Rhyncostylis kind, with white flowers marked pink to purple packed tight
  in a long round flower head
scope: An orchid with white flowers marked pink to purple, not the grass called foxtail grass and not
  a fragrant orchid.
examples:
- The foxtail orchid blooms in a dense spike of white flowers marked with purple.
- We hung the foxtail orchid where its long flower head could droop in the light.
