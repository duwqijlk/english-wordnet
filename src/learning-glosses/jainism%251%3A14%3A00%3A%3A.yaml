simpleMeaning: A religious group started in the 6th century BC as a break from Hinduism
scope: This sense names the sect as a religious group founded in the 6th century BC as a revolt against
  Hinduism; it is the group that broke away, distinct from the wider religion sense of the same word that
  also covers its beliefs about asceticism and the soul.
examples:
- Jainism began in the 6th century BC as a revolt against Hinduism.
- The followers of Jainism turned away from Hindu ways.
