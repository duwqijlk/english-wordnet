simpleMeaning: Having thin stiff hairs, called awns, on the parts of some cereal or grass plants that
  bear flowers.
scope: Also called awny, this word is used of a cereal or grass plant that has thin stiff hairs on its
  flowering parts.
examples:
- The awned wheatgrass had thin stiff hairs on its flowering parts.
- Awned barley bears hairs on the parts that flower.
