simpleMeaning: A European eryngo, green all year, with twisted spiny leaves, now wild on the east coast
  of the United States; its roots were once used to stir sexual desire.
scope: A European eryngo, green all year, with twisted spiny leaves, also called sea eryngium, sea holly
  and sea holm; it now grows wild on the east coast of the United States, and its roots were once used
  to stir sexual desire.
examples:
- Eryngium maritimum grows wild along the east coast.
- The twisted spiny leaves of Eryngium maritimum stay green all year.
