simpleMeaning: one of the broad bands of the earth's surface, divided roughly by latitude or longitude
scope: This is a wide band of the globe, not a small local patch, and not a region marked off only by
  a feature it shares.
examples:
- The country lies mostly in the temperate zone.
- Sailors crossed into the tropical zone.
