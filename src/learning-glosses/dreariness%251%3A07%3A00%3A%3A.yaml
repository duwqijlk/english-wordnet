simpleMeaning: great dullness, with no life or interest in it
scope: 'Also called insipidity and also called boringness: this is great dullness with no life in it,
  not sadness and not tiredness.'
examples:
- The dreariness of the long meeting made everyone look at the clock.
- She left the town because of its dreariness in winter.
