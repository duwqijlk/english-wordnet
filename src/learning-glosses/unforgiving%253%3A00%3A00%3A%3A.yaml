simpleMeaning: not willing or not able to stop blaming someone for a wrong they did, or to be kind to
  them and not punish them for it
scope: Describes a person who will not stop blaming someone for a wrong and will not be kind to them instead
  of punishing them, not the sense of not being calmed or pleased by requests.
examples:
- She was unforgiving toward her brother for years after the lie.
- The unforgiving teacher gave him no second chance after he cheated.
