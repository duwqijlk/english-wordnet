simpleMeaning: a shrub of wet ground in northern and central Europe and in eastern Siberia as far as Korea
  and Japan
scope: A shrub of wet ground in northern and central Europe and eastern Siberia to Korea and Japan; wild
  rosemary is another name for this sense, not a shrub of dry ground and not a plant used to make tea.
examples:
- Marsh tea grows in the bogs of northern Europe.
- We saw marsh tea flowering near the lake.
