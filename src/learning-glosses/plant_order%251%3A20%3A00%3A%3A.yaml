simpleMeaning: A group of related families of living things that grow in the ground and make food from
  sunlight
scope: A group of related families of plants, above a family in rank and below a class; not a family and
  not a class.
examples:
- The rose belongs to a plant order that also includes apples and pears.
- This plant order brings together several families of flowering shrubs.
