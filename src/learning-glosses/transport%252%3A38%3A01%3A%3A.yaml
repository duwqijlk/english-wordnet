simpleMeaning: Carry people or goods from place to place as a paid business.
scope: This is moving people or goods as a paid business, not simply carrying something a long way, sending
  a parcel to someone, or the bare act of moving something.
examples:
- The firm transports fresh produce from the coast to inland markets every morning.
- The airline transports thousands of passengers across the Atlantic each week.
