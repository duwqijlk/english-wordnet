simpleMeaning: To send something away so that it is gone and not kept
scope: To send something out so it is gone, throw away being another name for this sense; not to keep
  something, not to give it away, and not to stop thinking about a plan.
examples:
- She threw out the old newspapers.
- He will throw out the broken chair.
