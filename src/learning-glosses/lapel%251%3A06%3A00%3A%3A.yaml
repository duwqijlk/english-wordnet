simpleMeaning: A flat fold at the front of a coat, joined to the collar and turned back.
scope: The turned-back fold at the front of a coat, not the collar itself and not a pocket.
examples:
- The tailor pressed the lapel flat against the front of his jacket.
- A small red flower was pinned to her lapel.
