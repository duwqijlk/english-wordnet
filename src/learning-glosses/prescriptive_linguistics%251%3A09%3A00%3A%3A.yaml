simpleMeaning: rules for how people should speak and write a language, not how they do speak and write
  it, covering sounds, word forms, sentence order, and word meanings
scope: Rules for how a language should be used, not a report of how people really use it.
examples:
- In prescriptive linguistics, teachers tell students which forms are correct and which are wrong.
- Her book on prescriptive linguistics gives rules for sounds, word forms, and sentence order.
