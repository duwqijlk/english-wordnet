simpleMeaning: a person in old times who held land from a lord and owed that lord loyalty and service
  in return
scope: 'Also called liege: a person who held land from a lord and owed service for it, not the lord who
  gave the land.'
examples:
- The vassal held his land from the lord and served him in war.
- Each vassal had to be loyal to his lord and work for him.
