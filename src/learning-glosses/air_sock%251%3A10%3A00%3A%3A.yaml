simpleMeaning: The wind swings this short cloth cone, cut off at the tip and set on a mast, so its direction
  can be read, as at a flying field.
scope: 'Also called a sock, a drogue, a windsock, an air-sleeve, a wind cone, a wind sleeve, or a wind
  sock: a short cloth cone, cut off at the tip and set on a mast to show the wind''s direction, not a
  flag.'
examples:
- The air sock on the mast moved with the wind.
- The air sock showed the direction of the wind.
