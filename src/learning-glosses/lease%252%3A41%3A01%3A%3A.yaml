simpleMeaning: to take and use goods or services that belong to someone else, paying for them under a
  set deal
scope: 'Also called hire or rent: to pay to use things that belong to someone else, not the written deal
  itself (the noun lease) and not property that is let out.'
examples:
- We leased the hall for the wedding.
- They leased a car for two years.
