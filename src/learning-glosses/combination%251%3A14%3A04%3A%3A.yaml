simpleMeaning: a set of chess moves, planned to work together, that a player plays one after another
scope: Planned chess moves that work together, not the code that opens a lock and not a group of people
  or companies joining for a purpose.
examples:
- The young player found a clever combination and won the queen.
- His combination of three quiet moves left his opponent with no good reply.
