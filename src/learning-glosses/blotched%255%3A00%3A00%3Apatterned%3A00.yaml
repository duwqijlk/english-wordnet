simpleMeaning: having spots or other marks that do not have a regular shape
scope: Also called blotchy and splotched. This means having uneven spots or marks, not being one plain
  colour all over.
examples:
- His blotched skin was red in some places and pale in others.
- The old paper was blotched with brown spots.
