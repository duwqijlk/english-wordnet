scope: This is a copper salt made from copper oxide with sulfuric acid; copper sulfate, copper sulphate
  and cupric sulphate are other names for this sense.
examples:
- Cupric sulfate turns water blue.
- The farmer sprayed cupric sulfate on the vines.
