simpleMeaning: a crowd, especially of people or things that are common and not special in any way
scope: Also called herd. This is a crowd of common people or things, not a fold in cloth or in another
  flat surface.
examples:
- His good work lifted him above the ruck of other writers.
- She stood out from the ruck because her songs were so much better.
