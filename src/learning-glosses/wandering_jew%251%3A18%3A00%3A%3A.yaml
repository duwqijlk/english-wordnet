simpleMeaning: A Jew of old tales, cursed to walk the earth for mocking Jesus as he died on the cross.
scope: This is the figure of old tales, cursed to walk the earth for mocking Jesus as he died on the cross,
  and the story is a legend, not a record of a real person.
examples:
- The Wandering Jew appears in many old tales.
- They told the tale of the Wandering Jew.
