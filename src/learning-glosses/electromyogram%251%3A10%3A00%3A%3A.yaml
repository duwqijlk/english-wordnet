simpleMeaning: a chart that shows the flow of charge made when muscles tighten
scope: A chart that shows the flow of charge made when muscles tighten, not the test that reads the muscles
  and not a picture of the bones.
examples:
- The doctor looked at the electromyogram to see how the muscle fired.
- An electromyogram showed bursts of charge each time she bent her arm.
