simpleMeaning: A piece of cloth worn round the head, neck, or shoulders to keep warm or to look nice.
scope: A cloth worn round the head, neck, or shoulders, not a hat and not a coat.
examples:
- She wrapped a scarf round her neck before going out into the cold.
- He bought a bright scarf to wear with his coat.
