simpleMeaning: someone who takes a piece of writing and puts it into the words of a different language
scope: A person who turns written words from one language into another, not a computer program that does
  the same for code, and not someone who speaks for people talking in different languages.
examples:
- The translator worked late to turn the novel into English.
- She hired a translator to put the letters into French.
