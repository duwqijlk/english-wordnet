simpleMeaning: a United States measure for dry things, equal to 8 quarts or 537.605 cubic inches
scope: This is the United States dry measure, not the British measure equal to 2 gallons and not the verb
  senses about bothering a person or hitting lightly.
examples:
- The recipe for the large batch called for a peck of dry beans, equal to eight quarts.
- In the United States, a farmer measured out a peck of wheat for sale.
