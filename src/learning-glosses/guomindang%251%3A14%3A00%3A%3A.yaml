senseId: 'guomindang%1:14:00::'
synsetId: 08277612-n
simpleMeaning: The political party founded in 1911 by Sun Yat-sen, which ruled China under Chiang Kai-shek
  from 1928 until 1949, when the Communists took power, and then ruled Taiwan.
scope: Also called Kuomintang; the party that ruled China before 1949 and then Taiwan, not the Communist
  Party.
examples:
- The Guomindang governed China until 1949.
- After 1949 the Guomindang ruled Taiwan.
