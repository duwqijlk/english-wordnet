simpleMeaning: to move in quick bursts that seem to have no control
scope: 'Also called jerk: to move in quick bursts with no control, not a short shake of one muscle and
  not a hard pinch between the fingers.'
examples:
- His legs began to twitch as he slept.
- Her hands twitch when she is very tired.
