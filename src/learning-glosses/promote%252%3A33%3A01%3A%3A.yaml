simpleMeaning: In chess or checkers, to be changed for a stronger, better piece in the game
scope: This is about a game piece itself being changed for a better one in chess or checkers; it is not
  the player changing a pawn by moving it forward, and not giving a worker a higher job.
examples:
- In chess, a pawn that reaches the far side is promoted to a queen.
- His checker was promoted to a king when it reached the last row.
