simpleMeaning: a necessary product, usually in the plural, that people always need and so keep buying
  in steady amounts.
scope: This is not the adjective meaning simple or reduced to essentials; it is a necessary product that
  people buy steadily.
examples:
- Rice and cooking oil are among the household basics.
- The shop sells everyday basics such as soap and sugar.
