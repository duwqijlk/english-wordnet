simpleMeaning: each day, a close look at your own deeds, weighing them against right and wrong, as Jesuits
  do
scope: 'Also called examination: a daily close look at your own deeds against right and wrong, not a test
  in school and not a look at someone else''s deeds.'
examples:
- He made his examen each night before bed.
- The Jesuit's examen helped him see where he had gone wrong.
