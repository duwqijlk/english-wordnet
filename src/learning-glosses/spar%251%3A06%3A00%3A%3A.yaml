simpleMeaning: a strong, thick, round pole of wood or metal used to hold up the ropes on a ship
scope: This is the pole on a ship that holds up the ropes, not a light stone that can be split, and not
  practice fighting for a boxer.
examples:
- A strong spar held up the ropes on the ship.
- The workers replaced the broken wooden spar.
