simpleMeaning: A thin, upright plant that lives for years in eastern North America, with roots like tubers
  and white flowers touched with pink, much like meadow rue.
scope: 'Also called false rue and false rue anemone: a thin upright plant of eastern North America that
  looks like meadow rue, not meadow rue itself and not a true anemone.'
examples:
- Isopyrum biternatum grows in the woods of eastern North America.
- We found Isopyrum biternatum blooming with white flowers touched with pink.
