simpleMeaning: In the dry parts of the west of the United States lives this big dark wingless bug, a kind
  of long-horned grasshopper that looks like a small hopping bug
scope: A big dark wingless bug of the dry west of the United States, not a true cricket and not a grasshopper
  of the east.
examples:
- A mormon cricket crossed the dry road in front of us.
- Mormon crickets ate the grass in the dry fields.
