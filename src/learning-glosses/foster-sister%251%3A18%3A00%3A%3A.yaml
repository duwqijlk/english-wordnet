simpleMeaning: A girl or woman who is not your parents' daughter but who was brought up by your parents
scope: This is a girl or woman who is not your parents' daughter but who was brought up by your parents,
  also called foster sister; it is not your parents' own daughter and not a close friend.
examples:
- My foster-sister and I shared a room as girls.
- Her foster-sister taught her to ride a bike.
