simpleMeaning: An unusual set-up of an aircraft's rear steering parts, with four parts in the shape of
  an X, from the front or back, instead of the fin and flat parts.
scope: An unusual rear steering set-up on an aircraft, with four parts in an X shape, not the usual fin
  and flat rear parts and not a V-shaped set-up.
examples:
- The new plane uses an X-tail instead of a normal fin.
- Seen from the front, the X-tail looks like the letter X.
