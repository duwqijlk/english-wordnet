simpleMeaning: The clothes people put on when they are not on duty, unlike a uniform, what is worn for
  work, or what a priest wears, and the like
scope: These clothes are also called civilian clothing, civilian garb, and plain clothes, and they are
  worn when people are not on duty, unlike a uniform, what is worn for work, or what a priest wears.
examples:
- He changed into civilian dress after the parade.
- The new job lets her wear civilian dress instead of a uniform.
