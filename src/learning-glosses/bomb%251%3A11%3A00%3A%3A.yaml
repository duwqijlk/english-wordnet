simpleMeaning: an event that fails badly or does nothing it was meant to do at all
scope: This is an event that fails badly, not a weapon that blows up and not the closed container used
  to measure heat from burning.
examples:
- The new play was a bomb, and few people stayed to the end.
- His party was a bomb because no one had fun.
