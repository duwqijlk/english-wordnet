simpleMeaning: The flesh of any of several freshwater fishes of North America or of Europe.
scope: Also called freshwater bream, the flesh of any of several freshwater fishes of North America or
  of Europe, not the whole fish itself and not the flesh of sea fishes.
examples:
- Bream from the river was fried for supper.
- The bream on her plate came from a freshwater fish of Europe.
