simpleMeaning: an opening shaped like a circle or an egg that lets light into a dome or a long curved
  roof
scope: 'Also called a lunette: an opening that lets light into a dome or vault, not a window in a wall
  and not a door.'
examples:
- Light shone through the fenestella into the dome.
- The fenestella was cut into the top of the vault to let in daylight.
