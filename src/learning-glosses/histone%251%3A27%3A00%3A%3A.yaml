simpleMeaning: Found in the centres of cells together with the acids that carry the cell's code, this
  plain protein is made mostly of small basic parts.
scope: It is one of the proteins in the centre of the cell, working with the acids that carry the cell's
  code.
examples:
- Histones are found in the centres of cells.
- A histone is a protein, not one of the acids that carry the cell's code.
