senseId: 'anticholinergic%3:00:00::'
synsetId: 00061347-a
simpleMeaning: said of a thing that stops acetylcholine, a chemical that carries signals between nerves,
  from acting where it locks on to a cell
scope: Said of a thing that blocks acetylcholine at the place where it acts, not the noun for the substance
  itself, and not a drug that boosts acetylcholine.
examples:
- Doctors chose an anticholinergic drug to stop the muscle spasms.
- The anticholinergic drugs slowed the signals between the nerves.
