senseId: 'nitrate%1:27:00::'
synsetId: 15040068-n
simpleMeaning: Any chemical with a set group of nitrogen and oxygen atoms, such as a salt or an ester
  (a chemical made from an acid and alcohol) of nitric acid
scope: This is a substance that holds the nitrogen and oxygen group; it is not the act of treating something
  with acid to change it into such a substance.
examples:
- This nitrate is a salt made from nitric acid.
- The farmer put a nitrate on the fields to help the plants grow.
