simpleMeaning: A small or mid-size tree of the west coast of North America with crooked boughs, giving
  fine hard wood with a tight grain.
scope: Also called western yew, California yew and Taxus brevifolia; it is a small or mid-size tree of
  the west coast of North America, not a tall tree of the east coast, giving fine hard wood with a tight
  grain.
examples:
- A Pacific yew grew on the hillside above the sea.
- Pacific yew wood is fine, hard, and close-grained.
