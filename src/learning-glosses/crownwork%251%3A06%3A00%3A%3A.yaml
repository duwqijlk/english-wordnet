simpleMeaning: In dentistry, a false tooth-top made to fit over a tooth that is broken or has gone bad
scope: 'In dentistry, also called a jacket, a crown, a cap, and a jacket crown: a false tooth-top made
  to fit over a tooth that is broken or has gone bad, not the fortification of the same name.'
examples:
- Tomorrow my dentist will fit me with crownwork for my broken tooth.
- Crownwork covers a tooth that is broken or has gone bad.
