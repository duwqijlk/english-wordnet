simpleMeaning: how firmly a thing is held in one place so that it cannot move
scope: How firmly a thing is held in one place so that it cannot move, not how hard it is to change a
  thing once it is set and not a thing held loosely.
examples:
- The fixedness of the post kept the fence upright.
- She tested the fixedness of the bolt.
