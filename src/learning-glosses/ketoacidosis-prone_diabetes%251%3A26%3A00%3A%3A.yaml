simpleMeaning: A severe form of diabetes starting early in life, bringing bouts of blood acid build-up,
  heavy urination, great thirst, hunger and weight loss, and calling for diet and insulin injections.
scope: Another name for the same severe, early-onset, insulin-treated diabetes also called ketosis-prone
  diabetes; not adult-onset type 2 diabetes or diabetes insipidus.
examples:
- People with ketoacidosis-prone diabetes can become seriously ill within hours.
- Ketoacidosis-prone diabetes calls for careful monitoring of blood acids.
