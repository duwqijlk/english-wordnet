simpleMeaning: a soft, warm mass of meal or clay spread on cloth and put on the skin for medical use,
  to help sore, swollen places or help blood flow
scope: A soft, hot mass on cloth put on the skin for medical use, not the hard mix used to cover walls
  and not a thin sticky strip put on a small cut.
examples:
- The nurse put a warm plaster on his sore chest.
- An old plaster made of clay and meal was laid on the swollen leg.
