simpleMeaning: in a strong, firm way that will not break or fall easily
scope: 'This tells how something is made or how it stands: in a strong, firm way. It does not name the
  strong thing itself, only the way.'
examples:
- The bridge was sturdily built and stood for a hundred years.
- She stood sturdily on the deck of the rocking boat.
