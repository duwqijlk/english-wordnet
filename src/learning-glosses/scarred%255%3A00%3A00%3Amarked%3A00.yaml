simpleMeaning: Deeply changed or marked in mind or body because of pain, or because the mind or the body
  was hurt
scope: Marked or deeply changed by past pain or hurt, in mind or body, not free from such marks or effects.
examples:
- Her mind was still scarred by the fear she lived through as a child.
- The fire left his arm badly scarred.
