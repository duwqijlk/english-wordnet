simpleMeaning: not having learned the basic parts of an art or area of study, and not knowing that one
  area well
scope: 'Also called ignorant: this is about not knowing the basics of one art or field, not about having
  no schooling at all.'
examples:
- She is illiterate in science and does not know its most basic ideas.
- Though a good cook, he was illiterate about music and knew none of its basics.
