simpleMeaning: Some rod-shaped germs of the gut cause sickness of the airways and other sicknesses; the
  group does not move and does not take up a purple dye.
scope: This group of rod-shaped gut germs stands apart by not moving and not taking up a purple dye.
examples:
- Klebsiella can cause sickness of the airways.
- The lab found klebsiella in the sample.
