simpleMeaning: acting as if you are far above other people and looking down on those you think are not
  good enough
scope: This is acting as if you stand far above other people and look down on those you think are not
  good enough, and haughty, disdainful and lordly are other names for it, not just being proud and not
  simply telling people what to do.
examples:
- The imperious manager spoke to the staff as if they were beneath her.
- His imperious manner made visitors feel small.
