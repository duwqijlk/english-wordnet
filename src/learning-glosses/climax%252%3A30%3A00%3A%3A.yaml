simpleMeaning: to end, especially by reaching the last and most important stage
scope: 'This is the verb sense: to end by reaching the last and strongest stage; it is not the noun for
  the strongest point in sex, and not the noun for words set out in rising order of force.'
examples:
- The festival climaxed with a big firework show on the last night.
- Months of talks climaxed in a signed agreement between the two sides.
