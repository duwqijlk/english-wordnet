simpleMeaning: to surprise someone so much that they do not know what to say or do
scope: 'Also called ball over, floor, and shock: to give someone a huge surprise, not to beat someone
  in a contest, and not to give someone a small pleasant surprise.'
examples:
- The news that she had won the prize blew her right out of the water.
- When the small team beat the champions, it blew everyone out of the water.
