simpleMeaning: Any creature that lives and feeds on the open grass land of western North America, above
  all horses, cattle and sheep
scope: A creature that lives and feeds on open grass land; not a farm animal kept in a barn and not a
  wild animal of the forest.
examples:
- Range animals grazed on the open grass land all summer.
- The rancher moved his range animals to fresh grass.
