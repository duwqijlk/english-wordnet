simpleMeaning: Extra time past a deadline for meeting an obligation, when the late penalty is waived,
  especially as a special favor.
scope: Also called grace, this is extra time after a deadline with no fine for being late, not a new deadline
  itself.
examples:
- The bank gave us a grace period of two weeks to pay.
- Her grace period ended on Friday, so she paid on Thursday.
