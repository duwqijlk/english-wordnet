simpleMeaning: the quality of having no mark or fault, of being spotless, clear, clean, and pure
scope: The quality of being spotless and pure, not a clean room and not freedom from blame for a crime.
examples:
- She kept her immaculacy through years of hard service.
- His immaculacy was known to all who met him.
