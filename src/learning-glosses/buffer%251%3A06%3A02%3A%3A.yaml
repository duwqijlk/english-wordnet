synsetId: 03333146-n
simpleMeaning: A slanted metal frame at the front of a train that pushes things off the track
scope: A slanted frame at the front of a train that clears the track; pilot and fender are other names
  for this sense, not a tool for polishing and not a cushion that takes a shock.
examples:
- The buffer on the front of the engine pushed the fallen branch off the rails.
- Snow had piled up, and the buffer cleared it from the track as the train moved on.
