senseId: 'incurious%3:00:00::'
synsetId: 00668792-a
simpleMeaning: Showing no wish to know more or to learn about things, and no wish to ask questions
scope: This is about a person who shows no wish to know or learn about things. It is not about a person
  who cannot learn, and not about a thing that is dull or not interesting.
examples:
- He was strangely incurious about why prices were rising around him.
- She stayed incurious and never asked what had happened.
