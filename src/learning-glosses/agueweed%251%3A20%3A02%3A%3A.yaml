simpleMeaning: A herb from the southeastern United States with flower heads whose rays are white, that
  lives for many years and was once used in folk medicine.
scope: This herb of the southeastern United States is also called boneset and thoroughwort; it is not
  the gentian with clusters of bristly blue flowers, but a herb with white-rayed flower heads once used
  in folk medicine.
examples:
- They once used agueweed in folk medicine.
- She picked agueweed for the white rays on its flower heads.
