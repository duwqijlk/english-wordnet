simpleMeaning: A language family of the Fulani of West Africa, used as a shared tongue south of the Sahara
  from Senegal to Chad; the best known of the West African languages.
scope: Also called Ful, Fula, and Fulani; not a single language and not a language of East Africa.
examples:
- Peul is spoken across West Africa from Senegal to Chad.
- She learned Peul because it is widely used in the region.
