simpleMeaning: Someone in a secret group that works against a country from within, trying to help an enemy
  who may invade
scope: 'Also called a saboteur: someone in a secret group working from inside a country to help an outside
  enemy, not an open enemy soldier and not a spy who only gathers secrets.'
examples:
- The fifth columnist passed the invaders' plans to his contacts.
- Police arrested a fifth columnist who had been helping the enemy in secret.
