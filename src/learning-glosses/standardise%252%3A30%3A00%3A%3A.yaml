simpleMeaning: to make things follow one fixed rule or measure
scope: To make things follow one fixed rule or measure; standardize is another name for this sense; not
  to judge something against a rule, which is the other sense of this word.
examples:
- They standardised the parts so any worker could fit them.
- The company standardised its prices across all its shops.
