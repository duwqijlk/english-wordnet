simpleMeaning: a long made-up work in writing that is not poems, usually told as a story
scope: This sense names the long made-up work itself, as writing. The other novel sense names the printed
  book that holds such a work.
examples:
- The novel took her ten years to write, long before any book was printed.
- This novel is told by a child who sees more than the grown-ups around her.
