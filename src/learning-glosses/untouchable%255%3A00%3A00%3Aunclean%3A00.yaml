senseId: untouchable%5:00:00:unclean:00
synsetId: 00429740-s
simpleMeaning: especially in traditional Hindu belief, used of the lowest caste or castes (the lowest
  classes people are born into) and making others unclean
scope: This describes a person or thing as unclean in this belief, not the noun for a person who belongs
  to the lowest class in India.
examples:
- In that belief, people of the lowest caste were seen as untouchable.
- He was treated as untouchable because of the caste he was born into.
