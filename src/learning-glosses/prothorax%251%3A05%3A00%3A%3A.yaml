simpleMeaning: The front part of the middle of an insect's body, which carries its first pair of legs
scope: The front part of an insect's middle body part, not the head and not the back part.
examples:
- The prothorax of the beetle carries its front legs.
- Ants use the prothorax to hold their first pair of legs.
