simpleMeaning: the quality of speech or writing that is clear and easy to understand, with nothing hard
  to follow
scope: 'Also called clarity and clearness: the clearness of speech or writing, not the same-word sense
  of a clear state of mind that is not confused.'
examples:
- The lucidity of her essay made a hard topic easy to follow.
- Students praised the lucidity of his explanation of the new rules.
