senseId: 'vantage%1:15:00::'
synsetId: 08694813-n
simpleMeaning: a place or state of things that puts you in a good position, most often with a wide view
  from high up
scope: A place or situation that gives you an advantage, most often a wide view; not a place of safety
  or a high point in itself.
examples:
- From her vantage on the hill, she could see the whole valley.
- The balcony gave him a fine vantage over the square.
