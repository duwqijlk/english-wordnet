simpleMeaning: Inside a pocket of skin holding the teats, the young of these animals feed and are carried
  by their mothers.
scope: Also called a marsupial, these are animals whose mothers carry the young in a pocket of skin with
  the teats inside.
examples:
- The pouched mammal's young stayed in the pocket of skin.
- A pouched mammal feeds its young from teats inside the pouch.
