simpleMeaning: Hard to get and costly to borrow, as money or credit can be.
scope: This describes money, credit or a market in short supply, not a person unwilling to give or an
  object fixed firmly in place.
examples:
- Money was tight, so the company postponed its expansion.
- In a tight market, buyers struggle to get a loan.
