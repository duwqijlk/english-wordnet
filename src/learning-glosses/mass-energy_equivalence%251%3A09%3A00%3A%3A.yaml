simpleMeaning: Relativity theory says a set amount of matter and a set amount of the power to do work
  are the same thing.
scope: In physics, this is the relativity rule that a set amount of matter and a set amount of the power
  to do work are the same thing.
examples:
- Physicists state mass-energy equivalence as the rule that matter and the power to do work are the same
  thing.
- By mass-energy equivalence, a measured amount of matter counts as a measured amount of the power to
  do work.
