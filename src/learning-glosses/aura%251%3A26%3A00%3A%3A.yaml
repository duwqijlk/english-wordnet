simpleMeaning: A strange feeling, like a cold breeze or a bright light, that comes before a migraine or
  a fit
scope: A strange feeling that comes before a migraine or a fit, not the light drawn round a saint and
  not a person's mood.
examples:
- She felt an aura before the migraine began.
- An aura of bright light warned him that a fit was coming.
