simpleMeaning: In geology, a crack in the ground where the top side looks as if it has been pushed up
  by squeezing
scope: This is a crack in rock where the top side has been pushed up; overthrust fault and reverse fault
  are other names for this sense. Not an ordinary break in rock and not a device that holds a turning
  part.
examples:
- The thrust fault pushed the older rock above the younger rock.
- Geologists mapped a thrust fault along the mountain front.
