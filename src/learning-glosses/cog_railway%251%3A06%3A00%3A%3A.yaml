simpleMeaning: To climb steep hills, a train uses a middle track with teeth that catch a toothed wheel
  on the engine and pull the train up
scope: This is a train line for steep ground, not an ordinary line or a cable car; also called a rack
  railway.
examples:
- The cog railway climbed the steep mountain slowly.
- We rode the cog railway up to the top of the hill.
