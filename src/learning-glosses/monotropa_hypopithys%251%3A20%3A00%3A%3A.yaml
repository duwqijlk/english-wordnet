simpleMeaning: A fleshy tawny or reddish herb feeding on dead matter and looking like Indian pipe, in
  woodland humus of eastern North America; some place it in a separate genus Hypopitys.
scope: Also called false beachdrops and pinesap; a fleshy herb of eastern North American woods that feeds
  on dead matter, not a mushroom and not a green plant.
examples:
- Monotropa hypopithys grows in the humus of eastern North American woods.
- The tawny stems of Monotropa hypopithys look like Indian pipe.
