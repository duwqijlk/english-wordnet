simpleMeaning: money in the form of printed notes, put out by a government or central bank, that can be
  used in place of coins
scope: Money in the form of printed notes, put out by a government or central bank, that can be used in
  place of coins; folding money and paper money are other names for this sense, and it is not coins or
  a cheque.
examples:
- The shop takes paper currency as well as coins.
- Paper currency replaced coins for large sums.
