simpleMeaning: trousers whose legs widen from the knee down and end in very wide hems; sailors wore them,
  and the very wide hem was the fashion of the 1960s
scope: Also called bellbottom pants and bellbottom trousers; wide-legged trousers, not ordinary straight
  trousers and not a skirt.
examples:
- She bought a pair of bell-bottoms for the fancy-dress party.
- The sailors wore bell-bottoms with their uniforms.
