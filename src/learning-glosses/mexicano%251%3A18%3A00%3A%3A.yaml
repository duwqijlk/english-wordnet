simpleMeaning: In the United States lives a Mexican, or a person whose family came from Mexico.
scope: Also called Mexican-American, this is a Mexican, or a person whose family came from Mexico, who
  lives in the United States, not a Mexican living in Mexico.
examples:
- He is a Mexicano who grew up in Texas.
- Many Mexicanos live in the United States.
