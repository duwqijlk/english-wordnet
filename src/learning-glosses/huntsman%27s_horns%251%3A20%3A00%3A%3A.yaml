simpleMeaning: A plant of the southeast of the United States with tall yellow tubes shaped like trumpets,
  each with a wide mouth and a lid that stands up
scope: Also called huntsman's horn, trumpets, yellow pitcher plant, and yellow trumpet, this is a southeastern
  plant with tall yellow trumpet-shaped tubes.
examples:
- Huntsman's horns grew in the wet pine woods.
- The huntsman's horns had wide mouths and lids that stood up.
