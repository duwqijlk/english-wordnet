simpleMeaning: Something that no one can cancel, undo, or make void
scope: This is something that no one can cancel, undo, or make void, and not something that can be set
  aside.
examples:
- She holds an indefeasible right to freedom.
- His indefeasible claim to the title could not be challenged.
