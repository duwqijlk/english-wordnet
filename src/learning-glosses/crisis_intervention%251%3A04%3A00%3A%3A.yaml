schema: oewn-learning-gloss-v2
senseId: 'crisis_intervention%1:04:00::'
synsetId: 00704675-n
simpleMeaning: Talk therapy for someone in a sudden crisis, such as a severe depressive episode, suicide
  attempt or drug overdose, aiming to restore how they functioned before.
scope: Emergency talk therapy during a mental health crisis, not regular ongoing therapy for everyday
  emotional difficulties.
examples:
- The hospital called in a crisis intervention team after the overdose.
- She received crisis intervention the night she attempted suicide.
