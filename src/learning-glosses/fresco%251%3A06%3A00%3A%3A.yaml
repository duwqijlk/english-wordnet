simpleMeaning: a picture painted on a wall while the plaster is still wet, using paints mixed with water
scope: A wall painting made on wet plaster, not the way of painting it and not any painting on a wall.
examples:
- The church wall held a fresco of angels.
- Visitors admired the old fresco above the door.
