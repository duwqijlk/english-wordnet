simpleMeaning: A herb grown widely, with leaves prized as salad green, either curly leaves with jagged
  edges or broad flat ones that are usually made pale.
scope: Also called witloof, a herb grown widely for its leaves as salad green.
examples:
- Endive grew in the salad bed beside the lettuce.
- The endive leaves were broad and flat, made pale under cover.
