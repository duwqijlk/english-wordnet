simpleMeaning: the highest amount of money a government is allowed to borrow
scope: This is the highest amount a government is allowed to borrow, also called a debt ceiling; not a
  cap on what a person can borrow and not the money a government already owes.
examples:
- The debt limit was reached in June, and no more bonds could be sold.
- Lawmakers argued for weeks over raising the debt limit.
