scope: This is the most common kind of spots on the skin, usually from the teens to the early twenties;
  not rarer skin problems, and not spots that come at any age.
examples:
- Her acne vulgaris started when she was thirteen and eased in her early twenties.
- The doctor said his acne vulgaris was the most common kind of acne.
