simpleMeaning: In chemistry, to mark a tiny bit of matter so it can be followed through a change, using
  an atom that gives off rays or weighs more than usual
scope: In chemistry, marking one tiny bit of matter so it can be followed, not the tracer stuff itself
  and not putting a tag on a thing.
examples:
- The chemists labelled the carbon atoms to follow them through the reaction.
- She labelled the atoms so she could trace where they went in the test.
