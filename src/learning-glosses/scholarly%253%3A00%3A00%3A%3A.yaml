simpleMeaning: like the work of people who study a subject deeply and learn about it, or like that deep
  study itself
scope: This sense is about study and learning at a high level and the people who do it, not about school
  for children and not just being clever.
examples:
- She wrote a scholarly book about old Roman roads.
- He has a scholarly way of checking every fact.
