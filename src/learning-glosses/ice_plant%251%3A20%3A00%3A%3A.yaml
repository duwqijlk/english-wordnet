simpleMeaning: White flowers and thick leaves with hairs like frozen water mark a one-year plant of the
  Old World, now at home far and wide in warm lands.
scope: Also called icicle plant, it is the one-year plant of the Old World whose thick leaves look frozen.
examples:
- The ice plant opened white flowers.
- Hairs on the ice plant leaves look like frozen water.
