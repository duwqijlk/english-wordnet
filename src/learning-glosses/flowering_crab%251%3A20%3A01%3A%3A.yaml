simpleMeaning: A small tree or bush from the southeast of the United States, grown as a show plant for
  its rose-coloured blooms.
scope: This is a small tree or bush from the southeast of the United States grown for its rose-coloured
  blooms, not the kind bred from the Iowa crab with large double pink blooms.
examples:
- The flowering crab blooms each spring.
- They planted a flowering crab in the yard.
