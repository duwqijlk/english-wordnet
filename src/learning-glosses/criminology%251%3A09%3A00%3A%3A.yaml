simpleMeaning: the scientific study of unlawful acts, of how people who break the law act, and of how
  people are made to follow the law
scope: This is the study of unlawful acts and of how people are made to follow the law; not the work of
  the police, and not one single unlawful act.
examples:
- She studied criminology at university.
- His book on criminology looked at why young people break the law.
