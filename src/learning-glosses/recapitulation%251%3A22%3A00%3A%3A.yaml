simpleMeaning: the way an unborn young one grows through forms that its kind had long ago in its past
scope: 'Another name for palingenesis: the growth of an unborn young one through old forms of its kind,
  not the part of a piece of music where tunes come back.'
examples:
- The recapitulation of the unborn young one showed forms its kind had in the far past.
- The book said recapitulation is why the embryo at first looks like old forms of its kind.
