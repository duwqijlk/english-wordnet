synsetId: 00823762-v
simpleMeaning: To mark a paper with an official stamp or signature, so others accept it as genuine.
scope: To have a paper officially marked as genuine; notarize is another name for this act; not simply
  signing a paper yourself, and not having it witnessed by any passer-by.
examples:
- We had to have the signature notarised before the bank would accept it.
- The solicitor will notarise the copy of your will this afternoon.
