senseId: 'existentialist_philosopher%1:18:00::'
synsetId: 10091345-n
simpleMeaning: This thinker holds people to account for the choices they make freely, while holding that
  human life in a hostile world cannot be explained.
scope: This thinker is also called an existential philosopher and an existentialist, and the shared name
  marks one for whom free choice and answering for it go together in a world that cannot be explained.
examples:
- The existentialist philosopher taught that freedom of choice brings personal responsibility.
- As an existentialist philosopher, he saw human life in a hostile universe as beyond explaining.
