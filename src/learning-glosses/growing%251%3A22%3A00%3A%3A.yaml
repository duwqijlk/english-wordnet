simpleMeaning: the purely biological sequence through which a living thing naturally develops, changing
  step by step from a simple form to a more complex one
scope: This is the biological development of a living thing, not the adjective sense meaning relating
  to or suitable for growth, and not the electronics sense about making semiconductor crystals.
examples:
- The growing of a child follows a predictable series of stages.
- Researchers measured the growing of the cells over several days.
