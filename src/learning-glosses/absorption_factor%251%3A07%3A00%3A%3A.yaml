simpleMeaning: In physics, the share of rays and sound falling on a body that the body takes in or can
  take in.
scope: 'Another name for this sense is absorptivity: in physics, how much of the rays and sound that fall
  on a body the body takes in.'
examples:
- The absorption factor of the black wall was high.
- Scientists measured the absorption factor of the new sound panels.
