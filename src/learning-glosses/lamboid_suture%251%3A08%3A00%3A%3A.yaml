simpleMeaning: The line where the bone at the back of the skull meets a bone at the side of the skull
scope: The line where the back bone of the skull meets a side bone of the skull, not other joins between
  skull bones and not a wound closed with stitches.
examples:
- The lamboid suture runs across the back of the skull.
- Doctors can see the lamboid suture on the X-ray of the skull.
