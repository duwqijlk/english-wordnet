simpleMeaning: After the count of the people, a holy rite held every five years to clean the people of
  Rome
scope: A holy rite of old Rome that cleansed the people after the census, not a tax count and not a yearly
  feast.
examples:
- The lustrum was held after the census every five years.
- Priests led the lustrum to cleanse the Roman people.
