simpleMeaning: The idea that art or books should show things just as they are in real life
scope: The idea that art and books should show life just as it is, not by symbols and not in a dream-like
  way.
examples:
- His literalism made every scene look like a photograph.
- Literalism in the novel left nothing to the reader's imagination.
