simpleMeaning: A picture or a page goes into this machine and comes out as numbers a computer can use
scope: A machine that turns a picture or page into numbers for a computer, also called a digital scanner
  and a scanner; not a printer and not a camera.
examples:
- She put the old photo on the image scanner to save a copy on her computer.
- The office image scanner turns paper forms into files in seconds.
