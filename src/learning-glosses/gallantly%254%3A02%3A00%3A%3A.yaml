simpleMeaning: in a brave way, or in a polite way that shows kind care for other people
scope: In a brave way, or in a polite way that shows kind care for other people; not in a rude way, not
  in a fearful way, and not just in a strong way.
examples:
- He gallantly offered his seat to the old woman on the bus.
- The young soldier gallantly ran back to help his hurt friend.
