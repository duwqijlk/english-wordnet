simpleMeaning: a tube-shaped part in the pipe that takes gas out of an engine, made to make the sound
  less loud
scope: 'Also called silencer: this is the part on an engine that makes sound less loud, not a warm cloth
  worn round the neck and not a part that cuts down shaking.'
examples:
- The car was loud because its muffler had a hole in it.
- He replaced the muffler to make the engine quieter.
