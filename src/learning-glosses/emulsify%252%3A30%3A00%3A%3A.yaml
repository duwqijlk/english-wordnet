simpleMeaning: to turn into, or make, a mix of two liquids that do not blend, held together as tiny drops
scope: To turn into, or make, a mix of unblending liquids; the near sense covers only making, not becoming.
examples:
- The cook had to emulsify the oil and water.
- The mixture will emulsify if you stir it fast.
