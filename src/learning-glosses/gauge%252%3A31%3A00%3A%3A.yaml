simpleMeaning: To put a likely number or time on a thing when you cannot be sure of it.
scope: 'Also called guess, judge, estimate, and approximate: a rough guess at an amount or a length of
  time, not fitting a thing to a stated size, and not working out a size by measuring and figuring.'
examples:
- She gauged the crowd at about two hundred.
- He gauged that the trip would take three hours.
