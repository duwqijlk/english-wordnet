simpleMeaning: In divisions of time, recognized by law as the standard units for everyday life.
scope: Calendar units given official standing for everyday use; not polite behavior, not citizens or state
  matters, and not social order.
examples:
- The civil year begins on January 1 in most countries.
- A civil day runs from midnight to midnight.
