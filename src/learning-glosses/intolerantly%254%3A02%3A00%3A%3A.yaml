simpleMeaning: in a way that shows no open mind toward other views
scope: In a way that shows no open mind toward other views, also called illiberally; not in a fair and
  open way and not with open anger.
examples:
- He spoke intolerantly about people whose faith was not his own.
- She answered intolerantly when her students asked questions.
