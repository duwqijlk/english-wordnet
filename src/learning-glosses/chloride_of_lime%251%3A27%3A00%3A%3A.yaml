simpleMeaning: Calcium hydroxide, hypochlorite and a chlorine salt make up this white powder, used to
  make things white and to kill germs.
scope: Also called bleaching powder and chlorinated lime, it is a white powder used to bleach and to kill
  germs.
examples:
- She used chloride of lime to bleach.
- The chloride of lime killed the germs.
