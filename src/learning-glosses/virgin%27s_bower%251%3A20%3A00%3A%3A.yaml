simpleMeaning: Sprawling over other plants in eastern North America, a common climber bears many bunches
  of small creamy white flowers.
scope: Also called devil's darning needle and old man's beard, it is a common climber of eastern North
  America that sprawls over other plants, not a shrub that stands on its own.
examples:
- The virgin's bower sprawled over the fence, covered in small creamy white flowers.
- A virgin's bower climbed over the old wall by the road.
