simpleMeaning: tissue in an animal's body made mainly of cells that can tighten and pull
scope: Muscular tissue is another name for it; it is the tissue itself, not a single muscle organ nor
  the strength or power that muscle can also mean.
examples:
- Regular exercise keeps muscle tissue strong and flexible.
- The sample contained muscle tissue from the animal's leg.
