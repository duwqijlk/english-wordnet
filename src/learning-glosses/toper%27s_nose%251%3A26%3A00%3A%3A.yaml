simpleMeaning: a nose with red skin showing many small blood vessels, grown large with wide pores, often
  in a person who drinks far too much alcohol
scope: Also called a brandy nose, a copper nose, a hammer nose, hypertrophic rosacea, a potato nose, rhinophyma,
  a rum-blossom, or a rum nose; a swollen red nose with open pores, not a nose hurt in an accident.
examples:
- His toper's nose was red and swollen, its pores wide open.
- The doctor noted the toper's nose and asked about his drinking.
