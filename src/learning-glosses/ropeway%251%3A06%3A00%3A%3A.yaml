simpleMeaning: Tall posts hold up cables from which cars hang to carry people or loads.
scope: Tram, aerial tramway, cable tramway and tramway are other names for this conveyance, whose cars
  hang from cables held up by tall posts and carry people or loads.
examples:
- The ropeway carried passengers in cars hung from cables.
- Freight was moved by ropeway.
