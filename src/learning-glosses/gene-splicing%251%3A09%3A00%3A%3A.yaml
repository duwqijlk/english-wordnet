simpleMeaning: the work of making new DNA in a lab by cutting up bits of DNA from more than one living
  thing and joining the bits together
scope: 'Also called genetic engineering: the work of making new DNA in a lab from bits of DNA from more
  than one living thing, not the study of genes on their own.'
examples:
- Scientists use gene-splicing to make new DNA from bits taken from two plants.
- Gene-splicing lets doctors put a healthy bit of DNA into a sick cell.
