simpleMeaning: the long spinning part of a helicopter that holds it up in the air
scope: 'Also called a rotary wing: the spinning part that lifts a helicopter, not a fixed wing of a plane
  and not the small fan at the tail.'
examples:
- The rotor blade turned slowly as the engine warmed up.
- Mechanics checked each rotor blade before the helicopter took off.
