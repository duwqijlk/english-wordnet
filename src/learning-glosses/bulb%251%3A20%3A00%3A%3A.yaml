simpleMeaning: a thick, round stem under the ground that is a changed bud (a small new growth on a plant)
  and can make a new plant
scope: A plant part that grows under the ground and can make a new plant, not an electric light and not
  a part of the brain.
examples:
- She planted tulip bulbs in the garden in autumn.
- He dug up the daffodil bulbs to plant them in another place.
