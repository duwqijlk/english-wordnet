simpleMeaning: Fitted closely together so that each part locks into the next.
scope: 'Also called interwoven or interlocking: parts fitted closely so they lock together, not parts
  merely placed side by side.'
examples:
- The interlacing branches formed a roof over the path.
- Interlacing roots held the bank together.
