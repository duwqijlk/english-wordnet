simpleMeaning: In geometry, a flat shape made by two straight lines from the center of a circle to its
  edge and the curved part of the edge between them
scope: In geometry, a flat part of a circle between two straight lines from its center and a curved edge,
  not a measuring tool and not a computer storage piece.
examples:
- Draw a sector that is one quarter of the circle.
- The shaded sector has two straight sides and one curved side.
