simpleMeaning: A main beam or plate that runs along the bottom of a boat or ship, and can reach down into
  the water to keep the boat steady
scope: The long beam at the bottom of a boat's hull, not the ridge on a bird's breastbone and not any
  other ridge that looks like one.
examples:
- The keel of the old sailing ship was made of oak.
- Workers scraped the keel clean before the boat went back in the water.
