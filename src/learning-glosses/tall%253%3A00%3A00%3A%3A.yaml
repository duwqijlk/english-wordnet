simpleMeaning: Measuring a great distance from bottom to top, or being of great height.
scope: This is about upward size, not about being high off the ground, and not the 'tall story' sense
  of something hard to believe.
examples:
- The tall grass hid the children completely.
- They live in a tall narrow house near the river.
