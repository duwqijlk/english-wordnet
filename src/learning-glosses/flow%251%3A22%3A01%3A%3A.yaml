simpleMeaning: The monthly bleeding from a woman's womb between puberty and the end of her fertile years.
scope: This is the monthly bleeding of a woman's body, not a stream of liquid and not a steady movement
  of people or things.
examples:
- She tracked her flow each month to see whether her cycle was regular.
- Her flow was unusually heavy that month, so she saw a doctor.
