simpleMeaning: Any of several kinds of long animal with no legs, from North America and Asia, that is
  not poisonous and eats small gnawing animals
scope: A harmless snake that eats small gnawing animals, not a poisonous snake and not a snake that eats
  birds.
examples:
- We saw a rat snake sliding through the grass by the barn.
- The rat snake had eaten a mouse in the barn.
