simpleMeaning: a small round beetle, a kind of insect, with bright colors and spots, that usually eats
  aphids (small insects that hurt plants) and other harmful insects
scope: Also called ladybird, lady beetle, ladybeetle and ladybird beetle, this is the small spotted insect,
  not any other kind of beetle.
examples:
- A ladybug landed on the leaf.
- We saw a red ladybug eating tiny insects on the plant.
