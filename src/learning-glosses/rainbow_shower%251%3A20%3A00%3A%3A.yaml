simpleMeaning: A deciduous ornamental hybrid from southeast Asia and Hawaii, losing its leaves each year
  and bearing flower spikes that shade from cream through orange to red.
scope: The multi-coloured ornamental hybrid, not the golden shower or pink shower trees.
examples:
- The rainbow shower was covered in cream and orange flowers.
- Gardeners plant rainbow shower for its bright flowers.
