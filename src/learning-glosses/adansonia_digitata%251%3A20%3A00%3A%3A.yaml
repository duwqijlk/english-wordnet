simpleMeaning: An African tree with a very thick trunk and fruit like a gourd, with an edible pulp called
  monkey bread.
scope: Also called baobab and monkey-bread tree; an African tree with a very thick trunk and gourd-like
  fruit, not the sausage tree and not the bottle tree.
examples:
- Adansonia digitata has a very thick trunk and fruit like a gourd.
- The fruit of Adansonia digitata holds an edible pulp called monkey bread.
