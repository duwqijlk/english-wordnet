simpleMeaning: one of the movements of the arms, legs and body that a person repeats to move through water
  or to row a boat
scope: One movement in swimming or rowing, not the brain illness and not a swing at a ball in sport.
examples:
- She counted her strokes as she swam across the pool.
- The rowers made each stroke together to move the boat forward.
