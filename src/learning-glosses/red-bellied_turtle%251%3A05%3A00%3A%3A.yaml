simpleMeaning: A terrapin of fresh water in the rivers that run into Chesapeake Bay, with rusty marks
  on the shell below
scope: A fresh-water turtle of Chesapeake Bay rivers, also called a red-bellied terrapin or a redbelly;
  not a sea turtle and not a land tortoise.
examples:
- The red-bellied turtle swam slowly through the creek.
- A red-bellied turtle rested on the muddy bank.
