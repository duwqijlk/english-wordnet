simpleMeaning: A machine timed to its supply turns one kind of electric power into the other, the kind
  that flows back and forth or the kind that flows one way.
scope: Rotary and rotary converter are other names for this machine, which is timed to its supply and
  turns power of one kind into power of the other, not one that works in a single direction only.
examples:
- The synchronous converter changed the alternating current to direct current for the motor.
- A synchronous converter let the plant use both kinds of current.
