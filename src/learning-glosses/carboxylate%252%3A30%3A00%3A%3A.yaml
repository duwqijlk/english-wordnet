simpleMeaning: To treat a chemical with the -COOH part or with an acid that holds that part.
scope: To treat a chemical with the -COOH part or with an acid that holds that part, not to wash a chemical
  and not to heat it.
examples:
- The chemist will carboxylate the compound before the next step.
- They carboxylate the starting chemical to add the -COOH part.
