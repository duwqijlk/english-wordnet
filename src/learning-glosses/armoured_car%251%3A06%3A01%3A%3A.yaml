simpleMeaning: Banks and shops use this truck to move cash and things worth much, its sides covered in
  thick metal plates and its doors shut with strong locks.
scope: Also called armored car, this truck is the one that moves cash for banks and shops behind thick
  metal sides and strong locks.
examples:
- An armoured car stopped at the bank to collect the day's takings.
- The guards loaded the boxes into the armoured car and locked its doors.
