senseId: 'maunder%2:32:01::'
synsetId: 01038676-v
simpleMeaning: To ramble fast on trifles, without pause.
scope: This sense is also called chatter, clack, prattle, gibber, gabble, blabber, blab, tattle, piffle,
  prate, twaddle, and palaver, for rambling fast on trifles, without pause, where chatter is to talk fast
  about small, unimportant things, and to keep on talking without a break.
examples:
- He maundered fast on trifles.
- Maundering rambles without pause.
