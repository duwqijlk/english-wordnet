simpleMeaning: a person's inner qualities, especially those that guide right and wrong behaviour.
scope: It is not a person in a story, a letter in writing, or the special quality of a thing; it means
  someone's moral nature.
examples:
- Honesty is an important part of her character.
- The hard times revealed his true character.
