simpleMeaning: a leafy green often kept in the home, with no stem and stiff narrow leaves
scope: A leafy green often kept in the home, with no stem and stiff narrow leaves, also called mother-in-law's
  tongue; not a leafy green with a stem, and not one that grows only outside.
examples:
- A snake plant stood in the corner of the living room.
- She watered the snake plant once a week.
