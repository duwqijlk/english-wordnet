simpleMeaning: a part with rows of seats that rise as they go back, for people to watch from, as in a
  theatre or a room for medical operations
scope: Also called amphitheater. This is a rising set of rows of seats for watching, as in a theatre,
  not the whole large oval building for shows and sports.
examples:
- From the top row of the amphitheatre, the students could see the operation clearly.
- We sat high up in the amphitheatre and watched the play.
