simpleMeaning: a light arm that is part of a machine, keeps its balance well, and holds the cartridge,
  the small part that holds the needle
scope: This is the light arm part on a record player, not the small part that holds the needle and not
  a car's power to go faster quickly.
examples:
- The pickup on the record player is a light arm that holds the cartridge.
- He lifted the pickup and placed it gently on the record.
