simpleMeaning: showing a very strong lack of respect for things people hold holy
scope: 'Also called blasphemous and sacrilegious: showing no respect for holy things, not about swearing
  and not about a thing that is not holy.'
examples:
- He made profane jokes about the holy place.
- Many people saw the act as profane because it showed no respect for what they hold holy.
