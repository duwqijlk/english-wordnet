simpleMeaning: The person who holds this paper may catch fish, but only for a set length of time
scope: 'Also called a fishing license and a fishing permit: a paper that lets the person who holds it
  catch fish for a set length of time, not a paper that lets a person hunt and not a paper that lasts
  for life.'
examples:
- You need a fishing licence to fish in this lake.
- His fishing licence runs out at the end of June.
