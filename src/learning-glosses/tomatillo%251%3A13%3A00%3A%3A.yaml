simpleMeaning: A small, edible, yellow, shading to purple, tomato-like fruit, shut in a bladder-like husk.
scope: A small, edible, yellow, shading to purple, tomato-like fruit, shut in a bladder-like husk; also
  called husk tomato; not a Mexican one-year plant, now wild in east North America, with yellow to purple
  fruit to eat, like small tomatoes, nor an annual plant of Mexico and the south United States, with edible,
  purplish, sticky fruit in the shape of small tomatoes.
examples:
- Their tomatillo ripened at dusk.
- The tomatillo was picked at dawn.
