simpleMeaning: a common shore bird of Europe and Asia, whose male grows a ring of neck feathers that stand
  up when it mates
scope: A sandpiper, not the ring of neck feathers on a bird and not the card-game move of taking a trick
  with a trump.
examples:
- The ruff waded along the shore, probing the mud with its bill.
- In spring, male ruffs show off their raised neck feathers.
