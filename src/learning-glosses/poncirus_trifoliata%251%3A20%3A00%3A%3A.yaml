simpleMeaning: A small fast-growing thorny Chinese orange tree that sheds its leaves each year, with sweet-smelling
  flowers and showy but inedible fruit; used as grafting stock and for hedges.
scope: A small thorny Chinese orange tree with showy but inedible fruit, not a sweet orange tree; also
  called trifoliata, trifoliate orange, and wild orange.
examples:
- Poncirus trifoliata guards the hedge with its thorns.
- Poncirus trifoliata bears sweet-smelling flowers in spring.
