simpleMeaning: Wines and jellies are made from the black fruit of this elder shrub, or small elder tree,
  of Europe and Asia.
scope: Also called elderberry, black elder, or bourtree, this elder shrub or small elder tree of Europe
  and Asia bears black fruit used for wines and jellies.
examples:
- They made wine from the black fruit of the common elder.
- The common elder bore black fruit for jellies.
