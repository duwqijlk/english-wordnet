simpleMeaning: a fancy image in a poem that links two very unlike things in a surprising way
scope: A bold poetic comparison of unlike things, not false pride in yourself and not a clever turn of
  phrase.
examples:
- The poet's conceit compared love to a compass.
- Her conceit likened the city to a great sleeping beast.
