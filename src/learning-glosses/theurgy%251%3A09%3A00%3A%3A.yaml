simpleMeaning: good magic done with the help of kind spirits, once done by thinkers who followed Plato
scope: Good magic worked with the help of kind spirits, not dark magic and not a trick done by hand.
examples:
- In the old tale, the priest used theurgy to call on kind spirits.
- The scholar wrote about theurgy and the kind spirits it called on.
