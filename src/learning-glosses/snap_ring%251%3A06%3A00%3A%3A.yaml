scope: Also called carabiner and karabiner, it is a long metal loop with a clip that shuts on its own,
  used by climbers to fix a rope to a pin in rock or to join two ropes.
examples:
- Snap rings held the rope to the rock face.
- He clipped a snap ring onto the rope to join it to another rope.
