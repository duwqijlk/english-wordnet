simpleMeaning: Friendly kindness shown to people below one in rank, with a short-lived setting aside of
  the gap in rank
scope: Friendly kindness to people below one in rank, also called condescension, not true respect between
  equals and not cold pride.
examples:
- The queen's condescendingness was meant to make us feel at ease.
- His condescendingness hid the gap in rank for a moment.
