simpleMeaning: a piece of equipment that takes in signals made of numbers and gives out signals that change
  in a smooth flow
scope: A piece of equipment that takes in number-made signals and gives out smooth-flowing ones, also
  called a digital-analog converter, and not a machine that turns smooth signals into numbers.
examples:
- The digital-to-analog converter takes the numbers from the disc and gives out sound.
- A digital-to-analog converter sits inside the player, turning its number signals into smooth ones.
