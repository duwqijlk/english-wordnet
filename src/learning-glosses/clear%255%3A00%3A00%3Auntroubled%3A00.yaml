simpleMeaning: Having a mind without worries, especially without guilt.
scope: This sense describes a person's state of mind, not the state of an object or of a legal right.
examples:
- She slept soundly, with a clear conscience and no regrets.
- After years of hiding the truth, he finally felt free of the guilt that had weighed on him.
