simpleMeaning: A hunting black-and-white whale with teeth and a tall fin on its back, often found in cold
  seas
scope: This is a hunting black-and-white whale with teeth and a tall fin on its back, often found in cold
  seas; killer, orca, grampus, killer whale and sea wolf are other names for this sense, and a whale without
  teeth is a different kind.
examples:
- We watched an Orcinus orca hunting seals off the coast.
- The Orcinus orca leapt clear of the cold sea.
