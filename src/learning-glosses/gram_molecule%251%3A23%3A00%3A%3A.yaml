simpleMeaning: The base unit for how much of a substance there is under the world system of measures,
  set by the weight of its bits given in weight units.
scope: Also called mol and mole, it is the base unit for amount under the world system of measures.
examples:
- A gram molecule of the gas filled the flask.
- Chemists count amounts in gram molecules.
