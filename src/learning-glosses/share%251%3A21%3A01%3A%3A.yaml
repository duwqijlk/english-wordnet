simpleMeaning: One of the equal parts of a company's capital that people can own, shown by a stock certificate.
scope: It is not someone's fair part of money or goods, and not the act of dividing something with others.
examples:
- She bought ten shares in the railway company.
- The value of his shares doubled in a year.
