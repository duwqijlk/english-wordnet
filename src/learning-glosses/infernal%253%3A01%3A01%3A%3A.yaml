simpleMeaning: like a very strong fire that is out of control
scope: This is about a fire that is very strong and out of control, not about a person or act that is
  very evil or cruel, and not a word used to make other words stronger.
examples:
- Infernal heat rose from the burning building and drove everyone back.
- The infernal flames spread fast through the dry forest.
