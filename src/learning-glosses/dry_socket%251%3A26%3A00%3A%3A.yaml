simpleMeaning: After a tooth is pulled out, no blood clot forms in the hole it leaves, and the hole turns
  sore
scope: It is also called alveolitis, soreness in the hole left by a tooth after it is pulled out, not
  soreness in a tooth itself.
examples:
- The dry socket ached after the tooth was pulled out.
- No blood clot had formed, and a dry socket set in.
