simpleMeaning: about one thing making another thing happen, or being the thing that makes it happen
scope: About a link where one thing makes another happen, not just two things happening at the same time
  with no link between them.
examples:
- The study showed a causal link between smoking and illness.
- There is a causal connection between lack of sleep and poor memory.
