simpleMeaning: Money lent for a person's own use, most often with no thing held as a pledge, given on
  trust in the borrower's word and power to pay
scope: Money lent for a person's own use, also called a personal loan, not money lent to a firm and not
  money lent against a house.
examples:
- She took out a consumer loan to buy a car.
- The bank granted him a consumer loan on trust alone.
