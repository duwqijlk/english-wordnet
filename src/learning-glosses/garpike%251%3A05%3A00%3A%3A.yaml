simpleMeaning: Its long jaws are lined with needle-thin teeth, and hard scales cover this old North American
  hunting fish.
scope: Also called a gar, a billfish, or a garfish, this old North American hunting fish has hard scales
  and long jaws lined with needle-thin teeth.
examples:
- The garpike lay still in the shallow water.
- A garpike snapped at the small fish near the bank.
