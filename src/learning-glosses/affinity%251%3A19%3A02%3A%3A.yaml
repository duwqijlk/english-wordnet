simpleMeaning: In immunology, the pull between an antigen, a foreign thing that makes the body fight,
  and an antibody, a thing the body makes to fight it
scope: In immunology, this is the pull between an antigen and an antibody, not the pull between atoms
  in chemistry, not a likeness between living things, and not family by marriage.
examples:
- Scientists measured the affinity between the antigen and the antibody.
- A strong affinity helps the antibody hold on to the antigen.
