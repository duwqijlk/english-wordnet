simpleMeaning: This joint lets two bones turn far and with ease, but only in one flat direction
scope: 'Also called ginglymoid joint and hinge joint: a joint where bones meet and move far in one flat
  direction, not a fixed join and not a ball joint that turns in all directions.'
examples:
- The knee works like a ginglymus.
- A ginglymus lets bones swing in one flat direction.
