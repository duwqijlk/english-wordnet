senseId: 'tribulation%1:11:00::'
synsetId: 07387559-n
simpleMeaning: an event that brings trouble, from a small upset to a very great harm
scope: Trial and visitation are other names for this sense. This is an event that brings trouble or great
  harm; it is not a case in a court and not a short visit to see someone.
examples:
- The long illness was a great tribulation for the whole family.
- They went through many tribulations during the war.
