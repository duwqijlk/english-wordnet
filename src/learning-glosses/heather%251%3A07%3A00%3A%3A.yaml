simpleMeaning: Yarns of mixed colors woven together so the cloth looks soft grey with small spots of color.
scope: Cloth of mixed-color yarns that looks soft grey, not the low plant of the same name.
examples:
- She wore a heather sweater in soft grey.
- The heather cloth had flecks of blue and green.
