senseId: 'pyramidal_bone%1:08:00::'
synsetId: 05280044-n
simpleMeaning: The pisiform, hamate, and lunate bones all meet this bone in the wrist.
scope: Also called the triquetral, the cuneiform bone, os triquetrum, and the triquetral bone, this wrist
  bone is the one that meets the pisiform, hamate, and lunate bones, not one of those neighbours itself.
examples:
- In the wrist, the pyramidal bone meets the pisiform, hamate, and lunate bones.
- Of the bones of the wrist, the pyramidal bone is the one that meets the pisiform.
