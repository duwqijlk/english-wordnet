simpleMeaning: the quality of not being good enough, so it does not meet what is needed
scope: The quality of not being good enough for what is needed, not the amount of something being too
  small by itself.
examples:
- The inadequacy of the old bridge became clear when heavy trucks crossed it.
- They spoke about the inadequacy of the plan to help everyone in need.
