simpleMeaning: to have eyes that point in different ways from each other
scope: To have eyes that point in different ways, not eyes shut part way against bright light and not
  a look sent to one side in doubt.
examples:
- The child squints, with one eye that turns in.
- He has squinted since he was a child, and one eye looks to the side.
