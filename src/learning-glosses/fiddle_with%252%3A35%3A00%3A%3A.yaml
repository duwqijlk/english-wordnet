simpleMeaning: to keep moving something with the hands, in a tense way and without thinking about it
scope: 'Also called twiddle: to keep moving a thing with the hands when tense, not to play music and not
  to change a thing on purpose.'
examples:
- He fiddled with his pen while he waited for the interview.
- She fiddled with the dial without thinking about it.
