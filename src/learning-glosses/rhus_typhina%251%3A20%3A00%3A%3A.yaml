simpleMeaning: A bushy tree of eastern North America, shedding leaves each year, with compound leaves
  turning brilliant red in fall and dense clusters of greenish-yellow flowers followed by sour crimson
  berries.
scope: Also called staghorn sumac, velvet sumac, vinegar tree, and Virginian sumac; not a tree with white
  flowers.
examples:
- The Rhus typhina turned brilliant red in the fall.
- We planted Rhus typhina for its crimson berries.
