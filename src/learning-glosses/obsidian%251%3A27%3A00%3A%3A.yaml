simpleMeaning: a glass, most often dark, made from melted rock rich in the stuff of granite, cooled fast
  so no crystals form, and thin bits of it let light through
scope: A dark glass made from cooled lava, not a crystal and not an ordinary stone.
examples:
- The obsidian blade was black and sharp.
- Thin pieces of obsidian let light through.
