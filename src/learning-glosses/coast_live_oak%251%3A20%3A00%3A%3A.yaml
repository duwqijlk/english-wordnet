simpleMeaning: an evergreen oak of the west edge of North America, often a bush, that takes many shapes
  and has small thick dark-green leaves usually with spiny teeth
scope: An evergreen oak of the west coast, not an oak that drops its leaves and not a pine of the same
  coast.
examples:
- Coast live oak grows all along the hills above the sea.
- The coast live oak keeps its dark-green leaves through winter.
