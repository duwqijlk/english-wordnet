simpleMeaning: to unload people or goods from a ship at a built place by the shore where ships stop
scope: To unload people or goods from a ship at such a place; not tying the ship there, not the ship coming
  in to stop, and not the place itself.
examples:
- The crew wharfed all the passengers before noon.
- They wharfed the heavy goods from the ship in the morning.
