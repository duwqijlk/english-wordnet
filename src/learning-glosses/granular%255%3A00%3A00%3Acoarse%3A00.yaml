senseId: granular%5:00:00:coarse:00
synsetId: 02239247-s
simpleMeaning: made up of small bits, or covered with small bits, that look and feel like meal (dry food
  ground into small bits)
scope: 'Also called gritty, grainy, mealy, coarse-grained, farinaceous, and granulose: this is about look
  and feel like meal. It is not the sense about having an inside build like that of certain stones.'
examples:
- The granular sugar felt rough between my fingers.
- The soil had a granular feel, like small dry bits.
