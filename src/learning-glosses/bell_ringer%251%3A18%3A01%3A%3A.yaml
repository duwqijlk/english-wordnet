simpleMeaning: a person who makes the church sound its call, often to bring people in to worship
scope: 'Also called a ringer: a person who sounds the call from a church tower, not the priest who leads
  the service and not someone who plays the organ.'
examples:
- The bell ringer climbed the tower before the morning service.
- Our bell ringer pulls the ropes every Sunday.
