schema: oewn-learning-gloss-v2
senseId: 'unperson%1:18:00::'
synsetId: 10381224-n
simpleMeaning: A person treated as if they did not exist, with no rights at all, whose very being is pushed
  aside on purpose, especially for reasons of belief or power.
scope: Also called nonperson; a person regarded as nonexistent and having no rights, whose existence is
  systematically ignored, especially for ideological or political reasons, not merely a person who is
  unpopular.
examples:
- After the purge, he became an unperson, his name struck from every record.
- Dissidents were treated as unpersons, as if they had never lived.
