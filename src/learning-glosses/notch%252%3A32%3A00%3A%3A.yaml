simpleMeaning: to cut small marks in a thing as a record of something
scope: To cut small marks in a thing as a record, not to cut a V-shaped mark and not the mark itself.
examples:
- He notched the stick each time he caught a fish.
- She notched the door frame to mark the children's heights.
