simpleMeaning: to stop an automatic gear change in a vehicle from working as it normally does
scope: To stop an automatic gear change in a vehicle from working as it normally does; not to cancel a
  rule or order, and not a device that corrects an automatic one.
examples:
- He used the override to hold the car in low gear on the hill.
- The driver pressed override to stop the gears changing on their own.
