simpleMeaning: Any of a set of tools that press a thin sheet onto a thing to cover and guard it.
scope: Any of a set of tools that press a thin sheet onto a thing to cover and guard it, also called a
  laminator, not the sheet itself and not a tool for cutting.
examples:
- The office bought a new laminating machine for the staff room.
- She fed the poster through the laminating machine.
