senseId: 'rough%2:36:01::'
synsetId: 01758260-v
simpleMeaning: Make an early, unfinished version of something before the final one.
scope: This is the act of making an early, unfinished version, also called rough out or rough in; it is
  not the adjective for something imperfect or poorly made.
examples:
- He roughed out the design on a napkin before opening the drawing software.
- She roughed in the main shapes of the portrait, planning to add detail later.
