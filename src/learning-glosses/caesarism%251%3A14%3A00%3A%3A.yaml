senseId: 'caesarism%1:14:00::'
synsetId: 08457622-n
simpleMeaning: A way of ruling a country in which one ruler holds complete power, held back by no laws,
  no constitution and no opposition.
scope: 'Also called tyranny, authoritarianism, dictatorship, totalitarianism, despotism, absolutism, monocracy,
  one-man rule, the shogunate and Stalinism: one ruler holds complete power with no laws, no constitution
  and no opposition to hold them back, unlike rule shared by many people and unlike a ruler bound by law.'
examples:
- Caesarism gave one man power over the whole state.
- Historians call that period an age of Caesarism.
