simpleMeaning: able to stretch or be pressed and then go back to its first shape at once
scope: 'Also called live, lively, resilient and bouncy: able to stretch or be pressed and go back into
  shape, not stiff and not staying pressed down.'
examples:
- The springy grass felt soft under our feet.
- She slept on a springy bed that went back into shape at once.
