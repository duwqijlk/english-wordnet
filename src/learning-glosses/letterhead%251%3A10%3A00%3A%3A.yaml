simpleMeaning: a sheet of paper for writing letters, with the name and address of a group or business
  printed at the top
scope: A full sheet of printed writing paper; not just the name and address printed at the top of a page,
  and not a letter written on such paper.
examples:
- She typed the reply on company letterhead.
- Please print the letter on our letterhead so people know where it came from.
