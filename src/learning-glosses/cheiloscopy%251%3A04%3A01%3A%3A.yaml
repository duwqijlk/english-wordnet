simpleMeaning: The marks left by a person's lips can show who they are, by a way used in the study of
  crimes.
scope: This way of finding out who a person is from lip marks is also called cheiloscopy.
examples:
- The team used cheiloscopy to match the lip marks to a person.
- Cheiloscopy helped them tell one person from another.
