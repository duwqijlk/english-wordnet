simpleMeaning: a group of people who meet to make laws, decide public questions, or hear court cases
scope: A group that meets to make laws or decide questions, such as a senate; not a room, and not the
  act of putting something into a room.
examples:
- The upper chamber voted against the new law.
- Members of the chamber met to talk about the plan.
