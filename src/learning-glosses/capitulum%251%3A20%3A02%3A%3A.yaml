simpleMeaning: the part of a grain plant that holds the seeds, most often corn
scope: 'Also called ear and spike: the seed-bearing part of a grain plant, most often corn, not a bunch
  of flowers and not the leafy top of a tree.'
examples:
- The capitulum of the corn plant held the ripe grain.
- Farmers cut the capitulum from the wheat stalks at harvest.
