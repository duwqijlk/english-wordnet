simpleMeaning: Of or to do with the upper jaw and the face, above all said of special surgery on the upper
  jaw
scope: Of or to do with the upper jaw and the face, above all said of special surgery on the upper jaw;
  not of the lower jaw alone and not of the skull as a whole.
examples:
- The maxillofacial surgeon rebuilt her upper jaw after the accident.
- He trained in maxillofacial surgery at the city hospital.
