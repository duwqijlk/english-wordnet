simpleMeaning: good enough to count as real or right, a word often used as a joke
scope: This means good enough to count as real or right, often used as a joke, not a word for something
  clearly false and not a formal legal term.
examples:
- The new rule seemed cromulent enough to most of the staff.
- He called the made-up word cromulent, and everyone laughed.
