senseId: 'mineshaft%1:06:00::'
synsetId: 03774451-n
simpleMeaning: A passage dug straight down or at a slant where rock holding metal is looked for or dug
  out, and through which fresh air reaches the workings below.
scope: It is the steep passage of a mine, dug to find ore or to bring fresh air down to the workings below.
examples:
- Fresh air came down the mineshaft to the workings below.
- They dug the mineshaft at a slant to reach the ore.
