simpleMeaning: a person who digs up dead people from graves and sells them so they can be cut open to
  learn how people are made inside
scope: 'Also called a ghoul and a graverobber: a person who digs up dead people to sell them for study,
  not a person who robs graves for jewels and not a doctor who does the study.'
examples:
- The body snatcher worked at night when the graveyard was empty.
- In the story, a body snatcher sold the dead man to a medical school.
