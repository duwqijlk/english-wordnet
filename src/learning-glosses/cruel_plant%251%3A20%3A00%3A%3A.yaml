simpleMeaning: A strong climbing shrub whose fragrant white or pink flowers grow in sprays and have flat,
  spreading petals that catch night-flying moths and hold them until morning.
scope: A climbing shrub named for flowers that hold moths overnight; not a meat-eating plant, despite
  the name.
examples:
- The cruel plant got its name because its flowers hold moths captive overnight.
- A cruel plant was climbing over the fence, its pale pink flowers opening at dusk.
