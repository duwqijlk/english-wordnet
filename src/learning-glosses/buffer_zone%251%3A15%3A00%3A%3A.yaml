simpleMeaning: A neutral area between two rival powers, made so that conflict is less likely
scope: A neutral area between two rival powers, made so that conflict is less likely; buffer is another
  name for this sense, not a border and not a place where fighting goes on.
examples:
- A buffer zone was set up between the two armies.
- The buffer zone kept the rival forces apart.
