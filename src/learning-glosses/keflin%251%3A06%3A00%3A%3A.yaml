simpleMeaning: A cephalosporin antibiotic, a drug that kills germs, often given for mild to fairly severe
  infections of the skin, ears, throat, lungs or urinary tract.
scope: Also called cephalexin, Keflex and Keftab; a germ-killing drug, not a pain drug and not a drug
  for the heart.
examples:
- Keflin was given for his ear infection.
- The nurse handed him Keflin for a lung infection.
