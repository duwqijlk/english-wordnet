simpleMeaning: In physics, the one fixed number for every case in the rule that pressure times volume
  equals R times temperature; it is 8.3143 joules per kelvin per mole
scope: In physics, a fixed number that links pressure, volume, and heat, not a number that changes; also
  called universal gas constant.
examples:
- The gas constant appears in the rule that links pressure and volume.
- Students used the gas constant to work out the pressure of the gas.
