simpleMeaning: The sea floor between the shore and the edge of the shelf of land under the sea, and the
  sea life that lives there, are what this word covers.
scope: Of the part of the sea floor between the shore and the edge of the shelf under the sea, or of the
  life that lives there.
examples:
- The sublittoral zone lies between the shore and the edge of the shelf.
- The survey mapped sublittoral life along the coast.
