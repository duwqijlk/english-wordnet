simpleMeaning: An evergreen Mediterranean shrub that grows like a tree, with sweet-smelling white flowers
  in big clusters at the branch ends and hard roots that are made into tobacco pipes.
scope: The Mediterranean shrub used for tobacco pipes, also called briar and tree heath; not a prickly
  tangle of bushes or the wild rose also called brier.
examples:
- Brier grows wild on the dry hills above the Mediterranean.
- The brier's hard roots are carved into tobacco pipes.
