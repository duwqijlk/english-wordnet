simpleMeaning: a moth from Asia that makes brownish silk
scope: This is a moth from Asia that makes brownish silk, also called tusseh, tusser, tussore and tussur;
  not a moth that makes white silk and not a butterfly.
examples:
- Brownish silk came from the tussah moths on the farm.
- The farmer kept tussah moths for their silk.
