simpleMeaning: feeling upset and not calm in your mind, as if your body had been pushed hard all at once
scope: 'Also called jolted: this means upset in your mind, as if you had been pushed or hit, not that
  your body was really moved or pushed.'
examples:
- She was badly shaken after she heard about the accident.
- He felt shaken for hours after the bad news.
