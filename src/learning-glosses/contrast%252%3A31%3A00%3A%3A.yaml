simpleMeaning: to put two things side by side to show clearly how they are different
scope: This is the verb for putting things side by side to compare them, not the noun for how colors look
  and not the noun for a line in thought between ideas.
examples:
- The teacher contrasted the two poems to show how they are different.
- In her essay, she contrasts city life with country life.
