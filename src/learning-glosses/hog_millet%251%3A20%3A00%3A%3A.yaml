simpleMeaning: a grain plant grown widely in Europe and Asia for its seed, and in the United States at
  times grown as feed for farm animals
scope: A grain plant grown widely in Europe and Asia for its seed; broomcorn millet is another name for
  this sense, not wheat and not a garden herb.
examples:
- Hog millet was grown across the valley for grain.
- Farmers cut the hog millet and stored the seed for winter.
