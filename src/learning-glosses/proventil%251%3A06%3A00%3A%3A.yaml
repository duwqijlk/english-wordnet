simpleMeaning: A drug that opens the airways, used for asthma, emphysema and other lung problems; it comes
  in pill or spray form, and it can quicken the heartbeat and cause shaking.
scope: A drug that opens the airways for asthma and other lung problems, with a fast heartbeat as a side
  effect; also called albuterol and Ventolin.
examples:
- Proventil helped her breathe during an asthma attack.
- His doctor gave him Proventil for his emphysema.
