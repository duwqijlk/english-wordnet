simpleMeaning: a thin strip used to make something look nicer or to finish it
scope: 'Also called molding: a strip added to make something look nicer or to finish it. Not a model in
  wax or clay from which a finished work is copied, and not a shaped surface on an edge.'
examples:
- White moulding runs along the top of the bedroom walls.
- He fixed new moulding around the door frame.
