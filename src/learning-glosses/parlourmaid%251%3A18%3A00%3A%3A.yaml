simpleMeaning: a woman worker in a private home whose work is to look after the sitting room and the table
  and to answer the door
scope: A woman worker in a private home for the sitting room, the table and the door, not a cook who makes
  food and not a worker who looks after children.
examples:
- The parlourmaid opened the door and showed the visitors into the sitting room.
- At dinner, the parlourmaid carried the plates to the table.
