senseId: spastic%5:00:00:unsteady:00
synsetId: 02311435-s
simpleMeaning: With sudden tight, shaking moves of the muscles that you cannot control, like a sudden
  tight move of a muscle
scope: Also called convulsive and spasmodic, this describes sudden muscle moves that you cannot control,
  like a spasm. Not a person whose muscles are stiff and tight and who cannot move in the normal way,
  and not the sense of having that kind of stiff, tight muscles.
examples:
- His leg made spastic movements after the injury.
- She tried to hold the cup, but her spastic hand kept shaking.
