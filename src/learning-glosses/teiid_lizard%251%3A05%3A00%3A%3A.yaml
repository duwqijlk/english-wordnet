simpleMeaning: A long tail trails behind this scaly four-legged animal from warm parts of the Americas,
  whose belly bears big, four-sided scales.
scope: Also called teiid, this scaly four-legged animal is known by its long tail and big belly scales.
examples:
- The teiid lizard slipped away, its long tail last to go.
- A teiid lizard lay still, its belly scales showing.
