simpleMeaning: to capture a place or position by using military power.
scope: This is taking a place by force, not robbing something from a person, not doing an action with
  physical strength in general, and not pressing an object into a narrow gap.
examples:
- The rebels forced the city gates at dawn.
- Troops forced the bridge and cut the supply line.
