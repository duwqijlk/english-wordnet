simpleMeaning: of an idea or story, claiming far more than is true, or so silly that it is hard to believe
  it could be true
scope: This is for an idea or story that claims too much to be believed; it is not for a plain unlikely
  event, and it is stronger than the sense for a clever theory that does not convince.
examples:
- His farfetched story about meeting a king in the woods made us laugh.
- She gave a farfetched excuse for being late.
