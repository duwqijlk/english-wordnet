simpleMeaning: An evergreen Mediterranean shrub that grows like a tree, with sweet-smelling white flowers
  in large bunches at the branch tips and hard woody roots used to make tobacco pipes.
scope: An evergreen shrub that grows like a tree, with sweet-smelling white flowers, also called a briar,
  a brier or a tree heath.
examples:
- The Erica arborea by the wall was covered in white flowers.
- Erica arborea roots are used to make tobacco pipes.
