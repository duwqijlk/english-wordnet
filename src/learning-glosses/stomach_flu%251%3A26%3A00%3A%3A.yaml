simpleMeaning: a swelling and sore state inside the belly and gut that a germ called Salmonella enteritidis
  can bring on
scope: 'Also called gastroenteritis and intestinal flu: a sore swelling of the belly and gut, not a cold
  and not food poisoning from bad food alone.'
examples:
- She stayed home with stomach flu for two days.
- The stomach flu left him weak and unable to eat.
