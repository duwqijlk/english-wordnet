simpleMeaning: the thin layer around a cell's inner fluid, a double sheet of fats, with proteins controlling
  which ions such as sodium, potassium or calcium pass in and out.
scope: 'Another name for cell membrane and cytomembrane: the fatty outer layer of a cell. Not the membrane
  of the nucleus or of other organelles.'
examples:
- The plasma membrane controls what enters and leaves the cell.
- Damage to the plasma membrane can let calcium ions flood in.
