simpleMeaning: a big, somewhat old-style fish-eating northern bird that swims under water; its webbed
  feet sit far back, and it is kin to the grebes, small water birds
scope: A big northern water bird that eats fish, not a person who dives and not a small songbird.
examples:
- We watched a diver swim under the water and come up with a fish.
- The diver's webbed feet were set far back on its body.
