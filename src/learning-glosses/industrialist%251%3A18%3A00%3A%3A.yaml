simpleMeaning: a person who runs a business that makes goods in factories, or who has a lot of money put
  into such a business
scope: A person who runs or has much money in a factory business; not a worker in a factory and not the
  owner of a small shop.
examples:
- The industrialist built a new factory in the town.
- As a rich industrialist, he owned shares in several steel companies.
