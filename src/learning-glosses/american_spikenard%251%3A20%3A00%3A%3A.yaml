simpleMeaning: A thornless woody plant, long-lived from an underground stem, set apart from wild sarsaparilla
  by stronger-smelling roots and loose branching flower clusters; from the southeastern United States
  to Mexico.
scope: Not wild sarsaparilla, the plant it is set apart from, nor a true spikenard; also called life-of-man,
  petty morel, and Aralia racemosa.
examples:
- American spikenard grows in the shady woods.
- We found American spikenard near the stream.
