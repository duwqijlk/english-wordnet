simpleMeaning: speaking out loudly and with great force in favour of a cause
scope: This is speaking out loudly and with great force in favour of a cause; not the beating of a drum.
examples:
- Their drumbeat for change grew louder each week.
- The drumbeat of support for the new law never stopped.
