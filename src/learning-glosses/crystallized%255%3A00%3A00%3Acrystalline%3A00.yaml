simpleMeaning: having a pattern of parts in a set order inside and the shape of a crystal outside
scope: This is about a real crystal form, inside and out, not food coated with sugar and not an idea that
  has become clear and fixed.
examples:
- Quartz is perfectly crystallized, with the shape of a crystal outside and a set pattern of parts inside.
- The mineral was crystallized, so it had that outer shape and that inner pattern.
