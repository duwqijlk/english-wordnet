simpleMeaning: Pike-like sweet-water perch.
scope: This sense is also called a walleye, for pike-like sweet-water perch, unlike the sense for sea
  fishes, spread widely through mid-waters and deep slope waters, and unlike the sense for a little shallow
  boat, with cross thwarts for seats and rowlocks for oars that drive it.
examples:
- The dory is a pike-like perch.
- The dory lives in sweet water.
