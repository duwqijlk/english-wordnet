simpleMeaning: A clump-forming woodland orchid of British Columbia, central California and northern Colorado,
  with short stems, two broad leaves and a few drooping brownish-green blooms in pouches mottled purple.
scope: The clumping orchid of the western mountains and coastal ranges, not the larger showy pink orchid
  of eastern forests.
examples:
- Clustered lady's slippers bloom in the dappled shade of mountain forests.
- We found a patch of clustered lady's slipper beside the trail.
