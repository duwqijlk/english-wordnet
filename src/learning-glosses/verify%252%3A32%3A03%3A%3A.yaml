simpleMeaning: To state, with a solemn promise, that a thing is true.
scope: This is stating with a solemn promise that a thing is true, also called swear, swan, or assert,
  not checking a test in science or putting a legal mark on a paper.
examples:
- He verified before the court that he was innocent.
- She verified her statement under oath.
