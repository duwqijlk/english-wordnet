senseId: 'indiscernibility%1:07:01::'
synsetId: 92418485-n
simpleMeaning: Not being able to tell a thing apart from what is around it, or to see it at all
scope: This is the state of not being able to tell a thing apart or to see it at all; not a thing that
  is merely small and not a thing that is hidden on purpose.
examples:
- The indiscernibility of the two twins made it hard to tell them apart.
- The indiscernibility of the small grey bird against the stone wall meant we walked right past it.
