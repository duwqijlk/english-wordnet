simpleMeaning: A heavy piece of exercise gear, not fixed to anything, that people lift with their hands
  and arms to build strength
scope: A loose heavy piece of exercise gear; weight and exercising weight are other names for this sense,
  not a machine fixed to the floor.
examples:
- He picked up a free weight and did ten lifts.
- Free weights help build arm strength without a machine.
