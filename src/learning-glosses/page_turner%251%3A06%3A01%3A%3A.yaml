simpleMeaning: A machine that flips through a bound book or magazine by itself
scope: A machine that flips through a bound book or magazine by itself; not a person who turns pages and
  not a book that is hard to put down.
examples:
- The page turner turned the pages of the book while she read.
- He put the magazine in the page turner and it flipped each page by itself.
