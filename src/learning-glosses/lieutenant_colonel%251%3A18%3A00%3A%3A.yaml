simpleMeaning: In the army, air force or marines of the United States, an officer with a formal appointment
  holds a rank above major and just below the next rank up
scope: 'Also called a light colonel: an officer with a rank above major and below the next rank up, not
  a major and not a general.'
examples:
- The lieutenant colonel took command of the battalion.
- She was promoted to lieutenant colonel after ten years of service.
