simpleMeaning: wearing a special set of clothes that shows which house or person you serve as a servant
scope: This means wearing the special servant clothes described here. It is not about wearing any work
  clothes, and it is not the name of the clothes themselves.
examples:
- Liveried servants stood by the door to meet the guests.
- The liveried driver opened the car door for her.
