simpleMeaning: to jump straight up in the air with legs held stiff and the back bent in a curve
scope: 'Also called jerk and hitch: an animal jumps straight up in this way, not a male deer and not a
  horse used for jumping over in sport.'
examples:
- The young horse bucked when the rider first sat on it.
- The deer bucked and kicked its stiff back legs into the air.
