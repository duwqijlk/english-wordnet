simpleMeaning: a microscope changed so that a person can look closely at the smallest blood vessels
scope: A microscope made to look at tiny blood vessels, not an ordinary microscope and not a tool for
  looking inside the body.
examples:
- The doctor used an angioscope to look at the tiny vessels in the patient's eye.
- With an angioscope, the nurse could see the smallest vessels in the skin.
