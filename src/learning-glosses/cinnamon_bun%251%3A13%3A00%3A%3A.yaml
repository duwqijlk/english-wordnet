simpleMeaning: a roll of dough spread with sweet spice and sugar, sometimes with dried grapes, cut into
  rounds before baking
scope: A roll of dough spread with sweet spice and sugar, cut into rounds before baking; cinnamon roll
  and cinnamon snail are other names for this sense, not a plain bread roll and not a cake.
examples:
- She baked a tray of cinnamon buns for breakfast.
- The cinnamon bun was still warm from the oven.
