simpleMeaning: a measure of push, the push that gives a mass of 1 kilogram a rise in speed of 1 metre
  per second each second, equal to 100,000 units of push
scope: This is a measure of push, not the gas in the air, the measure of a mix, the 14th letter, or the
  compass point, and it is also called newton.
examples:
- The force was 5 N.
- One N pushes a kilogram at one metre per second each second.
