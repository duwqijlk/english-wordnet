simpleMeaning: In tenpins, a score you get when you knock down all ten pins with two balls
scope: This is a score in the game of tenpins, not an extra wheel and tire for a car, and not the word
  for small in amount.
examples:
- She got a spare in the last frame of the game.
- He made a spare by knocking down the last pin with his second ball.
