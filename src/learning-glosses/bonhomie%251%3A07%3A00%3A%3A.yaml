simpleMeaning: a person's friendly way of being, which makes them easy to talk to
scope: 'Also called affability, geniality, and amiability: a friendly, easy way with people, not a single
  friendly act and not being funny or loud.'
examples:
- His bonhomie made new guests feel welcome at once.
- Everyone liked her bonhomie and found her easy to talk to.
