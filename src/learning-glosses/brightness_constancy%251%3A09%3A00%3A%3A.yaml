simpleMeaning: Under light that changes a lot, a thing seen is still taken to be just as bright
scope: This name marks the way a thing seen is still taken to be just as bright when the light around
  it changes a lot, not a change in how bright the thing itself is.
examples:
- Brightness constancy lets us see the page as white in dim light.
- The white wall still looked white under the dim lamp, thanks to brightness constancy.
