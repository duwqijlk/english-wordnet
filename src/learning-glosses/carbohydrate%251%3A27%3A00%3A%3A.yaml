simpleMeaning: Stuff living cells need for building and animals need for energy, from simple sugars with
  small molecules to large molecules, grouped by how many sugar units are joined in it
scope: Another name for this sense is sugar, and it is also called saccharide; it is the whole group of
  such stuffs, not only the sweet white sugar used in tea.
examples:
- Bread and rice are rich in carbohydrates and give the body energy.
- Cells use carbohydrates as building material as well as for energy.
