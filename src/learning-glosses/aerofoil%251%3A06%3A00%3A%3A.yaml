simpleMeaning: A wing shape that pushes back on the air as it moves, and can raise or steer a plane in
  flight.
scope: A wing shape that pushes back on the air as it moves, also called a surface, an airfoil, and a
  control surface; not the engine that drives the plane and not a plain flat board.
examples:
- The aerofoil curved over the top to give more lift.
- A damaged aerofoil can make the plane hard to steer.
