simpleMeaning: In nautical timekeeping, one of eight half-hour watch divisions, marked by strokes on a
  metal signal instrument aboard; eight strokes mark four, eight or twelve o'clock, by day or night.
scope: The nautical time unit counted in half-hours, not the metal bell that is struck, the sound it makes,
  or a doorbell.
examples:
- The watch changed at two bells, and the deck crew turned out.
- By six bells the fog had lifted and the ship could make way.
