simpleMeaning: With only the few things one has, even when they are not enough, a person still does or
  makes what one needs
scope: Also called contend, cope, deal, grapple, make do, make out and manage; to do what one needs with
  few things, not to do it well with plenty and not to slip out of trouble.
examples:
- We got by on one small meal a day.
- They got by with an old car and very little money.
