simpleMeaning: From this low shrub of the east of North America, which lives for years and bears soft-haired
  leaves with pale yellow and pink flowers, the chemical rotenone is taken.
scope: Also called catgut or wild sweet pea, this is the low shrub of eastern North America whose soft-haired
  leaves and pale yellow and pink flowers set it apart from the tall European bush with blue flowers.
examples:
- The goat's rue grew along the edge of the wood.
- The goat's rue had pale yellow and pink flowers.
