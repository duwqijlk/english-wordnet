simpleMeaning: Said of rock or earth that holds bones, most of all old bones turned to stone
scope: Said of rock or earth holding bones, most of all old bones turned to stone; not rock with no bones
  in it and not a place where living animals are found.
examples:
- The ossiferous caves held the bones of animals long dead.
- They dug into ossiferous rock and found a skull.
