simpleMeaning: A mushroom that can be eaten, though not a fine one, growing on the ground under broad-leafed
  trees, with a dry rounded cap, whitish underside and net-marked stalk.
scope: A mushroom that can be eaten, though not a fine one, growing under broad-leafed trees; set apart
  from choice mushrooms and from other mushrooms with dry rounded caps.
examples:
- Boletus variipes grows on the ground under broad-leafed trees.
- Cooks say Boletus variipes is safe to eat but not a fine mushroom.
