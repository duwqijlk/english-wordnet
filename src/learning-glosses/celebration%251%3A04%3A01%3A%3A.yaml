simpleMeaning: a sacrament (a holy church act) or other serious ceremony carried out in front of people,
  with all the right set acts and words done in the right way
scope: A sacrament or other serious ceremony carried out in front of people, with all its set acts done
  in the right way; not a happy event with parties to mark good news.
examples:
- The celebration of the marriage took place in the old church.
- The priest led the celebration of the Mass on Sunday.
