simpleMeaning: An independent body of the United States government that settles disputes between bosses
  and labour unions.
scope: This is an independent body of the United States government that settles disputes between bosses
  and labour unions, also called the National Labor Relations Board; not a court and not a labour union
  itself.
examples:
- The NLRB settled the dispute between the factory and its union.
- Workers took their case to the NLRB.
