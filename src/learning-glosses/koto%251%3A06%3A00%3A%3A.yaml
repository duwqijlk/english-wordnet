simpleMeaning: A Japanese stringed instrument like a zither, a many-stringed instrument, with a rectangular
  wooden board that carries the sound and usually thirteen silk strings plucked with the fingers.
scope: The Japanese instrument itself, not a zither, though it is similar, and not another East Asian
  stringed instrument such as the guzheng.
examples:
- She plucked the koto with her fingers.
- A koto usually has thirteen silk strings.
