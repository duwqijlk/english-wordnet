simpleMeaning: to connect to a telephone or telegraph wire so you can get information sent on it
scope: 'Also called bug: to connect to a telephone or telegraph wire to get information sent on it, not
  asking hard for something, not a part for letting water out, and not dancing in shoes with metal plates.'
examples:
- The police tapped the suspect's phone line to hear his plans.
- Agents tapped the telegraph wire to get news from the other side.
