simpleMeaning: Stems and leaves carry strands of tubes for water and food; one strand is made mostly of
  a tube that carries water up and a tube that carries food.
scope: Also called vascular bundle and vascular strand, this names one strand of the tubes that carry
  water and food in a plant with stems and leaves.
examples:
- Each fibrovascular bundle carries water and food through the stem.
- She traced the fibrovascular bundle down the leaf stalk.
