simpleMeaning: a large bird, pink to bright red, with skin between its toes, a bill that bends down, that
  walks in water and lives by lakes with a little salty water
scope: This is the real large water bird; it is not a picture, a toy, or a garden figure made in its shape.
examples:
- A flamingo stood in the shallow lake on one long leg.
- We saw a group of pink flamingos by the water.
