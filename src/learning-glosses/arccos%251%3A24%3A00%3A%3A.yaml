senseId: 'arccos%1:24:00::'
synsetId: 13810065-n
simpleMeaning: In maths, the angle that has a given number as the ratio of the side next to it to the
  longest side of a right-angled triangle.
scope: 'Also called arccosine, arc cosine, and inverse cosine: the angle worked out from a given number,
  not the cosine itself and not the angle from a different triangle ratio.'
examples:
- The arccos of 0.5 is 60 degrees.
- She used arccos to find the angle.
