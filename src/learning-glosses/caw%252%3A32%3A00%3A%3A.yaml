simpleMeaning: To give the cry that crows, rooks, and ravens make
scope: To give the cry of a crow, rook, or raven, not the cry of any other bird and not a human shout.
examples:
- The crow cawed loudly from the top of the tree.
- We heard the ravens cawing over the field.
