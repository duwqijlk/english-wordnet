simpleMeaning: the hard flat part that covers and keeps safe the top of the end of a finger or toe
scope: The hard part on a finger or toe, not the thin metal pin used to hold things together and not an
  old measure of length for cloth.
examples:
- She broke a nail while she was opening the box.
- He cut his nails short before he played the piano.
