simpleMeaning: In chess, to shift the king two squares toward a rook, sending that rook to the square
  the king has just crossed.
scope: The verb for carrying out this chess move, not the move as a noun, the rook-shaped piece, or the
  building.
examples:
- She castled early to tuck her king away safely.
- He castled on the king's side before launching his attack.
