simpleMeaning: in a rude, loud way, shouting or laughing at someone to show lack of respect
scope: 'Also called jeeringly: a rude way of laughing or shouting at someone to show no respect. It is
  close to the other sense of mockingly, but this one is about loud, rude shouts.'
examples:
- The crowd called out mockingly as the player walked off the field.
- ‘Go home!’ they shouted mockingly from the back of the hall.
