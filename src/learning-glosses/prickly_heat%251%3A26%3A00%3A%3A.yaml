simpleMeaning: A block in the tiny tubes that carry sweat, when the air is hot and damp
scope: A skin rash from blocked sweat tubes in hot, damp air; heat rash and miliaria are other names for
  this sense, not a rash from cold or from an allergy.
examples:
- The prickly heat on his neck came from the hot, damp air.
- She got prickly heat after working in the heat all day.
