simpleMeaning: Most of all in the face, your skin goes red, as if blood had rushed into it, when you feel
  something strongly or work hard
scope: 'Also called red and crimson: a face gone red from feeling or hard work, not the healthy pink of
  good health.'
examples:
- Her face flushed red with embarrassment.
- He was flushed after running up the stairs.
