simpleMeaning: The flat bone in the front of the chest that joins the collarbones and the first seven
  pairs of ribs
scope: The flat bone in the front of the chest; not a rib and not the backbone.
examples:
- The doctor pressed on his sternum to check the pain.
- Her sternum ached after the fall.
