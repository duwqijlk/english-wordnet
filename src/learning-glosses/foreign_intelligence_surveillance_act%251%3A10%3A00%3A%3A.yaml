simpleMeaning: A 1978 law from Congress on how judges approve spying on other countries, creating the
  court that approves it, to strengthen US defences against spies, apart from ordinary police spying.
scope: Also called FISA; the law that set up the secret spying court, not the court itself.
examples:
- The Foreign Intelligence Surveillance Act was passed in 1978.
- Under the Foreign Intelligence Surveillance Act, judges must approve the spying.
