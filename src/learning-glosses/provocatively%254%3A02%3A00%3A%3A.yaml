senseId: 'provocatively%4:02:00::'
synsetId: 00436247-r
simpleMeaning: in a way that is meant to get a strong reaction from people
scope: This sense, also called provokingly, is about doing or saying something in a way meant to get a
  strong reaction. It is not doing something in a calm or quiet way.
examples:
- '"Try it if you dare," she said provocatively.'
- He smiled provocatively, hoping to make his rival angry.
