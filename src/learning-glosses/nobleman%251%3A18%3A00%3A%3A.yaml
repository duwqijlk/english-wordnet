simpleMeaning: A man of high rank who carries one of the great titles of the land
scope: A man of high rank with a great title; lord and noble are other names for this sense, not a king
  and not a rich man without a title.
examples:
- The nobleman owned large lands in the north.
- A nobleman of the old court attended the ceremony.
