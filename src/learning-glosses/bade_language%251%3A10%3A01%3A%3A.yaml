simpleMeaning: A Chadic tongue spoken in northern Nigeria, above all in Yobe State, in Jakusko, Bursari
  and Karasuwa and one more place, in Jigawa State, Guri, and in Bauchi State, Zaki.
scope: Also called Bade; a Chadic tongue of northern Nigeria, not Hausa, the best-known Chadic tongue
  of Nigeria, and not a tongue of southern Nigeria.
examples:
- Bade language is spoken in northern Nigeria.
- She grew up speaking Bade language at home.
