senseId: 'exhortation%1:10:00::'
synsetId: 07260696-n
simpleMeaning: The act of urging people on with strong feeling, in a bid to win them over.
scope: Also called incitement, this is the act of urging people on to act, not a spoken or written message
  meant to urge or persuade its hearers to take some action.
examples:
- The coach's exhortation lifted the team before the game.
- Her exhortation to the crowd was earnest and warm.
