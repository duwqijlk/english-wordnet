simpleMeaning: one of several kinds of tree that lose their leaves in winter, with small leaves set along
  a stem, grown for looks or for wood
scope: One of several kinds of tree that lose their leaves in winter, not the strong wood cut from such
  trees.
examples:
- An ash stood at the end of the garden.
- Ash trees lined the old road.
