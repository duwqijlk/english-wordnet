simpleMeaning: To do with the stuff that forms a cover around the long thin part of some nerve fibres.
scope: To do with the stuff that covers the long thin part of some nerve fibres, not the nerve fibre itself
  and not the cover of a whole nerve.
examples:
- The myelinic sheath helps signals travel fast along the nerve.
- Myelinic tissue covers the axons in the brain.
