simpleMeaning: On the wrists, the lower arms, and the thighs, purple bumps with shiny flat tops break
  out, and they often itch.
scope: 'Also called lichen planus: a rash of shiny purple bumps on the wrists, arms, and thighs, not a
  rash of blisters.'
examples:
- Lichen ruber planus left shiny purple bumps on both his forearms.
- The itchy spots of lichen ruber planus showed on her wrist and her thigh.
