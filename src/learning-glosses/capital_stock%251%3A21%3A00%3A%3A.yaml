simpleMeaning: The most shares a firm is allowed to issue under its founding papers.
scope: The most shares a firm is allowed to issue under its founding papers; authorized shares and authorized
  stock are other names for this sense, not the shares already sold and not the firm's cash.
examples:
- The capital stock of the firm is ten thousand shares.
- The firm's capital stock sets the most shares it may issue.
