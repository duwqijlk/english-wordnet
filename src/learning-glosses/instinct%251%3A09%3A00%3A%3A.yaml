simpleMeaning: A way of acting that a living thing is born with, often as a set answer to one kind of
  thing it meets
scope: A way of acting born in a living thing, not a thing learned by practice and not a sudden feeling.
examples:
- The spawning instinct in salmon drives them up the river.
- Altruistic instincts in social animals help the group live.
