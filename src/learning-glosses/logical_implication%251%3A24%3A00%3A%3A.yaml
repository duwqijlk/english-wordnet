simpleMeaning: 'In logic, a link between two claims of the form ''if p then q'': when the first claim
  is true, the second cannot be false'
scope: A link in logic between two claims, also called implication and conditional relation, not a guess
  and not a cause-and-effect link in the real world.
examples:
- In logical implication, if p is true then q cannot be false.
- The book uses logical implication to show that one claim follows from another.
