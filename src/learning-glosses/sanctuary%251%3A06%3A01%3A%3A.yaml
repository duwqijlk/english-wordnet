simpleMeaning: A place where a person is safe from danger or hardship and can rest out of reach of harm
scope: 'Also called refuge and asylum: a safe place to get away from danger or hardship, not the holy
  place in a church where sacred objects are kept and not the area around the altar for clergy and choir.'
examples:
- The old barn was a sanctuary for the travellers in the storm.
- She found sanctuary in her friend's house after the fire.
