simpleMeaning: In computer science, a tiny ring of magnetic material once used in random-access memory
  to hold one bit of data, now replaced by semiconductor chips
scope: This sense is the old magnetic memory ring of early computers, not the magnetic bar inside a coil,
  the reactor's central chamber, or an object's center.
examples:
- Early computers stored each bit on a tiny magnetic core threaded with wires.
- The museum's memory board still holds hundreds of hand-wired cores.
