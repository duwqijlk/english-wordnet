simpleMeaning: A coat of arms (a family's set of signs) that takes up one quarter of a shield. Putting
  four such coats on one shield usually showed marriages between families
scope: 'The shield sense: a coat of arms that takes up one quarter of a shield, not the sense that means
  living places given to soldiers.'
examples:
- The quartering in the top corner of the shield showed his mother's family signs.
- Her shield bore a quartering from each of four families.
