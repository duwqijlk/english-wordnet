simpleMeaning: a machine for printing in which the letters sit on a flat bed and a round roller carrying
  the paper rolls over them
scope: 'Also called flatbed press: a machine for printing with a roller and a flat bed, not a machine
  that prints by hand and not a machine that feeds paper from a roll.'
examples:
- The old cylinder press still turns out posters for the fair.
- Paper on the cylinder press is held on the roller as it moves over the type.
