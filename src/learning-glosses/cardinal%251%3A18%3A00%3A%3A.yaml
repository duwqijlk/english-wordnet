simpleMeaning: In the Roman Catholic Church, one of more than 100 leading bishops in the Sacred College
  who give advice to the Pope and choose new Popes
scope: This is a church leader, not the red North American bird of this name, not a counting number, and
  not the word for most important.
examples:
- A cardinal from Italy helped choose the new Pope.
- The cardinals met in Rome to elect a new Pope.
