schema: oewn-learning-gloss-v2
senseId: earnest%5:00:00:serious:00
synsetId: 02126120-s
simpleMeaning: strongly believing that what you think is true, with no humour and no doubt
scope: 'Also called solemn, and another name for this sense is sincere: it means holding fast to what
  you think is true with no humour, not the other sense of earnest that means truly honest and meant from
  the heart.'
examples:
- He gave an earnest speech about why the law must change, and he never once smiled.
- Both sides were earnest in the talks and would not change what they believed.
