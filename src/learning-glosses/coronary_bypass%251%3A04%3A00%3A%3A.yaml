simpleMeaning: A major heart operation that opens the chest and creates a new route for blood by joining
  a vessel from the aorta to the heart's own artery, past a blockage.
scope: Another name for the open-heart operation also called coronary artery bypass graft or coronary
  bypass surgery, not a stent or a drug.
examples:
- The surgeon recommended a coronary bypass after the scan showed a narrow artery.
- A coronary bypass restored the flow of blood to the damaged part of his heart.
