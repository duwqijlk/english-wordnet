simpleMeaning: Deadening of one chosen bit of the body by a numbing drug sent to the far end of the backbone
  canal, now largely set aside for epidural numbing.
scope: Deadening of one chosen bit of the body by a numbing drug sent to the far end of the backbone canal,
  also called caudal anaesthesia and caudal anesthesia.
examples:
- A caudal block numbed her lower body.
- The doctor gave a caudal block.
