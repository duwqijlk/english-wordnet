simpleMeaning: flat pieces of wood that can be used to cover the walls of a room
scope: Also called wainscot, this is the wooden pieces themselves, made to cover a room's walls, not the
  finished wall that they make.
examples:
- The old house has dark wainscoting in the hall.
- They put new wainscoting on the dining room walls.
