simpleMeaning: The first drug that slows the heart (a beta blocker), used to treat high blood pressure,
  chest pain, and shaking that has no clear cause
scope: The first heart-slowing drug of its kind; propranolol is another name for this sense, not a drug
  that opens the airways or a water pill for swelling.
examples:
- The doctor prescribed Inderal for his high blood pressure.
- Inderal steadied her hands by easing the tremor.
