simpleMeaning: relating to a way of writing that uses an alphabet, or shown by such a way of writing
scope: About a way of writing that uses an alphabet, or shown by it; not about words or names put in order
  from A to Z.
examples:
- The book uses an alphabetical writing system, with a sign for each sound.
- The story is told in alphabetical writing, not in pictures.
