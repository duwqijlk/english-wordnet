simpleMeaning: the thin cone-shaped inner shell, with rooms inside, of a belemnite, a sea animal of long
  ago, straight or bent
scope: The thin cone-shaped inner shell, with rooms inside, of a belemnite, a sea animal of long ago,
  straight or bent; phragmocone is another name for this sense, not the outer shell of a sea animal and
  not the soft body of the animal.
examples:
- The phragmacone of the belemnite was a thin cone with rooms inside.
- In the fossil the phragmacone lay straight, its chambers plain to see.
