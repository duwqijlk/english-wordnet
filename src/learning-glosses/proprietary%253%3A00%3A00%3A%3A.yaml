senseId: 'proprietary%3:00:00::'
synsetId: 01113625-a
simpleMeaning: protected by a trademark, patent or copyright (law that keeps a name, idea or work for
  one owner), so only that owner can make it or give it out
scope: This word describes something kept for one owner by law, such as a name, an idea or a work; it
  is not the noun for a business owned by one person.
examples:
- '''Tylenol'' is a proprietary drug, so only its owner can sell it under that name.'
- The company uses a proprietary design that other makers may not copy.
