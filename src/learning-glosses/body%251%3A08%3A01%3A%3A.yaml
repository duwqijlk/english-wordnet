simpleMeaning: the middle part of a person or animal, apart from the head, neck, and limbs.
scope: This is not the whole physical frame and not the hollow sounding part of an instrument; it is the
  middle section left after the head, neck, and limbs are removed.
examples:
- The life jacket wraps around the body and fastens at the front, leaving the arms free.
- The burn covered his body but left his face and hands unharmed.
