simpleMeaning: A gene that has changed from its usual form is stopped from showing what it would do by
  this gene.
scope: Suppresser, suppresser gene, and suppressor gene are other names for this gene that stops a changed
  gene from showing what it would do.
examples:
- The suppressor held back the changed gene's effect.
- A suppressor works by keeping another gene quiet.
