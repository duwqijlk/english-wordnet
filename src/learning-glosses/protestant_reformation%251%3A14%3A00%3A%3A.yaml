simpleMeaning: A faith movement of the 1500s that began as a bid to change the Roman Catholic Church and
  ended with new churches of its own kind being set up.
scope: Also called the Reformation; a 16th-century movement that set up new churches, not the Counter
  Reformation, the Catholic Church's own movement of change.
examples:
- The Protestant Reformation began as a bid to change the Roman Catholic Church.
- The Protestant Reformation led to the creation of new churches.
