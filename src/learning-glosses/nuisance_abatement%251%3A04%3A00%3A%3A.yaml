simpleMeaning: In law, getting rid of a thing that a court has said troubles people, by taking it away,
  ending it or breaking it up
scope: In law, getting rid of a thing that troubles people, also called abatement of a nuisance, and not
  a fine for the thing or a ban on making it.
examples:
- The city ordered nuisance abatement for the noisy yard.
- Nuisance abatement closed the site that had drawn complaints for years.
