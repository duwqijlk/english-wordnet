senseId: 'europeanise%2:30:01::'
synsetId: 00410794-v
simpleMeaning: To change the customs of a place so they are like the customs of mainland Europe, and to
  change its character and ideas too.
scope: To make a place like mainland Europe in its customs, character and ideas, also called Europeanize,
  and not to take a land from its own rule and put it under a European body.
examples:
- The new rulers tried to Europeanise the town, and its customs changed first.
- Traders helped to Europeanise the port, and its ways of dress and speech changed.
