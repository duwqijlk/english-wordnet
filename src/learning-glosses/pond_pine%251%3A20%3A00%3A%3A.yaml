simpleMeaning: A big pine of sandy swamps in the south-east of the United States, with bunches of three
  needles that run longer than the pitch pine's up north.
scope: This is a big pine of sandy swamps in the south-east of the United States, not the northern pitch
  pine, whose needles run shorter.
examples:
- A pond pine stood at the edge of the sandy swamp.
- The pond pine by the track had needles longer than the pitch pine's.
