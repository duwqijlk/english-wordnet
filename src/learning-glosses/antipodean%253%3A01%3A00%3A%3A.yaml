simpleMeaning: about, or found on, opposite sides of the earth from each other
scope: 'Also called antipodal: about, or found on, opposite sides of the earth from each other, not places
  near each other and not places on the same side of the earth.'
examples:
- The ship sailed to antipodean latitudes far from home.
- New Zealand is antipodean to Britain.
