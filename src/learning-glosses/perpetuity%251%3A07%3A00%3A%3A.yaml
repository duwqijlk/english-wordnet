simpleMeaning: the quality of seeming to go on and on with no end
scope: This is the quality of seeming to have no end, not just lasting for a long time and then stopping.
examples:
- The old law speaks of the perpetuity of the agreement, as if it will never end.
- They spoke of the perpetuity of the sea, which seems to go on for ever.
