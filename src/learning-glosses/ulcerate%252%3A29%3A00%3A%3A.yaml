senseId: 'ulcerate%2:29:00::'
synsetId: 00019975-v
simpleMeaning: to cause a painful open sore (an ulcer) to form on or in a part of the body
scope: This sense means to cause such a sore to form in or on a part of the body; it is not the sense
  where a part of the body itself gets such a sore.
examples:
- The illness ulcerated his stomach, and he needed care in hospital.
- Bad food can ulcerate the inside of the mouth.
