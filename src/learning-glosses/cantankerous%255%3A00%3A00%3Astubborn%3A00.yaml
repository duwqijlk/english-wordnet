simpleMeaning: not willing to change their mind, trying to block what others want, and not willing to
  work with others
scope: Describing a person who will not agree, blocks others, and will not work with them; not just angry
  for a short time.
examples:
- The cantankerous old man refused to let anyone help him.
- The cantankerous member blocked every plan the group made and would not work with anyone.
