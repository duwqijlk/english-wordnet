simpleMeaning: 'about weather or the usual weather of a place: hot and with wet air, like the weather
  in hot lands around the middle of the earth'
scope: 'Also called tropical: this word is for weather that is hot with wet air, not for a line around
  the earth and not just for a place that lies near the middle of the earth.'
examples:
- We stepped into tropic heat, with hot, wet air all around us.
- The tropic weather stayed hot and humid through the whole summer.
