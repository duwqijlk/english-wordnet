simpleMeaning: having or caused by a part of the body that is red, swollen, hot and in pain because it
  is hurt or ill
scope: This is about a hurt or ill part of the body that is red, swollen and sore, not about words or
  speeches that make people angry.
examples:
- The doctor said the red, swollen skin was an inflammatory response to the bite.
- He took medicine to calm the inflammatory swelling in his knee.
