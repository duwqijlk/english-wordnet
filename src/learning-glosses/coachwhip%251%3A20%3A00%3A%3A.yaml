simpleMeaning: A desert bush of the US Southwest and Mexico whose thin, bare, thorny branches sprout leaves
  and red flower clusters once the rains come.
scope: This is the desert shrub also called ocotillo and vine cactus; it is not the coachwhip snake, whose
  tail looks like a braided whip.
examples:
- A coachwhip stood alone on the dry hillside, its bare branches catching the sun.
- After the first rains, the coachwhip was covered in bright red blossoms.
