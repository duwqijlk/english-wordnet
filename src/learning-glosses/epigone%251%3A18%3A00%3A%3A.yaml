simpleMeaning: a person who copies the work of a great writer, artist, or musician, but does it worse
scope: 'Also called epigon: a person who copies a great writer, artist, or musician and does it worse,
  not a great maker in their own right and not a student learning from one.'
examples:
- The young epigone copied the master's style in every picture he painted.
- Critics dismissed the epigone as a pale shadow of the poet he admired.
