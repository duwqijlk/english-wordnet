simpleMeaning: a board or panel that covers the lower part of a wall inside a room, made to look different
  from the rest of the wall
scope: Also called wainscot, it is the lower part of an inside wall finished in a different way, not the
  whole wall and not a picture hung on the wall.
examples:
- The painter gave the dado a darker color than the wall above it.
- A dado of wood ran along the bottom of the hallway wall.
