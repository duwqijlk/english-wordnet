simpleMeaning: How much water is in the air at one heat, set against the most the air could hold at that
  heat, given as a part of a hundred.
scope: How much water is in the air at one heat, set against the most the air could hold at that heat,
  given as a part of a hundred; not the bare amount of water in the air, the heat at which drops form,
  or the heat of the air itself.
examples:
- The relative humidity stood at eighty percent today.
- High relative humidity made the air feel heavy.
