simpleMeaning: of or like the families who hold the highest rank
scope: 'Also called aristocratic, blue, blue-blooded, gentle and patrician: of or like the highest-ranking
  families, not of the middle class and not of the poor.'
examples:
- They lived in an aristocratical house with a long drive and many servants.
- Her aristocratical manners set her apart at the village dance.
