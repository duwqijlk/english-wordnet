simpleMeaning: A line that, once crossed, often leaves a person without a way back and binds them to a
  course that is fixed for good
scope: A line that, once crossed, often leaves a person without a way back and binds them to a course
  that is fixed for good; not a mere border and not a choice that can still be changed.
examples:
- They had passed the point of no return in the talks.
- Once past the point of no return, the crew had to go on.
