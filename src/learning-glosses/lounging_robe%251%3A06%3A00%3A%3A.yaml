simpleMeaning: While you rest, or before you get dressed, you wear this garment
scope: Also called a dressing gown, this is a garment worn before dressing or while resting, not a coat
  for going out and not nightclothes for sleeping.
examples:
- She slipped on her lounging robe and made coffee.
- He read the paper in his lounging robe before getting dressed.
