simpleMeaning: In physics, the theory that space and time depend on the person measuring them, and are
  not fixed and the same for everyone
scope: In physics, the idea about space and time, not the general idea that a thing only has meaning when
  compared with something else.
examples:
- He studied relativity to understand how time can pass at different speeds.
- Relativity changed the way scientists think about space and time.
