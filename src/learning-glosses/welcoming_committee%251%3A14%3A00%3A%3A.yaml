simpleMeaning: A group that greets people who have just moved into a place where they live.
scope: A group that greets people who have just moved into a place where they live, not a group that runs
  the place and not a party for old friends.
examples:
- The welcoming committee left a basket at our door.
- A welcoming committee met the new family at the gate.
