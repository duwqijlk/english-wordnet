simpleMeaning: The sail with three sides that sits second from the outside at the front of a big ship
  with square sails
scope: A three-sided sail near the front of a big ship with square sails, not the sail at the very front
  and not a sail at the back of the ship.
examples:
- The crew set the outer jib as the wind picked up.
- The outer jib flapped at the front of the big ship.
