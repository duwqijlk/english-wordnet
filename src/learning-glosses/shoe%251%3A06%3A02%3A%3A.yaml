simpleMeaning: 'A brake part that holds the wheel back: fluid pressure pushes the brake linings against
  the drum, creating the restraint that slows rotation.'
scope: This is the brake part, also called a brake shoe or skid, not the horseshoe nailed under a horse's
  hoof and not the footwear worn on a person's foot.
examples:
- The mechanic replaced the worn brake shoes on the rear wheels.
- When the brake shoes grip the drum, the car slows down.
