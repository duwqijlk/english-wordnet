simpleMeaning: A climbing shrub that loses its leaves each year, with sweet-smelling yellow flowers that
  turn orange in bunches at the stem ends, from the south-east of the United States.
scope: 'Also called yellow honeysuckle: a climbing shrub whose yellow flowers turn orange, from the south-east
  United States, not the purple-tinged honeysuckle of the north-east.'
examples:
- Lonicera flava climbed the trellis, its yellow flowers sweet in the warm air.
- By late summer the Lonicera flava flowers had turned orange.
