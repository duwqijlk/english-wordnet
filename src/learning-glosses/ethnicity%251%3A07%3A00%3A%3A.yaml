simpleMeaning: the quality of belonging to a group, or a person's link to that group, because of shared
  race or a shared way of life
scope: This is the quality of belonging to a group, or a person's link to it, because of shared race or
  a shared way of life. It is not just the country a person is a citizen of, and not just the language
  they speak.
examples:
- Her ethnicity shapes the food, music and holidays she grew up with.
- The form asks about ethnicity, not about what job you do.
