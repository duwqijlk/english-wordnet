senseId: 'variance%1:09:00::'
synsetId: 06034344-n
simpleMeaning: In statistics, a measure of how far values spread from their mean (the average); it is
  the average of each gap from the mean multiplied by itself
scope: This is the statistics number that shows spread around the average; not an official permission
  to break a building rule, and not the general quality of being able to change.
examples:
- The variance was high because the test scores were spread far from the average.
- He worked out the variance by taking the average of the squares of the gaps from the mean.
