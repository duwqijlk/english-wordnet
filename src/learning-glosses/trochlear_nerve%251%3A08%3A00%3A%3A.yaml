senseId: 'trochlear_nerve%1:08:00::'
synsetId: 05486336-n
simpleMeaning: one of two signal paths, one on each side of the head, that move the muscles that turn
  the eyes
scope: This is a nerve that controls eye muscles; also called trochlear, trochlearis and fourth cranial
  nerve. Not a nerve that carries sight and not a muscle of the eye.
examples:
- The trochlear nerve on the right side controls one eye muscle.
- The doctor tested the trochlear nerve after the head injury.
