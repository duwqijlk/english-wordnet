simpleMeaning: a person whose job is to do office work such as typing and answering letters for a boss
  or an organization.
scope: This is not a government minister and not a person trusted with secrets; it is an office assistant.
examples:
- She works as a secretary in a small law office.
- The secretary typed the letters and arranged the meeting.
