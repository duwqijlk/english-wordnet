scope: This is a sickness common in Arab states, spread by a tick that lives on sheep; near kinds are
  other sicknesses spread by ticks.
examples:
- Crimea-Congo hemorrhagic fever is spread by a tick that lives on sheep.
- Cases of Crimea-Congo hemorrhagic fever are common in Arab states.
