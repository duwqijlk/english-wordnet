simpleMeaning: a person whose way of acting is not what people accept as normal, especially in sexual
  behavior
scope: This person is also called a pervert, a deviate, a degenerate, or a perv; it names a person, not
  behavior that is simply different from the usual.
examples:
- The police said the deviant had followed women near the park at night.
- He was treated as a deviant because of his sexual behavior.
