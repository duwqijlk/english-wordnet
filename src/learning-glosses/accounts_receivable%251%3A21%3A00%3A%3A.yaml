simpleMeaning: the books of a person who is owed money, which most often come from selling goods or work
scope: These are the books of money owed to a creditor, not money the firm owes and not cash already in
  hand.
examples:
- The accounts receivable showed what customers still owed us.
- She chased up the accounts receivable before the month ended.
