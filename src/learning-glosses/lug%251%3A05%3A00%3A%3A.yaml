simpleMeaning: a sea worm with a line of small bunches of gills (thin parts for breathing) on each side
  of its back, often used as bait for fishing
scope: 'Also called lobworm and lugworm: a sea worm often used as bait, not the lug that is a sail with
  four corners.'
examples:
- He dug lugs out of the wet sand to use as bait.
- The fisherman kept the lugs alive in a bucket of sea water.
