simpleMeaning: The work of testing a measuring tool against a known measure, and putting it right, so
  that what it reads is true.
scope: Also called calibration and standardisation; the act of checking or adjusting the accuracy of a
  measuring instrument by comparison with a standard, not the imposing of standards and not the state
  of having a standard set.
examples:
- The standardization of the thermometer took an hour.
- After standardization, the scales gave the true weight.
