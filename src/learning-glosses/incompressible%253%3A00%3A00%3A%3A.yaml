senseId: 'incompressible%3:00:00::'
synsetId: 00516642-a
simpleMeaning: This kind of thing keeps the same size when pressed, and will not pack down
scope: This is a thing that cannot be squeezed smaller and pushes back when pressed, not a thing that
  gives way under pressure.
examples:
- Water is nearly incompressible, so it cannot be squeezed into a smaller space.
- The incompressible garbage in the skip would not pack down.
