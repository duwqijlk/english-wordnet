senseId: 'target%1:18:00::'
synsetId: 10490045-n
simpleMeaning: a person whom a hostile person or force singles out to attack, mock, or take advantage
  of.
scope: This is not the object or place that is aimed at, and not a goal; it is a person chosen to receive
  hostility, mockery, or unfair treatment.
examples:
- The shy boy became the target of cruel jokes at school.
- Scammers choose elderly people as targets because they are trusting.
