simpleMeaning: the amount of a substance, such as a drug, or of radiation (energy in the form of rays)
  that is taken in or enters the body at one time
scope: 'Also called dose: the amount taken in at one time, not the amount taken over many days and not
  the drug itself.'
examples:
- The doctor lowered the dosage to one pill a day.
- A high dosage of radiation can harm the body.
