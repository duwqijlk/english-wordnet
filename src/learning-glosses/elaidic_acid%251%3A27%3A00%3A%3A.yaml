simpleMeaning: A fatty acid with one double bond, the trans form of oleic acid, whose chain stays straight,
  not bent. Margarine and fried foods contain it as their main trans fat.
scope: The straight-chain form of oleic acid, not oleic acid itself and not trans fats in general.
examples:
- Elaidic acid is produced when oils are partially hydrogenated to make margarine.
- Fried foods can contain elaidic acid formed during repeated heating of the oil.
