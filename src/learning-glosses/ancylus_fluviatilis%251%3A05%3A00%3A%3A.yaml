simpleMeaning: A tiny, cone-shaped water snail that looks like a limpet but lives and feeds on plants
  in fresh water.
scope: This is a tiny, cone-shaped water snail that feeds on plants in fresh water, also called freshwater
  limpet and river limpet; not a sea limpet and not a land snail.
examples:
- Ancylus fluviatilis clung to a plant in the stream.
- We found Ancylus fluviatilis feeding on fresh-water plants.
