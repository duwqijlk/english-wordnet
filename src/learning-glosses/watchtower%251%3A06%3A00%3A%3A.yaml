simpleMeaning: a tower where a guard stands to watch prisoners, and to look out for fires or enemies
scope: A tower for a guard on the lookout, not a tower for church bells and not a lighthouse.
examples:
- The guard climbed the watchtower to look out for fires.
- From the watchtower, she could see the prisoners in the yard below.
