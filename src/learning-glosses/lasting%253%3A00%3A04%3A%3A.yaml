senseId: 'lasting%3:00:04::'
synsetId: 01758923-a
simpleMeaning: 'Something that does not change much: its state, place, and standing stay the same as time
  passes.'
scope: 'Also called permanent: staying the same in state, place, and standing, not merely going on a long
  time without change.'
examples:
- They wanted a lasting peace, not one that would end in a month.
- He wanted a lasting job, not one that would end in a year.
