simpleMeaning: a swelling of the stomach and intestines that can be caused by a germ found in food, Salmonella
  enteritidis
scope: A swelling of the stomach and intestines, also called gastroenteritis; not the flu that affects
  the nose and chest and not a stomach ulcer.
examples:
- He caught intestinal flu after eating the bad meat.
- Intestinal flu kept her in bed for three days.
