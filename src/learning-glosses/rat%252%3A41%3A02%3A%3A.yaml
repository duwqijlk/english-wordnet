simpleMeaning: to hire people to work in a place of work when its own workers have stopped work as a group
scope: This is using such workers in a place of work when others have stopped work; it is not leaving
  your party or group of friends, and it is not the animal.
examples:
- The factory ratted during the strike by hiring men who would still work.
- The mill owner ratted when he brought in outside workers while his own men were on strike.
