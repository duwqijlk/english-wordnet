simpleMeaning: A Muslim of the branch that holds the first four leaders after Muhammad to be the true
  ones.
scope: A Muslim of the main branch that follows the first four caliphs, also called a Sunni Muslim and
  a Sunnite; not a member of the other main branch.
examples:
- Most Muslims in Egypt are Sunni.
- As a Sunni, he follows the first four caliphs.
