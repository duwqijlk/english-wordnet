simpleMeaning: Communication that moves from one place to another by signals that are sent out
scope: Communication by signals sent out, not the gears in a car, not the share of light that gets through
  a thing, not the act of sending a message, and not the spread of a sickness.
examples:
- The transmission of the news took only seconds.
- Radio transmission lets us hear voices from far away.
