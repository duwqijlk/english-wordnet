simpleMeaning: A person of one of two Shoshonean peoples of the south-west of the United States, kin to
  the Aztecs, the northern people or the southern people
scope: This is a person of one of two Shoshonean peoples of the south-west of the United States, kin to
  the Aztecs, the northern people or the southern people; Piute is another name for this sense, and the
  tongue spoken by these peoples is a different sense.
examples:
- The Paiute lived in the south-west of the United States.
- A Paiute elder told stories of the northern people.
