simpleMeaning: A set or pattern of parts joined into a whole that is more than just the parts added up.
scope: This is a set or pattern of parts joined into a whole that is more than just the parts added up,
  not a pile of separate parts and not one single part on its own.
examples:
- The face is a gestalt, not just eyes and a nose.
- In gestalt thinking, the whole matters most.
