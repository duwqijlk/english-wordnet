simpleMeaning: in people's minds, a being, usually a woman, with special powers that come from the devil
scope: An imagined being, usually a woman, whose powers come from the devil; not a real person who does
  magic as part of a religion and not just an unkind old woman.
examples:
- In the story, a witch turned the prince into a frog.
- The children dressed as witches for the party, with black hats and long black dresses.
