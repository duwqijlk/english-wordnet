simpleMeaning: A member of a group of North American Indians who speak the language of that group and
  live on the northwest coast of North America.
scope: This is a member of the group of North American Indians on the northwest coast, not the language
  the group speaks.
examples:
- The Salish lived on the northwest coast of North America.
- Salish families fished along the northwest coast.
