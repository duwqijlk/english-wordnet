simpleMeaning: firm in your love and support, most often for the king or queen who has the right to rule
  you, or for your government
scope: Firm in love and support for a lawful ruler or government, not a person who follows whoever is
  in power and not a person who stays true only to a friend.
examples:
- It is impossible to be allegiant to two opposing forces.
- The allegiant soldiers stood by their king through the long war.
