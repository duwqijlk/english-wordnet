simpleMeaning: to put a feather or a group of feathers on something as a decoration
scope: To put a feather on something to make it look fine, not to make a shape like a feather and not
  the feather itself.
examples:
- She plumed her hat with a white feather for the party.
- The helmet was plumed and looked grand in the sun.
