simpleMeaning: coming before something and getting a person or thing ready for it
scope: About steps or work that come before a thing and get it ready, not about the main thing itself
  and not about work done after it.
examples:
- They took a few preparatory steps before starting the work.
- She did some preparatory reading before the course began.
