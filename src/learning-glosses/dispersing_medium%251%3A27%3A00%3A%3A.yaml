simpleMeaning: In a mix of tiny bits, the stuff in which bits of another thing are spread through
scope: In a mix of tiny bits, the stuff in which bits of another thing are spread through; dispersing
  phase and dispersion medium are other names for this, not the thing spread through and not a plain liquid.
examples:
- The water was the dispersing medium for the tiny drops of oil.
- In the paint, the dispersing medium held the colour bits spread through it.
