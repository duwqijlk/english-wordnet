simpleMeaning: The smallest of all viruses, this plant virus keeps its RNA in a ring and has no coat of
  protein round it.
scope: Also called viroid, this plant virus is the smallest kind of virus and has no protein coat; not
  a full virus with a coat.
examples:
- The virusoid was found in the leaves of a sick plant.
- A virusoid carries its RNA in a ring, with no protein coat round it.
