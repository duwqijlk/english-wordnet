simpleMeaning: a part that opens and shuts a pipe or hole by moving back and forth over the opening
scope: A part that opens and shuts a passage by moving over the opening; not a tap you turn and not a
  flap that swings on a hinge.
examples:
- The slide valve moved to let steam into the cylinder.
- A worn slide valve would not shut the passage.
