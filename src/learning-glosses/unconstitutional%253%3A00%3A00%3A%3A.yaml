simpleMeaning: going against the basic rules for how a country is run; in the United States, going against
  that country's own set of basic rules
scope: This says a law or action goes against the basic rules for how a country is run, not just that
  it is a bad or unfair law.
examples:
- The court said the new law was unconstitutional and could not stand.
- They said the rule was unconstitutional because it went against the basic rules of the United States.
