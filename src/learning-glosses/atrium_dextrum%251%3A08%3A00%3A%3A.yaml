simpleMeaning: Blood from the body's big veins and the heart's own vein flows into this right-hand upper
  room of the heart.
scope: This is the heart's right upper room, also called right atrium and right atrium of the heart, not
  the left upper room.
examples:
- Blood from the body's big veins entered the atrium dextrum.
- The atrium dextrum took in blood from the heart's own vein.
