simpleMeaning: a cold feeling in the body that often comes at the start of a sickness with fever
scope: Also called shivering, this is a cold feeling in the body that often comes at the start of a sickness
  with fever, not a sudden fear and not a pleasant shiver of fright.
examples:
- A chill ran through her as the fever began.
- He felt a chill and knew he was falling ill.
