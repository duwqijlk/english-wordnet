simpleMeaning: A mix of vinegar or wine and oil, with spices and seasonings of many kinds, used to soak
  food in before cooking.
scope: A mix of vinegar or wine, oil, and spices for soaking food before cooking, not the act of soaking
  food in it.
examples:
- She left the chicken in the marinade overnight.
- The marinade gave the meat a sharp, rich taste.
