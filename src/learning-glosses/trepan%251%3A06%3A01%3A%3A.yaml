simpleMeaning: a tool a doctor uses to cut out a piece of bone from the head
scope: This is a doctor's tool for cutting out bone from the head; trephine is another name for this sense.
  Not a drill for teeth and not a saw for cutting wood.
examples:
- The surgeon picked up the trepan to open the skull.
- A trepan was once used to cut a round piece of bone from the head.
