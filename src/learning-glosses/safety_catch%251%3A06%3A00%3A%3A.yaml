simpleMeaning: a lock on a weapon that keeps it from firing
scope: 'Also called a safety lock: a lock on a weapon that keeps it from firing, not the trigger and not
  a catch that holds a door shut.'
examples:
- He clicked the safety catch on before putting the rifle away.
- The safety catch stopped the gun from firing when it slipped.
