simpleMeaning: of or about one of the small sacs found in a gland made up of many parts
scope: This is of or about one of the small sacs found in a gland made up of many parts, also called acinar,
  acinic and acinose; it is not a whole gland, and not a small part of a fruit.
examples:
- The acinous parts of the gland are the small sacs.
- Doctors look at the acinous tissue to check the small sacs.
