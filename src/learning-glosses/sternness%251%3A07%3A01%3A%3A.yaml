simpleMeaning: the quality of a place, such as land or views, that is dark and sad and makes people feel
  not welcome
scope: This is about a place looking dark, sad, and not welcoming, not about a person being strict in
  manner or rules.
examples:
- The sternness of the dark hills made the valley feel cold and empty.
- She felt uneasy at the sternness of the grey sea and rocky shore.
