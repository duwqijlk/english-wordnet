senseId: 'africanized_bee%1:05:00::'
synsetId: 02211150-n
simpleMeaning: A kind of bee from Brazil, made in the 1950s by crossing a fierce African bee with a honeybee;
  it keeps most African traits and now spreads north to Texas.
scope: Also called killer bee, Africanized honey bee, Apis mellifera adansonii, and Apis mellifera scutellata;
  a fierce kind of bee from Brazil, not a calm garden honeybee and not a wild wasp.
examples:
- Africanized bees spread north into Texas in recent years.
- An Africanized bee stung the farmer when he came too close.
