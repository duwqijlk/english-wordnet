simpleMeaning: A large kind of flower with purple or white blooms, from the middle and south of Europe.
scope: Also called Iris germanica; a big flower of central and southern Europe with purple or white blooms,
  set beside the northern Italian iris with deep blue-purple flowers and other garden irises.
examples:
- The German iris by the wall opened its purple flowers this week.
- She planted German iris with white flowers along the path.
