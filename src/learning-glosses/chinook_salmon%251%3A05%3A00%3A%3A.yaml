simpleMeaning: a large Pacific fish prized as food; the grown ones die after laying eggs
scope: A large Pacific fish prized as food, whose grown ones die after laying eggs; chinook and king salmon
  are other names for this sense, not any other salmon and not a trout.
examples:
- Chinook salmon swim up the river each year.
- The chinook salmon is prized food on the coast.
