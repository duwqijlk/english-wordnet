simpleMeaning: a lump made from blackened wood or coal dust that is burned to give heat
scope: 'Also called briquette: a lump burned for heat, not a lump of coal from a mine and not wood burned
  in a fire.'
examples:
- He stacked the briquets beside the grill for the evening barbecue.
- A single briquet gave off steady heat for an hour.
