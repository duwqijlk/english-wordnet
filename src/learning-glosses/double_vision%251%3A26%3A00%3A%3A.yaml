simpleMeaning: a fault of the eyes in which one thing is seen as two things
scope: 'Also called diplopia: a fault of the eyes in which one thing looks like two, not poor sight in
  general and not seeing things that are not there.'
examples:
- His double vision made it hard to read the road signs.
- After the blow to her head, she had double vision and saw two doorways where there was one.
