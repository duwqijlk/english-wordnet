simpleMeaning: Too sharp in taste to eat is the thin-shelled fruit of this tree of the east of the United
  States, whose leaves have seven or nine small parts.
scope: This tree of the east of the United States has leaves of seven or nine small parts, and bitter
  hickory, bitternut, bitternut hickory and swamp hickory are other names for it.
examples:
- We picked up the thin-shelled fruit that fell from the bitter pignut.
- One leaf of the bitter pignut had nine small parts.
