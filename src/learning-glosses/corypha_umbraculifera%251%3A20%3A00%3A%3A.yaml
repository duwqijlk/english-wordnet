simpleMeaning: A tall palm of southern India and Sri Lanka with huge leaves used as umbrellas and fans,
  or cut into strips for writing paper.
scope: Also called talipot and talipot palm; a tall palm with huge leaves, not the big-leaved palm of
  Malaya whose leaves are used for thatching.
examples:
- The Corypha umbraculifera shaded us with its huge leaves.
- They cut Corypha umbraculifera leaves into strips for writing paper.
