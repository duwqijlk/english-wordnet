simpleMeaning: In this sloping crack in rock, the rock above seems to have slipped down past the rock
  below it.
scope: Also called a gravity fault or a normal fault, this sloping crack in rock is one in which the rock
  above seems to have slipped down past the rock below it.
examples:
- The common fault showed the upper rock slipped down past the lower rock.
- They found a common fault where the rock above had slipped down.
