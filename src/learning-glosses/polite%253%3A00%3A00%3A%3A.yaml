simpleMeaning: showing care for others in your ways, your speech, and how you act
scope: Showing care for others in your ways, speech, and acts, not doing only the least that social rules
  ask, and not having fine taste and ways.
examples:
- He was always polite, thanking people and listening with care.
- She spoke in a polite way and never spoke over others.
