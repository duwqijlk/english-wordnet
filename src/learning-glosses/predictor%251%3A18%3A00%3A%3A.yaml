simpleMeaning: a person who says what will happen in the future, usually because they know a lot about
  a subject
scope: A person who says what will happen next, not a machine that helps aim guns at planes, and not facts
  that help you guess what will happen.
examples:
- As a weather predictor, she says rain is likely tomorrow based on her study of the sky.
- The predictor told the crowd that prices would rise next year.
