simpleMeaning: A weed of Europe and Asia with yellow, mauve or white flowers and fruits shaped like pods
scope: This is a weed of Europe and Asia with yellow, mauve or white flowers and fruits shaped like pods;
  jointed charlock, runch, wild radish and wild rape are other names for this sense, and it is one of
  the weeds of the fields, close to the charlock and the wild mustard.
examples:
- Raphanus raphanistrum has yellow, mauve or white flowers.
- The fruits of Raphanus raphanistrum are shaped like pods.
