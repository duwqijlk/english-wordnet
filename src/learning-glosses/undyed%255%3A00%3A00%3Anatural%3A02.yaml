simpleMeaning: not colored by people and not made white or lighter by people
scope: Also called unbleached. This describes something in its natural color, because people have not
  colored it and have not made it white or lighter; it is not something dyed, and not something bleached.
examples:
- She wore a dress made from undyed cotton.
- His undyed hair was brown and grey.
