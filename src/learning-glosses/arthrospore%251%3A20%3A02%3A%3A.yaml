simpleMeaning: a body made by some bacteria that looks like a spore, a tiny cell that can grow, but is
  not one made inside a cell
scope: A body made by some bacteria that looks like a spore but is not one made inside a cell, not a true
  spore and not the resting cell made by algae or fungi.
examples:
- Under the microscope, the arthrospore looked like a spore but had formed in a different way.
- The lab found an arthrospore in the sample of bacteria.
