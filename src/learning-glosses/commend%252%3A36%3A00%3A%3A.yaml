senseId: 'commend%2:36:00::'
synsetId: 01693064-v
simpleMeaning: to show that someone or something is good, so that others will think well of them, be kind
  to them, or trust them
scope: This means showing that a person or thing is good and should be trusted or treated kindly; not
  mentioning someone to a friend as a greeting or to show friendship.
examples:
- Her years of honest work commend her to voters who want a leader they can trust.
- The book's clear writing commends it to anyone who wants to learn.
