simpleMeaning: The blood cells are the wrong shape, curved like a new moon, in this blood condition found
  mostly in Black people and present from birth.
scope: This blood condition, present from birth, is also called crescent-cell anaemia, crescent-cell anemia,
  drepanocytic anaemia, sickle-cell anaemia, sickle-cell anemia, and sickle-cell disease.
examples:
- The drepanocytic anemia had been with him since birth.
- The drepanocytic anemia showed in his blood cells.
