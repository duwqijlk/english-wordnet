simpleMeaning: how fast music goes, counted by how many pulses fall in 60 seconds
scope: 'Also called bpm and metronome marking: how fast music goes, counted by how many pulses fall in
  60 seconds, not the speed of a heart and not the loudness of music.'
examples:
- The song has 120 beats per minute, so it feels fast.
- The conductor set the beats per minute before the band began.
