simpleMeaning: a plant whose roots and, above all, pale stalks are eaten like celery, and which is kin
  to the artichoke
scope: The eaten parts of the plant, not the whole plant and not an artichoke, though it is kin to one.
examples:
- We ate cardoon stalks with olive oil.
- The cardoon in the garden was blanched before cooking.
