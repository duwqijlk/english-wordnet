simpleMeaning: the sight that uses the small sharp spot at the back of the eye and the ring round it,
  the middle part of what a person can see
scope: The sight that uses the small sharp spot at the back of the eye and the ring round it, the middle
  part of what a person can see, not the sight at the edges of what a person can see and not the whole
  field of sight.
examples:
- Central vision lets her read the small print on the page.
- Damage to his central vision made it hard to see faces.
