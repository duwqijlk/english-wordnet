simpleMeaning: A dishonest plan in which you cheat at betting or get a person to pay for a thing with
  no worth.
scope: Also called con, sting, hustle, flimflam, bunco, bunco game, bunko, bunko game, con game, and confidence
  game; a cheating trick to get money, not a magic trick and not a fair bet.
examples:
- The confidence trick fooled even careful buyers.
- She saw through the confidence trick at once.
