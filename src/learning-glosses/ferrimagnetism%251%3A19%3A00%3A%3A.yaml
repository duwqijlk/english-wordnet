senseId: 'ferrimagnetism%1:19:00::'
synsetId: 11500491-n
simpleMeaning: Some iron-rich stuff keeps a lasting pull because its smallest bits, lined up in opposite
  ways, do not quite cancel each other out
scope: This pull comes from bits lined up in opposite ways, unlike ferromagnetism, where the bits line
  up the same way.
examples:
- Ferrimagnetism leaves a lasting pull in the iron-rich stuff.
- The ferrimagnetism of the sample showed in the pull it kept.
