simpleMeaning: A group of Tibeto-Burman tongues spoken in the far north of Burma and in nearby parts of
  China and India
scope: Also called Kachin language, Kachinic, or Kachinic language; these are the tongues of northernmost
  Burma and nearby lands, not the Kamarupan group of tongues.
examples:
- Kachin is spoken in northern Burma.
- Many people in the hills speak Kachin.
