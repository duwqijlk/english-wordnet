simpleMeaning: Hit hard with a heavy blade, such as an ax or a chisel, to cut it or give it its shape.
scope: This describes a thing cut or shaped by hard hits from a heavy blade, not sawn or planed smooth;
  also called hewn.
examples:
- The beams were hand-hewn from oak.
- A hand-hewn log made the table top.
