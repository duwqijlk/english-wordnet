simpleMeaning: a paper label or postage stamp already covered with glue, so it can be pressed down and
  will stay in place
scope: A paper label or postage stamp with glue already on it, ready to press down; not a label that needs
  wetting first and not a label held by pins.
examples:
- She put stick-on labels on all the jam jars.
- The stick-on stamp was ready to use straight from the packet.
