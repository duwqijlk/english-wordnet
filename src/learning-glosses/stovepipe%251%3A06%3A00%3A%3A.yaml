synsetId: 04337884-n
simpleMeaning: a wide metal pipe that joins a stove to a flue (a pipe or opening that takes smoke out),
  acting as part of a chimney
scope: This sense is the wide metal pipe for a stove, not the tall hat for a man that has the same name.
examples:
- The stovepipe ran from the wood stove up through the roof.
- Smoke rose through the metal stovepipe above the kitchen stove.
