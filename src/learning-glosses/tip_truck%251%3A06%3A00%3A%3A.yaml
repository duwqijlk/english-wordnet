simpleMeaning: With the front of its flat bed lifted on air, a lorry whose load runs off by its own weight,
  with no one touching it.
scope: Also called a tipper, a dump truck, a dumper, a tipper lorry and a tipper truck, this lorry empties
  its load with no one touching it.
examples:
- The tip truck raised its bed and dropped the gravel by the road.
- A tip truck backed up to the pile and let the sand run out.
