simpleMeaning: a small nut from one of two small chestnut trees in the southern United States, much like
  a hazelnut
scope: 'Also called chincapin and chinquapin: a small nut, not the tree itself and not a hazelnut.'
examples:
- He picked a chinkapin from the ground and cracked it open.
- The chinkapin nuts are much like hazelnuts.
