simpleMeaning: A leaf-shedding plant grown widely in the southern United States for show, for fine maple-like
  leaves and long strings of yellow-green flowers, then odd pods like leaves
scope: Also called phoenix tree, Chinese parasol, Chinese parasol tree, or Firmiana simplex; a leaf-shedding
  plant grown in the southern United States for show, not the small Asian tree that gives lacquer.
examples:
- The Japanese varnish tree lined the road, its yellow-green flowers bright in spring.
- We sat under the Japanese varnish tree, its odd pods hanging overhead.
