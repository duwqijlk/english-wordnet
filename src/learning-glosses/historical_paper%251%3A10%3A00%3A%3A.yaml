simpleMeaning: The past is told as it really was in this writing, not as a made-up story or a tale no
  one can check
scope: Also called a historical document or a historical record, this is writing with real value for what
  happened in the past, not a novel or a made-up tale.
examples:
- The archive keeps every historical paper that tells how the town was built.
- She read a historical paper about the first ships to reach the coast.
