simpleMeaning: Ten baths or ten ephahs make up this old Hebrew measure of how much a container holds
scope: An old Hebrew measure of capacity, also called a kor, equal to ten baths or ten ephahs; not a modern
  measure and not a measure of weight.
examples:
- The harvest was measured in homers of grain.
- One homer held ten baths of oil.
