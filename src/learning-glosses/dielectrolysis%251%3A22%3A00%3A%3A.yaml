simpleMeaning: 'In a liquid with bits spread through it, charged bits move under a charged field: plus
  bits go to the minus end, minus bits to the plus end'
scope: This movement of charged bits is also called cataphoresis, electrophoresis and ionophoresis.
examples:
- The scientist watched dielectrolysis move the charged bits to opposite ends.
- Dielectrolysis showed plus bits moving to the minus end.
