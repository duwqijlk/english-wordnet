simpleMeaning: the field of study that works out how what researchers have found out can be put to use
  on real problems
scope: 'Also called applied science, engineering and technology: the study of how knowledge is put to
  use on real problems, not the study of nature for its own sake and not the making of one machine.'
examples:
- She chose engineering science because she wanted to solve real problems.
- His degree in engineering science covered bridges, power and water.
