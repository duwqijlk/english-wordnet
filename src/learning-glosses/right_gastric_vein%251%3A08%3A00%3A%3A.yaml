simpleMeaning: From the upper sides of the stomach, smaller blood tubes pour into this one, and this one
  pours into the portal blood tube.
scope: Also called pyloric vein and vena gastrica-dextra, this blood tube empties into the portal blood
  tube.
examples:
- The right gastric vein empties into the portal vein.
- Small veins from the stomach join the right gastric vein.
