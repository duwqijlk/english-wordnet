simpleMeaning: a man-made part placed in the body to stay there and take the place of a missing part
scope: A man-made part placed in the body to stay, not the act of an egg fixing itself in the womb.
examples:
- The surgeon fitted her with a dental implant.
- The implant stayed in place for many years.
