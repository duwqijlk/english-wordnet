simpleMeaning: Exercise, rubbing, and other such ways are the tools of this care
scope: Also called physiotherapy or physical therapy, this care uses exercise and rubbing and other such
  ways, not drugs and not surgery.
examples:
- After the accident, she went for physiatrics three times a week.
- Her physiatrics plan mixed exercise and rubbing on the sore leg.
