simpleMeaning: to give someone extra money for a service, on top of the pay that was agreed on
scope: 'Also called tip and fee: to give extra money for a service, not a piece that closes a hole in
  a barrel.'
examples:
- He bunged the driver ten pounds for carrying his bags.
- She always bungs the hairdresser a little extra when she is happy with the cut.
