simpleMeaning: having poor judgment about what is beautiful or about what is good to do or say with other
  people
scope: This is poor judgment about beauty or about what is right to do with other people. It is not the
  sense about food or drink having little flavour.
examples:
- Wearing that loud, tasteless shirt to the funeral showed poor judgment.
- He made a tasteless joke about her illness, and no one laughed.
