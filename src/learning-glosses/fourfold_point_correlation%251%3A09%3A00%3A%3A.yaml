simpleMeaning: When two sets of marks can each be put on a scale with two ordered ends, as with male and
  female, this number shows how they go together
scope: Phi coefficient and phi correlation are other names for this number, which shows how two sets of
  marks go together.
examples:
- The fourfold point correlation was high for the two sets of marks.
- They worked out the fourfold point correlation for men and women.
