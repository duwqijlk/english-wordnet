simpleMeaning: money, jewels, and other things worth a lot, gathered and kept together
scope: 'This sense is wealth itself: money and jewels gathered and kept together. It is not the act of
  keeping a single dear thing because you value it highly.'
examples:
- The pirates hid their treasure in a chest on the island.
- Gold coins and jewels made up the treasure in the cave.
