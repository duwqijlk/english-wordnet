simpleMeaning: The quality of being so exciting that it tends to upset the mind or the senses.
scope: The quality of being so exciting that it tends to upset the mind or the senses, not plain joy and
  not drunkenness.
examples:
- The headiness of the win left him giddy and unable to think straight.
- There was a headiness in the air after the last-minute goal.
