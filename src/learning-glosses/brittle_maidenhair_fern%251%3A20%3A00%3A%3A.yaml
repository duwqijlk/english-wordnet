simpleMeaning: Grown in many places, this fern of warm American lands has wide flat leaflets.
scope: Also called brittle maidenhair, it is a fern from warm parts of America with wide flat leaflets,
  grown in many places, not a fern with narrow leaflets.
examples:
- The brittle maidenhair fern has wide flat leaflets.
- We grow a brittle maidenhair fern in warm places.
