simpleMeaning: a unit of pressure equal to the push that holds up a column of mercury, a silver liquid
  metal, 760 mm high at sea level and 0 degrees centigrade
scope: 'Also called an atmosphere, atm, and standard pressure: a set unit of pressure, not the air around
  the earth and not a measure of heat.'
examples:
- At sea level the pressure is one standard atmosphere.
- The book gives the pressure as two standard atmospheres.
