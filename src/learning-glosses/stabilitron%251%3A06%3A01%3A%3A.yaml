simpleMeaning: a diode, a small electronic part made of semiconductor material, whose backward flow of
  current jumps sharply at one set backward voltage, used to keep voltage steady
scope: 'Also called a zenerdiode: a small electronic part that keeps voltage steady, not an ordinary diode
  that only lets current pass one way and not a fuse that breaks a circuit.'
examples:
- The stabilitron kept the voltage steady in the radio circuit.
- A stabilitron in the power pack stops the voltage from rising too high.
