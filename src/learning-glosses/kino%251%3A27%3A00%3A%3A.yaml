simpleMeaning: A gum from several hot-climate plants, used to tighten the skin and in making leather
scope: This is a gum from several hot-climate plants, used as a stuff that tightens the skin and in making
  leather; gum kino and kino gum are other names for this sense, not any other plant gum and not a stuff
  used only in tanning.
examples:
- Kino is used in making leather.
- The gum kino comes from hot-climate plants.
