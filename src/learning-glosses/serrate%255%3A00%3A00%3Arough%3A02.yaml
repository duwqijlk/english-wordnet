simpleMeaning: having an edge with small cuts and sharp points that lean toward the tip, like the edge
  of a saw
scope: 'Also called toothed, notched, and serrated: this describes an edge with points leaning toward
  the tip, not a smooth edge and not rough in a general way.'
examples:
- The plant has serrate leaves with points leaning toward the tip.
- He held a serrate leaf up to the light.
