simpleMeaning: In genetics, the differences in genes in a group of living things that nature can act on
  by picking which ones live and have young
scope: This is gene differences in a group that nature can act on, not different crystal forms of one
  chemical and not two or more body forms in one animal kind.
examples:
- The polymorphism in that population meant some beetles carried genes that helped them live longer.
- Scientists measured polymorphism to see how much gene difference was present in the group.
