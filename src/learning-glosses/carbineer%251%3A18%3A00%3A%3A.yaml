simpleMeaning: a soldier who carries a short rifle, in former times a mounted soldier
scope: A soldier who carries a short rifle, in former times a mounted soldier; carabineer and carabinier
  are other names for this sense, not a foot soldier with a long gun.
examples:
- The carbineer dismounted and checked his rifle.
- A company of carbineers camped by the road.
