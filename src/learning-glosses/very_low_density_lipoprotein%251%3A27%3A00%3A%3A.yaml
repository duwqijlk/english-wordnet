simpleMeaning: Big fat-carrying bits in the blood, rich in triglycerides, that move through the blood
  giving their triglycerides to fat and muscle until what is left is changed into LDL.
scope: For large fat-carrying bits in the blood that give up triglycerides and become LDL.
examples:
- Very low density lipoprotein carries fat.
- Very low density lipoproteins give up triglycerides.
