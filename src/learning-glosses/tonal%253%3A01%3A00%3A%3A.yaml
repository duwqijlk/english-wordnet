simpleMeaning: Of speech where how high or low the voice goes decides what a word means, when the words
  sound the same.
scope: 'Also called tonic: of speech where how high or low the voice goes decides what a word means, when
  the words sound the same; not the sense of music built on tones and chords round one main note.'
examples:
- Chinese is tonal, so the same sounds can mean different things.
- The language they speak is tonal, and a small change in pitch changes the sense.
