simpleMeaning: a state where the way for air to the lungs is blocked, such as by food or by swelling in
  the throat
scope: This is the state when the way for air is blocked, not the act of pressing someone's throat to
  stop them breathing, and not hot air that makes breathing hard.
examples:
- He started choking on a piece of bread and could not breathe.
- Choking can happen fast when food blocks the way for air.
