simpleMeaning: To grow soft or fall apart after being left in heat or wet
scope: To grow soft or fall apart after being left in heat or wet, not the sense of making a thing soft
  with chemicals, and not the food sense.
examples:
- The wood digested slowly in the hot, damp shed.
- The old rope digested in the heat and wet until it fell apart.
