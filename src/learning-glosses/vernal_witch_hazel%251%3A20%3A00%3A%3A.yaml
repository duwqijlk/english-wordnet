simpleMeaning: a bush with a sweet smell that grows in the lower Mississippi valley and has very small
  flowers from midwinter to spring
scope: A sweet-smelling bush of the lower Mississippi valley, not the common witch hazel of the north
  and not any other spring-flowering bush.
examples:
- The vernal witch hazel in the garden filled the air with a sweet smell in February.
- By March the vernal witch hazel was covered in tiny yellow flowers.
