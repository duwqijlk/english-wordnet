simpleMeaning: A United States military honour for very good work in a war, in a job that carries great
  responsibility.
scope: A United States military honour for very good work in wartime duty carrying great responsibility,
  not a prize for one brave act.
examples:
- He received the Distinguished Service Medal for his work in the war.
- The Distinguished Service Medal is given for service in a job of great responsibility.
