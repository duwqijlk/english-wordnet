simpleMeaning: to make someone feel annoyed, or to disturb them, especially by small things that get on
  their nerves.
scope: Causing irritation, especially through small things (another name for this sense is 'annoy'), not
  making someone puzzled, nervous, or putting them to inconvenience.
examples:
- The constant dripping from the tap really bothered her.
- Please don't bother your sister while she is studying.
