simpleMeaning: For varnish and for making paper, makers use this sticky stuff from trees of Australia,
  which melts in alcohol.
scope: Accaroid resin, accroides, accroides gum, accroides resin, and gum accroides are other names for
  this sticky tree stuff from Australia, which melts in alcohol and goes into varnish and paper.
examples:
- From Australian trees, acaroid resin melts in alcohol.
- The varnish was made with acaroid resin.
