simpleMeaning: a metal plate for climbing, with a long thin slot for the rope loop to pass through and
  a clip that locks the rope when the climber pulls on it
scope: Also called an auto-blocking belay device; a metal plate that locks the rope in climbing, not a
  plain plate with no lock.
examples:
- She threaded the rope through the guide plate before the climb.
- The guide plate locked the rope when her partner slipped.
