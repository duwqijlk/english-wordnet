simpleMeaning: a water flower from Egypt with flowers the colour of a clear sky, held as holy by the people
  of Egypt
scope: A water flower from Egypt held as holy by the people of Egypt, not the lotus of India and south-east
  Asia and not a flower grown only for show.
examples:
- The blue lotus was held sacred by the Egyptians.
- A blue lotus floated on the still water of the Nile.
