simpleMeaning: 'A tall glass tube that separates a mixture: poured in at the top, it washes down through
  a solid material that holds its parts back differently, forming colored bands.'
scope: This is the laboratory tube for separating mixtures, not the newspaper opinion piece, the vertical
  strip of printed text, or an upright pillar.
examples:
- The chemist packed the column with silica gel before loading the sample.
- Solvent ran through the column, separating the mixture into colored bands.
