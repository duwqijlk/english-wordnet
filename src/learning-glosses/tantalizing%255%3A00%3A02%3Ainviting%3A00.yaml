senseId: tantalizing%5:00:02:inviting:00
synsetId: 01361694-s
simpleMeaning: making you want something, or hope to get something, that you cannot have or that seems
  close but stays out of reach
scope: 'Also called tantalising: it makes you want something you cannot have, not a sense that the thing
  is easy to get.'
examples:
- The shop window held a tantalizing cake that we could see but not buy.
- She gave us a tantalizing taste of success, but the prize stayed out of reach.
