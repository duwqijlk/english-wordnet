senseId: 'orrery%1:06:00::'
synsetId: 03861985-n
simpleMeaning: A mechanical model of the solar system in which gear-driven balls show the planets' relative
  positions and movements; sometimes built into a clock.
scope: A gear-driven mechanical model of the solar system; not a planetarium building or projector, and
  not an astronomical clock, though one may be built into a clock.
examples:
- The brass orrery on the table showed the planets circling the sun.
- He turned the orrery's handle to set the model in motion.
