simpleMeaning: the opening or tunnel a drill leaves behind, most often made to explore what lies beneath
  the surface
scope: An opening or tunnel cut by a drill, also called a drill hole or bore-hole, not the act of making
  it, not the width of a barrel, and not a dull person.
examples:
- The bore was drilled to a depth of three hundred metres.
- They lowered a camera into the bore to inspect the rock.
