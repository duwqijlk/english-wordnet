simpleMeaning: A large sea mammal with thin plates in its mouth for straining food, and long front fins,
  that bends its back into a curve as it dives
scope: This is a large sea mammal with long front fins that bends its back into a curve as it dives; humpback
  is another name for this sense, not a blue whale and not a dolphin.
examples:
- A humpback whale raised its tail before it dived.
- We watched a humpback whale bend its back as it dived.
