simpleMeaning: to break a substance down into simpler parts inside a living body
scope: To break a substance down in the body; catabolise is another name for this sense; not to build
  a substance up.
examples:
- The body catabolizes fat when food is scarce.
- During a long fast, the body catabolized muscle for fuel.
