simpleMeaning: Of no known use or cost to people, this tiny living thing lives on animals with no backbones
  and on simple animals with backbones
scope: A tiny living thing that lives on animals with and without backbones, of no known use or cost to
  people, not a germ that makes people sick and not a worm you can see.
examples:
- Scientists found a haplosporidian in the fish.
- The haplosporidian was found in a sea animal with no backbone.
