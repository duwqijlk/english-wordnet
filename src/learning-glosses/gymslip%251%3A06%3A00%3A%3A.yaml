simpleMeaning: A tunic with no sleeves, worn by English schoolgirls as part of a school uniform.
scope: A tunic with no sleeves, worn by English schoolgirls as part of a school uniform; not a cloth foot
  covering and not a set of moves that builds strength.
examples:
- She put on her gymslip before school.
- The gymslip was part of the school uniform for English girls.
