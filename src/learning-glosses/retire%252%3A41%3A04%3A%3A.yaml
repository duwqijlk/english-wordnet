simpleMeaning: to take bills, shares, or bonds out of use and out of the market so they can no longer
  be bought, sold, or passed on
scope: This is taking bills, shares, or bonds out of use, not a person leaving a job and not making someone
  else leave a job.
examples:
- The bank retired the old bills and replaced them with new ones.
- The company retired its bonds early and paid back the money it owed.
