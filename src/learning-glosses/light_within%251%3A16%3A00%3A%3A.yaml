simpleMeaning: Quakers believe a holy power is with them, and it shows them what to do and leads their
  souls.
scope: Also called Light, Christ Within, and Inner Light, this is the holy power Quakers believe is with
  them, not a light that can be seen.
examples:
- The Light Within guides her in hard times.
- He trusts the Light Within to show him the right path.
