simpleMeaning: A beat pattern in verse with two weak beats and then a strong beat.
scope: 'Also called anapest: a beat pattern in verse with two weak beats and then a strong beat, not a
  pattern with a strong beat first and not a pattern of two beats only.'
examples:
- The line ends with an anapaest.
- An anapaest has two weak beats and then a strong beat.
