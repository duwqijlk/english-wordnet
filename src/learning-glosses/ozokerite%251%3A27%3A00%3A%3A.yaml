simpleMeaning: This soft waxy mineral lies in the ground with oil, a mix of carbon and hydrogen; some
  kinds go into candles and a refined wax.
scope: A soft waxy mineral found in the ground with oil; ader wax, earth wax, mineral wax and ozocerite
  are other names for this sense.
examples:
- Ozokerite was dug from the ground where oil is found.
- Some ozokerite is made into candles.
