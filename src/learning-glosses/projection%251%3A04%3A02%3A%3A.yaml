simpleMeaning: the act of sticking out from something, so part of it stands beyond the rest
scope: A part that sticks out from something, not a picture thrown from a film onto a screen and not a
  guess about what will happen.
examples:
- The projection of the beam from the wall held up the roof.
- A small projection of rock from the cliff face gave the climbers a hold.
