simpleMeaning: A nerve disorder in which muscles twitch and tighten painfully, sometimes severely enough
  to cause seizures; it is linked to low calcium, too little vitamin D, or an acid-base imbalance.
scope: Another name for the same calcium-linked nerve condition, not an ordinary muscle cramp felt after
  exercise.
examples:
- She was diagnosed with intermittent cramp after weeks of twitching muscles.
- The child's intermittent cramp improved once his vitamin D levels were corrected.
