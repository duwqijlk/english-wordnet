simpleMeaning: Grown far and wide, this southern European plant of the acanthus group has whitish flowers
  veined with purple.
scope: Also called bear's breech and bear's breeches, it is a southern European acanthus grown far and
  wide, with whitish flowers veined with purple, not the evergreen eryngo of the east coast.
examples:
- Sea holly grew in the garden, its whitish flowers veined with purple.
- Sea holly grew beside the path.
