simpleMeaning: The quality of being led by sudden urges that change without warning.
scope: Being led by sudden urges no one can guess, also called unpredictability; not the trait of acting
  from whim instead of reason.
examples:
- Her capriciousness made it hard to plan anything with her.
- The capriciousness of the weather spoiled the picnic.
