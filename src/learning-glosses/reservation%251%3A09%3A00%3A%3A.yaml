simpleMeaning: a doubt you do not say out loud, and it stops you from fully accepting something
scope: This is a quiet doubt in your mind, not a room or seat kept for you ahead of time, and not the
  written note that shows such a booking.
examples:
- Though she smiled and agreed, she had a quiet reservation about the plan.
- I have a reservation about letting him drive the children.
