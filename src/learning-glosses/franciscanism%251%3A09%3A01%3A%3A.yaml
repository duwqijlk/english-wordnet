simpleMeaning: The beliefs and ways of the Roman Catholic order of friars begun by St Francis of Assisi
  in 1209, at first begging, given to humble living and owning little.
scope: The beliefs and practices of the Franciscan order, not the life of St Francis himself.
examples:
- His Franciscanism showed in his plain dress and simple meals.
- The friar's Franciscanism shaped every part of his daily life.
