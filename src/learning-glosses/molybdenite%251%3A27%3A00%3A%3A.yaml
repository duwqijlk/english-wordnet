simpleMeaning: A mineral that looks like graphite, the soft grey stuff used in pencils, and is the main
  source of the metal molybdenum and of things made from it
scope: A mineral that looks like graphite and is the chief source of molybdenum, not graphite itself and
  not another ore.
examples:
- Molybdenite is mined as the chief source of molybdenum.
- The grey molybdenite shone softly in the rock.
