simpleMeaning: flowers like daisies in blue, purple, red, or mixed colours grow on this low plant from
  the Canary Islands, grown in gardens far and wide
scope: A low plant from the Canary Islands grown for its daisy-like flowers, not a true daisy.
examples:
- The cineraria in the window box opened blue flowers this week.
- She planted cineraria along the path for their red and purple blooms.
