simpleMeaning: The effort a man makes to win a woman's love, often hoping to marry her.
scope: This is a man's romantic pursuit of a woman; it is not a request or plea to someone of higher rank,
  and not a legal case in court.
examples:
- The young lord pressed his suit with poems and gifts.
- Despite months of patient attention, his suit for her hand came to nothing.
