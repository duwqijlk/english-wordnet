simpleMeaning: If a living thing touches this growth or eats enough of it, it can fall sick or die.
scope: A harmless garden growth is its nearest kin, but this one can sicken or kill a living thing that
  touches it or eats enough of it.
examples:
- Touching the poisonous plant can make a person sick.
- Eating enough of the poisonous plant can kill an animal.
