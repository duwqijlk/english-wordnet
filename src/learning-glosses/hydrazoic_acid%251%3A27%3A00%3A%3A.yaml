simpleMeaning: A liquid with no colour and a foul smell; left standing, it soon becomes gas, and it can
  both kill and blow up.
scope: Also called hydrogen azide and azoimide, this liquid is the clear, foul-smelling one that soon
  turns to gas.
examples:
- Hydrazoic acid turned to gas soon after the bottle was opened.
- Even a trace of hydrazoic acid smells foul and can kill.
