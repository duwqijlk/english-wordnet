simpleMeaning: Sharp saw-like edges and a spear-point shape mark the leaves of this American herb, whose
  flowers grow in narrow bunches of blue to violet.
scope: It is also called dragonhead, an American herb with sharp-edged spear-shaped leaves and narrow
  bunches of blue to violet flowers, and not one with smooth round leaves or red flowers.
examples:
- The dragon's head had spikes of blue flowers.
- We saw a dragon's head with saw-edged leaves.
