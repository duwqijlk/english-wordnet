schema: oewn-learning-gloss-v2
senseId: 'movement%1:19:00::'
synsetId: 11445202-n
simpleMeaning: The false impression of motion that comes from watching many still pictures of an object
  in motion flash by quickly.
scope: This is an illusion of motion created by film or a sequence of still images, not a real change
  of position in place, not a real shift from one place to another, not a natural event that shifts something,
  not an organized group pursuing a shared ideology, not a section of a symphony or sonata, not a campaign
  of actions for a cause (that is the other abstract sense), not a polite word for defecation, not a trend
  in opinion, not the working parts of a watch or clock, and not the act of moving an object.
examples:
- The spinning wheel in the old film was only an illusion of movement.
- The cinema creates movement from a series of still photographs.
