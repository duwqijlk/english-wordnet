simpleMeaning: to explain or excuse something in a way that hides the truth
scope: This is explaining or excusing something in a way that hides the truth, and color and colour are
  other names for it, not explaining it honestly and not making a surface shine.
examples:
- He tried to gloss over his mistake with a smooth excuse.
- She glossed the bad news so it would sound better than it was.
