simpleMeaning: A tall cone-shaped tree of the Rocky Mountains and British Columbia, with blue-green needles
  and a sharply pointed crown; its wood is used for rough boards and boxes.
scope: A tall mountain spruce, also called Engelmann spruce and Picea engelmannii; not a lowland spruce
  and not a pine.
examples:
- An Engelmann's spruce towers over the cabin in the Rockies.
- They cut an Engelmann's spruce for firewood.
