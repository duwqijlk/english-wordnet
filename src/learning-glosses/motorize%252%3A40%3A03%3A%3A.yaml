simpleMeaning: to put a motor in something, so the motor can move it or make it work
scope: To put a motor in a thing, not to give a person or group a vehicle with a motor, and not to give
  them armed vehicles.
examples:
- The factory motorized its carts so workers no longer had to push them.
- He bought a kit to motorize his bicycle.
