simpleMeaning: 'It counts as a wading bird, yet it lives on open flat land: a small bird of Australia,
  kin to the button quail.'
scope: A small Australian bird kin to the button quail, counted as a wading bird though it lives on open
  flat land; not the button quail itself and not a bird of the wetlands.
examples:
- The plain wanderer lives on the open grassland, not by the water.
- We saw a plain wanderer on the open plain.
