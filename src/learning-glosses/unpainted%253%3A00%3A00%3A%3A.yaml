simpleMeaning: having no coat of paint on it, or having an old coat that badly needs a new one
scope: This word describes a thing that has no paint on it or needs new paint; it does not describe a
  person, an action, or a color.
examples:
- The unpainted house looked plain and grey.
- They bought unpainted furniture and colored it themselves.
