simpleMeaning: about the way people take in and understand things through their senses
scope: This word is about how people sense and understand the world; it does not mean quick to notice
  and understand things, which is the other sense of the word.
examples:
- The course covers the perceptive systems we use to see and hear.
- Damage to this part of the brain can affect perceptive abilities, such as telling sounds apart.
