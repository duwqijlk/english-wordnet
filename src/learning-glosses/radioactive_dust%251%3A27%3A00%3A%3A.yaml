simpleMeaning: Tiny bits made by radiation that come down to the ground after an explosion from splitting
  atoms
scope: 'Also called fallout: tiny bits made by radiation that come down to the ground after an explosion
  from splitting atoms, not the bits still floating in the air.'
examples:
- After the explosion, radioactive dust settled on the roofs and streets.
- People were warned to stay inside while radioactive dust came down to the ground.
