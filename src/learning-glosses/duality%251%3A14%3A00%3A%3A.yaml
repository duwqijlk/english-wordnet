simpleMeaning: being in two parts, or a way of sorting things into two opposite groups or smaller kinds
scope: 'Also called dichotomy: being in two parts, or sorting things into two opposite groups. It is not
  the physics sense about waves and tiny pieces of matter, and not the geometry sense about points and
  flat surfaces.'
examples:
- The duality of good and evil runs through the story.
- He talked about the duality of mind and body as two opposite parts.
