simpleMeaning: a loud sound that rings out again and again
scope: 'Also called crash, clang and clank: a loud sound that rings out again and again, not a fight,
  not a strong disagreement, and not colours that look bad together.'
examples:
- We heard the clash of metal gates again and again.
- The clash of bells rang out over the town.
