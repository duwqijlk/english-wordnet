simpleMeaning: a group of criminals who are loosely joined together and run crime as a planned business
scope: Also called family and mob. This sense is a crime group, not a news agency that sells articles
  to papers and not the act of joining together into a group.
examples:
- The police broke up a crime syndicate that ran gambling in the city.
- He left the syndicate after years of helping its leaders plan crimes in the city.
