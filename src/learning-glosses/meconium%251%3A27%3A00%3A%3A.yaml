simpleMeaning: The first dark green, thick, slimy waste passed by a newborn baby
scope: The first waste passed by a newborn baby, not the baby's later waste and not a green plant sap.
examples:
- The meconium in the baby's first nappy was thick and dark green.
- The nurse checked the meconium passed by the newborn in her first hours.
