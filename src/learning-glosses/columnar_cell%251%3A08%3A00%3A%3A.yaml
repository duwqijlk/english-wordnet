simpleMeaning: a tiny building block of the thin layer that covers body parts, shaped like a tall narrow
  post, and some have tiny hairs
scope: A tall, post-shaped building block of the thin layer that covers body parts, also called a columnar
  epithelial cell, and not a round or flat cell.
examples:
- Under the microscope, the columnar cells stood in a neat row like posts.
- Some columnar cells in the gut have tiny hairs that help move mucus along.
