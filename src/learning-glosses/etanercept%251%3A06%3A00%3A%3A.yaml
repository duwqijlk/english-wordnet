simpleMeaning: A genetically engineered anti-TNF drug sold as Enbrel, made of receptors that bind TNF,
  injected twice a week to treat rheumatoid arthritis.
scope: This is the injected medicine itself, not the TNF receptor it is built from and not another anti-TNF
  medicine used for the same disease. It is a medical term, and Enbrel is its trade name rather than a
  separate drug.
examples:
- Her rheumatologist switched her to etanercept after methotrexate stopped working.
- Etanercept did not suit him, so his consultant tried a different anti-TNF drug.
