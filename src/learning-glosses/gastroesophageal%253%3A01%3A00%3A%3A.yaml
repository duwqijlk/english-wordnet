simpleMeaning: This word is used when something has to do with the stomach and the food tube that joins
  it to the mouth
scope: It says something has to do with both the stomach and the food tube, not with the stomach alone
  and not with the bowels.
examples:
- The doctor spoke about gastroesophageal pain after meals.
- A gastroesophageal test looks at the stomach and the food tube together.
