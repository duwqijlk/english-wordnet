simpleMeaning: the act of an army going into a place to take it by force, to rule it or to steal from
  it
scope: An army going into a place to take it by force, not the spread of germs or bad cells in the body.
examples:
- The invasion of the country began at dawn.
- The army planned an invasion of the coast.
