simpleMeaning: The fluid around the brain and spine sits in a gap in the meninges, the covers of the brain
  and spine, below one thin skin and above another.
scope: This is a gap in the covers of the brain and spine, not the fluid it holds.
examples:
- Fluid fills the subarachnoid space around the brain and spine.
- The subarachnoid space lies below one thin skin and above another.
