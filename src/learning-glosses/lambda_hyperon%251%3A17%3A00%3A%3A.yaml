simpleMeaning: A tiny bit of matter with no electric charge and a spin of 1, of the kind called isotopic
  spin.
scope: A tiny bit of matter with no electric charge and a spin of 1, of the kind called isotopic spin;
  lambda particle is another name for this sense, not a charged bit of matter and not a bit of light.
examples:
- The lambda hyperon has no electric charge.
- Physicists found a lambda hyperon in the cloud chamber.
