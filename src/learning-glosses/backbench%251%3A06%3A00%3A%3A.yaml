simpleMeaning: a seat in the House of Commons taken by a member of parliament who holds no post in the
  government
scope: A seat in the House of Commons for a member of parliament who holds no post in the government,
  not a seat on the front bench for ministers.
examples:
- The new member took a backbench seat for her first year in the House of Commons.
- Ministers sit on the front bench, not on a backbench.
