senseId: 'communize%2:30:01::'
synsetId: 00410206-v
simpleMeaning: to make a government or group follow the rule that all land and work are shared by all,
  with no private ownership
scope: This is to bring a government or group under shared-ownership rule; bolshevise, bolshevize and
  communise are other names for this sense, not to set up a free market and not to hand power to a king.
examples:
- The new rulers moved to communize the government within a year.
- After the war, the party set out to communize the farms and factories.
