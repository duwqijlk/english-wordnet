simpleMeaning: A state in which a person can hardly get words out, in speech or in writing
scope: 'Also called ataxic aphasia, expressive aphasia or motor aphasia: a state in which a person can
  hardly get words out, in speech or in writing, not a state in which speech flows but the words make
  little sense.'
examples:
- He has nonfluent aphasia, so he can only say a few words at a time.
- Nonfluent aphasia made it hard for her to write a letter.
