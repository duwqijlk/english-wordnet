simpleMeaning: a worker who belongs to a group of workers in the same trade
scope: A worker who belongs to a group of workers in the same trade; unionist and trade unionist are other
  names for this sense, not a worker outside any group and not the group itself.
examples:
- Every union member voted on the new deal.
- As a union member, she paid dues each month.
