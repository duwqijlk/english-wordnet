simpleMeaning: a part made from a semiconductor (a material that lets electric power pass in a controlled
  way) that can make electric signals stronger
scope: A small part that makes electric signals stronger, not a radio set itself and not a part that only
  joins wires.
examples:
- A transistor in the radio makes the weak signal stronger.
- Engineers use a transistor to make electric signals stronger.
