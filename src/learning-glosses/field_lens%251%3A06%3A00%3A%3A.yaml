simpleMeaning: when a tool for seeing has more than one glass, this is the glass that sits farthest from
  the eye
scope: The glass farthest from the eye in a tool for seeing with more than one glass, not the glass nearest
  the eye and not a glass in a tool with only one glass.
examples:
- Dust on the field lens made the view dim.
- The field lens sits at the far end of the tube.
