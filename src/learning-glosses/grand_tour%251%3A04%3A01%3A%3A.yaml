simpleMeaning: A long trip around Europe for learning about its culture, taken by rich young Englishmen,
  above all in the 18th century, as part of their schooling.
scope: A long trip around Europe for learning about its culture, taken by rich young Englishmen as part
  of their schooling, not a holiday trip and not a business trip.
examples:
- He made the grand tour of Europe in 1750.
- The grand tour was part of a young Englishman's schooling.
