senseId: 'obfuscation%1:04:00::'
synsetId: 01268645-n
simpleMeaning: The act of making things hard to grasp, so that people are left puzzled and lost.
scope: Also called mystification; the act of clouding people's understanding and leaving them puzzled,
  not the darkening of sight.
examples:
- His obfuscation left the committee more confused than before.
- The obfuscation in the report hid the real figures.
