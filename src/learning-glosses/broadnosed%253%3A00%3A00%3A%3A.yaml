simpleMeaning: of or like New World monkeys with nostrils far apart, or of people with wide nostrils
scope: 'Also called platyrhine, platyrhinian, platyrrhine, platyrrhinian and platyrrhinic: of or like
  New World monkeys with nostrils far apart, or of people with wide nostrils, not of Old World monkeys
  with nostrils close together.'
examples:
- The broadnosed monkey swung through the trees.
- He was a broadnosed man with a kind smile.
