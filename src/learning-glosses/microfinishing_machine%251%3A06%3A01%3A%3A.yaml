simpleMeaning: It leaves a piece of work smooth and true to shape, taking off only the thin glassy skin
  left by the last step, with a rough stone or tape
scope: 'Also called microhoning machine and superfinishing machine: a machine tool that smooths a piece
  of work by taking off a thin skin, not a machine that cuts a new shape.'
examples:
- The microfinishing machine took off the thin skin left by the last step.
- They ran the part through the microfinishing machine to smooth it.
