simpleMeaning: a common tree-climbing animal, bigger than most of its kind, from the east of North America,
  now also living in England
scope: Also called eastern gray squirrel and eastern grey squirrel, this is the common tree-climbing animal
  of eastern North America now also living in England, not the reddish-brown one of Europe and parts of
  Asia.
examples:
- A cat squirrel ran along the branch above the path.
- The cat squirrel was brought to England from eastern North America.
