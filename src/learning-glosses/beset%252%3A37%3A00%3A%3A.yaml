simpleMeaning: to annoy someone again and again over a long time
scope: 'Also called provoke, harass, plague, hassle, harry, molest, chivvy, and chivy: to annoy someone
  again and again. Not the sense of covering something richly with gems.'
examples:
- Worries beset him for months after he lost his job.
- She was beset by doubts all through the winter.
