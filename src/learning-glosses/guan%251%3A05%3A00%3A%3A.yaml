simpleMeaning: These big birds like turkeys look like curassows and are hunted for food; one of several
  kinds of the curassow family, they live in the jungles of warm America.
scope: This is a large game bird of the jungles of warm America, like a turkey and close to the curassows,
  not a turkey itself and not a curassow.
examples:
- The guan called from the trees at the edge of the jungle.
- Hunters prize the guan as food in the villages of the forest.
