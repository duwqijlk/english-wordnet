simpleMeaning: the bony arch made by the collarbones and the flat bones at the back in humans
scope: The bony arch made by the collarbones and the flat bones at the back in humans, also called a pectoral
  arch; not the arm bones and not the chest bones below.
examples:
- The shoulder girdle joins the arms to the body.
- The collarbones form part of the shoulder girdle.
