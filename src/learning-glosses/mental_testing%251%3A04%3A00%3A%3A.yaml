simpleMeaning: Set questions or tasks, the same for all who take them, show how a person senses, recalls,
  thinks, learns, and acts.
scope: It is also called a test, a mental test, and a psychometric test, and it gives set questions or
  tasks in the same form to all who take them to measure a person's mind.
examples:
- The mental testing was given to a large group of students.
- The mental testing showed a strong memory for faces.
