simpleMeaning: used to describe a whole number that cannot be divided evenly by any number except one
  and itself
scope: This describes a number of the kind with no divisors besides one and itself; it is not the noun
  for such a number, and not the sense meaning 'first in rank or importance'.
examples:
- Seven is a prime number.
- The class listed the prime numbers between ten and thirty.
