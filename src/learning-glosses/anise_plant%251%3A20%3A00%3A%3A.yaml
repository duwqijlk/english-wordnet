simpleMeaning: People grow this sweet-smelling herb of Egypt far and wide for its seeds and their oil,
  which they use as a cure and to give food its taste.
scope: 'Also called anise: a sweet-smelling herb from Egypt grown for its seeds and the oil from them,
  not the seed itself and not the oil alone.'
examples:
- An anise plant gives seeds and oil used to give food its taste.
- She grew an anise plant for its sweet-smelling seeds.
