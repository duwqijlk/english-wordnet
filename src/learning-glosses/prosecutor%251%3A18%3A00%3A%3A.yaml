simpleMeaning: a lawyer who works for the state and brings criminal cases to court against people
scope: A lawyer who brings charges for the state, not a lawyer who defends the accused and not a judge.
examples:
- The prosecutor asked the court for a long sentence.
- The prosecutor called three witnesses to prove the charge.
