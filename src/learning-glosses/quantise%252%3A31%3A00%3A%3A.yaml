simpleMeaning: to bring the theory of tiny bits of energy to bear on a thing, and to limit it to fixed
  steps, each a whole-number multiple of one shared step
scope: This verb means limiting a quantity to fixed steps, also called quantize; it is not the other sense
  of quantise, which means turning a changing signal into set values.
examples:
- Scientists quantise the energy of the atom to work out what it can do.
- To quantise a value is to limit it to fixed steps.
