simpleMeaning: a way to say that, whatever else is true, this much is still true
scope: 'Also called at least, leastways and leastwise: a way to hold on to the smallest true claim, not
  a guess and not a change of mind.'
examples:
- The trip was long, but at any rate we got home safe.
- At any rate, he tried his best.
