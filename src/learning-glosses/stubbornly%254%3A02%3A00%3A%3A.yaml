simpleMeaning: In a fixed way, holding to your own mind and refusing to give in.
scope: In a fixed, unchanging way, refusing to give in, not in a calm or open way.
examples:
- She stubbornly refused to move from the spot.
- He stubbornly kept to the same story all day.
