simpleMeaning: about art that uses very few simple parts and leaves out all that is not needed
scope: About an art way that uses very few simple parts; not a person who makes such art, and not about
  small changes in government or politics.
examples:
- The gallery showed minimalist paintings made of a few plain lines and one colour.
- She likes minimalist art with empty space and very simple shapes.
