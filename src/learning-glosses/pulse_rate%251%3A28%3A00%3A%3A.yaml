senseId: 'pulse_rate%1:28:00::'
synsetId: 15305913-n
simpleMeaning: How fast a person's heart beats, usually counted to get a quick idea of how well the person
  is
scope: How fast the heart beats; pulse and heart rate are other names for this sense, not a blood pressure
  reading and not the heart itself.
examples:
- The nurse checked his pulse rate after the run.
- A high pulse rate can show that the body is working hard.
