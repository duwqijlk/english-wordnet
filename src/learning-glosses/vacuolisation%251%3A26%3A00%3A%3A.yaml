senseId: 'vacuolisation%1:26:00::'
synsetId: 14101175-n
simpleMeaning: The state in which a cell has become full of tiny hollow spaces, called vacuoles.
scope: The state of a cell that has become full of tiny hollow spaces, with vacuolation and vacuolization
  as other names for this sense; not a single hollow space and not the filling of a cell with water.
examples:
- Vacuolisation was seen in the cells under the microscope.
- The cells showed vacuolisation after the treatment.
