simpleMeaning: A tool used by land measurers, with a short sighting tube fixed to a turning flat base
  and a small glass tube of liquid that shows what is flat.
scope: A tool for measuring land, with a short sighting tube fixed to a base that turns, so the measurer
  can check heights in all directions from one spot.
examples:
- The surveyor set up his dumpy level on the flat field.
- With the dumpy level, she checked that the ground was flat.
