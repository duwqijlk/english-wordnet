simpleMeaning: feeling sad and regretful about something you did or did not do, or about something you
  have lost.
scope: It is not the quick apology you say after bumping into someone, and not a word for a bad condition;
  it is real regret about the past.
examples:
- She was sorry that she had lied to him.
- He felt sorry about missing his daughter's concert.
