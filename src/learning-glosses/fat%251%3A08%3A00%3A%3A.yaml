simpleMeaning: a type of body tissue that stores oily material as energy and also protects and keeps heat
  around important organs.
scope: This is the body tissue that stores energy, not the greasy substance itself.
examples:
- Fat under the skin helps keep the body warm.
- The scan showed a layer of fat around his kidneys.
