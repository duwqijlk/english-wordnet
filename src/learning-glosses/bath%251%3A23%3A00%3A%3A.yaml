simpleMeaning: an old Hebrew measure for liquids, equal to about 10 gallons
scope: This is an old unit for measuring liquids; it is not washing yourself in a tub, and not a tub that
  holds liquid for putting things in.
examples:
- In the old text, the jar held two baths of oil.
- One bath was about ten gallons of water in those times.
