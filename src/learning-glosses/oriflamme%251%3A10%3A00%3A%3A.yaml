simpleMeaning: A thing or a goal that makes people feel strong and brings them together in a hard fight
scope: A thing or a goal that brings people together in a hard fight, not a battle cry and not a flag
  flown in battle.
examples:
- The flag became an oriflamme for the whole town in its struggle.
- Her words were an oriflamme that brought the workers together.
