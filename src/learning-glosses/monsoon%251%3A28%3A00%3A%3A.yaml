simpleMeaning: the rainy time of year in southern Asia, when wind blows from the southwest and brings
  heavy rain
scope: The rainy season in southern Asia, not the seasonal wind itself that brings the rain.
examples:
- The monsoon arrives in June and floods the streets for weeks.
- Farmers wait for the monsoon to bring rain to their dry fields.
