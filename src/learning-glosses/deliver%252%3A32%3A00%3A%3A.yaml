simpleMeaning: to give a speech or formal address, or to set out an idea
scope: This is giving a speech or setting out an idea, not bringing goods to a place, uttering a cry,
  or throwing a ball to a batter, and present is another name for the same sense.
examples:
- She will deliver the opening speech at the conference on Friday.
- He delivered a lecture on climate change to a packed hall.
