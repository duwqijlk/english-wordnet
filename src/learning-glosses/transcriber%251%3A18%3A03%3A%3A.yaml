simpleMeaning: a person who puts written words from one language into another
scope: Someone who turns written words from one language into another; translator is another name for
  this sense, not a person who writes down speech sounds and not a musician who reworks a piece.
examples:
- The transcriber turned the French letter into English.
- She works as a transcriber of old documents.
