simpleMeaning: A sour chemical in which each tiny part holds three hydrogen bits that can be swapped for
  other bits
scope: A sour chemical with three swappable hydrogen bits in each tiny part, not a chemical with one such
  bit and not a salt made from an acid.
examples:
- Phosphoric acid is a tribasic acid with three replaceable hydrogens.
- The tribasic acid gave up its hydrogens one by one.
