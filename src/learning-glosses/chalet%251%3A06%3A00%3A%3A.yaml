simpleMeaning: a Swiss house with a sloping roof and wide roof edges that stick out, or a house built
  in this style
scope: A house in the Swiss style, with a sloping roof and wide roof edges; not a tall town house and
  not a flat in a large building.
examples:
- They stayed in a wooden chalet in the mountains.
- The chalet had a wide roof that hung over the walls.
