simpleMeaning: puzzled by many things you face or hear that do not agree, and full of great confusion
  about what to think
scope: Unable to think clearly because many things do not agree, also called lost, confused, bewildered,
  baffled, bemused, befuddled, at sea, mazed, and mixed-up.
examples:
- The confounded student stared at the two different answers and could not think clearly.
- She felt confounded by the many rules that seemed to say opposite things.
