simpleMeaning: a person who does not believe in himself or herself, and who finds it hard to make a choice
  and keep to it
scope: 'Also called chicken or wimp: a person who is not sure of himself or herself and cannot settle
  on a choice. It is not the other sense of this word, a person who cries and complains too much.'
examples:
- He was called a crybaby because he was too unsure of himself to speak in front of the class.
- She acted like a crybaby, saying yes, then no, and never settling on a choice.
