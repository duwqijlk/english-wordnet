simpleMeaning: The act of speaking out in earnest against something, in protest.
scope: 'Also called objection, remonstrance, or remonstration: the act of protesting in earnest, not the
  single cry of protest itself.'
examples:
- His expostulation against the plan was long and earnest.
- The meeting heard her expostulation with respect.
