simpleMeaning: a hand tool with two sharp blades for cutting thin sheets of metal, in the plural form
scope: This is a hand tool for cutting thin sheets of metal, not a small cut, not a small piece cut off,
  and not the act of cutting.
examples:
- He cut the thin metal sheet with a pair of snips.
- The worker picked up the snips to trim the edge of the roof panel.
