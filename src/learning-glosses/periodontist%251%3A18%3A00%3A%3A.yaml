simpleMeaning: a dentist who treats diseases of the gums and the parts round the teeth
scope: A dentist who treats diseases of the gums and the parts round the teeth, not a dentist who fills
  teeth and not a surgeon.
examples:
- The periodontist treated her sore gums.
- He was sent to a periodontist for his gum disease.
