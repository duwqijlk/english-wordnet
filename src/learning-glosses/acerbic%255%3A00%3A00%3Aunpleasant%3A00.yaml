simpleMeaning: very harsh in tone, in the words a person uses or the way they speak or write
scope: 'Also called bitter, acid, acrid, blistering, sulfurous, caustic, virulent, sulphurous and vitriolic:
  very harsh in tone, not sour in taste and not a chemical that eats things away.'
examples:
- She wrote an acerbic review of the new play.
- His acerbic tone made even small complaints sound cruel.
