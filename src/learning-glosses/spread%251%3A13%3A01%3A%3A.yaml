simpleMeaning: a meal of good food, prepared with care, that people take real pleasure in eating
scope: This is a meal of good food, not a soft paste for bread, the act of opening something folded, or
  putting a layer on a surface.
examples:
- They laid out a huge spread for the wedding guests.
- The hotel is famous for the lavish spread it serves at brunch.
