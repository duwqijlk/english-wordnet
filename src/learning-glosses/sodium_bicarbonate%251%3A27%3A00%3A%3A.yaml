simpleMeaning: Taken to calm a sour stomach, this white powder (NaHCO3) that melts in water also makes
  drinks fizz and helps cakes rise.
scope: People also call it saleratus, baking soda, bicarbonate of soda, and sodium hydrogen carbonate,
  and it is a white powder used in baking and to calm a sour stomach.
examples:
- She put sodium bicarbonate in the cake mix.
- He took sodium bicarbonate for his sour stomach.
