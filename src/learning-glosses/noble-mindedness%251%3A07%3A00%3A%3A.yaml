simpleMeaning: high ideals in what a person thinks and does, and the belief that such ideals are worth
  following
scope: High ideals in thought and conduct; also called idealism and high-mindedness, not mere kindness
  and not love of power.
examples:
- His noble-mindedness led him to give his money to the poor.
- Her noble-mindedness showed in every choice she made.
