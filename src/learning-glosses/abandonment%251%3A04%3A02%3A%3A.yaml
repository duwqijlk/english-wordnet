simpleMeaning: giving up a thing one owns, or the right to it, of one's own free will, without trying
  to get it back or to pass it on
scope: Giving up what one owns of one's own free will, not leaving a child and not giving a thing away.
examples:
- The abandonment of the old house left it open to anyone.
- His abandonment of the claim ended the case.
