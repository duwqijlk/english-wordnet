simpleMeaning: One of three thin skins that wrap round the brain and spinal cord
scope: One of three thin skins that wrap round the brain and spinal cord, also called meninx; not a single
  skin and not the brain itself.
examples:
- The meninges protect the brain and spinal cord.
- An infection of the meninges can be very serious.
