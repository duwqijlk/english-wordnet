simpleMeaning: A small oak that loses its leaves in winter, with its trunk forking almost from the ground
  into wide-spreading branches, from Texas and south Oklahoma.
scope: Also called Spanish oak; a small oak with its trunk forking almost from the ground, from Texas
  and south Oklahoma, not a tall oak with one straight trunk and not an oak of the north-east.
examples:
- Quercus texana forks low, its branches spreading wide.
- We saw Quercus texana along the road in south Oklahoma.
