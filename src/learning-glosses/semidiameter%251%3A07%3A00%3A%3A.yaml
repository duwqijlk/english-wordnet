senseId: 'semidiameter%1:07:00::'
synsetId: 05109562-n
simpleMeaning: how big half of a body in the sky seems to be when it looks like a round shape seen from
  the earth
scope: This is how big half of a body in the sky seems from the earth; not its true size and not the width
  of the whole body.
examples:
- The semidiameter of the moon is about a quarter of a degree.
- Astronomers measured the semidiameter of the sun at noon.
