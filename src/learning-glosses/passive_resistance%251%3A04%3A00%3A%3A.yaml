simpleMeaning: A calm refusal to obey a government, by going without food or by not helping it work
scope: 'Also called nonviolence or nonviolent resistance: a calm refusal to obey a government, by going
  without food or by not helping it work, not a fight with weapons and not plain disobedience for its
  own sake.'
examples:
- Gandhi taught passive resistance as a way to fight unfair laws.
- The workers used passive resistance and refused to load the ships.
