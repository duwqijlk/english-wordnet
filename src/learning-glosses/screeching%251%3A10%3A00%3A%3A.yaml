simpleMeaning: a loud cry with a sharp, cutting sound that rises over other sounds
scope: 'Also called a scream, a screaming, a shriek, a screech, or a shrieking: a loud cry with a sharp,
  cutting sound that rises over other sounds, not a high noise like a person''s cry.'
examples:
- The screeching of the child cut through the quiet house.
- We heard screeching from the playground.
