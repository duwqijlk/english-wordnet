simpleMeaning: to greet someone or show respect by bending the head or upper body
scope: A respectful or greeting movement of the head or upper body, not a plain lowering of the head and
  not a bend forward from the waist.
examples:
- The visitor bowed to the queen before speaking.
- He bowed politely when she entered the room.
