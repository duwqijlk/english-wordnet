simpleMeaning: of grains, especially rice, with the husk (the dry outer covering) and outer layers taken
  off
scope: Also called polished. This is about grains such as rice with their outer covering taken off, not
  about a smooth, shiny surface.
examples:
- She bought a bag of milled rice for dinner.
- Milled grains cook faster than grains with the husk still on.
