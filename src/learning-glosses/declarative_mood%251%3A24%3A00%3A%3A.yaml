synsetId: 13823912-n
simpleMeaning: In grammar, a way of speaking or writing that puts an act or state as a plain fact, with
  no special mark.
scope: In grammar, a way of putting an act or state as a plain fact; indicative, declarative, common mood,
  fact mood and indicative mood are other names for it, not a question and not a command.
examples:
- The declarative mood states a fact.
- She used the declarative mood to tell us what happened.
