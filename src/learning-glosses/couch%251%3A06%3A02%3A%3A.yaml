simpleMeaning: a flat coat of paint or clear finish that artists put on first, before the main paint
scope: A flat coat of paint or clear finish that artists put on first, not a bed and not the paint on
  top.
examples:
- The artist put a couch of pale paint on the board first.
- A thin couch of varnish lay under the bright colours.
