simpleMeaning: A cord that serves the inner muscles of the tongue and the other tongue muscles.
scope: A cord that serves the muscles of the tongue, also called hypoglossal, hypoglossal nerve and twelfth
  cranial nerve; not the cord that serves the face and not the cord that moves the eye.
examples:
- The nervus hypoglosus controls the muscles that move the tongue.
- Damage to the nervus hypoglosus made it hard for him to speak clearly.
