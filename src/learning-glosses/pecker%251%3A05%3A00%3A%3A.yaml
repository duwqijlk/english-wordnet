simpleMeaning: a bird with strong claws and a stiff tail for climbing, and a hard, sharp bill for making
  holes in wood to get insects
scope: Also called woodpecker and peckerwood, this is the bird itself that climbs trees and digs into
  wood; it is not the other sense, a bird's hard mouth part.
examples:
- A pecker climbed the tree trunk, holding on with its strong claws.
- We watched the pecker dig into the dead wood with its hard bill to find insects.
