simpleMeaning: any plant, such as ivy or periwinkle, that grows low and spreads along the ground or up
  a wall
scope: 'This is the plant sense: a plant that spreads low over ground or up a wall, not the small bird
  that climbs tree trunks and not a person who moves low along the ground.'
examples:
- The creeper covered the old wall with green leaves.
- A creeper spread across the ground under the trees.
