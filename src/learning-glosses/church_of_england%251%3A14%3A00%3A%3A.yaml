simpleMeaning: The national faith group of that land, and of other lands that share its beliefs, with
  its seat in Canterbury and the king or queen as its worldly head.
scope: This is the national church of England, and of other lands that share its beliefs, also called
  the Anglican Church or the Anglican Communion; its seat is in Canterbury and the king or queen is its
  head in worldly matters, unlike the Church of Rome with the pope as head.
examples:
- The Church of England holds its seat in Canterbury.
- The Church of England is the national church of England.
