simpleMeaning: a thinker who puts different things together into a whole, or who uses ways of putting
  things together
scope: A person who joins ideas together; not the electronic music instrument played with keys that makes
  and changes sounds.
examples:
- As a synthesizer, he joined ideas from many fields into one clear view.
- The writer was a synthesizer who put facts from history and science together.
