simpleMeaning: The part of the Treasury Department that makes people pay the taxes on goods brought into
  the country
scope: Also called the Bureau of Customs, the Customs Service, or USCB; the Treasury Department agency
  for the taxes on goods brought into the country.
examples:
- The Customs Bureau checks goods at the border.
- The Customs Bureau makes importers pay the taxes on goods.
