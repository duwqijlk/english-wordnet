simpleMeaning: sore skin, or skin that feels uncomfortable, caused by something rubbing against it
scope: This is sore skin from rubbing, such as by tight shoes or wet clothes, not a burn from heat and
  not a cut in the skin.
examples:
- The long run gave him chafing on his thighs.
- She put cream on the chafing under her arm.
