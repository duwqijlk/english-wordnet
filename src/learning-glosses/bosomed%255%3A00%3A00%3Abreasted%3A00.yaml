simpleMeaning: Having a chest of the size or kind named, or something like a chest, and used usually in
  words joined together.
scope: Used in compounds like full-bosomed, for a chest of the size or kind named, or something likened
  to a chest.
examples:
- She was full-bosomed and wore her hair pinned up.
- The hills were green-bosomed after the spring rain.
