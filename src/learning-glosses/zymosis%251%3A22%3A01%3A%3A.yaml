simpleMeaning: sugar turning into alcohol without air, one way living stuff is made to fall apart into
  plainer stuff
scope: Ferment, fermentation, fermenting, and zymolysis are other names for this breaking-down of living
  stuff, which a thing brings about, above all the change of sugar into alcohol without air.
examples:
- Zymosis changed the sugar into alcohol while no air reached it.
- Sugar turned into alcohol by zymosis, with no air at all.
