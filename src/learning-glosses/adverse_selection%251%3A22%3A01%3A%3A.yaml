synsetId: 92448349-n
simpleMeaning: A state where one side knows more than the other about some part of a thing for sale.
scope: A state where one side knows more than the other about a thing for sale, also called anti-selection;
  not a deal where both sides know the same and not a plain case of cheating.
examples:
- The insurers saw the new policy as an adverse selection when illness followed at once.
- Adverse selection grows when sellers hide what buyers cannot see.
