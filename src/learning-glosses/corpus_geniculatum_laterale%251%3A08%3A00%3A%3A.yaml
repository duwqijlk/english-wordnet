simpleMeaning: on the path from the back of the eye to the back of the brain, a clump of nerve cells works
  as a way station that handles what comes in
scope: This nerve structure lies on the path from the eye to the back of the brain, not the eye itself
  and not the back of the brain itself; lateral geniculate and lateral geniculate body are other names
  for it.
examples:
- Signals pass through the corpus geniculatum laterale on their way to the back of the brain.
- The corpus geniculatum laterale works as a way station for what the eye sees.
