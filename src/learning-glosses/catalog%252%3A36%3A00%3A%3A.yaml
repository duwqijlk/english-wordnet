simpleMeaning: To make a book or list that sets out things one by one.
scope: Also called catalogue, this is putting a list together, not the book itself and not the sense that
  also sorts things into kinds.
examples:
- She spends her weekends cataloging her old letters.
- He catalogued the whole collection before the sale.
