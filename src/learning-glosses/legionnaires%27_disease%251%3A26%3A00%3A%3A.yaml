simpleMeaning: A sometimes deadly lung illness caused by germs found after an outbreak at a Legion meeting
  in Philadelphia in 1976; it brings fever, pain, headache, chills, and a dry cough.
scope: Not other lung illnesses, nor other fevers with a cough; this is the one first spotted after the
  1976 Legion meeting.
examples:
- Legionnaires' disease causes a dry cough.
- He caught Legionnaires' disease in 1976.
