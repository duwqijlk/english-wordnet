simpleMeaning: the part of the study of meaning that looks at meaning through logic, the rules that say
  what follows from what
scope: In language study, the part of meaning that uses logic, not the study of sounds and not the study
  of how words are put together.
examples:
- Formal semantics asks how the meaning of a sentence follows from the meanings of its words.
- She took a course in formal semantics to learn how logic shapes meaning.
