simpleMeaning: a bold act done without caring about what may be lost or what harm may come
scope: 'Also called risk or danger: a bold act done without caring about loss or harm, not a danger itself
  and not the verb that means to put something in danger.'
examples:
- He knew the climb was a peril, yet he set out all the same.
- She took the peril of crossing the river at night.
