simpleMeaning: a small pot that holds ink for writing, and you can dip a pen into it
scope: 'Also called inkstand: a small pot that holds ink for dipping a pen, not a pen itself and not a
  large bottle for keeping ink.'
examples:
- She dipped her pen into the inkwell and began to write.
- An old inkwell stood on the desk next to the paper.
