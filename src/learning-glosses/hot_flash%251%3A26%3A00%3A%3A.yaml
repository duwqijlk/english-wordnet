simpleMeaning: A short, sudden feeling of warmth in the body, linked with the time when a woman stops
  having periods and with some disorders of the mind.
scope: A sudden short feeling of warmth in the body, not a fever and not a blush; flush is another name
  for this sense.
examples:
- She felt a hot flash sweep over her during the meeting.
- A hot flash woke her in the night with a sudden rush of heat.
