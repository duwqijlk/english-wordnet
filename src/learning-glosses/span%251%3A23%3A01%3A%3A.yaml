simpleMeaning: a unit of length, about nine inches, the width of a hand with the fingers spread wide
scope: A measure of length based on a spread hand, usually nine inches, not the bridge-like structure
  that lets people cross an obstacle.
examples:
- The cloth measured two spans across.
- He held his hand out to show a span.
