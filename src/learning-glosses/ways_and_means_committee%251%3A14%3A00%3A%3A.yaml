simpleMeaning: A lasting group of the United States House of Representatives that advises the House on
  all bills to raise money.
scope: A lasting group of the United States House of Representatives, the money-bill group among the many
  groups of the House, that advises the House on all bills to raise money.
examples:
- The Ways and Means Committee advises the House on tax bills.
- The Ways and Means Committee is a permanent committee of the House.
