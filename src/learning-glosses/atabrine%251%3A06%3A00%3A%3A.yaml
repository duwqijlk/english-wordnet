simpleMeaning: A drug used to treat some worm infections, once also used against malaria
scope: A drug used for some worm infections and once used for malaria; mepacrine, quinacrine and quinacrine
  hydrochloride are other names for this sense, not a drug that treats every kind of worm infection.
examples:
- The doctor gave him Atabrine for the worm infection.
- Atabrine was once used to treat malaria.
