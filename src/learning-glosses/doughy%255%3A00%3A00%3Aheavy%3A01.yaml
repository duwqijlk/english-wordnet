simpleMeaning: Soft and heavy like dough, because too little leavening (what makes bread rise) was used,
  or it was not cooked right
scope: 'Also called soggy: this means soft and heavy from not rising or cooking right, not wet and soft
  from too much water.'
examples:
- The bread stayed doughy because it had not risen enough in the oven.
- She cut the cake and found the middle was still doughy and heavy.
