simpleMeaning: The instructions that say how a game or sport must be played.
scope: Game or sport instructions only; not a behavior principle, a normative example, a conduct guide,
  a language convention, an accepted general truth, a math method, a natural law, a religious order's
  regulations, a reign, legal authority, a measuring stick, or any verb use (holding power, deciding,
  prevailing, declaring, matching zodiac signs, drawing lines, keeping in check, excelling).
examples:
- Nobody explained the rule about drawing extra cards to me.
- The referee enforced the rules of the match without favor.
