simpleMeaning: A puppet built around a central stick fixed to its head, worked by an operator moving metal
  sticks joined to its hands and other limbs, and turning that stick.
scope: A puppet worked with sticks, not a hand puppet worn on the fingers and not a marionette hung from
  strings.
examples:
- The puppeteer turned the rod puppet's head towards the audience.
- Two metal rods controlled the rod puppet's hands, while a third supported its head.
