simpleMeaning: To make a person do a thing by crying out at them again and again
scope: To make a person act by crying out at them again and again, not merely to cry out a thing and not
  the loud noise itself.
examples:
- The crowd clamored the singer into one more song.
- Parents clamored the school into keeping the library open.
