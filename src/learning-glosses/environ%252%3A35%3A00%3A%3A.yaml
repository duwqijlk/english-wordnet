senseId: 'environ%2:35:00::'
synsetId: 01469999-v
simpleMeaning: To reach round a thing on every side at the same time, so the thing lies within.
scope: 'Also called border, ring, surround or skirt: to lie round a thing on all sides at once, not to
  touch it at one edge only.'
examples:
- The forest environs my property.
- Hills environ the little town on every side.
