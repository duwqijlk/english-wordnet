synsetId: 13282279-n
simpleMeaning: In accounting, money a firm gets before it has given the goods or done the work it was
  paid for, usually counted as a debt it still owes
scope: This is money a firm gets before it has given the goods or done the work, also called unearned
  revenue, and not money a person gets without work, such as rent or interest.
examples:
- The firm's unearned income grew when clients paid a year in advance.
- The unearned income on the books will count as sales only after the work is done.
