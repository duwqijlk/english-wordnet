simpleMeaning: A flap of strong cloth on a tent that can be pulled back to make a door
scope: A tent flap that can be pulled back to make a door, also called a fly, a fly sheet, a tent-fly
  or a tent flap; not the tent floor and not a ground sheet.
examples:
- She pulled back the rainfly to step out of the tent.
- The rainfly kept the wind out of the tent door.
