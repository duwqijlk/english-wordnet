simpleMeaning: A wild, confused scene, full of noise and rushing about, often funny, like a big public
  show.
scope: A wild, confused and often funny scene like a big public show; also called a carnival, not the
  showground, not the old stadium, and not the travelling show itself.
examples:
- The kitchen was a circus on market day.
- The whole occasion was a circus of noise and laughter.
