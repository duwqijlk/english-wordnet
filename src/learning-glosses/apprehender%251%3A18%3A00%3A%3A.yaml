senseId: 'apprehender%1:18:00::'
synsetId: 09820525-n
simpleMeaning: a person who takes hold of someone or takes them into the hands of the law, most often
  in the name of justice
scope: A person who seizes or arrests someone, most often for the law, not the person who is seized and
  not a guard who merely watches.
examples:
- The apprehender caught the thief as he ran from the shop.
- An apprehender working for the court took the man into custody.
