senseId: 'indirect_object%1:10:00::'
synsetId: 06321703-n
simpleMeaning: In grammar, the person or thing that gets something or gains from what the verb says is
  done
scope: In grammar, the one who gets or gains from the verb's action; not the one the verb acts on directly
  and not the verb itself.
examples:
- In 'She gave him a book', 'him' is the indirect object.
- The indirect object in 'He told Mary the news' is 'Mary'.
