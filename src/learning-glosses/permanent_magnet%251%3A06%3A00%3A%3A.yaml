simpleMeaning: Even after it is taken away from the pull of another such thing, this thing still pulls
  iron to it
scope: A thing that keeps its pull on iron after it is taken away from another pull, not a thing that
  only pulls while it is switched on and not a plain piece of iron.
examples:
- A permanent magnet on the fridge held the note in place.
- The permanent magnet kept its pull even after we took it off the board.
