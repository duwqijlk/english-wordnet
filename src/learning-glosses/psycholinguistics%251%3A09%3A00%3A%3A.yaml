simpleMeaning: The part of mind science that studies how the mind knows and uses language.
scope: The study of how the mind handles language, not the study of words alone and not the study of the
  brain alone.
examples:
- She studies psycholinguistics to find how the mind knows and uses language.
- His work in psycholinguistics looks at how the mind puts words together.
