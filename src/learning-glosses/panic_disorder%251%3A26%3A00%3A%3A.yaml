simpleMeaning: Without warning, sudden attacks of fear strike, most often strong but short, in this state
  of worry.
scope: This is a state of worry marked by sudden attacks of fear that come with no warning and pass quickly.
examples:
- Panic disorder struck without warning.
- The attacks of panic disorder are strong but short.
