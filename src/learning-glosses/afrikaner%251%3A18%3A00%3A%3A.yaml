simpleMeaning: A white person born in Cape Province, come down from Dutch settlers, who speaks the tongue
  that grew from Dutch
scope: A Cape Province person of Dutch settler stock who speaks Afrikaans, also called Afrikander and
  Boer; not a white person of another land.
examples:
- An Afrikaner from Cape Province spoke Afrikaans.
- The Afrikaner traced his family back to Dutch settlers.
