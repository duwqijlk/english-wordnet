simpleMeaning: an animal whose family line is known and is all of one kind, used especially of horses
scope: This is a name for an animal whose family line is known and is all of one kind; purebred and thoroughbred
  are other names for this sense. Not the describing word for such an animal, and not just any animal
  that looks strong or fast.
examples:
- The pureblood won many races for its owner.
- They paid a lot of money for a young pureblood horse.
