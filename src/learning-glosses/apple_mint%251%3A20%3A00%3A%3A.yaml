simpleMeaning: Stems that smell of round fruit mark this plant, which came from the south and west of
  Europe and now grows wild in the United States.
scope: Also called applemint, this plant came from the south and west of Europe and now grows wild in
  the United States.
examples:
- Along the garden wall, apple mint grew wild.
- The cook picked apple mint for the summer drinks.
