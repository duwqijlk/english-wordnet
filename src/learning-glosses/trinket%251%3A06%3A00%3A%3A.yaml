simpleMeaning: A cheap, bright piece of jewelry, or a bright bit put on clothes to catch the eye
scope: A cheap, bright piece of jewelry, or a bright bit put on clothes to catch the eye, also called
  novelty or bangle; not a fine or costly jewel.
examples:
- She wore a trinket round her neck.
- The market stall sold trinkets of coloured glass.
