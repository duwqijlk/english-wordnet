simpleMeaning: connected with the study of how to make machines and body parts that copy the way living
  bodies work
scope: About the study of copying living bodies in machines and the things made in it; not the other sense,
  where a body function is helped or replaced by an electronic part.
examples:
- He took a course in bionic engineering at the university.
- Bionic research has led to new kinds of robot hands.
