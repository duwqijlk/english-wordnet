simpleMeaning: a substance made with a kind of mineral, and one of the main things that make up animal
  bones
scope: A substance that helps make up animal bones, not the burning stuff got from heating rock and not
  the white stuff used to make that burning stuff.
examples:
- Bones get much of their strength from calcium phosphate.
- The feed had calcium phosphate added to it.
