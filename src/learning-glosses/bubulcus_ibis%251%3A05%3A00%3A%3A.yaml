simpleMeaning: A small white heron found in many warm lands, often seen near animals as they graze.
scope: Also called a cattle egret; a small white heron of warm lands, often seen near grazing animals,
  not a heron of cold lands.
examples:
- Bubulcus ibis stood among the cattle in the field.
- We saw Bubulcus ibis near the grazing cows.
