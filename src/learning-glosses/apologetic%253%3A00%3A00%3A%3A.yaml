simpleMeaning: showing that you are sorry for something you did or said
scope: This is the showing-sorry sense, used of words or a manner that says you are sorry, not of a person
  who only feels sorry inside.
examples:
- She sent an apologetic note after missing the meeting.
- His apologetic manner showed he knew he had been wrong.
