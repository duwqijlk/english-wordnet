simpleMeaning: A narrow band or strip of ribbon worn round the head.
scope: This is a narrow band or strip of ribbon worn round the head, also called fillet or tenia, and
  not a crown or a hat.
examples:
- She wore a taenia to hold back her hair.
- The dancer's taenia was a strip of gold ribbon.
