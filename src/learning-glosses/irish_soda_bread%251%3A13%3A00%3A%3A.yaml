simpleMeaning: A round loaf made with a white powder that makes dough rise and sour milk; often with caraway
  seeds and raisins.
scope: A round loaf raised with baking soda and buttermilk rather than yeast, often with caraway seeds
  and raisins; not a yeast bread or a sweet cake.
examples:
- We baked Irish soda bread for breakfast.
- She sliced the Irish soda bread and spread butter on it.
