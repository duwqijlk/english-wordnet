simpleMeaning: A plant with a bitter taste, a kind of cress, that grows in Europe and America
scope: 'Also called cuckoo flower, cuckooflower and meadow cress: a bitter-tasting cress plant of Europe
  and America, not a sweet garden flower and not a food crop.'
examples:
