simpleMeaning: the time of work that runs in the light hours, such as 8 a.m. to 4 p.m.
scope: The work hours in the daytime, such as 8 a.m. to 4 p.m., not the night hours and not a single task
  done in a day.
examples:
- He works the day shift from eight in the morning until four in the afternoon.
- The day shift starts when the factory opens in the morning.
