scope: This is an east Asian plant with red and white flowers that spreads by creeping stems; mother-of-thousands,
  strawberry geranium, strawberry saxifrage and Saxifraga sarmentosam are other names for it, and its
  nearest look-alikes are the other east Asian plants with bunches of small flowers.
examples:
- The Saxifraga stolonifera in the shade had put out long creeping stems.
- We planted Saxifraga stolonifera along the wall for its red and white flowers.
