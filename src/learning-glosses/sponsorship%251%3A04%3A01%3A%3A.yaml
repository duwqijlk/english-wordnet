simpleMeaning: the act of giving money to a person, group, or event, or of supporting it in an official
  way
scope: The act of supporting a person, group, or event with money or in an official way, not the money
  itself.
examples:
- Thanks to sponsorship from a local bank, the team could buy new shirts.
- The school is looking for sponsorship for its music day.
