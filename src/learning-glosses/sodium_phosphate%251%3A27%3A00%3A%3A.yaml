simpleMeaning: a salt that makes the bowels clear out, taken as a drug
scope: A salt taken as a drug to clear out the bowels, also called sodium orthophosphate; not a food salt
  and not a drug that stops pain.
examples:
- The doctor told her to take sodium phosphate to clear out her bowels.
- Sodium phosphate is a drug that clears out the bowels.
