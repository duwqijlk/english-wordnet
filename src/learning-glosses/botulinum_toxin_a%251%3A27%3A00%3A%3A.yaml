simpleMeaning: A nerve poison in tiny amounts that treats crossed eyes and face spasms and other nerve
  disorders with muscle pulls; cosmetic surgeons also use it to smooth frown lines briefly.
scope: Not other nerve poisons, nor other wrinkle treatments; also called Botox.
examples:
- Botulinum toxin A smooths frown lines.
- Doctors use botulinum toxin A in tiny amounts.
