simpleMeaning: In old groupings, a large group of mammals, made up of mammals with nails or claws; set
  apart from hoofed mammals and whales, dolphins and porpoises.
scope: A former large grouping in mammal classification, covering mammals with nails or claws as a whole,
  set apart from hoofed mammals and whales, dolphins and porpoises.
examples:
- Unguiculata once grouped all clawed mammals together.
- In old books Unguiculata stood apart from hoofed mammals.
