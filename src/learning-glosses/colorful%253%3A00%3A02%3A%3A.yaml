simpleMeaning: having a shade of some kind, or one named shade; sometimes used joined with another word
scope: Also called colored. This means having a shade, or one named shade, sometimes joined with another
  word. Not having many different shades.
examples:
- She chose colorful crepe paper in pale pink for the party.
- He wore a colorful shirt in one plain shade of red.
