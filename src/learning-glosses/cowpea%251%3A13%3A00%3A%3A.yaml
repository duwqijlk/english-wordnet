simpleMeaning: the bean of a plant, eaten fresh from the pod or after it has been dried
scope: Also called black-eyed pea, this is the bean eaten fresh from the pod or dried, not the plant it
  grows on.
examples:
- We cooked the cowpeas fresh from the pod for supper.
- She keeps dried cowpeas in a jar for winter soups.
