simpleMeaning: A low dull sound, loud and rolling, that keeps going without a break
scope: This is a loud low dull sound that goes on without a break, also called rumble, grumble, or rumbling,
  not a complaint said in a low voice.
examples:
- They heard the grumbling of thunder in the hills.
- A grumbling sound rolled through the house all night.
