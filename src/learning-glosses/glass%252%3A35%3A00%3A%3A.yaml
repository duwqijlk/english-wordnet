simpleMeaning: to close in or surround an open space with panes of a hard see-through material.
scope: This means closing in a whole open space such as a porch, not fitting panes into the frames of
  existing windows.
examples:
- They glassed in the porch so they could use it in winter.
- The balcony was glassed in last spring.
