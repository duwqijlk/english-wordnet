schema: oewn-learning-gloss-v2
senseId: 'gasp%2:29:00::'
synsetId: 00005526-v
simpleMeaning: to breathe loudly and heavily, as when tired out
scope: This is the noisy breathing of exhaustion, for which pant, puff and heave are other names, not
  a sudden sharp intake of breath (the noun) and not quiet breathing.
examples:
- He gasped for air as he hauled the sack up the stairs.
- After the sprint, she stood gasping with her hands on her knees.
