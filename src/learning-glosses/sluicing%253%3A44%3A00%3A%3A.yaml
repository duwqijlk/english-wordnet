simpleMeaning: pouring out in a strong stream, like water pouring through a man-made channel built to
  control and guide its flow
scope: Pouring out in a strong stream, as if through a man-made water channel; not flowing gently and
  not falling as light rain.
examples:
- The sluicing rain beat hard against the windows.
- Sluicing water poured through the open gate.
