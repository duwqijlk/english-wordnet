simpleMeaning: clay dishes and pots baked in very hot heat until they turn glassy and hold no water
scope: Hard clay dishes and pots baked until glassy and waterproof, not a plant with thick leaves and
  not a bone hard as a rock.
examples:
- She served soup in a heavy stoneware bowl.
- The stoneware mugs did not soak up any tea.
