senseId: 'erythrocyte_sedimentation_rate%1:28:00::'
synsetId: 15302448-n
simpleMeaning: How fast red blood cells sink to the bottom in a tube of blood kept under set conditions;
  a fast fall most often means swelling somewhere in the body
scope: How fast red blood cells sink in a tube of blood; not the number of red cells, and not the speed
  of blood flow.
examples:
- The erythrocyte sedimentation rate was high, pointing to swelling in the body.
- Doctors use the erythrocyte sedimentation rate to spot hidden swelling.
