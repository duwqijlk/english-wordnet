simpleMeaning: as things should work if the facts we take as true are right, though it may not happen
  in real life
scope: Based on the facts taken as true, as on paper; not in the manner of a person studying ideas, and
  not proven in real life.
examples:
- Theoretically, the trip takes three hours, but traffic can make it longer.
- The machine is theoretically able to lift two tons.
