senseId: 'pyramid%2:40:00::'
synsetId: 02295717-v
simpleMeaning: to buy more shares while prices keep going up, using profits not yet taken in cash as margin
  (value you put up so you may buy more)
scope: The act of buying more shares while prices rise, using profits not yet taken in cash to be allowed
  to buy more. Not the solid shape with a flat base, and not building a pile that gets narrower at the
  top.
examples:
- He pyramided his shares as the price kept rising week after week.
- Traders pyramided their holdings during the long rise in prices.
