simpleMeaning: a turtle that lives in marshes along the Atlantic and Gulf coasts of the United States
scope: This is a turtle of the marshes on those coasts, not a turtle of fresh water inland and not a sea
  turtle of the open sea.
examples:
- A diamondback terrapin sunned itself on the marsh bank.
- We saw a diamondback terrapin swimming in the salt marsh.
