simpleMeaning: A person in the United States who was born in the land it is named for or whose family
  came from there.
scope: A person in the United States who was born in the land it is named for or whose family came from
  there; the adjective sense says of or to do with such people.
examples:
- She is a German American born in Berlin.
- German Americans keep ties with Germany.
