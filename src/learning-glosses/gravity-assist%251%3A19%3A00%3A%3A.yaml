simpleMeaning: In spaceflight, a path that goes close by a large body in space so a craft can gain speed
  from that body's pull
scope: In spaceflight, a path that goes close by a large body in space to gain speed, not a straight path
  to it and not a landing on it.
examples:
- The probe used a gravity-assist to reach Jupiter faster.
- A gravity-assist lets a craft gain speed without extra fuel.
