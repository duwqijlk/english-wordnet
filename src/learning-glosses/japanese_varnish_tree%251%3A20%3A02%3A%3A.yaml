scope: This is a small woody plant of Asia that gives a poisonous sap from which a hard shiny coating
  is made; lacquer tree, varnish tree, Chinese lacquer tree, Japanese lacquer tree, Japanese sumac, Rhus
  verniciflua and Toxicodendron vernicifluum are other names for this sense, and it is not the southern
  United States tree of the same name.
examples:
- Workers take the sap of the Japanese varnish tree to make a hard shiny coating.
- The Japanese varnish tree is a small tree of Asia with poisonous sap.
