simpleMeaning: the act of sending something, such as a ball, up high in a curving path
scope: This names the act itself, a high throw or hit, not a low flat throw and not the person who throws
  it.
examples:
- His lob went over the other player and landed inside the line.
- She hit a high lob to the back of the court.
