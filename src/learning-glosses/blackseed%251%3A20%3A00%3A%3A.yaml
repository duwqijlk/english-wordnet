simpleMeaning: This grass comes from the West Indies but is now common in the southern United States,
  with bunched wiry stems often overrun by a dark fungus.
scope: Also called carpet grass and smut grass, this West Indies grass is now common in the southern United
  States, its bunched wiry stems often overrun by a dark fungus.
examples:
- Blackseed grows in the southern United States.
- The blackseed had wiry stems overrun with dark fungus.
