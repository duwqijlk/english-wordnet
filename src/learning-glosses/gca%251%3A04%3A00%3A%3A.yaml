simpleMeaning: a landing in bad weather in which a person on the ground talks the pilot down, using a
  radar that shows the plane's path in fine detail
scope: 'Also called ground-controlled approach: a landing in bad weather in which a person on the ground
  talks the pilot down with radar, not a landing in clear weather and not a landing guided only by the
  pilot''s own sight.'
examples:
- The pilot asked for GCA as the fog closed in.
- With GCA, the controller talked the pilot down through the storm.
