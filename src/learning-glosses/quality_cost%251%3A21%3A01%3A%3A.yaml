simpleMeaning: a way of working out the full amount spent on work to keep standards high and on faults
  that lower them
scope: A way of adding up spending on standards and faults, not a price for one thing and not a wage paid
  to a worker.
examples:
- The firm worked out the quality cost of its faulty goods.
- Quality cost rose when more goods had to be remade.
