simpleMeaning: A kitchen machine with blades you can swap, made to cut, grate, mix, or slice what you
  cook with
scope: This kitchen machine has blades you can swap, and it stands beside a blender, which turns things
  to liquid, and a hand grater, which does one job only.
examples:
- She put the carrots in the food processor to shred them.
- The food processor chopped the onions.
