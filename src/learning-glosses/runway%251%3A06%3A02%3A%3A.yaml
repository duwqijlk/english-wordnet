simpleMeaning: the steel path that train cars and other vehicles roll on, made of one bar or two bars
  side by side
scope: 'Also called track, rail, and rails: the steel bars trains roll on, not the platform that sticks
  out from a stage, and not the strip where planes take off and land.'
examples:
- The train rolled along the runway toward the station.
- Workers laid a new runway for the mine cars.
