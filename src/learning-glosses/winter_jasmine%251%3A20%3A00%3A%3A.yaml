simpleMeaning: Yellow blooms that open in the cold months are why this loose-spreading shrub, which drops
  its leaves each year, is grown far and wide.
scope: It is one of the jasmines grown far and wide for yellow blooms that open in the cold months.
examples:
- Yellow blooms opened on the winter jasmine in the cold months.
- The winter jasmine bore yellow blooms in the cold months.
