simpleMeaning: The act of making the meaning of a word, sign, or saying clear and taking away what is
  unclear about it.
scope: The act of making the meaning of a word or saying clear; not the act of merely repeating it and
  not a guess at its meaning.
examples:
- Her explication of the poem made its meaning clear.
- The explication took the obscurity out of the old text.
