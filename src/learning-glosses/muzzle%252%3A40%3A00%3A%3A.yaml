simpleMeaning: To put a cover over an animal's nose and jaws
scope: To put a cover over an animal's nose and jaws, not to tie a gag round a person's mouth and not
  the cover itself.
examples:
- They muzzled the dog before the vet looked at it.
- The keeper muzzled the nervous dog for the walk.
