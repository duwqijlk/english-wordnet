simpleMeaning: A sickness of the heart and blood tubes in which one blood tube swells out like a small
  bag because its wall has grown weak.
scope: 'Also called aneurysm: a weak spot in a blood tube that swells out like a small bag because its
  wall has grown weak.'
examples:
- The aneurism was a weak spot in the wall of the artery.
- The aneurism made the blood tube swell out like a small bag.
