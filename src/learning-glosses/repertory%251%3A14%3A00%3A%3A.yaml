simpleMeaning: all the skills, natural abilities and tools used in one kind of work or job
scope: Also called repertoire. This is all the skills and tools for a kind of work, not a set of plays
  to perform and not a theatre group.
examples:
- He has a large repertory of repair skills and tools for his trade.
- The doctor's repertory includes many ways to treat pain.
