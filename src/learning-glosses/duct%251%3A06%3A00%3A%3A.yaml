simpleMeaning: a closed tube or passage that a liquid or gas moves through
scope: A closed tube for a liquid or gas to move through; not a tube in the body that carries body fluids,
  and not a tube in a plant made of long cells in a row.
examples:
- Hot air flows through a duct to each room.
- The duct under the floor carries water away.
