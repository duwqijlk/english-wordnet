simpleMeaning: A small birch grows in America with white bark that comes off in sheets, and people often
  turn it into such things as baskets or toy canoes.
scope: 'Also called paper birch and canoe birch: a small American birch whose white bark comes off in
  sheets for baskets or toy canoes.'
examples:
- Paperbark birch bark peels away in thin white sheets.
- They made a toy canoe from paperbark birch.
