simpleMeaning: Cut trees are hauled from the stump to a loading place or along a haul road by a winch
  run by an engine
scope: Also called yarder, it is a winch run by an engine that hauls cut trees from the stump to a loading
  place or along a haul road.
examples:
- The yard donkey hauled the logs to the landing.
- A yard donkey pulled the timber to the skid road.
