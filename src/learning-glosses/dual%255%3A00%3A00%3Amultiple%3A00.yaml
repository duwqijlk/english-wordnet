simpleMeaning: made of two parts, or two of the same thing that usually come as a pair
scope: Made of two parts or two of the same thing that usually come as a pair, also called double, and
  not the grammar form for two or two different sides of one thing.
examples:
- The car has dual controls for driver and passenger.
- They fitted dual exhausts to the car.
