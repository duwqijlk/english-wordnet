simpleMeaning: Soft jelly-like growths in people that do no harm come from a germ of the pox kind, close
  kin to the smallpox germ.
scope: A germ of the pox kind, close kin to the smallpox germ, that causes soft jelly-like growths in
  people that do no harm, not the smallpox germ itself.
examples:
- The myxoma virus causes soft jelly-like growths in people.
- Myxoma virus is closely related to the smallpox virus.
