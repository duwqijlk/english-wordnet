simpleMeaning: Feeling or showing sorrow, regret, or a sense of loss over something you did or failed
  to do.
scope: This is not a judgment that someone has an evil character or that food is unfit to eat; it describes
  sorrow about an action or a failure to act.
examples:
- I feel bad about breaking your cup.
- She felt bad for not visiting him sooner.
