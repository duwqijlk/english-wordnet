simpleMeaning: not fighting back or trying to stop something, but quietly taking what happens
scope: Not fighting back against something; this is not the same as agreeing with it or helping it to
  happen.
examples:
- The prisoner stood unresisting as the guards led him away.
- He lay unresisting while the dentist checked his teeth.
