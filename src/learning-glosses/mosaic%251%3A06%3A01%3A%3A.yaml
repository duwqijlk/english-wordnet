simpleMeaning: a set of photos taken from the air, put together to make one big picture
scope: Photos taken from the air joined into one big picture, not a picture made of small coloured pieces
  and not a plant disease.
examples:
- The mosaic of aerial photos showed the whole river valley in one view.
- Surveyors made a mosaic from the plane's photographs of the coast.
