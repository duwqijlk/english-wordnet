simpleMeaning: White flowers, rather large, and silver-grey leaves covered with fine hairs mark this kind
  of chickweed
scope: This is the chickweed kind with hairy silver-grey leaves and rather large white flowers, not the
  European garden plant of the same name and not a passion flower.
examples:
- The love-in-a-mist bloomed with big white flowers in June.
- Hairy silver-grey leaves marked the love-in-a-mist in the border.
