simpleMeaning: Long-lived tropical American climbing plant grown for sprays of yellow and purple blossoms
  whose lower petal curls up like a shell; sometimes botanists put it in the bean genus.
scope: The ornamental tropical vine itself, not the edible bean crop nor the shell its flowers resemble;
  snail flower and snailflower are other spellings of the same plant.
examples:
- The snail bean produces hanging sprays of yellow and purple flowers.
- Gardeners grow the snail bean on a trellis to show off its coiled petals.
