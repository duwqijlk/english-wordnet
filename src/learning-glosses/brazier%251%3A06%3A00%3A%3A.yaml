simpleMeaning: a large metal bowl in which coal or charcoal is burned to warm people who have to stay
  outside for a long time
scope: A large metal bowl of burning coal that warms people outside, not a coal box and not a fireplace
  indoors.
examples:
- The workers warmed their hands over the brazier.
- A brazier burned by the gate all night.
