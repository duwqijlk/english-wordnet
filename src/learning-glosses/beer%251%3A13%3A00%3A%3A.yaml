simpleMeaning: It is a general name for alcoholic drinks made from fermented grain, or a mix of grains,
  and flavored with hops.
scope: This is the broad name for such drinks, not one particular style such as lager or stout.
examples:
- He ordered a cold beer with his meal.
- The brewery makes several kinds of beer.
