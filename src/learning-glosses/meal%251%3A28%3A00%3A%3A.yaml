simpleMeaning: One of the regular times when people eat by habit or custom, such as breakfast or dinner.
scope: A regular occasion for eating, not the food served at it or grain ground into flour.
examples:
- Breakfast is the first meal of the day.
- The family gathers for a meal at seven each evening.
