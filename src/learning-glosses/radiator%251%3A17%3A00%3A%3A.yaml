simpleMeaning: any thing that sends out heat, light, or other power into the air around it
scope: Anything that sends out heat or light, not just the car part or the room heater.
examples:
- The sun is the earth's main radiator of heat and light.
- The hot coil acted as a radiator, sending out warmth in all directions.
