simpleMeaning: to use a machine to stamp mail with a mark that shows how much it costs to send
scope: This is the act of stamping mail with a machine to show the sending cost, not the unit of length,
  not a measuring tool, and not the beat in poetry.
examples:
- The office metered all the mail before noon.
- She metered the letters and put them in the bag for posting.
