simpleMeaning: Organic solvents, liquids that dissolve other things, turn this quiet form of a substance
  found in plasma, the clear fluid of blood, into its working form.
scope: The quiet form of a substance in plasma, which organic solvents turn into its working form, is
  what this word names.
examples:
- Plasminogen turned into its working form.
- An organic solvent turned the plasminogen into its working form.
