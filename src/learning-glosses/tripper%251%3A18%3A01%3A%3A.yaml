senseId: 'tripper%1:18:01::'
synsetId: 10686480-n
simpleMeaning: A person walking or running who catches their foot and nearly falls over.
scope: A person on foot who catches their foot and nearly falls, not someone going through visions after
  taking a drug that makes them see things that are not there, not a catch that works as a switch, and
  not a tourist out looking at the sights.
examples:
- The tripper grabbed the rail and stayed on their feet.
- One careless tripper nearly went down on the wet steps.
