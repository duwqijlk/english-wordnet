simpleMeaning: a chemical got from mould or germs that kills tiny living things and heals infections caused
  by germs
scope: 'Also called antibiotic: a germ-killing chemical from mould or germs, not a painkiller and not
  a vaccine.'
examples:
- The doctor gave her an antibiotic drug for the infection.
- This antibiotic drug kills the germs but not the virus.
