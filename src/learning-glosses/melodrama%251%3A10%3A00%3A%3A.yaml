simpleMeaning: a comedy that is wild and too much, where what happens matters more than the people in
  it
scope: A wild and too-much comedy where what happens comes first; not a serious story where the people
  matter most, and not wild behaviour in real life.
examples:
- The old melodrama had chases, escapes, and a last-minute rescue.
- Audiences loved the melodrama for its big fights and surprise turns, not for its people.
