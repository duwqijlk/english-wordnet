simpleMeaning: Of the genus Arabis, this upright plant grows far and wide through Europe.
scope: This upright plant of the genus Arabis is also called tower cress, and it grows far and wide through
  Europe, not the stiff-stemmed plant sometimes put in the group Turritis.
examples:
- This tower mustard is found all over Europe.
- The tower mustard stood upright where it grew.
