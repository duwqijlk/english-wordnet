simpleMeaning: The bronze-age way of life in the river valley it is named for, that did well from about
  2600 to 1750 BC.
scope: The bronze-age way of life in the river valley it is named for, not a way of life of a later age
  and not a way of life of another river valley.
examples:
- People of the Indus civilization lived in the river valley long ago.
- The Indus civilization did well from about 2600 to 1750 BC.
