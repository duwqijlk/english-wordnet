simpleMeaning: at, near or toward the back end of a ship or the back end of an airplane
scope: 'Also called aft: at, near or toward the back end of a ship or airplane, not moving backward with
  the back end first.'
examples:
- The captain looked astern to check the smaller boat behind us.
- Please put the bags astern, near the back of the ship.
