simpleMeaning: A 3rd-century faith founded by Manes, joining Zoroastrian light-against-dark belief, Babylonian
  tales, Buddhist morals and surface Christian parts; it spread across the Roman Empire but mostly died
  out by 1000.
scope: A faith of light against dark, also called Manichaeism; not Zoroastrianism and not Buddhism.
examples:
- Manichaeanism taught that light and dark were locked in struggle.
- Manichaeanism spread across the Roman Empire before fading.
