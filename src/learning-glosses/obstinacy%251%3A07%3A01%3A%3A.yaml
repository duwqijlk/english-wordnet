simpleMeaning: holding firmly to your own ideas or wishes and not changing them
scope: 'Also called stubbornness, and also called pigheadedness: a firm hold on your own ideas or wishes,
  not firm action to finish hard work and not a short bad mood.'
examples:
- His obstinacy kept him arguing long after everyone else had agreed to a plan.
- She showed obstinacy and would not change her plan even when it was not working.
