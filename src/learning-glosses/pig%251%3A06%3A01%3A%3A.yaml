simpleMeaning: a form made from a bed of sand, into which hot liquid iron is poured and left to turn hard
scope: A sand form used to shape hot liquid iron, not the farm animal, not a solid block of metal, and
  not a greedy person.
examples:
- The workers poured the hot iron into the pig, a bed of sand made to hold it as it turned hard.
- Each pig was a bed of sand ready for the hot iron to be poured in.
