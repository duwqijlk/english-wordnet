simpleMeaning: The heat of this animal's body does not follow the heat of the air around it; it stays
  much the same
scope: An animal whose body heat stays much the same whatever the air around it is like, also called a
  homoiotherm and a homotherm; not a cold-blooded animal whose body heat goes up and down with its surroundings.
examples:
- A homeotherm keeps its body warm even on a cold night.
- Humans are homeotherms, so their body temperature stays steady.
