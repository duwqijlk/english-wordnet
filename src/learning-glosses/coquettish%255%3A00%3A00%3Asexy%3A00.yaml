simpleMeaning: acting in a playful way to make someone feel sexual interest in you, without meaning it
  in a serious way
scope: This sense describes a person who acts in a playful way to draw sexual interest without being serious;
  it is not just about how a person looks, and it is not serious love.
examples:
- She gave him a coquettish smile from across the room.
- He liked her coquettish way of laughing and then looking away.
