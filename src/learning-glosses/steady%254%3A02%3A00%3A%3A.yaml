simpleMeaning: in a way that does not shake or change, staying firm and even all the time
scope: This is the word for doing something in a way that does not shake or change, not the verb that
  means to make something firm, and not the word for a person who will not change his mind.
examples:
- He walked steadily even on the ice.
- She held the camera steadily and took a clear photo.
