simpleMeaning: A stream of slow, twisting movements of the hands, feet and other parts of the body that
  the person cannot control
scope: This is slow twisting movement a person cannot control, not a quick shaking of the hands and not
  a single sudden jerk.
examples:
- Athetosis causes his hands to twist slowly even when he tries to hold them still.
- The child's athetosis made her feet move in slow, twisting motions all day.
