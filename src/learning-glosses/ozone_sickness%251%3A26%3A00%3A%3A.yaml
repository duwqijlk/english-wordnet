simpleMeaning: Drowsiness, headache, chest pain and itching can come on after exposure to ozone in high-altitude
  aircraft.
scope: Illness from ozone in high-altitude aircraft cabins, not altitude sickness or airsickness.
examples:
- Crew on the polar route complained of ozone sickness after long hours at altitude.
- Ozone sickness can bring chest pain as well as drowsiness.
