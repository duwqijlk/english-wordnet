simpleMeaning: Trees give a milky sap that, once heated and worked, turns into a stretchy stuff for all
  kinds of things; Hevea and Ficus trees give it most of all.
scope: People also call this stretchy stuff rubber, caoutchouc, and natural rubber, and they shape it
  from tree sap into many kinds of things.
examples:
- Gum elastic comes from the sap of rubber trees.
- They heat gum elastic and shape it into things.
