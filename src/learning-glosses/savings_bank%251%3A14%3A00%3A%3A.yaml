simpleMeaning: A place in the north-east of America where people put money by; after rules were eased
  in the 1980s, it gives help like that of many money firms.
scope: A place in the north-east where people put money by; not a big trading bank and not a credit union
  run by its members.
examples:
- She opened an account at the savings bank.
- The savings bank now offers the same help as a big bank.
