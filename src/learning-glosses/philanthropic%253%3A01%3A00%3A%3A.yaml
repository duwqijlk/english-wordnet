simpleMeaning: about giving money, time and help to people in need, or marked by giving in this way
scope: This describes giving money, time or help to people in need, not just being kind to friends and
  not giving to make money or to sell things.
examples:
- She set up a philanthropic group that pays school costs for poor children.
- The hospital got a large philanthropic gift from a rich family.
