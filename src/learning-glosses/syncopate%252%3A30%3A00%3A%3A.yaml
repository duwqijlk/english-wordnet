simpleMeaning: To change a rhythm by putting the stress on a weak beat.
scope: In music, for shifting the stress in a rhythm onto a weak beat.
examples:
- The drummer syncopated the beat, and the dancers had to follow the new stress.
- Jazz players often syncopate a tune to give it swing.
