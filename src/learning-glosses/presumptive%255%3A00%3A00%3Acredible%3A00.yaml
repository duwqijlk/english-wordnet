simpleMeaning: giving good reason to think that something is true or to say yes to it
scope: Giving good reason to think something is true or to accept it, not proof that it is true and not
  a guess with no reason behind it.
examples:
- The scientist had presumptive evidence that the drug worked.
- There was a strong presumptive case for changing the plan.
