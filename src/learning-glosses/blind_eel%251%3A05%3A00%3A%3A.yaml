simpleMeaning: From still, muddy waters in the southern United States comes this salamander, with a long,
  thin body and two pairs of very small feet
scope: This salamander is also called amphiuma, congo eel, and congo snake, and it lives in still, muddy
  waters in the southern United States.
examples:
- A blind eel was found in still, muddy waters in the southern United States.
- We counted two pairs of very small feet on the blind eel.
