simpleMeaning: a person who takes someone away by force and against the law and holds them, most often
  to get money for letting them go
scope: A person who takes someone away against the law and holds them, most often for money; not the act
  of taking them and not a thief who steals things.
examples:
- The kidnapper hid the child in a small room and asked for money.
- Police caught the kidnapper before he could reach the family.
