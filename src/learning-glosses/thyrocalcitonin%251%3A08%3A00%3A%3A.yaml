senseId: 'thyrocalcitonin%1:08:00::'
synsetId: 05420808-n
simpleMeaning: This thyroid hormone tends to stop bone from being taken back into the body and bring down
  the amount of calcium in the fluid part of the blood.
scope: Also called calcitonin, this thyroid hormone tends to bring down calcium in the blood and stop
  bone from being taken back into the body.
examples:
- Thyrocalcitonin keeps calcium in the blood from climbing too high.
- When bone was being taken back into the body, thyrocalcitonin slowed it down.
