simpleMeaning: a charge that ties a person closely to a wrong act, usually in a way that makes them look
  guilty
scope: A charge that ties a person closely to a wrong act, usually in a way that makes them look guilty;
  not the link between 'if' and 'then', not being mixed up in a wrong act, and not a thing worked out
  from facts.
examples:
- The implication that he had helped the thieves hurt him.
- She denied the implication that she was part of the plot.
