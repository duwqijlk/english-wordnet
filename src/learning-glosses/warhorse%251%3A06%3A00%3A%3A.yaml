simpleMeaning: a familiar piece of music or a play from the usual set of works performed, now tired from
  being heard too often
scope: This is a well-known work of music or drama that has grown stale through too much use; not a horse
  used in war and not a new work.
examples:
- The orchestra played another warhorse from its usual set.
- Critics called the play a warhorse, heard too often to surprise anyone.
