simpleMeaning: going on without a stop in time, and going on for a very long time with no fixed end
scope: 'Also called constant, incessant, perpetual, ceaseless, and unceasing: going on without a stop
  for a very long time, not felt only now and then or for a short time.'
examples:
- The unremitting rain lasted for days without a break.
- She worked under unremitting pressure from morning to night.
