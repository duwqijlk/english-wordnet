simpleMeaning: A promise to tell the truth, especially in a court of law, where a lie can bring a charge
  of lying in court.
scope: Also called an oath, this is a promise to tell the truth in court, not rude words said in anger
  or surprise.
examples:
- The swearing of the witness took place before the trial began.
- After the swearing, she took the stand.
