simpleMeaning: to fill the sky with grey cloud so sunlight can no longer be seen
scope: 'Also called cloud: to make the sky grey with clouds, not to sew an edge with long stitches and
  not the gloomy half-dark of a cloudy sky.'
examples:
- Fall weather often overcasts our beaches, and the sun stays hidden all day.
- By noon the wind had overcast the whole sky.
