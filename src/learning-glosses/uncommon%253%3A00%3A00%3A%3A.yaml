simpleMeaning: not met with often, or far greater in amount or far more striking in kind than usual
scope: About how seldom a thing is met with or how far it stands out in size or kind, not the sense of
  being the best or most extreme of its kind.
examples:
- Uncommon birds visit the marsh in winter.
- Frost and floods are uncommon during these months.
