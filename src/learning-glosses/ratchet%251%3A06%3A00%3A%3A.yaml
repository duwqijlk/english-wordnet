schema: oewn-learning-gloss-v2
senseId: 'ratchet%1:06:00::'
synsetId: 04062292-n
simpleMeaning: A machine part with a wheel or bar with teeth and a small catch (a pawl) that lets it turn
  or move in one way only
scope: Also called rachet and ratch, this is the machine part with teeth that can move in one way only,
  not a general tool with no such part.
examples:
- The ratchet in the clock lets the wheel turn forward but not back.
- He fixed the ratchet so the bar could move in one direction only.
