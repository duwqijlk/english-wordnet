simpleMeaning: the hard bones that make up the head of a person or of an animal with a back bone
scope: The bones of the head only, not all the bones of the body and not the soft parts inside the head.
examples:
- The doctor looked at an X-ray of his skull after the fall.
- The animal's skull was found near the river.
