simpleMeaning: An oily organic substance that will not dissolve in water yet dissolves in organic solvents,
  and forms a vital structural part of living cells alongside proteins and carbohydrates.
scope: A broad name for this class of cell substance, shared with lipoid and lipid, not a protein or carbohydrate.
examples:
- The sample contained lipide as well as several proteins.
- Lipide will not mix with water but dissolves readily in organic solvents.
