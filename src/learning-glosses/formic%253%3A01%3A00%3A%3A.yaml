simpleMeaning: of, or holding, or made from, the acid that ants make
scope: Describing something that has or comes from the acid that ants make; not a word for the acid itself
  and not for other acids.
examples:
- Formic acid is used to treat leather and cloth.
- The chemist tested the formic liquid before adding it to the mix.
