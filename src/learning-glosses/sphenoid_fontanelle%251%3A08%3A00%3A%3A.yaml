simpleMeaning: A soft area on each side of the skull where four bones meet; once the bones harden, it
  becomes a joined spot called the pterion.
scope: The side gap near the temple in a young skull, not the large gap on top of the head or the small
  one behind the ear.
examples:
- The sphenoid fontanelle lies close to the temple.
- A nurse can feel the sphenoid fontanelle on a newborn's head.
