simpleMeaning: a calming drug, sold as Librium and Libritabs, used to treat people who drink too much
  alcohol
scope: A calming drug used to treat alcoholism, sold as Librium or Libritabs, not a sleeping pill and
  not a drug for pain.
examples:
- The doctor gave him chlordiazepoxide to help with his alcohol treatment.
- Chlordiazepoxide is often sold under the name Librium.
