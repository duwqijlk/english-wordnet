simpleMeaning: In physics, the rule that the laws of nature stay the same when left and right are swapped,
  as in a mirror
scope: Parity, conservation of parity, and mirror symmetry are other names for this rule in physics.
examples:
- Space-reflection symmetry is one of the rules of physics.
- Left and right swap under space-reflection symmetry, and the laws stay the same.
