simpleMeaning: so extreme that it makes a person want to cry out
scope: Something so intense that it makes a person want to cry out; not the humorous sense of being wildly
  funny, and not the striking sense of something like sensational headlines or colours.
examples:
- He was in screaming agony by the time the ambulance arrived.
- The crowd worked itself into a screaming rage.
