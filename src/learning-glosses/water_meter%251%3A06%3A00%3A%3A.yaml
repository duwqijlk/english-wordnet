simpleMeaning: a tool that measures how much liquid flows through one pipe or tap
scope: A tool that measures how much liquid flows through one pipe or tap, not a tool that measures how
  much gas or power a house uses and not a tap itself.
examples:
- The water meter showed that we had used a lot of water this month.
- The man from the water company came to read the water meter.
