senseId: 'reference%1:10:01::'
synsetId: 06707541-n
simpleMeaning: A formal statement from a past employer to a future one, describing a worker's skills and
  trustworthiness.
scope: This is an old employer's endorsement of a worker, not a book or passage you cite, and not the
  act of looking something up.
examples:
- She asked her old manager for a reference before applying for the new job.
- His application was strong, but the hiring manager still wanted a reference from his last employer.
