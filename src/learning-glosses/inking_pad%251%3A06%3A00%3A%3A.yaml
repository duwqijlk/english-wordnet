simpleMeaning: Dark liquid fills this block, and a rubber stamp takes an even coat from it.
scope: This is a block filled with dark liquid that gives an even coat to a rubber stamp, also called
  a pad, an inkpad, or a stamp pad.
examples:
- They pressed the stamp onto the inking pad.
- The stamp took ink from the inking pad.
