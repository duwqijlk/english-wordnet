simpleMeaning: to run or lead something in a bad way, without the skill it needs
scope: Also called mismanage and mishandle. This is running something badly, not the noun sense for bad
  or not honest work done for another person.
examples:
- He misconducted the whole project and lost a lot of money.
- If you misconduct the funds, people will soon lose trust in you.
