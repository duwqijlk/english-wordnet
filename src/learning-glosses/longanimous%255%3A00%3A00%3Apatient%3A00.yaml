senseId: longanimous%5:00:00:patient:00
synsetId: 01740820-s
simpleMeaning: Staying calm and in control when things go badly, and slow to hit back or show anger.
scope: Calm self-control under bad treatment, not quick anger; forbearing is another name for this sense.
examples:
- He stayed longanimous through months of unfair criticism.
- She answered the insults in a longanimous way, without raising her voice.
