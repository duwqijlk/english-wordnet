simpleMeaning: a process that soaks something through with calcium or with salts of calcium
scope: A process that loads a thing with calcium, not the hard tissue that results and not a coat of paint.
examples:
- Calcification of the pipes left a hard crust inside them.
- The scan showed calcification in the old scar tissue.
