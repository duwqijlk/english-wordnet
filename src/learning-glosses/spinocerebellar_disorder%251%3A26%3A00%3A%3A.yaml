simpleMeaning: one of several sicknesses present from birth in which the small brain and the cord of nerves
  down the back slowly waste away, leaving the body stiff and unsteady
scope: A sickness from birth that wastes the small brain and the cord of nerves down the back, not an
  injury and not a sickness that starts in old age.
examples:
- Spinocerebellar disorder runs in some families.
- Her spinocerebellar disorder made walking hard and unsteady.
