simpleMeaning: a dirty child who wears old, worn-out clothes in poor condition
scope: This word is for a dirty child in poor, old clothes, not for a clean, well-dressed child and not
  for the clothes alone.
examples:
- The little ragamuffin stood at the door in a torn coat and old shoes.
- A ragamuffin with a dirty face asked if we had any food to spare.
