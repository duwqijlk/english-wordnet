simpleMeaning: slowly moving into a place or space where you have no right to be and no one has said you
  may be
scope: 'Also called invasive and encroaching: this describes a thing that slowly moves in where it is
  not allowed, not the act of entering someone''s land all at once.'
examples:
- Trespassing hunters moved slowly into the woods they had no right to enter.
- A trespassing vine grew slowly over the fence into our garden.
