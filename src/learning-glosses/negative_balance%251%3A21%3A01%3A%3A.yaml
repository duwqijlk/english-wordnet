simpleMeaning: A bank account in which more money has been taken out than put in, so the holder owes the
  bank money.
scope: A bank account in which more has been taken out than put in, so the holder owes the bank money,
  not an account with money left in it; also called debit balance.
examples:
- His account showed a negative balance after the large payment.
- A negative balance means the customer owes the bank money.
