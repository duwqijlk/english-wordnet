simpleMeaning: attractive in a light, delicate way rather than in a bold or grand way.
scope: This is not the adverb meaning 'fairly' or 'quite', and it does not describe something large or
  impressive.
examples:
- They rented a pretty cottage with roses around the door.
- She wore a pretty blue dress to the wedding.
