simpleMeaning: the family link between a child and that child's father
scope: This is the family link between a child and its father, also called paternity; it is not the state
  of being a father.
examples:
- Fatherhood links him to the child, even though they live apart.
- A test can show fatherhood by checking if a man is a child's father.
