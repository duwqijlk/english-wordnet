senseId: 'thought-reader%1:18:01::'
synsetId: 10339238-n
simpleMeaning: a magician who seems to know what another person is thinking, most often by smart signs
  from a helper
scope: 'Mind reader and telepathist are other names for this sense: a stage performer who seems to know
  what a person is thinking, not a person who truly reads minds and not a fortune teller.'
examples:
- The thought-reader asked a woman from the crowd to think of a number.
- A thought-reader at the fair seemed to know what I was thinking.
