simpleMeaning: in a way that is not what people expect or that is different from the usual way
scope: 'Also called oddly: in a way that is not expected or usual; it is not in a way that shows you want
  to know more about something.'
examples:
- Curiously, her voice was deep and rough that day.
- He behaved curiously and stayed silent when he usually talked a lot.
