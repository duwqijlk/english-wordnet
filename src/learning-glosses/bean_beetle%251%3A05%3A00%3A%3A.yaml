simpleMeaning: an insect brought to the United States from Mexico that eats the leaves of plants grown
  for their seeds
scope: A bug that came from Mexico and eats the leaves of bean plants, not a bug that eats seeds and not
  a beetle from elsewhere.
examples:
- The bean beetles ate holes in the leaves of the plants.
- Farmers in Texas first saw the bean beetle after it came north from Mexico.
