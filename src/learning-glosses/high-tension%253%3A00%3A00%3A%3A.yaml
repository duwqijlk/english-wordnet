simpleMeaning: Made to work with a strong flow of power, or put under such a flow
scope: A wire or part made to work under a strong flow of power, not a wire that carries only a weak flow.
examples:
- The workers stayed clear of the high-tension wire.
- This high-tension cable carries power across the valley.
