simpleMeaning: A living thing goes through the same set of steps again and again, from the start of one
  main step to the start of the next
scope: A set of steps that comes round again, not the course of growth from a first cell to a grown thing
  that can make a new one.
examples:
- The life cycle of a frog starts as an egg in the water.
- Each life cycle ends when the next one begins.
