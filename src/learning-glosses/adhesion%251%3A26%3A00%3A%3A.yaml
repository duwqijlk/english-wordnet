simpleMeaning: body parts joined together in a wrong way, most often in the belly
scope: A wrong joining of body parts, most often in the belly, not the sticking of glue to wood and not
  a band of scar tissue that binds parts together.
examples:
- After the operation, adhesion in her belly joined parts that should have stayed apart.
- The doctor found adhesion where the bowel had joined to the wall of the belly.
