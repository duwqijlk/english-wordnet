simpleMeaning: A fee equal to one percent of the total amount borrowed on a loan, paid when the loan is
  made separately from interest.
scope: This is not a unit in a game score or a measure of type size; it is a fee paid when borrowing money,
  separate from interest.
examples:
- They paid one point upfront on the new mortgage.
- The lender charged two points when the loan closed.
