simpleMeaning: While a wound heals, fresh soft stuff that holds parts of the body together, threaded with
  tiny blood tubes, forms on it.
scope: 'Also called granulation tissue, this names what forms on a wound as it heals: fresh soft stuff
  holding parts of the body together, threaded with tiny blood tubes.'
examples:
- Granulation covered the wound as it began to heal.
- Granulation formed over the cut as it healed.
