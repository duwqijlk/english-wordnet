simpleMeaning: Joining a part that stores charge to a part that resists change makes an electric loop
  in which a regular swing of current grows to its greatest size.
scope: This is an electric loop in which a regular swing of current grows to its greatest size; resonator
  is another name for this sense.
examples:
- The resonant circuit lets the swing of current grow to its greatest size.
- Engineers tuned the resonant circuit until the current swung at its greatest size.
