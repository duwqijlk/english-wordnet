simpleMeaning: A fighting force's power to fight a war comes from its soldiers and gear
scope: 'Also called military capability, military strength, posture and strength: what a fighting force
  can do in a war, shown by its soldiers and gear, not one battle and not one soldier''s bravery.'
examples:
- The general warned that the nation's military posture was weak.
- Our military posture rests on trained soldiers and good gear.
