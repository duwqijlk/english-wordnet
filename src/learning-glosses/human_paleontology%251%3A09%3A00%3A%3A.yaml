simpleMeaning: The study, done by science, of the old bones and other remains of early people.
scope: The study of the old bones and other remains of early people; human palaeontology is another name
  for this sense, not the study of living people and not the study of animal bones.
examples:
- He studied human paleontology at the university.
- Human paleontology looks at the bones of early people.
