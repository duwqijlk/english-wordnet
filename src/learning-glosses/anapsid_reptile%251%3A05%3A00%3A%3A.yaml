simpleMeaning: Of this early kind of animal, all have died out except turtles, and its skull has no hole
  near the temples.
scope: This early kind of animal, also called anapsid, has a skull with no hole near the temples, and
  only turtles of its group are left alive.
examples:
- Its skull had no hole near the temple, so it was an anapsid reptile.
- Only turtles are left of the anapsid reptile group.
