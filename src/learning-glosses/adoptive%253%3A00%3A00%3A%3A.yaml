simpleMeaning: of parents and children who are joined as a family by law, when the child was born to other
  parents
scope: About parents and children joined as a family by law, not by birth; not about taking up a new idea,
  name, or way of doing things.
examples:
- Her adoptive parents raised her from the time she was a baby.
- He first met his adoptive mother when he was six years old.
