simpleMeaning: a tall tree from East India, now planted in West Africa and tropical America for its hard
  wood that lasts a long time
scope: This is the tree itself, not the hard wood that comes from it.
examples:
- The tall teak in the park was planted many years ago.
- Teak grows well in hot, wet land in West Africa.
