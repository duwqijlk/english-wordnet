simpleMeaning: a person stops living when the body loses every part and every job it needs to stay alive
scope: 'Also called die, go, pass, choke, exit, croak, decease, expire, perish, conk, buy the farm, cash
  in one''s chips, give-up the ghost, kick the bucket, pass away and pop off: when a person stops living,
  not when a thing stops working.'
examples:
- The old farmer dropped dead while he was working in the field.
- She dropped dead the day after her ninetieth birthday.
