simpleMeaning: to say yes in reply to something, or to show in what you do that you are for something
scope: Accept is another name for this sense. This is saying yes in reply to something, or showing that
  you are for it. Not saying no to it, and not going against it.
examples:
- She consented to the plan after she read it in full.
- He consented to help his friend move the heavy boxes.
