simpleMeaning: when the immune system attacks transplanted tissue or a donor organ instead of accepting
  it
scope: The body's immune system reacting against grafted tissue or a donor organ, not turning a person
  away and not withholding something from someone; reject and resist are other names for this sense.
examples:
- His body refused the donor liver within a week.
- The transplant failed because her body refused the new kidney.
