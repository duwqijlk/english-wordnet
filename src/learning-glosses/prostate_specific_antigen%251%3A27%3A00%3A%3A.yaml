simpleMeaning: A protein made only by the gland below a man's bladder; it makes semen more liquid so sperm
  move easily, and raised blood levels can signal cancer or gland enlargement.
scope: This is the protein itself, not the blood test that measures it or the gland that produces it.
examples:
- The doctor ordered a prostate specific antigen test after the older man reported trouble urinating.
- His prostate specific antigen level was high, so the clinic scheduled a biopsy.
