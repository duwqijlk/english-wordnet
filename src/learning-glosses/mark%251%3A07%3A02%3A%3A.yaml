senseId: 'mark%1:07:02::'
synsetId: 04683421-n
simpleMeaning: the notice and memory that stay with people after someone does something unusual or outstanding
scope: The lasting notice left by an unusual achievement, not a visible clue that something happened,
  not a printed symbol, and not a badge of shame.
examples:
- The young scientist made her mark with a discovery that changed the field.
- He left his mark on the small town by rebuilding its library.
