simpleMeaning: 'A dishonest trick: cheating at a game of chance to win money, or talking a person into
  buying a thing worth nothing'
scope: A dishonest trick at a game or in a sale, also called con and sting, not the act of pushing hard
  to sell or get things.
examples:
- The card game was a hustle, and he lost all his money.
- She saw through the hustle and refused to buy the worthless land.
