simpleMeaning: in a way that is clear and leaves no doubt; often used in everyday talk for the form that
  ends in -ly
scope: Also called obviously and apparently. This is the adverb use that shows something is clear, not
  the adjective uses for clear or for simple with nothing added.
examples:
- He is plain stubborn and will not change his mind.
- She is plain wrong about the date.
