simpleMeaning: the greater emphasis placed on a syllable or musical note, especially in terms of force
  or pitch.
scope: This is not worry or mental pressure, and not the special importance given to an idea; it names
  the relative emphasis on a syllable or note in speech or music.
examples:
- In the word 'record', the stress falls on the first syllable.
- The stress in the melody falls on the second beat.
