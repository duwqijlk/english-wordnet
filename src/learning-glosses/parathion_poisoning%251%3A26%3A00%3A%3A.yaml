simpleMeaning: Nausea, stomach pain, headache, convulsions and sweating follow breathing in or swallowing
  the insecticide parathion.
scope: Poisoning by the insecticide parathion, not the chemical itself or poisoning by other pesticides.
examples:
- Workers who mixed parathion without protective gear developed parathion poisoning.
- Parathion poisoning can cause convulsions and heavy sweating.
