simpleMeaning: a stuff that kills small living things that harm plants, mixed in liquid and meant to be
  spread in tiny drops
scope: A stuff that kills small living things that harm plants, mixed in liquid and meant to be spread
  in tiny drops, not small drops of water in the air and not a small bottle that turns liquid into a fine
  mist.
examples:
- The farmer put spray on the crops to kill the bugs.
- She bought a spray for the roses to keep the greenfly off.
