senseId: 'generalisation%1:09:03::'
synsetId: 05788101-n
simpleMeaning: The process of making broad ideas by taking what is shared from single cases.
scope: This is the process of making broad ideas by taking what is shared from single cases; abstraction
  and generalization are other names for this sense, not giving one single example and not listing every
  case on its own.
examples:
- Generalisation lets us see what all birds have in common.
- Through generalisation, she formed a rule from many cases.
