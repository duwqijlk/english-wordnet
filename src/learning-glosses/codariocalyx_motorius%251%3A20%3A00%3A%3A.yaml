simpleMeaning: An upright tropical Asian bush whose small side leaflets turn on their stalks and jump
  up and down in sunshine.
scope: 'Also called semaphore plant, telegraph plant, Desmodium gyrans or Desmodium motorium: an upright
  tropical Asian bush whose leaflets move in sunshine, not a still plant and not a vine.'
examples:
- Codariocalyx motorius stood in the sun, its small leaflets jerking up and down.
- In bright sunshine the Codariocalyx motorius leaflets turned on their stalks.
