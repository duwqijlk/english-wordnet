simpleMeaning: A small shrub from scrub and dry woodland in southern Europe and North Africa, grown for
  its showy flowers and soft, often hairy, fragrant leaves that stay green all year.
scope: Another name for rock rose, a Mediterranean shrub grown for its showy flowers; not the garden rose
  or the low sun roses.
examples:
- Rockrose thrives on the dry hillsides of southern Europe.
- She planted rockrose along the sunny wall of the garden.
