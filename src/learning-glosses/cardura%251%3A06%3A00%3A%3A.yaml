simpleMeaning: A drug that lowers blood pressure by relaxing blood vessels so blood passes through them
  more easily; also used to treat a non-cancerous growth of the prostate gland.
scope: Also called doxazosin, this drug lowers blood pressure by relaxing blood vessels so blood passes
  through them more easily and also treats a non-cancerous growth of the prostate gland, distinct from
  a tablet that coats peptic ulcers, a drug for pain and inflammation, and a drug used only to lower blood
  pressure.
examples:
- The doctor prescribed Cardura to lower his blood pressure.
- Cardura is also used to treat a non-cancerous growth of the prostate gland.
