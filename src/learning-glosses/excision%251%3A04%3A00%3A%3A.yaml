simpleMeaning: The cutting out of a body part or bit of flesh.
scope: This sense is the cutting out of a body part or bit of flesh, unlike the sense for the act of casting
  a church member out of the fellowship of believers and the rights of the church, cutting one off from
  a godly body, unlike the sense for the act of pulling up or out, uprooting, cutting off from being,
  and unlike the sense for the bit cut when an editor trims a written text.
examples:
- The excision cut out the tissue.
- Excisions cut out body parts.
