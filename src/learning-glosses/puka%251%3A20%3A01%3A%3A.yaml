simpleMeaning: a small tree from New Zealand with a round top, big sticky leaves, and bunches of green-white
  flowers
scope: A New Zealand tree with a round top and big sticky leaves, not the South American puka shrub with
  long shiny green leaves.
examples:
- The puka in the garden has big sticky leaves.
- In spring the puka is full of bunches of green-white flowers.
