senseId: 'carry-forward%1:21:00::'
synsetId: 13430820-n
simpleMeaning: Money set aside for payouts to shareholders and for reserves leaves behind a company's
  built-up gains, still kept whole
scope: Also called carry-over, this is the money left over once a company has set money aside for payouts
  to shareholders and for reserves, not money already paid out to them.
examples:
- The carry-forward stayed in the company accounts.
- The firm kept the carry-forward in its accounts.
