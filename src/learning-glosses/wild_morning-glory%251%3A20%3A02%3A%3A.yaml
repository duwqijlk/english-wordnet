simpleMeaning: In Europe and America grows a plant found in many places that climbs over other plants,
  bears pink flowers, and at times is put in the group Convolvulus.
scope: Also called hedge bindweed, this plant climbs over other plants in Europe and America and bears
  pink flowers, not the weakly climbing European kind with white or pink flowers.
examples:
- Pink flowers opened on the wild morning-glory as it climbed over other plants.
- The wild morning-glory climbed over other plants and showed pink flowers.
