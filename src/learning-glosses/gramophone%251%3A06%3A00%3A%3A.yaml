simpleMeaning: An old record player in which the sound of the shaking needle is made louder without electric
  power
scope: An old record player that makes sound louder without electric power; not a modern record player
  or a radio.
examples:
- The gramophone played an old song through its big horn.
- Grandfather wound up the gramophone and put on a record.
