simpleMeaning: Ships that go under water and the weapons they use get help with science, building things,
  and machines from this agency.
scope: Also called Naval Underwater Warfare Center; this is an agency that gives help, not the ships or
  weapons themselves.
examples:
- The engineers got help from NUWC with their work on ships that go under water.
- NUWC works on the weapons that ships use under the sea.
