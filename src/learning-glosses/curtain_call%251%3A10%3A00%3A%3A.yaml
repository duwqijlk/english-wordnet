senseId: 'curtain_call%1:10:00::'
synsetId: 07244001-n
simpleMeaning: A return to the stage by actors or other performers at the end of a show to accept the
  clapping of the watchers.
scope: Also called bow; the performers' return to accept applause, not an encore and not the end of the
  show itself.
examples:
- The actors took a curtain call after the final scene.
- The audience cheered through three curtain calls.
