simpleMeaning: A bush or small tree with cones that look like small round berries
scope: This is the living bush or small tree itself, not its wood and not the different desert bush from
  Syria and Arabia that has small white flowers.
examples:
- The juniper by the path has small round parts that look like dark berries.
- We planted a low juniper to cover the dry ground by the house.
