simpleMeaning: a tall mullein covered in dense soft hairs, with tightly packed yellow flowers; the ancient
  Greeks and Romans dipped its stems in fat and used them as funeral lights.
scope: Another name for great mullein and flannel mullein; this is the tall plant with soft hairs and
  yellow flower spikes, not the burning torch, the battery lamp or the gas burner.
examples:
- Woolly mullein has tall stems covered in dense, soft hairs.
- Ancient Greeks dipped the stalks of woolly mullein in tallow for funeral torches.
