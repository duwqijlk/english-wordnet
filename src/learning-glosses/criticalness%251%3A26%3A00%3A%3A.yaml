senseId: 'criticalness%1:26:00::'
synsetId: 14475138-n
simpleMeaning: a state in which quick action is needed at once
scope: This is a state in which quick action is needed at once; criticality is another name for this sense,
  and it is not a calm state or the urgent thing itself.
examples:
- The criticalness of the fire made every minute count.
- He felt the criticalness of the choice before him.
