simpleMeaning: asks little of you, and is easy to do or to bear, with nothing hard in it
scope: 'Also called soft and easygoing: something you do or bear that asks little of you and has no hard
  part, not something soft to touch.'
examples:
- He has a cushy job with short hours and little work.
- What a cushy job - he works at home and finishes by noon.
