simpleMeaning: having no sex organs, or sex organs that did not grow in the full way or do not work
scope: 'Also called neuter: this is about a living thing whose sex organs are missing, not fully grown,
  or not working, not about a person who does not have sex.'
examples:
- These sexless insects cannot produce young of their own.
- The flower was sexless and had no male or female parts.
