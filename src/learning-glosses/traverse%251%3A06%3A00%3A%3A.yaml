simpleMeaning: a bar that runs sideways across a window, or between a door and the window above it
scope: A bar that runs sideways across a window or between a door and the window above it, not the long
  bar that runs across a whole thing and not the verb sense of travelling across.
examples:
- A wooden traverse held the two panes apart.
- The carpenter fitted a traverse across the top of the window.
