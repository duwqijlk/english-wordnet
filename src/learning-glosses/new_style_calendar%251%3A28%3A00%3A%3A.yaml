synsetId: 15199265-n
simpleMeaning: 'Sun count now in use, from Gregory XIII in 1582 fixing Julian count: 10 days cut, century
  leap years only when divisible by 400; in Britain and America from 1752.'
scope: Also called Gregorian calendar; the sun count now in use, not the Julian count it replaced and
  not a moon count.
examples:
- The New Style calendar replaced the Julian calendar in Britain.
- Under the New Style calendar, Oct 5 became Oct 15.
