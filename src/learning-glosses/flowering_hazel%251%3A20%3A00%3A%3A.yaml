simpleMeaning: Hanging bunches of yellow blooms that open before the leaves are what these Asian bushes,
  which lose their leaves in winter, are grown for.
scope: Also called a winter hazel, this is one of several Asian bushes that lose their leaves in winter,
  grown for hanging bunches of yellow blooms that open before the leaves.
examples:
- The flowering hazel by the wall was covered in yellow blooms.
- We planted a flowering hazel where its blooms would open before the leaves.
