simpleMeaning: To use a word that says how much or how many of something there is
scope: To use a word that says how much or how many, not to put a thing into numbers and not to count
  things.
examples:
- In 'some dogs', the word 'some' quantifies the dogs.
- In 'many birds', 'many' quantifies the birds.
