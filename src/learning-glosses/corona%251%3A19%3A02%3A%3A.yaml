simpleMeaning: Light that shows as one or more rings round a bright thing.
scope: Rings of light round a bright thing, not the sun's outer glow, not a body part shaped like a crown,
  and not the disease.
examples:
- A corona shone round the moon that night.
- The lamp wore a faint corona in the mist.
