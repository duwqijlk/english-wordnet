simpleMeaning: Tiny bits of living stuff in the blood of animals with backbones, needed for blood to clot
scope: These are tiny bits of living stuff in the blood of animals with backbones, needed for blood to
  clot, also called platelets and blood platelets; not white blood cells and not red blood cells.
examples:
- Thrombocytes are tiny bits in the blood that help it clot.
- A low count of thrombocytes can mean blood clots slowly.
