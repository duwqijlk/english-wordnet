simpleMeaning: A big round lump that grows out of the trunk or a branch of a tree.
scope: A big round lump that grows out of the trunk or a branch of a tree; not a soft lump or uneven bit
  in yarn, there by mistake or put there on purpose, and not the wood cut from such a lump, often used
  as a thin facing on other wood.
examples:
- A burl swelled out from the side of the oak.
- The old tree had a large burl on its trunk.
