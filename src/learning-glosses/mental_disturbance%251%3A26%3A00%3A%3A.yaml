senseId: 'mental_disturbance%1:26:00::'
synsetId: 14107272-n
simpleMeaning: In psychiatry, a problem with how a person thinks or feels, put in a softer way than the
  harsher name for the same trouble
scope: In psychiatry, a problem with how a person thinks or feels, put in a softer way; disturbance, folie,
  mental disorder and psychological disorder are other names for this sense, not a passing bad mood, and
  not a fault of the body.
examples:
- A mental disturbance is a problem with how a person thinks or feels.
- She sought help for a mental disturbance that made daily life hard.
