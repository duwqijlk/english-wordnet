simpleMeaning: A drawn face that makes fun of Cardinal Bellarmine marks this drinking jug of hard baked
  clay, whose neck runs far out, from the 1600s.
scope: Also called greybeard, bellarmine, and longbeard, it is the stoneware jug whose long neck bears
  a drawn face that makes fun of Cardinal Bellarmine.
examples:
- He poured water from the long-beard into a cup.
- His long-beard bore the drawn face of Cardinal Bellarmine on its neck.
