simpleMeaning: Becoming stronger, or stronger in how much you feel it or how much effect it has
scope: This word describes a thing that is growing stronger itself, not a person making something else
  stronger.
examples:
- The intensifying storm forced everyone to stay inside.
- She felt an intensifying pain in her leg.
