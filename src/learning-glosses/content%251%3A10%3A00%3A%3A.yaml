simpleMeaning: the ideas or information in something such as a book, speech or website.
scope: This is about the subject matter of a message, not the amount of a substance in a mixture or a
  feeling of satisfaction.
examples:
- The content of her speech surprised everyone.
- Parents should check the content of the websites their children visit.
