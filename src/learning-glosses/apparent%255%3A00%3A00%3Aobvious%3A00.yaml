simpleMeaning: easy and clear to see, feel, think about, or judge
scope: 'Another name for this sense is plain: clear to see or to understand, not only seeming to be true
  when it may not be.'
examples:
- It was apparent from the dry fields that the long dry weather had hurt the crops.
- Her joy was apparent to everyone who saw her smile.
