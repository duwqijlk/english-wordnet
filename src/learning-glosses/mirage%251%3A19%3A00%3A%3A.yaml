simpleMeaning: Something you seem to see far away, made when a layer of hot air bends light and changes
  or turns upside down the picture of far-off things
scope: This is what hot air makes you seem to see in the distance; it is not the real far-off thing itself,
  and it is not a dream.
examples:
- In the desert heat, the lake ahead turned out to be a mirage.
- What looked like water on the hot road was only a mirage.
