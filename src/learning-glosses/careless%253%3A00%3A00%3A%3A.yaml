simpleMeaning: not paying attention, not thinking about what may happen, and not doing things fully or
  well
scope: Describes a person or action that does not pay attention or think ahead; it is not about being
  relaxed and free from worry.
examples:
- It was a careless mistake; he did not check the numbers before he sent them.
- A careless driver can hurt other people on the road.
