simpleMeaning: one of many soft-stemmed plants from warm lands with flowers that are wide at the top and
  narrow at the bottom, like a funnel, with long narrow grooves along them
scope: This is the plant itself, with flowers that are wide at the top and narrow at the bottom. It is
  not a tree, and not a plant with small flat flowers.
examples:
- She planted petunias along the sunny wall of the house.
- The petunia in the pot had deep purple flowers shaped like small funnels.
