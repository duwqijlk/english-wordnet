simpleMeaning: 'In cryogenics, the lowest temperature theory allows, where atoms and molecules have the
  least possible kinetic energy: 0 Kelvin, -273.15 °C, or -459.67 °F.'
scope: This is the theoretical lower limit of temperature, not the coldest reading ever recorded and not
  the freezing point of water at 0 °C. The figures are negative on the Celsius and Fahrenheit scales,
  so it is often confused with an ordinary cold reading. It is a technical term in physics and cryogenics.
examples:
- The team cooled the atoms to within a billionth of a degree above absolute zero.
- Absolute zero cannot be reached, but it sets the scale for low-temperature physics.
