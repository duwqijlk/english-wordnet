simpleMeaning: under its wings, this small flying insect carries thin lines of colour
scope: Another name for a hairstreak, a small flying insect with thin lines of colour under its wings,
  not a big winged insect and not one with plain wings.
examples:
- A hairstreak butterfly landed on the fence post.
- The hairstreak butterfly showed thin lines under its wings as it fed.
