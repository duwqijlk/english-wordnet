simpleMeaning: a worker who looks at loss and harm cases to work out the fair amount of money to pay
scope: A worker who looks at loss and harm cases to work out the fair amount of money to pay; adjuster,
  adjustor, claim agent and claims adjustor are other names for this sense, not the person who makes the
  request and not a lawyer.
examples:
- The claims adjuster visited the house after the storm.
- Our claims adjuster said the company would pay for the repairs.
