simpleMeaning: A set of signs used in logic that stands for single things, what is said about them, and
  how many there are, as well as how statements hang together
scope: This is a set of signs used in logic that stands for single things, what is said about them, and
  how many there are, as well as how statements hang together; functional calculus is another name for
  it, not the logic of whole statements only.
examples:
- Predicate calculus uses signs for single things and what is said about them.
- She studied predicate calculus in her logic class.
