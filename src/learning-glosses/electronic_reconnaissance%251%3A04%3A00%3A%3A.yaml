simpleMeaning: finding out about strange waves from other lands, working out what they are, what they
  mean, and where they come from, not waves from atoms breaking up
scope: The finding and placing of strange waves from other lands, not the sighting of ships and not the
  reading of letters.
examples:
- Electronic reconnaissance found the enemy's radio signals.
- The ship used electronic reconnaissance to place the foreign signals.
