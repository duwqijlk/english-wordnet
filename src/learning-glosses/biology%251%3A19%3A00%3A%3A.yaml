simpleMeaning: the ways living things live and the things that happen in them, which are typical of life
scope: The life processes themselves in living things; not the study of living things as a school subject
  or a science.
examples:
- The biology of the frog lets it live both in water and on land.
- Changes in the biology of viruses can make them spread faster.
