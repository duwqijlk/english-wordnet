simpleMeaning: In physics, a feature of the tiny particles inside protons and neutrons that decides how
  they act under the strong force, which binds atomic nuclei.
scope: The physics property that quarks carry, which governs their part in the strong interaction, only;
  not a thing's visible appearance as judged by hue, lightness and saturation, not the physical light
  attribute behind it, not vividness or interest, not a musical sound's quality, not a deliberately misleading
  outward show or form, not a pigment or dye, not the adjective meaning able to produce hues, and not
  any verb use (adding hue, tinting, decorating, affecting feeling, biasing, excusing deceptively, or
  turning a different shade).
examples:
- Each quark carries one of three colors, and the strong force keeps the combination balanced.
- Gluons exchange color between quarks, binding them into protons and neutrons.
