simpleMeaning: connected with the ideas behind a system where the government controls every part of life
scope: This word describes ideas linked to this kind of rule, not a person who follows those ideas and
  not a government that itself holds all power.
examples:
- He studied totalitarian ideas about complete state control.
- The book explains totalitarian theory and how it shaped practice.
