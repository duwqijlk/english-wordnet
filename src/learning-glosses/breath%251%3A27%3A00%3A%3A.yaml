simpleMeaning: The air a person or animal draws into the body and pushes out again during respiration.
scope: The air itself, not the act of taking it in and pushing it out, and not a faint current of air
  or an indirect hint.
examples:
- Her breath smelled of coffee and mint.
- The cold air turned his breath into a white cloud.
