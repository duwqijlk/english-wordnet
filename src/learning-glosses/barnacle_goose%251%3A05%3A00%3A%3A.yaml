simpleMeaning: a bird from Europe that is smaller than the brant, a sea bird, and makes its nest in the
  far north
scope: 'Also called barnacle: a European goose smaller than the brant that breeds in the far north, not
  the brant itself and not a barnacle on a rock.'
examples:
- A barnacle goose flew low over the marsh.
- The barnacle goose breeds in the far north and spends the winter in Europe.
