simpleMeaning: a bush-like tree found widely on tropical coasts, whose light, strong wood makes canoe
  outriggers and whose fiber is used for rope and caulking; often grown for decoration.
scope: Another name for the shrubby shore mahoe used for outriggers and fiber; not the erect Cuban and
  Jamaican forest tree with hairy leaves and orange-red flowers.
examples:
- The majagua grows along the shoreline, and its tough wood is still used for canoe outriggers.
- Fishermen once made rope from the fiber of the majagua.
