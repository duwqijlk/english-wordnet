simpleMeaning: Taken from different parts of the lower airways, one of several thin spreads of cells used
  to study cancer and other sicknesses of the lungs by looking at the cells.
scope: Also called lower respiratory tract smear and sputum smear, this is a thin spread of cells from
  the lower airways, used to study cancer and other sicknesses of the lungs; other tests that look at
  cells from the lungs are its nearest rivals.
examples:
- The bronchoscopic smear showed cells from the lower airways.
- The bronchoscopic smear was used to study cancer of the lungs.
