simpleMeaning: a band of flesh joined to bone that pulls the arm in toward the body and turns it round
scope: A band of flesh joined to bone that pulls the arm in and turns it round, also called pectoralis
  major and musculus pectoralis major, not a bone and not a part of the leg.
examples:
- The greater pectoral muscle pulls the arm across the chest.
- He tore his greater pectoral muscle lifting the heavy box.
