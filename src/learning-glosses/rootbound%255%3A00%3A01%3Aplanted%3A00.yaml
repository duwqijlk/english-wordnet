simpleMeaning: (of a plant in a pot) grown too big for its pot, so that the parts below the soil mat and
  tangle together
scope: A plant in a pot grown too big for its pot, so that the parts below the soil mat and tangle together;
  potbound is another name for it, not a plant that is simply dry and not a plant that has outgrown its
  bed in the ground.
examples:
- The fern was rootbound, its pot full of tangled growth.
- She repotted the rootbound plant into a larger pot.
