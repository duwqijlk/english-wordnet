simpleMeaning: the act of making something by pouring liquid into a hollow shape (a mold) and letting
  the liquid go hard
scope: Making something by pouring liquid into a mold, not the act of throwing a fishing line out over
  the water.
examples:
- Casting the metal statue in a mold took all morning.
- They used casting to make the iron parts for the gate.
