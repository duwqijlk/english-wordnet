simpleMeaning: Not caring and doing nothing good, shown as one of the deadly sins.
scope: Also called sloth and laziness, this is a lack of care about doing good, shown as one of the deadly
  sins.
examples:
- The monk warned that acedia could keep a person from doing good.
- The monk's acedia left him idle when there was good work to do.
