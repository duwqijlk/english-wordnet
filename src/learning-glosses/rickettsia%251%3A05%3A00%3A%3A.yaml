simpleMeaning: A very small rod-shaped bacterium carried by ticks or mites; it causes diseases that bring
  fever, such as typhus, in people and other animals.
scope: A tiny rod-shaped bacterium carried by ticks and mites, not a virus; it causes typhus and other
  fevers in people.
examples:
- A rickettsia can pass to a person through the bite of an infected tick.
- Doctors treated the infection with an antibiotic that works against rickettsia.
