simpleMeaning: a change in something, such as a situation or how a person acts, that comes without warning
  and cannot be explained
scope: This is a sudden change in things or in how a person acts that is hard to explain, not a plan,
  a rule or a steady habit.
examples:
- A sudden vagary in his mood made him leave without a word.
- She learned to live with each vagary of the weather.
