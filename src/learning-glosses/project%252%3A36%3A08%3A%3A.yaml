simpleMeaning: to draw a flat figure that shows a shape or solid object as seen from one direction, the
  way a map shows part of the earth
scope: Not to show an image with a machine on a screen, and not to put an idea forward for others to judge.
examples:
- The students projected the cube onto three flat planes.
- Map makers must decide how to project the curved surface of the earth onto paper.
