simpleMeaning: Using an electric current to stir something into action
scope: This is using an electric current to stir something into action; galvanisation is another name
  for this sense, not coating metal with zinc and not stirring a person to lively action.
examples:
- The doctor used galvanization to test the muscle.
- Galvanization of the nerve made the hand twitch.
