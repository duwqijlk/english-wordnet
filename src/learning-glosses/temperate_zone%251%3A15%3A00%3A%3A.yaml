simpleMeaning: The part of the Earth between the Arctic Circle and the Tropic of Cancer, or between the
  Antarctic Circle and the Tropic of Capricorn; it has mild weather.
scope: A band of the Earth between the polar circles and the tropics, with mild weather; the hot lands
  near the equator and the cold lands near the poles lie on either side of it.
examples:
- The Temperate Zone has four clear seasons.
- Most of Europe lies in the Temperate Zone.
