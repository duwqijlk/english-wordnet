simpleMeaning: an American plant with flat-topped bunches of small white flower heads; people say it brings
  on trembles and milk sickness, and it is sometimes put in the group Eupatorium
scope: 'Also called white snakeroot: an American plant with flat-topped bunches of small white flower
  heads, said to bring on trembles and milk sickness, not a garden herb and not a true sanicle.'
examples:
- White sanicle grows in the woods, its flat white flower heads standing out.
- Farmers once blamed white sanicle for trembles and milk sickness.
