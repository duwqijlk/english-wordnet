simpleMeaning: A European herb that is poisonous, bearing roots like tubers, yellow juice that marks the
  skin, yellow flowers, and leaves like celery; every part extremely poisonous.
scope: This sense is also called hemlock water dropwort, for a poisonous European herb with tuber-like
  roots, yellow flowers, and leaves like celery, whose yellow juice stains the skin, with every part extremely
  poisonous.
examples:
- Water dropwort stains the skin.
- Water dropwort is poisonous.
