simpleMeaning: a British imperial unit for measuring how much liquid or dry stuff a container holds, equal
  to eight drams, or 28.416 cubic centimetres (1.734 cubic inches)
scope: A British imperial unit for measuring capacity, also called fluidounce, not a unit of weight.
examples:
- The recipe called for two fluid ounces of milk.
- A fluid ounce is about 28 cubic centimetres.
