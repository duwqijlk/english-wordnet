simpleMeaning: One of the trees of the group called Platanus, with thin pale bark that comes off in small
  plates, lobed leaves, and round heads of fruit
scope: A tree of the plane-tree group with thin pale bark and round fruit heads, not the European maple
  of the same name and not its wood.
examples:
- The sycamore by the river drops its bark in plates.
- Sycamores line the old avenue.
