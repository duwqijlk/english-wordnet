simpleMeaning: the process in which ferric oxides (a red-brown substance) form on iron when iron, oxygen
  and water meet at low temperatures
scope: This is the process that makes the red-brown coat on iron, not the coat itself and not the plant
  disease with the same name.
examples:
- In damp air, rust forms on iron even without high heat.
- Leaving the iron tool in water led to rust over time.
