simpleMeaning: in a complete mess, with everything mixed up and nothing in its right place
scope: This means very messy and untidy, like a pile of clothes with nothing in place, not wild, hard
  to follow, and confusing.
examples:
- A disorderly pile of clothes covered the floor.
- His desk was so disorderly that he could not find the letter.
