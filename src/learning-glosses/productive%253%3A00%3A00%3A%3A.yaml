simpleMeaning: making or able to make things, especially in large amounts
scope: This sense is about making things, especially a lot of them; it is not the sense about starting
  or creating new things.
examples:
- The productive farmland gave us a big crop of corn each year.
- She had a very productive morning and finished all her work.
