simpleMeaning: To tell a jury what the law says, how it applies, and how to weigh the evidence.
scope: This is a judge's instruction to a jury, not a general order or command given with authority, not
  imposing a task or responsibility on someone, not blaming or accusing someone of wrongdoing, not filing
  a formal charge, not demanding payment or setting a price, not loading or filling something, not supplying
  a device with what it needs, not aiming or pointing a weapon, not giving something an electrical charge,
  not charging a battery, not saturating something, not rushing at someone or moving quickly, not stirring
  someone up, not causing someone to be admitted to an institution, not giving something over for safekeeping,
  not paying by credit card, not holding someone responsible, not lying down on command like a hunting
  dog, and not placing a design on a shield.
examples:
- The judge charged the jury on the meaning of intent before they began deliberating.
- After the closing arguments, the court will charge the jury and send it out.
