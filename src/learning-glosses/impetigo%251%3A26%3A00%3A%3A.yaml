simpleMeaning: A skin infection that spreads very easily from person to person, often seen in children,
  where red patches turn into small blisters that dry into crusts and wear away.
scope: A skin infection that spreads very easily from person to person, often seen in children.
examples:
- The child stayed home because impetigo spreads so easily.
- Impetigo left small crusts around her mouth that slowly cleared.
