simpleMeaning: a tiny part of the body that takes in and breaks down waste and germs that get in
scope: A tiny part of the body that takes in and breaks down waste and germs; also called a phagocyte.
  Not a part that carries signals and not one that makes blood.
examples:
- The scavenger cell took in the germs and broke them down.
- After the cut, scavenger cells cleared away the dead bits.
