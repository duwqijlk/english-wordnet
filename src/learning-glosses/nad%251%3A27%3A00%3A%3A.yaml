simpleMeaning: A helper substance found in most living cells, made from the B vitamin nicotinic acid;
  it helps move hydrogen in the chemical steps of life.
scope: Not NADP or FAD; also called nicotinamide adenine dinucleotide.
examples:
- NAD helps cells turn food into energy.
- NAD is found in most living cells.
