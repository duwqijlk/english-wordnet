simpleMeaning: A pair of hollow wood or bone pieces held between the thumb and fingers and struck together
  to mark the rhythm of Spanish dancing.
scope: The clicking pair, another name for bones, castanets and clappers; not a large cymbal struck on
  a stand, and always plural.
examples:
- The belly dancer struck her finger cymbals to mark the beat.
- A soft chime rose from the finger cymbals as she moved.
