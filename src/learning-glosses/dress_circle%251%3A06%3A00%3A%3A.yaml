simpleMeaning: Most times the first level above the orchestra, this curved tier of seats runs round a
  hall, theatre, or opera house.
scope: This curved tier of seats, usually the first above the orchestra, is also called a circle.
examples:
- They had excellent seats in the dress circle.
- We watched the play from the dress circle, just above the orchestra.
