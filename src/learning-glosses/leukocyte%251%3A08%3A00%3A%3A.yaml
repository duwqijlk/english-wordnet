simpleMeaning: Blood cells that take in and break down bacteria and fungi, a key part of the body's defence
  system
scope: Leucocyte is another name for these blood cells that take in and break down bacteria and fungi;
  they are not red blood cells and not platelets.
examples:
- Leukocytes help fight infection in the blood.
- The doctor counted the leukocytes in the blood sample.
