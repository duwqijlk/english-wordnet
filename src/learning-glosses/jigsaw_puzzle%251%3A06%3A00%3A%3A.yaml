simpleMeaning: A game in which you put back together a picture fixed on stiff card and cut into pieces
  that lock into each other.
scope: A picture cut into pieces that lock together, to be put back together, not a word game and not
  a picture left whole.
examples:
- We spent the evening working on the jigsaw puzzle.
- The jigsaw puzzle had a thousand pieces.
