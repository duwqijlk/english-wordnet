simpleMeaning: an activity that lets a person let out or show feelings, or use their power to make new
  things
scope: 'Also called release, and another name for this sense is outlet: an activity that lets feelings
  out, not an opening in the ground, not a body opening in a lower animal, and not a slit in clothes.'
examples:
- He gave vent to his anger by shouting at the wall.
- Painting gave her a vent for her strong feelings.
