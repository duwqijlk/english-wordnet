simpleMeaning: A set pattern for lines in Greek and Latin poems, made of groups of four lines with four
  strong beats each, said to have been first made by Alcaeus.
scope: Also called Alcaic; a fixed verse form of old Greek and Latin poetry, close to other fixed classical
  forms such as Sapphic verse, and not ordinary prose.
examples:
- The Alcaic verse in the poem follows the old four-line pattern.
- She wrote a stanza of Alcaic verse for the class.
