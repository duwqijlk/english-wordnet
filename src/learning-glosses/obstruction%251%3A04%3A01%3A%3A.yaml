simpleMeaning: the act of blocking something or stopping something from going forward
scope: The act of blocking or stopping something, not a thing that stands in the way and not the state
  of a passage being blocked or filled.
examples:
- He was charged with obstruction of justice for hiding the papers from the police.
- Their obstruction of the plan slowed the work for weeks.
