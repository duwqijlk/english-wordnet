simpleMeaning: Wild pig-like animals of North and South America that come out at night and live in groups
scope: 'Also called a musk hog: wild pig-like animals of North and South America that come out at night
  and live in groups, not tame farm pigs and not deer.'
examples:
- A peccary rooted in the dry leaves for food.
- Peccaries travel in noisy herds through the forest.
