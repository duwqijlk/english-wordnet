simpleMeaning: the use of sounds made by the voice to share ideas in a way that others hear
scope: This sense is about voice sounds used to share ideas, not a single spoken word or statement and
  not writing.
examples:
- Speech and song are forms of human utterance that carry meaning through sound.
- Long before she could talk, the baby used utterance — happy sounds and cries — to share how she felt.
