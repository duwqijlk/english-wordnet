simpleMeaning: A soft mix of a sweet thick liquid and a substance that sets firm when cool, used in the
  study of body tissues to fix samples in place
scope: A soft mix used in the study of body tissues to fix samples in place, not a food jelly and not
  a glue.
examples:
- The worker used glycerin jelly to mount the thin slice of tissue.
- Glycerin jelly holds the sample still under the microscope.
