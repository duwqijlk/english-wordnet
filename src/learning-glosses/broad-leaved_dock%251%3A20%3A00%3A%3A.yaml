simpleMeaning: Often found as a weed in North America, this European plant has a bitter underground stem
  and wide blunt-ended leaves.
scope: Also called bitter dock and yellow dock, this is a European plant with wide blunt-ended leaves
  and a bitter underground stem, found as a weed in North America; other plants with wide leaves and bitter
  roots are its nearest rivals.
examples:
- Broad-leaved dock grows wild in North America, with wide blunt-ended leaves.
- Broad-leaved dock is easy to know by its wide blunt-ended leaves and bitter underground stem.
