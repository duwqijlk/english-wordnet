simpleMeaning: A tube made of thin tissue that joins a baby still in the womb to the afterbirth
scope: A tube made of thin tissue that joins a baby still in the womb to the afterbirth, also called umbilical,
  not the baby's own food pipe and not the sac of fluid around the baby.
examples:
- The umbilical cord was cut after the baby was born.
- Food and oxygen reach the baby through the umbilical cord.
