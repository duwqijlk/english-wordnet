simpleMeaning: A motorised carrier that ferries skiers up a slope.
scope: A carrier that takes skiers uphill, not the machine that moves people between floors of a building.
examples:
- We rode the lift to the top of the run and skied down.
- The lift was closed because of high winds, so the slope stayed empty.
