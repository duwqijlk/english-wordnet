simpleMeaning: a wide board fixed along the top edge of the side of a boat (the gunwale) to stop water
  from coming over the side
scope: 'Also called splashboard: a board on a boat that stops water coming in, not the board with a rough,
  uneven surface that people rub clothes on to wash them.'
examples:
- The washboard along the side of the small boat kept the waves out.
- Water hit the washboard but did not come into the boat.
