simpleMeaning: having hurt feelings, and feeling unhappy and a little angry
scope: This is a hurt feeling in the mind, also called injured and pained; it is not a hurt to the body.
examples:
- She felt offended by his rude joke.
- He looked offended when they laughed at his idea.
