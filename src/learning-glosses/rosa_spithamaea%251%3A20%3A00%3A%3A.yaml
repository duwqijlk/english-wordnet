simpleMeaning: A low bush with stiff hairs, of southern Oregon and California, with creeping rootstocks
  and flowers that most often grow in flat-topped clusters.
scope: Also called a ground rose; a low bush with creeping rootstocks, not a tall rose bush.
examples:
- The Rosa spithamaea grows low in southern Oregon.
- Rosa spithamaea has creeping rootstocks.
