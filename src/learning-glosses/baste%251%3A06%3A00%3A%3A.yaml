simpleMeaning: a loose stitch made for a short time only, to hold pieces of cloth together while you sew
scope: This stitch is also called tacking, basting and basting stitch; it is the stitch itself, not the
  act of sewing loosely and not hitting something hard.
examples:
- The loose baste held the two pieces of cloth together.
- Take out the baste after you finish the real sewing.
