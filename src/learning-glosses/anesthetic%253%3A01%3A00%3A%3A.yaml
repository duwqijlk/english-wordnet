simpleMeaning: relating to not being able to feel anything, or causing a person to not be able to feel
  anything
scope: 'Also called anaesthetic: this word describes something linked to or causing loss of feeling; not
  the drug itself, which is the noun sense.'
examples:
- The doctor used an anesthetic spray to stop the pain.
- The gas has an anesthetic effect, so the patient felt nothing.
