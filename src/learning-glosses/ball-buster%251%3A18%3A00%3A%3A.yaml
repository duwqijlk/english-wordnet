simpleMeaning: a woman who makes heavy demands and leaves men with no trust in themselves
scope: 'Also called a ball-breaker: a woman who makes heavy demands and leaves men with no trust in themselves,
  not a woman who is hard to please and not a boss who sets high goals.'
examples:
- The new manager was a ball-buster who left the men afraid to speak.
- He said his ball-buster wife had taken away his trust in himself.
