senseId: 'inhuman_treatment%1:04:00::'
synsetId: 00425602-n
simpleMeaning: On purpose, someone hurts another person and makes them suffer
scope: An act in which someone on purpose causes pain and suffering, also called cruelty; not an accident
  and not a harsh word that leaves no pain.
examples:
- The prisoners suffered inhuman treatment at the hands of their guards.
- The report described the inhuman treatment of workers in the camp.
