simpleMeaning: In the body, a narrow cord of tissue that joins two larger parts of one structure.
scope: 'Also called a band: a cord-like strip of tissue joining two larger parts in the body, not the
  narrow strip of land of the same name.'
examples:
- The isthmus joins the two lobes of the gland.
- Surgeons must take care not to cut the isthmus.
