simpleMeaning: weather wears down minerals rich in aluminium, feldspar for one, into a fine clay, mostly
  white, that potters use, that soaks up wetness, and that fills things such as paper
scope: 'Also called china clay, china stone, kaolin, kaoline, and porcelain clay: a fine white clay used
  for pots and paper, not ordinary brown garden clay, and not the clay used to whiten leather.'
examples:
- The potter mixed terra alba into the clay for the new bowls.
- Terra alba is used as a filler in paper.
