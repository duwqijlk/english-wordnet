simpleMeaning: the family link between a female child and the other children of her parents
scope: This is the family link between a female child and her parents' other children; it is not a religious
  group of women who live together.
examples:
- The form recorded their sisterhood, listing her as the sister of two brothers.
- Their sisterhood came from birth, since they were born to the same parents.
