simpleMeaning: A group of singers with no instruments, most often men, whose voices sound together in
  four parts on songs full of feeling.
scope: This is the group of singers, most often men, that sings sentimental songs in four parts with no
  instruments.
examples:
- The barbershop quartet sang, and its four parts fitted together.
- They sang as a barbershop quartet, with no instruments behind them.
