simpleMeaning: A tetracycline drug that kills germs (sold as Declomycin), good for treating some germ
  infections, rickettsial ones (caused by one kind of germ), and other infections
scope: A tetracycline drug sold as Declomycin that treats some germ and other infections, not a painkiller
  and not a drug for every illness.
examples:
- The doctor prescribed demeclocycline hydrochloride for the infection.
- Demeclocycline hydrochloride is sold under the trade name Declomycin.
