simpleMeaning: a style of dress for women that copies the cloaks worn by men in the Near East
scope: A women's dress style copied from men's cloaks in the Near East, also called caftan. Not the men's
  cloak itself.
examples:
- She chose a loose summer kaftan in the style of the cloaks men wear in the Near East.
- The designer showed a new kaftan for women, based on the old men's cloaks.
