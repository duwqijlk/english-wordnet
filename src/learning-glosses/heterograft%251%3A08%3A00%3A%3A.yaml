senseId: 'heterograft%1:08:00::'
synsetId: 05591274-n
simpleMeaning: Skin or flesh from an animal of one kind, put for a short time onto a person or animal
  of another kind, as for bad burns.
scope: Skin or flesh from one kind of animal put for a short time onto another kind, as for bad burns;
  not a graft from the same kind of animal, and not a lasting graft.
examples:
- Doctors used a heterograft from a pig to cover the burn for a few days.
- The heterograft stayed on the wound only until the patient's own skin could heal.
