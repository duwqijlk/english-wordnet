simpleMeaning: a kind of English tree with branches that stand straight up and leaves wider than those
  of other kinds of the same tree
scope: 'Also called guernsey elm: a kind of English tree with straight up branches and wide leaves, not
  a tree with low, spread out branches and not a small tree.'
examples:
- The wheately elm in the park has branches that rise straight up.
- Gardeners plant the wheately elm for its wide leaves.
