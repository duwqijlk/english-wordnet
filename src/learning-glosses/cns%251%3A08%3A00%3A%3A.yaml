simpleMeaning: The part of the nervous system of animals with backbones that is made of the brain and
  the cord in the back.
scope: The brain and spinal cord together, also called central nervous system and systema nervosum centrale,
  set apart from the nerves outside them by their place in the head and back.
examples:
- The CNS controls the body.
- An injury to the CNS can harm movement.
