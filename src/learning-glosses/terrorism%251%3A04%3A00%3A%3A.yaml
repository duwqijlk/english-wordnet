simpleMeaning: the planned use of violence, or the threat of violence, against people who are not soldiers,
  to reach political, religious, or belief aims, by making people afraid or forcing them
scope: Also called act of terrorism and terrorist act. This is planned violence against people who are
  not soldiers to reach political, religious, or belief aims, not a single act of harm with no such aim.
examples:
- The bombing of the market was an act of terrorism.
- The government made new laws to stop terrorism.
