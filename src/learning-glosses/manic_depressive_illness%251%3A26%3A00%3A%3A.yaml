simpleMeaning: A mind sickness with times of high wild moods and times of deep low moods
scope: Also called bipolar disorder, manic-depressive psychosis and manic depression; a mind illness with
  high and low moods, not a short bad mood and not a mind illness of one mood only.
examples:
- Manic depressive illness brings high wild moods and deep low ones.
- His manic depressive illness was treated with care.
