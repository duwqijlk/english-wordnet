simpleMeaning: A sign that the power is on or a machine is running, given by a small light
scope: Also called an indicator lamp or a pilot light, this is a small light that shows whether power
  is on or a machine is running, not a big lamp that lights a room.
examples:
- The pilot lamp on the panel glowed green when the power came on.
- When the motor stopped, the pilot lamp went dark.
