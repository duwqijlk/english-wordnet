simpleMeaning: a small sticky piece of paper stuck on a letter or package to show that the cost of sending
  it has been paid
scope: 'Also called a stamp or a postage stamp: the small sticky paper on a letter or package, not the
  cost of sending it and not a mark made by pressing a shape into ink.'
examples:
- The postage on the corner of the letter was blue and square.
- I licked the postage and pressed it onto the envelope.
