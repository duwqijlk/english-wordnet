simpleMeaning: The process by which a man takes on the marks of a woman, losing face hair or growing breasts,
  because of a hormone disorder or because he has been castrated.
scope: The process by which a man takes on the marks of a woman, also called feminisation.
examples:
- Feminization can follow a disorder of the hormones.
- After castration, feminization changed the shape of his body.
