simpleMeaning: In music, an instrument you blow into that is not part of the brass family, such as a flute,
  clarinet, or bassoon.
scope: This is a musical instrument, not the hard material trees are made of, not a densely wooded area,
  and not the long-shafted golf club.
examples:
- The wood enters quietly after the brass fanfare.
- The arranger gave the melody to the wood rather than the strings.
