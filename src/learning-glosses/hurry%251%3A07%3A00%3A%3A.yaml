simpleMeaning: excessive speed driven by eagerness, which may bring carelessness
scope: The quality of being too eager for speed, not the act of moving carelessly fast or a situation
  that forces you to move fast.
examples:
- His hurry led him to make careless mistakes.
- There was a nervous hurry in the way she packed her bags.
