simpleMeaning: An essential amino acid in proteins, needed for children's growth and lifelong protein
  metabolism, abundant in milk and eggs, and normally turned by the body into tyrosine, an amino acid.
scope: An amino acid needed for growth and protein processing, not a protein or a supplement.
examples:
- Phenylalanine is needed for children to grow and for protein metabolism in adults.
- Milk and eggs contain a lot of phenylalanine, and the body normally turns it into tyrosine.
