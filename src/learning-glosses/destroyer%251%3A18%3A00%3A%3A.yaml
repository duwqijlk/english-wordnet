simpleMeaning: a person who breaks things completely, ruins them, or leaves a place badly damaged
scope: This is a person, also called waster and ruiner. It is not the other sense of the same word, a
  small, fast warship with many guns.
examples:
- He was a destroyer of books, tearing pages out of every one he touched.
- As a destroyer of old buildings, she made her living pulling houses down.
