simpleMeaning: A small ten-legged animal with a hard shell that lives in fresh water and looks much like
  a lobster.
scope: Also called a crawfish, a crawdad, or a crawdaddy, a small freshwater animal like a lobster, not
  the warm-water kind without claws, not the large sea kind, and not the tiny kind usually boiled briefly.
examples:
- He caught a crayfish in the stream.
- The crayfish hid under a stone in fresh water.
