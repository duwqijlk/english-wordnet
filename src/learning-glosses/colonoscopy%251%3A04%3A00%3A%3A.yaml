simpleMeaning: a test using a thin tube with a camera to look inside the large gut from its start to its
  end; it needs drugs that make the person sleepy
scope: This is a test to look inside the large gut, not an operation to treat an illness and not a test
  of the stomach.
examples:
- The doctor booked a colonoscopy to check for problems in her gut.
- He felt sleepy after his colonoscopy because of the drugs he was given.
