simpleMeaning: A state of the blood and body tissues in which acid runs too low.
scope: This is the name for that state of the blood and body tissues, wherever in the body it shows.
examples:
- The blood test showed alkalosis, with too little acid in the blood.
- The blood work showed alkalosis in the blood and the other tissues too.
