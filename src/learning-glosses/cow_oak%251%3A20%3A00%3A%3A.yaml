simpleMeaning: Its lasting wood serves as timber or is split and woven into baskets or chair seats; this
  medium to large oak of the eastern United States sheds its leaves yearly.
scope: Also called basket oak; it is a medium to large oak whose wood is used as timber or woven into
  baskets and chair seats.
examples:
- The cow oak sheds its leaves yearly.
- The cow oak gives wood for baskets and chair seats.
