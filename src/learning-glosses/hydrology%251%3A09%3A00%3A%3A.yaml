simpleMeaning: 'In geology, the study of water on the earth and in the air: where it is found, how it
  is used, and how it is kept.'
scope: In geology, the study of water on the earth and in the air, not oceanography and not meteorology.
examples:
- She studied hydrology to learn how rivers are fed.
- Hydrology helps towns plan their water supply.
