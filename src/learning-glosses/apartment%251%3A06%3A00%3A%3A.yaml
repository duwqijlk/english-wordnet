simpleMeaning: A home made up of several rooms, typically all on the same level of a larger residential
  building.
scope: A home of several rooms on one floor of a larger building; 'flat' is another name for this same
  sense, not a rival, and it is not a single room or a whole house.
examples:
- They rented a small apartment near the university.
- Her apartment is on the top floor of a five-story building.
