simpleMeaning: In Islam, a dark-eyed virgin of perfect beauty who, it is believed, lives with the blessed
  in Paradise.
scope: In Islam, a dark-eyed virgin of perfect beauty believed to live with the blessed in Paradise, not
  an angel and not a nymph.
examples:
- The poet dreamed of houris waiting in Paradise.
- In the old tale, a houri welcomed the blessed into Paradise.
