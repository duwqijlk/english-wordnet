simpleMeaning: A way of being sure, ready to agree, and firm in saying what one holds, with no room for
  doubt
scope: A way of being sure, ready to agree, and firm in saying what one holds, with no room for doubt;
  positivity and positivism are other names for this sense, not doubt and not a quiet open mind.
examples:
- Her positiveness left no room for doubt.
- The positiveness of his answer surprised us.
