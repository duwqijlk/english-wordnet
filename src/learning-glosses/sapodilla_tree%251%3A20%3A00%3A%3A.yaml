simpleMeaning: a tall tree from tropical America, green all year, whose sap gives chewing gum and whose
  fruit people eat; sometimes put with the group Achras
scope: A tall tree from tropical America giving chewing gum and fruit to eat, not a tree grown only for
  its wood; sapodilla is another name for this sense.
examples:
- The sapodilla tree by the road drops sweet fruit.
- Farmers cut the sapodilla tree to get sap for gum.
