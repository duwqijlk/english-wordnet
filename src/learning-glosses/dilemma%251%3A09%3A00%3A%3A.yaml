simpleMeaning: A state of not knowing what to do, most of all when you must pick between two choices that
  are both bad
scope: This is being stuck between two bad choices, not simply being unsure about one thing.
examples:
- 'She faced a dilemma: stay and lose the job, or leave and lose her home.'
- His dilemma was whether to tell the truth and hurt his friend.
