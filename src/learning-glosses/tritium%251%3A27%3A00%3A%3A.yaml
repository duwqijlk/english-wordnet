simpleMeaning: A kind of hydrogen that gives off rays, whose atoms weigh three times as much as the atoms
  of plain hydrogen.
scope: This is a kind of hydrogen that gives off rays, whose atoms weigh three times as much as the atoms
  of plain hydrogen; plain hydrogen does not give off rays.
examples:
- Tritium gives off rays, unlike plain hydrogen.
- Atoms of tritium weigh three times as much as atoms of plain hydrogen.
