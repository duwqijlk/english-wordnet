simpleMeaning: not seeing what your acts will lead to, because you have lots of money
scope: Not seeing what your acts will lead to because you have lots of money, not a lack of brains and
  not a lack of care for others.
examples:
- His affluenza kept him from seeing how his spending hurt his family.
- Affluenza can make rich young people act as if rules do not touch them.
