simpleMeaning: A soft white, a little off pure white, like the white of bleached bone
scope: A soft white like bleached bone, also called bone and pearl, not the hard pale stuff of tusks.
examples:
- She wore an ivory dress to the wedding.
- The walls were painted ivory, a soft pale white.
