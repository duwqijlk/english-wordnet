simpleMeaning: 'European weed, common in the southwestern United States and Mexico: reddish trailing stems,
  small fern-like leaves, reddish-lavender flowers and slender upright fruits; often grown to feed animals.'
scope: This is the low forage weed, not the timepieces spelled the same way and not the similar musk clover.
