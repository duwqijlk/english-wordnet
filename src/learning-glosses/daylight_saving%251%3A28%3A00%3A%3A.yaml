simpleMeaning: The hours when clocks are put one hour ahead of the usual local hours, widely used in summer
  to give more light from the sun in the evenings.
scope: The hours when clocks run one hour ahead in summer; daylight-saving time, daylight-savings time
  and daylight savings are other names for it, not the usual local hours and not a change of time zone.
examples:
- Daylight saving starts in spring.
- During daylight saving the evenings stay light longer.
