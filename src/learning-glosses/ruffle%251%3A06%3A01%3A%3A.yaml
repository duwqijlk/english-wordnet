simpleMeaning: a thin strip of cloth with many small folds along it, used to make clothes look pretty
  or to finish an edge
scope: A folded strip of cloth used on clothes, not the act of folding cloth into folds and not walking
  in a proud way.
examples:
- The dress had a white ruffle around the neck.
- She sewed a ruffle to the edge of the skirt.
