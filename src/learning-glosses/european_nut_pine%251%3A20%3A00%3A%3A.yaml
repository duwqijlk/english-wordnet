simpleMeaning: A mid-sized two-needle tree of southern Europe with a wide crown, grown widely for its
  sweet seeds, like almonds.
scope: Also called stone pine, umbrella pine, and Pinus pinea; a southern European pine grown for its
  sweet seeds.
examples:
- The European nut pine drops sweet seeds in autumn.
- We sat under a European nut pine at lunch.
