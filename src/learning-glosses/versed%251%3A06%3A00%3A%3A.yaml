simpleMeaning: A drug put in by needle, one of the benzodiazepines (drugs that calm), that eases pain
  during a medical test or treatment that would hurt.
scope: A drug put in by needle that calms and eases pain, also called midazolam; not a pill and not a
  drug for sleep at home.
examples:
- The nurse gave him Versed before the test.
- Versed kept him calm and eased his pain during the test.
