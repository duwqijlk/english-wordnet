simpleMeaning: In the Romance languages, it points to only some of a thing or group, not the whole of
  it
scope: In the Romance languages, to do with a part of a whole or a smaller amount, not a whole thing and
  not a total.
examples:
- In French, 'du pain' is a partitive phrase meaning some bread.
- The partitive construction shows only a share of the whole.
