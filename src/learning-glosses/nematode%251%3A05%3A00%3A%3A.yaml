simpleMeaning: Small worms not divided into sections, with long round bodies pointed at both ends, mostly
  living free, though some live as parasites.
scope: Small worms with long round bodies pointed at both ends, also called nematode worm and roundworm;
  not an earthworm and not a flatworm.
examples:
- The soil was full of tiny nematodes.
- Some nematodes live as parasites in plants and animals.
