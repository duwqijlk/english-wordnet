simpleMeaning: A person or thing that has been made warm or hot, and in some local speech people use a
  short form of 'heated' to say it
scope: A person or thing made warm or hot, also called heated, het and heated up, not a person worked
  up with anger and not a thing that gives off heat.
examples:
- He was all het up and sweaty after his run.
- The pool was het up for the morning swim.
