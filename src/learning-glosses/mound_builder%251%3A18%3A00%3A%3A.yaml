simpleMeaning: Peoples of America from before written history who built heaps of earth for worship.
scope: This is about the first peoples of America, before written records, who made heaps of earth as
  places of worship, unlike later peoples in America and unlike peoples who made heaps for other uses.
examples:
- The Mound Builders lived long ago in America.
- Archaeologists study Mound Builder earthworks.
