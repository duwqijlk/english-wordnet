synsetId: 14989676-n
simpleMeaning: a plastic of cellulose nitrate and camphor that burns very easily, once used for motion-picture
  and X-ray film but now largely replaced by plastics that will not catch fire
scope: The plastic itself; not the film medium and not the adjective meaning artificial or fake.
examples:
- The old film reels were made of celluloid and had to be stored carefully.
- Celluloid was widely used for photographic film before safer plastics appeared.
