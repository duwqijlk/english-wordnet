simpleMeaning: A strong poison from the mould Aspergillus that can cause cancer; it can be made and kept
  as a bioweapon, a weapon that uses germs or poisons.
scope: A mould makes this poison, which can cause cancer and can be kept as a weapon that uses germs or
  poisons.
examples:
- The lab found aflatoxin in a batch of stored grain.
- The grain was tested for aflatoxin before it was sold as food.
