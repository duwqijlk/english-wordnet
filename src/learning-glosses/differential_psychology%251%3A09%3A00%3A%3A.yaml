simpleMeaning: the part of the study of the mind that looks at ways in which people differ from each other
  that can be measured
scope: The part of the study of the mind that looks at ways in which people differ from each other that
  can be measured, not a machine for working out sums and not the study of the mind in general.
examples:
- She took a course in differential psychology to learn how test scores vary between people.
- Differential psychology looks at why one person learns faster than another.
