simpleMeaning: In poetry, a line of verse that lacks a syllable in its last group of beats.
scope: In poetry, a line of verse that lacks a syllable in its last group of beats; not a full line of
  verse, and not a line of prose.
examples:
- The catalectic line ends one syllable short.
- Poets use a catalectic line for a broken rhythm.
