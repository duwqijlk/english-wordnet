simpleMeaning: a few people meet with a trained helper to talk through their troubles, and the talk between
  them is itself part of the help they get
scope: A few people meet with a trained helper to talk through their troubles, also called group therapy,
  not one person meeting a helper alone and not a class or a lecture.
examples:
- She joined group psychotherapy to talk about her fears with others.
- In group psychotherapy, the members learn from each other as well as from the helper.
