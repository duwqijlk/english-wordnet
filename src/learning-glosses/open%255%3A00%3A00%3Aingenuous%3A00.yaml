simpleMeaning: honest and direct, saying what you think without holding back or keeping secrets.
scope: This is not about a relaxed body or a lack of tension; it describes a person or manner that hides
  nothing.
examples:
- She was open about her doubts from the start.
- The mayor gave an open account of what had gone wrong.
