simpleMeaning: A field of learning that brings together many subjects to learn about one place, country,
  or way of life.
scope: A field of learning about one place, country, or way of life, bringing many subjects together;
  not the study of one subject alone and not language learning.
examples:
- Area studies helped her understand the history of the region.
- He took a course in area studies at university.
