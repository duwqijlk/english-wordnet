simpleMeaning: a person who stands on a subway train or a bus and holds on to a hanging band for support
scope: A standing rider on a train or bus who holds on for support, not a seated passenger and not a driver.
examples:
- The straphanger held on tight as the subway car swayed.
- Every morning the straphanger stood by the door of the bus.
