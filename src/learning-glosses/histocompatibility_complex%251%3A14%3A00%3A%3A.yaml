simpleMeaning: On the sixth human chromosome, a family of fifty or more genes makes proteins on cell surfaces
  and helps the body fight off illness.
scope: A family of fifty or more genes on the sixth human chromosome, it makes proteins on cell surfaces
  and plays a part in how the body fights off illness.
examples:
- The histocompatibility complex sits on the sixth human chromosome.
- Genes in the histocompatibility complex code for proteins on cell surfaces.
