simpleMeaning: Suffering from jaundice, a condition that turns the skin and the whites of the eyes an
  unnatural golden colour.
scope: This describes a sick person's skin and eyes in jaundice, not the ordinary colour of an object,
  and not something that has faded with age.
examples:
- The baby's skin looked yellow, so the doctor tested him for jaundice.
- Her eyes had turned yellow and she was admitted to hospital.
