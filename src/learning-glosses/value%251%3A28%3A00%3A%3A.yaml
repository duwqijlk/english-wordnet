simpleMeaning: In music, how long one note lasts compared with another.
scope: This is not a number measured or assigned, the worth or desirability of something, a fair price,
  the lightness or darkness of a color, or an ideal held by a person or group.
examples:
- A half note has twice the value of a quarter note.
- The value of each note tells the player how long to hold it.
