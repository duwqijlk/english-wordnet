simpleMeaning: to hit a person on the bottom with an open hand, as a way to punish them
scope: This means hitting a person on the bottom with an open hand to punish them; it is not a hit on
  any other part of the body.
examples:
- She spanked the child after he threw his food on the floor.
- The teacher was not allowed to spank any of the pupils.
