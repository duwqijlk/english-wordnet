simpleMeaning: Describes a substance, especially a strong acid, that can destroy other things or slowly
  wear them away by a chemical change
scope: Also called corrosive, mordant, vitriolic, and erosive. It describes a substance that eats things
  away; it is not the noun naming such a substance, not harsh speech, and not a curve of light.
examples:
- The caustic liquid slowly ate a hole in the metal pipe.
- Workers wear thick gloves when they handle caustic chemicals.
