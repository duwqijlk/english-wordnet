simpleMeaning: A state in which the blood holds less carbon dioxide than normal, which deep or fast breathing
  can cause.
scope: A state in which the blood holds too little carbon dioxide, also called acapnia; not the opposite
  state, in which the blood holds too much of the gas.
examples:
- Deep, fast breathing left her with hypocapnia, and she felt light-headed.
- The doctor said the hypocapnia came from breathing too deeply during the test.
