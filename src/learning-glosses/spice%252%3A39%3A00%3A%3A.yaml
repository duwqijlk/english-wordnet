simpleMeaning: to add herbs or other plant parts with a strong taste or smell to food
scope: To put more taste into food, not the plant substance itself and not the strong taste that food
  has.
examples:
- She spiced the soup with pepper and herbs.
- He likes to spice his rice with hot peppers.
