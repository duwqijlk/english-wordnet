simpleMeaning: A drug (trade name Nalline) that works against narcotics, especially against poisoning
  by morphine.
scope: Sold under a trade name, it undoes what narcotics do, above all when morphine has poisoned.
examples:
- Too much morphine can be undone by nalorphine.
- The nalorphine stopped the morphine from working.
