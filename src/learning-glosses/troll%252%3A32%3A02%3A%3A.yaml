simpleMeaning: to speak, or to say words from memory, either fast or in a steady, flowing voice
scope: To speak fast or in a rolling voice, not to sing loudly and not to fish with a pulled line.
examples:
- She trolled the long list of names without stopping.
- He trolled off the poem in a deep, rolling voice.
