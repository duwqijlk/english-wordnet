simpleMeaning: A woodwind instrument with two reeds, the tenor of the oboe family, which sounds lower
  than the oboe.
scope: A double-reed woodwind, the tenor of the oboe family; not the oboe itself and not a horn.
examples:
- She played the bassoon in the school orchestra.
- The bassoon sounded low and warm beneath the violins.
