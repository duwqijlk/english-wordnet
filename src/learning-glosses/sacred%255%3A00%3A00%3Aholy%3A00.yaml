simpleMeaning: kept as holy for a god, for a religious ceremony, or for religious use, because it was
  made holy, said to be holy, or thought to be holy
scope: Seen as holy and set apart for a god or for religion; not just respected or important in everyday
  life.
examples:
- Pilgrims visited the sacred mosque at dawn.
- The bread and wine are sacred to them.
