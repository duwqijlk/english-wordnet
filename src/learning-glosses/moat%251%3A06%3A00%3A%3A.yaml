simpleMeaning: A ditch dug round a strong place for defence, usually full of water.
scope: A ditch dug round a strong place for defence, usually full of water, not a river and not a wall.
examples:
- The castle moat was full of dark water.
- They crossed the moat by a wooden bridge.
