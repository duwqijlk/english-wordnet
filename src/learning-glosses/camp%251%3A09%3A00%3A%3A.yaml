simpleMeaning: Something people find funny because it is so unoriginal rather than because it is new.
scope: Something amusing because it is unoriginal, not a place of shelter for displaced people and not
  exaggerated bad taste.
examples:
- The hotel lobby is pure camp, all gold mirrors and fake marble.
- The film's costumes are sheer camp, and that is exactly why people watch it.
