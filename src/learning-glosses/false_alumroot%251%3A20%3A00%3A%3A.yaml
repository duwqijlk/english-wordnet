simpleMeaning: A clump-forming plant with leaves mostly at the base and fringed cream or pale pink flowers
  on several long spikes, ranging from Alaska through coastal California to Idaho.
scope: Another name for fringe cups; it is a wild clump-forming plant of the Pacific coast, not true alumroot.
examples:
- False alumroot grows in shady clumps along the coastal trail.
- We found false alumroot blooming beside a creek in Oregon.
