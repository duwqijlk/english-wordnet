simpleMeaning: The wheat grain in full, with its hard outer coat left in, ground up; in Britain this is
  the name used.
scope: Also called graham, graham flour, and whole wheat flour, this is the wheat grain in full, ground
  up with its hard outer coat left in, the name used in Britain, unlike white flour, from which the coat
  is taken out.
examples:
- She baked bread with whole meal flour.
- The recipe asked for whole meal flour, not white flour.
