simpleMeaning: to feel care for another person in pain or trouble, or to show this care in words or actions
scope: 'Also called sympathize: to feel and show care for a person in pain or trouble; not just to agree
  with a person''s ideas.'
examples:
- I sympathise with parents who have to work long hours and still care for sick children.
- She sympathised with him after his mother died.
