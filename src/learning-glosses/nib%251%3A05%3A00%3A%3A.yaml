simpleMeaning: the hard mouth of a bird that sticks out from its face
scope: 'Also called bill, beak, pecker and neb: the hard mouth of a bird. This is not the pointed metal
  tip of a pen, which is another sense of nib.'
examples:
- The duck used its flat nib to take food from the water.
- The small bird cracked the seed with its sharp nib.
