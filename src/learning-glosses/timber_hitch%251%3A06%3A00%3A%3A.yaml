simpleMeaning: To hold a log or a long pole fast, a rope is tied round it in a knot that often has a second,
  smaller knot to back it up.
scope: Ropes are tied round logs and long poles with this knot, which often adds a second, smaller knot
  to back it up.
examples:
- The rope held because the timber hitch was tied tight round the log.
- They used a timber hitch to fasten the rope to the spar.
