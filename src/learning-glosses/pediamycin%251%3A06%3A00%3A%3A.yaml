simpleMeaning: An antibiotic from the soil germ Streptomyces erythreus, sold under several brand names;
  it works against many Gram-positive germs and some Gram-negative ones.
scope: Also called erythromycin, E-Mycin, Erythrocin, Ethril, and Ilosone; an antibiotic that works against
  many Gram-positive germs, not a painkiller and not a vitamin.
examples:
- The doctor gave her Pediamycin for the infection.
- Pediamycin works against many Gram-positive bacteria.
