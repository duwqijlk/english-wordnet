simpleMeaning: The hidden part of the mind that a person carries inside, apart from the face they show
  the world, is what this word names in Jungian psychology.
scope: In Jung's picture of the mind, this word names the inner self, as against the face a person shows
  the world.
examples:
- Through the anima, a person meets the hidden part of the mind.
- The anima worked apart from the face the person showed the world.
