simpleMeaning: 'a unit for inductance (a measure of how much voltage a changing current makes in a circuit):
  one volt is made when the current changes by one ampere each second'
scope: This is a unit for measuring inductance in science, not a person's name and not a unit for electric
  current itself.
examples:
- The coil has an inductance of two henries.
- The teacher said the coil measured one henry.
