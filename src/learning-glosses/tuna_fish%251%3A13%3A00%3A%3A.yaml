simpleMeaning: An oily sea creature of warm seas, prized as food, from the group Thunnus of the mackerel
  family, most often served in thick slices
scope: This is an oily sea creature of warm seas, prized as food and most often served in thick slices,
  also called tuna and tunny; not a mackerel and not a white fish served whole.
examples:
- The tuna fish was served as steaks with lemon.
- We caught a tuna fish in the warm waters off the coast.
