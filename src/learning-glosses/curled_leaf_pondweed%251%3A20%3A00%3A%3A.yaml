simpleMeaning: In the east of the United States and in California this plant from Europe now grows wild.
scope: 'Also called curly pondweed: a plant from Europe, now wild in the east of the United States and
  in California; not a plant that only grows in Europe and not a sea plant.'
examples:
- Curled leaf pondweed now grows in many slow rivers in the east.
- We found curled leaf pondweed along the edge of the lake in California.
