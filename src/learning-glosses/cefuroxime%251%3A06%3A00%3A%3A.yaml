simpleMeaning: A cephalosporin antibiotic that can be injected or taken as tablets under the brand names
  Zinacef and Ceftin, used for infections of the lungs, throat, ears, urinary tract, and meninges.
scope: This is the drug itself; Zinacef and Ceftin are trade names for this same antibiotic, not different
  medicines.
examples:
- The doctor prescribed cefuroxime for a throat infection.
- Cefuroxime can also be given by injection in hospital.
