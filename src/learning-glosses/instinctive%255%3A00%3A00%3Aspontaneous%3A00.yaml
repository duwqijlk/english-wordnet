simpleMeaning: done without thinking, driven by a natural urge that people and animals are born with,
  or as if driven by such an urge
scope: 'Another name for this sense is natural: done without thinking because of an urge a person is born
  with, not a skill learned by study or practice.'
examples:
- Her instinctive move saved the child from falling.
- Offering to help was instinctive for him.
