simpleMeaning: A person who keeps their mind on a problem just as it is given, and puts facts and what
  they know together to find an answer
scope: This is a person who works on the problem as given to reach one answer, also called a convergent
  thinker; not a thinker who looks for many new and different ideas.
examples:
- As a solver, he kept to the problem as written and joined the facts to reach one answer.
- A good solver puts all the given facts together before choosing an answer.
