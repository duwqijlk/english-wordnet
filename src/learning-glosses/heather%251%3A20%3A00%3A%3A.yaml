simpleMeaning: A low plant that stays green all year, a common kind from the Old World with many forms,
  grown widely in the north of the world.
scope: A low green plant of the Old World, also called broom and ling, and not cloth of mixed-color yarns.
examples:
- Heather covered the hillside in purple flowers.
- The moor was thick with heather in late summer.
