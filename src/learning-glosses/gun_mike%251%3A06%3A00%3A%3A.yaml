simpleMeaning: A long tube that takes in sound from one narrow place, and a person can aim it from far
  off
scope: 'Another name for gun microphone: a long sound-catching tube aimed from far off, not a hand-held
  microphone and not a radio.'
examples:
- He held a gun mike over the crowd to catch the speaker's voice.
- The gun mike picked up the whisper from the far end of the hall.
