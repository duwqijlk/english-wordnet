scope: Also called single-leaf or a single-leaf pinyon, it is a tree of the southwest of the United States
  with needles one by one and nuts people value.
examples:
- The single-leaf pine bears its needles one by one, not in pairs.
- People gather the nuts of the single-leaf pine, which often has many trunks.
