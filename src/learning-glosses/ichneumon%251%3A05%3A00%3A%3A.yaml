simpleMeaning: A mongoose from the north of Africa, long ago thought to eat the eggs of crocodiles.
scope: A mongoose from the north of Africa, long ago thought to eat crocodile eggs, not the wasp that
  lays eggs in other insects and not a mongoose from Asia.
examples:
- The ichneumon slipped through the reeds by the river.
- Long ago people thought the ichneumon ate crocodile eggs.
