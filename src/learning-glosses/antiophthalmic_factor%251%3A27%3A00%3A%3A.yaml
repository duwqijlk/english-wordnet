simpleMeaning: Needed for good sight, any of several vitamins of this kind dissolve in fat and keep off
  poor sight at night, swollen sore eyes, or dry eyes.
scope: 'Also called axerophthol: a vitamin that keeps sight working, while other vitamins build bones
  or heal wounds.'
examples:
- The antiophthalmic factor is one of several vitamins needed for good sight.
- The antiophthalmic factor keeps off poor sight at night and dry eyes.
