simpleMeaning: A group of small leaf-like parts that looks like the outer cup of a flower, as in a carnation
  or hibiscus.
scope: A group of small leaf-like parts that looks like the outer cup of a flower, as in a carnation or
  hibiscus, also called a calycle, a calyculus or an epicalyx; not a true outer cup and not a petal.
examples:
- The false calyx of the carnation looks like a second cup.
- Hibiscus flowers show a false calyx below the petals.
