simpleMeaning: A meeting of the Western Church in 1139 that put an end to the false teaching of Arnold
  of Brescia.
scope: This is a meeting of the Western Church in 1139 that ended the false teaching of Arnold of Brescia,
  not the first meeting of the same name and not a meeting of the Eastern Church.
examples:
- The Second Lateran Council met in 1139.
- The Second Lateran Council put an end to the errors of Arnold of Brescia.
