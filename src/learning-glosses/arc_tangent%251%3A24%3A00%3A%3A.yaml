senseId: 'arc_tangent%1:24:00::'
synsetId: 13810394-n
simpleMeaning: In maths, the angle that has a given number as the ratio of the side across from it to
  the side next to it in a right-angled triangle.
scope: 'Also called arctan, arctangent, and inverse tangent: the angle worked out from a given number,
  not the tangent itself and not the angle from a different triangle ratio.'
examples:
- The arc tangent of 1 is 45 degrees.
- He worked out the arc tangent before drawing the angle.
