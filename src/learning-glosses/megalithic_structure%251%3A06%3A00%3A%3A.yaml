simpleMeaning: A memorial made of a very large stone that forms part of a prehistoric monument, above
  all in western Europe
scope: A memorial of very large stone from prehistoric times; megalith is another name for this, not a
  small grave marker and not a building of modern times.
examples:
- The megalithic structure stood on the hill for thousands of years.
- Visitors walked around the megalithic structure in western Europe.
