simpleMeaning: a group of Persian or Arabic poems put together in one book, usually by one writer
scope: 'Also called diwan: this is a book of Persian or Arabic poems, usually by one writer, not the long
  seat with no back that has the same name.'
examples:
- He read a divan of old Persian poems.
- The divan holds poems by one Arab writer.
