simpleMeaning: most often used of muscles that draw parts in toward the centre line of the body or toward
  a part next to them
scope: A word for a muscle that draws parts in toward the centre line of the body or toward a part next
  to it, also called adducent or adductive; not a muscle that moves parts away from the body.
examples:
- The adducting muscles in his legs brought his knees together.
- Adducting muscles pull the fingers toward the middle finger.
