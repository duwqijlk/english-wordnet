simpleMeaning: red flowers like peas hang in loose bunches on any of many shrubs or climbing plants with
  leaves made of small leaflets
scope: 'Also called glory pea: a shrub or vine with red pea-like flowers hanging in bunches, not a true
  pea plant.'
examples:
- Clianthus grew over the fence, its red flowers hanging in bunches.
- The clianthus in the garden had leaves made of small leaflets.
