simpleMeaning: The course of a single creature growing of itself, a purely natural unfolding, as it moves
  bit by bit from plain beginnings to a richer build.
scope: In biology, the course of a single creature growing of itself, a purely natural unfolding, as it
  moves bit by bit from plain beginnings to a richer build; also called growing, development, growth,
  ontogenesis, or ontogeny; not, in medicine, the forming of foul matter in a sore or blister, and the
  letting out of pus, nor the coming to full growth, the becoming of full age.
examples:
- Their maturation took years.
- The maturation was plain in the child.
