simpleMeaning: When a car won't start because its battery is dead, to use another vehicle's battery to
  get the engine running.
scope: This is about reviving a car with a flat battery from another vehicle, not about leaping into the
  air, not about coming down by parachute, and not about a sudden rise in an amount or level.
examples:
- Can you jump my car? The battery has been dead since this morning.
- We jumped the van from a passing truck and drove straight to the garage.
