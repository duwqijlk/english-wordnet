simpleMeaning: a state in which a person cannot keep the fluids the body makes inside the body
scope: This is a state in which a person cannot hold in the fluids the body makes, not a lack of fluids
  and not trouble passing waste.
examples:
- His acathexia meant he could not hold in the fluids his body made.
- Acathexia left her unable to keep her body's fluids inside.
