simpleMeaning: A child's family connection to its mother and father.
scope: The family tie between a child and its parents, not the event of being born and not the act of
  giving birth.
examples:
- Under the old law, birth to an enslaved mother meant a life of servitude.
- Her birth to the king's mistress gave her no claim to the throne.
