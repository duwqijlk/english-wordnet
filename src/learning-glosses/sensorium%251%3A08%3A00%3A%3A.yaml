simpleMeaning: the parts of the brain that take in and record what the senses report, so a person knows
  the world around them
scope: The parts of the brain that let a person know the world from what the senses report; not the nerves
  that carry the signals, and not the parts of the brain that move the body.
examples:
- The sensorium lets us know the world around us from what we see and hear.
- Damage to the sensorium can leave a person unable to make sense of what the senses report.
