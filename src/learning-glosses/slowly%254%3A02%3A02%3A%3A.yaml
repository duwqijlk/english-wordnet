simpleMeaning: at a low speed, taking a long time to do something or to happen
scope: The everyday adverb for a low rate of movement, with the bare word 'slow' sometimes used informally
  instead; not the adjective describing something as not fast.
examples:
- He spoke slowly so that everyone could follow.
- The old bus climbed the hill slowly.
