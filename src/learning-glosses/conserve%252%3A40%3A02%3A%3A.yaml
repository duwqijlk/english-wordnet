simpleMeaning: To keep a thing safe and guard it from harm, rot, loss, or being destroyed
scope: Maintain and preserve are other names for this sense; this is about keeping a thing safe from harm,
  not fruit cooked with sugar and not keeping a thing the same through change.
examples:
- The museum curator conserved the ancient manuscripts.
- Children must be taught to conserve our national heritage.
