simpleMeaning: A powder of gypsum plaster and glue that makes a soft workable paste when mixed with water,
  used to fill cracks and holes in plaster.
scope: This powdered plaster filler, not plaster of Paris or ready-mixed joint compound; 'spackling compound'
  is another name for it.
examples:
- She mixed the spackle with water until it formed a smooth paste.
- He pressed spackle into the cracks in the plaster.
