simpleMeaning: With no solid form you can touch, more like a dream than a real thing.
scope: Having no solid form, and insubstantial is another name for this sense; not merely fanciful, and
  not failing to match known facts.
examples:
- The unreal figure on the horizon faded as we came near.
- It was an unreal mirage, with no solid form at all.
