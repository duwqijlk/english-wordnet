simpleMeaning: to take a thing in as part of a wider whole, covering all that falls inside your reach
scope: 'Also called cover, embrace, or comprehend: to take things in as part of a wider whole, not to
  go round the outside of them and not to leave them out.'
examples:
- This group encompasses people from many different backgrounds.
- The new rules encompass everyone in the company.
