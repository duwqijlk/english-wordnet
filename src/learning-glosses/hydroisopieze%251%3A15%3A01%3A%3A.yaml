simpleMeaning: A line on a map joining places where the water in the rock below has the same pressure.
scope: A line on a map joining places where the water in the rock below has the same pressure, not a contour
  line and not an isobar.
examples:
- The hydroisopieze showed where the well water stood at the same pressure.
- Engineers drew a hydroisopieze across the valley.
