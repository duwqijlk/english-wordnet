simpleMeaning: a broad name for step-by-step work that finds the outside forces shaping a firm, judges
  what they do, and plans how to lessen harm or make use of them
scope: A broad name for step-by-step work that finds the outside forces shaping a firm, judges what they
  do, and plans how to lessen harm or make use of them, also called business environmental analysis and
  environmental business analysis, and not a single market study or a plan for one product.
examples:
- The firm's business environment analysis showed new rules would raise costs.
- She led the business environment analysis before the board met.
