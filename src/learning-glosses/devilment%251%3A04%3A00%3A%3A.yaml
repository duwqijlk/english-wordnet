senseId: 'devilment%1:04:00::'
synsetId: 00737673-n
simpleMeaning: Mischief done with no care for what may follow, or out of spite, leaving other people uneasy
  or annoyed.
scope: Careless or spiteful mischief that upsets or annoys others, also called mischief, a shenanigan,
  devilry, roguery, roguishness, deviltry, mischief-making, or mischievousness.
examples:
- The boys' devilment kept the whole street awake.
- Her devilment was all in fun, but it still annoyed the neighbours.
