simpleMeaning: A Loloish way of speaking in southwest Yunnan, in Simao prefecture, in Menglian Dai and
  Va autonomous counties, and in Lincang prefecture, in Gengma Dai and Va autonomous counties.
scope: A way of speaking in southwest Yunnan, also called Lahu; not the people who use it and not another
  language of the area.
examples:
- Lahu language is spoken in southwest Yunnan.
