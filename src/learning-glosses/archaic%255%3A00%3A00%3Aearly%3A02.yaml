simpleMeaning: changed very little from the early kind of living thing it came from, or like that early
  kind in how it looks and lives
scope: 'Another name for this sense is primitive: it is about living things that have changed little from
  an early kind, not about old words or old ways of doing things.'
examples:
- These archaic fish have changed little over millions of years.
- The plant keeps an archaic form like the kinds that lived long ago.
