simpleMeaning: the chief blood tube of the upper arm, coming from the armpit tube and splitting at the
  elbow into the thumb side and little finger side tubes
scope: 'Also called brachial artery: the main blood tube of the upper arm, not the blood tube of the forearm
  or the shoulder.'
examples:
- The arteria brachialis is the main blood tube of the upper arm.
- At the elbow, the arteria brachialis splits into two smaller blood tubes.
