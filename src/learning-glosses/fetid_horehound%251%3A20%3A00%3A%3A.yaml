simpleMeaning: Rings of dark purple flowers round the stem, wrinkled leaves, and a bad smell mark this
  plant from Europe.
scope: Also called black archangel, black horehound, and stinking horehound, this names the plant from
  Europe with a bad smell, wrinkled leaves, and rings of dark purple flowers.
examples:
- The fetid horehound grew thick along the old wall.
- She held her nose near the fetid horehound in the garden.
