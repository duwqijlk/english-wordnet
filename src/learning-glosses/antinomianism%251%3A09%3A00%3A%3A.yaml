simpleMeaning: This teaching about God says that through trust and God's kindness a Christian is set free
  from all rules, even the moral rules of the people around them
scope: This teaching about God says a Christian is set free from all rules, not one that binds them to
  new rules.
examples:
- Antinomianism holds that grace frees the Christian from the law.
- He turned to antinomianism and held that grace frees believers from every rule.
