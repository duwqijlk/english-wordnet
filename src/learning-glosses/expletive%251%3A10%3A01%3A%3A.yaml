simpleMeaning: a rude or bad word or words, usually said when a person is surprised or angry
scope: Also called a curse, an oath, a cuss, swearing, and a swearword. It is a rude word said in surprise
  or anger, not a word with no meaning of its own added to fill a line.
examples:
- He shouted an expletive when he hit his thumb with the hammer.
- The book printed the speech with the expletives cut out.
