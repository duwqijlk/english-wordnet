simpleMeaning: A fruit like that of the plantain, a small case whose lid falls off and lets the seeds
  out
scope: A plantain-like fruit, a case whose lid falls off to free the seeds; pyxidium is another name for
  this sense. Not a berry and not a fruit that splits open along its sides.
examples:
- The pyxis on the plantain had lost its lid.
- Each pyxis opens at the top when its seeds are ripe.
