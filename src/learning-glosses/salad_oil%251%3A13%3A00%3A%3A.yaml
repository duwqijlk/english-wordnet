simpleMeaning: one of a few kinds of plant fat that people can eat and pour over cold vegetables
scope: This is a plant fat used to dress cold vegetables, not a fat for the skin and not a solid fat like
  butter.
examples:
- She poured salad oil over the greens.
- The recipe calls for a light salad oil.
