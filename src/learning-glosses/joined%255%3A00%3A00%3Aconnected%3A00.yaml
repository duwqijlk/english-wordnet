simpleMeaning: linked together, as when one railway car or trailer is attached to another.
scope: This is not about two people or groups forming a partnership, and not about pieces being glued
  or fused into one piece; it means separate vehicles or units are connected to each other by a link.
examples:
- The joined carriages rattled along the track.
- The truck pulled two joined trailers.
