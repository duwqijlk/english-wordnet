simpleMeaning: A set of Semitic letters used since the 5th century BC for writing the language of the
  Jews, and later Yiddish and Ladino.
scope: This is a set of Semitic letters also called Hebraic alphabet and Hebrew script, not a set of letters
  for another tongue or the spoken language itself.
examples:
- The Hebrew alphabet has been used since the 5th century BC.
- Yiddish is written in the Hebrew alphabet.
