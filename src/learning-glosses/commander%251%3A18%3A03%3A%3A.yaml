simpleMeaning: A person in a post of power who can tell others what to do and make them obey.
scope: A person in a post of power who can tell others what to do, not an officer in charge of a military
  unit and not a navy rank.
examples:
- The commander of the port ran the whole harbour.
- As commander, she could order the staff to change the plan.
