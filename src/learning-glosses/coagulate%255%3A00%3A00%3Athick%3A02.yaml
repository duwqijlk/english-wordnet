simpleMeaning: changed from a liquid into a soft, partly solid or fully solid mass
scope: 'This sense is also called curdled and coagulated: it describes a liquid that has become thick,
  not the act of making a liquid thick.'
examples:
- The wound was covered in coagulated blood.
- A thick layer of coagulated milk sat at the bottom of the pan.
