simpleMeaning: The approved speech of Britain, first based on the king's speech at public schools, Oxford
  and Cambridge, used widely elsewhere in Britain; until recently the speech of British broadcasting.
scope: Also called King's English, Queen's English and Received Pronunciation; the standard way of speaking
  in Britain, not a local way of speaking and not the speech of another country.
examples:
- He studied Received Pronunciation language at university.
- Received Pronunciation language is the standard form taught to foreign learners.
