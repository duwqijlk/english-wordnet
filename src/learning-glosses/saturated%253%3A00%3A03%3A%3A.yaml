simpleMeaning: a colour in its full, strong form, with no white, grey, or black mixed in
scope: This is a colour in its full form; pure is another name for this sense; not a pale or washed-out
  colour, and not said of a chemical compound.
examples:
- The saturated red of the flag stood out against the grey sky.
- She chose a saturated blue for the bedroom wall.
