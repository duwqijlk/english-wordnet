senseId: 'cloy%2:34:00::'
synsetId: 01196465-v
simpleMeaning: to make someone have too much of something they liked at first, so they no longer want
  it
scope: 'Also called pall: to make a person tired of a thing by giving too much of it, not to make them
  ill at once.'
examples:
- The rich cake began to cloy after the third slice.
- Too much honey can cloy, even when the first taste is sweet.
