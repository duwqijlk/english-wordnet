simpleMeaning: in a very happy way, with great pleasure
scope: Doing something in a very happy way, also called gleefully and joyfully; it describes how an action
  is done, not the happy feeling itself.
examples:
- She laughed joyously when she heard the good news.
- The children sang joyously at the party.
