simpleMeaning: Where sight is sharpest, at the back of the eye, lies a tiny dip full of light-sensing
  cones.
scope: Also called fovea centralis, this names the spot at the back of the eye where sight is sharpest.
examples:
- The fovea sits at the centre of the retina.
- Reading small print uses the fovea, where sight is sharpest.
