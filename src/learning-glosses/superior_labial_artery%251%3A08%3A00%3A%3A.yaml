simpleMeaning: A blood tube that branches off the blood tube of the face and brings blood to the upper
  lip.
scope: A blood tube off the face that brings blood to the upper lip; also called arteria labialis superior;
  not a vein and not a blood tube of the lower lip.
examples:
- The superior labial artery supplies blood to the upper lip.
- A cut near the mouth may bleed from the superior labial artery.
