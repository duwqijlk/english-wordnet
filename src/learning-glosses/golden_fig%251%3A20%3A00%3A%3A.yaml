simpleMeaning: a tree of southern Florida and the West Indies that starts life on another tree and chokes
  it, growing many thick roots in the air and spreading over huge areas
scope: 'Also called strangler fig and wild fig: a tree of southern Florida and the West Indies that starts
  life on another tree and spreads over huge areas, not a fruit tree grown for eating and not a small
  garden tree.'
examples:
- The golden fig had spread its roots over the whole old wall.
- A golden fig began life high in the fork of another tree.
