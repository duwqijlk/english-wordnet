senseId: 'staggered_board_of_directors%1:14:00::'
synsetId: 08397706-n
simpleMeaning: a group that runs a company, with only some members chosen each year rather than every
  member each year
scope: A company group with some members chosen each year, not a group where every member is chosen each
  year and not the staff who do the daily work.
examples:
- The staggered board of directors chose three new members this year.
- With a staggered board of directors, only some seats change at each yearly vote.
