simpleMeaning: The path a tiny bit of an atom takes as it moves round the middle of the atom
scope: The path a tiny bit of an atom takes round the middle of the atom, not the path of a body in the
  sky and not the hollow place of bone holding the eye.
examples:
- The electron moved to a wider orbit round the nucleus.
- Physicists map the orbit of each electron.
