simpleMeaning: a length in the metric system, one tenth of a metre long
scope: A length in the metric system, one tenth of a metre long, also called a decimeter or a decimetre,
  and not a centimetre or a whole metre.
examples:
- The board is three dm long.
- One dm is one tenth of a metre.
