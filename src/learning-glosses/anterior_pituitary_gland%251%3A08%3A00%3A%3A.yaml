simpleMeaning: The front part of the small body at the base of the brain, made mostly of tissue that makes
  body chemicals
scope: The front part of the small body at the base of the brain that makes body chemicals, made mostly
  of gland stuff; adenohypophysis and anterior pituitary are other names for this sense, not the back
  part of that body and not the brain itself.
examples:
- The anterior pituitary gland makes growth chemicals.
- A scan showed a small growth on the anterior pituitary gland.
