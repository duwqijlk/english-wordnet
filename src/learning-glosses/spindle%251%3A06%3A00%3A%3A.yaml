simpleMeaning: a stick or pin used to twist thread when thread is made
scope: This is the tool for twisting thread, not the turning rod in a machine, not the thin parts seen
  when cells divide, and not a turned wood piece.
examples:
- She used a spindle to twist the wool into thread.
- The thread wound around the spindle as she worked by hand.
