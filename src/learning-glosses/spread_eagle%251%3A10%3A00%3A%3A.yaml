simpleMeaning: a picture of a bird with wings and legs stretched out, on the front of the Great Seal of
  the United States
scope: A bird picture on the front of the Great Seal of the United States, not a skating move and not
  a picture of a bird in flight.
examples:
- The spread eagle stands on the front of the Great Seal.
- You can see the spread eagle on the seal of the United States.
