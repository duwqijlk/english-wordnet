simpleMeaning: made more beautiful by a pattern that stands up from the surface, made by pressing or by
  sewing with thread
scope: 'Also called raised and embossed: it describes cloth or a surface with a pattern standing up from
  it, not a flat printed pattern.'
examples:
- She wore a dress made of brocaded silk.
- The brocaded cloth felt rough where the pattern stood up.
