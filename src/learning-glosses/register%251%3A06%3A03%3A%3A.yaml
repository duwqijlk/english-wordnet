simpleMeaning: In computer science, a part of a computer's memory with its own place, used to hold one
  kind of fact
scope: In computer science, a part of a computer's memory with its own place for one kind of fact, not
  a list of names and not a cash box that adds up a bill.
examples:
- The processor keeps the next number in a register.
- Data moved from the register to the main memory.
