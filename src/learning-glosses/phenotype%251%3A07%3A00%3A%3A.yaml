simpleMeaning: Its body's plan for life and the world around it work together to fix how a living thing
  looks
scope: What a living thing looks like, shaped by its body's plan and the world around it, not the plan
  itself and not the world alone.
examples:
- The plant's phenotype changed when it grew in poor soil.
- Two mice can have the same phenotype but different genes.
