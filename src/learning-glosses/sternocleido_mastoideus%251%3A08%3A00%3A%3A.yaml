simpleMeaning: Turning the head slantwise to the far side, one of two thick muscles joining the breastbone
  and the collarbone with the skull's back, bending neck and lifting the head together.
scope: Also called musculus sternocleidomastoideus, sternocleidomastoid, and sternocleidomastoid muscle,
  this is one of two thick muscles joining the breastbone and the collarbone with the skull's back, turning
  the head slantwise to the far side and, together, bending neck and lifting the head, where musculus
  sternocleidomastoideus is one of a pair of thick muscles running from the chest bones to the back of
  the head, that swings the head toward the far side and, acting as one, bends the neck and tips the head
  back.
examples:
- The sternocleido mastoideus turns the head to one side.
- A stiff sternocleido mastoideus makes turning the head hurt.
