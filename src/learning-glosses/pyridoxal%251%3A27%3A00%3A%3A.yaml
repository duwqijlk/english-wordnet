simpleMeaning: Without this vitamin of the B group, the body cannot break down starch or the small bits
  that build protein.
scope: Also called pyridoxine, adermin, and pyridoxamine, this B vitamin is one the body must have to
  break down protein bits and starch.
examples:
- The body needs pyridoxal to break down starch.
- The body cannot break down the small bits that build protein without pyridoxal.
