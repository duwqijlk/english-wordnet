simpleMeaning: Just under the breastbone, in the middle of the body, lies a small hollow where a blow
  can reach the bundle of nerves there.
scope: It is also called epigastric fossa, a small hollow under the breastbone where a blow can reach
  the nerves, and not the stomach itself.
examples:
- A blow to the pit of the stomach hurt.
- He felt the blow in the pit of the stomach.
