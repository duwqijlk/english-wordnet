simpleMeaning: A lamp run by power, with a clear or misted glass case holding a fine wire, usually one
  of tungsten, that shines when power heats it.
scope: Also called bulb, lightbulb, electric-light bulb, electric light, and incandescent lamp, a lamp
  run by power, with a clear or misted glass case holding a fine wire, usually one of tungsten, that shines
  when power heats it, where bulb is a power light in clear or half-clear glass, with a slim wire within
  that is usually tungsten and lights up when power heats it, and lightbulb is a power lamp under a clear
  or misted glass cover, holding a slim wire, usually a tungsten wire, that gives light when power heats
  it.
examples:
- Light bulbs shine when power heats them.
- They changed a light bulb.
