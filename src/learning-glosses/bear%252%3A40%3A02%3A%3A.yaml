simpleMeaning: Accept responsibility for costs or debts that belong to someone else.
scope: This is shouldering someone else's financial burden, not holding a title or rank, and not putting
  up with something unpleasant.
examples:
- The parent company agreed to bear the debts of its failing subsidiary.
- Taxpayers will bear the losses if the bank fails.
