simpleMeaning: Big plumes like those of the pampas plant mark this plant, often grown for its long leaves
  with white ribs.
scope: This plant, often grown for its long leaves with white ribs and its big plumes, is not the pampas
  plant itself, though its plumes only look like those of that plant.
examples:
- The wool grass shows big plumes like those of the pampas plant.
- The wool grass has long leaves with white ribs.
