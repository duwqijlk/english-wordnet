scope: The mythic fruit that triggered the Trojan War, not a real object or a general phrase for any disagreement.
examples:
- In the story, the apple of discord carried the words 'for the fairest'.
- Paris gave the apple of discord to Aphrodite, and that choice led to the Trojan War.
