simpleMeaning: too sure of oneself in a way that upsets others, and often using power over others, usually
  power that is not right to use
scope: 'Also called bossy, autocratic, peremptory, and magisterial: this describes a person who is too
  sure of themselves and often uses power over others, not a thing that stands high above other things.'
examples:
- His dominating manner made the workers afraid to speak in meetings.
- She has a dominating way of running things and never lets others decide.
