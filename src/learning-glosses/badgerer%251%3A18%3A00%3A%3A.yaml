simpleMeaning: a person who tries to shame you with mocking words, questions, and protests
scope: 'Also called a heckler: a person who tries to shame you with mocking words and questions, not a
  person who asks a fair question and not a friend who teases you in fun.'
examples:
- The badgerer kept shouting questions at the speaker until she lost her place.
- No one liked the badgerer who tried to shame the new teacher in front of the class.
