simpleMeaning: An animal without a tail, like a frog but living more on land, with dry skin covered in
  bumps.
scope: This is a land animal like a frog, not a frog itself and not a salamander; it has dry, bumpy skin.
examples:
- A true toad sat on the dry path after the rain.
- The true toad hopped away from the pond.
