senseId: 'ketosis-resistant_diabetes%1:26:00::'
synsetId: 14142418-n
simpleMeaning: A mild blood-sugar disease that develops slowly in adults; obesity, stress, menopause or
  other factors can trigger it; diet and blood-sugar-lowering drugs (hypoglycemic agents) usually control
  it without insulin.
scope: This is an old label for type 2 diabetes, named for the absence of dangerous acid build-up; it
  is not type 1 diabetes, which needs insulin, nor the form that occurs only in pregnancy.
examples:
- My father's ketosis-resistant diabetes was kept in check with tablets rather than insulin.
- The term ketosis-resistant diabetes has largely been replaced by type 2 diabetes.
