senseId: 'clause%1:10:00::'
synsetId: 06325134-n
simpleMeaning: In grammar, a part of a longer sentence that has a subject (who or what it is about) and
  a part that says what the subject does or is
scope: 'This is the grammar sense: a part of a longer sentence with a subject and a verb part. It is not
  a numbered part in a law or an agreement.'
examples:
- In 'She left because she was tired', the words 'because she was tired' form a clause.
- The clause 'when the rain stopped' is part of a longer sentence.
