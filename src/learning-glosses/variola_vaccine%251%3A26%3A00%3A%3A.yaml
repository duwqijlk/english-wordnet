simpleMeaning: A localized skin infection that follows inoculation with cowpox virus to make a person
  resistant to smallpox; it normally lasts three weeks and leaves a pitted scar.
scope: Another name for this reaction is variola vaccinia, also called vaccinia; it is the pitted spot
  that follows smallpox inoculation, not the smallpox disease or the cowpox virus used.
examples:
- The nurse checked the spot on his arm, a variola vaccine that had crusted over and would leave a small
  scar.
- A pitted scar on her shoulder was all that remained of the variola vaccine she received as a child.
