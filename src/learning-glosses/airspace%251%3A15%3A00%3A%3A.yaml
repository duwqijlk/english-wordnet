simpleMeaning: the air above a country, which is held to be under that country's control
scope: This is the air above a country, held to be under its control, not the air inside a building and
  not the space far above the earth.
examples:
- The plane was not allowed to enter the country's airspace.
- They closed their airspace to all flights that night.
