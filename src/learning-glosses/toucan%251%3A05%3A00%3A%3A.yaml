simpleMeaning: a bird of warm parts of America that lives in trees, eats fruit, has bright colors and
  a very large beak with thin walls
scope: A bird with a very large beak that lives in trees in warm parts of America and eats fruit; not
  any other bright bird with a smaller beak.
examples:
- A toucan sat in the tree, holding a piece of fruit in its huge beak.
- We saw a toucan with a bright orange beak in the forest.
