simpleMeaning: to make marks with paint on a surface, where each mark is a small dot or a short stroke
scope: Putting paint on in dots or strokes, not cutting a surface with dots and flicks, and not only making
  soft shade with short touches.
examples:
- She stippled the wall with blue paint to give it a rough look.
- The painter stippled paint onto the paper in tiny dots.
