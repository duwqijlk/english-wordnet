simpleMeaning: In physics, the share of atoms of one form of an element among all the atoms of that element
scope: In physics, the share of atoms of one form of an element among all its atoms, not how much of an
  element there is in the earth's crust.
examples:
- The abundance of that form of the element is one atom in a hundred.
- Physicists work out the abundance of each form of an element.
