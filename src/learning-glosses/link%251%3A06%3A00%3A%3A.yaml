simpleMeaning: An object whose purpose is to join or connect things.
scope: This is a physical fastener that joins or connects things, also called a tie, linkup or tie-in,
  not the state of being connected or a connecting shape.
examples:
- One link in the chain had rusted through and snapped.
- The anchor chain was joined to the boat by a heavy link.
