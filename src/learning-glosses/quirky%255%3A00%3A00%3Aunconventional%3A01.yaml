simpleMeaning: in informal use, very different from what is usual or expected, in a way that people notice
  at once
scope: 'Also called offbeat, and another name for this sense is kinky: in informal use, very different
  from what is usual; not plain or usual, and not what most people expect.'
examples:
- He has a quirky sense of humour that makes his stories stand out.
- The shop sells quirky gifts you will not find in most stores.
