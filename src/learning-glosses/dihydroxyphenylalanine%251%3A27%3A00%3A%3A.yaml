simpleMeaning: A small part that builds body proteins, made in the liver and changed in the brain into
  dopamine, a chemical that carries signals between nerve cells.
scope: A protein building block made in the liver and changed into dopamine in the brain, also called
  dopa; not dopamine itself and not a protein.
examples:
- Dihydroxyphenylalanine forms in the liver before it becomes dopamine.
- The body makes dihydroxyphenylalanine in the liver.
