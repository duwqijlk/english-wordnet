simpleMeaning: saying or making it seem that a person is guilty of a crime or is to blame for something
  wrong
scope: About words, proof or actions that point to a person's guilt; not proof that the person in fact
  did it, and not a formal charge made in court.
examples:
- The fingerprints on the knife were incriminating evidence against him.
- He gave an incriminating answer when the police asked where he had been that night.
