simpleMeaning: a defence made by the body on its own against tissue from another person of the same kind
scope: 'Another name for this is isoantibody: a defence the body makes on its own against tissue from
  another person, not a defence against germs and not a drug given by a doctor.'
examples:
- The lab found an alloantibody in her blood after the transfusion.
- An alloantibody can form when tissue from another person enters the body.
