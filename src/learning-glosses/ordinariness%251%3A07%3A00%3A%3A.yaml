simpleMeaning: The quality of being nothing out of the way, just what you meet every day.
scope: The quality of being nothing out of the way, not a lack of worth and not a fault.
examples:
- There was a quiet ordinariness about the street that he liked.
- The ordinariness of her days did not trouble her.
