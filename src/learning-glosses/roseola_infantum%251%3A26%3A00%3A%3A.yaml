simpleMeaning: 'A viral illness of babies and young children: sudden high fever, mild sore throat; a few
  days later, a faint pinkish rash lasting a few hours to a few days.'
scope: Another name for exanthema subitum and pseudorubella, the same illness as roseola infantilis; not
  measles or rubella.
examples:
- Roseola infantum brought the toddler a sudden high fever and a mild sore throat.
- A faint pinkish rash appeared a few days after the fever of roseola infantum.
