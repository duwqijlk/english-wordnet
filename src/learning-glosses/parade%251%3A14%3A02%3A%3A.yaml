simpleMeaning: a long line of people or things following one after another, often in a showy way
scope: A long line of people or things passing one after another, often showy; not the special marching
  event held for a ceremony.
examples:
- A parade of visitors came through the office all day.
- We watched a parade of ducks cross the road one by one.
