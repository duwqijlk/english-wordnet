simpleMeaning: In sailing, a rope or chain that sets the angle of a sail to the wind
scope: In sailing, a rope or chain that sets the angle of a sail to the wind; also called a sheet or a
  shroud, not the course a ship sails and not a loose stitch.
examples:
- He pulled the tack to trim the sail.
- The crew eased the tack as the wind changed.
