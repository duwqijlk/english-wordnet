simpleMeaning: A build-up of urine in the kidney when the tube that carries urine out is blocked.
scope: A build-up of urine in the kidney when the tube that carries urine out is blocked, not kidney stones
  and not a bladder infection.
examples:
- Hydronephrosis can damage the kidney if it is not treated.
- The scan showed hydronephrosis in his left kidney.
