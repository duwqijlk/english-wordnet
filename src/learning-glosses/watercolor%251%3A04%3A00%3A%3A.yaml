simpleMeaning: the art or way of making pictures with paints that are mixed with water
scope: 'Also called watercolour: the art or way of painting with these paints, not the paint itself and
  not a finished picture made with them.'
examples:
- She learned watercolor at art school and now teaches it to children.
- Watercolor is hard to control because the paint moves with the water.
