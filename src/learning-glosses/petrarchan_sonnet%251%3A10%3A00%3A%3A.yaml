synsetId: 06394359-n
simpleMeaning: A fourteen-line poem made of an eight-line part with the rhyme pattern abbaabba, followed
  by a six-line part with the rhyme pattern cdecde or cdcdcd.
scope: Also called an Italian sonnet; its eight-line opening part and six-line closing part, each with
  its own set rhyme pattern, mark it out among fourteen-line poems.
examples:
- She wrote a Petrarchan sonnet with an octave rhyming abbaabba.
- His Petrarchan sonnet ended with a sestet in cdecde.
