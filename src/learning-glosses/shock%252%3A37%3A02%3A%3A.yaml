simpleMeaning: to make someone feel disgusted or deeply sickened.
scope: This is the disgust sense — offend, outrage and appall are other names for it — not the horror
  sense or the one meaning to surprise someone greatly.
examples:
- The vulgar display shocked the guests.
- She was shocked by the filth in the kitchen.
