simpleMeaning: a condition of total damage and loss from which there is no recovery
scope: This is the devastated condition itself, not the act of destroying something or a fall in someone's
  fortunes; ruination is another name for it.
examples:
- The family sank into ruin after the factory closed.
- Years of gambling drove him to ruin.
