simpleMeaning: an infection of the back of the mouth and throat, caused by a kind of germ
scope: 'Also called strep throat, streptococcal sore throat, septic sore throat and throat infection:
  an infection caused by a germ, not a cold and not a sore throat from shouting.'
examples:
- The doctor said her streptococcus tonsilitis was caused by a germ.
- His streptococcus tonsilitis made it hard to swallow.
