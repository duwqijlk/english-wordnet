simpleMeaning: a bird's sound that rings with a clear tone, as a struck metal cup does
scope: A bird's sound with a clear ringing tone, not a harsh cry and not the song of a songbird.
examples:
- The bell-like call rang out from the trees at dawn.
- We heard a bell-like call that sounded like a tiny chime.
