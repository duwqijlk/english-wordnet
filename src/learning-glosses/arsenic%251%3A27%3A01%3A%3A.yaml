simpleMeaning: a white powder poison made up of three parts oxygen joined to a harmful metal-like substance,
  used to make glass and to kill rats and weeds
scope: This sense is the white powder poison itself, also called arsenic trioxide, arsenous anhydride,
  arsenous oxide, ratsbane, and white arsenic; it is not glass and not a name for any poison.
examples:
- The old shed still held a tin of arsenic once used as rat poison.
- Workers once added arsenic when making glass, even though it could kill.
