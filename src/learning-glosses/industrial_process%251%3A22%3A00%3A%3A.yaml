simpleMeaning: A set of steps, done in order with machines or with chemicals, that make something
scope: A set of steps done in order to make something, not a single step and not the machine that does
  the work.
examples:
- The factory uses an industrial process to turn raw steel into car parts.
- Each industrial process at the plant follows the same set of steps.
