simpleMeaning: A plant that stays green all year and stands upright, a kind of horsetail with stems that
  feel rough at the edges; once used to clean pots and pans.
scope: A horsetail that stays green all year and stands upright, with rough-edged stems, also called rough
  horsetail, scouring rush, Equisetum hyemale and Equisetum robustum; it was once used to clean pots and
  pans.
examples:
- Equisetum hyemale robustum stays green through the winter by the pond.
- People once used Equisetum hyemale robustum to scour their pots.
