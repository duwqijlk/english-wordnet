simpleMeaning: a hollow metal piece that rings, hung round the neck of a woolly farm animal so the animal
  can be found with ease
scope: A bell hung round a sheep's neck so the sheep can be found, not a cowbell and not a dinner bell.
examples:
- The shepherd heard the sheep bell as the flock moved over the hill.
- Each ewe wore a sheep bell so we could find her in the dark.
