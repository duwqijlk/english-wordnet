simpleMeaning: a statement added to a plan or paper, or one that changes it or makes it better, such as
  a bill or a country's main laws
scope: This is the written change itself; it is not the act of making a change or fixing something.
examples:
- The amendment adds a new rule to the country's main laws.
- Members of parliament voted for the amendment to the bill.
