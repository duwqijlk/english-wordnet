simpleMeaning: without warm or friendly feeling, and showing that you do not like a person and think little
  of them
scope: Also called frozen, icy, frigid, frosty and glacial. This sense is about a cold, unfriendly manner,
  not about cold winter weather.
examples:
- She gave him a wintry smile and turned away.
- He greeted us with a wintry look and said almost nothing.
