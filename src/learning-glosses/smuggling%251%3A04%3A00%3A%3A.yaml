senseId: 'smuggling%1:04:00::'
synsetId: 01114037-n
simpleMeaning: bringing goods into a country in secret when the goods are not allowed, or when tax must
  be paid on them
scope: This sense is bringing goods into a country in secret to break the rules; it is not bringing goods
  in openly and in a legal way, and not taking goods out of a country.
examples:
- He was arrested for smuggling drugs into the country.
- The group made money from smuggling cigarettes on which no tax had been paid.
