simpleMeaning: Like a parasite or leech in nature or habits, living off another plant or person.
scope: Like a parasite or leech in nature or habits, living off another plant or person; also called parasitic
  or bloodsucking; not the sense of being caused by parasites.
examples:
- The vine was parasitical, living off the tree it climbed.
- Their way of life was parasitical, living off the work of others.
