simpleMeaning: In chemistry, a substance made when a metal, or a group that acts like a metal, takes the
  place of the hydrogen in an acid
scope: 'This is the chemistry sense: a substance made when a metal, or a group that acts like a metal,
  takes the place of hydrogen in an acid. Not the white stuff put on food to give it taste.'
examples:
- In chemistry class, we learned that a salt is made when a metal takes the place of hydrogen in an acid.
- The teacher showed us a salt made from an acid and a metal.
