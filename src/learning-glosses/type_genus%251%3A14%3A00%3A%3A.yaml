simpleMeaning: A family or smaller group gets its name from this group, which need not show the family
  best, though it is most often the biggest, best known, or earliest described.
scope: In biology, this is the naming group for a family or a smaller group, picked for size, fame, or
  being first described rather than for showing the family best.
examples:
- The type genus gave its name to the whole family.
- They named the family after its type genus.
