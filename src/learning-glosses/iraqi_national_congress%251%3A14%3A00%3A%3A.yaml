simpleMeaning: A set of groups joined against Saddam Hussein's rule in Iraq; set up in 1992, it holds
  Sunni and Shiite Arabs and Kurds hoping to build a new rule.
scope: 'Also called INC: a set of groups joined against Saddam Hussein''s rule in Iraq, set up in 1992
  and holding Sunni and Shiite Arabs and Kurds hoping to build a new rule; other groups of the same time
  backed his rule or stood apart from it.'
examples:
- The Iraqi National Congress was set up in 1992 to stand against Saddam Hussein.
- Sunni and Shiite Arabs joined the Iraqi National Congress hoping to build a new rule.
