simpleMeaning: a happy feeling you get from what you or another person has done well
scope: A happy feeling about good work by you or by another person; not the push to keep up your own level,
  and not thinking too highly of yourself.
examples:
- He takes pride in his son's success.
- She felt great pride when her team won the prize.
