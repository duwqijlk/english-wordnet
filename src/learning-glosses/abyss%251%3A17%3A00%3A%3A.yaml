simpleMeaning: a very deep hole or pit with no bottom, or any deep hollow that goes down and seems to
  have no bottom, often only in words
scope: A deep pit with no bottom, or a deep hollow used in words for something that seems to have no end,
  not a shallow ditch or a small hole.
examples:
- The climbers stared into the abyss below the cliff.
- After the loss, he felt he was falling into an abyss of grief.
