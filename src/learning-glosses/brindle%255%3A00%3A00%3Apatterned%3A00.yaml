simpleMeaning: having grey or brown lines, marks or mixed patches of colour, used especially for the patterned
  fur of cats
scope: Also called brindled, tabby and brinded. It describes an animal's grey or brown streaked, patchy
  fur, especially a cat's, not a plain single colour.
examples:
- The brindle cat has brown and grey streaks in its fur.
- Their old brindle cat slept in the sun all afternoon.
