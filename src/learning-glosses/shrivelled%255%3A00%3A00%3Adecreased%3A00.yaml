simpleMeaning: weaker than before, with less power, less life, and less force
scope: 'Also called shriveled and shrunken: weaker and less strong than before; not thin and wrinkled
  in the body from age or illness.'
examples:
- After months with no rain, the town's shrivelled trade brought in very little money.
- His shrivelled enthusiasm left him with no wish to finish the work.
