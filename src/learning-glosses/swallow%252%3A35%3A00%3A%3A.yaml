simpleMeaning: To take something in on every side until it is completely covered or hidden.
scope: To surround and hide something completely, as water does to a sinking boat, not to eat or drink
  it, destroy it, or put up with it.
examples:
- The dark water swallowed the boat within seconds.
- Fog swallowed the whole village by noon.
