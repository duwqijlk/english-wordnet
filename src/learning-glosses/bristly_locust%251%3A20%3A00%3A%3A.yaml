simpleMeaning: a big shrub or small tree of the eastern United States, with stiff hairy stems and large
  bunches of pink flowers
scope: This is a big shrub or small tree of the eastern United States with stiff hairy stems and large
  bunches of pink flowers; moss locust and rose acacia are other names for it, not a honey locust and
  not a lilac.
examples:
- The bristly locust along the road was covered in pink flowers.
- A bristly locust grows beside the old fence.
