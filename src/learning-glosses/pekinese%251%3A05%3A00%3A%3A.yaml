simpleMeaning: A small Chinese kind of dog with short legs, a long soft shiny coat, and a wide flat face.
scope: Also called Peke and Pekingese; a small short-legged Chinese dog, set apart from long-legged dogs
  by its flat face and its long soft coat.
examples:
- The Pekinese barked at the postman from the window.
- She brushed her Pekinese every evening to keep its coat smooth.
