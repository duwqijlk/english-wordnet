simpleMeaning: people as a group who have lost the use of part of their bodies, or whose bodies work less
  well than usual
scope: People as a group with bodies that work less well than usual, not one unfit person and not a thing
  made useless.
examples:
- Technology to help the elderly and the disabled is improving fast.
- The centre runs classes for the disabled in the town.
