simpleMeaning: Yellow flowers and prickly fruits that cling to fur and clothing mark any of several plants
  of the group Bidens.
scope: Yellow flowers and prickly fruits that cling to fur and clothing mark one of several plants of
  the group Bidens; beggar's-ticks, bur marigold, burr marigold and sticktight are other names for this
  sense.
examples:
- Beggar-ticks clung to the horse's coat.
- The beggar-ticks showed yellow flowers above the prickly fruits.
