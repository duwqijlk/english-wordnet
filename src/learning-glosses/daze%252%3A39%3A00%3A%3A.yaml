simpleMeaning: to make someone feel overcome by great surprise or by not being able to believe something
scope: 'This is the verb: to make someone feel overcome by great surprise or by not being able to believe
  something. It is not the noun for the confused feeling itself, and not the feeling of distress and disbelief
  when something bad happens by chance.'
examples:
- The loud, surprising news dazed him, and he sat down without speaking.
- She was dazed by the result and could not answer at once.
