simpleMeaning: having a mast (a tall pole on a boat that holds the sails), often joined with another word
scope: Having one or more masts on a boat, often with a word joined in front to show the number; not the
  tall pole itself.
examples:
- They sailed home in a three-masted ship.
- The masted boat stood in the harbor with tall poles and white sails.
