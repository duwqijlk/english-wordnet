simpleMeaning: The small blood tubes in the kidneys harden, less blood flows, and the kidneys and the
  heart can fail, in a sickness most often found with high blood pressure.
scope: This sickness is also called nephrosclerosis, and it most often comes with high blood pressure,
  as the small blood tubes in the kidneys harden, less blood flows, and the kidneys and the heart can
  fail.
examples:
- Kidney failure can follow nephroangiosclerosis.
- The small blood tubes harden in nephroangiosclerosis.
