simpleMeaning: A building material made of plaster mixed with hair, spread over the outside of temporary
  structures such as exhibition halls, or used as decoration.
scope: Not a group of employees, a long pole carried as a support, or the five lines used in music notation.
examples:
- The temporary pavilion was covered in staff, a plaster-and-hair mix that hardened into a smooth shell.
- Craftsmen shaped staff into decorative leaves for the exhibition hall's ceiling.
