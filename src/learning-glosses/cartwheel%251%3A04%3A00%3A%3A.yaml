simpleMeaning: a skilful body movement in which a person makes full turns sideways, with arms and legs
  spread wide out
scope: A skilful sideways full turn of the body; not a real wheel with wooden spokes and a metal rim,
  and not the verb for doing this movement.
examples:
- The girl did a perfect cartwheel on the grass.
- His cartwheel ended with both feet landing together.
