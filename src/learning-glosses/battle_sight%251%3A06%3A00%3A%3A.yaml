simpleMeaning: At short ranges, the shooter aims fast with this set of marks on a gun.
scope: This set of marks on a gun for fast aiming at close range is also called the battlesight.
examples:
- The battle sight let the shooter aim fast at a target close by.
- With the battle sight, the shooter took quick aim at short range.
