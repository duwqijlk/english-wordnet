simpleMeaning: flat pieces of wood that can be put on the walls of a room to cover them
scope: 'Also called wainscoting: these are the flat wood pieces used to cover the walls of a room, not
  the finished lower part of a wall that is made to look different from the rest.'
examples:
- The dining room has dark wainscot along all its walls.
- He cut the wainscot to fit around the door and windows.
