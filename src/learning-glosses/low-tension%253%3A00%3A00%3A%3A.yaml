senseId: 'low-tension%3:00:00::'
synsetId: 01835698-a
simpleMeaning: This thing may be put under a small amount of electric power, or it may work with that
  much power
scope: Also called low-voltage, this means a thing may be put under a small amount of electric power or
  work with that much power, not on mains power and not on high power.
examples:
- This low-tension wire carries only a small current.
- The low-tension lights run on a small supply.
