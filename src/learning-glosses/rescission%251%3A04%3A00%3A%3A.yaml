synsetId: 00233730-n
simpleMeaning: In law, the cancelling of a contract, so that each side goes back to where it stood before
  the contract was made.
scope: In law, the cancelling of a contract so that both sides go back to where they stood before it was
  made.
examples:
- The court ordered the rescission of the contract after finding that one side had lied.
- Both sides agreed to a rescission, and each went back to the position it had held before signing.
