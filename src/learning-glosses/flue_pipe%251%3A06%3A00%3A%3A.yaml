simpleMeaning: Air moving over the sharp edge of a crack or lip makes the sound of this tube in an organ.
scope: Also called a flue or a labial pipe, this is a tube in an organ whose sound comes from air moving
  over the sharp edge of a crack or lip.
examples:
- The organ maker tuned the flue pipe until its tone was clear.
- A flue pipe sounds when air moves across its sharp edge.
