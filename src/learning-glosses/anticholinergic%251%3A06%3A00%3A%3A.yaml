simpleMeaning: a substance that works against acetylcholine, a chemical that carries signals between nerves,
  and stops it from acting
scope: 'Also called anticholinergic drug: a substance that stops acetylcholine from acting, not the adjective
  for things that do this, and not a medicine that boosts acetylcholine.'
examples:
- The anticholinergic stopped the nerve signal from reaching the muscle.
- She took an anticholinergic before the test to dry up the extra saliva.
