simpleMeaning: any rough plant of the Xanthium group with spiny cases holding its seeds
scope: Any rough plant of the Xanthium group with spiny cases holding its seeds; cocklebur, cockle-bur
  and cockle-burr are other names for this, not a smooth plant and not one without spiny seed cases.
examples:
- Cockleburr seeds stuck to the horse's mane.
- The cockleburr grows wild in the field.
