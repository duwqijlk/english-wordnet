simpleMeaning: Helpful and encouraging to someone.
scope: 'This describes a person''s manner or words: giving help and encouragement. It is not the physical
  sense of holding up weight, as a supporting beam does, and not the noun meaning the act of bearing weight.
  Modern English usually prefers ''supportive'' for this meaning, so ''supporting'' here appears mainly
  in older or formal writing.'
examples:
- The teacher's supporting attitude gave the anxious child confidence.
- Her supporting words helped him through the first difficult weeks.
