senseId: 'center_punch%1:06:00::'
synsetId: 02998180-n
simpleMeaning: A tool with a cone-shaped point that makes small dents in metal, used above all to mark
  where holes will be drilled.
scope: A tool that dents metal to mark where to drill, not a drill itself and not a hammer.
examples:
- He used a center punch to mark the spot before drilling.
- A center punch left a small dent in the steel plate.
