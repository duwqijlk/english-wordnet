simpleMeaning: worth so much in money, in thought or in spirit that no price can be put on it
scope: Worth so much in money, thought or spirit that it cannot be priced, also called priceless, and
  not worth a lot of money in the ordinary way.
examples:
- Her advice was invaluable to us.
- The invaluable painting was kept under guard.
