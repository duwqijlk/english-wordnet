schema: oewn-learning-gloss-v2
senseId: 'stigmatic%3:01:00::'
synsetId: 02632026-a
simpleMeaning: Of a lens or set of lenses, free of the fault that blurs sight, so it makes sharp point
  images.
scope: This sense is about a lens free of the fault that blurs sight, unlike the sense for a person whose
  body is marked by holy stigmata, as marks like the wounds of the crucified Christ, and unlike the sense
  for what bears or looks like stigmata.
examples:
- The lens was stigmatic, giving a sharp image with no blur.
- The set of lenses was stigmatic, forming clean point images.
