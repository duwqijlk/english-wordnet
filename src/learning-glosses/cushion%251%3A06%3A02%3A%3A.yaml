simpleMeaning: a layer of air that holds up a hovercraft (a vehicle that moves just above land or water)
  or a vehicle like it
scope: A layer of air under a vehicle, not a soft bag you sit on and not a part that takes in the force
  of a sudden hit.
examples:
- The hovercraft rides on a cushion of air above the water.
- A cushion of air lifts the vehicle so it can move over land and sea.
