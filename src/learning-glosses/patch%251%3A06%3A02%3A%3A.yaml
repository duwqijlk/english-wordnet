simpleMeaning: a piece of cloth worn over a hurt eye to keep it safe
scope: This is the cloth cover for a hurt eye, not the sewing that fixes a hole in clothing and not a
  soft cover for another hurt part of the body.
examples:
- She wore a patch over her injured eye after the operation.
- The boy's eye patch kept light away while his eye healed.
