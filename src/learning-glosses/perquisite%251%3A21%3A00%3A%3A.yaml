simpleMeaning: An extra gain that comes with a job, especially one workers see as theirs by right.
scope: Also called a perk, an extra gain that comes with a job, especially one seen as a right, not a
  right held by one person or group alone.
examples:
- A company car was a perquisite of his job.
- Free meals were a perquisite that came with working in the hotel.
