simpleMeaning: In respect, money, rank and standing, this is a place below others
scope: Also called lowliness and low status, this is a low place in life, not a low place on land and
  not a low sound.
examples:
- The lowness of his rank kept him from the meeting.
- She felt the lowness of her standing at work.
