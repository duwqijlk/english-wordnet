synsetId: 07898472-n
simpleMeaning: Any food or drink made by putting different things together.
scope: This is food or drink made by mixing things; mixture is another name for this sense, not the act
  of making something or a strange mixture that is not food.
examples:
- He volunteered to taste her latest concoction of beans and spices.
- She served a concoction of fruit, yoghurt and honey for pudding.
