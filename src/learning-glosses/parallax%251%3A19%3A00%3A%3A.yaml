schema: oewn-learning-gloss-v2
senseId: 'parallax%1:19:00::'
synsetId: 11548676-n
simpleMeaning: How a thing seems to move against what lies behind it when it is looked at from two places
  that are not in a straight line with it.
scope: How a thing seems to shift when seen from two places not in line with it, not a real move of the
  thing itself.
examples:
- The parallax made the star seem to shift against the far stars as the earth moved.
- Astronomers use parallax to work out how far away a star is.
