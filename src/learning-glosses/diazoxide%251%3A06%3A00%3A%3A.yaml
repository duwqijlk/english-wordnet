simpleMeaning: a drug that widens blood vessels, sold as Hyperstat, used to treat very high blood pressure
scope: A drug that widens blood vessels to bring down very high blood pressure, not a drug that narrows
  blood vessels and not a drug for a mild rise in blood pressure.
examples:
- The doctor gave him diazoxide to bring his blood pressure down.
- Diazoxide is kept for cases of severe hypertension.
