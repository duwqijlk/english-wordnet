simpleMeaning: any of the three blood vessels on each side of the brain that feed the outer layer of the
  side part of the brain
scope: One of the three blood vessels on each side of the brain that feed the side part of the brain,
  not a vein and not a blood vessel of the neck or face.
examples:
- The doctor pressed on the temporal artery to feel the pulse.
- A temporal artery feeds blood to the side of the brain.
