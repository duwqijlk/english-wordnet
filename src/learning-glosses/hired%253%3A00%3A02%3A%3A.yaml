simpleMeaning: paid for by a group of people travelling together, for their use alone for a short time
scope: About a plane, bus or boat paid for by one group of travellers for their use alone; not about a
  person taken on to do a job, and not a car rented by one driver.
examples:
- We travelled in a hired coach that was booked just for our group.
- The hired plane waited at the small airport for the team.
