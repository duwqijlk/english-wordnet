simpleMeaning: the season of growth, when new plants start to grow at the beginning of spring
scope: The season of growth at the start of spring; spring is another name for this sense, not the act
  of jumping and not a coiled piece of metal.
examples:
- The springtime buds opened in the warm sun.
- We planted the garden in springtime.
