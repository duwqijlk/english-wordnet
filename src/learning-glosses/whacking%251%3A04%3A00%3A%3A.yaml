simpleMeaning: the act of hitting someone again and again as a punishment
scope: Hitting again and again as a punishment, with beating, licking, thrashing and lacing as other names
  for this sense, and not a single blow or a game.
examples:
- The boy feared a whacking for his mischief.
- In those days, a whacking was a common punishment at school.
