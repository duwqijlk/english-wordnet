simpleMeaning: People say it cannot see, but it is a small lizard of Europe that burrows in the ground,
  has no legs, and has eyes too small to notice
scope: It is also called blindworm, after the old belief that its tiny eyes cannot see.
examples:
- The slowworm dug into the loose earth.
- A slowworm crossed the path without legs.
