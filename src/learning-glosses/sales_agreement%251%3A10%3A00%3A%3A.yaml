simpleMeaning: a deal in which what is owned passes from the seller to the buyer for a set price in money,
  paid now or promised to be paid
scope: 'Also called a sale: a deal passing what is owned from seller to buyer for a set price, not a gift
  and not a loan.'
examples:
- They signed the sales agreement before handing over the keys.
- The sales agreement set the price at fifty thousand dollars.
