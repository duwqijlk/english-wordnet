simpleMeaning: Bark full of tannin, a bitter substance used in making leather, and reddish or purple twigs
  mark a willow from Europe and Asia
scope: This sense names a willow from Europe and Asia with reddish or purple twigs and bark full of tannin,
  also called purple osier, purple willow, red osier, or red willow.
examples:
- The basket willow had reddish twigs and bark full of tannin.
- That basket willow has purple twigs.
