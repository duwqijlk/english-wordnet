simpleMeaning: about or like an imagined place or state where life is very bad for the people there
scope: This is about a bad imagined place or state where life is very bad. It is not about a perfect imagined
  place where life is very good.
examples:
- The film shows a dystopian city where no one is free.
- She wrote a dystopian story about a country ruled by fear.
