simpleMeaning: A gun system in which the bolt must push past some early resistance before it moves, while
  it is not fully locked
scope: A gun system where the bolt pushes past early resistance without being fully locked; not a fully
  locked system and not plain blowback with no resistance.
examples:
- Delayed blowback lets the bolt move only after it beats the first resistance.
- The pistol uses delayed blowback to slow the bolt.
