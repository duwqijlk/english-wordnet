simpleMeaning: The last wash, when clean water takes the soap off a thing.
scope: The last wash, when clean water takes the soap off, not a light wash with no soap, not the wash
  of the mouth, and not the liquid that tints hair.
examples:
- The rinse left no soap in the towels.
- After the rinse, the dishes were free of soap.
