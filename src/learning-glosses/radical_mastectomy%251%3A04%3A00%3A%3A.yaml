simpleMeaning: Taking away a breast and the muscles under it, the pectoralis major and pectoralis minor,
  and the lymph nodes in the armpit next to it.
scope: An operation that takes away a breast with the muscles under it and nearby lymph nodes.
examples:
- Radical mastectomy takes away a breast and the muscles under it.
- Radical mastectomy takes the lymph nodes in the armpit.
