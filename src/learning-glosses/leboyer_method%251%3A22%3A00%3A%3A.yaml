simpleMeaning: 'A way to give birth that tries to spare the newborn shock: a quiet dim room, no pulling
  of the head, and closeness between mother and child urged at once.'
scope: Also called the Leboyer method of childbirth; a gentle way of giving birth, not a drug for pain
  and not a surgical birth.
examples:
- The Leboyer method keeps the delivery room quiet and dimly lit.
- She chose the Leboyer method so her baby would be born gently.
