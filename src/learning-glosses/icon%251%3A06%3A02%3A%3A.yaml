simpleMeaning: A holy picture in oil paint on a small board of wood, made in the old set way, that Eastern
  Church people honor in prayer
scope: A holy picture on a small wooden panel honored in the Eastern Church, not a small picture on a
  computer screen and not any picture of a thing or person.
examples:
- The icon of the Virgin hung above the altar.
- She kissed the icon before she left the church.
