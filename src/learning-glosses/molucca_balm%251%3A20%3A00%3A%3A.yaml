simpleMeaning: A fragrant annual whose small whitish blooms sit on tall stems inside a greatly enlarged,
  saucer- or bell-shaped cup.
scope: This is the fragrant garden annual with small white flowers in large bell-shaped cups, not a balm
  or ointment for the skin.
examples:
- Molucca balm lined the path to the front door.
- The Molucca balm in the border had small white flowers.
