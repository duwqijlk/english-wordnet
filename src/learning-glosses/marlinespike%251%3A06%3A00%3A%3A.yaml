schema: oewn-learning-gloss-v2
senseId: 'marlinespike%1:06:00::'
synsetId: 03728137-n
simpleMeaning: a pointed iron tool held in the hand, used to part the strands of a rope or cable when
  joining them
scope: A pointed iron hand tool for parting rope strands; marlingspike and marlinspike are other names
  for this sense, not a knife and not a hook for pulling rope.
examples:
- He used a marlinespike to open the strands of the rope.
- The sailor kept a marlinespike in his tool bag.
