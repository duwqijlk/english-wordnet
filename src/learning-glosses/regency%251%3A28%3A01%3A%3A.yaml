senseId: 'regency%1:28:01::'
synsetId: 15324238-n
simpleMeaning: the time when a person rules a country in place of a king or queen who cannot rule
scope: This is the length of time when another person rules for the king or queen, not the job or power
  of that person and not the time when the king or queen rules alone.
examples:
- During the regency, his uncle made the laws for the young king.
- The regency lasted ten years until the queen was old enough to rule.
