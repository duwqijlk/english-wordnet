simpleMeaning: 'Mostly fresh-water nucleus-bearing algae, green colour hidden by brown or yellow colour;
  yellow-green and golden-brown algae and diatoms: Xanthophyceae, Chrysophyceae, Bacillariophyceae; in
  some systems replaced by or put under Heterokontophyta.'
scope: Also called division Chrysophyta; mostly fresh-water algae whose green colour is hidden by brown
  or yellow, not blue-green algae and not seaweed.
examples:
- Chrysophyta includes diatoms and golden-brown algae.
- The pond water was coloured by Chrysophyta.
