simpleMeaning: A figure about a physical condition that a gauge or similar tool shows to a person.
scope: 'Also called a reading or an indication: what a gauge shows about how a thing is, not the gauge
  itself and not a bill for use.'
examples:
- He could not believe the meter reading on the dial.
- The meter reading showed that the water tank was nearly empty.
