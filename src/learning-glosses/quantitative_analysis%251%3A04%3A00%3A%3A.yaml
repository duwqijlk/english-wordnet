senseId: 'quantitative_analysis%1:04:00::'
synsetId: 00648513-n
simpleMeaning: a test in chemistry that finds how much of each part is in a thing
scope: Also called quantitative chemical analysis; a chemistry test that finds how much of each part is
  in a thing, not a test that only finds what parts are there.
examples:
- The lab did a quantitative analysis to find how much iron was in the rock.
- A quantitative analysis showed the sample was half salt and half sand.
