simpleMeaning: a pen with fluorescent ink, that is, ink in a very bright colour, used to mark important
  parts of a text
scope: This is the pen used to mark important parts of a text, not the make-up used on the eyes or cheekbones.
examples:
- She marked the key line with a yellow highlighter.
- He used a highlighter to mark the important parts of the page.
