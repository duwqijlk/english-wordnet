simpleMeaning: an animal of the Jurassic and Cretaceous, now gone, with a beak like a bird and thin wings
  held up by the very long fourth finger of each front leg
scope: An animal of the Jurassic and Cretaceous, now gone, also called pterosaur, not a bird and not a
  bat.
examples:
- The flying reptile had wings of skin held up by one very long finger.
- A flying reptile swooped over the sea in the film.
