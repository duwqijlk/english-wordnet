simpleMeaning: the top deck of a ship, from which the steering is controlled and where the captain stands
scope: The deck of a ship from which it is steered, not a structure that carries a road or path over water
  or the piece joining eyeglass lenses.
examples:
- The captain stood on the bridge and watched the storm approach.
- From the bridge, the officer gave the order to change course.
