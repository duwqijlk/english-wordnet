simpleMeaning: In the calendar of the Revolution, this is the third month, the frosty one, covering November
  and December.
scope: The third month of the Revolutionary calendar, the frosty one; not the first or second month, and
  not a month of the usual calendar.
examples:
- The new calendar named the third month Frimaire.
- Frimaire brought the first hard frosts of the year.
