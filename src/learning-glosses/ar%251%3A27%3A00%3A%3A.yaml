simpleMeaning: A gas with no smell or colour that does not change with other things; one of six gases
  that do not react, about one in a hundred of the sky.
scope: A gas that does not react, not oxygen and not a gas that burns; also called argon and atomic number
  18.
examples:
- Ar fills light bulbs and does not burn.
- About one part in a hundred of the air is Ar.
