simpleMeaning: In computer science, the number of pixels (tiny dots that make a picture) in each square
  inch on a screen; the more there are, the better the picture
scope: This is about a computer screen, not how well a microscope or telescope shows close images apart
  and not a decision or an answer to a problem.
examples:
- A screen with higher resolution shows a sharper picture.
- This computer display has a resolution of 300 pixels per square inch.
