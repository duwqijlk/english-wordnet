simpleMeaning: A set of computer programs that helps people make, keep up and use a store of electronic
  facts.
scope: 'Also called database management system: a set of computer programs that helps people make, keep
  up and use a store of electronic facts, covering the whole life of the store from making it to using
  it.'
examples:
- Our library uses a DBMS to keep track of every book.
- The new DBMS makes it easy to find records.
