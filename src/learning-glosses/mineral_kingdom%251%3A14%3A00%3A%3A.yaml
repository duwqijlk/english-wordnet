simpleMeaning: Everything that is not alive and never was, set apart from the animals and the plants
scope: All the things in the world that are not alive and never were, set apart from animals and plants,
  not a country ruled by a king.
examples:
- Rocks and metals belong to the mineral kingdom.
- The mineral kingdom holds all the lifeless things of the earth.
