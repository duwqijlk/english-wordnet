simpleMeaning: to prepare fields for growing crops, for example by turning the soil, breaking up clods,
  or adding manure
scope: This is the verb for preparing soil, not the noun meaning a strongbox for holding cash, the government
  treasury, or soil left by a glacier.
examples:
- Farmers till the soil before planting in spring.
- He tilled the field for hours, turning over the heavy clay.
