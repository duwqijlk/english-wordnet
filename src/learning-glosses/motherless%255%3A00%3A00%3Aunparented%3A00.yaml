simpleMeaning: having a mother who has died, or a mother who is not known
scope: For a person or animal with no mother alive or known; not the same as having no father, and it
  does not by itself say that both parents are gone.
examples:
- The motherless baby was cared for by her aunt.
- He grew up motherless after his mother died when he was two.
