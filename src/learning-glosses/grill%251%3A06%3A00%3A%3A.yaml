simpleMeaning: a frame of metal bars used to divide a space or to cover an opening
scope: Grille is another name for this sense; it is a frame of metal bars, not a place that cooks food
  and not the act of cooking food over fire.
examples:
- A metal grill covered the drain in the floor.
- An iron grill protected the window from the street.
