simpleMeaning: A stretchy natural stuff in its raw state, used mostly for the bottoms of shoes
scope: A raw stretchy stuff used mostly for shoe soles, not a finished tyre and not a hard plastic.
examples:
- The crepe rubber was cut into sheets for soles.
- Shoemakers used crepe rubber for most soles.
