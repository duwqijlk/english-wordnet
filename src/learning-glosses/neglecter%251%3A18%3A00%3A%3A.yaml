senseId: 'neglecter%1:18:00::'
synsetId: 10371356-n
simpleMeaning: A person who pays little care or respect to people or to the duties they should carry out
scope: This is a person who pays little care or respect to others or to their duties; not someone who
  is merely busy and not someone who means well but forgets.
examples:
- He tried vainly to impress his neglecters.
- The neglecter left the children alone for hours.
