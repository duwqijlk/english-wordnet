simpleMeaning: A way of counting by place in which only the figures 0 and 1 are used, with two as the
  base.
scope: A way of counting by place using only 0 and 1, also called binary number system and binary system;
  not counting by tens and not a machine.
examples:
- The binary numeration system counts with 0 and 1.
- Computers work in the binary numeration system.
