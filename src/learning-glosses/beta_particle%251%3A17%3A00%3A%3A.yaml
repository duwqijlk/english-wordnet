simpleMeaning: A very fast electron or positron is thrown off when one form of a radioactive atom breaks
  down.
scope: What this names is a very fast electron or positron thrown off in the decay of one form of a radioactive
  atom.
examples:
- A beta particle shot out of the breaking atom.
- The sample gave off beta particles as the atom broke down.
