simpleMeaning: An illness common in India and round the Mediterranean, caused by a tiny germ carried to
  people by a reddish brown blood-sucking bug that lives on dogs and other mammals
scope: An illness carried by a reddish brown bug in India and round the Mediterranean; boutonneuse fever,
  Kenya fever and Marseilles fever are other names for this sense.
examples:
- Indian tick fever spread through the village after the dogs brought the bugs home.
- He caught Indian tick fever on a trip round the Mediterranean.
