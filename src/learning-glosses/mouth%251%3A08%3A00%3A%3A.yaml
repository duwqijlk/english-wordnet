simpleMeaning: the visible opening on the face, together with the lips and other parts around it, used
  for eating and speaking.
scope: This is the visible facial opening with the parts around it, not the inside cavity and not an opening
  in rock or land.
examples:
- He wiped his mouth with a napkin.
- The dentist asked her to open her mouth wide.
