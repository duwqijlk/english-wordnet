simpleMeaning: the act of taking food away from someone, or of making people live with far too little
  food for a long time
scope: 'Also called starvation: the act of taking food away or making people go without enough food. This
  is not just feeling very hungry.'
examples:
- The starving of the prisoners was treated as a crime.
- They were charged with the starving of children in their care.
