senseId: 'catalyze%2:30:00::'
synsetId: 00268405-v
simpleMeaning: to change by a chemical change that a substance speeds up while the substance itself does
  not change, or to cause such a change in something
scope: 'Also called catalyse: this is about a chemical change that a substance speeds up while not changing
  itself, or about making such a change happen in something. Not the loose use for making any event or
  process start or happen faster.'
examples:
- The enzyme catalyzes the change in the mixture in the lab.
- Workers add this substance to catalyze the chemical change in the liquid.
