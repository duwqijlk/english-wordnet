simpleMeaning: the soft spot at the front of a baby's head that matches the place where the bones of the
  skull meet once they have turned hard
scope: The soft spot at the front of a baby's head, where the bones of the skull meet once they have turned
  hard; not a soft spot at the back of the head and not a crack in the skull.
examples:
- The doctor felt the baby's anterior fontanelle to check that it was closing as it should.
- A sunken anterior fontanelle can be a sign that a baby needs more fluids.
