simpleMeaning: Low flat land beside a river, made mostly of earth left by the river, that can be covered
  by water when the river rises.
scope: Low flat land beside a river that can be covered by water, also called a floodplain; not the narrow
  bank of a river and not high land that never floods.
examples:
- The flood plain was under water after the heavy rain.
- Farmers plant crops on the rich soil of the flood plain.
