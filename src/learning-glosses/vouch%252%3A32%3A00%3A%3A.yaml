simpleMeaning: to call a person into court so that they stand up for a claim to land or a right
scope: To call a person into court to stand up for a claim, not to say you trust someone or that a thing
  is true.
examples:
- He was vouched into court to defend his claim to the land.
- The judge vouched the witness to stand up for the title in court.
