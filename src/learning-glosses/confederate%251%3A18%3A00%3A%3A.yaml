senseId: 'confederate%1:18:00::'
synsetId: 09780399-n
simpleMeaning: a person who joins with another person to carry out a plan, especially a bad plan or one
  that breaks the law
scope: This is a person, also called an accomplice, who helps carry out a plan; it is not the act of nations
  joining together and not the word for nations that are joined.
examples:
- He and his confederate planned the robbery together.
- The police arrested the thief and his confederate.
