simpleMeaning: in a planned way, doing each step in order and in the same way each time
scope: Done by a fixed plan, step by step; consistently is another name for this sense, and it is not
  done by chance or in a random way.
examples:
- They systematically searched every room in the house.
- She systematically worked through the list of names.
