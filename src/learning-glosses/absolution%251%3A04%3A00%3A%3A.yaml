simpleMeaning: the act of forgiving a person for sin, said by a priest in a set church act where the person
  says sorry for wrong acts
scope: 'Also called remission, remission of sin, and remittal: a priest forgiving sin in a set church
  act, not the state of being forgiven after that act.'
examples:
- The priest gave him absolution after he said sorry for his sins.
- She went to church hoping to receive absolution.
