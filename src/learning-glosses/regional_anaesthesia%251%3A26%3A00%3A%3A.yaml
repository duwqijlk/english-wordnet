senseId: 'regional_anaesthesia%1:26:00::'
synsetId: 14051156-n
simpleMeaning: A drug put on all the nerves that feed one part of the body takes away feeling there, as
  when a back shot numbs the hips during birth
scope: This is a loss of feeling in one part of the body, also called regional anesthesia, not a loss
  of feeling all over the body.
examples:
- The regional anaesthesia took away all feeling in her lower body during birth.
- Doctors used regional anaesthesia so the patient felt nothing in one leg.
