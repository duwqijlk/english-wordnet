simpleMeaning: A sheet of mesh that can be fitted into a frame and shields what is behind it.
scope: This is the mesh guard fitted in a frame, not a general cover that hides or shelters something,
  and not a strainer for separating lumps.
examples:
- We fitted a screen across the window to keep the flies out.
- A fine screen over the doorway stopped the mosquitoes from getting in.
