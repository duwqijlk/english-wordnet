simpleMeaning: press one's lips against someone's mouth or another part of their body, or touch them with
  the lips, as a sign of love, greeting or the like
scope: This is the action of pressing the lips to someone, not the noun for that act, the bite-sized candy
  or the egg-white cookie.
examples:
- He kissed her on the cheek and said goodnight.
- The couple kissed under the streetlight.
