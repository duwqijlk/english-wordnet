simpleMeaning: These blood tubes join the tubes on the back of the hand to those on the palm, or those
  on the top of the foot to those on the sole.
scope: Also called vena intercapitalis, these blood tubes join the tubes on the back of the hand to those
  on the palm, or those on the top of the foot to those on the sole.
examples:
- The intercapitular vein links the veins on the back of her hand.
- An intercapitular vein joins the palm side to the back of the hand.
