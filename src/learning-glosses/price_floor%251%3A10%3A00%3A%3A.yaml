simpleMeaning: The lowest level that what things cost may reach, set so that it cannot go lower
scope: The lowest level that prices may reach, not the highest level and not the price itself.
examples:
- The government used price supports to maintain the price floor.
- A price floor keeps farm goods from selling too cheaply.
