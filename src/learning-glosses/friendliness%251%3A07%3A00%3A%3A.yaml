simpleMeaning: a person's usual warm and kind way of acting towards other people
scope: This is the warm, kind way a person usually acts; it is not the close tie between people who like
  each other.
examples:
- Her friendliness made the new students feel welcome at once.
- We all liked the shopkeeper for his friendliness and good humour.
