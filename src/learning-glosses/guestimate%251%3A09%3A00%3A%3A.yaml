simpleMeaning: You work out a rough number by thinking it through, then fill in what you do not know by
  taking a chance
scope: A rough number worked out by thinking and by taking a chance, also called guesstimate, not a careful
  count and not a wild guess.
examples:
- Her guestimate of the crowd was about three hundred people.
- I made a quick guestimate and said the job would take two days.
