simpleMeaning: to say officially that a place is not safe or fit for use or for people to live in
scope: This sense is about a building or place said to be unfit to use or live in, not about saying a
  person or act is very bad, and not about giving a punishment in court.
examples:
- The inspector condemned the old building after the fire.
- The city condemned the house because its walls were unsafe.
