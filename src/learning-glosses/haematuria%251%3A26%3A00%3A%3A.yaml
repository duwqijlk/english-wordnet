simpleMeaning: Disease in the tubes that carry urine out of the body often shows itself as blood in the
  urine
scope: Blood in the urine, also called hematuria, often a sign of disease in the tubes that carry urine
  out, not blood in the stool and not a disease on its own.
examples:
- The nurse noted haematuria and sent a sample of his urine for tests.
- Haematuria can be the first sign that something is wrong with the kidneys.
