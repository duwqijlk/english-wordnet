simpleMeaning: a disorder of the nerves and mind that causes wild bursts of feeling and trouble with the
  senses and with moving the body
scope: A disorder of the nerves and mind, not ordinary fear or excitement and not a fit of laughter.
examples:
- The doctor said the patient's hysteria caused her hands to shake and her sight to blur.
- Mass hysteria spread through the town after the strange news.
