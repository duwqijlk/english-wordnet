simpleMeaning: In architecture, the use of the same group of things you can see again and again to make
  a pattern that is easy to see
scope: This is a pattern you can see in a building, made by using the same things again and again; it
  is not the pattern of strong and weak parts in spoken words and not the basic unit in music.
examples:
- The windows were placed in a clear rhythm along the wall of the building.
- The tall columns give the front of the library a strong rhythm.
