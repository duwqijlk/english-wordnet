simpleMeaning: to tell something without words and without sound, by a sign you can see
scope: 'Also called sign: to tell something without words and without sound, by a sign you can see, not
  a move that carries a set message and not a mark that shows something is there.'
examples:
- He signaled the waiter to bring the bill.
- She signaled with her hand that all was well.
