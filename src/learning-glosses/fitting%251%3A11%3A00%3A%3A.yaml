simpleMeaning: the act of making something right for a use, or of becoming right for a new situation
scope: This is the act of making or becoming right for a use or a new situation; accommodation is another
  name for this sense. Not the word for something that is right for the feelings of people or for an event,
  and not the word for something that is exactly right.
examples:
- The fitting of the shelves to the small room took careful work.
- Fitting to a new way of life takes time.
