simpleMeaning: saying yes to something with approval, and taking it up so people welcome it
scope: Also called adoption, acceptance or espousal; saying yes to something and welcoming it, not the
  thing itself and not a refusal.
examples:
- The acceptation of the new rules by the town showed how welcome they were.
- The plan's acceptation came slowly, but in the end most people backed it.
