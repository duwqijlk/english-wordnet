simpleMeaning: an operation to take out a clot or lump that blocks a blood vessel, usually from an artery
scope: An operation to take out a clot or lump that blocks a blood vessel, usually from an artery, not
  the taking out of a whole organ and not a cut made to let blood flow.
examples:
- The surgeon performed an embolectomy to clear the blocked artery.
- An embolectomy saved the man's leg by removing the clot.
