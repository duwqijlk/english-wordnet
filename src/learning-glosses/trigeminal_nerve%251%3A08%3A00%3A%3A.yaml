simpleMeaning: The main feeling cord of the face, which also moves the chewing muscles
scope: The main feeling cord of the face, which also moves the chewing muscles; trigeminal, trigeminus,
  fifth cranial nerve and nervus trigeminus are other names for this sense, not a cord of the eye only
  and not a cord of the ear.
examples:
- The trigeminal nerve carries feeling from the face to the brain.
- A dentist must take care near the trigeminal nerve.
