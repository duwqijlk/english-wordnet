simpleMeaning: attach something to a surface using a substance that holds it, such as glue
scope: Fixing something on with a sticky material such as glue; it is not held by pins or nails pushed
  through it.
examples:
- She stuck the poster onto the wall with tape.
- He stuck the broken handle back on with glue.
