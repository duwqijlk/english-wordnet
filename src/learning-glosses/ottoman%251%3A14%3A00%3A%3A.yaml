simpleMeaning: The Turkish ruling house that held the empire from the 1200s until it fell after the First
  World War.
scope: The ruling house of the empire, also called the Ottoman dynasty; not a single ruler and not the
  people of the empire.
examples:
- The Ottoman dynasty ruled for more than six hundred years.
- The last Ottoman sultan left the throne after the First World War.
