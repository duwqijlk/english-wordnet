simpleMeaning: hard breaths taken in through a nose that is blocked up
scope: 'Also called a snuffle: noisy breaths through the nose, not the verb that means to sniff in air
  or to cry with a snuffling noise.'
examples:
- His sniffle told us his cold had blocked his nose.
- She tried to stop her sniffle during the concert.
