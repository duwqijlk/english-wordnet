simpleMeaning: The action of moving food or liquid from the mouth down the throat.
scope: The bodily action of moving food or liquid from the mouth down the throat, not the bird, a mouthful
  of liquid food, or the verb sense of putting up with something.
examples:
- The doctor watched each swallow on the screen.
- Her swallow was painful for days after the operation.
