synsetId: 14923838-n
simpleMeaning: A substance that blocks X-rays, which, once given, lets a scan reader look at the part
  or flesh it fills.
scope: Also called contrast medium; given so a radiologist can examine the organ or tissue it fills.
examples:
- Contrast materials block X-rays.
- The contrast material lets a scan reader look.
