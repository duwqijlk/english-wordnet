simpleMeaning: A sea bird that hunts weaker birds and chases them until they drop the food they have caught.
scope: A sea bird that chases weaker birds until they drop their food, not a gull that eats scraps and
  not a bird that hunts fish on its own.
examples:
- The jaeger chased the gull until it dropped its fish.
- Jaegers circled above the cliffs, looking for weaker birds.
