simpleMeaning: To join pieces by fitting one into a step cut along the edge of another.
scope: To join pieces by using a step cut along an edge, not to cut such a step in timber or stone.
examples:
- The carpenter rebated the edge of the board so the panel would sit flush.
- They rebated the pieces of timber and stone before joining them.
