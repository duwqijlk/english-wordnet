simpleMeaning: coarsely ground corn with the hulls off, cooked in water as a morning dish in the southern
  United States
scope: Coarsely ground corn with the hulls off, cooked in water as a morning dish in the southern United
  States; grits is another name for this sense, not porridge oats and not corn bread.
examples:
- We ate hominy grits with butter for breakfast.
- Hominy grits are a common breakfast dish in the South.
