simpleMeaning: not having a thin covering put on wood to colour it or make it shine
scope: 'Also called unstained: with no covering put on wood, not the use of this word for plain truth
  with nothing added or hidden.'
examples:
- The table was made of unvarnished wood.
- He left the unvarnished boards as they were, with no colour or shine added.
