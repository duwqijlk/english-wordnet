simpleMeaning: Shaped or coloured in the way a flower's thin soft part is.
scope: This is about something shaped like a flower's soft coloured part, also called petallike; it is
  not a real flower part, and not something merely soft or thin.
examples:
- The petal-like leaves opened in the morning sun.
- She wore a petal-like pink dress for the party.
