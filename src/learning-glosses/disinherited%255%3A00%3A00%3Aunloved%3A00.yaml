simpleMeaning: having had your right to the money and things left by a person who died taken away
scope: This means losing the money and things that should have been yours from family, not just feeling
  unloved or left out.
examples:
- After the fight, the disinherited son left the house with nothing.
- She felt disinherited when her father's will gave all his money to her brother.
