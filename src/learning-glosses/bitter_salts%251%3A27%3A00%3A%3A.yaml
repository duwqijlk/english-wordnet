simpleMeaning: 'Swallowed, it eases heartburn and hard stools; given by needle, it stops fits: this water-rich
  form of magnesium sulfate.'
scope: This is a water-rich form of magnesium sulfate, taken by mouth to ease heartburn and hard stools
  and by needle to stop fits; other forms of magnesium sulfate are its nearest rivals.
examples:
- Bitter salts eased the heartburn.
- Bitter salts stopped the fits when given by needle.
