simpleMeaning: A person who studies the share market and tries to say how prices will move, from charts
  of recent prices of things bought and sold on the market
scope: A person who studies the share market and tries to say how prices will move from charts of recent
  prices, also called a chartist; not a person who buys shares and not a person who studies firms.
examples:
- The technical analyst read the charts before the market opened.
- A technical analyst said that prices would fall next week.
