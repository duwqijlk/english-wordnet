simpleMeaning: a public announcement that lists the acts or games that will take place at a stage show
  or a sports event
scope: This sense is not a political party's statement of aims, not a plan of action, and not a set of
  coded instructions for a computer.
examples:
- According to the program, the orchestra will play two pieces before the interval.
- He checked the program to see when the home team would play.
