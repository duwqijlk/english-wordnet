simpleMeaning: A tool used in surgery that stops blood flow by pinching shut the blood vessel
scope: This is a tool used in surgery that stops blood flow by pinching shut the blood vessel, also called
  haemostat, and not a bandage or a drug that stops bleeding.
examples:
- The surgeon clamped the vessel with a hemostat.
- A hemostat stopped the bleeding during the operation.
