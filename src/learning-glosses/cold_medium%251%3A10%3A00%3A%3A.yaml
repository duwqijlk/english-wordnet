senseId: 'cold_medium%1:10:00::'
synsetId: 06265081-n
simpleMeaning: A way of passing word that most times, though not always, asks little of the audience while
  giving much to take in, such as speech, television and cartoons.
scope: This is a way of passing word that most times asks little of the audience while giving much to
  take in; cool medium is another name for it, not a way that asks much of the audience and not a single
  show.
examples:
- 'Television is a cold medium: it asks little yet fills the eye.'
- Speech is a cold medium that gives much to take in with little effort.
