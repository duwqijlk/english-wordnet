senseId: 'staunchly%4:02:00::'
synsetId: 00468043-r
simpleMeaning: in a loyal and firm way, giving strong support and not changing your mind
scope: This is about firm, loyal support that does not weaken; it is not support given with doubt or support
  that soon ends.
examples:
- She staunchly defended her friend when others blamed her.
- They staunchly support their leader and will not leave the group.
