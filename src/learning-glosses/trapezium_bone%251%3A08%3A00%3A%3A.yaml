simpleMeaning: At the base of the thumb, in the wrist, a bone joins the first and second long bones of
  the palm.
scope: Also called os trapezium and trapezium, this is the wrist bone on the thumb side of the hand, not
  one on the little-finger side.
examples:
- At the base of the thumb sits the trapezium bone.
- The trapezium bone meets the long bones of the palm at the wrist.
