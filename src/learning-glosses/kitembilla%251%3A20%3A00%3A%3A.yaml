simpleMeaning: A bushy, thorny little tree of Sri Lanka and India, grown there for its maroon-purple fruit;
  the sweet purple flesh inside tastes like gooseberries.
scope: This is the small thorny tree itself, not its maroon-purple fruit; ketembilla, ketembilla tree
  and kitambilla are other names for the same plant.
examples:
- A kitembilla stood by the fence, small and thorny, heavy with maroon-purple fruit.
- Farmers in Sri Lanka grow kitembilla for its sweet purple fruit.
