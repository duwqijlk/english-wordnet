simpleMeaning: The gain missed by owning things that earn nothing, and the money spent to keep them.
scope: The gain missed by owning things that earn nothing, and the money spent to keep them, also called
  carrying charge; not the gain missed by selling things too cheap, and not the money spent to make things.
examples:
- The carrying cost of empty shops eats the profit.
- He counted the carrying cost of the unsold stock.
