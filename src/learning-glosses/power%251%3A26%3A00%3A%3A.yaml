simpleMeaning: the condition of a government or government official that holds office and so has governing
  authority
scope: This is the state of holding a government office, not controlling influence over others, not physical
  strength or electrical energy, not the mathematical notation for repeated multiplication, and not a
  country that can influence events throughout the world.
examples:
- The party stayed in power for another five years.
- She first came to power after the election in 2010.
