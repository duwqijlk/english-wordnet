simpleMeaning: With large crowded bunches of yellow flowers the colour of sulfur, this plant grows in
  the southeastern United States.
scope: This plant of the southeastern United States has large crowded bunches of yellow flowers the colour
  of sulfur, not the spreading plant of the northeast with small bunches of green and yellow flowers.
examples:
- The bush honeysuckle was covered in yellow flowers the colour of sulfur.
- The bush honeysuckle grew in the southeast.
