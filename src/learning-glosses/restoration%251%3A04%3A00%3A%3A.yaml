simpleMeaning: The act of bringing a thing or a person back to a good state
scope: The act of bringing a thing or person back to a good state, not a model of a past age, not a made
  thing put back, and not the state of being put back.
examples:
- The restoration of the old hall took five years.
- Her restoration to health was slow but sure.
