simpleMeaning: Grown for show, this shrub keeps its leaves all year and bears small white flowers shaped
  like little bells in the southeast of the United States.
scope: A fetterbush or a mountain fetterbush is another name for it, and it is a shrub of the southeast
  of the United States with small white flowers shaped like little bells.
