simpleMeaning: In electricity, the force that slows the flow of power and comes from coils and stored
  charge, not from resistance
scope: The slowing of power by coils and stored charge, not the slowing by resistance and not the power
  itself.
examples:
- A high reactance in the circuit slowed the flow of power.
- The engineer worked out the reactance of the coil before she built the radio.
