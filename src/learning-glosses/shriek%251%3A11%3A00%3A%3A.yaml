simpleMeaning: a very high sound that is like the cry of a person
scope: Also called scream, screaming, and screech. This is a very high sound, like a cry, which may come
  from a thing; it is not the act of making such a sound.
examples:
- The shriek of the brakes made everyone turn round.
- We heard the shriek of a shell passing over our heads.
