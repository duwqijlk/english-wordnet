simpleMeaning: a member of a group in politics who always keeps to the group's official views
scope: A member of a group in politics who always keeps to the group's official views; not a voter with
  no group, and party man and party woman are the male and female forms of this same kind of member.
examples:
- He was a party liner who never broke ranks.
- As a party liner, she voted as the group told her to.
