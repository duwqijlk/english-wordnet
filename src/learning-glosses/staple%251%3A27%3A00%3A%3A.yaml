simpleMeaning: stuff that can be turned into other things, used as it is, or given a final finish
scope: Material fit for making, using or finishing things, not a basic good that people always need and
  not a paper fastener.
examples:
- The mill bought staples of wool for its looms.
- Good staples make good cloth.
