simpleMeaning: to do with measuring how much of something there is
scope: To do with measuring amounts; not about the kind or quality of a thing, and not the verse sense
  about how long each sound in a line lasts.
examples:
- The study used quantitative methods to count how many people agreed.
- They wanted quantitative results, so they measured the weight of each sample.
