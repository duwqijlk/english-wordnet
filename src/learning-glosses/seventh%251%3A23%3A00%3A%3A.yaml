simpleMeaning: one of the parts when a whole thing is cut into seven parts that are all the same size
scope: One part of a whole cut into seven same-size parts; not the music sense about the distance between
  notes, and not the place of number seven in a list.
examples:
- One seventh of the pie was left after dinner.
- She ate a seventh of the cake.
