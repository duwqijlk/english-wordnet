simpleMeaning: 'In physical chemistry, a fourth state of matter besides solid, liquid, gas, in stars and
  fusion reactors: gas heated until atoms lose all electrons, leaving charged nuclei and free electrons.'
scope: The state of matter found in stars and fusion reactors, not blood plasma, the liquid part of blood,
  nor the green gemstone of the same name.
examples:
- Scientists study plasma in stars and fusion reactors.
- Heated gas turns into plasma when its atoms lose their electrons.
