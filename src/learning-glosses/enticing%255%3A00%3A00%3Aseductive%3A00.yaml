simpleMeaning: very pleasing and strong enough to make you hope for something or want it
scope: 'Also called tempting, alluring and beguiling: very pleasing and able to make you want something,
  not just nice in a weak way.'
examples:
- The shop window showed an enticing cake that made her want to buy one.
- They sent him an enticing offer of work in a new city.
