simpleMeaning: to force a rule, a limit, or a bad thing on people in a strong way
scope: To put a rule or harm on people by force, not to hold things together with a tool that presses
  on them, and not the tool itself.
examples:
- The army clamped a strict curfew on the capital.
- The new rulers clamped heavy taxes on the people.
