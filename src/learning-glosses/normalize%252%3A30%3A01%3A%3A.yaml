senseId: 'normalize%2:30:01::'
synsetId: 00469149-v
simpleMeaning: to make something usual and as it should be, or to make it follow a set rule or level
scope: This sense means making a thing usual or making it follow a set rule; it is not the heating and
  cooling sense, and it is not a thing becoming usual by itself.
examples:
- The editor normalized the spelling of names across the whole book.
- The machine normalized the temperature in the room before the test began.
