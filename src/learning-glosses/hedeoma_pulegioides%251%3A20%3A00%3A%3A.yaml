simpleMeaning: An upright hairy branching American herb with purple-blue flowers, yielding an essential
  oil, a scented plant oil, that keeps insects away and is sometimes used in folk medicine.
scope: Also called pennyroyal and American pennyroyal; a herb whose oil keeps insects away, not a mint
  for cooking.
examples:
- Hedeoma pulegioides grew by the path.
- We crushed Hedeoma pulegioides leaves to keep off flies.
