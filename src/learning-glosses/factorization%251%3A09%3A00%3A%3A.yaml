simpleMeaning: In mathematics, splitting an expression into parts that multiply together to give the first
  expression
scope: This is breaking a maths expression into its multiplying parts; factoring and factorisation are
  other names for this sense; not adding parts together and not solving an equation.
examples:
- Factorization turns 12 into 2 times 6.
- He used factorization to break down the expression.
