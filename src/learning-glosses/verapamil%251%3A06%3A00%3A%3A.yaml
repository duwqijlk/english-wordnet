simpleMeaning: a drug called Calan and Isoptin, taken by mouth or by needle, that blocks calcium to treat
  high blood pressure, a heart failing with fluid buildup, chest pain, and migraine
scope: A drug called Calan and Isoptin, used for high blood pressure, a heart failing with fluid buildup,
  chest pain, and migraine; not a drug for pain alone.
examples:
- Her doctor gave her verapamil for her high blood pressure.
- He takes verapamil each morning to ease his chest pain.
