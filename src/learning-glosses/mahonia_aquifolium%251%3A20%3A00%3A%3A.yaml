simpleMeaning: A garden shrub that keeps its leaves through winter, from the Pacific coast of North America,
  with dark green paired leaves and bunches of yellow flowers followed by blue-black berries.
scope: 'Also called holly-leaves barberry, hollygrape, mountain grape, Oregon grape and Oregon holly grape:
  an evergreen garden shrub with dark green leaves, yellow flower bunches and blue-black berries, not
  the true grape vine.'
examples:
- Mahonia aquifolium grew by the wall, its yellow flowers in bunches.
- We planted Mahonia aquifolium for its dark green leaves and blue-black berries.
