simpleMeaning: a show of music by people who play instruments or sing, with no acting or story on stage
scope: A live show of music by players or singers; not a play with acting and a story on stage.
examples:
- We went to a concert where a band played songs all evening.
- The school held a concert with singers and piano players on stage.
