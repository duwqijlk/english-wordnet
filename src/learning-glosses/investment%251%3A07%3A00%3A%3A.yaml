senseId: 'investment%1:07:00::'
synsetId: 04654542-n
simpleMeaning: the giving of time, energy, or effort to a project in the hope that it will produce a good
  result.
scope: This is not money put into a business, and not the money itself; it is time, energy, or effort
  given to a project.
examples:
- The success of the choir owed much to the personal investment of its volunteers.
- He saw the long training as an investment in his own future.
