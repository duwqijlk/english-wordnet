simpleMeaning: Clear red spots come first, then a rash, in this sudden sickness that spreads very easily
  from a virus and strikes mostly children.
scope: 'Also called measles and morbilli: a sudden sickness that spreads very easily, with red spots first
  and then a rash, mostly in children.'
examples:
- The child with rubeola had clear red spots, and a rash followed.
- Rubeola mostly strikes children, and its red spots come before the rash.
