simpleMeaning: An ax used to kill cattle for meat, with a hammer on the side opposite its blade
scope: 'Also called poleaxe: this is a tool for killing cattle, not the long battle ax used in the Middle
  Ages and not the verb that means to knock someone down.'
examples:
- The worker used a poleax to kill the cattle.
- A poleax has a hammer on one side and a blade on the other.
