simpleMeaning: to change from a gas into a liquid and fall as drops
scope: 'Also called distill and distil: to change from a gas into a liquid and fall as drops. Not the
  sense where a thing forms or grows because of this change.'
examples:
- Steam condenses on the cold mirror and forms small drops.
- Cold air made the steam condense into drops of water.
