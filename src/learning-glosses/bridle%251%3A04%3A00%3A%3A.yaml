simpleMeaning: the act of holding back someone's power or actions, or of keeping something from going
  too far
scope: 'Also called check or curb: the act of holding back power or action, not the headgear on a horse.'
examples:
- His common sense is a bridle to his quick temper.
- The new law put a bridle on the company's power.
