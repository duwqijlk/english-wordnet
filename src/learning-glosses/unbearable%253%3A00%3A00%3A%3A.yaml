simpleMeaning: too painful, bad, or hard for a person to accept or live with
scope: 'Also called intolerable: too painful or bad to live with, not just a little unpleasant or hard.'
examples:
- The heat in the small room became unbearable.
- He found the pain in his back unbearable.
