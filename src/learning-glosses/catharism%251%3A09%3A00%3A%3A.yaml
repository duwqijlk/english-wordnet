simpleMeaning: A Christian movement of southern France, 12th and 13th centuries, from Manichaeism, teaching
  two opposed powers, one good and one evil, coexist; wiped out as heresy in the Inquisition.
scope: Not Manichaeism itself, nor other medieval Christian movements; also called Albigensianism.
examples:
- Catharism spread in southern France.
- The Inquisition wiped out Catharism.
