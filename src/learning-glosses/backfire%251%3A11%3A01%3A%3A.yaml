simpleMeaning: the movement of gases and unburned gunpowder back out of a gun after the gun is fired
scope: 'Also called blowback: gases and powder going back after a gun is fired, not the loud noise from
  a car engine and not a fire set on purpose to stop a bigger fire.'
examples:
- Backfire from the old rifle pushed gas back toward the shooter.
- A backfire sent unburned powder back out of the gun.
