simpleMeaning: A bent beak made for drinking the sweet juice of flowers marks this small songbird of the
  warm lands of the Americas, whose feathers are bright.
scope: It is a songbird of the Americas with a bent beak, not the wax-eating bird of Africa and Asia called
  a honey guide, nor the finch of Hawaii with the same name.
examples:
- A honeycreeper drank nectar from a flower.
- The honeycreeper sang as it moved from flower to flower.
