simpleMeaning: one layer of soil or of the ground below it, seen in a cut that runs straight down through
  the land
scope: One layer of soil in a cut through the land, not the great ring on the round sky above us.
examples:
- The dark horizon of soil lay just under the grass.
- Each horizon in the pit showed a different kind of earth.
