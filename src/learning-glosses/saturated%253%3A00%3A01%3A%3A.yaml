simpleMeaning: Of a liquid mix, holding as much of a substance as it can at a given heat, so no more of
  it can dissolve
scope: Of a liquid mix holding as much as it can at a given heat, with concentrated as another name for
  this sense; not a colour at full strength and not a compound with all its bonds filled.
examples:
- The saturated solution could take no more salt.
- Stir the saturated mix until nothing more will dissolve.
