senseId: 'periodic_sentence%1:10:00::'
synsetId: 06296593-n
simpleMeaning: A word group with more than one part, in which the main part comes last, after the less
  important part.
scope: A word group with more than one part whose main part comes last, after the less important part,
  not a word group with only one part and not a word group whose main part comes first.
examples:
- The periodic sentence held its main part to the end.
- She wrote a periodic sentence with the main clause last.
