senseId: 'spikelet%1:20:01::'
synsetId: 83538585-n
simpleMeaning: 'In grasses especially, the small congested final flower cluster of a shoot: one or a few
  tightly packed florets on a tiny stalk, with two glumes at the base.'
scope: The basic flower unit of a grass head, holding one or a few florets; not a single floret, and not
  the whole ear or panicle that carries many of them. Botanical.
examples:
- Each spikelet on the nodding panicle held three green florets.
- We counted the glumes at the base of every spikelet.
