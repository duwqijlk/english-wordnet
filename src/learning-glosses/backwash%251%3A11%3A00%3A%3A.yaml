simpleMeaning: The trail of waves a boat leaves in the water behind it as it goes forward.
scope: Also called a wake, the trail of waves a boat leaves in the water behind it, not the flow of air
  driven back by an aircraft propeller.
examples:
- The backwash from the motorboat rocked the small canoe.
- We watched the backwash spread behind the ferry as it left the dock.
