simpleMeaning: Someone who believes that markets work best when government leaves them alone and they
  regulate themselves.
scope: This is about economic beliefs only, not about someone who supports social reform and personal
  rights, and not about being open to new ideas.
examples:
- As an economic liberal, she opposed the new price controls.
- The party's liberals pushed for free trade and open markets.
