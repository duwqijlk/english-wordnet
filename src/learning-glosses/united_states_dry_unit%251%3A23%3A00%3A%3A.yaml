simpleMeaning: A measure of how much loose goods a holder can take, set down by law in the land's own
  set of measures.
scope: This is a measure of how much loose goods a holder can take, set down by law in the land's own
  set of measures, different from a measure for liquids and from a measure of weight.
examples:
- A United States dry unit measures dry goods like grain.
- The recipe called for one United States dry unit of flour.
