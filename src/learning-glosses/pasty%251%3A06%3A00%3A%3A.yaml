simpleMeaning: one of a pair of sticky patches, usually in the plural, worn to cover the nipples of dancers
  who take their clothes off for show
scope: One of a pair of sticky patches worn to cover the nipples of dancers, usually in the plural; not
  a small meat pie and not a word for pale skin.
examples:
- The pasties were part of her stage costume.
- She fixed her pasties before going on stage.
