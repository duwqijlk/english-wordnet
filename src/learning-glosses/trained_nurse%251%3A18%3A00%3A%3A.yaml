simpleMeaning: A person who has finished a course of study at a school that teaches care of the sick,
  with work in a hospital as part of it
scope: A person who has finished a full course of study in care of the sick, not an untrained helper and
  not a doctor.
examples:
- The trained nurse took charge of the ward.
- After three years, she became a trained nurse.
