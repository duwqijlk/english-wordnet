simpleMeaning: feeling strong emotion, such as pity or sadness, that you want to show because of something
  you saw or heard
scope: This is not about changing position or going to live in a new home; it describes how a person feels.
examples:
- She was deeply moved by the old man's story.
- Everyone in the room felt moved when the choir sang.
