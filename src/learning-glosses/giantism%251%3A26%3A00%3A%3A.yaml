simpleMeaning: Being far too big, most often because too much growth chemical comes from the pituitary
  gland
scope: This is being far too big, most often because too much growth chemical comes from the pituitary
  gland; gigantism and overgrowth are other names for this sense, not simply being tall and not fatness.
examples:
- Giantism made the boy far taller than his friends.
- Doctors traced her giantism to the pituitary gland.
