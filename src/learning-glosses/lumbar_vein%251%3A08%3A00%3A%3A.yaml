simpleMeaning: Blood tubes that drain the back wall of the body and the net of small blood tubes around
  the lower spine.
scope: Also called vena lumbalis, these blood tubes drain the back wall of the body and the net of small
  blood tubes around the lower spine.
examples:
- The lumbar vein drains blood from the lower back.
- Blood leaves the back wall through the lumbar veins.
