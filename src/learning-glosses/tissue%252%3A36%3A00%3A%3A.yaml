simpleMeaning: to make a piece of cloth by crossing threads over and under each other, threads such as
  wool or cotton
scope: 'Also called weave: this is making cloth, not a group of cells that make up a part of a living
  body.'
examples:
- The workers tissue wool into cloth on large frames.
- She learned to tissue cotton into a strong, soft cloth.
