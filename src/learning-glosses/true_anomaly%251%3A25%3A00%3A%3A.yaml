simpleMeaning: the angle of a point in its path round a star or planet, past the point nearest to that
  star or planet, counted in degrees
scope: This is an angle that tells how far a body has moved past the nearest point in its path, not the
  path itself and not the distance in miles.
examples:
- The true anomaly told them how far the comet had moved past its nearest point.
- They worked out the true anomaly of the satellite from its orbit.
