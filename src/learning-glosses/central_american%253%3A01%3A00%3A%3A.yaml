simpleMeaning: Of, or to do with, the lands between North and South America, or their people or tongues.
scope: This is the adjective form, used to describe things, people, and languages of that middle part
  of the Americas, and not the noun for a person who lives there.
examples:
- Central American food uses corn and beans.
- She studied Central American languages at school.
