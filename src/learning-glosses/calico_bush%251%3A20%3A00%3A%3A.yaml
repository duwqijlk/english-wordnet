scope: A North American shrub that keeps its leaves all year, with shiny leaves and white or pink flowers;
  mountain laurel and wood laurel are other names for this sense, not a plant that loses its leaves in
  winter.
examples:
- The calico bush in the garden was covered in white flowers.
- We planted a calico bush beside the fence.
