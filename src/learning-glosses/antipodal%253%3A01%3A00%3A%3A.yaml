simpleMeaning: about, or on, places that lie on opposite sides of the earth from each other
scope: 'Also called antipodean: about, or on, places that lie on opposite sides of the earth from each
  other, not places near each other and not places on the same side of the earth.'
examples:
- The antipodal regions of the earth have opposite seasons.
- These two cities lie at antipodal points on the globe.
