simpleMeaning: A perennial with one to four white bell-shaped flowers on upright stems, edible bulbs eaten
  in hard times, native from Montana and the Dakotas south to Arizona and New Mexico.
scope: This is the white-flowered western plant with edible bulbs, not a cultivated garden lily.
examples:
- The sego lily is the state flower of Utah.
- Pioneers dug sego lily bulbs when food was scarce.
