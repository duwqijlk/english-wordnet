simpleMeaning: The main feeling nerve of the face, which also moves the chewing muscles
scope: The main feeling nerve of the face, which also moves the chewing muscles; trigeminal, trigeminal
  nerve, fifth cranial nerve and nervus trigeminus are other names for this sense, not a nerve of the
  eye only and not a nerve of the ear.
examples:
- The trigeminus is the chief sensory nerve of the face.
- The trigeminus also drives the muscles used in chewing.
