simpleMeaning: A public ground in ancient Greece or Rome where wrestlers and other athletes trained
scope: A public ground in ancient Greece or Rome where wrestlers and other athletes trained; palestra
  is another name for it, not a theatre and not a bath house.
examples:
- The palaestra stood beside the baths in the old city.
- Young wrestlers trained daily in the palaestra.
