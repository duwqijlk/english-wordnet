senseId: 'tonne-kilometre%1:23:01::'
synsetId: 92410103-n
simpleMeaning: By one kind of transport, one thousand kilograms of goods carried over one thousand metres
  makes one unit of freight work.
scope: Freight work is counted in these units, also called tkm and tonne-kilometer.
examples:
- A transport of 1250 kilograms over 90 kilometres equals 112.5 tonne-kilometres.
- The freight was counted in tonne-kilometres.
