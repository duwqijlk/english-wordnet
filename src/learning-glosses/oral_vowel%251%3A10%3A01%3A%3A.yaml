simpleMeaning: In linguistics, a plain speech sound made with the mouth open and no air going through
  the nose
scope: In linguistics, a plain speech sound made without air through the nose; not a sound made through
  the nose and not a sound made with the mouth shut.
examples:
- The oral vowel in 'cat' is made without air passing through the nose.
- She learned to say the oral vowel with her soft palate raised.
