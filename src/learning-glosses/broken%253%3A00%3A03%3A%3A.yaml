senseId: 'broken%3:00:03::'
synsetId: 00290460-a
simpleMeaning: Having been ignored or gone against, especially in the case of a promise or contract.
scope: A promise or contract that has been ignored or gone against; not something smashed into pieces,
  not something with gaps or jumps, and not a machine that no longer works.
examples:
- He was furious that the company had broken its promise.
- The contract was broken when the supplier missed every deadline.
