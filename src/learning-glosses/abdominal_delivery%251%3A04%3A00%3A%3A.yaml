simpleMeaning: the birth of a baby by a cut through the mother's belly wall and womb, named from the old
  tale that Julius Caesar was born this way
scope: Also called cesarean, caesarian, caesarean, cesarian, cesarean delivery, caesarean delivery, caesarian
  delivery, cesarean section, caesarean section, caesarian section, and cesarian section, not a birth
  through the birth canal.
examples:
- Her second child came by abdominal delivery after a long labour.
- The doctor chose abdominal delivery because the baby was in the wrong position.
