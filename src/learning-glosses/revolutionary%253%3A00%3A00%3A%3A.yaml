simpleMeaning: supporting complete change in how a country is ruled, or taking part in such change
scope: Describes people or groups that support or take part in complete change in government; not the
  person who supports it, and not the sense that means very new.
examples:
- Revolutionary groups printed secret pamphlets calling for a new government.
- The revolutionary army took control of the capital city.
