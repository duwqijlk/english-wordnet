simpleMeaning: At meals, this person takes big mouthfuls and swallows them in a rush
scope: A person who eats fast and takes big mouthfuls, not a slow eater and not a person who eats only
  a little.
examples:
- The gobbler finished his lunch in two minutes.
- He was such a gobbler that his plate was empty in no time.
