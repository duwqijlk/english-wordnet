simpleMeaning: A thin double skin round the tiny knot of blood tubes in the part of the kidney that filters
  blood.
scope: A thin double skin round the tiny knot of blood tubes in the part of the kidney that filters blood;
  glomerular capsule is another name for this sense, not the knot itself and not the whole kidney.
examples:
- The capsula glomeruli wraps round the tiny knot of blood tubes.
- Damage to the capsula glomeruli harms the kidney's filter.
