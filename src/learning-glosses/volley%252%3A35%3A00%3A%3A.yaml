simpleMeaning: to fire a lot of shots at once, as if in one burst
scope: To fire many shots at once; not to hit a tennis ball before it bounces, and not to be hit by shots.
examples:
- The attackers volleyed gunshots at the civilians.
- The soldiers volleyed shots into the air.
