simpleMeaning: The United States government office that works to improve pay and working conditions for
  people who earn wages; set up in 1913
scope: This is the United States government office that works for people who earn wages; Labor, DoL and
  Labor Department are other names for it, and it is not the office that runs national transport.
examples:
- The Department of Labor released new rules on overtime pay.
- She wrote to the Department of Labor about unsafe work.
