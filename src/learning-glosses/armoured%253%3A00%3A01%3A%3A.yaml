simpleMeaning: kept safe by a strong covering made for fighting, used of people or things in war
scope: 'Also called armored: kept safe by a strong covering made for fighting, used of people or things
  in war. Not just wearing thick clothes and not just having a hard outer part.'
examples:
- The armoured soldiers rode in a vehicle with thick metal sides.
- An armoured unit moved forward under fire from the other side.
