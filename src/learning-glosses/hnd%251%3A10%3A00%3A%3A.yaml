simpleMeaning: Good students may go on to a course that leads to a degree after this diploma for learning
  a trade, which gets students ready for work in one area.
scope: Also called Higher National Diploma; this diploma is for learning a trade, not the degree it can
  lead to.
examples:
- She earned her HND in business studies before going to university.
- His HND in engineering helped him get a job in a factory.
