simpleMeaning: One of many kinds of meat-eating animal from the Triassic to the Cretaceous, a two-legged
  creature that walked or ran on strong back legs, with short front legs.
scope: People also call this a bird-footed dinosaur and a theropod.
examples:
- The theropod dinosaur chased other animals for food.
- A theropod dinosaur walked on its strong back legs.
