simpleMeaning: A shrub from North America that keeps its leaves all year, with shiny leaves and white
  or pink flowers
scope: 'Also called calico bush and mountain laurel: a shrub with shiny leaves and white or pink flowers,
  not the Eurasian shrub with yellow-green flowers.'
examples:
- Wood laurel grows along the mountain road.
- The wood laurel in the garden has white flowers.
