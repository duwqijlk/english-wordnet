senseId: 'sexuality%1:07:00::'
synsetId: 05014082-n
simpleMeaning: the things about a living thing that show whether it is male or female, from the part it
  plays in making new life
scope: The things that show whether a living thing is male or female; sex and gender are other names for
  this sense, not the desire for sex and not a person's sexual behaviour.
examples:
- The sexuality of the plant can be seen in its flowers.
- In many animals, sexuality can be seen in size and colour.
