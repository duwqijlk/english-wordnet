senseId: 'gradient%1:24:00::'
synsetId: 13881709-n
simpleMeaning: a change that goes up or down step by step in the size or amount of something that can
  be measured, such as heat or length
scope: This is a step-by-step change in size or amount, not how much a line or a surface leans away from
  being level.
examples:
- The temperature gradient grows smaller as you go deeper into the sea.
- A strong pressure gradient between the two areas drives the wind.
