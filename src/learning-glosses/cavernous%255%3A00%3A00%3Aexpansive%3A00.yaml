simpleMeaning: filled with small spaces that hold blood, so it can swell and grow stiff when blood fills
  it
scope: A part of the body filled with blood spaces that can swell and stiffen, not a large hollow cave-like
  place.
examples:
- The cavernous tissue in the penis fills with blood and grows stiff.
- Cavernous tissue can swell when blood flows into it.
