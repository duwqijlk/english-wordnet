simpleMeaning: Any of many weedy plants, mostly from North America, that make up the plant group Ambrosia
  and whose pollen triggers strong allergic reactions and much hay fever and asthma.
scope: The Ambrosia weed that causes hay fever, not ragwort, a different weed; 'ambrosia' and 'bitterweed'
  are other names for it.
examples:
- Ragweed pollen is a common cause of hay fever.
- People with asthma often react badly to ragweed.
