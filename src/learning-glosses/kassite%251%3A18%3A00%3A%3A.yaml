simpleMeaning: This person is one of an old people who ruled Babylonia from sixteen hundred to twelve
  hundred before Christ was born.
scope: 'Also called Cassite: one of an old people who ruled Babylonia, not a speaker of their language
  and not a member of a later people.'
examples:
- He was a Kassite, one of the people who ruled Babylonia long ago.
- The Kassite kings held power in Babylonia for hundreds of years.
