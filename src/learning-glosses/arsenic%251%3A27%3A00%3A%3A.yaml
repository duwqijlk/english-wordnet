simpleMeaning: A very poisonous metal with three unlike forms, used to kill weeds and bugs and in some
  metal mixes; found in arsenopyrite, orpiment and realgar.
scope: This is a very poisonous metal, also called As, atomic number 33, not a weed killer itself nor
  any other poison.
examples:
- Farmers once used arsenic to kill weeds.
- Arsenic is found in the mineral orpiment.
