simpleMeaning: a blood tube that joins the blood tube of the face and drains blood from the top lip
scope: This is a blood tube that joins the blood tube of the face and drains blood from the top lip, also
  called vena labialis superior; not a blood tube that drains the lower lip and not the blood tube of
  the face itself.
examples:
- The superior labial vein drains blood from the upper lip into the facial vein.
- The superior labial vein joins the blood tube of the face near the mouth.
