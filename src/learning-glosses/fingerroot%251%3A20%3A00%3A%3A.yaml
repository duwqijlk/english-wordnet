simpleMeaning: A tall leafy European plant that lives two years or more and bears bunches of tube-shaped
  pink-purple blooms; its foliage provides the heart drug digitalis but poisons livestock.
scope: The European foxglove, the same poisonous plant that fairy bell and finger-flower name; not a bellflower
  or another plant with bell-shaped blooms.
examples:
- Fingerroot grows well in the shade of a hedge, sending up leafy stems topped with pink-purple blooms.
- The leaves of fingerroot yield digitalis but are poisonous to animals.
