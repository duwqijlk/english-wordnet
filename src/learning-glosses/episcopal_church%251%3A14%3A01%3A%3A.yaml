simpleMeaning: A self-governing part of the Anglican Communion in Scotland.
scope: This is the Scottish branch of the Anglican Communion, also called the Episcopal Church of Scotland,
  not the whole Communion or any other church in Scotland.
examples:
- The Episcopal Church in Scotland governs itself.
- She joined the Episcopal Church after moving to Edinburgh.
