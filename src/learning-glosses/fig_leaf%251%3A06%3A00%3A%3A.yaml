simpleMeaning: A cover made of anything, used to hide something thought to be shameful.
scope: A cover made of anything, used to hide something thought to be shameful; not a real leaf and not
  an honest way of showing the truth.
examples:
- His excuse was only a fig leaf for the real reason.
- The report was a fig leaf to hide the failure.
