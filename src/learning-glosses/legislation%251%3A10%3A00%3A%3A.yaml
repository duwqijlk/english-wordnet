simpleMeaning: A law made by the group of people who have the power to make laws
scope: A law made by the group of people who have the power to make laws; not a rule made by a single
  ruler, and not a court's ruling on one case.
examples:
- New legislation will make it harder to sell guns to children.
- The legislation passed last year changed the tax on fuel.
