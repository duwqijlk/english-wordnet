simpleMeaning: with long thin lines on it, or with long thin areas of a different colour, or seeming to
  have such lines or areas
scope: 'Also called streaked: having long thin lines or long thin areas of a different colour, or seeming
  to have them; not dirty in a general way and not marked with short spots.'
examples:
- Her streaky hair had light lines through the dark colour.
- The child wiped his streaky face with a cloth.
