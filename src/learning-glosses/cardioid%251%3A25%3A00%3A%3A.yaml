simpleMeaning: A curve shaped like a heart, made by a circle rolling round another circle of the same
  size.
scope: A curve shaped like a heart, made by a circle rolling round another circle of the same size, not
  a plain circle and not an oval.
examples:
- The cardioid is the curve of a circle rolling round another circle.
- Draw a cardioid by rolling a coin round a coin of the same size.
