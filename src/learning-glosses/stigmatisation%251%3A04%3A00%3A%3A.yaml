senseId: 'stigmatisation%1:04:00::'
synsetId: 01225977-n
simpleMeaning: The act of marking a person as bad or shameful
scope: The act of marking a person as bad or shameful, with stigmatization as another name for this sense,
  not the act of praising a person and not the act of punishing a person.
examples:
- The stigmatisation of the sick kept them from seeking help.
- Stigmatisation can hurt a whole group of people.
