simpleMeaning: In law, questions put to a witness before a trial, usually in a lawyer's office.
scope: In law, questions put to a witness before a trial; not the act of removing a powerful person from
  office and not the laying down of a deposit.
examples:
- The lawyer asked for a deposition from the witness before the trial began.
- During the deposition, she answered questions in the lawyer's office.
