simpleMeaning: a set of ideas that calls for bringing down the way a country or people are ruled and live
  together, just to bring it down
scope: This sense is a set of ideas about bringing down the way people live together under a government,
  for that end alone; it is not a general feeling that life has no meaning.
examples:
- His support for nihilism led him to call for the whole system of government to be torn down.
- The group taught nihilism and wanted to destroy the old order just for the sake of destroying it.
