senseId: 'motif%1:06:00::'
synsetId: 03794547-n
simpleMeaning: a design or picture made up of shapes or colours that come again and again, as in buildings
  or in things made to look good
scope: This sense is a design for buildings or for making things look good, also called motive; it is
  not a repeated idea in a book or work of art, and not a repeated theme in music.
examples:
- The wall had a leaf motif that repeated across the top.
- She chose a cloth with a small flower motif.
