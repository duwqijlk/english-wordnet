simpleMeaning: Worn over trousers, a long top with long sleeves and panels at the front and back is the
  old-style dress of women in Vietnam.
scope: This old-style dress of Vietnamese women is a long top with flaps front and back, worn over trousers,
  not a dress worn without trousers beneath.
examples:
- She wore an ao dai over trousers.
- The ao dai has long sleeves and panels front and back.
