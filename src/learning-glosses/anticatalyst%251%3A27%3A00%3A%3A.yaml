simpleMeaning: This stuff, used in chemistry, holds back a chemical change by weakening the thing that
  speeds such a change up.
scope: A chemical change runs slower when this stuff is in it, because it weakens the thing that speeds
  such a change up.
examples:
- The anticatalyst slowed the chemical change in the mix.
- Adding the anticatalyst weakened the thing that speeds the change up.
