simpleMeaning: To press a title or design into the cover of a book with a carved stamp.
scope: Marking a book's cover with a carved stamp; not forming something into solid pieces, not shaping
  an object over a form, and not holding or lifting something with a solid support.
examples:
- The binder blocked the title in gold on the spine.
- A small design was blocked on the front cover.
