simpleMeaning: A paper roll given out at a party, usually holding sweets or a small gift, that makes a
  popping sound when both ends are pulled.
scope: 'Also called a cracker or a cracker bonbon: a paper roll that pops when pulled, not the biting
  turtle and not a fish of the same name.'
examples:
- Each snapper at the table held a tiny toy inside.
- The children pulled their snappers at the same time, and they all popped.
