simpleMeaning: an event or act that is of little importance beside the main event
scope: This sense is a small, unimportant thing beside a main event, not the main event itself and not
  a small show at a fair.
examples:
- The argument was only a sideshow; the real vote came later.
- The court case was a sideshow compared with the main election story.
