simpleMeaning: The waves set aside for sending radio or television shows form a set of radio waves next
  to each other.
scope: Also called a waveband, this names a set of radio waves next to each other, set aside for sending
  radio or television shows.
examples:
- The station broadcasts on a frequency band set aside for local radio.
- Television signals travel on a different frequency band.
