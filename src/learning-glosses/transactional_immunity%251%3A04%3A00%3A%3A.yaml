simpleMeaning: No charge can come out of the deals a witness spoke about in court, since this wider shield
  covers more than their words alone.
scope: This is the wider shield that keeps a witness safe from any charge coming out of the deals they
  spoke about.
examples:
- The witness spoke freely once transactional immunity was granted.
- His deals could not be used against him under transactional immunity.
