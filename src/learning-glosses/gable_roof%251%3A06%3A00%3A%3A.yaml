simpleMeaning: a house top that slopes down on two sides, with a high line along the top and a wall part
  shaped like a triangle at each end
scope: A house top that slopes down on two sides, not a flat top and not a top that slopes down on one
  side only.
examples:
- The cottage has a gable roof with a high ridge.
- Snow slid off the gable roof after the storm.
