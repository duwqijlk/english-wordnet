simpleMeaning: A rare orchid of cool northern bogs, bearing one white to pink flower marked with purple
  at the tip of an upright reddish stalk above one leaf at the base.
scope: Also called calypso and fairy-slipper; a rare orchid of northern bogs with one white to pink flower,
  not a common garden orchid and not a tropical orchid.
examples:
- Calypso bulbosa grows in northern bogs.
- We found Calypso bulbosa with a single pink flower.
