simpleMeaning: to do with the middle, in the middle, or reaching toward the middle
scope: Describing a thing that is in or points to the middle, also called medial; not the noun for a number
  in a set, and not the describing word for the middle value of a set.
examples:
- The insect has a dark median stripe along its back.
- A median line runs down the middle of the leaf.
