simpleMeaning: An agency that helps the head of the central spy service join up work against terrorists,
  to catch and stop their attacks at the earliest stage.
scope: 'Also called the Counterterrorist Center: a spy-service agency that joins up work against terrorists,
  distinct from the spy service itself and from police forces.'
examples:
- The CTC shares its findings with other spy services.
- A CTC officer helped join up the work against the plotters.
