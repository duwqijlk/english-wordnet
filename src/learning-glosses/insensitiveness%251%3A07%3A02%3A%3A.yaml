senseId: 'insensitiveness%1:07:02::'
synsetId: 04851255-n
simpleMeaning: Not being able to sense or answer changes in how the people around you feel
scope: Not noticing or answering changes in the feelings of people around you, also called insensitivity;
  not a lack of feeling in the body and not coldness on purpose.
examples:
- His insensitiveness to his wife's sadness made the quarrel worse.
- Her insensitiveness showed when she missed the change in her friend's mood.
