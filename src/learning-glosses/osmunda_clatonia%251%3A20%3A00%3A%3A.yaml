simpleMeaning: A North American fern with tall upright divided fronds and a few spore-bearing leaflets
  at or near the middle of the fruiting fronds.
scope: 'Also called interrupted fern: a North American fern with tall upright divided fronds and a few
  spore-bearing leaflets at or near the middle of the fruiting fronds, not a low ground fern and not a
  tree fern.'
examples:
- Osmunda clatonia grew tall in the damp wood.
