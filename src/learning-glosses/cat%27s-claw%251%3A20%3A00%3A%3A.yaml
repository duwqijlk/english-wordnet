simpleMeaning: Curved, pointed pods holding shiny black seeds follow white-to-yellow flower clusters on
  this upright shrub with small or no spines; it grows in Florida and the West Indies.
scope: Another name for the same shrub as black bead and catclaw, with curved pods and shiny black seeds;
  not the unrelated black nightshade.
examples:
- Cat's-claw lines the sandy edges of hammocks in the West Indies.
- The cat's-claw shrub bore pale flower clusters above its curved pods.
