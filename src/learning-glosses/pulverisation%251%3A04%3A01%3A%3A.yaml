simpleMeaning: The act of crushing something to dust until nothing is left of it
scope: The act of crushing something to dust until nothing is left of it; pulverization is another name
  for it, not the fine dust itself and not mere grinding to powder.
examples:
- The pulverisation of the old wall took a week.
- The pulverisation of the building left only dust.
