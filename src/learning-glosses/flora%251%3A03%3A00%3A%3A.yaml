simpleMeaning: In botany, a living thing that cannot move from place to place by itself
scope: 'Also called plant: in botany, a living thing that stays in one place, not an animal that can move
  around.'
examples:
- 'A fern is flora: a living thing that stays where it grows and cannot move to a new place.'
- This tiny flower counts as flora because it is a living thing that cannot move by itself.
