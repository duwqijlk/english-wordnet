simpleMeaning: in a loving and tender way; in poems or in casual talk, the short form is sometimes used
  in its place
scope: In a loving and tender way, also called sweet; not a taste of sugar.
examples:
- She spoke sweetly to the frightened child.
- They talked sweetly to each other all evening.
