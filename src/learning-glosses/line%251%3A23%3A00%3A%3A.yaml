simpleMeaning: a unit of advertising space one column wide and one fourteenth of an inch deep.
scope: This is not a printed sentence or a drawn mark; it is a measured unit used to price advertising.
examples:
- The magazine charges by the line for small ads.
- The ad was priced at two dollars per line.
