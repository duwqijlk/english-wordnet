senseId: 'screen_saver%1:06:00::'
synsetId: 04160497-n
simpleMeaning: In computer science, a moving picture that shows on a computer display after no one has
  used it for a set time
scope: In computer science, a moving picture on a display after a set time with no use, not a still picture
  and not a picture that stays on the display all the time.
examples:
- A screen saver of swimming fish appeared after ten minutes.
- She set the screen saver to start after five minutes of no use.
