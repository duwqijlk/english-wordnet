simpleMeaning: With soft brownish-green toothed leaves, it is a low nettle of Central and South America
  that does not sting and bears bunches of small green blooms.
scope: It is also called panamica and friendship plant, and it is a low nettle of Central and South America
  that does not sting.
examples:
- The panamiga grows low in South America and does not sting.
- Panamiga bears bunches of small green flowers.
