senseId: 'peacekeeper%1:18:01::'
synsetId: 10429991-n
simpleMeaning: a member of an army or other military group sent, often with the approval of other countries,
  to keep a place of trouble free from fighting
scope: This is a member of an army or other military group sent to a place of trouble, often with the
  approval of other countries. It is not just any person who stops a fight or calms people in daily life.
examples:
- Peacekeepers were sent to the border area after the fighting.
- A peacekeeper guarded the aid trucks in the troubled region.
