senseId: 'inflected%3:00:00::'
synsetId: 00703461-a
simpleMeaning: Said of a voice that rises and falls in sound, changing its tone.
scope: Said of a voice that changes in tone; not a voice that stays flat and level.
examples:
- His voice was inflected, rising and falling as he told the tale.
- Her reading was inflected, with the tone lifting at every question.
