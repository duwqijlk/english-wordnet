scope: A European grass that spreads fast by long stems under the ground and now grows wild in North America
  as a weed; couch grass, dog grass, quackgrass, quick grass, witch grass and witchgrass are other names
  for this sense.
examples:
- Quack grass spread fast and took over.
- Farmers pull quack grass out as a weed.
