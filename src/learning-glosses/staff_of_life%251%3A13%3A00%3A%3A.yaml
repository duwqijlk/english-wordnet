simpleMeaning: Baking turns a dough of flour or meal into this food, most often after raising it with
  yeast or baking powder.
scope: Bread and breadstuff are other names for it, the food baked from a dough of flour or meal and most
  often raised with yeast or baking powder.
examples:
- They baked the staff of life from flour and yeast.
- The staff of life came out of the oven, raised with baking powder.
