senseId: 'cross_question%2:32:00::'
synsetId: 00788711-v
simpleMeaning: to ask again a witness the other side has already asked, or to put hard, close questions
  to a witness
scope: To put close questions to a witness, or to ask again one the other side has already questioned;
  cross examine is another name for this sense, and this is not a first round of questions from one's
  own side or a casual chat.
examples:
- The defence lawyer began to cross question the witness.
- He was cross questioned about his story until it changed.
