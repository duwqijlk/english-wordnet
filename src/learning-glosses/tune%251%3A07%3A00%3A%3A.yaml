simpleMeaning: the state of making each note sound at just the right pitch
scope: The state of making each note sound at just the right pitch, not a row of notes, not setting a
  radio and not making an instrument sound at the right pitch.
examples:
- He cannot sing in tune, however hard he tries.
- The clarinet was out of tune after the long journey.
