simpleMeaning: The inner ear gets its blood from this tube, which leaves the base tube.
scope: Also called internal auditory artery and labyrinthine artery, it is the base tube's branch that
  feeds the inner ear.
examples:
- The artery of the labyrinth carries blood to the inner ear.
- Blood reached the inner ear through the artery of the labyrinth.
