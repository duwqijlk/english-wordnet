simpleMeaning: The glands that make tears send them away through one of several small tubes
scope: 'Also called lachrymal duct: one of several small tubes that carry tears away from the tear glands,
  not the glands that make the tears and not the whole set of tear parts.'
examples:
- Tears flow through the lacrimal duct after they wash the eye.
- A blocked lacrimal duct can make the eye water.
