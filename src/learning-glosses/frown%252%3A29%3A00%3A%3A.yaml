simpleMeaning: Pull your brows together and look angry or sulky, as if to show you do not approve.
scope: 'The verb: drawing the brows together in displeasure, not the noun for the expression; lower is
  another name for this sense.'
examples:
- She frowned when she read the letter.
- He frowned at the noisy children and shook his head.
