simpleMeaning: A way of writing down dance moves with marks that show points on a dancer's body, the direction
  the dancer moves, the speed and the force
scope: This is a written system of marks for dance, not the dancing itself; the marks stand for body points,
  direction, speed and force.
examples:
- Labanotation records dance movements with symbols.
- She learned Labanotation to write down the dance.
