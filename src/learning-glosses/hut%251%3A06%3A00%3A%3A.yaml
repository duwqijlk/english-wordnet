simpleMeaning: a small rough place where a person lives, put up in a plain way
scope: This is a small rough place where a person lives, not a house made well and not a tent put up for
  a short stay.
examples:
- They built a small hut of wood and grass near the river and lived in it.
- The hut had one low door and a roof of leaves, and a family slept inside it.
