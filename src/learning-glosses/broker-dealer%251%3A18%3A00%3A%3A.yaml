simpleMeaning: A money expert who buys and sells for their own account, acting both as a go-between for
  others and as a buyer or seller in their own right.
scope: A money expert who trades for their own account, acting both as go-between and as buyer or seller;
  not a broker alone and not a dealer alone.
examples:
- The broker-dealer bought the shares for the firm's own account.
- As a broker-dealer, she can trade for clients and for herself.
