synsetId: 08127614-n
simpleMeaning: In biology, a group inside a kind of living thing, which usually forms when part of that
  kind is kept apart in a different place
scope: 'In biology, also called race: a group inside a kind of living thing, not the whole kind itself
  and not a single family group.'
examples:
- This subspecies of wolf lives only on the island, far from other wolves.
- The two birds look alike, but each is a subspecies of the same kind.
