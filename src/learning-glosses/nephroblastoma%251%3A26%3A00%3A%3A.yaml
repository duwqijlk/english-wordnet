simpleMeaning: In a young child, blood in the urine, high blood pressure, and a lump that can be felt
  point to a harmful growth in the kidney.
scope: Adenomyosarcoma and embryoma of the kidney are also names for this harmful growth in the kidney
  of a young child, not a growth that appears in a grown person.
examples:
- Blood in the child's urine led to the finding of a nephroblastoma.
- The nephroblastoma could be felt as a lump.
