simpleMeaning: goods covered in a hard, shiny black coating that lasts long, made and decorated in the
  traditional style of the East Asian country they are named for
scope: Covered goods with a black shiny finish, not the country in Asia, not the black finish on its own,
  and not the act of putting that finish on.
examples:
- The museum displayed a tray of fine japan with a shiny black surface.
- She collects old japan, especially small black boxes.
