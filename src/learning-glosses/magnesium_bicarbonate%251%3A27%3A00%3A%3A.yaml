simpleMeaning: A salt-like chemical, formula Mg(HCO3)2, that is one of the main causes of hard water
scope: A salt-like chemical that is one of the main causes of hard water; not a cause of soft water and
  not any chemical in tap water.
examples:
- Magnesium bicarbonate in the well water made it hard.
- Boiling can cut the magnesium bicarbonate that makes water hard.
