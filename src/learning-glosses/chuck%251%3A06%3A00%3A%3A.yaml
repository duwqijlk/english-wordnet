simpleMeaning: A holding part with jaws that move to grip a piece in a lathe, or a tool in a drill, holding
  it dead centre
scope: A holding part with jaws that grip a piece or a tool dead centre, not the cut of meat and not the
  kind pat.
examples:
- Tighten the chuck before you start the lathe.
- The drill's chuck held the bit firm.
