simpleMeaning: a tool made of a float pulled behind a ship on a rope with knots, used to tell how fast
  the ship moves through the water
scope: A tool for telling a ship's speed, not a piece of cut wood and not a written record.
examples:
- The sailor dropped the log over the side to check the speed.
- They read the log to see how fast the ship was moving.
