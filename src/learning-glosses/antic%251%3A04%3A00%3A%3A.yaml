simpleMeaning: a silly or strange act that someone does for fun
scope: Also called joke, trick, prank and caper, this is a silly act done for fun; it is not a serious
  act and not a plan to cheat someone.
examples:
- The children's antics made the whole class laugh.
- He pulled faces and did other silly antics for fun.
