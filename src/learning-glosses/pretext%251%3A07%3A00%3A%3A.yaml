simpleMeaning: A clever false front, made to look real, that hides what is really there
scope: A clever false front, made to look real, that hides what is really there; pretense, guise and pretence
  are other names for this sense; not a made-up reason given to hide a plan.
examples:
- The shop kept up a pretext of being open, but its shelves stood bare.
- Her smile was only a pretext, hiding her anger.
