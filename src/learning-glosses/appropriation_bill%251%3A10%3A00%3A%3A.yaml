synsetId: 06549115-n
simpleMeaning: A law put forward to allow public money to be spent for a stated purpose.
scope: A law put forward to allow public money to be spent for a stated purpose, not a law that spends
  the money itself and not a private spending plan.
examples:
- Congress passed the appropriation bill for the new road.
- The appropriation bill sets out how the money will be spent.
