simpleMeaning: The natural breaking down of a dead living thing as it rots.
scope: The rotting of dead living matter, also called decay; not the splitting of a chemical into parts,
  and not the state of being rotted.
examples:
- Decomposition set in soon after the animal died.
- The smell of decomposition hung over the wood.
