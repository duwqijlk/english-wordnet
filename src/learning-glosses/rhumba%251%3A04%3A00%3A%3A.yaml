simpleMeaning: A dance of the folk, in two-time, born in Cuba with Spanish and African parts, marked by
  tricky footwork and fierce movement.
scope: A dance of the folk, in two-time, born in Cuba with Spanish and African parts, marked by tricky
  footwork and fierce movement; also called rumba; not broken-time music in two-time for dancing the rumba,
  nor a ballroom dance built on the Cuban folk dance, nor to dance the rhumba.
examples:
- Their rhumba filled the hall.
- The rhumba was danced at dusk.
