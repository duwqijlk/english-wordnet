simpleMeaning: A small tree or shrub of New Zealand with many side bunches of sweet-smelling white flowers
  and bark used for rope.
scope: 'Also called houhere, lacebark and ribbonwood: a small tree or shrub of New Zealand with many side
  bunches of sweet-smelling white flowers and bark used for rope; other New Zealand trees have flowers
  in bunches at the ends of branches or bark of no use for rope.'
examples:
- Hoheria populnea grows in New Zealand with sweet-smelling white flowers.
- The bark of Hoheria populnea was once used for rope.
