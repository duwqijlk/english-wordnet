simpleMeaning: The thick, sweet-smelling underground part of a kind of plant with long green stalks, eaten
  as food.
scope: The thick sweet-smelling underground part of a celery plant, not the leafy stalks and not a turnip;
  celeriac is another name for this sense.
examples:
- Celery root is good mashed with butter.
- We dug up the celery root and cooked it in soup.
