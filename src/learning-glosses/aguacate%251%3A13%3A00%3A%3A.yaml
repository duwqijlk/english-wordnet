simpleMeaning: its skin is green or nearly black, and inside lies soft yellow flesh around one big seed;
  the whole fruit is pear shaped and grows in warm lands
scope: Also called avocado, alligator pear, and avocado pear; a tropical fruit, not the tree it grows
  on.
examples:
- She sliced the aguacate and spread it on toast.
- The aguacate in the market had dark, rough skin.
