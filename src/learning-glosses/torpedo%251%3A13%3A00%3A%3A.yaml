simpleMeaning: a large sandwich in a long hard roll cut lengthwise, filled with meat, cheese, tomato,
  onion, lettuce and sauces; its name differs in different parts of the United States
scope: Also called hero, wedge, submarine, sub, bomber, grinder, hero sandwich, hoagie, hoagy, poor boy,
  submarine sandwich and zep. This is the sandwich sense; it is not the underwater weapon, the electric
  ray fish, or the small firework sense of the same word.
examples:
- He ordered a torpedo filled with meat and cheese for lunch.
- The shop sells a torpedo with tomato, onion and lettuce in a long roll.
