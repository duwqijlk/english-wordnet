simpleMeaning: The join between the far end of the lower-arm bone and the nearest row of small hand bones
scope: The join between the lower-arm bone and the small hand bones; also called wrist, wrist joint, carpus
  and articulatio radiocarpea, not the join at the elbow.
examples:
- The radiocarpal joint lets the hand bend.
- She hurt her radiocarpal joint in the fall.
