simpleMeaning: A tall, usually spiny North American tree with hanging greenish-white flowers and long
  twisted pods. It yields very hard, durable, reddish-brown wood and was introduced across the temperate
  Old World.
scope: The tree itself, not the black locust, a different North American tree, and not the insect called
  a locust.
examples:
- Old honey locust trees can have long, sharp spines on the trunk.
- The honey locust drops its long twisted pods all over the sidewalk in autumn.
