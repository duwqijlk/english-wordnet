synsetId: 03781380-n
simpleMeaning: The third mast back from the front of a ship with three or more masts, the back and shorter
  mast of a yawl, a ketch, or a dandy.
scope: Also called a mizzenmast, a mizen, or a mizenmast; the third mast back from the front of a ship,
  not the sail set on it.
examples:
- The mizzen stood at the back of the ketch.
- They lowered the sail from the mizzen.
