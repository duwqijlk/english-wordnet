simpleMeaning: to send out smoke, fumes, warm steam, or other like vapours
scope: To send out smoke, fumes, or warm steam, not a bad smell itself and not being wet with sweat or
  blood.
examples:
- The chimneys were reeking smoke into the grey sky.
- Wet logs reeked steam over the fire.
