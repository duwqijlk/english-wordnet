simpleMeaning: bars fixed at the front and back of a car or other vehicle, to take the force of a knock
  and stop worse harm
scope: Bars at the front and back of a vehicle that take the force of a knock; not part of the engine
  and not a side panel.
examples:
- The bumper was dented in the crash.
- He fitted a new bumper to the front of the car.
