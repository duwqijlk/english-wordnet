senseId: 'nonparametric%3:01:00::'
synsetId: 02922801-a
simpleMeaning: Said of a way of working with numbers that does not work out the fixed values that describe
  a set of facts
scope: A way of working with numbers that does not work out fixed values from the facts, not a way that
  rests on such values.
examples:
- The team used a nonparametric test because the numbers did not fit the usual shape.
- A nonparametric method makes no guess about the fixed values behind the facts.
