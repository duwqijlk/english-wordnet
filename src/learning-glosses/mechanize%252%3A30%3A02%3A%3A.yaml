simpleMeaning: to give an army group armed motor vehicles with thick metal covering for fighting
scope: 'Also called motorize, mechanise, and motorise: to give fighting vehicles to an army group, not
  the sense of making work like a machine and not the sense of making a task fixed and dull.'
examples:
- The army decided to mechanize its foot soldiers with tanks and armed trucks.
- They mechanized the unit so it could move and fight in vehicles.
