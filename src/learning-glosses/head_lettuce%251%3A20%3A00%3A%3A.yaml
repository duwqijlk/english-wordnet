simpleMeaning: A salad plant known by its leaves, which grow in a tight ring and form a firm round ball.
scope: A salad plant whose leaves grow in a tight ring and form a firm ball, not loose-leaf lettuce and
  not a cabbage.
examples:
- The head lettuce in the garden had formed a firm round ball.
- She picked a head lettuce with tight green leaves for the salad.
