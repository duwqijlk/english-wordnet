simpleMeaning: a rough working out of how much there is, how great something is, or what it is worth
scope: 'Also called idea, estimate, and estimation: a rough working out of a number, size, or worth; not
  a careful exact count or price.'
examples:
- The cost given was only an approximation, not an exact price.
- As an approximation, we said the trip would take about three hours.
