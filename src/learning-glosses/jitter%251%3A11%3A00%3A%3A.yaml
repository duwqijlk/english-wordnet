simpleMeaning: small, fast changes in a wave form (the shape of a signal as it rises and falls), caused
  by changes in the electric power supply, shaking, or other things
scope: This is small fast changes in a signal, not a person feeling nervous and shaky and not the act
  of shaking.
examples:
- Jitter in the signal made the picture on the screen jump a little.
- The engineer measured the jitter in the waveform and checked the power supply.
