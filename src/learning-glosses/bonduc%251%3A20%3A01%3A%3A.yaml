simpleMeaning: A tree of warm lands with large prickly pods of seeds that look like beans and are used
  to make jewelry and prayer beads.
scope: This is a tree of warm lands with large prickly pods, also called bonduc tree, not the bonduc of
  central and eastern North America with green-white flowers and not the seeds on their own.
examples:
- The bonduc has large prickly pods of seeds that look like beans.
- Bonduc seeds are used to make jewelry and prayer beads.
