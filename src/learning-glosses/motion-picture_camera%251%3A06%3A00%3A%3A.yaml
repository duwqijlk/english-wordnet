simpleMeaning: Run still shots through very fast and they seem to move; this machine takes the shots that
  make that trick work.
scope: It is also called a cine-camera or a movie camera, and what sets it apart is that its shots are
  meant to be played back fast enough to seem to move.
examples:
- The motion-picture camera took shot after shot of the dancers on stage.
- When the motion-picture camera's shots were played back fast, the dancers seemed to move.
