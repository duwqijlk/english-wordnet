simpleMeaning: a stretch of time in which a set of events happens again and again in the same order
scope: 'Also called round, and also called cycle: this is a stretch of time when events happen again in
  the same order, not the pattern in spoken words and not a pattern you can see in a building.'
examples:
- The rhythm of the seasons brings cold winters and warm summers year after year.
- His life followed the rhythm of the farm, with the work changing as each season came round again.
