simpleMeaning: The study of the features of shapes that do not change when the shape is thrown onto a
  flat surface
scope: This is the study of shape features that stay the same under projection, also called descriptive
  geometry, and not the study of lengths and angles.
examples:
- Projective geometry shows why parallel lines seem to meet at the horizon.
- She used projective geometry to draw the building in perspective.
