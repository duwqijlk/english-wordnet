simpleMeaning: something you put on the skin to clear away hair you do not want, but the hair grows back
  after a short time
scope: 'Also called depilator and depilatory: a beauty product that clears away hair you do not want for
  a short time, not a way to remove hair for good and not a shave.'
examples:
- She spread the epilator over her legs before the party.
- This epilator takes the hair off for a few days, then it grows back.
