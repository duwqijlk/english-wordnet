senseId: 'fail-safe%1:06:00::'
synsetId: 03322935-n
simpleMeaning: A mechanism that can return to a safe state if something goes wrong.
scope: A device that goes back to a harmless state when something stops working, not a quality of a thing
  that stops danger on its own.
examples:
- The fail-safe cut the power when the motor stopped working.
- Engineers fitted a fail-safe to the lift.
