simpleMeaning: A stitch in needlework that covers two threads across and two threads down
scope: A needlework stitch covering two threads across and two down, not a plain straight stitch and not
  a stitch that covers one thread only.
examples:
- She worked the border in gros point.
- She used gros point to fill in the square on the cloth.
