simpleMeaning: a planned order in which crops, workers, or similar things take turns again and again
scope: A planned order in which crops or workers take turns again and again; not a turning in maths, and
  not the act of turning on an axis.
examples:
- Crop rotation keeps the soil healthy.
- The manager had only four pitchers in his rotation.
