simpleMeaning: words people say when they meet or part early in the day, to wish each other a nice start
  to the day
scope: Words said to greet someone, or to say goodbye, early in the day, also called morning, not a wish
  for a nice day at any hour and not a question about how someone slept.
examples:
- Good morning! I hope the sun shines for your walk today.
- She waved and called out good morning as she left the house.
