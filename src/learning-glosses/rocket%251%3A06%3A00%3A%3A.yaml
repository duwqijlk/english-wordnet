simpleMeaning: An engine that carries its own fuel and is pushed forward by hot gases rushing out behind
  it
scope: This is the engine itself, not the whole vehicle it pushes, and not a firework or a signal light
  shot into the sky.
examples:
- Engineers tested the rocket alone on a stand before fitting it to the ship.
- This rocket carries its own fuel, so it can work in space.
