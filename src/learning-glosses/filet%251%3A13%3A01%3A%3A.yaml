simpleMeaning: a steak with no bone, cut from the tenderloin (the soft long piece of meat along a cow's
  back)
scope: Also called fillet, this is a boneless beef steak; it is not a slice of fish and not the act of
  cutting meat into thin pieces.
examples:
- He ordered a filet with potatoes for dinner.
- The chef cooked the filet in butter until it was soft.
