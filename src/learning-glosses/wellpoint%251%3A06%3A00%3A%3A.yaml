scope: 'Also called well point: a tube with holes pushed into the ground to take in water, not a pump
  and not a dug hole that reaches a pool of water.'
examples:
- The builders drove a wellpoint into the wet ground beside the trench.
- A wellpoint helped drain the water from the soft soil around the site.
