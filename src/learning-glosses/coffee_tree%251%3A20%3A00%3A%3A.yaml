simpleMeaning: any of a few kinds of small woody plants from warm lands in Africa and Asia that give the
  beans used to make a hot drink
scope: This is a small woody plant from warm lands in Africa and Asia, also called coffee; not the hot
  drink made from its beans and not the coffeeberry shrub of the western United States.
examples:
- Farmers grow coffee trees on the warm hills for their beans.
- A coffee tree in the garden gives beans each year.
