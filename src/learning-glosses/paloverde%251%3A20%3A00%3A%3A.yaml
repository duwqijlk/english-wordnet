simpleMeaning: A thorny shrub in the group Cercidium, growing in dry parts of the southwestern United
  States and nearby Mexico, with smooth light green bark, small leaves and yellow flower clusters.
scope: The whole thorny shrub of the group Cercidium that grows in dry parts of the southwestern United
  States and Mexico and has smooth light green bark, not the similarly named palo verde tree, which has
  blue-green bark.
examples:
- The paloverde was in flower, its branches covered with clusters of yellow blossoms.
- Paloverde grows in dry parts of the southwestern United States and nearby Mexico.
