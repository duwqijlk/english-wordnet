simpleMeaning: a family line traced through both the mother's side and the father's side of the family
scope: A family line that follows both parents' sides, not one that follows only the father's side and
  not one that follows only the mother's side.
examples:
- In their family, bilateral descent means children trace ties through both parents.
- The study of bilateral descent looks at links on the mother's side and the father's side.
