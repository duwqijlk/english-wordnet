simpleMeaning: Neat and in good order, with everything in its place and nothing out of place
scope: Neat and in good order with nothing out of place, not a decoration on a garment, not setting sails,
  and not the way a plane holds itself in the air.
examples:
- The kitchen looked trim after she put everything away.
- Even the old barn was trim and neat.
