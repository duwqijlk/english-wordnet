simpleMeaning: A regional numbing of the vulva and outer labia, produced by a local anesthetic that deadens
  the nerves in that area and used to ease discomfort during childbirth.
scope: Numbing of the nerves around the birth opening, not a general anaesthetic for the whole body.
examples:
- The midwife explained that a pudendal block would ease the pain during delivery.
- The doctor gave her a pudendal block before the baby was born.
