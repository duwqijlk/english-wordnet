simpleMeaning: hard to settle or solve, and talked about with much disagreement
scope: A question or problem that is hard to settle and much argued over; not a person who is troubled
  or annoyed, which is another sense of vexed.
examples:
- The vexed question of pay kept coming up.
- They argued over the vexed issue of who should lead.
