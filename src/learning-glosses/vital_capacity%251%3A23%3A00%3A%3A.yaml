senseId: 'vital_capacity%1:23:00::'
synsetId: 13801782-n
simpleMeaning: The most air a person can breathe out after breathing in as deeply as they can, usually
  measured with a breathing meter, shows how healthy the lungs are.
scope: The most air breathed out after a full breath in, used to judge the state of the lungs; not the
  air taken in with one breath.
examples:
- Her vital capacity was low after the illness.
- The doctor measured his vital capacity with a spirometer.
