simpleMeaning: In physics, how much stuff a thing has when it is still for the one who looks at it, a
  part of what the thing is
scope: In physics, how much stuff a thing has when it is still, not how heavy it seems when it moves and
  not the work it holds from how much stuff it has.
examples:
- The rest mass of the stone stays the same no matter where it sits.
- The rest mass of the ball does not change when you lift it.
