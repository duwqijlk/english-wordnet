simpleMeaning: Its fat young give an oil used in place of butter, and this bird of South America feeds
  at night on fruit.
scope: Also called an oilbird, its fat young give an oil used in place of butter, and this bird of South
  America feeds at night on fruit.
examples:
- The guacharo flies out at night to feed on fruit.
- People use oil from young guacharos in place of butter.
