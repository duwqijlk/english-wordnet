simpleMeaning: A small blackish stout fly that bites, its young living in water, sucking blood from birds
  and folk and beasts.
scope: This sense is also called black fly and buffalo gnat, a small blackish stout fly that bites, its
  young living in water, sucking blood from birds and folk and beasts, unlike the sense for a blackish
  aphid that infests beans and sugar beets.
examples:
- Blackflies suck blood from birds.
- The blackfly bites folk and beasts.
