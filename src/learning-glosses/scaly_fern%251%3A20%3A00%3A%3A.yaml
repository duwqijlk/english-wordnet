simpleMeaning: a small plant from Europe with tough, dry, leathery leaves
scope: Also called scale fern, this is a small European fern with tough, dry leaves; not a moss and not
  a large tropical fern.
examples:
- The scaly fern grew between the stones on the hillside.
- He pressed a scaly fern into his book to keep its dry leaves.
