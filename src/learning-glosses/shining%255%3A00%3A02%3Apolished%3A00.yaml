simpleMeaning: made smooth and bright by rubbing, or as if by rubbing, and throwing back light with a
  soft glow
scope: 'Also called bright, and another name for this sense is shiny: smooth and bright from rubbing,
  not the act of rubbing something to make it shine, and not unusually good.'
examples:
- Rows of shining glasses stood on the shelf.
- She brushed her hair until it was shining and smooth.
