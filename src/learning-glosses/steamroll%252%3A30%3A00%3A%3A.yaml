simpleMeaning: to make a surface flat and even by driving a heavy machine with a big round wheel over
  it
scope: Also called steamroller. This sense is about making ground or a road flat with a heavy machine,
  not about pushing past other people by force.
examples:
- Workers steamrolled the new road before cars could use it.
- They steamroll the ground flat before building the house.
