simpleMeaning: The lining of the uterus, the part of the body where a baby grows, is swollen
scope: 'Also called endometritis: a swelling of the lining of the womb, not a swelling of the whole womb
  and not a swelling of the ovaries.'
examples:
- The doctor said the metritis would clear up with rest.
- She was treated for metritis after the swelling was found.
