simpleMeaning: a sickness in hot lands that spreads by mosquito bites and gives you spots on the skin
  and pain in the head and joints
scope: 'Also called breakbone fever, dandy fever and dengue fever: a sickness spread by mosquitoes, not
  a plain fever or a skin rash on its own.'
examples:
- She caught dengue from a mosquito bite and had a rash and sore joints.
- Dengue is common in some hot countries, where mosquitoes spread it.
