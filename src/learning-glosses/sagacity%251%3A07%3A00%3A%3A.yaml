simpleMeaning: The quality of forming views by telling things apart and weighing them up.
scope: Also called judiciousness, the quality of forming opinions by telling things apart and weighing
  them up.
examples:
- Her sagacity showed in every decision she made.
- He admired the old judge's sagacity in weighing the evidence.
