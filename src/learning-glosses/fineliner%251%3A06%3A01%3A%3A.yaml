simpleMeaning: A soft-tipped pen with a narrow point that makes narrow lines
scope: This is a soft-tipped pen that makes narrow lines; fineliner pen is another name for this sense,
  not a broad marker and not a pencil.
examples:
- She used a fineliner to draw the map's borders.
- His fineliner made thin, even lines.
