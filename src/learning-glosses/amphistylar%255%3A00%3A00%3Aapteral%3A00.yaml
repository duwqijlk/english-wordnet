senseId: amphistylar%5:00:00:apteral:00
synsetId: 00140760-s
simpleMeaning: having open entrances with free-standing columns at each end of a building, or on each
  side of it
scope: This describes a building with free-standing columns in open entrance areas at both ends or both
  sides, also called amphiprostylar, amphiprostyle or porticoed, not a building with columns on one side
  only or with no columns at all.
examples:
- The amphistylar temple had columns along both sides.
- They rebuilt the hall in an amphistylar style, with columns at both ends.
