simpleMeaning: a substance mixed with a drug, colouring, or other material to help carry or apply it.
scope: This is a mixing substance, not a machine that carries people and goods and not a means of expressing
  ideas.
examples:
- The medicine is dissolved in an oily vehicle before injection.
- The artist mixed the pigment with a vehicle that dries slowly.
