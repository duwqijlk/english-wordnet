simpleMeaning: wrong in what you believe or in what you decide
scope: Wrong in an opinion or judgment, not correct or true, and not the same as doing something bad or
  unkind.
examples:
- He held the mistaken belief that the road was closed.
- She made a mistaken judgment about his character and later said sorry.
