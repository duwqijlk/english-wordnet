simpleMeaning: a way of speaking where a word is used for something it does not really mean, to show the
  two are alike
scope: A way of using words to show likeness, not a plain statement of fact.
examples:
- The phrase 'a sea of troubles' is a metaphor.
- He used a metaphor, calling her voice music.
