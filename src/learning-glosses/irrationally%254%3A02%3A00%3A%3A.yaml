simpleMeaning: in a way that is not based on reason or clear thought
scope: In a way with no good reason behind it; not in a way based on reason and clear thought.
examples:
- He acted irrationally and shouted at his friends for no reason.
- She spent the money irrationally, buying things she did not need.
