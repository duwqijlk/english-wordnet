simpleMeaning: the act of giving out shares or parts to people or groups by a plan
scope: 'Also called allotment, allocation, and apportioning: the act of giving out shares or parts by
  a plan. Not a secret meeting, especially a meeting between lovers, and not one single share that a person
  gets.'
examples:
- The assignation of rooms to new students followed a clear plan.
- After the assignation of food to each village, the trucks left the store.
