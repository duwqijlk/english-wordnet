senseId: 'official_immunity%1:04:00::'
synsetId: 00215182-n
simpleMeaning: freedom from being sued for harm done by acts carried out while using the powers of a public
  office
scope: Freedom from being sued for harm done by acts carried out while using the powers of a public office;
  not freedom from being sued for acts done outside the office and not a pardon.
examples:
- Official immunity shielded the mayor from being sued for the order.
- The court held that official immunity covered acts done in office.
