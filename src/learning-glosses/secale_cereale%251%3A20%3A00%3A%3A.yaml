simpleMeaning: A tough one-year grain grass widely grown in northern Europe, its grain the main part of
  black bread; in North America it is grown for feed and better soil.
scope: A grain grass of northern Europe, also called rye; not wheat and not barley.
examples:
- Secale cereale grows in the cold fields of northern Europe.
- Farmers sow Secale cereale to feed animals and enrich the soil.
