simpleMeaning: A poisonous European herb with tuber-like roots, yellow juice that stains the skin, yellow
  flowers and leaves like celery, every part most poisonous.
scope: 'Also called hemlock water dropwort and water dropwort: a poisonous European herb with yellow juice
  that stains the skin, not a celery for eating and not a true hemlock tree.'
examples:
- Oenanthe crocata grew by the stream, its yellow juice staining the skin.
- Do not eat Oenanthe crocata; every part of it is most poisonous.
