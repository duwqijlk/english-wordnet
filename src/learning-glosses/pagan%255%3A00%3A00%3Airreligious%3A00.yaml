simpleMeaning: not believing in the God that Christians, Jews and Muslims believe in
scope: 'Also called ethnic, and another name for it is heathen: it means not believing in the God of Christians,
  Jews and Muslims, not a person who follows an old religion and not a person driven by body pleasures.'
examples:
- The old writer called the people's beliefs pagan, because they did not believe in the God of Christians,
  Jews and Muslims.
- His pagan views meant he did not accept the God that Christians, Jews and Muslims believe in.
