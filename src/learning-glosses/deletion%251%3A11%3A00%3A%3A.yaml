simpleMeaning: In genetics, the loss of one or more letters from a chromosome, or the absence of such
  letters from it.
scope: In genetics, the loss of one or more letters from a chromosome, or their absence; not a gap left
  in a written passage by an editor, not sounds or words left out of speech, and not the act of deleting
  something written or printed.
examples:
- The deletion of a single letter changed the gene.
- A deletion in the chromosome caused the disorder.
