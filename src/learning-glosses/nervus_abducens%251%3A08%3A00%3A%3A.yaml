simpleMeaning: A small cord that moves the side muscle of the eye, the one that turns the eye outward.
scope: A small cord that moves the side eye muscle, also called abducens, abducens nerve, abducent, abducent
  nerve and sixth cranial nerve; not the eye's seeing cord and not the cord that moves the eye inward.
examples:
- Injury to the nervus abducens left his eye unable to turn outward.
- The nervus abducens serves the muscle that pulls the eye to the side.
