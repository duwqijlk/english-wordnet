simpleMeaning: A salt made from soda and a phosphorus compound, used as a helper in soaps and cleaners
scope: A soda salt used as a helper in soaps and cleaners, also called tribasic sodium phosphate and trisodium
  orthophosphate; not table salt and not a soap on its own.
examples:
- Trisodium phosphate is a common cleaner for walls before painting.
- She mixed trisodium phosphate with warm water to wash the floor.
