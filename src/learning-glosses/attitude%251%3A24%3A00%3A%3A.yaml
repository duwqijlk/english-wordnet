simpleMeaning: the way a plane or spacecraft is turned or tilted, set against the line of the horizon
  or the way it is moving
scope: How a plane or spacecraft sits in the air or in space; not a person's way of thinking and feeling
  about things.
examples:
- The pilot checked the plane's attitude before starting the turn.
- A wrong attitude can make a spacecraft hard to control.
