simpleMeaning: a plant grown for the thick, strong-smelling part that grows under the ground and can be
  eaten
scope: 'Also called celeriac or knob celery: the plant grown for its thick, strong-smelling part under
  the ground, not the part itself that is eaten as food.'
examples:
- The farmer planted celery root in the field in spring.
- She grows celery root for the thick root she cooks in soup.
