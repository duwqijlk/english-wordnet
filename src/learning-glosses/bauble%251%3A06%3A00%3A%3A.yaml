simpleMeaning: cheap, bright jewellery or a decoration on clothes
scope: Also called novelty, trinket, bangle, fallal and gaud. This sense is cheap bright jewellery or
  a decoration on clothes, not the pretend king's stick carried by a man hired to make a king laugh.
examples:
- She wore cheap gold baubles on her dress for the party.
- The bauble on his coat sparkled but cost almost nothing.
