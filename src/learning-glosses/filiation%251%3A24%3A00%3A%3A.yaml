simpleMeaning: the blood tie between a person and their mother, their father, and the kin who came before
  them
scope: 'Also called descent, a line of descent, and lineage: a blood tie to the kin who came before you,
  not a link by marriage and not a friendship.'
examples:
- The court asked for proof of filiation before the child could inherit.
- Filiation was traced through the mother's family records.
