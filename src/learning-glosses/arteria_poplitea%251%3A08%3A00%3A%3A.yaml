simpleMeaning: a blood vessel that carries on from the main blood vessel of the thigh and splits to feed
  the legs and feet
scope: Also called popliteal artery; it carries on from the thigh and feeds the legs and feet, not the
  middle part of the foot and not the muscles of the neck.
examples:
- The arteria poplitea runs behind the knee on its way to the lower leg.
- The arteria poplitea splits to feed the legs and feet.
