schema: oewn-learning-gloss-v2
senseId: 'jig%1:06:01::'
synsetId: 03603708-n
simpleMeaning: a thing a person fishing puts in the water to draw fish to it, with one or more hooks,
  moved up and down in quick pulls
scope: This is the fishing thing with hooks that is moved up and down in water, not an old country dance
  and not a tool that holds work in place for other tools.
examples:
- He pulled the jig up and down in the water to draw a fish.
- The fish took the jig with two hooks on it.
