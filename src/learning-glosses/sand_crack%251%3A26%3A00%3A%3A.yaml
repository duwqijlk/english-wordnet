simpleMeaning: a split in the outer wall of a horse's foot that often makes the horse limp
scope: This is a split in the wall of a horse's foot that often makes the horse limp; not a split in a
  horse's shoe and not a crack in dry ground.
examples:
- The vet found a sand crack in the wall of the horse's hoof.
- A bad sand crack can leave a horse lame for weeks.
