simpleMeaning: It rests on the shoulder of the person who plays it, this large brass horn that curls round
scope: A large brass horn that curls round and rests on the shoulder of the person who plays it, also
  called a bombardon, not a straight horn and not a small trumpet.
examples:
- The helicon rested on his shoulder as he marched.
- She played the helicon in the brass band.
