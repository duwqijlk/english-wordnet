simpleMeaning: a sudden rush of many small things falling at once, like rain
scope: 'Also called shower: a sudden rush of many small things falling at once, like rain, not a set of
  steps in a row and not water rushing down.'
examples:
- A sudden cascade of sparks flew from the fire.
- A cascade of rose petals fell on the bride.
