simpleMeaning: in a way that shows you want to know more and have questions about something
scope: 'Also called questioningly: done in a way that shows you want to know more, not in a calm way or
  in a sure way.'
examples:
- She looked at the strange box wonderingly, not knowing what was inside.
- He turned wonderingly to the teacher and asked what the word meant.
