simpleMeaning: Said of a word used as a figure of speech, with its meaning changed from the plain one
scope: A word used in a figure of speech, not the warm lands near the equator and not hot, wet weather.
examples:
- The phrase 'a sea of troubles' is a tropical use of the word sea.
- In that line the word 'light' is used in a tropical way, not in its plain sense.
