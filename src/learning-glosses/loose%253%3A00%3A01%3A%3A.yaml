simpleMeaning: not tight or closely held, so it does not restrict movement
scope: This describes fit and freedom of movement, not soil or gravel that is not tightly packed, and
  not a weave full of small gaps.
examples:
- He wore a loose shirt to stay cool in the heat.
- These shoes are too loose and slip off when I walk.
