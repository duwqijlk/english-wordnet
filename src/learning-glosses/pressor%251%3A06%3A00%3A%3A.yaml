simpleMeaning: any thing that makes a blood vessel grow narrow, such as cold, stress, nicotine, body chemicals,
  or certain drugs, and so keeps blood pressure up or raises it
scope: Also called vasoconstrictive and vasoconstrictor; a thing that tightens blood vessels, not a drug
  that lowers blood pressure.
examples:
- Cold can act as a pressor, making blood vessels narrow.
- The doctor warned that the pressor drug would raise his blood pressure.
