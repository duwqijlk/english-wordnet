simpleMeaning: to go and live in a country in the less developed parts of the world and make it a place
  ruled by your own country
scope: This sense is about going to live in a country in the less developed parts of the world and making
  it a place ruled by your own country; not the wider sense of starting a new settled place in any area.
examples:
- European powers colonized many countries in Africa long ago.
- France colonized parts of West Africa and ruled them from Paris.
