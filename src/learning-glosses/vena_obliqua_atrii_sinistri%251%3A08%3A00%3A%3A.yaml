simpleMeaning: a small blood tube that joins the big tube that takes blood from the heart muscle, on the
  back wall of the left upper room of the heart
scope: Also called the oblique vein of the left atrium, it is a blood tube on the back wall of the heart's
  left upper room, not the blood tube on the back of the left lower room.
examples:
- The vena obliqua atrii sinistri runs along the back wall of the left atrium.
- The vena obliqua atrii sinistri empties into the coronary sinus.
