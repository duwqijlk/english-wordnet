simpleMeaning: Bunches of white funnel-shaped flowers that smell sweet while the sun is up grow on this
  West Indian green-all-year bush.
scope: This is the West Indian bush with white flowers that smell sweet while the sun is up, not a bush
  with flowers that smell sweet at night and not one that loses its leaves in winter.
examples:
- The day jessamine smelled sweet in daylight.
- Clusters of white flowers covered the day jessamine.
