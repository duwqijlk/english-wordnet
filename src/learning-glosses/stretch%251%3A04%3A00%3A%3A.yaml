simpleMeaning: An exercise, or a movement in it, that lengthens your limbs and muscles as far as they
  will go.
scope: This is the exercise itself, not the act of reaching out toward something or the verb for extending
  your body.
examples:
- Do a few gentle stretches before you run.
- The class began with stretches for the legs and back.
