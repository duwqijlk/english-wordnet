simpleMeaning: 'A shelter for people or kept animals in a ground hollow: fully underground beneath an
  earth-covered flat roof, partly underground roofed with wood or sod, or cut into a hillside.'
scope: The earth-set shelter for people or kept animals, one of several names for this dwelling; it is
  not a hollowed-log boat, a baseball bench area, or a low earth fortification, and this spelling is hyphenated.
examples:
- The shepherd spent the winter in a dug-out cut into the hillside.
- Archaeologists uncovered a dug-out with a turf roof.
