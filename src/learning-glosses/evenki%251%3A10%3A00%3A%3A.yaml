simpleMeaning: This tongue is one of the Tungusic group of tongues, and that people speak it in the east
  of Siberia.
scope: This is the tongue of that people in the east of Siberia; Evenki language, Ewenki, Ewenki language,
  Tungus, Tungus language, Tunguz and Tunguz language are other names for it, not the people themselves.
examples:
- He spoke Evenki with his grandmother.
- Evenki is the tongue of the people of eastern Siberia.
