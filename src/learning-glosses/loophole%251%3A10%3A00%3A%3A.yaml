simpleMeaning: an unclear meaning, especially in the words of a law or agreement, that lets a person avoid
  a duty or a difficulty
scope: An unclear part of a law or agreement that lets a person avoid a duty; not a small hole in a strong
  wall for looking out or shooting through.
examples:
- He found a loophole in the tax law and paid less than others.
- The company used a loophole in the contract to avoid paying the workers.
