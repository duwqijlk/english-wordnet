simpleMeaning: 'Defendant''s main filing to a plaintiff''s complaint: a guilty, not-guilty, or no-contest
  plea in criminal cases; in civil cases, denials of each disputed claim plus possible affirmative defenses
  or counterclaims.'
scope: This is the formal pleading a defendant files in a lawsuit, not a spoken or written reply to a
  question, not a solution to a problem, and not a nonverbal reaction.
examples:
- The defendant's answer denied each allegation in the complaint.
- Her lawyer filed the answer within the time allowed by the court.
