simpleMeaning: a piece of music that plays a tune again, changing it a little and adding small touches
scope: A new form of a musical tune, played with small changes, not a change in a planet's path and not
  a living thing changed by its genes.
examples:
- The variation on the folk tune added new notes to the old melody.
- Beethoven's variation changes the theme with each repeat.
