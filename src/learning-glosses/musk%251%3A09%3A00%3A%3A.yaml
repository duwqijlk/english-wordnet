simpleMeaning: the smell of an oily liquid made in a gland (a part of the body that makes liquids) in
  a male deer of one kind
scope: The smell of the liquid made by a male deer, not the liquid itself that is used in perfume.
examples:
- The strong musk of the deer hung in the air.
- He could smell musk near the place where the deer had passed.
