schema: oewn-learning-gloss-v2
senseId: 'guilt_by_association%1:26:00::'
synsetId: 14015001-n
simpleMeaning: People get the blame for wrong that others they spend time with have done, with no proof
  that they did wrong themselves
scope: Blame put on people for the wrong of others they spend time with, with no proof against them, not
  blame for their own wrong and not a court finding.
examples:
- He was hurt by guilt by association after his friend was caught stealing.
- Guilt by association can ruin a good name even when no proof exists.
