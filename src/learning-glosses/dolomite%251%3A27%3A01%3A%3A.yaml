simpleMeaning: people use this light-coloured mineral, made of calcium magnesium carbonate, as a ceramic
  and as fertilizer, and it gives magnesium
scope: 'Also called bitter spar: a light-coloured mineral that gives magnesium, used as a ceramic and
  as fertilizer, not the sedimentary rock of the same name.'
examples:
- The farmer spread dolomite on the field to add magnesium to the soil.
- Dolomite is ground up and used in making ceramics.
