simpleMeaning: a level in something not real or solid, usually thought of as having depth
scope: A level in something not real or solid, usually thought of as having depth, also called a level;
  not a real flat stretch of stuff and not a hen that lays eggs.
examples:
- The story works on several layers of meaning at once.
- A good actor can play on many layers of feeling.
