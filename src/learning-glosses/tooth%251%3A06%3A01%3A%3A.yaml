simpleMeaning: a thing that looks like the hard white part in an animal's mouth that is used for biting
scope: This is any thing shaped like a mouth part of an animal, not the real mouth part itself and not
  the small part that sticks out on a gear.
examples:
- The sharp tooth of the comb broke off.
- Each tooth of the rake is made of metal.
