senseId: 'monotone%1:10:01::'
synsetId: 07098939-n
simpleMeaning: one sound that stays the same, said again and again with different words or different rhythms,
  especially when saying church texts aloud
scope: One repeated sound with changing words or rhythms, especially for church texts; not a thing that
  only goes up or only goes down in value, and not a voice that never changes in height.
examples:
- The priest chanted the prayer in a steady monotone.
- She read the old church text in a monotone that held the same sound from start to end.
