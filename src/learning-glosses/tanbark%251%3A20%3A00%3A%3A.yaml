simpleMeaning: Bark rich in tannin, crushed and cut into pieces for turning animal skins into leather;
  the used bark is spread on the ground as a covering
scope: Bark rich in tannin used to turn skins into leather, with the used bark spread on the ground; not
  fresh bark for burning and not sawdust.
examples:
- The tanner spread tanbark over the garden path.
- Tanbark from the oak was cut up for the tanning vats.
