simpleMeaning: a road board that tells a driver mainly where they are or where a place can be found, one
  of the boards that give facts
scope: A road board that gives facts about where a driver is or where to go, not a board that tells drivers
  what they must do and not a board that warns of danger.
examples:
- The direction sign told us the town was five miles ahead.
- She read the direction sign to find where she was on the road.
