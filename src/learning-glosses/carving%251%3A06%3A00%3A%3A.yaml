simpleMeaning: a work of art made by cutting away parts of wood, ivory, or stone to make a shape that
  is wanted
scope: This is the finished work of art made in this way, not the act of cutting hard stuff away to make
  it.
examples:
- She put a small wooden carving on the shelf.
- The museum showed a carving made from ivory.
