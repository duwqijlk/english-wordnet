simpleMeaning: to care for your feet by cutting the nails and making them into a neat shape, and by other
  such care
scope: This sense is caring for the feet and their nails; it is not care for the hands and fingernails.
examples:
- She pedicures her feet every Sunday, trimming and shaping her nails.
- He pedicured his feet before the beach trip, cutting his nails short and neat.
