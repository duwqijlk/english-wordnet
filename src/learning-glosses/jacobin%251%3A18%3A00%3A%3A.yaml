simpleMeaning: A member of the extreme group that set up the Reign of Terror during the French Revolution
scope: This is a member of the extreme group that set up the Reign of Terror during the French Revolution;
  it is one revolutionary of that time, not a Jacobite and not a supporter of the king.
examples:
- The Jacobin spoke for the most extreme group in the assembly.
- Robespierre was the best-known Jacobin of the Revolution.
