simpleMeaning: Most often a curved, swollen petal, as in the flowers of a plant called Aconitum, this
  part of a plant or animal is shaped like a helmet.
scope: A helmet-shaped part of a plant or animal, most often a curved, swollen petal, is what this word
  names.
examples:
- The galea of the flower curved over the parts inside.
- The galea on the aconite flower looked like a small helmet.
