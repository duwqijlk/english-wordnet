senseId: synecdochic%5:00:00:figurative:00
synsetId: 01423361-s
simpleMeaning: using a part's name for the whole, or the whole's for a part; a kind for a wider kind,
  or back; stuff a thing is made of for the thing
scope: Using a part's name for the whole, or the whole's name for a part, with synecdochical as another
  name for this sense, not plain literal naming and not a metaphor.
examples:
- To say 'hand' for 'worker' is synecdochic.
- Calling ten ships 'ten sails' is a synecdochic use.
