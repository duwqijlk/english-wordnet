simpleMeaning: Raised, pinkish scar tissue (soft material in the body) at the place of a hurt, made when
  the body makes too much of it while fixing the hurt
scope: 'Also called cheloid: a raised, pinkish scar that grows too much at the place of a hurt. Not a
  normal flat scar.'
examples:
- A thick keloid grew over the cut on her arm.
- The doctor said the keloid would stay raised and pink.
