simpleMeaning: A bush or small tree from China that loses its leaves in cold weather, with leaves that
  often have three points, grown for its pink-white blooms.
scope: This is a bush or small tree from China grown for its pink-white blooms, not the kind grown for
  red fruit and white or pale pink blooms.
examples:
- The flowering almond blooms in spring.
- She planted a flowering almond by the wall.
