simpleMeaning: A low shrub with wide-spreading branches and flowers in loose bunches, from the desert
  lands of the far west, from the west coast to Utah.
scope: A low desert shrub with wide-spreading branches and loose bunches of flowers; wild buckwheat and
  Erigonum fasciculatum are other names for this sense.
examples:
- California buckwheat grows in the dry desert lands.
- The California buckwheat by the road had loose bunches of flowers.
