simpleMeaning: a tall fir of the north-west of North America, with short needles and egg-shaped cones
scope: 'Also called douglas pine, douglas spruce, and green douglas fir: a tall fir of north-western North
  America with short needles and egg-shaped cones, not a true pine and not a true fir.'
examples:
- The douglas hemlock towered over the other firs with its short needles.
- Egg-shaped cones hung from the douglas hemlock in the north-west woods.
