simpleMeaning: to cover a thing with a hard, shiny coat, or set the coat into it as decoration
scope: This is the verb sense of enamel, the act of putting a hard, shiny coat on something, not the paint
  itself and not the hard white cover of a tooth.
examples:
- He enamelled the metal tray to protect it.
- The workers enamelled the pots in bright colours.
