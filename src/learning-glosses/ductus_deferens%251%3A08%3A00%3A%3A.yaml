simpleMeaning: a tube that carries seed cells from the store beside the testicle to the tube that releases
  them
scope: A tube that carries seed cells from the store beside the testicle, also called the vas deferens;
  not a blood vessel and not a tube that carries urine.
examples:
- Sperm travel through the ductus deferens after leaving the epididymis.
- The ductus deferens joins the tube that releases the seed cells.
