simpleMeaning: A body chemical that breaks two-part sugars into one-part sugars by adding water.
scope: A body chemical that splits two-part sugars into one-part sugars, not one that splits proteins
  and not one that joins sugars together.
examples:
- Disaccharidase splits the sugar in milk into one-part sugars.
- Without disaccharidase the body cannot break down two-part sugars.
