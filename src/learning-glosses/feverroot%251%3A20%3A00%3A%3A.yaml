simpleMeaning: Purple or dull red flowers top this rough weed-like American plant, which lives for years
  and has big leaves that usually wrap round the stem.
scope: Also called horse gentian, tinker's root, and wild coffee, this is a rough American herb with big
  leaves and purple or dull red flowers, not a garden flower and not a tree.
examples:
- Feverroot grew along the edge of the field.
- She pressed a feverroot flower between the pages of her book.
