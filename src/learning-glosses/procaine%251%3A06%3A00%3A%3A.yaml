simpleMeaning: Near nerves, this white powder made of tiny crystals, sold as Ethocaine, takes away feeling
  in one place, and dentists and doctors use it.
scope: It is a powder that takes away feeling in one place only, not a drug that puts the whole body to
  sleep.
examples:
- The dentist used procaine before work on the tooth.
- The procaine took away feeling in one place while the dentist worked.
