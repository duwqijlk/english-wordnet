simpleMeaning: Nerve cells and the fatty covers round their threads make up the whitish nerve tissue of
  the brain and spine.
scope: Also called white matter, this is whitish nerve tissue of the brain and spine.
examples:
- The substantia alba runs through the brain and spine.
- Nerve cells and their fatty covers form the substantia alba.
