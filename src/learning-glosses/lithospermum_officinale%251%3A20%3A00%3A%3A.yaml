simpleMeaning: A European plant that lives for years, with many branches, found in hedges and at the edge
  of woods.
scope: This is a branching plant of Europe that lives for years and grows in hedges and at the edge of
  woods; gromwell is another name for this sense, and it is not the North American puccoon.
examples:
- Lithospermum officinale grew in the hedge along the lane.
- We found Lithospermum officinale at the edge of the wood, its branches spreading wide.
