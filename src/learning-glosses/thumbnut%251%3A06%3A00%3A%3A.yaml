simpleMeaning: Two fingers grip the flat wings on the sides of this piece to turn it, and the hole through
  it screws onto a bolt.
scope: This piece is also called a butterfly nut, a wing-nut, a wing nut, and a wing screw, and it screws
  onto a bolt with a grip two fingers can turn.
examples:
- Grip the wings of the thumbnut to turn it.
- The thumbnut turned when gripped by its wings.
