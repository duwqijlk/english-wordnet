simpleMeaning: People eat the small round lumps that grow under the ground on this herb of Europe, and
  in Scotland use it to give whiskey its taste.
scope: Also called earth-nut pea, earthnut pea, and heath pea, this herb is known for the small round
  lumps under the ground that are eaten and that flavor whiskey in Scotland.
examples:
- In Scotland, tuberous vetch gives whiskey its taste.
- The small round lumps of tuberous vetch are eaten as food.
