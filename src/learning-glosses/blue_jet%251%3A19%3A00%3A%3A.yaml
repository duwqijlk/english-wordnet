simpleMeaning: Short electrical discharges, each lasting about ten milliseconds, that burst from the tops
  of huge storm clouds and widen into cones of blue light as they shoot upward.
scope: This is the upward flash of blue light from the top of a giant storm cloud; jet and reverse lightning
  are other names for the same thing, and it is not the familiar downward bolt that strikes the ground.
examples:
- The camera caught a blue jet flashing upward from the top of the storm cloud.
- Blue jets are so brief that the unaided eye cannot follow them.
