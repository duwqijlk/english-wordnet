simpleMeaning: For a fee, a person from another land could live in a city of ancient Greece
scope: A person from another land who paid to live in an ancient Greek city, not a citizen and not a slave.
examples:
- The metic paid his fee and settled in Athens.
- As a metic, he could trade in the city but could not vote.
