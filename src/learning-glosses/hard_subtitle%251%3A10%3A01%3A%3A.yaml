simpleMeaning: Often in the plural, words on screen that are fixed for good into the picture frames of
  a video
scope: Often in the plural, words on screen that are fixed for good into the picture frames of a video,
  not words that can be switched off; hardsub is another name for this sense.
examples:
- The film has a hard subtitle you cannot switch off.
- Hard subtitles are burned into the video frames.
