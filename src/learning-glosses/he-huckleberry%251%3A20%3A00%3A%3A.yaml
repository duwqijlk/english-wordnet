simpleMeaning: Thick bunches of soft-haired small white flowers shaped like bells grow on this bush with
  many branches that loses its leaves in winter.
scope: Also called male berry, maleberry and privet andromeda, this is a much-branched shrub with small
  white bell-shaped flowers.
examples:
- The he-huckleberry flowered white in spring.
- A he-huckleberry grew beside the path.
