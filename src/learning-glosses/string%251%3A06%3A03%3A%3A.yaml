simpleMeaning: a thin cord made of wire or gut, pulled tight as part of a music instrument or a tennis
  racket
scope: A thin cord pulled tight on a music instrument or a tennis racket; not the very small bit in cosmology,
  and not a cord used as a tie.
examples:
- One string on his guitar broke during the song.
- She hit the ball so hard that a string in her tennis racket snapped.
