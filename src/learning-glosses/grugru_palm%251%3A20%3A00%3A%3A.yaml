simpleMeaning: A thick trunk that swells out and bears sharp points marks this palm of warm parts of America,
  with leaves like feathers and nuts people can eat.
scope: Also called gri-gri, grugru, and macamba, this is a palm of warm America with a swollen, spiny
  trunk, not a palm grown only for its leaves.
examples:
- The grugru palm by the house bore nuts we could eat.
- We walked past a grugru palm with a trunk full of sharp points.
