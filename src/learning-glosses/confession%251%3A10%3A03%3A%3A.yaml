simpleMeaning: a written paper that says in full what one church believes, especially the churches of
  the Reformation in the 16th century
scope: A church paper that sets out its beliefs, not an act of telling a priest about sins and not a written
  paper where a person says they did wrong.
examples:
- The church printed its confession for all its members to read.
- This confession, written in the 1500s, sets out what the church believes.
