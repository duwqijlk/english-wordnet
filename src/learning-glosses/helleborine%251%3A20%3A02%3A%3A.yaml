simpleMeaning: Epipactis orchids, of various sorts.
scope: This sense is Epipactis orchids, of various sorts, unlike the sense for any of the small mild-
  and warm-climate orchids, with mottled or striped leaves, and spikes of small yellowish-white flowers
  in a twisted cluster, and unlike the sense for any of several orchids of the Cephalanthera kind.
examples:
- Helleborines are orchids of the Epipactis kind.
- The helleborine is an orchid.
