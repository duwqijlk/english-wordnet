simpleMeaning: a problem in which small white bits of dead skin come off the skin on top of the head
scope: This is the problem that makes the bits come off, not the loose white bits of skin themselves.
examples:
- He has bad dandruff and white bits fall on his shirt.
- This soap helps with dandruff.
