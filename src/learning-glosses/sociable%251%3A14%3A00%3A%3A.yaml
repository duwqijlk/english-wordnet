simpleMeaning: a party where people come together to be friendly and do things together as a group
scope: 'Also called a social, and another name for it is a mixer: this is a friendly party where people
  meet and do things together, not the word for a person who likes being with others.'
examples:
- The church held a sociable on Friday evening for new families.
- At the sociable, neighbors met to talk and play games together.
