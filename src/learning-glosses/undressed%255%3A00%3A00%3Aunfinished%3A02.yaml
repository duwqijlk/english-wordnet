simpleMeaning: wood, stone, or animal skin left in its natural rough state, with no work done to finish
  it
scope: Wood, stone, or hides left rough and unfinished, not a person without clothes.
examples:
- The builder stacked the undressed timber beside the shed.
- Undressed hides lay drying in the sun.
