senseId: 'symmetrically%4:02:00::'
synsetId: 00177127-r
simpleMeaning: In a way in which the two sides match, each part on one side having the same shape and
  place as the part on the other.
scope: For how things are placed so that the two sides match.
examples:
- They were symmetrically arranged on either side of the hall.
- The windows stood symmetrically on either side of the door.
