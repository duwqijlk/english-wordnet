simpleMeaning: in a pleasant way that persuades someone or is meant to persuade someone
scope: This describes a voice, words or manner that in a pleasant way tries to persuade someone, not a
  strong order or a threat.
examples:
- She used a soft, coaxing voice to calm the child.
- His coaxing words slowly won her agreement.
