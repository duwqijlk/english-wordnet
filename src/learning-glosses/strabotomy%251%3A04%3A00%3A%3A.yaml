simpleMeaning: an operation in which a doctor cuts a muscle or cord in the eye to put right a squint
scope: An eye operation to put right a squint, not an operation to take out a growth in the eye and not
  a test of the eyes.
examples:
- The surgeon did a strabotomy to put right the child's squint.
- After the strabotomy, his eyes looked straight ahead.
