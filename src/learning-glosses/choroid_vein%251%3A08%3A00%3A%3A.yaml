simpleMeaning: one of two blood tubes that serve the dark layer at the back of the eye
scope: One of two blood tubes that serve a layer at the back of the eye; not a blood tube in the brain
  and not the one that feeds the eye's lens.
examples:
- The choroid vein carries blood away from the back of the eye.
- The doctor traced the bleeding to a choroid vein.
