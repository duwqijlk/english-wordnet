simpleMeaning: In some lists put in the group that shares its name; a snake of the western United States
  that seldom goes far from water
scope: Also called banded water snake, common water snake and Natrix sipedon; not a snake of dry land
  far from water.
examples:
- A Nerodia sipedon slipped into the water as we came near.
- A Nerodia sipedon lay on a warm rock by the pond.
