simpleMeaning: A tick on Peromyscus mice, biting people, the main carrier of Lyme sickness in the east,
  above all New England; its northern kind was once called the deer tick.
scope: 'Also called black-legged tick: a tick that bites people and carries Lyme sickness, not a dog tick
  and not a flea.'
examples:
- The Ixodes scapularis bit the hiker in the woods.
- Ixodes scapularis carries Lyme sickness in the east.
