simpleMeaning: a number, amount, or measure expressed as a share of another number, amount, or measure
scope: Not a total sum by itself and not a charge for a service; it compares one quantity with another.
examples:
- The unemployment rate compares jobless people with the whole workforce.
- Doctors tracked the infection rate as a share of all patients in the ward.
