simpleMeaning: A phone book, or part of one, most often printed on pale paper, that lists people's names
  in ABC order with their phone numbers
scope: A phone book that lists people's names in order; not a book of shop numbers and not a list of addresses
  alone.
examples:
- I found her number in the white pages.
- The white pages list every house in town.
