simpleMeaning: A test that takes a bit of deep body tissue through a thin hollow tube to check it.
scope: A test that takes deep body tissue through a thin hollow tube, not a cut that opens the skin and
  not a blood test.
examples:
- The doctor took a needle biopsy of the deep tissue.
- A needle biopsy uses a thin hollow tube to take the tissue.
