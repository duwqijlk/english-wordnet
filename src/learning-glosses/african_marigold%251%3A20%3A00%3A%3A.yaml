scope: 'Also called big marigold, Aztec marigold, or Tagetes erecta: a strong annual plant of Mexico and
  Central America with big yellow to orange flower heads, set apart from other kinds by its size and its
  many-branching stems.'
examples:
- The African marigolds in the garden grew tall and branched out.
