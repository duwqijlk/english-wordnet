simpleMeaning: Of or like a hermit, or the way a hermit lives alone and apart from others
scope: Of or like a hermit living alone; eremitical is another name for this sense, not the life of a
  monk in a group and not a love of being alone for a short rest.
examples:
- The monk's eremitic austerities left him thin and quiet.
- The eremitic writer lived alone and saw few guests.
