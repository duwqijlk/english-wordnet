senseId: 'right_atrioventricular_valve%1:08:00::'
synsetId: 05401339-n
simpleMeaning: A three-flap valve between the right atrium and the right ventricle, letting blood pass
  from atrium to ventricle and shutting to stop backflow when the ventricle contracts.
scope: This sense is also called tricuspid valve, for a three-flap valve between the right atrium and
  the right ventricle.
examples:
- The right atrioventricular valve shut as the ventricle contracted.
- The right atrioventricular valve lets blood pass into the ventricle.
