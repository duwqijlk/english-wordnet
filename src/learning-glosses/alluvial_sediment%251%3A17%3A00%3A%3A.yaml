simpleMeaning: Where the water slows, streams drop the clay, silt, or gravel they carried along in their
  rush.
scope: 'Also called alluvium, alluvial deposit, and alluvion: clay, silt, or gravel that rushing streams
  carry and drop where the water slows, not clay or gravel left by wind.'
examples:
- The alluvial sediment settled where the stream slowed down.
- The rushing stream carried the alluvial sediment far before it dropped it.
