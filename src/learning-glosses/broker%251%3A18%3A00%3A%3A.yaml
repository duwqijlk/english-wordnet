simpleMeaning: A person who buys and sells for other people, and gets a fee for doing this work for them.
scope: This is a businessman who buys or sells for other people; agent and factor are other names for
  this sense; not someone who buys and sells for himself, and not the act of arranging a deal.
examples:
- The broker sold the shares for his client and took a fee.
- She asked a broker to find a buyer for the house.
