simpleMeaning: to sound loudly, the way wind, running water or traffic does
scope: The loud noise made by wind, water or traffic, not wild, unruly behaviour and not an animal's cry;
  howl is another name for this sense.
examples:
- The wind roared through the trees all night.
- Traffic roared past on the motorway.
