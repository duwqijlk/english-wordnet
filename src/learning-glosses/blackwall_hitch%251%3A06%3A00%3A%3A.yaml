simpleMeaning: A plain knot for fixing a rope to a hook for a short time.
scope: A plain knot that joins a rope to a hook for a short time, not a lasting join and not a knot for
  tying two ropes together.
examples:
- Use a Blackwall hitch to tie the rope to the hook.
- He fastened the line with a Blackwall hitch.
