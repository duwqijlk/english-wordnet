simpleMeaning: A piece of cloth that people wave or raise to pass on a message, cut in a rectangular shape
scope: A rectangular piece of cloth used to send a message, not a pole on a golf green, not a tail that
  stands out, and not the act of hanging down and losing firmness.
examples:
- She waved a flag to tell the boats to stop.
- The guard raised a flag to signal the start of the race.
