senseId: 'exhaust_pipe%1:06:00::'
synsetId: 03308455-n
simpleMeaning: A tube that carries burnt gases from the part that gathers them out of the engine to the
  part that quiets the sound.
scope: A tube that carries burnt gases out of an engine, not a tube that brings in air and not a tube
  for water; no other name is listed for this sense.
examples:
- Rust had eaten a hole in the exhaust pipe.
- The exhaust pipe runs from the engine to the back of the car.
