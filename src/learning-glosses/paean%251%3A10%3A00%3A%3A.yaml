simpleMeaning: Words of praise said in a set, formal way.
scope: 'Also called a eulogy, and another name for it is panegyric, and also pean: words of praise said
  in a set, formal way, not a song of praise, especially one sung in old Greece to call on or thank a
  god.'
examples:
- His speech was a paean to the workers of the town.
- The book is a paean to country life.
