simpleMeaning: a huge strong plant-eating animal of southeast Asia and Africa, with very thick skin and
  one or two horns on its nose and an odd number of toes
scope: A huge plant-eating animal of southeast Asia and Africa with thick skin and horns on its nose;
  not an elephant and not a hippopotamus.
examples:
- The rhino charged across the plain.
- We saw a rhino drinking at the water hole.
