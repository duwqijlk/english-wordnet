simpleMeaning: One of the settlers from England who crossed to America on the Mayflower and set up the
  Plymouth colony in New England in 1620
scope: Also called a Pilgrim, this is one of the English settlers who reached America on the Mayflower
  in 1620, not a later settler and not a religious traveller in general.
examples:
- A Pilgrim Father helped to found Plymouth.
- The Pilgrim Father had sailed from England on the Mayflower.
