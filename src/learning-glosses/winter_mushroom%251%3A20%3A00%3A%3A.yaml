senseId: 'winter_mushroom%1:20:00::'
synsetId: 13042970-n
simpleMeaning: An edible mushroom of early spring or late autumn, with a sticky orange-brown cap, a darkening
  stalk and pale gills; it often grows in groups.
scope: This is the edible cold-season mushroom, not a common button mushroom or a mushroom that appears
  only in summer.
examples:
- The winter mushroom is edible and appears when few other mushrooms do.
- The winter mushroom has a sticky orange-brown cap and a stalk that turns black.
