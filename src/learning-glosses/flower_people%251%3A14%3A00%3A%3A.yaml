simpleMeaning: a young group, mostly middle-class, from San Francisco in the 1960s, who called for universal
  love and peace, shared homes, long hair and soft drugs, liking acid and progressive rock
scope: A young group of the 1960s, mostly middle-class, who called for universal love and peace; hippies
  and hipsters are other names for this sense. Not a political party, and not a music band.
examples:
- The flower people gathered in the park, singing songs about love and peace.
- She joined the flower people in San Francisco in 1967.
