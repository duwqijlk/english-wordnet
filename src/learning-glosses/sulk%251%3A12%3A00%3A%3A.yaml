simpleMeaning: a dark, silent mood in which a person keeps away from others and shows they are not pleased
scope: A silent, cross mood that keeps a person apart from others, not the verb act of sulking and not
  just being quiet.
examples:
- He stayed home in a sulk after the row with his brother.
- Her sulk lasted all morning, and she would not speak to anyone.
