simpleMeaning: a medicine that fights illnesses, such as malaria, that are caused by tiny living things
  called protozoa
scope: 'Also called antiprotozoal drug: a drug that fights illnesses caused by protozoa, not an antibiotic
  and not a drug for worms.'
examples:
- The doctor gave her an antiprotozoal to treat her malaria.
- They took an antiprotozoal after the trip to stop the infection.
