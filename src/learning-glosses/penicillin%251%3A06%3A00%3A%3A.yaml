simpleMeaning: any of different drugs that kill germs, got from a kind of mould called Penicillium or
  made from chemicals in a lab, used to treat illness from germs
scope: A group of drugs that kill germs and are used to treat illness; not the mould that some of them
  are got from.
examples:
- The doctor gave her penicillin for her chest infection.
- Penicillin helped him get well from a bad ear infection.
