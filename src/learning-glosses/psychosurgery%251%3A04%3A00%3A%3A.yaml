simpleMeaning: An operation on the brain of a person, done to ease very bad mind or behaviour problems
  that no other care can help
scope: An operation on the brain to ease hard mental or behaviour problems, not other brain surgery and
  not talk-based care for the mind.
examples:
- The doctors said psychosurgery was the last choice after years of failed care.
- In the past, psychosurgery was used for people whose deep mental pain would not ease.
