simpleMeaning: A kind of pea plant that bears peas in soft, thick pods you can eat, without the tough
  inner skin of the common pea.
scope: Also called edible-pod pea and edible-podded pea; a kind of pea plant whose soft, thick pods are
  eaten whole, without the tough inner skin found in the common pea.
examples:
- Pisum sativum macrocarpon grew in the vegetable bed, its pods fat and soft.
- We ate the pods of Pisum sativum macrocarpon raw from the plant.
