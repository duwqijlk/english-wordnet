simpleMeaning: A tall marsh plant from North America, Europe, Asia and North Africa, with long flat leaves
  for mats and chair seats; cylindrical seed heads split when ripe, shedding much down.
scope: Another name for the tall marsh plant also called nailrod, reed mace, bulrush and cat's-tail; not
  the spice mace, and not the bur-reed, whose seed heads are prickly balls.
examples:
- Reedmace grows in shallow water across Europe and Asia.
- She wove a mat from the long leaves of reedmace.
