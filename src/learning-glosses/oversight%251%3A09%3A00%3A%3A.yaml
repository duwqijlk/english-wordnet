simpleMeaning: something left out by mistake because someone did not notice it
scope: This is something left out by mistake because no one noticed it. It is not the act of watching
  over and managing the work of a person or group.
examples:
- Leaving her name off the list was an oversight, and we said sorry at once.
- Because of an oversight, the shop sent only nine boxes instead of ten.
