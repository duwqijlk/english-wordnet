simpleMeaning: in a way that shows too much trust and too little knowledge of the world
scope: This describes doing something in a trusting way that shows little knowledge of the world, not
  in a careful or wise way that shows much experience.
examples:
- He naively believed that the stranger would give him all her money.
- She naively trusted the advert and sent her savings at once.
