simpleMeaning: the way of saying kind words that praise, congratulate, cheer or show respect to someone
scope: A way of speaking that praises and cheers someone; not a complaint and not a plain statement of
  fact.
examples:
- His complimentariness toward the young players lifted their spirits.
- The letter was full of complimentariness for the team's hard work.
