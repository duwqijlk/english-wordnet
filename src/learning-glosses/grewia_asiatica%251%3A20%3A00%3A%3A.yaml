simpleMeaning: A shrub from Asia that resists drought and looks like a small tree, bearing small red edible
  fruits that are pleasantly sour and often used in sherbets.
scope: Also called phalsa; a shrub with small sour red fruits, not a plum tree.
examples:
- Grewia asiatica bore small red fruits.
- We made sherbet from Grewia asiatica.
