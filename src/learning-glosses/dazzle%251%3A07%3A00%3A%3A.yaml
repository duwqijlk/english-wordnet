simpleMeaning: light that is so bright it leaves you partly unable to see for a short time
scope: A very bright light that stops you seeing well for a short time, not the verb sense of amazing
  someone with great skill or wit.
examples:
- The dazzle of the headlights made the driver slow down.
- She covered her eyes against the dazzle of the sun on the water.
