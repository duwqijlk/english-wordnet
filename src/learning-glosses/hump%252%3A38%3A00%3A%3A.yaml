simpleMeaning: to lean forward with your shoulders drawn forward, so the top of your back sticks out in
  a curve
scope: 'Also called hunch: to curve your back by leaning forward, not the raised bump itself.'
examples:
- He humped his back against the cold wind.
- She humped her shoulders as she carried the heavy box.
