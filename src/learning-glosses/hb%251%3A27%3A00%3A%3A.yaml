simpleMeaning: A blood protein made of globin and heme that gives red blood cells their red colour, and
  above all carries oxygen from the lungs to the flesh of the body
scope: A blood protein that carries oxygen from the lungs to the flesh, not a white blood cell or a blood
  vessel; also called hemoglobin and haemoglobin.
examples:
- Hb carries oxygen from the lungs to the body.
- The lab checked her Hb after the blood test.
