simpleMeaning: A supporting structure of the shoulder, made of muscles and tendons that attach the arm
  to the shoulder joint and let the arm move.
scope: A support in the shoulder made of bands of flesh and tough cords that hold the arm to its joint.
examples:
- The rotator cuff lets the arm swing at the shoulder joint.
- The rotator cuff holds the arm to the shoulder so it can move.
