simpleMeaning: An early kind of flat-bodied winged insect that fishermen use as bait; its water-dwelling
  young have gills, eat other creatures and live under stones.
scope: Stonefly and stone fly are other names for this same winged insect, not a mayfly or a caddis fly.
examples:
- A plecopteran landed on a wet stone beside the stream.
- Fishermen sometimes use a plecopteran as bait.
