simpleMeaning: To write your own name on something, in your own hand
scope: To write your own name on something, in your own hand; not to write words meant to last, not to
  address a book to someone, and not to sign up as a member.
examples:
- The author inscribed his name on the first page of the book.
- She inscribed her signature on the back of the photograph.
