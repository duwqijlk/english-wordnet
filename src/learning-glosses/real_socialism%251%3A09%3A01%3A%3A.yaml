simpleMeaning: This shared way of running a country sets itself goals that can be reached, leaving aside
  the far-off goals of Marxism-Leninism.
scope: This shared way of running a country aims at goals that can be reached rather than the far-off
  goals of Marxism-Leninism.
examples:
- The idea of real socialism emerged in the 1970s in the Soviet Union and Eastern Europe.
- Under real socialism, the state set goals it thought it could reach.
