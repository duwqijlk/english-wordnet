simpleMeaning: The bursting noise of drops flying off with small popping sounds
scope: The sharp bursting noise of drops flying off, also called sputter, splatter, and splutter, not
  the act of throwing liquid on a thing.
examples:
- He heard a spatter of gunfire in the distance.
- The spatter of the frying pan filled the kitchen.
