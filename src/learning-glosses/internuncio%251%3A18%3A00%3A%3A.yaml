simpleMeaning: Of lower rank than the Pope's chief envoy, this envoy of the Pope in the Roman Catholic
  Church speaks for him in another land
scope: This envoy of the Pope in the Roman Catholic Church ranks below a nuncio.
examples:
- The Pope chose an internuncio to act for him abroad.
- The internuncio spoke for the Pope at the talks.
