simpleMeaning: The part of economics that looks at single buyers, homes and firms and how they use money.
scope: The part of economics that looks at single buyers, homes and firms and how they use money; not
  the study of a whole country's economy and not the study of money itself.
examples:
- Microeconomics looks at how one family spends its money.
- She studied microeconomics to learn how single firms set prices.
