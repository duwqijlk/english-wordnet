simpleMeaning: letters cut or marked into the face of something, most often whole words, so the writing
  stays there to be read
scope: This is writing cut or marked into the face of something, most often whole words; inscription is
  another name for this sense, and it is not handwriting on paper or a single letter.
examples:
- The lettering on the stone was hard to read.
- Gold lettering spelled out the name above the door.
