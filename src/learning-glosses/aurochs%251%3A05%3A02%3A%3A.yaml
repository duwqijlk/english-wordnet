simpleMeaning: a European bison (a large wild animal like a cow) with a smaller and higher head than the
  North American kind
scope: The European bison, with a smaller and higher head than the North American bison; not the long-horned
  European wild ox that has died out.
examples:
- The aurochs, a European bison, has a smaller and higher head than the North American bison.
- At the zoo, the aurochs stood beside a North American bison, and its smaller, higher head was easy to
  see.
