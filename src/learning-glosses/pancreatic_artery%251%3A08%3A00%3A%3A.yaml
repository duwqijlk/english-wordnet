simpleMeaning: A blood tube that branches from the one that feeds the spleen, and feeds the pancreas
scope: A blood tube that branches from the one that feeds the spleen, and feeds the pancreas; arteria
  pancreatica is another name for it, not the main blood tube from the heart and not a vein.
examples:
- The pancreatic artery was tied off during surgery.
- Blood reaches the pancreas through the pancreatic artery.
