simpleMeaning: the way an animal eats by taking small bites again and again
scope: Also called browse, this is an animal eating by taking small bites again and again; it is not looking
  through pages or goods in a shop.
examples:
- The deer spent the morning browsing on young leaves and twigs.
- Browsing by goats soon cleared the small bushes from the field.
