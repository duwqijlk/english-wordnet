simpleMeaning: A ground-hugging eastern North American shrub whose white bell-shaped flowers give way
  to spicy red fruit and whose glossy, fragrant leaves yield an aromatic oil.
scope: The whole creeping shrub, also known as checkerberry, teaberry, mountain tea and creeping wintergreen;
  not its spicy red fruit, and not the low woodland plants of the genus Pyrola that share the name.
examples:
- Wintergreen spreads across the forest floor in a mat of glossy leaves.
- She crushed a wintergreen leaf between her fingers and smelled the sharp, sweet oil.
