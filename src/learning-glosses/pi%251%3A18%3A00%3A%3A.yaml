simpleMeaning: A person hired to find out facts and to help with looking into crimes.
scope: This is a person hired to find out facts for criminal cases, also called operative, private detective,
  private eye, private investigator, shamus, and sherlock, not a drug and not a Greek letter.
examples:
- She hired a PI to find the missing man.
- The PI helped look into the crime.
