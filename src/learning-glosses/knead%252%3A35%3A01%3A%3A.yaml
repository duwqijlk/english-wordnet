simpleMeaning: to press and rub a person's body with the hands, usually to ease pain or help them relax
scope: Also called massage; not rubbing to clean the skin and not pressing dough.
examples:
- She kneaded her child's shoulders to help him relax.
- The nurse kneaded the old man's back to ease the ache in his muscles.
