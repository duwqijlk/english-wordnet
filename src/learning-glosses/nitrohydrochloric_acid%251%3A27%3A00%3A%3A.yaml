simpleMeaning: Metals, even gold, dissolve in a yellow mix of two liquids, one nitric and one made from
  hydrogen and chlorine, which eats into things and gives off fumes.
scope: Aqua regia is another name for this yellow mix of two liquids, which eats into things, gives off
  fumes, and dissolves metals, even gold.
examples:
- Nitrohydrochloric acid can dissolve gold.
- The nitrohydrochloric acid ate into the metal and gave off fumes.
