simpleMeaning: to put written words or numbers inside a pair of marks
scope: To put written words or numbers inside a pair of marks; bracket is another name for this sense,
  not to put words in quotes and not to leave them out.
examples:
- Please bracket out that remark so we can deal with it later.
- She bracketed out the words that did not belong in the text.
