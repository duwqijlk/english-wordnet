simpleMeaning: to speak words in a loud voice, often from surprise, great fear, or joy
scope: 'Also called call out, cry, exclaim, outcry and shout: to say words in a loud voice, often from
  surprise, fear or joy, not to speak in a low voice and not to weep.'
examples:
- She cried out in joy when she heard the news.
- ‘Help!’ she cried out when she saw the smoke.
