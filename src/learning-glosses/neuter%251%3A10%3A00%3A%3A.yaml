simpleMeaning: In grammar, a word class that is not the male class and not the female class; it points
  mainly, but not only, to things that are not living
scope: In grammar, the class for things that are neither male nor female, not the male class or the female
  class, and not a living thing with no sex parts.
examples:
- In German, the word for 'girl' belongs to the neuter gender.
- The teacher explained that 'it' is a neuter pronoun in English.
