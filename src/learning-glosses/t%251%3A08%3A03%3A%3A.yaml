simpleMeaning: a neck-gland hormone like thyroxine, made less, one less iodine in each small piece; works
  as thyroxine works, harder and for a briefer spell
scope: This is a neck-gland hormone like thyroxine, with one less iodine in each small piece, not thyroxine
  itself, the base in DNA, or the 20th letter, and it is also called liothyronine and triiodothyronine.
examples:
- T acts faster than the other hormone.
- The dose of T wore off sooner than the other hormone.
