simpleMeaning: Next to the cell's control centre sits a small patch of cell jelly, holding tiny rod-shaped
  parts that lay out the cell's tiny tubes.
scope: This small cell patch is also called a centrosome.
examples:
- The central body lies next to the nucleus in the cell.
- The central body sets out the tiny tubes inside the cell.
