simpleMeaning: a person who makes false claims about himself or herself, so that others will believe something
  that is not true
scope: This is a person who makes false claims to trick others. Not the sense of a person who hides his
  or her real feelings behind beliefs he or she does not hold, and not a person who claims the right to
  be king or queen, often with no true right to it.
examples:
- The pretender claimed to be a doctor, but he had no training at all.
- Everyone soon saw that the pretender's stories about his past were lies.
