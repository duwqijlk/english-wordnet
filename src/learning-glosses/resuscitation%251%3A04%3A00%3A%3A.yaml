senseId: 'resuscitation%1:04:00::'
synsetId: 01050134-n
simpleMeaning: the act of bringing a person back so that they are awake and know what is around them again
scope: This is bringing a person back to being awake; it is not bringing an old idea or custom back into
  use, and it is not sleep or rest.
examples:
- The nurse started resuscitation at once, and the man soon opened his eyes.
- Resuscitation was needed after the crash, and the team worked until she woke up.
