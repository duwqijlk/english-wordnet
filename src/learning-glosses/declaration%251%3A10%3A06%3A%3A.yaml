simpleMeaning: A written list of goods that can be taxed, or of things on which duty must be paid
scope: This is a list of goods for tax or duty, not a strong plain statement, not a statement given in
  law without an oath, and not the top bid in bridge.
examples:
- He filled in the declaration for the goods in his case.
- The customs officer checked her declaration carefully.
