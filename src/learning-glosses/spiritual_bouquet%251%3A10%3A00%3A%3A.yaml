simpleMeaning: For someone else's sake, the sender of this card, in the Roman Catholic Church, says prayers
  and certain other holy acts will be done.
scope: Given in the Roman Catholic Church, it is a card saying its sender will pray and do certain holy
  acts for someone else.
examples:
- A spiritual bouquet was sent, promising prayers for someone else.
- The spiritual bouquet said its sender would pray for another person.
