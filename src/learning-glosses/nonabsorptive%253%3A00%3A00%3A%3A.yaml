simpleMeaning: Said of a thing that will not take in any liquid
scope: Said of a thing that will not take in any liquid, also called nonabsorbent, not a thing that soaks
  liquid up and not a thing that lets liquid run straight through.
examples:
- The nonabsorptive cloth would not soak up the spill.
- This nonabsorptive coating keeps rain on the surface.
