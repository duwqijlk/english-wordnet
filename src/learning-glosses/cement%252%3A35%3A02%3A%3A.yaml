simpleMeaning: To put a coat of hard building stuff over a thing, so that it is covered
scope: Covering a thing with a coat, not joining two things together and not making a friendship strong.
examples:
- The workers cemented the wall to keep out the rain.
- He cemented over the crack in the floor.
