simpleMeaning: A formal note in the court records says the case is dropped, and so the side bringing it
  ends the case
scope: The act of ending a case in court by putting a formal note in the court records that the case is
  dropped, also called nol.pros. and nolle prosequi, not a judge throwing a case out and not a not-guilty
  verdict.
examples:
- The prosecutor nolle prossed the case when the witness could not be found.
- They nolle prossed the charge after new facts came to light.
