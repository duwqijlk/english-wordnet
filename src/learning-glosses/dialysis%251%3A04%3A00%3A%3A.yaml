senseId: 'dialysis%1:04:00::'
synsetId: 00651003-n
simpleMeaning: The act of splitting things mixed in a liquid by letting them pass at different speeds
  through a thin wall that lets some things through but stops others.
scope: This is splitting mixed things in a liquid as they pass through a thin wall, not simple straining
  and not mixing things together.
examples:
- Dialysis can split small salts from big parts that cannot pass through the wall.
- The class watched dialysis at work as one thing in the liquid passed through faster than another.
