simpleMeaning: having a nice shape where each part fits well with the others
scope: This describes a body or thing with a pleasing, well-balanced form, not something with no clear
  form or an ugly form.
examples:
- She has shapely legs and a slim waist.
- The vase has a shapely curve that looks very pleasing.
