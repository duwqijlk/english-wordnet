simpleMeaning: a tool that tells how hot a thing is when it is very hot, by how much a heated wire slows
  down the flow of power through it
scope: A tool that finds very high heat, not a plain thermometer for the body and not a gauge that reads
  low heat.
examples:
- The resistance pyrometer showed how hot the steel had got in the furnace.
- They used a resistance pyrometer to check the heat of the kiln.
