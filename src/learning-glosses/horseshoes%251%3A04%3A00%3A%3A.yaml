simpleMeaning: a game where players throw iron rings, or open iron rings, at a stick in the ground and
  try to get a ring round it
scope: This is the throwing game with iron rings and a stick in the ground, not the iron shoes that horses
  wear on their feet.
examples:
- They played horseshoes in the yard all afternoon.
- In horseshoes, you score when a ring lands round the stick.
