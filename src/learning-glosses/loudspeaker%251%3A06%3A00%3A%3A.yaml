simpleMeaning: sound made from electric signals that travels far enough for people at a distance to hear
  it
scope: 'Also called a speaker: a box that turns electric signals into sound that carries over a long way,
  not a person giving a talk and not a part of a radio set.'
examples:
- The loudspeaker crackled as the principal began to speak.
- They set up loudspeakers around the field so everyone could hear the match.
