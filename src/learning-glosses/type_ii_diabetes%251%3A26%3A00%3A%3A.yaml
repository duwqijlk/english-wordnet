simpleMeaning: a mild sugar illness that comes on slowly in adults, set off by obesity, severe stress,
  menopause or other factors, and usually controlled by diet and sugar-lowering drugs without insulin
scope: 'Also called adult-onset diabetes, adult-onset diabetes mellitus, ketoacidosis-resistant diabetes,
  ketoacidosis-resistant diabetes mellitus, ketosis-resistant diabetes, ketosis-resistant diabetes mellitus,
  mature-onset diabetes, maturity-onset diabetes, maturity-onset diabetes mellitus, non-insulin-dependent
  diabetes, non-insulin-dependent diabetes mellitus and NIDDM: a mild sugar illness that comes on slowly
  in adults, not a sudden sugar illness of children and not a disease needing insulin.'
examples:
- Type II diabetes comes on slowly in adults.
- Diet usually controls type II diabetes without insulin.
