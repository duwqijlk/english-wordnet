simpleMeaning: A groove in the inner face of the back part of the brain.
scope: A groove in the inner face of the back part of the brain, also called a calcarine sulcus; not a
  groove on the outer face and not a crack from harm.
examples:
- The calcarine fissure runs through the back of the brain.
- Sight signals pass near the calcarine fissure.
