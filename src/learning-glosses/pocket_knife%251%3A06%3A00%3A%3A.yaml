simpleMeaning: A cutting tool with a blade that folds into its handle, small enough to carry about
scope: A cutting tool with a blade that folds into its handle, small enough to carry about; pocketknife
  is another name for this sense, and this is not a fixed-blade tool.
examples:
- He opened his pocket knife to cut the string.
- A pocket knife has a blade that folds into the handle.
