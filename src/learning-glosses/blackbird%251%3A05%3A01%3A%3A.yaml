simpleMeaning: a bird in a family of birds (the Icteridae) where the male is black or mostly black
scope: A bird in this family where the male is black or mostly black, not the common black European thrush
  sense of the same word.
examples:
- The red-winged blackbird is a common blackbird in North America.
- A yellow-headed blackbird sang from a reed near the water.
