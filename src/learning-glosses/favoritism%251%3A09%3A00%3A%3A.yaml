simpleMeaning: a tendency to give one person or group better treatment than others
scope: A leaning toward better treatment for one person or group. It is not a simple liking, and not a
  fair choice between things.
examples:
- Workers complained of favoritism when the manager's son always got the best shifts.
- The teacher showed favoritism by always picking the same student to help her.
