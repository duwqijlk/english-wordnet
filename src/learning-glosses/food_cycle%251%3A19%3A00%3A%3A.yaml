simpleMeaning: In ecology, a group of living things in which many chains of eating are joined to one another
scope: 'Also called a food web: In ecology, a group of living things joined by many chains of eating,
  not one single chain and not a list of what one animal eats.'
examples:
- The food cycle of the lake links plants, small fish, and herons.
- Scientists study the food cycle to see how each living thing feeds on another.
