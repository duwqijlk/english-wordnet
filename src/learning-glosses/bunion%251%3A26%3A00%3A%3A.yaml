simpleMeaning: A sore swelling on the first joint of the big toe, where a small sac under the skin has
  grown large.
scope: A sore swelling on the first joint of the big toe, not a corn and not a swelling elsewhere on the
  foot.
examples:
- Her bunion made tight shoes hurt.
- The bunion on his big toe swelled after the long walk.
