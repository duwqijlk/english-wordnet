simpleMeaning: A tall, very woolly mullein with tightly packed yellow flowers on its stems; the ancient
  Greeks and Romans dipped the stalks in tallow to make funeral torches.
scope: This is the tall, very woolly mullein with dense yellow flower spikes, not a smaller mullein with
  different flowers or leaves; flannel mullein and woolly mullein are other names for it.
examples:
- Great mullein towers over the dry bank in its second year.
- In the past, people dipped great mullein stalks in tallow and burned them as torches.
