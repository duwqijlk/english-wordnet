simpleMeaning: wet food for animals, especially for pigs, made mostly of bits of food left from the kitchen,
  mixed with water or with skimmed or sour milk
scope: Also called slop, swill, pigswill and pigwash. This is the wet pig-food sense, not the sense that
  means cheap clothes once given to sailors in Britain.
examples:
- The farmer poured the slops into the pigs' trough.
- She mixed kitchen scraps with milk to make slops for the pigs.
