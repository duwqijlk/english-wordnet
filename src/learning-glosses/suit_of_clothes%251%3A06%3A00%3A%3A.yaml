simpleMeaning: A set of outer garments, usually a jacket with trousers or a skirt, all made from the same
  cloth in the same colour.
scope: A matching set of outer garments in one cloth and colour; also called a suit; not a single jacket
  and not work clothes worn for one job.
examples:
- They buried him in his best suit of clothes.
- He bought a new suit of clothes for the wedding.
