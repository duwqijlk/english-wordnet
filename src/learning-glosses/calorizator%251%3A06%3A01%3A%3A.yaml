simpleMeaning: A machine in a beet-sugar factory that heats the juice so the sugar spreads more easily
  into the water.
scope: 'Also called calorisator: a heater for beet juice in a sugar factory, not a boiler for water and
  not a press for the beets.'
examples:
- The calorizator heats the beet juice before the next stage.
- Workers checked the calorizator as the juice flowed through it.
