simpleMeaning: A step in the life work of a cell, driven by a helper protein, that builds ATP, the cell's
  energy store, from ADP, its used-up form.
scope: A step in a cell's life work that builds ATP from ADP; not a step that breaks down food and not
  a step that makes new cells.
examples:
- Oxidative phosphorylation builds ATP in the mitochondria.
- Without oxidative phosphorylation, the cell would run out of ATP.
