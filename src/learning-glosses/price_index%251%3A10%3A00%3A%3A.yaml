synsetId: 06653830-n
simpleMeaning: a set of numbers that shows how the cost of one thing, or a set of things people buy, moves
  up or down over time
scope: Also called price level, this is a set of numbers that shows how costs move over time, not a list
  of what things cost today.
examples:
- The price index shows that the cost of food has gone up over the last year.
- They used the price index to track how the cost of a set of goods changed over time.
