senseId: 'insist%2:31:00::'
synsetId: 00718950-v
simpleMeaning: to state something as certainly true, strongly and with confidence.
scope: Affirming that something is true with confidence (another name for this sense is 'assert'), not
  holding firmly to a position or pleading with someone.
examples:
- She insisted that the meeting had never taken place.
- The author insists that the theory has been proven.
