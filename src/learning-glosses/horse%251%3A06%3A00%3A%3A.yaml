simpleMeaning: The chess piece called the knight, which moves two squares in one direction and then one
  square at a right angle.
scope: This is the chess piece called the knight; it is not the animal, and not the padded frame used
  in gymnastics.
examples:
- He moved his horse to the middle of the board and threatened the queen.
- Her horse was trapped in the corner of the chessboard.
