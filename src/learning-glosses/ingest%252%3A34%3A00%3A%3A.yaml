simpleMeaning: to help yourself to food or drink, or to eat or drink it often, as you usually do
scope: Have, take and consume are other names for this sense. This is about helping yourself to food or
  drink, or having it often in the usual way. Not about taking in ideas or facts.
examples:
- He ingested another bowl of soup when it was offered at dinner.
- She ingests a cup of tea with her breakfast every morning.
