simpleMeaning: A safeguard in the Sixth Amendment that the state must give a person charged with a crime
  a fast, open hearing before a fair group that tries the case.
scope: This is the Sixth Amendment safeguard for a person charged with a crime, a fast, open hearing before
  a fair group, not a closed hearing and not one held long after the charge.
examples:
- His right to speedy and public trial by jury meant the court could not keep him waiting for years.
- She claimed her right to speedy and public trial by jury so the case would be heard in the open.
