simpleMeaning: One written sign may show up in more than one shape, and each shape that stands for the
  same sound counts as one of these.
scope: Several shapes can stand for one written sign, and each such shape is one of these.
examples:
- The teacher showed that the printed allograph and the hand-written allograph stand for the same sound.
- The pupil wrote the allograph in a flowing hand, quite unlike the printed form in the book.
