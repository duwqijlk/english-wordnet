simpleMeaning: a person whose job is to pick up the waste people throw away and get rid of it
scope: This is a person whose job is to take away and get rid of waste, also called a garbage carter or
  a garbage collector, not a person who makes waste and not a truck driver who moves other goods.
examples:
- The garbage hauler comes to our street early every morning.
- Our garbage hauler takes the bins away and empties them at the dump.
