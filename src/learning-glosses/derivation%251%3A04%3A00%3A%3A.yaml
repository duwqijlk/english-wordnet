senseId: 'derivation%1:04:00::'
synsetId: 00393143-n
simpleMeaning: The act of getting a thing from the place or thing it comes from.
scope: The act of getting a thing from its source, not the source itself, not a family line, and not the
  forming of new words.
examples:
- The derivation of fresh water from the river kept the town alive.
- The derivation of the metal from the ore took great heat.
