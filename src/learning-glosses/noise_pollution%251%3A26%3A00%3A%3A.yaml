simpleMeaning: Sound from the world around that bothers people and can do them harm
scope: Sound from the world around that bothers people and can do them harm; not just a loud sound for
  a moment, and not dirty air or water.
examples:
- The noise pollution from the new road kept the whole street awake at night.
- People near the airport complain about noise pollution from the planes.
