simpleMeaning: a public official whose job is to look into a death that was not from natural causes, by
  holding an inquest (an official check into how and why it happened)
scope: This is an official who checks how an unnatural death happened, not a doctor who treats living
  people and not a police officer.
examples:
- The coroner held an inquest into the man's sudden death.
- A coroner said the death was not from natural causes.
