simpleMeaning: Milk foods, vegetables, fruits, grains, and nuts make up this way of eating, which leaves
  out meat and fish.
scope: Milk foods stay in this way of eating, along with vegetables, fruits, grains, and nuts, while meat
  and fish are left out.
examples:
- They chose lacto-vegetarianism and ate milk foods with vegetables and grains.
- On lacto-vegetarianism, the table held milk foods, vegetables, fruits, grains, and nuts.
