simpleMeaning: A drug sold as Corgard that slows the heart by blocking the signals that speed it up, used
  to treat high blood pressure and chest pain.
scope: A drug sold as Corgard that slows the heart by blocking the signals that speed it up, used for
  high blood pressure and chest pain; not a drug that speeds the heart and not a painkiller.
examples:
- Nadolol lowered his blood pressure.
- The doctor gave her nadolol for the chest pain.
