simpleMeaning: So vast and firm that its sheer mass makes a strong impression.
scope: Also called massive or monumental, so vast and firm that its sheer mass makes a strong impression;
  not the use for a thing marked by great size and stiffness and sameness throughout.
examples:
- The building was monolithic, towering over the square.
- The statue was monolithic, vast and firm against the sky.
