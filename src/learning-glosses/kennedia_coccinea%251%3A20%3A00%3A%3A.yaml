simpleMeaning: A woody climbing plant that lies flat or winds round other plants, with small tough leaves
  and bunches of red flowers; found in Australia and Tasmania
scope: Also called coral vine; this is the flat or winding vine with red flowers, not the hairy trailing
  vine with bright scarlet-pink flowers.
examples:
- Kennedia coccinea grew along the fence.
- The Kennedia coccinea was covered in red flowers.
