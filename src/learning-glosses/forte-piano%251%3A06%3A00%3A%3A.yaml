simpleMeaning: A keyboard machine that makes music when pressed keys drive small hammers onto strings
  tuned to notes
scope: Piano and pianoforte are other names for this keyboard machine, whose keys drive small hammers
  onto tuned strings.
examples:
- She pressed the keys of the forte-piano and the hammers struck the strings.
- He played a tune on the forte-piano.
