simpleMeaning: A tick that feeds on the dusky-footed wood rat and bites people; the main carrier of Lyme
  disease in the western United States, above all in northern California
scope: Also called the western black-legged tick; a tick of the western United States that carries Lyme
  disease to people.
examples:
- Ixodes pacificus latched onto the hiker's leg after the walk through the brush.
- The doctor checked for Ixodes pacificus after the boy found a tick on his arm.
