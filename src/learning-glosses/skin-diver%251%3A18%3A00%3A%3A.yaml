simpleMeaning: With a face mask and foot fins, and either a tube to breathe through or a tank of air,
  this person swims under water
scope: Also called an aquanaut, this person swims under water wearing a face mask and foot fins, breathing
  through a tube or from a tank of air.
examples:
- The skin-diver slipped under the water with a mask and fins.
- The skin-diver stayed under the water, breathing through a tube.
