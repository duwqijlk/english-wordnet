simpleMeaning: In biology, a subgroup of organisms inside a species that differs in small, minor ways
  from similar groups.
scope: This is a biological subgroup within a species, not the physical-chemistry state of matter, not
  a shape, body, or outward appearance, not the sound or spelling of a word, not a document, not a kind
  or type, not a class of students, not a mannequin or a concrete mold, not the arrangement of parts in
  a work, not a particular way something shows itself, not an ability to perform, and not a verb use.
examples:
- Biologists treat the dark-winged population as a separate form of the species.
- This form differs from the typical one only in the color of its flowers.
