simpleMeaning: A rope or light chain used to hold an animal in one place
scope: This is the rope or chain that holds an animal in place, also called a lead and a leash, not the
  act of tying an animal.
examples:
- The goat strained at its tether, trying to reach the grass.
- He tied the horse to a post with a short tether.
