simpleMeaning: To the front part of the outer layer of the side part of the brain runs a blood tube of
  the side of the head
scope: This blood tube of the side of the head is also called the anterior temporal artery, not the one
  that goes to the back part.
examples:
- The arteria temporalis anterior brings blood to the front part of the side of the brain.
- The arteria temporalis anterior runs to the front of the outer layer of the side part of the brain.
