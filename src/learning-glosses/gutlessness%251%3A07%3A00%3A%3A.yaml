simpleMeaning: The quality of having no courage and no firm will, and of being afraid of hurt or loss.
scope: The quality of having no courage and no firm will, and of being afraid of hurt or loss; not bravery
  and not a passing fright at one single thing.
examples:
- His gutlessness showed when he would not stand up for his friend.
- Gutlessness kept her from trying again after one hurt.
