simpleMeaning: People with Parkinsonism who take phenothiazine often find the tongue rolling and the face,
  trunk or limbs twitching, with no will behind it.
scope: A state in which the tongue rolls and the face, trunk or limbs twitch with no will behind it, often
  in people with Parkinsonism who take phenothiazine; not Parkinsonism itself.
examples:
- Tardive dyskinesia made her tongue roll and her face twitch.
- The doctor saw tardive dyskinesia in a patient with Parkinsonism.
