simpleMeaning: In architecture, a ledge that sticks out from a cornice or sill to shield the space below
  from rain, as over a window or doorway
scope: In architecture, a ledge that shields the space below from rain, also called drip and drip mold;
  not a flat sill and not a gutter that carries water away.
examples:
- The drip mould above the door kept the step dry.
- They repaired the drip mould over the old window.
