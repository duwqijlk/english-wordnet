senseId: 'indian_cherry%1:20:00::'
synsetId: 13162749-n
simpleMeaning: A bush that loses its leaves in winter, from the east and middle of the United States,
  with black fruit like berries and leaves that turn gold-yellow in autumn.
scope: A bush from the east and middle of the United States with black berry-like fruit, not a cherry
  tree grown for its fruit and not a bush that keeps its leaves.
examples:
- The indian cherry grows along the river bank.
- In autumn the indian cherry turns a golden yellow.
