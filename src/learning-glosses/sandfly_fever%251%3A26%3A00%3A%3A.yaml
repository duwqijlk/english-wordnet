simpleMeaning: Passed on by the bite of the small biting insect Phlebotomus papatasii, this mild sickness
  is caused by a virus.
scope: Pappataci fever and phlebotomus are other names for this mild sickness caused by a virus, passed
  on by the bite of the small biting insect Phlebotomus papatasii.
examples:
- He came down with sandfly fever.
- The bite of a sand fly can give a person sandfly fever.
