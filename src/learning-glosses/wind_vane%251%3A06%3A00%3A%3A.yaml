simpleMeaning: A machine fixed high up that turns freely to show which way the moving air blows
scope: This is a machine fixed high up that turns freely to show which way the moving air blows; vane,
  weathervane and weather vane are other names for this sense, and it is not a compass or a flag.
examples:
- The wind vane on the barn roof pointed east all morning.
- We looked at the wind vane to see which way the wind was blowing.
