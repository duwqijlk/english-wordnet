simpleMeaning: a commissioned officer in the Army, Air Force or Marines, one rank above the lowest officer
  rank and one rank below a captain
scope: An officer in the Army, Air Force or Marines, also called a first lieutenant; not the lowest officer
  and not a captain.
examples:
- The 1st lieutenant led the platoon.
- She was made a 1st lieutenant last year.
