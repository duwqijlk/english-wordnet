simpleMeaning: a liquid that turns hard in air as it takes in oxygen, often mixed into paint or varnish
  to give them a base
scope: A liquid that hardens in air, not a cooking oil and not a liquid that stays soft.
examples:
- Linseed oil is a drying oil used in paints.
- The painter mixed the drying oil into the varnish.
