simpleMeaning: Tiny bits from a gas, a liquid, or a solid dissolved in liquid are caught and held on a
  surface by this device.
scope: This is a device that catches tiny bits on a surface, not a device that soaks them up inside.
examples:
- The adsorber caught the gas on its surface.
- Tiny bits from the liquid stayed on the adsorber's surface.
