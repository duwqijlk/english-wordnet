senseId: 'wheeler%1:18:02::'
synsetId: 10795204-n
simpleMeaning: the man at the outermost end of a line of soldiers, on the side farthest from the centre
  when the line turns
scope: The man at the outermost end of a line of soldiers when the line turns; not a maker of wooden wheels
  and not a horse harnessed nearest a vehicle's wheels.
examples:
- As the rank turned, the wheeler at the outer end had to take the longest steps.
- The wheeler kept his place at the far end of the rank during the turn.
