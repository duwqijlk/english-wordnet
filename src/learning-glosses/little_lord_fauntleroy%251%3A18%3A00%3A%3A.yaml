simpleMeaning: A boy who is far too polite and wears fine clothes.
scope: Another name for him is Fauntleroy; he is a boy who is too polite and too well dressed, not a rude
  boy and not a plainly dressed one.
examples:
- He acted like a Little Lord Fauntleroy at the party.
- Don't be such a Little Lord Fauntleroy, just say what you think.
