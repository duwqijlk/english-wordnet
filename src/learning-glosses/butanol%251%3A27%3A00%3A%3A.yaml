simpleMeaning: a kind of alcohol that can catch fire easily, made from butane (a gas), and used as a liquid
  that breaks down other things
scope: 'Also called butyl alcohol: a liquid used to break down other things, not the alcohol in drinks
  and not a fuel for cars.'
examples:
- Butanol is used in some paints and cleaning liquids.
- The factory keeps butanol in sealed metal drums.
