simpleMeaning: getting involved in other people's matters in a way that is not wanted and that upsets
  or offends them
scope: 'Also called busy, interfering, meddling and meddlesome: too keen to get into other people''s business
  in a rude, unwanted way, not just busy with much work to do.'
examples:
- An officious neighbour kept telling us how to run our own house.
- He was so officious that he opened other people's letters to check them.
