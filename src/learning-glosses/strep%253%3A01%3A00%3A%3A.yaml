simpleMeaning: about or caused by small round germs that grow in pairs or chains
scope: Used for an illness or a test linked to these germs; it is not the name of the germs themselves.
examples:
- He stayed home with a strep throat.
- The doctor said it was a strep infection and gave her medicine.
