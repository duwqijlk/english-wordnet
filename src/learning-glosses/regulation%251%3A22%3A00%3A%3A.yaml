schema: oewn-learning-gloss-v2
senseId: 'regulation%1:22:00::'
synsetId: 13570308-n
simpleMeaning: In embryology, the power of an embryo (a very young living thing) to go on forming and
  growing in the normal way after its form is hurt or changed
scope: 'In embryology only: this power of an embryo to keep growing in the normal way, not a rule that
  controls behavior, not the act of making things regular, and not the adjective sense for following a
  rule.'
examples:
- Regulation allowed the young embryo to keep growing normally even after part of it was damaged.
- Scientists studied regulation in the embryo when a small change early on did not stop its normal growth.
