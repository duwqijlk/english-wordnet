simpleMeaning: To add the chords shown by the numbered bass line, so a part in a piece of baroque music
  from the 1600s and 1700s is full and complete
scope: 'Also called realize: adding chords to a baroque music part, not earning money from work or business,
  and not making an idea exist in the world.'
examples:
- He realised the continuo part by adding the chords the bass line called for.
- The exam asked them to realise a short passage of baroque music.
