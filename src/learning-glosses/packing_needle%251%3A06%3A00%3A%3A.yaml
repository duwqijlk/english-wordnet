simpleMeaning: A big pointed tool for stitching shut strong cloth sacks
scope: A big pointed tool for stitching shut strong cloth sacks, not a small needle for sewing clothes
  and not the needle of a record player.
examples:
- He used a packing needle to sew up the canvas sack of grain.
- The packing needle pushed easily through the thick canvas of the tent bag.
