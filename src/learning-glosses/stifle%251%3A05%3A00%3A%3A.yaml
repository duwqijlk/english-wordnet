simpleMeaning: the joint in a four-legged animal between the thigh bone and the shin bone; it matches
  the knee in a person
scope: 'Also called knee: the leg joint in a four-legged animal; not the verb uses, to hold something
  back or to make it hard to breathe.'
examples:
- The horse hurt its stifle when it fell.
- The vet checked the dog's stifle for swelling.
