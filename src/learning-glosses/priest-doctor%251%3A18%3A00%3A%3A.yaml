simpleMeaning: in groups that follow shamanism, a person who stands between the seen world and the world
  of spirits, using magic to heal the sick or tell what will happen
scope: Also called a shaman; a healer who speaks with spirits, not a modern doctor and not a church leader.
examples:
- The priest-doctor spoke to the spirits to find why the child was ill.
- In the village, the priest-doctor used magic to heal the sick.
