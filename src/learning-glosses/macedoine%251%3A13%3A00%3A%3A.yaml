simpleMeaning: Hot or cold, fruit or vegetables cut into small pieces and mixed together
scope: A mix of cut-up fruit or vegetables, hot or cold, not a plain salad and not a stew.
examples:
- The macedoine of carrots and peas came to the table hot.
- She served a cold macedoine of melon and berries for dessert.
