simpleMeaning: 'Narrowed in what it means, so it covers less than the word on its own: ''man'' in ''a
  tall man'' means only men who are tall'
scope: This is a word made narrower in meaning; qualified is another name for this sense, not a word that
  is simply limited by a rule or a secret document.
examples:
- In 'a tall man', 'man' is used in a restricted sense.
- The word 'dog' is restricted here to mean only large dogs.
