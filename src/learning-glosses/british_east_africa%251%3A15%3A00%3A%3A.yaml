simpleMeaning: The lands once ruled by Britain, made up of Kenya, Tanganyika, Uganda and Zanzibar.
scope: The former lands ruled by Britain, made up of Kenya, Tanganyika, Uganda and Zanzibar, were a group
  of lands rather than one place, unlike British West Africa and South Africa, which were other lands
  ruled by Britain in other parts of Africa.
examples:
- British East Africa once covered Kenya and Uganda.
- Maps of British East Africa showed Zanzibar off the coast.
