simpleMeaning: a person who makes thread by twisting thin pieces of wool, cotton or other material together
scope: 'Also called a spinner: this is a person who makes thread by twisting material together, not a
  woman who has never married.'
examples:
- The spinster worked all day, twisting wool into strong thread.
- In the old village, a spinster made thread for the cloth makers.
