senseId: 'surcharge%1:21:00::'
synsetId: 13346527-n
simpleMeaning: Extra money you have to pay, because something was left out before, or because you did
  not use enough care or skill
scope: 'This is the noun sense: an extra amount to pay, not the verb sense of printing a new money value
  on a stamp or a paper money note.'
examples:
- The bill included a surcharge for the extra work they had left out before.
- He paid a small surcharge because he had not used common care.
