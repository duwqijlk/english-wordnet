simpleMeaning: in a way that is clear and strong, so people notice it at once
scope: This word describes how clear and strong something is, in a way people notice at once; it does
  not mean hitting something.
examples:
- The two sisters look strikingly alike, though they dress very differently.
- The house was strikingly different from all the others on the street.
