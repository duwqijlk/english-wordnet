simpleMeaning: a yellow crystal drug, sold as Terramycin, made from a living thing found in soil, used
  to treat many kinds of infections caused by bacteria and by rickettsia
scope: 'Also called oxytetracycline or oxytetracycline hydrochloride: a yellow drug made from a soil germ
  that treats bacterial infections, not a painkiller and not a drug for viruses.'
examples:
- The doctor gave her hydroxytetracycline for the infection.
- Hydroxytetracycline is sold under the name Terramycin.
