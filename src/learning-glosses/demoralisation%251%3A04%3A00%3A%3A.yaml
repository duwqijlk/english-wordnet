simpleMeaning: Taking away the moral ground that a belief or a plan stands on.
scope: The act of taking away the moral ground of a belief or plan, not the low feeling that comes from
  lost morale.
examples:
- The demoralisation of the old policy left it with no defenders.
- Demoralisation of the doctrine took years of hard argument.
