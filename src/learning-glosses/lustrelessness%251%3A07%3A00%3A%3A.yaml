simpleMeaning: 'No bright spots and no shine: a surface with little or no contrast between one part and
  another'
scope: Also called flatness, lusterlessness, mat, matt, and matte, this is the dull look of a surface
  with little or no contrast, not a shiny finish and not a change in colour.
examples:
- The lustrelessness of the old paint made the wall look dull and flat.
- She liked the lustrelessness of the paper, with no shine at all.
