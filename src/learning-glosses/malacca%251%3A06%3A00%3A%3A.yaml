simpleMeaning: From the stem of a rattan palm comes this stick for walking
scope: Also called malacca cane, this is a stick for walking made from the stem of a rattan palm, not
  the stem itself and not a handle for an umbrella.
examples:
- He leaned on his malacca as he walked down the path.
- The malacca had a smooth, polished stem.
