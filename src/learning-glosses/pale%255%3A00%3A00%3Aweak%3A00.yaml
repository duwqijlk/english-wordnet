senseId: pale%5:00:00:weak:00
synsetId: 02333753-s
simpleMeaning: 'Said of light: not bright or strong, but dim and weak, giving only a faint glow.'
scope: This describes weak, faint light, not a face drained of colour by illness or shock, not a colour
  made lighter with white, and not a dull performance; sick is another name for this sense.
examples:
- A pale sun barely showed through the winter clouds.
- In the pale light of dawn, the path was hard to follow.
