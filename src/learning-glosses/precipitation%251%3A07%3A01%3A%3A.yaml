simpleMeaning: speed that is too quick because someone is too keen to act, and it may make them careless
scope: 'Also called hurry and haste: too much speed from being too keen to act, not rain or other water
  falling, not a fall from a high place, and not a chemical change.'
examples:
- His precipitation in signing the contract led to mistakes he had not seen.
- She acted with precipitation and did not stop to check the details.
