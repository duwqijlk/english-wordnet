simpleMeaning: A Yiddish word for a person who steals or acts in a low, dishonest way, often used as a
  rude insult
scope: A Yiddish word for a thief or scoundrel, also called ganef, gonif, and goniff; not a name for a
  person who is merely rude.
examples:
- She called the swindler a ganof under her breath.
- The ganof had stolen money from his own friends.
