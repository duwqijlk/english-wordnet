simpleMeaning: a health problem where the spine (the row of bones down the middle of the back) curves
  to one side in a way that is not normal
scope: This is a health problem where the spine curves to one side, not a straight back and not a curve
  forward or back.
examples:
- The doctor found scoliosis when she checked the child's back.
- Her scoliosis made one shoulder sit higher than the other.
