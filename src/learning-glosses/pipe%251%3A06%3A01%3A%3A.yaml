simpleMeaning: a small bowl on the end of a tube, where a person puts tobacco to smoke it
scope: This is the tube with a bowl that a person smokes tobacco in, not a long tube for water or gas
  and not parts of an organ.
examples:
- He filled his pipe with tobacco and lit it.
- She smoked a pipe on the porch in the evening.
