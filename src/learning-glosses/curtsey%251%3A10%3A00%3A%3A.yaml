simpleMeaning: a bend of the knees that a woman makes to show respect
scope: 'Also called curtsy: this is the bend itself that a woman makes to show respect, not the verb sense
  of making that bend.'
examples:
- The girl gave a curtsey when she met the queen.
- She made a small curtsey before she took her seat.
