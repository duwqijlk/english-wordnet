simpleMeaning: a wrong act against society that breaks the law, done by a young person who is not yet
  an adult
scope: A wrong act by a young person that breaks the law, not a habit of not caring and failing to do
  what you should do.
examples:
- Delinquency among teenagers in the town fell after the new youth centre opened.
- The court deals with delinquency when young people break the law and harm others.
