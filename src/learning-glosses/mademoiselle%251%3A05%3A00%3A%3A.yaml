simpleMeaning: a small silver fish, a drumfish, often mixed up with a white perch, that lives off the
  United States coast from New York to Mexico
scope: A small silver fish often taken for a white perch; not the French word for a young woman.
examples:
- They caught a mademoiselle off the Florida coast.
- The mademoiselle is often mistaken for a white perch.
