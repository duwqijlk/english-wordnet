simpleMeaning: to say in an official way that something no longer counts and has no effect, and to make
  it have no power
scope: This is about making a law, decision or agreement stop counting, not about stopping a planned meeting
  or party, and not about a mark in music.
examples:
- The court cancelled the election results.
- They voted to cancel the old law.
