simpleMeaning: a small lone stinging insect that makes round growths on oaks and other plants
scope: A small lone stinging insect that makes round growths on oaks and other plants; also called cynipid
  wasp, gall wasp and gallfly, not a honey-making insect and not a biting fly.
examples:
- The cynipid gall wasp made a round growth on the oak.
- A cynipid gall wasp laid its eggs in the oak leaf.
