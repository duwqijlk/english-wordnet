simpleMeaning: Kept in temple gardens, this frangipani from India is straight in its growth and cone-shaped.
scope: 'Also called temple tree: this frangipani from India, straight in its growth and cone-shaped, is
  kept in temple gardens, not the other kind of the same name with large yellow flowers.'
examples:
- The pagoda tree stood straight in the temple garden.
- The pagoda tree grew in a cone shape beside the temple.
