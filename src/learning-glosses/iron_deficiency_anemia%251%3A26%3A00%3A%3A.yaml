senseId: 'iron_deficiency_anemia%1:26:00::'
synsetId: 14189391-n
simpleMeaning: The blood loses its strength when too little of a metal from food is taken in, or when
  long bleeding drains that metal away
scope: The blood grows weak from too little of a metal from food or from long bleeding, also called iron
  deficiency anaemia; not a sickness from too little food in general and not a short loss of blood.
examples:
- Iron deficiency anemia is common in young children.
- She took pills for her iron deficiency anemia.
