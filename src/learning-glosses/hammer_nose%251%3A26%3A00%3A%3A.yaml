simpleMeaning: a nose grown large and swollen, with wide pores, red skin, and blood vessels that stand
  out, often seen in people who drink too much alcohol
scope: 'Also called brandy nose, copper nose, hypertrophic rosacea, potato nose, rhinophyma, rum-blossom,
  rum nose, and toper''s nose: a nose grown large, red, and swollen, not a broken nose and not a cold.'
examples:
- Years of heavy drinking left him with a hammer nose.
- The doctor noted the hammer nose and the red skin around it.
