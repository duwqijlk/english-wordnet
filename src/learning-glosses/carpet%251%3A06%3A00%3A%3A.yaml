simpleMeaning: a thick, heavy cloth laid on a floor to cover it, often with a soft, raised top
scope: 'Also called a rug: a thick, heavy cloth laid on a floor, not a spread of flowers on the ground
  and not the act of covering a floor.'
examples:
- The red carpet in the hall was soft under foot.
- She chose a new carpet for the bedroom floor.
