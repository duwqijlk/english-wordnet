simpleMeaning: One generation makes young by mating, and the next makes young without mating, and so it
  goes on in turn
scope: Generations that take turns making young by mating and without mating, also called digenesis; not
  young made one way only.
examples:
- Metagenesis lets the jellyfish breed in two different ways.
- In metagenesis, sexual and asexual generations take turns.
