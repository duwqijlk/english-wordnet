simpleMeaning: A farm machine that uses blades to push earth toward the roots of crops
scope: A farm machine that pushes earth toward crop roots with blades, not a plough that turns earth over
  and not a machine that plants seeds.
examples:
- The farmer used a lister cultivator to bank earth round the maize.
- A lister cultivator throws soil toward the roots.
