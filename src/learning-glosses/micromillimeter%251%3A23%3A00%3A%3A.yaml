simpleMeaning: One part in a billion of a metre is how long this metric unit of length is
scope: Also called a micromillimetre, a millimicron, a nanometer, a nanometre, or nm, this is a length
  of one billionth of a metre, not a trillionth like a micromicron.
examples:
- The film was a few micromillimeters thick, each one a billionth of a metre.
- Engineers measured the gap in micromillimeters.
