simpleMeaning: A bone of the wrist, where it meets the pisiform, the hamate and the lunate bones.
scope: This wrist bone is also called triquetral, os triquetrum, pyramidal bone and triquetral bone.
examples:
- The doctor said the cuneiform bone in her wrist was bruised.
- He broke a cuneiform bone when he fell on his hand.
