simpleMeaning: Sports gear used in body exercises and in lifting heavy things, not fixed to anything,
  lifted and lowered with the hands and arms.
scope: Sports gear lifted and lowered with the hands and arms; also called a weight or a free weight,
  not a machine fixed to the floor and not a ball.
examples:
- He lifted the exercising weight above his head.
- Exercising weights are kept on racks in the gym.
