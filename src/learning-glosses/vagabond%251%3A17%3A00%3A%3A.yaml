simpleMeaning: anything that is like a person with no fixed home, because it does not stay in one place
scope: This is for a thing that does not stay in one fixed place, like a ship at sea. It is not the person
  who wanders with no home, and it is not the act of wandering from place to place.
examples:
- The old boat was a vagabond of the river, never staying long in one port.
- Those stray clouds are vagabonds of the sky, always moving on.
