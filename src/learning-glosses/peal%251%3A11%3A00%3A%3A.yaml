simpleMeaning: a long, deep sound, like the sound of thunder or of large bells ringing
scope: A long, deep sound, also called roll or rolling; not a short sharp sound and not the sound of a
  single small bell.
examples:
- A peal of thunder rolled across the valley.
- The peal of the church bells could be heard for miles.
