simpleMeaning: A bushy plant of Old World salt marshes and sea beaches, with prickly leaves; burned to
  make a crude ash of sodium carbonate
scope: Also called barilla, glasswort, kali, kelpwort, saltwort and Salsola kali; a bushy plant of salt
  marshes burned for its ash, close to other saltworts of the same shores.
examples:
- Salsola soda grows on salt marshes.
- Salsola soda was burned to make a crude ash of sodium carbonate.
