simpleMeaning: Any of several lichens of the genus Parmelia, used as the source of red-brown or purple
  dyes
scope: This is one of a group of dye-making growths of the genus Parmelia, not a moss and not a flowering
  plant; crottal and crottle are other names for this sense.
examples:
- Crotal was once used to dye wool purple.
- She gathered crotal from the rocks.
