simpleMeaning: Ground low down that is under water in some seasons, with more woody growth than a marsh,
  and with water that runs off more freely than from a bog.
scope: Ground low down that is under water in some seasons, with more woody growth than a marsh, and with
  water that runs off more freely than from a bog, also called a swamp.
examples:
- The swampland flooded every spring, and trees stood in the water.
- They built the road on high ground to avoid the swampland.
