simpleMeaning: a flat bread (a tortilla) with meat inside it, cooked in an oven in a tomato sauce with
  chili in it for taste
scope: This is flat bread with meat inside it, cooked in a tomato sauce with chili; it is not a plain
  flat bread on its own and not meat served without the bread.
examples:
- She ordered an enchilada filled with meat and covered in tomato sauce.
- For lunch, he ate an enchilada hot from the oven.
