simpleMeaning: one of the first pair of fang-like parts near the mouth of a spider or its kin, often changed
  for gripping and piercing
scope: One of the first pair of fang-like parts near the mouth of a spider or its kin, not a leg and not
  a stinging tail.
examples:
- The chelicera gripped the fly.
- Spiders use their chelicerae to pierce prey.
