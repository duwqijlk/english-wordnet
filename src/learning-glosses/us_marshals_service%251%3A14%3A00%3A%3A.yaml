simpleMeaning: The oldest federal law-enforcement body, in charge of guarding the federal courts, moving
  federal prisoners, guarding federal witnesses, handling seized goods, and keeping the federal court
  system working well.
scope: Not other federal law-enforcement bodies, nor local court officers; also called Marshals and United
  States Marshals Service.
examples:
- The US Marshals Service guards the courts.
- Prisoners are moved by the US Marshals Service.
