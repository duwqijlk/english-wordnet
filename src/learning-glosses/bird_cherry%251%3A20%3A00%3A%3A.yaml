simpleMeaning: Any of several trees with small fruit that flying creatures visit and feed on.
scope: Any of several small-fruited trees that flying creatures visit and feed on; bird cherry tree is
  another name for this sense, not a tree with large sweet fruit and not a bush.
examples:
- Bird cherry grows along the old lane.
- Birds eat the small fruit of the bird cherry in autumn.
