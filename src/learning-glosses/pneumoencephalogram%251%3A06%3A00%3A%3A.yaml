simpleMeaning: A gas, most often oxygen, is put in place of the fluid round the spine to make a picture
  of the brain clearer.
scope: An encephalogram is another name for this picture of the brain, made by putting a gas in place
  of the fluid round the spine to make the picture clearer.
examples:
- The pneumoencephalogram was made by putting a gas in place of the fluid round the spine.
- A pneumoencephalogram makes the picture of the brain clearer.
