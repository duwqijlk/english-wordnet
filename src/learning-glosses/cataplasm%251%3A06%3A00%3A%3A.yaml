simpleMeaning: to help sore, swollen skin heal, help blood move, and more, a warm soft lump of meal or
  clay is spread on cloth and laid on the skin
scope: 'Also called plaster and poultice: a warm dressing of meal or clay on cloth, not a dry bandage
  and not a cream rubbed on the skin.'
examples:
- The nurse put a cataplasm on his swollen knee.
- A cataplasm of warm clay eased the sore place.
