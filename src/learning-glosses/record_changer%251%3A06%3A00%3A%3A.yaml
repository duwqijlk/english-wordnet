simpleMeaning: A machine part on a player that puts on new discs by itself, with no help from a person
scope: 'Also called a changer or an auto-changer: a part that swaps discs on its own, not the player itself
  and not a person putting discs on by hand.'
examples:
- The record changer on the old player dropped a new disc onto the turntable.
- When the song ended, the record changer put on another disc without anyone touching it.
