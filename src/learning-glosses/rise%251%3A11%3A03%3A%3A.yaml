simpleMeaning: In Christian theology, the first coming of God's Spirit, remembered at the festival of
  Pentecost.
scope: This is a Christian religious event at the festival of Pentecost, not a physical movement upward
  and not an armed uprising.
examples:
- The early church argued fiercely about the rise of the Holy Spirit at Pentecost.
- In his sermon he explained the rise of the Spirit at Pentecost.
