simpleMeaning: like the thin, watery fluid that comes from a wound or sore
scope: Describing a discharge like the thin, watery fluid from a wound or sore; not a thick pus and not
  blood.
examples:
- The doctor noted an ichorous discharge from the wound.
- An ichorous fluid seeped from the sore on his leg.
