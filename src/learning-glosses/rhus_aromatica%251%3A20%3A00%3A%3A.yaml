simpleMeaning: A sweet-smelling sumac of eastern America with leaves in groups of three and yellowish-green
  flowers in spikes that hang like willow flower clusters, followed by red hairy fruits.
scope: Also called fragrant sumac and lemon sumac; a sweet-smelling sumac of eastern America with leaves
  in groups of three, yellowish-green flowers in hanging spikes and red hairy fruits.
examples:
- Rhus aromatica grew along the path, its yellowish-green flowers in spikes.
- The red hairy fruits of Rhus aromatica followed its flowers in summer.
