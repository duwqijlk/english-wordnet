simpleMeaning: A dish of meat or seafood quickly fried with vegetables in ginger, garlic and soy sauce,
  served over rice; it began in America and is common in Chinese restaurants there.
scope: This is the American Chinese dish of meat and vegetables with rice, not a traditional Chinese stir-fry
  or a noodle dish.
examples:
- We ordered chop suey and fried rice from the takeaway on Friday night.
- Her grandmother made chop suey with pork, celery and bean sprouts.
