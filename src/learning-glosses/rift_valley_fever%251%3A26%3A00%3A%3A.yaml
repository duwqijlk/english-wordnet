simpleMeaning: An infection common in Africa, caused by a bunyavirus and spread by mosquitoes or by handling
  infected animals.
scope: An infection of Africa spread by mosquitoes or by handling infected animals, not malaria or yellow
  fever, and not a cold.
examples:
- Rift Valley fever spread among the cattle after the rains.
- Doctors warned travellers about Rift Valley fever.
