simpleMeaning: to bring ideas or feelings together into one clear point, or to make them line up the same
  way
scope: 'Another name for focus, concenter, focalise and focalize: to bring ideas or feelings together
  into one point, not to spread them out and not to look at one thing with the eyes.'
examples:
- She tried to concentre her thoughts on the plan before the meeting.
- He concentred his anger into one clear demand.
