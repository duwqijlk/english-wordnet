senseId: 'squeeze%2:35:01::'
synsetId: 01390440-v
simpleMeaning: press things together so they stay tightly against each other
scope: Pressing things together so they are held tightly against each other, not pinching something between
  the fingers or forcing something into a gap; press, compress, compact, contract and constrict are other
  names for this sense.
examples:
- She squeezed the edges of the pastry together to seal the pie.
- He squeezed the broken parts together while the glue set.
