simpleMeaning: Showing poverty so severe that it resembles the living conditions of someone who has to
  beg.
scope: This describes extreme poverty, not unwillingness to give or a tiny sum of money.
examples:
- They lived in mean rooms with bare walls and no heat.
- His lodging was a bare shed with a dirt floor.
