simpleMeaning: a look on the face that shows contempt or scorn, with the upper lip curling up
scope: 'Also called sneer: a look on the face that shows contempt, not the act of looking slyly at someone.'
examples:
- A leer crossed his face when he heard the news.
- She gave him a cold leer and walked away.
