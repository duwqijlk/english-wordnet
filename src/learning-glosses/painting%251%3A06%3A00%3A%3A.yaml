simpleMeaning: A work of visual art formed by spreading colored material over a surface.
scope: This is the finished artwork itself (another name for it is picture), not the act or job of putting
  color on a surface, and not any image such as a photograph.
examples:
- The painting above the fireplace is a portrait of her grandmother.
- They bought the painting at auction for a record price.
