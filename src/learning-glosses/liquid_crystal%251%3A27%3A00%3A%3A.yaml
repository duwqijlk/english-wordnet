simpleMeaning: a fluid that shows some of the neat ordered patterns of a hard clear solid, which plain
  fluids do not show
scope: A fluid that shows some of the neat ordered patterns of a hard clear solid; not a plain fluid and
  not a hard solid itself.
examples:
- Liquid crystals line the screen of the watch.
- The liquid crystal in the display changes as the heat rises.
