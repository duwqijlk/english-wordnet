simpleMeaning: Something that is not a physical thing, but very strongly limits or holds back a person,
  group or activity
scope: This is a rule, system or set of limits that holds people back, not the jacket-like piece of clothing
  that ties a violent person's arms to the body.
examples:
- Old rules acted as a straitjacket on the school's new ideas.
- High taxes put trade in a straitjacket and stopped it growing.
