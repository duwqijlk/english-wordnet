simpleMeaning: A four-sided cloth for a boat, set front to back and hung from a spar at the top
scope: This is a four-sided cloth for a boat, set front to back and hung from a spar at the top; gaff-headed
  sail is another name for this sense, not a three-sided cloth and not a square cloth.
examples:
- The crew raised the gaffsail as the wind rose.
- A gaffsail hangs from a spar at the top.
