simpleMeaning: A deadly white crystal acid from benzene, dissolving in water, used in making things and
  as a cleaner against germs and as an antiseptic, harmful if taken inside.
scope: This sense is also called hydroxybenzene, oxybenzene, phenol, and phenylic acid.
examples:
- Carbolic acid is used as a disinfectant.
- Carbolic acid is deadly if taken inside the body.
