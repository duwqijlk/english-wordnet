simpleMeaning: to make money from a sale or business deal, or to receive it as pay for work done
scope: This is about money coming in, not about removing dirt and not about giving official permission.
examples:
- After costs, the stall cleared about two hundred pounds on Saturday.
- She clears four thousand a month before tax.
