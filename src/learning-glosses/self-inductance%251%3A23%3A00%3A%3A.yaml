simpleMeaning: How strong a push the changing current makes, set against how fast that current changes,
  is the number this names, given in henries.
scope: This is also called coefficient of self induction, and it is the number that links the push made
  by a changing current to how fast that current changes.
examples:
- They worked out the self-inductance of the coil.
- A coil with high self-inductance gives a strong push when the current changes fast.
