simpleMeaning: support for rule by a king or queen, or for the idea that a king or queen should rule
scope: Support for rule by a king or queen, not rule by the people and not support for a single strong
  leader who is not a king.
examples:
- His royalism made him defend the crown in every debate.
- Royalism was strong in the country long after the king lost power.
