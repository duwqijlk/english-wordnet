simpleMeaning: able to react with other things only a little, or not at all; not active in a chemical
  way
scope: 'Also called neutral: able to react with other things only a little, not a lack of liking or dislike,
  not a refusal to pay heed, and not a thing that does not matter.'
examples:
- The chemist used an indifferent gas in the test.
- The indifferent chemical did not react with the acid.
