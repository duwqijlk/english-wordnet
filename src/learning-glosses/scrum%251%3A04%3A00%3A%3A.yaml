simpleMeaning: In rugby, a way to start play where the front players of each team crouch side by side
  with arms locked, and fight for the ball thrown in between them
scope: 'Also called scrummage: a set way to start play in rugby, with the front players locked together.
  It is not a loose crowd pushing and fighting in other places.'
examples:
- The scrum formed when both packs crouched and locked arms.
- The ball was thrown into the scrum, and both sides pushed for it.
