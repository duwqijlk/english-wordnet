simpleMeaning: These herbs live for two years or for many years, and are one of many kinds with fine flower
  heads, purple or yellow and at times white.
scope: Also called plume thistle, it is one of many kinds of herb that live for two years or for many
  years, with fine purple, yellow, or at times white flower heads.
examples:
- We found a plumed thistle.
- She picked a plumed thistle.
