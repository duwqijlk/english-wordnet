simpleMeaning: A bird of North America that is mostly active at night
scope: 'Also called a bullbat or a nighthawk: a North American bird mostly active at night, not a dragonfly
  and not a bird that hunts by day.'
examples:
- A mosquito hawk swept over the field at dusk.
- We heard the mosquito hawk calling as night fell.
