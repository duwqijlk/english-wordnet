simpleMeaning: In a cool room made for it sits a very big machine that works with numbers and serves 100
  to 400 people
scope: Also called a mainframe, this is a very big machine that serves hundreds of people, not a small
  desk machine and not a room full of small machines.
examples:
- The bank still runs its accounts on a mainframe computer.
- Engineers kept the mainframe computer in a cool room at the back of the building.
