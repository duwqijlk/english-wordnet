simpleMeaning: The nerve cells of the lower brain and the cord down the back swell suddenly in a sickness
  brought by a virus.
scope: This is a sudden virus sickness of the nerve cells in the lower brain and the cord down the back;
  polio, infantile paralysis and poliomyelitis are other names for this sense.
examples:
- Acute anterior poliomyelitis swells the nerve cells of the lower brain and the cord down the back.
- The doctors found acute anterior poliomyelitis in the nerve cells of the cord down her back.
