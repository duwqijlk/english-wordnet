simpleMeaning: about animals in the group called Amphibia (such as frogs and toads), or about their qualities
scope: 'Also called amphibian: about the animal group Amphibia and its qualities, not about a vehicle
  or force that works on both land and water.'
examples:
- Frogs are amphibious animals that start life in water.
- The study looked at amphibious animals such as toads and newts.
