simpleMeaning: The share of all rented rooms or flats that are lived in or let at one time.
scope: The share of rented rooms or flats in use at one time; not the price of a room and not the number
  of rooms in a hotel.
examples:
- The hotel's occupancy rate rose to ninety per cent in summer.
- A high occupancy rate means most rooms are let.
