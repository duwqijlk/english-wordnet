simpleMeaning: One of many small worlds circling the sun in the Kuiper belt, beyond the path of Neptune
  at the far edge of the solar system.
scope: One of many small worlds beyond Neptune, also called Kuiper belt object; its near kin are comets
  and asteroids at the edge of the solar system.
examples:
- A KBO circles the sun beyond Neptune.
- That small world is a KBO, not a planet.
