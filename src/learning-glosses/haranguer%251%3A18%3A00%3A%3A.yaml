simpleMeaning: This person gives a crowd a speech that is loud, strong, or angry
scope: A person who gives a crowd a loud, strong, or angry speech, not a calm lecturer and not someone
  who argues one to one.
examples:
- The haranguer shouted at the crowd for an hour.
- No one listened to the haranguer on the street corner.
