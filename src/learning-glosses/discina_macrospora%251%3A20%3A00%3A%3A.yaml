simpleMeaning: A fungus with a flat or bowl-shaped top, brown on its upper side, on a short stalk, and
  not fit to eat.
scope: A fungus with a flat or bowl-shaped top, brown on its upper side, on a short stalk, and not fit
  to eat, set apart from other fungi by its flat top and its short stalk.
examples:
- Discina macrospora grew on the damp log, its brown top flat as a saucer.
- Do not pick Discina macrospora, since it is not fit to eat.
