simpleMeaning: A pointed opening, usually with a joint in place of a keystone at its highest point.
scope: A pointed opening with a joint in place of a keystone, set beside the round arch of Roman buildings
  and the low arch of other styles.
examples:
- The Gothic arch over the door rose to a sharp point.
- Each Gothic arch in the church had a joint at its top instead of a keystone.
