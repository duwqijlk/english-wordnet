simpleMeaning: to lower yourself by doing something you feel is not good enough for the kind of person
  you are
scope: This means doing something you think is too low for you; it is not about going down to a lower
  place, and not about coming down from the sky.
examples:
- He would not descend to lying to win the game.
- She refused to descend to angry shouting during the talk.
