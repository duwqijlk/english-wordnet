simpleMeaning: a very large treelike cactus of southwestern US deserts, with a thick upright trunk, few
  branches, white flowers and edible red pulpy fruit
scope: This is the giant columnar cactus of the Sonoran Desert; saguaro is another spelling of the same
  plant, not a different cactus.
examples:
- The sahuaro stood alone on the desert slope.
- Ripe sahuaro fruit is sweet and edible.
