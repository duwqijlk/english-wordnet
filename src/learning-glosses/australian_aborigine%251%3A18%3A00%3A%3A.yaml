simpleMeaning: One of the people who lived in Australia when the Europeans arrived.
scope: A member of the people already living in Australia when the Europeans arrived, not one of the Europeans
  who came later.
examples:
- An Australian Aborigine lived in this place before the Europeans arrived.
- She met an Australian Aborigine at the museum.
