senseId: 'remittal%1:04:00::'
synsetId: 00095060-n
simpleMeaning: The freeing of a person from sin by a formal act of pardon, given by a priest in the sacrament
  of penance.
scope: Also called remission, absolution, and remission of sin, this is the freeing of a person from sin
  by a priest's formal pardon.
examples:
- The remittal came from the priest in penance.
- He was granted remittal in the sacrament of penance.
