simpleMeaning: Blood from the skin around the navel ends up in the liver through these small tubes, which
  serve as extra tubes on the way there.
scope: Also called paraumbilical vein, these small tubes carry blood from the skin around the navel toward
  the liver.
examples:
- Blood from the skin near the navel leaves through the vena paraumbilicalis.
- Blood near the navel flows out through the vena paraumbilicalis toward the liver.
