simpleMeaning: a salt or an ester (a chemical made when an acid joins with an alcohol), both made from
  acetic acid
scope: This is a salt or an ester made from acetic acid; it is not the cloth made from thin threads of
  a man-made material.
examples:
- Sodium acetate is used to make the solution warm.
- Ethyl acetate is a common ester used in glues and paints.
