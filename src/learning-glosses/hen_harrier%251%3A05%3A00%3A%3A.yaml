simpleMeaning: A common hunting bird of North America and Europe that makes its nest in wet low land and
  open land.
scope: A common hunting bird of North America and Europe nesting in wet low land and open land; marsh
  hawk and northern harrier are other names for this sense, and this is not a sea bird or a bird that
  nests in trees.
examples:
- A hen harrier hunted low over the marsh at dawn.
- We saw a hen harrier nesting in the open moorland.
