simpleMeaning: Poison and waste the body makes are taken out of the blood, when the kidneys have stopped
  working.
scope: Also called hemodialysis, this cleaning takes poison and waste the body makes out of the blood
  when the kidneys have stopped working.
examples:
- Haemodialysis cleans the blood now that the kidneys have stopped working.
- Without haemodialysis, the poison would stay in the blood.
