simpleMeaning: containing nothing unwanted, or being pure to a high or stated degree.
scope: This describes the purity of a substance, not a sum of money paid as a penalty, not something satisfactory,
  not a precise difference in meaning, not something thin, not an elegant style, and not a smooth texture.
examples:
- The gold in the coin is 22 carats fine.
- The silver bar is stamped 999 fine.
