simpleMeaning: The point of the compass half-way between south and south-east.
scope: 'Also called sou''-sou''-east and south southeast: the compass point midway between south and southeast,
  not the point midway between south and southwest.'
examples:
- The wind came from the SSE all afternoon.
- We sailed SSE for two days.
