simpleMeaning: Cruel and evil in the extreme, fit for hell
scope: Also called infernal, unholy, demonic, diabolical, satanic, fiendish, and diabolic. This sense
  is about real evil and cruelty, not just a very bad or painful time.
examples:
- The prisoners suffered hellish cruelty in the camp.
- He gave a hellish smile as he planned his revenge.
