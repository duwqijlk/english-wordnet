simpleMeaning: a knot tied in the middle of a rope, with two loops for hooks to catch on
scope: A knot in the middle of a rope with two loops, not a knot at the end of a rope and not a loop made
  for tying a boat.
examples:
- He tied a cat's-paw in the middle of the rope before the lift.
- The cat's-paw gave the crew two loops to hook the tackle to.
