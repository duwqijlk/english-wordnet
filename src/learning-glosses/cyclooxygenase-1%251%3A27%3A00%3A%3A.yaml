simpleMeaning: A body chemical that keeps in check certain substances (prostaglandins) that guard the
  wall of the stomach and the kidneys.
scope: This is a body chemical that keeps certain stomach-guarding substances in check, not a drug that
  blocks it or a chemical that starts swelling.
examples:
- Some painkillers block cyclooxygenase-1 and can upset the stomach.
- Cyclooxygenase-1 keeps in check the substances that guard the wall of the stomach and the kidneys.
