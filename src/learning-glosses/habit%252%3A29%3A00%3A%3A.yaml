simpleMeaning: to put on the special clothes worn by people in a religious group
scope: This is the act of putting those special clothes on, not the clothes themselves and not a thing
  you do again and again.
examples:
- The nuns were habited in long black clothes.
- Each new sister was habited in the clothes of the group.
