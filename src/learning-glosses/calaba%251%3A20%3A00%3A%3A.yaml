simpleMeaning: A tree of the West Indies with clusters of sweet-smelling white flowers, giving hard wood
  that lasts and a sticky juice.
scope: A West Indian tree with sweet-smelling white flowers, not a fruit tree or a palm.
examples:
- The calaba by the road is in flower.
- Calaba wood is used for building.
