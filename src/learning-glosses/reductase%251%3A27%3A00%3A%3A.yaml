simpleMeaning: A body chemical (an enzyme) that speeds up a chemical change in which a named stuff takes
  in tiny charged parts.
scope: A body chemical (an enzyme) that speeds up a chemical change in which a named stuff takes in tiny
  charged parts, not a body chemical that joins small stuffs together.
examples:
