simpleMeaning: when a person's face turns pink or red all at once, from shame, guilt, embarrassment, or
  modesty
scope: Also called flush; this is the face turning red on its own, not the pink powder put on the cheeks.
examples:
- A blush spread across her face when the teacher praised her.
- He felt a blush rise to his cheeks with embarrassment.
