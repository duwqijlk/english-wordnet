simpleMeaning: to think about things that happened in the past, especially with pleasure.
scope: This is not simply recalling a fact you need, such as a name or a date; it is spending time thinking
  about past times.
examples:
- On winter evenings she likes to remember her childhood in the countryside.
- He sat by the fire, remembering the summer they first met.
