simpleMeaning: a plant from a group of islands off northwest Africa whose seeds are used as food for birds
  kept in cages
scope: A plant from a group of islands off northwest Africa whose seeds are used as food for birds kept
  in cages; birdseed grass is another name for this sense, not lawn grass and not a grain crop.
examples:
- Canary grass grows in the field behind the house.
- The farmer sowed canary grass for the caged birds' seed.
