simpleMeaning: Make a metal wire or rod thinner by forcing it through a small opening in a hard tool.
scope: 'The metalworking sense: making wire or rod thinner by passing it through a die, not shaping metal
  or glass by rolling or stretching, and not pulling something in general.'
examples:
- The factory draws copper wire through a series of dies until it is thin enough for cables.
- Engineers drew the steel rod down to a fine filament.
