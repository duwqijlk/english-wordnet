simpleMeaning: A colour with some red in it, at the end of the rainbow next to orange, like blood or cherries
  or tomatoes or rubies.
scope: This is a colour with some red in it, also called red, scarlet, crimson, ruby, cherry, or ruddy,
  not a full strong red.
examples:
- The sky was reddish at sunset.
- Her hair was reddish in the light.
