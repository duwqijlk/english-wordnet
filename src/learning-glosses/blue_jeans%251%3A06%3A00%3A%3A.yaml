simpleMeaning: People wear these tight cotton trousers, made of heavy cloth, for hard work or for everyday
  wear, and the name is always plural.
scope: These trousers are also called jeans and denim.
examples:
- They wore blue jeans for hard work.
- The blue jeans were too tight to sit in.
