simpleMeaning: A blue-black berry like blueberries and bilberries of the east United States.
scope: This sense is a blue-black berry like blueberries and bilberries of the east United States, unlike
  the sense for any of the shrubs of the group Gaylussacia, bearing small berries like blueberries, and
  unlike the sense for any of sundry dark-fruited kinds, set apart from blue-fruited blueberries.
examples:
- The huckleberry is a blue-black berry.
- Huckleberries are like blueberries.
