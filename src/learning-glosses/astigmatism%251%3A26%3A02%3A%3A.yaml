simpleMeaning: In eye care, people who are nearsighted often have this weak sight, which usually comes
  from a cornea with an uneven shape.
scope: Weak sight from an uneven cornea, also called astigmia; not the optics fault in which light rays
  fail to meet at one point.
examples:
- The eye test showed she had astigmatism in both eyes.
- His astigmatism came from the uneven shape of his cornea.
