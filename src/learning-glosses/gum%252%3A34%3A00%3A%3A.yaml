simpleMeaning: to break food down in the mouth with no teeth, and with great trouble
scope: 'Also called mumble: to break food down with no teeth, not to cover or fix things with a sticky
  thing and not the sweet thing you chew.'
examples:
- With no teeth left, the old man gummed his soft bread slowly.
- She gummed the cooked apple because she could not chew it well.
