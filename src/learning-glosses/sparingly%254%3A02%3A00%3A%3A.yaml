simpleMeaning: to a very small degree, or in a very small way
scope: This means to a very small degree or in a very small way; slenderly is another name for this sense.
  Not to a large degree.
examples:
- She used the last of the sugar sparingly in her tea.
- He spent his money sparingly while he looked for work.
