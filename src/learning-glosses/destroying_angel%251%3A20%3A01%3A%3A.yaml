simpleMeaning: 'It looks like the safe kind people eat, but its white gills give it away: a deadly fungus,
  usually white, with a cup at its base that stands out'
scope: Death angel, death cap, and death cup are other names for this very poisonous white fungus, which
  people cannot safely eat.
examples:
- Do not pick the destroying angel; it is deadly poison.
- The destroying angel looks like a safe mushroom but its white gills give it away.
