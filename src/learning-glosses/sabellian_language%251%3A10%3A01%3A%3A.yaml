simpleMeaning: A dead tongue of old Italy, of the Osco-Umbrian group, known only from a few short texts
  cut in stone
scope: Osco-Umbrian and Sabellian are other names for this sense, and it is set apart from living tongues
  of Italy by having no living speakers.
examples:
- Sabellian language is a dead tongue of old Italy.
- Only a few short texts in Sabellian language have come down to us.
