simpleMeaning: A funny copy of a person that plays up their ways far past the truth to make people laugh.
scope: A funny copy of a person that plays up their ways to make people laugh, not the idea that art should
  copy life closely, and not a thing that is not real.
examples:
- His imitation of the teacher had the whole class laughing.
- Her imitation of the singer made everyone laugh.
