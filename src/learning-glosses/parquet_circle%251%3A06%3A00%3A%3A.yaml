simpleMeaning: Under the balconies at the back of the main floor are the seats
scope: 'Also called parterre: seats at the back of the main floor, under the balconies, not seats in the
  balconies themselves and not seats at the front of the floor.'
examples:
- We sat in the parquet circle, right at the back of the main floor.
- Tickets for the parquet circle were cheaper than seats in the balconies.
