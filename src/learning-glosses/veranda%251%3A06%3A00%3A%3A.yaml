simpleMeaning: a roofed open area along the outside wall of a building, sometimes partly closed in
scope: This is a roofed open area along the outside wall of a building, sometimes partly closed in; gallery
  and verandah are other names for this sense, and it is not an indoor room or a bare step.
examples:
- They sat on the veranda in the cool evening air.
- The veranda ran along the whole front of the house.
