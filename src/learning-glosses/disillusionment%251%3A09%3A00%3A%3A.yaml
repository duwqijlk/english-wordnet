simpleMeaning: the end of a false belief or of false ideas about how things really are
scope: 'Also called disillusion: this names the freeing itself — losing a false belief — not just a sad
  or bitter feeling about someone or something.'
examples:
- His disillusionment came when he learned that his hero had lied to his followers.
- The disillusionment of voters grew after the government's promises were broken.
