simpleMeaning: Worn by Jews at morning prayer, this shawl in Judaism has a fringe knotted in the set way
  at each corner.
scope: Also called tallith and prayer shawl, this is a shawl worn by Jews at morning prayer, not one worn
  at night.
examples:
- He put on his tallis before morning prayer.
- He wrapped his tallis round his shoulders before morning prayer.
