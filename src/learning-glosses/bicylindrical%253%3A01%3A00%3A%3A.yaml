simpleMeaning: having two round tube-shaped sides, usually with lines through the middle that run side
  by side
scope: A word for a thing with two round tube-shaped sides, usually with lines through the middle that
  run side by side, not one round side and not sides that cross.
examples:
- The bicylindrical lens has two round sides.
- The optician ordered a bicylindrical lens for the new glasses.
