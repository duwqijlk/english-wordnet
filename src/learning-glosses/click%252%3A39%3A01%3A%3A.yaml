simpleMeaning: to make short, sharp sounds again and again, or in a way you cannot stop
scope: 'Another name for this is chatter: this is making sharp sounds again and again or without being
  able to stop, not the short sounds hens make.'
examples:
- His teeth clicked again and again in the cold.
- She was so cold that her teeth would not stop clicking.
