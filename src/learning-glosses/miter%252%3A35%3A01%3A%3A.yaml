simpleMeaning: To join pieces at a slant edge.
scope: This sense is to join pieces at a slant edge, unlike the sense for a church head-dress worn by
  bishops on set days, unlike the sense for to cut edges slantwise, to make a corner join, unlike the
  sense for to give a bishop his tall head-dress, and unlike the sense for the face of a slanted end of
  a piece, where a corner fit is made.
examples:
- They miter boards, joining them at a slant edge.
- They miter frames.
