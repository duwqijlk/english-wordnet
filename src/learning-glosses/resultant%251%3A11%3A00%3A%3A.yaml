senseId: 'resultant%1:11:00::'
synsetId: 07307418-n
simpleMeaning: A thing that comes about because of something else.
scope: Also called a result; what follows from an earlier thing, not a vector that adds two or more vectors.
examples:
- The resultant of the long talks was a signed agreement.
- We waited to hear the resultant of the vote.
