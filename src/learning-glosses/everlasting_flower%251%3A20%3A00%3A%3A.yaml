simpleMeaning: Blooms that can be dried and still keep their shape and colour belong to any of several
  kinds of plant in one family
scope: 'Also called everlasting: any of several kinds of plant whose blooms can be dried and still keep
  their shape and colour, not a fresh cut bloom and not a plant whose blooms fall apart when dried.'
examples:
- The everlasting flowers kept their shape in the vase all winter.
- She dried an everlasting flower and pressed it into her book.
