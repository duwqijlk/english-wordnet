simpleMeaning: Two or more bones of the spine are joined to fix a weak part, usually by an operation but
  at times by a pull or by holding it still.
scope: This way of fixing a weak part of the spine by joining its bones is also called fusion.
examples:
- The spinal fusion joined two of her back bones.
- Her spinal fusion held the weak bones together.
