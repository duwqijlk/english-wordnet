simpleMeaning: a drawing made to scale that shows a building cut across at one level, as seen from above,
  not a drawing of the outside of the building
scope: A drawing of a building cut across at one level, not a drawing of the outside of a building and
  not a drawing of the land it stands on.
examples:
- The floor plan shows where the kitchen and bedrooms are.
- We checked the floor plan before we moved the walls.
