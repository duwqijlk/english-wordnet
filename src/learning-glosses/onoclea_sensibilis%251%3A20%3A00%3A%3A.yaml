synsetId: 13219812-n
simpleMeaning: A spreading fern of eastern North America and eastern Asia, now in western Europe; its
  leaves tend to fold when touched, and leaf parts wrap spore cases in bead-like lobes.
scope: Not other ferns, nor other plants whose leaves fold when touched; also called bead fern and sensitive
  fern.
examples:
- Onoclea sensibilis grows in wet ground.
- The fronds of Onoclea sensibilis fold when touched.
