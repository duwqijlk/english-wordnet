simpleMeaning: Fine lace worked into a pattern makes this stiff collar, held up with wire or starch and
  worn in the 1600s.
scope: Also called rebato, it is a lace collar that belongs to the 1600s, and it is not a collar worn
  today.
examples:
- The rabato stood stiff round the neck.
- Lace worked into a fine pattern made up the rabato.
