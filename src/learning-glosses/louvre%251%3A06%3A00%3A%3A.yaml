simpleMeaning: Air comes in and rain stays out through one flat strip in a row of strips set side by side
  in a door or window
scope: Also called a fin or a louver, this is one slat in a door or window that lets air in and keeps
  rain out, not a solid panel and not a shutter that blocks light.
examples:
- The louvre in the bathroom window lets the steam out.
- Rain stayed outside while air came through the louvre.
