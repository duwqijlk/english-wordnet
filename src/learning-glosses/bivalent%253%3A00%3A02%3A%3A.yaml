simpleMeaning: used of matching chromosomes, the threads in a cell that carry what is passed on, that
  lie in pairs while they join up
scope: 'Also called double: used of matching chromosomes that lie in pairs while they join up, not of
  single chromosomes and not of chromosomes of different kinds.'
examples:
- The two bivalent chromosomes lay side by side in the cell.
- During synapsis, the chromosomes became bivalent.
