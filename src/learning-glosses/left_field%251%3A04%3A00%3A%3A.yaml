simpleMeaning: The place for the baseball player who catches balls hit to the third of the outer ground
  on one side, seen from the plate where batters stand
scope: The spot for the player who covers one side of the outer ground; leftfield is another name for
  this sense, not the middle or the other side of the outer ground.
examples:
- He plays left field for the home team.
- The ball sailed over the left field fence.
