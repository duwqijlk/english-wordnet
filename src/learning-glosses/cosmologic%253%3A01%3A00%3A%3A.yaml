schema: oewn-learning-gloss-v2
senseId: 'cosmologic%3:01:00::'
synsetId: 02714174-a
simpleMeaning: The work of the branch of star study on where the universe began, what has happened to
  it, how it is built and how it moves
scope: This word is used of the branch of star study that treats the start, past, build and motion of
  the universe; cosmogenic, cosmogonic, cosmogonical and cosmological are other names for this sense,
  not of the branch of thought about space, time and cause.
examples:
- The cosmologic science of the time dealt with the birth of the universe.
- A cosmologic redshift shows how fast far-off stars are moving away.
