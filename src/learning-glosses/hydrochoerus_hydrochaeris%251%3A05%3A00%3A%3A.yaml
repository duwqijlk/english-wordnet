simpleMeaning: A South American rodent the size of a pig, with no tail, that lives in and out of water
  and has feet partly joined by skin, the largest rodent alive
scope: A large South American rodent that lives in and out of water; capybara and capibara are other names
  for this sense, not a beaver or a small water rat.
examples:
- A Hydrochoerus hydrochaeris slipped into the river at dusk.
- We watched a Hydrochoerus hydrochaeris grazing by the pond.
