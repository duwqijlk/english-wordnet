simpleMeaning: a sweet-smelling green-all-year shrubby tree of the south-east United States, with small
  hard berries thickly coated in white wax for candles
scope: 'Also called puckerbush: the sweet-smelling evergreen tree of the south-east United States whose
  berries are thickly coated in white wax for candles.'
examples:
- Bay myrtle grows along the south-east coast of the United States.
- They made candles from the white wax on bay myrtle berries.
