simpleMeaning: 'An anxiety condition tied to a serious traumatic event: guilt at living through it, the
  event replayed in dreams, numbness and distance from real life, or returning thoughts and pictures.'
scope: An anxiety condition after a serious event, also called posttraumatic stress disorder; not general
  worry and not low mood after loss.
examples:
- After the crash, he was told he had PTSD.
- Her PTSD made her dream the fire again and again.
