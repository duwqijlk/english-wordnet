simpleMeaning: of high value in morals or in thought, and raised in nature or style above what is common
scope: 'Also called grand, elevated, lofty, idealistic, exalted and sublime: high in goodness or thought
  and raised in style, not thin air at a high place.'
examples:
- She spoke of a rarefied ideal of kindness that few people could live up to.
- His rarefied style of writing lifted a simple story to a high level.
