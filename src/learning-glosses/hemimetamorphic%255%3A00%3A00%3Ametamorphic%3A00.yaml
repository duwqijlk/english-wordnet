simpleMeaning: Of an insect with young that live in water, growing by a change that is not full, in which
  the young looks unlike the grown insect
scope: Of an insect with young that live in water, growing by a change that is not full, also called hemimetabolic,
  hemimetabolous, and hemimetamorphous, and not an insect that grows by a full change with a resting stage.
examples:
- The hemimetamorphic young live in water.
- Hemimetamorphic growth leaves out the resting stage.
