senseId: 'derivative%1:09:00::'
synsetId: 06024079-n
simpleMeaning: In maths, the result you get when you work out how fast one amount is changing at a single
  moment as another amount changes, written df(x)/dx
scope: In maths, this amount is also called differential, derived function, differential coefficient and
  first derivative. It is not a chemical made from another chemical, and not a word made from another
  word.
examples:
- For y = x squared, the derivative is 2x.
- She worked out the derivative to find how fast the speed was changing.
