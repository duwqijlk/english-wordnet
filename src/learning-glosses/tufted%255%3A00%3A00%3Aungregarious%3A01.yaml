simpleMeaning: (of plants) growing in small, tight groups that are close together
scope: 'For plants: growing in small, tight groups close together, not the sense for a bird or animal
  that has a bunch of hair or feathers on its head.'
examples:
- Tufted grass grew in small groups all over the field.
- The garden had tufted flowers growing close together near the path.
