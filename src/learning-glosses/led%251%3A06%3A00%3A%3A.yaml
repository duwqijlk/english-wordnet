simpleMeaning: A part that gives out light when power flows through it; the light grows with the power,
  and its colour comes from the stuff it is made of.
scope: A light-giving part, also called a light-emitting diode; not a lamp bulb, and not a lead for a
  dog.
examples:
- The LED glows red.
- This LED uses little power.
