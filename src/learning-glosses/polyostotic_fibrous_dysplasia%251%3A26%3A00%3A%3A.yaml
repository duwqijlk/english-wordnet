simpleMeaning: a disease in which bone in many bones is changed into thread-like tissue
scope: A bone disease that hits many bones, not a bone disease that hits only one bone.
examples:
- The doctor said the polyostotic fibrous dysplasia was in several of her bones.
- Tests showed polyostotic fibrous dysplasia in his arm, leg, and ribs.
