simpleMeaning: a blister on the skin caused by the herpes simplex virus type 1
scope: A blister on the skin caused by the herpes simplex virus type 1, also called fever blister, herpes
  labialis and oral herpes, and not a sore from a cold or a mouth ulcer.
examples:
- A cold sore appeared on her lip before the wedding.
- He put cream on the cold sore to help it heal.
