simpleMeaning: It can be made into a moving picture when it starts as a story or a book
scope: A story or book that can be turned into a moving picture, not one that can only be read and not
  a story already made into a picture.
examples:
- The novel was so filmable that three studios wanted to buy it.
- The author hoped her filmable short story would one day reach the screen.
