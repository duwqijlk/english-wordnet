simpleMeaning: the back limbs of a small animal that lives near water, eaten as food, tasting like chicken
  and cooked as chicken is cooked
scope: These are the back limbs of frogs eaten as food, tasting like chicken; not the whole frog or a
  chicken leg.
examples:
- Frog legs were served with garlic butter.
- He tried frog legs for the first time in Paris.
