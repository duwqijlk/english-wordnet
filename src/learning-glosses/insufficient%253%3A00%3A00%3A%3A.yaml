senseId: 'insufficient%3:00:00::'
synsetId: 02344427-a
simpleMeaning: Not enough of something to meet a need or fill what is asked for
scope: Too little of something to meet a need, not a thing that is broken and not a plan that has failed.
examples:
- Insufficient funds kept them from buying the house.
- The insufficient rain left the fields dry.
