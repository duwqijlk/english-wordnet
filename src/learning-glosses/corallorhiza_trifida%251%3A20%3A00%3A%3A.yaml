simpleMeaning: A plant with clumps of nearly leafless pale yellow-green stems bearing matching flowers
  with white lower lips; from northern New Mexico north through South Dakota and Washington to Alaska.
scope: Also called early coral root and pale coral root; a plant with clumps of nearly leafless yellow-green
  stems, not a leafy garden flower and not a coral.
examples:
- Corallorhiza trifida grew in the northern woods.
- The pale flowers of Corallorhiza trifida opened in spring.
