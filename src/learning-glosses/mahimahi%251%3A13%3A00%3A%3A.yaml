simpleMeaning: The lean meat of a sea fish found in warm waters, above all around Hawaii
scope: The lean meat of a sea fish found in warm waters, above all around Hawaii, not the live fish and
  not the meat of a cold-water fish; dolphinfish is another name for this sense.
examples:
- She grilled mahimahi with lemon for dinner.
- The mahimahi on the menu was fresh from warm Hawaiian waters.
