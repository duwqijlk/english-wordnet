simpleMeaning: a tube in the body through which a liquid in the body moves around
scope: A tube inside the body through which a liquid in the body moves around; not a thing made to hold
  a liquid outside the body.
examples:
- Blood vessels carry blood around the body.
- The doctor checked a small vessel near the heart.
