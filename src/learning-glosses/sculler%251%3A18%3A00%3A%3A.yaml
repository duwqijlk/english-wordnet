simpleMeaning: a person who moves a boat with one long oar fixed at the back of the boat
scope: A person who moves a boat with a single oar worked at the back; not a person who rows with two
  oars, and not the boat itself.
examples:
- The sculler moved quietly across the lake.
- A lone sculler passed under the bridge at dawn.
