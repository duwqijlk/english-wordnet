simpleMeaning: A thing you blow through to make a loud noise, such as at a party or a game
scope: A thing you blow to make a loud noise at a party or game; not a warning device that makes a loud
  sound, and not a brass musical instrument.
examples:
- At the party, the children blew horns to make noise.
- He blew a horn at the game when his team scored.
