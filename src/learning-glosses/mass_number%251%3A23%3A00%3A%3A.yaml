simpleMeaning: The count got by adding the neutrons and protons in the middle of an atom
scope: The count got by adding the neutrons and protons in the middle of an atom, also called nucleon
  number; not the atomic number, which counts protons alone.
examples:
- The mass number of carbon-12 is twelve.
- To find the mass number, add the neutrons and protons.
