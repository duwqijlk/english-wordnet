simpleMeaning: A bushy shrub of the eastern United States that loses its leaves in winter and carries
  long clusters of pinkish flowers.
scope: This is a bushy shrub of the eastern United States with long clusters of pinkish flowers, not a
  garden bellflower and not a lilac.
examples:
- The sweet bells bloomed along the wood's edge.
- Long pink clusters hung from the sweet bells.
