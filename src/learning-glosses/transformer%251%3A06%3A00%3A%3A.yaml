simpleMeaning: An electric device that takes a flow of power that keeps changing direction, at one strength,
  and turns it into a flow at a different strength
scope: This changes power from one strength to another, not a device that makes power and not one that
  stores it.
examples:
- The transformer cut the high power down to a safe level for the house.
- A broken transformer left the whole street without light.
