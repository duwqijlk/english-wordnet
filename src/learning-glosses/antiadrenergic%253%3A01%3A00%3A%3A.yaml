simpleMeaning: said of something that blocks or lowers the effects in the body of adrenaline, the chemical
  that makes the heart beat faster
scope: Said of something that blocks the effects of adrenaline, not of something that raises them and
  not of a general calming drug.
examples:
- The antiadrenergic drug slowed his racing heart.
- Doctors used an antiadrenergic agent to lower her blood pressure.
