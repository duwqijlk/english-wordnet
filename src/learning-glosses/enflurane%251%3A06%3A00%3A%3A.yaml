simpleMeaning: A liquid that will not catch fire, breathed in to put a person into a deep sleep for an
  operation; its trade name is Ethrane.
scope: A liquid that will not catch fire, breathed in to put a person into a deep sleep for an operation,
  not a liquid put on the skin and not a gas that can catch fire.
examples:
- The doctor gave her enflurane before the operation.
- Enflurane is breathed in to send the patient to sleep.
