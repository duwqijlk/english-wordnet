simpleMeaning: An almond-tasting pastry, leavened with yeast and shaped as a rough half-round, like a
  bear's claw.
scope: This sense is also called bear paw, an almond-tasting pastry, leavened with yeast and shaped as
  a rough half-round, like a bear's claw, unlike the sense for an incised design resembling the claw of
  a bear, used in Native American pottery.
examples:
- Bear claws taste of almond.
- The bear claw was shaped like a claw.
