simpleMeaning: A drug, not made with steroids, that eases pain and lowers fever and swelling, used for
  the pain of stiff, sore joints; also sold as Advil, Motrin, and Nuprin.
scope: Also called isobutylphenyl propionic acid, this is a drug that eases pain and lowers fever and
  swelling.
examples:
- She took ibuprofen for the ache in her knee.
- Daily use of ibuprofen can upset the stomach.
