simpleMeaning: The hall in an Indian prince's palace where he meets people and holds formal gatherings
scope: A hall for formal meetings in an Indian prince's palace, not a throne room and not a private living
  room.
examples:
- The prince received his guests in the durbar of the palace.
- The durbar was filled with people waiting for an audience.
