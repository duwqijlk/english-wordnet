simpleMeaning: in tennis, a return made by hitting the ball before it touches the ground
scope: A tennis return hit before the ball bounces; not a burst of gunfire, and not a shot fired all at
  once.
examples:
- She won the point with a sharp volley at the net.
- His volley caught his opponent off guard.
