simpleMeaning: The set of rules used for buying and selling, grown from the ways traders work rather than
  from learned books about rules
scope: The set of rules used for buying and selling, grown from the ways traders work; law merchant and
  mercantile law are other names for this sense, not the rules for one deal and not the rules of a court.
examples:
- Commercial law covers the sale of goods between firms.
- She studied commercial law at university.
