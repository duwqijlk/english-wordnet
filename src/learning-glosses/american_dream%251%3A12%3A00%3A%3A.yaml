simpleMeaning: The hope of many people in the United States to live better than their parents did
scope: A hope many people in the United States share, to live better than their parents did; not a wish
  for wealth alone, and not a promise that it will happen.
examples:
- For many families, the American Dream means a good job and a home of their own.
- He moved to the city to chase the American Dream.
