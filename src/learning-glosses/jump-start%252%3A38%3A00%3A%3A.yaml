simpleMeaning: To get a car's dead battery going again by linking it to the battery of another car
scope: To get a car's dead battery going again with help from another car's battery, also called jump
  or jumpstart; not charging a battery overnight and not pushing a car to get it going.
examples:
- He asked a neighbour to jump-start his car after the battery died.
- She jump-started the old truck with cables from her own car.
