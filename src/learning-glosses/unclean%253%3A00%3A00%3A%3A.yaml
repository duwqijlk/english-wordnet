simpleMeaning: Not pure under laws about food or religious acts, because of a fault in the body or in
  character
scope: 'Also called impure: having a fault that makes a thing not pure under laws about food or religious
  acts, not simply dirty with dirt or grime.'
examples:
- The book lists this meat as unclean, so they may not eat it.
- They said the animal was unclean under their religious laws.
