simpleMeaning: the group of countries whose money is tied to the British pound
scope: The group of countries whose money is tied to the British pound, not one country on its own and
  not a group tied to another money; also called sterling bloc and scheduled territories.
examples:
- Many countries in the sterling area used money tied to the British pound.
- The sterling area grew as more countries tied their money to the pound.
