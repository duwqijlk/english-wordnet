simpleMeaning: giving comfort or pleasure to someone
scope: This describes a thing that gives comfort or pleasure, like the warmth of a fire; it does not mean
  feeling thankful for help.
examples:
- We sat in the grateful warmth of the fire after the cold walk.
- She rested in the grateful shade of the tree on the hot day.
