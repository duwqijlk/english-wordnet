simpleMeaning: likely to cause great harm, so it makes people feel afraid or worried
scope: Also called serious, dangerous, and grave, this word is for a threat of great harm that makes people
  afraid, not for a strict person and not for a plain style.
examples:
- The doctors warned of a severe storm that could flood the town.
- She faced a severe illness and was afraid of what might happen next.
