simpleMeaning: To rattle on fast about things of no weight.
scope: To rattle on fast about things of no weight; also called chatter, clack, prattle, gibber, gabble,
  blabber, blab, tattle, piffle, prate, twaddle, or maunder; not winning one over by soft words, stroking,
  or flattery, nor loud, muddled talk with nothing in it.
examples:
- They would palaver for hours on end.
- The old man came to palaver by the fire.
