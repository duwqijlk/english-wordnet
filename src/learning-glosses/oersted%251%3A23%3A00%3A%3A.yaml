simpleMeaning: A measure of how strong a magnet's pull is, taken one centimetre from a single pole
scope: A measure of how strong a magnet's pull is at one centimetre from a single pole, not the pull of
  a magnet itself and not a measure of electric power.
examples:
- Engineers gave the field strength in oersteds.
- The oersted is a unit for magnetic field strength.
