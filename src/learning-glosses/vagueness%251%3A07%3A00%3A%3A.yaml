simpleMeaning: the quality of being unclear because something is said badly or its parts do not fit together
  in meaning
scope: Being unclear in words or meaning, not being hard to see with the eyes and not being unsure about
  a fact.
examples:
- The vagueness of his answer made it hard to know what he meant.
- She asked for more detail to clear up the vagueness in the report.
