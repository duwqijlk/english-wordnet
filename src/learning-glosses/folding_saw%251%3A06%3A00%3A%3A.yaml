simpleMeaning: A tool with a toothed blade that closes into its handle, the way a pocketknife closes.
scope: A tool with a toothed blade that closes into its handle, the way a pocketknife closes; not a tool
  with a fixed blade and not a knife.
examples:
- The folding saw closed into its handle for the walk home.
- He cut the branch with a folding saw.
