simpleMeaning: a bomb with only 10 to 20 parts in a hundred explosive, the rest made to burst into many
  fast, small pieces; it works best against soldiers and vehicles
scope: Also called anti-personnel bomb, antipersonnel bomb and daisy cutter, this is a bomb that bursts
  into many small fast pieces, not a bomb whose main force is one big blast.
examples:
- The fragmentation bomb scattered small pieces over the field.
- Troops feared the fragmentation bomb most of all.
