simpleMeaning: Small raised spots on the skin around the sex organs and the tops of the legs mark a disease
  caught through sex and caused by a germ
scope: Also called granuloma inguinale, this is a disease caught through sex that shows as small raised
  spots around the sex organs, not a disease of the skin alone.
examples:
- Granuloma venereum left small raised spots on the skin around her groin.
- The clinic treated her for granuloma venereum, a disease caught through sex.
