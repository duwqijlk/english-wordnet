simpleMeaning: It means to run along every side of something at the same time, so that the thing is completely
  surrounded.
scope: This is about surrounding something on all sides, not about lying next to it on just one side.
examples:
- Fields of wheat border the road on both sides.
- A ring of tall trees borders the meadow.
