simpleMeaning: A Sunday nine Sundays before Easter, three Sundays before the first Sunday of Lent.
scope: Septuagesima Sunday is another name for this sense, a Sunday of the weeks before Lent; not Sexagesima
  or Quinquagesima, the Sundays nearer Lent, and not the first Sunday of Lent.
examples:
- Septuagesima falls three Sundays before Lent.
- We counted back from Easter to find Septuagesima, the ninth Sunday before it.
