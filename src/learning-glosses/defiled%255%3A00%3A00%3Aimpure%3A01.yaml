simpleMeaning: bad in a moral way, and seen as dirty or not pure
scope: 'Also called maculate: dirty or not pure in a moral way, not just dirty in a physical way.'
examples:
- She felt defiled by taking part in the cruel plan.
- His good name was defiled by the scandal.
