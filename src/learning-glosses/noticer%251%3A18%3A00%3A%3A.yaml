simpleMeaning: A person who gives an official message that tells someone about something
scope: A person who gives an official message that tells someone about something; not a person who simply
  takes notice of something.
examples:
- The noticer gave the tenant formal notice of the change.
- The noticer sent an official message to all the workers.
