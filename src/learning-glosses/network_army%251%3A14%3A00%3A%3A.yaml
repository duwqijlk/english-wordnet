simpleMeaning: Joined by the internet, people who think alike form a new kind of group for social, political
  or business ends, able to sway many on a cause they share
scope: A crowd joined online to push a shared cause, not a real army and not a company with a boss.
examples:
- A network army of programmers gives free software to anyone who wants it.
- The network army spread the news faster than any paper could.
