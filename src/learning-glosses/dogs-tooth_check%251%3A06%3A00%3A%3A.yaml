simpleMeaning: cloth with a pattern of small sharp-edged squares that look broken or uneven
scope: Cloth with a pattern of small sharp-edged squares that look broken or uneven, also called dog's-tooth
  check, dogstooth check, hound's-tooth check and houndstooth check, and not plain cloth or cloth with
  large even squares.
examples:
- Her coat was made of a dogs-tooth check in grey and white.
- He wore a jacket in a bold dogs-tooth check.
