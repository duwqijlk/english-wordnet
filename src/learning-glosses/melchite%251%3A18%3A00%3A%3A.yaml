simpleMeaning: An Orthodox Christian, or an eastern Christian joined to Rome, who belongs to the church
  of Alexandria, Antioch or Jerusalem.
scope: 'Also called Melkite: an Orthodox or Rome-joined Christian of the church of Alexandria, Antioch
  or Jerusalem, not the eastern Christian of Egypt or Syria who holds the faith set out at Chalcedon in
  451.'
examples:
- The Melchite bishop served the church of Antioch.
- Melchite Christians belong to the church of Alexandria, Antioch or Jerusalem.
