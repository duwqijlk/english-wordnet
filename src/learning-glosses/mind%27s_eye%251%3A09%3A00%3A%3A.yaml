simpleMeaning: Things that are past or made up can be seen as pictures in the head
scope: Pictures you see in your head of things you remember or make up; not what you see with your real
  eyes and not a dream.
examples:
- In my mind's eye, I could still see the old house by the sea.
- She closed her eyes and pictured the garden in her mind's eye.
