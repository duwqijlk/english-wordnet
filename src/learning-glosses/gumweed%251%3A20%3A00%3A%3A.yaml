simpleMeaning: Once used as medicine, the sticky leaves and stems of many kinds of western American plant
  in the group called Grindelia often poison farm animals.
scope: Also called gum plant, rosinweed and tarweed, this is a sticky plant of the American west once
  used as medicine, and often poisons farm animals.
examples:
- The gumweed growing along the road had sticky leaves that clung to my fingers.
- Ranchers keep their cattle away from gumweed because it can poison them.
