simpleMeaning: Said of a nerve fibre or impulse whose start is outside the brain, on its way in to the
  outer layer.
scope: A nerve fibre or impulse whose start is outside the brain, on its way in to the outer layer, is
  also called corticipetal.
examples:
- Corticoafferent fibres carry messages in from outside.
- Corticoafferent impulses bring news from outside into the brain.
