simpleMeaning: To keep out roaming hackers, facts are at times pulled from stores that are not joined
  up, by climbing out of one store and down into the next.
scope: Getting facts out of stores that are not joined up, not facts pulled from one store alone.
examples:
- Stovepiping means climbing out of one database to climb down into another.
- The team used stovepiping to get facts out of stores that were not joined up.
