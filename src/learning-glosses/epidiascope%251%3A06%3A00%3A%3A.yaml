simpleMeaning: A light machine that shows pictures of things light passes through and of things it cannot
  pass through.
scope: A light machine that shows pictures of things light passes through and of things it cannot pass
  through, not a machine that shows only clear things and not a machine that only makes things bigger.
examples:
- The teacher used an epidiascope to show the class a page.
- An epidiascope can show both a slide and a solid object.
