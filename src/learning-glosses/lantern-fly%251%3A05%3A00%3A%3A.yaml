simpleMeaning: Once thought to give off light, this big tropical insect has bright marks and a long part
  like a snout on its head.
scope: Lantern fly is another name for this big tropical insect, brightly marked, with a long snout-like
  part on its head, once thought to give off light, not a kind that truly glows.
examples:
- A lantern-fly clung to the tree trunk.
- The lantern-fly's bright marks stood out against the bark.
