simpleMeaning: a hairy plant of Europe and Asia that lives for years, with deep yellow daisies on loose
  bending stems, growing wild among open trees and on rocky slopes
scope: A hairy plant of Europe and Asia with deep yellow daisies, not a garden daisy and not a sunflower.
examples:
- Woodland oxeye grew wild on the rocky slope, its deep yellow daisies bright in the sun.
- The woodland oxeye's loose bending stems carried the yellow daisies well above the grass.
