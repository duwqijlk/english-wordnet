simpleMeaning: In psychology, a condition of mind whose qualities stay much the same, even though the
  condition itself may change
scope: In psychology, a condition of mind whose qualities stay much the same while the condition itself
  may change; mental condition is another name for this, not a passing mood and not a fixed trait of character.
examples:
- Stress is a mental state that can change with rest.
- His mental state stayed steady through the week.
