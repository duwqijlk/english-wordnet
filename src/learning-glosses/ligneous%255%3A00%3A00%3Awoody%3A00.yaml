simpleMeaning: The stuff that makes wood hard is in it, or the whole thing is made of wood
scope: A word for what is made of wood or has wood-hardening stuff in it, not what is soft and green.
examples:
- The ligneous stem felt hard under my fingers.
- Ligneous parts of the plant stay stiff through the winter.
