simpleMeaning: With tough or fleshy leaves and sprays of one to many small flowers, these small tufted
  orchids are any of many kinds.
scope: Among orchids, these are the small tufted kinds with tough or fleshy leaves and sprays of one to
  many small flowers.
examples:
- The pleurothallis bore a spray of tiny flowers.
- A pleurothallis had tough leaves and many small flowers.
