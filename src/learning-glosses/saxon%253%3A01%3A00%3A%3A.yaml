simpleMeaning: Of or like the early Germanic people in England and their descendants, above all the English
  or Lowland Scots, and their tongue
scope: An adjective for the early Germanic people in England and their tongue, close to the noun Saxon
  for a member of that people and to the related word Anglo-Saxon.
examples:
- Saxon princes ruled much of England.
- For greater clarity, choose a plain Saxon term instead of a latinate one.
