simpleMeaning: a set area or small picture on the screen of a computer system that you click or press
  to pick a command or do an action
scope: This is the one on a computer screen that you click; not the round piece that holds a shirt shut,
  not a badge, and not a switch on a machine.
examples:
- Click the save button at the top of the screen.
- He clicked the red button on the web page to send the form.
