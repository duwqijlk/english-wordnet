simpleMeaning: a firm piece of wood on which you cut food, cut it into small pieces, or split wood
scope: A firm piece of wood for cutting or splitting things on; not a thin board for cutting bread and
  not a table for eating at.
examples:
- She set the chopping block on the counter and diced the onion on it.
- He split the wood on the chopping block with an axe.
