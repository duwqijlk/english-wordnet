simpleMeaning: The cream does not rise to the top of this white drink, because its fat has been broken
  into tiny bits and spread through it
scope: A white drink whose fat has been broken up and spread through it, not one left so the cream rises
  to the top.
examples:
- I bought a carton of homogenized milk for breakfast.
- Homogenized milk stays smooth because the cream does not rise to the top.
