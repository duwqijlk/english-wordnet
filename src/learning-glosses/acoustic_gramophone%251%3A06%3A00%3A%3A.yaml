senseId: 'acoustic_gramophone%1:06:00::'
synsetId: 03457211-n
simpleMeaning: An old record player in which the sound of the shaking needle is made louder by air, not
  by electric power.
scope: Gramophone is another name for this sense, not an electric record player and not a modern speaker.
examples:
- The acoustic gramophone played the old record without any wires.
- He wound up the acoustic gramophone and the needle sang.
