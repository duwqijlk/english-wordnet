simpleMeaning: An angled channel through the lower belly wall; in males it holds the spermatic cord and
  lets the testes descend; in females it carries the round ligament of the uterus.
scope: The Latin name for the inguinal canal, the same passage through the lower belly wall; not the nearby
  femoral canal.
examples:
- The surgeon traced the canalis inguinalis during the hernia repair.
- In males, the canalis inguinalis carries the spermatic cord.
