simpleMeaning: A decorative panel or framed divider used to divide one area from another.
scope: This is a decorative divider between areas, not a protective covering and not something that hides
  a person or object from view.
examples:
- A folding screen divided the bedroom from the sitting area.
- A carved wooden screen separated the dining room from the kitchen.
