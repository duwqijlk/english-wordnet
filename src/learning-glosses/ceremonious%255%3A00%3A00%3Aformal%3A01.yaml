simpleMeaning: Formal in a stiff way, tied to the usual rules.
scope: Stiffly formal and bound by set rules, also called conventional; not the sense of full pomp and
  grand show.
examples:
- The welcome was ceremonious, with bows and long speeches.
- Her ceremonious manner hid how nervous she was.
