simpleMeaning: A thin-leaved water plant, a kind of spike rush, that people grow in fish tanks to put
  air in the water.
scope: This is a thin-leaved water plant used to put air in fish tanks, not a land plant; also called
  needle rush, needle spike rush, and slender spike rush.
examples:
- The hair grass swayed in the tank.
- We planted hair grass in the aquarium.
