simpleMeaning: any thing made by people that is like a small round piece used to fasten clothes
scope: A thing made by people that only looks like a clothes fastener; it is not the round fastener itself,
  not a switch you press, and not a part of a plant.
examples:
- The box had a lid with a handle shaped like a button.
- The candy was made in the shape of a button, round and flat.
