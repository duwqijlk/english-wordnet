simpleMeaning: A governor in India under the Mogul emperors.
scope: 'Also called a nawab: a ruler in India in Mogul times, not a British governor and not a rich man
  who came home from India.'
examples:
- The nabob ruled the province from his palace.
- Under the nabob, taxes were gathered for the emperor.
