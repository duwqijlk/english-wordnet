simpleMeaning: pay for something with a credit card, or plastic money, putting off payment by recording
  what you bought as money owed
scope: This is buying now and paying later with a card, not noting a sum in an account and not asking
  someone for money.
examples:
- I'll charge the tickets to my credit card.
- She charged the meal instead of paying cash.
