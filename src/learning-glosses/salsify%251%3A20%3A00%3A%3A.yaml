simpleMeaning: A two-year Mediterranean herb that bears purple, strap-shaped petals on long-stemmed flower
  heads, has milky juice and a long edible root, and now grows wild across the United States.
scope: Oyster plant, vegetable oyster and Tragopogon porrifolius are other names for this same whole plant;
  it is not the long edible root sold as a vegetable.
examples:
- Purple flower heads rise on long stems above the edible root of salsify.
- Salsify now grows wild throughout the United States.
