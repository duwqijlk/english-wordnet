simpleMeaning: In basketball, a quick run down the court to take a shot right after your team gets the
  ball
scope: In basketball, a quick run to take a shot right after your team gets the ball, not a slow build-up
  and not a free throw.
examples:
- They scored on a fast break just seconds after the steal.
- The coach called for a fast break every time they won the ball.
