simpleMeaning: A poplar widely grown in the United States, with pale bark and leaves pale underneath.
scope: A poplar widely grown in the United States; abele, aspen poplar, silver-leaved poplar and white
  poplar are other names for this sense, not a pine and not a tree with dark bark.
examples:
- The white aspen has pale bark and leaves that are pale underneath.
- A white aspen grows by the road, tall and pale.
