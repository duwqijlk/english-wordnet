simpleMeaning: From many X-ray readings, a computer builds one clear picture of a single thin slice through
  a thing.
scope: This machine uses X-rays and a computer to build a clear picture of one thin slice through a thing,
  not a picture of the whole thing at once.
examples:
- The tomograph took many X-ray readings of the object.
- The tomograph's picture showed one thin slice through the object.
