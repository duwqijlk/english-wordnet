simpleMeaning: the part of a place of work that takes on staff, trains them, puts them in jobs, and sets
  the rules for how staff are looked after
scope: This is the part of a place of work that takes on staff, trains them, puts them in jobs and sets
  the rules for how staff are looked after; not the staff themselves and not one manager.
examples:
- Personnel will help you fill in the forms.
- She went to personnel to ask about her training.
