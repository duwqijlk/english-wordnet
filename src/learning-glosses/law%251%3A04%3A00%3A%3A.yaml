simpleMeaning: a scholarly profession mastered through graduate study at a school for attorneys, responsible
  for the court system
scope: This is the profession itself, not the body of rules imposed by authority, not a legal document
  setting out rules for an activity, not a rule of conduct inherent in human society, not a scientific
  generalization about recurring facts in nature, not the philosophy behind court decisions, and not the
  police force.
examples:
- She studied law at Yale.
- He left the law to become a journalist.
