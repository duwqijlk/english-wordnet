simpleMeaning: a new horse, especially one that in the past took the place of a horse killed or hurt in
  a fight
scope: This is a new horse to take the place of one killed or hurt in a fight, not the act of getting
  back on a horse.
examples:
- The soldier was given a remount after his horse was killed.
- He rode the remount into camp that evening.
