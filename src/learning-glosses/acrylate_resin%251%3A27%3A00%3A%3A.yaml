simpleMeaning: A clear hard plastic that can be poured into shapes or used in paints and glues.
scope: Acrylic resin and acrylic are other names for this sense, not a soft rubber and not a natural tree
  gum.
examples:
- The acrylate resin was poured into a mould and left to harden.
- Acrylate resin holds the paint fast to the wall.
