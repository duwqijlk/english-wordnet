simpleMeaning: In genetics, when one of a pair of alleles, two forms of one gene, shows itself in the
  body and the other does not
scope: In genetics, when one gene form shows and its pair does not; not power over others.
examples:
- Dominance decides which eye colour the child shows.
- The dominance of one gene hid the other.
