simpleMeaning: A flat piece of metal inside a lock that moves to let it open or shut
scope: The flat metal piece inside a lock, not the stiff bar that turns on a fixed point.
examples:
- The lever inside the lock clicked into place.
- A broken lever stopped the lock from opening.
