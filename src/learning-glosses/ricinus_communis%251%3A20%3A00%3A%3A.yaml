simpleMeaning: A large shrub of tropical Africa and Asia, with large hand-shaped leaves and spiny capsules
  whose seeds give castor oil and ricin; now widely spread through the tropics.
scope: Also called castor-oil plant, castor bean plant, palma christ, and palma christi; a large shrub
  of tropical Africa and Asia, not a palm tree and not a food crop.
examples:
- Ricinus communis grows tall in tropical Africa and Asia.
- The seeds of Ricinus communis yield castor oil and the poison ricin.
