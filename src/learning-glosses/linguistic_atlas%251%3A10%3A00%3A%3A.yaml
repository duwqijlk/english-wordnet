simpleMeaning: Where the special marks of speech differ from place to place is what this book of maps
  shows
scope: 'Also called a dialect atlas: a book of maps showing where speech differs, not a book of maps of
  roads and not a word book.'
examples:
- The linguistic atlas shows how people say the same word in different towns.
- She looked in the linguistic atlas to find where that sound is used.
