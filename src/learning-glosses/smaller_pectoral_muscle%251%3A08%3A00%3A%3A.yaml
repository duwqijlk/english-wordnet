simpleMeaning: A band of flesh joined to bone that pulls the shoulder blade down or lifts the ribs
scope: A band of flesh joined to bone that pulls the shoulder blade down or lifts the ribs, also called
  musculus pectoralis minor or pectoralis minor; not the larger chest band and not a back band.
examples:
- The smaller pectoral muscle helps pull the shoulder blade down.
- When he breathed in deeply, the smaller pectoral muscle lifted his ribs.
