simpleMeaning: In psychiatry, the main way the mind guards you by keeping strong wants or thoughts that
  would make you feel worry out of what you know you are thinking
scope: In psychiatry, this is the mind keeping worrying wants and thoughts hidden from itself, not the
  general act of holding down or controlling something.
examples:
- In therapy, he learned that repression was keeping his painful childhood thoughts out of his mind.
- She learned in class that repression can push worrying ideas out of a person's thinking.
