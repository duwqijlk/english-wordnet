simpleMeaning: A rough cotton cloth with slanted lines from the way it is woven, often used to make uniforms
scope: This is the cloth itself, not a uniform or other clothes made from it.
examples:
- The army shirts were made from chino, a rough cotton cloth.
- She bought strong chino for making work uniforms.
