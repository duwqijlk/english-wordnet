simpleMeaning: a broad label for certain artificial or partly artificial materials that can be molded
  or squeezed into objects, films or threads, or used to make things like coatings and glues.
scope: The material itself, not the informal word for a credit or charge card, nor the adjective meaning
  easily shaped.
examples:
- The chairs are made of plastic.
- The factory shapes plastic into films and threads.
