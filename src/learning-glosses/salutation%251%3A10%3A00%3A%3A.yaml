simpleMeaning: words or acts that show kind, friendly feelings, usually used in the plural, especially
  when people meet
scope: 'Also called greeting: words or acts that show kind, friendly feelings, especially when people
  meet; not words said when people part.'
examples:
- He bowed and offered warm salutations to his guests.
- They exchanged warm salutations when they met at the door.
