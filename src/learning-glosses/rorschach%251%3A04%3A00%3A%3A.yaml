simpleMeaning: A mind test that asks a person to say what they see in ink marks the same on both sides
scope: A mind test that asks a person to say what they see in ink marks the same on both sides, also called
  the inkblot test and the Rorschach test, not a test of eyesight and not a test with right answers.
examples:
- The Rorschach showed her a bat in the ink.
- He took the Rorschach and named what he saw.
