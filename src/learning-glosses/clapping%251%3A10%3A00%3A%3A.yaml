simpleMeaning: a way of showing that you like something by hitting your hands together again and again
scope: 'Also called applause: a way of showing you like something by hitting your hands together again
  and again, not a single sharp hit of the hands made for another reason.'
examples:
- Loud clapping filled the hall when the singer finished.
- The clapping went on for a full minute after the play ended.
