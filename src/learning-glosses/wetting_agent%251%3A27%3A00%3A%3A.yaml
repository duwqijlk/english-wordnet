simpleMeaning: A chemical stuff that can make the liquid it is mixed into spread out more easily by making
  its surface less tight.
scope: A chemical stuff that makes a liquid spread out more easily; wetter, surfactant and surface-active
  agent are other names for this sense, not a soap and not a thickener.
examples:
- The farmer added a wetting agent to the spray so it would spread on the leaves.
- A wetting agent helps the liquid cover the cloth.
