simpleMeaning: a person who stays still while a painter or a maker of figures makes a picture or figure
  of them
scope: A person who stays still so a picture or figure can be made of them, not a person who looks after
  a child and not the artist.
examples:
- The painter paid the sitter to stay still for three hours.
- As a sitter for the artist, she came to the room every morning at the same time.
