simpleMeaning: a bandicoot, a small animal, with leathery ears like a rabbit's
scope: 'Also called rabbit bandicoot and rabbit-eared bandicoot: a bandicoot with leathery rabbit-like
  ears, not a rabbit and not a bandicoot with short ears.'
examples:
- A bilby came out at night, its long ears twitching.
- The bilby's leathery ears looked just like a rabbit's ears.
