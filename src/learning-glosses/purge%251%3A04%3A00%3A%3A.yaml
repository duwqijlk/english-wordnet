simpleMeaning: The act of cleaning a thing out, getting rid of what has settled in it or what is not wanted
scope: The act of cleaning a thing out and getting rid of what is not wanted, not the act of emptying
  the bowels and not removing people from a group.
examples:
- The purge of the old files took a week.
- A purge cleared the pipes of sediment.
