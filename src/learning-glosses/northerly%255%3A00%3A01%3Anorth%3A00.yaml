simpleMeaning: from the north; people use this word most of all about wind
scope: 'Also called northern: this describes something, especially wind, coming from the north; it is
  not the noun for a wind from the north and not the sense about pointing toward the north.'
examples:
- A northerly wind brought cold air down from the hills.
- The northerly winds made the sea rough all day.
