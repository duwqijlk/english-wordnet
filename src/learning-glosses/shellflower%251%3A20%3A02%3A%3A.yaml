simpleMeaning: 'A plant grown for two things at once: long leaves with a glossy shine and curving sprays
  of white flowers, pink-flushed, whose crinkled yellow lip is barred with magenta.'
scope: Another name for the shell ginger plant, grown for glossy long leaves and pink-flushed white flowers;
  not the showy marsh perennial of the same name.
examples:
- A shellflower bloomed for the first time in our greenhouse this summer.
- The shellflower keeps its long glossy leaves all year round.
