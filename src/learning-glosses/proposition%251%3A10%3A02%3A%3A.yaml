simpleMeaning: the act of putting an idea or a plan before people so they can say yes or no
scope: 'Another name for a proposal: the act of putting a plan forward, not the plan itself offered for
  acceptance and not a private bargain.'
examples:
- Her proposition was put to the board for a vote.
- The proposition of a new road split the town in two.
