simpleMeaning: an object that people believe holds magic power, because of old beliefs that are not based
  on facts
scope: Also called fetish and juju. This is a small object people believe holds magic power, not the religion,
  not its followers, and not putting a spell on someone.
examples:
- She kept a small voodoo by her bed for protection.
- The shop sold a voodoo that was said to bring luck.
