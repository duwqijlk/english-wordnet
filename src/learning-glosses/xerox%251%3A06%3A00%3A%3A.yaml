simpleMeaning: A machine that copies papers and pictures by shining light on a plate with an electric
  charge, where the faint image is brought out with resin powder.
scope: Also called xerographic copier and Xerox machine; a machine that copies papers, not a printer and
  not a camera.
examples:
- She copied the letter on the Xerox for her files.
- The office Xerox broke down again.
