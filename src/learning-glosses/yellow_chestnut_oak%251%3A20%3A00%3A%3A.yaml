simpleMeaning: A tree of middle size in the east of the United States that loses its leaves in winter
  and gives strong wood that lasts long
scope: A tree of middle size in the east of the United States whose wood is strong and lasts long; chinkapin
  oak and chinquapin oak are other names for this sense, not a small tree and not a tree of the west.
examples:
- The yellow chestnut oak in the park loses its leaves each winter.
- Builders prized the yellow chestnut oak for its strong, lasting wood.
