simpleMeaning: Yellow flowers in spring mark a plant of Europe that lives more than one year, now growing
  wild in many places, above all in the east of North America
scope: Also called tall buttercup, tall crowfoot, and tall field buttercup, this plant of Europe lives
  more than one year, with yellow flowers in spring, now growing wild in many places, above all in the
  east of North America.
examples:
- Meadow buttercup bloomed in the spring.
- We saw meadow buttercup growing wild in eastern North America.
