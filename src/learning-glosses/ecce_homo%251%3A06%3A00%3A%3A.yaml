simpleMeaning: A picture or statue of Jesus wearing a crown of thorns
scope: A picture or statue of Jesus wearing a crown of thorns, not a picture of Jesus as a child and not
  a picture of a saint.
examples:
- The ecce homo hung above the altar, showing Jesus with a crown of thorns.
- An ecce homo is a picture or statue of Jesus wearing a crown of thorns.
