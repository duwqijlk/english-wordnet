simpleMeaning: A nonmetal element of the halogen group, a heavy yellow gas with a sharp smell, poisonous;
  it cleans water, bleaches things and kills germs, and is found only in salt.
scope: Not another gas such as fluorine; also called Cl and atomic number 17.
examples:
- Chlorine is added to the water in swimming pools.
- The smell of chlorine was strong near the pool.
