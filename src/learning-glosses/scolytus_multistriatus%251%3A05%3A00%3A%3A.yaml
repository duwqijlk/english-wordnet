simpleMeaning: A carrier of the fungus, a tiny plant-like growth, that causes Dutch elm disease.
scope: Also called Dutch-elm beetle, this is a carrier of the fungus that causes Dutch elm disease, not
  the fungus itself.
examples:
- Scolytus multistriatus carries the fungus that causes Dutch elm disease.
- Elm trees die when Scolytus multistriatus brings the fungus to them.
