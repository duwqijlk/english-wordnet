simpleMeaning: the real, printed copy that a news company makes, as a thing you can hold and use
scope: This is one real copy you can hold, also called paper. It is not the news and articles as a publication,
  and not the company that makes it.
examples:
- When it rained, he held a newspaper over his head.
- She put the wet shoes on a newspaper to dry.
