simpleMeaning: The front part of the brain loses its nerve paths in this operation, and thought and personality
  often change a great deal
scope: Also called lobotomy, frontal lobotomy, leucotomy, leukotomy, prefrontal leucotomy, and prefrontal
  leukotomy; an operation on the front of the brain that cuts nerve paths.
examples:
- Prefrontal lobotomy cut the nerve paths in the front of the brain.
- Thinking and behaviour often changed after prefrontal lobotomy.
