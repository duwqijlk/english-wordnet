simpleMeaning: Said of a person who stays with the ways of the past and fights against change in how things
  are run
scope: Said of a person who stays with the ways of the past and fights change, also called oldline; not
  a person open to new ways and not a person who wants only small changes.
examples:
- The old-line senator voted against every reform.
- An old-line voice in the party fought the new plan.
