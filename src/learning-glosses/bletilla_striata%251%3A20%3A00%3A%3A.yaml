simpleMeaning: A Japanese orchid with white-striped leaves and thin upright clusters of rose to magenta
  flowers; often grown by people, and sometimes placed with the Bletia plants.
scope: Also called Bletia striata; a Japanese orchid with white-striped leaves and thin upright clusters
  of rose to magenta flowers, distinct from other orchids with plain leaves or single flowers.
examples:
- Bletilla striata grows in the garden with rose flowers.
- We planted Bletilla striata for its white-striped leaves.
