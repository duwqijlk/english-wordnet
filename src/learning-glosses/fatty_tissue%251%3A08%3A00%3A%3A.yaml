simpleMeaning: Fat stored in the body as a store of energy, which also keeps the body's most important
  parts warm and shields them from knocks.
scope: Fat and adipose tissue are other names for this body stuff.
examples:
- Fatty tissue protected them from the severe cold.
- Fatty tissue stores fat that the body can use for energy.
