simpleMeaning: to forbid a film or a newspaper from being shown or shared with the public
scope: This means stopping a film or newspaper from reaching the public; it is not the maths unit for
  measuring information, and not forcing a person to leave the place where they live.
examples:
- The government banned the film before it could be shown.
- They banned the newspaper for a week.
