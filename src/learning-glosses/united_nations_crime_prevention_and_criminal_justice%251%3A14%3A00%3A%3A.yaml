simpleMeaning: The part of the United Nations that looks after stopping wrongdoing and the law for those
  who do wrong, and making the law better.
scope: A United Nations office for wrongdoing and the law, not the office that works on drugs.
examples:
- The United Nations Crime Prevention and Criminal Justice office met to talk about new laws.
- A report from United Nations Crime Prevention and Criminal Justice called for better laws.
