simpleMeaning: A plant of western North America and northeastern Asia, with flat-lying stems and thick
  clusters of pale violet to lilac flowers.
scope: Also called brooklime and Veronica americana; a plant of western North America and northeastern
  Asia with flat-lying stems and thick flower clusters, unlike tall plants that stand upright.
examples:
- American brooklime spreads along the wet bank with its flat stems.
- We found American brooklime flowering pale violet by the stream.
