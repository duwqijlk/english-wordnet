simpleMeaning: An upright stem with no leaves that grows straight from the ground, as in a tulip.
scope: An upright stem with no leaves that grows straight from the ground, also called a scape; not a
  stem with leaves and not a stem that grows from another stem.
examples:
- The flower stalk of the tulip rose straight from the ground.
- A flower stalk with no leaves held the bloom high.
