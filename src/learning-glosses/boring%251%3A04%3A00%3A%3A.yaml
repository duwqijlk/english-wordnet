simpleMeaning: the act of making a hole in the ground to try to get oil out of it
scope: This is about drilling for oil, not a dull person or thing, and not making a hole for water or
  for a post.
examples:
- The boring went on for weeks before they struck oil.
- They paid for the boring in the hope of finding oil under the field.
