simpleMeaning: A general sleep drug and calmer, not a barbiturate, injected; used chiefly by vets or for
  small operations on old or young patients; large doses cause hallucinations like PCP.
scope: Also called ketamine and ketamine hydrochloride; a sleep drug and calmer, not a barbiturate and
  not a pain drug.
examples:
- The vet gave the dog Ketalar before the operation.
- Ketalar was used for the child's minor surgery.
