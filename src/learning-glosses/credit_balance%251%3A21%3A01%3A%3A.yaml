simpleMeaning: An amount left in an account where money paid in is more than money taken out, so the bank
  owes money to the customer
scope: This is an amount left in an account where money paid in is more than money taken out, so the bank
  owes money to the customer; not an amount owed to the bank, and not an account with nothing left in
  it.
examples:
- Her account showed a credit balance of fifty pounds.
- A credit balance means the bank owes you money.
