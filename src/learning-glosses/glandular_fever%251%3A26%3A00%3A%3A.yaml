simpleMeaning: An acute illness with fever, swollen lymph glands and an excess of certain white blood
  cells; it is not very catching, though some think kissing can pass it on.
scope: An older name for mononucleosis, the fever-and-swollen-glands illness; it is not a disease of the
  glands themselves.
examples:
- He missed three weeks of school with glandular fever.
- Glandular fever left her tired for months afterward.
