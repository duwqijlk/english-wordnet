senseId: 'sensory_epilepsy%1:26:00::'
synsetId: 14113898-n
simpleMeaning: a sudden attack in one part of the brain that starts with strange feelings in the body,
  such as touch or pain
scope: A sudden attack in one part of the brain that starts with strange body feelings; not a fit that
  starts with strange sights or sounds, and not a fit that takes over the whole brain at once.
examples:
- Her sensory epilepsy began with a strange tingling in her hand.
- The doctor said his sensory epilepsy starts with a feeling of pain in his arm.
