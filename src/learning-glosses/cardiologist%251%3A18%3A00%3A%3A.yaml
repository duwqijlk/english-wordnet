simpleMeaning: a doctor who knows a lot about the heart, how it is made, how it works, and what can go
  wrong with it
scope: A doctor for the heart only, not a doctor for all sickness and not a doctor for the brain or bones.
examples:
- The cardiologist checked his heart and told him how to keep it strong.
- After the chest pain, she went to a cardiologist for tests.
