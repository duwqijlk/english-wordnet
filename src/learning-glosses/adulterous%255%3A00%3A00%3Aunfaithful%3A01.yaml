simpleMeaning: Breaking faith with a husband, wife, or lover, by giving love to someone else.
scope: Also called cheating, this is said of a person who breaks faith with a husband, wife, or lover,
  not of a deed or affair marked by adultery.
examples:
- Her husband was adulterous, and the marriage ended.
- They found their partner adulterous and ended the marriage.
