senseId: 'mortgagee%1:18:00::'
synsetId: 10351060-n
simpleMeaning: the person or bank that lends money on land or buildings and holds the loan agreement on
  them
scope: The lender, also called mortgage holder; not the borrower who takes the loan and not a person who
  sells houses.
examples:
- The bank became our mortgagee when it accepted our mortgage on our new home.
- The mortgagee may sell the house if the loan is not paid.
