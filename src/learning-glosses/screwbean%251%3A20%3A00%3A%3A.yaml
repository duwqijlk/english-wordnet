simpleMeaning: Its seed cases are twisted round in a curl; it is a bush or small tree of the southwest
  of the United States and the northwest of Mexico.
scope: People also call it screw bean, screwbean mesquite, or tornillo, and it is the bush or tree itself,
  not the sweet pod it bears.
examples:
- The screwbean bore seed cases twisted round in a curl.
- The screwbean grew in the southwest of the United States.
