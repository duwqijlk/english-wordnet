simpleMeaning: Swelling and soreness of many or all of the nerves away from the brain and spine, as in
  leprosy
scope: 'Also called polyneuritis: swelling and soreness of many or all of the nerves away from the brain
  and spine, not of one nerve only and not of the brain or spine itself.'
examples:
- Multiple neuritis left his hands and feet numb and weak.
- The doctor said the multiple neuritis had spread to nerves all over her body.
