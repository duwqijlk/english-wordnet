simpleMeaning: the checking of soldiers' own letters and messages by members of their own unit
scope: The checking of soldiers' own letters and messages by members of their own unit; not the checking
  of news or books for the public, and not the checking of letters by a higher command far from the unit.
examples:
- Primary censorship meant his letters home were read by people in his own unit.
- Under primary censorship, the soldiers' letters were opened before they left camp.
