simpleMeaning: when the body's defences fight off tissue or an organ put in from another body
scope: 'Also called refuse: the body fighting off tissue or an organ from another body, not standing up
  to a person or thing in general.'
examples:
- The patient's body resisted the new kidney and it had to be removed.
- Her body resisted the donor tissue within days of the operation.
