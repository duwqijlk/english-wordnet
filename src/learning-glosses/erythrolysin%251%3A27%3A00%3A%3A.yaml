senseId: 'erythrolysin%1:27:00::'
synsetId: 14930412-n
simpleMeaning: Any substance that can break open red blood cells and let out the red substance inside
  them that carries oxygen
scope: Any substance that can break open red blood cells; erythrocytolysin, haemolysin and hemolysin are
  other names for this sense, not a substance that builds blood cells and not a substance that merely
  colours the blood.
examples:
- The erythrolysin broke open the red cells in the sample.
- Erythrolysin frees the red stuff that carries oxygen.
