simpleMeaning: Above all in the tough stuff that holds the body's parts together sit long chains of many
  sugar bits, each holding a nitrogen part.
scope: Unlike other sugar chains in the body, these hold a nitrogen part and sit above all in the tough
  stuff that joins body parts together.
examples:
- Mucopolysaccharides occur in the tough stuff that holds the body's parts together.
- Each mucopolysaccharide holds a nitrogen part in its long sugar chain.
