simpleMeaning: a device with parts that move to break roasted beans into fine bits for making a hot drink
scope: This is a device that breaks roasted beans into fine bits for a hot drink, also called a coffee
  grinder; not a coffee maker, which brews the drink, and not a mill for grain.
examples:
- He poured the roasted beans into the coffee mill and turned the crank.
- The coffee mill broke the beans into fine bits in less than a minute.
