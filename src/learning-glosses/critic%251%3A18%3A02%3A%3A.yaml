simpleMeaning: a person who often points out what is wrong and judges people or things in a hard and unfair
  way
scope: A person who often finds fault and judges harshly and unfairly, not a person whose job is to judge
  works of art and not anyone who gives a reasoned judgment.
examples:
- She is a harsh critic who finds fault with everything.
- The critic attacked the young singer without a fair hearing.
