simpleMeaning: to act toward others in a very cruel and violent way
scope: To act very cruelly toward other people; not wasting time, not living only for pleasure, and not
  the sense about sex with no holding back.
examples:
- The soldiers wantoned through the village, burning homes as they went.
- They wantoned cruelly, beating people who had done them no harm.
