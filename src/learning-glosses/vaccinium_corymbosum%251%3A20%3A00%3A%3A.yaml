simpleMeaning: A tall shrub of eastern North America that loses its leaves in winter, bearing edible bluish
  to blackish berries with a clear powdery coat, the source of most farmed blueberries.
scope: Also called high-bush blueberry, swamp blueberry, and tall bilberry; a tall shrub of eastern North
  America bearing edible blue to black berries, not the low-bush blueberry and not the bilberry of Europe.
examples:
- Vaccinium corymbosum grows tall along the edge of the woods.
- We picked the blue berries of Vaccinium corymbosum in August.
