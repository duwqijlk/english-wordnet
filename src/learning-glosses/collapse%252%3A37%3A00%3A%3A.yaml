simpleMeaning: to break down in your mind under great stress and stop being able to deal with life
scope: Also called crack. To break down in your mind under stress; not falling down from tiredness or
  illness, and not a fall in business or prices.
examples:
- After months of too much stress, his mind collapsed and he could not keep working.
- When her husband died, she collapsed and could not deal with daily life for months.
