simpleMeaning: a large bush or tree in the southeast US that drops its leaves in fall, with huge leaves
  in thick false rings and creamy flowers tinged purple at the base
scope: Also called a large-leaved cucumber tree or a large-leaved magnolia; a large tree or bush of the
  southeast US, not a low garden shrub.
examples:
- The great-leaved macrophylla by the river had leaves wider than my hand.
- In spring, the great-leaved macrophylla opens big creamy flowers.
