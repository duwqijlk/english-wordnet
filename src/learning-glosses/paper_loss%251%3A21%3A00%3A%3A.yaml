simpleMeaning: A drop in what a bought thing is worth, found by taking its price now from what was paid
  for it, but not yet real
scope: A fall in value that exists only on paper, not a loss made real by selling, and not the opposite
  gain, a paper profit.
examples:
- She had a paper loss of two thousand dollars when the shares fell.
- His paper loss grew as the market price dropped below what he had paid.
