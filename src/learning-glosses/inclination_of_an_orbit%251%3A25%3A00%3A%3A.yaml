simpleMeaning: In astronomy, the angle between the flat path of a body in space and the flat path of the
  earth around the sun, given in degrees.
scope: The angle between a body's path in space and the earth's path round the sun, not the path itself
  and not how far the body travels; inclination is another name for this sense.
examples:
- The inclination of an orbit is given in degrees.
- They worked out the inclination of an orbit from the new data.
