simpleMeaning: to do something badly and leave it in a mess, ruined or destroyed
scope: 'Also called blow, fumble, spoil, fluff, bumble, bungle, muff, bobble, mishandle and flub: this
  is the verb for ruining a task by doing it badly, not a badly done piece of work as a thing.'
examples:
- He botched the repair and the machine stopped working.
- I botched the cake by putting in far too much salt.
