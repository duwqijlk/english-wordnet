simpleMeaning: What these papers and news shows chase, above all, is wild, shocking stories about the
  private lives of well-known people
scope: Papers and news shows that chase shocking stories, above all about the private lives of well-known
  people, not fair news and not a single paper.
examples:
- The gutter press printed photos of the actor's holiday.
- She refused to talk to the gutter press about her family.
