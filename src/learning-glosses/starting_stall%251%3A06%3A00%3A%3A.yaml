simpleMeaning: a fence at the start of a race that stands in the way and can be moved out of the way
scope: A fence at the start of a race that can be moved out of the way; starting gate is another name
  for this sense; not the heavy piece a runner pushes against, and not the line itself.
examples:
- Each horse stood in its starting stall.
- The starting stall opened and the horses ran out.
