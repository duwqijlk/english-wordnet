senseId: 'just-noticeable_difference%1:09:00::'
synsetId: 05721048-n
simpleMeaning: In psychophysics, a gap between two things sensed that is picked up in half of the tests
  run under strict control and missed in the other half.
scope: Jnd is another name for the gap between two things sensed that shows up in only half of the tests
  run under strict control.
examples:
- The just-noticeable difference in the two lights was hard to spot.
- We kept raising the tone until we reached the just-noticeable difference.
