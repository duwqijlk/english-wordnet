simpleMeaning: likely to give in to what others say, to let others change your mind, and to let others
  lead you
scope: This describes a person who is easy to lead or rule; it is not the act of saying out loud that
  you have lost, and not the act of giving something in.
examples:
- A timid, yielding child, he did what the older boys told him to do.
- She is too yielding, and her friends can always talk her into changing her plans.
