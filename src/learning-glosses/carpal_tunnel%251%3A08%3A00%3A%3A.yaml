simpleMeaning: A way through the wrist that nerves and the hand-bending muscles pass through.
scope: A way through the wrist that nerves and the hand-bending muscles pass through; not a way through
  the ankle, and not a way through the elbow.
examples:
- The carpal tunnel carries nerves through the wrist.
- Pressure in the carpal tunnel can numb the hand.
