simpleMeaning: a bush in the east of the United States that loses its leaves in winter and has groups
  of pale cream flowers
scope: A bush with creamy white flower clusters that grows in the east of the United States, not a tree
  and not a garden flower.
examples:
- The wild hydrangea beside the path was covered in creamy white flower clusters.
- We saw a wild hydrangea growing in the woods of the eastern United States.
