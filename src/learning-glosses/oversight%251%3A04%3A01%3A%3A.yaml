simpleMeaning: looking after and guiding the work of a person or group, and checking how well they do
  it
scope: This is looking after a person or group's work and checking it; it is not a thing missed by mistake
  because someone did not notice it.
examples:
- The project is under the oversight of a small team.
- Good oversight kept the work safe and finished on time.
