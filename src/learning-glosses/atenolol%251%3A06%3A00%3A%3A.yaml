simpleMeaning: A beta blocker (heart-slowing drug) sold as Tenormin, taken by mouth for high blood pressure
  and chest pain; it has side effects including depression and worsening congestive heart failure.
scope: This is one particular beta blocker, a drug that slows the heart, not the whole class of such drugs.
  Tenormin is just its trade name.
examples:
- He takes atenolol every morning to keep his blood pressure down.
- The doctor stopped the atenolol after her heart failure got worse.
