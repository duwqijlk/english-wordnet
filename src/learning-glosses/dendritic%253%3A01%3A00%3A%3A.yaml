simpleMeaning: In neuroscience, having to do with a dendrite, the small branch of a nerve cell that takes
  in messages, or shaped like one
scope: This is about a dendrite, a branch-like part of a nerve cell; not a nerve cell itself and not the
  long part that sends messages out.
examples:
- Dendritic branches spread out from the cell to catch signals from other cells.
- The dendritic fiber carries signals into the cell.
