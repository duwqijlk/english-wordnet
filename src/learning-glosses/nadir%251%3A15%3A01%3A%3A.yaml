simpleMeaning: The point in the sky straight below a person looking up, right across from the highest
  point above, on the great sphere on which the stars seem to sit.
scope: The point in the sky straight below the watcher, opposite the highest point above, not the lowest
  point of bad luck or trouble.
examples:
- The star sank toward the nadir as the night wore on.
- The nadir lies straight below us, opposite the highest point above.
