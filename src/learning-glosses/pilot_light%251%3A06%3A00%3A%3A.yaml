simpleMeaning: A small lamp shows whether the power is on or a machine is running
scope: Also called an indicator lamp or a pilot lamp, this is a small lamp that shows whether power is
  on or a machine is running, not the small gas flame that lights a bigger burner.
examples:
- The pilot light on the washing machine showed that it was still running.
- She checked the pilot light to see whether the power was on.
