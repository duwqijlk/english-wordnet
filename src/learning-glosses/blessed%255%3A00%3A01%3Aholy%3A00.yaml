simpleMeaning: Roman Catholic and named by the Church as holy and fit to be honoured
scope: This is the Roman Catholic Church use for a person named as holy, not the general sense of lucky
  or happy and not the sense of being happy in heaven.
examples:
- Pope Francis declared her blessed in a ceremony at the Vatican.
- He was made blessed by the Church for his holy life.
