simpleMeaning: a percentage of a bill, for example at a hotel or eating place, added in payment for the
  work done for you
scope: A percentage of a bill added in payment for the work done for you; service charge is another name
  for it, not a charge for light and lifts in a block of flats and not a tax.
examples:
- The service fee came to five pounds.
- Is the service fee part of the bill?
