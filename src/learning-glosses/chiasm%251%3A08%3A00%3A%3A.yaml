simpleMeaning: a place where two paths cross like the letter X
scope: 'Also called chiasma and decussation: a place where two paths cross like the letter X, not a road
  crossing and not a crossing of two lines on a page.'
examples:
- The chiasm of the two nerve tracts forms an X shape.
- In the diagram, the chiasm is marked where the two tracts meet.
