simpleMeaning: a person who helps two sides end a quarrel by reaching an agreement
scope: A person who ends disputes by agreement, not one who moves to a new land and not a clerk who works
  out bets.
examples:
- A settler was called in to end the dispute between the workers and the firm.
- The settler brought both sides together until they agreed.
