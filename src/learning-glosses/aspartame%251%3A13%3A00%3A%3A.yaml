simpleMeaning: No calories come with the sweetness this man-made stuff adds; it is made from a chemical
  called aspartic acid.
scope: What sets this sweetener apart is that it is man-made, made from aspartic acid, and adds sweetness
  with no calories.
examples:
- The diet drink was sweetened with aspartame.
- The tea got its sweetness from aspartame, with no calories added.
