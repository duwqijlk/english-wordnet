scope: This is a plant of wet ground with long thin leaves and roots that smell nice; calamus, flagroot,
  myrtle flag and sweet flag are other names for this sense. Not a dry-land plant and not a plant with
  round leaves.
examples:
- Sweet calamus grows along the edge of the pond.
- The gardener dug up sweet calamus for its scented roots.
