simpleMeaning: a substance of this kind is firm, has a fixed shape and volume, and is neither liquid nor
  gas.
scope: This is not the sense meaning dependable or strongly built, and not the sense meaning without breaks
  or gaps; it describes a substance that is firm and keeps a fixed shape and volume rather than flowing.
examples:
- The pond froze solid overnight.
- Butter is solid at room temperature.
