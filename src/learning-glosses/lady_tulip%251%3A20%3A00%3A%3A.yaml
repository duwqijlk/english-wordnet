simpleMeaning: Small blooms marked with spots near the bottom grow on this flower from Europe and Asia
scope: Also called candlestick tulip, this is a flower from Europe and Asia with small spotted blooms,
  not a garden tulip with large plain flowers and not a wild lily.
examples:
- The lady tulip opened its small spotted blooms in April.
- Lady tulips grew along the dry bank.
