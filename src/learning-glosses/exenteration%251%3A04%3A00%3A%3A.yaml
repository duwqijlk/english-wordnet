simpleMeaning: Taking out, by surgery, the organs inside a hollow space of the body, such as the pelvis.
scope: Taking out by surgery the organs inside a hollow space of the body; not the removal of one organ
  alone and not a cut made for looking inside.
examples:
- Exenteration removed all the organs of the pelvis.
- The surgeon performed an exenteration after the disease had spread.
