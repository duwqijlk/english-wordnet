simpleMeaning: A poor kind of fish-liver liquid used in making leather.
scope: This is a poor kind of fish-liver liquid used in making leather; not a fine fish-liver liquid for
  food and not a cooking liquid.
examples:
- The tannery used cod oil when it made the leather.
- Cod oil was one of the things used in the leather works.
