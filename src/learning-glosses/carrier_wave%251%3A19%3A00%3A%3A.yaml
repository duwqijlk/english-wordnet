simpleMeaning: a flow of radio energy that can be changed in a set way so it can send a signal
scope: 'Also called a carrier: a flow of radio energy that can be changed in a set way to send a signal,
  not the signal itself and not a radio set.'
examples:
- The carrier wave carries the music from the station to your radio.
- The engineer changed the carrier wave so it could send the signal.
