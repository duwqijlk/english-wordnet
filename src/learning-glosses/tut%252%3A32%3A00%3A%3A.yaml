simpleMeaning: to make a short clicking sound with the tongue to show that you do not approve
scope: To make a short clicking sound with the tongue to show that you do not approve; tsk is another
  name for this sense, not a sigh and not a word of anger.
examples:
- She tutted at the children's noisy behaviour.
- He tutted loudly when he saw the mess.
