simpleMeaning: the part of a shoe or other footwear that covers the front of the foot
scope: This is the front part of a shoe or boot, not the far end of a golf club head and not the verb
  that means walking with the feet turned in a named way.
examples:
- The toe of her shoe was worn and had a small hole.
- These work boots have a hard toe that keeps the front of your foot safe.
