simpleMeaning: made of two or more substances, parts, or other things joined together
scope: Made of two or more parts or substances joined as one; not the chemical substance a scientist makes,
  not a walled group of houses, and not the act of making something stronger.
examples:
- Soap is a compound substance made from fats and oils.
- A blackberry is a compound fruit made of many small parts joined together.
