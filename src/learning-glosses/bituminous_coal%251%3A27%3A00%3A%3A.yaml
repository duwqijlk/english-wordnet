simpleMeaning: A fuel full of thick sticky stuff, burning well and giving off a smoky yellow flame.
scope: This fuel burns with a smoky yellow flame, and soft coal is another name for this sense.
examples:
- They fed bituminous coal into the fire and watched the smoky yellow flame.
- The seam held bituminous coal rich in thick sticky stuff.
