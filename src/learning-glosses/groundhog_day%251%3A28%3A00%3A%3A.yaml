simpleMeaning: 'The second of February: if the small animal it is named for comes out and sees its shadow,
  six more weeks of winter are to come.'
scope: Also called February 2; the day when, if the small animal it is named for comes out and sees its
  shadow, six more weeks of winter are to come, set beside Candlemas and other February days.
examples:
- On Groundhog Day the small animal comes out to look for its shadow.
- If the groundhog sees its shadow on Groundhog Day, six more weeks of winter are to come.
