simpleMeaning: A member of a people of Europe who once lived in Britain, Spain, and Gaul before the time
  of Rome.
scope: One of the old peoples of Europe who lived in Britain, Spain, and Gaul before Roman times; also
  called Celt.
examples:
- The Kelt spoke a tongue of old Europe.
- Kelts once lived in Britain, Spain, and Gaul.
