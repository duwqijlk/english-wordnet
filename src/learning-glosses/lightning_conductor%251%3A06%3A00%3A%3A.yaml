simpleMeaning: So a sky strike is led away and the building is kept safe, a metal rod is fixed to a high
  point and run down to the earth.
scope: Lightning rod is the other name for a metal rod fixed to a high point and run down to the earth,
  keeping the building safe from a sky strike.
examples:
- The lightning conductor ran from the roof to the ground.
- A lightning conductor led the sky strike down to the earth.
