simpleMeaning: Any of several upright plants of the group Circaea with stems under the ground that live
  for years, with white flowers that open at dawn, in the Northern Hemisphere
scope: Any of several upright Circaea plants with white flowers that open at dawn, found in the Northern
  Hemisphere, not the deadly nightshade plant and not a garden flower that opens at night.
examples:
- Enchanter's nightshade grew along the woodland path.
- White flowers of enchanter's nightshade open at dawn.
