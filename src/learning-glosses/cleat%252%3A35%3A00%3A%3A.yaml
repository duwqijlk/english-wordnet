simpleMeaning: to tie a rope firmly around a fastener, usually one with two parts that stick out, so the
  rope stays in place
scope: This is tying a rope on the fastener itself. It is not the verb for putting such fasteners on something,
  and not the noun senses for the fastener, a shoe part, or a strip that makes a surface stronger.
examples:
- He cleated the rope before leaving the boat.
- Please cleat the line on the dock so it does not slip.
