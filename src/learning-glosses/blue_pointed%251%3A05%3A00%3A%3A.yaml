simpleMeaning: a shark, grey with a hint of sky colour, often found in the southwest Pacific, caught for
  sport and eaten as food
scope: 'Also called bonito shark: a shark of the southwest Pacific caught for sport and eaten as food,
  not a shark of the open Atlantic and not a shark kept only for show.'
examples:
- The blue pointed shark circled the boat off the coast of Australia.
- Fishermen prize the blue pointed as both a sport catch and food.
