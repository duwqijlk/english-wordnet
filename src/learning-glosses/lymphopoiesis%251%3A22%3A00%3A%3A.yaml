simpleMeaning: In the soft matter inside bones and in the small glands, the thymus, and the spleen, white
  cells that fight sickness are made.
scope: It is the making of white cells that fight sickness in the bone marrow, the lymph nodes, the thymus,
  and the spleen.
examples:
- Lymphopoiesis takes place in the bone marrow.
- The thymus is one place where lymphopoiesis goes on.
