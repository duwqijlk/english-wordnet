simpleMeaning: easy to press flat, and soft like a sponge with many small holes, so it can be pressed
scope: 'Also called squishy, spongy, and spongelike: this means soft and easy to press like a sponge,
  not soft and wet like ripe fruit with no stiffness.'
examples:
- The squashy cushion sank down when I sat on it.
- She slept on a soft, squashy pillow.
