simpleMeaning: A charge put by states on firms, based both on what a firm is worth and on the money it
  makes from work done inside the state.
scope: A state charge on firms, based on worth and on money made inside the state; not a charge on people
  and not a charge put by the whole country.
examples:
- The franchise tax took a share of the firm's worth each year.
- Small firms still had to pay the franchise tax to the state.
