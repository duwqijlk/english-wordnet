simpleMeaning: a fly with no wings that lives on the outside of woolly farm animals and cattle and feeds
  off them
scope: A wingless fly that lives on sheep and cattle, also called a sheep ked and a sheep tick; not a
  true tick and not a fly that feeds on people.
examples:
- The farmer found a sheep-tick on one of the ewes.
- A sheep-tick clung to the cow's ear.
