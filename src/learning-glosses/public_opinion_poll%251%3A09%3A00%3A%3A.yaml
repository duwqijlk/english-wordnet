simpleMeaning: A way to find out what people think, by asking questions of a small group of people picked
  by chance
scope: A way to find out what people think by asking a group picked by chance; poll, canvass and opinion
  poll are other names for it. Not a vote, and not a talk with one person.
examples:
- The public opinion poll showed that most voters wanted lower taxes.
- A new public opinion poll asked 1,000 people about the bus service.
