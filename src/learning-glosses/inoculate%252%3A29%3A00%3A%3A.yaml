simpleMeaning: to protect a person or animal against an illness by giving them something that makes the
  body able to fight it
scope: 'Also called vaccinate, immunize and immunise: this is the sense of protecting a person or animal
  against an illness by vaccination. Not putting a bud into a plant so a new plant can grow, and not the
  sense of putting a disease germ into a person or animal so the body learns to fight it.'
examples:
- The nurse inoculated the children against flu before winter came.
- Doctors inoculated many people in the village to stop the illness from spreading.
