simpleMeaning: valuable things found hidden, usually in the earth, when no one knows who they belong to
scope: This means valuable things found hidden, usually in the earth, with no known owner, not wealth
  that a known person owns and keeps.
examples:
- Workers found a trove of gold coins under the field.
- The trove of old jewels was found hidden in the ground.
