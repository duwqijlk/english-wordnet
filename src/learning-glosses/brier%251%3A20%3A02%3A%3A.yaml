simpleMeaning: A very thorny vine from the eastern United States that forms dense tangles, with tough
  round stems, glossy leathery leaves, green flowers and clusters of shiny black inedible berries.
scope: Another name for the eastern US thorny vine also called briar, bullbrier or catbrier; not a single
  thorny twig or just any tangled mass of prickly plants.
examples:
- The brier had climbed over the old fence by the creek.
- She cut back the brier with long gloves and heavy shears.
