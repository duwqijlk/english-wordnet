simpleMeaning: a tree or tall shrub with shiny leaves and clusters of sweet-smelling creamy-white flowers;
  it gives hard heavy reddish timber
scope: 'Also called scrub beefwood: the tree or tall shrub with shiny leaves and clusters of sweet-smelling
  creamy-white flowers that gives hard heavy reddish timber, not the tropical hardwood tree that yields
  balata gum.'
examples:
- Beefwood grows tall with shiny leaves and creamy-white flowers.
- The beefwood timber was hard, heavy, and reddish.
