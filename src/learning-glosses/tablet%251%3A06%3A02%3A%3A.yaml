simpleMeaning: a flat piece of stone or wood, made to have words cut or written on it
scope: A flat piece of stone or wood made for words cut or written on it, not a small flat cake of a substance
  pressed together.
examples:
- The old words were cut into a stone tablet.
- A wooden tablet by the door showed the names of the dead.
