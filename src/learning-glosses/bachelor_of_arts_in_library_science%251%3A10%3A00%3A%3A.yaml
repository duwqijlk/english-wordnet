simpleMeaning: A first degree in the humanities, in the study of libraries.
scope: This first degree joins study in the humanities with study of libraries; it is not a first degree
  in science, and not a higher degree.
examples:
- She took a Bachelor of Arts in Library Science and now works in a public library.
- His Bachelor of Arts in Library Science led him to a job cataloguing books.
