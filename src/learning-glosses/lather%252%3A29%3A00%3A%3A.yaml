simpleMeaning: to spread soap over the whole body or thing, most times to get it clean
scope: To spread soap over the whole of something, most times to clean it, with soap as another name for
  this sense, and not to make bubbles in water or hit someone.
examples:
- She lathered her arms before rinsing them.
- He lathered the dog with soap in the bath.
