senseId: 'general_anaesthesia%1:26:00::'
synsetId: 14050463-n
simpleMeaning: A person given drugs for a big operation has no feeling at all and knows nothing until
  the work is done
scope: A state of being wholly out of feeling during a big operation, also called general anesthesia,
  not light sleep and not a drug that puts only one part of the body to sleep.
examples:
- The doctor gave her general anaesthesia before the operation began.
- Under general anaesthesia, he felt nothing at all.
