simpleMeaning: A way of running a firm, first tried in the early 1990s, that looks hard at how work is
  done and plans it out again
scope: A way of running a firm that plans how work is done all over again, not a small change to one job
  and not a plan to cut pay.
examples:
- The firm used business process reengineering to plan its work again.
- Business process reengineering changed how the whole firm worked.
