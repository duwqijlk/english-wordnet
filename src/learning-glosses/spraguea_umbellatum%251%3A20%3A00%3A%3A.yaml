simpleMeaning: Pink groups of tightly packed flowers on flat stems look like the upturned pads of a cat's
  feet; the low plant grows in cone-bearing forests in western North America.
scope: Not a cushion plant or a rock jasmine, other low pink-flowered plants; also called a pussy's-paw,
  a pussy-paw, pussy-paws, and Calyptridium umbellatum.
examples:
- Spraguea umbellatum spread pink clusters across the forest floor.
- We found Spraguea umbellatum under the pines.
