simpleMeaning: A palm tree of Brazil and Peru with no trunk above the ground, bearing ivory nuts.
scope: Also called ivory-nut palm, ivory palm, and ivory plant; a palm tree of Brazil and Peru, set apart
  from tall palms by its lack of a trunk above the ground and its ivory nuts.
examples:
- Phytelephas macrocarpa spread its leaves flat on the forest floor.
- The ivory nuts of Phytelephas macrocarpa are carved like ivory.
