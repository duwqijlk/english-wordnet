simpleMeaning: Red-brown leaf stalks and long narrow leaves cut into small leaflets mark this common fern,
  which grows on rocks in the cool lands of the north.
scope: 'Also called fragrant woodsia and oblong woodsia: a common fern of the cool north that grows on
  rocks.'
examples:
- The rusty woodsia grew on the rocks, its leaf stalks red-brown.
- Rusty woodsia is a common fern of the cool northern lands.
