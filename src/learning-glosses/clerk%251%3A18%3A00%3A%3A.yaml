simpleMeaning: a person who works in an office and does work such as keeping records or accounts
scope: This is the office worker who keeps records or accounts, not the act of working in that job, especially
  in law work.
examples:
- The clerk kept a record of every payment the office received.
- Please ask the clerk to find the account file for you.
