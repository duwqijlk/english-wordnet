simpleMeaning: An upright bush with bunches of tawny yellow flowers; its dried leaves are used as a medicine
  that clears the bowels; sometimes put in the genus of the same name.
scope: 'Also called tinnevelly senna, true senna, Alexandria senna, Alexandrian senna, Cassia augustifolia,
  Indian senna, or Senna alexandrina: an upright bush with bunches of tawny yellow flowers, whose dried
  leaves are used as a medicine that clears the bowels.'
examples:
- Cassia acutifolia flowered in the dry season.
- Cassia acutifolia leaves were dried for medicine.
