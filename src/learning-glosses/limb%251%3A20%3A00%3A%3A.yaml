simpleMeaning: a large branch that grows out of the trunk of a tree or out of another branch
scope: A large branch growing from the trunk of a tree or from another branch, not an arm or leg and not
  the edge of the sun or moon.
examples:
- The limb of the tree broke in the storm.
- She sat on a low limb of the oak.
