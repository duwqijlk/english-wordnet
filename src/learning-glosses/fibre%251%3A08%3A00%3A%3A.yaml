simpleMeaning: one of several long, thin cells like threads, especially a cell in a muscle or in a nerve
scope: Also called fiber. This is a long thin cell in the body, not a thread used to make cloth, not plant
  food, and not a person's character.
examples:
- The doctor looked at the muscle fibres under a microscope.
- Nerve fibres carry signals through the body.
