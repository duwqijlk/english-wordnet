simpleMeaning: A military unit built around tanks and other fighting vehicles.
scope: This is a fighting force of tanks and other fighting vehicles, and armour is the British spelling
  of the same word. It is not metal worn for protection, and not a plant's or animal's tough outer coat.
examples:
- The army moved its armor across the river at dawn.
- He served in an armor unit stationed near the border.
