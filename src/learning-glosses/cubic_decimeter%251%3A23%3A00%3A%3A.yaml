simpleMeaning: A metric measure of room, once the room of a kilo of pure water in set conditions, now
  1,000 cubic centimeters, about 1.75 pints.
scope: This sense is also called liter, litre, and cubic decimetre, a metric measure of room, once the
  room of a kilo of pure water in set conditions, now 1,000 cubic centimeters, about 1.75 pints.
examples:
- Cubic decimeters measure room.
- The cubic decimeter holds 1,000 cubic centimeters.
