simpleMeaning: The part of the country's government that runs plans to help farmers, with farm study,
  soil care and work to keep farming steady, set up in 1862
scope: This is the part of the country's government that runs plans to help farmers, also called Agriculture,
  Department of Agriculture and USDA, and set up in 1862; not the other parts of the government.
examples:
- The Agriculture Department helps farmers with soil care.
- Farmers asked the Agriculture Department for help to keep farming steady.
