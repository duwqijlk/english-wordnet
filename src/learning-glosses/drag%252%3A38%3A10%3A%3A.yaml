simpleMeaning: using a tool to move things on a screen or pick from a menu, move a slider to change a
  rate up or down, move picture handles to change size
scope: 'This is the computer sense: moving things on a screen with a mouse. It is not clothes worn by
  the opposite sex, and not the force that slows things moving through air or water.'
examples:
- Drag this icon to the corner of the screen.
- Drag the slider to make the sound louder, and drag the handles on the image to make it smaller.
