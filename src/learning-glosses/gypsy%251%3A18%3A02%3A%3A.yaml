simpleMeaning: 'a person whose life is like a Romani''s life: travelling from place to place and not living
  in the usual settled way'
scope: 'Also called gipsy: a person who travels and does not live in the usual settled way, like a Romani.
  This is not a worker who moves only because a job needs it.'
examples:
- She called herself a gypsy because she travelled all year and never stayed in one town.
- The old gypsy lived in a van and moved on whenever he wished.
