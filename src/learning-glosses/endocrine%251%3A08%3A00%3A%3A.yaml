simpleMeaning: A body chemical made by a gland without a tube, carried in the blood to the part of the
  body it acts on.
scope: 'Also called a hormone and an internal secretion: a chemical carried in the blood to the part it
  acts on, not a gland itself and not a chemical made for use outside the body.'
examples:
- The endocrine reached the tissue through her blood.
- The endocrine acts on only one part of the body.
