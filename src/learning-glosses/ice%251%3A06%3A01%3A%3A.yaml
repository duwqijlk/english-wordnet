simpleMeaning: A heat engine in which fuel burns inside, not in a separate fire box; the heat makes a
  gas grow, and the gas moves a piston or a gas wheel.
scope: A heat engine, also called an internal-combustion engine; not frozen water, and not any other engine.
examples:
- The ICE burns fuel inside the engine.
- An ICE drives the car.
