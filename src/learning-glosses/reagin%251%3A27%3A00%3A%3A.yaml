simpleMeaning: 'An allergy antibody of the immunoglobulin E kind, made against things like pollen: it
  fastens onto cells and makes them release the chemical behind allergic swelling.'
scope: The allergy antibody itself, not an allergen such as pollen, and not the chemical it makes cells
  release.
examples:
- The blood test looks for reagin in people with pollen allergies.
- Her allergy specialist explained how reagin attaches to cells.
