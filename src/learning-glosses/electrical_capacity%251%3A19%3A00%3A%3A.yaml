simpleMeaning: how much power a thing can hold inside it, kept there as a charge
scope: 'Also called capacitance and capacity: how much power a thing can hold inside it as a charge, not
  the power itself flowing along a wire and not the size of a box or tank.'
examples:
- The electrical capacity of the plate lets it hold a charge.
- They measured the electrical capacity of the new cell.
