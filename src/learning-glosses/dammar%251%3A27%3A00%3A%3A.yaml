simpleMeaning: Any of a range of hard resins from trees of the Dipterocarpaceae family and of the Agathis
  kind, with the amboyna pine standing out.
scope: This is a hard tree resin from Dipterocarpaceae and Agathis trees, also called damar, dammar resin,
  and gum dammar, not tree sap in general or a soft gum from other trees.
examples:
- The varnish was made with dammar from the amboyna pine.
- Dammar is a hard resin from trees of the Dipterocarpaceae family.
