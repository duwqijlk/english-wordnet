simpleMeaning: A large layered lump of grey matter lying in the white matter of each half of the brain
scope: A large layered lump of grey matter inside each half of the brain; not the whole brain and not
  the outer grey covering.
examples:
- The dentate nucleus lies deep in each half of the brain.
- Each half of the brain has a dentate nucleus in its white matter.
