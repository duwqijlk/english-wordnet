simpleMeaning: In the eye, a small band of flesh that pulls the eye down and in toward the nose
scope: 'Also called inferior rectus or inferior rectus muscle: the eye band that pulls the eye down and
  in, not the one that pulls it out and not the one that pulls it only in.'
examples:
- The rectus inferior pulls the eye down when we look at the floor.
- A weak rectus inferior makes it hard to look down and in toward the nose.
