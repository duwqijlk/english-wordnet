simpleMeaning: a skin problem in which the skin gets thick and its lines stand out
scope: 'Also called chronic eczema and lichtenoid eczema: a skin problem in which the skin gets thick
  and its lines stand out, not a short-lived rash and not a skin problem that leaves the skin thin.'
examples:
- His eczema hypertrophicum left thick, lined patches on his hands.
- The doctor said her eczema hypertrophicum had thickened the skin on her legs and made its lines stand
  out.
