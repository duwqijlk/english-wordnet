senseId: 'condition%1:26:02::'
synsetId: 14569829-n
simpleMeaning: How good a person's or animal's health and physical fitness are, as in being in or out
  of shape.
scope: The level of health and fitness a person or animal is in, seen in phrases such as 'in condition'
  or 'out of shape'; it is not an illness or medical problem, not a general state or situation, not a
  research factor an experimenter varies, and not the verb for putting a smoothing product on something.
examples:
- She worked hard to get back in condition after the injury.
- The old horse was badly out of condition after the winter.
