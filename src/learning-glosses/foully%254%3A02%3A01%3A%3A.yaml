senseId: 'foully%4:02:01::'
synsetId: 00346108-r
simpleMeaning: Said or done to put someone down, in a way that is not fair
scope: 'Another name for this sense is insultingly: in a way that is unfair and full of insult, not in
  an evil way that brings shame.'
examples:
- The writer was foully condemned by his critics.
- She was foully mocked in the press for her views.
