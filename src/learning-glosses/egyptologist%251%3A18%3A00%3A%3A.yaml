simpleMeaning: A person who digs up and studies the old things of Egypt
scope: A person who digs up and studies the old things of Egypt, not the study of those things itself
  and not an archaeologist who works on other lands.
examples:
- The Egyptologist spent years digging at the old tombs near the Nile.
- An Egyptologist can read the old writing on the temple walls.
