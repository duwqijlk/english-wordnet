simpleMeaning: to say in a contract that something must be done, and to make that demand clear
scope: To say in a contract that something must be done, and to make that demand clear; also called condition
  or specify, not to say what a person or thing is like.
examples:
- The will qualified her right to live in the house for the rest of her life.
- The contract qualified the dates on which payments were due.
