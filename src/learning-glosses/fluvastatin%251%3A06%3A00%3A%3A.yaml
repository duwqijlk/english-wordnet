simpleMeaning: the cheapest drug of its kind, sold under the name Lescol, most often taken by mouth at
  bedtime
scope: The cheapest drug of its kind, sold as Lescol and most often taken by mouth at bedtime, not a dearer
  drug of its kind and not a drug taken in the morning.
examples:
- Her doctor switched her to fluvastatin to cut the cost.
- He takes fluvastatin at bedtime.
