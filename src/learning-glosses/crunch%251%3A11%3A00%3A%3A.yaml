senseId: 'crunch%1:11:00::'
synsetId: 07397014-n
simpleMeaning: The cracking sound a thing makes when it is pressed or bitten until it breaks.
scope: The sound of a thing breaking under pressure or teeth, not the act of biting or pressing and not
  a hard time caused by a shortage.
examples:
- He heard the crunch of footsteps on the gravel path.
- The crunch of the dry leaves sounded under our feet.
