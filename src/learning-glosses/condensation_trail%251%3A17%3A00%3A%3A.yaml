simpleMeaning: A cloud made by an aircraft, from water drops forming above the wing as air pressure falls,
  or from water vapor in the engine exhaust.
scope: Also called contrail, this is the cloud made by a plane, not a cloud that forms on its own in the
  sky.
examples:
- A condensation trail formed in the air.
- The condensation trail was a cloud made by the plane.
