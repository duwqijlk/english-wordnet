simpleMeaning: Given through a vein, this sleep-making, numbing dose loosens them up and weakens their
  hold on what they keep back, so it is thought to make them speak freely.
scope: Also called truth drug; a drug given by vein that loosens people up and is thought to make them
  talk freely.
examples:
- The truth serum made him drowsy and talkative.
- They gave him truth serum, and he began to talk freely.
