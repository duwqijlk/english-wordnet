senseId: 'scallop%2:36:00::'
synsetId: 01683001-v
simpleMeaning: to make the edge of something pretty by adding a row of small round curves to it
scope: This sense is adding round curves to an edge to make it pretty, not catching or cooking the sea
  animal with this name, and not cutting a thing into that shape.
examples:
- She scalloped the edge of the cloth with a row of tiny curves.
- The skirt was scalloped around the bottom to make it look pretty.
