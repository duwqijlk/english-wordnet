simpleMeaning: in a loud way that shows strong feelings or strong views
scope: This word says how a person speaks in a loud way with strong feelings; it does not mean in a quiet
  way or in a way that shows only anger.
examples:
- He complained vociferously about the noise from next door.
- The workers vociferously demanded better pay at the meeting.
