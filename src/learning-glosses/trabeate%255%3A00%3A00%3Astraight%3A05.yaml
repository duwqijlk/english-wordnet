simpleMeaning: not curved, with straight flat beams across the top rather than arches
scope: This describes a building with straight flat beams across the top instead of arches; trabeated
  is another name for it, and it is not a building with curved arches.
examples:
- The trabeate temple has straight beams across the top of its columns.
- Builders chose a trabeate design with flat beams rather than arches.
