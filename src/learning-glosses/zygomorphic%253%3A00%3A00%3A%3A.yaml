senseId: 'zygomorphic%3:00:00::'
synsetId: 02383265-a
simpleMeaning: able to be cut into two matching halves by only one flat cut along its length through its
  middle
scope: Able to be cut into two matching halves by only one flat cut, also called bilaterally symmetrical
  and zygomorphous; not a shape that can be cut in many ways and not a shape with no matching halves.
examples:
- A zygomorphic flower can be cut into matching halves only one way.
- The orchid is zygomorphic in shape.
