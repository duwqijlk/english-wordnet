simpleMeaning: to copy the way a person talks or moves, above all to make fun of them
scope: 'Also called mimic: to copy a person to make fun of them, not to act out a scene in silence.'
examples:
- The actor mimed the President very accurately.
- He mimed his teacher's walk and made the class laugh.
