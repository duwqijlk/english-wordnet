simpleMeaning: connected with life outside the armed forces, or done by people who are not serving in
  the armed forces at that time
scope: This describes life away from the armed forces, or work done by people who are not serving in them;
  not life or work as a serving member of the armed forces.
examples:
- After leaving the army, she wore civilian clothes every day.
- He found civilian life quiet after years as a soldier.
