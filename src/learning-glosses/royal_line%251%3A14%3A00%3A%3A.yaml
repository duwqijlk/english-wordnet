simpleMeaning: the kings, queens, princes and princesses of a country, taken as one group
scope: These are the kings, queens, princes and princesses of a country taken as one group; royalty, royal
  family and royal house are other names for this sense, not a single king or queen alone and not a noble
  family without a crown.
examples:
- The royal line continued through her children.
- Historians traced the royal line back five hundred years.
