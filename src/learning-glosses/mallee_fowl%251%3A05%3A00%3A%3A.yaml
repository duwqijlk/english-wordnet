simpleMeaning: Sandy heaps hold the eggs of this bird of Australia, and the heat of the heap hatches them
  on their own
scope: It is also called leipoa and lowan, and it names an Australian bird that hatches its eggs in sandy
  heaps.
examples:
- The mallee fowl laid its eggs in a sandy heap.
- The heat of the heap hatched the mallee fowl's eggs on their own.
