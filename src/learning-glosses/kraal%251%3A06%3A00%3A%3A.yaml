simpleMeaning: An enclosed place in southern Africa where farm animals are kept.
scope: A fenced place for farm animals in southern Africa, not the village of huts for native Africans
  in the same place, usually ringed by a fence of stakes.
examples:
- The cattle spent the night in the kraal.
- They drove the sheep back to the kraal at dusk.
