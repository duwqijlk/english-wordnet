simpleMeaning: a blood vessel of the brain that drains the top curve of each half of the brain into a
  wide hollow near the base of the skull
scope: Also called vena cerebrum superior; a brain blood vessel that drains the top of the brain, not
  one that feeds it.
examples:
- The superior cerebral vein carries blood away from the top of the brain.
- A scan showed the superior cerebral vein draining into the large hollow at the base of the skull.
