simpleMeaning: A small, round beetle with bright colours and spots; it usually eats aphids (small insects
  that live on plants) and other insects that harm plants
scope: 'Also called ladybug, lady beetle, ladybeetle, and ladybird beetle: this small spotted beetle that
  eats insects on plants, not a bird and not any other kind of beetle.'
examples:
- A ladybird landed on the leaf and began eating the aphids.
- We found a red ladybird with black spots on the rose bush.
