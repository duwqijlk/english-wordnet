simpleMeaning: A worker at a bar who mixes and serves drinks with alcohol in them
scope: A worker at a bar who mixes and serves drinks with alcohol in them; bartender, barkeep and barkeeper
  are other names for this worker, not a waiter who only carries drinks to tables.
examples:
- The mixologist shook the drink and poured it into a tall glass.
- A good mixologist knows how to mix a dozen drinks.
