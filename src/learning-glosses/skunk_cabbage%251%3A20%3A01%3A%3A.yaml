simpleMeaning: a low-growing swamp plant of eastern North America that lives for years, drops its leaves,
  has tiny flowers inside a mottled green or purple hood, and smells foul
scope: The eastern North American plant with a mottled green or purple hood; not the western skunk cabbage,
  which has a yellow one.
examples:
- Skunk cabbage pushes up through the snow in early spring.
- We found skunk cabbage growing in the wet ground by the creek.
