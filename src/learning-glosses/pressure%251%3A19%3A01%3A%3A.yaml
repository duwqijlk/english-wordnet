simpleMeaning: the weight of the air around the earth as it bears down on every surface
scope: This is the weight of the air itself, not the felt sensation on the skin and not the force of one
  object on another.
examples:
- At high altitude, the pressure is lower, so it is harder to breathe.
- The weather report showed the pressure falling before the storm.
