simpleMeaning: a painful sore with a hard centre filled with pus (thick yellow-white liquid that forms
  in sick body parts)
scope: This noun is a sore on the skin. It is not cooking food in hot liquid, and not the temperature
  where a liquid turns to gas.
examples:
- He had a painful boil on his neck.
- The doctor looked at the boil on her back.
