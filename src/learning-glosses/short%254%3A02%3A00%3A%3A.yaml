simpleMeaning: In a brief, sudden and rude way that shows impatience or a lack of respect.
scope: This is not about how long something lasts or how tall it is; it describes the rude, clipped way
  someone speaks.
examples:
- He was short with the waiter and left without tipping.
- She was short with me when I asked why the report was late.
