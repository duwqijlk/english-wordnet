simpleMeaning: a time when a disease that can spread is passed from one person or thing to another
scope: 'Also called transmission: one time when a disease is passed to a new person, not the state of
  illness in the body and not a change in a speech sound.'
examples:
- The doctor traced the infection to one meeting where a sick person coughed near others.
- Each new infection was counted after a traveller brought the disease back home.
