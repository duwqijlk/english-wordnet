simpleMeaning: An upright, bushy, hairy one-year plant with three-part leaves and purple or pink flowers;
  widely grown for food, feed and better soil, mainly for its oil-rich seeds; from Asia.
scope: This sense names the growing plant, not the edible beans it yields or the sauce made from them.
examples:
- The soja plant is native to Asia and is now grown in many parts of the world.
- Farmers plant soja to improve the soil and harvest its oil-rich seeds.
