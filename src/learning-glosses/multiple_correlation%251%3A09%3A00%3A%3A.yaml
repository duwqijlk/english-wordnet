simpleMeaning: In statistics, a way of working out the value of one thing from the values of two or more
  other things.
scope: In statistics, a way of working out one value from two or more others; multiple regression is another
  name for it, not a way of working out one value from one other only, and not a single number that sums
  up the link.
examples:
- The study used multiple correlation to predict test scores.
- Multiple correlation helped them guess sales from price and ads.
