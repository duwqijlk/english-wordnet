simpleMeaning: In Judaism, an eight-day holy time that marks the Temple in Jerusalem being made holy again
  in 165 BC.
scope: In Judaism, an eight-day holy time, not a fast day or a day of mourning; also called Channukkah,
  Chanukah, Chanukkah, Feast of Dedication, Feast of Lights, Feast of the Dedication, Festival of Lights,
  Hannukah, Hanukah and Hanukkah.
examples:
- We lit the candles for Channukah each night for eight days.
- Channukah marks the Temple being made holy again long ago.
