synsetId: 05313113-n
simpleMeaning: any body part that helps a person make sounds for talking
scope: It is a body part used in making sounds for talking, also called speech organ; not a part used
  only for eating and not the voice itself.
examples:
- The tongue is an organ of speech used to shape sounds.
- Lips and teeth are organs of speech as well as tools for eating.
