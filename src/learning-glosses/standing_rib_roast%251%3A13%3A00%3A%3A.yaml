simpleMeaning: a cut of beef or deer meat with more than one chest bone and the meat on the outside of
  them
scope: A cut of beef or deer meat with more than one chest bone and the meat on the outside of them; rib
  roast is another name for this sense, not a cut with one chest bone and not a cut from the leg.
examples:
- The standing rib roast fed twelve guests.
- He ordered a standing rib roast for Sunday lunch.
