senseId: 'box%1:26:00::'
synsetId: 14432355-n
simpleMeaning: a difficult situation with no clever or dignified way out
scope: Not a marked area on a sports field; this sense names a trap-like difficulty with no graceful exit.
examples:
- By promising the same slot to two speakers, the organizer had put himself in a box.
- Caught between her boss and her team, she was in a box with no polite exit.
