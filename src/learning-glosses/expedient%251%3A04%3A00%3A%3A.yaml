simpleMeaning: a way or thing used to get what you want, not necessarily in a right or fair way
scope: A way or thing used to get what you want, even if it is not fair; it is not a lasting plan and
  not a right rule to follow.
examples:
- He used a lie as an expedient to avoid trouble.
- Borrowing money was a quick expedient, but it was not fair to his friend.
