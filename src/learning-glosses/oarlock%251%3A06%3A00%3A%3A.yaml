simpleMeaning: a holder fixed to the top edge of a boat's side; it keeps an oar in place and is the point
  the oar turns on when you row
scope: 'Also called pin, peg, rowlock, thole, and tholepin: the holder for an oar on a boat, not the oar
  itself and not a lock for a door.'
examples:
- The oar slipped out of the oarlock as he rowed across the lake.
- She fixed the broken oarlock before pushing the boat out.
