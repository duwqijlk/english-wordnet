simpleMeaning: Rotenone, a substance that kills insects, comes from this low bush of eastern North America
  that lives year after year, with soft hairy leaves and pale yellow and pink blooms.
scope: Also called catgut and goat's rue, this is the low bush of eastern North America with soft hairy
  leaves and pale yellow and pink blooms, the source of rotenone.
examples:
- In eastern North America, the wild sweet pea blooms pale yellow and pink.
- The wild sweet pea leaves feel soft and hairy to the touch.
