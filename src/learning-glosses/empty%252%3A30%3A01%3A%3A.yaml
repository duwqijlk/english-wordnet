simpleMeaning: To remove everything from a container or place so that nothing remains inside.
scope: This is what a person does to a container or place, not what happens to it by itself, and not walking
  out of it.
examples:
- She emptied the drawers before the movers arrived.
- Please empty your pockets into this tray.
