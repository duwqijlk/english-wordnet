simpleMeaning: To start doing something regularly until it becomes a habit, or to begin to give serious
  effort to an activity or job.
scope: This is not assuming an official position, not consuming food or drink, and not being suddenly
  struck by an illness.
examples:
- He took up running at the age of fifty.
- She took to gardening after she retired.
