simpleMeaning: a hand tool with a turning rod and a handle set off to one side
scope: A turning hand tool, not the drug, not a boat that tips easily, and not the acts of turning, bending,
  fastening, or starting with it; also called a starter.
examples:
- He turned the crank to start the old engine.
- She gave the crank a few turns until the mill began to move.
