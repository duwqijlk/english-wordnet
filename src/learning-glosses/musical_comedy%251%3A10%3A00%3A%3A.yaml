simpleMeaning: This play or film has songs and dancing that break into the story and the talking
scope: 'Also called a musical or a musical theater: a play or film in which songs and dancing break into
  the story and the talking, not a play or film with no songs in it at all and not a show of songs with
  no story.'
examples:
- We saw a musical comedy in which the actors burst into song in the middle of a scene.
- The new musical comedy on screen mixes dancing with the talking between the leads.
