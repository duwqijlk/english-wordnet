simpleMeaning: in people who drink far too much, the nose often swells, its pores widen, its skin reddens,
  and its blood vessels show through the skin
scope: Also called a brandy nose, a copper nose, a hammer nose, hypertrophic rosacea, a potato nose, rhinophyma,
  a rum nose, and a toper's nose; a swollen nose, not a broken nose.
examples:
- His rum-blossom grew redder over the years.
- The doctor pointed to the rum-blossom and asked about his drinking.
