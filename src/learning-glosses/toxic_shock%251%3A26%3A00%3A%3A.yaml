senseId: 'toxic_shock%1:26:00::'
synsetId: 14493728-n
simpleMeaning: a severe condition caused by a sudden staphylococcus infection, with fever, loose stools,
  nausea, reddened skin and dangerously low blood pressure, mostly in women using highly absorbent tampons
  while menstruating
scope: The illness also called toxic shock syndrome; not a separate disease, and not ordinary infection
  or shock after an injury.
examples:
- Toxic shock can develop fast in anyone who leaves a tampon in too long.
- She was treated in hospital for toxic shock after her blood pressure fell sharply.
