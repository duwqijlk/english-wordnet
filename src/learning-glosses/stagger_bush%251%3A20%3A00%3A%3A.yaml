simpleMeaning: Hanging pinkish-white flowers grow on a shrub of the low coastal land of the eastern United
  States that loses its leaves in winter, and it poisons farm animals.
scope: Staggerbush is another name for this shrub of the eastern coastal plain with hanging pinkish-white
  flowers.
examples:
- Stagger bush grew along the coast.
- The farmer kept his cattle from the stagger bush.
