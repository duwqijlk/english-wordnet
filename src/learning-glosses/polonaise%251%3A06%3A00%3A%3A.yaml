scope: A woman's dress with a tight top and an outer skirt drawn back over a many-coloured skirt below,
  not a dress with one plain skirt.
examples:
- Her polonaise had a tight top and an outer skirt pulled back over a many-coloured skirt.
- She wore a polonaise, its outer skirt pulled back to show the many-coloured skirt beneath.
