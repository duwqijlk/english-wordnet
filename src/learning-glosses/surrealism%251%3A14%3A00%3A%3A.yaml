simpleMeaning: a 1900s movement in art and writing, grown from Dada (an earlier movement), using strange
  dream-like pictures and things that do not fit together to show hidden thoughts and dreams
scope: This is a whole movement in art and writing from the 1900s, not one single picture or book and
  not art that tries to show real life as it is.
examples:
- Writers who followed surrealism put odd images together to show hidden thoughts.
- Surrealism gave painters a way to show dreams on canvas.
