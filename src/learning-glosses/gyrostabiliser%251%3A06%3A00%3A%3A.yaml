simpleMeaning: Rolling from side to side is cut down on a ship or plane by a heavy spinning wheel on a
  straight up-and-down rod.
scope: People also call this device gyrostabilizer, and it cuts down the side-to-side roll of a ship or
  plane.
examples:
- A gyrostabiliser steadied the ship.
- The plane's gyrostabiliser cut down its roll.
