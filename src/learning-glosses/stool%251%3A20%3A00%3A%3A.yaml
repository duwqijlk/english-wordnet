simpleMeaning: In forestry, the short part of a tree that is left after the tree is cut down or cut back,
  kept so new young trees can grow from it
scope: In forestry, the part of a tree left in the ground after cutting, not a toilet and not solid waste
  passed from the body.
examples:
- New shoots grew from the old stool in the wood.
- The workers cut the tree and left a stool for new growth.
