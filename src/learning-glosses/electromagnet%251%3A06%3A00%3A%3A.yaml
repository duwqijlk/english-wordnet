simpleMeaning: While power runs through wire wound round a bar of iron, the bar pulls iron; once the power
  stops, the pull ends
scope: This magnet pulls iron only while power runs through the coil wound round its iron core.
examples:
- The electromagnet in the crane lifts scrap iron only while the power is on.
- When the teacher switched off the electromagnet, the nails fell from it.
