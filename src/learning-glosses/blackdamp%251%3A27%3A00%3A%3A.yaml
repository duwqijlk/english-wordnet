simpleMeaning: The air in a mine after a blast, full of carbon dioxide, a gas that cannot keep living
  things alive.
scope: The air in a mine after a blast, full of a gas that cannot keep living things alive; chokedamp
  is another name for this sense, not fresh air and not smoke from a fire.
examples:
- The miners feared blackdamp after the blast.
- Blackdamp filled the tunnel after the explosion.
