simpleMeaning: A shellfish from the sea whose thin shell is long and narrow and bends like a curve.
scope: A sea shellfish with a long narrow curved thin shell; knife-handle and razor clam are other names
  for this sense, not a round shellfish and not a mussel.
examples:
- The jackknife clam lay buried in the wet sand.
- We found a jackknife clam with a long curved shell.
