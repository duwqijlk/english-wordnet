senseId: 'exempt%3:00:00::'
synsetId: 02373965-a
simpleMeaning: for a person, free from a duty or a need to pay, such as a tax, that applies to other people
  or things
scope: This describes a person who does not have to do or pay something; it is not the act of letting
  someone go free from a rule.
examples:
- Students are exempt from the fee this year.
- He is exempt from jury duty because of his age.
