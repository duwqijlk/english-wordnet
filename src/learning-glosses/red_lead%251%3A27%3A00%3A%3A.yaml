simpleMeaning: Paints, glass, and baked clay ware take their colour from this rose-tinted oxide, Pb3O4.
scope: Also called minium, this names the rose-tinted oxide, Pb3O4, that colours paints and goes into
  glass and baked clay ware.
examples:
- The paint was coloured with red lead.
- Glass made with red lead has a rose tint.
