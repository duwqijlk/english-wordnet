simpleMeaning: The group of people who move into a place from elsewhere over a set span of time.
scope: The group of people who move into a place over a set span of time, not the act of moving in itself.
examples:
- Immigration from the north doubled during those ten years.
- The immigration of those years brought new skills to the town.
