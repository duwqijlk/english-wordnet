simpleMeaning: Tiny blood passages lined with thin cells, found in the tissue of an organ
scope: Tiny blood passages lined with thin cells inside an organ, not a large blood vessel and not a hollow
  space in a bone.
examples:
- Blood moved slowly through the sinusoid in the liver tissue.
- The sinusoid carried blood past the cells of the organ.
