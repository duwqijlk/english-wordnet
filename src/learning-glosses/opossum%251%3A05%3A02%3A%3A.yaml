simpleMeaning: a small furry animal from Australia that lives in trees, carries its young in a pouch,
  and has a long tail that can usually hold on to things
scope: 'Also called possum and phalanger: this small Australian tree animal, not the opossum of North
  and South America, which has a bare tail and is active at night.'
examples:
- In Australia, the opossum slept in a tree, holding a branch with its long tail.
- In an Australian forest, a small opossum carried its young in its pouch as it climbed.
