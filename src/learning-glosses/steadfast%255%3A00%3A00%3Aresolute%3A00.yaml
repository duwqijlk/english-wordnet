simpleMeaning: strong in purpose and not changing one's mind or giving way
scope: Firm in purpose and not shaken, with firm, steady, stiff and unwavering as other names for this
  sense, and not merely hard or stubborn in a bad way.
examples:
- Her steadfast resolve carried her through.
- He stayed steadfast in his beliefs.
