simpleMeaning: a number that marks the light-wave pattern of each kind of atom
scope: 'Also called rydberg constant and rydberg unit: a number that marks the light-wave pattern of each
  kind of atom, not a number that measures how long a wave is and not a number that counts waves per second.'
examples:
- The scientist used the rydberg to work out the light pattern of hydrogen.
- Each element has its own rydberg in the table of light patterns.
