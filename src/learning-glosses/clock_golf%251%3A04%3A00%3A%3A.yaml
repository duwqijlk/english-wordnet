simpleMeaning: a game in which you hit a ball a short way along the ground toward the hole, from points
  set round a ring around the hole
scope: A game in which you hit a ball a short way along the ground from points set round a ring around
  the hole; not miniature golf with its fixed course and not a full game of golf.
examples:
- They played clock golf on the lawn after lunch.
- In clock golf each player putts from a different point on the circle.
