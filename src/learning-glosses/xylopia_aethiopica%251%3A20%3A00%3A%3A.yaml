simpleMeaning: A tropical west African tree, green all year, bearing sharp-smelling seeds used to flavour
  food and in folk cures
scope: Also called negro pepper and Guinea pepper; this names the whole tree, not only its seeds.
examples:
- Xylopia aethiopica seeds flavour the stew.
- Folk healers use Xylopia aethiopica seeds as a cure.
