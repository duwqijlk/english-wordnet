simpleMeaning: an animal of the weasel family that lives in the north of Europe and Asia and feeds its
  babies with its own milk
scope: An animal of the weasel family from the north of Europe and Asia, also called a glutton. It is
  not the similar animal from North America.
examples:
- A wolverine was seen hunting in the forests of northern Russia.
- The wolverine lives in cold parts of northern Asia and hunts small animals.
