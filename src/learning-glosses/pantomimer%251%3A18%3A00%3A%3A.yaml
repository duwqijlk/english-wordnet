simpleMeaning: An actor who says nothing, and tells a story only with moves of the body and face
scope: An actor who says nothing, and tells a story only with moves of the body and face; mime, mummer,
  mimer and pantomimist are other names for this actor, not a clown who speaks and not a dancer.
examples:
- The pantomimer acted the whole scene without a word.
- As a pantomimer, she could make the crowd laugh in silence.
