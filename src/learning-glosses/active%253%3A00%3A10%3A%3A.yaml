simpleMeaning: In astronomy, describing the sun when it shows many dark spots, sudden bursts of light,
  and strong radio waves.
scope: The sun's disturbed pattern; not a condition growing more severe or wider in scope, not readiness
  for military or naval operations, not a disposition to act or bring about change, not taking part in
  a group or cause, not personal liveliness, not exerting influence or producing an effect, not a busy
  place or constant coming and going, not a machine in operation, not the grammatical voice where the
  subject is the doer or its noun, not verbs or participial adjectives expressing action rather than a
  state, not volcanoes that can erupt or are erupting, not full-time work, not the chemical noun, and
  not a member of an organization.
examples:
- The sun is unusually active this year, with more sunspots than astronomers expected.
- Scientists recorded an active phase of the sun marked by powerful flares.
