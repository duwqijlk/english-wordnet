simpleMeaning: A woody plant with no thorns, living many years and spreading by underground stems, with
  roots more fragrant than wild sarsaparilla and branching flower clusters; southeastern North America
  to Mexico.
scope: 'Also called life-of-man, petty morel, and American spikenard: a thornless plant, not wild sarsaparilla
  itself.'
examples:
- Aralia racemosa grew thick along the wood's edge.
- The roots of Aralia racemosa smell sweeter than wild sarsaparilla.
