simpleMeaning: A stretch of time during which a person is kept in a hospital.
scope: A stretch of time during which a person is kept in a hospital, not the act of putting them there,
  not the insurance that pays for it, and not the state of being treated there.
examples:
- They try to shorten the patient's hospitalization.
- His hospitalization lasted three weeks.
