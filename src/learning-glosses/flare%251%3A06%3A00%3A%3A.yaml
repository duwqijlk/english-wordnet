simpleMeaning: a thing made to give a bright light to warn, to light a place, or to show what a thing
  is
scope: A thing made to give a bright light to warn, to light a place, or to show what a thing is, not
  a burst of light itself and not a sudden burst of flame.
examples:
- The ship fired a flare to warn other ships.
- He lit a flare to light the road.
