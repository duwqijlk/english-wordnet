simpleMeaning: one of many kinds of climbing plant with wood-like stems that bears groups of berries people
  can eat
scope: The climbing plant itself, not its fruit that people eat, and not a group of small balls shot from
  a cannon.
examples:
- This grape climbs over the fence and covers it with leaves.
- He planted a grape in the garden and tied its stems to a post.
