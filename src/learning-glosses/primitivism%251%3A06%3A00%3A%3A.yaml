simpleMeaning: A kind of art that looks like work by simple early artists or by children
scope: A kind of art that copies the look of simple early art or children's art; not art actually made
  by early peoples or children.
examples:
- The painter's primitivism showed in the flat shapes and bold lines of her work.
- Critics praised the primitivism of the young artist's simple figures.
