simpleMeaning: Nests woven with great care are built by small birds that live in groups in Africa and
  Asia.
scope: Also called a weaver and a weaverbird, this is the name for small birds of Africa and Asia that
  live in groups.
examples:
- The weaver finch built a nest with great care.
- Weaver finches live in groups and weave their nests.
