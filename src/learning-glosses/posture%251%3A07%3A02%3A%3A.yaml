senseId: 'posture%1:07:02::'
synsetId: 05210917-n
simpleMeaning: how well a fighting force can fight a war, shown by the soldiers it has and the weapons
  and supplies it has
scope: 'Also called strength: this is about how strong a country is for war. It is not the way a person
  holds their body, not holding a pose for art, and not acting in a false way to impress others.'
examples:
- The generals said the country's military posture was strong enough to fight a war.
- Politicians said weak posture had left the army not ready for war.
