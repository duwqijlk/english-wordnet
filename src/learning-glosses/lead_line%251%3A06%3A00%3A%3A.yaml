simpleMeaning: In sailing, a weighted cord dropped to find how deep the water is
scope: A weighted cord used to measure water depth, not a rope for tying a boat and not a line for fishing.
examples:
- The sailor let out the lead line to check the depth.
- They used a lead line to find how deep the water was near the shore.
