simpleMeaning: In criminal law, the court's final decision that an accused person is guilty, together
  with the penalty it orders.
scope: In criminal law, the court's guilty verdict together with its punishment, not a group of words
  and not just the period a prisoner serves; conviction and condemnation are other names for this sense.
examples:
- The judge imposed a five-year sentence.
- He received a lighter sentence for cooperating with the police.
