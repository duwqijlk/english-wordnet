simpleMeaning: The main place where telephone lines are joined by hand, using patchcords (short cords
  that join one line to another), so calls can be made
scope: This is the place where telephone calls are joined by hand, not a board used to control electric
  power in a building.
examples:
- The operator sat at the switchboard and joined each call by hand.
- All calls to the hotel first went through its switchboard.
