simpleMeaning: feeling happy and proud, especially when you win or do well
scope: This sense is the happy, proud feeling after a win or doing well; it is not the sense that only
  says someone has won and not been beaten.
examples:
- The crowd gave a triumphant shout after the win.
- She felt triumphant after passing the hard test.
