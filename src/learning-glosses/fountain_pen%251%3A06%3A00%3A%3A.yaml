simpleMeaning: A writing tool that gets its ink from a store of ink held inside its body.
scope: A writing tool fed with ink from inside its own body, not a writing tool dipped in ink and not
  a ballpoint.
examples:
- He signed the letter with his fountain pen.
- Her fountain pen leaked ink onto her fingers.
