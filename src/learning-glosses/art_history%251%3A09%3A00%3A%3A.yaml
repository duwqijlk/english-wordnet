simpleMeaning: the subject taught at school and college that studies how painting and sculpture have changed
  over time
scope: The study of how painting and sculpture have changed over time, not a class in how to paint and
  not the past of one artist alone.
examples:
- She chose art history as her main subject at college.
- His art history class looked at how sculpture changed over time.
