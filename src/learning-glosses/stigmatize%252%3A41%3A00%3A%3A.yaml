senseId: 'stigmatize%2:41:00::'
synsetId: 02513894-v
simpleMeaning: to say in public, or by an official judgment, that a person, group, or thing is shameful
scope: 'Also called brand, mark, and denounce: to say in public that a person, group, or thing is shameful,
  not to make a real mark on the skin.'
examples:
- She was stigmatized by people in her town because she had a child outside marriage.
- The report stigmatized the whole town as a place of crime.
