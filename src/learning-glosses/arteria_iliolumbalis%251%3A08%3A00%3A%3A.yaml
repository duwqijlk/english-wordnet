simpleMeaning: The muscles and bones of the pelvis get their blood from this vessel, which comes off the
  deep vessel inside the lower belly.
scope: A blood vessel of the lower belly, also called iliolumbar artery; not the main vessel it comes
  from.
examples:
- The arteria iliolumbalis brings blood to the muscles of the hip.
- Damage to the arteria iliolumbalis can cut off blood to the bones of the pelvis.
