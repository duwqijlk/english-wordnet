simpleMeaning: A major kind of Black popular music in the 1960s and 1970s that took the sound of Christian
  gospel music and made it non-religious.
scope: This is a style of music, not the inner spirit of a person, not a person themselves, and not deep
  feeling or emotion.
examples:
- Aretha Franklin was crowned the queen of soul.
- The record shop has a whole section devoted to soul.
