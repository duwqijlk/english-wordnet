simpleMeaning: said of a plant that makes flowers and gets its pollen moved by the wind, most often a
  grass
scope: This is about plants that make flowers and are spread with pollen by the wind, not plants that
  need bees or other animals to carry their pollen.
examples:
- The anemophilous grasses release their pollen into the wind each spring.
- An anemophilous plant like rye lets the wind carry its pollen from flower to flower.
