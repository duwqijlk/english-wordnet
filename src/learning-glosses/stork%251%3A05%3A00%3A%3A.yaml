simpleMeaning: a large bird that walks in shallow water, mostly from the Old World (Europe, Asia and Africa),
  and typically with white and black feathers
scope: A large bird that walks in shallow water and has white and black feathers, not a crane or a heron,
  other large birds that also walk in water.
examples:
- A stork stood in the shallow water looking for fish.
- We saw a stork with white and black feathers near the river.
