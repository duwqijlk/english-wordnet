simpleMeaning: From a flat plate, copies are made by ink that stays on the flat parts and is pushed away
  by the rest.
scope: Planography is another name for this way of making copies, in which the parts that take ink lie
  flat, not raised, and the rest push ink away.
examples:
- The book was made by planographic printing, with ink taken up from a flat plate.
- In planographic printing the ink sits on the flat parts of the plate.
