simpleMeaning: Its hard tough wood comes from a tree of the Pacific coast, whose sweet-smelling leaves
  bear small bunches of blooms, then fruit like olives.
scope: It is also called pepperwood, sassafras laurel and spice tree, and it is a tree of the Pacific
  coast, not the evergreen shrub of the same name with glossy leaves and white or rose-coloured blooms.
examples:
- The mountain laurel grows along the Pacific coast.
- The mountain laurel bore small bunches of blooms, then fruit like olives.
