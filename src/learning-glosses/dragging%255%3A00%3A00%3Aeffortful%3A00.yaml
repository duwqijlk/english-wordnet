simpleMeaning: Slow and hard in a way that takes much effort and feels painful to keep going
scope: This is a slow, hard way of doing a thing, not a quick easy pace and not a thing pulled along the
  ground.
examples:
- The dragging walk home took hours, and each step felt slow and hard.
- After the long night, his dragging steps showed how tired he was.
