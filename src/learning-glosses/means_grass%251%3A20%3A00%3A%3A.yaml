simpleMeaning: a tall plant that lives for years and spreads by creeping underground stems, grown to feed
  farm animals; in southern United States it grows wild, a bad pest on farmland
scope: A tall plant grown to feed farm animals, also called evergreen millet; not a lawn grass and not
  a grain crop like wheat.
examples:
- Means grass spreads fast across the field, and the farmer cuts it for feed.
- The means grass on the south field has grown tall enough to cut for the cows.
