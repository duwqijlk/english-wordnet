simpleMeaning: As a coating for paper and cloth, and as a glue, this man-made resin is made from chemicals
  built with nitrogen.
scope: Also called amino plastic and amino resin, this man-made resin works as a glue and as a coating
  for paper and cloth, and is not a resin found in nature.
examples:
- The aminoplast held the pieces together.
- They spread aminoplast over the cloth.
