simpleMeaning: during birth, when the head of the unborn baby comes at a wrong angle
scope: 'Also called obliquity: the baby''s head coming at a wrong angle during birth, not a head that
  comes straight down and not a baby that comes feet first.'
examples:
- The doctor found asynclitism when the baby's head came at an odd angle.
- The midwife noted asynclitism because the baby's head was tilted.
