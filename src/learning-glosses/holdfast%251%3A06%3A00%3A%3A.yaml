simpleMeaning: a thing that fastens to something and keeps it fixed in place
scope: 'Also called a fixing: a thing that fastens to something and holds it in place, not a lock and
  not a glue.'
examples:
- The holdfast kept the board steady on the bench.
- He tightened the holdfast to stop the pipe moving.
