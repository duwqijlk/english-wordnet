senseId: 'patch%1:06:04::'
synsetId: 02788671-n
simpleMeaning: a piece of soft material put over a hurt part of the body to cover it and keep it safe
scope: This sense is also called bandage. It is a soft cover for a hurt part of the body, not a cover
  only for a hurt eye and not a cloth piece used to fix a hole in clothing.
examples:
- The nurse put a patch over the cut on his arm.
- She wore a soft patch on her knee to protect the sore skin.
