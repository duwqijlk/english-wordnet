simpleMeaning: Flower heads of white rays round yellow middles grow on this plant found in many places,
  which gives off a strong bad smell.
scope: Dog fennel, mayweed, and stinking chamomile are other names for this widespread plant with a strong
  bad smell and flower heads of white rays round yellow middles.
examples:
- A strong bad smell comes from the stinking mayweed, whose flower heads have white rays round yellow
  middles.
- The flower heads of stinking mayweed show white rays round yellow middles.
