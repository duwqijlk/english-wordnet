simpleMeaning: leaves used to add taste when you cook almost any meat, stews, stuffings, or vegetables
scope: These are the leaves used to add taste to food, not the whole plant that the leaves grow on.
examples:
- Add some thyme to the stew for more taste.
- She cooked the meat with thyme and vegetables.
