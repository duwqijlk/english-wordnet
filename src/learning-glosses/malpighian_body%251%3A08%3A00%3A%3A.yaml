simpleMeaning: A tiny case at the wide end of a nephron, a tiny tube in the kidney, holding Bowman's capsule
  and a ball of tiny blood tubes called a glomerulus.
scope: A tiny case at the wide end of a kidney tube, holding Bowman's capsule and a glomerulus, also called
  malpighian corpuscle or renal corpuscle, not the whole kidney and not a blood vessel.
examples:
- The malpighian body sits at the end of each nephron.
- Each malpighian body filters blood in the kidney.
