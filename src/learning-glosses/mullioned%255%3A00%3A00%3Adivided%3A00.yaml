simpleMeaning: Said of windows, split by upright bars or posts, usually of stone.
scope: A window split by upright bars or posts, usually of stone, not a plain window with one pane.
examples:
- The windows are mullioned, with stone bars across them.
- Her cottage windows were mullioned in the old way.
