simpleMeaning: any chemical whose smallest parts each hold three chlorine atoms
scope: Any chemical whose smallest parts each hold three chlorine atoms; not a chemical with one or two
  chlorine atoms in each part, and not plain chlorine.
examples:
- Nitrogen trichloride is a trichloride with three chlorine atoms in each molecule.
- The trichloride broke down when heated, freeing its chlorine atoms.
