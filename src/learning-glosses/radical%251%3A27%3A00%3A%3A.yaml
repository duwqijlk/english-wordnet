simpleMeaning: In chemistry, two or more atoms (very small parts that make up all things) joined together
  as one unit, forming part of a larger unit made of atoms
scope: 'Also called group: in chemistry this is atoms joined as one unit in a larger unit, not the mathematics
  root sense and not a person with strong new ideas.'
examples:
- In this molecule, the radical is made of atoms joined together.
- The teacher drew a radical as part of a larger molecule.
