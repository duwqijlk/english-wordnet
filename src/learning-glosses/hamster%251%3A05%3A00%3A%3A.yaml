simpleMeaning: a small Old World animal with a short tail that digs holes in the ground and keeps food
  in big pouches in its cheeks
scope: Not a rat or a mouse; this is a small burrowing animal from the Old World with big cheek pouches.
examples:
- My hamster hid the seeds in its cheek pouches.
- The hamster dug a deep hole under the fence.
