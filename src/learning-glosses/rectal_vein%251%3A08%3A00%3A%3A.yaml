simpleMeaning: Any of several blood tubes that carry blood away from the walls of the back passage and
  the lowest part of the gut
scope: A blood tube that drains the walls of the back passage and the lowest gut, also called a hemorrhoidal
  vein or vena rectalis; not an artery that brings blood in and not a vein of the leg.
examples:
- The rectal vein drains blood from the lower gut.
- Surgeons take care near the rectal vein.
