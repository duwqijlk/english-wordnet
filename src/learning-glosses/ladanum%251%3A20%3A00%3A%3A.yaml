simpleMeaning: A soft, dark brown, sticky plant juice from several kinds of rockrose, used in scents,
  above all to hold the smell in place
scope: This is a soft, dark brown, sticky plant juice from rockroses used in scents, also called labdanum,
  not a flower oil and not a scent on its own.
examples:
- Ladanum gives the perfume its warm, lasting base note.
- The maker stirred ladanum into the scent to fix it.
