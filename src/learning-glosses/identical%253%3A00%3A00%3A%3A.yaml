simpleMeaning: of twins, grown from one single egg, not from two eggs
scope: This is only about twins grown from one egg; not the common use meaning exactly alike, and not
  the science use about a thing that is the same in every direction.
examples:
- The doctor told her she was carrying identical twins.
- Identical twins come from a single egg that splits in two.
