simpleMeaning: It comes as crystals in limestone, is cut as a gem, and is a green, yellow, or brown stone-like
  stuff made of a silicon compound that holds water.
scope: Also called vesuvian and vesuvianite, it is the green, yellow, or brown stone-like stuff found
  as crystals in limestone.
examples:
- Her idocrase was green.
- Idocrase occurs as crystals in limestone.
