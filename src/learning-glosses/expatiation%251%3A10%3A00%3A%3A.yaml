simpleMeaning: Talk or writing that goes into a subject at length and in detail.
scope: Talk or writing that goes into a subject at length and in detail; not a short remark and not a
  talk that jumps from subject to subject.
examples:
- His expatiation on Roman roads filled an hour.
- The essay was an expatiation on the theme of freedom.
