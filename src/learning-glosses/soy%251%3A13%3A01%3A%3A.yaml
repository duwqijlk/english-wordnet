simpleMeaning: a thin sauce made from beans that have been left for a long time to change in taste
scope: This is the thin sauce made from the beans, not the beans themselves eaten as food, and not the
  plant grown for oil.
examples:
- She put a little soy sauce on her rice.
- He dipped the fish in soy sauce.
