simpleMeaning: A drug that helps women release eggs so they can become pregnant, but it has been linked
  with having twins or more babies at once.
scope: A fertility drug, also called clomiphene and clomiphene citrate, that stimulates ovulation to help
  a woman become pregnant.
examples:
- Her doctor gave her Clomid to help her release an egg.
- Clomid can lead to twins because it makes the ovaries release more than one egg.
