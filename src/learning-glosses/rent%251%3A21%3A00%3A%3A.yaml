simpleMeaning: money paid again and again by a person who uses a place, a machine, or a service, to the
  one who owns it
scope: Money paid again and again to use a place, a machine, or a service, not the extra money from good
  farmland and not the act of tearing a thing.
examples:
- They paid rent for the flat each month.
- The rent on the shop rose this year.
