simpleMeaning: A tube that joins the pancreas to the intestine
scope: A tube joining the pancreas to the intestine, not a tube that joins the liver to the intestine,
  and not the pancreas itself.
examples:
- The pancreatic duct was blocked, so the juices could not drain.
- Surgeons cleared the pancreatic duct to let the pancreas drain into the intestine.
