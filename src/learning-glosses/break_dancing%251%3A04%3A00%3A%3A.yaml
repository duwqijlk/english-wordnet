simpleMeaning: one person alone usually moves to rap music, doing quick, skillful leaps and turns and
  letting hands, feet, and head in turn touch the floor
scope: 'Also called break dance: one person alone moves to rap music with fast jumps and spins, not a
  group performance and not a slow, formal style.'
examples:
- Break dancing takes fast spins and jumps, with hands and feet touching the floor.
- She practises break dancing to rap music every afternoon.
