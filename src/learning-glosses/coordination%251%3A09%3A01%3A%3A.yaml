simpleMeaning: being on the same level as another thing, with the same rank or weight
scope: Being on the same level and rank as another, not the way body movements work together, and not
  the joining of parts into one plan.
examples:
- The two posts are in coordination, each with the same rank and the same pay.
- The committee gave the two departments coordination, so neither could overrule the other.
