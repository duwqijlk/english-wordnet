simpleMeaning: a set of radio beacons that send out signals to tell planes their exact place and which
  way they are headed
scope: A set of beacons that send out signals to tell planes where they are and which way they are headed;
  omnidirectional radio range and omnidirectional range are other names for this sense, not a single beacon
  and not a map.
examples:
- The omnirange station tells pilots where they are.
- An omnirange signal gives both place and bearing.
