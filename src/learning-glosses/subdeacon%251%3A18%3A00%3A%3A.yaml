simpleMeaning: Once, the old western church and the eastern Catholic Churches ranked this church officer
  one step below a deacon as a Holy Order; the Roman Catholic Church has ended it.
scope: A church officer one rank below a deacon, once a Holy Order in the old western church and the eastern
  Catholic Churches.
examples:
- The subdeacon carried the book in the procession.
- He was made a subdeacon before he was ordained a deacon.
