simpleMeaning: Its sour milky juice was once used to make a drink that makes people drunk, and the vine
  of India has no leaves.
scope: Also called soma, it is a leafless vine of India, not the drink made from its sour milky juice.
examples:
- The haoma vine had no leaves at all.
- Haoma juice was once used to make an intoxicating drink.
