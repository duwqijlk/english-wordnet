simpleMeaning: Bunches of greenish yellow blooms at the ends of its stems mark this green herb of Europe,
  which lives year after year.
scope: This is a green herb of Europe that lives year after year, and its blooms grow in bunches at the
  ends of its stems.
examples:
- The wood spurge grows with bunches of greenish yellow blooms at the ends of its stems.
- This wood spurge lives year after year.
