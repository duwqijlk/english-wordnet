simpleMeaning: On the back wall and top of the upper throat, behind the small piece that hangs down, lymph
  tissue gathers in a mass.
scope: This mass of lymph tissue in the throat is also called adenoid, pharyngeal tonsil, third tonsil,
  and tonsilla adenoidea.
examples:
- Hypertrophy of the pharyngeal tonsils is called adenoids.
- The tonsilla pharyngealis can grow big and block a child's breathing.
