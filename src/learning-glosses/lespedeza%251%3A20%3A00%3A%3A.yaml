simpleMeaning: Hay above all, feed for farm animals, and better soil come from these woody or soft-stemmed
  plants of the southern United States, grown widely there.
scope: Bush clover is the other name for a southern plant grown widely for hay above all, and also for
  feed and better soil.
examples:
- The lespedeza in the field was cut for hay.
- Lespedeza gave the animals feed and the soil new strength.
