senseId: 'cytosmear%1:08:00::'
synsetId: 05272638-n
simpleMeaning: Under a microscope, a doctor looks at a thin bit of tissue or blood, spread on a small
  glass plate and given color, to find disease
scope: A thin bit of tissue or blood spread on glass and colored so its cells can be looked at under a
  microscope; also called smear and cytologic smear, not a blood test done in a tube.
examples:
- The lab made a cytosmear from the blood sample.
- A cytosmear lets the doctor see the cells clearly.
