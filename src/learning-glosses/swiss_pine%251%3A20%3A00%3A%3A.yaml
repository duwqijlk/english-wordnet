simpleMeaning: A large European tree with five needles in each bunch; it gives cembra nuts and a sticky
  substance that oozes out.
scope: 'Also called arolla pine, cembra nut tree, Pinus cembra and Swiss stone pine: a large European
  tree with five needles in each bunch, giving cembra nuts and a sticky substance that oozes out, not
  a small garden tree with needles in pairs.'
examples:
- The Swiss pine gave cembra nuts in autumn.
- We planted a Swiss pine for its five-needled branches.
