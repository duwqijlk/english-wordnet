simpleMeaning: A system that makes hot vapour in boilers and sends it through pipes to radiators to give
  out warmth
scope: A system that makes hot vapour in boilers and sends it to radiators, also called steam heating;
  not warming by an open fire and not warming by electric heaters.
examples:
- Steam heat warmed the whole house through the radiators.
- The school uses steam heat in winter.
