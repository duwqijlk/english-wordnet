simpleMeaning: the act of showing sorrow in a strong way that others can see
scope: 'Also called mourning: this is the whole act of showing sorrow, not just one cry of sorrow and
  grief.'
examples:
- The whole village took part in lamentation, weeping openly for the dead.
- His lamentation was full of tears as he showed his sorrow openly.
