simpleMeaning: a plant that stands upright, of the eastern and southern United States, that lives for
  many years and has bright orange flowers
scope: A plant that stands upright, of the eastern and southern United States, that lives for many years
  and has bright orange flowers; butterfly weed, chigger flower, chiggerflower, orange milkweed and pleurisy
  root are other names for this sense. Not a common milkweed and not a tree.
examples:
- The tuber root in the field had bright orange flowers.
- Bees visited the tuber root on the dry bank.
