simpleMeaning: a poisonous oily liquid that smells of garlic, made of two groups of the stuff called cacodyl;
  it catches fire by itself in dry air
scope: 'Also called cacodyl: a poisonous oily liquid that smells of garlic, not a gas and not a solid
  poison.'
examples:
- Tetramethyldiarsine caught fire when the dry air reached it.
- The lab kept the tetramethyldiarsine sealed because it smells of garlic and is poisonous.
