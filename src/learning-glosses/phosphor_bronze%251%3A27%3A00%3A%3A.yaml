simpleMeaning: Holding a bit of a certain element, this hard metal mix wears away only slowly and is used
  in the round parts that let wheels turn and in toothed wheels.
scope: A hard metal mix that wears away only slowly, used in the round parts that let wheels turn and
  in toothed wheels, not the plain metal mix without the added element.
examples:
- The bearing was made of phosphor bronze.
- Gears of phosphor bronze turned the wheel.
