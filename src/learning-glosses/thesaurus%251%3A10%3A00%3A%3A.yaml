simpleMeaning: a book that lists words in groups, with words that have the same or a near meaning put
  together
scope: This book helps you find a word with the same meaning as another word, not a book that tells you
  what each word means.
examples:
- He used a thesaurus to find a better word for 'happy'.
- The thesaurus puts 'big', 'large' and 'huge' in the same group.
