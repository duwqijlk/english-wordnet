simpleMeaning: a place where roads meet, where cars go round and round a piece of land in the middle
scope: This is a place where roads meet, also called circle and roundabout; it is not a word for turning,
  and not an electrical machine.
examples:
- The accident blocked all traffic at the rotary.
- Turn left at the rotary and then go straight on.
