simpleMeaning: a tree from Australia and nearby lands that keeps its leaves all year, with white or pale
  grey bark and young leaves and yellow flowers
scope: A tree from Australia and nearby lands that stays green all year, also called mimosa; not a tree
  that loses its leaves in winter, and not a tree with red flowers.
examples:
- The silver wattle grew beside the creek all year round.
- We planted a silver wattle for its bright yellow flowers.
