simpleMeaning: A past political party in the United States, set up in 1948 by Democrats from the southern
  states to stand against Harry S Truman's run for president.
scope: Also called the States' Rights Democratic Party, this was a past political party in the United
  States set up in 1948 by southern Democrats to stand against Harry S Truman's run for president, distinct
  from the Democratic Party and the Republican Party.
examples:
- The Dixiecrats broke away from the Democrats in 1948.
- Dixiecrats in the South opposed Truman's candidacy.
