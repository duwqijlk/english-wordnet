simpleMeaning: A pouch present from birth in the lower small gut, left when the yolk sac does not close
  fully.
scope: This pouch is present from birth, not a pouch that forms later in life and not a growth in the
  gut.
examples:
- The surgeon found a Meckel's diverticulum in the ileum.
- A Meckel's diverticulum forms when the yolk sac fails to close.
