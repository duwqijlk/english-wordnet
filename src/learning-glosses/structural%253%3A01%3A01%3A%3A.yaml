simpleMeaning: To do with the way a thing is built up, or caused by that build, above all in politics
  and money.
scope: To do with structure, above all in politics and money; not the rocks of the earth, and not the
  build of a house.
examples:
- Structural unemployment hit the old mill towns.
- The structural problems of the economy took years to fix.
