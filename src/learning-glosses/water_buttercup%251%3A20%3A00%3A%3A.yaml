simpleMeaning: White flowers and two kinds of leaves, some under the surface and some that float, mark
  this plant of ponds and slow-moving streams in Europe and North America.
scope: Also called water crowfoot, it is the plant of ponds and slow-moving streams in Europe and North
  America with white flowers and leaves under the surface and leaves that float.
examples:
- The water buttercup on the pond had white flowers.
- On the slow stream, water buttercup grew with leaves under the surface and leaves that float.
