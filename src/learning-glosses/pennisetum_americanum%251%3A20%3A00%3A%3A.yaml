simpleMeaning: A tall grass with spikes like a cattail, grown in Africa and Asia for its grain and in
  the United States mostly for animal feed, sometimes used to make beer
scope: This is a tall grass grown for its grain; bulrush millet, cattail millet, pearl millet and Pennisetum
  glaucum are other names for it, not a grass with no grain.
examples:
- Pennisetum americanum is grown in Africa for its grain.
- Farmers grow Pennisetum americanum for animal feed in the United States.
