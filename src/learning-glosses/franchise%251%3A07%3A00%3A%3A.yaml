simpleMeaning: a right or special freedom given by law to a person or group by a government, especially
  the rights of being a citizen and of voting
scope: A right given by a government, especially the right to vote, not a business run under a company's
  name and not the act of giving such a right.
examples:
- Women fought for the franchise and the right to vote.
- The franchise was given to all adult citizens.
