senseId: 'overbite%1:26:00::'
synsetId: 14084579-n
simpleMeaning: In dentistry, a way the teeth fit badly in which the top teeth stick out too far over the
  bottom teeth
scope: In dentistry, this is the top teeth coming too far over the bottom teeth, not loose teeth and not
  pain in the teeth.
examples:
- The dentist said her overbite could be fixed with braces.
- His overbite meant his top teeth covered most of his bottom teeth.
