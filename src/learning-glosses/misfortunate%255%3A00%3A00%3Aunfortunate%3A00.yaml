simpleMeaning: Such that others feel pity for one, whether one has earned it or simply stirs it up.
scope: Also called poor, miserable, wretched, pathetic, pitiful, hapless, piteous, or pitiable, such that
  others feel pity for one, whether one has earned it or simply stirs it up.
examples:
- The family was misfortunate, and the whole town felt pity for them.
- The victims were misfortunate, stirring pity in all who heard their story.
