simpleMeaning: Big leaves low on the stem and white flowers in summer grow on a tall plant of the east
  of the United States that lives for many years
scope: A tall long-lived plant of the eastern United States with big low leaves and white summer flowers,
  not a true bugbane and not a common garden flower.
examples:
- The false bugbane grew tall beside the woodland path.
- In summer the false bugbane showed white flowers above its big leaves.
