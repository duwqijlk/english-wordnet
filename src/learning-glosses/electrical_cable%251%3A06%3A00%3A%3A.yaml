simpleMeaning: phones, television sets, and power plants get their link through this thick wire
scope: A thick wire that gives a phone, a television set, or a power plant its link, not a thin cord for
  a lamp and not a rope for pulling.
examples:
- The electrical cable ran from the pole to the house.
- They laid a new electrical cable to carry the television signal.
