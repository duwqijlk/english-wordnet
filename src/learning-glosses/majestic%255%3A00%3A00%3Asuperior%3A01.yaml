simpleMeaning: above the small, everyday things of life, you carry yourself in a grand way
scope: Grand in manner and above everyday things, not dignity or nobility shown in looks alone, and not
  the look that befits a king.
examples:
- His majestic presence filled the hall.
- She spoke with majestic calm, above all the fuss around her.
