simpleMeaning: A living thing in the sea or fresh water, green or without colour, that swims with a whip-like
  tail.
scope: A swimming living thing in sea or fresh water, green or without colour; also called a euglenid
  or euglenoid, not a green plant and not a fish.
examples:
- Euglenophytes drift in the pond water, turning it faintly green.
- The euglenophyte swam with its whip-like tail under the microscope.
