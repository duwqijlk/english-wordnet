simpleMeaning: a power device made of a set of metal parts set in a glass or metal case with the air taken
  out
scope: A power device with metal parts in a glass or metal case, also called tube, thermionic tube, thermionic
  vacuum tube, thermionic valve and vacuum tube; not a glass bottle and not a wire.
examples:
- The old radio used an electron tube to boost the sound.
- An electron tube has its parts sealed in glass with the air taken out.
