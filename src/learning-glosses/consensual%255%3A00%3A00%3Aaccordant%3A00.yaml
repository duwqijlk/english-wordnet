senseId: consensual%5:00:00:accordant:00
synsetId: 00555814-s
simpleMeaning: present or in place because the people it is about have all agreed to it
scope: This describes something that all the people it is about have agreed to. It is not forced on them,
  and not decided by one person alone.
examples:
- They signed a consensual contract after long talks together.
- The change was consensual, and no one was forced to accept it.
