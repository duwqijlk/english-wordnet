simpleMeaning: ready to argue or disagree, or showing that readiness, even to the point of going to court
  to fight a case
scope: 'Also called combative, disputatious, disputative and litigious: this describes a person, a style
  or a way of acting that is ready to argue or go to court, not a subject that causes disagreement among
  other people.'
examples:
- He is a contentious man who argues about every small point.
- The contentious lawyer was ready to take the case to court.
