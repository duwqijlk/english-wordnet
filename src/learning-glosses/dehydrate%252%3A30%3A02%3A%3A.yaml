simpleMeaning: to keep something safe for later by taking all water and other liquids out of it
scope: 'Also called desiccate: this is taking all water out of a thing to keep it for later, not a person
  losing water from the body.'
examples:
- They dehydrate fruit so it keeps for months on a trip.
- We dehydrated the vegetables before packing them for the camp.
