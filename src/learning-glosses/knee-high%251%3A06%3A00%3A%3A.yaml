simpleMeaning: 'Up to just under the joint in the middle of the leg: that is how far up this sock or stocking
  reaches'
scope: 'Another name for knee-hi: a sock or stocking that reaches almost to the joint in the middle of
  the leg, not a short sock and not a long boot.'
examples:
- Her knee-high socks matched her school dress.
- He bought a pair of knee-high stockings for the cold walk.
