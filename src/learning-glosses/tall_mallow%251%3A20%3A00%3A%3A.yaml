simpleMeaning: With bunches of rosy-purple flowers where leaves meet the stem, an Old World plant living
  many years and growing up or lying flat, brought to the United States.
scope: Also called cheese, cheeseflower, and high mallow, this Old World plant was brought to the United
  States, not a plant first found there.
examples:
- Tall mallow grew upright with rosy-purple flowers.
- The tall mallow lay flat along the ground.
