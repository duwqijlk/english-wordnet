senseId: 'underdevelop%2:39:00::'
synsetId: 02143536-v
simpleMeaning: To keep film or a photographic plate in the developing liquid for too short a time, or
  use a liquid that does not work well, or too low a heat.
scope: To develop film or a photographic plate too little, by cutting the time short, using a weak liquid,
  or keeping the heat too low.
examples:
- The photos came out pale because I underdeveloped the film.
- She underdeveloped the plate and the picture stayed faint.
