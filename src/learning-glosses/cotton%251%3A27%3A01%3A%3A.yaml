simpleMeaning: the soft, smooth fibers of a plant, still raw and not yet made into cloth or thread
scope: These are the raw plant fibers themselves, not cloth woven from them, not thread made from them,
  and not the plant they come from.
examples:
- Raw cotton feels soft and smooth when you hold it in your hand.
- The workers gathered the cotton in its raw state before it was sent away to make cloth.
