simpleMeaning: Across the warm, dry uplands of California, Oregon and Washington, this tall perennial
  herb of the Frasera group is widely found.
scope: Another name for the Frasera herb also called columbo and deer's-ear; not a pyramid-shaped succulent
  or trimmed shrub.
examples:
- Pyramid plant sends up a tall stalk in early summer.
- The guide pointed out pyramid plant among the dry hillside grasses.
