simpleMeaning: A metal ring that can be locked round the wrist to hold a person, most often used in pairs.
scope: This is a metal ring locked round the wrist to hold a person, not a bracelet or a rope; also called
  cuff, handcuff, and manacle.
examples:
- The guard fitted the handlock on his wrist.
- Handlocks clicked shut around both wrists.
