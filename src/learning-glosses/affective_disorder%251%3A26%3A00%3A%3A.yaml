senseId: 'affective_disorder%1:26:00::'
synsetId: 14412315-n
simpleMeaning: In this trouble of the mind, strong feelings are stirred up and rule above all else, with
  no bodily fault in the brain that can be found.
scope: This is also called emotional disorder, emotional disturbance, and major affective disorder, and
  it is a trouble of feelings, not one caused by a clear fault in the brain.
examples:
- Affective disorder shaped how she felt about each day.
- He sought help for an affective disorder that upset his feelings day after day.
