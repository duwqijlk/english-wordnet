simpleMeaning: to touch or move a hand lightly over someone or something in a loving and kind way
scope: Also called caress; this is a light, loving touch, not a hard hit, a grab, or a rough rub.
examples:
- He fondled the cat's ears gently with love.
- She fondled the baby's small hand in a kind way.
