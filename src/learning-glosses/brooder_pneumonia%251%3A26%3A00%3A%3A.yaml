simpleMeaning: a bad breathing sickness of birds that strikes young chickens and turkeys as a sudden lung
  sickness that kills fast
scope: 'Also called aspergillosis: a bad breathing sickness of birds that strikes young chickens and turkeys
  and kills fast, not a mild cold and not a sickness that strikes only grown birds.'
examples:
- Brooder pneumonia killed the young turkeys soon after they first showed signs of sickness.
- The vet said brooder pneumonia is a sudden, fast-killing lung sickness in young chickens.
