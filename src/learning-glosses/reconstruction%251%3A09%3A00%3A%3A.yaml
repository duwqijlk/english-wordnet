simpleMeaning: the idea that remembering works by keeping general features in mind and building the memory
  from them when you recall it
scope: A theory of how remembering works, not the rebuilding of a damaged building and not a new version
  of events from evidence.
examples:
- The psychologist explained reconstruction as building a memory from stored features.
- Reconstruction in memory means we rebuild what happened from a few kept details.
