simpleMeaning: giving off no brightness at all
scope: This describes a thing that makes no brightness of its own; it is not just about a place being
  dark because no brightness reaches it.
examples:
- These lightless stars give off no brightness of their own and can be found only by radio.
- The bulb was lightless, so the room stayed dark.
