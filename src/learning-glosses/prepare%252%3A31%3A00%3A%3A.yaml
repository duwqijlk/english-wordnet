simpleMeaning: To learn, through training or teaching, the skills needed for a particular role, function
  or profession.
scope: This is about a person being trained for a role or profession (train is another name), not about
  educating someone else for a future role or about making things ready in advance.
examples:
- He is preparing to become a doctor.
- She prepared for a career in law at a top university.
