simpleMeaning: A sweet scent rises after dark from yellow-white funnel-shaped blooms that grow in bunches
  on a West Indian bush which keeps its green leaves all year.
scope: This West Indian bush is also called night jasmine, and it is known for the sweet scent of its
  yellow-white blooms after dark.
examples:
- We could smell the night jessamine after dark.
- Night jessamine blooms open in bunches and smell sweet at night.
