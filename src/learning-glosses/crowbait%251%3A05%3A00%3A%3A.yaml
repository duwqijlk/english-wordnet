simpleMeaning: a horse so thin and weak that it is likely close to death and would soon be food for birds
  that eat dead flesh
scope: A horse so thin and weak that it is likely close to death, also called crow-bait; not a healthy
  horse and not other dying animals.
examples:
- The crowbait stood in the yard, its ribs showing through its coat.
- Nobody wanted to buy the crowbait, since it looked close to death.
