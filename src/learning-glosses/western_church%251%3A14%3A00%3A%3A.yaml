simpleMeaning: The Christian body based in the Vatican, led by a pope and by bishops in a ranked order.
scope: Also called the Church of Rome, Roman Catholic, the Roman Catholic Church or the Roman Church;
  the Christian body led by the pope from the Vatican, not the Eastern Orthodox churches.
examples:
- The Western Church has been based in the Vatican for centuries.
- He was raised in the Western Church.
