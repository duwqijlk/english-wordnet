simpleMeaning: Said of the shallow water right by the coast
scope: Said of the shallow water right by the coast; not the sea over the sea floor near the land where
  the water is less than 200 metres deep, and not the deep sea.
examples:
- Neritic fauna live in the shallow water by the coast.
- The neritic zone is the shallow water next to the shore.
