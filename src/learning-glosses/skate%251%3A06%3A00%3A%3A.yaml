simpleMeaning: a thing for sports that a person wears on the feet to slide along, pushed forward by moving
  one leg and then the other
scope: A thing worn on the feet for sliding along in sports, not the act of moving along in this way.
examples:
- She put on her skates before she went onto the ice.
- One of his skates broke during the game.
