simpleMeaning: A group of related kinds of living things that grow in the ground and make food from sunlight
scope: A group of related kinds of plants, not a smaller group such as a genus and not a larger group
  such as an order.
examples:
- The rose belongs to a large plant family that includes apples and pears.
- Botanists group the daisy in the same plant family as the sunflower.
