simpleMeaning: Said of things that belong to Cambodia, or to its people, their way of life, or their tongue.
scope: Also called Cambodian, this word marks things of Cambodia, not things of other lands in Asia.
examples:
- Kampuchean food uses rice, fish, and strong herbs.
- She wore a Kampuchean dress to the festival.
