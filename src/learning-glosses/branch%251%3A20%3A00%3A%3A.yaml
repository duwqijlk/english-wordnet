simpleMeaning: A stem growing out from a plant's main stem, or a section of a stem.
scope: A plant's own stem, not a piece of a forked shape, a stream's smaller channel, or a division of
  an organization.
examples:
- A small branch grew from the trunk just above the ground.
- He cut the low branch so the mower would pass under it.
