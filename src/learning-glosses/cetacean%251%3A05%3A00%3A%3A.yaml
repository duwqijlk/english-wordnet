simpleMeaning: A big sea animal that eats meat, with front limbs shaped like fins and no back limbs, such
  as a whale, a dolphin, a porpoise, or a narwhal.
scope: Also called a blower or a cetacean mammal; a big sea animal that eats meat, not the adjective sense
  about whales and dolphins.
examples:
- The cetacean surfaced to breathe through the hole in the ice.
- Whales are cetaceans, and so are dolphins.
