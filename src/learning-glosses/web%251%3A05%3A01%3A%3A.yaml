simpleMeaning: In bird anatomy, the flat surface of a feather, made of tiny branches called barbs that
  grow on each side of the central stem.
scope: This is the flat part of one feather, not a woven network, a snare for prey, an interconnected
  system of people or things, the internet, a piece of cloth being woven, the skin between a duck's toes,
  or the verb meaning to build such a network.
examples:
- The web of the feather had split down the middle, so she smoothed the barbs back into place.
- Hold a flight feather up to the light and the web shows as an even panel on either side of the central
  stem.
