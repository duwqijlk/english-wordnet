simpleMeaning: 'Votes pick the winners: seats are shared out in line with each party''s share of the vote,
  and voters pick one party''s roll of names.'
scope: Also called scrutin de liste and scrutin de liste system, it is a voting way where voters choose
  a party's roll of names, not a single candidate.
examples:
- Under a list system, voters choose a party's roll of names.
- The country uses a list system for its elections.
