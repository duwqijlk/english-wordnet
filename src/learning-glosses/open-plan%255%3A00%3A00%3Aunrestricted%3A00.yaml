simpleMeaning: Said of rooms or a building, few walls stand between rooms that are big
scope: Said of rooms or a building with few walls between big rooms, not a place with many small rooms
  and not a single large hall.
examples:
- They moved into an open-plan office with few walls.
- The open-plan flat had one big living room.
