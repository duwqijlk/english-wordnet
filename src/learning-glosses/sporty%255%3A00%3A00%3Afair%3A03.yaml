senseId: sporty%5:00:00:fair:03
synsetId: 00959923-s
simpleMeaning: that treats others fairly and follows the rules, or that asks for this kind of fair play
scope: This is about treating others fairly and following the rules, in a game or in other dealings with
  people; sporting and sportsmanlike are other names for this sense. It is not about bright, showy clothes,
  and not about things made for doing sport.
examples:
- It was sporty of him to tell the judge that the ball had hit the line.
- The sporty players shook hands and accepted the result without a fight.
