simpleMeaning: Very different from what is usual, and easy for all to see
scope: Said of a thing or a person that stands out as very different from what is usual; bizarre, eccentric,
  flaky, freakish, freaky, gonzo, outlandish and outre are other names for this sense, and not a small
  odd habit or a strange look.
examples:
- His off-the-wall antics made the whole room laugh.
- She wore an off-the-wall hat shaped like a rabbit.
