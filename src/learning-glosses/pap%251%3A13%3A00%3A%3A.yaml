simpleMeaning: A way of eating in which the food needs no chewing, suggested for people with bowel problems.
scope: A prescribed way of eating for someone with a bowel complaint, not the nipple-like projection on
  a breast and not ordinary soft food for babies.
examples:
- After the operation she was kept on pap until she could chew again.
- The nurse said pap would ease the strain on his inflamed bowel.
