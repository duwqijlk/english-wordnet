simpleMeaning: A bushy plant of Old World salt marshes and sea beaches, with prickly leaves; burned to
  make a crude soda ash
scope: Also called barilla, glasswort, kali, kelpwort, saltwort and Salsola soda; a bushy plant of salt
  marshes burned for soda ash, close to other saltworts of the same shores.
examples:
- Salsola kali grows on the sea beach.
- Salsola kali was burned to make soda ash.
