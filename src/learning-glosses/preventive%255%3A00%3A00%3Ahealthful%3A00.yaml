simpleMeaning: stopping illness before it starts, or helping to stop it
scope: 'Also called preventative and prophylactic: this describes care or medicine that helps stop illness
  before it starts, not a thing that blocks the way and not a thing used to stop a woman having a baby.'
examples:
- Preventive care includes shots that help stop people getting ill.
- Doctors advise preventive steps, like washing hands, to stop illness from spreading.
