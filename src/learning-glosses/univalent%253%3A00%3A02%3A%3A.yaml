senseId: 'univalent%3:00:02::'
synsetId: 01550760-a
simpleMeaning: said of a chromosome, a thread-like part in a cell, that stays alone and does not join
  its matching part when the parts pair up
scope: A lone chromosome with no partner, not a pair of matching chromosomes and not a chromosome joined
  to another.
examples:
- The scientist found a univalent chromosome in the cell.
- A univalent chromosome stays alone while the others pair up.
