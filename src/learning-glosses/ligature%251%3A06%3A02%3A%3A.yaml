simpleMeaning: A band of metal that fastens the thin reed to the mouthpiece of a clarinet or a saxophone.
scope: A band of metal that fastens the thin reed to the mouthpiece of a clarinet or a saxophone; not
  the thread a surgeon uses to tie off a blood vessel.
examples:
- He tightened the ligature to hold the reed on the mouthpiece.
- The ligature kept the reed firm against the mouthpiece of the clarinet.
