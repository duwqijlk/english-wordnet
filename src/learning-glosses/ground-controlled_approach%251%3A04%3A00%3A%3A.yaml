senseId: 'ground-controlled_approach%1:04:00::'
synsetId: 00306152-n
simpleMeaning: A landing in bad weather in which a person on the land talks the pilot down, using fine
  radar that shows where the plane is
scope: A landing in bad weather guided down by a person on the land, not a landing in clear weather and
  not a landing guided only by the pilot's own sight.
examples:
- The pilot flew a ground-controlled approach through the fog.
- Ground-controlled approach let the plane land safely in the storm.
