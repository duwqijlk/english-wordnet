simpleMeaning: A tree of southeastern Asia to Australia, grown mainly for its sweet edible fruit like
  litchi nuts, sometimes put in the plant group Euphorbia or one sharing its name.
scope: 'Also called longan, longanberry, lungen, Dimocarpus longan, and Euphorbia litchi: a tree of southeastern
  Asia to Australia grown for its sweet fruit like litchi nuts, not a litchi tree and not a nut tree.'
examples:
- Nephelium longana is grown for its sweet fruit in southeastern Asia.
- We ate Nephelium longana fruit, sweet like litchi nuts.
