simpleMeaning: A North American year-on-year herb, with leaves set by turns and made of leaflets, and
  sprays of small white blooms, then bright red oval berries that poison.
scope: This sense is also called red-berry, red baneberry, and redberry.
examples:
- Snakeberry grows in the woods.
- A snakeberry bore bright red berries.
