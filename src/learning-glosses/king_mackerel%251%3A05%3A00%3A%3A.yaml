simpleMeaning: A large sea fish with a long pointed nose, caught for food and sport along the eastern
  Atlantic coast south to Brazil.
scope: This is a large sea fish with a long pointed nose, caught for food and sport along the eastern
  Atlantic coast south to Brazil; cavalla and cero are other names for it, not a small mackerel and not
  a tuna.
examples:
- King mackerel is an important food fish along the Atlantic coast.
- They caught a king mackerel off the coast of Brazil.
