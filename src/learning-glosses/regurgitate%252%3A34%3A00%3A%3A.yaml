simpleMeaning: to give food to young birds by bringing food that was swallowed back up through the beak
scope: For a bird feeding its young with food it swallowed earlier. It is not a person or animal throwing
  up because they are sick.
examples:
- The mother bird regurgitates food into the mouths of her chicks.
- Pigeons regurgitate a soft food to feed their young.
