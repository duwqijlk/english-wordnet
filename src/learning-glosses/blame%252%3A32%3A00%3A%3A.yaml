simpleMeaning: to say that someone is responsible for something wrong or bad that happened
scope: To say someone caused a wrong or bad thing, not to keep finding fault with them again and again,
  and not the noun for words against someone.
examples:
- They blamed the driver for the crash.
- She blamed herself for forgetting the keys.
