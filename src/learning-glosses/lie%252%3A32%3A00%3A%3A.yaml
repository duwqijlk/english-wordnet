simpleMeaning: Say something false, knowing it is false, in order to mislead someone.
scope: This is the verb for saying something untrue on purpose, not the verb for resting flat, and not
  the noun for a false statement.
examples:
- Don't lie to your parents about where you were last night.
- He lied to the guard about having a pass.
