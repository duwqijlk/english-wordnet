simpleMeaning: a dried part of a plant that grows under the ground, used in place of coffee
scope: 'Also called chicory: a dried plant root used in place of coffee, not coffee itself and not the
  roasted-and-ground root sense.'
examples:
- She mixed chicory root into the pot to stretch the coffee.
- The shop sold chicory root in small bags beside the coffee.
