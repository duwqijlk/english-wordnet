simpleMeaning: Bars of different heights show how often each value turns up in a set of counts.
scope: A chart of bars that shows how often values turn up, not a line graph and not a pie chart.
examples:
- The histogram showed most scores bunched near the middle.
- She drew a histogram of the heights in her class.
