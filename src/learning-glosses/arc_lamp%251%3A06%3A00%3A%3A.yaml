simpleMeaning: A device that gives off light when electric current jumps the gap between two ends that
  carry the current.
scope: 'Also called arc light: a light made when electric current jumps a gap, not an ordinary bulb and
  not a torch.'
examples:
- The arc lamp lit the whole yard.
- An arc lamp needs two ends with a gap between them.
