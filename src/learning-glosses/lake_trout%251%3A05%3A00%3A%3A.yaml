simpleMeaning: A large fish with a forked tail, living in the still waters of Canada and the northern
  United States.
scope: A large fish with a forked tail, living in the still waters of Canada and the northern United States,
  not a rainbow trout of streams and not a salmon of the sea.
examples:
- The lake trout fought hard on the line.
- Lake trout live in the cold deep lakes of Canada.
