schema: oewn-learning-gloss-v2
senseId: 'dizzy%2:30:00::'
synsetId: 00533408-v
simpleMeaning: to make someone feel unsteady and as if things are turning round and round, so they may
  fall
scope: This is about making a person feel unsteady. It is not about feeling unsteady yourself, and not
  about being silly and not serious.
examples:
- The fast ride dizzied the children and they had to sit down.
- Spinning round and round dizzied her, so she stopped at once.
