senseId: 'trespass%1:04:01::'
synsetId: 00735780-n
simpleMeaning: wrongly getting in the way of someone's hold on what is theirs, whether a thing they own
  or land, or the court case brought to get money back for it
scope: A wrongful meddling with what someone owns, or the court case for money back, not a sin against
  God and not the act of walking onto land you do not own.
examples:
- The trespass cost him dearly when the owner sued for damages.
- The farmer brought a trespass action after the men dug up his field.
