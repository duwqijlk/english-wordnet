simpleMeaning: a substance that joins sides of things and holds them fast
scope: 'Also called adhesive and adhesive material: a substance that joins sides of things and holds them
  fast, not sticky tape for wounds and not the grip of a tire on the road.'
examples:
- He spread adhesive agent on the back of the tile before he pressed it to the wall.
- The adhesive agent held the two boards fast while it dried.
