simpleMeaning: to make a noise die down by putting something thick round the thing that makes it, most
  often a wrap
scope: 'Also called dull, damp, and muffle, and mute is another name for it too: to hush a sound by wrapping
  it round, not to blur a picture and not to shrink the swing of waves.'
examples:
- She dampened the drum with a thick cloth.
- He dampened the bell by wrapping it in felt.
