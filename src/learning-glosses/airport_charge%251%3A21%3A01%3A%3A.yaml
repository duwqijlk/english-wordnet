simpleMeaning: money paid for a plane to take off, land and park, and for the use of the rooms and help
  for travellers
scope: A fee for a plane to take off, land and park and for travellers to use the rooms and help, not
  the price of a ticket and not the cost of the plane itself.
examples:
- The airport charge is added to the price of every ticket.
- Small planes pay a lower airport charge than large ones.
