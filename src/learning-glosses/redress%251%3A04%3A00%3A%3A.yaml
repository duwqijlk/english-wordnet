simpleMeaning: the act of putting right a mistake, a fault, or something bad
scope: 'Also called remedy and remediation: the act of putting right something wrong, not just saying
  sorry and not just paying money for a loss.'
examples:
- The family asked for redress after the error cost them their home.
- The court offered redress for the fault by ordering the company to fix its records.
