simpleMeaning: a verb form used for actions or states that happened before now.
scope: This is not the earlier period of time itself, and not the preposition meaning 'beyond'; it is
  a grammar term.
examples:
- In English, you often add '-ed' to a verb to form the past.
- The teacher showed how the past works in the sentence 'I walked home'.
