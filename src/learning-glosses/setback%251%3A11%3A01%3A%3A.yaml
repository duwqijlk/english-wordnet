simpleMeaning: A piece of bad luck that slows you down, stops your plans, and leaves you frustrated.
scope: A piece of bad luck that slows you down, stops your plans, and leaves you frustrated, also called
  a blow and a reverse.
examples:
- The injury was a setback for the whole team.
- Losing the contract was a setback, but they kept going.
