simpleMeaning: a small thin cake or cookie that is firm and dry and breaks easily
scope: This is a small thin cake or cookie you eat, not the thin bread used in a church service and not
  the small sticky disk used to close a letter.
examples:
- She ate a chocolate wafer with her coffee.
- The wafers in the box were thin and crisp.
