simpleMeaning: A person who twists silk or man-made threads into a thread or yarn
scope: This is a person who twists silk or man-made threads into a thread or yarn, also called a thrower;
  not a weaver and not a spinner of cotton.
examples:
- The throwster twisted silk threads into yarn all day.
- As a throwster, she worked with silk and man-made threads.
