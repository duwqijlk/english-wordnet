simpleMeaning: A rich cake of two or more layers, covered with icing and pretty things, and served at
  a wedding party.
scope: A rich layered cake with icing, served at a wedding party; not a birthday cake and not a plain
  sponge cake.
examples:
- The bridecake stood three tiers high on the table.
- Guests cut the bridecake after the speeches.
