senseId: 'renunciation%1:10:01::'
synsetId: 07222070-n
simpleMeaning: Turning a thing down, giving it up, or saying it is not valid.
scope: 'Also called repudiation: turning a thing down, giving it up, or saying it is not valid, not an
  act in words or in writing that declares something is given up or no longer owned, not the giving up
  of a possession, a right, a title, a privilege, or the like, and not the state of having left one''s
  faith for a party or a cause, often for beliefs one once opposed.'
examples:
- The renunciation of the treaty by Congress ended years of talks.
- Their renunciation of the old agreement surprised their allies.
