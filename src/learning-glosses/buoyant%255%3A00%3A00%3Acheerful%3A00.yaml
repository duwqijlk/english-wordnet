simpleMeaning: lively and happy, with a bright mood and no worry
scope: This sense is about a lively, happy mood, also called perky or chirpy. It is not about a thing
  that floats on water or rises in air.
examples:
- She stayed buoyant all morning, smiling and talking to everyone.
- After the good news, he felt buoyant and ready to start again.
