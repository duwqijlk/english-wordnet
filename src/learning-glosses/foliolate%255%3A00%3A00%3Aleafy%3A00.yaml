simpleMeaning: Often used joined to another word, having small leaves that make up a larger leaf, or a
  set kind or number of such small leaves.
scope: Often used joined to another word, having small leaves that make up a larger leaf, or a set kind
  or number of such small leaves; not a leaf that is one whole piece and not a word used on its own.
examples:
- Foliolate is joined to 'bi' to make the word 'bifoliolate'.
- The foliolate leaf is made of several small leaflets.
