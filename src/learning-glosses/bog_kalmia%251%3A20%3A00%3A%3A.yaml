simpleMeaning: A laurel of the wet lands of the northwestern United States, with small purple flowers
  and pale leaves that are grey-green below.
scope: This is a laurel of the wet lands of the northwestern United States, also called bog laurel and
  swamp laurel, not a laurel of dry ground and not one with large flowers.
examples:
- Bog kalmia grows in the wet lands of the northwestern United States.
- The bog kalmia has small purple flowers and pale leaves.
