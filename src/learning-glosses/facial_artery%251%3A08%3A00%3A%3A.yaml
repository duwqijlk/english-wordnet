senseId: 'facial_artery%1:08:00::'
synsetId: 05352586-n
simpleMeaning: the blood vessel that comes out of the neck vessel feeding the face, sending smaller vessels
  to the neck and face
scope: This is a blood vessel branching off the face-feeding neck vessel; arteria facialis and external
  maxillary artery are other names for this sense; not the neck vessel itself and not a vessel feeding
  the brain.
examples:
- The facial artery supplies blood to the face and neck.
- The surgeon tied off the facial artery near the jaw.
