simpleMeaning: A weedy trailing mat-forming herb with bright yellow flowers, grown for its edible, mildly
  sour leaves, eaten raw or cooked, especially in Indian, Greek, and Middle Eastern cooking; worldwide.
scope: Not other weedy herbs, nor other plants with edible leaves; also called common purslane, pussley,
  pussly, verdolaga, and verdolagas.
examples:
- Portulaca oleracea grows in gardens.
- People eat Portulaca oleracea raw or cooked.
