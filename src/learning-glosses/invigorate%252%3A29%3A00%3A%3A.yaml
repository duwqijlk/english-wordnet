simpleMeaning: to give a person or thing new strength, energy, and life
scope: 'Also called reinvigorate: this is about giving a person or thing new strength and energy, not
  about rest or about making something weaker.'
examples:
- A short walk in fresh air can invigorate you after a long day at work.
- The cold water invigorated him, and he felt ready to start again.
