simpleMeaning: The habit of acting in ways no one can foresee, led more by passing fancy than by thought
  or sound judgment.
scope: The habit of acting in ways no one can foresee, led more by passing fancy than by thought; whimsy,
  capriciousness and flightiness are other names for it, and it is not careful planning and not a single
  careless act.
examples:
- The arbitrariness of his choices made planning hard.
- She grew tired of the arbitrariness of the rules.
