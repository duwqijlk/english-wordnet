senseId: 'extensor_muscle%1:08:00::'
synsetId: 05302105-n
simpleMeaning: A band of flesh joined to bone whose tightening straightens or stretches another part of
  the body.
scope: A body part joined to bone whose tightening straightens another part; also called an extensor,
  not a part that bends a joint and not a tendon.
examples:
- The extensor muscle in his arm straightened his wrist.
- An extensor muscle pulls the finger straight.
