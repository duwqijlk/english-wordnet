simpleMeaning: Describes a thing with parts in different shades, usually bright ones.
scope: Having parts in different bright shades; painted, multicolor, multicolored, motley, piebald, pied,
  calico, multicolour, multicoloured, multi-color, multi-colored, multi-colour, particolored and particoloured
  are other names for this, not plain and not one shade only.
examples:
- He bought a multi-coloured kite with bright patches.
- The multi-coloured scarf had patches in many shades.
