simpleMeaning: a legal paper signed, sealed, and handed over to pass what a person owns to a new owner
  and show the new owner's right to keep it
scope: This is a legal paper that passes what a person owns to a new owner and proves the right to own
  it; deed and title are other names for this sense, not a will and not a rental agreement.
examples:
- He signed the deed of conveyance before the house became his.
- The deed of conveyance was kept in a safe place after the sale.
