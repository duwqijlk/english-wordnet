senseId: 'regent%1:18:00::'
synsetId: 10535710-n
simpleMeaning: a person who rules a country when the king or queen cannot rule, is away, or is still too
  young to rule
scope: A person who rules for a time in place of the king or queen, not the king or queen themselves and
  not the word for acting in that role.
examples:
- The prince's uncle acted as regent while the prince was still a child.
- As regent, she ruled the country until the queen was old enough.
