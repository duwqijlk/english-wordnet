simpleMeaning: to send out light that switches on and off repeatedly
scope: This is light shining on and off, not the eye movement, the eyelid reflex or holding back tears;
  flash, wink, twinkle and winkle are other names for this sense.
examples:
- The lighthouse blinked every few seconds in the fog.
- The lights on the tower blinked in the distance.
