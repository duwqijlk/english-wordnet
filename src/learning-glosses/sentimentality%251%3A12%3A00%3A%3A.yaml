simpleMeaning: too much feeling or emotion, or feeling or emotion shown in a way that is not real
scope: This is feeling that is too much, or feeling shown in a way that is not real; not every strong
  feeling, and not love or sadness by itself.
examples:
- The film's sentimentality made the sad scene feel false.
- He disliked the sentimentality in her speech about the old days.
