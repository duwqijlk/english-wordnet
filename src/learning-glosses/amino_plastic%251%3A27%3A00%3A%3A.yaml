simpleMeaning: This resin sticks things together and coats paper and cloth; it is man-made, from chemicals
  built with nitrogen.
scope: Also called amino resin and aminoplast, this man-made resin sticks things together and coats paper
  and cloth, and is not a resin found in nature.
examples:
- The amino plastic held the two boards together.
- A coat of amino plastic covered the paper.
