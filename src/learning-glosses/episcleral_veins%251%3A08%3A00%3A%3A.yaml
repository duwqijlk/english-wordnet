simpleMeaning: They drain into the front blood tubes of the eye, these small blood tubes in the white
  of the eye near the edge of the clear front part
scope: It is also called venae episclerales, small blood tubes in the white of the eye near the clear
  front part.
examples:
- The episcleral veins lie in the white of the eye, near the edge of the cornea.
- Blood from the episcleral veins drains into the front ciliary veins.
