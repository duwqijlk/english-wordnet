simpleMeaning: a fat-like stuff that forms clear bits in natural fats and oils, joined to the thick part
  of fat, above all in coconut oil and palm-kernel oil
scope: 'Also called dodecanoic acid: a fat-like stuff in natural fats and oils, not the oil itself and
  not another fatty acid.'
examples:
- Lauric acid is found in coconut oil.
- The soap was made with lauric acid from palm-kernel oil.
