simpleMeaning: A machine that sorts the tiny bits of a sample by weight and draws a chart of what it finds
scope: A machine that sorts the tiny bits of a sample by weight and draws a chart of what it finds; not
  a balance, which only weighs, and not a microscope.
examples:
- The mass spectrograph drew a chart of the sample's parts.
- They ran the sample through a mass spectrograph.
