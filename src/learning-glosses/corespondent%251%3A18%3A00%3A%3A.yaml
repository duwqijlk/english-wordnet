simpleMeaning: In a divorce case, the person sued along with one partner in the marriage, said to have
  had sex with the other's husband or wife after they had parted.
scope: Also called a co-respondent, this is the person sued along with one partner in a marriage in a
  divorce case, charged with adultery with the other partner.
examples:
- The corespondent was named in the divorce papers.
- As corespondent, they had to answer the charge in court.
