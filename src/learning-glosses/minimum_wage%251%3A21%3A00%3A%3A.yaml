senseId: 'minimum_wage%1:21:00::'
synsetId: 13301538-n
simpleMeaning: A boss may not pay a worker less than this, an amount set by an agreement or by the law
scope: The smallest pay a boss is allowed to give, set by an agreement or by the law; not ordinary pay,
  and not the higher pay known as a living wage.
examples:
- The new minimum wage takes effect in January.
- She earned the minimum wage at her first job.
