simpleMeaning: a part of the body or an organ not being able to work as it should
scope: This is about a part of the body that cannot work as it should, not about a person who cannot do
  a job well.
examples:
- The incompetence of her heart valve meant some blood moved the wrong way.
- The test showed incompetence of the valve, so it let blood flow back.
