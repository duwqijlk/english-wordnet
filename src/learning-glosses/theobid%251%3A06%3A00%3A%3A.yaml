simpleMeaning: A clear crystal-like substance from tea leaves, or made in a lab, used in medicine to open
  the air tubes.
scope: 'Also called theophylline, Elixophyllin and Slo-Bid: a clear crystal-like substance from tea leaves
  used in medicine to open the air tubes, not a drug that stops pain and not a drug that kills germs.'
examples:
- Theobid helped him breathe more easily.
- The doctor gave her Theobid for her tight chest.
