simpleMeaning: Said of a thing that is woken up by the nerves or starts in them
scope: A thing that starts in the nerves or is woken up by them, not a thing that comes from a hurt to
  the body and not a thing that comes from the blood.
examples:
- The neurogenic pain started in the damaged nerve.
- Her neurogenic cough was set off by the nerves in her throat.
