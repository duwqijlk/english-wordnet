simpleMeaning: 'Comte''s positivist philosophy: gods and things beyond sense should give way to a ladder
  of sciences, from mathematics at the base to the study of society at the top.'
scope: Comte's positivist philosophy, with a ladder of sciences from mathematics at the base to the study
  of society at the top; kin to other philosophies of science.
examples:
- Comtism holds that science should replace talk of gods and hidden causes.
- In Comtism, sociology stands at the top of the ladder of sciences.
