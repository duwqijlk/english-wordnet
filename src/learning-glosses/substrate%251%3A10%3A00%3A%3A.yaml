senseId: 'substrate%1:10:00::'
synsetId: 06916475-n
simpleMeaning: A language of the first people of a place, whose sounds, words, and grammar pass into the
  tongue of newcomers who take over and force their own language on them.
scope: The first language of a place, giving sounds, words, and grammar to the tongue of newcomers who
  take over; not the stuff an enzyme acts on, not a layer lying under another, and not a surface a living
  thing grows on.
examples:
- The Celtic languages of Britain are a substrate for English.
- Scholars study the substrate to find old words still living in the new language.
