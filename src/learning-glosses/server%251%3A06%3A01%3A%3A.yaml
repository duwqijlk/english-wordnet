simpleMeaning: In computer science, one computer that lets other computers on a network use its files
  and printers
scope: In computer science, one computer that lets others on a network use its files and printers, also
  called host; not a person who brings food to a table and not the player who starts a point in a court
  game.
examples:
- The office server stores all our files.
- The printer is shared through the server.
