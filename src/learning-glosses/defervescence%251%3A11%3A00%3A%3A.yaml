senseId: 'defervescence%1:11:00::'
synsetId: 07383082-n
simpleMeaning: The lessening of a fever, shown by a fall in body temperature
scope: A fever going down, shown by a lower body temperature; not the fever itself and not a return to
  full health.
examples:
- After the medicine, defervescence set in and her temperature fell.
- The doctor watched for defervescence before sending him home.
