simpleMeaning: a tree of southern Florida and the West Indies that in time covers enormous areas, having
  begun high on another tree and sent many thick roots down through the air
scope: 'Also called golden fig and wild fig: a tree that starts life on another tree, not a fig grown
  for fruit and not a free-standing tree.'
examples:
- A strangler fig had wrapped its roots around the old palm.
- The strangler fig spread over a huge area of the garden.
