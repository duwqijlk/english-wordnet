simpleMeaning: A country strong enough to change what happens throughout the world
scope: A country whose strength shapes events throughout the world; power is another name for this sense,
  and its sway reaches across the whole world, not only its own land.
examples:
- The United States became a world power in the twentieth century.
- As a world power, Britain once shaped trade across the globe.
