simpleMeaning: unable to see for a while because strong light has bounced off white frozen ground or ice
  into the eyes
scope: Unable to see for a while after strong light off snow or ice, also called snow-blind; not a lasting
  loss of sight, and not a wound to the eye.
examples:
- She was snow-blinded after a long walk across the bright, icy field.
- The snow-blinded climber waited until his sight came back.
