simpleMeaning: This fenced place is where farm animals are kept, but only for a short time
scope: 'Also called holding pen and holding yard: a fenced place where farm animals are kept for a short
  time, not a field where they graze and not a barn where they sleep.'
examples:
- The cows waited in the holding paddock before the sale.
- Farmers moved the sheep to the holding paddock for the night.
