simpleMeaning: To catch a spreading sore.
scope: To catch a spreading sore, not the canker itself as a disease, an ulcer, or a malign influence,
  and not giving the disease to something else.
examples:
- The tree cankered after the wet spring.
- His lip cankered where the sore had formed.
