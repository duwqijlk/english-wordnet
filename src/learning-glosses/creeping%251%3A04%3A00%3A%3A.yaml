simpleMeaning: a slow way of moving on hands and knees, or by pulling the body along the ground
scope: 'Also called crawl, creep and crawling: this is moving slowly on hands and knees or low along the
  ground, not walking or running.'
examples:
- The baby's creeping took her slowly across the floor on her hands and knees.
- After hurting his leg, the man's creeping along the ground was slow and hard.
