senseId: 'restless_legs%1:26:00::'
synsetId: 14332821-n
simpleMeaning: an uneasy feeling in the lower limbs after going to bed, that can keep the person awake
  and may be eased for a while by walking or moving them
scope: Not a cramp in the lower limbs, and not plain lack of sleep; also called restless legs syndrome.
examples:
- Her restless legs kept her awake half the night.
- Walking round the room eased his restless legs for a while.
