simpleMeaning: A honey-making insect that cannot lay eggs, whose work is to gather food and look after
  the hive
scope: A honey-making insect that gathers food and tends the hive, not the egg-laying female and not the
  male that does no work.
examples:
- A worker bee danced to tell the others where the flowers were.
- Worker bees keep the hive clean and fed.
