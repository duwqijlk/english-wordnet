simpleMeaning: a small sharp point at the end of a plant stem or leaf, shaped like a spike
scope: A small sharp point on a plant stem or leaf, not a sharp point on an animal, not the row of bones
  in the back, and not any sharp point in general.
examples:
- The spine on the leaf pricked her finger.
- Wear gloves when you handle a plant with spines on its stems.
