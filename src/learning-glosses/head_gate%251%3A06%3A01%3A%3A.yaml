simpleMeaning: A control made of a valve or a door-like part that sets how fast water moves through a
  channel
scope: This is a control that sets how fast water moves through a channel, also called floodgate, penstock,
  sluice valve, sluicegate, and water gate, and not a lock that lifts boats between water levels.
examples:
- The head gate was opened to let water into the field.
- Workers closed the head gate to stop the flow.
