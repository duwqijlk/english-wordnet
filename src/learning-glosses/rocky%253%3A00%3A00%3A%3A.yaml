simpleMeaning: causing sudden, uneven shakes, or marked by such shakes and uneven movement
scope: 'Also called rough and bumpy: having or causing sudden, uneven shakes in movement, not full of
  rocks or stones.'
examples:
- The rocky ride shook us again and again.
- It was a rocky journey in the old bus, with a shake at every turn.
