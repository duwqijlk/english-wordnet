simpleMeaning: a long narrow piece of cloth worn under a collar and knotted at the front, mostly by men
scope: 'Also called tie: a piece of clothing worn at the front of the neck, not a knot in a rope and not
  an equal score in a game.'
examples:
- He wore a red necktie with his dark suit.
- She helped her father knot his necktie before the wedding.
