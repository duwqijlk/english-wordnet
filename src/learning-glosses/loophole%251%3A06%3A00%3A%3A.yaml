simpleMeaning: a small hole in a strong wall built for defence, used to look out or to shoot through
scope: This is a small hole in a strong defence wall for looking or shooting, not a gap in the words of
  a law or agreement that lets someone avoid a rule.
examples:
- Through the loophole in the castle wall, the guard could watch the road.
- The soldiers fired through a loophole in the thick wall.
