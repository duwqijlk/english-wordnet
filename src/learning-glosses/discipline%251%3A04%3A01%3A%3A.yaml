simpleMeaning: the act of punishing a person to gain control over that person or to make them obey
scope: The act of punishing someone to gain control over them or to make them obey, not training a child
  or animal over time to help them control themselves.
examples:
- The prisoners received harsh discipline after they broke the rules.
- Strict discipline was used to punish the soldiers who did not obey orders.
