simpleMeaning: To set out the key points.
scope: This sense is also called summarize, for setting out the key points, where summarize is to give
  the main points of a thing in a few words, unlike the sense for summing a thing up in short form.
examples:
- They summarise, setting out the key points.
- They summarise reports.
