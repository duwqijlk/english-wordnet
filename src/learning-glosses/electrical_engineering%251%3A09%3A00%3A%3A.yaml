simpleMeaning: the field of study that looks at how power is used, and at the machines that make power,
  send it out, and run machines and send messages
scope: The study of how power is used and of the machines that make and send it, not the study of power
  on its own and not the work of building one machine.
examples:
- He studied electrical engineering at the university before he joined the power company.
- Electrical engineering covers the design of the machines that send power to homes.
