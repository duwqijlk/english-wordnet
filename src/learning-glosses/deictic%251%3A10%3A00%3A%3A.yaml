simpleMeaning: a word that points to who or what is meant, or to where or when something is, as the speaker
  or hearer sees it in that talk
scope: 'Also called a deictic word: a word whose meaning shifts with who speaks and where and when, not
  a word with a fixed meaning, and not the act of pointing itself.'
examples:
- In 'this book here', the deictic 'this' points to the book near the speaker.
- The word 'tomorrow' is a deictic, since it means a different day each time it is used.
