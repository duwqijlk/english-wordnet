simpleMeaning: to grab something quickly and eagerly
scope: Also called snatch. This is grabbing something fast and eagerly; it is not speaking in an angry,
  sharp way, and not a sudden sharp sound.
examples:
- She snapped up the last ticket before anyone else could buy it.
- He snapped at the falling keys and caught them in one hand.
