simpleMeaning: one thickness of a substance that is usually the same all through
scope: One thickness of a substance that is usually the same all through, also called a bed; not a thin
  flat stretch over another, not a thin sheet of cells and not a hen that lays eggs.
examples:
- Spread a layer of jam over the toast.
- A layer of sand lay under the thin soil.
