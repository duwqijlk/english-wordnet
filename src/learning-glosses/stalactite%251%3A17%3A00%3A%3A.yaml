simpleMeaning: a long round piece of hard white stone that hangs down from the roof of a limestone cave
scope: A long piece of hard white stone hanging from a cave roof; not a piece that grows up from the cave
  floor.
examples:
- A stalactite hung from the roof of the cave.
- Water dripping from the stalactite left a white mark on the floor.
