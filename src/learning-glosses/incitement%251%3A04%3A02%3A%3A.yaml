senseId: 'incitement%1:04:02::'
synsetId: 01263983-n
simpleMeaning: Spurring people on, urging and rousing them until they act.
scope: An act that spurs people on and rouses them to act, not the thing itself that stirs them and not
  earnest persuasion.
examples:
- His incitement of the crowd led to a riot.
- The speech was an incitement to mutiny.
