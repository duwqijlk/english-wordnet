simpleMeaning: to tell many people about something in a way that makes it seem bigger or better than it
  is, often in a way that is not fully true
scope: To spread word about a thing in too strong a way, often not fully true; not the noun sense, which
  is the strong talk or advertising itself.
examples:
- The company hyped its new phone as the best ever made.
- They hyped the film for months before it came out, so everyone expected too much.
