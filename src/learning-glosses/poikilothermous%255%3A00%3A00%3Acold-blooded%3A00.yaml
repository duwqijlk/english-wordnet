simpleMeaning: For animals other than birds and mammals, the heat of the body goes up and down with the
  heat around it
scope: Also called ectothermic, heterothermic, or poikilothermic, this word says an animal that is not
  a bird or a mammal has body heat that goes up and down with the heat around it, not one whose heat stays
  the same.
examples:
- A poikilothermous lizard basks in the sun to warm its body.
- The poikilothermous frog's body heat rose as the pond warmed in the sun.
