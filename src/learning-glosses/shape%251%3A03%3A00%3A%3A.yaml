simpleMeaning: the way the parts of something are arranged in space, apart from what it is made of
scope: This is not the outward outline that you see, and not the condition of something.
examples:
- The artist repeated the same shape in bronze, wood and clay.
- The shape of the bowl matters more to her than the clay it is made from.
