simpleMeaning: Power that flows back and forth becomes power that flows one way, or the other way round,
  inside a machine that runs in step with the supply.
scope: It is also called rotary and synchronous converter, and it changes power from one kind to another.
examples:
- The rotary converter turned the alternating current into direct current.
- When the rotary converter ran the other way, it turned direct current back into alternating current.
