simpleMeaning: A low plant that lies flat on the ground, with heads of deep pink to white flowers, growing
  in sand dunes on the coast from British Columbia to Baja California.
scope: A low plant with heads of deep pink to white flowers, also called beach sand verbena and pink sand
  verbena; its nearest kin are other low plants of coastal sand dunes.
examples:
- Abronia umbellata spread flat across the sand dune with pink flower heads.
- We found Abronia umbellata growing in the dunes above the beach.
