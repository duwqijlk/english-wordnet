simpleMeaning: a plant grown for its thick root, which is good to eat and has a strong pleasant smell
scope: 'Also called celery root and knob celery: a plant grown for its thick root, which is good to eat
  and has a strong pleasant smell, not the root itself sold on its own and not common celery grown for
  its stalks.'
examples:
- We grew celeriac in the garden for its thick root.
- The cook dug up the celeriac and peeled its root for soup.
