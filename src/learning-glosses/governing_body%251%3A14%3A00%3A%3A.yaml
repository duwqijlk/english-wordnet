senseId: 'governing_body%1:14:00::'
synsetId: 08181484-n
simpleMeaning: The people, groups or departments that together run or manage something.
scope: 'Also called an organization or organisation, brass, administration, establishment or governance:
  the people, groups or departments that together run or manage something, not a single boss and not a
  court of law.'
examples:
- The governing body of the school met to set the budget.
- The club's governing body voted to change the rules.
