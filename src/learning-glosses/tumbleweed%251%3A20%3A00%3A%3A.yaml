simpleMeaning: A plant that comes away from its roots in autumn. The wind pushes it along, and it rolls
  as a light mass.
scope: This is any plant that breaks from its roots and rolls in the wind in autumn, not one named kind
  such as the prickly plant from Europe and Asia or the bushy weed of central North America.
examples:
- A tumbleweed rolled across the road, pushed by the autumn wind.
- Dry tumbleweeds broke from their roots and blew across the empty field.
