simpleMeaning: a unit for measuring area, the area of a shape with four equal sides, each one unit of
  length long; a centiare is one hundredth of an are
scope: A unit for measuring area, also called a centare and a square metre, not a unit for measuring length,
  and not a centiare, which is one hundredth of an are.
examples:
- The room measures twelve square meters.
- We need twenty square meters of carpet for the floor.
