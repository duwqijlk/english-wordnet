simpleMeaning: A tall, wide pine of the south-east United States, with needles in threes, reddish-brown
  cracked bark and a full, bushy top
scope: Also called frankincense pine and loblolly pine, this is a tall spreading south-east pine with
  needles in threes, not a small pine and not a pine with needles in pairs.
examples:
- The Pinus taeda shaded the whole garden.
- A Pinus taeda grew by the road.
