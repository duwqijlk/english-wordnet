simpleMeaning: the stone at the very bottom of an arch, where the curve of the arch starts
scope: This is the stone at the very bottom of an arch where its curve starts, not the top stone and not
  any stone in a wall.
examples:
- The impost of the old bridge was worn smooth by time.
- Each impost carries the weight of the arch above it.
