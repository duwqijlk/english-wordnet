simpleMeaning: People burn a bushy plant of the Old World's salt marshes and sea beaches, whose leaves
  are sharp, to make rough soda ash.
scope: Also called barilla, glasswort, kelpwort, and saltwort, this is a bushy plant of salt marshes burned
  for soda ash, not the fleshy glasswort of the seashore.
examples:
- They burned kali to make soda ash.
- Kali grows in the salt marshes by the sea.
