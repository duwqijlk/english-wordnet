simpleMeaning: Above all the line of mountain ridges in North America that runs from Alaska to Mexico,
  this is the high ground that splits the rivers of a land mass.
scope: This high ground splits the rivers of a land mass; above all it is the line of mountain ridges
  in North America that runs from Alaska to Mexico.
examples:
- The continental divide runs from Alaska to Mexico.
- The continental divide is a line of mountain ridges in North America.
