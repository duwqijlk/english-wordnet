senseId: 'fleur-de-lis%1:20:00::'
synsetId: 12432427-n
simpleMeaning: A plant whose leaves are shaped like swords and whose upright stems carry bright flowers,
  each with three petals and three sepals that hang down.
scope: This sense names the iris, also called flag, a plant with sword-shaped leaves and three-petalled
  flowers. It is not the lily-shaped emblem of the same name used in heraldry and ornament.
examples:
- A clump of fleur-de-lis grew beside the porch, and its flowers opened in May.
- She divided the fleur-de-lis in autumn so the plants would flower well the next spring.
