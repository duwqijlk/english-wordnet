simpleMeaning: the quality of keeping things clean, in place, and in good order
scope: 'Also called tidiness: the quality of keeping things clean and in good order, not one act of cleaning
  a thing at one time.'
examples:
- Her neatness showed in the clean, well-kept room.
- He is known at work for his neatness and care.
