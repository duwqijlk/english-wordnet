simpleMeaning: an act of saying openly that you have done wrong things or made mistakes
scope: An act of saying you did wrong. It is not telling a priest your wrong acts to be forgiven, not
  a signed paper saying you did wrong, and not a paper setting out what a church believes.
examples:
- He made a full confession to the police about the theft.
- Her confession that she had lied surprised everyone.
