simpleMeaning: A timber tree of warm America with dark hard heavy wood and small purple fruit like a small
  round fruit.
scope: This is a warm-American timber tree with dark heavy wood and small purple fruit, also called caimitillo,
  satin leaf, and satinleaf, not the small dark plum of Europe or a fruit tree grown only for eating.
examples:
- The damson plum gives dark hard wood for fine work.
- Damson plum trees grow in warm parts of America.
