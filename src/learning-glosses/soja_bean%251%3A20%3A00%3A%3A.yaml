simpleMeaning: An upright, bushy, hairy one-year plant with three-part leaves and purple or pink flowers;
  widely grown for food, feed and better soil, mainly for its oil-rich seeds; from Asia.
scope: Despite the word bean, this means the whole growing plant, not the edible seeds or the sauce made
  from them.
examples:
- The soja bean plant grows upright and bushy, with three-part leaves.
- Soja bean is widely grown for food, animal feed and soil improvement.
