simpleMeaning: The good feeling that comes from things that please the senses, at one end of the whole
  range of feelings.
scope: The good feeling that comes from things that please the senses, at one end of the whole range of
  feelings, not the quality of a thing that gives pleasure.
examples:
- The pleasantness of the warm room made them drowsy.
- She noted the pleasantness of the music as it drifted through the house.
