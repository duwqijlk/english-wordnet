simpleMeaning: A belief that turns away from the set teachings of a religion.
scope: Also called heresy; a belief that turns away from a religion's set teachings, not views that go
  against an official position in general and not the quality of being unorthodox.
examples:
- Her unorthodoxy led her to leave the church.
- The preacher denounced their unorthodoxy as a break with the faith.
