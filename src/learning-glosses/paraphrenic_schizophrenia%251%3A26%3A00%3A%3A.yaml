simpleMeaning: A psychiatric disorder with fixed false beliefs of persecution, grandeur or jealousy, plus
  anger, anxiety, detachment and gender doubt; unlike other types, patients usually look normal and function
  well.
scope: A long-term psychotic illness built around fixed false beliefs, not ordinary suspicion or a passing
  mood problem such as depression.
examples:
- Her diagnosis was paraphrenic schizophrenia, and she spoke calmly about the neighbours she believed
  were watching her.
- In paraphrenic schizophrenia, patients can seem well dressed and composed even while holding fixed delusional
  beliefs.
