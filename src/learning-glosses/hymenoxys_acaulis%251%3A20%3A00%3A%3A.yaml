simpleMeaning: A plant that lives for years, with bunched base leaves and short bare stalks each with
  one yellow flower head, on dry hillsides and plains of west central North America
scope: Also called stemless hymenoxys and Tetraneuris acaulis, this plant of dry hillsides and plains
  in west central North America has bunched base leaves and short bare stalks, each with one yellow flower
  head.
examples:
- Hymenoxys acaulis grows on dry hillsides in west central North America.
- The Hymenoxys acaulis has one yellow flower head on each stalk.
