senseId: 'purificator%1:06:01::'
synsetId: 92425413-n
simpleMeaning: A white linen cloth used to wipe the cup after each person at the holy meal has drunk from
  it.
scope: A white linen cloth for wiping the cup, also called emunctorium and purificatorium; not a cloth
  for the altar and not a napkin for the hands.
examples:
- The priest used the purificator to wipe the cup after each person drank.
- A clean purificator lay beside the cup on the altar.
