simpleMeaning: Wild animals, fish, and wild fruit and plants feed a group of people that moves from place
  to place most of the time.
scope: Also called a hunting and gathering tribe, this group of people feeds itself on wild food and moves
  from place to place.
examples:
- The hunting and gathering society moved from place to place.
- The hunting and gathering society lived by fishing and picking wild fruit.
