simpleMeaning: a piece of cloth used to make something look better, or to fix or cover a hole
scope: This is the piece of cloth itself, not the sewing that fixes a hole, not a cover for a hurt eye,
  and not a soft cover for a hurt part of the body.
examples:
- She sewed a bright patch onto her bag to make it look nicer.
- He put a patch over the hole in his jeans.
