simpleMeaning: a barrier the police set up to stop traffic on a road, to catch a person on the run or
  check it, or for other reasons
scope: A police barrier to stop traffic and catch a person on the run or check it, not a barrier thrown
  up against an enemy and not the act of blocking a way.
examples:
- The police set up a barricade across the main road.
- Cars waited at the barricade while officers checked each one.
