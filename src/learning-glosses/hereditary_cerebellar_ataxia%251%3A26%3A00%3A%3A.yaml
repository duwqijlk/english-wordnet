synsetId: 14115239-n
simpleMeaning: a nerve illness passed down in families, starting in late childhood or early adult life;
  it makes walking unsteady, speech halting or bursting out, and eyes move without control
scope: A nerve illness passed down in families that makes walking unsteady, not a one-time injury and
  not a muscle illness.
examples:
- Hereditary cerebellar ataxia runs in his family, and he began to walk unsteadily as a teenager.
- Doctors told her the hereditary cerebellar ataxia would make her speech halting at times.
