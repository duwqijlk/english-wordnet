simpleMeaning: cause a feeling, emotion, or reaction to appear in someone
scope: This sense is about making a feeling or reaction arise, not about lifting an object or increasing
  an amount.
examples:
- Her speech raised doubts about the plan.
- The story raised a few smiles among the children.
