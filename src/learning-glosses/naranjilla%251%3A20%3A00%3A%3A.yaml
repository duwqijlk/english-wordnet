simpleMeaning: A small shrub that lives more than two years, grown in the highlands of South America for
  its edible bright orange fruit similar to a tomato or an orange.
scope: A South American shrub grown for its fruit; it is not a tomato plant or an orange tree, though
  its bright orange fruit resembles both.
examples:
- Naranjilla is grown in the highlands of South America.
- The naranjilla bears bright orange fruit that looks like a tomato.
