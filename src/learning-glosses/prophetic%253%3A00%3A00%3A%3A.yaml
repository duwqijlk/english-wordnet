simpleMeaning: showing or telling what will happen in the future, as if a power beyond nature made it
  known
scope: 'Also called prophetical: it tells what is to come as if shown by a power beyond nature, not as
  a plain guess or a weather report about what may happen.'
examples:
- Her prophetic words came true many years later.
- He had a prophetic dream about the fire.
