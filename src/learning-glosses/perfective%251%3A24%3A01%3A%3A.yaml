simpleMeaning: a verb form used for an action that is seen as finished
scope: 'Also called perfect, perfect tense and perfective tense: a verb form for an action seen as finished,
  not a form for an action still going on and not a form for a future action.'
examples:
- In the sentence, 'has gone' is a perfective.
- The perfective shows the action as complete.
