  often linked with illness.
scope: A lasting unnatural swelling of the small glands that filter the body's clear fluid, most often
  linked with illness; not a brief swelling after a knock.
examples:
- Lymphadenopathy in his neck led the doctor to order blood tests.
- The patient had lymphadenopathy that lasted for months.
