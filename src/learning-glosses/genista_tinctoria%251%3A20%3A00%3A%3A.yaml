simpleMeaning: A small shrub from Europe and Asia with groups of yellow flowers that give a dye; often
  a weed in Britain and the United States, and sometimes grown for beauty.
scope: Also called whin, dyer's-broom, dyer's greenweed, dyeweed, greenweed, woadwaxen or woodwaxen; a
  small shrub with groups of yellow flowers that give a dye, often a weed in Britain and the United States.
examples:
- Genista tinctoria grew along the path, its yellow flowers bright in the sun.
- The gardener planted Genista tinctoria for its yellow flowers.
