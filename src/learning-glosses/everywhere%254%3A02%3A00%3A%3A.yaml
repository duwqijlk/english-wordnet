simpleMeaning: In any or all places, or to any or all places, used as a pronoun of place.
scope: This refers to place, not time, and it means all places rather than just many or some.
examples:
- I looked everywhere for my keys but could not find them.
- Cheap phone cases are sold everywhere these days.
