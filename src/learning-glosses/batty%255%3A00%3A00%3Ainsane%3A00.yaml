senseId: batty%5:00:00:insane:00
synsetId: 02082059-s
simpleMeaning: in informal or slang talk, describes a person whose mind does not work in a normal way
scope: 'Also called cracked, nuts, buggy, bats, crackers, daft, nutty, dotty, loopy, fruity, balmy, wacky,
  bonkers, haywire, loony, barmy, loco and kooky: a loose, joking word for a mind that does not work in
  a normal way, not a doctor''s word for a sickness of the mind.'
examples:
- The noise from the street was driving her batty.
- He went a little batty after weeks without sleep.
