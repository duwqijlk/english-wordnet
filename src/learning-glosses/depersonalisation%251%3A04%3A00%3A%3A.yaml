simpleMeaning: Showing a human as a mere thing, stripped of personal marks or selfhood.
scope: Showing a human as a mere thing, stripped of personal marks or selfhood; not a feeling disorder
  in which one loses touch with one's own personal reality, with feelings of unreality and strangeness,
  nor, in existentialism, a loss of personal self, a feeling of being a nameless cog in a cold social
  machine.
examples:
- Their depersonalisation showed at dawn.
- The depersonalisation was plain at noon.
