simpleMeaning: tending to draw a person into a wanted action or state by making it seem good
scope: This sense describes a power to draw a person toward a wanted act or state; it is not a name for
  the act or state itself.
examples:
- The seductive offer of easy money led him to sign at once.
- A seductive calm filled the room and made them want to stay.
