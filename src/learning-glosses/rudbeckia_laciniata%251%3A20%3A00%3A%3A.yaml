simpleMeaning: A tall leafy plant with upright branches and large yellow flower heads whose rays arch
  down; it grows in the Rocky Mountains south to Arizona and east to the Atlantic.
scope: Also called cutleaved coneflower; not a low ground plant.
examples:
- The Rudbeckia laciniata bloomed yellow along the mountain trail.
- We saw Rudbeckia laciniata growing east to the Atlantic coast.
