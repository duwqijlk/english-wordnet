simpleMeaning: To do with, or marking, the perching birds.
scope: To do with, or marking, the perching birds; not perching birds, mostly small and living near the
  ground with feet with four toes set to grip the perch, most songbirds, young helpless.
examples:
- Their bird was passerine at dawn.
- The finch was passerine by nature.
