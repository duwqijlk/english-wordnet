simpleMeaning: A thick muscle of a pair from breast bone and collar bone to the skull's rear, swinging
  the head sideways across, flexing neck and extending head together.
scope: Also called musculus sternocleidomastoideus, sternocleido mastoideus, and sternocleidomastoid,
  this is a thick muscle of a pair from breast bone and collar bone to the skull's rear, swinging the
  head sideways across, flexing neck and extending head together, where musculus sternocleidomastoideus
  is one of a pair of thick muscles running from the chest bones to the back of the head, that swings
  the head toward the far side and, acting as one, bends the neck and tips the head back.
examples:
- The sternocleidomastoid muscle turns the head.
- A sore sternocleidomastoid muscle stiffens the neck.
