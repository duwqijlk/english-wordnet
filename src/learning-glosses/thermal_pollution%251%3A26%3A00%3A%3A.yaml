simpleMeaning: harm to lakes and rivers when too much waste heat is let out into the water
scope: Harm to lakes and rivers from too much waste heat in the water, not dirt or chemicals in the water
  and not harm to the air or land.
examples:
- Thermal pollution killed many fish when the hot water reached the river.
- The plant was fined for thermal pollution after it let too much heat into the lake.
