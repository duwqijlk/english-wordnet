simpleMeaning: in physics, how quickly work is done, measured in watts, that is, joules each second
scope: This is a measurement in physics, not electricity supplied to a home, physical strength, the ability
  to influence others, or a number showing how many times a value is multiplied by itself.
examples:
- This motor has a power of 500 watts.
- The power needed to lift the load can be measured in watts.
