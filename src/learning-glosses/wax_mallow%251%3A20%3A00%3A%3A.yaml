simpleMeaning: like hibiscus flowers not yet fully open, bright flowers shaped like bells droop from any
  of several plants of the group Malvaviscus
scope: Also called sleeping hibiscus or waxmallow; a plant whose bright bell-shaped flowers droop like
  half-open hibiscus buds, not a hibiscus itself.
examples:
- The wax mallow in the garden bore bright bells that drooped in the heat.
- A wax mallow flower looks like a hibiscus bud that never fully opens.
