simpleMeaning: Marks like the wounds of Christ on the cross appear on the body of this person, as signs
  of faith.
scope: Stigmatic is another name for a person whose body bears such marks.
examples:
- The stigmatist's hands bore marks like the wounds of Christ.
- The marks on the stigmatist's body were like the wounds of Christ on the cross.
