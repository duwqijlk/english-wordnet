simpleMeaning: How much power sound, light, or other waves of energy send out
scope: How much power sound or light sends out, also called intensity or strength; not how loud a sound
  feels to the ear, and not the power of a machine.
examples:
- He turned the radio down to lower the intensity level of the sound.
- They measured the intensity level of the station's signal.
