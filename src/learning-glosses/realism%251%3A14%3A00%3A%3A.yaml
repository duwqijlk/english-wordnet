simpleMeaning: A way of making art and writing in France in the 1800s, in which artists and writers tried
  to show life in full, true detail
scope: A French art movement of the 1800s, not the everyday habit of facing facts and not the philosophy
  about things existing unseen.
examples:
- Realism changed how painters showed working people in France.
- The novel is an example of realism, with no softening of hard facts.
