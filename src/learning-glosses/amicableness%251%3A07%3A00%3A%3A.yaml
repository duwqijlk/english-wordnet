simpleMeaning: a warm and friendly way of being with other people
scope: This is a warm, friendly way of acting toward people; amicability is another name for this sense,
  not just one friendly act or a short mood.
examples:
- Her amicableness made everyone in the office feel at ease.
- People liked his amicableness and trusted him at once.
