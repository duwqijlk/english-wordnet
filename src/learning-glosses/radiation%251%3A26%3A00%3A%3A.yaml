synsetId: 14331899-n
simpleMeaning: 'Illness from high-energy rays from radioactive chemicals or nuclear blasts: small doses
  cause diarrhea, nausea, vomiting, hair loss; larger doses cause sterility, cataracts, cancers; the worst
  cases kill within hours.'
scope: This is the illness that follows too much high-energy ray exposure, not the rays or energy themselves,
  the act of spreading outward, or the treatment of disease with radioactive material.
examples:
- The workers were treated for radiation after the reactor leak.
- At low doses, radiation causes nausea and hair loss.
