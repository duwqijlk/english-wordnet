simpleMeaning: a brown bird with spots, from Europe, known for singing while it stays in one place high
  in the air
scope: This sense is the bird itself, a small brown bird from Europe that sings high in the air; it is
  not a person and not an action or game.
examples:
- We heard a skylark singing high above the fields.
- A skylark rose into the sky and sang while it stayed there.
