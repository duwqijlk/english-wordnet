senseId: 'louver%1:06:00::'
synsetId: 03698002-n
simpleMeaning: One of a row of flat strips set side by side in a door or window, letting air through but
  keeping rain out.
scope: 'Also called a fin: one of the flat strips in a door or window that let air in and keep rain out,
  not the whole shutter.'
examples:
- Rain rattled on the louver above the door.
- He opened the louver to let the hot air out.
