simpleMeaning: paper made by cutting the plant into thin strips and pressing them flat, used long ago
  by people in Egypt, Greece and Rome
scope: This is the paper itself, not the tall plant it comes from and not a piece of writing on such paper.
examples:
- Ancient Egyptians wrote on sheets of papyrus.
- Workers made papyrus by pressing thin strips of the plant flat.
