simpleMeaning: A set of letters and numbers added to a postal address to help sort the mail.
scope: Not the street address itself, nor the name of the town; also called a postcode, a postal code
  and a ZIP code.
examples:
- Write your ZIP on the envelope.
- The ZIP helps the post office sort the mail.
