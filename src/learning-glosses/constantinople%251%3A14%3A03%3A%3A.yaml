simpleMeaning: The church meeting in 869 that ruled against Photius, who had become head of the eastern
  church without the Pope's approval, and so split the eastern and western churches.
scope: 'Also called the Fourth Council of Constantinople: the church meeting in 869 that judged Photius,
  not the councils of 381, 553 or 680-681.'
examples:
- The Constantinople council of 869 ruled against Photius for taking office without the Pope's approval.
- The Constantinople council of 869 split the eastern and western churches.
