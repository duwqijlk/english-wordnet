simpleMeaning: A group of Greek Cypriots wants Cyprus to join Greece, so the two become one
scope: The joining of Greece and Cyprus so the two become one, the aim of a group of Greek Cypriots, not
  the joining of two other countries and not a wish for Cyprus to stand alone.
examples:
- Enosis was the dream of many Greek Cypriots in the last century.
- The supporters of enosis wanted Cyprus to join Greece.
