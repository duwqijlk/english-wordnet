senseId: 'sensitivity%1:07:00::'
synsetId: 05026827-n
simpleMeaning: the power to answer things that act on the body, or to pick up very small amounts or small
  changes in them
scope: The power to notice physical things and tiny changes in them, not the body's general power to feel
  and not feeling what others feel.
examples:
- A galvanometer of extreme sensitivity can pick up the smallest current.
- The sensitivity of Mimosa leaves does not depend on a change of growth.
