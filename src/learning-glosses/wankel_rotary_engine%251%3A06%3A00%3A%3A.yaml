simpleMeaning: A motor with a part that turns round inside it and burns fuel in four steps, with no parts
  that move back and forth
scope: 'Also called an epitrochoidal engine and a Wankel engine: a motor whose inner part turns round
  as it burns fuel in four steps, not a motor with pistons that move up and down.'
examples:
- The Wankel rotary engine was first built in Germany in the 1950s.
- Her car has a Wankel rotary engine instead of an ordinary piston engine.
