senseId: 'eating_away%1:22:00::'
synsetId: 13496741-n
simpleMeaning: In geology, the mechanical wearing or grinding down of a thing by bits of matter washed
  over it, also used in a non-literal way
scope: A wearing or grinding down of a thing, also called wearing, eroding, erosion and wearing away;
  not a bite taken out of food and not a hole made by an animal.
examples:
- The eating away of the cliff by the sea took many years.
- The eating away of the paint showed where the rain had worn it down.
