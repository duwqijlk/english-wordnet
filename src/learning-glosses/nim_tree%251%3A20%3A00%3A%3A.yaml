simpleMeaning: A big tree of the East Indies, semi-evergreen, with sticky gum in its trunk, bitter tonic
  bark, seeds full of aromatic oil, and sometimes classed in the genus Melia.
scope: One of several names for this tropical tree, also called arishth, margosa and neem; not the aromatic
  oil pressed from its seeds.
examples:
- A nim tree stood at the edge of the village and gave shade to the cattle.
- The nim tree can grow very large and keeps most of its leaves.
