simpleMeaning: To take a part off by the natural process that makes it drop away
scope: To take a part off by the natural process that makes it drop away, not to shed leaves and fruit
  on its own and not to cut a part off with a knife.
examples:
- The gardener will abscise the dead branch at its base.
- Winds can abscise the fruit before it ripens.
