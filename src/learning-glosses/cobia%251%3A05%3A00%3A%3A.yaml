simpleMeaning: a large tropical fish with dark stripes, caught for food and sport, kin to the remora,
  found all over the world from shore waters to the open sea
scope: A large tropical fish with dark stripes, caught for food and sport, kin to the remora, found all
  over the world from shore waters to the open sea; sergeant fish is another name for this, not the remora
  itself and not a small striped fish of one shore only.
examples:
- Fishermen caught a cobia off the coast.
- The cobia is a large striped fish.
