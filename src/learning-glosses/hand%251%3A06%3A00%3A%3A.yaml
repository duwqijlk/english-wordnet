simpleMeaning: one of the moving pointers on the front of a clock or watch
scope: This is a moving pointer on a clock, not a body part, a unit of length, or a round of applause.
examples:
- The minute hand crept slowly toward twelve as the exam drew to a close.
- The clock on the wall had lost a hand, so it showed the wrong time.
