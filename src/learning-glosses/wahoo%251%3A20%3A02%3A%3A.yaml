simpleMeaning: Deep red pods and seeds grow on an upright plant that loses its leaves in winter, found
  from New York to Florida and Texas in the eastern United States.
scope: Also called strawberry bush, it is an upright plant with deep red pods and seeds, not the shrub
  with purple cases holding scarlet seeds.
examples:
- We saw a wahoo with deep red pods and seeds.
- A wahoo in the eastern United States bore crimson pods and seeds.
