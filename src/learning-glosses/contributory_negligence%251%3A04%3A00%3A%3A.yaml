simpleMeaning: In law, behaviour by the person bringing the case that helps cause the harm from the other
  side's carelessness
scope: In law, behaviour by the person bringing the case that helps cause the harm from the other side's
  carelessness; not carelessness by the other side alone, and not an accident with no one at fault.
examples:
- The court found contributory negligence because the driver had ignored the warning signs.
- Her contributory negligence weakened her claim for damages after the crash.
