simpleMeaning: a person who looks up to someone with respect and liking, and thinks well of them
scope: A person who thinks well of someone, not one who backs a politician or a team, and not a lover
  of a young woman.
examples:
- He is a great admirer of her paintings.
- The singer waved to her admirers in the front row.
