simpleMeaning: the wide vein from the head and arm takes blood from a channel that winds through holes
  in the neck bones and wraps the spine's artery in a net
scope: 'Also called vena vertebralis: a blood channel that drains into the wide vein from the head and
  arm; not a vein of the arm or leg.'
examples:
- The vertebral vein runs through the neck bones beside the artery.
- Blood from the vertebral vein drains into a wide vein in the chest.
