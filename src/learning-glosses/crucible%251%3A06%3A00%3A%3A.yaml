simpleMeaning: a pot made of something that does not melt easily, used for making chemicals change at
  very high heat
scope: This is a pot for very hot work with chemicals, also called a melting pot, not a pot for cooking
  food.
examples:
- They put the chemicals in a crucible and heated them until they changed.
- A crucible must not melt when it gets very hot.
