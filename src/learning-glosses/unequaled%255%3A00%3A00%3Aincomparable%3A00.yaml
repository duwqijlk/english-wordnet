synsetId: 00507765-s
simpleMeaning: Utterly its own, with no equal.
scope: This sense is also called unique, alone, unparalleled, and unequalled, for being utterly its own,
  with no equal, where unique is so unlike anything else that nothing can match or equal it, and alone
  is so different and outstanding that nothing else comes close.
examples:
- The feat was unequaled, utterly its own.
- The voice was unequaled, with no equal.
