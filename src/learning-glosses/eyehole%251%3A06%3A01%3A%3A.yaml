simpleMeaning: a hole in a door, oven, or such thing, that you can look through
scope: 'Also called peephole and spyhole: a hole to look through in a door or oven, not a small hole in
  cloth or leather for a cord, hook, or bar.'
examples:
- He looked through the eyehole in the door to see who was outside.
- The oven has a small eyehole so you can watch the food.
