simpleMeaning: A secret group in Sicily that used terror, at first against harsh rulers, then a gang of
  lawbreakers by the 1850s.
scope: The secret Sicilian group that turned from fighting rulers to crime, also called Maffia and the
  Sicilian Mafia; not the American crime group of the same name.
examples:
- The Mafia in Sicily began by fighting harsh rulers.
- By the 1850s the Mafia had become a gang of lawbreakers.
