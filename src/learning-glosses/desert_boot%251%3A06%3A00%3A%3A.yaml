simpleMeaning: a tall shoe that covers the leg up to halfway between the foot and the knee
scope: This is a tall shoe that stops halfway up to the knee; buskin, combat boot and half boot are other
  names for it, not a low shoe and not a boot that reaches the knee.
examples:
- His desert boots reached halfway up to his knees.
- She laced up her desert boots before setting out across the dry plain.
