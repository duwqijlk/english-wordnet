simpleMeaning: In farming, a way of working a set piece of land so it grows more, by spending more money
  and work on it
scope: In farming, a way to get more from the same land, not the word for a strong feeling and not the
  small word that adds force.
examples:
- Intensive agriculture on the small farm used more workers and money per acre.
- Intensive conditions on the farm raised the yield from the same fields.
