simpleMeaning: most often a creature with wings that swims and has feet joined by skin between the toes
scope: A swimming creature with wings and feet joined by skin between the toes, not a bird that walks
  on land and not a bird that lives in trees.
examples:
- The anseriform bird glided across the lake with its webbed feet.
- We watched an anseriform bird dive under the water for food.
