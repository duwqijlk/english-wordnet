simpleMeaning: in a way that is not smooth or even
scope: 'Also called unevenly: this sense is about doing something in a way that is not smooth or even.
  It is not about the rough look of a thing, and not about doing something at times that are not regular.'
examples:
- She breathed raggedly after running up the stairs.
- His voice came out raggedly, loud, then soft, then loud again.
