simpleMeaning: a light jacket that closes with one row of buttons, often with stripes in the colours of
  a club or school
scope: 'Also called a blazer, a sport coat, a sport jacket, or a sports jacket: a light jacket that closes
  with one row of buttons, not a suit jacket and not a heavy coat for cold weather.'
examples:
- He wore his sports coat over a plain shirt.
- Her sports coat had stripes in the colours of her school.
