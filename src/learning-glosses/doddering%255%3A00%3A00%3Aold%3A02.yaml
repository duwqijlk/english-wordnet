simpleMeaning: weak in mind or body because of old age
scope: Weak in mind or body from old age, also called senile, gaga and doddery; not just old in years,
  and not tired for a short time.
examples:
- His doddering grandfather often forgot the names of people he knew well.
- The doddering old man walked slowly and held a stick for support.
