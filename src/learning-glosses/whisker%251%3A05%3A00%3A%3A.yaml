simpleMeaning: a long, stiff hair that grows near the nose and mouth or above the eyes of most mammals
  (animals that feed their young with milk), such as a cat
scope: One long, stiff hair on an animal's face, not the act of giving something such hairs.
examples:
- The cat's whiskers touched the sides of the bowl.
- A whisker on the dog's face bent as it pushed through the fence.
