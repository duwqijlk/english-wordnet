simpleMeaning: A small slow-growing mountain pine of the Rocky Mountains, with dense branches, cracked
  rust-brown bark, short needles in bunches of 5 and thorn-tipped cone scales; some over 4500 years old.
scope: Also called bristlecone pine and Rocky Mountain bristlecone pine; a slow-growing mountain pine,
  not a tall pine of the lowlands and not a fir.
examples:
- Pinus aristata grows slowly in the Rocky Mountains.
- Some Pinus aristata trees are over 4500 years old.
