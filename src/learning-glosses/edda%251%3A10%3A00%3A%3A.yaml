simpleMeaning: one of two old Icelandic books from the late 1200s, of 34 old myth stories and hero songs
  written between 800 and 1200, the main source for old Norse myth
scope: Either of two old Icelandic books of myth and hero tales, the main source for Norse myth; not a
  saga and not a modern retelling.
examples:
- The Edda tells the old story of the gods in verse.
- Students read the Edda to learn about Norse myths.
