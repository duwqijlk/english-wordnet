senseId: 'quixotically%4:02:00::'
synsetId: 00440193-r
simpleMeaning: acting on high ideals without thought for what is practical
scope: Acting on high ideals without thought for what is practical, not acting with care for the result
  and not acting to win praise.
examples:
- He quixotically refused to clear himself by betraying his colleagues.
- She quixotically gave her savings to a stranger's cause.
