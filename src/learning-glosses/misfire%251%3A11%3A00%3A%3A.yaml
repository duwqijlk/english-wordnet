simpleMeaning: a blast that was meant to happen but does not happen
scope: 'Also called dud: a blast that never goes off, not a gun failing to fire and not a plan going wrong.'
examples:
- When the fuse burned down, the result was a misfire, with no explosion at all.
- The engineers recorded a misfire during the test because the charge did not explode.
