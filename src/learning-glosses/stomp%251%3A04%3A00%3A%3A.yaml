simpleMeaning: a dance with a step that follows a beat, where the foot comes down hard on the floor
scope: This is a kind of dance with a hard step that follows a beat. It is not just walking or putting
  a foot down hard outside a dance.
examples:
- The dancers did a lively stomp in the hall.
- She learned a stomp with a strong, heavy step.
