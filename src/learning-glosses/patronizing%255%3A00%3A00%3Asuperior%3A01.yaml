simpleMeaning: used of the way a person acts or thinks when they treat other people as if they were less
  important
scope: 'Also called arch, condescending and patronising: used of behaviour or an attitude that treats
  other people as less important, not kind help or support for a person.'
examples:
- She gave a patronizing smile and spoke to him like a small child.
- His patronizing tone made the new workers feel small.
