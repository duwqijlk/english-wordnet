schema: oewn-learning-gloss-v2
senseId: 'indicate%2:32:03::'
synsetId: 00925764-v
simpleMeaning: To show a place, a direction, a person, or a thing, in real space or in a way that is not
  in real space
scope: Also called point and show, this means to make clear where or what something is, not to do the
  thing yourself and not to guess at it.
examples:
- He indicated the empty seat with a nod.
- She indicated her friend in the crowd by waving.
