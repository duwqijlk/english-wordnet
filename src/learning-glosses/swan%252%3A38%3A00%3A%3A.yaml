simpleMeaning: to move about with no aim and no fixed place to go to, often looking for food or work
scope: 'Also called range, roll, cast, drift, wander, stray, roam, tramp, and ramble: to move about with
  no fixed place to go to; not the large water bird, and not saying in a formal way that something is
  true.'
examples:
- He swanned from town to town, looking for work.
- They spent the summer swanning around the country with no plan.
