simpleMeaning: any of several plants of the group Trichostema with rings of small sky-coloured flowers
scope: Any of several plants of the group Trichostema with rings of small sky-coloured flowers, not a
  plant with single large flowers and not a plant with red flowers.
examples:
- Blue curls grew in a dry patch by the road.
- The blue curls opened their small flowers in the sun.
