simpleMeaning: low shoes that are easy to put on and take off and are worn inside the house most of the
  time
scope: 'Also called a slipper: low shoes for inside the house, not boots or outdoor shoes.'
examples:
- She put on her carpet slippers before she walked to the kitchen.
- My carpet slippers are easy to slip on when I get out of bed.
