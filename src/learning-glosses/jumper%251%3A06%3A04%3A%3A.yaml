simpleMeaning: Clothing for the upper body, worked from yarn by hook or by needle
scope: A top worked from yarn for the upper body, also called a sweater; not the sleeveless dress, not
  the workman's jacket, and not the small electric connector.
examples:
- She pulled on a jumper against the evening chill.
- His jumper was knitted from thick grey wool.
