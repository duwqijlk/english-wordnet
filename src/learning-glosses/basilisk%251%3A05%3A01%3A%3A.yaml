simpleMeaning: a small lizard with a crest (a raised part) on its head, that lives in trees in tropical
  America and can run on its back legs
scope: This sense is a real small lizard of tropical America, not the animal in old stories that is not
  real and could kill with its breath or its look.
examples:
- We saw a basilisk resting on a branch in a forest in Costa Rica.
- The basilisk lifted the crest on its head and ran off on its back legs.
