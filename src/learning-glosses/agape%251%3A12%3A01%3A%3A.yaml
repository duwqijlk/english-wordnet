simpleMeaning: In Christian theology, the love of God or Christ for all people
scope: In Christian teaching, this is the love of God or Christ for people, not one person's love for
  another person.
examples:
- In church they spoke of God's agape for all people.
- Christ's agape is shown in his care for mankind.
