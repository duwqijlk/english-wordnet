simpleMeaning: a hardy plant living year after year, whose flowers rise in tall straight bunches and whose
  new plants sprout at the joint where leaf and stalk meet
scope: Also called a pickaback plant and youth-on-age; a plant whose young sprout at the joint of leaf
  and stalk, not a plant that spreads by runners.
examples:
- The piggyback plant on the windowsill had baby plants on its leaves.
- She gave me a piggyback plant because its young grow on the old leaves.
