simpleMeaning: The skill of using ways of working with pictures made by light to turn them into flat blocks
  for printing.
scope: The skill of turning pictures made by light into flat blocks for printing; not the plates themselves,
  not ordinary printing, and not the wider process of making printing surfaces, plates or cylinders alike,
  by photographic means.
examples:
- He studied photomechanics at the print works.
- Photomechanics let the shop print photos in the paper.
