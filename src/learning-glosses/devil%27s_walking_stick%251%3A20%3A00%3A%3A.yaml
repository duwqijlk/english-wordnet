simpleMeaning: a small tree or bush in the east of the United States that loses its leaves each year and
  grows in thick groups
scope: A small tree or bush in the east of the United States that loses its leaves each year and grows
  in thick groups; not a walking stick and not a devil.
examples:
- The devil's walking stick grew in thick clumps at the edge of the wood.
- In autumn, the devil's walking stick lost its leaves early.
