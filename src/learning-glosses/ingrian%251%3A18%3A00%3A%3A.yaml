simpleMeaning: A person from a Finnish people of the west who once lived in the Baltic land where Saint
  Petersburg was built
scope: This is a member of a western Finnish people who once lived in the Baltic land where Saint Petersburg
  was built; Inger and Ingerman are other names for this sense, not the language of the same name and
  not a Finn of today.
examples:
- The old Ingrian had lived all his life near Saint Petersburg.
- An Ingrian family once farmed in that Baltic province.
