simpleMeaning: skin that has grown hard and thick from long wear, with hard patches from rubbing or use
scope: Hard skin that has worn tough with use, not a liquid made thick in consistency and not a part that
  has simply become thick.
examples:
- The thickened skin on his heels came from years of walking barefoot.
- Her thickened palms showed hard patches from years of gripping tools.
