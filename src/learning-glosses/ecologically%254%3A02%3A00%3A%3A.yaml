simpleMeaning: in a way that is about living things, the natural world, and how they affect each other
scope: This is about living things, the natural world, and how they affect each other. It is not about
  money and business, and not about health or the body alone.
examples:
- Ecologically, building a dam here would harm the fish and plants in the river.
- The farm is ecologically sound because it keeps the soil and water clean.
