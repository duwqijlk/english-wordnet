senseId: 'conspicuously%4:02:00::'
synsetId: 00372716-r
simpleMeaning: in a way that draws attention and is easy for people to notice
scope: Done in a way that people notice at once; not in a quiet way that is hard to see or notice.
examples:
- He stood conspicuously at the front of the room in a bright red coat.
- The sign was placed conspicuously by the door so everyone would see it.
