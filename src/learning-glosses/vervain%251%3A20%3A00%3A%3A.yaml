simpleMeaning: any of many plants from warm or very warm parts of America, in the Verbena group, grown
  for their long, thin heads of bright flowers in many colours
scope: 'Also called verbena: the plant itself, grown for its bright flowers, not a tree and not a plant
  grown mainly for food.'
examples:
- She planted vervain in the garden for its tall purple flowers.
- The vervain by the fence drew bees all summer.
