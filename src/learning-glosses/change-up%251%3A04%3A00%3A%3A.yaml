senseId: 'change-up%1:04:00::'
synsetId: 00108504-n
simpleMeaning: a slow ball thrown when the batter is waiting for a fast one
scope: A slow ball thrown when the batter is waiting for a fast one; change-of-pace, change-of-pace ball
  and off-speed pitch are other names for this sense, not a fastball and not a wild pitch.
examples:
- He struck out on a change-up.
- The change-up came in much slower than he expected.
