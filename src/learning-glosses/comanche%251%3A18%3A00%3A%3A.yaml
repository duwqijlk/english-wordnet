simpleMeaning: A person of the Shoshonean people, who once lived from Wyoming to the Mexican border and
  now live mostly in Oklahoma.
scope: A member of the Shoshonean people, set apart from the Comanche language by its sense of a person,
  not a tongue.
examples:
- The Comanche once lived across the plains.
- Many Comanche now live in Oklahoma.
