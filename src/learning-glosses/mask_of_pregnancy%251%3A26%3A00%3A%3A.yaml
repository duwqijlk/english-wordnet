simpleMeaning: a tan change of colour on a woman's face linked to being with child or to taking birth-control
  pills
scope: A tan change of colour on a woman's face; melasma and chloasma are other names for this sense,
  not a sunburn and not a mark present from birth.
examples:
- The mask of pregnancy faded after her baby was born.
- She noticed a mask of pregnancy during her second pregnancy.
