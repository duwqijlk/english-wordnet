simpleMeaning: In informal or slang talk, describes a person whose mind does not work in a normal way
scope: This is an informal or slang way to describe a person whose mind does not work in a normal way;
  nuts is another name for this sense. It is not the sense about paint with a rough, broken surface.
examples:
- His family worried that he had gone cracked and could not think clearly.
- People called him cracked because he talked to walls and heard replies.
