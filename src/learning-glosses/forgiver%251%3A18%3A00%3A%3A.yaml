simpleMeaning: A person who lets a wrong go, pardoning a fault or an offense.
scope: A person who lets a wrong go; excuser and pardoner are other names for this sense, not a judge
  and not a person who takes revenge.
examples:
- She was a forgiver who never held a grudge for long.
- The forgiver shook his hand and said the matter was closed.
