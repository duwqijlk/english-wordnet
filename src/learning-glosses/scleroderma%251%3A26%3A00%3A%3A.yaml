simpleMeaning: The skin grows thick with stringy tissue in this sickness, in which the body's own defence
  attacks the blood tubes and the tissue that joins parts.
scope: Also called dermatosclerosis, this is a sickness in which the body's own defence attacks the blood
  tubes and the tissue that joins parts.
examples:
- Scleroderma had made her skin thick with stringy tissue.
- The doctor said scleroderma was attacking her blood vessels and the tissue that joins parts.
