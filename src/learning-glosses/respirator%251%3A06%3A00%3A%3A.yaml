simpleMeaning: A machine that breathes for a person over a long time when they cannot breathe alone.
scope: A machine that keeps breathing for a person over a long time, not a face mask that filters bad
  air.
examples:
- The patient was put on a respirator after the operation.
- He stayed on a respirator for three weeks.
