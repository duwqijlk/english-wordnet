scope: 'Also called margin and allowance: an allowed difference with room to move, not putting up with
  other people''s beliefs and not a living thing''s power to bear hard conditions.'
examples:
- The parts were made with a tolerance of half a millimetre.
- The machine allows a small tolerance in the size of each part.
