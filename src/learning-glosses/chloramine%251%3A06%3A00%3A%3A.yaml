simpleMeaning: one of a group of chemicals made of chlorine and nitrogen, used to clean wounds
scope: One of a group of chlorine and nitrogen chemicals used to clean wounds; not plain chlorine and
  not a drug taken by mouth.
examples:
- The nurse cleaned the cut with chloramine.
- Chloramine is used to keep wounds free of germs.
