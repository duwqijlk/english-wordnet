simpleMeaning: The hard part on the outside of something, that covers the rest of it
scope: A hard outer layer that covers something, not rude behaviour and not the act of forming such a
  layer.
examples:
- The bread had a thick, golden crust.
- A thin crust of ice covered the lake.
