simpleMeaning: a low herb of Europe and Asia with thin leaves and small green flowers that most people
  walk past without seeing
scope: Also called knawel, it is a low herb of Europe and Asia whose thin leaves and small green flowers
  are easy to walk past.
examples:
- The knawe by the path was easy to miss among the taller grass.
- We had to bend down to see the knawe's thin leaves.
