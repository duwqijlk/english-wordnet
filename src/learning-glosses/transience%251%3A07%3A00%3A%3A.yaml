senseId: 'transience%1:07:00::'
synsetId: 05062429-n
simpleMeaning: A passing state that hints all things must end or die.
scope: This sense is also called transitoriness, for a passing state that hints all things must end or
  die, unlike the sense for the mark of being brief or fleeting.
examples:
- The transience of youth struck him as he aged.
- Transience reminds us that all things end.
