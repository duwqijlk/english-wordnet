simpleMeaning: Milk sugar found in the water passed from the body, which can happen while a woman is with
  child or giving milk.
scope: Milk sugar found in the water passed from the body, which can happen while a woman is with child
  or giving milk, not sugar in the blood and not milk sugar in food.
examples:
- Lactosuria was found in the sample during her pregnancy.
- The test showed lactosuria while she was giving milk to her baby.
