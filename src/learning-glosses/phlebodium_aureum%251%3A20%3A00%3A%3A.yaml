simpleMeaning: A fern of tropical America with brown scaly underground stems, grown for its large deeply
  lobed deep bluish-green fronds; sometimes put in the genus Polypodium.
scope: Also called golden polypody, rabbit's-foot fern, serpent fern, and Polypodium aureum.
examples:
- The Phlebodium aureum grew large fronds in the warm greenhouse.
- We watered the Phlebodium aureum for its deep green leaves.
