simpleMeaning: A painful sudden tightening of a muscle, especially in the neck or back
scope: A painful tightening of a muscle in the neck or back, also called rick, crick and wrick, with rick
  and wrick used in Britain; not a sharp bend in a rope or line, and not a person with unusual sexual
  tastes.
examples:
- I woke up with a kink in my neck and could not turn my head.
- She got a kink in her back after lifting the heavy box.
