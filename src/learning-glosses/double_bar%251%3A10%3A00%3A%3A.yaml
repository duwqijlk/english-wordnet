simpleMeaning: A mark at the end of a main part of a piece of music, made of two near lines across the
  staff
scope: A mark at the end of a main part of a piece of music, made of two near lines across the staff;
  not a single line and not a repeat sign.
examples:
- The double bar closed the first movement.
- A double bar marks the end of the section.
