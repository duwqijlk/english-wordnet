simpleMeaning: A place where cases are heard, run by a magistrate or by one or more judges who settle
  cases by the rules of the land
scope: This is a place where cases are heard, run by a magistrate or by one or more judges; lawcourt,
  court of justice and law court are other names for it; not a parliament, which makes laws, and not a
  lawyer's office.
examples:
- The court of law heard the case on Monday.
- She was called to the court of law to give evidence.
