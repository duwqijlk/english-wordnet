simpleMeaning: In the centres of all living cells sit many stuffs, each one a body-building stuff joined
  to a nucleic acid, an acid in a cell's centre.
scope: This stuff is found in the centres of all living cells and is made of a body-building stuff joined
  to a nucleic acid, not the centre that holds it.
examples:
- Scientists found nucleoproteins in the centres of all living cells.
- All living cells hold nucleoproteins in their centres.
