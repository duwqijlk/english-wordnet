simpleMeaning: something hidden in a place on purpose so that someone else will find it
scope: This is a thing or person deliberately left somewhere so that someone else will find it, such as
  false evidence, not the act of hiding a spy or device, and not a rehearsed actor in a crowd.
examples:
- Detectives suspected the gun in his car was a plant.
- He insisted the stolen documents were a plant meant to mislead the court.
