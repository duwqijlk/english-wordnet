simpleMeaning: an organisation or party whose uniforms or badges are a neutral colour between black and
  white
scope: Also called grey, this is a group or party identified by its uniform colour, not the plain colour
  noun, the adjective for Confederate uniforms, or the grey-clothing sense.
examples:
- The Confederate army was a vast gray.
- Newspapers of the day referred to the rebel forces as the gray.
