simpleMeaning: A showy tropical tree or shrub from Madagascar, widely planted in tropical regions for
  its huge sprays of scarlet and orange flowers; sometimes put in the genus Poinciana.
scope: Also called flamboyant, flame tree, peacock flower, royal poinciana and Poinciana regia; a showy
  tropical tree with scarlet and orange flowers, not a tree grown for timber and not a small shrub.
examples:
- Delonix regia grew in the garden in Madagascar.
- The scarlet flowers of Delonix regia opened in summer.
