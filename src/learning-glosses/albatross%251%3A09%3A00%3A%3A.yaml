simpleMeaning: something that holds a person back or makes things hard for them
scope: 'Also called a millstone: something that holds a person back and makes things hard. Not the large
  sea bird of the same name.'
examples:
- The high rent became an albatross for the small shop, making it hard to stay open.
- She saw the long contract as an albatross that stopped her from taking a new job.
