simpleMeaning: a little salmon that lives in the waters off the north Pacific and in the Great Lakes
scope: This is a little salmon that lives in the waters off the north Pacific and in the Great Lakes,
  also called blue jack, coho and coho salmon; not the pink flesh of the fish sold as food.
examples:
- The cohoe leapt clear of the water as it swam upstream.
- Anglers prize the cohoe in the Great Lakes.
