simpleMeaning: a measuring tool whose pointer moves by an amount that matches the amount being measured
scope: A measuring tool whose pointer moves by an amount that matches the amount measured; linear meter
  is another name for this sense, not a tool with a number display and not a tool whose pointer jumps
  in uneven steps.
examples:
- The linear metre on the panel showed the current rising steadily.
- He read the value off the linear metre as the pointer moved.
