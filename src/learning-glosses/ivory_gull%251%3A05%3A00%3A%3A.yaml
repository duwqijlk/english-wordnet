simpleMeaning: A white sea bird of the far north that flies as far south as England and New Brunswick
scope: A white sea bird of the far north that flies south to England and New Brunswick, not a grey sea
  bird and not a bird that stays in the far north.
examples:
- An ivory gull was seen off the coast of England.
- The ivory gull nests in the far north.
