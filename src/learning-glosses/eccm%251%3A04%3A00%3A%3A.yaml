simpleMeaning: War work with electronics that keeps one's own side able to use the waves that carry signals
  well, even while the enemy is also using war electronics.
scope: Also called electronic counter-countermeasures; war work with electronics that keeps one's own
  side using the waves that carry signals well despite the enemy's own war electronics.
examples:
- ECCM keeps friendly radios working even when the enemy jams the waves.
- The unit used ECCM to keep its own electronics working in the fight.
