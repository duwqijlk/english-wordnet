simpleMeaning: The office of the Treasury Department that makes people pay tax on goods brought in from
  other countries.
scope: Also called the Customs Bureau, the Customs Service, and USCB; the Treasury office that collects
  tax on goods brought into the country, not the office that guards the borders and not the office that
  collects income tax.
examples:
- The Bureau of Customs checked the goods at the port.
- She works for the Bureau of Customs in New York.
