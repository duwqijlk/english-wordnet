simpleMeaning: to shake something so that it makes short sounds again and again
scope: 'This is the act of shaking something to make short sounds again and again. It is not the baby
  toy that makes noise when shaken, not the part at the end of a snake''s tail, and not the sound on its
  own: a fast series of short loud sounds.'
examples:
- She rattled the box to hear what was inside it.
- The wind rattled the gate all night.
