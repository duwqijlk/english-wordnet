simpleMeaning: a long thin water animal like an eel (a salamander), living in North America, with small
  front legs, no back legs, and outer breathing parts that stay for life
scope: This is a water animal, not the loud warning sound and not the machine that makes that sound.
examples:
- A siren has no back legs and breathes through outer gills.
- We found a small siren hiding under a rock in the pond.
