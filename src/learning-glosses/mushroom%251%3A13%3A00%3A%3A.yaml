simpleMeaning: the soft, thick part of one of many kinds of living things that are not plants (fungi)
  and that people can eat
scope: This is the soft, thick part that people eat; not the whole living thing itself, and not the big
  cloud of dust and smoke that rises after a bomb goes off.
examples:
- She fried the mushrooms in butter with a little garlic.
- We bought fresh mushrooms at the market for dinner.
