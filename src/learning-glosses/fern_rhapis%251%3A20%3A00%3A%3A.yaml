simpleMeaning: a small palm with a pleasing shape, stems like reeds, and leaf bases covered in loose coarse
  fibres
scope: A small graceful palm with reed-like stems, also called bamboo palm or miniature fan palm, not
  a tall palm tree and not a fern.
examples:
- A fern rhapis stood in the corner of the room.
- The fern rhapis has reed-like stems and leaf bases wrapped in loose coarse fibres.
