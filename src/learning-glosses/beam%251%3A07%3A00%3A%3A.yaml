simpleMeaning: In ships, how wide a ship is at its middle part
scope: The width of a ship at its middle; not a bar of wood or metal in a building, not a line of light,
  and not a wide, happy smile.
examples:
- The new ship has a beam of ten metres.
- The boat's beam was too wide for the narrow harbour.
