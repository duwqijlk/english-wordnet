simpleMeaning: A long-legged wading bird with three toes and black-and-white feathers, found by inland
  ponds and marshes or lagoons where fresh and salt water mix
scope: A black-and-white wading bird of inland waters; stilt, longlegs, long-legs, stilt plover and stiltbird
  are other names for this sense, not the white-headed bird of the south-west Pacific or a heron.
examples:
- A Himantopus stilt picked its way through the shallow marsh.
- We watched a Himantopus stilt wading in the brackish lagoon.
