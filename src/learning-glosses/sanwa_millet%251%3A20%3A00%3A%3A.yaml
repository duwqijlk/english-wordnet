simpleMeaning: a rough one-year grass grown in Japan and southeast Asia for seeds people eat and feed
  for farm animals; wild animals in the United States eat it
scope: A rough grass grown for its seeds and as feed for farm animals, not a fine lawn grass; billion-dollar
  grass is another name for this sense.
examples:
- Farmers in Japan grow sanwa millet for its seeds.
- Wild ducks in the United States feed on sanwa millet.
