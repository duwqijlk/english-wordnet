simpleMeaning: a building for soldiers who keep order in the army, used as their main office and as a
  place to hold soldiers who are prisoners
scope: A building for the army police, used as their main office and to hold soldiers who are prisoners;
  not a small shelter for a guard at a gate and not a prison for people in general.
examples:
- The soldier was taken to the guardhouse and held there overnight.
- The guardhouse stood near the main gate, where the military police had their office.
