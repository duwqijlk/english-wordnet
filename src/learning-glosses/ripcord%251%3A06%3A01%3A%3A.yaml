senseId: 'ripcord%1:06:01::'
synsetId: 04101154-n
simpleMeaning: a cord that you pull to open the gas bag of a balloon wide, so gas gets out and the balloon
  comes down
scope: This cord is on a balloon and lets gas out so the balloon comes down; it is not the cord that opens
  a parachute when a person is falling.
examples:
- The pilot pulled the ripcord to let gas out and bring the balloon down.
- If you pull the ripcord too wide, the balloon will drop too fast.
