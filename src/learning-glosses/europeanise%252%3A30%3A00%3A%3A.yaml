simpleMeaning: To take a land out of its own nation's hands and put it under the watch of a body set up
  by a group of nations in Europe.
scope: To take a land out of its own nation's hands and put it under the watch of a body set up by a group
  of nations in Europe; also called Europeanize, not the sense of making a place European in its ways.
examples:
- The treaty would Europeanise the port, placing it under a European agency.
- They planned to Europeanise the territory after the war.
