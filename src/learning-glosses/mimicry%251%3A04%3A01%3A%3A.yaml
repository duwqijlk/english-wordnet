senseId: 'mimicry%1:04:01::'
synsetId: 01023338-n
simpleMeaning: How one kind of animal looks like another kind, or like a thing in nature, so that it stays
  hidden and safe from animals that hunt it.
scope: The likeness of one animal kind to another kind or to a thing in nature, which hides it from hunters;
  not the act of copying the way another thing looks or moves.
examples:
- The mimicry of the harmless fly lets it pass for a stinging wasp.
- Through mimicry, the moth looks like a dead leaf on the branch.
