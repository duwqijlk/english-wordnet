simpleMeaning: to have the kind of qualities that make a thing fit well for something, or to be open to
  harm or bad use
scope: This is about a thing being fit for a use or open to bad use; it is not about giving money or a
  thing to someone for a time.
examples:
- The short story lends itself well to being read aloud in class.
- A system with no checks lends itself to abuse by those in power.
