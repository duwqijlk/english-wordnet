simpleMeaning: a person who leads a formal event, giving the opening talk and bringing on the other speakers
scope: A person who leads a formal event; host and emcee are other names for this sense, not a guest who
  speaks and not the person who plans the event.
examples:
- The master of ceremonies welcomed the guests and introduced the first speaker.
- Our master of ceremonies kept the evening moving.
