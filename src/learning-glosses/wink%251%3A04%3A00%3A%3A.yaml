simpleMeaning: a quick shut and open of the eyes that happens on its own, without thinking
scope: Also called blink, this is a quick shut and open of the eyes done without thinking, not a light
  that shines on and off and not a shut of one eye to send a secret sign.
examples:
- The bright light made him give a quick wink.
- Dust in her eye caused a rapid wink.
