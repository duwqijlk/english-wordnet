simpleMeaning: A herb of Europe and Asia with white flowers, grown far and wide to feed farm animals and
  to hold the soil in place.
scope: A white-flowered Eurasian herb grown for feed and to hold the soil in place, also called field
  lupine, white lupine, wolf bean and Egyptian lupine.
examples:
- Lupinus albus grows in the fields of Europe and Asia.
- Farmers sow Lupinus albus to feed their animals and hold the soil.
