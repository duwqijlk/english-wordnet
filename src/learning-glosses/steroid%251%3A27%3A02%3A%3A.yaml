simpleMeaning: a hormone (a chemical made in the body) that affects how sex organs grow and develop
scope: A body chemical that affects how sex organs grow. This is not the wider sense that names a whole
  group of chemicals.
examples:
- Testosterone is a steroid that helps male sex organs grow.
- This steroid affects how a child's sex organs develop.
