simpleMeaning: A point measured on the skull, at the front end of the line where the two upper jaw bones
  meet.
scope: Not the back of the skull and not a point on the lower jaw.
examples:
- The acanthion marks the front end of the jaw suture.
- They measured from the acanthion to the back of the skull.
