simpleMeaning: a living thing that lives on the outside of another living thing and takes food from it,
  like a flea
scope: 'Also called ectozoan, ectozoon, epizoan and epizoon: a living thing that lives on the outside
  of another living thing and takes food from it, not one that lives inside the body and not a creature
  that lives on its own.'
examples:
- Fleas are ectoparasites that live on the skin of dogs.
- The vet found an ectoparasite on the cat's ear.
