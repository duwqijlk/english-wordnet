simpleMeaning: a skin medicine made from glycerin and jelly that has glycerin in it
scope: A skin medicine made from glycerin and jelly that has glycerin in it; glycerogel is another name
  for this sense, not plain jelly and not a pill.
examples:
- The nurse spread glycerogelatin on the sore skin.
- Glycerogelatin soothes dry skin.
