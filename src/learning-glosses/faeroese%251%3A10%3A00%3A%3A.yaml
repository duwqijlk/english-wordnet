simpleMeaning: A northern way of speaking from the Faroe Islands, close kin to the speech of Iceland.
scope: Also called Faeroese language, Faroese and Faroese language, this is the Scandinavian speech of
  the Faroe Islands, closely related to but distinct from Icelandic.
examples:
- Faeroese is spoken on the Faroe Islands.
- Faeroese is close kin to the speech of Iceland.
