simpleMeaning: This thing works against acid and makes it weaker, most often the acid in the stomach
scope: Also called an antacid, antiacid, alkaliser, or alkalizer, this is a thing that works against acid,
  most often the acid in the stomach, not a painkiller and not an acid itself.
examples:
- She took a gastric antacid after the spicy meal.
- The doctor told him to keep a gastric antacid by the bed.
