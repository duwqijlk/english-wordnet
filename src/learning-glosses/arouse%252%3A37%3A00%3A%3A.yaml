simpleMeaning: To make feelings, moods, or answers to things come out in a person.
scope: 'Also called fire, raise, provoke, kindle, or evoke: bringing out feelings, moods, or answers in
  a person, not waking them from sleep.'
examples:
- Her speech aroused pity in the crowd.
- The news aroused a strong feeling of hope.
