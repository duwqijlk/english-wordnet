simpleMeaning: This waxy stuff, much like fat and full of hydrogen, is one of the bits that make up animal
  and plant fat and turns up almost everywhere in them.
scope: 'Also called octadecanoic acid: a waxy fat-like stuff full of hydrogen, found all over as one of
  the parts of animal and plant fat.'
examples:
- Stearic acid turns up all over in animal and plant fat.
- The fat held stearic acid as one of its parts.
