simpleMeaning: a long thin cord that carries telegraph signals and spoken signals
scope: 'Also called a telegraph line, a telegraph wire, or a telephone line: the cord that carries signals,
  not the poles that hold it up and not the set people speak into.'
examples:
- The telephone wire swayed in the wind above the road.
- He climbed the pole to mend the telephone wire.
