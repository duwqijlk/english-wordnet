simpleMeaning: the almost white root of a plant grown by people
scope: This sense is the white root as part of the plant, not the whole plant and not the root served
  as food.
examples:
- The parsnip has a long white root that grows deep in the soil.
- She dug up the parsnip and cleaned soil from its white root.
