simpleMeaning: Throwing several things up in the air and catching them again, keeping them all moving
  at once.
scope: Throwing and catching several things at once, not moving things about to give a false idea.
examples:
- She can juggle five balls without dropping one.
- The clown juggled clubs for the cheering crowd.
