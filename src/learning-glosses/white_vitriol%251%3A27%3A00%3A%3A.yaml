simpleMeaning: To fix dyes, to keep wood from rotting, or to lay zinc on things with an electric current,
  this pale powder with no colour that melts in water is used.
scope: Also called zinc sulfate, zinc sulphate, and zinc vitriol, it is a pale powder with no colour that
  melts in water, used to fix dyes, to keep wood from rotting, or to lay zinc on things with an electric
  current.
examples:
- The dye was fixed with white vitriol.
- The wood was kept from rotting by white vitriol.
