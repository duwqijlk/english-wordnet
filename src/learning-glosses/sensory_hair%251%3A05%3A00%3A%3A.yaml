simpleMeaning: A long stiff bristle that grows from the nose or brow of most mammals, such as a cat
scope: 'Also called a whisker or a vibrissa: a long stiff bristle on the nose or brow of most mammals,
  not ordinary head hair and not an eyelash.'
examples:
- The cat's sensory hair felt the narrow gap.
- A sensory hair on the cat's brow twitched.
