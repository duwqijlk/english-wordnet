simpleMeaning: a shiny green beetle found all over Europe, with young that eat plant roots and grown ones
  that eat leaves and flowers, roses among them
scope: Also called a rose beetle; a shiny green beetle of Europe, not a stag beetle and not a beetle that
  bores into wood.
examples:
- A rose chafer crawled over the rose in the garden.
- Rose chafers eat the leaves of the roses at dusk.
