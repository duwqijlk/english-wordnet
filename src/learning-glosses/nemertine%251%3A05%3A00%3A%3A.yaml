simpleMeaning: Soft sea worms not divided into sections, with a thin thread-like snout and the power to
  stretch and shrink.
scope: Soft sea worms with a thread-like snout that can stretch and shrink, also called nemertean, proboscis
  worm and ribbon worm; not a flatworm and not an earthworm.
examples:
- The nemertine stretched its long snout to catch food.
- Nemertines can shrink to a small size when they are disturbed.
