simpleMeaning: the deepest and clearest groove on the surface of the brain, which splits the front part
  from the side part in both halves of the brain
scope: 'Also called sulcus lateralis cerebri: the deepest groove on the surface of the brain, not a fold
  of skin and not a cut in the brain.'
examples:
- The lateral cerebral sulcus splits the front and side parts of the brain.
- Doctors traced the lateral cerebral sulcus on the brain scan.
