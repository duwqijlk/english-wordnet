schema: oewn-learning-gloss-v2
senseId: 'new_wave%1:14:01::'
synsetId: 08482569-n
simpleMeaning: In one field, most of all in the arts, a group of creative people leads the way by making
  and using fresh ideas and ways of working
scope: A creative group that leads the way with fresh ideas and methods in one field, most of all in the
  arts; van, vanguard and avant-garde are other names for this sense, not a style of music and not a single
  person.
examples:
- The new wave of painters changed how the city saw art.
- She joined a new wave group that tried out fresh ways of making films.
