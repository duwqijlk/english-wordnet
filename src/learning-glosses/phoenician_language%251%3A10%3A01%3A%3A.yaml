simpleMeaning: One of the Semitic group of tongues is spoken no longer, the tongue of an old people who
  were the strongest traders in the old world.
scope: Also called Phoenician; this is the tongue, not the people who spoke it.
examples:
- In the old world, traders spoke Phoenician language.
- Phoenician language is no longer spoken anywhere.
