simpleMeaning: growing or found in a particular region because that is where it originated.
scope: This describes plants, animals, or things tied to a place of origin, not peoples who have lived
  there since earliest times, and not abilities present from birth.
examples:
- The garden is full of plants native to the Mediterranean.
- This bird is native to the northern forests.
