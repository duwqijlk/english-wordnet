simpleMeaning: a breaking down of a layer of cells in the outer skin, as happens in the skin illness pemphigus
scope: This is a breaking down of a layer of cells in the outer skin, not a cut or wound and not a breaking
  down of deeper skin.
examples:
- The doctor said acantholysis had weakened the outer skin.
- Acantholysis in pemphigus makes the skin blister and peel.
