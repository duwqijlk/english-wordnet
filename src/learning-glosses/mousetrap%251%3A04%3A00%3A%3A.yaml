simpleMeaning: In American football, a play where a player from the other team is let across the starting
  line, then blocked away while the runner runs through the space he left
scope: 'Also called trap play: in American football, this play lets a player from the other team cross
  the line and then blocks him away so the runner can pass. It is not a tool used to catch mice.'
examples:
- The team ran a mousetrap, letting the big defender cross the line before blocking him away from the
  runner.
- On the mousetrap play, the runner slipped through the space the lineman had left.
