simpleMeaning: With no teeth, a long tongue and strong claws, this big South American animal feeds on
  small insects.
scope: Also called an ant bear, a great anteater or a tamanoir, this big toothless animal of South America
  feeds on small insects.
examples:
- The giant anteater used its long tongue to lick up ants.
- We saw a giant anteater shuffling through the grass in South America.
