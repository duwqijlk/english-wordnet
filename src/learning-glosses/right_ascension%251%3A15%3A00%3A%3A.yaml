senseId: 'right_ascension%1:15:00::'
synsetId: 08650766-n
simpleMeaning: In astronomy, an angle eastward from the spring equinox along the sky's equator, usually
  in hours, minutes and seconds, paired with declination (the north-south angle) to fix a position.
scope: The angle giving a point's place around the sky, not its north-south position (declination) and
  not its height above the horizon.
examples:
- The telescope was pointed at a star with a right ascension of six hours.
- Astronomers give right ascension in hours, minutes and seconds.
