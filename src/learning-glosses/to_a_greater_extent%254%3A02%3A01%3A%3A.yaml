schema: oewn-learning-gloss-v2
senseId: 'to_a_greater_extent%4:02:01::'
synsetId: 00099891-r
simpleMeaning: Used to make the comparative form of some describing words, to show that a thing has more
  of a quality
scope: Used to show more of a quality in a comparison; more is another name for this sense, and not the
  phrase that shows less of a quality.
examples:
- He was happy to a greater extent after the good news.
- The plan worked to a greater extent than we had hoped.
