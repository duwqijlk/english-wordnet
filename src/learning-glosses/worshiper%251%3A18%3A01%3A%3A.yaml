senseId: 'worshiper%1:18:01::'
synsetId: 10811975-n
simpleMeaning: a person who thinks so highly of someone that they cannot see that person's faults
scope: 'Also called worshipper: a person who admires someone so much that they cannot see any fault in
  them, not someone who prays to a god as part of a religion.'
examples:
- He is such a worshiper of the famous singer that he says she can do nothing wrong.
- Even when the leader made a clear mistake, his worshipers refused to admit it.
