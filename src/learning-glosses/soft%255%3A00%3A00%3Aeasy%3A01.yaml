simpleMeaning: Easy to carry out and free of hardship; not demanding or difficult.
scope: It describes work or conditions that are easy to bear, not a gentle manner, a lenient rule, or
  a body out of condition.
examples:
- He landed a soft job with short hours and good pay.
- After years of shift work, a soft assignment felt like a holiday.
