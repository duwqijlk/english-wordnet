simpleMeaning: To think hard, working things out with reason so as to reach a choice, a finding, or an
  answer.
scope: 'Also called think: to think hard, working things out with reason so as to reach a choice, a finding,
  or an answer, not merely to turn an idea over in one''s mind.'
examples:
- She sat and cogitated over the problem all afternoon.
- He cogitated long before he gave his answer.
