senseId: 'fossil%3:01:00::'
synsetId: 02741718-a
simpleMeaning: belonging to or like the remains or marks of a plant or animal that lived long ago and
  was left in the ground or rock
scope: This word describes something that belongs to or is like those old remains, not the remains themselves
  that you find in the ground.
examples:
- They found fossil footprints in the rock.
- The museum showed fossil bones from an animal that lived long ago.
