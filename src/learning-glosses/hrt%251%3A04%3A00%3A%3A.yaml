simpleMeaning: Treatment that gives hormones, estrogen and progestin, to women past the change of life,
  thought to guard them from heart disease and weak bones.
scope: 'Also called hormone-replacement therapy and hormone replacement therapy: treatment that gives
  hormones to women past the change of life, not a treatment for young women and not a treatment that
  gives one hormone only.'
examples:
- Her doctor put her on HRT after the change of life.
- HRT is thought to guard against heart disease.
