simpleMeaning: a connected set of raised surfaces that people walk on to move between levels.
scope: A whole connected flight between levels — steps is another name for this sense — not a single stair
  and not a stage in a process.
examples:
- She climbed the stairs to the top floor.
- The stairs were steep and narrow.
