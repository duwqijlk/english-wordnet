simpleMeaning: The act of making someone angry by laughing at them, mocking them, or finding fault with
  them.
scope: The act of making someone angry by laughing at them, mocking them, or finding fault with them,
  with taunt as another name for this sense, and not shouting cruel words itself, which is the adjective
  sense.
examples:
- His taunting of the new boy went on all week.
- She was tired of the taunting from her classmates.
