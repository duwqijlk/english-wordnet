simpleMeaning: An idea that says a system at rest in balance shifts to a new balance that fights a change
  put on it.
scope: A rule saying a system at rest in balance shifts to fight a change, also called Le Chatelier's
  law, Le Chatelier's principle and Le Chatelier principle; its near kin are other rules of chemistry
  about systems in balance.
examples:
- The Le Chatelier-Braun principle says a system shifts to a new balance.
- Chemists use the Le Chatelier-Braun principle.
