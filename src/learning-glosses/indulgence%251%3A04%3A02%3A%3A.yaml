simpleMeaning: The Pope's act of freeing a person from punishment in purgatory, a place of cleansing after
  death, still owed for sins after they have been forgiven
scope: A church pardon that frees a person from punishment still owed for sins; not giving in to one's
  own wishes, and not the act of pleasing oneself.
examples:
- In the Middle Ages, the Church sold indulgences to raise money.
- He bought an indulgence to escape punishment in purgatory.
