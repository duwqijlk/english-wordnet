simpleMeaning: One of the two lower vocal folds that meet to form the glottis and make a voice tone as
  lung air passes between them.
scope: It is also called inferior vocal fold, true vocal cord, and true vocal fold, and it is one of the
  two lower folds, not the upper folds above them.
examples:
- The inferior vocal cord closed as air passed from the lungs.
- The singer's inferior vocal cords met to make the tone.
