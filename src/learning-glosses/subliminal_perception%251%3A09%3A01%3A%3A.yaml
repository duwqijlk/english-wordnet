simpleMeaning: In psychology, noticing or reacting to something that acts on the senses without knowing
  about it or being aware of it
scope: In psychology, noticing or reacting to something without knowing about it, also called subception;
  not noticing something on purpose and not a dream.
examples:
- Subliminal perception lets us react to a signal we never notice.
- In tests of subliminal perception, people respond without knowing why.
