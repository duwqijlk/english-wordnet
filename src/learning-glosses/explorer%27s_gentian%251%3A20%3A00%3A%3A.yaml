simpleMeaning: a plant that grows in clumps and sometimes spreads low, living for years, with blue flowers
  marked with green spots, growing in western North America
scope: This is a long-lived plant with spotted blue flowers; not a short-lived plant and not a blue flower
  of another kind.
examples:
- The explorer's gentian grew in clumps on the hillside.
- We saw an explorer's gentian with blue flowers spotted with green.
