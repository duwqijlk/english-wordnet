simpleMeaning: a deep blood tube of the male sex organ that runs into the net of blood tubes around the
  small gland below the bladder
scope: A deep blood tube of the male sex organ that runs into the net of blood tubes around the small
  gland below the bladder, not a blood tube that runs near the skin of the sex organs.
examples:
- The vena profunda penis runs deep inside the penis toward the prostate.
- The vena profunda penis enters the prostatic plexus near the base of the bladder.
