simpleMeaning: Who a person is comes out when a machine reads the fine lines on the skin at the tips of
  the hands.
scope: Also called finger scan, this is the check in which a machine reads the fine lines on the skin
  at the tips of the hands to tell who a person is.
examples:
- Finger scanning showed who the man was.
- Finger scanning matched the fine lines on his hand to his name.
