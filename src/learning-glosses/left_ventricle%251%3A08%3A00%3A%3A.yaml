simpleMeaning: the room on one side of the heart that takes oxygen-rich blood from the upper room on that
  side and pumps it into the main blood vessel, the aorta
scope: The room on one side of the heart that pumps blood into the main blood vessel, not the upper room
  on that side and not the room on the other side of the heart.
examples:
- The left ventricle pumps blood into the aorta.
- The doctor said the left ventricle was working well.
