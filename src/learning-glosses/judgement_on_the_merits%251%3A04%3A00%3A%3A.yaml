senseId: 'judgement_on_the_merits%1:04:00::'
synsetId: 01192854-n
simpleMeaning: After the facts of a case have been looked at and settled, the court gives its ruling on
  them
scope: A ruling given after the facts of the case have been looked at and settled, also called a judgment
  on the merits; not a ruling on a side point and not a ruling that says nothing about the facts.
examples:
- The judge gave a judgement on the merits after hearing all the facts.
- A judgement on the merits settles the facts of the case, not just how it is run.
