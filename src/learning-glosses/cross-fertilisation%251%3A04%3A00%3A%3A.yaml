senseId: 'cross-fertilisation%1:04:00::'
synsetId: 00041283-n
simpleMeaning: An exchange between different cultures or ways of thinking that helps both sides and brings
  forth good work
scope: An exchange between different cultures or ways of thinking that helps both sides, also called cross-fertilization;
  not a quarrel and not a one-sided borrowing.
examples:
- The cross-fertilisation of science and art brought new ideas.
- Trade brought a cross-fertilisation of ideas to the city.
