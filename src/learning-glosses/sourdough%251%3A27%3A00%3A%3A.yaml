simpleMeaning: a dough mix in which fermentation (a slow natural change that makes small bubbles) is going
  on, used by early settlers for making bread
scope: This is the dough mix used to make bread, not a person who went to live in a new place or to look
  for gold.
examples:
- She kept her sourdough in a jar and used a little of it each week.
- He mixed more flour into the sourdough before making bread.
