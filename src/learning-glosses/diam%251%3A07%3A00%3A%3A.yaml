simpleMeaning: the length of a straight line that runs through the middle of a round shape and joins two
  points on its edge
scope: The length of a straight line through the middle of a round shape, also called diameter; not the
  line itself, and not the length around the outside of the shape.
examples:
- Measure the diam of the plate before you buy a lid for it.
- The diam of the wheel is twice the length from its middle to its edge.
