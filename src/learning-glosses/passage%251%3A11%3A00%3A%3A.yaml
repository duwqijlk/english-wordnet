simpleMeaning: When one thing moves, the change in its place compared with another thing
scope: 'Also called passing: one thing moving in relation to another. Not a short part of a piece of writing,
  and not a way through a building.'
examples:
- Astronomers watched the passage of a bright star past a distant planet.
- The passage of the moon in front of the sun made the sky go dark.
