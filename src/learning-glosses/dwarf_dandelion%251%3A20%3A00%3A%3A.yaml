simpleMeaning: A small plant with yellow flowers, like the common yellow-flowered weed, from the middle
  and south-east of the United States
scope: A small yellow-flowered plant like the common yellow-flowered weed, not a true dandelion and not
  a tall plant.
examples:
- The dwarf dandelion opened its yellow flowers in the meadow.
- A dwarf dandelion looks like the common yellow-flowered weed.
