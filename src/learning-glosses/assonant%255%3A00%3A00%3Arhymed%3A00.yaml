simpleMeaning: The vowel sound matches while the consonants differ, in words or stressed parts of words
  that follow one another.
scope: This word is used of words or stressed parts that match in vowel sound while their consonants differ,
  not of the broader same-sound sense.
examples:
- The lines were assonant, with matching vowel sounds in words that followed one another.
- In the poem, assonant words echoed the same vowel sound.
