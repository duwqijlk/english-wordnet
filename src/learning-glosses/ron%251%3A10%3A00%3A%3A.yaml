simpleMeaning: A Chadic language of northern Nigeria, above all in Plateau State, in the Bokkos, Barakin-Ladi
  and Mangu areas
scope: This language is also called the Ron language, Bokkos, the Bokkos language, Daffo and the Daffo
  language; it is not the Daba language and not another Chadic language of Nigeria.
examples:
- Ron is spoken in northern Nigeria.
- She grew up speaking Ron at home.
