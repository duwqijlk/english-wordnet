senseId: 'remand%1:04:00::'
synsetId: 00329153-n
simpleMeaning: The act of sending a person accused of a crime back to be kept under guard until their
  trial, or until it goes on.
scope: The act of sending an accused person back into custody to wait for trial, not the verb use for
  locking someone up in jail.
examples:
- The judge ordered his remand until the trial began.
- After the hearing, her remand was extended for another week.
