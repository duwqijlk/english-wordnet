simpleMeaning: A healthy baby turns its head and starts to suck when the side of its mouth or cheek is
  stroked softly.
scope: The head-turning and sucking a healthy baby shows when the side of its mouth or cheek is stroked
  softly.
examples:
- The rooting reflex made the baby turn toward the touch.
- A gentle stroke on the cheek set off the rooting reflex.
