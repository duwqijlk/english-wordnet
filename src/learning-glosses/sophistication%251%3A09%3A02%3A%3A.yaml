simpleMeaning: an argument that is not truly right, made on purpose and with clever thinking, in the hope
  of making someone believe what is false
scope: 'Also called sophistry, and also called a sophism: a clever but false argument made to trick someone,
  not being worldly and knowing much, and not the act of changing a thing by false argument.'
examples:
- The lawyer's sophistication fooled the court, though his argument was not truly right.
- His talk was pure sophistication, clever words made to hide a false claim.
