senseId: 'loose_smut%1:20:00::'
synsetId: 13087739-n
simpleMeaning: a fungus of the Ustilago group that gives grain a disease in which the whole head turns
  into a dusty mass of tiny bits that spread the disease
scope: A fungus that turns the whole head of a grain plant into a dusty mass, not a fungus that only spots
  the leaves and not a grain disease caused by insects.
examples:
- Loose smut turned the whole head of the wheat into dust.
- The farmer found loose smut on the grain heads.
