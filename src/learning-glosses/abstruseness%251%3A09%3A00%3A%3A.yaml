simpleMeaning: wise thoughts that are deep and hard to follow, full of hidden meaning
scope: This is deep, hard-to-follow wisdom, also called abstrusity, profundity and profoundness; not plain
  common sense and not shallow cleverness.
examples:
- The abstruseness of the old proverbs impressed the anthropologist.
- Her abstruseness made the lecture hard to follow.
