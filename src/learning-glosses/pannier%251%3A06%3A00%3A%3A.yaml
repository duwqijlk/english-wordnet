simpleMeaning: a set of small hoops used to make clothes fuller over the hips
scope: Small hoops that make clothes fuller over the hips, not the large basket sense of pannier and not
  the bags hung over the back wheel of a bicycle.
examples:
- The old dress was worn over a pannier to make it wide at the hips.
- A pannier under her skirt gave the dress its wide shape over the hips.
