simpleMeaning: A vitamin of the B group that the body needs for cells to grow and make more cells
scope: This is a vitamin of the B group needed for cells to grow and make more cells, not a drug; folate,
  folacin, folic acid and pteroylglutamic acid are other names for this sense.
examples:
- The label lists pteroylmonoglutamic acid among the vitamins in the drink.
- She takes a pill with pteroylmonoglutamic acid in it each morning.
