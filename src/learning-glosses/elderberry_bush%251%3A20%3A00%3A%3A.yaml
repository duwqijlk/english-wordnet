simpleMeaning: With white flowers and fruit like small berries, this is one of many shrubs or small trees
  of the mild and warm lands of the north.
scope: Also called elder, it is one of many shrubs or small trees of the mild and warm north, not a tree
  of the far south.
examples:
- White flowers covered the elderberry bush.
- We picked the fruit of the elderberry bush.
