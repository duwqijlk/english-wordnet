simpleMeaning: a stroke that moves from the tip to the end held in the hand
scope: The stroke that starts at the tip and ends at the heel, not the opposite stroke that starts at
  the heel and ends at the tip, which is a down-bow.
examples:
- The violinist began the phrase with an up-bow.
- An up-bow moves the bow from its tip toward the heel.
