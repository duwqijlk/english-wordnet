simpleMeaning: A small hard fruit, green and white, that cannot be eaten, from a plant of the open grasslands
scope: A small hard fruit, green and white, that cannot be eaten, from a plant of the open grasslands,
  not the perennial vine of the same name.
examples:
- A prairie gourd lay on the ground, small and hard, green and white.
- She picked a prairie gourd but left it on the ground, since it cannot be eaten.
