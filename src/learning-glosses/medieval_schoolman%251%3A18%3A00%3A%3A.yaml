simpleMeaning: A person who studied the system of thought called scholasticism at a university in the
  Middle Ages
scope: A learned person of the Middle Ages who studied at a university, not a monk in a monastery and
  not a teacher of today.
examples:
- The medieval schoolman lectured on logic every morning.
- A medieval schoolman would spend years studying the old texts.
