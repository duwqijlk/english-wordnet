simpleMeaning: cheerful, light activity done for fun rather than for a serious purpose.
scope: This sense is not a stage drama, not a move in a sport, and not a joke at someone's expense; it
  is light activity done for enjoyment.
examples:
- The park was full of the sounds of play.
- The puppies' play filled the kitchen with noise.
