simpleMeaning: On short stalks in clusters covered in fine hairs grow rose-coloured or white flowers of
  this plant of eastern and central North America, that lives year after year.
scope: This plant of eastern and central North America bears rose-coloured or white flowers on short stalks
  in hairy clusters, and is not the bog orchid of Canada with one sweet-smelling deep pink bloom.
examples:
- The wild pink showed rose-coloured flowers on short stalks.
- Clusters covered in fine hairs hold the rose-coloured or white flowers of the wild pink.
