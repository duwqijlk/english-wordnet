simpleMeaning: that makes people feel more awake and keen to think, do things, or use their senses
scope: Describes a thing or a talk that wakes up the mind and senses and gets people active, not something
  dull that makes people tired.
examples:
- We had a stimulating talk about travel and books.
- The cold morning air was stimulating and woke me up at once.
