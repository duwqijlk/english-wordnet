simpleMeaning: In a way that is very bad, so bad that it fills people with fear
scope: In a very bad way that fills people with fear, not something that is itself of a dreadful kind.
examples:
- He behaved dreadfully at the party, shouting at everyone.
- The house was dreadfully kept, with dirt everywhere.
