simpleMeaning: to come to an end, as a period or event does.
scope: This is a period or event reaching its own end, not shutting a door, lid or shop, and not a person
  ending a meeting.
examples:
- The meeting closed at noon after two hours of argument.
- Voting closes at midnight on Friday.
