simpleMeaning: A group of Plains Indian people who once lived in what is now North Dakota, South Dakota,
  Nebraska, Kansas, Arkansas, Louisiana, Oklahoma, and Texas.
scope: A group of Plains Indian people who once lived in what is now North and South Dakota and the other
  states named, not the family of languages they spoke and not a group of Indians of the east coast.
examples:
- The Caddo once lived across the plains of what is now Oklahoma and Texas.
- Caddo villages stood along the rivers of Louisiana and Arkansas.
