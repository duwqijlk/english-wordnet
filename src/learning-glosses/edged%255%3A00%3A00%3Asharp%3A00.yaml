simpleMeaning: having a sharp side for cutting, or a sharp side of a stated kind; often used joined with
  another word
scope: About a thing with a sharp side for cutting, often joined with another word to say what kind it
  is; not speech that is hard and hurtful.
examples:
- He cut the rope with an edged knife.
- The museum showed an old two-edged sword.
