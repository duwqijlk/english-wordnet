simpleMeaning: A weed of nightshade kin, silver-leaved, with white, blue, or violet flowers, and a roundish
  fruit that sets milk, spread from the mid United States down through South America.
scope: This sense is also called prairie berry, purple nightshade, silver-leaved nettle, silver-leaved
  nightshade, trompillo, and white horse nettle.
examples:
- A silverleaf nightshade grew by the fence.
- Silverleaf nightshades bear roundish berries.
