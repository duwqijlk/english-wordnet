simpleMeaning: The cut in the top of a small metal fastener takes the thin wedge-shaped end of this hand
  tool.
scope: This names the hand tool whose thin end, shaped like a wedge, fits into the cut in the top of a
  small metal fastener.
examples:
- He used a flat tip screwdriver to open the back of the radio.
- The flat tip screwdriver fit the cut in the top of the screw.
