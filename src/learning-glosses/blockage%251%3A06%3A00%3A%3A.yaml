simpleMeaning: something in a pipe or tube that stops things from passing through it
scope: 'Also called stop, block, closure and stoppage: something inside a pipe or tube that stops flow,
  not the condition of being blocked and not the act of blocking.'
examples:
- A blockage in the drainpipe stopped water from leaving the sink.
- The plumber cleared the blockage from the tube.
