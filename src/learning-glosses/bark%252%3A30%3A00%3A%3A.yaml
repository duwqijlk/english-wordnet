simpleMeaning: treat animal skin with substances from the outer layer of trees so it becomes leather.
scope: This is the leather-making action, not the tough tree covering or the dog-like sound.
examples:
- The tannery barks the hides in large wooden vats.
- Workers barked the skins before sewing them into boots.
