simpleMeaning: A sodium salt of carbonic acid, a solid made when an acid meets a base, used in making
  soap powders, glass and paper
scope: A chemical substance used to make soap, glass and paper, not the sweet drink with bubbles that
  people drink.
examples:
- The factory uses soda in making glass.
- Soda is added when they make soap powder at the plant.
