simpleMeaning: the number of miles a car or other vehicle travels for each gallon of gasoline it uses
scope: This is a measure of how far a vehicle goes on its gasoline, also called fuel consumption rate,
  gas mileage, and gasoline mileage; it is not money paid for each mile of travel.
examples:
- This small car gets good mileage, so we stop for gasoline less often.
- The mileage dropped when we drove fast on the highway.
