simpleMeaning: A way of looking at dyed cells from a smear of the neck of the womb, to find cancer of
  the womb early
scope: This is a way of looking at dyed cells from a smear of the neck of the womb, to find cancer of
  the womb early; smear test and Papanicolaou test are other names for this sense, and a way of looking
  at cells for other ends is a different kind.
examples:
- The Pap test looks at dyed cells from a smear.
- Her Pap test found no sign of cancer of the womb.
