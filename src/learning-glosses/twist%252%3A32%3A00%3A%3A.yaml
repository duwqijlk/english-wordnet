senseId: 'twist%2:32:00::'
synsetId: 00934760-v
simpleMeaning: To argue cleverly but dishonestly, distorting or being vague about what something means
  in order to mislead or deceive.
scope: This is about distorting words or meaning to deceive, not physically bending an object, pulling
  it violently, or squirming in place.
examples:
- Politicians often twist the facts to make their case sound stronger.
- Do not twist my words into a promise I never made.
