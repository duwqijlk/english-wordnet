simpleMeaning: In physics, the idea that light in empty space always moves at the same speed, and the
  laws of physics stay the same in all steady-moving systems
scope: A theory in physics, not a theory about gravity and not a guess about light; also called special
  relativity, special relativity theory and special theory of relativity.
examples:
- Einstein's special theory of relativity changed how we think about light.
- Students learn Einstein's special theory of relativity in physics class.
