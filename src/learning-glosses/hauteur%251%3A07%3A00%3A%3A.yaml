simpleMeaning: A proud, high-handed way of treating people one looks down on, as if they were less than
  one.
scope: A proud, high-handed manner toward people one looks down on, also called arrogance, haughtiness,
  lordliness, or high-handedness.
examples:
- Her hauteur kept the new staff at a distance.
- He spoke with hauteur to everyone below him.
