senseId: canted%5:00:00:inclined:01
synsetId: 01237400-s
simpleMeaning: Out of line with straight up and down or straight across, or pushed out of line that way.
scope: Also called leaning, tilted, and tipped, this is said of a thing that has moved, or been moved,
  away from straight up and down or straight across.
examples:
- The old fence was canted after the storm.
- The shelf was canted, so the books slid to one side.
