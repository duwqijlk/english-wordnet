simpleMeaning: a metal part inside a vacuum tube, put between the two ends where power goes in and out,
  to control how much power flows through
scope: A metal part inside a vacuum tube that controls electric flow, not a cooking frame and not a pattern
  of lines.
examples:
- The grid in the old radio tube controlled the flow of power.
- He replaced the grid inside the vacuum tube.
