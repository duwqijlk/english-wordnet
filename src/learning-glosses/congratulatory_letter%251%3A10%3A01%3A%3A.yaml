simpleMeaning: an official note that names a person's good work and gives high praise for it
scope: This is an official note that praises a person's good work; congratulations letter is another name
  for this sense, not a casual note and not a note that asks for something.
examples:
- He framed the congratulatory letter from the college.
- A congratulatory letter came from the head teacher after she won the prize.
