simpleMeaning: A deadly blood illness passed down from both parents, in which the body makes no red blood
  pigment; bones grow wrongly, and the heart, spleen and liver grow too big.
scope: 'Also called thalassaemia major, thalassemia major or Cooley''s anemia: a deadly blood illness
  passed down from both parents, with no red blood pigment, bones that grow wrongly, and heart, spleen
  and liver that grow too big.'
examples:
- Cooley's anaemia is a deadly blood illness passed down from both parents.
- A child with Cooley's anaemia has no red blood pigment and enlarged organs.
