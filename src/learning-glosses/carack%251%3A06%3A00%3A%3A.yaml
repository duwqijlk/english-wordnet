simpleMeaning: a large old sailing ship used in the Mediterranean to carry goods for trade
scope: 'Also called carrack: a large old sailing ship that carried goods for trade in the Mediterranean,
  not a warship and not a small fishing boat.'
examples:
- The carack sailed from Venice with a load of spices.
- Merchants loaded their goods onto the carack before it left port.
