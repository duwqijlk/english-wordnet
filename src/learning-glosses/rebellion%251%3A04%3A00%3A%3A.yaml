senseId: 'rebellion%1:04:00::'
synsetId: 00964240-n
simpleMeaning: a group acting together against those in power, in which one side tries to take control
  from the other
scope: Also called rising, revolt and uprising. This is a group fighting those in power to take control,
  not just one person saying no to a rule.
examples:
- The rebellion spread when soldiers joined the people against the king.
- After months of fighting, the rebellion took control of the capital.
