simpleMeaning: Very good sherbet is made from the brown, egg-shaped flesh of this fruit
scope: Also called marmalade plum, this is the brown, egg-shaped flesh of a fruit used to make very good
  sherbet, not the tree that bears the fruit and not the whole fruit with its rind.
examples:
- The mammee flesh was scooped out to make sherbet for the party.
- She loved the mammee in her sherbet, sweet and brown.
