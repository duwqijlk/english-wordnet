simpleMeaning: a foot that does not have a normal shape from birth, usually with a curled shape or with
  the ankle, heel and toes in a twisted position
scope: Also called talipes. This is a foot shape problem present from birth, not a foot that was hurt
  later in life.
examples:
- The baby was born with a clubfoot and wore a special shoe.
- Doctors treated his clubfoot when he was very young.
