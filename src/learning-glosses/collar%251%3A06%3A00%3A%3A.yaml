simpleMeaning: a band round the neck of a shirt that is usually turned down over itself
scope: A band round the neck of a shirt, usually turned down over itself, not a necklace worn tight round
  the neck and not the strip round an animal's neck.
examples:
- She ironed the collar of his white shirt.
- The collar of his shirt was frayed at the edge.
