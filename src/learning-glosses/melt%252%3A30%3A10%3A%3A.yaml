simpleMeaning: to become less strong bit by bit and slowly go away
scope: 'Also called disappear: a feeling or force gets weaker bit by bit, not ice or another solid turning
  to liquid when heated, and not a shape blending into another.'
examples:
- Her anger melted away under his kind words.
- His fear melted slowly as the room grew calm.
