simpleMeaning: all the wine made from the grapes picked in one year at one vineyard
scope: All the wine made from the grapes picked in one year at one vineyard, not wine from any year and
  not the vineyard itself.
examples:
- The 1998 vintage was the best the vineyard ever made.
- This vintage comes from grapes grown on the south slope.
