simpleMeaning: Any of the small bits found in the cells of plants and of some animals; they hold the matter
  that gives colour, and also starch, oil or protein.
scope: Small bits inside the cells of plants and some animals that hold colouring matter, starch, oil
  or protein; not the whole cell and not the nucleus.
examples:
- A plastid in the leaf cell held the green colouring matter.
- Some plastids store starch or oil inside plant cells.
