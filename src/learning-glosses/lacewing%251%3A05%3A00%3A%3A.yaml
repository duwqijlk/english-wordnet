simpleMeaning: Any insect of two families, called Chrysopidae and Hemerobiidae, with thin, clear wings
  like gauze, whose young feed on small pests such as aphids.
scope: Also called a lacewing fly; an insect with thin, clear wings like gauze, whose young feed on small
  pests, not a butterfly.
examples:
- A lacewing rested on the rose leaf.
- Lacewings help the garden by eating aphids.
