simpleMeaning: something that serves as a means for expressing an idea or for achieving a result.
scope: This is a means of expression or achievement, not a transport machine and not a mixing substance.
examples:
- The newspaper became a vehicle for political debate.
- Sport is a powerful vehicle for social change.
