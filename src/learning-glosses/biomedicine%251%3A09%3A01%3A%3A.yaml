senseId: 'biomedicine%1:09:01::'
synsetId: 06056627-n
simpleMeaning: The part of medical science that uses what is known about living things and how the body
  works to treat sick people.
scope: The use of living-body science in treating patients, not the study of how living things stand up
  to hard conditions such as space travel.
examples:
- Biomedicine brings new findings about the body into the care of patients.
- She studied biomedicine to learn how living things could help treat disease.
