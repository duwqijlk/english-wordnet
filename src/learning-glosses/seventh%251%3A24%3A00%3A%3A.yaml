simpleMeaning: the place that comes after six in a list of things you can count
scope: This is the place that comes after six in a list you can count, not the space between two notes
  in music and not one part out of seven equal parts.
examples:
- Out of all the runners, he took seventh.
- Please take the seventh from the top of the list.
