simpleMeaning: to avoid or try to avoid doing, answering, or carrying out a duty, a question, or a problem
scope: 'Another name for skirt and hedge in this use: to avoid a duty, question, or problem; not the swimming
  bird and not the heavy cotton cloth.'
examples:
- He ducked the question about the missing money.
- She tried to duck her duty to clean up after the party.
