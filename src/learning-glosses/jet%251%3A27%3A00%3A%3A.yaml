simpleMeaning: a hard black kind of lignite (a soft dark kind of coal) that can be made very shiny and
  is used for jewelry and decoration
scope: This is the hard black material used for rings and other beautiful things, not an airplane and
  not a sudden stream of liquid.
examples:
- She wore a necklace made of jet.
- The ring was set with polished jet.
