simpleMeaning: A sharp part on an animal such as a wasp or scorpion, used to attack or to keep safe, often
  joined to a part that makes poison
scope: This is the sharp body part of an animal, not a drink, not a hurtful remark, and not a sharp blow.
examples:
- The wasp used its stinger to drive the bird away.
- A scorpion lifts its tail so its stinger is ready to strike.
