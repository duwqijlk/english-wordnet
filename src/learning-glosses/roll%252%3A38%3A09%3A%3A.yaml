simpleMeaning: wander from place to place with no fixed goal, often looking for food or work
scope: This means moving from place to place with no fixed goal, as people or animals do; it is not about
  turning something over and not about making a sly profit.
examples:
- After losing his job, he rolled from town to town looking for work.
- They rolled into town with no money and no plan.
