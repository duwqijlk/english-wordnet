simpleMeaning: having a design made of thin strips that cross each other to form a regular pattern with
  spaces between
scope: This sense, also called fretted and also called interlaced, is about a surface with a crossed-strip
  design. It is not a plain, solid surface with no such pattern.
examples:
- The garden gate had a latticed top that let light through.
- They sat behind a latticed screen made of thin wood strips.
