simpleMeaning: a large sea snail that eats other animals, lives in sea water near the coast and in places
  covered and uncovered by the tide, and has a strong shell
scope: A large sea snail that lives near the coast; not this animal picked as food, and not the act of
  gathering it.
examples:
- A whelk moved slowly over the rocks at low tide, inside its thick shell.
- Whelks live in shallow sea water near the shore and eat other small animals.
