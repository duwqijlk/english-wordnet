simpleMeaning: Any of several gems, such as chrysoberyl or chalcedony, that shine when cut in a round
  shape.
scope: Any of several gems, such as chrysoberyl or chalcedony, that shine when cut in a round shape; not
  a gem that shines when cut flat, and not a gem that does not shine.
examples:
- The cat's eye shone in the light.
- She wore a cat's eye stone in a ring.
