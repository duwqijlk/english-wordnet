simpleMeaning: In biochemistry, a long chain in the centre of a cell, made of small units and wound like
  two strands, that carries the plans passed from parents to young
scope: 'Also called desoxyribonucleic acid: the chain in a cell''s centre that carries what is passed
  on, not a protein, and not the cell wall.'
examples:
- Deoxyribonucleic acid carries the plans that make a child look like its parents.
- Every cell holds deoxyribonucleic acid wound in two strands.
