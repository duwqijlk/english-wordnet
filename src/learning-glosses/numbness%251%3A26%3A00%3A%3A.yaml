simpleMeaning: a part of the body that feels little or nothing at all, a sign that a nerve is hurt or
  not working right
scope: A loss of feeling in part of the body, a sign of nerve trouble, not a dull lack of interest in
  things.
examples:
- The numbness in her fingers made it hard to hold a pen.
- He felt a numbness spread up his arm after the injury.
