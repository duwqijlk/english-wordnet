simpleMeaning: a light that shines yellow over a street when power flows through a tube of gas
scope: A light that shines yellow over a street from a gas-filled tube, also called a sodium-vapor lamp;
  not a light that gives white light and not a light for a room.
examples:
- A sodium-vapour lamp lit the corner where the road turned.
- The sodium-vapour lamp above the bus stop gave off a warm yellow light.
