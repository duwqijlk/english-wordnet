senseId: 'gearing%1:06:00::'
synsetId: 03436655-n
simpleMeaning: a joined set of turning toothed wheels that pass on force and change movement or turning
  power
scope: Also called train, gear, geartrain, and power train. This is a whole joined set of turning wheels,
  not one wheel on its own and not the act of getting ready for something.
examples:
- The gearing in the old clock turns slowly and keeps the hands moving.
- A bicycle's gearing helps a rider pedal up a steep hill.
