simpleMeaning: a stage performer who seems to know what someone else is thinking, usually by means of
  clever signs from a helper
scope: 'A stage act, also called a mind reader or thought-reader: the performer only seems to know thoughts,
  not a person who truly reads minds and not a magician doing other tricks.'
examples:
- The telepathist asked a woman from the crowd to think of a number.
- The telepathist seemed to know the card the man had picked.
