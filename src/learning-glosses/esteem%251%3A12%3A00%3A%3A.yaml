simpleMeaning: a warm feeling of liking someone or something, with great pleasure in them
scope: 'Also called admiration: a warm feeling of liking with great pleasure, not thinking highly of someone
  for their qualities and not the state of being honoured by others.'
examples:
- The crowd showed its esteem for the singer with loud cheers.
- He felt deep esteem for the kind nurse who had helped him.
