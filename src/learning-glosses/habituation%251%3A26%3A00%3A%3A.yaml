simpleMeaning: The state of needing something habit-forming in mind or body, above all drink or drugs,
  after growing able to take a lot of it.
scope: Also called addiction, dependence, dependency and dependance, this is the state of needing something
  habit-forming after growing used to it.
examples:
- His habituation to the drug meant he needed larger doses to feel the same effect.
- Habituation to alcohol can leave a person unable to stop drinking.
