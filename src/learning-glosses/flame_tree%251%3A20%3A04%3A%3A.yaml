senseId: 'flame_tree%1:20:04::'
synsetId: 12515299-n
simpleMeaning: A showy tropical tree or shrub from Madagascar, widely planted in warm regions for its
  huge sprays of scarlet and orange flowers, sometimes classed in the genus Poinciana.
scope: This is the Madagascar tree with scarlet and orange flower sprays, not the Australian flame trees
  with white, yellow-orange, or scarlet blooms.
examples:
- A flame tree in bloom looks like a bonfire of red and orange.
- We planted a flame tree by the gate for its brilliant summer flowers.
