simpleMeaning: to cover a person's body with sticky black stuff and soft light bits from birds, as a punishment
scope: This is smearing a person's body with tar and feathers to punish them, not a way of painting a
  wall and not a fair court sentence.
examples:
- The angry crowd threatened to tar-and-feather the thief.
- In the old story, the villagers planned to tar-and-feather the man who had cheated them.
