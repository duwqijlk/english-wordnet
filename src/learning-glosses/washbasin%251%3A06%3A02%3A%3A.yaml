simpleMeaning: a sink in a bathroom, fixed in place and joined to pipes that bring water in and take it
  away, where you can wash your hands and face
scope: 'Also called basin, lavatory, washstand and washbowl: a fixed sink in a bathroom for washing your
  hands and face, not a bath and not a bowl you can carry.'
examples:
- He washed his face in the washbasin before breakfast.
- The washbasin in the small bathroom is white.
