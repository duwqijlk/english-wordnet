simpleMeaning: A plant of the prairies and desert areas of the southwestern United States and Mexico.
scope: Also called Erodium texanum, this storksbill plant grows in the dry prairies and deserts of the
  southwestern United States and Mexico, close in kind to other storksbill plants of dry places in the
  west.
examples:
- A Texas storksbill grows on the dry prairie in the southwest.
- We found a Texas storksbill in the desert of northern Mexico.
