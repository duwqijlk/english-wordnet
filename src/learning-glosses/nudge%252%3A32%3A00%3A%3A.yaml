simpleMeaning: to get a person to act by asking again and again in a soft way that still bothers them
scope: This is getting a person to act by soft, repeated asking that bothers them, not by a hard push
  and not by a firm order.
examples:
- She nudged him to send the letter before the day ended.
- I nudged her again and again until she agreed to call.
