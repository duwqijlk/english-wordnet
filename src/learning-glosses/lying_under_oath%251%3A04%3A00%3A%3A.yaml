simpleMeaning: After swearing to tell the truth, a person who says things that are not true commits a
  crime
scope: Also called perjury and bearing false witness, this is the crime of saying what is not true under
  oath, not a plain lie and not a mistake in court.
examples:
- He was charged with lying under oath after his story changed.
- Lying under oath can send a witness to prison.
