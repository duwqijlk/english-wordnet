simpleMeaning: with no fingers, because they were never there or were lost
scope: This describes a person or a hand with no fingers, whether the fingers were never there or were
  lost; it does not describe a hand that has all its fingers.
examples:
- Born fingerless on one hand, she learned to write with the other.
- After the accident, he was fingerless on his left hand and used a special tool.
