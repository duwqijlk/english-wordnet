simpleMeaning: a way of walking in which the steps get shorter and quicker without the person meaning
  to, seen in some illnesses such as Parkinson's disease
scope: A way of walking with steps that shorten and quicken without meaning to, not a normal quick walk
  and not a limp.
examples:
- Festination made his steps shorter as he crossed the room.
- In Parkinson's disease, festination can make walking hard to control.
