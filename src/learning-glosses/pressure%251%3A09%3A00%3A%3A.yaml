simpleMeaning: the bodily feeling produced when a force is applied to a patch of skin
scope: This is the felt sensation on the skin, not the force itself, not the act of pushing something,
  and not the weight of the air around us.
examples:
- She felt a gentle pressure on her shoulder and turned around.
- The tight bandage made him feel pressure on his arm.
