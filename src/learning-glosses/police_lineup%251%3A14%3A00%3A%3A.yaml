simpleMeaning: A row of people put together by officers so that someone can look at them and pick one
  out
scope: 'Also called a lineup or an identity parade: a row of people put together by officers so that someone
  can look at them and pick one out, not a list of names and not a queue of people waiting.'
examples:
- The witness looked at the police lineup.
- He was asked to stand in the police lineup.
