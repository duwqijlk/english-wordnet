simpleMeaning: A fine hanging of rich cloth put behind the altar of a church or at the sides of the chancel
scope: A fine hanging of rich cloth put behind the altar of a church or at the sides of the chancel; dossel
  is another name for it, not a curtain and not a carpet.
examples:
- The dossal hung behind the altar in deep red cloth.
- A dossal covered the wall at the side of the chancel.
