simpleMeaning: a Roman Catholic bishop who holds a title but has no church area of his own, sent to serve
  in a place where most people are not Roman Catholic
scope: A bishop with a title but no church area of his own, sent to a place where most people are not
  Roman Catholic, not a bishop who leads a church area and not a priest who helps a parish priest.
examples:
- The vicar apostolic led the small Catholic community in the mountain town.
- Pope Francis named a new vicar apostolic for the region.
