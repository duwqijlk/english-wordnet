simpleMeaning: with parts like wings, said of seeds or insects
scope: 'Another name for it is alated: having winglike parts, said of seeds or insects, not having real
  wings that can fly and not having leaves that spread out flat.'
examples:
- Alate seeds of a maple tree drift down on the wind.
- The alate leaves spread wide from the stem.
