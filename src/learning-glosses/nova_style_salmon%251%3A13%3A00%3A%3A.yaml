simpleMeaning: A fish cured in salt water, less salty than most kinds; sugar is sometimes used too.
scope: Also called Nova lox, Nova salmon, Nova Scotia lox, and Nova Scotia salmon; a fish cured in salt
  water and less salty than most, not smoked salmon and not fresh salmon.
examples:
- Nova style salmon is cured in brine, and sugar is sometimes used too.
- Nova style salmon is a mild kind of cured fish.
