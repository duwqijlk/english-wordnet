simpleMeaning: A harmless North American snake with an upturned nose, which may spread its head and neck
  or play dead when disturbed
scope: Hognose snake and puff adder are other names for this harmless North American snake with a nose
  that turns up, not the highly venomous snake of northern Africa and southwestern Asia of the same name.
examples:
- The sand viper spread its head and neck when it was troubled.
- A sand viper lay still as if dead.
