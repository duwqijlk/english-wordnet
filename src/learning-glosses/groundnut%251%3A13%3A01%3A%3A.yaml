simpleMeaning: usually two nuts or seeds sit inside a pod that grows on a peanut vine; both this name
  and monkey nut are British
scope: Also called peanut, goober, earthnut, goober pea, and monkey nut; the pod of the peanut vine, not
  the vine with edible tubers of the same name.
examples:
- She cracked open a groundnut and found two nuts inside.
- In Britain, a groundnut is the pod of the peanut vine.
