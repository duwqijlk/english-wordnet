simpleMeaning: For close study with strong lenses, a tiny sample sits on this thin flat four-sided piece
  of glass
scope: Also called a slide, this is a flat piece of glass that holds a sample for close study, not the
  flat shelf the sample sits on and not a photograph slide.
examples:
- She put the drop of blood on a microscope slide.
- The microscope slide held a thin slice of leaf.
