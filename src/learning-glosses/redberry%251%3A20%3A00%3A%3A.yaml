simpleMeaning: Bright crimson fruit hangs on this small bush with sharp points, which keeps its leaves
  all year in the west of the United States and Mexico.
scope: Also called red-berry, this small bush with sharp points keeps its leaves all year and bears bright
  crimson fruit, not the herb with poisonous fruit.
examples:
- A redberry grew on the hillside.
- We saw a redberry in the west of the United States.
