simpleMeaning: A thick-clumped fern kin of the southwestern United States to Peru that curls into a tight
  ball when dry and opens and grows when wet.
scope: This sense is a thick-clumped fern kin of the southwestern United States to Peru, unlike the sense
  for a small grey Asiatic desert plant with tiny white flowers that rolls up when dry and opens when
  moist.
examples:
- Resurrection plants curl into tight balls when dry.
- The resurrection plant opened and grew after rain.
