senseId: 'clitic%1:10:01::'
synsetId: 92460927-n
simpleMeaning: A word that in speech joins onto a word next to it, and is often said without stress or
  in a shortened form.
scope: A word that in speech joins onto a word next to it, and is often said without stress or in a shortened
  form; not a word that stands on its own and not a word said with full stress.
examples:
- The word 's in 'it's' is a clitic joined to the word before it.
- In French, the little word 'l' acts as a clitic before a vowel.
