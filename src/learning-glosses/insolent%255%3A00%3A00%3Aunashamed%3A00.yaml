simpleMeaning: holding back nothing, even when good manners or the rules say to stop
scope: 'Also called brazen: holding back nothing out of boldness, not the rude, offhand disrespect of
  the other sense of insolent.'
examples:
- The insolent display of wealth shocked the whole town.
- She answered with insolent boldness, caring nothing for what people thought.
