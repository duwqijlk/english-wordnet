simpleMeaning: A rail that runs sideways and is fixed in place, where a horse is tied so it cannot wander
  off
scope: Also called a hitching bar, this is a rail fixed in place for tying up a horse, not a fence for
  a field and not a gate.
examples:
- The old hitchrack still stands outside the blacksmith's shop.
- They tied the ponies to the hitchrack while they ate lunch.
