simpleMeaning: The act of moving a finger quickly across the thumb, from the tip of the thumb down to
  its base, on the same hand
scope: This is the action of moving a finger across the thumb, not the sound that this move makes, not
  a bean, and not a part on clothing.
examples:
- He gave his fingers a snap, moving his middle finger down his thumb.
- With a snap of her fingers, she showed the children how the move is done.
