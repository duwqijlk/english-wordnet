simpleMeaning: like a wild animal, and showing no human feeling for others
scope: 'Also called brute and beastly: this sense means like a wild animal with no human feeling, not
  the sense about a person ready to cause pain and suffering.'
examples:
- With a brutal snarl, he tore at the meat like a wild animal.
- His brutal manners showed no human feeling at all; he pushed the child aside without a word.
