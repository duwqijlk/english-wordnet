simpleMeaning: A switch on an electrical device that works when you press it.
scope: This is the small switch you press, not the act or force of shoving something away, nor the verb
  meaning to campaign for a cause.
examples:
- The elevator was operated by a row of push buttons.
- A small push beside the bed rang a bell in the kitchen.
