senseId: 'wrongheadedly%4:02:00::'
synsetId: 00200566-r
simpleMeaning: In a mistaken way, holding to a view that is not right
scope: In a mistaken way, holding to a view that is not right, not in a right way and not merely in a
  foolish way.
examples:
- He wrongheadedly refused every offer of help.
- She wrongheadedly kept to a plan that could not work.
