simpleMeaning: any rough weed of the plant group called Xanthium, with prickly seed cases
scope: Any rough weed of the plant group called Xanthium, with prickly seed cases; cocklebur, cockle-burr
  and cockleburr are other names for this, not a smooth weed and not a weed without prickly seed cases.
examples:
- Cockle-bur grows along the roadside.
- The dog came home covered in cockle-bur seed cases.
