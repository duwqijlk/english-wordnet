simpleMeaning: a sharp, angry remark aimed at a person and meant to have a strong effect on them
scope: 'Also called shot, dig, slam, and shaft: an unkind remark aimed at a person, not a part of a feather,
  not a point on a weapon, and not the pointed part of barbed wire.'
examples:
- His last barb hurt her more than the argument itself.
- She sent a sharp barb at her rival during the debate.
