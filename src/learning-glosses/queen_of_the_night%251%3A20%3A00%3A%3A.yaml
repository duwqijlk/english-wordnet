simpleMeaning: A climbing cactus from tropical America with three-sided branches, often grown for its
  big, showy flowers that open at night and are followed by yellow fruits streaked with red.
scope: A night-flowering climbing cactus, not a desert barrel cactus or a Christmas cactus.
examples:
- The queen of the night sends out long, three-sided branches.
- Yellow fruits streaked with red follow the flowers of the queen of the night.
