simpleMeaning: A middling to large leaf-shedding tree of the east of the United States, whose hard-wearing
  wood is used as timber or split and woven into baskets or chair seats.
scope: Also called basket oak, cow oak, and Quercus prinus; a middling to large leaf-shedding tree of
  the east of the United States whose wood is used as timber or woven into baskets or chair seats.
examples:
- The Quercus montana in the woods gives wood for baskets.
- Quercus montana wood is split and woven into chair seats.
