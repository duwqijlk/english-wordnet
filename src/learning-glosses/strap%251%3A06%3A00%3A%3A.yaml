simpleMeaning: a strip of leather used to hit a person hard as a punishment
scope: A leather strip used to hit someone as a punishment, not a loop to hold on a bus, not a strip for
  tying things, and not a band over the shoulder.
examples:
- He was beaten with a strap for breaking the rules.
- In those days, a strap was used to punish children at school.
