simpleMeaning: A condition present from birth, caused by an extra 21st chromosome, that gives a flat face,
  short height and slow learning.
scope: Also called mongolianism, mongolism, trisomy 21 and Down's syndrome, this is a condition present
  from birth, caused by an extra 21st chromosome, that gives a flat face, short height and slow learning,
  unlike other chromosome conditions such as Edwards syndrome and Turner syndrome.
examples:
- Down syndrome is caused by an extra 21st chromosome.
- People with Down syndrome may learn more slowly than others.
