simpleMeaning: A cup-shaped fruit body found in many lichens and in fungi that make their spores in sacs.
scope: A cup-shaped fruit body in many lichens and sac fungi, not a flat sheet of fungus and not a mushroom
  cap.
examples:
- The apothecium stood out as a small cup on the lichen.
- Apothecia release spores from the cups on the fungus.
