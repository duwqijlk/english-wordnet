simpleMeaning: To stop a sailing boat being pushed sideways by the wind, a fin keel under the boat that
  can be raised or lowered.
scope: A fin keel under a sailing boat, also called a centerboard, a drop keel, or a sliding keel, that
  can be raised or lowered to stop the boat being pushed sideways by the wind.
examples:
- The centreboard jammed halfway down in the mud.
- She lowered the centreboard before the wind freshened.
