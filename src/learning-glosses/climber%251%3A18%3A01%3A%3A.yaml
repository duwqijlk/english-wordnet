simpleMeaning: a person who tries to rise in society by flattering powerful people and doing whatever
  they want
scope: A person who flatters powerful people to gain a higher place in society, not a person who goes
  up mountains for fun, not a vine that grows up a support, and not an iron spike worn on a shoe.
examples:
- The climber fawned over every guest at the party.
- He was dismissed as a mere social climber.
