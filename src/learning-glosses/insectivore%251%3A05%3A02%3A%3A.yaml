simpleMeaning: A living thing that gets most of its food from six-legged bugs
scope: A living thing that eats mostly six-legged bugs; not only the small night mammals that eat them.
examples:
- A Venus flytrap is an insectivore that catches flies in its leaves.
- Many birds are insectivores, feeding their young on caterpillars.
