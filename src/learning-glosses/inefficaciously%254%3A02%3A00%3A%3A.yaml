senseId: 'inefficaciously%4:02:00::'
synsetId: 00327957-r
simpleMeaning: in a way that does not work or get the wanted result
scope: Doing something in a way that does not work or get the wanted result; ineffectively is another
  name for this sense, not merely doing it slowly and not doing it wrongly on purpose.
examples:
- He dealt with the problem rather inefficaciously.
- She worked inefficaciously, and the leak went on.
