simpleMeaning: Not covered by the layer that would normally be there, as when feet have no shoes or a
  hill has no plants.
scope: This sense is about a surface or body part with nothing over it, not about a small amount and not
  about a plain style.
examples:
- The children ran across the sand in bare feet.
- Years of rain had left the slope a bare rock face.
