simpleMeaning: A group of aircraft moving together through the air in an arranged pattern.
scope: This is the group of aircraft itself, not a single plane trip, not the act of moving through the
  air, and not a set of stairs.
examples:
- A flight of fighter jets passed low over the city.
- The squadron sent a flight of three helicopters to the rescue.
