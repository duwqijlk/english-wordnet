senseId: 'rigidity%1:07:01::'
synsetId: 04667618-n
simpleMeaning: the quality of being very strict and severe and not changing
scope: 'Another name for this sense is inflexibility: it is about being very strict and severe and not
  changing; it is not the sense about a thing being stiff and not bending easily.'
examples:
- His rigidity in running the school left no room for new ideas.
- The rigidity of the rules made life hard for everyone in the office.
