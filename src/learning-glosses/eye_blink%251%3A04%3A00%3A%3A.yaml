senseId: 'eye_blink%1:04:00::'
synsetId: 00118779-n
simpleMeaning: Without thinking, the lids shut and open again in a very short time
scope: 'Also called a blink, a wink, blinking, winking, nictation, and nictitation: a quick shut and open
  of the lids that happens on its own, not a long closing of the lids in sleep and not a sign made on
  purpose.'
examples:
- An eye blink can clear dust from the surface of the eye.
- The eye blink happened so fast that she barely noticed it.
