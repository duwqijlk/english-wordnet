simpleMeaning: Near and far things come into focus at the same time with a clear disc put in the eye,
  with several rings round one centre.
scope: This disc, put in the eye, brings near and far things into focus at once, not near things alone.
examples:
- A multifocal lens implant brings a book and the road into focus at the same time.
- The multifocal lens implant lets the eye see near things and far things at once.
