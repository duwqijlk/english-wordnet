senseId: 'redundancy%1:10:00::'
synsetId: 07105130-n
simpleMeaning: sending the same message more than once, so that mistakes are less likely when it is sent
scope: Sending the same message again so mistakes in sending are less likely; not a machine system with
  extra parts ready if one part fails, and not the fact of being extra and not needed.
examples:
- The system uses redundancy in its messages, sending each one twice so errors are less likely.
- By redundancy, the pilot sent the same message three times to make sure no error got in.
