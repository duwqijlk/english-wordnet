simpleMeaning: In the study of how living things change over time, the idea that change in old remains
  came in short bursts with long quiet times between, not slow and steady
scope: The idea that change came in short bursts with long quiet times between; also called theory of
  punctuated equilibrium. Not the idea that change is always slow and steady, and not a sudden change
  in one animal alone.
examples:
- Punctuated equilibrium says that new kinds of animals can appear in quick bursts.
- Under punctuated equilibrium, long times with little change are broken by short bursts of change.
