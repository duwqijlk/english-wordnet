simpleMeaning: A bean of tropical America, bearing red blooms and mottled black beans akin to Phaseolus
  vulgaris yet perennial, a favoured table bean across Great Britain.
scope: This sense is also called runner bean and scarlet runner bean, for a bean of tropical America,
  bearing red blooms and mottled black beans, unlike the sense for a hairy trailing or flat western Australian
  vine with bright scarlet-pink flowers.
examples:
- Scarlet runners grew red blooms.
- Scarlet runner beans feed Great Britain.
