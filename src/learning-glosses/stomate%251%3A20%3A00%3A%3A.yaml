simpleMeaning: A tiny hole in the skin of a leaf or stem through which gases and water vapour can pass
scope: A tiny hole in the skin of a leaf or stem, also called a pore and a stoma; not a tear in the leaf
  and not a spot of disease.
examples:
- A stomate is a tiny hole in the skin of a leaf.
- Stomates let water vapour pass out of the leaf.
