simpleMeaning: to try to make someone do something by threatening them
scope: This is not making someone act through argument or need, and not pushing a surface; it works through
  fear of harm.
examples:
- The gang pressured the shopkeeper into paying by threatening his family.
- He was pressured into giving them the keys after they threatened him.
