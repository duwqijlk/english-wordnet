simpleMeaning: in statistics, the whole collection of items that a sample comes from
scope: The full set of items a sample comes from, not the people living in a place, a group of animals
  of one species, or the number of inhabitants.
examples:
- Researchers drew a sample from a population of 10,000 patients.
- The study's population included every school in the district.
