simpleMeaning: the stem of climbing palms of more than one kind, used to make furniture, walking sticks
  and things woven from thin stems
scope: 'Also called rattan cane: the stem used to make things, not the whole climbing palm plant itself
  and not a thin stick made from the stem.'
examples:
- The chair was made from rattan woven into a strong seat.
- He cut long lengths of rattan to make a basket.
