simpleMeaning: Heating a solid in a closed container and catching the gases and liquids that come off
  it
scope: This is heating a solid in a closed container and catching what comes off it, not boiling a liquid
  to purify it and not burning a thing in the open air.
examples:
- Destructive distillation of coal yields gas and tar.
- The old works used destructive distillation to make wood gas.
