senseId: 'newtonian_reflector%1:06:00::'
synsetId: 03828307-n
simpleMeaning: A star-gazing glass that uses mirrors, in which the image is seen through a side piece
  set at a right angle to the main tube
scope: Also called Newtonian telescope; a star-gazing glass that uses mirrors, not a glass that uses lenses
  and not a pair of field glasses.
examples:
- The Newtonian reflector gave a clear view of the rings of Saturn.
- He set up his Newtonian reflector in the garden at night.
