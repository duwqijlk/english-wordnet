simpleMeaning: to make sounds or voices fit well together when people sing or play music
scope: To make music or singing fit well together, also called chord and harmonise; it is not about making
  plans or ideas agree, and not about writing music parts.
examples:
- The teacher helped the singers harmonize their voices.
- They harmonized the tune so the parts fit well together.
