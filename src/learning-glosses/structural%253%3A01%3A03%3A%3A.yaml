simpleMeaning: In geology, to do with how the rocks and layers of the earth lie and are shaped.
scope: In geology, to do with the earth's rocks and layers; not the build of a house, and not politics
  or money.
examples:
- They studied the structural features of the Black Hills.
- Structural effects of folding shaped the hills.
