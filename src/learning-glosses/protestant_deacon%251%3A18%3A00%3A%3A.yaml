simpleMeaning: One of those Christians, an ordinary church member, helps the priest.
scope: Also called deacon; this ordinary church member helps the priest, not the priest himself and not
  a member of another church.
examples:
- The Protestant deacon helped the minister with the service.
- A Protestant deacon stood beside the minister during the service.
