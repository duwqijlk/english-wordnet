simpleMeaning: red birds from Asia that weave nests and are often kept in cages
scope: 'Also called amadavat: a red Asian bird that weaves nests and is often kept in a cage, not a bird
  that lives only in the wild and not a different red bird.'
examples:
- The avadavat sang from its cage by the window.
- She kept a pair of avadavats in a large cage in her room.
