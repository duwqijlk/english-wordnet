simpleMeaning: a two-electrode vacuum tube in which electric and magnetic fields steer electrons from
  a central negative electrode to a surrounding positive one, used mainly to generate microwaves.
scope: This is the two-electrode vacuum tube that produces microwaves, not an ordinary diode, an amplifier
  tube such as a triode, or the microwave oven that uses it.
examples:
- The radar set's magnetron generates short bursts of microwaves.
- Engineers replaced the magnetron inside the microwave oven.
