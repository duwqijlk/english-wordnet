simpleMeaning: to follow a twisting, curving, or circling path, or to make something move that way.
scope: This describes movement along a twisting or circling path, not the noun for moving air and not
  the act of turning a key or a handle.
examples:
- The river winds through the valley for miles.
- She wound the string tightly around her finger.
