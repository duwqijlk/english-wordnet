simpleMeaning: the instruments that a written piece of music asks for, for a band or a large group of
  music players
scope: This is the set of instruments written music asks for, not a tool used to get a job done and not
  the act of writing music parts for players.
examples:
- The instrumentation for this song is just piano and drums.
- She changed the instrumentation to add more strings.
