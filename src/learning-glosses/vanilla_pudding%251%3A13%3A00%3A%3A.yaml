simpleMeaning: Most often thickened with flour rather than eggs, this sweet dish is like custard and carries
  the taste of the plant it is named for.
scope: 'This sweet dish is like custard but is not custard itself: it carries the taste of the plant it
  is named for and is thickened most often with flour rather than eggs.'
examples:
- This vanilla pudding was made with flour instead of eggs.
- We ate vanilla pudding and went back for more.
