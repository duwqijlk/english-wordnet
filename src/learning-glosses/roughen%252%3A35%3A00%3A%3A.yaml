simpleMeaning: to make something less smooth, or to make something that is already not smooth even less
  smooth
scope: To make something less smooth, or less smooth still if it is already not smooth; not to damage
  or break it, and not to make it smooth.
examples:
- Roughen the wood with coarse paper before you paint it.
- Years of wind and rain roughened the face of the stone.
