simpleMeaning: In a crisis like this, people make one last hard try, because losing is the only other
  choice.
scope: This is a crisis in which one last hard try is the only way to avoid losing; it is not the town
  of that name and not a military escape.
examples:
- They faced a Dunkirk when the talks broke down.
- The team pulled off a Dunkirk to stay in the race.
