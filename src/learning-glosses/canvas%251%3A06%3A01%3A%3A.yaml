simpleMeaning: the mat that makes the floor of the ring where boxers and wrestlers who do this for work
  fight each other
scope: This is the mat floor of a boxing or wrestling ring, not the cloth that catches the wind on a boat,
  not a tent, and not a painting.
examples:
- The boxer fell hard onto the canvas and could not get up.
- The wrestler was thrown down onto the canvas in the ring.
