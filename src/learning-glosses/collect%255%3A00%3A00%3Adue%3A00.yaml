simpleMeaning: paid for by the person who gets it when it is given to them
scope: This word describes a call or package that is paid for by the person who gets it. It is not the
  church prayer and not the act of gathering things.
examples:
- She made a collect call, and her mother paid for it.
- He sent a collect parcel, so we paid when it arrived.
