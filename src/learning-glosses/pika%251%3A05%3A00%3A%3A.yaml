simpleMeaning: Among the rocks of high ground in Asia and western North America lives this small, short-eared
  mammal that burrows.
scope: Also called a coney, a cony, a mouse hare, or a rock rabbit, it burrows among the rocks of high
  ground in Asia and western North America.
examples:
- The pika burrowed among the rocks of the high ground.
- The pika's burrow lay among the rocks of the high ground.
