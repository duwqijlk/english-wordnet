senseId: 'alula%1:05:02::'
synsetId: 02193117-n
simpleMeaning: a flat part like a scale where a two-winged fly's wing joins its body, next to the small
  knob that steadies it in flight
scope: A small scale-like part on a two-winged fly, between the wing base and the knob that steadies it
  in flight; calypter is another name for this sense, not the tuft of feathers on a bird's wing.
examples:
- The alula helps the fly steer as it turns in the air.
- Under the lens, the alula showed as a tiny flap beside the wing base.
