simpleMeaning: to make something hard by heating it again and then cooling it in oil
scope: 'Also called temper: this is making something hard by heating it again and cooling it in oil; it
  is not just becoming hard, making something hard in any way, or getting used to something hard to bear.'
examples:
- The worker hardened the steel by heating it again and cooling it in oil.
- They harden each blade in hot oil after heating it again.
