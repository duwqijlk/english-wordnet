simpleMeaning: A group of musicians who play brass, woodwind and percussion instruments.
scope: A group of musicians who play brass, woodwind and percussion instruments, also called a concert
  band; not a group that plays only strings and not a single player.
examples:
- The military band played brass and woodwind at the parade.
- A military band marched past with drums and trumpets.
