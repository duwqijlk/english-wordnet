simpleMeaning: slowing down or stopping viruses from growing and making more of themselves
scope: This describes a drug or action that works against viruses, not one that works against other germs
  or that stops all illness.
examples:
- She took an antiviral drug for the flu.
- The doctor gave him antiviral medicine to stop the virus.
