simpleMeaning: one of several trees in the group called Populus in plant science, with leaves on flat
  stalks that shake in even a very light wind
scope: This is a tree whose leaves move in even a light wind; it is not a place name and not the wood
  used by itself.
examples:
- The aspen leaves shook in the soft wind.
- We rested under a tall aspen by the river.
