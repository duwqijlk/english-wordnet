simpleMeaning: sharing what other people feel, especially their sadness or pain
scope: This is sharing another person's feelings, especially sadness or pain; it is not the sense of a
  close link between people where what happens to one also affects the other.
examples:
- She wrote to him with great sympathy after his mother died.
- Many people showed sympathy for the families who lost their homes.
