simpleMeaning: a public or private place of business, government, learning, or living, with its buildings
  and tools
scope: A public or private place with buildings and equipment, not the act of starting something and not
  the people who run a body.
examples:
- The new establishment opened its doors to students last year.
- The establishment has offices in three towns.
