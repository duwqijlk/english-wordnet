simpleMeaning: Moving and bending with ease, slim and graceful
scope: 'Another name for lissom, lithe, lithesome, sinuous and supple: moving and bending with ease, slim
  and graceful, not stiff and heavy and not thick-set.'
examples:
- The lissome gymnast bent and moved with ease.
- The lissome cat stretched and moved with ease.
