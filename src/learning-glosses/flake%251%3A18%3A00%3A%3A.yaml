simpleMeaning: a person whose way of thinking or acting is strange or not like most people
scope: This is a person with a strange way of acting, not coming off in thin small pieces, covering something
  with thin pieces, or making thin pieces.
examples:
- Everyone calls Tom a flake because his ideas are so strange.
- She is a bit of a flake, always changing her plans in odd ways.
