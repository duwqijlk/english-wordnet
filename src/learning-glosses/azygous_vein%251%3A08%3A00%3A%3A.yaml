simpleMeaning: a vein that drains the chest and abdominal walls, formed as a continuation of the right
  lower-back vein and ending in the large vein returning blood to the heart
scope: This is the vein that drains the chest and abdominal walls; azygos vein and vena azygos are other
  names for it, not separate vessels.
examples:
- The azygous vein was clearly visible on the scan.
- Blood from the chest wall drains into the azygous vein.
