simpleMeaning: This is the part of the sea where the floor drops steeply from the shelf to the deep sea
  floor.
scope: This steep fall of the sea floor from the shelf to the deep sea floor is also called the bathyal
  district and the continental slope.
examples:
- Beyond the shelf, the sea floor falls away in the bathyal zone.
- The bathyal zone marks the steep drop from the shelf to the deep sea floor.
