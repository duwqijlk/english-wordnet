simpleMeaning: to hold something in your arms as if it were in a small bed for a baby, or to put it in
  such a bed
scope: This is holding something in your arms as if it were in a small bed for a baby, or putting it in
  such a bed; not washing earth for gold and not cutting grain.
examples:
- He cradled the infant in his arms.
- She cradled the small dog gently against her chest.
