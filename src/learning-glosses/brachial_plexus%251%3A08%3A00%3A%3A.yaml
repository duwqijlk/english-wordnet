simpleMeaning: Serving the arm and parts of the shoulder, a net of nerves made from the nerves of the
  spine in the neck and chest
scope: Also called plexus brachialis, this net of nerves joins the spine in the neck and chest to the
  arm and parts of the shoulder.
examples:
- The brachial plexus carries signals from the neck and chest to the arm.
- The brachial plexus links the nerves of the spine in the neck and chest with the arm.
