senseId: 'compensating_balance%1:21:00::'
synsetId: 13431023-n
simpleMeaning: The smallest sum a bank may make a borrower keep in the bank to get a loan; a usual need
  when a bank sets up a line of credit
scope: The smallest sum a bank may make a borrower keep in the bank to get a loan; offsetting balance
  is another name for this sense, not the loan itself and not the interest paid on it.
examples:
- The bank asked her to keep a compensating balance to get the loan.
- A compensating balance is a usual need when a bank sets up a line of credit.
