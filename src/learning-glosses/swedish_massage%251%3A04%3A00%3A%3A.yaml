simpleMeaning: Rubbing of the body joined with a set of exercises, some done by the person and some done
  for them, for the muscles and joints.
scope: This is rubbing of the body joined with a set of exercises for the muscles and joints, not rubbing
  alone and not exercise alone.
examples:
- She had a Swedish massage, with rubbing and gentle exercises for her sore joints.
- A Swedish massage joins rubbing with exercises for the muscles.
