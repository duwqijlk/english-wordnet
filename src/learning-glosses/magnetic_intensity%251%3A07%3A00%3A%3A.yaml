simpleMeaning: The pull flows one way; straight across that way, a small flat bit of space has an amount
  of pull from a magnet in it
scope: Also called magnetic field strength, magnetic flux density and magnetic induction, this is how
  much pull from a magnet passes through a small flat bit of space, not the pull itself and not the act
  of making a thing pull.
examples:
- The magnetic intensity rose when the current was turned up.
- A stronger magnetic intensity pushed the needle further round.
