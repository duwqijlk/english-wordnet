simpleMeaning: A patient feels nothing where the body would touch the seat of a horse, once a shot that
  deadens feeling is put into the cord down the back.
scope: This sense is also called saddle block anesthesia.
examples:
- The saddle block anaesthesia left the patient feeling nothing.
- Once the saddle block anaesthesia took hold, the patient felt no pain.
