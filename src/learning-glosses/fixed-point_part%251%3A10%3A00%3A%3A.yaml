simpleMeaning: The share after the dot in the written form of a log number; in 'log 643 = 2.808' it is
  .808
scope: This is the share after the dot in the written form of a log number; mantissa is another name for
  this sense, not the whole number before the dot and not the log itself.
examples:
- The fixed-point part of the log was .808.
- She found the fixed-point part after the dot.
