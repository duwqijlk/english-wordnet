simpleMeaning: a middle-sized tree of the north-east of North America whose leaves give off a sweet resin
  smell when crushed, much used for paper wood and Christmas trees
scope: A middle-sized tree of north-eastern North America, not a pine and not a spruce.
examples:
- The balsam fir in the yard fills the air with scent when its leaves are crushed.
- Many balsam fir trees are cut each year for Christmas trees.
