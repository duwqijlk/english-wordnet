simpleMeaning: A gum that softens with heat, from indene and coumarone joined as one, for coats and paint
  and blacktop tiles.
scope: This sense is also called coumarone-indene resin, a gum that softens with heat, from indene and
  coumarone joined as one, for coats and paint and blacktop tiles.
examples:
- Coumarone resins coat paint.
- The coumarone resin softens with heat.
