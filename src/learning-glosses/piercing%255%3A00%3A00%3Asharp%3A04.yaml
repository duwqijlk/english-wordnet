simpleMeaning: giving a sharp pain, as if from a sharp tool
scope: 'Also called cutting, keen and stabbing: hurting in a sharp way. This is about pain, cold or wind
  that hurts, not about a mind that notices small differences well.'
examples:
- A piercing pain ran through his bad tooth.
- The piercing cold went through her thin coat.
