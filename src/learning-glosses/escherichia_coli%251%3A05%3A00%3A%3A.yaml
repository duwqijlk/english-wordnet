simpleMeaning: A kind of germ usually found in the guts of people and other animals; sometimes it causes
  illness and can make food unsafe
scope: A kind of germ usually found in the guts of people and other animals, sometimes causing illness
  and able to make food unsafe; E. coli is another name for it, not a germ that always causes illness
  and not a germ found only in people.
examples:
- Escherichia coli lives in the guts of people and animals.
- Some Escherichia coli can make food unsafe to eat.
