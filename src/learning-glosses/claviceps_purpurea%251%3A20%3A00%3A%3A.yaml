simpleMeaning: A fungus that attacks grain plants, making tight black lumps of threadlike growth in place
  of many grains; it gives alkaloids used as medicines and lysergic acid.
scope: 'Also called ergot: a fungus that attacks grain plants, not a mushroom grown for food and not a
  mould on bread.'
examples:
- The Claviceps purpurea fungus replaced the rye grains with black lumps.
- Farmers fear Claviceps purpurea in wet summers.
