simpleMeaning: to do with the belief in things beyond what people can grasp, or typical of that belief
scope: To do with the belief in things beyond human grasp, or typical of it; not a person who holds that
  belief, and not the adjective for something merely hard to understand.
examples:
- The book spoke of mystic rites and secret prayers.
- She studied mystic writings from the Middle Ages.
