simpleMeaning: The movement of stretching out your arm or hand to touch something.
scope: This is the physical movement of your arm, not the distance you can cover or a place you arrive
  at.
examples:
- With one long reach, she took the book from the top shelf.
- He made a reach for the rope but missed it.
