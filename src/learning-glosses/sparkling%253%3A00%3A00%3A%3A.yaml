simpleMeaning: used for wine and water that has small bubbles of gas in it, the gas called carbon dioxide,
  made by nature or put in by people
scope: For wine or water with gas bubbles in it. It is not a short flash of light.
examples:
- We drank sparkling water with our meal.
- She opened a bottle of sparkling wine for the guests.
