simpleMeaning: Its seeds swell and turn to jelly when wet, and this plantain of the lands round the Mediterranean
  Sea is used to help the bowels move gently.
scope: Also called psyllium, this is a plantain of Mediterranean lands whose seeds swell when wet.
examples:
- Fleawort grows in dry ground near the sea.
- She bought fleawort seeds to help her bowels move.
