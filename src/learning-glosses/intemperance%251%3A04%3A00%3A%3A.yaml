simpleMeaning: Too much in what one does, above all giving in to the wants of the body or to wild feelings.
scope: This is going too far in what one does, above all in giving in to the wants of the body or to wild
  feelings, also called intemperateness or self-indulgence.
examples:
- Their intemperance in eating and drinking was plain to see.
- Their intemperance showed in their words as well as their deeds.
