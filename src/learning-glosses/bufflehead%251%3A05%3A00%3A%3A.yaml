simpleMeaning: a small duck from North America that dives under water, and the males have bushy feathers
  on the head
scope: This is a small duck from North America that dives under water, and the males have bushy feathers
  on the head; dipper and butterball are other names for it, not a mallard and not a merganser.
examples:
- A bufflehead dived under the cold water.
- The male bufflehead showed his bushy white head.
