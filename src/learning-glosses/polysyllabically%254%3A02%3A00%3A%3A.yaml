simpleMeaning: In a way that uses words with many beats, with more than one beat in a word
scope: This describes speaking or writing with words that have many beats; not with short one-beat words
  only.
examples:
- He spoke polysyllabically in his long speech.
- The word was used polysyllabically in the poem.
