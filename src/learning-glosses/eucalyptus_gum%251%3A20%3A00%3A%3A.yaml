simpleMeaning: Any of several trees of that kind, above all one kind of them, gives off a reddish-brown
  dried sticky stuff.
scope: Also called eucalyptus kino and red gum, this sticky stuff comes from trees of that kind, above
  all one kind of them.
examples:
- The eucalyptus gum had dried where it oozed from the tree.
- Eucalyptus gum oozed from the tree and dried.
