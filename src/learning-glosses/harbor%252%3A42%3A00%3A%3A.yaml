simpleMeaning: In secret, to give a safe place to stay to a person who is running from the police or who
  has broken the law
scope: Also called harbour. This is hiding a person in secret, not a safe port where ships load and unload
  goods.
examples:
- He was charged with harboring a man who was running from the police.
- They harbored the escaped prisoner in their barn for two nights.
