simpleMeaning: to act in a certain way, and to show how you act by how you carry yourself
scope: 'Also called act, do, carry, bear, and behave: this is acting in a certain way. It is not the noun
  for a person''s way of acting toward others, and not carrying heat or sound through something.'
examples:
- She conducted herself well at the meeting.
- He conducted himself like an adult all through the trial.
