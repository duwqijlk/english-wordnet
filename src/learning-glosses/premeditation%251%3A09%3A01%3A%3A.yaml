synsetId: 05804230-n
simpleMeaning: In law, thinking over a crime and meaning to do it long before it is done, which shows
  the doer meant to break the law.
scope: Of a crime planned well ahead, as proof that the doer meant to break the law.
examples:
- The premeditation was clear from the notes he had written weeks before.
- Premeditation turned the killing into murder under the law.
