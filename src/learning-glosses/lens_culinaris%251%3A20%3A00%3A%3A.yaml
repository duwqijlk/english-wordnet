simpleMeaning: A widely grown Eurasian plant that lives one season, grown for its flat seeds, cooked like
  peas or ground into meal, and for leafy stalks that feed farm animals.
scope: A plant grown for flat seeds cooked like peas, not a pea plant; also called lentil and lentil plant.
examples:
- Lens culinaris grows across the dry fields of Eurasia.
- Farmers harvest Lens culinaris for its flat seeds.
