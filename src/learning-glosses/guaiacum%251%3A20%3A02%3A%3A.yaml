simpleMeaning: Wood from the lignum vitae tree and other trees of the same group, hard and greenish-brown
  in colour.
scope: 'Also called guaiac or lignum vitae: hard greenish-brown wood of the lignum vitae tree and its
  kin, not soft pale wood and not oak.'
examples:
- The carpenter shaped the guaiacum into a smooth bowl.
- Guaiacum is a hard wood with a greenish-brown colour.
