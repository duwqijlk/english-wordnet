simpleMeaning: A sweet-smelling yellow liquid from orange flowers, used to make perfume and to give food
  a taste.
scope: A sweet-smelling yellow liquid from orange flowers, used in perfume and in food; not cooking oil
  and not orange juice.
examples:
- Neroli oil gives the perfume its sweet smell.
- A drop of neroli oil flavors the cake.
