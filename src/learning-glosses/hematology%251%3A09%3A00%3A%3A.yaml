simpleMeaning: The branch of medicine that deals with sicknesses of the blood and of the parts of the
  body that make blood.
scope: The branch of medicine for sicknesses of the blood and blood-making parts; haematology is another
  name for this sense, and this is not the study of blood cells alone or of the heart.
examples:
- She studied hematology to treat patients with blood diseases.
- The hematology clinic treats sicknesses of the blood.
