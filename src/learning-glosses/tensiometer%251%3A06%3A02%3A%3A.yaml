senseId: 'tensiometer%1:06:02::'
synsetId: 04418154-n
simpleMeaning: a tool that shows how wet the soil is
scope: A tool that measures how wet soil is, not one that tests the pull at the top of a liquid and not
  one that measures the pull in a wire or beam.
examples:
- The farmer pushed the tensiometer into the dry field.
- A tensiometer in the pot told her when to water the plant.
