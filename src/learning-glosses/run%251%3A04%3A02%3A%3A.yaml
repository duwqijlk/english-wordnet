simpleMeaning: in American football, a move in which a player tries to advance the ball by carrying it
  through or beyond the other team
scope: This is an American football play that carries the ball forward, not a score in baseball, not the
  act of moving fast on foot, not a race on foot, not a small stream, not a period of machine operation,
  and not a trip.
examples:
- The coach called a run on third down.
- He broke free for a twenty-yard run.
