simpleMeaning: The growth of too much stringy tissue that joins parts, inside an organ.
scope: The growth of too much stringy tissue that joins parts, inside an organ; not a scar left by a cut
  and not a tumour.
examples:
- Fibrosis had stiffened the patient's liver.
- The biopsy showed fibrosis in the lung.
