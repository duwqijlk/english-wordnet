simpleMeaning: A single still image of a person or scene, saved on paper, on a clear slide, or as a computer
  file.
scope: A still image of a person or scene, also called a photo, a picture, and a photograph, not the light
  on film, not the act of letting light onto film, and not being left open to harm.
examples:
- The exposure showed the whole family on the beach.
- She kept the exposure in an old album.
