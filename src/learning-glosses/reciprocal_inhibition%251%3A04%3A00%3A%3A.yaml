simpleMeaning: a treatment where one response is blocked by another that cannot happen with it; calm can
  be trained to take the place of fear when a feared thing is met
scope: Another name for reciprocal-inhibition therapy; a treatment that blocks one response with another
  that cannot happen with it, not a drug and not talk alone.
examples:
- Reciprocal inhibition let him stay calm when the dog barked.
- The therapist used reciprocal inhibition to ease her fear of heights.
