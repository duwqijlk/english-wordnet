simpleMeaning: full of trouble and lack of order, with people who refuse to obey those in charge
scope: About a place or time full of trouble and lack of order, not about a person or thing that shows
  pain, worry or need.
examples:
- Soldiers were sent to the troubled region to keep order.
- It was a troubled time, with fighting in many cities.
