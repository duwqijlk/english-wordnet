simpleMeaning: being from a source whose name is not known, or having a source whose name is not known
scope: 'Also called unknown: this is about something that comes from a source whose name is not known.
  It does not mean that the thing itself is not known or cannot be understood.'
examples:
- The report quoted an unnamed official in the government.
- An unnamed donor paid for the new school library.
