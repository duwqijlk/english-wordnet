simpleMeaning: a cover fitted over or next to a wheel to keep mud thrown up off the upper part of a vehicle
scope: A cover that shields the upper part of a vehicle from mud thrown up by a wheel; not a panel that
  shields people from water and mud.
examples:
- The splasher kept mud off the car's side.
- After the rain, the splasher was caked with mud.
