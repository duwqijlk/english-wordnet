senseId: 'clog%1:06:00::'
synsetId: 03051538-n
simpleMeaning: anything that gets in the way and stops a thing moving or working freely
scope: Anything that gets in the way and stops movement; not the act of slowing movement, not a dance
  in wooden shoes, and not the wooden shoes themselves.
examples:
- A clog in the pipe stopped the water.
- The fallen tree was a clog on the road.
