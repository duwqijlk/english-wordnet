simpleMeaning: A tool with several hooks for catching and holding things, often thrown on the end of a
  rope
scope: This hooked tool is also called grapple, grapnel, grappling hook and grappling iron, and is not
  a single hook and not a rope on its own.
examples:
- The sailor threw the grappler over the side of the boat.
- He used a grappler to pull the fallen branch within reach.
