simpleMeaning: left to age in the right way, so that it tastes rich and pleasant
scope: Food or drink that tastes rich because it has aged well, not the verb sense of growing calmer and
  not the slightly drunk sense of mellow.
examples:
- We shared a bottle of mellow port.
- The mellowed fruit tasted sweet and rich.
