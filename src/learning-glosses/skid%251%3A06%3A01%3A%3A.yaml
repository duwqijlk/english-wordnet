simpleMeaning: 'a piece inside a brake that slows the wheel: fluid power presses the linings onto the
  drum'
scope: 'Also called shoe: a brake piece that slows a wheel by pressing its linings on the drum, not a
  plank track and not the act of sliding sideways.'
examples:
- The skid pressed against the drum and slowed the wheel.
- A worn skid can no longer hold the wheel back.
