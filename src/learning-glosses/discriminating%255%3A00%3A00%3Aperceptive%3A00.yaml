simpleMeaning: good at noticing small differences between things and telling them apart
scope: Also called sharp, keen, piercing, acute, penetrating, incisive, and knifelike, this sense is about
  noticing small differences well; it is not the sense about careful judgment in matters of taste.
examples:
- A discriminating reader can tell the two writers' styles apart at once.
- Her discriminating eye noticed a tiny change in color that others missed.
