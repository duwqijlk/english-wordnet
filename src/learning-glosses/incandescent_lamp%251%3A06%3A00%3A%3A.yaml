simpleMeaning: A lamp run by electricity, built of a see-through or dim glass shell holding a fine wire,
  tungsten usually, that shines once electricity warms it.
scope: A lamp run by electricity, built of a see-through or dim glass shell holding a fine wire, tungsten
  usually, that shines once electricity warms it; it is also called bulb, lightbulb, electric-light bulb,
  electric light and light bulb.
examples:
- The incandescent lamp shone when the power came on.
- An incandescent lamp holds a fine wire.
