simpleMeaning: Said of a thing that is a dull pale brown, the colour of a small animal with a long tail
scope: 'Also called mousy or mouselike: a dull pale brown colour, not a bright brown and not a dark brown.'
examples:
- Her mouse-colored hair looked dull and pale brown in the light.
- The mouse-colored coat was a drab pale brown.
