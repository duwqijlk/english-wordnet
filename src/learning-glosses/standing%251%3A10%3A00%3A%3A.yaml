simpleMeaning: A table of scores, arranged in order, that shows how each player or team ranks in a sports
  competition.
scope: This is the sports ranking table, not the act of being upright, not social reputation, and not
  a permanent rule.
examples:
- The team is third in the league standings.
- She checked the standings to see who they would play next.
