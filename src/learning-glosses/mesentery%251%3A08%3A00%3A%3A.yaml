simpleMeaning: This double fold of the lining of the belly holds the small gut up, fixed to the back wall
  of the belly.
scope: It is a double fold of the lining of the belly that holds the small gut up, fixed to the back wall
  of the belly, and it is not the gut itself.
examples:
- The mesentery held the small gut against the back wall of the belly.
- The mesentery held the small gut in place.
