simpleMeaning: the set beat made by the parts of words in a line of verse
scope: The set beat of word parts in verse, also called measured; not a unit of measure, and not a set
  of linked measures.
examples:
- The poem's metric is steady and strong.
- She studied the metric of the old songs.
