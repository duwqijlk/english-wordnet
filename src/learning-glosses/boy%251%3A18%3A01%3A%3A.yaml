synsetId: 84496658-n
simpleMeaning: An offensive, disparaging term for a Black man, used to insult and demean.
scope: This is an ethnic slur. It is deeply offensive, is never a neutral way to speak about a Black man,
  and appears only as an insult or in quoted abuse. It is not the ordinary word for a male child, nor
  the friendly way of addressing a grown man.
examples:
- Calling a Black man 'boy' in that way is a racial insult.
- The manager was disciplined for addressing his Black colleague as 'boy'.
