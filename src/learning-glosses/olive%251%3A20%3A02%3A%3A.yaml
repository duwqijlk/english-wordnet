simpleMeaning: hard yellow wood, often with marks of different colours, that comes from a tree grown for
  its small fruit, used to make cupboards and other furniture
scope: This is wood used to make furniture, not the tree itself, not its small fruit eaten as food, and
  not a yellow-green colour.
examples:
- They used olive wood for the doors of the cupboard.
- People like olive wood because it is hard and has clear colour marks.
