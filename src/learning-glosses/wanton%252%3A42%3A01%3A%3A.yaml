simpleMeaning: to spend your life in a free and easy way, giving yourself to pleasure, most of all the
  pleasures of the body
scope: Living freely and taking much pleasure in life; not wasting time with nothing done, and not the
  sense of spending much money on rich living.
examples:
- He wantoned through his young years, living only for pleasure.
- She wantoned in a carefree life of music, food and love.
