simpleMeaning: to fill a wire or other thing that carries power with an electric charge
scope: To put an electric charge into a wire or conductor, not to fit a machine to run on power.
examples:
- Lightning electrified the fence, and it gave off a shock.
- The scientist electrified the copper rod in the lab.
