simpleMeaning: A fern from tropical America, grown for its grey-green fronds cut into many fine segments;
  it ranges from the West Indies and southern Mexico to Peru and Brazil.
scope: The tropical American fern with finely cut grey-green fronds, also called toothed sword fern; not
  the giant Asian fern that shares the name.
examples:
- Basket fern hangs in shaded greenhouses.
- Growers prize basket fern for its lacy grey-green fronds.
