simpleMeaning: a long thin creature with a smooth body that comes to a point at each end, mostly living
  free, though some live inside other creatures
scope: 'Also called a nematode or a nematode worm: a long thin creature with a smooth body that comes
  to a point at each end, not a flatworm and not an earthworm.'
