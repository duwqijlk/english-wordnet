simpleMeaning: A big open floor with no walls inside it, over a factory, a storehouse, or some other place
  of trade
scope: A big open floor over a place of trade, not the open floor at the top of a house, not the golf
  slant, and not drawing a ship's hull.
examples:
- They turned the loft above the warehouse into workrooms.
- Artists rented the loft over the old factory.
