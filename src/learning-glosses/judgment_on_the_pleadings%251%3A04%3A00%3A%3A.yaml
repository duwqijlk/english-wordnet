simpleMeaning: In law, a ruling from a court before a verdict, when facts are not disputed and law itself
  settles which side wins.
scope: This is a ruling from a court before a verdict, when facts are not disputed and law itself settles
  which side wins; judgement on the pleadings, summary judgement and summary judgment are other names
  for it, not a decision given because the other side failed to come to court.
examples:
- The court gave a judgment on the pleadings because the facts were not in dispute.
- She asked the court for a judgment on the pleadings before it gave its verdict.
