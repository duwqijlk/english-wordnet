simpleMeaning: a single small part built from a crystal of silicon, which lets electric signals pass through
  it, made so many jobs of a small circuit happen in one place
scope: 'Also called chip, microchip, microprocessor chip, and silicon chip: a small piece of electric
  equipment, not a plain piece of metal or a full computer.'
examples:
- The micro chip in the phone runs many of its jobs.
- Engineers put a new micro chip into the washing machine.
