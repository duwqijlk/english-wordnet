simpleMeaning: One of several perennial herbs that make up the Frasera group, widespread on warm dry upland
  from California to Washington.
scope: A plant of the Frasera group, another name for the herb also called deer's-ear and pyramid plant;
  not the television detective.
examples:
- Columbo stood tall among the dry grasses on the ridge.
- Botanists recorded columbo across the warm hills of eastern Oregon.
