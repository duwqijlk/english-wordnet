simpleMeaning: a substance that cloth is treated with so that water does not soak into it
scope: 'Also called repellant: this is the substance put on cloth to keep water out, not the substance
  that keeps animals away and not the word for something very unpleasant.'
examples:
- He sprayed a water repellent on his jacket before the rain.
- The repellent on the tent cloth helps the tent stay dry.
