simpleMeaning: A name once given to a childhood condition that begins very early and brings great trouble
  in daily life
scope: This old name for a childhood condition that begins very early and brings great trouble in daily
  life is also called autistic disorder, childhood autism, classical autism, infantile autism, and infantile
  psychosis.
examples:
- Doctors once used the term classic autism for children with great trouble in daily life.
- Classic autism was the name given to the condition in earlier years.
