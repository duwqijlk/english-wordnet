simpleMeaning: an object for show, or a tool for use, made of a yellow metal that is made from copper
  and zinc
scope: This is an object made from the yellow metal, not the metal itself, not a musical instrument, and
  not a flat piece made to remember a person.
examples:
- The shop sells brass, from candle holders to cooking pots.
- She cleaned all the brass in the house on Saturday.
