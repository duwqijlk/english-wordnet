simpleMeaning: From the lower eyelid to the upper lip, the parts below the eye are fed by an artery that
  starts from the artery of the upper jaw.
scope: Also called arteria infraorbitalis, this is the artery that feeds the parts below the eye, not
  the one that feeds the parts above it.
examples:
- The infraorbital artery supplies the lower eyelid.
- Damage to the infraorbital artery can numb the upper lip.
