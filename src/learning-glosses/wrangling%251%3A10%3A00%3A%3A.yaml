simpleMeaning: one case of arguing strongly, such as when people argue over a price while they try to
  make a deal
scope: Also called haggle, haggling, and wrangle, this is one case of strong arguing, such as over a price;
  it is not a calm talk and not a weak, small disagreement.
examples:
- Months of wrangling over pay ended with a new deal.
- The wrangling between the two sides delayed the sale.
