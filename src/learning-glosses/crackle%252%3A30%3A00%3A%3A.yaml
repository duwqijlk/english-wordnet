simpleMeaning: To get covered in a web of small cracks, or to make something get that way.
scope: Getting covered in small cracks, or making that happen, not the sound of snapping and not the cracked
  china.
examples:
- The blazing sun crackled the desert sand.
- The old paint crackled in the heat.
