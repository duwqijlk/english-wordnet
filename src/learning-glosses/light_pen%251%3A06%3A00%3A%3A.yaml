simpleMeaning: In computer science, a hand-held pointer that, when held up to a screen, tells whether
  or not the spot it touches is lit up
scope: Electronic stylus is another name for this hand-held pointer used with a computer screen; it is
  not a mouse and not an ordinary pen for writing on paper.
examples:
- The light pen let her pick items straight from the screen.
- He touched the light pen to the menu on the display.
