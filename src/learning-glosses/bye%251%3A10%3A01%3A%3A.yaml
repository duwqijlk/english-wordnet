simpleMeaning: a free move to the next round of a contest, given without playing a match
scope: Also called a pass, this is a free move to the next round of a contest without playing, not a word
  said when leaving.
examples:
- She got a bye into the next round of the cup.
- His bye meant he did not play until the second round.
