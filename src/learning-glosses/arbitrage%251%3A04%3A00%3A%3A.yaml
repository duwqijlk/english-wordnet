simpleMeaning: A safe kind of stake, meant to catch small gaps in price; when prices differ across two
  markets, the buyer buys low and sells high at once.
scope: A safe kind of stake, meant to catch small gaps in price; when prices differ across two markets,
  the buyer buys low and sells high at once; not to work the price gaps, as in the stock market.
examples:
- Their arbitrage paid off at noon.
- The arbitrage was done in a day.
