simpleMeaning: a person whose ideas and views call for very big, complete change
scope: A person whose ideas call for complete change; not the maths sense about a root number, not the
  chemistry sense about a group of atoms, and not leaves at the base of a plant.
examples:
- The young radical spoke for sweeping changes to the tax system.
- Many people saw him as a radical because he wanted to end the old system at once.
