simpleMeaning: Too much fancy detail is put into it, so what is said or written looks grand and showy
scope: Said or written with too much fancy detail, also called purple and empurpled; not plain, simple
  wording and not a plain fact told straight.
examples:
- His over-embellished story of the fish that got away went on for an hour.
- The over-embellished letter tried too hard to sound grand.
