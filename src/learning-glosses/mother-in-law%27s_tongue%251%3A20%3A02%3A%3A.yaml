simpleMeaning: Its poison swells the soft part inside the mouth and the throat, which is why it has its
  name, and its big showy dark green leaves stay on all year.
scope: It is also called mother-in-law plant and dumb cane, and it is a plant with big showy dark green
  leaves and a poison that swells the mouth and throat, not the plant of the same name with narrow stiff
  leaves.
examples:
- Mother-in-law's tongue keeps its dark green leaves through the winter.
- The poison in mother-in-law's tongue can swell the throat.
