simpleMeaning: a wall of stone or concrete that goes out from the shore into the water and keeps waves
  from washing a beach away
scope: 'Also called groin, mole, jetty, bulwark, seawall and groyne: a stone or concrete wall built out
  into the water to guard a beach; not a natural line of rocks in the sea.'
examples:
- Waves hit the breakwater and did not reach the beach.
- They built a stone breakwater out into the sea to keep the beach safe.
