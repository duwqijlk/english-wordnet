senseId: 'pure_iambic_trimeter%1:10:01::'
synsetId: 92416564-n
simpleMeaning: A line of verse with six beats, in which all the changeable syllables are short and no
  long syllable may be split into two short ones
scope: A line of verse with six beats and strict rules about syllable length, not a line of prose and
  not any other kind of verse line.
examples:
- A pure iambic trimeter is very rare in English verse.
- Catullus wrote a pure iambic trimeter in one of his poems.
