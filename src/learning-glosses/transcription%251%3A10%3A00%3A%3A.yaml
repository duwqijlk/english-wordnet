simpleMeaning: a piece of writing, especially a copy put into a new form, such as spoken words typed out
scope: This is a written copy put into a new form, not a sound or television recording of a broadcast.
examples:
- He made a transcription of the spoken interview by typing every word.
- The transcription of the letter was typed from the old handwritten copy.
