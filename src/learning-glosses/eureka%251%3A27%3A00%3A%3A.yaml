simpleMeaning: A mix of copper and nickel that holds back the flow of power and shifts little with heat,
  used for wire that resists power.
scope: A copper-nickel mix used for wire that holds power back, also called constantan; not pure copper
  and not pure nickel.
examples:
- Eureka wire keeps its hold on power even when it warms up.
- The coil was wound with Eureka for the heater.
