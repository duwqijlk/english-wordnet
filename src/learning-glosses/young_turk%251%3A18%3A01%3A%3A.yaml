simpleMeaning: One of the rebels in the Ottoman lands in the late 1800s who rose up against the absolute
  rule of the sultans.
scope: A member of a group in the Ottoman lands in the late 1800s that rose up against the absolute rule
  of the sultan, not a member of the sultan's government or one of his soldiers.
examples:
- The Young Turk movement grew in the late 1800s.
- A Young Turk officer joined the revolt.
