simpleMeaning: Plain strong drink of 95 percent, or 190 proof, used to mix with straight whiskies and
  to make gin and sweet strong drinks.
scope: Plain strong drink of 95 percent used for mixing and making gin, also called neutral spirits; not
  whisky itself and not a drink for the table.
examples:
- The plant makes ethyl alcohol for blending with whisky.
- Ethyl alcohol at 190 proof is used to make gin.
