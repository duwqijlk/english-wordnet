simpleMeaning: in a quiet way that does not draw praise to yourself, without showing off what you have
  done
scope: Doing or saying something without showing off, not in a proud or boastful way.
examples:
- The dissertation was entitled, modestly, 'Remarks about a play by Shakespeare'.
- She spoke modestly about the prize she had won.
