simpleMeaning: a bank check written on an account with too little money in it at another bank, used to
  gain time while the check is on its way
scope: A bad check written to gain time from the float, not a toy flown on a string and not a small hawk.
examples:
- He wrote a kite to cover the bill until payday.
- The bank caught the kite before it cleared.
