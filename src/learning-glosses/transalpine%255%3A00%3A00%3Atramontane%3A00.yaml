simpleMeaning: Of, or like, the lands or peoples past the Alps from Italy, or north of the Alps
scope: Of or like the lands or peoples past the Alps from Italy; ultramontane is another name for this
  sense, and not of the lands south of the Alps in Italy.
examples:
- Ancient transalpine Gaul lay northwest of the Alps.
- Cracow was a transalpine university.
