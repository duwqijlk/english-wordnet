simpleMeaning: a long-lasting lung disease of horses that makes breathing out hard and makes the sides
  heave
scope: This is a long-lasting lung disease of horses that makes breathing out hard and makes the sides
  heave; heaves is another name for it, not a passing cough and not a broken leg.
examples:
- The old horse had broken wind and breathed with effort.
- Broken wind left the horse short of breath after a short trot.
