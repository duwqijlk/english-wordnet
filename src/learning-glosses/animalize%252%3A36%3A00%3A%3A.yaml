simpleMeaning: to show a thing with the shape of a living creature
scope: Also called animalise; to show a thing with the shape of a living creature, not to make it cruel
  and not to show it as a person.
examples:
- The cartoonist would animalize the mayor as a fox.
- The poet animalized the sea as a great whale.
