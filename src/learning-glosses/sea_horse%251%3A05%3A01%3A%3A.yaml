simpleMeaning: Long white teeth and tough skin over thick fat belong to one of two kinds of large northern
  animals of the ocean that feed their young with milk.
scope: A walrus and a seahorse are other names for one of these two kinds of large northern animals of
  the ocean, not the small fish of the same name.
examples:
- The sea horse had long white teeth and tough skin over thick fat.
- A sea horse is one of two kinds of large northern animals of the ocean.
