simpleMeaning: a cold box for food in which a cooling liquid is moved round by a motor that runs on power
scope: 'Also called fridge: a cold box for food in which a cooling liquid is moved round by a motor that
  runs on power, not a box cooled with ice and not a cupboard for food.'
examples:
- The electric refrigerator hummed quietly in the corner of the kitchen.
- She put the milk in the electric refrigerator to keep it cold.
