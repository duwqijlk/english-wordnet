simpleMeaning: The Jews who keep the law of Moses strictly, as the Talmud explains it
scope: Jews who keep the law of Moses strictly as the Talmud explains it; Orthodox Judaism is another
  name for this sense; not the law of Moses itself, and not other ways of keeping Jewish law.
examples:
- Jewish Orthodoxy keeps the law of Moses as the Talmud explains it.
- Members of Jewish Orthodoxy observe the Sabbath strictly.
