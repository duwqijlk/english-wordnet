simpleMeaning: a kind way of feeling that sees how others suffer and wants to help them
scope: A kind way of feeling that wants to help people who suffer, not just a sad feeling about their
  bad luck and not scorn for them.
examples:
- She felt pity for the hungry children and gave them food.
- His pity moved him to help the sick man home.
