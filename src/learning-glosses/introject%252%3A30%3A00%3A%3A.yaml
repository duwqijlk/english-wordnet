simpleMeaning: to take in ways of thinking or feeling as part of oneself without knowing one is doing
  so
scope: To take in ways of thinking or feeling as part of oneself without knowing one is doing so; not
  to learn by copying others on purpose and not the noun sense of a parent's voice inside one.
examples:
- Children introject their parents' rules without knowing it.
- She had introjected her mother's fears about money.
