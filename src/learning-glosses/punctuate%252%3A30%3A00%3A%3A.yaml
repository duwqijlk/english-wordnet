simpleMeaning: to set the stops and pauses in a piece of writing, by putting in commas, full stops, and
  other such marks
scope: Also called mark; not just adding any mark to writing, but putting in the stops and pauses that
  break it up.
examples:
- Please punctuate the letter before you send it.
- She punctuated the long sentence with commas.
