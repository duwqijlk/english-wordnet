simpleMeaning: A body chemical that cuts one form of a blood-pressure chemical into another form of it.
scope: Also called angiotensin-converting enzyme and angiotensin converting enzyme; not the NATO base
  of the same short name.
examples:
- ACE helps control blood pressure.
- Doctors can block ACE with drugs.
