simpleMeaning: A sickness in boy children whose defence system fails, from a changed gene for a protein
  on T cells that lets them build a receptor for growth signals
scope: A sickness of the body's defence system in boy children, also called X-linked SCID, caused by a
  changed gene for a protein on T cells.
examples:
- X-SCID affects boy children.
- The boy with X-SCID has no working defence system.
