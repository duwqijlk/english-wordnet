simpleMeaning: This bug bites with its jaws and flies on four big thin wings crossed by fine lines like
  a net.
scope: Neuropteron and neuropterous insect are other names for this bug, whose jaws bite and whose four
  big thin wings are crossed by fine lines like a net.
examples:
- The neuropteran beat its four big thin wings.
- A neuropteran bit through the leaf with its jaws.
