simpleMeaning: 'a set of signs that go together: no hunger, a swollen belly, loss of weight, muscle pain,
  and fatty stools; it goes with celiac disease, sprue, and cystic fibrosis'
scope: A set of signs that go together, not one single illness and not a short stomach upset.
examples:
- Her malabsorption syndrome left her with no hunger and a swollen belly.
- The doctor linked his malabsorption syndrome to celiac disease.
