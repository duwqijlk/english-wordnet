simpleMeaning: sticky tape put on the skin to cover and protect a cut or wound
scope: 'Also called plaster: sticky tape put on the skin to cover a cut or wound, not a bandage wrapped
  round a wound and not a substance that joins sides together.'
examples:
- She put an adhesive plaster over the cut on her finger.
- He tore off an adhesive plaster and stuck it on the small wound on his knee.
