simpleMeaning: a four-sided stretch of town with streets all round it, most often with several buildings
  on it
scope: A four-sided stretch of town with streets all round it, most often with several buildings on it;
  block is another name for this sense, and it is not a whole town or one building alone.
examples:
- He lives in the next city block.
- We walked around the city block to reach the shop.
