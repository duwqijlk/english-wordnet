simpleMeaning: strong and clear in words or acts, leaving no doubt about what is meant
scope: Strong and clear in words or acts, leaving no doubt, not the sense of being full of force or strength.
examples:
- Her forceful words left no doubt about what she meant.
- He gave a forceful answer and ended the talk.
