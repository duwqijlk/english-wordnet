simpleMeaning: When red blood cells break down, this word is used for what is tied to that breakdown or
  what brings it on
scope: To do with red blood cells breaking down, also called haemolytic, not a word for blood cells building
  up and not a word for blood in general.
examples:
- The doctor looked for a hemolytic cause of the low blood count.
- A hemolytic drug can break down red blood cells.
