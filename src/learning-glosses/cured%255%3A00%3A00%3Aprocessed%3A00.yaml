simpleMeaning: of rubber, made better by a chemical or physical process, so it is harder, stronger, and
  smells less, and stretches more
scope: Of rubber, made better by a chemical or physical process, so it is harder, stronger, and stretches
  more; not the keeping of meat, tobacco, or hay, and not the hardening of wet cement.
examples:
- Cured rubber lasts longer than raw rubber in car tyres.
- The cured rubber in the seals stayed soft and strong for years.
