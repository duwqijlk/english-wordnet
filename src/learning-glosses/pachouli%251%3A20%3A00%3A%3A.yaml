simpleMeaning: A small bushy mint from the East Indies, whose leaves give a sweet-smelling oil used in
  scents.
scope: A small bushy mint from the East Indies; patchouli and patchouly are other names for this sense,
  not a mint grown for food and not a mint of Europe.
examples:
- Pachouli oil gives the scent its deep smell.
- She grew pachouli in a pot by the door.
