simpleMeaning: The national office in the Treasury Department that runs the government's payment and collection
  systems and keeps its central books and money reports.
scope: The Treasury Department's central office for the whole federal government, running the systems
  that pay government money out and collect money in, and keeping its central books and reports.
examples:
- The Financial Management Service keeps the government's central books.
- The Financial Management Service runs the systems that pay out government money.
