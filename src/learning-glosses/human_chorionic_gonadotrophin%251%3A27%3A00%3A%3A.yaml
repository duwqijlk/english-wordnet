simpleMeaning: A body chemical from the afterbirth, made early in pregnancy, that shows up in urine and
  blood and so lets one kind of pregnancy test work.
scope: This is the body chemical the afterbirth makes early in pregnancy, found in urine and blood by
  one kind of pregnancy test, also called human chorionic gonadotropin.
examples:
- Human chorionic gonadotrophin was found in the urine.
- The test looks for human chorionic gonadotrophin in the urine.
