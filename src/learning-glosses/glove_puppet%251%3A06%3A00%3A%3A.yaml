simpleMeaning: A figure with a cloth body and an empty head that fits over the hand.
scope: A toy figure worn on the hand, also called a glove doll and a hand puppet, not a toy figure moved
  by strings and not a toy animal with no head.
examples:
- He slipped the glove puppet onto his hand and made it nod.
- The glove puppet's cloth body and hollow head fit over the actor's hand.
