simpleMeaning: a written part added to a bill (a plan for a new law that lawmakers will vote on)
scope: A part of a written law plan, not a person who travels on an animal, on a bicycle, or in a car
  or bus.
examples:
- Lawmakers added a rider to the bill to pay for road repairs.
- The rider changed the bill by adding a new rule about taxes.
