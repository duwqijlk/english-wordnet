simpleMeaning: in a game or sport, a mark on the playing area that shows positions or boundaries.
scope: This is not a mark on paper, a border between countries, or a rope; it is a mark on a playing area.
examples:
- The ball landed just inside the line.
- Players must stay behind the line when serving.
