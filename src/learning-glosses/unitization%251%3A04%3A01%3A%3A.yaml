simpleMeaning: working together to get oil from one field that lies under land owned by more than one
  firm
scope: 'Also called unitisation: firms working one oil field together, not one firm working its own field
  alone.'
examples:
- The two firms agreed on the unitization of the oil field that lay under both their lands.
- Unitization let the firms share the cost of drilling the shared field.
