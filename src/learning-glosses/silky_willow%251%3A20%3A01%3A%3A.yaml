simpleMeaning: Its leaves are greyish and covered with fine hairs, and they most often turn black as they
  dry; it is a North American tree.
scope: This North American tree is also called a silver willow.
examples:
- The silky willow has greyish leaves covered with fine hairs.
- Leaves of the silky willow most often turn black as they dry.
