senseId: 'torticollis%1:26:00::'
synsetId: 14581311-n
simpleMeaning: a state that is not normal, in which the head leans to one side because the neck muscles
  on that side have tightened
scope: This is a state in which the head leans to one side because the neck muscles on that side have
  tightened; wryneck is another name for this sense. Not a stiff neck from sleep and not a head held to
  one side by choice.
examples:
- The baby's torticollis made her head lean to the left.
- Torticollis kept his head tilted to one side for weeks.
