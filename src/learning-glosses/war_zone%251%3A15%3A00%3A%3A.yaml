simpleMeaning: a place of fighting where fighting is run from, above all marked-off open sea where nations
  doing the fighting do not keep the rights of those not fighting
scope: A place of fighting where fighting is run from; not a whole country in a fight and not a safe place
  behind the lines.
examples:
- Ships were warned to keep out of the war zone.
- The war zone covered the sea where the fighting was.
