simpleMeaning: A written report by a researcher that presents what was found by watching or measuring,
  or that sets out ideas to be tested.
scope: This is a written study, not a whole news publication, and not the thin material used for writing.
examples:
- Her paper on sleep and memory was published in a leading journal.
- I spent the weekend drafting a paper for my biology seminar.
