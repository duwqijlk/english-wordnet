simpleMeaning: a tendency to stay inactive and not start acting or changing
scope: 'Another name for inactivity: a person''s tendency to stay inactive and not act. It is not the
  physics sense, where a thing keeps resting or moving unless a force acts on it.'
examples:
- He had to fight his inertia and get back to work.
- Her inertia kept her on the sofa all day instead of going out.
