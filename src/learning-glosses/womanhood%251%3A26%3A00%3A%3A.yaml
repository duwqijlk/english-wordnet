simpleMeaning: the part of life when a girl has grown up and is an adult
scope: The fact of being a grown woman, not a woman's place or rank among other people.
examples:
- As she moved from girlhood into womanhood, she took on new duties.
- Her early womanhood was spent working on the family farm.
