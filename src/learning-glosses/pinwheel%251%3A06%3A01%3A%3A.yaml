simpleMeaning: a toy with flat parts made of colored paper or plastic, fixed to a stick with a pin, that
  turns round when you point it into the wind
scope: This toy, also called pinwheel wind collector, turns in the wind. It is not the plant with leaves
  in round shapes, not the round firework, and not a wheel with many pins.
examples:
- She held her pinwheel up and it spun fast in the wind.
- The children ran with their pinwheels to make them turn.
