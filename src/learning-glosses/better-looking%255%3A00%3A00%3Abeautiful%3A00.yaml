simpleMeaning: nice to see, above all because the shape and size of the parts are as people think they
  should be
scope: 'Also called fine-looking, good-looking, handsome and on fleek: nice to see, above all because
  the shape and size of the parts are as people think they should be, not just neat and clean.'
examples:
- She wore a dress that made her look better-looking than her sister.
- The new house is better-looking than the old one, with neat lines and fair proportions.
