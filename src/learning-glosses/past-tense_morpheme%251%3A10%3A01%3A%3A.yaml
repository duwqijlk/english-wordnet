simpleMeaning: A small part added to a verb to show that the action took place before now
scope: A small part of a verb that shows the action took place before now, not a part that shows who does
  the action and not a part that shows more than one thing.
examples:
- In English, the most common past-tense morpheme is '-ed' added to regular verbs.
- The past-tense morpheme in 'walked' tells us the walk took place before now.
