simpleMeaning: Small gaps in the fatty covering of nerve fibres that carry signals
scope: Also called Ranvier's nodes; small gaps in the fatty covering of nerve fibres that carry signals,
  unlike the covered parts of the same fibres.
examples:
- The nodes of Ranvier let signals jump along the nerve fibre.
- Signals pass fast through the nodes of Ranvier.
