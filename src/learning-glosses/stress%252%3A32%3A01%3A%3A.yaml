schema: oewn-learning-gloss-v2
senseId: 'stress%2:32:01::'
synsetId: 00985365-v
simpleMeaning: to give extra emphasis to a syllable or musical note when speaking or playing it.
scope: This is not to emphasize an idea or point in an argument, and not to feel worried; it means to
  pronounce a syllable or play a note with extra force.
examples:
- The teacher stressed the second syllable of the word.
- Stress the final note and hold it.
