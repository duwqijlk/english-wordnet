simpleMeaning: A white hard metal, one of the platinum group, found in platinum ores and used in alloys
  with platinum
scope: This metal is also called rhodium and atomic number 45; it is not platinum itself and not the Rh
  blood factor.
examples:
- Rh is found in platinum ores.
- The alloy contained Rh and platinum.
