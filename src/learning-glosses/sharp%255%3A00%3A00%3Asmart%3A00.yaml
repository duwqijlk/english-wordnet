simpleMeaning: clever in a practical, unsentimental way
scope: This sense is also called astute or shrewd; it is practical, clear-headed cleverness, not skill
  at noticing small differences or a harsh tone.
examples:
- He is a sharp businessman who never signs without reading.
- The tenant was sharp enough to question the extra fee.
