simpleMeaning: One tiny charged part is sped up by a push of one unit, and the work done in speeding it
  up is a unit of energy
scope: The work done in speeding up one tiny charged part with a push of one unit is a unit of energy,
  not a unit of length and not a unit of weight.
examples:
- Physicists state the energy of the particle in electron volts.
- One electron volt is a very small amount of energy.
