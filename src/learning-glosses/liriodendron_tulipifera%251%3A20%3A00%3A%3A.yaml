simpleMeaning: A tall North American tree that sheds its leaves, with large tulip-shaped greenish-yellow
  flowers and cone-like fruit; its soft white wood is used most of all for cabinet work.
scope: A tall tree with tulip-shaped flowers and cone-like fruit, not a true poplar; also called canary
  whitewood, tulip poplar, tulip tree, and yellow poplar.
examples:
- Liriodendron tulipifera towers over the garden in spring.
- Cabinet makers prize the soft white wood of Liriodendron tulipifera.
