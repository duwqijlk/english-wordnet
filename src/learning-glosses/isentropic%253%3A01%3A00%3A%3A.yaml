senseId: 'isentropic%3:01:00::'
synsetId: 02762661-a
simpleMeaning: A change or a state in which entropy, the measure of disorder in a thing, does not change
  at all
scope: A change or a state in which entropy stays the same; not a change in which disorder grows and not
  a change in which disorder falls.
examples:
- The gas expanded in an isentropic process, so its entropy did not change.
- Engineers model the turbine as isentropic to keep the maths simple.
