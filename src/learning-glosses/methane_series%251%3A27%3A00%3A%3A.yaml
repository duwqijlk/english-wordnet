senseId: 'methane_series%1:27:00::'
synsetId: 14975516-n
simpleMeaning: a set of hydrocarbons, compounds of hydrogen and carbon, with no rings and as much hydrogen
  as they can hold, with the general formula CnH(2n+2)
scope: A set of hydrocarbons with no rings and as much hydrogen as they can hold, with the general formula
  CnH(2n+2); paraffin, alkane, alkane series and paraffin series are other names for this sense, not ring-shaped
  hydrocarbons, and not a single gas.
examples:
- The methane series is a set of hydrocarbons with the general formula CnH(2n+2).
- Alkanes belong to the methane series, hydrocarbons with no rings.
