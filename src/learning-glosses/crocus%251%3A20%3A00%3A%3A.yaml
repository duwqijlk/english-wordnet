simpleMeaning: any one of many kinds of small low plant with thin leaves like grass and white, yellow
  or purple flowers, mainly from near the Mediterranean Sea but grown widely
scope: 'The plant itself: a small low plant with thin leaves like grass and white, yellow or purple flowers,
  not any single part of a plant used for spice or colour.'
examples:
- Purple crocuses came up in the garden in early spring.
- She planted crocus bulbs along the path, and white flowers opened in March.
