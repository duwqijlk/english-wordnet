senseId: 'idyll%1:11:00::'
synsetId: 07321915-n
simpleMeaning: a short time or event that has the simple beauty of country life or of love, of the kind
  a poem would be about
scope: This is an event or time with country charm, not a short poem about country life and not a piece
  of music about country life.
examples:
- Their summer in the small village was a perfect idyll.
- That month by the lake was an idyll he never forgot.
