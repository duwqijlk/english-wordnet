simpleMeaning: By teaching the same thing over and over, you fix it in a person's mind
scope: The act of fixing an idea in the mind by teaching it again and again, also called inculcation or
  instilling; not a single lesson and not learning by doing.
examples:
- The ingraining of good habits starts with daily practice.
- Through ingraining, the teacher fixed the rules in the pupils' minds.
