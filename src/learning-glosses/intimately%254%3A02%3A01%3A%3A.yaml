simpleMeaning: knowing a person or thing very well, in a close and personal way
scope: Knowing a person or thing very well, in a close and personal way, not merely knowing facts about
  them and not in a loving way.
examples:
- We knew them intimately after years of working together.
- She knew the old house intimately, every stair and door.
