simpleMeaning: To keep a person locked up under guard, in jail or somewhere like it.
scope: Also called jail, imprison, jug, lag, gaol, and incarcerate, to keep a person locked up under guard,
  in jail or somewhere like it; not the noun use for sending a person back into custody to await trial.
examples:
- The judge decided to remand the suspects until the trial.
- They were remanded to prison while the police finished their work.
