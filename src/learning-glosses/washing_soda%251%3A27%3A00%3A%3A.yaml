simpleMeaning: a salt formed from carbonic acid and sodium, for making soap powder, glass and paper
scope: A salt of sodium and carbonic acid used in making soap powders, glass and paper, also called soda,
  sal soda, soda ash and sodium carbonate; not baking soda and not table salt.
examples:
- The factory buys washing soda for making soap powder.
- Washing soda goes into glass and paper as well as soap powder.
