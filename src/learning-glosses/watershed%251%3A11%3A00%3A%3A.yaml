simpleMeaning: an event that marks a one-of-a-kind or important change in the way history goes, and that
  later important things depend on
scope: An important event that changes the course of history, also called a landmark. It is not high land
  between two rivers, and not the whole area that a river takes water from.
examples:
- The peace agreement was a watershed in the history of both nations.
- That court decision was a watershed, and many later changes followed from it.
