simpleMeaning: Small bits of stool from a person are checked at home for tiny signs of blood, to find
  cancers of the large bowel.
scope: Also called a fecal occult test and a stool test, this is a check done at home on bits of stool,
  not a check done in a hospital.
examples:
- She did the faecal occult test at home.
- The faecal occult test looks for tiny signs of blood in the stool.
