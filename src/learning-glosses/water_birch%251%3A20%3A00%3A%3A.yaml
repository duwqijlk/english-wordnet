simpleMeaning: a tree from the west of the United States with brownish bark, much like the tree whose
  bark is used to make paper
scope: 'Also called mountain birch and swamp birch: a western tree with brownish bark, not the tree whose
  bark is used to make paper and not other trees of wet ground.'
examples:
- The water birch grows along streams in the western United States.
- We saw a water birch with brownish bark near the river.
