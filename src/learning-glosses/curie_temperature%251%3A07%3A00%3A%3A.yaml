simpleMeaning: The heat level above which a magnetic material loses its magnetism and acts like a weakly
  magnetic material
scope: The heat level above which a magnetic material loses its magnetism, also called Curie point, marks
  the change from strong magnetism to weak magnetism.
examples:
- The Curie temperature is the heat above which a magnet loses its pull.
- Above the Curie temperature the material acts only weakly magnetic.
