simpleMeaning: to tell a border officer, in the set way, about goods you bring into a country and must
  pay tax on
scope: This sense is only about telling a border officer about goods you bring in and must pay tax on;
  it is not about saying something in public or saying what you think about a side.
examples:
- At the airport, you must declare any goods you will pay tax on.
- She had to declare the wine she brought into the country at the border.
