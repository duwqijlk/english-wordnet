simpleMeaning: A drug that blocks a virus enzyme (reverse transcriptase) so the virus cannot copy itself;
  it works very well with zidovudine in treating AIDS and HIV
scope: A drug that stops HIV copying itself; lamivudine is another name for this sense, not zidovudine,
  the drug it is often used with, and not a cure for AIDS.
examples:
- The doctor added 3TC to her treatment plan.
- 3TC works best when taken with zidovudine.
