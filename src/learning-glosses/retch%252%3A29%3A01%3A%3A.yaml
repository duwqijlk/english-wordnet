schema: oewn-learning-gloss-v2
senseId: 'retch%2:29:01::'
synsetId: 00077211-v
simpleMeaning: To strain and push as if to be sick, but fail and bring nothing up.
scope: Also called heave or gag, this is straining as if to be sick but bringing nothing up, not a single
  heave of the stomach and not throwing up what is in the stomach.
examples:
- He retched over the side of the boat but brought nothing up.
- The smell made her retch again and again.
