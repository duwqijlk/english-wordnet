simpleMeaning: to have its true nature in something, to be made up of or held in it, and to take a form
  in it
scope: This sense says what a thing's true nature is found in; it is not the sense of fitting together
  well or matching in form or character.
examples:
- For her, happiness consists in helping other people.
- The payment consists in food and a place to sleep.
