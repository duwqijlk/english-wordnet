simpleMeaning: like a ruler or rule with total power, where one person or group has full control over
  a country
scope: 'Also called autocratic, tyrannical, despotic, dictatorial and tyrannic: about a ruler or rule
  with total power, not a person who acts in this way and not just expecting others to obey without question.'
examples:
- The country lived under an authoritarian government for many years.
- An authoritarian ruler does not let people vote freely.
