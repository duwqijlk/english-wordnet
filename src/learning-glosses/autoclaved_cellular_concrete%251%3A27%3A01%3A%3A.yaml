simpleMeaning: first made in the mid-1920s, this light concrete comes as ready-made blocks that at once
  frame a building, keep heat in, and stand up to fire and mould
scope: Also called autoclaved aerated concrete, autoclaved concrete, autoclaved lightweight concrete,
  and porous concrete; light ready-made blocks that build and keep heat in, not heavy stone and not timber.
examples:
- The new flats were built from autoclaved cellular concrete.
- Autoclaved cellular concrete stands up to fire and mould.
