simpleMeaning: A kind of antbird living in Honduras, Nicaragua, Costa Rica and Panama, and also in Colombia
  and Ecuador in northwestern South America; scientifically named Hylophylax naevioides.
scope: This antbird of Central America and northwestern South America, not the similarly named spotted
  antpitta or other antbird species.
examples:
- The spotted antbird lives in Costa Rica and Panama.
- We saw a spotted antbird in the rainforest of Ecuador.
