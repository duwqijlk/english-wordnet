simpleMeaning: to put new words into a piece of writing, often so that it says what is not true
scope: 'Also called alter and interpolate: putting words into writing, not just making a thing false in
  a general way.'
examples:
- Someone falsified the letter by adding a line that was never there.
- He falsified the old text by putting in words the writer never wrote.
