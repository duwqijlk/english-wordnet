simpleMeaning: the link in grammar between a word or a group of words and the part of a sentence that
  says what the subject does or is
scope: A link in grammar between a word or phrase and the predicate, not a link between two whole sentences
  and not the meaning of a word.
examples:
- In the sentence 'She became a teacher', the complementation links 'a teacher' to 'became'.
- The class studied complementation to see how words complete the verb in a sentence.
