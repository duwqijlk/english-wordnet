simpleMeaning: Its bark is blue-green and its flowers are showy yellow on this thickly branched thorny
  tree of the southwestern United States, sometimes put in the group Cercidium.
scope: A thickly branched thorny tree of the southwestern United States with showy yellow flowers and
  blue-green bark.
examples:
- The palo verde has showy yellow flowers.
- We saw a palo verde with blue-green bark in the southwest.
