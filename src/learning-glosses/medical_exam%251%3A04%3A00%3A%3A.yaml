simpleMeaning: A person gets a full look at the body, with many kinds of tests picked for their age, sex
  and health
scope: Also called a medical checkup, a medical examination, a checkup, a health check or a medical, this
  is a full look at the body, with tests picked for the person's age, sex and health, not a visit for
  one illness and not one test on its own.
examples:
- His medical exam included blood tests, a hearing test and an eye test.
- She booked a medical exam before starting her new job.
