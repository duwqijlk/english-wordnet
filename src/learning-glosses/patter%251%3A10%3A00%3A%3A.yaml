simpleMeaning: smooth, quick talk that sounds true and is meant to win people over, especially helpful
  to a person who sells things
scope: Quick, smooth talk that sounds good and is meant to win a sale, not honest plain talk and not idle
  chat.
examples:
- The patter of the salesman made the coat sound like a bargain.
- She saw through his smooth patter and asked for the price in writing.
