simpleMeaning: Found in many places in North America, this duck's males have heads of a dark purple colour
scope: 'Also called lake duck and lesser scaup duck: a duck of North America whose males have purple heads,
  not a duck of Europe and not one whose males have plain heads.'
examples:
- We saw a lesser scaup on the lake this morning.
- The male lesser scaup had a dark purple head.
