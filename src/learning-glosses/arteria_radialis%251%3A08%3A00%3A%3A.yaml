simpleMeaning: Blood reaches the palm through this branch of the main arm vessel, which runs down the
  arm from below the elbow and round the wrist.
scope: A blood vessel of the arm, also called radial artery; not the main arm vessel it branches from.
examples:
- The arteria radialis runs down the forearm to the palm.
- The arteria radialis ends in the palm after passing round the wrist.
