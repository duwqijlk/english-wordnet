simpleMeaning: the quality of being full of energy, movement, and force in what you do
scope: This is a lasting quality of a person's energy, not a single deed that someone performs.
examples:
- He was a man of action, never happier than when a decision had to be made on the spot.
- The new coach brought a spirit of action to a team that had grown passive.
