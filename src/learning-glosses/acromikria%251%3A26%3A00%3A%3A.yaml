simpleMeaning: Hands and feet that are too small because the fingers and toes did not grow fully.
scope: Acromicria is another name for this sense, not a hand made small by injury and not a missing finger.
examples:
- His acromikria left his toes short and small.
- Acromikria means the hands and feet stay too small.
