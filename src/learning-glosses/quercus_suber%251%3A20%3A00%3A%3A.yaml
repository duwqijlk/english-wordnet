simpleMeaning: A medium-sized evergreen oak from southern Europe and northern Africa, with thick bark
  that is cut away from time to time to give cork for sale.
scope: A medium-sized evergreen oak, also called cork oak; not the red oak and not the white oak grown
  for timber.
examples:
- Quercus suber grows across the hills of southern Europe.
- Workers strip the bark of Quercus suber every few years.
