simpleMeaning: To say you are unhappy or displeased, to show discontent, and to make complaints
scope: 'Another name for kick, plain, complain and kvetch: saying you are unhappy with something, not
  keeping quiet about it.'
examples:
- He quetches about the food every single day.
- She quetches that the bus is always late.
