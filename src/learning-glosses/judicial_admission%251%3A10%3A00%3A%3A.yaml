simpleMeaning: In law, a point about the case, agreed or given up by the sides or their lawyers, which
  must be written down unless it is in the court record.
scope: In law, a point agreed or given up by the sides in a court case; stipulation is another name for
  it, not a ruling by the judge and not a point agreed outside court.
examples:
- The judicial admission saved the court many hours of proof.
- Her lawyer made a judicial admission about the dates.
