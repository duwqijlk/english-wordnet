simpleMeaning: to give a thing the blessing of a church or religion, as by an oath
scope: To bless something in a religious way, not to approve a plan and not to punish someone for breaking
  the rules.
examples:
- The church will sanction their marriage with an oath.
- They asked the priest to sanction the marriage.
