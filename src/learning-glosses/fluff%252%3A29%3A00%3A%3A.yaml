simpleMeaning: to comb the ends of hair back toward the head so the hair looks thick and full
scope: 'Also called tease: to comb hair back so it looks full, not a mistake on stage and not to ruin
  or mess something up.'
examples:
- She fluffed her hair with a comb before the photo.
- He fluffed his curls to make them look thicker.
