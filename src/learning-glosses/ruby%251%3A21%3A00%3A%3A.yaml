simpleMeaning: a clear piece of a deep red stone that has been cut and made smooth and shiny, and is worth
  much money as a jewel
scope: This is a piece of deep red stone that has been cut, made smooth and shiny, and is valued as a
  jewel; not the deep red color, and not the clear deep red stone material itself.
examples:
- She wore a ring with a large ruby in the center.
- The ruby in the crown shone bright red.
