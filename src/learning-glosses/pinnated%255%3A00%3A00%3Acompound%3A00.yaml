simpleMeaning: A feather is what this leaf shape looks like, with small leaves on both sides of one middle
  stem
scope: Also called pinnate, said of a leaf shape with small leaves on both sides of one stem, not a single
  flat blade and not leaflets that all start at one point.
examples:
- The pinnated leaf looked like a feather, with leaflets on each side of the stem.
- He drew the pinnated leaf shape in his notebook.
