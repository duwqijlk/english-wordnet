simpleMeaning: People use the young of this winged bug as bait; the bug itself is smaller than the dobsonfly,
  a big winged bug
scope: 'Also called a fish fly: a small winged bug much like the dobsonfly, but smaller, whose young are
  used as bait, not a dobsonfly and not a fly used to catch fish.'
examples:
- Fish-flies gathered around the porch light.
- We used fish-fly larvae as bait.
