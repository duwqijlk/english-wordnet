simpleMeaning: In Britain, a man with a special honour; his place is below a baron and above a knight
scope: This is a British honour and rank, not a baron above it and not a knight below it.
examples:
- Since he was a baronet, he was called Sir Henry Jones.
- The baronet's rank was below a baron's and above a knight's.
