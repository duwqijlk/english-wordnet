simpleMeaning: This tree of warm lands keeps its leaves all year and bears hairy yellow fruit the size
  of an olive, with one big stone free inside, from China and Japan.
scope: Also called loquat, it is the evergreen tree of warm lands from China and Japan.
examples:
- The loquat tree kept its leaves all winter.
- She picked the yellow fruit from the loquat tree.
