simpleMeaning: The act of splitting something into parts, or the making of a boundary that marks something
  off and keeps it apart.
scope: The act of cutting something apart by drawing a boundary that separates one side from another;
  it is not the general process of breaking something up into pieces, not the arithmetic calculation,
  and not a group of organisms in a classification.
examples:
- The division of the estate into two equal farms took years to settle.
- A low fence marks the division between the two gardens.
