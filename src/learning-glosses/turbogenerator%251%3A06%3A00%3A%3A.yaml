simpleMeaning: A machine for making electric power, with a wheel with blades driven by steam joined to
  a part that makes the power.
scope: This is a machine that makes electric power from steam, not a water wheel and not a windmill.
examples:
- The turbogenerator supplied power to the mill.
- A new turbogenerator was fitted at the plant.
