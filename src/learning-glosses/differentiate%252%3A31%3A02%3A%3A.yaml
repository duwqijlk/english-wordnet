simpleMeaning: to be what makes a person or thing stand out from the rest, sometimes in a good way
scope: 'Also called mark and distinguish: what makes a person or thing stand out from the rest, not to
  work out a derivative in maths and not to become different in growth.'
examples:
- His modesty differentiates him from his peers.
- Her quick mind differentiates her from the other students.
