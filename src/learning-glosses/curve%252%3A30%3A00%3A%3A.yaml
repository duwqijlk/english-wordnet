simpleMeaning: to form a small tight ring, a smooth bend, or a sharp twist
scope: 'Also called curl: to take a bent or twisted shape. Not the sense of forming an arch, and not the
  sense of going onward in bends and turns.'
examples:
- The paper curved into a tight roll at the edges.
- The wire curved into a sharp bend at the end.
