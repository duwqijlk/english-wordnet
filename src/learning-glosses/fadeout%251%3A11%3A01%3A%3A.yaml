simpleMeaning: a gradual, short-lived loss of a signal sent out, caused by electrical trouble
scope: This is a signal sent out and lost for a short time; not a signal switched off on purpose and not
  a lasting loss of signal.
examples:
- The fadeout lasted only a few seconds during the storm.
- Electrical disturbance caused a fadeout in the radio signal.
