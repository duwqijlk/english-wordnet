simpleMeaning: A dodge that avoids the point of an argument by bringing up small points that do not matter
scope: A dodge that avoids the point of an argument; also called quibble and cavil, not an honest answer
  to the point.
examples:
- His quiddity dodged the real question.
- The quiddity wasted the whole debate.
