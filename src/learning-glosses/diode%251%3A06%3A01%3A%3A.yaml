simpleMeaning: A heated tube with two poles inside, used to turn changing current into a one-way flow.
scope: A tube with two poles inside that turns changing current into a one-way flow, not the semiconductor
  diode with a p-n junction.
examples:
- The old radio used a diode to put its current right.
- The diode let current flow one way only.
