simpleMeaning: to eat or drink as much as you want, until you feel full and want no more
scope: This is eating or drinking until you are full yourself; it is not giving a person or animal more
  food than they need.
examples:
- After surfeiting on bread and cheese, he pushed his plate away.
- They surfeited at the long feast and could eat no more that night.
