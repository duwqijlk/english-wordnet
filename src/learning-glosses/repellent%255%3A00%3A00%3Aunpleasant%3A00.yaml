simpleMeaning: having the effect of pushing people or things away
scope: 'Repellant is another name for this sense: having the effect of pushing people or things away.
  Not unable to soak up liquid, not a chemical that keeps animals away, and not the stronger sense of
  being very unpleasant in a way that makes people feel disgust.'
examples:
- A repellent smell kept people away from the old shed.
- His cold, repellent manner pushed new friends away.
