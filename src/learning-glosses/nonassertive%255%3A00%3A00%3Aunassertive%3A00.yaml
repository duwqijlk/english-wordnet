simpleMeaning: Not sure of oneself in a pushy way, though not always short of trust in oneself.
scope: Not sure of oneself in a pushy way, though not always short of trust in oneself, not bold and pushy
  and not without any trust in oneself.
examples:
- She was quiet and nonassertive as she took control.
- He answered in a nonassertive way, but his plan was clear.
