simpleMeaning: A tree from southeastern Asia to Australia, grown mainly for sweet edible fruit that resembles
  lychee nuts; sometimes classed in the groups Euphorbia or Nephelium.
scope: Another name for the longan tree, also called longanberry, not the lychee whose fruit it resembles.
examples:
- The lungen is grown mainly for its sweet, lychee-like fruit.
- Botanists sometimes place the lungen in Euphorbia or Nephelium.
