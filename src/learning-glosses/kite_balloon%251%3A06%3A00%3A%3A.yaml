simpleMeaning: A large bag filled with gas that hangs in the air to block enemy planes, with rounded parts
  at one end that keep it facing the wind
scope: A balloon held up to block enemy planes, kept facing the wind by the rounded parts at its end,
  not a toy balloon and not an ordinary round balloon.
examples:
- The kite balloon floated above the harbour all day.
- Crews hauled the kite balloon down when the wind changed.
