simpleMeaning: A turn so steep that the plane's side-to-side line comes near to upright.
scope: A steep turn of a plane; not a gentle turn and not a dive.
examples:
- The pilot made a vertical bank and the plane turned steeply.
- A vertical bank brings the plane's side line near to upright.
