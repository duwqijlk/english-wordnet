simpleMeaning: Chemically or physically combined with another element, substance or material.
scope: This is about substances or materials joined together, not a book with a cover, not a person tied
  by an oath or contract, and not travelling toward a place.
examples:
- The oxygen is bound to the iron in the compound.
- In this molecule, the two atoms are tightly bound.
