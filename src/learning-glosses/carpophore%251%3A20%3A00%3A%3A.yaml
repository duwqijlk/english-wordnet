simpleMeaning: A thin stem that forms the centre line of a seed-case.
scope: A thin stem that forms the centre line of a seed-case; not a thin stem that holds up a leaf, and
  not a thin stem that holds up a flower.
examples:
- The carpophore runs through the middle of the seed-case.
- You can see the thin carpophore down the centre of the seed-case.
