simpleMeaning: Often growing in thick groups, this small bushy oak of the northeast and centre of the
  United States drops its leaves yearly and bears sweet nuts to eat.
scope: People also call it dwarf chinkapin oak and dwarf oak; it is a small bushy oak, not a tall one,
  that often grows in thick groups and bears sweet nuts to eat.
examples:
- The dwarf chinquapin oak drops its leaves yearly.
- Sweet nuts to eat grow on the dwarf chinquapin oak.
