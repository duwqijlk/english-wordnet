simpleMeaning: To clean dirty water, large shallow pools where sunlight, germs, and green growth work
  together.
scope: These large shallow pools that clean dirty water are also called stabilization ponds and water
  stabilization lagoons.
examples:
- The oxidation pond cleans dirty water with sunlight.
- Germs in the oxidation pond help clean the water.
