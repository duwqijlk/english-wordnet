simpleMeaning: Dancing to songs played by a machine, people eat and drink in this small place by the road
  in the south-east of the United States
scope: A small roadside place in the south-east of the United States where people eat, drink and dance
  to music from a machine, also called jook, jook house, jook joint, juke or juke house; not a large city
  nightclub and not a bar with no dancing.
examples:
- They spent Saturday night at a juke joint just off the main road.
- The juke joint served fried chicken and played records all evening.
