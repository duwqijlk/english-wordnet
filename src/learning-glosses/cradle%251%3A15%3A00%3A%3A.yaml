simpleMeaning: the place where something first began and was helped to grow in its early time
scope: This is the place where something first began and was helped to grow, not the long box used by
  people who dig for gold and not the act of cutting grain with a tool.
examples:
- Many call this area the cradle of civilization.
- The small town is known as the cradle of the new art.
