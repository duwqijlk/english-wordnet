simpleMeaning: A buyer shows this card, usually made of plastic, to prove they can pay, and the firm behind
  it sees that the seller is paid for the goods.
scope: 'Also called plastic and charge card: a card that promises payment to a seller, not cash and not
  a card used only to take money out.'
examples:
- He handed over his charge plate to pay for the meal.
- The shop took her charge plate without asking for cash.
