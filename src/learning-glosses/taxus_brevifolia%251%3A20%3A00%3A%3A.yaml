simpleMeaning: A small or mid-sized tree of the Pacific coast of North America, with branches that spread
  in an uneven way, that gives fine hard wood with a close grain.
scope: 'Also called western yew, California yew and Pacific yew: a small or mid-sized tree of the Pacific
  coast of North America that gives fine hard wood, not a tree of the east coast.'
examples:
- Taxus brevifolia grows along the Pacific coast.
- The wood of Taxus brevifolia is fine and hard.
