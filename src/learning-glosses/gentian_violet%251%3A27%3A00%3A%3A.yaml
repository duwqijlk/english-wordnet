simpleMeaning: Used to colour or mark things, to kill germs and fungi and worms, and to treat burns, a
  green crystal turns violet in water.
scope: Also called crystal violet, this is the green crystal that turns violet in water.
examples:
- Gentian violet stained the skin violet.
- Gentian violet was put on the burn to help it heal.
