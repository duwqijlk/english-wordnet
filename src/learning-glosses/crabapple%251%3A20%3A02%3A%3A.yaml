simpleMeaning: any of many kinds of apple tree grown for small sour fruit, usually bright red, used for
  preserves (fruit cooked with sugar), or for their flowers to look at
scope: Also called crab apple and cultivated crab apple, this is a kind of tree grown by people, not the
  small sour fruit itself and not a wild apple tree.
examples:
- The crabapple in their garden has bright red fruit in the fall.
- She planted a crabapple for its spring blossoms and small fruit for preserves.
