senseId: 'presumption%1:09:01::'
synsetId: 05789344-n
simpleMeaning: In law, taking a fact as true from other facts that have been shown true, accepted as true,
  or taken as true by a court without proof
scope: In law, this is deciding a fact is true from other facts, not the rude act of doing something you
  have no right to do.
examples:
- In law, a presumption of death can be made after a person has been missing for many years.
- The court worked from a presumption that the signed paper was real.
