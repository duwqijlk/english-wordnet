simpleMeaning: In business, similar shops, restaurants, banks, hotels or theaters that have the same owner.
scope: This is a business group of shops or restaurants owned by one company, not a string of metal loops
  or a beaded piece of jewellery.
examples:
- The coffee chain opened twenty new branches this year.
- She manages a chain of hardware stores across the state.
