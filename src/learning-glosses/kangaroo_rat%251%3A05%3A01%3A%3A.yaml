simpleMeaning: Any of several kinds of leaping gnawing animals of the dry lands of North America and Mexico,
  the biggest kinds in their group.
scope: Desert rat is another name for this leaping gnawing animal of the dry lands of North America and
  Mexico, not the rabbit-sized kind of Australia.
examples:
- A kangaroo rat bounded away in great hops.
- Kangaroo rats live in the dry parts of North America.
