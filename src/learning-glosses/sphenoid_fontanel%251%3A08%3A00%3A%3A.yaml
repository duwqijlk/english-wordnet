synsetId: 05551174-n
simpleMeaning: A soft, irregularly shaped gap on each side of a baby's skull where four bones meet; after
  the bones harden, the same spot is called the pterion.
scope: This is the gap at the side of an infant's skull, not the large soft spot at the front of the head.
examples:
- The doctor gently felt the sphenoid fontanel at the side of the infant's head.
- A bulging sphenoid fontanel can signal raised pressure inside the skull.
