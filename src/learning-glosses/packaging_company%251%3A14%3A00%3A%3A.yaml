simpleMeaning: A firm that puts goods into boxes or wrappings so they can be sold, sent away or kept
scope: 'Also called a packaging concern: a firm that puts goods into boxes or wrappings for sale, sending
  or keeping, not a firm that makes the goods and not a firm that only moves them.'
examples:
- The packaging company put our jars into strong boxes for the long trip.
- That packaging company wraps goods for shops, for sending by post and for keeping in store.
