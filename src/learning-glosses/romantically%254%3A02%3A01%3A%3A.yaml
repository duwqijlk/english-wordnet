simpleMeaning: in a loving way, with love and a wish to be close to another person showing in words or
  actions
scope: This means in a way that shows love, not in a way full of hopes that are not real or not likely
  to happen.
examples:
- He looked at her romantically across the table.
- The couple walked romantically along the beach at sunset.
