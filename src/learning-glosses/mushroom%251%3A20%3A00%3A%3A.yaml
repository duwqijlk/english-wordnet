simpleMeaning: the common name for an agaric (a fungus with a cap and stem) that people can eat, unlike
  a toadstool, which is not safe to eat
scope: This is the common name for the kind people can eat. It is not the single-kind sense, not the wider
  group of fleshy fungi, and not the cloud after a blast.
examples:
- We cooked the mushrooms with garlic for dinner.
- He picked only mushrooms that were safe to eat and left the toadstools alone.
