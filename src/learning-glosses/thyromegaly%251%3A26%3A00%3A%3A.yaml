senseId: 'thyromegaly%1:26:00::'
synsetId: 14222959-n
simpleMeaning: a neck gland swollen far past its normal size because it makes too little or too much hormone,
  or because the diet lacks iodine
scope: Also called goiter, goitre, and struma; a swollen thyroid gland, not a lump in the throat and not
  a gland that works too fast on its own.
examples:
- Her thyromegaly made swallowing hard.
- The doctor linked his thyromegaly to too little iodine.
