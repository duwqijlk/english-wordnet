simpleMeaning: With no iron in it, this soft earth stuff is used to make pots and to shape things
scope: This is soft earth with no iron in it, used to make pots and to shape things, also called potter's
  earth, and not the earth used for bricks.
examples:
- The potter's clay felt smooth and cool in her hands.
- He wedged the potter's clay before shaping it into a bowl.
