simpleMeaning: Until they hatch, the male of this toad of Europe carries the young eggs, made ready to
  grow, wrapped round its back legs.
scope: It is also called midwife toad, a toad of Europe whose male carries the eggs wrapped round its
  back legs until they hatch.
examples:
- The male obstetrical toad carried its eggs until they hatched.
- An obstetrical toad lives in Europe.
