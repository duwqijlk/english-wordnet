  high up
scope: A piece of air-filled clothing worn to keep a person safe while flying in space or very high up,
  not ordinary clothes for everyday wear.
examples:
- The pilot put on her pressure suit before the high flight.
- A pressure suit fills with air to keep the wearer safe in space.
