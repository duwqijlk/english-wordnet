simpleMeaning: a fine powder used as food, made by crushing grain and passing the crushed grain through
  small holes to take out the big bits
scope: The powder itself, used as food; not the act of turning grain into it, and not the act of covering
  food with it.
examples:
- She mixed the flour with water to make dough.
- We bought a bag of flour for the cake.
