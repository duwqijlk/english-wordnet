simpleMeaning: a hard push to force a person to give in, by gathering strength or using it in an unfair
  way
scope: Also called a squeeze and a squeeze play, it is a hard push to force a person to give in, not a
  simple ask.
examples:
- She saw the power play for what it was and walked away.
- His power play forced the team to give in to his plan.
