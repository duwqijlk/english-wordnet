simpleMeaning: a thing a person fishing puts on a line to catch fish; it turns round and round when pulled
  through the water
scope: A fishing tool that turns in the water, not a person who twists threads to make yarn, and not the
  turning dial used in a board game.
examples:
- He put a bright spinner on his line to catch fish.
- The spinner turned fast as he pulled it through the water.
