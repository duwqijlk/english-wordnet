simpleMeaning: About the size of a squirrel, this toothless South American animal has long, smooth, gold-coloured
  hair.
scope: This toothless South American animal is also called a two-toed anteater.
examples:
- The silky anteater is about the size of a squirrel.
- A silky anteater has long, smooth, gold-coloured hair and no teeth.
