simpleMeaning: On a leafy stem in eastern North America, this violet bears large white or creamy flowers
  faintly marked with purple.
scope: A violet of eastern North America with large white or creamy flowers faintly marked with purple;
  cream violet and striped violet are other names for this sense.
examples:
- We found a pale violet with large white flowers faintly marked with purple.
- The pale violet blooms in eastern North America.
