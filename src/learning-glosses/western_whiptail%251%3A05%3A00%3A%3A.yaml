simpleMeaning: A quick-moving lizard with a net of dusky dark marks, found in dry lands from Oregon and
  Idaho to Baja California.
scope: This quick-moving lizard lives in dry lands from Oregon and Idaho to Baja California and is known
  by the net of dusky dark marks.
examples:
- The western whiptail darted across the dry ground in Oregon.
- We saw a western whiptail in the dry lands of Idaho.
