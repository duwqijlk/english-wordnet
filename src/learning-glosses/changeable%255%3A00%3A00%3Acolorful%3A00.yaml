simpleMeaning: showing different colors when light is different or when you look from a different side
scope: 'Also called shot and iridescent: showing different colors in different light or from different
  sides, not the general sense of being able to become different.'
examples:
- She wore a changeable silk dress that looked blue and then green in the light.
- The dragonfly had changeable wings that shone with different colors from each side.
