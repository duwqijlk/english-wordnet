simpleMeaning: a general name for female sex chemicals of one kind (steroid hormones), sent out by the
  ovary (the part where eggs form), that cause usual female sexual features
scope: Also called oestrogen, this is a general name for female sex body chemicals, not one single chemical
  and not a male sex chemical.
examples:
- Estrogen helps control the monthly cycle in women.
- The body makes estrogen in the ovary.
