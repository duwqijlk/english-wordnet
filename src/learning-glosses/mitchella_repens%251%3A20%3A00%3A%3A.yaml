simpleMeaning: A woody plant of the east of North America that creeps along the ground, with shiny leaves
  that stay green and red berries
scope: Also called boxberry, partridgeberry and twinberry; a creeping woody plant with shiny leaves and
  red berries, not a tall shrub and not a plant with blue berries.
