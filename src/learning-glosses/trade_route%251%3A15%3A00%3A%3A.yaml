simpleMeaning: the way that sellers of goods follow, often in groups travelling together
scope: It is a land path followed by sellers of goods, often in groups travelling together, not a sea
  lane used by ships and not a bus route used for daily travel.
examples:
- Camel trains used the old trade route across the desert.
- The trade route linked the coastal towns with the inland markets.
