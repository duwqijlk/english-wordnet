simpleMeaning: Body parts may be taken out to give to another person before the heart stops, from one
  who no longer breathes, gives no body answers, and has no awareness.
scope: Also called brain death, a state with no breathing, no body answers and no awareness; not a state
  in which the heart has already stopped.
examples:
- Cerebral death means no breathing and no awareness, though the heart may still beat.
- After cerebral death, body parts can be taken out to give to another person.
