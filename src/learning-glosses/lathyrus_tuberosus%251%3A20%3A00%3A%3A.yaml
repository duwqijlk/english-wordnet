simpleMeaning: A European herb with small tubers that are eaten, and in Scotland used to give whiskey
  its taste.
scope: A European herb with small tubers that are eaten, also called earth-nut pea, earthnut pea, heath
  pea and tuberous vetch; its near kin are other vetches and peas.
examples:
- Lathyrus tuberosus bears small tubers used for food.
- In Scotland, Lathyrus tuberosus flavours whiskey.
