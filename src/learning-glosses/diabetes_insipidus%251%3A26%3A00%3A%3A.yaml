simpleMeaning: A rare condition where the body lacks a hormone that controls the kidneys, so large amounts
  of pale, watery urine are passed, causing great thirst and loss of water.
scope: This is a rare hormone-related condition that causes huge amounts of watery urine, not the common
  diabetes involving blood sugar and insulin.
examples:
- After being diagnosed with diabetes insipidus, she had to drink water constantly.
- Diabetes insipidus results from too little of the hormone that tells the kidneys to conserve water.
