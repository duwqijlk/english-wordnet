simpleMeaning: In a way that shows no feeling for another person's pain or trouble.
scope: Of a judge listening to a plea, or an answer with no word of comfort.
examples:
- The judge listened unsympathetically to the accused's plea.
- She answered unsympathetically, with no word of comfort.
