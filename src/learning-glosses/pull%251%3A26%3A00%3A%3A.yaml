simpleMeaning: A sharp injury caused by straining a muscle or ligament.
scope: This is a muscle injury, not the act of tugging something and not the force used to tug it.
examples:
- He missed three games with a hamstring pull.
- The runner felt a pull in her calf during the sprint.
