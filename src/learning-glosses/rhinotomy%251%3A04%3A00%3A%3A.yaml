simpleMeaning: Pus that has built up inside the nose is let out when a surgeon cuts into the nose.
scope: In this operation, a surgeon cuts the nose to let out pus that has built up inside it.
examples:
- A rhinotomy let out the pus that had built up inside the nose.
- The rhinotomy drained the pus from the nose.
