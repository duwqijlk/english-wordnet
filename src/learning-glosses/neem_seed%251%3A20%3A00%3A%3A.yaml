simpleMeaning: The small hard part of a tree that grows into a new tree, used to make bug-killers, plant
  food, and medicines.
scope: The small hard part of a tree that grows into a new tree, used to make bug-killers, plant food,
  and medicines; not a leaf and not the bark.
examples:
- Farmers press neem seed to make bug-killers for the fields.
- Neem seed is also used to make plant food and medicines.
