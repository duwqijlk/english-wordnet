simpleMeaning: Having a deep and full taste that is strong on the tongue.
scope: A deep, full flavor in food or drink only; not having much money, not being full of some desirable
  substance or resource, not high in minerals or fuel content, not suggesting great expense, not provoking
  anger through hypocrisy, not of great worth, not fruitful or productive, not strong and intense in color,
  not heavy with fat, eggs or sugar, not pleasantly full and mellow, not supplied in abundance, and not
  the noun for wealthy people as a group.
examples:
- The stew was rich and deeply satisfying on a cold night.
- He poured a rich ruby port to go with the cheese.
