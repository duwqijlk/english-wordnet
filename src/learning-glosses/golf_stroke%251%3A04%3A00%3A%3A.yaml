simpleMeaning: The ball is the target when a player moves a stick through the air, and usually the stick
  hits it
scope: A move with a stick that tries to hit the ball, also called golf shot and swing, not a hit with
  the hand and not a throw of the ball.
examples:
- His golf stroke was smooth and straight.
- Her golf stroke sent the ball onto the green.
