simpleMeaning: A cornbread, usually made flat on a hot plate, chiefly in New England.
scope: A cornbread, usually made flat on a hot plate, chiefly in New England; johnny cake and journey
  cake are other names for this sense, not bread baked in an oven and not a sweet cake.
examples:
- Johnnycake sizzled on the griddle as breakfast cooked.
- They ate johnnycake with butter and syrup.
