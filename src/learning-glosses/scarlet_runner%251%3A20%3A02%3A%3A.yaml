simpleMeaning: A hairy vine of western Australia lies flat or trails on the ground, and bright red-pink
  flowers grow on it.
scope: Also called running postman, this is a vine of western Australia with bright red-pink flowers,
  not the tropical American bean with red flowers and mottled black beans.
examples:
- The scarlet runner trailed along the ground, its bright red-pink flowers open.
- We saw a scarlet runner lying flat with bright red-pink flowers.
