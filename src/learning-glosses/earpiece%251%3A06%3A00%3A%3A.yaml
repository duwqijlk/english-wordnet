simpleMeaning: a small piece of equipment that turns electric signals into sound and is worn over or inside
  the ear
scope: A small piece of equipment that turns electric signals into sound and is worn over or inside the
  ear; phone and headphone are other names for this, not a loudspeaker and not a hearing aid.
examples:
- She put the earpiece in her ear to hear the call.
- The earpiece turned the phone's signals into sound.
