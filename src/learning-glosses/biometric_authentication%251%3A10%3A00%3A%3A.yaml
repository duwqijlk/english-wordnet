simpleMeaning: The automatic naming of a living person from the way their body is built and the way they
  act.
scope: The automatic naming of a living person from the way their body is built and the way they act,
  also called biometric identification and identity verification; not a password and not a card.
examples:
- Biometric authentication let her in with a touch of her finger.
- The phone used biometric authentication to check who held it.
