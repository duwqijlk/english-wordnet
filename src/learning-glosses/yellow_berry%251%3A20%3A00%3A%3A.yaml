simpleMeaning: The fruit of several kinds of buckthorn that gives dyes or colours
scope: The fruit of several kinds of buckthorn that gives dyes or colours, also called buckthorn berry;
  not a fruit grown for eating and not the fruit of a single kind of buckthorn.
examples:
- The dyer boiled yellow berry to colour the wool.
- Yellow berry from the hedgerow gave the cloth a deep gold.
