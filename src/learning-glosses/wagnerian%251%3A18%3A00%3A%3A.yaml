simpleMeaning: A person who follows the ideas of Richard Wagner or loves his music.
scope: A person who follows the ideas of Richard Wagner or loves his music; this is the noun sense, not
  the adjective that means 'of Wagner or his music'.
examples:
- He is a Wagnerian who loves the operas of Richard Wagner.
- The Wagnerian praised Wagner's theories on music.
