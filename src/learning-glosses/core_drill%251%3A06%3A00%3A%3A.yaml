simpleMeaning: a tool that bores a hole and takes out a round rod of the material cut from the hole
scope: A tool that bores a hole and lifts out a round rod of the material, not a tool that only bores
  a hole and not a tool for cutting flat pieces.
examples:
- The workers used a core drill to take samples from the rock.
- A core drill cut a round rod out of the stone for testing.
