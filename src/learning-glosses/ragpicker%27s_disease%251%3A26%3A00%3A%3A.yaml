simpleMeaning: A lung infection caught from breathing in dust carrying the bacterium that causes a serious
  illness in animals; chills, cough and breathlessness lead to a collapse of the circulation.
scope: This is one of several names for the lung form of anthrax caught from dust, not the skin form that
  starts with a sore.
examples:
- Ragpicker's disease began with a cough and fever in workers who sorted old cloth.
- Doctors in the past recorded ragpicker's disease among dust-covered workers.
