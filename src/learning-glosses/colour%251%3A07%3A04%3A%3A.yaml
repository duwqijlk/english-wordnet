simpleMeaning: a false show put on the outside of a thing to make people take it for what it is not
scope: 'Also called color: a false show put on to mislead, not the shade of a thing you see and not a
  thing that has shades or makes them.'
examples:
- He gave his lies a colour of truth to fool his friends.
- His story had only a colour of truth, and no real facts behind it.
