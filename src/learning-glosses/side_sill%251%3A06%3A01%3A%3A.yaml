simpleMeaning: In cars for people, these long beams usually form the edge or the bottom of the floor,
  holding up the body along each edge of a train car.
scope: These long beams along each edge of a train car hold up its body, and are also called a solebar.
examples:
- The side sill runs along the edge of the train car.
- The body of the car sits on the side sill.
