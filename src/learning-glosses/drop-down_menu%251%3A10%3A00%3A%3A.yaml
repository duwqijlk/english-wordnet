simpleMeaning: when the person using the computer clicks on a thing, a list of choices shows up under
  it
scope: A list of choices that shows up under a thing on a screen after a click, not a list that stays
  on the screen all the time and not a list of food in a restaurant.
examples:
- Click on the word File and the drop-down menu shows the choices you can pick.
- She used the drop-down menu to pick the size she wanted.
