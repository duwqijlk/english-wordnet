simpleMeaning: a tool used to push a boat forward or to guide the way it goes
scope: A long tool used by hand to move or guide a boat. Not a sail and not a machine that moves a boat.
examples:
- She pulled hard on the oar to turn the boat.
- Each rower held one oar in the water.
