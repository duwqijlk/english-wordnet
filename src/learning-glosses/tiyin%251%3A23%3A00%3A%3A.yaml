simpleMeaning: A unit of money in Kazakhstan; 100 of them equal one tenge.
scope: It is not the tiyin of Uzbekistan, where 100 of them equal one som, the larger unit of money there.
examples:
- He paid fifty tiyin for a ticket in Kazakhstan.
- One hundred tiyin equal one tenge in Kazakhstan.
