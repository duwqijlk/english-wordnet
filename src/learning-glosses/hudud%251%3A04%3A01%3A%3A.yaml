simpleMeaning: In Islam, grave wrongs done by Muslims that the Koran sets fixed punishments for.
scope: In Islam, these are grave crimes, such as apostasy, murder, theft and adultery, with a punishment
  set in the Koran; Had crime is another name for it.
examples:
- Hudud covers crimes such as theft and adultery, which the Koran sets fixed punishments for.
- The judge said the case fell under Hudud, so the punishment was set by the Koran.
