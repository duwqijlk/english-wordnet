simpleMeaning: to put someone to death in an old form of execution by tying each arm and leg to a horse
  and pulling the body apart
scope: This is not the ordinary act of cutting something into four equal parts.
examples:
- In the sixteenth century, traitors could be quartered for their crimes.
- The rebel leader was condemned to be quartered after the uprising.
