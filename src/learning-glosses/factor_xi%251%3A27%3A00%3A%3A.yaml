simpleMeaning: A part of the blood that helps it clot, whose lack leaves a person apt to bleed.
scope: A part of the blood that helps it clot, whose lack leaves a person apt to bleed; also called plasma
  thromboplastin antecedent, not the other blood parts that help blood clot.
examples:
- A lack of factor XI leaves a person apt to bleed.
- The test showed low factor XI in his blood.
