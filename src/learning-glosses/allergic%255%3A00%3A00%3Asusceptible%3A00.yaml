simpleMeaning: having an allergy, or a strange or too-strong reaction, most of all to one thing in particular
scope: Having an allergy or reacting too strongly to one thing, not something that causes an allergy.
examples:
- Allergic children sneeze when the pollen count is high.
- She is allergic to pollen and sneezes all spring.
