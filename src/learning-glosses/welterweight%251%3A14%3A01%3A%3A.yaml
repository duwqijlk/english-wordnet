simpleMeaning: A weight class in fight sports, for fighters heavier than lightweights and lighter than
  middleweights.
scope: A weight class in fight sports, for fighters heavier than lightweights and lighter than middleweights;
  not a part-time boxer weighing no more than 148 pounds, nor a weight of 28 pounds, at times set as a
  handicap in a horse race, as a steeplechase, nor a paid boxer weighing between 141 and 147 pounds, nor
  a wrestler weighing 154-172 pounds.
examples:
- Their welterweight fought at dawn.
- The welterweight was weighed at noon.
