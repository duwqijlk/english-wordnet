simpleMeaning: a sea animal with an oval body, ten arms, thin fins as long as its body, and a large inside
  shell made of hard, chalk-like stuff
scope: 'Also called cuttle: this sea animal with ten arms and a large inside shell, not a squid or an
  octopus, which are sea animals like it but different.'
examples:
- The cuttlefish swam slowly, its thin fins moving along its body.
- We saw a cuttlefish with ten arms near the rocks.
