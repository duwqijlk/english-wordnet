senseId: 'mortality%1:28:00::'
synsetId: 15302104-n
simpleMeaning: The number of deaths in a place, counted against the number of people who live there, for
  every thousand people in a year
scope: The number of deaths in a place, counted against the number of people who live there, for every
  thousand people in a year; not the fact that people must die one day.
examples:
- The mortality in the town fell after clean water reached every house.
- Doctors studied the mortality of the area to see how the disease was spreading.
