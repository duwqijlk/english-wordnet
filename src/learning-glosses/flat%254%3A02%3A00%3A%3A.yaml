simpleMeaning: In a direct and honest way, without softening what is said.
scope: This is about speaking bluntly; it is not about a surface's shape, and not about a musical note.
examples:
- 'I''ll tell you flat: the deal is off.'
- He told me flat that he had no intention of resigning.
