senseId: 'moderately%4:02:01::'
synsetId: 00216535-r
simpleMeaning: in a way that is not too much and not too little; not strong or extreme, but in the middle
scope: Done in a middle way, not too much and not too little. It is not done in an extreme way.
examples:
- He drinks moderately, only one glass with dinner.
- She eats moderately and never takes too much at one meal.
