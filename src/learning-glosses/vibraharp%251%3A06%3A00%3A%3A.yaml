simpleMeaning: Like a xylophone but with metal bars, this musical tool has small spinning discs inside
  that make the notes wobble when the bars are struck.
scope: Also called vibes and vibraphone, it is a musical tool much like a xylophone, with metal bars and
  spinning discs inside.
examples:
- The vibraharp rang out over the band as the player struck its metal bars.
- She played a slow tune on the vibraharp, letting the notes wobble.
