simpleMeaning: The length a thing covers in one sixtieth of a minute shows its speed
scope: A speed got by dividing the length covered by the time taken, with time counted in sixtieths of
  a minute; also called kilometres per second and km/s, not a speed counted in sixty-minute units.
examples:
- Light travels in vacuum at the speed of almost 300,000 kilometers per second.
- The rocket moved at 7 kilometers per second.
