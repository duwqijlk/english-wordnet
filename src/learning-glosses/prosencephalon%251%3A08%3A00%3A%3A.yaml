simpleMeaning: the front part of the brain, the part that grows from the front end of the nerve tube
scope: The front part of the brain, the part that grows from the front end of the nerve tube; also called
  forebrain; not the back part of the brain, and not the cord that runs down the back.
examples:
- The prosencephalon grows into the two halves of the brain.
- Damage to the prosencephalon can harm thought and sight.
