simpleMeaning: A signal fed back in the opposite phase, so it makes the first signal smaller.
scope: A signal fed back in the opposite phase so it makes the first signal smaller, not a signal that
  makes it bigger.
examples:
- Negative feedback in the circuit made the signal smaller.
- The engineer used negative feedback to steady the amplifier.
