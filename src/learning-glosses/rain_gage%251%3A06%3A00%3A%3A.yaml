simpleMeaning: A tool that measures how much water falls from the sky
scope: A tool for measuring how much water falls from the sky, also called a rain gauge, a pluviometer
  or an udometer; not a thermometer and not a wind gauge.
examples:
- The rain gage showed two inches after the storm.
- She emptied the rain gage each morning.
