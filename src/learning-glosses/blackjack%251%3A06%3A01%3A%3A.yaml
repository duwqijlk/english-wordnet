simpleMeaning: A flag that usually bears a white skull and crossed bones on black cloth, flown to show
  a ship is a pirate ship.
scope: 'Also called a black flag or a pirate flag: the flag with a white skull and crossbones on black
  that marks a pirate ship, not the tree, not the card game, and not the leather club.'
examples:
- A blackjack flew from the mast to show the ship was a pirate ship.
- The blackjack bore a white skull and crossbones on black cloth.
