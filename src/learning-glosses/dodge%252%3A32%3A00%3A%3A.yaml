senseId: 'dodge%2:32:00::'
synsetId: 00811316-v
simpleMeaning: to avoid doing what you should do, answering a question, or dealing with a problem, or
  to try to avoid it
scope: This means to avoid a duty, a question or a problem, also called duck, skirt, hedge, evade, parry
  and elude; it is not words that avoid a question, and not a plan made to trick people.
examples:
- He dodged the hard question about the money.
- She often dodges her duties at work.
