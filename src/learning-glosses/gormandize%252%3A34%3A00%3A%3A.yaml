schema: oewn-learning-gloss-v2
senseId: 'gormandize%2:34:00::'
synsetId: 01195632-v
simpleMeaning: Past the point of fullness, a person still takes food, with no care for how much, and eats
  like a pig
scope: To take in food past fullness, with no shame; binge, englut, engorge, glut, gorge, gormandise,
  gourmandize, ingurgitate, overeat, overgorge, overindulge, pig out, satiate and stuff are other names
  for this, not a normal meal and not eating only what you need.
examples:
- At the feast they gormandized until the plates were bare.
- She gormandized on roast beef and pudding.
