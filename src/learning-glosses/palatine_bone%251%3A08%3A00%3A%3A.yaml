simpleMeaning: The nose hollow and the eye sockets' floors take shape in part from two oddly shaped hard
  parts at the back of the mouth's hard roof.
scope: 'Also called os palatinum and palatine: two oddly shaped hard parts make the back of the hard roof
  of the mouth.'
examples:
- The palatine bone forms the back of the hard palate.
- A palatine bone helps make the floor of the eye socket.
