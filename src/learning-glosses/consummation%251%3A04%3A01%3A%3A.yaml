simpleMeaning: the act of making a marriage complete by the husband and wife having sex together
scope: The making of a marriage complete through sex between husband and wife, not the finishing of a
  plan, deal, or other work.
examples:
- After the wedding, the consummation of the marriage took place in private.
- For them, consummation meant the marriage became complete when husband and wife had sex.
