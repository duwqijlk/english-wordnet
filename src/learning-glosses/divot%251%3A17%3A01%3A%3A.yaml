simpleMeaning: In golf, the small hole left in the ground when the club cuts out a piece of grass and
  earth as it hits the ball
scope: In golf, this is the hole left in the ground, not the piece of grass and earth that is cut out
  of it, which is the other sense of the same word.
examples:
- His ball landed in a divot on the fairway.
- The swing left a deep divot in the grass.
