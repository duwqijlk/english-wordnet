schema: oewn-learning-gloss-v2
senseId: 'nolle_prosequi%2:30:00::'
synsetId: 00363921-v
simpleMeaning: To end a case against a person by putting a formal note in the court's papers that the
  case is dropped
scope: To end a court case by a formal note in the records, not by a verdict; nol.pros. and nolle pros
  are other names for this sense.
examples:
- They decided to nolle prosequi the case against him.
- The state nolle prossed the charge after the witness changed her story.
