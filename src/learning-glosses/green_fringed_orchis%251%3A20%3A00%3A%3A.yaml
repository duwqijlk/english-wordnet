simpleMeaning: With a lip cut deep into narrow strips and a flower the colour of leaves, this plant grows
  in the east of the United States.
scope: Ragged-fringed orchid, ragged orchid, and ragged orchis are other names for this plant of the east
  of the United States.
examples:
- The green fringed orchis grows in the east of the United States.
- A green fringed orchis has a flower the colour of leaves.
