simpleMeaning: open and direct in what you say and do, with nothing held back and no secrets kept
scope: 'Also called open: this sense is about being open in nature, with nothing held back or hidden.
  Not the other candid sense, which is about speaking or acting in a plain, direct way without hiding
  what you mean.'
examples:
- She gave a candid answer and hid nothing from us.
- His candid smile showed he had nothing to hide.
