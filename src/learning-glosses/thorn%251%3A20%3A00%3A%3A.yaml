simpleMeaning: a sharp little point sticking out of a plant stem or leaf, like a spike
scope: A sharp little point sticking out of a plant stem or leaf, like a spike, also called spine, prickle,
  or sticker; not something that causes irritation and not a letter from the old Germanic writing.
examples:
- A thorn caught on her sleeve.
- He pricked his finger on a thorn.
