simpleMeaning: A tree that keeps its leaves all year, from the south of the United States, with big stiff
  shiny leaves and huge white flowers that smell sweet
scope: A tree from the south of the United States with big stiff shiny leaves and huge white sweet-smelling
  flowers; evergreen magnolia and large-flowering magnolia are other names for this sense, not a small
  bush and not a tree with small plain flowers.
examples:
- The bull bay stood by the house, its white flowers sweet in the warm air.
- Bull bay leaves are big, stiff and shiny.
