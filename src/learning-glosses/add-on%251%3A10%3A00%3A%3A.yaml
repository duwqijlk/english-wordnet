simpleMeaning: A piece of computer code that gives a program new powers or makes it work better.
scope: An extra piece of code that gives new powers to a program, also called a plug-in; not a whole program
  on its own and not a part built in from the start.
examples:
- She put an add-on in her browser to block ads.
- This add-on lets the photo program save files in a new form.
