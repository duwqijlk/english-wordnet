simpleMeaning: a rail put along the side of steps or a road, so people do not fall off the edge
scope: A rail beside steps or a road to keep people safe, not a fence around a field and not a bar on
  a window.
examples:
- A guardrail along the stairs kept the children safe.
- The car hit the guardrail and stopped.
