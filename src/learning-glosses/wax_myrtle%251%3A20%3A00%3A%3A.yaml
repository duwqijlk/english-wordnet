simpleMeaning: Small berries with a coat over them grow on any bush or small tree of the Myrica group,
  with sweet-smelling leaves.
scope: This name covers any of many kinds of bush or small tree in the Myrica group, set apart by their
  scented leaves and coated berries.
examples:
- We brushed past the wax myrtle and caught the scent of its leaves.
- We planted a wax myrtle for its scented leaves and waxy berries.
