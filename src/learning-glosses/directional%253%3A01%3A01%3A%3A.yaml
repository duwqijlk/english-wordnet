simpleMeaning: about the course toward an aim or end that is not a place
scope: About the course toward an aim that is not a place; not about position or movement in space, and
  not about leading or guiding others.
examples:
- The report studied the directional trends in modern science.
- The report charted the directional movement of the debate toward a shared goal.
