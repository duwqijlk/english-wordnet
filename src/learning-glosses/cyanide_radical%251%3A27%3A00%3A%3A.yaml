simpleMeaning: with one free link, a small part made of carbon and nitrogen joined together, found in
  a chemical stuff
scope: 'Also called cyanide group, cyano group and cyano radical: one small part inside a chemical stuff,
  not the whole chemical stuff itself.'
examples:
- The cyanide radical joins to the rest of the compound through its one free link.
- In the diagram, the cyanide radical is shown as -CN.
