simpleMeaning: A big American tree that gives shade, with big dark green leaves and a round top.
scope: Also called the American basswood and the American lime, this big shade tree of America is larger
  than the Japanese lime, the smaller tree of Japan.
examples:
- A Tilia americana shades the garden with its big dark green leaves.
- The Tilia americana has a round top and big leaves.
