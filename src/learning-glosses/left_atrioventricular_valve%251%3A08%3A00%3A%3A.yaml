simpleMeaning: A flap with two points that sits between the upper and lower rooms of the heart
scope: A two-pointed flap between the heart's upper and lower rooms; bicuspid valve and mitral valve are
  other names for this sense, not the three-pointed flap on the other side of the heart.
examples:
- The left atrioventricular valve closed to stop blood flowing back.
- Doctors checked the left atrioventricular valve for leaks.
