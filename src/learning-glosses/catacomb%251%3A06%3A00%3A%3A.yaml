simpleMeaning: a tunnel under the ground with small spaces in its walls where dead bodies were put, as
  in old Rome
scope: This is a tunnel under the ground for dead bodies, as in old Rome, not one grave and not a room
  under a building for keeping things.
examples:
- Tourists walked through the old catacomb in Rome.
- Bodies were placed in spaces along the walls of the catacomb.
