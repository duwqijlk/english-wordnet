simpleMeaning: A nutrient cells need, made of units called amino acids linked in chains; animals must
  eat it to grow and repair tissue — meat, eggs, milk and beans supply it.
scope: This is the body-building nutrient itself, not the fats and sugars that mainly supply energy or
  a particular food that contains it.
examples:
- Athletes often eat extra protein to help their muscles recover.
- Beans and nuts are good sources of protein for people who do not eat meat.
