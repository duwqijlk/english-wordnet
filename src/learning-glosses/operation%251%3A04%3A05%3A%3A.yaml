schema: oewn-learning-gloss-v2
senseId: 'operation%1:04:05::'
synsetId: 00578105-n
simpleMeaning: A step or series of steps in a particular kind of work, usually of a practical or mechanical
  kind.
scope: The steps that make up a particular kind of work, usually practical or mechanical - not a calculation,
  not computer data handling fixed by a rule, not the way a machine or system performs, not a medical
  procedure, not a military action, not a business, not a planned group activity, not a mental act, not
  the running of a machine, and not the state of being in force.
examples:
- Laying the foundations and raising the walls are among the operations needed to build a house.
- Each machine-tool operation must be checked before the next stage of the job begins.
