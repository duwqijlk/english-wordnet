simpleMeaning: The body makes niacin from this building block of body proteins, which it needs to grow
  and work as it should.
scope: Also called tryptophan, it is one of the pieces the body builds its proteins from, and the body
  turns it into niacin.
examples:
- Foods rich in tryptophane give the body what it needs to grow.
- Tryptophane in food helps the body make niacin.
