simpleMeaning: To work out a decision by considering and reasoning about the matter.
scope: This means deciding after careful thought, not holding an opinion and not having ideas in your
  mind generally.
examples:
- He thought hard before choosing the smaller apartment.
- Think what to do next before you act.
