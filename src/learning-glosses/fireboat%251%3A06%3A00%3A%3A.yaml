simpleMeaning: Along the shore or on other ships, this craft puts out blazes
scope: A craft made to put out blazes on ships or at the water's edge, not a tug and not a ship that carries
  goods.
examples:
- The fireboat sprayed water on the burning ship.
- A fireboat waited near the dock in case a fire broke out.
