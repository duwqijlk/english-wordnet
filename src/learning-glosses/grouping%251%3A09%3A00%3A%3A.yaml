simpleMeaning: a way of sorting things, with rules for which kind each thing goes into
scope: This is the way or set of rules used to sort things into kinds. It is not the act itself of putting
  things together.
examples:
- The library uses a grouping by subject for its books.
- Under this grouping, whales go with other animals that feed milk to their young.
