simpleMeaning: to work out what kind of plant or animal something is, as is done in the study of plants
  and animals
scope: 'Also called key, name, discover and describe: to work out what kind of living thing something
  is, not just to give a name and not just to know a person.'
examples:
- The student identified the flower using a field guide.
- They identified the bird as a rare kind of finch.
