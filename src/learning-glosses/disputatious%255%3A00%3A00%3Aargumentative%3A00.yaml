simpleMeaning: Ready to argue or disagree, even to the point of taking a matter to court
scope: Ready to argue and disagree, even in court, not merely firm in belief; combative, contentious,
  disputative and litigious are other names for this sense.
examples:
- A disputatious lawyer argued every point in the case.
- His disputatious manner turned every talk into a fight.
