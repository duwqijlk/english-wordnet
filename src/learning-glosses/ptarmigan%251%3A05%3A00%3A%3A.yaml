simpleMeaning: A big bird of the far north, like a grouse, with feet covered in feathers and a coat that
  is usually white in winter
scope: A big northern bird with feather-covered feet, not a smaller grouse and not a bird that keeps dark
  feathers all winter.
examples:
- The ptarmigan changed to white as snow came to the hills.
- We saw a ptarmigan with feathered feet on the cold north slope.
