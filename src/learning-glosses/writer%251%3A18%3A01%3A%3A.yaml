simpleMeaning: a person who can put words on paper and has produced at least one piece of text.
scope: This does not require being paid for the work, and it is not someone who cannot form written words
  at all.
examples:
- The contest is open to any writer, whether published or not.
- He was a writer of letters rather than of books.
