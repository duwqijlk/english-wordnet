simpleMeaning: The smallest of a group of African monkeys, living in the swampy forests of central and
  west Africa.
scope: This is the smallest of a group of African monkeys, living in swampy forests, not a baboon and
  not a larger monkey of its kind.
examples:
- The talapoin swung through the swamp forest.
- Talapoins live in the forests of central Africa.
