simpleMeaning: a hot piece of wood or coal from a fire, still glowing and giving off smoke
scope: A hot piece of wood or coal from a fire, still glowing and giving off smoke, also called coal;
  not a whole fire and not cold ash.
examples:
- An ember glowed in the dark grate.
- She blew on the embers to wake the fire.
