simpleMeaning: In chemistry, about or having one or more benzene rings (rings of six carbon atoms, joined
  in a circle)
scope: In chemistry, this is about a ring shape in a substance, not about a strong, pleasant smell.
examples:
- Benzene is an aromatic compound used in chemistry.
- Toluene is an aromatic substance with a ring of carbon atoms in it.
