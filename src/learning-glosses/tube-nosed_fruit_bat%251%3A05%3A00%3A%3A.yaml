simpleMeaning: Feeding on sweet plant food, these bats of the group Nyctimene stand out by nostrils that
  stretch out into tubes pointing away from each other.
scope: Also called harpy, harpy bat, and tube-nosed bat; a fruit-eating bat of the group Nyctimene, known
  by its tube-shaped nostrils.
examples:
- The tube-nosed fruit bat has nostrils like tubes.
- Tube-nosed fruit bats feed on sweet plant food.
