simpleMeaning: an animal that feeds its young with milk (a mammal) and chews food again after eating it,
  used in desert lands for people to ride or to pull loads
scope: A large animal people ride or use to pull loads in desert lands, not a colour and not cloth made
  from its hair.
examples:
- People rode a camel across the desert.
- The camel pulled a heavy cart in the desert town.
