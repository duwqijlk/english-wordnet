simpleMeaning: The male body takes on its usual marks through this chemical, made in the male sex glands.
scope: Made in the male sex glands, it is also called androgen.
examples:
- The androgenic hormone made in the testes shapes the male body.
- A lack of androgenic hormone can hold back the usual male marks of the body.
