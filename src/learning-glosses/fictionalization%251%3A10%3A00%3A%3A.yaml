simpleMeaning: a piece of writing that takes real events, in part or in full, and turns them into a story
  that reads like something made up
scope: 'Also called fictionalisation: a piece of writing built from real events, in part or in full, but
  told like something made up, not a plain true account and not a tale with no true part.'
examples:
- His fictionalization of the trial used real court records.
- The novel is a fictionalization, so some scenes are true and some are made up.
