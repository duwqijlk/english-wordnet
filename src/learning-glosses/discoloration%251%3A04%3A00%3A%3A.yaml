simpleMeaning: The act of making a thing lose its natural colour, so that it looks duller, dirtier, odd,
  or faded.
scope: 'Also called discolouration: the act of changing a thing''s natural colour for the worse, not the
  stained look that results.'
examples:
- Discoloration of the walls came from years of smoke.
- Sunlight caused discoloration of the old photographs.
