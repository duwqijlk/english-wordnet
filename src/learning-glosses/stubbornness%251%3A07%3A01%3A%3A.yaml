simpleMeaning: holding fast to your own ideas or wishes and refusing to give them up
scope: This is holding fast to your own ideas or wishes; not being firm for a good reason, and not simply
  refusing to listen to others.
examples:
- Her stubbornness kept her arguing long after everyone else had agreed.
- His stubbornness made him refuse help even when he needed it.
