simpleMeaning: a man who spends time doing nothing in hotel sitting rooms and bars, looking for women
  who will support him
scope: A man who stays around hotels and bars looking for women to support him, not the small long-bodied
  animal with legs and a tail.
examples:
- People at the hotel called him a lizard because he waited in the bar every night hoping a rich woman
  would pay for his drinks.
- He was a well-known lizard, spending his days in hotel sitting rooms looking for women to support him.
