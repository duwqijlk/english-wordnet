simpleMeaning: A Eurasian herb now wild in America, with white flowers and poisonous hairy leaves and
  black berries that are sometimes poisonous but sometimes safe to eat.
scope: Also called black nightshade, common nightshade, poison-berry, and poisonberry; not a tomato and
  not a herb with red berries.
examples:
- The Solanum nigrum grew white flowers by the path.
- Children were warned not to eat Solanum nigrum berries.
