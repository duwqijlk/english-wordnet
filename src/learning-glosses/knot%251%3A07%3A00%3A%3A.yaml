simpleMeaning: a soft bump or rough place in a thread, which may be a fault or made on purpose
scope: A soft bump in thread, not a tied rope, not a bird, and not a hard piece of wood.
examples:
- The knot in the yarn made the cloth uneven.
- She felt a knot in the wool as she worked.
