simpleMeaning: strands are twisted together to make yarn, rope, or thread; one strand on its own, with
  the word often telling how many there are
scope: One strand in twisted yarn or rope, not a layer of cloth, paper, or wood, and not the verb sense
  of joining things by twisting.
examples:
- Each ply of the yarn is twisted from fine fibres.
- The rope maker twisted each ply by hand before joining them.
