simpleMeaning: a thin pointer on a tool that moves over a set of marks to show a number
scope: A thin pointer that shows a number on a tool, not a sharp tool for sewing and not the part of a
  record player that makes sound.
examples:
- The needle on the speedometer pointed to sixty.
- She watched the needle move as the pressure rose.
