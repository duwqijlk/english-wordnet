simpleMeaning: People who follow a faith or group most call wrong, wild, or false, often living apart
  under a leader with a strong pull on them
scope: People following a faith most call wrong or false, not the faith itself and not followers of one
  closed set of beliefs alone.
examples:
- The cult lived apart from the town under its leader.
- Reporters wrote about the cult and its strange rules.
