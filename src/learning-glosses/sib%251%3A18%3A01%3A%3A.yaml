senseId: 'sib%1:18:01::'
synsetId: 10255811-n
simpleMeaning: A person joined to another by blood or by birth, especially when they share a forebear.
scope: For a blood relation, especially one sharing an ancestor with another.
examples:
- The two women found they were sibs, both born to the same mother.
- He called her his sib, though they had met only last year.
