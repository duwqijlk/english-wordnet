simpleMeaning: a bush of dry places in the east of the United States, with long thin leaves that are grey-white
  and downy underneath
scope: 'Also called a dwarf gray willow or a dwarf grey willow: a bush of dry places in the east of the
  United States with long thin leaves, grey-white and downy underneath, not a tall riverside tree and
  not a garden shrub.'
examples:
- Sage willow grew on the dry slope above the road.
- The sage willow by the fence had long narrow leaves.
