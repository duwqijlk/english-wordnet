simpleMeaning: treating a material that reacts to light so that a picture hidden in it becomes visible
scope: This is the treatment that brings out a photo image, not the building of an area for a purpose.
examples:
- The film was ruined because development took place in the wrong chemicals.
- Careful development of the negative brought out detail that had been invisible.
