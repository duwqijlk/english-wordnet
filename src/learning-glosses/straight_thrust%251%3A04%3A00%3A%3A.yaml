simpleMeaning: In fencing, an attack made with one foot forward, the back leg kept stiff, and the sword
  arm stretched out in front
scope: 'Also called a lunge and passado: in fencing, an attack with one foot forward and the sword arm
  out, not a cut from the side and not a step back.'
examples:
- He scored with a straight thrust in the fencing match.
- Her straight thrust came with one foot forward and her arm out.
