simpleMeaning: showing the colors that light makes when it is bent by a prism, a clear block that splits
  light into separate colors
scope: This means showing colors made by light through a prism, not just being about a prism or having
  the shape of a prism.
examples:
- The prismatic light spread colors across the wall.
- A prismatic shine came from the glass block in the sun.
