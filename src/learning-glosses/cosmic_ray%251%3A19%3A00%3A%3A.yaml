synsetId: 11461803-n
simpleMeaning: Fast, deeply penetrating particles from space, mostly protons and helium nuclei; when they
  strike air molecules they trigger showers of other particles.
scope: High-energy particles arriving from outer space, not electromagnetic waves such as X-rays or sunlight;
  the particle showers they start in the air are secondary products, not the arriving particles themselves.
examples:
- Cosmic rays from deep space constantly strike Earth's atmosphere.
- Scientists study cosmic rays to learn about particles produced in distant galaxies.
