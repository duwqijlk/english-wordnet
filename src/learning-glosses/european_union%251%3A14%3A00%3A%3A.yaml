simpleMeaning: A group of countries in Europe, set up after the Second World War, that works to cut trade
  walls and to help its members work together.
scope: A group of countries in Europe set up after the Second World War to cut trade walls and help its
  members work together; also called Europe, EU, EC, Common Market, EEC, European Community, and European
  Economic Community.
examples:
- He tried to take Britain into the European Union.
- The European Union helps its members work together on trade.
