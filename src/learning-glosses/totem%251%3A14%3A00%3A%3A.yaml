senseId: 'totem%1:14:00::'
synsetId: 08389501-n
simpleMeaning: a clan or tribe whose members are known by their family link to one common special object
scope: This is the group of families itself, not the special object, such as an animal or plant, that
  stands as a sign for the group.
examples:
- Every spring, the totem gathered all its families for a feast.
- She was born into a totem whose special object was the bear.
