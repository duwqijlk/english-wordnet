senseId: 'tit-tat-toe%1:04:00::'
synsetId: 00507218-n
simpleMeaning: A game between two folk, who set, turn by turn, a cross, else a ring, in one of nine grid
  boxes, seeking three in line, crosses or circles, to win.
scope: This sense is also called noughts and crosses, tic-tac-toe, tick-tack-toe, ticktacktoe, and ticktacktoo.
examples:
- Tit-tat-toe is played on a grid.
- A tit-tat-toe ended in three rings.
