simpleMeaning: People and cars can cross this ditch, but farm animals cannot, because metal bars set side
  by side lie across it.
scope: This set of bars is also called cattle grid.
examples:
- The cattle guard kept the cows in the field while the truck drove over it.
- A cattle guard lay across the track where the road crossed the ditch.
