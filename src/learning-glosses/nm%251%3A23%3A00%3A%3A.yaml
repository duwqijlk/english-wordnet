simpleMeaning: A length this tiny is one billionth of one standard unit of length
scope: A tiny length, one billionth of one standard unit of length, also called a nanometer, a nanometre,
  a millimicron and a micromillimeter; not a millimetre and not a centimetre.
examples:
- The film was only 5 nm thick.
- Light with a wavelength of 500 nm looks green.
