simpleMeaning: a soap mixed with fatty acids that, rubbed up, makes a rich foam to soften the beard so
  it can be cut off
scope: Also called shaving cream; a soap that foams to soften the beard, not a hand soap used only for
  washing.
examples:
- He lathered his face with shaving soap.
- Shaving soap softens the beard before the razor.
