simpleMeaning: A heavy wooden frame used in the past to punish a person, with holes that locked the feet
  and sometimes the hands
scope: A wooden frame that once locked an offender's feet or hands as punishment; not the frame that holds
  an animal for care.
examples:
- In old times, a thief might be put in the stocks in the village square.
- The stocks held his feet fast while the crowd looked on.
