simpleMeaning: With light bent only a little and spread into colours only a little, this clear hard stuff
  is used to make lenses
scope: A clear hard stuff for lenses that bends and spreads light only a little, also called crown glass
  and optical crown; not the kind that bends and spreads light a lot and not plain glass for windows.
examples:
- The makers chose optical crown glass for the lens.
- Optical crown glass keeps colours from spreading in the lens.
