simpleMeaning: A local network that sends and takes in data by high-frequency radio waves over a few hundred
  feet, using the ethernet set of rules.
scope: Also called wireless fidelity, a wireless local area network or WiFi; a local network using radio
  waves over short distances, not a wired network or a mobile phone network.
examples:
- The WLAN in the office is fast.
- She joined the WLAN at the hotel.
