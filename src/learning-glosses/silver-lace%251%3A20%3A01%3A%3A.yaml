simpleMeaning: a bushy plant that lives for years, from the Canary Islands, with white flowers and leaves
  and hairy stems in dust-like down; sometimes put in the group Chrysanthemum
scope: Also called dusty miller and silver lace; a bushy Canary Islands plant with downy stems, not a
  rose bush and not a garden daisy.
examples:
- The silver-lace grew thick and bushy in the sunny bed.
- White flowers covered the silver-lace all summer.
