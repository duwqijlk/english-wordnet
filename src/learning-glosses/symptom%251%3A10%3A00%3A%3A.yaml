simpleMeaning: anything that appears with something else and is seen as a sign that that thing is there
scope: A sign that something is there. Not only the medical sense, where it is a feeling or change in
  the body linked to a sickness.
examples:
- Rising prices are a symptom of a weak economy.
- Empty streets were a symptom of the fear in the town.
