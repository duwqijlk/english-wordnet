simpleMeaning: A set of books, often in several volumes, where short pieces on many subjects, often in
  A-to-Z order, cover all people know or one special field.
scope: Also called encyclopedia, encyclopaedia, and cyclopaedia, this book of facts covers all human knowledge
  or one special field.
examples:
- He found the date in the cyclopedia.
- The cyclopedia gave short pieces on birds and stars.
