simpleMeaning: A stroke moving from the grip end to the far end of the stick used to play a stringed instrument.
scope: A stroke moving from the grip end to the far end, not a stroke moving the other way and not a plucked
  note.
examples:
- The down-bow starts at the heel of the bow.
- She played the passage with a strong down-bow.
