simpleMeaning: showing a quick and easy understanding of how other people feel and what they are going
  through
scope: 'Also called empathic: understanding other people''s feelings well. It is not just feeling sorry
  for someone, and not just being kind without understanding them.'
examples:
- She was an empathetic listener who understood what her friends were feeling.
- The empathetic teacher noticed the boy was sad and asked what was wrong.
