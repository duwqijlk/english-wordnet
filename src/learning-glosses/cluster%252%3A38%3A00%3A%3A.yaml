simpleMeaning: To join others so you all form one tight group, the way birds gather in a flock.
scope: Coming together in a close group, not making things gather into a pile and not a bunch of fruit
  on one stem.
examples:
- The poets cluster in this town every summer.
- The children clustered around the teacher to hear the story.
