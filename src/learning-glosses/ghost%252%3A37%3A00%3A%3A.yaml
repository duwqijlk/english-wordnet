simpleMeaning: To follow someone closely and keep troubling them, like a spirit.
scope: This is haunting or pursuing a person, not moving quietly like a spirit or writing for someone
  else; haunt and obsess are other names for this sense.
examples:
- The memory of the crash ghosted her for years.
- A sense of dread ghosted him as he entered the room.
