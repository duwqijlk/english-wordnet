simpleMeaning: Its small leaves stir a little when touched, on this leafy growth of warm parts of America,
  sometimes put in the group Cassia.
scope: Also called partridge pea and sensitive pea, this is the leafy growth of warm parts of America
  whose small leaves stir a little when touched, sometimes put in the group Cassia.
examples:
- A touch made the wild sensitive plant move its small leaves.
- A light touch sets the wild sensitive plant leaves moving a little.
