senseId: 'escape%1:04:01::'
synsetId: 00742010-n
simpleMeaning: sidestepping something unpleasant you are supposed to do, for example by cheating or tricking
  instead of doing it
scope: Shirking something unpleasant you are supposed to do, not avoiding punishment for a wrong already
  done, not avoiding danger or difficulty, and not a means or way of getting away.
examples:
- His escape from his share of the chores angered everyone else in the house.
- Her escape from jury duty was clever but dishonest.
