simpleMeaning: said most often of a look, turned to one side as if with doubt, distrust, or envy
scope: 'Also called askance, asquint, sidelong, squint or squinty: a look turned to one side with doubt
  or envy, not a look straight ahead and not a blind look.'
examples:
- She gave him an askant glance when he made the odd claim.
- He looked askant at the stranger's offer.
