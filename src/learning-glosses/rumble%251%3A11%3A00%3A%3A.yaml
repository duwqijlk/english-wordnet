simpleMeaning: a loud, low, dull sound that goes on and on
scope: 'Also called a grumble: a loud low dull sound that goes on and on, not a seat at the back of a
  carriage and not a fight between young gangs.'
examples:
- They heard the rumble of thunder in the distance.
- The rumble of the train grew louder.
