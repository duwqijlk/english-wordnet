simpleMeaning: a serious state, in particular the stage at which a nuclear reaction keeps itself going
scope: This is a serious state, in particular the stage at which a nuclear reaction keeps itself going;
  not a state of urgent need for quick action, which is the other sense of the same word, and not a fault
  in the reactor.
examples:
- The reactor reached criticality and kept itself going.
- Engineers watched for the moment of criticality.
