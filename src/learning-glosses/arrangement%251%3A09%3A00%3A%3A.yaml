simpleMeaning: A set way of putting things in order or sorting them into groups
scope: 'Also called organization and system: a set way of putting things in order or sorting them into
  groups, not a neat set of things put in order and not a piece of music made for certain voices.'
examples:
- He changed the arrangement of the topics.
- The arrangement of the facts made the report easy to follow.
