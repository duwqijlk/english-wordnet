simpleMeaning: To make sounds that mean nothing, like a baby, or to talk in a way no one can follow.
scope: To make meaningless sounds or talk no one can follow, not to give away a secret and not the flowing
  of water.
examples:
- The baby babbled happily in her cot.
- After the fall, he babbled words that made no sense.
