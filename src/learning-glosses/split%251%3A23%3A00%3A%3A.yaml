simpleMeaning: a bottle that holds only half as much as a bottle usually holds
scope: This is a bottle with half the usual amount in it. It is not a share of stolen goods or money,
  and not a group broken into parts.
examples:
- At the restaurant, he ordered a split of wine, a half-size bottle.
- She bought a split for the picnic because a full bottle was too much.
