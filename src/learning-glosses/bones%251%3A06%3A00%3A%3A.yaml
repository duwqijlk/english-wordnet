simpleMeaning: A pair of hollow pieces of wood or bone, usually held between thumb and fingers and clicked
  together in time with Spanish dancing.
scope: The clicking percussion instrument, another name for castanets, clappers and finger cymbals; not
  the bones of a skeleton, and always plural.
examples:
- She kept time by clicking a pair of bones between her fingers.
- The bones clicked softly as the dancers stamped.
