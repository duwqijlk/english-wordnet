simpleMeaning: A member of the party in England in the 1700s and 1800s that pressed for change in society,
  standing against the Tories.
scope: A member of the English party that pressed for change in society in the 1700s and 1800s, standing
  against the Tories, not the backer of the American Revolution and not a member of the later American
  party of the same name.
examples:
- He was a Whig in Parliament.
- The Whig pressed for change in society.
