simpleMeaning: In chemistry, the amount of a basic substance that joins with a set amount of another substance;
  the set amount for oxygen is 8
scope: In chemistry, this is the amount of a basic substance that joins with a set amount of another substance;
  equivalent, combining weight and eq are other names for this sense, not the weight of a single atom.
examples:
- The equivalent weight of the metal was worked out from its joining power.
- Chemists compare equivalent weights when they mix substances.
