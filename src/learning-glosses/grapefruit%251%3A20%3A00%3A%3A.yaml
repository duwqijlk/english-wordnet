simpleMeaning: a tree of the same kind as an orange tree, with large round fruit that people eat and has
  thick yellow skin and juicy, rather sour soft parts inside
scope: The tree itself, not the large yellow fruit it gives, which people eat.
examples:
- The grapefruit in her garden is full of fruit this year.
- He planted a grapefruit near the house for shade and fruit.
