simpleMeaning: One of a group of compounds with one carboxyl group, forming part of lipids, released from
  fat by hydrolysis, and built as a chain of 12 to 22 carbon atoms.
scope: A single building block of fats and oils, not a complete fat molecule such as a triglyceride.
examples:
- Omega-3 fatty acids are found in oily fish such as salmon.
- During digestion, fat is broken down into fatty acids.
