simpleMeaning: A faith or group that most people call out of step, wild, or false
scope: A faith or group most people call out of step, wild, or false, not the people who follow such a
  faith and not followers of one closed set of beliefs alone.
examples:
- The small cult met in secret each week.
- Many called the new group a cult.
