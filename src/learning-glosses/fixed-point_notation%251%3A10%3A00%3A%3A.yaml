simpleMeaning: a way of writing numbers with a set base, in which the dot that marks whole numbers from
  parts of a whole stays in one place by agreement
scope: 'Also called a fixed-point representation system: a way of writing numbers where the dot stays
  in one place by agreement, not floating-point notation, where the dot can move.'
examples:
- In fixed-point notation, the dot stays in the same place in every number.
- The old machine used fixed-point notation to write its numbers.
