simpleMeaning: a thing that holds small loose bits together and helps them stick to a surface
scope: A substance that joins loose bits and helps them stick, not a cover for loose papers and not a
  farm machine that cuts grain and ties it in bundles.
examples:
- The glue acted as a binder for the sand and cement.
- A binder in the paint helps it stick to the wall.
