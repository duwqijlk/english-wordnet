simpleMeaning: To change the small parts that light the fuel in a motor, you use this tool, which reaches
  down into the top of the motor where those parts sit.
scope: A tool shaped to reach down into the top of a motor and take out or put in the small parts that
  light its fuel.
examples:
- A sparkplug wrench takes the plugs out of the top of the motor.
- The plugs were put back with a sparkplug wrench.
