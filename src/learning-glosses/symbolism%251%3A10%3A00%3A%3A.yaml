senseId: 'symbolism%1:10:00::'
synsetId: 06820707-n
simpleMeaning: a set of signs, pictures, words or other things used together, where each one stands for
  an idea or another thing
scope: This is a whole set of signs that stand for ideas, not the late 1800s art movement of that name
  and not just the act of giving a thing a deeper meaning.
examples:
- She studied the symbolism of the old temple, a set of signs where each shape stands for an idea.
- 'The symbolism in the old story is a set of signs: the river stands for life and the road stands for
  the choices a person makes.'
