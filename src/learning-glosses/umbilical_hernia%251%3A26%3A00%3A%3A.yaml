simpleMeaning: A bulge near the belly button, where part of the gut and its fatty cover push through a
  gap in the belly wall, most often mends by itself after birth.
scope: Also called omphalocele, this bulge at the belly button is part of the gut and its fatty cover
  pushing through a gap in the belly wall, and it most often mends by itself after birth.
examples:
- The baby had an umbilical hernia near the navel.
- An umbilical hernia showed as a bulge near the navel.
