simpleMeaning: to have a loud, wild party, often with a lot of drinking
scope: 'Also called revel: to make a loud party, not a sports bat, not an illegal business, and not an
  unpleasant noise.'
examples:
- The wedding party racketed and made merry all night.
- After the win, the whole team racketed in the pub till late.
