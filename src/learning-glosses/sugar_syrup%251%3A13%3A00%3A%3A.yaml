simpleMeaning: a sweet liquid made by boiling water with a sweet food and at times a sweet liquid made
  from corn, used to make drinks sweet, especially
scope: This is a sweet liquid for making drinks sweet, not a dry sweet food and not a thick jam.
examples:
- She poured sugar syrup into the lemonade.
- The bartender keeps sugar syrup on hand for cocktails.
