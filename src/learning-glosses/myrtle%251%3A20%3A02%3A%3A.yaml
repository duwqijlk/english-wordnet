simpleMeaning: a plant grown in many places to cover the ground, with dark green leaves that shine and
  flowers that are usually blue-violet
scope: This is the low plant grown to cover the ground, not the taller evergreen shrub or tree with the
  same name.
examples:
- Myrtle grows well as a low cover under the trees.
- The garden path is lined with myrtle and its small blue-violet flowers.
