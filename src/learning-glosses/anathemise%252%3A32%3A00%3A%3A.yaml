senseId: 'anathemise%2:32:00::'
synsetId: 00866574-v
simpleMeaning: To put a curse on a person or thing, naming it evil and calling for God's punishment.
scope: This formal curse is also called accurse, execrate, anathematise, anathematize, anathemize, and
  comminate.
examples:
- The priest warned that anyone who broke church law would be anathemised.
- The bishop anathemised the offender before the whole church.
