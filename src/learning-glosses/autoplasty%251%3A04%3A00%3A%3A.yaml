senseId: 'autoplasty%1:04:00::'
synsetId: 00668339-n
simpleMeaning: a fix done by a surgeon who moves a piece of the body from one part of a person's body
  to another part of the same body
scope: A fix done by a surgeon with a piece of the patient's own body, not a fix with a piece from another
  person and not a fix with man-made parts.
examples:
- The surgeon used autoplasty to close the wound with skin from her leg.
- After the burn, autoplasty moved flesh from his back to his arm.
