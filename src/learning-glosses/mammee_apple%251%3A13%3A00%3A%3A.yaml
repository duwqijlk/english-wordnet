simpleMeaning: A tropic fruit shaped like a ball or an egg, with a thick, russet, leather-like rind and
  flesh, red or yellow, full of juice.
scope: This sense is also called mamey and mammee, for a tropic fruit shaped like a ball or an egg, with
  a thick, russet, leather-like rind and flesh, red or yellow, full of juice, unlike the sense for a warm-climate
  American tree with edible fruit in a leathery rind.
examples:
- Mammee apples taste sweet and juicy.
- They ate mammee apples after lunch.
