simpleMeaning: having to do with the end of the world, or with writings about it
scope: Having to do with the end of the world, or with writings about it; not a telling of coming doom,
  and not a ruin that has already happened.
examples:
- The apocalyptic visions in the old book spoke of fire from the sky.
- His apocalyptic talk of the end of days frightened the children.
