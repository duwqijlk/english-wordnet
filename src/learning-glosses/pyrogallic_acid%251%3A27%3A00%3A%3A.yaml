simpleMeaning: To treat some skin diseases and to bring out photographs, people use this white, shining,
  crystal-like chemical of the phenol kind that can poison.
scope: Also called pyrogallol, this white, shining, crystal-like chemical of the phenol kind can poison,
  and people use it on some skin diseases and to bring out photographs.
examples:
- The skin disease was treated with pyrogallic acid.
- The photographs were brought out with pyrogallic acid.
