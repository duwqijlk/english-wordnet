simpleMeaning: A set of signs sent by wire, in which each letter and number is shown by a run of short
  and long marks, dots and dashes
scope: This is a set of signs sent by wire for letters and numbers; Morse and Morse code are other names
  for this sense, and it uses short and long marks, not spoken words and not a secret writing.
examples:
- The ship sent its call sign in international Morse code.
- He learned international Morse code so he could read the dots and dashes.
