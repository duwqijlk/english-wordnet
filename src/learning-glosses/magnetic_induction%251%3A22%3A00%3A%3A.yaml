simpleMeaning: For a short time or for good, a thing is made to pull at iron
scope: Also called magnetisation and magnetization, this is the act of making a thing pull at iron, not
  the amount of pull that passes through a bit of space.
examples:
- Magnetic induction made the iron bar pull at other bits of iron.
- They used magnetic induction to make the needle pull at iron.
