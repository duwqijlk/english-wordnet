simpleMeaning: One of two forms taken by soft sea beasts, the free-swimming breeding stage in their life
  round, in which it has a jelly-like, umbrella-shaped body and feelers.
scope: This sense is also called medusa and medusoid, for one of two forms taken by soft sea beasts, the
