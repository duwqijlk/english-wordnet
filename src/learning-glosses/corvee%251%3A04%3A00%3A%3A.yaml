simpleMeaning: work done for no pay, such as keeping up roads, that a lord makes the people who owe him
  service do instead of paying taxes
scope: Work done for no pay, such as keeping up roads, that a lord makes the people who owe him service
  do instead of paying taxes; not paid work, and not a tax paid in money.
examples:
- The lord demanded corvee from the villagers to repair the road.
- Under corvee, men worked for days without pay.
