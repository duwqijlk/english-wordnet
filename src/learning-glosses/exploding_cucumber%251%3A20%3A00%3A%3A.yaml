simpleMeaning: a vine from the lands around the Mediterranean Sea with long fruit that, when ripe, throws
  out its seeds and juice with great force if touched
scope: A vine whose ripe fruit bursts open when touched, also called squirting cucumber or touch-me-not,
  not a plain cucumber grown for food.
examples:
- The gardener brushed against an exploding cucumber and its seeds flew out.
- When ripe, an exploding cucumber can spray its juice if you touch it.
