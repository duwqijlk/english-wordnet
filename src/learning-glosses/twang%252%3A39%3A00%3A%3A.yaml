simpleMeaning: to make a sharp ringing sound, like the sound of a pulled string
scope: To make a sharp ringing sound like a pulled string; not the sound itself, not speaking with a nasal
  sound, and not plucking a string.
examples:
- The bowstring was twanging as he drew it back.
- The wire twanged when he touched it.
