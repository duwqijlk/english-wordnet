simpleMeaning: any of many plants that people grow widely for their bright single or double flowers in
  red, pink, or white
scope: 'Also called paeony: a plant grown for its large red, pink, or white flowers, not a rose and not
  a tree.'
examples:
- The peony in her garden opened with big pink flowers.
- He planted white peonies near the fence.
