senseId: imparipinnate%5:00:00:compound:00
synsetId: 02180555-s
simpleMeaning: A leaf with small leaflets set in pairs along its stem and one more leaflet at the very
  tip
scope: A leaf shape with paired leaflets and one at the tip, also called odd-pinnate; not a leaf with
  leaflets in pairs only and not a simple undivided leaf.
examples:
- The imparipinnate leaf ended in a single leaflet at the tip.
- Botanists call a leaf imparipinnate when its leaflets grow in pairs with one more at the end.
