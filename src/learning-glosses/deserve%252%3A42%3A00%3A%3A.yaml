simpleMeaning: to have done enough, good or bad, for something to be right for you to get it
scope: This means a person has earned what they get, good or bad. It is not just wanting something or
  asking for it.
examples:
- You deserve a rest after all that hard work.
- He deserved the prize for his kind help.
