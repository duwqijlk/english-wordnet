simpleMeaning: an event that fails badly or does nothing it was meant to do at all
scope: 'This sense is also called bomb and dud: an event that fails badly. It is not the large bird, and
  not its meat eaten as food.'
examples:
- The new play was a real turkey and closed after one night.
- The meeting was a turkey, with no new ideas agreed.
