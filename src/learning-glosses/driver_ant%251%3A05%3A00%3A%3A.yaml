simpleMeaning: a kind of wandering tropical insect that hunts and eats mostly other insects
scope: A wandering tropical insect that hunts other insects, also called an army ant and a legionary ant;
  not a garden insect that stays in one nest and not a bee.
examples:
- Driver ants marched across the path in a long line.
- The driver ants hunted other insects in the forest.
