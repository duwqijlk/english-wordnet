simpleMeaning: something real and clear that stands for an idea that is not clear and has no form of its
  own
scope: 'Also called shape: a real thing that stands for an idea with no clear form of its own; not the
  act of giving an idea a real form.'
examples:
- The circle was the embodiment of his idea of life.
- For her, the old house was the embodiment of safety and home.
