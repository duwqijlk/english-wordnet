simpleMeaning: to dig a long, narrow, deep hole in the ground
scope: To dig a long, narrow hole in the ground. It is not cutting such a hole in a field so water can
  run away, and not digging such holes all around a place to protect it.
examples:
- Workers trenched along the side of the road all morning.
- The soldiers were ordered to trench before night fell.
