simpleMeaning: a piece of equipment that changes a smooth, steady signal into a set of numbers for a computer
  to use
scope: A piece of equipment that changes a smooth, steady flow into numbers for a computer to use; also
  called analog-digital converter, digitiser and digitizer, not equipment that changes numbers back into
  a smooth flow.
examples:
- The engineer fitted an analog-to-digital converter so the old radio signal could be stored on a computer.
- An analog-to-digital converter changes the smooth wave from the microphone into numbers.
