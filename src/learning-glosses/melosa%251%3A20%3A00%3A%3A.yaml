simpleMeaning: a South American herb with sticky leaves that have small glands, from which madia oil comes
scope: A South American herb with sticky leaves, from which madia oil comes; madia oil plant is another
  name for this sense, not a garden herb, and not a plant grown for its flowers.
examples:
- Melosa grows in South America, its sticky leaves giving madia oil.
- The melosa was cut for its oil, which comes from the sticky plant.
