simpleMeaning: An East African gnawing animal that looks unborn, lives in groups, eats roots, and has
  a social order like honeybees and termites, though it is neither of those two animals.
scope: An East African gnawing animal that looks unborn and lives in groups, neither a mole nor a rat,
  with a social order like honeybees and termites.
examples:
- The naked mole rat lives in groups and eats roots.
- A naked mole rat looks unborn but is neither a mole nor a rat.
