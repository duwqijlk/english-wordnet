simpleMeaning: a level piece of land made by earth dropped again and again by water that runs over it
scope: A level piece of land made by earth dropped again and again by running water; alluvial flat is
  another name for this sense, and it is not a hill and not land built up by wind.
examples:
- The alluvial plain spread out beside the river, flat and wide.
- Farmers plant rice on the alluvial plain the river made.
