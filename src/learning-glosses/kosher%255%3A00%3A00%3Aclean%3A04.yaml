simpleMeaning: following the Jewish rules about what food may be eaten and how it must be made
scope: This describes food, or the way food is made, when it follows Jewish food rules. It is not the
  noun sense, where the word names food that follows those rules.
examples:
- The shop sells kosher meat that follows the Jewish food rules.
- She keeps a kosher kitchen, so every dish made there follows the Jewish food rules.
