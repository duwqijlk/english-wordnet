simpleMeaning: The body parts and flesh that make sex cells, bring them to full growth, join them, and
  grow them into young.
scope: 'Also called genital system: the body parts and flesh that make sex cells, bring them to full growth,
  join them, and grow them into young; not the parts that take in food or move the body.'
examples:
- The reproductive system makes sex cells.
- Disease can harm the reproductive system.
