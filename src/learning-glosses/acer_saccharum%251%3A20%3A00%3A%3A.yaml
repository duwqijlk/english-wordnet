simpleMeaning: A maple of eastern and central North America, three-to-five-lobed leaves, hard close-grained
  wood much used for cabinets, especially curly-grained; sap, chief source of maple syrup and sugar; many
  kinds.
scope: Not a red maple or a silver maple, other maples; also called a rock maple and a sugar maple.
examples:
- Acer saccharum grows across the eastern woods.
- We tapped an Acer saccharum for syrup in March.
