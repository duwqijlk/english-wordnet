senseId: 'hypermenorrhea%1:22:00::'
synsetId: 13534743-n
simpleMeaning: Bleeding each month that is too heavy or goes on too long can point to growths in the womb,
  and can leave the blood weak if it lasts.
scope: It is the state of monthly bleeding that is too heavy or long, also called menorrhagia.
examples:
- Her hypermenorrhea lasted far too long each month.
- Her hypermenorrhea pointed to growths in the womb.
