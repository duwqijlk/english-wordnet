simpleMeaning: A tool of science, it draws a line without a break on paper held by a turning drum, as
  of breathing or blood pressure.
scope: Also called kymograph, it is a tool that draws a line on paper on a turning drum.
examples:
- The cymograph traced his breathing on the paper.
- A cymograph draws a line without a break as the drum turns.
