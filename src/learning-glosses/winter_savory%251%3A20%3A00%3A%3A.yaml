simpleMeaning: Pink or white flowers top this upright low woody plant of southern Europe, which lives
  year after year and has tough leaves that taste of thyme.
scope: This low woody plant of southern Europe has pink or white flowers and tough leaves that taste of
  thyme, and it is not a thyme plant itself.
examples:
- Winter savory has pink flowers and leaves that taste of thyme.
- Winter savory lives year after year and has tough leaves.
