simpleMeaning: The Mongolian People's Republic uses this speech as its official speech, and it is the
  speech of the people it is named for.
scope: This is the tongue of the Khalkha people and the official tongue of the Mongolian People's Republic;
  Kalka, Kalka language, Khalka, Khalkha and Khalkha language are other names for it, not the Khalkha
  people themselves.
examples:
- Khalka language is the official tongue of Mongolia.
- She speaks Khalka language with her family.
