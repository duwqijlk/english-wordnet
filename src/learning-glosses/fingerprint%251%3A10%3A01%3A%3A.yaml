simpleMeaning: a mark left by the raised lines on a finger, often used by police to tell who a person
  is when they look into a crime
scope: A mark from the lines on a finger, often used by police to tell who a person is; not a dirty mark
  left by a finger, not any sign that shows what something is, and not the act of taking such a mark.
examples:
- The police found a clear fingerprint on the glass.
- His fingerprint was used to prove he had been at the scene.
