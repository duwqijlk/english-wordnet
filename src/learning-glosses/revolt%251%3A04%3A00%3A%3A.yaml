simpleMeaning: A planned fight over who holds power, where a group works together to throw off those in
  charge
scope: A planned stand against those in charge, also called a rising, a rebellion, and an uprising; not
  the verb that makes someone feel disgust or that starts a revolution.
examples:
- The revolt against the king failed.
- A revolt broke out in the north.
