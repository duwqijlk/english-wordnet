simpleMeaning: A person whose job is to cut fine marks and shapes into costly gems
scope: This is a person whose job is to cut fine marks and shapes into costly gems, also called lapidary,
  not a jeweller who sets stones and not a miner.
examples:
- The lapidist cut the rough diamond into a bright stone.
- A lapidist engraved the seal on a piece of jade.
