simpleMeaning: A kind of word that can be who or what acts, what is acted on, come after words like 'to',
  or stand beside a word for the same thing
scope: This is a kind of word that can name who or what acts or what an action is done to; not an action
  word and not a describing word.
examples:
- In 'Cats sleep', the word 'cats' is a noun.
- In 'She gave the book to Ana', 'book' and 'Ana' are nouns.
