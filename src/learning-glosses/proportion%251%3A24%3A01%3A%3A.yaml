simpleMeaning: How things, or parts of things, stand to each other in size, amount, or degree
scope: How things, or parts of things, stand to each other in size, amount, or degree, not the number
  got by dividing a part by the whole and not a pleasing arrangement of parts in a design.
examples:
- The proportion of quotations in the book was far too large.
- A good sauce keeps the right proportion of cream to stock.
