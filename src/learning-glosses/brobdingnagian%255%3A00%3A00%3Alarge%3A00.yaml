simpleMeaning: Much bigger or more than usual, above all in how far it reaches or how much it covers
scope: 'Huge, vast and immense are other names for this sense: much bigger or more than usual, not a thing
  that comes from the imaginary land of Brobdingnag.'
examples:
- The Brobdingnagian pile of paperwork covered the whole desk.
- They faced a Brobdingnagian task that would take months to finish.
