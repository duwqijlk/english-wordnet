simpleMeaning: of a color at one end of the range of colors, next to orange, like the color of blood,
  tomatoes or rubies
scope: Also called red, scarlet, crimson, ruby, reddish and ruddy, this is a word for the color, not the
  tree with the small round fruit and not its wood.
examples:
- She wore a cherry dress to the party.
- He painted the door a bright cherry color.
