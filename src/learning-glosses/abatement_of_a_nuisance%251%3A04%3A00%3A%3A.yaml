senseId: 'abatement_of_a_nuisance%1:04:00::'
synsetId: 00362285-n
simpleMeaning: In law, the act of taking away, stopping or destroying something that has been found to
  harm or bother other people
scope: This is the legal act of ending a harmful bother, also called nuisance abatement; not the bother
  itself and not a fine.
examples:
- The city ordered the abatement of a nuisance after neighbours complained about the smell.
- The abatement of a nuisance put an end to the loud late-night parties.
