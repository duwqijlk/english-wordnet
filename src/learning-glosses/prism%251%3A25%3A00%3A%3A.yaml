senseId: 'prism%1:25:00::'
synsetId: 13907168-n
simpleMeaning: a solid shape whose two end faces have the same size and shape and never meet, and whose
  side faces are four-sided, with opposite sides that never meet
scope: This is a solid shape in maths with two matching end faces that never meet; not a glass or quartz
  tool of triangle shape used to bend a beam of light or turn a picture the other way.
examples:
- The solid was a prism with two triangle faces at its ends.
- In maths class we made a prism from card, with two same triangles at the ends.
