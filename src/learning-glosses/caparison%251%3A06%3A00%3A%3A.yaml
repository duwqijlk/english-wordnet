simpleMeaning: Horse gear made of a decorated cover, worn most of all in the past by a horse going to
  war.
scope: Also called housing or trapping; a decorated cover for a horse, most of all a warhorse in the past,
  not the act of putting such a cover on.
examples:
- The caparison covered the warhorse in bright cloth.
- A caparison hung over the horse for the parade.
