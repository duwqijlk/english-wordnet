simpleMeaning: a test of the age of once-living things, from the amount of a rare kind of atom in them,
  trusted back about 40,000 years
scope: A test of the age of once-living things, from the amount of a rare kind of atom in them, trusted
  back about 40,000 years; carbon dating and radiocarbon dating are other names for this sense, not a
  guess from style and not a test of rocks.
examples:
- Carbon-14 dating showed the bone was 5,000 years old.
- The lab used carbon-14 dating on the wooden tool.
