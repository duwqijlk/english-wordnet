simpleMeaning: a part that joins two pieces and lets one piece swing while the other piece stays in place
scope: A real part that lets a door or lid swing, not the key fact that later events depend on and not
  the act of fixing such a part in place.
examples:
- The door hangs on two strong hinges, so it swings open easily.
- One hinge on the box lid broke, so the lid would not stay up.
