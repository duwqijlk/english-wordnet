simpleMeaning: the power to choose and decide for yourself, and to mean to do what you choose
scope: 'Another name for will: the power to choose for yourself, not a paper that says who gets your things
  after you die and not the verb for what will happen later.'
examples:
- She left the job of her own volition.
- He acted by his own volition, not because anyone forced him.
