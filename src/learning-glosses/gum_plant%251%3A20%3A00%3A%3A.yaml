simpleMeaning: Often poisonous to farm animals, this is any of several western American plants of the
  Grindelia group, with leaves and stems full of sticky sap, once used as medicine.
scope: Also called gumweed, rosinweed, and tarweed, this is a sticky-sapped western American plant once
  used as medicine, not a gum tree.
examples:
- The gum plant by the fence had sticky leaves that caught the dust.
- Ranchers keep stock away from gum plant because it often poisons them.
