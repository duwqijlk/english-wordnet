simpleMeaning: Judged by setting one thing against another, rather than full or whole in itself
scope: Judged against something else, not in itself; relative is another name for this sense, not the
  form of a word like 'faster' and not a word about the study of likeness.
examples:
- He was a comparative stranger to the town, having only visited once before.
- The report gave a comparative view of the two schools, not an absolute one.
