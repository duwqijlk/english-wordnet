simpleMeaning: having to do with metallurgy, the work of getting hard stuff out of rock and shaping it
scope: Of the work of getting hard stuff from rock and shaping it; metallurgical is another name for this,
  not of digging rock out of the ground.
examples:
- He took a metallurgic course on getting hard stuff from rock.
- She studied metallurgic ways of shaping hard stuff.
