simpleMeaning: A hollow round case of cast iron, fixed to the wheel and forming part of what slows the
  car
scope: A hollow round case of cast iron, fixed to the wheel and forming part of what slows the car, also
  called a drum; not a flat plate and not the wheel itself.
examples:
- The brake drum was cracked and had to be replaced.
- Heat from the brake drum made the wheel too hot to touch.
