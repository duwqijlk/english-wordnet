senseId: 'plinian_eruption%1:11:00::'
synsetId: 07420252-n
simpleMeaning: A burst from a volcano in which a stream of gas and ash is thrown up with great force to
  a height of several miles.
scope: A burst from a volcano that throws gas and ash several miles high, not a slow flow of lava and
  not a small burst of steam.
examples:
- The Plinian eruption sent ash high into the sky.
- A Plinian eruption can bury towns under ash.
