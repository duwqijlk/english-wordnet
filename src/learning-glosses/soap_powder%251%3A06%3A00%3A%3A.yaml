simpleMeaning: cleaning stuff in the form of a fine dry dust, mixed with chemicals that help it clean
scope: Cleaning stuff in the form of a fine dry dust mixed with chemicals that help it clean, also called
  built-soap powder and washing powder; not a bar of soap and not plain soap flakes.
examples:
- She poured the soap powder into the washing machine.
- A box of soap powder stood on the shelf above the sink.
