simpleMeaning: the act of switching a system of counting or measuring over to tens
scope: The act of moving to a system based on tens, also called decimalisation; not a change of coins
  only, and not a change of language.
examples:
- The decimalization of British currency took place in 1971.
- Decimalization of the coinage ended the old pounds and shillings.
