simpleMeaning: A Chadic tongue spoken south of Lake Chad, notably in North Region, Mayo-Louti division,
  Mayo-Oulo and Guider subdivisions northwest of Guider, Far North Region, Mayo-Tsanaga division, Hina
  and Bourrah subdivisions.
scope: Also called Daba, Daba language, Kola, Kola language and Musgoi language; one Chadic tongue among
  many, spoken south of Lake Chad in the places named in its gloss.
examples:
- Musgoi is spoken south of Lake Chad.
- The children speak Musgoi at home.
