simpleMeaning: with no backbone or line of bones down the back
scope: 'Also called spineless: describes an animal that has no backbone; not the noun that names the animal
  itself.'
examples:
- Worms are invertebrate animals with soft bodies and no backbone.
- The invertebrate sea animal has no bones down its back at all.
