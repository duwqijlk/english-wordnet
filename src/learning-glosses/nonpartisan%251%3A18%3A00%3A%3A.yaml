simpleMeaning: a person who does not support or belong to any one political party or group
scope: This is the person who does not side with any party or group, not a strong supporter of one party
  and not the describing word for such a person.
examples:
- As a nonpartisan, he refused to join any political party.
- The committee chose a nonpartisan to lead the count of the votes.
