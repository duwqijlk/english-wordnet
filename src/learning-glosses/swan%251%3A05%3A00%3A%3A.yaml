simpleMeaning: a large, heavy bird that lives on water and looks grand, with a very long neck and, as
  an adult, usually white feathers
scope: A large water bird with a very long neck; not the verb uses of swan, to say in a formal way that
  something is true, or to move about with no fixed place to go to.
examples:
- A white swan swam slowly across the lake.
- Two swans were feeding near the edge of the river.
