simpleMeaning: Wild or mean acts that make others uneasy or annoyed.
scope: 'Also called mischief, shenanigan, devilry, devilment, roguery, roguishness, deviltry, and mischief-making:
  wild or mean acts that make others uneasy or annoyed, not harmless play and not a single rude word.'
examples:
- Her mischievousness showed in every prank.
- Mischievousness can turn mean if no one stops it.
