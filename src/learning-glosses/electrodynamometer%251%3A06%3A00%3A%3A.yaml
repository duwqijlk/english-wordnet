simpleMeaning: To measure the flow of power, its pressure, or the power itself, this tool uses the pull
  between the magnetic fields of two coils.
scope: This is a measuring tool for flow, pressure, or power, and it works by the pull between the magnetic
  fields of two coils.
examples:
- An electrodynamometer showed the power in the circuit.
- The electrodynamometer showed the voltage of the circuit.
