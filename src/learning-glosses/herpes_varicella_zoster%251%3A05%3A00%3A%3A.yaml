simpleMeaning: A virus that causes chickenpox and the painful skin rash called shingles.
scope: A virus that causes chickenpox and shingles; herpes varicella zoster virus is another name for
  this sense, and this is not a virus that causes only one of the two sicknesses.
examples:
- Herpes varicella zoster causes chickenpox in children and shingles in adults.
- The doctor said herpes varicella zoster was behind her shingles.
