simpleMeaning: 'In geometry, a number for the shape of a curve made by cutting a cone: the distance between
  two fixed points, divided by the length of the longest line across'
scope: In geometry, this number shows the shape of a curve made by cutting a cone; it is not about a circle
  having a different centre or moving away from a round path.
examples:
- A circle is an ellipse with zero eccentricity.
- With higher eccentricity, the curve becomes less round and more stretched.
