simpleMeaning: the pink or white meat of a large fish from the Pacific
scope: 'Also called chinook and king salmon: the meat of a large Pacific fish, not the live fish itself
  and not another kind of salmon.'
examples:
- The chinook salmon on the plate had pink flesh.
- We grilled the chinook salmon until the white flesh was firm.
