simpleMeaning: A member of a group set up in Ireland in 1795 to stand up for Protestantism and the British
  king or queen
scope: This is a member of the group set up in Ireland in 1795 to stand up for Protestantism and the British
  king or queen; a member of another group set up for other beliefs is a different sense.
examples:
- The Orangeman marched with his lodge on the twelfth of July.
- An Orangeman in 1795 would have sworn to uphold the British sovereign.
