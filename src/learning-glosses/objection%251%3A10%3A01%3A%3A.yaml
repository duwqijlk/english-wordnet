simpleMeaning: the act of saying in earnest that you are against a thing
scope: The act of saying in earnest that you are against a thing, not a step in a trial, not a public
  planned show of not agreeing, and not the mere speech act of saying so.
examples:
- She raised an objection to the plan at the meeting.
- His objection was that the cost was too high.
