senseId: 'burglary%1:04:00::'
synsetId: 00786699-n
simpleMeaning: going into a building without the right to do so, with the plan to do a serious crime or
  to steal things of value
scope: This is going into a building in order to steal or do another serious crime. It is not just stealing,
  and it is not breaking things in a building you are allowed to be in.
examples:
- The police charged him with burglary after he broke into the house to steal.
- There was a burglary at the shop last night, and money was taken.
