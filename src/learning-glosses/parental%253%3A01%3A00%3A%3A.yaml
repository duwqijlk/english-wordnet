simpleMeaning: In biology, naming the group of living things from which young that are a mix of two different
  kinds come
scope: In biology, naming the group of living things that mixed young come from; not the everyday sense
  of to do with a mother or father.
examples:
- The parental generation was crossed to produce the new plants.
- Scientists compared the parental lines with the young plants they produced.
