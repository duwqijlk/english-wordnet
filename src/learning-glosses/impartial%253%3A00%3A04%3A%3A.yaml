simpleMeaning: treating all people and views in a fair way, with no opinion already formed before the
  facts are known
scope: Fair to all sides, with no choice made before the facts are seen; not taking one side and not judging
  from old ideas alone.
examples:
- A judge must be impartial and listen to both sides.
- She gave an impartial view of the facts, with no favour to either side.
