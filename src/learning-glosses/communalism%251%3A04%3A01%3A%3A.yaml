senseId: 'communalism%1:04:01::'
synsetId: 01042975-n
simpleMeaning: staying true to the good of your own small group of people or your own ethnic group rather
  than to the good of all people
scope: This is loyalty to your own small group, or your own ethnic group, before the whole of society;
  not loyalty to the whole country or to all people.
examples:
- His communalism kept him fighting for his own group first.
- Communalism can split a town when each group looks after itself.
