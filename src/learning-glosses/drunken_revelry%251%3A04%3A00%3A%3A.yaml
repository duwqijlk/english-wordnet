simpleMeaning: drinking far too much and having sex with many different people at a wild gathering
scope: 'Also called a riot, debauchery, an orgy, a debauch, saturnalia, a bacchanal or bacchanalia: a
  wild party with far too much drink and loose sex, not a quiet drink with friends.'
examples:
- The drunken revelry lasted until dawn.
- Their drunken revelry shocked the whole town.
