simpleMeaning: a white powder of tiny clear crystals, an oxide — a thing made when a metal joins with
  oxygen — used to make a white paste for building
scope: A white powder of tiny clear crystals used to make a white building paste, not the powder made
  by heating stone and not the green fruit.
examples:
- The factory used lime to make the building paste.
- Lime from the kiln was ground into a fine powder.
