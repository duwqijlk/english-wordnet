simpleMeaning: a very small bloom, most of all one that is part of a big bloom made of many small blooms
scope: 'Also called a floret: a very small bloom, most of all one that is part of a big bloom made of
  many small blooms, not a full-size bloom on its own.'
examples:
- Each floweret in the daisy adds a touch of yellow.
- The floweret is too small to see clearly without a lens.
