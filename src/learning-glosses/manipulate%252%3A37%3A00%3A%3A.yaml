simpleMeaning: to keep influence over other people or over yourself in a skillful way, usually to your
  own advantage
scope: Also called control; this is keeping influence over people or yourself in a skillful way, usually
  to your own advantage, not working on the body with the hands and not changing something in a dishonest
  way.
examples:
- He manipulates his friends by making them feel guilty.
- She can manipulate a crowd with a good speech.
