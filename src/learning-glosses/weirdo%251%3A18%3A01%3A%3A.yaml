simpleMeaning: A person who is strange and odd in a way that others find nasty.
scope: A person strangely odd in a nasty way, and creep and spook are other names for this sense; not
  just someone with odd tastes.
examples:
- They called him a weirdo because he dressed in odd clothes and said strange things to strangers.
- A weirdo in a long coat stood watching the house.
