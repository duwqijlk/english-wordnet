senseId: 'short-circuit%2:36:00::'
synsetId: 01621903-v
simpleMeaning: To make power flow along the wrong path inside a device, so the device stops or its fuse
  blows
scope: Also called short; this is about power going the wrong way inside a device, not about switching
  it off in the normal way and not about breaking it by dropping it.
examples:
- A frayed wire can short-circuit the lamp.
- Water got in and short-circuited the radio.
