simpleMeaning: A broad-leaved Asian bush that keeps its leaves all year, with shiny leaves and hanging
  bunches of white flowers
scope: Also called andromeda, lily-of-the-valley tree and Japanese andromeda, this is a broad-leaved Asian
  bush with hanging white flower bunches, not a tree and not a rose.
examples:
- The Pieris japonica was covered in white flowers.
- She planted a Pieris japonica by the wall.
