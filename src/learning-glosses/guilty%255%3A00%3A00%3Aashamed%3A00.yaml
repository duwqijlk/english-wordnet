simpleMeaning: showing that you feel bad and ashamed for doing something wrong
scope: This sense is about the look or way of a person who feels ashamed for doing wrong. It is not a
  court saying that a person broke the law.
examples:
- He gave me a guilty look after breaking the cup.
- She had a guilty smile when she hid the letter.
