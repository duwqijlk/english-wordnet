simpleMeaning: having no clever ideas and no power to think of new things
scope: Not clever and with no new ideas, also called pedestrian, prosaic and prosy; not the sense of being
  kept on the earth and unable to leave it.
examples:
- The story was earthbound and dull, with no new ideas at all.
- His earthbound writing never surprised the reader.
