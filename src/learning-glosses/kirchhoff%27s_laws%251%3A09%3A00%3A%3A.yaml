simpleMeaning: 'In physics, two rules for electric circuits with steady currents: at any point the currents
  add to zero, and round any closed loop voltage gains and drops add to zero.'
scope: Two rules about currents and voltages in electric circuits, not a rule about heat in wires and
  not a rule about magnets.
examples:
- Kirchhoff's laws say that the currents meeting at one point add up to zero.
- We used Kirchhoff's laws to work out the voltages round the loop.
