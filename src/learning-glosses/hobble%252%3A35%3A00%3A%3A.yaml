simpleMeaning: to tie the front and back legs together on each side of a horse, so the legs on one side
  move together
scope: To tie a horse's legs together on each side so they move together, not the uneven walk that comes
  from a hurt leg.
examples:
- They hobbled the horses before nightfall.
- The groom hobbled the race horses in the field.
