simpleMeaning: A long narrow boat in Venice is pushed along the water by this man
scope: A man in Venice who moves a long narrow boat, also called gondolier, not a man who rows a boat
  for sport and not a sailor on a big ship.
examples:
- The gondoliere sang as he steered the boat through the canal.
- We hired a gondoliere to take us across the lagoon.
