simpleMeaning: In biology, a group for sorting living things, between a genus, a small group of kinds
  that look alike, and a subfamily, a larger group
scope: In biology, a group for sorting living things, between a genus and a subfamily, not a group of
  peoples joined under one rule.
examples:
- The tribe sits between a genus and a subfamily in the books.
- Scientists put these small birds in the same tribe.
