simpleMeaning: East Indian plant, sparsely prickly, a one-year herb or long-lived bush, widely grown for
  fleshy flower cups used in tarts and jelly and for stem fibre.
scope: 'Also called sorrel, red sorrel, roselle, rozelle, or Hibiscus sabdariffa: an East Indian plant
  grown for its flower cups, not a rose bush and not a tea plant.'
examples:
- The Jamaica sorrel gives flower cups for jelly.
- We grow Jamaica sorrel for its stem fibre.
