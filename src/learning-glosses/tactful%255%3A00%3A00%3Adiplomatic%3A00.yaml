simpleMeaning: skilled and careful in dealing with people, kind in a way that does not hurt their feelings
scope: Dealing with people with skill and care so as not to hurt them; not blunt speech, and not simply
  knowing what is fitting.
examples:
- By tactful conduct he avoided making anyone angry.
- She found a tactful way to tell him the truth.
