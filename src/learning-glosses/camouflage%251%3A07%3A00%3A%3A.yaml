senseId: 'camouflage%1:07:00::'
synsetId: 04686431-n
simpleMeaning: How a thing looks on the outside when that look hides what the thing is really like
scope: 'Also called disguise: an outward look that makes a thing seem other than it really is, not the
  act of hiding and not a thing or plan used to hide something.'
examples:
- His friendly smile was camouflage for the anger he really felt.
- The shop's bright, busy front was camouflage for the empty rooms behind it.
