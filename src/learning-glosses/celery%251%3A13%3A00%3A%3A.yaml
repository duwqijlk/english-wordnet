simpleMeaning: the stems of a plant, eaten raw or cooked, or used to give food extra taste
scope: This sense is the stems as food, eaten raw or cooked or used for taste; it is not the plant as
  a whole growing in the ground.
examples:
- She cut the celery into small pieces for the soup.
- He ate celery with a little salt.
