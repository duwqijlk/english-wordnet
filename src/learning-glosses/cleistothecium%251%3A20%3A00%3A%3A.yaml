simpleMeaning: Spores stay shut inside this case on some fungi, above all the families Aspergillaceae
  and Erysiphaceae, until it rots or falls apart and lets them out
scope: Also called cleistocarp, this is a shut case on some fungi whose spores come out only when it rots
  or falls apart, not a case that opens to shed its spores.
examples:
- The cleistothecium keeps its spores shut inside until it rots.
- A cleistothecium lets its spores out only when it falls apart.
