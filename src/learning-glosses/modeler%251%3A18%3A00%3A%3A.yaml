simpleMeaning: a person who makes a thing that shows the shape, look or workings of something else
scope: This is the person who makes models, not a person who poses for artists or wears new clothes to
  show them, and not the model itself.
examples:
- The modeler built a small wooden copy of the bridge for the town hall.
- A modeler on the film made tiny houses for the street scenes.
