simpleMeaning: Never used with a word like 'not', it marks a thing as special and standing out
scope: 'Also called quite and quite a: it marks a thing as special or surprising, not the plain word quite
  meaning very or fully.'
examples:
- We've had quite an afternoon, full of surprises.
- It was quite an honour to meet her.
