simpleMeaning: a copy of a person or a thing made much smaller than the real one
scope: A copy made much smaller than the real person or thing, not a copy that does not work, not a small
  pet dog, and not to play with a thing or an idea.
examples:
- He kept a toy soldier on his desk.
- The museum sold a toy model of the old train.
