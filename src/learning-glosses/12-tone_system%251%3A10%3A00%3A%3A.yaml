simpleMeaning: A method of serial composition credited to Arnold Schoenberg, in which the twelve chromatic
  notes are set in a fixed sequence, also used in inverted or reversed forms.
scope: This is the system or method itself, not the tone row, the fixed sequence of notes it is built
  on, and not serial music at large. It is a technical term in music theory. '12-tone music' names the
  same thing.
examples:
- Composers who adopted the 12-tone system often quarrelled about how strictly to follow it.
- The textbook introduces the 12-tone system before discussing later serial techniques.
