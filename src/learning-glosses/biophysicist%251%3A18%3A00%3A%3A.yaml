simpleMeaning: a scientist who uses the study of matter, energy, and forces to learn about living things
scope: A scientist who uses the study of matter, energy, and forces to learn about living things, not
  a scientist who studies living things without that study and not one who studies matter and energy alone.
examples:
- The biophysicist studies how living cells use energy.
- As a biophysicist, she uses the study of matter to learn how muscles work.
