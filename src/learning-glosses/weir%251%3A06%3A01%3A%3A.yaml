simpleMeaning: A fence of woven branches set across a stream to trap fish.
scope: A fish-catching fence of woven branches, not the low dam that controls a river's height.
examples:
- Villagers set a weir of woven branches across the creek to catch eels.
- The old weir held the fish in the shallows until morning.
