simpleMeaning: a group of cut grain bundles or maize stalks set upright in a field to dry.
scope: The farm sense — cut grain stood in bundles to dry — not a thick mass of hair, a sudden blow, or
  a feeling of distress.
examples:
- The farmer left the wheat in shocks until it dried.
- Rows of corn shocks stood across the field.
