simpleMeaning: The front and side walls of the belly are made by a flat band of flesh whose threads run
  across.
scope: Transversus abdominis muscle, transverse muscle of abdomen, and musculus transversalis abdominis
  are other names for this flat band of flesh in the belly.
examples:
- The transversus abdominis runs across the front of the belly.
- The transversus abdominis forms the side wall of the belly.
