senseId: 'spinal_anesthesia%1:26:00::'
synsetId: 14052887-n
simpleMeaning: A loss of feeling below the waist, from a hurt cord of the spine or a numbing drug beneath
  the web-like skin that wraps the cord of the spine.
scope: This sense is also called spinal anaesthesia.
examples:
- Spinal anesthesia took away feeling in the lower half.
- A spinal anesthesia came from a numbing drug.
