simpleMeaning: Touching a thing held to have magic power, or one part of the body other than the sex organs,
  brings sexual excitement or pleasure
scope: This is also called fetishism, and it differs from the worship of a fetish by being about sexual
  excitement, not belief.
examples:
- His fetichism centred on touching one small thing.
- Her fetichism showed in the pleasure she got from touching one part of the body.
