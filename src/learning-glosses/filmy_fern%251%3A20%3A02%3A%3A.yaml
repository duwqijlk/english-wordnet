simpleMeaning: Any fern of the genus Trichomanes with big feather-cut, often see-through, fronds, mostly
  growing on tree limbs and twigs or on mossy banks on the ground.
scope: This sense is any fern of the genus Trichomanes with big feather-cut, often see-through, fronds,
  mostly growing on tree limbs and twigs or on mossy banks on the ground, also called bristle fern, unlike
  the sense for any fern of the genus Hymenophyllum growing in tropical humid regions and having translucent
  leaves.
examples:
- The filmy fern grows on tree limbs.
- Filmy ferns bear see-through fronds.
