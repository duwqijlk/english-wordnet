simpleMeaning: With leaves cut into fine parts and showy blooms of more than one colour, this plant belongs
  to the group called Schizanthus.
scope: A butterfly flower and schizanthus are other names for this plant, which sits in the group called
  Schizanthus and not among true orchids.
examples:
- The poor man's orchid opened its showy blooms.
- The poor man's orchid was full of showy blooms.
