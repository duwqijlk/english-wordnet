simpleMeaning: to make someone bad in their morals, by leading them to drink too much or to too much sex
scope: 'This sense is also called corrupt, pervert, profane, demoralize, subvert, debase, misdirect, debauch,
  demoralise, and vitiate: making a person bad in their morals, not spoiling a thing or making it dirty.'
examples:
- Wine and wild parties depraved him over the years.
- The leader was accused of depraving young men with drink.
