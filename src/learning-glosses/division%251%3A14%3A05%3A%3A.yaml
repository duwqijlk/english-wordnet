simpleMeaning: In biology, one of the broad groups into which living things are sorted.
scope: A grouping of living things within a biological classification; it is not a unit of plants in botany,
  not the arithmetic calculation, and not the act of separating something by a boundary.
examples:
- Ferns and mosses belong to different divisions.
- The old classification put both groups in the same division.
