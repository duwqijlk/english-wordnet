simpleMeaning: A service member who is killed or injured in battle.
scope: This is a military casualty from combat, not a cut or break in living tissue, the act of causing
  such harm, or an emotional hurt; injury is another name for this sense.
examples:
- The regiment's wounds from the battle were listed beside its deaths.
- The battalion's wounds outnumbered its dead.
