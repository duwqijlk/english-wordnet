simpleMeaning: A United States dollar kept in a bank in Europe and used across the world to pay for trade.
scope: This is a United States dollar held in a bank in Europe for trade between countries, not the money
  of Europe itself or a dollar kept in the United States.
examples:
- The bank held eurodollars to pay for trade.
- Eurodollars are used across the world to finance trade.
