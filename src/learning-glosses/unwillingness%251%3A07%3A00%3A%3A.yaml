simpleMeaning: the way a person is when they do not want to do something
scope: 'A lasting part of how a person is: they do not want to do a thing. Not a single act of saying
  no, and not being unable to do it.'
examples:
- Her unwillingness to share made the work slow.
- His unwillingness to listen caused many problems.
