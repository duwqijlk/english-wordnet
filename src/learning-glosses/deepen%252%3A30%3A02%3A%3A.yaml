senseId: 'deepen%2:30:02::'
synsetId: 00552287-v
simpleMeaning: to become lower in sound, as a voice does
scope: This sense is about a voice or sound becoming lower on its own; it is not about making a feeling
  stronger, and not about making something like a lake go down farther.
examples:
- His voice deepened as he grew older.
- Her voice deepened when she spoke in a whisper.
