simpleMeaning: 'Of a speech sound: not the beat-bearing core of a syllable, but a consonant riding with
  a vowel or a weaker vowel next to a stronger one.'
scope: A sound that leans on a stronger sound in the same syllable, including the weaker half of a gliding
  vowel pair; not the near-twin sense for sounds that can never form a beat on their own, and not a spelling
  label.
examples:
- 'In a falling diphthong, the second vowel is nonsyllabic: it is heard, but the first vowel carries the
  beat.'
- The p and l sounds at the start of 'play' are nonsyllabic, because the vowel after them carries the
  beat.
