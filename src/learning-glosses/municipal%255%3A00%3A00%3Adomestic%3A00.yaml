simpleMeaning: about or to do with the way a town or city is run by its own local leaders
scope: This sense is about the leaders who run a town or city and how they run it, not just belonging
  to a town or city or being part of it.
examples:
- The municipal government passed a new rule for local buses.
- She works in the municipal office that runs city services.
