simpleMeaning: A flat, four-sided column that usually sticks out from a wall by about a third of its width.
scope: A flat column sticking out a little from a wall, not a free-standing round column.
examples:
- A pilaster stood out from the wall beside the front door.
- The builder added pilasters to the plain wall to break up its flat face.
