simpleMeaning: The top layer of ground, made of grass and its roots held tightly together
scope: This is the top layer of grassy ground, also called sod, turf, and greensward; it is the layer
  itself, not loose grass cut from it.
examples:
- The green sward covered the hill.
- Cows stood on the soft sward near the river.
