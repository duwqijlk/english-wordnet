simpleMeaning: to lift your shoulders to show that you do not care or that you accept something you cannot
  change
scope: This is the act of lifting your shoulders to show you do not care, not the noun name for that shoulder
  movement.
examples:
- She just shrugged when he blamed her; she did not care at all.
- She shrugged and accepted that the last train had already gone.
