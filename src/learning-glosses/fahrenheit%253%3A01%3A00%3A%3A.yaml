simpleMeaning: For a scale that marks how hot or cold a thing is, first put forward by the man who made
  the mercury thermometer
scope: A scale for heat first put forward by the man who made the mercury thermometer; the other scale
  most people know is Celsius.
examples:
- Water freezes at 32 degrees Fahrenheit under normal conditions.
- The oven was set to 350 degrees Fahrenheit.
