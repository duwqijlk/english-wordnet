simpleMeaning: a common fern of the cool north that grows on rocks, with rusty-brown stalks and long,
  narrow, feather-like leaves
scope: Also called oblong woodsia and rusty woodsia, this common fern grows on rocks in the cool north,
  not a fern of damp woods.
examples:
- The fragrant woodsia clung to the rocks on the north slope.
- We found a fragrant woodsia growing between the stones.
