simpleMeaning: when a company gives out more shares, so each owner holds more shares, but the total worth
  of what the owners hold stays the same
scope: 'Also called a split or a stock split: when a company gives out more shares without changing what
  the owners own in total, not a sale of new shares to the public and not a fall in the share price.'
examples:
- The company announced a two-for-one split up of its shares.
- After the split up, each owner held twice as many shares.
