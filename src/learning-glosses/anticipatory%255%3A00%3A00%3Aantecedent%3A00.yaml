senseId: anticipatory%5:00:00:antecedent:00
synsetId: 00123055-s
simpleMeaning: done or felt before a thing happens, because you expect it to happen
scope: This is about a feeling or act that comes before an event you expect; not about the event itself
  and not about looking back after it.
examples:
- She gave an anticipatory smile before the guests arrived.
- He took anticipatory steps to get ready for the cold weather.
