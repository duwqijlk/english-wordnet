simpleMeaning: The breaking apart of tiny bits caused by rays given off by atoms
scope: The breaking apart of tiny bits caused by rays given off by atoms, not a breaking apart caused
  by heat or by a chemical.
examples:
- Radiolysis broke the water into tiny bits when the rays hit it.
- The scientists studied radiolysis to see how rays break apart tiny bits of matter.
