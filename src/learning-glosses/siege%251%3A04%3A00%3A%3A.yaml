simpleMeaning: the action of soldiers who surround a place made strong against attack, cut it off from
  help, and keep attacking it
scope: This is the long action of surrounding a place made strong against attack and cutting it off, not
  a single attack on an open field.
examples:
- The city was under siege for months, with soldiers all around its walls.
- During the siege, no food could be brought into the town.
