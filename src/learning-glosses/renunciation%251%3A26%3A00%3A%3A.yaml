senseId: 'renunciation%1:26:00::'
synsetId: 14436815-n
simpleMeaning: Having turned away from one's faith for a party or a cause, often to take up beliefs or
  causes that stand against it.
scope: Having turned away from one's faith for a party or a cause, often to take up beliefs or causes
  that stand against it, also called defection or apostasy; not the act of giving up a thing one owns,
  a right, a title, or a special favour, not saying in words or in writing that a thing is given up or
  is not one's own, and not calling a thing not true or not one's own.
examples:
- His renunciation of the church for the party surprised his family.
- 'Her renunciation was plain: she had left her old faith behind.'
