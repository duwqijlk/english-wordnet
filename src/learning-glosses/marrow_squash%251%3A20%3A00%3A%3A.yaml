simpleMeaning: any of several plants grown for their long fruit, which has smooth dark green skin and
  whitish flesh inside
scope: Any of several plants grown for their long fruit; marrow and vegetable marrow are other names for
  this sense, not a plant grown for its leaves and not a small round fruit.
examples:
- Marrow squash grows well in the summer garden.
- We picked a marrow squash with dark green skin.
