simpleMeaning: a kind of comedy where cause and effect are broken on purpose, and people and things act
  in ways that are plainly senseless
scope: 'Also called absurdist humor, surreal humor, and surreal humour: comedy built on broken cause and
  effect, not ordinary jokes or satire.'
examples:
- The film is full of absurdist humour, with doors that lead nowhere.
- She loves absurdist humour that breaks every rule of logic.
