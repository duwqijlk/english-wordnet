simpleMeaning: a bookkeeper who has passed tests and met all the legal and license rules of a United States
  state to be licensed by that state
scope: A bookkeeper who has passed tests and met all the legal and license rules of a United States state
  to be licensed by that state, not any bookkeeper and not a lawyer.
examples:
- The certified public accountant prepared our tax return.
- She hired a certified public accountant to check the company's books.
