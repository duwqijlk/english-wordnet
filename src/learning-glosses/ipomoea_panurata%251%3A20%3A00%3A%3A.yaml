simpleMeaning: A low or climbing plant of tropical America with soft stems, living many years, with a
  huge starchy root; sometimes thought to be where the sweet potato came from.
scope: 'Also called man-of-the-earth, manroot, scammonyroot, wild potato vine, wild sweet potato vine
  and Ipomoea fastigiata: a low or climbing plant of tropical America, living many years, with a huge
  starchy root, sometimes thought to be where the sweet potato came from; other low plants of tropical
  America have small roots or no link to the sweet potato.'
examples:
- Ipomoea panurata grows low or climbs with a huge starchy root.
- Some say Ipomoea panurata is where the sweet potato came from.
