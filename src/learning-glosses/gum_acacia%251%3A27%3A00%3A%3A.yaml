simpleMeaning: A sticky substance from an acacia tree, used to make food and medicines thicker, most of
  all in sweets and medicines.
scope: This sticky substance from an acacia tree thickens food and medicines; gum arabic is another name
  for it, not a sweet-smelling resin burned as incense and not a substance used to tan leather.
examples:
- The cook stirred gum acacia into the sweets to thicken them.
- The maker added gum acacia to the medicine to make it thicker.
