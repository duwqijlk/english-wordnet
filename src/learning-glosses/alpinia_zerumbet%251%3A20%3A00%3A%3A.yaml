simpleMeaning: A plant grown for its shiny oblong leaves and arching groups of white flowers with pink
  shading and crinkled yellow lips with mixed magenta stripes.
scope: Not common ginger or turmeric, other gingers; also called a shall-flower, shell ginger, a shellflower,
  Alpinia speciosa, and Languas speciosa.
examples:
- Alpinia zerumbet blooms white in the shade garden.
- The Alpinia zerumbet by the door has pink-shaded flowers.
