simpleMeaning: the making of sugars from carbon dioxide and water, found only in some bacteria and fungi
scope: The making of sugars from carbon dioxide and water, found only in some bacteria and fungi; not
  the making of food by green leaves in sunlight and not the breaking down of food.
examples:
- Chemosynthesis lets deep-sea bacteria make food without light.
- Some fungi live by chemosynthesis.
