simpleMeaning: the act of carrying out a plan or an order so that a goal is reached
scope: Doing a plan or an order to reach a goal. Not signing a paper in law, not a court order, and not
  doing something well with skill and knowledge.
examples:
- The execution of the plan took three months of hard work.
- Careful execution of the order saved time and money.
