simpleMeaning: A big sea fish of northern shores that people eat, kin to the cod.
scope: A big northern sea fish, kin to cod, not the freshwater cod-like fish and not the flesh of the
  fish.
examples:
- Fishermen caught cusk off the northern coast.
- Cusk is a firm white fish, good for the table.
