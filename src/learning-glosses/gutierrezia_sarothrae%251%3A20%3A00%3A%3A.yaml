simpleMeaning: A low sticky half-shrub of the southwest United States, with thin straight leaves on many
  thin stems and hundreds of tiny yellow flower heads.
scope: 'Also called broom snakeroot, broom snakeweed, rabbit-weed, rabbitweed, snakeweed and turpentine
  weed: a low sticky half-shrub of the southwest United States, with thin straight leaves and hundreds
  of tiny yellow flower heads; other low shrubs of the region have fewer or larger flowers.'
examples:
- Gutierrezia sarothrae covers the dry ground with tiny yellow flower heads.
- The sticky stems of Gutierrezia sarothrae catch dust in the wind.
