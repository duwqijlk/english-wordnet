schema: oewn-learning-gloss-v2
senseId: 'participant_role%1:10:00::'
synsetId: 06342796-n
simpleMeaning: In grammar, the link between a part of a sentence and the main doing word in that sentence
scope: In grammar, the link between a part of a sentence and its main doing word, not the doing word itself;
  semantic role is another name for this sense.
examples:
- In that sentence the participant role of 'the dog' is the one doing the action.
- In 'Mary gave John a book', 'John' has the participant role of the one who gets the book.
