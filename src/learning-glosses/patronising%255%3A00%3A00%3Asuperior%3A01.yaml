senseId: patronising%5:00:00:superior:01
synsetId: 02346987-s
simpleMeaning: Treating other people as if they were beneath you, as if you knew better than them.
scope: Of behaviour that talks down to others, also called arch, condescending, or patronizing; not merely
  proud or cold.
examples:
- His patronising tone made the younger staff bristle.
- She gave a patronising smile and patted his arm.
