simpleMeaning: going in the same direction as the hands of a clock turn
scope: This describes a turn or movement that goes the way the hands of a clock go; it does not tell how
  an action is done, which is the adverb use.
examples:
- The dancers took a clockwise turn around the hall.
- The machine has a slow clockwise spin.
