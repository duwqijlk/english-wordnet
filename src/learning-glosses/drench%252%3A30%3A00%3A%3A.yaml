simpleMeaning: to put liquid all over a thing, or to pour liquid onto it
scope: To put liquid all over a thing, or to pour liquid onto it; also called soak, and douse is another
  name for this sense; not to put a thing deep under water.
examples:
- He drenched his hot face with water.
- Rain drenched the washing on the line.
