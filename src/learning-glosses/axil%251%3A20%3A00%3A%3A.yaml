simpleMeaning: The top corner where a side shoot, such as a branch or leaf stalk, joins the main stem
scope: This is the top corner where a side shoot, such as a branch or leaf stalk, joins the main stem,
  not the tip of a shoot and not the join between two branches.
examples:
- The new shoot grows from the axil where the leaf joins the stem.
- Leaves sprout from the axil of the plant.
