simpleMeaning: made of very tiny bits of solid or liquid spread through the air or a gas, so small they
  cannot be seen
scope: Something made of tiny solid or liquid bits floating in air or gas; aerosolized is another name
  for this, not a gas on its own and not a liquid poured out.
examples:
- The aerosolised spray filled the room with tiny drops.
- Doctors give some drugs in aerosolised form.
