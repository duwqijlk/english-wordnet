simpleMeaning: an Indian shrub that stays green all year, with bright yellow flowers; its bark is used
  to tan leather, and it is sometimes put in the group Cassia
scope: 'Also called tanner''s cassia: an evergreen Indian shrub with bright yellow flowers, not a tree
  grown for timber.'
examples:
- The avaram stays green all year and bears bright yellow flowers.
- Tanners strip bark from the avaram to tan leather.
