simpleMeaning: very bad and likely to cause great harm, so that people feel afraid or worried.
scope: It is not about someone who is not joking and not about something merely important; it describes
  a harmful or dangerous situation.
examples:
- The accident caused serious injuries to both drivers.
- Doctors say her condition is serious and she must stay in hospital.
