simpleMeaning: Giving seeds and a sticky sap that oozes out, this large pine of Europe has needles in
  groups of five.
scope: Also called arolla pine, a large pine of Europe with needles in groups of five; not the seeds it
  gives, and not a pine of other lands.
examples:
- The cembra nut tree gives seeds and a sticky sap that oozes out.
- Cembra nut trees have needles in groups of five.
