simpleMeaning: A substance added to laundry or hair to make it whiter or lend it a faint sky-colored tint.
scope: This is the whitening product, not the color itself, the drug, the butterfly, or noble rank.
examples:
- She added a little blue to the rinse water to brighten the sheets.
- Laundry blue was once a staple of every household wash day.
