simpleMeaning: From the bony point of the lower jaw this muscle runs up to the hollow at the side of the
  head, pulling the jaw up to shut the mouth.
scope: 'Also called musculus temporalis, temporal muscle, and temporalis muscle: the muscle that lifts
  the lower jaw to shut the mouth, running from the hollow at the side of the head to the bony point of
  the lower jaw.'
examples:
- The temporalis works hard when you chew tough meat.
- Doctors test the temporalis by asking you to clench your teeth.
