simpleMeaning: Bigger than the eastern kingbird it looks like, this kingbird raises its young in the south-east
  of the United States and spends the cold months in warm America.
scope: This kingbird, also called the gray kingbird and the grey kingbird, is bigger than the eastern
  kingbird that it looks like.
examples:
- A petchary raised its young in the south-east of the United States.
- The petchary winters in warm America.
