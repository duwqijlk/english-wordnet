simpleMeaning: the hard covering that holds the inner part of a nut
scope: The hard covering around a nut, not the soft inner part inside it and not the short way of saying
  something in a few words.
examples:
- He broke open the nutshell with a small hammer.
- The squirrel dropped an empty nutshell on the path.
