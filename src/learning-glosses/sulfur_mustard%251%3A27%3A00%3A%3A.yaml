simpleMeaning: Made with sulfide stuff, this poison war gas lifts blisters on the skin and harms the eyes
  and lungs, and no cure for it is known.
scope: Blistering agent, dichloroethyl sulfide, mustard agent, and mustard gas are other names for this
  poison war gas, made with sulfide stuff, for which no cure is known.
examples:
- Soldiers feared sulfur mustard in the war.
- The skin showed blisters where sulfur mustard had touched it.
