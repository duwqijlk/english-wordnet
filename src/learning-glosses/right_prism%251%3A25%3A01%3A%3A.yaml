simpleMeaning: a solid shape with two flat ends of the same size, joined by flat four-sided shapes that
  meet the ends at square corners
scope: A solid shape with two same-size flat ends and square-cornered sides, not a pyramid and not a shape
  with rounded sides.
examples:
- The right prism stood on its flat end on the desk.
- We worked out the size of the right prism from its two ends.
