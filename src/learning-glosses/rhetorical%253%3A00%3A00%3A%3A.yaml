senseId: 'rhetorical%3:00:00::'
synsetId: 02023749-a
simpleMeaning: putting style before thought in speech or writing
scope: This sense is about speech or writing that cares more about style than thought, not the wider sense
  that just means to do with speaking or writing as a skill.
examples:
- His rhetorical speech sounded grand but said very little.
- She cut the rhetorical flourishes and kept only the clear facts.
