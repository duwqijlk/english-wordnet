simpleMeaning: any one of several chemicals made when a strong acid acts on things that can burn, found
  in the waste gas from cars
scope: One of several chemicals made when a strong acid acts on things that can burn; not the acid itself
  and not the smoke from a fire.
examples:
- Nitrogen oxide levels rise in heavy traffic.
- The test found nitrogen oxide in the car's waste gas.
