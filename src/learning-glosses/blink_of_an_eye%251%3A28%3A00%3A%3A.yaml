simpleMeaning: a very short stretch of time, about as long as one quick shut of the lids or one beat of
  the heart
scope: A very short stretch of time, about as long as one quick shut of the lids or one beat of the heart;
  heartbeat is another name for this sense, not a long wait and not a moment of sleep.
examples:
- In the blink of an eye, the cat was gone.
- He finished the job in the blink of an eye.
