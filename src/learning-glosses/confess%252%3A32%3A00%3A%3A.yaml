simpleMeaning: to say that you did a bad act that can be punished, usually when someone has pressed you
  to speak
scope: To say that you did a bad act that can be punished, usually when pressed to speak, also called
  squeal, not saying sorry to God before a priest.
examples:
- He confessed to stealing the money after hours of questions.
- She finally confessed to breaking the window.
