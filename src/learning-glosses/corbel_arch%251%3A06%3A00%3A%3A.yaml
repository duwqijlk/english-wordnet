simpleMeaning: In building, a curved top over an opening, made of layers of stone or brick, each sticking
  out a little more than the one below, until they meet
scope: In building, a curved top over an opening, made of layers of stone or brick, each sticking out
  a little more than the one below, until they meet; not a top made with a single curved stone, and not
  a flat beam over an opening.
examples:
- The corbel arch over the doorway was built of layered stone.
- Each stone of the corbel arch stuck out a little further than the one below.
