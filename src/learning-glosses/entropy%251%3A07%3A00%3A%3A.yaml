simpleMeaning: In the study of heat, a measure of the energy in a system that can no longer be used to
  do work.
scope: 'Also called randomness: in the study of heat, the measure of energy no longer free to do work,
  not the measure of uncertainty in a message.'
examples:
- Entropy rises as the system loses usable energy.
- The entropy of the gas grew as it spread through the room.
