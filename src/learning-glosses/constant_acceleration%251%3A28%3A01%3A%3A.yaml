senseId: 'constant_acceleration%1:28:01::'
synsetId: 92443357-n
simpleMeaning: A kind of movement in which the speed of a thing changes by the same amount in each equal
  stretch of time.
scope: A kind of movement in which speed changes by the same amount in each equal stretch of time, not
  movement at a steady speed and not movement with changes of speed that vary.
examples:
- Constant acceleration makes the speed grow by the same amount each second.
- Falling under gravity is an example of constant acceleration.
