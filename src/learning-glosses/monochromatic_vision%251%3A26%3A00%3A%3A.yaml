senseId: 'monochromatic_vision%1:26:00::'
synsetId: 14178756-n
simpleMeaning: Sight that shows no colour at all, so one colour can be told from another only by how light
  or dark it is
scope: 'Also called monochromacy, monochromasy, monochromatism and monochromia: sight with no colour at
  all, not poor colour sight and not night blindness.'
examples:
- His monochromatic vision lets him tell colours apart only by brightness.
- Monochromatic vision runs in her family.
