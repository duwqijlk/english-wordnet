simpleMeaning: A yellow, thick animal oil taken from wool, a mix of fatty acids and esters, used in some
  ointments and cosmetics.
scope: Also called wool fat or wool grease; a yellow, thick oil taken from wool, not the skin cream made
  with it.
examples:
- Lanolin from sheep's wool softens dry skin.
- The ointment contained lanolin.
