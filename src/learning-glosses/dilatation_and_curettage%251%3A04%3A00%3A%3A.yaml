simpleMeaning: An operation that opens the cervix and scrapes the womb's lining, typically under local
  numbing, to take tissue samples, stop bleeding, remove growths, clear leftover placenta, or end a pregnancy.
scope: This is the operation that widens the cervix and scrapes the womb, not a scan or removal of the
  whole womb; 'dilation and curettage' is the same procedure under another spelling.
examples:
- She had a dilatation and curettage after the miscarriage.
- The doctor recommended a dilatation and curettage to stop the prolonged bleeding.
