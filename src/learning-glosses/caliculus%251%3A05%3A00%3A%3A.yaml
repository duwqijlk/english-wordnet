simpleMeaning: Like a small cup, this thing may be a taste bud, the cup of the eye, or the hollow of a
  coral that holds a polyp.
scope: Also called a calycle and a calyculus, this small thing shaped like a cup may be a taste bud, the
  cup of the eye, or the hollow of a coral that holds a polyp.
examples:
- A caliculus sits on the tongue as a taste bud.
- The caliculus of the coral held a tiny polyp.
