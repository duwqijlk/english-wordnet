simpleMeaning: a heap of wood built up to burn a dead body as part of a funeral
scope: A heap of wood for burning a dead body at a funeral, not a pile of wood for a fire and not a grave.
examples:
- The body was laid on the pyre.
- They lit the pyre at sunset.
