simpleMeaning: a set of cords tied to a main cord, used by people long ago in Peru to work out numbers
  and keep records
scope: A tool made of cords, used to work out numbers and keep records; not a machine that works with
  numbers on a screen and not a written book of records.
examples:
- The museum showed a quipu with knots in its cords.
- A quipu helped its makers keep count of stored food.
