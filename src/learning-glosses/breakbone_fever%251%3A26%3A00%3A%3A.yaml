simpleMeaning: Marked by spots on the skin and an aching head and joints, this sickness of warm lands
  spreads by germs that mosquitoes pass on.
scope: 'Also called dengue, dandy fever, and dengue fever: a sickness of warm lands that mosquitoes pass
  on, not a cold caught from another person.'
examples:
- Breakbone fever left her with an aching head and joints.
- Mosquitoes pass on breakbone fever in warm lands.
