simpleMeaning: a special kind of doctor who treats illness with X-rays and substances that give off strong
  rays
scope: A doctor who treats illness in this way, not a general doctor and not a surgeon who cuts the body
  open to treat illness.
examples:
- The radiologist used X-rays to treat the man's illness.
- She saw a radiologist for treatment with strong rays from a special substance.
