simpleMeaning: Workers use it to treat leather, and it gives vitamin A — a yellow-to-brown fat from the
  livers of the big sea fish it is named for.
scope: Shark-liver oil is another name for this yellow-to-brown fat from the livers of the big sea fish
  it is named for, used to treat leather and to give vitamin A.
examples:
- Workers treat leather with shark oil.
- This shark oil is a source of vitamin A.
