simpleMeaning: a unit of liquid volume used in the United States, equal to eight fluid ounces
scope: This is the unit of volume, not the drinking vessel, the prize trophy, or the punch served in a
  pitcher.
examples:
- The recipe calls for two cups of flour.
- Nutrition labels in the US list serving sizes in cups.
