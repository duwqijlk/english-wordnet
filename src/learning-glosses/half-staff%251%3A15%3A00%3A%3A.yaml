synsetId: 08598472-n
simpleMeaning: The spot part-way down a tall pole to which a flag is brought down in grief or as a sign
  of trouble.
scope: This is a place part-way down a tall pole where a flag is lowered in grief or distress, not the
  top of the pole; also called half-mast.
examples:
- The flag flew at half-staff.
- They lowered the flag to half-staff after the news.
