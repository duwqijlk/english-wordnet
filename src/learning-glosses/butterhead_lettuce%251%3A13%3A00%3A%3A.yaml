simpleMeaning: a green salad plant with fairly soft leaves in a loose head that break or bruise easily
scope: A green salad plant with fairly soft leaves in a loose head that bruises easily, not the tender
  crisp-leaved kind and not a hard tight head of leaves.
examples:
- She tore the soft butterhead lettuce into the bowl.
- The butterhead lettuce bruised where the bag had pressed on it.
