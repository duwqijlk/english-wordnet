simpleMeaning: a skin injury that destroys both the outer layer of skin and the layer below it
scope: A skin injury that destroys both the outer layer of skin and the layer below it, not a first-degree
  burn, which only hurts the top layer, and not a second-degree burn.
examples:
- He got a third-degree burn on his hand from the fire.
- A third-degree burn can destroy both layers of the skin.
