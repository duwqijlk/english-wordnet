simpleMeaning: a product that is new in a market and must compete with products that are already well
  known and sold there
scope: This is a product that is new in a market, not a person who takes part in a race or test, and not
  someone who joins a school or group.
examples:
- The pocket computer was a new entrant competing with larger machines already on sale.
- As an entrant, the small car had to win buyers from well-known brands.
