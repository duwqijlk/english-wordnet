simpleMeaning: an important plant of the bean family from Europe, grown widely as food for farm animals
  and for hay, with leaves in threes and blue-violet flowers
scope: An important European plant of the bean family grown as animal feed and hay, also called alfalfa,
  not a garden flower and not a grain crop.
examples:
- Lucerne is grown widely as a pasture and hay crop.
- The field of lucerne has blue-violet flowers.
