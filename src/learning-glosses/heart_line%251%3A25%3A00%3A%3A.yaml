simpleMeaning: People who read hands say this fold in the skin of the hand shows what kind of feelings
  you have
scope: 'Also called line of heart, love line and mensal line: a fold on the hand that readers of hands
  say shows feeling, not a line on a map and not a cut on the hand.'
examples:
- The heart line on her palm ran straight across.
- The palmist pointed to his heart line and spoke of his feelings.
