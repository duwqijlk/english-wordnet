simpleMeaning: A tower with turning flat panels, also called blades or paddles, that sends messages by
  sights seen from far away, read when a panel stops in one place.
scope: A tower with turning flat panels, also called blades or paddles, that sends messages by sights
  seen from far away; semaphore telegraph is another name for this sense.
examples:
- The Chappe telegraph sent messages by sights seen from far away.
- Soldiers read the Chappe telegraph when a panel stopped in one place.
