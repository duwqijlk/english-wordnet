simpleMeaning: A seed with spots or marks of more than one colour, from the south-west of the United States,
  most often dried.
scope: A seed with spots or marks of more than one colour from the south-west of the United States, most
  often dried; not a kidney bean and not a black bean.
examples:
- We soaked the pinto beans overnight before cooking them.
- The pinto bean is a staple in the cooking of the south-west.
