simpleMeaning: A sea shellfish with a long, narrow, thin, curved shell
scope: A sea shellfish with a long, thin, curved shell, also called a jackknife clam or a knife-handle;
  not a round clam and not a mussel.
examples:
- They dug for razor clams at low tide.
- A razor clam lay half-buried in the sand.
