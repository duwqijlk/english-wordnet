simpleMeaning: a small metal block with a letter, number or other sign standing out on one end, which
  prints that sign on paper when covered with ink and pressed down
scope: This sense is not a group or class that things are divided into, and not a style of letters used
  in printing.
examples:
- The printer set each metal type by hand before locking the page into the press.
- Ink had dried on the type, so the first copies came out smudged.
