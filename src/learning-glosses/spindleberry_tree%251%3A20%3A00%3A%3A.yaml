simpleMeaning: Of the Euonymus group, any shrubby tree or woody vine with berries that catch the eye,
  usually reddish, fits this name.
scope: This shrubby tree or woody vine of the Euonymus group is also called spindle tree and spindleberry.
examples:
- The spindleberry tree had red berries.
- The spindleberry tree bore reddish berries.
