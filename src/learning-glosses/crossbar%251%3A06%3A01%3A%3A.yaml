simpleMeaning: a bar that lies across the top in a sports game, for a person to jump over, with or without
  a pole
scope: This is the sports bar a person jumps over, not a long thin bar that joins two upright posts.
examples:
- In the pole vault, she went over the crossbar at her first try.
- The high jumper knocked the crossbar off as he went over.
