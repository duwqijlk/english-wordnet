simpleMeaning: 'A plant grown for two things at once: long leaves with a glossy shine and curving sprays
  of white flowers, pink-flushed, whose crinkled yellow lip is barred with magenta.'
scope: Also called shall-flower and shellflower, it is grown for glossy long leaves and pink-flushed white
  flowers; not the showy marsh perennial that shares the shellflower name.
examples:
- Shell ginger grows best in warm, sheltered gardens.
- The shell ginger by the porch is covered in pink-tinged white flowers.
