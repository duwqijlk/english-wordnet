simpleMeaning: This tree of northern India and China, now at home in the south of the United States as
  a shade tree, bears purple blossoms and small yellow inedible fruits.
scope: Also called chinaberry, azedarach and azederach, it is a tree of northern India and China now at
  home in the south of the United States as a shade tree.
examples:
- The chinaberry tree bore purple blossoms.
- The chinaberry tree bore small yellow fruits.
