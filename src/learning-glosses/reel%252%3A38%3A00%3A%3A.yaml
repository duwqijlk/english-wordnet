senseId: 'reel%2:38:00::'
synsetId: 01928835-v
simpleMeaning: to go on foot with steps that look as if you cannot control them
scope: Also called stagger, lurch and careen. This is walking without control of your steps, not turning
  round and round and not a dance.
examples:
- He reeled across the room after the blow to his head.
- She reeled down the street, too tired to walk straight.
