simpleMeaning: to treat iron by heating and stirring it while it is hot and liquid, or to be made in this
  way
scope: A special way of treating iron, not walking in shallow water, not splashing water to make a pool,
  and not working wet clay or mud.
examples:
- The workers puddled the iron in the hot furnace.
- In the old mill, they puddled iron to make it ready for shaping.
