simpleMeaning: a flat-topped or rounded bunch of flowers of the carrot family, each on its own stalk from
  about one point, with the youngest blooms in the middle
scope: Not a single big bloom or a spike of flowers one above another; the flower stalks all spring from
  about one point.
examples:
- The carrot's flowers grow in an umbel.
- She drew the umbel with its stalks all springing from one point.
