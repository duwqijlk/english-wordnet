simpleMeaning: Followed by red berries, this common shrub of eastern North America cannot poison people,
  with waxy leaves made of many small parts and green flowers in loose clusters
scope: Also called scarlet sumac and vinegar tree, it is a harmless shrub of eastern North America with
  green flowers and red berries, not a poisonous shrub.
examples:
- Smooth sumac grows in eastern North America.
- The smooth sumac bore red berries.
