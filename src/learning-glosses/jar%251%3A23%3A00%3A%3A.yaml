simpleMeaning: the amount of a thing that fills one round pot with a wide top
scope: The amount of a thing that fills a jar, not the round pot itself and not a sudden jerky move.
examples:
- She finished a jar of honey in a week.
- He drank a jar of beer with his lunch.
