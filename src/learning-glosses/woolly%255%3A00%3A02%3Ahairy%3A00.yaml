simpleMeaning: hairs or fine threads packed close together like cotton cover the whole thing
scope: This is a thing covered in hairs or fine threads packed close together like cotton; it is not the
  other woolly sense of matted or curly hairs, and not cloth made of wool.
examples:
- The woolly aphid's back was covered in soft white hairs.
- Woolly leaves felt soft under my fingers.
