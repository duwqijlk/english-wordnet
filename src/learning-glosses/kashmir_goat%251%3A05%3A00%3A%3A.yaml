simpleMeaning: A mountain goat of the Himalayas with a silky coat under its hair, highly prized for the
  fine wool called cashmere.
scope: A Himalayan mountain goat with a silky undercoat, also called Cashmere goat; its near kin are other
  goats kept for fine wool, such as the Angora goat.
examples:
- The Kashmir goat gives the fine wool called cashmere.
- A Kashmir goat stood on the high slope.
