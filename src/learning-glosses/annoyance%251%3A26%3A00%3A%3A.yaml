senseId: 'annoyance%1:26:00::'
synsetId: 14429977-n
simpleMeaning: the state of mind of a person who feels troubled and angry
scope: 'Also called irritation: this names the state a person is in when feeling troubled and angry, not
  the anger itself that a troubling thing brings, not an unpleasant person, and not the act of troubling
  someone.'
examples:
- She waited in annoyance while the computer slowly started again.
- He shook his head in annoyance at the long line of people.
