simpleMeaning: a woman's leg covering made from a thin see-through cloth of nylon, rayon, or thread spun
  by worms
scope: A woman's leg covering made from a thin see-through cloth of nylon, rayon, or thread spun by worms,
  also called nylons, nylon stocking, rayon stocking, or rayons; not a thick wool leg covering and not
  a man's leg covering.
examples:
- She wore a silk stocking with her best dress.
- A silk stocking tore at the heel.
