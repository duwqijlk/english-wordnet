simpleMeaning: a picture printed from a block, a plate, or another hard surface with lines cut into it
scope: This is the printed picture made from a cut block or plate. It is not the block or plate itself,
  and not the act of making such plates and printing from them.
examples:
- She framed an old engraving of the city and hung it on the wall.
- The book has an engraving of a ship on its first page.
