simpleMeaning: A space in a car that holds bags, shopping or tools
scope: This is a space in a car that holds bags, shopping or tools; boot, trunk and luggage compartment
  are other names for it, not the space where people sit and not a small box for maps.
examples:
- He put his golf bag in the automobile trunk.
- She packed the shopping into the automobile trunk.
