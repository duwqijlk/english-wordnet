simpleMeaning: Toes rise when the sole's outer side is stroked hard from heel to front; normal in babies
  under two, a sign of brain or spinal cord harm in older people.
scope: 'Also called the Babinski reflex and the Babinski sign: toes turning up when the sole is stroked,
  not a normal walk and not a foot disease.'
examples:
- The Babinski was normal in the six-month-old baby.
- A Babinski in an older person can mean harm to the brain or spinal cord.
