simpleMeaning: In the sending of signals, twice the fastest wave rate found in the sent signal
scope: In the sending of signals, twice the fastest wave rate in the sent signal, not the fastest wave
  rate itself.
examples:
- The Nyquist frequency is twice the fastest wave rate in the signal.
- Engineers use the Nyquist frequency to set the rate at which a signal is read.
