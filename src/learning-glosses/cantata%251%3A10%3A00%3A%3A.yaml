simpleMeaning: a piece of music for singers and an orchestra, with words from a holy text
scope: 'Also called oratorio: a piece of music for singers and orchestra with words from a holy text,
  not a song for one voice alone and not a piece of music with no singers.'
examples:
- The choir sang a cantata at the Easter service.
- Bach wrote many a cantata for church use.
