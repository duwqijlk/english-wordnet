simpleMeaning: A blood tube that feeds the hollow middle of a long bone
scope: A blood tube that feeds the hollow middle of a long bone, with arteria nutricia as another name
  for this sense; not a blood tube that feeds the skin, and not a vein.
examples:
- The nutrient artery runs into the hollow of the thigh bone.
- Damage to the nutrient artery can starve the bone.
