simpleMeaning: 'It lifts the lower jaw to shut the mouth: a band of flesh joining the hollow at the side
  of the head to the bony point of the lower jaw.'
scope: 'Also called musculus temporalis, temporal muscle, and temporalis: the band of flesh at the side
  of the head that lifts the lower jaw to shut the mouth.'
examples:
- The temporalis muscle aches after a long meal of chewy food.
- Rubbing the temporalis muscle can ease a tight jaw.
