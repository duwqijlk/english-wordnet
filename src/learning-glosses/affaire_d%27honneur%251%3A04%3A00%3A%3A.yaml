senseId: 'affaire_d''honneur%1:04:00::'
synsetId: 01175274-n
simpleMeaning: a fight set up in advance between two people, each with a helper, with weapons that can
  kill, to settle a quarrel about honour
scope: A fight planned in advance between two people to settle a quarrel over honour; duel is another
  name for this sense, not a sudden brawl and not a war.
examples:
- He challenged his rival to an affaire d'honneur at dawn.
- The affaire d'honneur was fought with pistols over a point of honour.
