simpleMeaning: a rod or wire that takes in waves from all sides so a set can pick up broadcasts
scope: A rod or wire that takes in waves for a set, also called a radio antenna; not the set itself and
  not a wire that sends out waves.
examples:
- The radio aerial on the roof picks up the morning news.
- She moved the radio aerial until the sound came through clear.
