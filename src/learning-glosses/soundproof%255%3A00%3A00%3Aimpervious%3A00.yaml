simpleMeaning: that does not let sound pass through it
scope: This describes a room, wall or other thing that sound cannot pass through. It is not a thing that
  only makes sound weaker.
examples:
- We stayed in a soundproof room, so we could not hear the traffic outside.
- The studio walls are soundproof and keep out all the street noise.
