simpleMeaning: An instrument with four strings and a hollow body, played with a bow. It has the highest
  notes in the violin family and a smooth board for the fingers.
scope: 'Also called a violin: a musical instrument played with a bow, not the verb senses of cheating,
  touching something with the fingers, or avoiding work.'
examples:
- She played a lively tune on her fiddle.
- He bought a new fiddle with four strings for the concert.
