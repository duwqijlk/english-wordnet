simpleMeaning: Small white or pink flowers in thick bunches mark any kind of the plant group Seseli, whose
  leaves are cut into fine parts.
scope: 'Also called moon carrot: any of the kinds of Seseli with thick bunches of small white or pink
  flowers, not the slender roadside herb of western Europe with white flowers and seeds that smell sweet.'
examples:
- This stone parsley has thick bunches of small white flowers.
- Stone parsley grows thick bunches of small pink flowers.
