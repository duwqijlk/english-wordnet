simpleMeaning: a lamp that gives a brief light so a photograph can be taken
scope: A lamp that briefly lights a scene for a photograph, not the burst of light itself, and not a light
  used to send a signal.
examples:
- The flash on my camera was too bright for the dark room.
- He attached a flash to the top of his camera.
