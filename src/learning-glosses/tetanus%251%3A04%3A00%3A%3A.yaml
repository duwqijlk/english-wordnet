senseId: 'tetanus%1:04:00::'
synsetId: 00370935-n
simpleMeaning: when a muscle stays tight and does not let go, because many quick signals from the nerves
  reach it one after another
scope: This is a muscle staying tight because of nerve signals; it is not the serious illness from a germ
  in a cut, which makes the jaw and throat tight.
examples:
- In the test, the muscle showed tetanus after the quick set of nerve signals.
- The teacher showed how tetanus can keep a frog's leg muscle tight for a long time.
