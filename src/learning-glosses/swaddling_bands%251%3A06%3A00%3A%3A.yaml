simpleMeaning: A piece of clothing, a gown or narrow strips of cloth, made for a baby.
scope: A piece of clothing, a gown or narrow strips of cloth, made for a baby; also called swaddling clothes;
  not a blanket and not clothes for a grown child.
examples:
- The baby was wrapped in swaddling bands.
- In old times, babies wore swaddling bands.
