simpleMeaning: A spiny tree of East India, with leaves split twice into small leaflets and yellow flowers,
  then flat pods; it gives a dark plant extract.
scope: A spiny tree of East India with yellow flowers and flat pods, also called catechu and Jerusalem
  thorn; its leaves split twice into small leaflets set it apart from other spiny trees.
examples:
- Acacia catechu bears yellow flowers and flat pods.
- The leaves of Acacia catechu are split twice into small leaflets.
