simpleMeaning: In criminal law, an act that breaks the law and can be punished, usually thought of as
  a wicked act
scope: This is an act that breaks the law and can be punished, usually thought of as wicked; criminal
  offence is another name for this sense, and it is not a civil wrong or a mere mistake.
examples:
- The new law made it a criminal offense to dump waste in the river.
- He was charged with a criminal offense.
