simpleMeaning: A plant grown mostly in the states by the Gulf of Mexico to make hot sauce, bearing very
  hot middle-sized long red fruits.
scope: Hot pepper and tabasco pepper are other names for this plant, grown to make hot sauce from its
  very hot red fruits.
examples:
- The tabasco plant bore very hot red fruits.
- They grew tabasco plant in the Gulf Coast states to make hot sauce.
