simpleMeaning: 'A weed that grows wild elsewhere came from the warm lands of the Old World: a rough plant
  that lives one year, with spikes of flowers shaped like fingers.'
scope: Also called wire grass, yard grass, and yardgrass, this is a rough one-year plant from the warm
  Old World, not the prickly North American kind and not the low silver-leafed kind.
examples:
- Goose grass spread across the yard by the end of summer.
- The goose grass in the field had finger-like spikes of flowers.
