simpleMeaning: the act of giving things out to the places or people chosen for them
scope: This is the act of giving things out to chosen places or people; it is not a piece of work a person
  is given to do, and not a job or duty given to someone.
examples:
- The assignment of rooms to the guests took an hour.
- The first job was the assignment of an address to each record.
