simpleMeaning: farm land that is dug up, sown with seed, and used to grow crops
scope: Farm land that is dug up, sown and used to grow crops; farmland, ploughland, cultivated land, plowland,
  tilled land and tilth are other names for this sense. Not wild land and not a garden.
examples:
- The tillage stretched out behind the farmhouse in neat rows.
- After the rain, the farmer went out to check the tillage.
