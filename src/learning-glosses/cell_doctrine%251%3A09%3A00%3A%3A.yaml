synsetId: 06115216-n
simpleMeaning: In biology, the idea, first put forward in 1838 by Matthias Schleiden and Theodor Schwann,
  that cells are the smallest parts that build and run every living thing.
scope: Also called cell theory; the idea that cells are the basic parts of all living things, not a theory
  about how new cells are made.
examples:
- The cell doctrine says every living thing is made of cells.
- Schleiden and Schwann set out the cell doctrine in 1838.
