simpleMeaning: In the past, a heap of earth inside a fort, high enough for a big gun to fire over the
  wall
scope: A raised earth bank for firing a gun over a fort wall, not a gun turret and not the fort wall itself.
examples:
- The old barbette still stands inside the ruined fort.
- Soldiers fired the heavy gun from the barbette over the wall.
