simpleMeaning: A long rod with a sharp tip, made to be used as a tool or a weapon.
scope: A long rod with a sharp tip used as a tool or a weapon, also called a spear, not a turning rod
  in a machine and not a deep hole dug down into the ground.
examples:
- The hunter's shaft had a sharp stone tip.
- He threw his shaft and it struck the wooden board.
