simpleMeaning: a light material that lets no light through, full of tiny holes, made by adding powdered
  carbon to broken bits of clear hard stuff and heating the mix
scope: A light material full of tiny holes, also called cellular glass and expanded glass, not window
  glass and not foam rubber.
examples:
- The builders put foam glass under the floor to keep heat in.
- Foam glass is light and full of tiny holes.
