simpleMeaning: A government program in the U.S. that gives money to old people, to the families of workers
  who have died, and to some people without work
scope: A U.S. government program that pays money to old people, to the families of workers who have died,
  and to some people without work; it covers old age, the death of a worker, and some unemployment.
examples:
- She began drawing Social Security when she turned sixty-five.
- Social Security helps families after a worker dies.
