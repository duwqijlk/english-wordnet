simpleMeaning: A small to medium-sized thorny woody plant of tropical Asia and northern Australia with
  thick clusters of scarlet or crimson flowers and black seeds.
scope: Also called Erythrina indica and Erythrina variegata; a thorny tree with red flowers, not a coral
  plant of the sea.
examples:
- The Indian coral tree bloomed scarlet.
- We planted an Indian coral tree in the yard.
