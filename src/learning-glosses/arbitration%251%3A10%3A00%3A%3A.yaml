simpleMeaning: In law, the use of a fair person, chosen by both sides, to hear a disagreement and decide
  it; often used to settle disagreements between workers and managers
scope: In law, this sense is the full hearing and decision by a person both sides agree on, often for
  workers and managers. It is not just the act of making a decision on its own.
examples:
- The workers and the company chose arbitration to settle their disagreement.
- Arbitration by a person both sides trusted ended the long argument at work.
