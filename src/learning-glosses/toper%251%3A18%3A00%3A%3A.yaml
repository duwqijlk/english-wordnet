simpleMeaning: One who takes strong drink, especially past what is wise.
scope: This sense is also called a drinker and a juicer, for one who takes strong drink, especially past
  what is wise, where a drinker is a person who drinks alcohol, most often in too great a measure.
examples:
- The old toper drank strong drink every day.
- Topers gather at the bar each evening.
