simpleMeaning: a common low milkwort of eastern North America that lives for years and creeps along the
  ground, with leaves like wintergreen and usually rosy-purple flowers with winged outer petals
scope: 'Also called bird-on-the-wing, flowering wintergreen and gaywings: a low creeping plant with rosy-purple
  flowers, not a wintergreen shrub and not a tall garden flower.'
examples:
- Fringed polygala creeps along the woodland floor, its rosy-purple flowers showing their winged sepals.
- We found fringed polygala with leaves like wintergreen in the eastern woods.
