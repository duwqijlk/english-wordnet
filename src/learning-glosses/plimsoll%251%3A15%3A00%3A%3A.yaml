simpleMeaning: Lines on a ship's side showing how deep it may sit in the water when it is rightly loaded
scope: Lines on a ship's side showing how deep it may sit in the water when rightly loaded, also called
  a load line, a Plimsoll line and a Plimsoll mark; not a line on a map and not a mark on a wall.
examples:
- The Plimsoll line showed the ship was too low in the water.
- Check the Plimsoll mark before the ship leaves port.
