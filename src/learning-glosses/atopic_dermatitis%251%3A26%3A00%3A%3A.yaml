simpleMeaning: a bad skin rash found in people with atopy, a state in which the body reacts too strongly
  to things around it
scope: 'Also called atopic eczema: a bad skin rash in people with atopy, not a mild rash and not a rash
  from touching something hot.'
examples:
- Her atopic dermatitis flared up in the winter.
- The doctor treated his atopic dermatitis with a cream.
