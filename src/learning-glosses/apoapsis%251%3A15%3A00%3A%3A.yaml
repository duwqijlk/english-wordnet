simpleMeaning: In astronomy, the point on a path around a body that is farthest from that body
scope: 'Another name for point of apoapsis: the farthest point of an orbit, not the nearest point and
  not the orbit itself.'
examples:
- At apoapsis the satellite is farthest from the Earth.
- The spacecraft reached apoapsis before it began to fall back.
