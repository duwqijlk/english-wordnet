simpleMeaning: Bold and open about doing what others think is wrong, with no shame and no care for good
  manners.
scope: Also called insolent; not the brazen that means made of brass or like brass.
examples:
- His brazen lies shocked everyone in the room.
- She made a brazen claim that the money was hers.
