senseId: 'obeisance%1:10:00::'
synsetId: 07289130-n
simpleMeaning: A low bend of the head, body, or knee, made to show deep respect, shame, or that you accept
  another person's power, or to greet them
scope: This sense is bending the body to show respect, shame, or greeting, also called bow and also called
  bowing; it is not the wider act of obeying a person.
examples:
- He made an obeisance before the king.
- She bent low in obeisance when she met the queen.
