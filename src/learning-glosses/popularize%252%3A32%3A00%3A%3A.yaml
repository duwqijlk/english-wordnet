senseId: 'popularize%2:32:00::'
synsetId: 00972247-v
simpleMeaning: to make something liked by many people, show it to everyone in a way most people will like,
  and bring it into wide, everyday use
scope: 'Also called generalize and generalise: this means making a thing liked and used by many people,
  not making a broad statement from a few facts.'
examples:
- The band popularized this style of music with young listeners.
- Cheap phones popularized taking photos in almost every place.
