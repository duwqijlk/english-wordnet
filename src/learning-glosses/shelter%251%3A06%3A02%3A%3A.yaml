simpleMeaning: a place to live for a short time for people who have no home or have had to leave home
scope: A short-time home for people who have no home or had to leave home, not a way to pay less tax and
  not the act of giving a person a safe place.
examples:
- The shelter gave beds to people who lost their homes.
- After the fire, the town opened a shelter.
