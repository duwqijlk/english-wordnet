simpleMeaning: 'A common substance, not a metal, that can join four other bits, found in three forms:
  shapeless stuff, grey layers, and hard bright stones; it is in all organic stuff.'
scope: This is the stuff in all organic stuff, also called C and atomic number 6, not a copy and not a
  piece of coal.
examples:
- Carbon is in every living thing.
- Diamonds are one form of carbon.
