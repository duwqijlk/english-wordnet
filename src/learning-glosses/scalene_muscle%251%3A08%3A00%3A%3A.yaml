simpleMeaning: Running from the bones of the neck to the second rib, it is one of four pairs of muscles
  used to move the neck and to breathe.
scope: Also called scalenus and musculus scalenus, it is one of four pairs of muscles that run from the
  neck bones to the second rib, and it moves the neck rather than holding it still.
examples:
- The scalene muscle moved as she turned her neck.
- The scalene muscle worked each time he breathed.
