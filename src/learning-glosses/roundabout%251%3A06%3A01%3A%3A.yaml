simpleMeaning: a large machine that turns round and round, with seats for children to ride on for fun
scope: 'Also called carousel, another name for this sense is whirligig: a turning ride for children, not
  the place where roads meet and not speech that goes a long, indirect way.'
examples:
- The children waited for a ride on the roundabout at the fair.
- She chose a horse seat on the roundabout and held on as it turned.
