simpleMeaning: The parts of the face get their blood from one of two tubes that leave the outer neck tube.
scope: Also called maxillary artery, it is one of two tubes that leave the outer neck tube to feed the
  parts of the face.
examples:
- The arteria maxillaris carries blood to the parts of the face.
- The arteria maxillaris runs from the outer neck tube to the face.
