simpleMeaning: at or near the north or south pole of the earth, or inside the Arctic or Antarctic Circles
scope: At or near the earth's north or south pole, or inside the far north or far south circles, not the
  sense of two things being complete opposites.
examples:
- Polar regions stay cold for most of the year.
- The polar ice caps grow in winter and shrink in summer.
