simpleMeaning: The share of the blood taken up by red blood cells packed close together, as read by a
  measuring tool.
scope: The share of the blood taken up by red blood cells packed close together, as read by a measuring
  tool; hematocrit and packed cell volume are other names for it, not the measuring tool itself.
examples:
- Her haematocrit was low after the loss of blood.
- The haematocrit showed the share of red blood cells in her blood.
