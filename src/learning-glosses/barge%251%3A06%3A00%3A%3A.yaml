simpleMeaning: a boat with a flat bottom, used for carrying heavy loads, most of all on canals
scope: 'Also called a lighter: a flat-bottomed boat made for heavy loads on water, not the act of moving
  goods by such a boat.'
examples:
- A barge carried the coal slowly down the canal.
- The men loaded the barge with heavy stones.
