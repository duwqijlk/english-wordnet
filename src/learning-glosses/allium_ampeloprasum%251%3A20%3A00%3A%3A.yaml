simpleMeaning: A rough, long-lived plant from the Old World with a large bulb and a tall stem of greenish
  flowers touched with purple, now growing wild in many places.
scope: Also called kurrat, wild leek, and Levant garlic; a coarse bulb plant with a tall stem of greenish-purple
  flowers, distinct from other bulb plants with small bulbs or low stems.
examples:
- Allium ampeloprasum grows wild along the roadside.
- We found Allium ampeloprasum with its tall purple-tinged stalk.
