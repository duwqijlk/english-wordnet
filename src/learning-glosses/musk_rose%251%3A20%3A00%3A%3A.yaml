simpleMeaning: Loose bunches of flowers that smell faintly sweet grow on this shrub of the lands round
  the Mediterranean Sea, on bent or climbing branches.
scope: A shrub of the lands round the Mediterranean Sea, with bent or climbing branches and loose bunches
  of sweet-smelling flowers, not the musk-scented Old World plant with white or pink flowers.
examples:
- The musk rose climbed over the old stone wall.
- Musk rose flowers filled the garden with a sweet smell.
