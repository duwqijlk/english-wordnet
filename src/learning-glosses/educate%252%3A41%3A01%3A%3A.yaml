simpleMeaning: to teach a person to judge taste or quality well and to notice small differences
scope: Also called school, train, cultivate and civilize, this sense is about learning to judge taste
  and quality well, not general teaching at school.
examples:
- She educated her taste by listening to good music every day.
- He educated his eye by looking at fine paintings.
