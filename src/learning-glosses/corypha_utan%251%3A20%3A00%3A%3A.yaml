simpleMeaning: A palm with very large leaves, from Malaya to the Philippines and northern Australia, whose
  leaves are used to thatch roofs or plait into containers.
scope: Also called gebang palm and Corypha gebanga; a big-leaved palm of the Malay lands, not the tall
  palm of southern India whose leaves serve as umbrellas.
examples:
- The Corypha utan leaves were plaited into containers.
- Corypha utan grows in northern Australia.
