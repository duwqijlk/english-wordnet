simpleMeaning: A poisonous blue drug that kills germs, made of tiny crystals, found in green thick liquid
  from a wound
scope: A poisonous blue drug that kills germs, found in green thick liquid from a wound, and not a blue
  dye.
examples:
- The doctor found pyocyanin in the green pus from the wound.
- Pyocyanin is the blue stuff found in the pus of an infected wound.
