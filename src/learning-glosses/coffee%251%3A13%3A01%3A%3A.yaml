simpleMeaning: A seed of the tropical bush from which a hot drink is made after roasting and crushing.
scope: This is not the drink or the growing plant; it is the seed itself, before or after roasting.
examples:
- Farmers spread the coffee beans out to dry in the sun.
- The coffee is roasted and ground before it is packed.
