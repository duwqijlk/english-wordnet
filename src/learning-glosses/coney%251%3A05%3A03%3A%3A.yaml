simpleMeaning: With front teeth like those of a rodent and toes that end in small hooves, this is one
  of several small hoofed animals of Africa and Asia.
scope: Also called a das, a cony, a dassie or a hyrax, this is a small hoofed animal of Africa and Asia,
  not the burrowing rabbit-like animal and not a fish of the same name.
examples:
- The coney has toes that end in small hooves.
- A coney's front teeth look like those of a rodent.
