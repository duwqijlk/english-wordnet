simpleMeaning: a spare board that plugs into a computer and gives it a new job it could not do before
scope: It is also called a card, a board, a circuit board, a circuit card, or a plug-in, and it plugs
  into a computer rather than being built into the machine.
examples:
- The old computer gained a new job when we fitted an add-in.
- He put an add-in in the spare slot, and the computer gained a new job.
