simpleMeaning: one of two body parts near a kidney, made of many parts, that make body chemicals that
  control how the body works
scope: 'Also called an adrenal: one of a pair of body parts near a kidney, not a kidney itself and not
  a body part elsewhere in the body.'
examples:
- The scan showed a small lump on his adrenal gland.
- Each adrenal gland lies close to a kidney.
