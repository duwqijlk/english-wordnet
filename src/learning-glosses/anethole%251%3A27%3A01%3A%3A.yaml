simpleMeaning: A chemical much used to give food and drink a pleasant taste
scope: A chemical that gives food and drink a pleasant taste; anise camphor is another name for this sense,
  not an anise-flavoured cookie and not the sweet aniseed drink.
examples:
- The cook added anethole to the sweets for a mild, pleasant taste.
- Anethole gives many sweets and drinks their fresh taste.
