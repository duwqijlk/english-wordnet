simpleMeaning: Breaking a fair or lawful duty, trust, or confidence by an act, by leaving something out,
  or by keeping something back is what this covers.
scope: It is also called constructive fraud, and it is a breach of a fair or lawful duty, trust, or confidence.
examples:
- His legal fraud lay in keeping back what he was bound to share.
- Her legal fraud was leaving out the facts she was bound to share.
