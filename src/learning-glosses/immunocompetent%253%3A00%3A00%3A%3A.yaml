simpleMeaning: able to make a defence in the body after meeting an antigen, a thing that sets off the
  body's defence
scope: Able to make a defence in the body after meeting a thing that sets it off; not the opposite state,
  where no defence can be made, and not a person who never falls ill.
examples:
- Only immunocompetent patients were given the live vaccine.
- The study used immunocompetent mice to test the new drug.
