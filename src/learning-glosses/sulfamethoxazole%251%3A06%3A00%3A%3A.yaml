simpleMeaning: A sulfa drug, sold as Gantanol, used to treat infections, above all infections of the parts
  of the body that make and pass urine.
scope: A medicine used to treat infections, above all those of the parts of the body that make and pass
  urine; not a medicine of the penicillin kind and not a painkiller.
examples:
- The doctor gave her sulfamethoxazole for the infection in her bladder.
- Sulfamethoxazole is sold under the trade name Gantanol.
