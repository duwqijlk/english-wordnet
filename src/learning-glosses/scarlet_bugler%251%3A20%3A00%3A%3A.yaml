simpleMeaning: A plant with bright red tube-shaped flowers growing in long, narrow clusters near the tops
  of upright stems, found in coastal mountains from central California southward.
scope: It is not the scented penstemon, whose flowers are white to reddish-pink, nor the creeping bugle
  herb of gardens.
examples:
- Scarlet bugler grows in the coastal mountains south of central California.
- The bright red, tube-shaped flowers of scarlet bugler cluster near the tops of its upright stems.
