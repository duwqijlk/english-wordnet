simpleMeaning: This paper says the person who holds it may shoot one kind of wild animal in a set time
scope: A paper that lets its holder shoot one kind of wild animal for a set time, also called game license,
  hunting license and hunting permit; not a paper that lets you own a gun and not a paper for fishing.
examples:
- He showed his hunting licence at the checkpoint.
- You need a hunting licence before you can shoot deer this season.
