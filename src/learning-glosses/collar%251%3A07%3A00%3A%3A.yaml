simpleMeaning: In the study of animals, a ring or mark round the neck of any animal
scope: In the study of animals, a ring or mark round the neck of any animal, not a leather strip put on
  a pet and not the band at the neck of a shirt.
examples:
- The bird had a white collar round its neck.
- You can tell the fox by the dark collar on its neck.
