simpleMeaning: A mark with a set meaning, made as a piece of art by cutting into a surface so it stands
  up from the surface.
scope: Not a letter in an alphabet and not a painted picture.
examples:
- The wall was covered in ancient glyphs.
- Archaeologists studied the glyph carved above the door.
