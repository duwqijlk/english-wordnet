simpleMeaning: to let a building or a thing fall into ruin by leaving it uncared for or using it badly
scope: To let a building or a thing fall into ruin through neglect or bad use, not to knock it down on
  purpose and not the ruin itself.
examples:
- Years of neglect had dilapidated the old farmhouse.
- The landlord let the flats dilapidate until the roofs leaked.
