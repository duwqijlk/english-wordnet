simpleMeaning: a painful spot on a person who rides horses, rubbed by the seat the rider sits on
scope: A painful spot on a rider, rubbed by the seat, not an open sore on a horse's back and not a bruise
  from a fall.
examples:
- After the long ride he had a saddle sore on his thigh.
- Her saddle sore made it hurt to sit in the saddle.
