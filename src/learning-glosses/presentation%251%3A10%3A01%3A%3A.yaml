simpleMeaning: the act of putting a plan or idea in front of people so they can think about it
scope: Putting a plan or idea before people to think about, not a show to watch, not giving a prize, and
  not making news public.
examples:
- Her presentation of the new plan took ten minutes.
- The presentation of the proposal will happen at the meeting on Monday.
