synsetId: 04171590-n
simpleMeaning: the forward gear in a car or truck that is one step above the lowest gear.
scope: This sense is not first gear or any higher forward gear, and not a unit of time, a fight attendant,
  flawed goods, or a speech supporting a motion.
examples:
- She shifted into second as the road began to climb.
- He kept the truck in second through the narrow village streets.
