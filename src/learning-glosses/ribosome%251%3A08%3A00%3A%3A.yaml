simpleMeaning: a structure in the cytoplasm of a living cell that builds proteins by reading messenger
  RNA, adding amino acids until it reaches a stop signal, then releasing the finished protein
scope: This is the cell particle that assembles proteins, not the messenger RNA it reads or the finished
  protein it releases.
examples:
- A ribosome reads messenger RNA and joins amino acids into a protein.
- Some antibiotics work by blocking bacterial ribosomes.
