simpleMeaning: a moving set of steps that carries people up or down between floors, with the steps running
  on a belt that goes round and round
scope: This is the moving set of steps in a building, not the part of a contract that changes pay or prices
  when conditions change.
examples:
- We took the escalator up to the third floor.
- The escalator at the station was full of people going down.
