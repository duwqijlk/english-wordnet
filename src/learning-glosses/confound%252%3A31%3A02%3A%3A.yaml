simpleMeaning: To puzzle someone so much that they cannot think clearly.
scope: To puzzle someone until they cannot think clearly; fox, throw and confuse are other names for this
  sense, and it is not to mix things up nor to defeat someone.
examples:
- These questions confound even the experts.
- The puzzle confounded the whole class.
