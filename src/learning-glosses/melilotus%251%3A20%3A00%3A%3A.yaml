scope: A tall straight plant living one or two years, grown above all for hay and to better the soil;
  melilot and sweet clover are other names for this sense, not clover grown for seed, and not a wild weed
  of no use.
examples:
- Melilotus stood tall in the field, cut for hay before it set seed.
- Farmers sow melilotus to feed the soil as well as to make hay.
