simpleMeaning: a small piece of data kept for a short time and wiped when you close the link
scope: A small piece of data kept only while you are on a site, then wiped when you close the link; not
  a file kept on your computer for good, and not a sweet biscuit.
examples:
- The site stored a session cookie while I filled in the form.
- When I closed the link, the session cookie was wiped.
