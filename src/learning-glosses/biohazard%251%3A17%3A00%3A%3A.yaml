senseId: 'biohazard%1:17:00::'
synsetId: 09244331-n
simpleMeaning: any bacterium or virus or toxin (a poison made by a living thing) that could be used as
  a weapon in war
scope: Also called biological agent. This is the thing itself that could be used as a weapon, not the
  danger to people or nature that such things cause.
examples:
- The virus was classed as a biohazard because an enemy could use it in war.
- Soldiers were trained to spot a biohazard that could be spread as a weapon.
