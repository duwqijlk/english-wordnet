simpleMeaning: A South African evergreen vine, partly woody, grown for clusters of rosy purple flowers
  followed by edible pods like snap beans; also used as green manure; sometimes classed in Dolichos.
scope: Also called Australian pea and Dolichos lignosus; a flowering vine with edible pods, not a bean
  grown for its seeds and not a vine grown only for its flowers.
examples:
- Dipogon lignosus climbed the fence with rosy purple flowers.
- We planted Dipogon lignosus as green manure.
