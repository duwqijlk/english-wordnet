simpleMeaning: a plant with a large thin white bulb and flat dark green leaves lying over each other,
  used in cooking, thought to come from a wild plant called Allium ampeloprasum
scope: 'Also called scallion: this is the whole plant used in cooking, not just the part eaten as a food
  like an onion.'
examples:
- She planted leeks in rows and used them in soup in winter.
- The leeks in the garden have long white bulbs and flat green leaves.
