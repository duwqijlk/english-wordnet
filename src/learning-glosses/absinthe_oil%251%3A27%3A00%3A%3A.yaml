simpleMeaning: From the leaves of wormwood comes this dark, bitter liquid, used to give taste to the green
  drink.
scope: This dark liquid, also called wormwood oil, comes from wormwood leaves and gives taste to the green
  drink.
examples:
- The green drink owes its taste to absinthe oil.
- The leaves of wormwood yield absinthe oil.
