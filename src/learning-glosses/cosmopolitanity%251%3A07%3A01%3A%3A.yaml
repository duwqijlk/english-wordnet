senseId: 'cosmopolitanity%1:07:01::'
synsetId: 92422266-n
simpleMeaning: the state of being at home anywhere in the world, and open to people and ways from every
  land
scope: This is being at home anywhere in the world and open to every land's people and ways; not being
  a traveller, and not being a citizen of one place only.
examples:
- Her cosmopolitanity showed in the way she moved between cities.
- The cosmopolitanity of the port made it lively.
