simpleMeaning: Its bright, sweet-smelling, pale cream flowers open in short bunches at the ends of the
  stems of this big tough bush.
scope: Also called syringa; a big tough bush with bright, sweet-smelling, pale cream flowers, not the
  shrubby thorny tree of the southeastern United States with white flowers and small black fruit.
examples:
- The mock orange by the fence filled the yard with its sweet smell.
- White mock orange flowers opened in short bunches at the ends of the stems.
