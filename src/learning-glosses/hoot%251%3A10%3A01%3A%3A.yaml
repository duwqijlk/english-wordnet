simpleMeaning: a loud, rough cry, like the cry of an owl
scope: A loud, rough cry, like an owl makes; it is not a cry that shows people are not pleased, not the
  act of shouting loudly, and not the verb sense for the sound an owl makes.
examples:
- We heard a hoot from the owl in the dark tree.
- A loud hoot came from the woods at night.
