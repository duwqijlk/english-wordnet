simpleMeaning: Near dark spots on the sun, a big bright patch most often shows on its bright outer face.
scope: Also called a solar facula, this bright patch sits on the sun's bright outer face and shows most
  often near dark spots on the sun.
examples:
- The facula on the sun's face was easy to see beside the dark sunspots.
- The facula lay close to a group of sunspots.
