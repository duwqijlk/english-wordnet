simpleMeaning: The northern family of Germanic tongues, spoken in Scandinavia and Iceland.
scope: Also called Norse, Nordic, North Germanic, Scandinavian, and Scandinavian language; the northern
  family of Germanic tongues, spoken in Scandinavia and Iceland, not the other Germanic families of the
  mainland.
examples:
- North Germanic language covers Swedish, Danish, and Norwegian.
- Icelandic is a North Germanic language.
