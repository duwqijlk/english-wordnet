senseId: hypersensitised%5:00:00:susceptible:00
synsetId: 02369499-s
simpleMeaning: The body reacts to one thing in particular in a strange or far too strong way, most of
  all with an allergy
scope: Also called allergic, hypersensitive, hypersensitized, and sensitized; a strong reaction to one
  thing in particular, not a mild dislike and not a general weakness of the body.
examples:
- The hypersensitised child broke out in a rash after stroking the cat.
- She is hypersensitised to pollen and sneezes all spring.
