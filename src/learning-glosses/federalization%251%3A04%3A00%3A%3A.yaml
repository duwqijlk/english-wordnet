simpleMeaning: the act of putting a thing under the rule of the government of the whole country
scope: The act of putting a thing under the rule of the government of the whole country; federalisation
  is another name for this sense; not the state of being under such rule, and not a change made by a local
  government.
examples:
- The federalization of the railways took years to complete.
- Federalization put the postal service under central control.
