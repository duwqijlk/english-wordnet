simpleMeaning: In printing, a tool for trimming the thin strips of lead that set the space between lines
  and the thick pieces that hold set type in place
scope: In printing, a tool for trimming thin strips of lead and thick pieces that hold set type in place;
  not a tool for cutting paper and not a tool for setting type.
examples:
- The printer used a slug cutter to trim the leading to the right size.
- He picked up the slug cutter and trimmed the thick pieces of lead.
