simpleMeaning: A person who keeps to the first rules of a faith.
scope: A person who holds to the first principles of a faith, not a supporter of fundamentalism itself
  and not one described by the adjective sense as relating to fundamentalism.
examples:
- The fundamentalist rejected any change to the old text.
- As a fundamentalist, he read the scripture word for word.
