simpleMeaning: giving each person a chance to take part
scope: This describes a way of working that lets each person take part, not a way where only leaders decide
  and others only watch.
examples:
- They chose a participatory democracy where every citizen can vote and speak.
- The class used a participatory method, and every student helped make the plan.
