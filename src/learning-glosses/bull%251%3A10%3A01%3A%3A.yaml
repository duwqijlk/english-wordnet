simpleMeaning: a formal statement from the pope, usually written in old letters and closed with a small
  round piece of lead used as a seal
scope: The pope's formal statement, usually in old letters with a lead seal; it is not a male animal and
  not a person who buys hoping prices will rise.
examples:
- The museum holds a papal bull from 1500, written in old letters and closed with a lead seal.
- A bull from the pope set out new rules for the church.
