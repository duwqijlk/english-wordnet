senseId: 'stigmatization%1:04:00::'
synsetId: 01225977-n
simpleMeaning: The act of marking a person as bad or shameful
scope: The act of marking a person as bad or shameful, with stigmatisation as another name for this sense,
  not the act of praising a person and not the act of punishing a person.
examples:
- The stigmatization of the sick kept them from seeking help.
- Stigmatization can hurt a whole group of people.
