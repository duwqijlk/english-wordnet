simpleMeaning: a tube of plastic or rubber put inside the body to let fluids flow out
scope: A medical tube put in the body to drain fluids, not an electrical part that sends some current
  to another path and not a natural passage that moves blood to another path in the body.
examples:
- The doctor put a shunt in to drain fluid from the man's brain.
- Her shunt had to be checked when fluid built up again.
