simpleMeaning: A wild animal, usually one that hunts other animals, that people do not want around, such
  as a coyote.
scope: A wild animal people see as a pest, usually a hunter, such as a coyote; not a pet and not a farm
  animal.
examples:
- Farmers shot the varmints that took their chickens.
- A varmint had dug under the fence again.
