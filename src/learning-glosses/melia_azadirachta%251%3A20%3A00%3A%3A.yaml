simpleMeaning: A large half-evergreen tree of the East Indies, with sticky gum in its trunk, bitter bark
  used as a tonic and seeds giving scented oil; sometimes put in that genus.
scope: A large East Indian tree, also called neem, arishth, margosa, neem tree, nim tree and Azadirachta
  indica; not a fruit tree and not a palm.
examples:
- Melia azadirachta shades the village square.
- Farmers press oil from the seeds of Melia azadirachta.
