simpleMeaning: A plant of Arizona, New Mexico and Utah with erect stems bearing long, narrow clusters
  of fragrant, puffed-up flowers that range from white to reddish pink.
scope: This is the plant that carries these flowers, not the flowers on their own as the source words
  it. A different East Asian garden plant also goes by the name balloon flower, so the Arizona-to-Utah
  range is the clue here.
examples:
- Balloon flower opens its puffed-up blooms along dry slopes in late spring.
- Hikers in southern Utah often stop to photograph balloon flower in bloom.
