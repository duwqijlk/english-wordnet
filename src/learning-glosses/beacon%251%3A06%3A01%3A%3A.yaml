simpleMeaning: a tower with a light that warns ships passing by of shallow water where they could run
  aground
scope: 'Also called a lighthouse: a tower with a light that warns ships of shallow water, not a radio
  station that sends a guiding signal.'
examples:
- The beacon flashed its warning light over the shoals.
- Ships steered clear of the rocks when they saw the beacon.
