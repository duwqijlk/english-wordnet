simpleMeaning: when you are tired or the ground is mud, to move along on foot with hard, heavy steps
scope: 'Also called pad, plod, slog, tramp, or trudge: to walk with heavy, firm steps when tired or in
  mud, not a quick light walk and not a march.'
examples:
- They footslogged through the mud for hours before they reached the village.
- Too tired to run, she footslogged the last mile home.
