simpleMeaning: loud and bossy in talk, and trying to force other people by speaking to them in a harsh,
  frightening way
scope: 'Also called bullying: loud and bossy in talk that tries to make others do what you say, not wind
  blowing hard in sudden bursts.'
examples:
- His blustery talk scared the new workers, who did not dare to answer back.
- She was blustery with the team and told everyone else to be quiet and do as she said.
