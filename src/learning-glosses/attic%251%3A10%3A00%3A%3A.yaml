simpleMeaning: The way old Greek was said and written in the land round Athens, in Athens, and in Ionia.
scope: The dialect of Attica and Athens, not the adjective for things of Attica and not other Greek dialects;
  also called Classical Greek, Ionic, and the Ionic dialect.
examples:
- Attic was the Greek of Athens and Attica.
- He studied Attic to read old plays.
