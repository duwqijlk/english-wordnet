simpleMeaning: in a way that is hard to spot, using clever tricks
scope: In a way that is hard to spot, using clever tricks; not openly, and not in a plain honest way.
examples:
- He slyly slipped the note into her bag when no one was looking.
- She slyly smiled, pleased that her plan had worked.
