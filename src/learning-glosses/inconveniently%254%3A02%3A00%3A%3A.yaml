senseId: 'inconveniently%4:02:00::'
synsetId: 00198991-r
simpleMeaning: in a way that causes trouble and makes something hard to do or use
scope: This is about a time or way that causes trouble, not about a time or thing that is easy and fits
  well.
examples:
- The bus arrived inconveniently late, after we had already left the stop.
- The shop is inconveniently far from her home, so she rarely goes there.
