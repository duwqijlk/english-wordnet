simpleMeaning: a male worker who makes the audio of a TV or radio show louder or adds noises to it
scope: A male worker who makes the audio of a TV or radio show louder or adds noises; not a soundwoman,
  the woman in the same job, and not a TV presenter.
examples:
- The soundman turned the volume up so everyone in the hall could hear the actor.
- The soundman added the sound of rain to the radio play.
