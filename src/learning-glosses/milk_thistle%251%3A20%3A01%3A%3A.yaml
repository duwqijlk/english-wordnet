simpleMeaning: Any of several rough, prickly-leaved bushes and low shrubs from the Old World, with milky
  sap and yellow flowers; now widespread abroad, often a harmful weed in cultivated soil.
scope: Another name for sow thistle; these are the coarse yellow-flowered kinds, not the tall biennial
  with purple heads and white-blotched leaves.
examples:
- Milk thistle has spread far beyond its native range and now infests pastures and waste ground.
- The milky sap and yellow flowers mark milk thistle among the weeds of a cultivated field.
