simpleMeaning: A kind of air-filled building mix made with an air-entraining agent, or with light fill
  such as blown-up clay lumps or cork bits and vermiculite.
scope: Also called foamed concrete, lightweight aerated concrete, lightweight concrete, ultra-lightweight
  concrete, and variable density concrete; not aerated autoclaved concrete, which is made off-site by
  a different method.
examples:
- Cellular concrete is light and air-filled.
- Builders pour cellular concrete for light walls.
