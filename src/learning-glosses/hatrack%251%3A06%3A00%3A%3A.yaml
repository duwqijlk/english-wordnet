simpleMeaning: A stand with hooks for holding coats and head coverings for a short time
scope: A stand with hooks for holding coats and head coverings for a short time, not a wardrobe and not
  a single wall hook; coatrack and coat rack are other names for this sense.
examples:
- Hang your coat on the hatrack by the door.
- The hatrack held coats for the guests.
