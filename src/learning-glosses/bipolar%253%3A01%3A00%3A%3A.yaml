simpleMeaning: about or happening in the areas at both ends of the earth, the far north and the far south
scope: This is about places at both ends of the earth, not about an illness of the mind that changes a
  person's moods.
examples:
- The plant has a bipolar distribution, growing near both the far north and the far south.
- Scientists study bipolar ice patterns at both ends of the earth.
