simpleMeaning: A word for nothing at all, used when a score or amount comes to none.
scope: Also called nothing, zero, zip, naught, aught, nil, cipher, nix, nada, null, cypher, zilch, and
  zippo, this is a word for no amount at all, not a thing of any worth.
examples:
- Our team ended the game with a goose egg.
- After all that work, she got a goose egg for her efforts.
