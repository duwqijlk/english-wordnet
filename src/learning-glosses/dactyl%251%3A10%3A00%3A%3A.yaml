simpleMeaning: a beat unit in verse with one strong beat followed by two weak beats
scope: A beat unit in verse with one strong beat followed by two weak beats; not a finger or toe and not
  a whole line of verse.
examples:
- The dactyl gives the line a falling beat.
- Each dactyl in the poem has one strong beat and two weak ones.
