simpleMeaning: to go through a full set of steps, from the first step to the last
scope: This verb means to go through a full set of steps, not the two-wheeled vehicle and not to happen
  again and again as a repeating set.
examples:
- The washing machine cycles through wash and rinse before it stops.
- This machine cycles on its own, going through each step without help.
