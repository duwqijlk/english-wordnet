simpleMeaning: a climbing woody plant with flowers that grows in the south of the United States, and whose
  cut stems show a cross shape
scope: 'Also called quarter-vine, cross vine and trumpet flower: a climbing woody plant with flowers,
  not a tree and not a vine grown for its fruit.'
examples:
- The quartervine wound round the tree and bore bright flowers.
- A cut stem of the quartervine showed a clear cross shape.
