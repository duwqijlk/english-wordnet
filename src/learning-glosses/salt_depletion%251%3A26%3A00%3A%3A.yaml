simpleMeaning: The balance of salts in the body is upset when salt leaves through being sick, sweating
  a lot, passing water, or loose bowels and is not put back
scope: Salt leaves the body and is not put back, upsetting the balance of salts in the body.
examples:
- Salt depletion followed his being sick and sweating a lot.
- Salt depletion upsets the balance of salts in the body.
