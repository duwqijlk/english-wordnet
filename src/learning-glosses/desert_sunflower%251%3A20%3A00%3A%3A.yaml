simpleMeaning: A slender, hairy plant bearing golden-yellow flower heads above sparse leaves, found in
  sandy desert from southeastern California and western Arizona to southwestern Utah and northwestern
  Mexico.
scope: A slender desert plant with golden flower heads, not the tall sunflower grown on farms.
examples:
- A desert sunflower nodded in the hot wind.
- We spotted desert sunflowers blooming on the sand dunes.
