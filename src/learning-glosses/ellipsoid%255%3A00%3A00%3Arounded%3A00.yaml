simpleMeaning: having the shape of a stretched round ball, longer in one direction than the other
scope: Shaped like a stretched round ball; ellipsoidal is another name for this sense, not the noun for
  the surface itself whose flat cuts are ellipses.
examples:
- The ellipsoid stone was longer one way than the other.
- Planets are not round; they are ellipsoid in shape.
