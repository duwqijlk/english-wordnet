simpleMeaning: A tuberous-rooted plant of or bred from one wild species, with showy, many-colored flower
  heads of radiating petals, native to the mountains of Mexico, Central America and Colombia.
scope: The whole plant, tuberous roots included, not just the flower head; it covers both plants of the
  wild species and the cultivated kinds bred from it, not one single variety.
examples:
- The dahlias in the border opened their first heavy blooms in late August.
- She dug up the dahlia tubers before the first frost.
