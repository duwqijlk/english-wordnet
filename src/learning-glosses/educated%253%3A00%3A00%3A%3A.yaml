simpleMeaning: having learned a lot through school or study, especially having more knowledge than the
  average person
scope: This is about a person who has learned a lot, especially more than the average person; it is not
  about the act of teaching or learning itself.
examples:
- She is a well-educated woman with two university degrees.
- Educated workers often find it easier to get good jobs.
