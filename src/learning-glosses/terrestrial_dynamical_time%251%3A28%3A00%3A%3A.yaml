simpleMeaning: In astronomy, a measure of time set by the Earth's path round the sun, where earth time
  is mean sun time put right for the Earth's uneven motions.
scope: Also called terrestrial time and ephemeris time, this is, in astronomy, a measure of time set by
  the Earth's path round the sun, where earth time is mean sun time put right for the Earth's uneven motions.
examples:
- Terrestrial dynamical time follows Earth's orbit.
- Astronomers use terrestrial dynamical time.
