simpleMeaning: In the study of the body, each job it does has a fairly small place of its own in one part
  of the body
scope: Also called localization, localisation, localisation of function, localisation principle, and localization
  of function, this says each job of the body has a fairly small place of its own.
examples:
- The localization principle gives each job of the body its own place.
- By the localization principle, each job of the body belongs in one part of it.
