simpleMeaning: Rush about breaking and wrecking things, acting wild and without care.
scope: Wild, violent action that breaks and wrecks things; not a calm protest and not a planned attack.
examples:
- The mob rampaged through the town, smashing windows.
- The bull escaped and rampaged across the field.
