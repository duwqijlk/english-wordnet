simpleMeaning: a blood vessel formed when small side tubes join, draining the hip joints and thigh muscles,
  and emptying into a large vein deep in the pelvis
scope: 'Also called vena obturatoria: a vein that drains the hip and thigh, not an artery and not a vein
  of the leg.'
examples:
- The obturator vein carries blood away from the hip joint.
- Surgeons take care not to cut the obturator vein during the operation.
