simpleMeaning: a long pole that holds the highest sail, set above the topsail
scope: A long pole holding a high sail on a ship, also called topgallant yard, and not a lower spar or
  the sail itself.
examples:
- The top-gallant yard was raised to catch the wind.
- Sailors climbed to the top-gallant yard to set the sail.
