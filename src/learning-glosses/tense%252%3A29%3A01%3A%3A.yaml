simpleMeaning: to start to feel nervous and worried and not at ease
scope: This is about starting to feel nervous yourself, not making someone else feel nervous, and not
  a thing pulled tight.
examples:
- He tensed up when he saw his opponent enter the room.
- I always tense up before I speak in front of a large group.
