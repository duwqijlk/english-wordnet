senseId: 'kuomintang%1:14:00::'
synsetId: 08277612-n
simpleMeaning: The party set up in 1911 by Sun Yat-sen; it ruled China under Chiang Kai-shek from 1928
  to 1949, when the Communists took power, and then ruled Taiwan.
scope: 'Also called Guomindang: the party founded by Sun Yat-sen that ruled China until 1949 and then
  Taiwan, not the Communist Party that took power in 1949 and not a party of mainland China today.'
examples:
- The Kuomintang ruled China from 1928 until 1949.
- After 1949 the Kuomintang governed Taiwan.
