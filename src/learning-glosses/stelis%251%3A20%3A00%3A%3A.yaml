simpleMeaning: Long thin flower stems hold lots of tiny blooms on these small orchids of the warm parts
  of America.
scope: One of many small orchids from the warm parts of America, not a large one.
examples:
- The stelis has long thin stems of tiny flowers.
- A stelis opened its small blooms along a slender stem.
