schema: oewn-learning-gloss-v2
senseId: 'basin%1:15:00::'
synsetId: 08536123-n
simpleMeaning: all the land where the streams flow into one river, and all the water from that land goes
  out at the same place
scope: This sense is an area of land around a river; it is not the fixed sink in a bathroom and not a
  bowl for holding food or water.
examples:
- Flood control is important across the whole river basin.
- Farms in the basin use water from the river and its small streams.
