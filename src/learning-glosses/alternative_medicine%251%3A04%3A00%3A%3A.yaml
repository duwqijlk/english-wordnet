simpleMeaning: Some healing leaves drugs out altogether, and may instead use cures made from herbs, self-awareness,
  learning from signs of the body, or thin needles in the skin.
scope: Healing that leaves drugs out, and may use herbs or thin needles in the skin instead, goes by this
  name.
examples:
- They turned to alternative medicine and took herbs instead of drugs.
- The alternative medicine plan left out drugs and used acupuncture.
