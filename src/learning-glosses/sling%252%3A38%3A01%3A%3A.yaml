simpleMeaning: to move something by using a loop of strap or rope that holds it
scope: To move something with a supporting loop of strap or rope; not to throw something hard, and not
  to hold or carry something in a cloth support.
examples:
- They sling the cargo onto the ship with strong straps.
- The men sling the piano up to the second floor with ropes.
