simpleMeaning: hard stuff made mostly of keratin (the stuff in hair and nails) that covers pointed head
  growths of hoofed animals and forms hooves, claws and nails
scope: The stuff itself; it is not the pointed horn on an animal's head, not a musical instrument, and
  not a thing that makes a loud warning sound.
examples:
- The comb is made of horn.
- They made the small buttons from horn.
