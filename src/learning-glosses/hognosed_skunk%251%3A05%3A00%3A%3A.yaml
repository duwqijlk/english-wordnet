simpleMeaning: This big animal of the south-west of North America and Mexico has a bare muzzle and a white
  back and tail.
scope: This animal of the south-west of North America and Mexico is also called a badger skunk, a hog-nosed
  skunk, or a rooter skunk.
examples:
- A hognosed skunk has a bare muzzle.
- Hognosed skunks live in Mexico.
