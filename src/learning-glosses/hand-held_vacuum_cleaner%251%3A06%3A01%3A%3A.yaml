simpleMeaning: Run from batteries you can charge again or from a wall socket, this light machine picks
  up small spills and is much used for them.
scope: Also called hand-held vacuum, handheld vacuum and handheld vacuum cleaner, this is a light machine
  for small spills, not a big machine for whole rooms.
examples:
- The hand-held vacuum cleaner ran on its charged batteries.
- He plugged the hand-held vacuum cleaner into the wall socket.
