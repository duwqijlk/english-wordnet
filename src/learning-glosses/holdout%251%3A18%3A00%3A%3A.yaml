simpleMeaning: A person in talks who holds back from agreeing, hoping to win better terms.
scope: A person in talks who refuses to agree in the hope of better terms; not the refusal itself.
examples:
- Their star pitcher was a holdout for six weeks.
- The holdout waited until the club raised its offer.
