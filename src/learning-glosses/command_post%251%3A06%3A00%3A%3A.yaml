simpleMeaning: the place where a military leader runs and plans the work of the troops
scope: A military headquarters where one leader runs and plans the work of the troops; general headquarters
  is another name for this sense, not a front-line fighting place.
examples:
- The general gave the order from the command post.
- Radio messages came in to the command post all night.
