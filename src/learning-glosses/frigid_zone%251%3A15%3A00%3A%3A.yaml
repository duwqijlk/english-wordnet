simpleMeaning: the part of the Earth's surface that forms a cap over a pole, known for its very cold weather
scope: This is the part of the Earth's surface forming a cap over a pole, known for very cold weather;
  polar region and polar zone are other names for it, not the warm lands near the equator or the mild
  lands in between.
examples:
- Few plants grow in the frigid zone.
- The frigid zone has long dark winters.
