simpleMeaning: A machine in the home that cleans clothes and household cloth by itself once it is started.
scope: This is a machine that washes clothes; not the flat ring that stops a leak, and not a person who
  washes things for a living.
examples:
- She put the dirty shirts in the washer and pressed start.
- Our old washer broke down, so we bought a new one.
