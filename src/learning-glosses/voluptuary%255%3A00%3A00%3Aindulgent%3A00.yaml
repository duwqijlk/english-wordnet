simpleMeaning: showing rich comfort and giving great pleasure to the senses
scope: 'Also called luxurious, luxuriant, voluptuous, epicurean and sybaritic: showing rich comfort that
  pleases the senses, not plain or simple and not merely costly.'
examples:
- The voluptuary feast lasted late into the night.
- She decorated the room in a voluptuary style, with silk and gold.
