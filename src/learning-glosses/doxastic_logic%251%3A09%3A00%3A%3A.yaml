simpleMeaning: the study of how what people believe, and what they do not believe, fits together under
  rules about what must be so and what may be so
scope: The rules for how beliefs fit together, not the study of what is true in the world and not a list
  of what one person believes.
examples:
- Doxastic logic asks how beliefs can fit together without clashing.
- In doxastic logic, the class studied rules for what a person must believe.
