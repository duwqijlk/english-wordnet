simpleMeaning: of a colour that has no hue (no red, blue, or other colour in it), at any point between
  white and black, light or dark
scope: 'Also called gray, grey, and grayish: this describes a colour between white and black, not a bright
  colour and not pure white or pure black.'
examples:
- A man with greyish hair stood by the door.
- She wore a greyish coat that was neither white nor black.
