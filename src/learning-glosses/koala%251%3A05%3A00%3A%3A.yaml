simpleMeaning: A tailless, slow-moving marsupial from Australia that lives in trees, has grey fur and
  furry ears, and eats eucalyptus leaves and bark.
scope: Another name for the kangaroo bear and koala bear; not a wombat, a possum or a true bear.
examples:
- The koala slept high in the eucalyptus tree.
- Koalas feed on eucalyptus leaves and bark.
