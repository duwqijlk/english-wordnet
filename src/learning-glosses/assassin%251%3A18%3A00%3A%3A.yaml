scope: This is a person who kills in a surprise attack, especially a well-known person in politics, and
  who is often paid to do it; not a member of the old secret Muslim group that killed Christian Crusaders.
examples:
- The assassin waited in hiding and shot the president.
- Police caught the assassin who had been paid to kill the prime minister.
