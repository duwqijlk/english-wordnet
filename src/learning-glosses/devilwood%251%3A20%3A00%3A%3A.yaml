simpleMeaning: A small tree of the southern United States with loose bunches of dull white flowers and
  then dark purple fruit
scope: This is a small tree of the southern United States with dull white flowers and dark purple fruit,
  not a big tree and not a tree with bright red flowers.
examples:
- Devilwood grows along the roads of the southern United States.
- The devilwood bore dark purple fruit after its white flowers.
