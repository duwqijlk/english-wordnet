simpleMeaning: to make water cloudy by stirring up the bits that have sunk to the bottom
scope: To make water cloudy by stirring up what has sunk in it, not to stir up trouble or feelings.
examples:
- The boat's wake roiled the shallow water.
- The storm roiled the river until it ran brown.
