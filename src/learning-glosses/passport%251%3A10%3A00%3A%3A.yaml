simpleMeaning: a document given by a country to one of its citizens, so that person can travel to other
  countries and come back home
scope: This is the document a country gives to one of its citizens for travel to other countries, not
  a quality or thing that helps a person get accepted somewhere.
examples:
- She showed her passport at the airport before her flight.
- He lost his passport while travelling in another country.
