simpleMeaning: a court case where one side says the other side broke the law that deals with private wrongs,
  not crimes
scope: This is a court case in which one side says the other broke the law about private wrongs; not a
  criminal trial and not a case brought by the state to punish a crime.
examples:
- She filed a civil suit against the firm for breaking the deal.
- The civil suit asked the court to order the builder to pay for the damage.
