simpleMeaning: Bare wires that carry power are covered with this sticky strip, which keeps out water.
scope: Also called insulating tape, this names the sticky strip that keeps out water, used to cover bare
  wires that carry power.
examples:
- He wrapped friction tape around the bare wires.
- Friction tape keeps water out where wires are bare.
