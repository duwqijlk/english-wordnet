simpleMeaning: A chemical made of one middle atom with other atoms joined to it, named by that middle
  atom.
scope: This is a chemical made of one middle atom with other atoms joined to it; complex is another name
  for this sense, not a simple chemical made of one kind of atom and not a mix of separate chemicals.
examples:
- The coordination compound has a metal atom at its centre.
- Students drew a coordination compound with six atoms joined to one middle atom.
