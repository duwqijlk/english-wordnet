simpleMeaning: the seat of a plane that can be shot out in trouble, letting the pilot float down under
  a parachute
scope: A pilot's escape seat, not a small pill container or a seed case, and not the act of enclosing
  something.
examples:
- When the engine failed, the pilot pulled the handle and the capsule shot him clear of the wreck.
- The capsule carried the pilot away from the burning jet before his parachute opened.
