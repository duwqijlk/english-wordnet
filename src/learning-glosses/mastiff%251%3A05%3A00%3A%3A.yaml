simpleMeaning: an old kind of large, strong dog with a deep chest and smooth hair, used mainly to guard
  people and places
scope: This is a large, strong guard dog, not a small pet dog and not a dog kept only for hunting.
examples:
- The mastiff stood by the gate and watched everyone who came in.
- Their mastiff is gentle with the children but guards the house well.
