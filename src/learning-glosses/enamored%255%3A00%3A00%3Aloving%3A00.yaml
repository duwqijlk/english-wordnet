simpleMeaning: showing a strong love or liking that is not guided by reason and seems silly
scope: 'Also called smitten, potty and infatuated: showing too much love or liking without reason; not
  just liking someone in a normal, sensible way.'
examples:
- She was enamored with the young singer and followed him from town to town.
- He became enamored of the plan and would not listen to any warnings.
