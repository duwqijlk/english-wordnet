simpleMeaning: Water in a pot cools the smoke of this pipe from the East for smoking tobacco, reaching
  the pot through a long bendy tube.
scope: This water-cooled pipe for smoking tobacco is also called hookah, shisha, chicha, hubble-bubble,
  hubbly-bubbly, kalian, narghile, nargileh, sheesha, and water pipe, not a pipe that sends the smoke
  straight to the mouth.
examples:
- He smoked tobacco through a calean, and the smoke cooled as it passed through the water.
- She drew on the calean, and the smoke came cool through the water.
