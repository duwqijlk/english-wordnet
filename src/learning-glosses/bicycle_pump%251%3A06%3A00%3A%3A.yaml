simpleMeaning: a small tool used to push air into the round rubber tyres of a bike
scope: A small tool for pushing air into a bike's tyres, not a pump for a car tyre and not a pump for
  a ball.
examples:
- He used the bicycle pump to fill the flat tyre before the ride.
- The bicycle pump stood by the garage door.
