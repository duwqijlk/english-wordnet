simpleMeaning: With slim legs and a smooth coat, this hoofed mammal has a thin strip of hair down the
  back of its neck.
scope: This hoofed mammal with slim legs and a smooth coat is also called equine.
examples:
- The equid stood on slim legs, its mane a thin strip down its neck.
- Zebras and horses are equids.
