senseId: 'rectitude%1:07:00::'
synsetId: 04833854-n
simpleMeaning: a way of living that is good and right, coming from being honest and doing the right thing
scope: This is about a person's whole honest, right way of living; it is not just one honest act, and
  it is not following rules only because you must.
examples:
- People trusted him for his rectitude; he never lied or cheated.
- Her rectitude made her refuse the money and tell the truth.
