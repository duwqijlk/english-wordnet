simpleMeaning: likely to become excited with little warning, especially in horses
scope: Quick to become excited, not anxious or worried, not the sense of being easily agitated or highly
  strung, and not the medical sense about the body's nerves; flighty, skittish and spooky are other names
  for this sense.
examples:
- The nervous colt shied at every passing car.
- Riders must stay calm around nervous horses.
