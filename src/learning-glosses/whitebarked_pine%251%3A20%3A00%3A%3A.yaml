simpleMeaning: Its outer covering is smooth and pale grey and its wood soft and breaks easily, in this
  small pine from the west of North America, close to the limber pine.
scope: Also called whitebark pine, this small pine from the west of North America is the one whose outer
  covering is smooth and pale grey and whose wood is soft and breaks easily, close to the limber pine.
examples:
- Whitebarked pine grew in the west of North America.
- The whitebarked pine had an outer covering that was smooth and pale grey.
