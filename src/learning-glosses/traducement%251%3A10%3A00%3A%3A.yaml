simpleMeaning: A false charge that someone did wrong, or a spiteful false telling of what someone said
  or did
scope: A false charge or a spiteful false telling of what someone said or did; calumny, defamation, calumniation,
  hatchet job and obloquy are other names for this sense, and not a true charge or an honest report.
examples:
- The traducement ruined his good name.
- She sued over the traducement in the newspaper.
