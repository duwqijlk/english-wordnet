senseId: 'hypothetical_imperative%1:10:00::'
synsetId: 06669019-n
simpleMeaning: 'To reach a goal you want, you must do one thing: this rule names it'
scope: A rule about what to do to reach a chosen goal, not a rule that binds you whatever you want and
  not a wish.
examples:
- If you want to pass the test, study every day — that is a hypothetical imperative.
- A hypothetical imperative tells you what to do only when you want a certain result.
