simpleMeaning: Stopping a thing from happening by seeing it coming and dealing with it well.
scope: The act of heading a thing off by seeing it coming and dealing with it well; not merely waiting
  for it to happen.
examples:
- Her forestalling of the strike saved the factory a week of trouble.
- Forestalling the question, he answered it before anyone asked.
