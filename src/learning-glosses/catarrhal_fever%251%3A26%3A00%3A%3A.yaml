simpleMeaning: any of several ills of farm animals with a high heat and swelling of the breathing passages
scope: An ill of farm animals, not a cold and not a fever in people; it brings swelling of the breathing
  passages.
examples:
- Catarrhal fever struck the cattle that winter.
- The vet treated the sheep for catarrhal fever.
