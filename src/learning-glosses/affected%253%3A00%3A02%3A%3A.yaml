simpleMeaning: feeling strong emotion because of something, so that you show that feeling in what you
  say or do
scope: 'Also called moved, touched, and stirred: feeling strong emotion that you show, not speaking or
  acting in a false way to impress people.'
examples:
- He was deeply affected by the sad story and began to cry.
- She was so affected by their kindness that she could not speak.
