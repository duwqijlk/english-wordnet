simpleMeaning: The sense that lets your mouth notice and separate sweet, sour, bitter and salty flavours.
scope: This is the power to tell flavours apart, not the act of sensing one with your tongue, and not
  the flavour sensation you notice while eating.
examples:
- A bad cold can take away your sense of taste.
- Some medicines leave you with almost no sense of taste.
