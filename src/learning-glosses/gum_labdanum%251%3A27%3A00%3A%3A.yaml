simpleMeaning: Some rockroses give a juice that is a dark brown to greenish sticky plant stuff with a
  sweet smell, used to hold the smell in perfumes.
scope: Also called labdanum, this is a sweet-smelling sticky plant stuff that holds the smell in perfumes,
  not a gum for chewing and not a perfume itself.
examples:
- The gum labdanum gave the perfume a deep, lasting smell.
- Workers cut the rockrose to draw out gum labdanum as a thick juice.
