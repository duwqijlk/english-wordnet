simpleMeaning: All together, the people who hear one radio show, station or broadcaster
scope: All the people who hear one radio show, station or broadcaster, not the people who watch television
  and not the people who make the show.
examples:
- The station's listenership grew after the morning show began.
- Radio listenership on mobile phones has risen in recent years.
