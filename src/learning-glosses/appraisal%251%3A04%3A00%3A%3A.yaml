simpleMeaning: a careful judgement by a skilled person about how good something or someone is, how much
  there is, and what else it is like
scope: A skilled person's judgement about someone or something, not the written paper that gives the value
  of something for insurance or tax.
examples:
- An expert gave an appraisal of the painting, noting its quality and condition.
- Her appraisal of the new worker was based on his skill and speed.
