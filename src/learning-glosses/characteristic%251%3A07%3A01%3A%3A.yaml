simpleMeaning: Any quality of a machine that can be measured, tested under set conditions
scope: Any quality of a machine that can be measured under set conditions, not the whole-number part of
  a log and not a striking quality of a thing.
examples:
- The characteristic of the motor was tested under strict conditions.
- Each characteristic of the device was measured with care.
