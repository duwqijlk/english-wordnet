simpleMeaning: an official written command issued under the law that usually forces a defendant to appear
  in a civil case, or face a default judgment
scope: This is not a course of action, a mental operation, a natural growth on a body, or a gradual natural
  change, but a court order to appear.
examples:
- The sheriff served process on the defendant at his home.
- Failure to answer the process can lead to a default judgment.
