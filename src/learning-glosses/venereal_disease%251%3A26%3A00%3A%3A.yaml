simpleMeaning: An infection that can be passed on and is caught through sex or touch of the sex parts.
scope: An infection caught through sex; dose, sexually transmitted disease, social disease and venereal
  infection are other names for this sense; not a cold and not a skin rash.
examples:
- Venereal disease can be passed on through sex.
- The clinic treats venereal disease without judgment.
