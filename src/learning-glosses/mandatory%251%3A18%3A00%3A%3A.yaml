simpleMeaning: one given an official order giving them power to act
scope: One given an official order giving them power to act, not the land itself that is put under another
  power's care, and not simply one who gives orders.
examples:
- The country served as the mandatory of the small territory.
- The mandatory was told to keep order until the people could rule themselves.
