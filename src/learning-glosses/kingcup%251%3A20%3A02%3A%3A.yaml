simpleMeaning: Bright yellow blooms like those of a yellow wildflower mark this plant of wet ground in
  Europe and North America.
scope: Also called a cowslip, a marsh marigold, a meadow bright, or a water dragon, this wet-ground plant
  bears bright yellow blooms like those of a yellow wildflower.
examples:
- Kingcups lined the wet edge of the pond.
- A kingcup stood in the wet ground with bright yellow blooms.
