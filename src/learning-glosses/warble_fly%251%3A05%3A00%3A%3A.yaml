simpleMeaning: Under the skin of cattle, the young of this hairy insect that looks like a bee make sore
  lumps.
scope: Though it looks like a bee, this hairy insect is the one whose young make sore lumps under the
  skin of cattle.
examples:
- A warble fly was found near the cows, and lumps showed under their skin.
- Sore lumps under the skin of a cow came from a warble fly.
