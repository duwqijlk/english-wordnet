simpleMeaning: a very thin thread made of glass that carries light along it, used in bunches to send pictures
scope: A very thin thread made of glass that carries light along it, used in bunches to send pictures;
  optical fiber, glass fiber and glass fibre are other names for this sense, not a wire that carries power
  and not a thread of cloth.
examples:
- The optical fibre guides light along its glass thread.
- An optical fibre can carry a picture in a thin beam.
