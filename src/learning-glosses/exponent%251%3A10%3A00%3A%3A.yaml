simpleMeaning: In maths, a number or sign written above another number to show how many times that number
  is multiplied by itself.
scope: 'Also called a power or an index: in maths, the sign that shows how many times a number is multiplied
  by itself, not a person who explains ideas.'
examples:
- In 2³, the exponent is 3.
- The exponent tells you to multiply the base by itself three times.
