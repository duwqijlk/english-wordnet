simpleMeaning: Planted widely as ground cover, this low plant in tufts lives for years, with needle-like
  leaves, green all year, and pink or white flowers, from the United States.
scope: 'Also called dwarf phlox, moss phlox, and moss pink: a low plant in tufts that lives for years,
  with needle-like leaves, green all year, and pink or white flowers, from the United States and planted
  widely as ground cover.'
examples:
- They planted mountain phlox as ground cover.
- The mountain phlox had needle-like leaves and white flowers.
