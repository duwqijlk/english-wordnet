simpleMeaning: The dead dialect of the Norse tongue that was spoken in Iceland until about 1600.
scope: The dead dialect of the Norse tongue spoken in Iceland until about 1600, not the Norse tongue as
  a whole and not the living tongue of Iceland today.
examples:
- Old Icelandic was spoken in Iceland until about 1600.
- Scholars read Old Icelandic sagas today.
