senseId: 'quasi-ngo%1:14:00::'
synsetId: 08067236-n
simpleMeaning: An organisation paid for by the government that still acts on its own, apart from the government.
scope: 'Also called a quango: an organisation paid for by the government that still acts on its own, not
  a fully independent organisation and not a part of the government itself.'
examples:
- The quasi-NGO gets most of its money from the state but runs its own affairs.
- The quasi-NGO published a report that went against the government line.
