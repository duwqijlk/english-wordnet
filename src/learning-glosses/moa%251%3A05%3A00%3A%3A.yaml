simpleMeaning: A bird of New Zealand that could not fly and is now gone from the earth
scope: A bird of New Zealand that could not fly and no longer lives, not a living flightless bird and
  not a bird from elsewhere.
examples:
- The moa once lived in the forests of New Zealand.
- The moa is gone from the earth, but its bones are still found in New Zealand.
