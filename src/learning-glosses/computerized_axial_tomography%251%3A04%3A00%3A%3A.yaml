simpleMeaning: doctors get flat slices of the organs inside the body from X rays, joined by a machine
  into a set of pictures along one line
scope: 'Also called computed axial tomography, computed tomography, and computerized tomography: a way
  of seeing inside the body with X rays, not a single X-ray picture and not an ultrasound scan.'
examples:
- Computerized axial tomography gave doctors flat slices of the organ.
- The computerized axial tomography took only a few minutes.
