simpleMeaning: Life lived on the edges, in the small parts that most people pass by and do not care about
scope: Also called hole-and-corner, this is life on the edges, in small parts that do not matter much,
  not a plan carried out in secret.
examples:
- She spent her hole-in-corner years in a quiet village no one had heard of.
- His hole-in-corner job kept him far from the busy centre of town.
