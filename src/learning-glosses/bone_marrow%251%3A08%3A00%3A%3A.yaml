simpleMeaning: Inside the hollow of the body's hard frame sits a web of connective tissue, rich in fat.
scope: This fat-rich web of connective tissue fills the hollow parts of the skeleton, and it is also called
  marrow.
examples:
- They took a sample of bone marrow.
- They studied the bone marrow sample.
