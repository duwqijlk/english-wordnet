simpleMeaning: to put rings of flowers or leaves around something to make it look fine
scope: This is putting rings of flowers or leaves around something to make it look fine; not the noun
  sense of a flower ring itself and not simply putting flowers on a thing.
examples:
- They garlanded the statue with flowers.
- The children garlanded the gate with leaves for the feast.
