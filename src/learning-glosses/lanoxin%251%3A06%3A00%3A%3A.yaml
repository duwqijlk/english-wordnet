simpleMeaning: A heart drug of the digitalis kind, used to treat a failing heart with fluid build-up or
  an uneven heartbeat; it helps the heart beat with more force.
scope: A heart drug used for a failing heart or an uneven heartbeat, also called digoxin; its near kin
  are other heart drugs, such as other digitalis drugs.
examples:
- Lanoxin helps the heart beat more forcefully.
- The doctor gave her Lanoxin for her failing heart.
