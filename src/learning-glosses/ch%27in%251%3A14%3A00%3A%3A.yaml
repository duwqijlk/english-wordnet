simpleMeaning: The Chinese royal line, from 246 BC to 206 BC, that set up the first strong central rule
  of one emperor and built much of the Great Wall.
scope: The Chinese royal line from 246 BC to 206 BC, also called Ch'in dynasty, Qin and Qin dynasty; not
  a later Chinese royal line.
examples:
- The Ch'in built much of the Great Wall.
- The Ch'in set up the first strong central rule in China.
