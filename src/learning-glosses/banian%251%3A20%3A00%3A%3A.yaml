simpleMeaning: Shoots hanging in the air grow down to the ground from this tree from India and take root
  as new trunks.
scope: This tree is also called banyan, banian tree and banyan tree, and it is not the loose jacket once
  worn in India.
examples:
- The banian sent out shoots that hung in the air and grew down to the ground.
- New trunks of the banian grew from shoots that hung in the air.
