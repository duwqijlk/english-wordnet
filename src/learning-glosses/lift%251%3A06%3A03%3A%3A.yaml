simpleMeaning: A pad or insert worn inside a shoe or boot that makes the wearer seem taller or makes up
  for a leg that is shorter than the other.
scope: A removable insert that adds height or evens out the legs, not one of the stacked layers that form
  a shoe's heel.
examples:
- He slipped a lift into his left shoe so his legs looked even.
- The lift added a little height inside his boot.
