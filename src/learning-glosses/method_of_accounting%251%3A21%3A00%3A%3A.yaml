senseId: 'method_of_accounting%1:21:00::'
synsetId: 13427135-n
simpleMeaning: A bookkeeper's list, in time order, of what a business owes and what it is owed, kept as
  part of its book of records.
scope: A bookkeeper's list, in time order, of what a business owes and what it is owed, also called accounting
  or an accounting system, kept as part of its main book of records; not a single bill and not a tax form.
examples:
- The method of accounting lists every debit and credit in time order.
- Our method of accounting forms part of the ledger of accounts.
