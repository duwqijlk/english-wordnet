scope: A prized food fish of the northern Atlantic and Med, its body greenish-blue with dark bars and
  few scales, if any; also called common mackerel; not any of many small silvery North American carp-like
  fishes, especially of the genus Notropis, nor a thing that shines, with light given out or thrown back,
  nor a swollen bruise from a blow to the eye.
examples:
- Their shiner swam at dawn.
- The shiner was caught at noon.
