simpleMeaning: the part of astronomy that studies how natural and man-made bodies move in space
scope: The part of astronomy that studies how bodies move in space, not the study of the stars themselves
  and not the building of rockets.
examples:
- Astrodynamics helps plan the path of a satellite.
- She studied astrodynamics to work out how the probe would travel to Mars.
