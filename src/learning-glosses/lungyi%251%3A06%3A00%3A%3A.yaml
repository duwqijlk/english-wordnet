simpleMeaning: In India, Pakistan and Burma, a bright fabric wrap, cotton or silk, worn as a skirt, loincloth
  or sash.
scope: Another name, alongside longyi and lungi, for the long South Asian wrap; it is not a different
  garment.
examples:
- He bought a brightly colored lungyi at the market.
- The lungyi hung loosely around his waist.
