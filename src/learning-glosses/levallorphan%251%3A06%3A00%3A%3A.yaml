simpleMeaning: 'A drug sold as Lorfan that works against morphine: it stops the slow, shallow breathing
  that too much morphine brings on, yet leaves morphine''s power to kill pain untouched.'
scope: A drug that undoes morphine's harm to breathing without undoing its pain relief, unlike morphine
  itself, which eases pain but can slow breathing.
examples:
- The doctor gave him levallorphan to steady his breathing after the morphine overdose.
- Levallorphan kept the pain relief while the patient's breathing came back to normal.
