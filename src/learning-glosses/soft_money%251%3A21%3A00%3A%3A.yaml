simpleMeaning: Cash gifts for politics, given in a way that avoids the rules for United States national
  election campaigns, as by gifts to a political action group
scope: Cash gifts for politics, given in a way that avoids the rules for United States national election
  campaigns, as by gifts to a political action group; not gifts given openly under the rules, and not
  gifts to a charity.
examples:
- Soft money flowed into the campaign through outside groups.
- The new law aimed to limit soft money.
