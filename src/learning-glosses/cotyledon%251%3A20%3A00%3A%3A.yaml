simpleMeaning: a first leaf that forms in a seed before the young plant comes out
scope: The first leaf of a young plant, still inside the seed, not a grown leaf on a full plant and not
  the seed coat.
examples:
- The cotyledon feeds the seedling until it can make its own food.
- Each cotyledon in the seed holds food for the young plant.
