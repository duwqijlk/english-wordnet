simpleMeaning: having a benefice (a church job that gives the person money or land), or coming from such
  a job
scope: This describes something that has or comes from such a church job. It is not the person who gets
  money or other benefits, and not the word role of a person who gains from an action.
examples:
- The beneficiary priest held a church post that came with land and money.
- He was a beneficiary baron, with land held from his church post.
