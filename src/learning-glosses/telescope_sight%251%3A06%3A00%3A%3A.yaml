simpleMeaning: a small tube with lenses, fixed on a gun, that makes far things look near and helps the
  shooter aim
scope: 'Also called a telescopic sight: a sight fixed on a gun, not a hand-held tube for looking at stars
  and not the plain metal marks on a gun barrel.'
examples:
- He looked through the telescope sight and lined up the target.
- The hunter fitted a new telescope sight to his rifle.
