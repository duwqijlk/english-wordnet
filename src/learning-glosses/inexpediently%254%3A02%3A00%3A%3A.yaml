senseId: 'inexpediently%4:02:00::'
synsetId: 00335662-r
simpleMeaning: in a way that is not wise or helpful for the aim in hand
scope: Doing something in a way that is not wise or helpful for the aim in hand; not merely doing it slowly
  and not breaking a rule.
examples:
- He acted inexpediently and lost the deal.
- The plan was carried out inexpediently, wasting time and money.
