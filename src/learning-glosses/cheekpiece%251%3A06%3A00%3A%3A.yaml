simpleMeaning: one of the two straps on a horse's head gear that join the mouth bar to the top part
scope: One of two straps on a horse's head gear, not a strap that holds the saddle and not the band across
  the horse's nose.
examples:
- The cheekpiece was too tight and rubbed the horse.
- He buckled the cheekpiece to the bit.
