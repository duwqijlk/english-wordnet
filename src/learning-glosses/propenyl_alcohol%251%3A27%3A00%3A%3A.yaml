simpleMeaning: a liquid chemical with one carbon link, that can still join to other things, found in wood
  spirit, and used to make resins, softeners for plastics, and drugs
scope: 'Also called allyl alcohol: a liquid chemical found in wood spirit, not wood spirit itself and
  not a finished plastic or drug.'
examples:
- Propenyl alcohol is found in wood spirit.
- Workers use propenyl alcohol to make resins.
