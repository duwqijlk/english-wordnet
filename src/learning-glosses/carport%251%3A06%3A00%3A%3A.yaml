simpleMeaning: a flat roof held up by poles, used as a place to keep one or two cars
scope: This is a roof on poles where you keep a car, not a closed room for cars with walls and a door.
examples:
- We parked the car under the carport next to the house.
- Their carport keeps the rain off both cars.
