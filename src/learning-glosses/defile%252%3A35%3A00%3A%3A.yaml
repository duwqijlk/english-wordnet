simpleMeaning: to make something dirty or full of spots by leaving it in the air; also used in a wider
  way, not about real dirt
scope: Also called stain, tarnish, sully and maculate. This is making a thing dirty or spotted by the
  air, or, in a wider use, spoiling a good name.
examples:
- The damp air defiled the silver spoons, leaving dark spots on them.
- Lies in the newspaper defiled her good name.
