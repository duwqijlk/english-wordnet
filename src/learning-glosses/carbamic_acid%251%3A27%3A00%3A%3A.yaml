simpleMeaning: Nobody meets this substance on its own; it shows up only as the salts it forms, such as
  one made from ammonia, or as esters such as urethane.
scope: This substance is known only through its salts and esters, such as urethane.
examples:
- The chemist could not get carbamic acid on its own, only its salts.
- The chemist made carbamic acid esters such as urethane in the lab.
