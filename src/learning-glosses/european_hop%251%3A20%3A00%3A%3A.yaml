scope: A twining plant of Europe whose flowers are used most of all to give taste to malt drinks, also
  called bine, common hop, common hops and Humulus lupulus; it is grown in America.
examples:
- European hop twines up the poles in the field.
- Brewers use the flowers of European hop to give taste to their beer.
