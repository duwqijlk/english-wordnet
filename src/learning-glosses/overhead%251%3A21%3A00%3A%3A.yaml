simpleMeaning: the cost of keeping a place in use, like taxes, light, heat, and cover against loss, but
  not the fall in its worth, loan costs, or tax on money made
scope: The cost of keeping a place in use, not the fall in its worth, loan costs, or tax on money made,
  and not a clear sheet used with a projector.
examples:
- Taxes and light make up most of the shop's overhead.
- The shop's overhead went up when taxes rose.
