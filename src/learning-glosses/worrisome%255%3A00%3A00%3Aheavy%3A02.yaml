simpleMeaning: making someone feel upset, worried, or anxious
scope: 'Also called worrying, disturbing, troubling, distressing, and perturbing: making a person feel
  upset, worried, or anxious. It is not the sense of not making a person feel calm and safe.'
examples:
- The worrisome news about the flood kept everyone awake that night.
- It was a worrisome time for the family, waiting for the test results.
