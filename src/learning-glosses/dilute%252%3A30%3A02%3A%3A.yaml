schema: oewn-learning-gloss-v2
senseId: 'dilute%2:30:02::'
synsetId: 00488684-v
simpleMeaning: to make something less pure by adding a thing that does not belong or is of poor quality,
  often by swapping good ingredients for poor ones
scope: Also called stretch, load, debase, and adulterate. This is about making a thing less pure, not
  about making a drink or mix weaker, and not a word for a mix already made weaker.
examples:
- Bad makers dilute their paint by swapping good ingredients for cheap, poor ones.
- He diluted the honey by adding a cheap sweet liquid that does not belong in it.
