simpleMeaning: Stuff to eat made from the seeds of grasses grown for eating, when the seeds hold much
  starch, the white substance that gives energy.
scope: Stuff to eat made from the seeds of grasses grown for eating, when the seeds hold much starch,
  also called grain or cereal; not seeds eaten whole and not flour.
examples:
- Food grain feeds millions of people around the world.
- Rice is a food grain grown in warm wet fields.
