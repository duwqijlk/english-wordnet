simpleMeaning: letters or words cut or carved into something, so they can be read there
scope: These are letters or words cut or carved into something; lettering is another name for this sense;
  not the work of cutting them, and not a short note giving a book to someone.
examples:
- The inscription on the stone gave the names of the dead.
- She traced the inscription with her finger.
