simpleMeaning: Living muscle, blood tubes, and the like answer a touch or signal because of the springy
  pull they keep.
scope: This springy pull in living muscle and blood tubes is also called tone and tonus.
examples:
- The test showed the tonicity of the muscle.
- The doctor tested my tonicity.
