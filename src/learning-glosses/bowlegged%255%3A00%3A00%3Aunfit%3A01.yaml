simpleMeaning: having legs that bend out away from each other at the knees
scope: 'Also called bowed and bandy: this describes legs that bend out at the knees, not legs that bend
  in toward each other.'
examples:
- The bowlegged cowboy walked with his knees wide apart.
- The old bowlegged man walked slowly down the street.
