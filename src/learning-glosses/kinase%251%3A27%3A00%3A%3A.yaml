simpleMeaning: An enzyme that speeds up the change of an inactive enzyme into one that works
scope: This is an enzyme that speeds up the change of an inactive enzyme into one that works, not the
  inactive enzyme itself and not any other substance that speeds up a change.
examples:
- A kinase speeds up the change of an inactive enzyme.
- A kinase turns an inactive enzyme into one that works.
