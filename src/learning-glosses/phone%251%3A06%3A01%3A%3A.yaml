simpleMeaning: a small piece of equipment that turns electric signals into sound and is worn over or inside
  the ear.
scope: It is not the whole calling device and not a loudspeaker for a room; it is only the small part
  that goes on or in the ear.
examples:
- She wore a phone in one ear during the tour.
- He pulled the phone from his ear when the music stopped.
