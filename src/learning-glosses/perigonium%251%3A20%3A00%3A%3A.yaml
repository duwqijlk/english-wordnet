simpleMeaning: 'What shuts in a flower''s seed-making parts is one whole: the green cup with the ring
  of petals round it.'
scope: 'Also called perigone, perianth, chlamys, and floral envelope: the outer parts of a flower as a
  whole, not the green cup or the ring of petals on their own.'
examples:
- The perigonium is the flower's outer cover as a whole.
- In the perigonium, cup and petals shut in the seed-making parts.
