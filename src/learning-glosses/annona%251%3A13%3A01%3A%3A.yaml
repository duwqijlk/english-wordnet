simpleMeaning: Shiny black seeds sit inside this sweet soft fruit of warm lands, under a thick skin covered
  in scales.
scope: 'Also called annon, sugar apple and sweetsop: a sweet soft fruit of warm lands with shiny black
  seeds inside, not the tree it grows on.'
examples:
- The annona had a thick scaly skin and shiny black seeds.
- He ate an annona and liked its sweet soft flesh.
