simpleMeaning: a caustic substance, one that can burn the skin, made by heating a kind of rock
scope: A skin-burning substance made by heating a kind of rock, also called lime, calcium hydrate, calcium
  hydroxide, caustic lime, and lime hydrate; not the raw rock itself and not chalk.
examples:
- The builder mixed hydrated lime into the mortar.
- Wear gloves when you handle hydrated lime, as it burns the skin.
