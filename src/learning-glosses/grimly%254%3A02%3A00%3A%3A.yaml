simpleMeaning: in a serious, firm way that shows someone will not stop or change
scope: 'This tells how something is done: in a serious way by someone who will not change or stop, not
  in a cheerful or kind way.'
examples:
- He grimly refused to give up, even after many failures.
- She grimly kept working until the job was done, and nothing could stop her.
