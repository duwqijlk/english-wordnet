simpleMeaning: A strong drink made with alcohol that tastes hot and sharp, like the spice used to season
  food
scope: 'Also called black pepper vodka or black peppercorn vodka: a strong drink with a hot, sharp taste,
  not a plain drink and not a drink made with another spice.'
examples:
- He ordered a pepper vodka at the bar.
- She sipped her pepper vodka slowly.
