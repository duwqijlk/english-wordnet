simpleMeaning: The thick green root of a Japanese plant, used in cooking, tasting like strong horseradish,
  often eaten as a powder or paste with raw fish.
scope: The thick green root used in cooking, not the plant itself that the root comes from.
examples:
- He mixed a little wasabi into the soy sauce.
- Wasabi is served with the raw fish.
