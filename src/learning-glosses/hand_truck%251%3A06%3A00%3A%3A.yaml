simpleMeaning: Boxes or heavy loads move on this cart, a frame worked by a person, with two low wheels,
  a flat rest at the bottom and grips at the top.
scope: Also called a truck, this cart is a frame worked by a person, with two low wheels, a flat rest
  at the bottom and grips at the top, for moving boxes or heavy loads.
examples:
- We moved the heavy crates on the hand truck.
- He used the hand truck to move the heavy crates.
