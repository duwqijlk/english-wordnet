senseId: ill-bred%5:00:00:unrefined:01
synsetId: 01957679-s
simpleMeaning: Of a person, rough and uncultured in manner, with no elegance or social polish.
scope: This is a lasting lack of polish in how a person behaves, not a single rude remark.
examples:
- The ill-bred boy had never been taught how to behave at a formal table.
- Even in fine clothes, he seemed ill-bred beside the polished guests.
