simpleMeaning: stand firm against an attack, force, or pressure and refuse to give way
scope: This is not keeping an object in your hand or storing it; it is staying firm under attack or pressure.
examples:
- The dam holds against the floodwaters every spring.
- The soldiers held the line despite heavy fire.
