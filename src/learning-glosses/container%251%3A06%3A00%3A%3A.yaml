simpleMeaning: Something you put other things in, especially a large metal box made to a standard size
  that can be loaded from one kind of transport to another
scope: This sense is any thing used to hold other things, especially the large metal box used in transport.
  It is not a place or a room where things are kept.
examples:
- She put the rice in a plastic container with a tight lid.
- A large metal container was lifted onto the ship.
