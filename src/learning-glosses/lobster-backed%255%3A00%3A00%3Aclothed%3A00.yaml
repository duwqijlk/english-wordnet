simpleMeaning: British soldiers in the American Revolutionary War wore red coats, and this word is used
  of them
scope: Said of British soldiers in the American Revolutionary War because of their red coats, not of any
  soldier and not of a food dish.
examples:
- The lobster-backed soldiers marched in their red coats.
- People called the British troops lobster-backed because of their coats.
