simpleMeaning: a sharp or smooth line where a surface has been turned back on itself
scope: The crease or pleat itself, not the act of folding, a fold of skin, or a bend in rock layers.
examples:
- There was a deep fold in the fabric where it had been pressed.
- He smoothed out the fold in the map.
