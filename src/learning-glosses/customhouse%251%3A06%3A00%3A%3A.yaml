simpleMeaning: a government office where taxes on goods from other lands are paid, and where ships get
  leave to come in or go out
scope: 'Also called customshouse: a government office where taxes on goods are paid and ships get leave
  to come in or go out, not a warehouse for goods and not a port office that only books ships.'
examples:
- The customhouse stood at the edge of the harbor.
- After the ship docked, the captain went to the customhouse to clear his cargo.
