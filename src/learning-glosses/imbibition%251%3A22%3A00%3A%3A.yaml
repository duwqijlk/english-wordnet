simpleMeaning: In chemistry, the way a solid or a jelly-like stuff takes in a liquid and holds it
scope: In chemistry, a solid or gel taking in a liquid; not a person drinking and not a liquid mixing
  with another liquid.
examples:
- Imbibition lets the dry gel swell as it takes in water.
- The imbibition of water by the seeds made them grow heavy.
