senseId: 'receptor%1:08:00::'
synsetId: 05306677-n
simpleMeaning: A body part with nerve ends, in the skin, inner body parts, eye, ear, nose or mouth, that
  take in touch, light, sound, smell or taste
scope: This sense is a body part that picks up touch, light, sound, smell or taste, also called sense
  organ and sensory receptor. It is not the small part inside a cell in the other sense of this word.
examples:
- The eye is a receptor that picks up light.
- Receptors in the skin let us feel heat and touch.
