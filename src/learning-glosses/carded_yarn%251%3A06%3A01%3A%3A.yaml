simpleMeaning: thread made from fibres that have been brushed to line them up, but not combed
scope: Thread that has been brushed but not combed, not smooth combed thread and not raw fibre.
examples:
- She knitted a scarf from soft carded yarn.
- The mill sold carded yarn for thick blankets.
