senseId: 'katabolism%1:22:00::'
synsetId: 13464960-n
simpleMeaning: The way living things break big, complex stuff down into smaller, simpler stuff, letting
  out energy as they do it
scope: 'Also called catabolism, destructive metabolism, or dissimilation: the breaking down of complex
  stuff in living things, not the building up of complex stuff from simple parts.'
examples:
- Katabolism gives the body energy by breaking down food into simpler parts.
- During hard exercise, katabolism breaks down stored fuel to free energy.
