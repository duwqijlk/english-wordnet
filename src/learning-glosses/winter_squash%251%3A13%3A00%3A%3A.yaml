simpleMeaning: With yellow to orange flesh you can eat, this thick-skinned fruit of the gourd family is
  one of many kinds ripening in the fall and keeping for several months.
scope: This is a thick-skinned fruit of the gourd family with yellow to orange flesh that ripens in the
  fall, not the plant that bears it.
examples:
- Winter squash ripens in the fall and keeps for several months.
- We cut open a winter squash and found yellow flesh inside.
