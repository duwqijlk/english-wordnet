simpleMeaning: a light on a car or other road vehicle that flashes on and off and shows which way the
  vehicle will turn next
scope: This is the light on a vehicle that shows it will turn. It is not a light used only as a general
  signal, and not the leather patch a horse wears to stop it seeing to the side.
examples:
- He switched on his left blinker before turning into the side road.
- Check that both blinkers work before you drive the car.
