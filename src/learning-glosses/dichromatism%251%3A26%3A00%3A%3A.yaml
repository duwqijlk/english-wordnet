simpleMeaning: Matching any shade takes a person with this lack of colour sight only two kinds of light
  mixed, while most people need three.
scope: Also called dichromacy, dichromasy, dichromatopsia and dichromia; it is a lack in colour sight,
  not the full colour sight of most people, who need three kinds of light to match a shade.
examples:
- Dichromatism means she can match any shade with only two kinds of light.
- His dichromatism shows when he matches shades with two kinds of light.
