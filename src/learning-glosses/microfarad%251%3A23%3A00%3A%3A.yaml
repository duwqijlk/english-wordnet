simpleMeaning: One millionth of the unit used to count how much charge a thing can hold
scope: A tiny unit for counting how much charge a thing can hold, not the main unit and not a unit of
  power.
examples:
- The microfarad is used to rate the small parts in a radio set.
- A one-microfarad part holds far less charge than a one-farad part.
