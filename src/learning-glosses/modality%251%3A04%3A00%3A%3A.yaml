simpleMeaning: a way to treat illness or injury with treatment that works on the body, or with electricity
scope: This is a way of treating illness or injury, not a way of grouping statements about what must be
  or may be, and not a verb form in grammar.
examples:
- Heat treatment is one modality the clinic uses for sore muscles.
- The doctor tried a new modality that uses small electric currents to ease pain.
