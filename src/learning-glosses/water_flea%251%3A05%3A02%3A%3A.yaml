simpleMeaning: A tiny freshwater crustacean that swims freely, with a pear-shaped body, one large eye,
  and long antennae. It feeds other animals and can carry worms that infect people.
scope: Here the name refers to the pear-shaped crustacean with a single eye and long antennae, not the
  round-bodied kind enclosed in a clear shell; cyclops is another name for this same creature.
examples:
- The water flea under the lens had a pear-shaped body and one large eye.
- Small fish feed on water fleas, which can also pass on worms to people.
