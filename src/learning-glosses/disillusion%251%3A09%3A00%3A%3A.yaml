simpleMeaning: the act of making a person stop believing something that is not true
scope: 'Also called disillusionment: this is the freeing of a person from a false belief, not the false
  belief itself.'
examples:
- His disillusion began when he saw that the leader's promises were false.
- The book brought about her disillusion, and she left the group for good.
