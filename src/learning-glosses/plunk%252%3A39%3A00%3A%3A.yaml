simpleMeaning: To make the sound of a horse's feet hitting the ground, or to go along with that sound.
scope: This is moving or sounding with the beat of horses' feet; clump and clunk are other names for this
  sense, not hitting a ball in baseball or plucking a string lightly.
examples:
- The cart plunked along the stony road behind the horse.
- Hooves plunked on the wet ground as the riders passed.
