simpleMeaning: In statistics, one of three marks that split a set of scores in order into four equal parts
scope: In statistics, one of three marks that split scores into four equal parts, not a mark that splits
  them in half and not the average of the scores.
examples:
- The first quartile of the test scores was 62.
- She worked out the quartile that marked the top fourth of the class.
