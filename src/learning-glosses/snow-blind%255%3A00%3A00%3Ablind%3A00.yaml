simpleMeaning: not able to see for a short time after bright light bounces off white frozen ground or
  ice into your eyes
scope: Not able to see for a short time after bright light off snow or ice, also called snow-blinded;
  not a lasting loss of sight, and not caused by a blow to the eye.
examples:
- After hours on the glacier without dark glasses, he was snow-blind and had to be led back to camp.
- The snow-blind skier could not see the track ahead.
