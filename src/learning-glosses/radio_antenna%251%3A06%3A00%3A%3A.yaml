simpleMeaning: a part of a set that takes in signals from all sides, so the set can play a broadcast
scope: 'Also called a radio aerial: the part of a set that picks up signals from all sides, not a wire
  that sends signals out and not a dish that points one way.'
examples:
- The radio antenna on the roof picks up stations from every direction.
- She moved the radio antenna until the music came through clear.
