senseId: 'penicillinase-resistant_antibiotic%1:06:00::'
synsetId: 03916536-n
simpleMeaning: Even when a substance that breaks penicillin down is there, this kind of penicillin keeps
  working
scope: A kind of penicillin that keeps working when penicillinase is present, not plain penicillin and
  not a drug that fights a different kind of germ.
examples:
- The doctor chose a penicillinase-resistant antibiotic because the germ made penicillinase.
- A penicillinase-resistant antibiotic kept working where plain penicillin failed.
