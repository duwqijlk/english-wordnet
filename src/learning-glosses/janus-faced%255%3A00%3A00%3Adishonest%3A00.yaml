senseId: janus-faced%5:00:00:dishonest:00
synsetId: 01225960-s
simpleMeaning: On purpose deceitful, showing one set of feelings while acting on another.
scope: It is used of a person, a smile or words that hide true feelings on purpose, also called deceitful,
  duplicitous, ambidextrous, double-dealing, double-faced, double-tongued, and two-faced, not of a person
  who says plainly what they feel.
examples:
- He gave a Janus-faced smile while planning to leave.
- Her Janus-faced words hid what she really felt.
