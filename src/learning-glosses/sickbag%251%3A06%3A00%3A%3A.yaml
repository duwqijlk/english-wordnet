simpleMeaning: a sack handed out on a plane for people who feel ill while flying and need to throw up
scope: Also called a sick bag; a sack for use on a plane, not a shopping bag and not a first-aid kit.
examples:
- He reached for the sickbag in the seat pocket.
- The sickbag was there in case the flight made her feel ill.
