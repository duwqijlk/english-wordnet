simpleMeaning: Fifty-two writings from 200 BC to AD 200 said to be by prophets and kings of the Hebrew
  scriptures, though many tell of the end of the world.
scope: Writings said to be by prophets and kings of the Hebrew scriptures, not the books of the Hebrew
  scriptures themselves.
examples:
- The Pseudepigrapha includes writings said to be by prophets and kings.
- Many works in the Pseudepigrapha tell of the end of the world.
