simpleMeaning: a low bush growing along the ground, keeping its leaves all year, with narrow overlapping
  leaves and early white star-shaped flowers; from New Jersey and the Carolinas pine barrens
scope: 'Also called pixy and pyxie: this is a real plant, not the small fairy-like being, also called
  a pixie, in old stories.'
examples:
- Wild pixie grows low among the pines in the Carolinas.
- The pixie blooms early, covering the sandy ground with white flowers.
