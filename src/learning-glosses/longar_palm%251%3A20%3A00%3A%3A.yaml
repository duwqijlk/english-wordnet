simpleMeaning: a tall tree with fan leaves from Africa, India, and Malaysia, giving hard wood and sweet
  sap used for wine and sugar, leaves used to cover roofs and to weave
scope: A tall fan-leaved tree also called lontar, palmyra, palmyra palm, toddy palm, and wine palm, not
  a small bush and not a tree grown only for fruit.
examples:
- The longar palm gives hard wood and sweet sap.
- People use longar palm leaves to cover roofs.
