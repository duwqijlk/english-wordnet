simpleMeaning: the process in which a liquid or gas goes through a filter (a material that lets it pass
  but catches unwanted bits)
scope: This is the process in which a liquid or gas goes through a filter; not the act of changing a liquid
  or gas by passing it through a filter.
examples:
- Water plants use filtration to make river water safe to drink.
- Filtration removed the sand from the water.
