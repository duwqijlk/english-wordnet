simpleMeaning: Fluid that comes from the glands in the neck of the womb into the birth canal; it is most
  often clear or white.
scope: Fluid from the glands in the neck of the womb, most often clear or white, not blood and not a fluid
  from an injury.
examples:
- Vaginal discharge is most often clear or white.
- She asked the doctor about the vaginal discharge.
