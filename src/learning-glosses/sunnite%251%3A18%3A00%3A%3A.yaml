simpleMeaning: A member of the branch of Islam that takes the first four caliphs as the rightful ones
  to follow Muhammad.
scope: 'Also called Sunni and Sunni Muslim: a member of the branch of Islam that follows the first four
  caliphs, not a member of the Shia branch.'
examples:
- She is a Sunnite who accepts the first four caliphs.
- The Sunnite community meets at the mosque on Fridays.
