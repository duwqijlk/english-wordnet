simpleMeaning: a hand tool with a tip that gets hot, used to melt soft metal and join parts together
scope: A hand tool with a hot tip for melting soft metal to join parts, not a tool for cutting metal and
  not a welding torch.
examples:
- He picked up the soldering iron to fix the loose wire.
- The soldering iron melted the soft metal and joined the two wires.
