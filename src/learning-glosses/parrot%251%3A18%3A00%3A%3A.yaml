simpleMeaning: a person who copies the words or acts of others but does not know what they mean or why
  they are done
scope: A person who copies others without knowing what the words or acts mean, not the bright bird that
  can copy sounds.
examples:
- He is a parrot in class, saying the teacher's words back without knowing what they mean.
- Do not be a parrot; think about the words before you say them.
