scope: Deviled egg is another name for this dish, one boiled until firm and cut in half, with the yellow
  middle mashed and put back into the white.
examples:
- The stuffed egg was cut in half, and the yellow middle was mashed with mayonnaise and spices.
- A stuffed egg was served with the yellow middle put back into the white.
