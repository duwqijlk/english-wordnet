simpleMeaning: to tie a ship up at a built place by the shore made for ships to stop at
scope: To tie a ship in place at such a shore place; not the shore place itself, not unloading people
  or goods there, and not just coming in to stop there.
examples:
- The captain wharfed his ship and tied its ropes tight before the storm came.
- They wharfed the ferry and fastened its ropes to the posts.
