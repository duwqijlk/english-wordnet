simpleMeaning: Along the front or side of a building, often on an upper floor, is a roofed walkway with
  open sides
scope: A covered walkway on a building, not a closed room and not a free-standing porch.
examples:
- They sat in the loggia and watched the square below.
- The loggia runs the whole length of the upper floor.
