simpleMeaning: teaching for children with body or mind problems, whose needs an ordinary class cannot
  meet
scope: School teaching for children with body or mind problems, whose needs an ordinary class cannot meet;
  not ordinary class teaching and not teaching for adults.
examples:
- The school gives special education to children who need extra help.
- Her son gets special education because an ordinary class cannot meet his needs.
