senseId: 'caveat_emptor%1:10:00::'
synsetId: 06676530-n
simpleMeaning: a rule of trade that says a buyer takes the risk that a thing may be poor in quality when
  no promise of good quality is given
scope: A trade rule that puts the risk of poor quality on the buyer when no promise of good quality is
  given, not a seller's duty to fix a fault and not a law that protects buyers.
examples:
- Under caveat emptor, the buyer must check the car before paying for it.
- The shop sold the old radio under caveat emptor, with no promise that it would work.
