simpleMeaning: A person who follows wild animals without being seen, in order to hunt them
scope: A hunter who follows game unseen; not a person who follows someone to frighten them, and not a
  person who walks with long stiff steps.
examples:
- The stalker moved slowly through the trees after the deer.
- A good stalker can follow a fox for miles without being seen.
