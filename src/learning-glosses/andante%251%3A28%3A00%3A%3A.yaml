simpleMeaning: In music, a fairly slow speed for playing a piece, like the speed of walking
scope: This is the fairly slow speed for the music, not the piece of music itself that is played at that
  speed, and not a very slow speed.
examples:
- The orchestra played the first part at andante, at a fairly slow speed.
- At andante, the music moved at a gentle walking pace.
