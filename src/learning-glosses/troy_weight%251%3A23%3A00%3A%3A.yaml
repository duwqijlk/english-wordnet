simpleMeaning: On a pound of twelve ounces, each ounce made of 480 grains, this set of measures is used
  for costly metals and jewels.
scope: People also call this set of measures troy; it is used for costly metals and jewels.
examples:
- The jeweller weighed the gold with troy weight.
- She priced the silver in troy weight.
