simpleMeaning: the written words in a book, newspaper, or other work of the same kind
scope: This is the words in a book or newspaper, not cloth with a pattern, not a picture on paper, and
  not the act of making a book or newspaper.
examples:
- I want to see that claim in print before I believe it.
- The story first appeared in print in a local newspaper.
