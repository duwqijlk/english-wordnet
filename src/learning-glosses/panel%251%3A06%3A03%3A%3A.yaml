simpleMeaning: In computing, a small box that pops up on screen for a short time to ask for facts, which
  you close with 'okay' or 'cancel' once you have given them
scope: In computing, a small box that asks you for facts, not the flat board with switches and dials and
  not a piece of cloth.
examples:
- A panel asked for her password before she could go on.
- He filled in the panel and clicked 'okay' to close it.
