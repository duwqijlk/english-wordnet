simpleMeaning: a substance that makes cells that can move come toward it
scope: A substance that makes cells that can move come toward it, not a substance that drives cells away
  and not a signal that makes cells stay still.
examples:
- The chemoattractant drew the white blood cells to the wound.
- Cells moved up the trail left by the chemoattractant.
