simpleMeaning: the act of stopping in the middle of a sentence and leaving it unfinished, as writers of
  true-to-life talk do
scope: A sentence left unfinished on purpose, not a full sentence and not a sentence cut short by accident.
examples:
- The actor's aposiopesis left the threat hanging in the air.
- Her aposiopesis in the middle of the sentence made the talk sound like real life.
