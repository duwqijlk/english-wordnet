simpleMeaning: A catching illness of people, spread by germs from infected animals or from infected meat
  or milk, marked by high temperature and head pain.
scope: 'Also called brucellosis, undulant fever, Gibraltar fever, Malta fever and Rock fever: a catching
  illness of people, spread by germs from infected animals or infected meat or milk, marked by high temperature
  and head pain, not a cold and not a flu.'
examples:
- He caught Mediterranean fever after drinking milk from an infected goat.
- Mediterranean fever gave her a high temperature and a bad headache.
