simpleMeaning: a large area of land with its buildings, especially in the countryside, kept by its owner
  for their own use.
scope: This is not a social class, and not the total wealth left by someone who has died.
examples:
- They live on a large country estate with woods and a lake.
- The family has owned the estate for over two hundred years.
