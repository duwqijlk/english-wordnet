simpleMeaning: a desk digital computer that is usually thought to be more powerful than a microcomputer
  (a small personal computer)
scope: A desk digital computer thought to be stronger than a small personal computer; not a small personal
  computer of the usual kind and not just a desk where someone works.
examples:
- The engineer used a powerful workstation for her design work.
- He bought a new workstation because his small computer was too slow.
