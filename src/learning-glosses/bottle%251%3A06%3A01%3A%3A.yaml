simpleMeaning: A container for feeding babies and very young children, fitted with a soft nipple, that
  holds milk or formula and replaces feeding at the breast.
scope: A baby's feeding container, also called a feeding bottle or nursing bottle, not an ordinary bottle
  for drinks or a measured amount.
examples:
- She warmed the bottle before the baby's feed.
- He packed a bottle of formula in the changing bag.
