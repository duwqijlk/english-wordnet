senseId: 'inwardness%1:09:00::'
synsetId: 05795180-n
simpleMeaning: Being taken up especially with one's own views and with questions of right and wrong and
  of what one believes.
scope: Being taken up especially with one's own views and with questions of right and wrong and of what
  one believes; not being taken up with human inner nature in general, not the most essential part of
  an idea or experience, and not simply the state of being inward.
examples:
- The inwardness of the characters showed in their long talks about their own beliefs.
- Her inwardness made her think hard about her own attitudes.
