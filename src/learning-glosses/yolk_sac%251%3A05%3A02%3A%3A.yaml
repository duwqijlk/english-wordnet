simpleMeaning: a thin skin-like bag in a mammal still in the womb that works as its blood system until
  its heart starts to work
scope: A thin skin-like bag in a mammal still in the womb, also called umbilical vesicle, vesicula umbilicus
  and vitelline sac; not the bag round the yolk of a bird's egg.
examples:
- The yolk sac feeds the young mammal before its heart works.
- A yolk sac carries blood round the young mammal in the womb.
