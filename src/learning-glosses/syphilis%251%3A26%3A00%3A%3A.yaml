simpleMeaning: a common disease passed through sex, caused by a tiny spiral germ; its signs change through
  stages, and a mother can pass it to her unborn child
scope: 'Also called pox, lues, lues venerea and syph: this is a disease passed through sex, not another
  sex disease with different signs and a different cause.'
examples:
- The doctor said his syphilis could be treated if he started care early.
- She was tested for syphilis during her pregnancy to protect her baby.
