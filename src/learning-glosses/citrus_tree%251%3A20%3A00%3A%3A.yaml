simpleMeaning: A tropical evergreen with tough leaves, often bearing spines, and fragrant thick-skinned
  fruit full of juice, grown widely for oranges, lemons and similar crops.
scope: This is the whole fruit-bearing evergreen, not the fruit itself or one particular kind such as
  the lemon.
examples:
- The orchard is planted with citrus trees that ripen their fruit in winter.
- A citrus tree needs plenty of sun and well-drained soil.
