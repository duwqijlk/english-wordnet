simpleMeaning: A member of a people of south-east Africa living in the land named for them and the lands
  round it.
scope: A member of a people of south-east Africa; not the Swazi tongue or the land of Swaziland.
examples:
- He is a Swazi from the south-east of Africa.
- The Swazi live in Swaziland and the lands round it.
