simpleMeaning: a person who lives in a big town and has fine manners and fine clothes
scope: A person who lives in a big town, with fine manners and fine clothes, man or woman; not a country
  dweller and not someone with plain manners.
examples:
- The city slicker looked out of place on the farm.
- She spoke like a city slicker, all fine manners and smart clothes.
