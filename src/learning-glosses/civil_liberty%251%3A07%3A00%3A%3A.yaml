simpleMeaning: A freedom every person has by right, watched over by the law, which stops the government
  from stepping into a person's life without good cause
scope: This freedom belongs to every person, is watched over by the law, and keeps the government from
  stepping into a person's life without good cause.
examples:
- Free speech is a civil liberty guarded by law in many countries.
- The court ruled that the new law took away a civil liberty.
