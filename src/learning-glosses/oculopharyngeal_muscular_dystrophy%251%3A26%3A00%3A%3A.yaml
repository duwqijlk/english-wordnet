simpleMeaning: A genetic muscle-wasting disease, usually beginning in early adulthood or middle age, that
  first weakens eyelid and throat muscles and slowly causes swallowing problems; inheritance is autosomal
  dominant.
scope: This is the inherited muscle disease that begins in adulthood and attacks eyelid and throat muscles
  first, not Duchenne or other childhood muscular dystrophies that start in the limbs, and not a swallowing
  disorder alone.
examples:
- Oculopharyngeal muscular dystrophy usually appears in a person's forties or fifties.
- Her father had oculopharyngeal muscular dystrophy, and she first noticed drooping eyelids in her own
  thirties.
