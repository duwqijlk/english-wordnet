simpleMeaning: Most often, its color runs from a shade of blue to a shade of yellow, like the color of
  a hard stone used for jewelry
scope: A color like that of a hard stone used for jewelry, also called jade; not a plain blue and not
  a plain yellow.
examples:
- The jade-green walls of the room felt cool and calm.
- She chose a jade-green dress for the party.
