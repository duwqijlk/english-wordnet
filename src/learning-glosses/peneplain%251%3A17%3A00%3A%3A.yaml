simpleMeaning: A land surface that is more or less flat, worn down by long wearing away of the land with
  no great shifts in the earth's crust.
scope: A more or less flat land surface worn down by long wearing away, also called a peneplane, not a
  high rough land and not a land still being cut into deep valleys.
examples:
- The peneplain stretched flat to the far hills.
- Over ages the high land wore down to a peneplain.
