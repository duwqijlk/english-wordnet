simpleMeaning: a small flat bone guards the front of the joint where the thigh bone meets the two bones
  of the lower leg, a joint that bends one way only
scope: Also called knee, genu, articulatio genus, and human knee, it is the one-way joint of the leg,
  where the thigh bone meets the two lower leg bones under a small flat bone at the front.
examples:
- The knee joint lets the leg bend each time a person walks.
- The knee joint flexed when the leg was lifted.
