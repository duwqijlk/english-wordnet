simpleMeaning: A way of measuring heat on which water freezes at 0 and boils at 80.
scope: A way of measuring heat on which water freezes at 0 and boils at 80, not a thermometer itself and
  not the Celsius or Fahrenheit way of measuring heat.
examples:
- On the Reaumur scale, water boils at 80 degrees.
- The old book gives the heat as 20 on the Reaumur scale.
