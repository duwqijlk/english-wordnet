senseId: 'aeolian_lyre%1:06:00::'
synsetId: 02685261-n
simpleMeaning: A set of strings all tuned to the same note, which sound when the wind moves over them.
scope: A set of strings tuned to one note that sound in the wind, also called an aeolian harp; not a harp
  played by hand and not a set of bells in the wind.
examples:
- The aeolian lyre sounded as the breeze passed over the strings.
- An aeolian lyre needs no player, only wind.
