simpleMeaning: to a very high degree, in a way that is clearly very great
scope: It means to a very high degree, as in being very well fit for a job. It is not 'imminently', which
  means about to happen very soon.
examples:
- She is eminently suited to lead the new school.
- He was eminently fair in all his dealings with others.
