simpleMeaning: one of a pair of nerve cords starting from spinal roots in the neck, running down the chest
  to work the muscle sheet that moves air in and out
scope: Also called nervus phrenicus; the nerve that works the breathing muscle, not the vagus nerve and
  not a nerve of the arm or leg.
examples:
- The phrenic nerve carries signals from the neck to the diaphragm.
- Damage to the phrenic nerve can make breathing hard.
