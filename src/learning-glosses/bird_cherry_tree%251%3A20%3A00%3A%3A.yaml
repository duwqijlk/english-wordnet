simpleMeaning: Any of several tall woody plants with small fruit that flying creatures visit and feed
  on.
scope: Any of several small-fruited tall woody plants that flying creatures visit and feed on; bird cherry
  is another name for this sense, not a plant with large sweet fruit and not a bush.
examples:
- The bird cherry tree stood at the edge of the wood.
- A bird cherry tree drops its small fruit in late summer.
