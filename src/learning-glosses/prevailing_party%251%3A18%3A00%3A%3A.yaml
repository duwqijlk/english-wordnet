simpleMeaning: The side in a case in court that gets the ruling in its favour
scope: The side in a case in court that gets the ruling in its favour; not the side that loses and not
  the court itself.
examples:
- The prevailing party was awarded the costs of the case.
- She was the prevailing party in the long dispute.
