simpleMeaning: A share in a firm known across the country, whose worth and payouts can be trusted, most
  often costly with a small return.
scope: A share in a firm known across the country, whose worth and payouts can be trusted, most often
  costly with a small return; blue-chip stock is another name for this sense, not a share in a small firm
  and not a share with a high return.
examples:
- A blue chip is a safe place for savings.
- He holds blue chips from big firms.
