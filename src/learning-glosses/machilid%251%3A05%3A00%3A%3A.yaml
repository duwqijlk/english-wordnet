simpleMeaning: This insect of dark wet places, such as under dead tree trunks, has no wings, yet it leaps
  wildly when upset.
scope: Also called jumping bristletail, it has no wings, yet it leaps wildly when upset, and it lives
  in dark wet places, such as under dead tree trunks.
examples:
- A machilid hid under the dead tree trunk.
- Machilids leap wildly when they are upset.
