simpleMeaning: a word form that shows an action as complete, or as leading to a finish, an end or a result
scope: A word form showing an action as complete or leading to a finish, an end or a result, not a form
  showing an action still going on and not a noun.
examples:
- A perfective verb shows the action as complete.
- The perfective verb in the sentence marked the end of the task.
