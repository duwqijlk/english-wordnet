simpleMeaning: Hard strong pale wood comes from this mid-sized to large tree of Europe, which loses its
  leaves in winter and has smooth leaves with round lobes
scope: Also called pedunculate oak; a European tree with smooth round-lobed leaves, not a pine.
examples:
- A common oak stands at the edge of the field.
- The common oak gives hard wood for furniture.
