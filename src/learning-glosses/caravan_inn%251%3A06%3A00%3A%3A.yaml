simpleMeaning: a place to stay in some eastern countries, with a large open yard where groups of travellers
  with animals can rest
scope: 'Also called caravansary, caravanserai and khan: a place to stay in some eastern countries with
  a large open yard for travelling groups, not a modern hotel and not a small roadside stop.'
examples:
- The travellers spent the night at a caravan inn.
- The caravan inn had a wide courtyard where the camels rested.
