simpleMeaning: a tree of North America with pale brown wood and nuts that can be eaten, also used to make
  a pale brown dye
scope: 'Also called a butternut and a butternut tree: a North American tree with pale brown wood and nuts
  that can be eaten, not a black walnut and not a hickory.'
examples:
- The white walnut in the yard drops nuts every autumn.
- They used the white walnut to make a pale brown dye for cloth.
