simpleMeaning: A pin or bolt that forms the point on which a hinge turns.
scope: This is a pin or bolt that forms the point on which a hinge turns; not the hinge itself, and not
  a pin that holds two parts still.
examples:
- The pintle held the gate on its hinge.
- He oiled the pintle so the door would swing free.
