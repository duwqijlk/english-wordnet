simpleMeaning: a short written note that lists the points of an agreement, used most often between countries
  in talks
scope: A short written note listing the points of an agreement, also called a position paper; not a full
  treaty and not a private letter.
examples:
- The aide-memoire listed the points both sides had agreed on.
- She handed him the aide-memoire before the talks began.
