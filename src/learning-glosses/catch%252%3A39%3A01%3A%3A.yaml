simpleMeaning: To notice something suddenly with your eyes, ears, or nose, often for only a short moment.
scope: This is not finding someone out in an unexpected act; it is a quick, brief act of seeing, hearing,
  or smelling.
examples:
- I caught a glimpse of the deer before it ran into the trees.
- She caught the smell of fresh bread as she walked past the bakery.
