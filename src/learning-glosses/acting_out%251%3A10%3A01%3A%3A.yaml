simpleMeaning: In psychiatry, showing feelings that were held back before, more in what a person does
  than in what they say, thought to help and heal.
scope: Not a sudden burst of bad behaviour and not a stage performance.
examples:
- In therapy, his acting out let him show anger he had held back.
- Her acting out in the session helped her speak about her fear.
