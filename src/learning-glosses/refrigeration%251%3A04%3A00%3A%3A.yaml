simpleMeaning: the act of cooling a person's body on purpose to help treat an illness
scope: Cooling the body on purpose as a treatment; not cooling food to keep it fresh.
examples:
- Doctors used refrigeration to lower the patient's temperature.
- The doctors tried refrigeration to bring down his fever.
