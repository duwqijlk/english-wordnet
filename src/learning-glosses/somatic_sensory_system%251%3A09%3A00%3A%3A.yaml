senseId: 'somatic_sensory_system%1:09:00::'
synsetId: 05667701-n
simpleMeaning: Signals pass from the skin, from the limbs, and from the parts inside, and together they
  tell a person what the body is doing.
scope: Also called somaesthesia, somaesthesis, somataesthesis, somatesthesia, somatic sense, somatosensory
  system, somesthesia, or somesthesis, it takes in only what the body feels itself, not sight or hearing.
examples:
- Through the somatic sensory system, a person feels a touch on the arm.
- By the somatic sensory system, a person feels the skin grow warm.
