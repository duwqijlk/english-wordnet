simpleMeaning: Silver coins made for the purpose and given out by the British ruler on the Thursday before
  Easter.
scope: These are special silver coins given out by the British ruler on one holy day each year, not ordinary
  coins used for buying things.
examples:
- The Maundy money was handed out by the sovereign on Maundy Thursday.
- Each year the Maundy money coins are specially minted for the ceremony.
