simpleMeaning: a list of details about what is offered, such as the acts in a show or the food on a restaurant's
  menu
scope: This is a detailed list of what a show or menu offers, not a printed advertisement or a request
  for payment.
examples:
- The bill at the theatre listed a comedy and two short plays.
- The restaurant's bill of fare changes with the seasons.
