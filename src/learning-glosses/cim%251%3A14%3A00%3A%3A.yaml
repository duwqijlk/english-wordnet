simpleMeaning: The central office of the United Kingdom that gives work to, joins up and pays for its
  intelligence and security services
scope: 'Also called Central Intelligence Machinery: the central office of the United Kingdom that tasks,
  joins up and pays for its intelligence and security services, not one of those services.'
examples:
- CIM coordinates the work of the security services.
- The CIM funds intelligence work in the United Kingdom.
