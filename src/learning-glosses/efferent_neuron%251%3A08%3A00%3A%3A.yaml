simpleMeaning: a nerve cell that carries signals out from the brain or the cord in the back
scope: A nerve cell carrying signals out from the brain or back cord, also called motoneuron, motor nerve
  fiber and motor neuron; not a nerve cell carrying signals in and not a muscle cell.
examples:
- The efferent neuron sends the order from the brain to the muscle.
- Damage to an efferent neuron stops the muscle from moving.
