simpleMeaning: A malignant growth in the liver usually comes from a cancer elsewhere; it can bring poor
  appetite, weakness, bloating, yellowing of the skin and upper belly discomfort.
scope: Another name for cancer of the liver, usually a growth that has spread from elsewhere; not hepatitis
  or cirrhosis, which are not cancers.
examples:
- The scan showed that the tumour was liver cancer.
- Doctors may treat liver cancer with surgery, drugs or radiation.
