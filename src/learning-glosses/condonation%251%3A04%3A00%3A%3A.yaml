senseId: 'condonation%1:04:00::'
synsetId: 01229840-n
simpleMeaning: A pardon given by treating the person who did wrong as if the wrong had never been done
scope: A pardon given by treating the person who did wrong as if the wrong had never been done; not a
  pardon that names the wrong and forgives it openly, and not a punishment.
examples:
- His condonation meant treating her as if the wrong had never been done.
- After the condonation, they treated him as if the offence had never happened.
