simpleMeaning: to crush or wipe out a thing, as if by pressing it down with the foot
scope: To crush or wipe out a thing, not to press a mark on paper and not to put a paper token on a letter.
examples:
- The army stamped out the rebellion.
- The new law stamped out the old trade.
