simpleMeaning: A tall wide-spreading tree that stays green all year, found in Mexico with drooping branches,
  thought to have been brought to Portugal from Goa.
scope: This is a tall wide-spreading tree that stays green all year, found in Mexico with drooping branches,
  thought to have been brought to Portugal from Goa; cedar of Goa, Cupressus lusitanica and Portuguese
  cypress are other names for this sense, not the tall tree of Europe and Asia with thin grey bark and
  branches that rise upwards.
examples:
- The Mexican cypress in the garden had long drooping branches.
- A Mexican cypress shades the path behind the house.
