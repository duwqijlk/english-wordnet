simpleMeaning: an insect with no wings, usually flat, that sucks blood and lives on warm-blooded animals
scope: 'Also called a sucking louse: the blood-sucking kind that lives on warm-blooded animals. Not the
  biting kind that lives mostly on birds, and not a nasty person.'
examples:
- A louse was found in the dog's fur, where it had been sucking blood.
- One louse can live on a person's skin and feed on blood.
