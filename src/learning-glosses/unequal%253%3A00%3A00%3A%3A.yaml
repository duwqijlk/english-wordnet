simpleMeaning: not well matched or even in amount, value, or size
scope: This sense says things do not match in amount, value, or size; it does not mean that a person lacks
  what is needed to do a job.
examples:
- They cut the cake into unequal parts, so one child got much more than the other.
- He paid them unequal wages for the same work, giving one man twice as much as the other.
