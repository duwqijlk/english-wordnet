simpleMeaning: A very poisonous tall coarse one-year tropical weed with foul-smelling leaves, large white
  or violet trumpet-shaped flowers and prickly fruits.
scope: Also called common thorn apple, jimson weed, jimsonweed, apple of Peru and Jamestown weed; a very
  poisonous tall tropical weed with trumpet-shaped flowers, not a small garden weed and not a plant with
  edible fruit.
examples:
- Datura stramonium grew tall by the fence.
- Do not touch Datura stramonium, as it is very poisonous.
