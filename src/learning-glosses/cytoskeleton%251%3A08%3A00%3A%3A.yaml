senseId: 'cytoskeleton%1:08:00::'
synsetId: 05441072-n
simpleMeaning: A tiny net of thin threads and small tubes in the jelly-like stuff inside many living cells,
  which gives the cell its shape and holds it together.
scope: This is the tiny net inside a cell that gives it shape, not the cell's outer wall or the soft stuff
  that fills the cell.
examples:
- The cytoskeleton gives each cell its shape and holds it together.
- Under the microscope, the cytoskeleton looks like a tiny net.
