simpleMeaning: a computer program that lets you write, change, set out and print text
scope: This is a computer program for writing, changing, setting out and printing text; word processor
  is another name for this sense, not a printer and not a typewriter.
examples:
- She typed the report in a word processing system and printed it.
- The word processing system lets him fix mistakes before he prints his essay.
