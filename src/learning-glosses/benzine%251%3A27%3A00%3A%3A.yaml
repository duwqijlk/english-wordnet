simpleMeaning: A clear liquid of hydrogen and carbon that can cause cancer and catches fire fast, and
  is the simplest of the ring-shaped chemicals.
scope: Also called benzene and benzol, this clear liquid catches fire fast and can cause cancer, and it
  is the simplest of its ring-shaped kind.
examples:
- Benzine is a clear liquid that catches fire fast.
- The workers knew that benzine can cause cancer.
