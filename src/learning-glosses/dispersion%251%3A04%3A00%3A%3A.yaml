simpleMeaning: The act of spreading or scattering something out.
scope: Also called dispersal or diffusion, the act of spreading something out; not the state of being
  spread out over a place.
examples:
- The dispersion of the crowd began after the rain started.
- The dispersion of seeds by the wind filled the field.
