simpleMeaning: an area that rises in steps, with seats for people watching, as in a place for plays or
  a room where doctors do work on a sick person
scope: 'Also called amphitheatre: this is a rising area with seats inside a place for plays or a medical
  room, not the large oval open building with rows of seats all around for games and shows.'
examples:
- Students sat in the amphitheater to watch the doctors work.
- The back rows of the amphitheater rose high above the stage.
