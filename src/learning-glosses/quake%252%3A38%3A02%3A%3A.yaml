simpleMeaning: To shake with the tremors of the earth.
scope: This is a thing shaking from earth tremors, also called a tremor, not a body shaking in quick small
  moves or the earth-shaking itself.
examples:
- The earth quaked under their feet.
- The whole house quaked during the tremor.
