simpleMeaning: A medium-large oak of middle and south United States, losing its leaves in winter and giving
  timber, with nuts sunk deep in their cups that ripen in the first year.
scope: Also called overcup oak; a medium-large oak of middle and south United States with nuts sunk deep
  in their cups, not a small oak of the north and not an evergreen oak.
examples:
- Quercus lyrata drops its leaves each winter.
- The nuts of Quercus lyrata sit deep in their cups.
