simpleMeaning: Leaking urine because the bladder stays full, often from a blocked urethra (the tube carrying
  urine out), weak muscles, or nerve damage.
scope: This is leakage caused by an overfull bladder, not the kind triggered by coughing or laughing,
  nor the sudden-urge kind.
examples:
- After his prostate surgery, he developed overflow incontinence.
- Overflow incontinence can make small amounts of urine leak throughout the day.
