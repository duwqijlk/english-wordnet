simpleMeaning: Cooks in Asia use this fruit or seed, shaped with many sharp points and a sweet smell,
  to give taste to food and as a cure
scope: Also called star anise, this fruit or seed gives taste to food in Asia and serves as a cure, and
  it is not the small tree that bears it.
examples:
- The soup got a sweet smell from star aniseed.
- I put star aniseed in the soup.
