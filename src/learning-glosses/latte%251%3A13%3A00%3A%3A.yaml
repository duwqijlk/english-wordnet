simpleMeaning: A drink made from a strong coffee (espresso). It has hot milk on top, full of small bubbles
  made with steam
scope: This is a coffee drink with hot, bubbly milk on top, not plain black coffee and not coffee with
  cold milk.
examples:
- He drank a latte, enjoying the soft milk on top of the strong coffee.
- My latte came with thick, bubbly hot milk over the coffee.
