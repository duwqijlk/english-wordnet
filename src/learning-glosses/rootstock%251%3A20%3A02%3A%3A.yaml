simpleMeaning: a plant stem that lies flat under the ground, with shoots above and roots below, from which
  new plants grow
scope: A plant stem that lies flat under the ground, with shoots above and roots below; rhizome and rootstalk
  are other names for it, not the rootstock that gives a joined plant its roots and not a seed.
examples:
- The rootstock crept along just under the soil.
- New shoots rose from the rootstock in spring.
