simpleMeaning: A net of nerves round the neck blood tube that runs up into the head.
scope: A net of nerves round the neck blood tube that runs up into the head, also called plexus caroticus;
  not a net of nerves round the outer neck blood tube, and not a single nerve.
examples:
- The carotid plexus wraps round the artery in the neck.
- Nerves of the carotid plexus spread through the neck.
