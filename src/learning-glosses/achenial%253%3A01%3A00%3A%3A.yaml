simpleMeaning: having to do with a dry fruit that holds one seed and does not split open when ripe
scope: About a dry fruit with one seed that stays shut, not a fruit with many seeds and not one that splits
  open to free its seeds.
examples:
- The achenial fruit stayed shut even after it dried.
- Botanists call the achenial seed case one that never splits open.
