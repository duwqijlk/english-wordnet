simpleMeaning: The arm of the United States government that looks after trade at home and abroad, including
  the census and the patent office; it was set up in 1913.
scope: The arm of the United States government that looks after trade at home and abroad, also called
  DoC, Commerce and Department of Commerce; it also runs the census and the patent office, and it was
  set up in 1913.
examples:
- The Commerce Department runs the census and the patent office.
- She works for the Commerce Department in Washington.
