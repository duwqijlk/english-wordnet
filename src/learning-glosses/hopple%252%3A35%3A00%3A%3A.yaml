simpleMeaning: So the two legs on one side of a horse move together, its front and back legs on each side
  are tied
scope: 'Also called hobble: to tie a horse''s legs on each side so they move together, not to tie a horse
  so it cannot move at all.'
examples:
- The trainer will hopple the horse before the race.
- He learned to hopple a horse so its legs moved in step.
