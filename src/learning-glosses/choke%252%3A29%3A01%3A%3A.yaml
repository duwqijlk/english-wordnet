simpleMeaning: to make someone try to throw up or have trouble getting air
scope: This is making someone else have trouble getting air or try to throw up, not having trouble yourself
  and not squeezing someone's throat.
examples:
- The thick smoke choked him and made him cough again and again.
- The bad smell from the fish choked her and made her feel she would throw up.
