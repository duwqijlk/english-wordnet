simpleMeaning: when a government gives a person or group a right by law, in particular the right to be
  a citizen and to vote
scope: 'Also called franchise: when a government gives a person or group a right by law, in particular
  the right to vote, not a right people have on their own and not a business licence.'
examples:
- Enfranchisement gave the workers the right to vote for the first time.
- The new law brought enfranchisement to people who had been kept out of the vote.
