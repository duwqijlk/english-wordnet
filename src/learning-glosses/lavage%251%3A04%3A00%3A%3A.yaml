simpleMeaning: The act of washing out a hollow part of the body, above all the stomach, by sending water
  through it.
scope: The act of washing out a hollow part of the body, above all the stomach, by sending water through
  it; not washing the skin, and not a wash with drugs.
examples:
- The doctor ordered a lavage of the patient's stomach.
- A lavage cleared the poison from his stomach.
