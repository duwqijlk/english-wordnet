senseId: 'palaver%2:32:01::'
synsetId: 00770823-v
simpleMeaning: To win a person over by gentle urging, kind touches, or words of praise meant to please.
scope: 'Also called coax, wheedle, cajole, inveigle, and blarney: to win a person over by gentle urging,
  kind touches, or words of praise meant to please, not loud, confused, empty talk, and not talking fast
  and without stopping about things that do not matter.'
examples:
- He palavered her into going along with the plan.
- She palavered the guard into opening the gate.
