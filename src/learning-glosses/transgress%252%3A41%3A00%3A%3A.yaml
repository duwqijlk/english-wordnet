simpleMeaning: to act as if laws, rules, deals, or promises do not matter and go against them
scope: Break, offend, breach and violate are other names for this sense. This is going against laws, rules,
  deals or promises, not sinning against God or against a moral law.
examples:
- Anyone who transgresses the rules will lose the game.
- He transgressed the law by taking money that was not his.
