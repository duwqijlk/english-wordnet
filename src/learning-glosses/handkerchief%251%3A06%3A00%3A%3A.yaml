simpleMeaning: A square piece of cloth you use to wipe your eyes or nose, or to wear as part of a costume
scope: A cloth for wiping the eyes or nose, not a scarf and not a towel.
examples:
- He took out his handkerchief and blew his nose.
- She waved her handkerchief as the train left.
