simpleMeaning: able to be pressed or worked into a new shape, most of all when made of earth or clay or
  other soft stuff
scope: 'Also called moldable and plastic: able to be shaped into a new form, most of all from soft stuff
  like clay, not hard and not able to spring back into shape.'
examples:
- Clay is a fictile material that potters shape by hand.
- Wax is fictile, so it can be pressed into new forms.
