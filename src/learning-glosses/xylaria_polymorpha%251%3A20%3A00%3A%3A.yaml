simpleMeaning: Parts that spread tiny bits for new growth, from mushroom-like living things of one kind
  of fungus
scope: Also called dead-man's-fingers and dead-men's-fingers, these are the parts of a fungus that spread
  tiny bits for new growth, not the fingers of a dead person and not a mushroom eaten as food.
examples:
- The Xylaria polymorpha on the log looked like dark fingers.
- Xylaria polymorpha grows in clusters on dead wood.
