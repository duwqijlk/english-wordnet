simpleMeaning: An unknown and unpredictable force that brings about a good result.
scope: This is not the neutral sense covering any outcome, good or bad; here the result is a good one.
examples:
- It was sheer luck that the rain stopped before the match.
- He put his success down to luck rather than skill.
