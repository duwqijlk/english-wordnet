simpleMeaning: short in height, below the usual size for a person or thing of that kind, and not tall
scope: This is not about importance or amount, and not about the fond or hostile feeling that smallness
  can stir.
examples:
- The little boy had to stand on a chair to reach the shelf.
- They live in a little house at the end of the lane.
