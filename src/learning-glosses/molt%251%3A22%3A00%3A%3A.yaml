simpleMeaning: the regular loss of the hard outer covering in animals such as crabs and insects, or of
  the outer skin in animals such as snakes
scope: 'Also called molting, moult, moulting, and ecdysis: the regular loss of an outer covering or skin
  by crabs, insects, or snakes, not the loss of hair or feathers by other animals.'
examples:
- During its molt, the snake lost its old outer skin.
- The crab's molt left a hard, empty covering on the sand.
