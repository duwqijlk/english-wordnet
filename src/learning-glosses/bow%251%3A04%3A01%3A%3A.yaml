simpleMeaning: A single sweep of the curved wooden tool with tight horsehair across the strings of a stringed
  instrument.
scope: This is one movement of the playing tool across the strings, not the tool itself and not the archery
  weapon.
examples:
- A single slow bow across the strings filled the hall with sound.
- The cellist played the whole passage in one smooth bow.
