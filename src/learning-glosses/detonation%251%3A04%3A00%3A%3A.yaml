simpleMeaning: the act of setting off an explosive so that it bursts suddenly and with great force
scope: The act of setting off an explosive so that it bursts, not the explosive itself and not the loud
  sound on its own.
examples:
- The army planned the detonation of the bomb at dawn.
- The soldiers carried out the detonation of the explosives at dawn.
