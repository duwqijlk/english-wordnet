simpleMeaning: A soft gap on either side of the skull where four bones come together; when the bones harden,
  it turns into a joined area called the pterion.
scope: One of the soft side gaps at the temple, distinct from the big gap on the crown and the tiny one
  at the back.
examples:
- The sphenoidal fontanel is found on the side of the skull.
- In newborns, the sphenoidal fontanel is still open.
