simpleMeaning: a tall leafy plant with upright branches and large yellow daisy-like heads whose petals
  arch downward, growing from the Rocky Mountains south to Arizona and east to the Atlantic coast
scope: A tall yellow-flowered coneflower of the Rocky Mountains and eastern North America; not the purple
  coneflower used as herbal medicine, and not a black-eyed Susan.
examples:
- The cutleaved coneflower grows on rocky slopes in the Rockies.
- We found a cutleaved coneflower with large yellow heads.
