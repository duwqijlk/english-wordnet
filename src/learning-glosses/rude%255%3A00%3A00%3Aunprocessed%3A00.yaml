simpleMeaning: Used especially of goods that are bought and sold, either untreated or put through only
  the simplest steps.
scope: This describes goods that are natural or only simply worked, not early and simple technology and
  not bad manners.
examples:
- The mill buys rude cotton straight from the growers.
- Bales of rude wool were stacked by the door.
