simpleMeaning: Used especially of goods that are bought and sold, left in its natural state and not put
  through a full manufacturing process.
scope: This describes goods in their natural, unworked state, not early and simple technology and not
  bad manners.
examples:
- The mill buys rude cotton straight from the growers.
- Bales of rude wool were stacked by the door.
