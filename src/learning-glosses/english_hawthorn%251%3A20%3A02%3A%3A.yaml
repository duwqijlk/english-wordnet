simpleMeaning: A European thorn tree with deeply cut leaves and bright red fruit, widely grown in many
  forms, often as hedges nothing can pass through, and wild in eastern North America.
scope: A European thorn tree with deeply cut leaves, also called Crataegus monogyna; not the other hawthorn
  of the same name with dense clusters of white to scarlet flowers.
examples:
- An English hawthorn hedge lined the old lane.
- The English hawthorn in the garden was covered in red berries.
