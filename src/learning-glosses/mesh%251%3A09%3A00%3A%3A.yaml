simpleMeaning: the way a network is laid out, with each part joined straight to all the other parts
scope: The way a network is laid out, with each part joined straight to all the other parts; not a woven
  fabric of string or wire, and not a count of openings in a screen.
examples:
- Every computer in the mesh links straight to all the others.
- In a mesh, no single part stands between two others.
