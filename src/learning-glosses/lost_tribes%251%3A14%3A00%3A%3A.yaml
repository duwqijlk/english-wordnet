simpleMeaning: The ten groups of Israel sent away as prisoners to Assyria around 720 BC, leaving only
  the groups of Judah and Benjamin.
scope: The ten Israelite groups taken prisoner to Assyria, not the two groups of Judah and Benjamin that
  stayed, and not the whole people of Israel.
examples:
- The Lost Tribes were taken to Assyria around 720 BC.
- Only Judah and Benjamin stayed behind when the Lost Tribes were sent away.
