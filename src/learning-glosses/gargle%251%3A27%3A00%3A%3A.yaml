simpleMeaning: a liquid with medicine in it, used to wash the mouth and throat
scope: 'Also called mouthwash: a liquid with medicine in it for washing the mouth and throat; not the
  act of washing, and not the sound made when doing it.'
examples:
- She bought a gargle at the shop for her sore throat.
- Use this gargle twice a day and do not drink it.
