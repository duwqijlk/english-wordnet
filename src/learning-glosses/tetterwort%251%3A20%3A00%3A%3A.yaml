simpleMeaning: A plant of North American woods with a white spring flower and a lobed leaf; its root and
  red sap cause vomiting; the root was a stimulant and chest medicine.
scope: This white-flowered woodland plant with red sap and a medicinal root, not any other low spring
  flower.
examples:
- Tetterwort grows in the shade of North American woods.
- In early spring, tetterwort sends up a single white bloom.
