senseId: 'diffusor%1:06:01::'
synsetId: 03199676-n
simpleMeaning: sound waves in a room spread out by a board so they are the same in all parts
scope: A board that spreads sound out the same way in all parts of a room, also called a diffuser, and
  not a thing that spreads light.
examples:
- The diffusor on the hall wall spread the music out so it sounded the same at the back.
- Workers fixed a diffusor behind the stage to spread the sound waves evenly.
