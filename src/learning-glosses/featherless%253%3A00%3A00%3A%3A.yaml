simpleMeaning: with no feathers growing on the body
scope: This describes a body with no feathers on it, the opposite of being covered with feathers. It is
  not the soft light part itself that grows on a bird.
examples:
- The baby bird was still featherless and could not fly.
- A human is a featherless animal with two legs.
