simpleMeaning: A long thin board, thick on one edge, laid so each board laps over the one below to cover
  a wall.
scope: Also called clapboard, a long thin board, thick on one edge, laid lapping over the board below
  to cover a wall.
examples:
- The cottage walls were covered with weatherboard, each board lapping over the one below.
- He nailed a weatherboard over the gap in the shed wall.
