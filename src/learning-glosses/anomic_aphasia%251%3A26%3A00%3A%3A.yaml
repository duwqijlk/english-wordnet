senseId: 'anomic_aphasia%1:26:00::'
synsetId: 14122145-n
simpleMeaning: Not being able to name things, or to know the written or spoken names of things
scope: Not being able to name things, or to know their written or spoken names; amnesic aphasia, amnestic
  aphasia, anomia and nominal aphasia are other names for this sense, not forgetting what things are for
  and not being unable to speak at all.
examples:
- Anomic aphasia made it hard for her to name everyday things.
- After the stroke, anomic aphasia left him reaching for words.
