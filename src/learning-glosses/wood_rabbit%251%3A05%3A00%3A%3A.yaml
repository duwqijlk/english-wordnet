simpleMeaning: A small rabbit found across North America, with grey-brown fur and a white patch under
  its tail; it can carry the ticks that spread Lyme disease.
scope: The same animal as the cottontail rabbit, under another name; cottontail and cottontail rabbit
  also name this small North American rabbit with a white tail underside.
examples:
- A wood rabbit hopped across the dirt road at dusk.
- The wood rabbit's white tail flashed as it ran for cover.
