simpleMeaning: to draw people in with such strong pull that they cannot look away, as if a magnet were
  pulling them
scope: To draw people in by a strong pull, also called bewitch; not a magic trick, and not just to please
  them.
examples:
- Her singing mesmerized the crowd, and no one moved until the last note.
- The storyteller mesmerized the children with his tales of faraway lands.
