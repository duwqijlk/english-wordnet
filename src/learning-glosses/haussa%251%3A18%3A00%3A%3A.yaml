simpleMeaning: Most of the members of this Black people live in northern Nigeria, and this person is one
  of them.
scope: A member of a Black people of northern Nigeria, also called Hausa; not a speaker of the Haussa
  language and not a member of another Nigerian people.
examples:
- She is a Haussa from Kano in northern Nigeria.
- The Haussa of northern Nigeria are known for their trade.
