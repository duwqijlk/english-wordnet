simpleMeaning: Unable to be altered, shifted, or cancelled, as when prices are held at one level.
scope: This means unchangeable in a general way, not firmly attached in place and not a number that keeps
  one value.
examples:
- Our mortgage has a fixed rate for five years.
- The rules are fixed and cannot be altered by the committee.
