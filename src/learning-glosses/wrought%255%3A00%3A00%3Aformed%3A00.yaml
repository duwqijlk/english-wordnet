simpleMeaning: made to fit by bending and pressing a soft mass into shape, or as if it had been bent and
  pressed that way
scope: 'Also called shaped and molded: worked from a soft mass into a shape that fits, not a thing simply
  hammered into shape by force.'
examples:
- The wrought silver bracelet shone in the light.
- The wrought iron gate was made to fit the arch.
