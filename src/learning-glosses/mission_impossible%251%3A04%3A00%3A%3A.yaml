senseId: 'mission_impossible%1:04:00::'
synsetId: 00732946-n
simpleMeaning: A task so hard or so full of danger that it seems it cannot be done
scope: This is a task that seems too hard or too full of danger to be done, not merely a hard task and
  not a task that is only secret.
examples:
- Rescuing the climbers in the storm felt like a mission impossible.
- The general called the crossing a mission impossible.
