senseId: grooved%5:00:00:established:00
synsetId: 01640151-s
simpleMeaning: set in a fixed way that is hard to change, after being in place for a long time
scope: This sense means fixed and hard to change after a long time in place. It is not about a line or
  cut made in wood, metal, or stone.
examples:
- His habits were so grooved that he ate at the same time every day.
- After twenty years, her work routine was deeply grooved and hard to change.
