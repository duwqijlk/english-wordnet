simpleMeaning: Questions about the illnesses of a patient's relatives are asked to learn if the patient
  may get the same illnesses; this is part of the patient's medical record
scope: A doctor's questions about illnesses among a patient's relatives, not a list of the patient's own
  past illnesses and not a record of one relative's health.
examples:
- The doctor took a family history to check for heart disease in her relatives.
- His family history showed that his father and grandfather had diabetes.
