simpleMeaning: The study of how messages are sent and how they reach people, by print, radio, television,
  and other means
scope: The study of how messages are sent and reach people, also called communications, not the study
  of one message and not the work of sending a single letter.
examples:
- Communication theory is his main field of study.
- She took a course in communication theory to learn how news spreads.
