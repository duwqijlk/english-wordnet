simpleMeaning: a quick answer to a question or to something someone says, especially a clever or sharp
  one
scope: This is a quick answer to what someone says, especially a clever or sharp one, and return is another
  name for this sense; it is not a shop table and not a game piece.
examples:
- When she said he was lazy, his counter was sharp and funny.
- His quick counter left the teacher with nothing to say.
