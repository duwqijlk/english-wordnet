simpleMeaning: A member of a Germanic people who conquered England and joined the Angles and Jutes to
  form a new people; they ruled England until the Norman Conquest.
scope: A member of an early English people, not a Norman invader and not a modern English person.
examples:
- The Saxon warrior settled in England after the conquest.
- A Saxon king ruled the land before the Normans came.
