senseId: 'palliative%1:06:00::'
synsetId: 03885551-n
simpleMeaning: a medicine or care that makes pain less, but does not cure the illness that causes it
scope: A medicine or care that makes pain less without curing the illness; it is not a cure.
examples:
- The doctor gave her a palliative to make the pain less.
- For him, the drug was only a palliative, not a cure.
