simpleMeaning: a small tree of eastern North America that keeps its leaves all year, with tiny scale-like
  leaves on flat little branches
scope: A small tree of eastern North America that keeps its leaves all year; also called white cedar,
  not a pine and not a leaf-losing tree.
examples:
- Northern white cedar grows in the damp woods of the east.
- The fence was made from northern white cedar, which lasts well outdoors.
