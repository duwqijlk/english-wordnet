simpleMeaning: All the dancers hold hands as they move through many set shapes in a quick, joyful dance
  from Provence, in France
scope: A joyful dance from Provence where the dancers hold hands, not a slow dance and not a dance done
  alone.
examples:
- The villagers danced the farandole at the summer fair.
- She joined the farandole and held hands with the dancers on each side of her.
