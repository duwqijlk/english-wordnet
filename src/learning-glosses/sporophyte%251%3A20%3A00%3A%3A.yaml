simpleMeaning: the plant form that makes tiny grains which grow into new plants, in a plant life that
  swaps between two forms
scope: The plant form that makes tiny grains which grow into new plants, in a plant life that swaps between
  two forms; not the form that makes sex cells and not the plant itself as a whole.
examples:
- The fern's sporophyte is the tall leafy plant we see.
- A sporophyte makes the tiny grains that start the next form.
