simpleMeaning: A small Asian deer with small antlers and a cry that sounds like a bark.
scope: A small Asian deer with small antlers and a bark-like call; barking deer is another name for it,
  not a large deer and not a dog.
examples:
- A muntjac called from the edge of the forest.
- We heard the muntjac bark in the dark.
