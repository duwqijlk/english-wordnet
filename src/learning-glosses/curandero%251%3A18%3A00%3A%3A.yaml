simpleMeaning: A man from Mexico who heals sick people with old ways of healing passed down from the Maya
  people
scope: This is a Mexican man who heals with old Maya ways, not a trained doctor and not the woman healer
  called a curandera.
examples:
- The curandero gave him a tea of herbs.
- He learned his craft from a curandero in Oaxaca.
