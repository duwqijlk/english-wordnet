senseId: 'attest%2:32:00::'
synsetId: 00822013-v
simpleMeaning: to say, when acting as an official, that something is true, real, or correct
scope: To say in an official job that a thing is true or correct; not to give proof for a thing by how
  you act, and not to show that a word was in use.
examples:
- The officer attested the signature on the form.
- She attested that the name on the paper was correct, as part of her official work.
