simpleMeaning: to hold back from giving yourself a thing, most of all a pleasure you want
scope: To hold back from giving yourself a thing, most of all a pleasure, not to say a thing is not true
  and not to say no to knowing a person.
examples:
- She will deny herself wine and cake for a month.
- He must deny himself the pleasure of a lie-in to train each day.
