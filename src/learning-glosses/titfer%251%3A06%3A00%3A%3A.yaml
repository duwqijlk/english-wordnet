simpleMeaning: A hat, in Cockney rhyming slang, from 'tit for tat', which rhymes with 'hat'.
scope: In Cockney rhyming slang this hat is called a titfer, because 'tit for tat' rhymes with 'hat'.
examples:
- He tipped his titfer to the lady as he passed.
- My grandfather always wore a titfer on Sundays.
