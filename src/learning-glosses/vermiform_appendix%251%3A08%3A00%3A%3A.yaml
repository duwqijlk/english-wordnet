simpleMeaning: a small leftover pouch-like part that grows out from the lower end of the large gut, with
  no clear use
scope: 'Also called an appendix, a cecal appendage, and a vermiform process: a small pouch-like part at
  the end of the gut, not the gut itself and not a part that does useful work.'
examples:
- The doctor removed his vermiform appendix after it became sore and swollen.
- A vermiform appendix is a small pouch that hangs off the lower end of the gut.
