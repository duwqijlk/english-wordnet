simpleMeaning: In music, a rapid wavering between a note and the note a semitone (half a step) above it
scope: The musical ornament, a quick alternation with the note just above, not the bodily tremor caused
  by cold or fear.
examples:
- The singer added a shake to the last note of the phrase.
- A well-played shake can make a long held note sound alive.
