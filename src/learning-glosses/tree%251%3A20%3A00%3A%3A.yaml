simpleMeaning: A tall plant that lives for many years, has a hard woody stem, and grows branches and leaves
  high above the ground, including both cone-bearing and flowering kinds.
scope: This sense is not a bush or shrub, but a tall woody plant with a single main stem and a raised
  crown of branches.
examples:
- The old oak tree in the garden is over two hundred years old.
- We sat in the shade of a tall tree.
