simpleMeaning: a kind of tuberculosis that makes the small soft glands that fight illness swell up
scope: This is a form of tuberculosis marked by swollen glands; also called king's evil and struma, not
  ordinary tuberculosis of the lungs and not a simple swollen gland.
examples:
- The old book described scrofula as a disease that made the glands swell.
- He was treated for scrofula after the glands in his body swelled and stayed sore.
