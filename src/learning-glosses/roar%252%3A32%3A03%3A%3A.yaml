simpleMeaning: To say something in a very loud, forceful voice.
scope: Words spoken at high volume and with force, not wordless crying and not the noise of wind, water
  or engines.
examples:
- The trainer roared at the team to keep moving.
- She roared a warning across the noisy factory floor.
