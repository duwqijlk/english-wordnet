simpleMeaning: A follower of the teaching set out in leaflets called Tracts for the Times, and a backer
  of the Oxford movement.
scope: This is a person who follows the teaching and backs the Oxford movement, not the Oxford movement
  itself, the teaching on its own, or the leaflets called Tracts for the Times.
examples:
- The Tractarian wrote for the Tracts for the Times.
- As a Tractarian, he backed the Oxford movement.
