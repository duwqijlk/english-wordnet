simpleMeaning: To work out an answer or judgment by thinking carefully step by step.
scope: This is about reaching a conclusion in your mind, not about giving spoken arguments for it.
examples:
- He reasoned that the train must have been delayed by snow.
- She reasoned carefully before choosing the cheaper plan.
