simpleMeaning: An animal of western North America with long ears and antlers that split into two points
scope: An animal of western North America with long ears and two-pointed antlers; mule deer is another
  name for this sense, not an animal with single-point antlers and not a rabbit.
examples:
- A burro deer stood at the edge of the trees.
- Burro deer have long ears and two-pointed antlers.
