simpleMeaning: the typical quality that makes a place or thing what it is.
scope: It is not a person's moral nature, a figure in a story, or a letter on a page; it is the special
  quality of a thing or place.
examples:
- The little cafes give the town its character.
- The old wooden houses add character to the street.
