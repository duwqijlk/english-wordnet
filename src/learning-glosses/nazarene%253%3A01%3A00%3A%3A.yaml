simpleMeaning: Said of things that belong to the town of Nazareth, or its people, or have to do with them.
scope: This word is about things of that town or its people, not a person who lives there, not a member
  of the early group that followed Jesus, and not a word about the Nazarenes or their religion.
examples:
- They visited a Nazarene market in the town of Nazareth.
- Nazarene customs come from that town and its people.
