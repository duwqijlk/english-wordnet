simpleMeaning: With purple, pink or white flowers, this plant climbs in the middle and south of Europe,
  lives for years, and now grows at home in North America.
scope: Also called perennial pea, this is a plant that lives for years and climbs, from the middle and
  south of Europe, with purple, pink or white flowers, now at home in North America; other climbing plants
  with purple or pink flowers are its nearest rivals.
examples:
- Broad-leaved everlasting pea climbs up, with purple, pink or white flowers.
- We saw broad-leaved everlasting pea growing wild in North America.
