simpleMeaning: Said of ideas and the like that cannot be stood up for or shown to be right.
scope: 'Also called untenable: an idea that cannot be defended, not one that cannot be forgiven or excused.'
examples:
- His theory is indefensible after the new facts came out.
- The claim looked indefensible once the numbers were checked.
