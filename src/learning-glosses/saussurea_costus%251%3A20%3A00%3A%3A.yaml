simpleMeaning: A one-year herb of the eastern Himalayas in Kashmir, with purple florets and a fragrant
  root that yields a light, quick-vanishing oil used in perfume and to keep furs safe.
scope: Also called costusroot and Saussurea lappa; not a shrub.
examples:
- The Saussurea costus grew purple flowers in Kashmir.
- Perfumers prize the fragrant root of Saussurea costus.
