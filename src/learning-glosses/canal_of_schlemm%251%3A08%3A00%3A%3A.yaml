simpleMeaning: In the eye, a round channel that drains the clear liquid from the front space of the eye
  into the small veins at the front of the eye.
scope: 'Also called sinus venosus sclerae or Schlemm''s canal: a round channel in the eye that drains
  the clear liquid from the front space of the eye into the small veins at the front of the eye.'
examples:
- The canal of Schlemm drains fluid from the eye.
- Doctors study the canal of Schlemm when eye pressure is high.
