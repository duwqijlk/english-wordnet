simpleMeaning: To do with the start of the universe and its story, shape and motion, in the branch of
  star study
scope: This word is used of the branch of star study that covers the start of the universe, its history,
  how it is put together and how it moves; cosmogenic, cosmogonic, cosmologic and cosmological are other
  names for this sense.
examples:
- The cosmogonical view looks back to the start of the universe.
- She wrote a cosmogonical essay on the birth of the stars.
