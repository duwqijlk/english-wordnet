simpleMeaning: a low bush plant grown above all in the southern United States, with small flat seeds that
  can be eaten
scope: A low bush plant grown above all in the southern United States, also called butter bean, lima bean
  and butter-bean plant; not a climbing bean plant and not a pea plant.
examples:
