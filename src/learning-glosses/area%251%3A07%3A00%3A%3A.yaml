simpleMeaning: the amount of flat surface inside the edges of a shape or place.
scope: This is not a region or a subject of study; it is the measured amount of flat surface inside a
  boundary.
examples:
- The area of the rectangle is twelve square metres.
- They measured the area of the field before planting.
