simpleMeaning: Made where the two hip veins join, this blood vessel takes blood from the legs and belly
  organs into the back of the heart's right upper room.
scope: Also called postcava, this is the blood vessel that carries blood from the legs and belly into
  the heart, not the vessel that carries blood from the head and arms.
examples:
- Blood from the legs returns through the inferior vena cava.
- The surgeon clamped the inferior vena cava during the operation.
