simpleMeaning: made by crossing threads, thin strips of material, or other things over and under each
  other to make one whole piece
scope: Made by crossing threads, strips of material, or other things over and under each other; not made
  by sewing or gluing, and not one ready-made piece that was just cut out.
examples:
- She wore a woven scarf with red and blue threads.
- They sold woven baskets at the market.
