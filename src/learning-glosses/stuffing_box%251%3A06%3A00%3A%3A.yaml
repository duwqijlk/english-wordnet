simpleMeaning: Soft material pressed tight round a rod or piston that moves back and forth fills this
  small hollow space, so nothing leaks past.
scope: Packing box is another name for this small hollow space, where soft material is pressed tight round
  a rod or piston that moves back and forth.
examples:
- The stuffing box held soft material pressed tight round the rod.
- The stuffing box kept water from leaking past the moving piston.
