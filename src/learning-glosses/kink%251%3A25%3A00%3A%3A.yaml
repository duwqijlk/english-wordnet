simpleMeaning: A sharp bend in a line, made when a loop in it is pulled tight
scope: 'Also called twist and twirl: a sharp bend in a line, not a painful tight muscle in the neck or
  back, and not a person with unusual sexual tastes.'
examples:
- There was a kink in the garden hose, so the water stopped.
- He pulled the rope straight to get the kink out.
