simpleMeaning: When light hydrogen cores join at great heat, this weapon lets out the atomic power stored
  in them, turning them into helium.
scope: People also call this a fusion bomb and a hydrogen bomb.
examples:
- The thermonuclear bomb drew its blast from hydrogen atoms joining at great heat.
- The thermonuclear bomb left helium behind when it went off.
