simpleMeaning: a bank paper that pays money back only after you give notice first or on a set later day
scope: A bank paper that pays money back only after notice or on a set later day, not a bank account you
  can draw on at any time and not a loan.
examples:
- He put his savings into a time deposit that matures next year.
- A time deposit pays more than a savings account because the money stays put.
