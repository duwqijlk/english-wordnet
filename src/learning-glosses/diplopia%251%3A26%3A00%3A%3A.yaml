simpleMeaning: a problem with sight in which one thing is seen as two things
scope: A problem with sight in which one thing looks like two, also called double vision, and not a problem
  with sight that makes things look blurred or a squint.
examples:
- After the knock to his head, the diplopia made him see two doorways.
- Her diplopia cleared up when she covered one eye.
