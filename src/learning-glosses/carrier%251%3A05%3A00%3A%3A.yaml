simpleMeaning: In genetics, a living thing with a hidden gene covered by a stronger gene, so the trait
  does not show but can be passed on to its young
scope: A living thing that can pass on a hidden trait, not a warship that carries planes, a rack on a
  vehicle, or a radio wave that sends a signal.
examples:
- The carrier showed no sign of the disease, but her children could still inherit it.
- The doctor told the carrier that the hidden gene could be passed on to his children.
