simpleMeaning: A man-made stuff with a structure of long chains of small parts joined together, above
  all in its raw state, used chiefly in plastics.
scope: This is a man-made stuff of long chains of small parts, used chiefly in plastics, not a gum from
  a tree and not a finished plastic.
examples:
- The factory mixed synthetic resin into the plastic.
- Synthetic resin hardens into a tough coating.
