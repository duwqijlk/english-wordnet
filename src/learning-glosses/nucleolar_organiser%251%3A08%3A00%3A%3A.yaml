senseId: 'nucleolar_organiser%1:08:00::'
synsetId: 05443053-n
simpleMeaning: The part of a gene-carrying thread in a cell that stays close to a small round body in
  the cell nucleus after the nucleus has split.
scope: The part of a chromosome that stays close to the nucleolus after division; nucleolar organizer,
  nucleolus organiser and nucleolus organizer are other names for this; not the nucleolus itself, and
  not any other part of the chromosome.
examples:
- After the nucleus divided, the nucleolar organiser stayed close to the nucleolus.
- Scientists traced the nucleolar organiser to one part of the chromosome.
