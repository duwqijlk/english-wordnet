simpleMeaning: describing summer nights in far northern places where the sun hardly goes down.
scope: This is not about the color of the sky or of anything on the ground; it names a kind of summer
  night near the top of the world.
examples:
- We walked at midnight through the white nights of the far north.
- In June the city holds a festival during its white nights.
