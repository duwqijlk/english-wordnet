simpleMeaning: A big group of tiny living things with stiff outer walls; the moving kinds have little
  tails
scope: A big group of tiny living things with stiff outer walls; eubacteria is another name for this sense,
  not a group of tiny living things without walls and not a mould.
examples:
- Eubacterium is a big group of tiny living things with stiff outer walls.
- Some members of eubacterium move with little tails.
