simpleMeaning: A hero or heroine who stands firm in danger shows courage beyond what most people can call
  on, above all in battle.
scope: Valiance, valiancy, valour, valor, heroism and gallantry are other names for this sense, the courage
  of a hero or heroine in danger.
examples:
- His valorousness in battle earned him great honour.
- She showed valorousness when danger came.
