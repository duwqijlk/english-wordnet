simpleMeaning: The Dhegiha way of speaking used by the people it is named for
scope: This is the Dhegiha way of speaking used by the Kansa people; Kansas is another name for it, not
  the Kansa people themselves and not another Dhegiha way of speaking.
examples:
- The old man still spoke Kansa with his friends.
- Kansa is one of the Dhegiha ways of speaking.
