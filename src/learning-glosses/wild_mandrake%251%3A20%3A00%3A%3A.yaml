simpleMeaning: A herb of North America, it hides poison in thick stems under the ground, yet bears fruit
  that can be eaten though it has little taste.
scope: Also called mayapple, it is a herb of North America with poison in its thick stems under the ground
  and fruit that can be eaten.
examples:
- The wild mandrake has fruit that can be eaten, though it has little taste.
- Poison hides in the thick stems of the wild mandrake under the ground.
