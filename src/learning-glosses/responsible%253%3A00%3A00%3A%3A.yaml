simpleMeaning: Deserving trust or given important duties that must be handled carefully, and answerable
  for what happens.
scope: This is not the neutral sense of being the cause of something; it means having duties to carry
  out or being answerable for what you do.
examples:
- She is responsible for the safety of the children.
- He was held responsible for the damage.
