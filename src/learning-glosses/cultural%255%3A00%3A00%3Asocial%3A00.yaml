simpleMeaning: showing or coming from the shared habits and way of life that a group has built up over
  time.
scope: This is not limited to the arts and preferred manners; it covers the whole set of living habits
  a group has built up.
examples:
- Food habits are a strong cultural marker of identity.
- The children grew up between two cultural worlds.
