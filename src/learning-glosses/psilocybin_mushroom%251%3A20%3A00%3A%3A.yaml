simpleMeaning: A fungus with a substance in it that makes you see things that are not there, eaten as
  a drug
scope: 'Psychedlic mushroom, shroom and magic mushroom are other names for this sense: a fungus eaten
  as a drug because it makes you see things that are not there, not the stuff alone got from the fungus.'
examples:
- He ate a psilocybin mushroom and began to see bright shapes that were not there.
- The psilocybin mushroom is eaten as a drug that changes what you see.
