simpleMeaning: a device that holds a spinning part steady and takes the push that runs along the line
  of its spin
scope: This holds a turning part and takes the push along its line of spin, not a stage that juts into
  the seats and not a crack in rock.
examples:
- The engineer fitted a new thrust bearing to the pump.
- The thrust bearing in the turbine takes the push of the turning blades.
