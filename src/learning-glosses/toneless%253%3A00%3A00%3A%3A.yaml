simpleMeaning: having a sound that stays the same all the time and shows no feeling in the way it is said
scope: This sense is about a voice or sound that stays the same and shows no feeling; it is not about
  having a sound of a named kind.
examples:
- He read the letter in a toneless voice that showed no feeling.
- Her toneless answer made the sad news sound flat.
