simpleMeaning: A new trial where the same court reexamines already-decided issues, after the first trial
  was found improper or unfair through procedural errors.
scope: A second hearing of a case by the same court after the first hearing was found unfair because of
  mistakes in how it was run, not a first hearing.
examples:
- The court ordered a retrial when the first hearing was found unfair.
- At the retrial, the same court looked again at the points already settled.
