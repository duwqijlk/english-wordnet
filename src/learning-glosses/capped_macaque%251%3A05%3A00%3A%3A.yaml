simpleMeaning: a monkey from India with a tuft of hair on its head shaped like a bonnet
scope: 'Also called bonnet macaque, bonnet monkey and crown monkey: a monkey from India with a bonnet-like
  tuft of hair, not a monkey with no tuft and not a monkey from elsewhere.'
examples:
- The capped macaque sat grooming its bonnet-like tuft of hair.
- A capped macaque from India watched us from the branch.
