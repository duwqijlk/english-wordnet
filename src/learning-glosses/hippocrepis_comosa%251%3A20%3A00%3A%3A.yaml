simpleMeaning: A European woody plant that lives many years, with yellow flowers in flat-topped bunches,
  followed by flat pods that break into horseshoe-shaped parts.
scope: 'Also called horseshoe vetch: a European woody plant that lives many years, with yellow flowers
  in flat-topped bunches and flat pods that break into horseshoe-shaped parts; other European plants with
  yellow flowers have pods that do not break into such parts.'
examples:
- Hippocrepis comosa grows in Europe with yellow flowers in flat-topped bunches.
- The flat pods of Hippocrepis comosa break into horseshoe-shaped parts.
