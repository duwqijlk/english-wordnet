senseId: 'musculus_tibialis%1:08:00::'
synsetId: 05599011-n
simpleMeaning: One of two bands of flesh joined to bone in each leg that start at the shin bone and move
  the foot
scope: One of two bands of flesh joined to bone in each leg that move the foot, not a band of flesh in
  the arm and not the shin bone itself.
examples:
- The musculus tibialis in her left leg was sore after the long walk.
- Damage to the musculus tibialis made it hard for him to lift his foot.
