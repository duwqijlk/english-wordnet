simpleMeaning: Stopping or getting rid of the knocking sound an engine makes when it burns fuel.
scope: This describes stopping the knocking sound in an engine; antiknock is another name for it, and
  it is not a kind of fuel or a part of the engine.
examples:
- The new fuel has antiknocking properties that keep the engine quiet.
- Her car runs on petrol with a high antiknocking rating.
