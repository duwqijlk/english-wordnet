simpleMeaning: music liked by many people from the West Indies, with short low parts that repeat and a
  guitar playing groups of notes between the main beats in a steady way
scope: A kind of music that began in the West Indies, not rock or any other kind of popular music with
  a guitar.
examples:
- The band played reggae all evening at the beach.
- She collects old reggae songs from Jamaica.
