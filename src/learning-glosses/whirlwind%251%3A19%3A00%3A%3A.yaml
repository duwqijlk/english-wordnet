simpleMeaning: a more or less upright pillar of air that spins round and round as it moves along the ground
scope: A spinning column of air moving along the ground, not a sudden rush of activity.
examples:
- A whirlwind tore across the field and lifted the hay.
- The whirlwind spun dust high into the air.
