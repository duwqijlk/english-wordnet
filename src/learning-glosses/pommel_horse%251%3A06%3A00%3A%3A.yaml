simpleMeaning: Held up by two steel legs, one at each end, this gym equipment has a tube-shaped body covered
  in leather and two upright grips near the middle
scope: Also called side horse, this is gym equipment with a tube-shaped leather-covered body and two upright
  grips near the middle, held up by two steel legs, not a live horse.
examples:
- The pommel horse in the gym has two upright grips near the middle.
- Its tube-shaped body is covered in leather, and two steel legs hold the pommel horse up, one at each
  end.
