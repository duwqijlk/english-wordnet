simpleMeaning: A sudden loud sound makes a very young baby stretch out its arms and bend its legs, a thing
  young babies do without thinking.
scope: It is a thing young babies do without thinking, not a movement a baby chooses to make.
examples:
- The startle reflex made the baby throw out her arms at the bang.
- A loud clap set off the startle reflex.
