simpleMeaning: soft, hairy leaves grow on a grass from the Mediterranean that lives for one year, or through
  one winter
scope: 'Also called cheatgrass, downy brome, downy bromegrass, downy cheat and downy chess: soft, hairy
  leaves grow on a grass from the Mediterranean that lives for one year, or through one winter, not a
  grass that lives for many years.'
examples:
- The drooping brome in the dry field had soft hairy leaves.
- Drooping brome grows fast in spring and dies by the end of the year.
