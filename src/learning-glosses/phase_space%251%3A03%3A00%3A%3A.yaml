simpleMeaning: In physics, the directions of a made-up place stand for what must be known to tell how
  a thing or stuff behaves.
scope: In physics, the directions of a made-up place stand for the things that must be known to tell how
  a thing or stuff behaves, so it is not a real room or patch of ground.
examples:
- They mapped the system in a multidimensional phase space.
- They drew a phase space with a direction for every thing they had to know.
