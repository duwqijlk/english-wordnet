simpleMeaning: In maths, a rule that links how a changing amount varies with more than one thing at once
scope: In maths, a rule that joins rates of change for more than one thing at once, not a rule for one
  changing amount only and not a plain sum with an unknown.
examples:
- This partial differential equation describes how heat spreads through a metal plate.
- We solved the partial differential equation for the flow of water in the tank.
