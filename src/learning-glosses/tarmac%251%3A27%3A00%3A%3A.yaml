simpleMeaning: a paving mix of tar and crushed stone, made in a plant and laid down while it is still
  soft
scope: The mix of tar and crushed stone used for paving, not the finished paved surface itself.
examples:
- Workers spread fresh tarmac over the road.
- The tarmac was still soft when the truck drove over it.
