simpleMeaning: As long as one standard unit, this straight flat piece for measuring is usually marked
  off in centimetres and millimetres
scope: 'Also called meterstick: a straight piece for measuring, not a short ruler and not a tape that
  rolls up.'
examples:
- She laid the metrestick along the cloth to measure a metre of fabric.
- The teacher used a metrestick to draw a straight line on the board.
