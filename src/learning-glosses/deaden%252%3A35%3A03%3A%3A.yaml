simpleMeaning: to cut a ring around a tree or plant so that it dies, by stopping water and food from moving
  through it
scope: 'Also called girdle: cutting a ring around a tree or plant to kill it, not about a thing growing
  weaker on its own and not about making a sound less strong.'
examples:
- The farmer deadened the unwanted tree by cutting a ring around its trunk.
- They deadened the plant by cutting deep around its stem.
