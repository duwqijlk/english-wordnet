senseId: 'appear%2:39:01::'
synsetId: 02139137-v
simpleMeaning: Of a statement or idea, to seem true or likely.
scope: This is about how likely a statement or idea is to be true, not about someone giving a certain
  impression, coming into sight, beginning to exist, performing on stage, or attending court.
examples:
- It appears that the weather will improve by the weekend.
- The results appear to confirm the earlier findings.
