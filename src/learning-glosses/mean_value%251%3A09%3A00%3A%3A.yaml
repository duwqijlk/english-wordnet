senseId: 'mean_value%1:09:00::'
synsetId: 06033377-n
simpleMeaning: Add a function of the numbers, then divide by a function of how many numbers there are,
  and the result is this average
scope: Also called mean, this is an average found by adding a function of the numbers and dividing by
  a function of how many there are, not a plain average and not the middle number of a set.
examples:
- The mean value of the readings was close to ten.
- She found the mean value of the set by adding a function of the numbers and dividing by a function of
  how many there were.
