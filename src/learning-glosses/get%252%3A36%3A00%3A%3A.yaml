simpleMeaning: In baseball, to reach a base because the pitcher has thrown four balls to the batter.
scope: This is reaching a base only because the pitcher has walked the batter, not by hitting the ball,
  not scoring a run or point, and not coming to possess something.
examples:
- He got first base on four straight balls.
- She got a base on balls in the third inning.
