simpleMeaning: staying kind and not angry when things take a long time or when work is done badly
scope: 'Also called patience: staying calm with slow or bad work, not a wait before you use a right or
  claim that is yours.'
examples:
- She showed great forbearance when the train was late again and again.
- Even when his helper did the job badly, he spoke with forbearance and did not get angry.
