simpleMeaning: A way of picking some to stand for a whole group, in which the whole group is split into
  smaller groups and some are picked at chance from each one.
scope: 'Also called proportional sampling or stratified sampling: a way of picking some to stand for a
  whole group, in which the whole group is split into smaller groups and some are picked at chance from
  each one, not a pick of the first few at hand.'
examples:
- Representative sampling gave a fair picture of the town.
- The poll used representative sampling to reach every age group.
