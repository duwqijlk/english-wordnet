simpleMeaning: a number that shows the light-wave pattern of each kind of atom
scope: 'Also called rydberg and rydberg unit: a number that shows the light-wave pattern of each kind
  of atom, not a number that measures how long a wave is and not a number that counts waves per second.'
examples:
- The rydberg constant helps scientists work out the light given off by hydrogen.
- She looked up the rydberg constant before doing the sums.
