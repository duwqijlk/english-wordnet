simpleMeaning: Its crystals can carry electric current in a controlled way, and this very hard blue-black
  crystal stuff, called SiC, wears things down and stands up to great heat.
scope: This very hard blue-black crystal stuff is used to wear things down and to stand up to great heat.
examples:
- Silicon carbide can wear down even very hard stuff.
- Crystals of silicon carbide can work as semiconductors.
