senseId: 'leach%2:30:00::'
synsetId: 00489553-v
simpleMeaning: To take things out of something by letting liquid run slowly through it.
scope: This is taking things out of something with liquid running slowly through it; strip is another
  name for this sense, not liquid soaking slowly into the ground or making liquid run through something.
examples:
- Rain can leach the good salts out of poor soil.
- They leach the soil to take out the harmful chemicals.
