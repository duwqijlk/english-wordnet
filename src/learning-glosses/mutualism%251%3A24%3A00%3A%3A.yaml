senseId: 'mutualism%1:24:00::'
synsetId: 13864821-n
simpleMeaning: Each one gains from the other, and the two kinds of living things need each other
scope: 'Also called symbiosis: two kinds of living things that need each other and both gain, not one
  kind living off the other and not two kinds that merely live near each other.'
examples:
- 'The bees and the flowers live in mutualism: the bees get food and the flowers get help making seeds.'
- In mutualism, the oxpecker bird eats ticks off the rhino, and the rhino gets rid of the ticks.
