simpleMeaning: An upright plant of the east and south of the United States that lives for years and bears
  bright yellow-red flowers
scope: 'Also called butterfly weed, chigger flower, chiggerflower, or pleurisy root: an upright plant
  with bright yellow-red flowers, not a vine and not a small garden flower.'
examples:
- Orange milkweed grew along the road in the south.
- The orange milkweed showed bright yellow-red flowers in June.
