simpleMeaning: in a way that shows no kindness or feeling for people who suffer
scope: In a way with no kindness for people who suffer, also called mercilessly, unmercifully and remorselessly;
  not in a kind or gentle way.
examples:
- The guards pitilessly beat the prisoners and would not stop.
- He pitilessly laughed at the crying child and walked away.
