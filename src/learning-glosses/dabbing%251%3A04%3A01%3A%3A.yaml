simpleMeaning: Pressing marijuana made into a very strong form onto a hot surface to turn it into vapour
  and breathe it in
scope: Heating very strong marijuana to breathe in its vapour; not the dance move called dabbing.
examples:
- Dabbing turns the strong marijuana into vapour that is breathed in.
- He tried dabbing once and coughed at once.
