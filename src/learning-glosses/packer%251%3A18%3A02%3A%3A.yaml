simpleMeaning: a person who walks long distances in the country and carries things in a bag on their back
scope: This person, also called a backpacker, walks in the country with a bag on their back. It is not
  a worker who puts things into boxes, and not a person who sells meat to shops.
examples:
- The packer walked for three days through the mountains with all her food on her back.
- Two packers, each with a heavy bag on his back, stopped by the lake to rest.
