simpleMeaning: A foul-smelling Old World plant that can poison people, with sticky hairy leaves and yellow-brown
  flowers; from it come two drugs, hyoscyamine and scopolamine.
scope: Also called black henbane and stinking nightshade, this is a poisonous Old World plant.
examples:
- Henbane grew along the old wall, its yellow-brown flowers easy to spot.
- The farmer warned us that henbane is poisonous.
