simpleMeaning: Without this stuff, made by the lining of the stomach and gut, the body cannot take in
  vitamin B12
scope: A person without this stuff can develop pernicious anemia.
examples:
- Lack of intrinsic factor can result in pernicious anemia.
- His body could not take in vitamin B12 for want of intrinsic factor.
