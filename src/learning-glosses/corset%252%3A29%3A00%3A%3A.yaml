simpleMeaning: to wear or put on a tight piece of clothing worn under other clothes that pulls in the
  waist and shapes the body
scope: This is the verb, to wear or put on the garment, not the tight garment itself.
examples:
- She corseted herself tightly before putting on the evening dress.
- The maid helped corset the bride into her gown.
