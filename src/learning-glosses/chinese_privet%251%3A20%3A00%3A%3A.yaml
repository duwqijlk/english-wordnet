simpleMeaning: An upright green-all-year shrub like a small tree, from China, Korea, and Japan, with sharp-pointed
  leaves and flowers in long upright bunches; it looks like the Japanese kind.
scope: Also called white wax tree and Ligustrum lucidum; an upright green shrub from China, Korea, and
  Japan, not a low garden bush and not the Japanese privet it looks like.
examples:
- Chinese privet grows as a tall shrub in the garden.
- The flowers of Chinese privet open in long upright bunches.
