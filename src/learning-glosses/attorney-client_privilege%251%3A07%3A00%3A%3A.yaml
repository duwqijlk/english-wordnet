simpleMeaning: the right of a lawyer to keep secret what a person who hired them has told them in trust
scope: The right of a lawyer to keep a client's secrets, not a rule that lets a lawyer lie and not the
  client's own right to stay silent.
examples:
- Attorney-client privilege stopped the lawyer from sharing what her client had told her.
- He trusted that attorney-client privilege would keep his words secret.
