simpleMeaning: the official sign of the Nazi Party and the Third Reich, shaped as a cross with arms bent
  at right angles and turning to the right
scope: This is the Nazi sign in the shape of a bent cross, not a plain cross and not any other party sign.
examples:
- A swastika was painted on the wall of the old building.
- The flag carried a black swastika in a white circle.
