simpleMeaning: Secret knowledge got from listening to messages, from electronic signals, or from far-off
  measuring tools.
scope: Signals intelligence is another name for this sense, one kind of secret knowledge got from signals,
  beside other kinds got from people on the ground or from pictures taken from the air.
examples:
- The SIGINT unit listened to messages to gather secret knowledge.
- SIGINT comes from electronic signals and far-off measuring tools.
