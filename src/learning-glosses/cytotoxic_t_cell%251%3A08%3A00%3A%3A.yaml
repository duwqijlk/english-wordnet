schema: oewn-learning-gloss-v2
senseId: 'cytotoxic_t_cell%1:08:00::'
synsetId: 05460092-n
simpleMeaning: A white blood unit with a CD8 marker that spots foreign marks on the outside of a virus-hit
  living unit, joins it and kills it
scope: This is a white blood unit that spots and kills virus-hit body units; killer cell, CD8 cell, CD8
  T cell and killer T cell are other names for this sense, and it stands apart from other white blood
  units by its CD8 marker and its killing of virus-hit units.
examples:
- The cytotoxic T cell bound to the infected cell and killed it.
- Cytotoxic T cells attack cells that carry a virus.
