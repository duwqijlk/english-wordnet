simpleMeaning: A little animal of fresh water, with ten legs and a hard shell, shaped much like a small
  lobster.
scope: A small fresh-water animal with ten legs and a hard shell, also called a crawfish, a crayfish,
  or a crawdaddy; not the same creature served as food after brief boiling.
examples:
- The crawdad hid under a stone in the shallow stream.
- Crawdads scuttled across the bottom of the creek.
