simpleMeaning: the soft parts of the body of an animal with a back bone, made up mainly of muscle and
  fat
scope: The noun for the soft parts of the body, mainly muscle and fat. Not the verb for cleaning animal
  skin to make leather.
examples:
- The cut went deep into the flesh of his arm.
- The lion tore the flesh from the bone.
