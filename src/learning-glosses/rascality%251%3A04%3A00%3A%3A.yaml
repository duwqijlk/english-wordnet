simpleMeaning: wild or mean acts that make other people feel bad or upset
scope: 'Also called mischief, shenanigan, devilry, devilment, roguery, roguishness, deviltry, mischief-making
  and mischievousness: wild or mean acts that bother other people, not a lasting trait of liking pranks
  and not harmless play.'
examples:
- The boys' rascality left the neighbors upset all evening.
- Her rascality at the party annoyed everyone in the room.
