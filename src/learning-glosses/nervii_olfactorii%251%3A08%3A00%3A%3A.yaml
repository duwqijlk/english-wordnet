simpleMeaning: A name for the many thin smell threads in the wet skin inside the nose.
scope: A name for the many thin smell threads inside the nose, also called first cranial nerve and olfactory
  nerve; not one single smell thread and not the eye nerve.
examples:
- The nervii olfactorii carry smell signals from the nose to the brain.
- Damage to the nervii olfactorii can take away the sense of smell.
