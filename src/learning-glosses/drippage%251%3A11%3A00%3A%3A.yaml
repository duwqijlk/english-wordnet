simpleMeaning: drops of a liquid, such as water, that fall one by one from the roof edge of a house
scope: 'Another name for dripping: liquid that falls one drop at a time, not the fat that runs off meat
  as it cooks.'
examples:
- Drippage from the roof edge soaked the path.
- After the rain, drippage from the eaves kept falling on the steps.
