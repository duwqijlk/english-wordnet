simpleMeaning: Its flower heads carry thin white petals spread like rays; this herb lives for many years
  in the southeast United States, once used in folk medicine.
scope: Boneset is also called agueweed or thoroughwort, and is not the European herb of the same name.
examples:
- Boneset grew in the southeast United States.
- People once used boneset in folk medicine.
