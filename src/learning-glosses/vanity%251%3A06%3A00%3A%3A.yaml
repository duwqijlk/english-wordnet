simpleMeaning: A low table with a mirror, where a person sits to dress or to put on makeup
scope: A low table with a mirror for dressing at; dresser is another name for this sense. Not the trait
  of being too pleased with how one looks.
examples:
- She sat at her vanity to put on her makeup.
- The vanity stood in the corner of the bedroom, its mirror catching the light.
