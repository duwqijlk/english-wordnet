simpleMeaning: A kind of tuberculosis that makes the glands of the lymph system swell
scope: This is a kind of tuberculosis that makes the glands of the lymph system swell, not the tuberculosis
  of the lungs and not a swelling from any other cause.
examples:
- The king's evil made the glands in his neck swell.
- She had the king's evil, and the glands under her jaw were swollen.
