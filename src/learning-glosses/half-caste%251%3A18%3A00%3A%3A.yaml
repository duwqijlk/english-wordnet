simpleMeaning: A person whose mother and father come from different peoples or ways of life is called
  by this rude word
scope: A rude word for a person with parents from different peoples or ways of life, not a kind word and
  not a name for a person of one group.
examples:
- The book warns that half-caste is an offensive term.
- He refused to use the word half-caste.
