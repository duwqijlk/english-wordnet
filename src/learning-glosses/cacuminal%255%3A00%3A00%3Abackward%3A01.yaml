simpleMeaning: said with the tip of the tongue turned back toward the hard roof of the mouth
scope: A sound made with the tip of the tongue turned back, not a sound made with the tongue flat and
  not a sound made with the lips.
examples:
- The cacuminal sound in the word is made with the tongue turned back.
- He learned to say the cacuminal sound with the tip of his tongue turned back.
