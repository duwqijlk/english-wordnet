simpleMeaning: to say or write very strong bad things about someone or something
scope: Also called blast, savage and pillory. This means to attack a person or thing with words, not to
  kill a person by fixing them to a cross.
examples:
- The newspapers crucified the mayor for the failed plan.
- Critics crucified the new film in their reviews.
