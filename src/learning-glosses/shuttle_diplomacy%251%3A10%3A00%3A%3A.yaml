simpleMeaning: A go-between flies back and forth between the two sides, running talks between countries
scope: These talks between countries are run by a go-between, not by the two sides meeting face to face.
examples:
- Kissinger's shuttle diplomacy in the Middle East kept him flying between the two sides.
- Shuttle diplomacy kept the two sides talking without meeting.
