simpleMeaning: Fluid around the brain and spine collects inside the brain. In babies it can cause a fast-growing
  head, bulging soft spots and a small face; adults get mainly nerve symptoms.
scope: Another name for hydrocephalus, the same fluid build-up. It is not swelling of the brain tissue
  itself, and not the separate condition of simply having an unusually large head.
examples:
- Hydrocephaly was diagnosed after the infant's head began growing too quickly.
- In older adults, hydrocephaly can cause confusion and trouble walking.
