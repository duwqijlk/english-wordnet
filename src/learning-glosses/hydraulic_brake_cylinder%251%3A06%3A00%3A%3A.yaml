simpleMeaning: A tube-shaped part that holds the liquid used to slow a vehicle, squeezed by a sliding
  plug.
scope: A tube-shaped part that holds the liquid used to slow a vehicle, squeezed by a sliding plug, not
  a wheel cylinder and not a fuel tank; brake cylinder and master cylinder are other names for this sense.
examples:
- The mechanic replaced the leaking hydraulic brake cylinder.
- A worn hydraulic brake cylinder can make the pedal feel soft.
