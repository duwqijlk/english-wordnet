simpleMeaning: The power to shrink or draw together, above all in muscle fibres and even in some other
  living stuff.
scope: The power to shrink or draw together, not the power to stretch and not mere hardness.
examples:
- Contractility lets the heart pump blood round the body.
- The muscle's contractility was tested in the lab.
