simpleMeaning: Small local airports send their planes to one big central airport, where people can catch
  long flights to far places
scope: 'Another name for this sense is hub-and-spoke system: a way of flying in which small airports feed
  planes into one big central airport for long flights, not a direct flight between two small airports
  and not a bus network.'
examples:
- The airline uses a hub-and-spoke plan, so most flights go through one big airport.
- Under the hub-and-spoke system, our small town's flights all stop at the main airport first.
