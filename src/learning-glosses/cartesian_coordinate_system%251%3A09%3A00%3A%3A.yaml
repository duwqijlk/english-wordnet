simpleMeaning: A way of fixing where a point is by how far it stands from a set of lines that cross at
  right angles at one starting point.
scope: A way of fixing where a point is by how far it stands from lines that cross at right angles; not
  the polar way, which uses a distance and an angle.
examples:
- The Cartesian coordinate system puts the point at (3, 4).
- In the Cartesian coordinate system, the lines cross at the origin.
