simpleMeaning: A long-lived plant of North America with leaves that seem to grow in rings round the stem
  and showy white flowers touched with purple.
scope: Also called a whorled aster; a long-lived plant of North America with showy white flowers, not
  a yearly plant of the same lands.
examples:
- Aster acuminatus showed white flowers touched with purple in the wood.
- The leaves of Aster acuminatus seem to grow in rings round the stem.
