simpleMeaning: small changes in dark and light marks that show which parts of a drawing or painting are
  lit and which are in shadow
scope: Marks in a drawing or painting that show light and shade, not a small step-by-step change from
  one grade to the next.
examples:
- The artist used shading to make the apple look round.
- Careful shading gave the portrait depth.
