simpleMeaning: A dark brown seed of a climbing plant, so full of poison that it can kill, that gives a
  drug and is itself used in local magic rites.
scope: This seed is also called calabar bean; it gives a drug and is itself used in local magic rites.
examples:
- The ordeal bean can kill with its poison.
- Local magic rites use the ordeal bean.
