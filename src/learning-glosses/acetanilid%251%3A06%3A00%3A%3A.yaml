simpleMeaning: A solid, odourless chemical that forms leaf-shaped or flaky crystals; it is used in making
  rubber accelerators, dyes and camphor, and the body converts it into paracetamol.
scope: This is the industrial chemical itself, not the painkiller paracetamol that the body makes from
  it, and not the related drug phenacetin. It is a technical term in chemistry. 'Acetanilide' is the longer
  spelling of the same substance.
examples:
- The laboratory ordered acetanilid for a study of rubber accelerators.
- Acetanilid crystallises in shiny white flakes.
