simpleMeaning: A person who has lost the power to move some part of the body.
scope: A person who has lost the power to move some part of the body, not the adjective use for what has
  to do with that loss, and not the adjective use for a person so affected.
examples:
- The paralytic was lifted into a chair by the nurses.
- A paralytic lay in the ward, unable to move their legs.
