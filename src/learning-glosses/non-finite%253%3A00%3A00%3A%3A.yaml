simpleMeaning: Of verbs, a form that does not show when an action happens, who does it, or one or many,
  like to forms, -ing forms and -ed forms.
scope: Of verbs, a form that does not show when an action happens, who does it, or one or many, like to
  forms, -ing forms and -ed forms, with nonfinite and infinite as other names for this sense, not a verb
  with a tense and not a noun.
examples:
- In 'to run', the verb form is non-finite.
- A non-finite verb has no tense.
