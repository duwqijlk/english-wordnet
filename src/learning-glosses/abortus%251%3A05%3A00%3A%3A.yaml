simpleMeaning: a human baby in the womb that weighs less than half a kilogram when it is taken out or
  comes out of the mother's body
scope: This is a baby in the womb that weighs less than half a kilogram when it is taken out or comes
  out of the mother's body; not a full-term baby and not a stillborn baby of normal weight.
examples:
- The doctor recorded the abortus as weighing less than half a kilogram.
- An abortus is too small to live outside the mother's body.
