simpleMeaning: Used above all of money, it cannot be swapped for, or changed into, another money of the
  same worth.
scope: 'Also called inconvertible and unexchangeable: money that cannot be swapped for other money of
  the same worth, not money that can be changed freely and not a coin that is out of use.'
examples:
- The unconvertible money could not be changed into dollars.
- After the war, the unconvertible notes were of no use abroad.
