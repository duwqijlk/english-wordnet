simpleMeaning: A blue and bronze fish of the wrasse kind, found from the Florida Keys to Brazil.
scope: A blue and bronze wrasse, also called puddingwife; not a food fish caught for eating and not a
  fresh-water fish.
examples:
- The pudding-wife swims on the reefs from the Florida Keys to Brazil.
- We saw a pudding-wife with blue and bronze scales near the reef.
