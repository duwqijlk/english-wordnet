simpleMeaning: a person who gives out punishment by beating someone with a thin stick or a whip
scope: 'Also called switcher: a person who punishes by beating with a thin stick or a whip, not a judge
  who hands down a sentence and not a person who beats an animal to make it move.'
examples:
- The whipper stood ready with a switch in his hand.
- In the old tale, the whipper struck the boy for stealing bread.
