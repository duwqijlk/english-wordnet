simpleMeaning: a unit of weight used in south-east Asia, especially the Chinese unit that is the same
  as 500 grams
scope: 'Also called cattie: a unit of weight used in south-east Asia, not the word that describes a person
  who is unkind and wants to hurt others.'
examples:
- Rice was sold by the catty at the market.
- One catty of tea is 500 grams in China.
