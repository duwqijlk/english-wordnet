simpleMeaning: From the sweet juice of these juicy stalks come molasses and shop-bought sweetener; fresh
  stalks are at times chewed for the juice.
scope: Sugarcane is another name for these juicy stalks, not the tall grass itself.
examples:
- They chewed the sugar cane for its sweet juice.
- Fresh sugar cane was chewed for the juice.
