simpleMeaning: To add hues to something in order to make it more attractive or lively.
scope: This is putting hues on an object to ornament or brighten it; it is not something simply turning
  a different shade on its own, not a substance such as paint or dye used as the material, not just any
  adding of hue in a general way, not affecting someone's feelings or judgment, not biasing or slanting
  something, not giving a misleading explanation or excuse, not a thing's visible appearance as judged
  by hue, lightness and saturation, not the physical light attribute behind it, not vividness or interest,
  not a musical sound's quality, not a misleading outward show or form, not the physics property that
  quarks carry, and not the adjective meaning able to produce hues.
examples:
- They colored the eggs with vinegar and food dye for Easter.
- The children colored paper lanterns with bright markers.
