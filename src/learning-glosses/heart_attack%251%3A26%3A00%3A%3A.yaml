simpleMeaning: Something goes badly wrong with the blood pump in the chest, all at once
scope: A sudden, bad failure of the blood pump in the chest, not a pain in the chest from worry and not
  a slow illness of the chest.
examples:
- He had a heart attack at work and was taken to hospital.
- The doctor said the heart attack came on all at once.
