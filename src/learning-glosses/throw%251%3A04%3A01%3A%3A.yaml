simpleMeaning: the act of tossing something so that chance alone decides the result
scope: This is a toss whose result is left to chance, not the general act of sending an object through
  the air, and not a light bed cover.
examples:
- They settled the argument with a throw of the dice.
- His whole fortune rested on one throw of the dice.
