simpleMeaning: money paid to the local town office by each home, set by the guessed worth of the home
  and how many people live in it
scope: Money paid to the local town office by each home, set by the home's worth and the number of people
  who live there; not a tax on what a person earns and not a fee for water or power.
examples:
- They pay council tax to the town office each month.
- Her council tax went up when two more people moved into the house.
