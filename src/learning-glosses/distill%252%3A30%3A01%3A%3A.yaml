simpleMeaning: to go through the change of turning to steam and then back to liquid
scope: For a liquid to change by heating to steam and cooling back; not cleaning a liquid on purpose,
  and not taking a part out of it.
examples:
- The water will distill slowly over the low heat.
- The wine will distill in the flask as it heats and cools.
