simpleMeaning: A hard time when there is not enough of something, such as time, money, or goods to go
  round
scope: A hard time caused by a shortage, not the sound of a thing being crushed and not the act of crushing
  food.
examples:
- The firm faced a financial crunch at the end of the year.
- An end-of-the-year crunch left no time for new work.
