simpleMeaning: in a way that keeps dirt as low as it can, and keeps harm to the air, water and land as
  low as it can
scope: About doing a thing in a way that makes little dirt or harm, not in a smooth and exact way, and
  not about a person who is usually clean.
examples:
- The new engine burns cleanly and makes very little smoke.
- This fuel burns cleanly, so the air stays much cleaner.
