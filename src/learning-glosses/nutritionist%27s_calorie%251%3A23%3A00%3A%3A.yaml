simpleMeaning: The heat that warms a kilogram of water by one degree at normal air pressure, a measure
  food experts use to show how much energy food can give.
scope: Also called calorie, kilocalorie, kilogram calorie, and large calorie, this is the unit of heat
  food experts use to show the energy food can give.
examples:
- The soup had many nutritionist's calories.
- The bread held few nutritionist's calories.
