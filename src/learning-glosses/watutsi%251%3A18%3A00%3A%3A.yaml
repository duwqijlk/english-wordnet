simpleMeaning: Rwanda and Burundi are the home of a Bantu-speaking people, and this is one of them.
scope: Also called Watusi and Tutsi, this is a member of the Bantu-speaking people living in Rwanda and
  Burundi, not one of any other people of that land.
examples:
- She is a Watutsi from Burundi.
- The Watutsi are one of the peoples of Rwanda and Burundi.
