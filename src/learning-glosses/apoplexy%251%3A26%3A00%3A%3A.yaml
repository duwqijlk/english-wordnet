senseId: 'apoplexy%1:26:00::'
synsetId: 14105785-n
simpleMeaning: A sudden fall into a state where one cannot wake, when a burst or blocked blood vessel
  leaves the brain short of oxygen.
scope: A sudden loss of being awake from a broken or blocked blood vessel in the brain, also called a
  stroke or a cerebrovascular accident.
examples:
- He was struck down by apoplexy and never woke again.
- The doctor said the apoplexy came from a burst blood vessel in the brain.
