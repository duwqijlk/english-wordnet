simpleMeaning: The breathing flaps of fish and of amphibians living in the water are held up by each hard
  or bendable curve on one side of the throat.
scope: Also called gill arch and gill bar, this is a hard or bendable curve on each side of the throat
  that holds up the breathing flaps, not the flaps themselves.
examples:
- The branchial arch held up the fish's breathing flaps.
- A branchial arch lies on one side of the throat.
