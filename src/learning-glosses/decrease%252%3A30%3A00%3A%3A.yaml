simpleMeaning: To get less in size, amount, or range.
scope: This is a thing getting less in size, amount, or range, not the act of making it less and not the
  amount by which it gets less.
examples:
- The amount of homework decreased towards the end of the semester.
- Her weight decreased to under a hundred pounds.
