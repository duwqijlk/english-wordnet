synsetId: 05810193-n
simpleMeaning: working out an answer to a problem that uses numbers or amounts
scope: Also called calculation, also called computation. This is working with numbers to find an answer,
  not solving a problem with words or ideas alone.
examples:
- His figuring showed that we did not have enough money for the trip.
- She checked her figuring twice before she wrote the total.
