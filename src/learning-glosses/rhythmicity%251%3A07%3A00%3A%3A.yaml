senseId: 'rhythmicity%1:07:00::'
synsetId: 04998633-n
simpleMeaning: the way a piece of music feels in time, set by which notes are stressed and how long each
  note lasts
scope: How music moves in time, not the tune and not how loud it is.
examples:
- The rhythmicity of the dance music made everyone tap their feet.
- A change in rhythmicity gave the song a new feel.
