simpleMeaning: a set of signs and words used to state the rules for how words are put together in another
  way of speaking
scope: A way of speaking used to state the rules for how words are put together in another way of speaking,
  not those rules themselves and not a computer code.
examples:
- The syntax language lets writers state the word order of a tongue in clear rules.
- He wrote a syntax language to describe how sentences are built in the new tongue.
