simpleMeaning: An X-ray picture of the kidneys and the tubes that carry urine from them, taken after a
  dye that shows up on X-rays is put into a vein.
scope: An X-ray picture of the kidneys and the tubes that carry urine from them after a dye is put into
  a vein, also called intravenous pyelogram; not the act of doing the test or a picture of the bladder
  alone.
examples:
- The IVP showed a stone in her kidney.
- Doctors ordered an IVP to look at his kidneys.
