simpleMeaning: having a sole of the kind named, used joined with another word to say what kind it is
scope: This describes a shoe or boot by the kind of sole it has, when a word like rubber goes before it;
  it is not the sole on its own.
examples:
- She bought rubber-soled shoes for walking on wet roads.
- His leather-soled boots made little noise on the wood floor.
