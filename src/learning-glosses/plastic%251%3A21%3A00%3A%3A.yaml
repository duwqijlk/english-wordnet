simpleMeaning: a card, usually stiff, that promises a seller the user has enough to pay and the company
  behind it will make sure the seller is paid for the goods given
scope: This is a card used to pay, not the sense that means able to shape things and not the sense that
  means able to be shaped into a new form.
examples:
- She paid for the meal with plastic.
- Do you take plastic, or do I need to pay in cash?
