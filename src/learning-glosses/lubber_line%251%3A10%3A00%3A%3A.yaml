synsetId: 07274278-n
simpleMeaning: On a ship's compass, a set mark shows which way the ship is heading
scope: Also called lubber's line, lubber's mark and lubber's point, this is a set mark on a ship's compass
  that shows the ship's heading, not a moving needle and not a line drawn on a chart.
examples:
- The lubber line on the compass showed the ship was heading east.
- The captain checked the lubber line before he gave the order to turn.
