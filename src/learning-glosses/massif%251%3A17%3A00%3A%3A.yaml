simpleMeaning: A great lump of the earth's crust, cut off by cracks and pushed up so that it stands as
  the high peaks of a mountain chain.
scope: Of a great lump of the earth's crust, cut off by cracks and pushed up so that it stands as the
  high peaks of a mountain chain, not a single mountain peak on its own.
examples:
- The massif rose above the valley in a wall of rock.
- Climbers crossed the massif over three hard days.
