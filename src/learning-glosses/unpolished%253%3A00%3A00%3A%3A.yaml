simpleMeaning: in a rough state, not made smooth, not made perfect, and not worked on again with care
scope: This describes a thing that has not been finished to a smooth, perfect state; it does not mean
  a person who is rude or lacks training.
examples:
- His unpolished shoes looked dull next to the clean ones.
- The table had an unpolished top that felt rough to touch.
