simpleMeaning: A foot covering with a separate place for the big toe, worn in Japan with sandals held
  by a strap between the toes.
scope: Tabis is another name for this foot covering that keeps the big toe apart, worn in Japan under
  sandals held by a strap between the toes.
examples:
- A pair of tabi is slipped on before stepping into sandals.
- The tabi kept the big toe apart from the rest of the foot.
