simpleMeaning: a fast-growing cancer in the brain, made of young cells, nearly always deadly
scope: 'Another name for this sense is glioblastoma: a fast-growing cancer in the brain, not a slow-growing
  brain tumour and not a cancer elsewhere in the body.'
examples:
- The scan showed a spongioblastoma growing fast in his brain.
- A spongioblastoma is nearly always fatal, the doctor said.
