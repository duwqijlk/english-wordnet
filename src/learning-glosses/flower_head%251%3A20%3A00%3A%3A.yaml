simpleMeaning: The whole looks like one flower, though it is a short tight bunch of flowers set so close
  together, as in clover or in the daisy family
scope: This is a short tight bunch of flowers that looks like one flower, as in clover or the daisy family,
  and not a single flower on its own.
examples:
- The clover had a tight flower head.
- Each flower head looked like one big flower.
