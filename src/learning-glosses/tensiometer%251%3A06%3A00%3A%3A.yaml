senseId: 'tensiometer%1:06:00::'
synsetId: 04417895-n
simpleMeaning: a tool that shows how strongly the top of a liquid pulls together
scope: A tool that measures the pull at the top of a liquid, not one that tests how wet soil is and not
  one that measures the pull in a wire or beam.
examples:
- The lab used a tensiometer to test the new soap mix.
- With the tensiometer, she found the liquid's surface pull was weak.
