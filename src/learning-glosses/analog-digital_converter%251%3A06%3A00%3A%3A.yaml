simpleMeaning: a machine that turns a smooth, unbroken signal into numbers that a computer can read
scope: A machine that turns a smooth, unbroken stream into numbers a computer can read; also called analog-to-digital
  converter, digitiser and digitizer, not a machine that turns numbers back into a smooth stream.
examples:
- The studio bought an analog-digital converter to feed old tapes into the computer.
- With this analog-digital converter, the smooth sound from the record becomes numbers.
