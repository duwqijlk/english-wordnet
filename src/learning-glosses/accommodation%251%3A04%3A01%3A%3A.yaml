simpleMeaning: In the body, the eye's own lens changing shape by itself so things near and far come into
  focus
scope: How the eye's own lens changes shape by itself to focus; not the change in how you think in Piaget's
  ideas and not a place to stay.
examples:
- Accommodation lets the eye shift focus from a book to the road ahead.
- As we age, accommodation grows weaker and near things blur.
