simpleMeaning: a piece of furniture or a pretty thing made long ago, worth much because it is fine to
  look at or rare
scope: An old piece of furniture or pretty thing worth much for its fineness or rarity, not the act of
  making a thing look old and not shopping for such things.
examples:
- The shop sells an antique from two hundred years ago.
- Her antique chair is worth much because it is so rare.
