simpleMeaning: beaten eggs or a mix of eggs cooked until just set; may be folded around ham, cheese, or
  jelly
scope: 'Also called an omelette: this is a food made from beaten eggs cooked in a pan, not eggs still
  raw and not scrambled eggs stirred in small pieces.'
examples:
- For breakfast, he made a cheese omelet.
- She folded the omelet around the ham before serving it.
