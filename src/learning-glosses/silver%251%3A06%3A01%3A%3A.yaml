simpleMeaning: A prize made of, or looking like, a shiny white metal, usually given for second place.
scope: This is the award itself, not the metal it is made from, not coins and not the cutlery used at
  meals.
examples:
- She lifted the silver above her head after finishing second.
- The club's trophy case holds a silver from 1987.
