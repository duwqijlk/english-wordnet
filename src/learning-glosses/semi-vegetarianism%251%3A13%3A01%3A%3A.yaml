simpleMeaning: The habit of eating mostly plant food, with a few exceptions now and then for social, practical,
  cultural, or health reasons
scope: 'Also called flexitarianism: eating mostly plant food with a few exceptions, not eating only plant
  food and not eating meat at every meal.'
examples:
- Semi-vegetarianism lets her eat meat at family meals.
- He follows semi-vegetarianism for health reasons.
