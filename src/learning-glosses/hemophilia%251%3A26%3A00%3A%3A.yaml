simpleMeaning: Bleeding that will not stop marks this condition, which a person is born with and which
  usually hits boys and men, passing from mother to son.
scope: Also called bleeder's disease or haemophilia, this condition makes bleeding hard to stop in a person
  born with it.
examples:
- A boy with hemophilia bled without stopping.
- Hemophilia passes from a mother to her son.
