simpleMeaning: the act of turning something into a thing that is fixed and final, with no limits or conditions
scope: This is the act of turning something into a thing that is fixed and final, with absolutisation
  as another name for this sense, not a change to something partial or conditional.
examples:
- The absolutization of the ideal took it out of real life.
- Their absolutization of the principle left no room for compromise.
