schema: oewn-learning-gloss-v2
senseId: 'landmark%1:11:00::'
synsetId: 07432451-n
simpleMeaning: an event that marks a one-of-a-kind or important change in the course of history, on which
  important later events depend
scope: An event that marks a big change in history, not the place of a well-known thing in a landscape
  and not a point used in surgery.
examples:
- The agreement was a landmark in the history of both nations.
- The vote was a landmark that changed the course of the country.
