simpleMeaning: A fern that grows in mats on rock or ground, with creeping underground stems and large
  divided fronds, found across North America, Europe, Africa and east Asia.
scope: A fern that grows in mats on rock or ground; also called adder's fern, common polypody, golden
  maidenhair, golden polypody, sweet fern, and wall fern.
examples:
- Polypodium vulgare mats the rocks with divided fronds.
- Polypodium vulgare grows across four continents.
