simpleMeaning: A fixed part that stores electric charge, made of two charge-carrying pieces with a substance
  between them that carries charge.
scope: A fixed charge-storing part, also called an electrolytic condenser and also called electrolytic;
  not a battery and not a plain wire.
examples:
- The electrolytic capacitor in the radio had failed and needed replacing.
- He soldered a new electrolytic capacitor onto the board.
