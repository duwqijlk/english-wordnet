simpleMeaning: treatment for problems of the mind or feelings by using ways that work on the mind
scope: This is the care itself, given to a person with problems of the mind or feelings. It is not the
  branch of medicine that is about these ways of helping.
examples:
- She went for psychotherapy to help with her deep sadness.
- Psychotherapy helped him talk about his fears and feel less alone.
