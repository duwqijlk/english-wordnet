senseId: 'bronzer%1:06:01::'
synsetId: 92449028-n
simpleMeaning: A cosmetic powder in many shades of brown, meant to make skin look as if it has been browned
  by the sun.
scope: A cosmetic powder in shades of brown that makes skin look sun-browned; bronzing powder is another
  name for this sense, not blusher and not foundation.
examples:
- She dusted bronzer over her cheeks for a sun-kissed look.
- A little bronzer made her pale skin look tanned.
