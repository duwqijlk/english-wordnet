simpleMeaning: The dark centre of the eye gets smaller when the ring of muscle round the coloured part
  tightens on its own in bright light, or after certain drugs.
scope: Also called light reflex, myosis, and pupillary reflex, it is the eye's own shrinking of the dark
  centre in bright light or after certain drugs.
examples:
- Bright light brought on miosis.
- Certain drugs can bring on miosis.
