simpleMeaning: having no quality that sets it apart, so it makes no mark
scope: Having no quality that sets it apart, so it makes no mark; not the chemistry sense, not the sense
  of taking no side, and not the plain sense of simply having no special quality.
examples:
- His neutral manner made no mark on the room.
- She gave a neutral answer that made no mark.
