simpleMeaning: A slow, hard, black land insect of the weevil kind, whose young feed on rotting plant matter,
  grain, and other such food
scope: Also called a darkling beetle or a tenebrionid; a slow black land insect, not a flying beetle or
  a ladybird.
examples:
- We found a darkling ground beetle under the log.
- The darkling ground beetle moved slowly through the dry leaves.
