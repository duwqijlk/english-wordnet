simpleMeaning: In computer science, a copy of what is held in the small quick stores inside the main chip,
  most often used to find faults.
scope: In computer science, this is a copy of what is held in the small quick stores inside the main chip,
  most often used to find faults, not a copy of a file and not a test of the computer.
examples:
- The core dump showed where the program had failed.
- Engineers read the core dump to find the fault.
