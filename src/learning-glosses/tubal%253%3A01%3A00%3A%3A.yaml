simpleMeaning: 'The tube that carries eggs and the tube that joins the ear to the throat are the kinds
  of tube this word marks: it says something happens in a tube.'
scope: This word says something takes place in a tube, such as the tube that carries eggs or the tube
  that joins the ear to the throat.
examples:
- She had a tubal ligation.
- A tubal pregnancy happens when the egg grows in the tube.
