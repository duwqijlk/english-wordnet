senseId: 'federalisation%1:04:00::'
synsetId: 00806040-n
simpleMeaning: The act of putting a thing under the control of a national government.
scope: The act of putting a thing under the control of a national government; federalization is another
  name for this sense, not the state of already being under such control, and not control by a state government.
examples:
- The federalisation of the railways changed how they were run.
- The federalisation of the postal service took years.
