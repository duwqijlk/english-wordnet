simpleMeaning: Care and thought about the soul and about a person's inner life beyond the body
scope: This is a person's care for the soul and inner life beyond the body, not a church or its rules
  and meetings.
examples:
- Her spirituality grew stronger after years of prayer and quiet thought.
- His spirituality showed in daily prayer and in care for his soul.
