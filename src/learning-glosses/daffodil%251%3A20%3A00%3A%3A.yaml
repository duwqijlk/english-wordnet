simpleMeaning: one of many kinds of Narcissus plant with a bright flower, often yellow, that has a centre
  part shaped like a trumpet
scope: A plant and flower of the Narcissus kind with a trumpet-shaped centre, not just any yellow spring
  flower.
examples:
- Daffodils bloomed along the path in spring.
- She picked a daffodil with a bright yellow, trumpet-shaped centre.
