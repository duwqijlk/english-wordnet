simpleMeaning: a genus, a group of mostly woody plants with two seed leaves and simple form, with flowers
  often of one sex only and often in long hanging clusters called catkins
scope: A genus of mostly woody flowering plants with two seed leaves, not one single plant and not a whole
  family of plants.
examples:
- Botanists place witch hazel in a hamamelid dicot genus.
- The hamamelid dicot genus groups woody plants with flowers of one sex.
