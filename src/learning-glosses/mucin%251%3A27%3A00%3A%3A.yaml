simpleMeaning: What keeps body surfaces safe is a slippery stuff made with nitrogen, found in the wet
  matter the body makes.
scope: This slippery stuff is found in the wet matter the body makes and is not the wet matter itself.
examples:
- The mucin in the mouth keeps its surfaces safe.
- The mucin in the nose keeps its lining safe.
