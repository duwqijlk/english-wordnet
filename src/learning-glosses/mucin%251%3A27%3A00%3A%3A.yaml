simpleMeaning: A nitrogen-containing substance found in mucous secretions, acting as a lubricant that
  protects body surfaces.
scope: This slippery substance occurs in mucous secretions; it is not the secretion itself.
examples:
- The mucin in the mouth keeps its surfaces safe.
- The mucin in the nose keeps its lining safe.
