simpleMeaning: an animal like a shrimp, with a hard shell, ten legs, and claws on two pairs of them; most
  kinds can be eaten
scope: A shrimp-like animal with a hard shell and claws on two pairs of its ten legs, most kinds of which
  can be eaten; not the wider sense of any such animal, and not fishing for them.
examples:
- We ate grilled prawns with garlic butter.
- The prawn hid among the rocks, waving its claws.
