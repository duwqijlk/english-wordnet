simpleMeaning: a piece of writing that shows life in the country as simple and perfect, especially the
  life of people who look after sheep
scope: This is a written work that shows country life as perfect, especially for people who keep sheep;
  it is not a piece of music and not a word that describes a place or scene.
examples:
- He wrote a pastoral about shepherds living a simple, happy life in the country.
- The old pastoral tells of love and work in green fields.
