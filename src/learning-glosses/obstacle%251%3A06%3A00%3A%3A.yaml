simpleMeaning: a thing that blocks the way and must be taken away, gone over, or gone around
scope: This is a real thing that blocks the way, not a difficulty or lack that blocks a plan or progress.
examples:
- A fallen tree was an obstacle in the road.
- The runners jumped over each obstacle on the course.
