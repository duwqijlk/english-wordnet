simpleMeaning: An evergreen tree-like herb with huge paddle-shaped leaves, bearing inedible fruit like
  the yellow fruit in shops and young flower shoots that can be eaten; sometimes put in genus Musa.
scope: Also called Ensete ventricosum, Ethiopian banana and Musa ensete; a large evergreen tree-like herb
  with huge leaves, not a banana tree grown for its fruit and not a small herb.
examples:
- The Abyssinian banana grows in the highlands of Ethiopia.
- We saw an Abyssinian banana with huge paddle-shaped leaves.
