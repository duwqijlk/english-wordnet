simpleMeaning: in a worried, unhappy way, without being able to rest or feel calm
scope: This word describes how something is done, in a worried and unhappy way; it is not the word for
  a worried person or for the worry itself.
examples:
- The baby tossed fretfully in his crib.
- She paced fretfully while she waited for the doctor's news.
