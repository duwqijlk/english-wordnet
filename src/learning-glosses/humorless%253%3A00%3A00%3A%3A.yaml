simpleMeaning: not able to see what is funny in things, and not able to laugh at jokes
scope: Not able to see what is funny in things and not able to laugh at jokes, not a person who is merely
  serious and not a joke that fails.
examples:
- The humorless teacher never laughed at any of our jokes.
- She gave a humorless smile that showed she was not amused.
