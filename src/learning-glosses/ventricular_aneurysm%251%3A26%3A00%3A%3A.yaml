simpleMeaning: On the wall of the left lower room of the heart, a small bulge can appear in one place
  after a heart attack.
scope: This is a small bulge in one place on the wall of the left lower room of the heart that can come
  after a heart attack.
examples:
- A ventricular aneurysm showed as a small bulge on the wall of the left lower room of the heart.
- The ventricular aneurysm was found on the wall of the heart after the heart attack.
