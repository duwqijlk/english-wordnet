simpleMeaning: Any of many kinds of small warm-water animal with body and head shut inside hard bony plates.
scope: A small warm-water animal in hard bony plates, also called a boxfish; not a shark and not a ray.
examples:
- The trunkfish hid among the coral.
- A trunkfish swam past the reef.
