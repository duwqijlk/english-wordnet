simpleMeaning: A small harmless lump of skin on or near the parts of the body used for sex and the opening
  where waste leaves the body
scope: A small harmless skin lump on or near the sex organs and the anus, also called condyloma acuminatum,
  not a lump on the hands and not a lump that harms the body.
examples:
- The doctor saw a genital wart and said it was harmless.
- She went to the clinic after she found a genital wart.
