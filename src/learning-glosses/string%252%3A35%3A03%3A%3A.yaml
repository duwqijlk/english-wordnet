simpleMeaning: to take off the thin, tough parts that run through beans and some other food
scope: To take the thin tough parts out of food, not a thin cord on an instrument or a racket, and not
  to tie things with a cord.
examples:
- Please string the beans before you cook them.
- She strings the green beans and cuts off the ends.
