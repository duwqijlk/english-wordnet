simpleMeaning: a play board balanced on a middle support, with a child at each end going up and down
scope: A play board that goes up and down, with teeter as another name for this sense, and not a rocking
  movement or a thing that moves back and forth.
examples:
- The children laughed as the seesaw went up and down.
- She sat on one end of the seesaw while her brother sat on the other.
