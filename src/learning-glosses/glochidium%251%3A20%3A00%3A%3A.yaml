simpleMeaning: a spine or stiff hair with small hooks, often in bunches on a cactus
scope: A spine or stiff hair with small hooks, often in bunches on a cactus; glochid is another name for
  this sense, not a smooth thorn and not a soft hair.
examples:
- Glochidia stuck in her fingers when she touched the cactus.
- The cactus was covered in glochidia.
