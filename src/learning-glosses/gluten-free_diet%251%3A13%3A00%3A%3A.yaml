senseId: 'gluten-free_diet%1:13:00::'
synsetId: 07578549-n
simpleMeaning: A prescribed way of eating for celiac disease that leaves out wheat, rye, oats, beans,
  cabbage, turnips, cucumbers and similar foods rich in a protein that must be avoided.
scope: This is the eating plan prescribed to treat celiac disease by removing wheat, rye, oats and other
  foods rich in a particular protein; it is not a weight-loss diet and not a general low-carbohydrate
  plan.
examples:
- The doctor put her on a gluten-free diet after she was diagnosed with celiac disease.
- He checks every label carefully because his gluten-free diet rules out wheat, rye and oats.
