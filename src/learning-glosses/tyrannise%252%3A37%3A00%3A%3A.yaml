simpleMeaning: To rule or lord it over one, in a cruel, iron way.
scope: This sense is also called domineer and tyrannize, for ruling or lording it over one, in a cruel,
  iron way, unlike the sense for ruling a land as a tyrant.
examples:
- They tyrannise them, ruling in a cruel way.
- They tyrannise them, lording it over them.
