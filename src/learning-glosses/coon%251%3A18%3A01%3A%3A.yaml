schema: oewn-learning-gloss-v2
senseId: 'coon%1:18:01::'
synsetId: 09636589-n
simpleMeaning: a person from the country who acts in strange ways and does not behave in a serious way
  that earns respect
scope: This is a person from the country who acts in strange ways and does not behave in a serious way
  that earns respect; it is a word for a person, not for a place or a thing.
examples:
- People in the village laughed at the old coon for his strange clothes and loud ways.
- He was seen as a coon because he lived alone in the country and cared little how he looked.
