simpleMeaning: The frame of a goal in games such as soccer or hockey, covered with mesh to catch the ball
  or puck.
scope: The netted goal in soccer or hockey, not the band across a tennis or badminton court and not the
  woven material itself.
examples:
- The striker curled the ball into the back of the net.
- The puck flew past the goalie and hit the net.
