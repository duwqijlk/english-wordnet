simpleMeaning: The heat inside this animal's body stays near one level, whatever the weather outside
scope: This animal keeps its own body heat steady whatever the weather, not one whose body heat rises
  and falls with the air around it; also called homeotherm and homotherm.
examples:
- A homoiotherm keeps its body warm even on a cold night.
- Humans are homoiotherms, so their body heat stays steady in winter.
