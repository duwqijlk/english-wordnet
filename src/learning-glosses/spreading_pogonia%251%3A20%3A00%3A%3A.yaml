simpleMeaning: a plant whose deep pink blooms carry a lower petal that opens like a wide funnel, found
  in the north-east United States; sometimes put in another plant group
scope: 'Also called a funnel-crest rosebud orchid: a flower plant of the north-east with deep pink blooms
  and a funnel-shaped lip, not a common orchid of garden beds.'
examples:
- The spreading pogonia bloomed in the wet meadow in June.
- We found a spreading pogonia with a deep pink funnel-shaped lip.
