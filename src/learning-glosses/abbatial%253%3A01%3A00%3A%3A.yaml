simpleMeaning: having to do with a place where monks or nuns live, or with the man or woman in charge
  of it
scope: Something that belongs to or concerns an abbey, an abbot or an abbess; not something that belongs
  to an ordinary church or parish.
examples:
- The abbatial seal was stamped on the monastery's letters.
- She studied the abbatial records kept in the abbey library.
