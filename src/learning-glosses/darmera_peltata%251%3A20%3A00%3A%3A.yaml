simpleMeaning: A long-lived herb with underground stems, large showy umbrella-like leaves and white to
  bright pink flowers in round heads on bare stems, growing along stream banks in California's Sierra
  Nevada.
scope: Also called umbrella plant, Indian rhubarb and Peltiphyllum peltatum; a long-lived herb with umbrella-like
  leaves and pink flowers in round heads, not a shrub and not a water plant.
examples:
- Darmera peltata grows along stream banks in California.
- The pink flowers of Darmera peltata opened in spring.
