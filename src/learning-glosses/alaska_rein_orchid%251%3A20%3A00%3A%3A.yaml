simpleMeaning: A flower like its coastal kin, but with smaller blooms; it grows from the far north-west
  to Baja California and east to the Dakotas and Colorado
scope: A flower like its coastal kin but with smaller blooms; Habenaria unalascensis is another name for
  this sense, not the coastal rein orchid itself, which has larger flowers.
examples:
- The Alaska rein orchid grew beside the cold stream.
- Alaska rein orchid flowers are smaller than the coastal kind.
