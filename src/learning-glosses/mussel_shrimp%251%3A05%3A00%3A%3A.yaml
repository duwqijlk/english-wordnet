simpleMeaning: Shut inside a shell of two parts, a tiny sea or fresh-water creature has a body like a
  small prawn.
scope: It is also called ostracod and seed shrimp, and it is a tiny creature with a prawn-like body shut
  in a two-part shell, not a true shrimp and not a mussel.
examples:
- A mussel shrimp swam in the fresh water.
- The mussel shrimp closed its two-part shell.
