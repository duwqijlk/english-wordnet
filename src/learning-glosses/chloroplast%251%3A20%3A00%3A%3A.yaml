simpleMeaning: A small part inside a plant cell that holds the green stuff that catches light, with other
  colouring stuffs, in plants that make food from light
scope: A small part inside a plant cell that holds the green stuff that catches light, with other colouring
  stuffs; not the green stuff itself and not the green water growth.
examples:
- Each chloroplast holds the green stuff that catches light.
- Chloroplasts work only in plants that make food from light.
