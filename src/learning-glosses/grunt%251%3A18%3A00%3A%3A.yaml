simpleMeaning: a soldier or other worker who has a low rank or no special skill
scope: This is a soldier or other worker with a low rank or no special skill, not the fish of the same
  name, not the short low noise, and not the act of making that noise.
examples:
- In the army, the grunt did the hard, plain jobs.
- He started as a grunt and later became the head of the company.
