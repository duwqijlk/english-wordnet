simpleMeaning: Any one of the southern Bantu tongues of the Sotho people that speakers of each can understand,
  spoken in Botswana, South Africa and Lesotho
scope: This is any one of the southern Bantu tongues of the Sotho people; Basuto, Sotho and Sotho language
  are other names for it, and its nearest neighbours are the other southern Bantu tongues.
examples:
- Sesotho is spoken in Lesotho and in parts of South Africa.
- She learned Sesotho from her grandmother in Botswana.
