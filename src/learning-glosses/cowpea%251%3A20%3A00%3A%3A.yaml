simpleMeaning: a plant from the Old World that spreads low and lives one year, grown most in the southern
  United States for food, animal feed, or to feed the soil
scope: Also called black-eyed pea and cowpea plant, this is the plant grown for food, to feed farm animals,
  and to dig into the soil to make it rich, not the bean eaten fresh or dried.
examples:
- Farmers in Georgia grow cowpeas to feed their animals.
- The cowpea spreads low across the field in the summer heat.
