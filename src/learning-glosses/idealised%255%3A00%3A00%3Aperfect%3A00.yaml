simpleMeaning: shown as perfect in every way, with no fault at all
scope: Shown as perfect in every way, also called idealized; not merely good and not shown as it really
  is.
examples:
- The painting shows an idealised view of country life.
- Her idealised portrait made him look far grander than he was.
