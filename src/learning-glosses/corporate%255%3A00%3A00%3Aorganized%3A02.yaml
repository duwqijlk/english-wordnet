simpleMeaning: set up as a company in a form the law allows, and kept in that form
scope: This sense is about a thing being set up and kept as a company under the law, not just about a
  thing that belongs to or is linked to a company.
examples:
- The agency was set up in corporate form so it could own land.
- They set up the new service in corporate form under the law.
