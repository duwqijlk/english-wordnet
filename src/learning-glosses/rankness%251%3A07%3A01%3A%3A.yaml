simpleMeaning: the way land or plants give much growth and keep it strong and full
scope: 'Also called richness, fertility, and prolificacy: the way land or plants give much growth and
  keep it strong, not a bad smell and not being rich in money.'
examples:
- The rankness of the soil made the corn grow tall and thick.
- The farmer was glad of the rankness of his fields.
