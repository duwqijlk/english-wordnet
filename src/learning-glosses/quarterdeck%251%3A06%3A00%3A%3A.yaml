simpleMeaning: the back part of the top level of a ship
scope: The back part of a ship's top level; not the front part and not a lower level inside the ship.
examples:
- The captain stood on the quarterdeck and spoke to the crew.
- Officers gathered on the quarterdeck at the back of the ship.
