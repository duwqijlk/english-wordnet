simpleMeaning: a plant that gives oil and is used as food for farm animals, to make soil better, and as
  food for people
scope: 'Also called soybean: this is the plant grown for oil and other uses, not the bean as a food on
  its own and not the thin, dark sauce made from the beans.'
examples:
- Farmers grow soy for its oil.
- Soy helps make the soil better and feeds farm animals.
