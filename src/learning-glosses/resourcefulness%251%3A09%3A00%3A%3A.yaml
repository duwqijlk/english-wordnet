simpleMeaning: the skill of finding ways to deal with problems that are not usual
scope: 'Also called resource: the skill of finding ways to deal with new problems, not a store of money
  or things kept for use.'
examples:
- Her resourcefulness helped the group find food and a safe place after the storm.
- With great resourcefulness, he fixed the broken boat with only a knife and some rope.
