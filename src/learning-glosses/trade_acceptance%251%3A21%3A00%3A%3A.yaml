simpleMeaning: A written order to pay for one named sale, drawn up by the seller to the buyer and signed
  by the buyer to show agreement to pay
scope: A written order to pay for one named sale, signed by the buyer; not a cash payment and not a promise
  to pay later without a signed order.
examples:
- The seller drew a trade acceptance on the buyer.
- The trade acceptance was signed by the buyer.
