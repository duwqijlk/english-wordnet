simpleMeaning: to ask a person many questions, closely and in full detail
scope: To ask a person questions in full detail; not to study a thing to understand its meaning and not
  to look a thing over to check it.
examples:
- The police examined the witness for hours, asking about every detail.
- The lawyer examined him closely about where he was that night.
