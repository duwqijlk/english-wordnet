synsetId: 01120122-a
simpleMeaning: False, copying something finer.
scope: This sense is also called counterfeit, for being false, copying something finer, unlike the sense
  for being marked by or given to imitation, and unlike the sense for words formed in imitation of a natural
  sound.
examples:
- The gem was imitative, false and copying a finer one.
- The work was imitative, copying something finer.
