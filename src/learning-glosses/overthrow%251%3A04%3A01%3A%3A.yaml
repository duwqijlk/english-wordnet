simpleMeaning: when a ruler or an established body is brought to an end, especially by force
scope: The bringing down of a ruler or an established body, especially by force, not the verb for doing
  it.
examples:
- The overthrow of the king came after years of unrest.
- The army planned the overthrow of the government.
