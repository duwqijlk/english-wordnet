simpleMeaning: a way of working out linked equations by first guessing an answer, then making the mistakes
  smaller step by step until they are all below a set size
scope: Also called relaxation; a way of solving linked equations by guessing, not a way of resting the
  body and not a direct exact answer.
examples:
- We used the relaxation method to solve the equations.
- The relaxation method starts with a guess and cuts the errors down step by step.
