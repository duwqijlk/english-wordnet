simpleMeaning: Owned by a maker, this money-lending firm lends to sellers to stock up and to buyers of
  the maker's goods.
scope: A money-lending firm owned by a maker, lending only to sellers of its goods and to buyers of them,
  not a bank that lends to anyone.
examples:
- The captive finance company lent money to dealers to stock up.
- Buyers of the maker's goods got loans from the captive finance company.
