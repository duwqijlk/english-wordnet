simpleMeaning: A party gift made of a paper tube, often holding sweets or a small gift, that makes a pop
  when its ends are pulled apart.
scope: This is a paper party gift that pops, not a sweet on its own or a firework; also called cracker
  and snapper.
examples:
- We pulled a cracker bonbon at the party.
- Each cracker bonbon held a tiny toy inside.
