simpleMeaning: The dark part and the light-sensing part at the back of the eye grow from a cup with two
  walls in the growth of an unborn young.
scope: Eyecup is another name for this sense; it is a two-walled cup in the growing eye, not the grown
  retina.
examples:
- The optic cup forms early in the growth of the eye.
- The optic cup will turn into the dark part and the light-sensing part of the eye.
