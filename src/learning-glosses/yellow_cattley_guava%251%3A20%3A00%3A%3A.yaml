simpleMeaning: A small bushy tree of hot lands that bears small fruit of a pale gold colour
scope: A small bushy tree with pale gold fruit; guava and strawberry guava are other names for this sense,
  not a large tree and not a fruit of another colour.
examples:
- The yellow cattley guava in our yard bears fruit every year.
- A yellow cattley guava grows by the fence and gives small fruit we can eat.
