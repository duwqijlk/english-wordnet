simpleMeaning: Words spoken or written back in response to a question, request, criticism or accusation.
scope: This is the answer given back, not the act of answering, and not a general reaction to an event.
examples:
- I sent three emails and still have not had a reply.
- Her reply to the criticism was calm and brief.
