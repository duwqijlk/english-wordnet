simpleMeaning: A fixture connected to a building's water pipes that people use to pass urine and solid
  waste.
scope: This is the bathroom fixture itself, not the sealed metal container, not the quantity a container
  holds, not a room or building containing toilets, not the buttocks, and not the round-bottomed buoy.
examples:
- He flushed the can and then washed his hands.
- The plumber fixed a leak under the can.
