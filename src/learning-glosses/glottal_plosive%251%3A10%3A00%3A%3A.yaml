senseId: 'glottal_plosive%1:10:00::'
synsetId: 07132303-n
simpleMeaning: This speech sound comes when air held back at the voice box is let go, at the sharp start
  of a vowel.
scope: Also called a glottal catch or a glottal stop, this names the sound that comes out when air held
  back at the voice box is let go as a vowel starts.
examples:
- The glottal plosive began the vowel with a sharp burst of air.
- He used a glottal plosive at the start of the word.
