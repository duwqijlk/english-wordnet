simpleMeaning: To form something into one or more solid pieces.
scope: Forming something into solid pieces; not marking a book cover with a stamp, not shaping an object
  over a form, and not holding something up with a support.
examples:
- She blocked the clay into a rough cube.
- The mixture is blocked into flat pieces before it dries.
