simpleMeaning: A member of a group of monks known for a plain hard life and a vow of silence.
scope: A monk of a strict silent order, also called Cistercian, not a monk who preaches in public and
  not a parish priest.
examples:
- The Trappist rose before dawn to pray.
- A Trappist spoke only when he had to.
