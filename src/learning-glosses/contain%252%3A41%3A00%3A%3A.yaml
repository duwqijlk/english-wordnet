simpleMeaning: to make something less strong, soften it, hold it back, and keep it within set limits
scope: 'Also called control, hold, and check: to make a feeling or action less strong and keep it from
  going too far, not to have something inside or as a part.'
examples:
- She tried to contain her anger and spoke in a calm voice.
- He could barely contain his excitement when he heard the news.
