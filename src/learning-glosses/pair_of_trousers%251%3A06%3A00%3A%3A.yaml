simpleMeaning: With a leg for each leg, this garment runs from the waist to the knee or ankle and is usually
  spoken of in the plural.
scope: It is also called pant and trousers, and it is a garment for the lower body that covers each leg
  on its own.
examples:
- He had a sharp crease in his pair of trousers.
- Her pair of trousers reached her ankles.
