simpleMeaning: How one like group of living things gives rise to many unlike kinds as they settle into
  unlike ways of life.
scope: One group of living things splitting into many unlike kinds, not unlike groups growing alike and
  not one kind slowly changing over time.
examples:
- The finches of the islands show adaptive radiation at work.
- Adaptive radiation filled each empty way of life with a new kind.
