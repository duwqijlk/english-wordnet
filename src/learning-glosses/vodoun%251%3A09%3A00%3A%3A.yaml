simpleMeaning: Chiefly in Caribbean lands, above all Haiti, people follow this faith, working magic and
  honouring the spirits that live in things of nature.
scope: Also called voodoo, hoodooism, and voodooism, this is a Caribbean faith that uses magic and calls
  on spirits.
examples:
- They practice vodoun in Haiti.
- In Haiti, vodoun followers call on spirits of nature.
