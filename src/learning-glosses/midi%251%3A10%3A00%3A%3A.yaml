simpleMeaning: A set of agreed rules that lets electronic music-making tools and computers talk to each
  other.
scope: 'Also called musical instrument digital interface: a set of agreed rules that lets electronic music-making
  tools and computers talk to each other, not a kind of music file.'
examples:
- The keyboard sends MIDI signals to the computer.
- He recorded the song with MIDI so he could change the notes later.
