simpleMeaning: Any of several small, quick brown birds of the northern half of the world, with short tails
  held upright, that eat insects.
scope: Any of several small brown birds with short upright tails; wren is another name for this bird,
  not a large bird and not a bird of the Southern Hemisphere.
examples:
- A jenny wren sang from the hedge in the morning.
- The jenny wren darted into the bushes.
