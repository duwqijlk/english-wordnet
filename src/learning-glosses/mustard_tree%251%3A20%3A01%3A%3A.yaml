simpleMeaning: Smooth or hairy evergreen shrub or small tree of the genus Salvadora, with fibrous twigs
  bundled and used for brushing teeth, shoots that feed camels, and ash that yields salt.
scope: The shrub whose twigs are cut for brushing teeth, not the South American shrub of the same name
  that sometimes poisons livestock; toothbrush tree is another name for this same plant.
examples:
- People in dry regions cut twigs from the mustard tree and fray the ends to make a chewing brush.
- The mustard tree's shoots are cut as camel fodder, and its ash is used as salt.
