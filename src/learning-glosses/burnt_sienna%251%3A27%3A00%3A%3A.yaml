simpleMeaning: a red-brown colour for paint, made by heating a kind of earth
scope: A red-brown colour for paint made by heating a kind of earth, not the raw earth itself and not
  a bright red paint.
examples:
- She mixed burnt sienna into the paint for the autumn leaves.
- The artist's palette always had a tube of burnt sienna.
