simpleMeaning: A kind of screw machine in which the screw rod is turned by a big wheel or by a pair of
  heavy weights at the ends of a bar.
scope: This is a kind of screw machine turned by a big wheel or heavy weights, not a hand tool or a pump.
examples:
- The worker used the fly press to shape the metal.
- A fly press can be turned by hand or by a motor.
