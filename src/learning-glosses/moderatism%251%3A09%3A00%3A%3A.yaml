simpleMeaning: In politics, the view that takes the middle way, away from the far left and the far right
scope: 'Also called centrism: a political view that takes the middle way, not the far left and not the
  far right.'
examples:
- His moderatism kept him from backing either extreme.
- Moderatism calls for steady steps between left and right.
