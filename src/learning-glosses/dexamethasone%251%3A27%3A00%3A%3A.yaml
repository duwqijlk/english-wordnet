simpleMeaning: This drug treats allergies or swelling and soreness; it is a corticosteroid, a drug that
  calms the body's response, sold as Decadron, Dexone, Hexadrol or Oradexon
scope: Not other drugs that treat allergies or swelling.
examples:
- The doctor gave her dexamethasone for her allergies.
- Dexamethasone brought down the swelling in his knee.
