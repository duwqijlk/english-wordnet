simpleMeaning: In psychoanalysis, a child forms a picture in the mind of a person, usually a parent, that
  makes that person seem better than they really are
scope: In psychoanalysis, a picture in the mind of a person formed in childhood, usually of a parent;
  not a photograph and not the adult form of an insect.
examples:
- His imago of his father shaped how he saw every boss.
- The therapist asked about the imago she had formed of her mother as a child.
