simpleMeaning: A wide white band of cloth worn over the turned-back front parts of a jacket.
scope: This broad white collar is worn over the lapels on the outside of a jacket, not a collar worn inside
  a jacket.
examples:
- He wore an Eton collar over his jacket.
- The Eton collar stood out white against the dark jacket.
