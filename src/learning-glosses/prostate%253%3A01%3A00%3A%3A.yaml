simpleMeaning: relating to a small gland in a man's body, below the bladder (the part that holds urine)
scope: Used for things to do with this gland in a man's body; it does not name the gland itself.
examples:
- He had a prostate examination at the hospital.
- The doctor treated his prostate problem with medicine.
