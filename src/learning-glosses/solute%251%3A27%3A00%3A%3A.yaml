simpleMeaning: The matter that has dissolved in a mixture, the part of the mixture that changes its state
scope: The dissolved part of a mixture, not the part that does the dissolving and not the whole mixture
  itself.
examples:
- Salt is the solute in salt water.
- When the solute had dissolved, the water turned clear.
