simpleMeaning: making something free from mistakes and from bad, dishonest ways
scope: This is about making ideas or ways free from mistakes and harm, not a substance that kills germs
  and not clean in a medical way.
examples:
- Open criticism had an antiseptic effect, clearing out bad ideas.
- She hoped honest talk would be antiseptic for the group's bad habits.
