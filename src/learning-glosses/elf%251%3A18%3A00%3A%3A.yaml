simpleMeaning: In folklore, fairies that cause a little trouble for fun
scope: Also called imp, these are small magic beings in old stories who cause a little trouble; they are
  not real people, and they are not fairies who only help and do kind things.
examples:
- In the old story, an elf hid the farmer's tools for fun.
- The elf played tricks on the people who lived in the house.
