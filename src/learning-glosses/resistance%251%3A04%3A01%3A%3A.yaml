simpleMeaning: fighting by soldiers to stop an enemy army from moving forward
scope: Fighting by soldiers against an enemy army. Not the general act of saying no to a plan, not an
  electrical part, and not a secret group that fights a government.
examples:
- The soldiers put up strong resistance as the enemy moved into the town.
- There was little resistance when the enemy army reached the bridge.
