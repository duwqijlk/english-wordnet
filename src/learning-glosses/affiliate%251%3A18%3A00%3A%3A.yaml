simpleMeaning: a person who is linked to another person or to a group, but in a lower or smaller role
scope: This is a person linked to another person or to a group in a lower role, not a linked organization
  itself and not the act of joining a group.
examples:
- She joined the club as an affiliate, not as a full member.
- Each affiliate helps the main group but keeps a smaller local role.
