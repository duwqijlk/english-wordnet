simpleMeaning: to make your own or another person's thoughts or attention come back after they have wandered
  away from what you were thinking or talking about
scope: This is bringing wandering thoughts back, not remembering a fact, not a maker asking for a product
  back, and not a horn call for soldiers.
examples:
- A loud laugh recalled her from her daydream.
- He recalled his wandering thoughts to the lesson in front of him.
