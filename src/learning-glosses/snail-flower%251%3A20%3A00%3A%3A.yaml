simpleMeaning: A long-lived tropical American climbing vine grown for its hanging sprays of showy yellow
  and purple blooms whose boat-shaped lower petals coil like a spiral shell; sometimes grouped with beans.
scope: This is the same tropical vine as corkscrew flower, not a snail or a separate species.
examples:
- A snail-flower covered the trellis with yellow and purple blooms.
- The snail-flower's petals coil tightly, which explains its name.
