simpleMeaning: 'The fifth pillar of Islam: a pilgrimage to Mecca and the Kaaba in the month of Dhu al-Hijja,
  expected of a Muslim at least once in a lifetime.'
scope: This is the expected once-in-a-lifetime pilgrimage in the month of Dhu al-Hijja, not a visit to
  Mecca at another time of the year; hadj is a variant spelling of hajj.
examples:
- Thousands of pilgrims begin the hadj in Dhu al-Hijja.
- She made the hadj with her family.
