simpleMeaning: the act of putting things in order under a clear system, with a reason for the way it is
  done
scope: 'Also called rationalisation: the act of putting things in order under a clear system. It is not
  the maths sense of making an equation simpler, and not the mind sense of giving a false reason for what
  you did.'
examples:
- The rationalization of the factory's work saved time and money.
- Rationalization of the filing system made every paper easy to find.
