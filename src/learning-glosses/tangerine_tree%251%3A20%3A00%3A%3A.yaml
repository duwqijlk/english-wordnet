simpleMeaning: Called kamala kaya in Telugu and Portugal and a mandarin in Australia, this tree bears
  a kind of mandarin orange.
scope: Also called tangerine, this tree bears a kind of mandarin orange that goes by other names in Telugu,
  Portugal, and Australia.
examples:
- They picked fruit from the tangerine tree.
- The tangerine tree gave them fruit to eat.
