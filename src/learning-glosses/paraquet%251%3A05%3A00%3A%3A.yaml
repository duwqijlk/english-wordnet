simpleMeaning: A small thin bird with a long tail, one of many kinds like it
scope: 'Also called a parakeet, paroquet, parrakeet, parroket or parroquet: a small thin bird with a long
  tail, not a big bird and not a bird with a short tail.'
examples:
- A bright green paraquet sat on the branch and called out.
- The paraquet flew across the garden with its long tail streaming behind it.
