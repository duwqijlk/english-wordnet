simpleMeaning: At three hundred fifteen degrees on a compass, this is the point halfway between north
  and west.
scope: Also called northwest, northwestward and nor'-west; this is the point halfway between north and
  west, not north itself and not west itself.
examples:
- The compass needle points NW.
- We walked toward NW for an hour.
