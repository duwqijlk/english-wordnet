simpleMeaning: A way of writing maths expressions without brackets, in which each sign for an action comes
  after the numbers it acts on.
scope: Also called postfix notation and suffix notation; it writes maths expressions without brackets,
  with each sign for an action after the numbers it acts on, unlike the usual bracketed way.
examples:
- Reverse Polish notation writes 3 4 + for three plus four.
- The old calculator used reverse Polish notation for its sums.
