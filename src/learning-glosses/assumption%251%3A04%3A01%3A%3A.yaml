simpleMeaning: the act of taking something to be true without checking that it is true
scope: The act of taking something to be true without checking, not the statement itself that a person
  takes to be true.
examples:
- Your assumption that I would agree was wrong, because you never asked me.
- His quick assumption that she was lying upset her.
