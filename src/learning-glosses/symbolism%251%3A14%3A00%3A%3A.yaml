simpleMeaning: an art movement of the late 1800s that tried to show unseen ideas and ideas of faith and
  the spirit by using pictures that stand for other things
scope: The late-1800s art movement that used pictures to stand for deep ideas, not a set of signs and
  not the general act of giving things a hidden meaning.
examples:
- Symbolism led poets and painters to use dreams and myths in their work.
- In the late 1800s, painters in symbolism used dream-like pictures to show ideas of faith and the spirit.
