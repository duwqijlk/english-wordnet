simpleMeaning: This crystal, powder or liquid turns tub water into bubbles, gives it a sweet smell and
  makes it soft.
scope: 'Also called bubble bath, foam bath and foaming bath: a scented preparation that foams in tub water
  and makes it soft.'
examples:
- She poured bath foam into the running water.
- The bath foam filled the tub with sweet-smelling bubbles.
