simpleMeaning: thin threads held in one group, most of all the ones that send messages through the body
scope: 'Also called a fascicle, a fasciculus, and a fiber bundle: thin threads held in one group, most
  of all the ones that send messages through the body, not a single thread and not a cord of muscle.'
examples:
- The fibre bundle joins the two parts of the brain.
- A fibre bundle of nerve cells runs down the spine.
