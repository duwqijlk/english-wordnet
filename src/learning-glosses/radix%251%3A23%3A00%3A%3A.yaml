simpleMeaning: In counting, a whole number above zero that is worth one in the next place up
scope: 'Also called a base: in counting, the whole number above zero worth one in the next place up, not
  a digit written in one of the places.'
examples:
- The radix of the decimal system is 10.
- If the radix is 2, each place up is worth twice the one before it.
