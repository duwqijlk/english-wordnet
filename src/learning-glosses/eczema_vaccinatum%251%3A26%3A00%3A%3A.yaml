simpleMeaning: High fever and blisters all over the body mark this now rare ill effect of the smallpox
  vaccine on skin already sore with long-term itchy rash
scope: A rare ill effect of the smallpox vaccine on sore skin, not ordinary itchy skin and not a common
  vaccine reaction.
examples:
- The baby caught eczema vaccinatum after the smallpox jab.
- Eczema vaccinatum is rare now that the smallpox vaccine is seldom used.
