simpleMeaning: the act of making something white by leaving it in sunlight or by using a chemical that
  can make things white
scope: This is the act of making something white with sunlight or a chemical, not the chemical itself.
examples:
- Bleaching the cloth in sunlight made it white again.
- Bleaching the towels with a weak chemical mix made them white again.
