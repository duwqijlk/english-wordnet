simpleMeaning: passed down or able to be passed down from older family members to younger ones under fixed
  rules, usually the rules of the law
scope: Also called ancestral, and another name for this sense is transmissible; this is about passing
  down under fixed rules, usually law, not about a feature or illness that family members share by birth.
examples:
- In a hereditary monarchy, the crown passes to the king's child.
- The land was hereditary, so it went to the eldest son under the old rules.
