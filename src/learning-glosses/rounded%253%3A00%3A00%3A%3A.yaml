simpleMeaning: having a shape that curves a little, like part of a circle, and does not have sharp uneven
  edges
scope: This describes a shape that curves a little, like part of a circle and has no sharp uneven edges,
  not a number changed to a nearer whole number.
examples:
- The table has rounded corners, so the children will not hurt themselves.
- She picked up a smooth, rounded stone from the river.
