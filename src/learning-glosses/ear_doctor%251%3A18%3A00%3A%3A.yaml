simpleMeaning: Sicknesses of the part of the head that hears are the main work of a person with medical
  training
scope: 'Also called ear specialist and otologist: sicknesses of the hearing part of the head are the main
  work of a person with medical training, not the work of a general medical worker and not a person who
  treats the eyes.'
examples:
- The ear doctor looked into my ear and said the infection would clear up.
- She made an appointment with an ear doctor after her hearing got worse.
