simpleMeaning: An orchid by streams or ponds in the west of North America, with leafy stems and one green-brown
  and pink flower where each upper leaf meets its stem.
scope: Also called a chatterbox, a giant helleborine, or a stream orchid; an orchid by streams or ponds
  in the west of North America, with leafy stems and one green-brown and pink flower at each upper leaf,
  kin to other stream-side orchids.
examples:
- Epipactis gigantea grows by the stream, one green-brown and pink flower at each leaf.
- We found Epipactis gigantea along the pond in western North America.
