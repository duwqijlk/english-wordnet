simpleMeaning: A sudden tight pull of the muscle that moves the eyelid, so the eye shuts.
scope: A sudden tight pull of the muscle that moves the eyelid, so the eye shuts, not a blink and not
  a twitch of the face.
examples:
- Blepharospasm made her eye shut without warning.
- The blepharospasm kept closing his left eye.
