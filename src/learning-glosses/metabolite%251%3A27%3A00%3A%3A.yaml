schema: oewn-learning-gloss-v2
senseId: 'metabolite%1:27:00::'
synsetId: 15135363-n
simpleMeaning: This stuff is made by the chemical changes in a living thing, or is needed for them, and
  takes part in them
scope: Any stuff that takes part in the body's chemical changes, made by them or needed for them; not
  the changes themselves.
examples:
- Glucose is a metabolite the body burns for energy.
- Doctors measured the metabolite in her blood.
