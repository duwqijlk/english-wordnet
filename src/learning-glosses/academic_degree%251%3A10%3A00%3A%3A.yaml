simpleMeaning: a title given by a college or school of higher learning when a student has finished a course
  of study well
scope: This is a title a college or university gives when a student finishes a course of study; degree
  is another name for this sense, not a job title and not a school prize for one piece of work.
examples:
- She earned her academic degree at Princeton.
- His academic degree shows he finished the full course of study.
