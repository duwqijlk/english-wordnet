simpleMeaning: the part of a nail, bolt, or rivet that is made flat
scope: The flat part of a nail, bolt, or rivet itself; not the act of making it flat, not a boxer's hold,
  and not a tight hug.
examples:
- The clinch on the nail kept the board from moving.
- He bent down the clinch at the end of the bolt.
