simpleMeaning: a name, at times rude, for a boy with no home who was left alone and wanders the roads
scope: 'Also called a throwaway or a gamin: a boy with no home who was left alone and wanders the roads,
  not a boy who lives with his family.'
examples:
- The street arab wandered the streets looking for a place to sleep.
- In the old story, a street arab with no home found work at the market.
