simpleMeaning: On each side, the blood tubes of the groin take in paired tubes that run near the surface
  on the upper side of the male organ.
scope: Blood tubes near the surface on the upper side of the male organ, not the deeper tubes and not
  the blood tubes of the groin they join.
examples:
- The venae dorsales penis superficiales run in pairs along the upper side of the male organ.
- The surgeon traced the venae dorsales penis superficiales to the veins of the groin.
