simpleMeaning: a person who makes a plan for his or her own actions
scope: 'Also called schemer: a person who plans his or her own actions, not an office worker who marks
  facts on a chart and not a machine that draws graphs or pictures.'
examples:
- The plotter wrote down every step of his plan before he acted.
- As a careful plotter, she made a plan for her own work and followed it.
