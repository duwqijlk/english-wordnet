simpleMeaning: an electric circuit made of two branches with four arms in a diamond shape and a measuring
  meter connected across it.
scope: This is an electrical measuring circuit, not a structure that carries people over water.
examples:
- The technician used a bridge to measure the resistance of the wire.
- The bridge gave a steady reading once the four arms were adjusted.
