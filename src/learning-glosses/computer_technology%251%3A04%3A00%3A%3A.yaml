simpleMeaning: the work of planning, building and writing steps for machines that work with numbers and
  facts
scope: The work of planning, building and writing steps for machines that work with numbers and facts;
  not one single set of steps and not the study of how such machines think.
examples:
- She studied computer technology at college.
- New computer technology has made the machines much faster.
