simpleMeaning: a round flat stone that turns; you rub a tool with a sharp edge on it to make the edge
  sharp or smooth
scope: This is the round turning stone for sharpening tools, not a stone used to crush grain into flour.
examples:
- He held the knife against the grindstone to sharpen it.
- The old grindstone turned slowly as she polished the blade.
