simpleMeaning: to greet a person with a deep bow, in the Muslim way of greeting
scope: To greet a person by bowing deeply in this way. It is not the noun that names the deep bow itself.
examples:
- He salaamed the elder as he entered the room.
- The men salaamed to greet their guest.
