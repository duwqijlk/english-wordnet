simpleMeaning: a jellyfish-like marine animal, symmetrical in two planes, that swims by beating eight
  rows of tiny hairs set like comb teeth; it lives alone and is both male and female.
scope: 'Another name for comb jelly: the jellyfish-like sea animal that swims by beating rows of tiny
  hairs and is both male and female. Not a true jellyfish, which moves by pulsing.'
examples:
- Ctenophores swim by beating rows of tiny hairs rather than pulsing like true jellyfish.
- The net brought up a dozen ctenophores, each glinting with rows of cilia.
