simpleMeaning: In chess, to put the opponent's king under direct attack.
scope: This is the chess action, not the betting move, not a hunting dog changing prey, not examining
  something for accuracy, not holding back a danger or an enemy, not marking a box, not leaving bags for
  safekeeping, and not blocking a hockey player.
examples:
- He checked the black king with his knight.
- White checked the king and forced it to move.
