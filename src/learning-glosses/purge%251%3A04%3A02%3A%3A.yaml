simpleMeaning: A sudden clearing out, throwing a person or a group out of an organization or place.
scope: A sudden clearing out of a person or group from an organization or place, not the cleansing act,
  not clearing the bowels, not throwing up, not washing out with liquid, and not making a person free
  from sin.
examples:
- The purge swept many officers out of the army.
- After the purge, few of the old staff stayed on.
