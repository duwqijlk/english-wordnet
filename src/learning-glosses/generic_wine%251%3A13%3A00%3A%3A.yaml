simpleMeaning: A fermented grape drink that cannot be labeled with a region or grape type, so it may carry
  only a made-up brand, a color, or a general class name.
scope: This is the wine itself, not a no-brand product such as a medicine, and not the adjective 'shared
  by a whole class'.
examples:
- Generic wines are sold under a brand name or a simple color, never a region.
- The cheapest bottle on the shelf was a generic wine, labeled only 'table wine'.
