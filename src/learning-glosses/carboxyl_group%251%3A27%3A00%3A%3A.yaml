simpleMeaning: the -COOH part of a molecule, with one bond free, found in and marking organic acids
scope: A chemical part, not a whole molecule and not the acid itself; carboxyl is another name for this
  sense.
examples:
- The carboxyl group gives vinegar its sour bite.
- Each carboxyl group in the acid can lose a hydrogen atom.
