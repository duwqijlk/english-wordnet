simpleMeaning: the use of the same word or word pattern again and again to make a point in speech or writing
scope: The repeated use of the same word or word pattern to make a point in speech or writing, not the
  mere act of doing a thing over again.
examples:
- The repetition of the word 'freedom' gave her speech power.
- He used repetition to make his point clear.
