simpleMeaning: Thumb and first finger grip two flat parts sticking out at the sides of this threaded piece,
  turning it with ease.
scope: Also called butterfly nut, thumbnut, wing nut, and wing screw, this is the threaded piece turned
  by thumb and first finger, not the tree kind with small winged fruit.
examples:
- Thumb and first finger tightened the wing-nut.
- The wing-nut held the cover in place.
