simpleMeaning: a set of points, tiny parts, or things put so the same pattern repeats at the same gaps
  on a flat surface or in space
scope: A repeating pattern of points or things in space, not the frame of crossed strips of wood or metal
  that this word can also mean.
examples:
- In the crystal, the atoms form a regular lattice.
- The picture shows a lattice of points in three directions.
