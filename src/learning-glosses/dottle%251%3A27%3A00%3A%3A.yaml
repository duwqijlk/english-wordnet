simpleMeaning: Tobacco that has only half burnt leaves a crust stuck in the bowl of a pipe after it is
  smoked.
scope: It is the crust that stays stuck in the bowl of a pipe after smoking, and not loose ash.
examples:
- He tapped the dottle out of his pipe bowl after smoking.
- The dottle stayed stuck in the pipe bowl.
