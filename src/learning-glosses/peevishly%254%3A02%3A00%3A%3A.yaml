simpleMeaning: in a way that shows you are easily annoyed and quick to complain about small things
scope: This is about doing or saying something in an annoyed, complaining way, not about being very angry
  and not about feeling sad.
examples:
- '''I don''t want that one,'' he said peevishly, pushing the plate away.'
- She answered peevishly when her brother asked her the same question again.
