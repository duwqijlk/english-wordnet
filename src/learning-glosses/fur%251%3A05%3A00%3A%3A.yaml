simpleMeaning: A thick coat of thin, soft hair on a mammal (an animal that feeds its young with its own
  milk), such as a cat, a seal, or a weasel
scope: The soft hair on an animal's body, not a piece of clothing made from animal skins and not skin
  with hair taken from an animal.
examples:
- The cat's thick fur kept it warm in winter.
- A seal's fur helps it stay warm in cold water.
