simpleMeaning: A crude picture or words cut into rock or a wall.
scope: 'Also called graffiti: a crude picture or words cut into rock or a wall, not a painted mural and
  not a carved name on a gravestone.'
examples:
- A graffito was scratched into the old castle wall.
- The graffito on the rock showed a crude drawing of a horse.
