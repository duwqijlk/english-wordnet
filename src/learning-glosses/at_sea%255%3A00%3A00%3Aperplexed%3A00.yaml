simpleMeaning: Puzzled by many things in conflict with each other, and left unable to think clearly
scope: Puzzled by many things that fight with each other, also called lost, confused, bewildered, baffled,
  bemused, confounded, befuddled, mazed and mixed-up; not calm and sure of what to do.
examples:
- She felt at sea on her first day at the new school.
- The new rules left him at sea, unsure what to do next.
