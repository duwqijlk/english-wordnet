simpleMeaning: A drug that stops the body reacting to things it is over-sensitive to, used for nose troubles
  from hay fever and also for travel sickness.
scope: Also called diphenhydramine; a drug used for nose troubles from hay fever and for travel sickness.
examples:
- She took Benadryl for her hay fever.
- Benadryl helped his travel sickness on the boat.
