simpleMeaning: In Christianity, the teaching that the body of Christ is truly there in the bread and wine
  of the Eucharist
scope: In Christianity, the teaching that Christ is truly there in the Eucharist, not a mere sign or symbol,
  and not the bread and wine on their own.
examples:
- Catholics hold that the real presence is at the heart of the Mass.
- She wrote about the real presence and what it means for worship.
