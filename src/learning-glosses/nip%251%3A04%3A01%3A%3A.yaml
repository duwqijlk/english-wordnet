simpleMeaning: a quick, sharp little bite or cut
scope: A quick, sharp little bite or cut, with pinch as another name for this sense, and not a hard squeeze
  between the fingers or a deep wound.
examples:
- The puppy gave my finger a nip.
- The dog gave a nip at the postman's ankle.
