simpleMeaning: A plant whose young shoots, full of juice, are cooked and eaten as a food from plants.
scope: 'Also called asparagus: a plant whose young shoots, full of juice, are cooked and eaten, not a
  plant grown for its roots and not one grown for its leaves.'
examples:
- We grow edible asparagus in the garden.
- Edible asparagus is best when the shoots are young.
