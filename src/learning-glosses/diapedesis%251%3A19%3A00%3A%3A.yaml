simpleMeaning: Blood cells, white ones above all, passing through whole tiny blood-vessel walls into the
  flesh around them
scope: Blood cells slipping through whole vessel walls into nearby flesh, not blood leaking from a cut
  and not blood clotting.
examples:
- Diapedesis lets white blood cells reach the hurt flesh.
- During infection, diapedesis brings the cells to the wound.
