simpleMeaning: weighed down by worry, trouble, or grief
scope: Also called worried, upset, and disturbed, this is a person weighed down by worry, trouble, or
  grief, not someone under great physical strain or in money trouble.
examples:
- She was distressed about her son leaving home.
- The distressed parents waited by the phone all night.
