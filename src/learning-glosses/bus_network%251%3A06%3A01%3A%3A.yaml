simpleMeaning: A way of joining stations along one shared line, so every station gets all the messages
  sent along it.
scope: This is the name for a set of stations joined along one shared line, each getting all the messages
  sent along it.
examples:
- In a bus network, every station gets all the messages sent along the line.
- The school's computers were joined in a bus network.
