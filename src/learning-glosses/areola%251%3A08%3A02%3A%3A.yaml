simpleMeaning: A small space in a living part of a body, like the space between the veins of a leaf or
  of an insect's wing.
scope: A small space in a living part of a body, like the space between veins on a leaf or a wing; not
  the small round area around a nipple.
examples:
- The areola between the veins of the leaf was easy to see.
- An areola can be found in the wing of the insect.
