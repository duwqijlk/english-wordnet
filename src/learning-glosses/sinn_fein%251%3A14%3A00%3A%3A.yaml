simpleMeaning: An Irish republican political movement started in 1905 to win freedom from England and
  unite Ireland, later the political arm of the Irish Republican Army
scope: An Irish republican movement that sought a united Ireland free from England, the political side
  of the Irish Republican Army rather than its armed side.
examples:
- Sinn Fein was founded in 1905 to seek Irish independence.
- Sinn Fein became the political branch of the Irish Republican Army.
