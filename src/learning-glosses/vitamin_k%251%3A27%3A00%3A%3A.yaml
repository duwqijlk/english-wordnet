simpleMeaning: A substance that melts in fat and helps the blood clot.
scope: Also called antihemorrhagic factor and naphthoquinone, this is a substance that melts in fat and
  helps the blood clot, not the substance that helps the body grow.
examples:
- Vitamin K helps the blood clot.
- The nurse gave the baby vitamin K after birth.
