simpleMeaning: a soft, oily clay used as a colour in paint, especially a reddish brown colour
scope: A soft clay used to make paint colours, especially reddish brown; not the main stem of a tree.
examples:
- The painter mixed bole with water to make a reddish brown paint.
- She put a thin layer of bole on the wood before adding the gold.
