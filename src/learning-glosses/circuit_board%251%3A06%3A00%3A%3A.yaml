simpleMeaning: Inside a computer, a thin piece that plugs into a free slot so the machine gains new powers,
  its fine metal tracks carrying the signals
scope: This piece is also called a card, a board, an add-in, a circuit card, and a plug-in, and it fits
  inside a computer to add new abilities.
examples:
- The technician fitted a new circuit board into the computer to add more memory.
- She bought a circuit board that lets her old computer run faster.
