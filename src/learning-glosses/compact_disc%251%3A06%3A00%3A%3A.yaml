simpleMeaning: A beam of light reads the sounds off this small round plate, where they sit as a code of
  numbers; the plate is smaller than an old record.
scope: Also called a compact disk, this round plate is smaller than an old record and is read by a beam
  of light.
examples:
- She put the compact disc in the player and the music began.
- He bought a compact disc of his favourite band.
