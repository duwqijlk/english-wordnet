simpleMeaning: A part made to shield a bud or a slim flower cluster.
scope: A part that shields a bud or a flower cluster, also called scale; not a petal of a flower.
examples:
- A scale leaf shields the bud through winter.
- The scale leaf fell away when the bud opened.
