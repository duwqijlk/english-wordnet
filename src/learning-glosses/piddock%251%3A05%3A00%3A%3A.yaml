simpleMeaning: A sea animal with two shells that bores holes in rock, clay or wood with its saw-like shells.
scope: This is a sea animal with two shells that bores into rock, clay or wood; not a land animal, and
  not a sea animal with one shell.
examples:
- The piddock bored a hole in the soft rock.
- Piddocks left round holes in the old wood.
