simpleMeaning: Sweet food made by cooking soft plant flesh in sugar syrup and coating it with hard grains
  of sugar.
scope: Also called candied fruit; sweet food cooked in sugar, not fresh fruit and not dried fruit.
examples:
- The crystallized fruit glittered on top of the cake.
- She served crystallized fruit with coffee after dinner.
