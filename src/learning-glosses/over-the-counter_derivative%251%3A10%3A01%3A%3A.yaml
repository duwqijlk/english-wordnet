simpleMeaning: Deals between two sides, made and agreed in private, with no market or middle party in
  between.
scope: Deals made in private between two sides; not deals made on a market and not deals through a middle
  party.
examples:
- The two banks signed an over-the-counter derivative to fix the price of the loan.
- An over-the-counter derivative is agreed in private, not bought on a market.
