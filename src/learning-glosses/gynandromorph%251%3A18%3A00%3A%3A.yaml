simpleMeaning: A living thing with both male and female sex traits and sex organs, so that at birth no
  clear choice of male or female can be made.
scope: A living thing with both male and female sex traits and sex organs, so that at birth no clear choice
  of male or female can be made; hermaphrodite, epicene, androgyne, epicene person and intersex are other
  names for this sense, not a member of a Hindu group that goes without clothes.
examples:
- The gynandromorph had both male and female sex traits.
- At birth, no clear choice of male or female could be made for the gynandromorph.
