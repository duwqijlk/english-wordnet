simpleMeaning: The money the owner puts into a business, counted as what the business is worth after what
  it owes is taken away
scope: The part of a business that belongs to the person who put money into it, not money the business
  owes to others and not the money it takes in.
examples:
- The owner's equity in the shop grew as the business paid off its debts.
- When the owner's equity fell, the partners put in more money.
