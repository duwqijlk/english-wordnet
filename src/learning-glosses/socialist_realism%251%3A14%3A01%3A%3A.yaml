simpleMeaning: A way of making true-to-life art that grew up in the Soviet Union and became the main way
  in other countries with the same kind of rule
scope: This is a way of making true-to-life art, not abstract art and not other styles of the time.
examples:
- Socialist realism was the main art of the Soviet Union.
- The painting is an example of Socialist realism.
