simpleMeaning: with no error, or almost no error, when it matches facts or a rule or when work is done
scope: This sense is for a thing, a number or work that matches facts or a rule with no error or almost
  no error. Not the sense for ideas, pictures or words, which must be right in every part with no error
  at all.
examples:
- The scale gave an accurate weight.
- Her report was accurate and matched all the facts.
