scope: 'Also called indigo and indigo plant: a small bush of southeast Asia that loses its leaves in winter,
  with leaves of many leaflets and bunches of red or purple flowers, used to make blue dye; other small
  bushes of southeast Asia give no blue dye.'
examples:
- Indigofera tinctoria is grown in southeast Asia for blue dye.
- The red flowers of Indigofera tinctoria grow in bunches.
