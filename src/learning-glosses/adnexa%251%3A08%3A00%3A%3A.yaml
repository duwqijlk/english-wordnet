simpleMeaning: Parts of the body that lie next to an organ and belong with it, most often in the young
  before birth.
scope: Also called annexa, this word is used for body parts that lie next to an organ and belong with
  it, most often in the young before birth.
examples:
- The tubes and ovaries are adnexa of the womb.
- In the scan, the doctor looked at the adnexa around the womb.
