simpleMeaning: having, using, typical of, or suited to powers that lie beyond the natural world.
scope: This describes a supposed power beyond nature, not a trick performed for an audience.
examples:
- She wore a magic ring said to grant wishes.
- The old woman was said to have magic powers.
