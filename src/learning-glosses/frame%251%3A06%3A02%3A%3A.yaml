simpleMeaning: the part of a pair of glasses that holds the clear pieces in place
scope: The part that holds a pair of glasses together; not the border around a picture or a mirror, not
  a drawing in a comic strip, and not a part of a game.
examples:
- She chose glasses with a thin black frame.
- The frame of his glasses broke when they fell on the floor.
