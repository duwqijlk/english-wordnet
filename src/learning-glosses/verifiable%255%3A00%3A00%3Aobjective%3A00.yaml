simpleMeaning: able to be checked and shown to be true
scope: Able to be checked against facts; not the science sense, where a thing can be tested by experiment
  or by watching it.
examples:
- The police need a verifiable address before they can send the letter.
- His story gave verifiable details, such as dates and places we could check.
