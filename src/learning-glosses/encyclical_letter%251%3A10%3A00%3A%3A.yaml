simpleMeaning: a written message that goes out to every Roman Catholic bishop in the world, sent by the
  pope
scope: 'Also called encyclical: a written message that goes out to every Roman Catholic bishop in the
  world, sent by the pope, not a note to one bishop alone and not a speech to the public.'
examples:
- The encyclical letter was sent to all the bishops in the world.
- She read the pope's encyclical letter in the parish news sheet.
