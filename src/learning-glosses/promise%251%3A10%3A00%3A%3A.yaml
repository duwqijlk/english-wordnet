simpleMeaning: a firm spoken statement to another person that you will do something, or will not do something,
  in the future
scope: This is not a formal legal contract, and not a guess about what will happen; it is a commitment
  one person gives to another.
examples:
- He made a promise to call her every day.
- She kept her promise to help with the move.
