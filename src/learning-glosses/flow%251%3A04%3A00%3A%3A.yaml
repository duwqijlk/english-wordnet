simpleMeaning: the process of moving along steadily, without stopping or breaking.
scope: This is the ongoing process of moving along, not the movement typical of liquids and gases and
  not a steady supply of something.
examples:
- The flow of traffic improved after the new lane opened.
- Nothing disturbed the flow of the conversation all evening.
