simpleMeaning: The outer layer of an atom holds a tiny bit that can join with other atoms to make new
  stuff.
scope: It is a bit in the outer layer of an atom, told from the bits deep inside the atom by its power
  to join with other atoms.
examples:
- When a valence electron joins another atom, the two form a new bit of stuff.
- The atom's valence electron can link up with other atoms.
