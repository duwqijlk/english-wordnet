simpleMeaning: A tray that turns round, set on a table where people eat their meals.
scope: Also called a turntable, it is a tray that turns round on a table where people eat, not the flat
  plate that turns a record on a record player.
examples:
- We put the sauces on the lazy Susan so everyone could reach them.
- She turned the lazy Susan to get the salt.
