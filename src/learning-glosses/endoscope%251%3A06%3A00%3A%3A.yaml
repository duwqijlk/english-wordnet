simpleMeaning: A long thin tool doctors use to look inside a part of the body or to do small operations
scope: A long thin tool for looking inside the body or doing small operations, not a tool for cutting
  open the body and not a tube for feeding.
examples:
- The doctor used an endoscope to look inside her stomach.
- An endoscope let the surgeon see the growth without a large cut.
