simpleMeaning: an exercise where you bend your knees and lower your body again and again; it makes the
  muscles in your legs stronger
scope: 'Also called squatting: this is the repeated exercise for the legs, not just holding one low position
  with bent knees, not living in a place without the right to be there, and not short and thick.'
examples:
- She does twenty squats every morning to make her legs stronger.
- Squats are a key part of his training at the gym.
