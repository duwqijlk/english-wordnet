simpleMeaning: From western and central Europe, a herb that grows from a bulb and blooms in autumn, with
  white, purple, or pale purple-and-white blooms.
scope: 'Autumn crocus and naked lady are other names for it: it is a herb that grows from a bulb and blooms
  in autumn, with white, purple, or pale purple-and-white blooms, from western and central Europe.'
examples:
- Meadow saffron bloomed in autumn with purple blooms.
- The meadow saffron grows from a bulb in western Europe.
