senseId: 'infinitude%1:23:00::'
synsetId: 13798260-n
simpleMeaning: A number or amount so great that it has no end
scope: An amount with no end, not the quality of having no limit and not a large but counted number.
examples:
- An infinitude of stars fills the night sky.
- The infinitude of grains on the beach seemed beyond counting.
