simpleMeaning: A wing-like part that holds an aircraft steady.
scope: A wing-like part that holds an aircraft steady, not a chemical added to a solution, mixture, or
  suspension to keep it stable and unchanging.
examples:
- The stabilizer at the tail held the plane steady in flight.
- A damaged stabilizer made the aircraft hard to control.
