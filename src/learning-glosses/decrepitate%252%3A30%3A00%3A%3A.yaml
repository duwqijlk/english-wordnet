simpleMeaning: To heat strongly so as to make crackle, or until the crackling stops.
scope: To heat strongly so as to make crackle, or until the crackling stops; not to burn and not to melt.
examples:
- Decrepitate the salts until they stop crackling.
- The chemist will decrepitate the salts in the dish.
