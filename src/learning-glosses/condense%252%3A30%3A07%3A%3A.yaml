simpleMeaning: to form and grow as gas or loose matter comes together
scope: This means to form and grow as matter comes together; it is not the sense of changing from gas
  to liquid and falling in drops, and not the sense of making a text shorter.
examples:
- Stars condensed from clouds of gas and dust over millions of years.
- The early planets condensed out of hot gas around the young sun.
