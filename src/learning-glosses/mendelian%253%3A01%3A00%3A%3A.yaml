simpleMeaning: Of, or to do with, Gregor Mendel, or in line with the laws he set out.
scope: Of, or to do with, Gregor Mendel or his laws, not a follower of his teaching and not a word for
  any other thinker.
examples:
- Mendelian inheritance follows the laws set out by Gregor Mendel.
- The Mendelian pattern of the trait was clear in the family.
