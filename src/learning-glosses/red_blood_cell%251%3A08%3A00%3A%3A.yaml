simpleMeaning: A mature blood cell that contains hemoglobin to carry oxygen to the body tissues; a biconcave
  disc with no nucleus
scope: This grown disc in the fluid of the body is also called erythrocyte.
examples:
- Red blood cells carry oxygen to every part of the body.
- Without enough red blood cells, the tissues get too little oxygen.
