simpleMeaning: a North American woody plant that loses its leaves in fall, has no thorns, and bears pale
  grey leaves and fruit
scope: A North American woody plant that loses its leaves in fall, has no thorns, and bears pale grey
  leaves and fruit, also called silver-bush, silver berry, or silverberry; not a hairy European woody
  plant with evergreen leaves and pale yellow flowers.
examples:
- A silverbush grew by the road in the plains.
- The silverbush had pale grey leaves and small fruit.
