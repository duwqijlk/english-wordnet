simpleMeaning: A long piece running lengthways that holds the body of a plane or a ship firm.
scope: A long piece running lengthways that holds the body of a plane or a ship firm; not a long flat
  piece of wood joining upright posts, and not a worker who puts strings on things.
examples:
- The stringer ran the length of the hull, holding it firm.
- Workers fitted a new stringer to the plane's body.
