simpleMeaning: In speech, a sound made by partly or fully blocking the air that flows from the lungs out
  through the nose or mouth
scope: In speech, a sound made by partly or fully blocking the flow of air from the lungs; not a vowel
  and not a sound made with the air flowing freely.
examples:
- The obstruent at the start of the word blocks the air for a moment.
- In speech, an obstruent is made by closing off the flow of air.
