simpleMeaning: a tool for squeezing the liquid out of citrus fruit, with a cone-shaped ridged middle you
  press the fruit on
scope: Also called juicer and reamer, this is the tool with a cone-shaped ridged middle for getting the
  liquid out of citrus fruit.
examples:
- A juice reamer squeezed the juice from the lemons.
- Pressing the orange on the juice reamer got out its liquid.
