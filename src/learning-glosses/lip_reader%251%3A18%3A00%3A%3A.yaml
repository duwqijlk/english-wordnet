simpleMeaning: From a speaker's moving mouth, a person can work out what is said
scope: A person who gets spoken words from watching a mouth move, not from hearing them and not from reading
  signs.
examples:
- The lip reader followed the talk without hearing a word.
- She trained as a lip reader after losing her hearing.
