simpleMeaning: a bent piece on a long pole, used to pull or push a craft
scope: A bent piece on a long pole for pulling or pushing a craft, not a fishing hook and not a pole for
  pushing off mud.
examples:
- He used the boat hook to pull the dinghy closer to the dock.
- She caught the edge of the pier with the boat hook.
