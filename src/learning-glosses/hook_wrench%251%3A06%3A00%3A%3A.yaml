simpleMeaning: A tool for turning nuts and bolts, with a curved end that fits over the head of a nut or
  bolt
scope: A tool for turning nuts and bolts, with a curved end that fits over the head of a nut or bolt,
  also called a hook spanner; not a flat tool for turning, and not a tool for pulling nails.
examples:
- He used a hook wrench to loosen the big nut.
- The hook wrench's curved end gripped the bolt head.
