simpleMeaning: the way groups of words with a verb (clauses) are put in order, each group stronger than
  the one before it
scope: A way of setting out parts of a sentence so each one is stronger than the one before, not the moment
  of strongest pleasure during sex and not the end of something.
examples:
- The teacher showed us a climax in the speech, where each short part was stronger than the one before.
- '''I came, I saw, I won'' is often given as a climax, with each part rising in force.'
