simpleMeaning: having no tail and no part shaped like a tail
scope: This means having no tail and no part shaped like a tail, also called acaudate; not a short tail
  and not a tail that has been cut off.
examples:
- The acaudal fish swims without any tail to steer with.
- An acaudal lizard has no tail at all.
