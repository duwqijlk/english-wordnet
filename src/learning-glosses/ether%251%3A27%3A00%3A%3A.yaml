simpleMeaning: any of a group of compounds in which two groups of carbon and hydrogen are joined by one
  oxygen atom
scope: Any of a group of compounds in which two groups of carbon and hydrogen are joined by one oxygen
  atom; not the liquid once used to put people to sleep, and not the old idea of a substance filling space.
examples:
- Diethyl ether is the best-known ether of this kind.
- The chemist made an ether by joining two carbon groups with oxygen.
