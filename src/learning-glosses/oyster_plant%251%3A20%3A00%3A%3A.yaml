simpleMeaning: A two-year Mediterranean herb with milky sap, a long edible root and long-stemmed heads
  of purple ray flowers (strap-shaped petals); it grows wild throughout the United States.
scope: Another name for salsify, vegetable oyster and Tragopogon porrifolius; it is the whole plant, not
  the long edible root sold as a vegetable.
examples:
- The oyster plant bears purple ray flowers and has a long edible root.
- Oyster plant came from the Mediterranean and now grows wild across the United States.
