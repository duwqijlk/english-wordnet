simpleMeaning: a paper that says how much something is worth, such as for insurance or for tax
scope: This is a paper that says the worth of a thing, not a rough number worked out in your head and
  not the act of working out such a number.
examples:
- For insurance, she sent in an estimate that put a value on the stolen jewellery.
- He got a written estimate showing how much the house was worth for tax.
