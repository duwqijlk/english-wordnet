senseId: 'superannuate%2:30:00::'
synsetId: 00538001-v
simpleMeaning: To give up work, or to lose the right to keep it, because one is old or unwell.
scope: To leave work oneself, or to lose the right to stay in it, through age or ill health, not the use
  for an employer retiring a person with a pension for age or ill health.
examples:
- He chose to superannuate at sixty-five, when his health began to fail.
- Her knees grew so bad that she had to superannuate before the age of sixty.
