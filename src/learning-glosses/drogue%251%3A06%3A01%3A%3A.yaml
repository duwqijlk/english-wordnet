simpleMeaning: A check made of a canvas-covered frame that trails behind a boat, keeping it from drifting,
  or holding its head to the wind.
scope: A check made of a canvas-covered frame that trails behind a boat, keeping it from drifting, or
  holding its head to the wind; also called sea anchor; not a cut-off cloth cone on a mast, used to show
  the wind's way, as at airports, nor a parachute used to slow a thing moving fast, nor a funnel-shaped
  thing towed by a plane as a mark.
examples:
- Their drogue trailed in the sea.
- The drogue held the boat steady.
