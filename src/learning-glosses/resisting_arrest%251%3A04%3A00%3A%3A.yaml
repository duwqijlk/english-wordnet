simpleMeaning: The law counts it as hitting the officer when a person fights back with the body against
  being taken by the police in a lawful way.
scope: This is fighting back with the body against being taken by the police in a lawful way, which the
  law counts as hitting the officer.
examples:
- He was charged with resisting arrest after he fought the officers.
- Resisting arrest can add a further charge to the case.
