simpleMeaning: Kept hidden on purpose and done in a quiet, careful way, so no one notices what is happening.
scope: 'Also called sneak, and also sneaky: kept hidden on purpose and done in a quiet, careful way, so
  no one notices it, not open or bold.'
examples:
- She cast a furtive look toward the door.
- His furtive manner made the guard watch him closely.
