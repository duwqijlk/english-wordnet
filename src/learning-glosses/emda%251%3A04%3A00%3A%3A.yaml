simpleMeaning: A treatment that uses a local electric flow to push the tiny charged parts of a drug into
  the flesh
scope: This is a treatment that pushes a drug into the flesh with a local electric flow; electromotive
  drug administration, ionic medication, iontophoresis and iontotherapy are other names for this sense,
  and its nearest rivals are drugs taken by mouth and drugs given by needle.
examples:
- The clinic used EMDA to treat the sore knee.
- EMDA pushes the drug into the tissues with an electric current.
