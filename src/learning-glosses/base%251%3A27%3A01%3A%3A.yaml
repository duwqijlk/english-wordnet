simpleMeaning: a compound formed when phosphoric acid links to a sugar-and-nitrogen unit, the fundamental
  building block of nucleic acids such as DNA and RNA.
scope: This is not the chemical that turns litmus blue, the main ingredient of a mixture, or the side
  of a shape; it is the molecular unit that makes up DNA and RNA.
examples:
- A single base is made of a phosphate group, a sugar, and a nitrogen-containing part.
- The enzyme builds the new DNA strand by adding bases one after another.
