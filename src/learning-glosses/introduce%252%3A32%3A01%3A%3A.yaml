senseId: 'introduce%2:32:01::'
synsetId: 00903562-v
simpleMeaning: to add an opening part to a book, talk or other piece of work, before the main part
scope: This is adding an opening part before the main part of a book, talk or other piece of work. Not
  putting one thing inside another thing, and not making people know each other for the first time.
examples:
- The writer introduced his book with a short part about why he wrote it.
- She introduced her talk with a few words before the main part.
