simpleMeaning: to damage a person's sense of right and wrong, by leading them to drink too much or to
  follow sexual desires in a bad way
scope: Making a person bad in behaviour, also called corrupt, profane, demoralize, subvert, debase, misdirect,
  deprave, debauch, demoralise and vitiate. It is not twisting words to mislead, and not a person whose
  sexual behaviour is seen as bad.
examples:
- Wine and easy money perverted the young men in the town.
- He was accused of perverting the children by teaching them to steal and lie.
