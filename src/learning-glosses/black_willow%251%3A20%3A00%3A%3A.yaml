simpleMeaning: Close to streams and lakes in North America grows a shrubby willow with dark bark and narrow
  straight leaves.
scope: Also called swamp willow, this North American willow is the one with dark bark and narrow straight
  leaves, found close to streams and lakes.
examples:
- A black willow grows close to the stream.
- The black willow by the lake has dark bark and narrow leaves.
