senseId: 'misstep%1:04:00::'
synsetId: 00077383-n
simpleMeaning: a mistake that a person does not mean to make but that makes them feel ashamed
scope: Also called trip and stumble, this is a mistake a person does not mean to make. It is not a wrong
  step or a fall while walking.
examples:
- Saying the wrong name at the meeting was an embarrassing misstep.
- His public misstep made him feel ashamed in front of his team.
