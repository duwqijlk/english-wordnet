simpleMeaning: Dull yellow-green flowers in a bunch along a stem mark this small land plant of eastern
  North America and Europe, which has two leaves near the ground
scope: This small land plant is also called fen orchis, and it stands apart from other orchids by its
  two low leaves and its dull yellow-green flowers.
examples:
- The fen orchid had two low leaves and dull yellow-green flowers.
- We found a fen orchid with two low leaves near the base of its stem.
