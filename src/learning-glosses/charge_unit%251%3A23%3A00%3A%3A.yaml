simpleMeaning: a measure of how much electricity there is, set by how strong the flow is and how long
  it runs
scope: A measure of how much electricity there is, set by the flow and the time; not a measure of power
  and not a battery.
examples:
- The charge unit tells us how much electricity has passed.
- We worked out the charge unit from the flow and the time.
