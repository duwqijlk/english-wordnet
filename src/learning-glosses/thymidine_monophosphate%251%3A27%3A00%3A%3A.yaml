simpleMeaning: a small building block of DNA made from thymine, a sugar with one oxygen part missing,
  and a phosphate group
scope: 'Also called thymidylic acid, deoxythymidine monophosphate and deoxythymidylic acid: a building
  block of DNA, not a whole DNA strand and not a protein.'
