schema: oewn-learning-gloss-v2
senseId: 'pretend%2:36:00::'
synsetId: 01725433-v
simpleMeaning: To behave in a way that is put on rather than natural.
scope: An artificial, put-on manner, not the playing of a particular role or a false situation; act and
  dissemble are other names for this sense.
examples:
- He was only pretending; his cheerful manner was all for show.
- She was pretending again, nodding along though she disagreed with every word.
