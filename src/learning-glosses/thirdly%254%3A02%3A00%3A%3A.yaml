simpleMeaning: used to show point number three in a list of points
scope: 'Also called third: used for point number three in a list; not first or second in a list, and not
  one of three equal parts.'
examples:
- Thirdly, we need to talk about the cost of the trip.
- Firstly, wash the rice; secondly, boil it; thirdly, let it rest.
