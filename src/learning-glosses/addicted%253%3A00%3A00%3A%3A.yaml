simpleMeaning: Unable to stop taking or doing a thing that forms a habit, with the body and mind both
  caught by it.
scope: Unable to stop taking or doing a thing that forms a habit, not merely fond of it.
examples:
- After years of smoking, she was addicted to cigarettes.
- He grew addicted to the game and played it every night.
