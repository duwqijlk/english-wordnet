simpleMeaning: Bright and smooth to the touch, as if a thin coat of frozen water lay over the top
scope: A bright, smooth surface with a thin coat of frozen water, not a cold, unfriendly manner.
examples:
- The icy road was smooth and hard to walk on.
- Trees stood under an icy film after the cold rain.
