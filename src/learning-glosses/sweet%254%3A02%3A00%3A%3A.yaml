simpleMeaning: in a fond and caring way, sometimes in poetry or casual speech
scope: This is an affectionate manner of acting, not the adjective senses about taste or pleasing qualities,
  and not the noun for a sugary food or dessert.
examples:
- She talked sweet to the frightened child.
- He talked sweet to his mother until she agreed.
