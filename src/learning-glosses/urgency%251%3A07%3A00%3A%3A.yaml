simpleMeaning: How important a thing is when it must be done at once, without waiting
scope: This is how important a thing is when it needs fast action, not the state of having a strong need
  and not strong, repeated asking.
examples:
- The urgency of the rescue meant help had to come at once.
- She stressed the urgency of fixing the leak before it got worse.
