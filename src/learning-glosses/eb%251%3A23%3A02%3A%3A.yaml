simpleMeaning: A unit of stored facts, as big as 1,000 petabits, or 10 to the power 18 bits.
scope: Also called exabit and Ebit; a big unit counted in bits, not in bytes.
examples:
- The link moves data at one Eb a second.
- An Eb counts bits, not bytes.
