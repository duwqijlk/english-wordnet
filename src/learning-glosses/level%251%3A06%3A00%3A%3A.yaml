simpleMeaning: a tool used to show whether a surface is horizontal, with a bubble that sits centered in
  a tube of liquid
scope: This is a tool for checking flat surfaces, not a floor of a building, a non-physical layer, or
  a word for flat.
examples:
- The builder used a level to check that the shelf was flat.
- Hold the level against the wall and adjust the frame until the bubble sits in the middle.
