simpleMeaning: allowed by law to do something or to give evidence, because you meet what the law asks
  for
scope: In law, allowed to act or give evidence, not able to do a job well in general and not just good
  enough.
examples:
- The case went before a competent court.
- Her statement was accepted as competent testimony.
