simpleMeaning: a loop of metal that runs round and round under a machine so it can move over the ground
scope: 'Also called caterpillar tread and track: a loop of metal under a machine, not a set of wheels
  and not a rail.'
examples:
- The tank's caterpillar track spread its weight over the soft ground.
- Mud caked the caterpillar track as the machine crossed the field.
