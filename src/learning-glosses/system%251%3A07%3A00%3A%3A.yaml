simpleMeaning: an ordered way of doing things; the quality of being methodical and well organized.
scope: Here 'system' is uncountable and means good order itself, the habit of working methodically. It
  is not a particular method or plan for reaching a goal, and not a set of rules or a complex of methods.
  The pack's own example, 'we can't do it unless we establish some system around here', shows the uncountable
  use.
examples:
- What this office needs is a little system, not more staff.
- There is no system in the way he keeps his files; everything ends up in a heap.
