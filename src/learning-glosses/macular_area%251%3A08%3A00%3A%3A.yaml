simpleMeaning: A small yellow spot in the middle of the retina, the layer at the back of the eye, rich
  in cone cells that give sharp, clear sight.
scope: A small yellow spot in the middle of the retina that gives sharp sight, also called macula, macula
  lutea, or yellow spot, not the whole retina and not the blind spot.
examples:
- The macular area gives us our sharpest sight.
- Light falls on the macular area when we look straight at a word.
