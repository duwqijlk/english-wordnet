simpleMeaning: a person who wrongly fears that other people want to harm them
scope: Also called paranoid. This is a person who has this fear, not the fear itself and not a person
  who is afraid for a good reason.
examples:
- The paranoiac believed his neighbours were planning to hurt him, though there was no proof.
- As a paranoiac, she thought every stranger on the street was following her.
