simpleMeaning: to cut into a block used for printing, or to print from such a block
scope: 'Also called etch: to cut a printing block or print from one, not to leave a deep mark on the mind.'
examples:
- He learned to engrave a letter on the wooden block.
- The artist engraved the plate for the new book.
