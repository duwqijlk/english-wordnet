simpleMeaning: A thing that has nearly the shape of a figure with three straight sides
scope: A thing that has nearly the shape of a figure with three straight sides, not the metal instrument
  that is struck and not the tool used for drawing straight lines at set angles.
examples:
- The coastline forms two legs of a triangle.
- The field was a rough triangle between the roads.
