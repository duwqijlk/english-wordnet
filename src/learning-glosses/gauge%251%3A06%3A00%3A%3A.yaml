senseId: 'gauge%1:06:00::'
synsetId: 03434198-n
simpleMeaning: A tool that measures a thing and shows the amount, such as the thickness of wire or how
  much rain has fallen.
scope: A tool that measures and shows an amount, not a set standard to judge things by and not the act
  of working out a size.
examples:
- He read the rain gauge after the storm.
- The wire gauge showed the thickness at a glance.
