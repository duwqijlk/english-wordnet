simpleMeaning: A plant of eastern North America with groups of bristly blue blooms.
scope: A plant of eastern North America with groups of bristly blue blooms; ague weed and agueweed are
  other names for this sense, not a gentian with yellow blooms, and not a gentian with closed blooms.
examples:
- The five-flowered gentian grows in the woods of the east.
- We saw a five-flowered gentian with blue blooms by the path.
