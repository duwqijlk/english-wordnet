simpleMeaning: In a way that shows no feeling, spirit, or care
scope: In a way that shows no feeling or care, not in a cruel way on purpose and not in a merely tired
  way.
examples:
- They soullessly grubbed for profit, caring for nothing else.
- The clerk soullessly stamped the papers all day.
