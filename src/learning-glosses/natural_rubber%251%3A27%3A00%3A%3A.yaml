simpleMeaning: Heat firms up this springy stuff from the milky sap of trees, above all Hevea and Ficus
  trees, and it is shaped into many kinds of goods.
scope: People also call this springy stuff from the milky sap of trees rubber, caoutchouc and gum elastic.
examples:
- Natural rubber comes from the milky sap of trees.
- Natural rubber was shaped into many kinds of goods.
