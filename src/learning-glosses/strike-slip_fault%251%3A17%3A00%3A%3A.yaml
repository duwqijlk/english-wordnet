simpleMeaning: In geology, a crack in the ground where one side seems to have moved sideways past the
  other
scope: A crack in the ground where one side seems to have moved sideways, not a crack where one side seems
  to have moved up or down and not a crack in a building.
examples:
- The strike-slip fault runs along the valley floor.
- After the quake, one side of the strike-slip fault had shifted sideways.
