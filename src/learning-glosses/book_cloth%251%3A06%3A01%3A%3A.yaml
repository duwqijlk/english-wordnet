simpleMeaning: a woven material, most often cotton, used to cover the outside of a bound set of pages
scope: 'Also called bookcloth: a woven material, most often cotton, used to cover the outside of a bound
  set of pages, not plain paper covers and not loose cloth for other uses.'
examples:
- They bound the new edition in red book cloth.
- The book cloth on the cover was worn thin at the edges.
