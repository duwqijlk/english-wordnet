simpleMeaning: Leaves that shine grey and flake off in bits grow on a thorny shrub of the chalky flats
  of the southwest United States and Mexico.
scope: Also called quail brush and white thistle; a thorny shrub with shiny grey leaves that flake off
  in bits, on the chalky flats of the southwest United States and Mexico.
examples:
- Quail bush grows on the chalky flats of the southwest.
- The quail bush had shiny grey leaves that flake off in bits.
