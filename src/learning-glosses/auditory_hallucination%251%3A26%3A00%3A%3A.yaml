simpleMeaning: Hearing strange sounds that are not words and are not really there
scope: This is hearing strange sounds that are not words and are not really there; acousma is another
  name for it, not hearing voices that speak words and not a ringing in the ears.
examples:
- An auditory hallucination made him hear strange sounds that no one else could hear.
- Her auditory hallucination was a low hum with no words in it.
