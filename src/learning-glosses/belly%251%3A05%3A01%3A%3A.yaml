simpleMeaning: the bottom side of the body of some animals with a back bone, such as snakes or fish
scope: This is the bottom side of an animal such as a snake or fish, not the front part of a person's
  body between the chest and the legs.
examples:
- The snake slid along on its pale belly.
- The fish was white on its belly and dark on top.
