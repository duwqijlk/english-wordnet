senseId: 'preeclampsia%1:26:00::'
synsetId: 14214924-n
simpleMeaning: Protein in the urine, blood pressure too high, and water held in the body mark this unhealthy
  state of pregnancy, which can turn into fits if nothing is done
scope: Also called pre-eclampsia; a sickness of pregnancy, not the fits it can lead to and not high blood
  pressure by itself.
examples:
- Preeclampsia showed up as high blood pressure and protein in her urine.
- The doctor watched for preeclampsia when her ankles began to swell.
