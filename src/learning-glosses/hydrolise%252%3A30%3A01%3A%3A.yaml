simpleMeaning: to get a chemical to join with water and split into smaller parts
scope: To make a chemical join with water and split apart, also called hydrolize; not simply dissolving
  a thing and not burning it.
examples:
- They hydrolise the fat to make soap.
- Water can hydrolise the salt into an acid and a base.
