simpleMeaning: a plant of the west of North America with thin, blade-shaped leaves and flowers white with
  a green tint
scope: A plant of the west of North America with thin leaves and white flowers with a green tint, not
  a plant with broad leaves and not a plant from the east.
examples:
- Alkali grass grew along the edge of the field.
- We saw alkali grass with its pale flowers near the lake.
