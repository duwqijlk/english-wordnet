simpleMeaning: a tent used by Native American people, usually in the shape of a cone, with a pointed top
scope: 'Also called tipi and teepee: this is the usually cone-shaped Native American tent, not a flat
  tent or a wooden house.'
examples:
- The family slept in a tepee on the open plain.
- A tall tepee stood near the river.
