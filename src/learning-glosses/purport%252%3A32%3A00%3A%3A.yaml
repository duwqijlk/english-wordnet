synsetId: 00759237-v
simpleMeaning: to seem to be, mean, or say something, often in a way that is not truly what it seems
scope: This is about seeming to be, mean, or say something, not about really being it or really doing
  it.
examples:
- The letter purports to be from the bank, but it is not real.
- The report purports to show the full truth.
