simpleMeaning: a big town area where many people live close together, which may hold several separate
  districts
scope: 'Another name for city and metropolis: a big town area, not a small town and not a single district
  on its own.'
examples:
- The urban center drew workers from all the towns around it.
- She moved to the urban center to find work in the city.
