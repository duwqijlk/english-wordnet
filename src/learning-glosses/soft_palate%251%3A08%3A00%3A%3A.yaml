simpleMeaning: a bendy flap of muscle at the back of the mouth that shuts the nose passage when a person
  swallows or speaks
scope: A flap of muscle at the back of the mouth, also called velum; not the hard front part of the roof
  of the mouth, and not the tongue.
examples:
- The doctor asked him to open wide so she could see his soft palate.
- Her soft palate moved up when she swallowed.
