simpleMeaning: the process in which a baby comes out of its mother's body.
scope: This is the physical process of a baby being born, not the date someone was born or the beginning
  of an idea.
examples:
- She was present at the birth of both her grandchildren.
- The birth was long and difficult, but mother and baby were soon well.
