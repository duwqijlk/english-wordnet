simpleMeaning: Fruit that has been cooked with sugar so it keeps well
scope: Preserve is another name for this sense; this is fruit cooked with sugar, not the act of keeping
  a thing safe from harm and not keeping a thing the same through change.
examples:
- She spread cherry conserve on her toast.
- The shop sold jars of apricot conserve.
