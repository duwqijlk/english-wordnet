simpleMeaning: Grown to cover the ground, this long-lived plant forms mounds of rich broad ribbed leaves
  and bears bunches of white, blue, or lilac flowers; any of many kinds.
scope: A long-lived plant with broad ribbed leaves and white, blue, or lilac flowers, grown to cover the
  ground; day lily is another name for it.
examples:
- The plantain lily spread its broad leaves over the ground.
- White plantain lily flowers opened.
