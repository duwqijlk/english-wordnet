simpleMeaning: In economics, the taking of things to meet needs or to make things
scope: 'Also called use, consumption, economic consumption, and usance: in economics, things taken to
  meet needs or to make things, not the buying of things and not the making of money.'
examples:
- The use of goods and services rose as the town grew.
- The use of goods and services in the factory went up when more chairs were made.
