simpleMeaning: Shaped like the open mouth of a big water reptile, this tool has a V-shaped mouth with
  small teeth on one side.
scope: This tool has a V-shaped mouth with small teeth on one side and is shaped like the open mouth of
  a big water reptile; it is not a smooth-jawed tool, and it is not the animal itself.
examples:
- He gripped the pipe with the alligator wrench.
- The alligator wrench held the nut with its small teeth.
