simpleMeaning: having a bright white shine like that of polished metal.
scope: This describes a bright white shine on a surface, not a grey tint and not being made of the metal.
examples:
- The satin fabric had a silver sheen in the candlelight.
- The fish's scales flashed with a silver gleam as it jumped.
