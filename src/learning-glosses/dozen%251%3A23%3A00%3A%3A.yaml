simpleMeaning: the counting number that comes after eleven
scope: The number twelve, also called 12 or XII, not the adjective meaning 'being one more than eleven'.
examples:
- Eggs are cheaper when you buy them by the dozen.
- A dozen of those small cakes would be enough for the party.
