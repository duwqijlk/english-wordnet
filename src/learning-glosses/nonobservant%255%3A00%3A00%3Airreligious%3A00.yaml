simpleMeaning: Said of a person who does not keep the ways of their faith, whether they fail to or will
  not
scope: A person who does not keep the ways of their faith, not someone who keeps them and not someone
  with no faith at all.
examples:
- Though raised in the faith, he grew nonobservant and stopped keeping the holy days.
- Her nonobservant brother never went to the house of prayer.
