simpleMeaning: One of many long thin threads too small to see, they run through a nerve cell and into
  its long and short arms, giving the cell support and shape.
scope: It is one of many tiny threads inside a nerve cell, not the cell itself and not the long arm alone.
examples:
- Neurofibrils run through the body of a nerve cell.
- Each neurofibril reaches into the long and short arms of a nerve cell.
