simpleMeaning: With a microscope, in a way that can be seen only through a microscope.
scope: With a microscope, in a way that can be seen only through one; not as if through a microscope,
  with great care over small details.
examples:
- The blood was examined microscopically.
- The seeds were microscopically small.
