simpleMeaning: the place where the player who guards the middle bag of the field stands
scope: In baseball, the fielding spot near the middle of the field; second is another name for this sense.
  Not the spot near first or third, and not the player who hits the ball.
examples:
- He played second base all season for his school team.
- The coach moved her to second base after the first inning.
