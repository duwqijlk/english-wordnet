simpleMeaning: To flip some tones of a photo, and bring out bright edges, by a flash of light, then washing
  and redeveloping it.
scope: To flip some tones of a photo, and bring out bright edges, by a flash of light, then washing and
  redeveloping it; also called solarise; not to lay a thing in the sun, or change it by the sun.
examples:
- They would solarize the print at noon.
- The artist came to solarize the plate.
