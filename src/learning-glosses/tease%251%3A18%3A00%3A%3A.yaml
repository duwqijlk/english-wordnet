simpleMeaning: A person who likes to make fun of others or to stir up their interest and leave them wanting
  more.
scope: This is a person who likes to make fun of others or stir up interest, not the act of bothering
  a person or combing hair to make it full.
examples:
- He is a tease who loves to wind people up.
- The tease kept asking riddles and never gave the answers.
