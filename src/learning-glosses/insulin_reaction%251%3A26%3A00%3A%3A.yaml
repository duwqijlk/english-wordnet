simpleMeaning: low blood sugar caused by too much of the drug that lowers blood sugar, which can bring
  on a deep sleep from which a person cannot wake
scope: Low blood sugar caused by too much of the drug that lowers blood sugar, also called insulin shock;
  not a coma from high blood sugar and not a faint from hunger.
examples:
- An insulin reaction left him in a deep sleep.
- She was rushed to hospital after an insulin reaction.
