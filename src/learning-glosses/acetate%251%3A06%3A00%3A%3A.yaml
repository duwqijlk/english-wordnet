simpleMeaning: a cloth made from thin threads of a man-made material made with acetic acid and cellulose,
  the main part of the walls of plant cells
scope: This is a cloth made from thin threads of a man-made material; it is not the chemical sense, a
  salt or an ester made from acetic acid.
examples:
- Her dress was made of shiny acetate that felt smooth.
- The lining of the jacket is acetate, not cotton.
