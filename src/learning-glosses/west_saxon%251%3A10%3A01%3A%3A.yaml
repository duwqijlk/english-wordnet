simpleMeaning: A form of Middle English spoken in the area past Sussex and south and southwest of the
  Thames, on the side where the sun sets.
scope: Also called Southwestern; a dialect of Middle English spoken south and southwest of the Thames,
  not the West Midland dialect of Mercia.
examples:
- West Saxon was spoken south of the Thames.
- Many old texts were written in West Saxon.
