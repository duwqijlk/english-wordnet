simpleMeaning: a state in which the water a person passes out, which is most often a little bit acid,
  is now the opposite of acid
scope: 'Another name for this is alkaluria: a state of the water the body passes out, not the normal acid
  state of that water, and not a state of the blood.'
examples:
- The test showed alkalinuria, so the doctor looked for the cause.
- Alkalinuria was found in the sample of urine sent to the lab.
