simpleMeaning: This tropical vine has edible roots, at times boiled like potatoes, and pink-and-yellow
  flowers speckled purple; it grows from the West Indies to the northern edge of South America.
scope: The salsilla with pink-and-yellow flowers speckled purple, from the West Indies to northern South
  America, not the Colombian salsilla with small purple umbels.
examples:
- The salsilla in the greenhouse was covered with pink-and-yellow flowers.
- Villagers boil the roots of salsilla when potatoes are scarce.
