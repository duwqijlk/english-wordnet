simpleMeaning: In men, the bulb of the penis is fed by a side tube off the deep blood tube that runs to
  the private parts
scope: This side tube in men is also called the artery of the penis bulb, not the matching tube found
  in women.
examples:
- In men, the arteria bulbi penis carries blood to the bulb of the penis.
- The arteria bulbi penis branches off the deep blood tube that runs to the private parts.
