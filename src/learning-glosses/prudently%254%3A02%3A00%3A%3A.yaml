senseId: 'prudently%4:02:00::'
synsetId: 00371084-r
simpleMeaning: in a careful, wise way that thinks ahead and avoids needless risk
scope: Done with care and thought about what may happen later; not done in a wild or careless way, and
  not just done slowly.
examples:
- He prudently saved part of his pay each month.
- She prudently checked the weather before sailing out to sea.
