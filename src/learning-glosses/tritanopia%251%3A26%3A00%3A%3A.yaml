simpleMeaning: Blue light reaches the eye weakly in this rare kind of colour blindness, so blue and yellow
  cannot be told apart.
scope: Also called blue-blindness, it is a rare kind of colour blindness in which blue light is sensed
  weakly.
examples:
- With tritanopia, a blue shirt can look the same as a yellow one.
- The test showed tritanopia when blue and yellow cards looked the same.
