simpleMeaning: to look at something very closely and in great detail
scope: This is looking at something very closely, not getting information from a tape, moving a light
  beam over something, or fitting a poem's beat pattern.
examples:
- The doctor scanned the X-ray for any sign of damage.
- She scanned the report closely, looking for one small error.
