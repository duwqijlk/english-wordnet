simpleMeaning: A low South African plant with thick fleshy leaves, whose fruit is a case holding soft
  flesh that can be eaten.
scope: This is a low South African plant also called sour fig, Carpobrotus edulis, Hottentot fig and Mesembryanthemum
  edule, not a tall plant or a plant with dry fruit.
examples:
- Hottentot's fig grows low along the South African coast.
- The soft flesh inside a Hottentot's fig can be eaten.
