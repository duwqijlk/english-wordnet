simpleMeaning: a small sharp tip that grows on a stem or leaf and is like a spike in shape
scope: A small sharp tip on a plant, also called a spine, a thorn or a sticker. It is not the verb sense,
  where skin feels a sharp, tingly feeling.
examples:
- A prickle on the stem hurt her finger when she picked the flower.
- Each leaf has a small prickle at its edge.
