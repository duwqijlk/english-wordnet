simpleMeaning: a thin bag in the body that holds urine for a short time
scope: A bag in the body that holds urine for a short time, not the bag that holds food and not the sac
  that holds a baby.
examples:
- Her urinary bladder was full, so she went to the toilet.
- The doctor felt his urinary bladder to check how much urine it held.
