simpleMeaning: With big whitish or yellowish flowers spotted with purple and a long curving beak, this
  one-year plant grows from the southern United States to Mexico.
scope: This one-year plant, also called common devil's claw, common unicorn plant, devil's claw, elephant-tusk
  and proboscis flower, is a plant with a long curving beak rather than a horn of an animal.
examples:
- We found a ram's horn in southern Texas.
- The ram's horn had purple spots on its pale flowers.
