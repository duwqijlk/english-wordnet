simpleMeaning: nerve damage starting in childhood or young adulthood, weakening and wasting hand and lower-leg
  muscles; slow-moving, with a normal life span, passed on through the X chromosome, dominant or recessive
scope: 'Also called hereditary motor and sensory neuropathy: nerve damage starting in youth that weakens
  the hands and lower legs, not a muscle injury from overuse and not a brain illness.'
examples:
- Charcot-Marie-Tooth disease runs in his family.
- She was told she had Charcot-Marie-Tooth disease as a teenager.
