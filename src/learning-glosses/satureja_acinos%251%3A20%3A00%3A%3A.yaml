simpleMeaning: A sweet-smelling European mint with groups of small violet-and-white flowers, now growing
  wild above all in eastern North America.
scope: Also called basil balm, basil thyme, mother of thyme and Acinos arvensis; a sweet-smelling European
  mint, not a mint grown only in gardens.
