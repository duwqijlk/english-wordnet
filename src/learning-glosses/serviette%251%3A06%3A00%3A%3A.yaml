simpleMeaning: a small piece of cloth used at a meal to wipe your mouth and to put over your lap to keep
  your clothes clean
scope: 'Also called napkin: a small cloth for use at a meal, not a large cloth for drying your hands or
  body after washing.'
examples:
- She put a serviette on her lap before she started to eat.
- He wiped his mouth with a serviette.
