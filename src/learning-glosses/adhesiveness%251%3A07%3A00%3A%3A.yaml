senseId: 'adhesiveness%1:07:00::'
synsetId: 04942705-n
simpleMeaning: The way two things stick to each other, as glue to wood, or two faces made of unlike stuff
  join.
scope: The way two things stick to each other or two unlike faces join, also called bond, adherence, and
  adhesion; not the sticking of like stuff to itself and not a band of scar tissue joining body parts.
examples:
- The mutual adhesiveness of cells holds the tissue together.
- The glue's adhesiveness failed in the damp.
