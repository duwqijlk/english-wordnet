simpleMeaning: When words are told again, words that point to the speaker, time, and place are changed
  to fit, as when 'I am a fool' becomes 'he is a fool'.
scope: Words told again with the pointing words changed to fit the new telling, not direct discourse,
  where words are quoted just as they were said.
examples:
- In indirect discourse, 'I will come tomorrow' becomes 'she said she would come the next day'.
- The teacher asked us to turn the direct words into indirect discourse.
