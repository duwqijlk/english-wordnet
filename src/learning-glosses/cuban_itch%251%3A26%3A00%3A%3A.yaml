simpleMeaning: A mild kind of smallpox, caused by a weaker form of the virus that causes smallpox
scope: Also called alastrim, milk pox, pseudosmallpox, pseudovariola, variola minor, white pox, Kaffir
  pox, or West Indian smallpox; a mild form of smallpox from a weaker form of the virus.
examples:
- Cuban itch is a mild form of smallpox.
- The doctor said Cuban itch comes from a weaker form of the virus.
