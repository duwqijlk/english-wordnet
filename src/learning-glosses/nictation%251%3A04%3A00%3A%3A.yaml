simpleMeaning: Without the person meaning it, the eyes shut and open again very fast
scope: Without the person meaning it, the eyes shut and open again very fast, also called blink, blinking,
  eye blink, wink, winking and nictitation, and not a slow blink or a wink done on purpose.
examples:
- The dust made her nictation quicken.
- Her nictation was so fast I barely saw her eyes move.
