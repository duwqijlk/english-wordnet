simpleMeaning: The metal links or cord that join a heavy hook to a ship.
scope: 'Also called anchor rope: the metal links or cord that join a heavy hook to a ship, not a cord
  that ties a ship to land and not a set of links for lifting goods.'
examples:
- The anchor chain held the ship fast.
- They pulled in the anchor chain.
