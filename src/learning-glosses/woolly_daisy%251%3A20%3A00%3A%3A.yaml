simpleMeaning: A tiny grey woolly clump-forming plant that lives one year, with small golden-yellow flower
  heads, from southeastern California to northwestern Arizona and southwestern Utah, sometimes placed
  in the genus Eriophyllum.
scope: A tiny woolly grey annual with golden-yellow flower heads, native to the desert Southwest. It is
  not the woolly sunflower, another yellow-flowered plant of that region.
examples:
- We spotted a woolly daisy beside the desert trail.
- After the winter rains, woolly daisies covered the sandy ground.
