simpleMeaning: The most common yew in Europe, a tree that lives a very long time and grows very slowly,
  one of the oldest kinds of living thing in the world.
scope: Also called English yew and Old World yew, this is the yew most often seen in Europe, not a yew
  of North America or Asia.
examples:
- Taxus baccata grows slowly in the churchyard.
- A Taxus baccata in the garden is said to be hundreds of years old.
