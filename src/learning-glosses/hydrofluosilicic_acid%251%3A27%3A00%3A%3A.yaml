scope: This is an unsteady poison liquid that eats away at things, known mostly in the form of its salts;
  fluosilicic acid is another name for this sense, not a stable liquid kept in a bottle and not a salt
  on its own.
examples:
- Hydrofluosilicic acid is known mostly through its salts.
- The lab stored hydrofluosilicic acid with great care.
