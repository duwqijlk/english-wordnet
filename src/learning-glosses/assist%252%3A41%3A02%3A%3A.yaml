simpleMeaning: to make things easier for someone by doing work they need, or by being useful to them
scope: This sense is giving help in general, or being of use. It is not working in a lower role under
  a person, and it is not the act of helping as a thing.
examples:
- Can you assist me with these heavy bags?
- Volunteers assisted families whose homes were hurt by the flood.
