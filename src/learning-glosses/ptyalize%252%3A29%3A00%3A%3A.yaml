simpleMeaning: To get spit or thick wet stuff out of the mouth by forcing it out
scope: This is forcing spit or thick wet stuff out of the mouth, also called spit, spew, ptyalise or spue;
  not swallowing, and not coughing up from the chest.
examples:
- She ptyalized the bitter juice onto the grass.
- He ptyalized after the dentist told him to clear his mouth.
