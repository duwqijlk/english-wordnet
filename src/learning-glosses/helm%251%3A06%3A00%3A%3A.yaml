simpleMeaning: The wheel or set of parts on a boat or ship that turns it and sets the way it goes
scope: This is the steering parts of a boat or ship, not the boat itself and not a sail.
examples:
- He took the helm and turned the boat toward the shore.
- The helm felt stiff in her hands as the ship met the waves.
