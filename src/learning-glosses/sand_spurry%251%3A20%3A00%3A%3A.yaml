simpleMeaning: A low-growing weed with tiny pink flowers that grows on dunes, heath and coastal cliffs
  across Europe and Asia and has spread to eastern North America.
scope: The low, pink-flowered plant of dunes, heath and coastal cliffs, not a cultivated herb or a garden
  ornamental.
examples:
- Sand spurry covered the dunes in a low mat of tiny pink flowers.
- On the coastal cliffs, sand spurry survives where few other plants can grow.
