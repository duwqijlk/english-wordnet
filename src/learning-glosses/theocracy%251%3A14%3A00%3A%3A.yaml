simpleMeaning: A state or land ruled by a god, or by leaders thought to be led by a god.
scope: A state or land ruled by a god, or by leaders thought to be led by a god, not the belief that rule
  should come from a god.
examples:
- The theocracy was ruled by priests who spoke for the god.
- In a theocracy, the laws are said to come from heaven.
