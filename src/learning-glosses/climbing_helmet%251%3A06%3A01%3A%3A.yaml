simpleMeaning: a piece of safety gear that chiefly guards the head of the person wearing it against falling
  stones or dropped gear and against hard knocks in a fall
scope: A piece of safety gear that chiefly guards the head of the person wearing it against falling stones
  or dropped gear and against hard knocks in a fall; not a hard hat worn on a building site and not a
  helmet for riding a bike.
examples:
- He put on his climbing helmet before the rock face.
- A climbing helmet can save a climber from a falling stone.
