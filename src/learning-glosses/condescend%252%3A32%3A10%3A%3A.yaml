schema: oewn-learning-gloss-v2
senseId: 'condescend%2:32:10::'
synsetId: 00910930-v
simpleMeaning: to treat someone as if they are below you, in a proud and scornful way
scope: To treat someone as if they are below you; not to do a task you think is beneath you and not to
  act in a low, unworthy way.
examples:
- He condescended to his younger brother, talking down to him as if he knew nothing.
- She condescended to the new worker, speaking slowly as if he could not understand her.
