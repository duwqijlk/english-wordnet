simpleMeaning: a worker who works with electricity and is in charge of the lights on a film or TV set
scope: This is the worker in charge of lights on a film or TV set, not an actor, not a camera worker,
  and not a worker who fits lights in homes.
examples:
- The gaffer placed the lights before filming started.
- She works as the gaffer on a TV show.
