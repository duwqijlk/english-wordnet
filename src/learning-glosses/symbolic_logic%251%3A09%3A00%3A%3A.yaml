simpleMeaning: By looking only at the shape of claims, not what they say, this set of rules tests whether
  claims hold together and hold true.
scope: Formal logic and mathematical logic are other names for this set of rules that tests claims by
  their shape alone.
examples:
- In symbolic logic we wrote the claim as signs and checked if it held together.
- She used symbolic logic to test if the two claims could both hold true.
