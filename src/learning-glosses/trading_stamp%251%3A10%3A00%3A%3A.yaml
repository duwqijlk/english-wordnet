simpleMeaning: A buyer gets this small printed slip from a shop, much like the small pieces put on letters,
  and can swap it for goods from a set list.
scope: This small printed slip comes from a shop and can be swapped for goods from a set list.
examples:
- The shop gave a trading stamp with each purchase.
- The trading stamps were swapped for goods from the shop's list.
