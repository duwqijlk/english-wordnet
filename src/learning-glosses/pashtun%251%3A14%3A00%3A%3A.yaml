simpleMeaning: A member of a small ethnic group that speaks Pashto and lives in the north-west of Pakistan
  and the south-east of Afghanistan.
scope: Also called Pathan; a Pashto-speaking group of north-west Pakistan and south-east Afghanistan,
  set apart from the larger peoples of the region by its language and its home.
examples:
- The Pashtun elder welcomed us to the village in the hills.
- Many Pashtun families speak Pashto at home.
