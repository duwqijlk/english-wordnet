senseId: 'inexorability%1:07:00::'
synsetId: 04838668-n
simpleMeaning: No mercy is shown, and nothing will make it ease up or give in
scope: This is hard, merciless pressure that will not ease up; inexorableness and relentlessness are other
  names for this sense, and it is not a single cruel act or stubbornness about one small point.
examples:
- The inexorability of the drought drove the farmers from the land.
- Her inexorability in the talks surprised them all.
