simpleMeaning: A hellebore with finger-like leaves, a bad smell, and harmful, irritating effects if swallowed.
scope: This is a hellebore with finger-like leaves and a bad smell; setterwort and stinking hellebore
  are other names for this sense.
examples:
- The bear's foot gave off a foul smell.
- He chewed a leaf of the bear's foot and felt a sharp burn inside.
