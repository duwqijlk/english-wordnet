simpleMeaning: Under the ground creeps a green stem of a bad-smelling plant of Europe and Asia that lives
  for years.
scope: Also called dead nettle, this bad-smelling plant of Europe and Asia lives for years, with a green
  stem that creeps along under the ground, and is not the kind with a rhizome that has no smell.
examples:
- Hedge nettle spread under the ground.
- The hedge nettle gave off a foul smell.
