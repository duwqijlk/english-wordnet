simpleMeaning: a horse that shares a home for horses with another horse, or is one of several horses owned
  by the same person
scope: A horse kept with another horse, or one of several horses owned by the same person; stable companion
  is another name for this sense.
examples:
- The two stablemates stood side by side in their stalls.
- His stablemate stood in the next stall, and the same person owned both horses.
