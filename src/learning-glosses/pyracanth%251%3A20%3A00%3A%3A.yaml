simpleMeaning: With small white flowers followed by hard red or orange-red berries, this is one of many
  kinds of bush with sharp points.
scope: Also called fire thorn and firethorn, this bush stands apart from other thorny bushes by its small
  white flowers and hard red or orange-red berries.
examples:
- The pyracanth bore small white flowers, followed by hard red berries.
- We saw a pyracanth with hard red or orange-red berries.
