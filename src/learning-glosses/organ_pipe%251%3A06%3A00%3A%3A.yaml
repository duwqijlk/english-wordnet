simpleMeaning: The tubes that carry air and the controls that change the sound on a large musical instrument
scope: The air tubes and sound controls of a large musical instrument, also called pipe and pipework;
  not the keys of the instrument and not a single tube on its own.
examples:
- The organ pipes gave a low note when she pressed the key.
- He cleaned the organ pipes after the concert.
