simpleMeaning: A fault caused by a physical part of a computer going wrong.
scope: A fault that comes from a broken part of the machine, not a mistake in the program and not a wrong
  keystroke.
examples:
- A hardware error shut down the computer before the file was saved.
- The technician traced the hardware error to a failed memory chip.
