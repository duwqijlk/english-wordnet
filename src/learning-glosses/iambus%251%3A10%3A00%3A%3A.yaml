simpleMeaning: A weak beat followed by a strong beat makes one pair in verse
scope: One weak-strong beat pair in verse, also called iamb; not a whole line of verse and not a pair
  with the strong beat first.
examples:
- The word 'today' starts with an iambus, a weak beat and then a strong one.
- The poet built the line from an iambus followed by another weak-strong pair.
