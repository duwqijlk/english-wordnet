simpleMeaning: to treat something with fluoride, a chemical that helps keep teeth strong
scope: To treat something with fluoride, a chemical that helps keep teeth strong; fluoridate and fluoridize
  are other names for this sense, not cleaning with soap and not adding chlorine to water.
examples:
- The town decided to fluoridise its drinking water.
- Dentists fluoridise children's teeth to stop decay.
