simpleMeaning: Any tool for looking at the sky that gathers and records light and other rays from things
  in space
scope: Any tool for looking at the sky that gathers rays from space; not a tool for looking at small near
  things and not a pair of field glasses.
examples:
- The astronomical telescope gathered rays from a far-off star.
- An astronomical telescope records light from things in space.
