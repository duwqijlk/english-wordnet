simpleMeaning: a formal statement that a person did something wrong; the act of saying someone is to blame
  for a bad act
scope: This is a formal charge, or the act of blaming someone; not just a plain claim that someone is
  guilty of a fault.
examples:
- The accusation against the manager was read out in court.
- She made a formal accusation that he had stolen the money.
