simpleMeaning: a tree-dwelling mammal of Southeast Asia and the Philippines, active at night, lemur-like,
  gliding long distances using a skin fold from neck to tail.
scope: Another name for the colugo; this is the gliding mammal, not the East Indian flying squirrel that
  also goes by flying cat.
examples:
- We watched a flying cat glide across the clearing at dusk.
- A flying cat spread its skin folds and launched from the trunk.
