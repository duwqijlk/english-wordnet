simpleMeaning: Having no push to start new things and no brave spirit for taking a chance
scope: Said of a person with no push to start new things and no brave spirit for taking a chance; not
  a lazy person, and not a person who is afraid.
examples:
- He was a nonenterprising clerk who never tried for a better job.
- Her nonenterprising ways kept the small shop just as it was.
