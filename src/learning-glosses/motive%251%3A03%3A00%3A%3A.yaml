senseId: 'motive%1:03:00::'
synsetId: 00023953-n
simpleMeaning: something in the mind that pushes a living thing to act to get what it wants, the reason
  for the act, giving it a goal and direction
scope: 'Also called need and motivation: this is the reason in the mind that makes someone act. It is
  not a pattern of shapes or colours and not a repeated part in music.'
examples:
- His motive for lying was fear.
- Money was her main motive for taking the job.
