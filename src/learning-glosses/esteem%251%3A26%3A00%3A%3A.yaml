simpleMeaning: the high standing a person has with others, who think well of them and look up to them
scope: 'Also called respect and regard: the state of being thought highly of by others, not a feeling
  of delight and liking and not just a private opinion.'
examples:
- The old teacher was held in high esteem by the whole town.
- He earned the esteem of his neighbours through years of honest work.
