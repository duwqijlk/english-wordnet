simpleMeaning: A picture made with X-rays of a blood tube that has been filled with a dye that shows up
  on the picture
scope: A picture of a blood tube made with X-rays; not a picture of a joint and not a plain X-ray of a
  bone.
examples:
- The arteriogram showed the blood tube clearly after the dye was put in.
- Doctors ordered an arteriogram to find the block in the leg artery.
