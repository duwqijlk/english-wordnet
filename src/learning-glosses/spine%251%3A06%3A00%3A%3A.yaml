senseId: 'spine%1:06:00::'
synsetId: 04285118-n
simpleMeaning: the narrow edge of a book's cover that holds the inner ends of the pages and shows when
  the book stands on a shelf
scope: The narrow edge of a book's cover, not the row of bones in the back and not a sharp point on an
  animal or plant.
examples:
- The title and author were printed on the spine of the book.
- She ran her finger along the spine to find the book on the shelf.
