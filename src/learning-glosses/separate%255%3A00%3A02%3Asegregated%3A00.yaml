simpleMeaning: kept apart into different groups based on race, sex, social class, or religion.
scope: This is not about objects being physically apart, and not about clothing or reprinted articles;
  it describes people or institutions divided by race, sex, class, or religion.
examples:
- The law required separate schools for black and white children.
- The country maintained separate hospitals for people of different religions.
