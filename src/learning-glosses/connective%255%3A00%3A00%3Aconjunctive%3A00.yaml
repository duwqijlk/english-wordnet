simpleMeaning: joining things together, or likely to join them
scope: This describes something that joins things together; it is not the joining word itself and not
  a tool or part that joins things.
examples:
- Connective tissue holds different parts of the body together.
- Her connective remarks helped the reader move from one chapter to the next.
