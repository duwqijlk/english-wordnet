simpleMeaning: A soft stone that glows under light our eyes cannot see, and the chief source of the gas
  that takes its name from this stone.
scope: This is a soft stone that glows under light our eyes cannot see, not a hard gem or a metal ore,
  and it is also called fluorite and fluorspar.
examples:
- Fluor glows under ultraviolet light.
- Miners dug fluor from the rock.
