simpleMeaning: only in thought or in theory, not expected to give a quick or useful result in real life
scope: This sense is about an idea that stays in thought and has no quick useful result; it is not the
  narrow focus on small parts of learning, and not just about schools.
examples:
- Whether people could live on Mars is an academic question for now.
- The debate was purely academic, since there was no money to build it.
