simpleMeaning: This part of a piece of clothing runs down the arm, from the shoulder to the wrist
scope: A cover for the arm from shoulder to wrist, not a short cover that stops well above the wrist and
  not a top with no arm cover.
examples:
- She wore a long sleeve shirt in the cold.
- He rolled up his long sleeve before washing his hands.
