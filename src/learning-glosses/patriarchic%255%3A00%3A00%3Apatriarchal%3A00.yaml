simpleMeaning: Said of a society ruled by men, or where family lines run through the father
scope: Said of a society ruled by men, or where family lines run through the father, not a society ruled
  by women and not a family line run through the mother.
examples:
- In a patriarchic society, land passed from father to son.
- The patriarchic clan traced its line through the men.
