simpleMeaning: A unit of heat that warms a thousand grams of water by one degree at normal air pressure;
  food experts use it to show the fuel food gives the body.
scope: This unit of heat is also called a calorie, a kilogram calorie, a large calorie, or a nutritionist's
  calorie.
examples:
- The label lists the kilocalories in each serving of soup.
- She counts kilocalories when she plans meals that give her body fuel.
