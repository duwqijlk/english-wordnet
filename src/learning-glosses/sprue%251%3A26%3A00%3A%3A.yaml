simpleMeaning: a lasting illness that strikes people in hot regions and elsewhere, in childhood and adulthood;
  the body fails to absorb nutrients, causing wasting and smelly diarrhea.
scope: Another name for psilosis and tropical sprue, the nutrient-absorption illness; not the metal piece
  used in casting.
examples:
- Untreated sprue leaves patients weak and badly undernourished.
- She was diagnosed with sprue after months of diarrhea and weight loss.
