simpleMeaning: not able to speak because of a loss of hearing that is passed down in the family
scope: 'Also called silent and dumb: not able to speak because of hearing loss passed down in the family,
  not a device that softens a musical instrument and not the act of making a sound quieter.'
examples:
- Born to deaf parents, the mute child could not hear or speak.
- She taught mute children whose deafness had been passed down in their families.
