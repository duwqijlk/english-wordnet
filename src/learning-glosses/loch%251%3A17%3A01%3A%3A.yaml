simpleMeaning: a long, narrow arm of the sea in Scotland, most of all when it is almost shut in by land
scope: A long, narrow arm of the sea in Scotland, most of all when it is almost shut in by land; not a
  lake, and not a wide bay.
examples:
- The loch stretched for miles between the hills.
- They sailed up the loch at dawn.
