simpleMeaning: the habit of acting in a way that cannot be guessed, led more by sudden fancy than by clear
  thought
scope: 'Also called whimsy, whimsey, capriciousness, flightiness and arbitrariness: the habit of acting
  on sudden fancy rather than reason, not a steady plan and not a lack of feeling.'
examples:
- His whimsicality meant no one could guess what he would do next.
- I despair at the whimsicality of my memory, which drops one thought and picks up another.
