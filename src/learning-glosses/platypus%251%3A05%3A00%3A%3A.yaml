simpleMeaning: A small, thickly furred water animal of Australia and Tasmania that lays eggs, with a broad
  bill and tail and webbed feet, the only kind in the family called Ornithorhynchidae.
scope: Also called a duck-billed platypus, a duckbill, or a duckbilled platypus; a small furred water
  animal with a broad bill, not a duck.
examples:
- The platypus swam in the river at dusk.
- We saw a platypus with webbed feet near the bank.
