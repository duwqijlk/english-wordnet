simpleMeaning: A baby is born by a cut through the belly and womb of the mother, a way of birth once thought
  to be how Julius Caesar was born.
scope: Also called cesarean, caesarian, cesarian, abdominal delivery, caesarean delivery, caesarean section,
  caesarian delivery, caesarian section, cesarean delivery, cesarean section, and cesarian section, this
  is a birth by a cut through the belly and womb, not a birth through the birth canal.
examples:
- The doctor said a caesarean would be safest for mother and baby.
- She had a caesarean when her twins were born.
