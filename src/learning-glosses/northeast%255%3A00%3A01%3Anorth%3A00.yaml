simpleMeaning: placed in, or facing, the part of a place that lies between north and east
scope: A place or thing that lies or faces between north and east, not the direction itself and not a
  place in the northeast.
examples:
- The northeastern part of the island is the driest.
- The northeast wing of the house faces the sea.
