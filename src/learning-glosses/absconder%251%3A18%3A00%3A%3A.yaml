simpleMeaning: a person on the run who hides so the police cannot catch them or take them to court
scope: This is a person who runs away and hides from the police, not a person who has simply left home
  and not a prisoner who has escaped.
examples:
- The absconder hid in a small town for weeks to avoid arrest.
- Police found the absconder living under a false name.
