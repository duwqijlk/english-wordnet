simpleMeaning: a room where a small group of people meets to make decisions, such as the top leaders of
  a company
scope: This is the meeting room itself, not the group of leaders who meet in it and not an office for
  one person.
examples:
- The leaders met in the boardroom to talk about the plan.
- She walked into the boardroom and sat at the long table.
