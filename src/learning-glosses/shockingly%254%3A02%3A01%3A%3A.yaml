simpleMeaning: in a way that greatly upsets people's feelings
scope: In a way that upsets people's feelings; not just to a very great degree, as when pay is very low,
  which is the other sense in this batch.
examples:
- He behaved shockingly, shouting at the old man until he cried.
- She treated her friend shockingly, laughing when he fell and hurt himself.
