senseId: 'mutagenic%3:01:00::'
synsetId: 02998449-a
simpleMeaning: Able to bring about a change in the make-up of a living thing; used mostly of things outside
  the cells, like X-rays or chemical pollution.
scope: This is about things that can change the make-up of a living thing, not things that merely kill
  cells or make them sick.
examples:
- X-rays are mutagenic and can change the make-up of cells.
- Chemical pollution can be mutagenic.
