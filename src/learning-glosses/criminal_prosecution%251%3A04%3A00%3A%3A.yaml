simpleMeaning: the start and carrying on of a court case against a person said to have broken the law
scope: This is the start and carrying on of a court case against a person said to have broken the law,
  and prosecution is another name for this sense, not a civil case and not a single lawsuit that makes
  the charge.
examples:
- The criminal prosecution began after the police charged the man with theft.
- The criminal prosecution took months to reach the court.
