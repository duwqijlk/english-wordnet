simpleMeaning: A piece of electronic gear that shows changing electric amounts as pictures you can see
scope: A piece of electronic gear that shows changing electric amounts as pictures, also called a scope,
  a cathode-ray oscilloscope and an oscilloscope; not a television set and not a meter with a needle.
examples:
- The CRO showed the wave getting taller as the sound grew louder.
- She watched the CRO trace the pulse on its screen.
