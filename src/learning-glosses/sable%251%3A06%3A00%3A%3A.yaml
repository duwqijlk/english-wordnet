simpleMeaning: a scarf, or trimming, made from the soft dark fur of a small forest animal
scope: A scarf or trimming made of dark fur, not the animal itself and not a brush made of its hairs.
examples:
- She wore a sable around her shoulders against the cold.
- The sable trimming on her coat was soft and dark.
