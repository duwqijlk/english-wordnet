simpleMeaning: The common flying animal of the southern United States, with short soft fur and a tail
  that sticks out free behind it, which flies south for the winter
scope: This is the common flying animal of the southern United States with short soft fur and a tail that
  sticks out free behind it; not a fruit-eating bat and not a bat that stays north in winter.
examples:
- Guano bats gather in huge numbers in the cave.
- A guano bat flew south as the nights grew cold.
