senseId: 'rubric%1:10:02::'
synsetId: 06665359-n
simpleMeaning: A rule, given with authority, that says how a thing is to be done.
scope: A rule, given with authority, for how a thing is to be done, not a note explaining a hard word,
  not a heading for a law, and not directions for church services.
examples:
- The rubric of the club says members must pay by March.
- Under the rubric, no one may speak twice in a debate.
