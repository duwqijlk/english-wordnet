simpleMeaning: A small owl of North America with horn-like tufts of feathers, whose call sounds like a
  shaky whistle.
scope: Also called screech owl; it is a small North American owl, not a large owl, and it is known by
  its horn-like tufts and its shaky call.
examples:
- An Otus asio called with a quavering whistle at dusk.
- The Otus asio in the oak had horn-like tufts of feathers.
