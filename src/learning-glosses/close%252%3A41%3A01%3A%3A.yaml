simpleMeaning: to bring a meeting, speech or other such event to an end
scope: This is not shutting a door or lid; it is bringing an organised event such as a meeting or speech
  to its end.
examples:
- The chairman closed the meeting with a short thank-you.
- She closed her speech by quoting a poem.
