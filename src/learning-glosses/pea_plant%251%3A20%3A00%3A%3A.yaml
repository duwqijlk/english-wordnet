simpleMeaning: Long green pods holding green seeds good to eat grow on a bean-family kind of the group
  Pisum, with small white blooms.
scope: A pea is another name for this bean-family kind, which bears pods of green seeds.
examples:
- The pea plant bears long green pods.
- Small white blooms open on the pea plant.
