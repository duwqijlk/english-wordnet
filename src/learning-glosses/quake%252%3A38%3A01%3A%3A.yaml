simpleMeaning: To shake in quick, small, unsteady moves.
scope: This is shaking in quick, small moves, also called a quiver, not the shaking of the earth or the
  shaking with earth tremors.
examples:
- His hands quaked as he held the cup.
- She quaked with fear at the loud noise.
