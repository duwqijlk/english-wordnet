simpleMeaning: By eating matter built up from living things, the way animals do, it gets the food it needs
scope: This is getting food by eating matter from living things, as animals do, not making food from light
  the way green plants do.
examples:
- The holozoic animal feeds by eating matter from other living things.
- Holozoic feeding means taking in food the way animals do.
