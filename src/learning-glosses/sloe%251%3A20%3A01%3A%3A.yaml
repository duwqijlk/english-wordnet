simpleMeaning: a bush from Europe and Asia that has sharp points on its branches and fruits like plums
scope: 'Also called blackthorn: a thorny bush from Europe and Asia with fruits like plums. Not the fruit
  itself, and not the wild plum of the north-east of the United States.'
examples:
- A sloe grew by the path, its branches full of sharp thorns.
- We planted a sloe in the garden for its small dark fruits.
