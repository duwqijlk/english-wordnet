senseId: farfetched%5:00:00:unlikely:00
synsetId: 01415578-s
simpleMeaning: for a theory or explanation, full of wild ideas but not likely to be true and not easy
  to believe
scope: This is for a theory or explanation that sounds wild and hard to believe, not for an idea or story
  that is made too large or silly to be likely.
examples:
- His farfetched explanation for the missing money did not convince anyone.
- The teacher called the theory farfetched because there was no proof for it.
