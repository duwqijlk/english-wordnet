simpleMeaning: to give a sick person a heart drug in the right amount so that it helps as much as it can
  and does no harm
scope: To give a heart drug in the right dose, not to give any drug in any amount and not to give a drug
  that harms the patient.
examples:
- The doctor digitalized the patient slowly over several days.
- She was digitalized with care so the drug would help her heart without harming her.
