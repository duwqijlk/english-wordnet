simpleMeaning: A large young monocyte (a kind of white blood cell), not yet full-grown, usually found
  in the soft stuff inside bones
scope: A large young monocyte (a kind of white blood cell), not yet full-grown, usually found in the soft
  stuff inside bones; not a full-grown white blood cell and not a red blood cell.
examples:
- The monoblast was a large young white cell in the marrow.
- Monoblasts grow up into white blood cells.
