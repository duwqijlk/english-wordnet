simpleMeaning: In psychiatry, a hidden mind process that tries to ease the worry tied to natural urges
scope: In psychiatry, a hidden process that eases worry from natural urges; also called defense, defence,
  defence reaction, defense mechanism and defense reaction, not a plan made on purpose and not a cure.
examples:
- His defence mechanism kept him from facing the truth.
- She used a defence mechanism to push the worry away.
