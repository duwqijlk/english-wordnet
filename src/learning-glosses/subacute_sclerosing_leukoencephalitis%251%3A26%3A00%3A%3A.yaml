simpleMeaning: A rare, lasting brain inflammation from measles germ, worsening, hitting kids and young
  folk most, after one first measles attack before two, usually killing inside three years.
scope: Also called inclusion body encephalitis, sclerosing leukoencephalitis, subacute inclusion body
  encephalitis, and subacute sclerosing panencephalitis, this is a rare, lasting brain inflammation from
  measles germ, worsening, hitting kids and young folk most, following one first measles attack before
  the age of two, usually killing inside three years, where inclusion body encephalitis is a rare, long-lasting
  brain swelling from measles virus that slowly worsens, hitting mostly kids, then young adults, following
  a first-time measles bout before two, usually deadly in three years.
examples:
- Subacute sclerosing leukoencephalitis strikes children.
- Doctors track subacute sclerosing leukoencephalitis cases.
