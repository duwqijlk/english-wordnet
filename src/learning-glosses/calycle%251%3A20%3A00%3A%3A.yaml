synsetId: 11712577-n
simpleMeaning: A ring of small leaf-like parts that looks like the outer cup of a flower, as in a carnation
  or a hibiscus.
scope: 'Also called calyculus, epicalyx and false calyx: a leaf-like ring that looks like a flower cup,
  not the cup itself and not a petal.'
examples:
- The calycle forms a green ring below the pink petals.
- A calycle looks like a second cup under the flower.
