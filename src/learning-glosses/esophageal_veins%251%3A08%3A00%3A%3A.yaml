simpleMeaning: Blood drains from the food pipe through these small tubes into the large blood tube at
  the top of the chest or the tubes along the spine.
scope: These small blood tubes are also called oesophageal veins and venae esophageae.
examples:
- The esophageal veins drain blood from the food pipe.
- The esophageal veins carry blood away from the food pipe.
