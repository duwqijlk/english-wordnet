simpleMeaning: the trait of being a person others can trust, who answers for what they do and for how
  they act
scope: 'Also called responsibility: being a person others can trust to answer for what they do, not being
  in charge of a task and not doing what one is told.'
examples:
- Her responsibleness made her the one they trusted with the keys.
- His responsibleness showed when he said at once that the mistake was his.
