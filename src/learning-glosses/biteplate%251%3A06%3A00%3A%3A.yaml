simpleMeaning: People wear this piece on the roof of the mouth to find out what is wrong or to make it
  better, and it comes out.
scope: Also called bite plate, this piece worn on the roof of the mouth comes out, not a plate fixed in
  place.
examples:
- He wore a biteplate on the roof of his mouth.
- A biteplate can be taken out and put back in.
