simpleMeaning: The share of the blood's bulk taken up by red blood cells packed close together, worked
  out with a machine that spins blood.
scope: The share of blood taken up by packed red blood cells; haematocrit and packed cell volume are other
  names for this sense, and this is not the machine that spins the blood.
examples:
- Her hematocrit was low, so the doctor ordered more tests.
- The lab reported a hematocrit of 45 percent after spinning the blood sample.
