simpleMeaning: A small bushy oak of the northeast and centre of the United States, it drops its leaves
  yearly, bears sweet nuts to eat, and often grows in thick groups.
scope: People also call it dwarf chinquapin oak and dwarf oak; it is a small bushy oak, not a tall one,
  that drops its leaves yearly and bears sweet nuts to eat.
examples:
- The dwarf chinkapin oak bears sweet nuts to eat.
- Dwarf chinkapin oak often grows in thick groups.
