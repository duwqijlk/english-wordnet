simpleMeaning: in living things, larger stuff breaks down into smaller stuff and gives off energy
scope: In living things, larger stuff breaks down into smaller stuff and gives off energy, with catabolism,
  destructive metabolism and katabolism as other names for this sense, and not the building up of stuff.
examples:
- Dissimilation turns the food we eat into smaller stuff and sets free energy.
- When we run, dissimilation breaks down fuel in the muscles and gives off energy.
