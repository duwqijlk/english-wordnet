simpleMeaning: a warm bond of friendship, where people feel near to one another
scope: A warm bond of friendship, not a room that feels shut in and airless, and not the keeping of things
  to oneself.
examples:
- Their closeness grew over years of working side by side.
- The closeness between the two sisters showed in everything they did.
