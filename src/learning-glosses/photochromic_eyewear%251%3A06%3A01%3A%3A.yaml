simpleMeaning: lenses in frames that grow dark when the sun shines on them
scope: Lenses in frames that grow dark when the sun shines on them; photochromic eyeglasses and photochromic
  glasses are other names for this sense, not plain dark glasses and not lenses that only shield the eyes
  from glare.
examples:
- His photochromic eyewear darkened in the bright sunlight.
- Photochromic eyewear suits drivers who move between shade and sun.
