simpleMeaning: Having feeling and a mind that is aware, but without clear, set thoughts.
scope: Having feeling and a mind that is aware, but without clear, set thoughts, not a noun that names
  a living thing and not having animal life as against plant life.
examples:
- In the story, the animate stones seemed to feel and dream.
- The poet called the hills animate, as if they could feel.
