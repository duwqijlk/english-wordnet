senseId: 'industrialize%2:30:01::'
synsetId: 00578056-v
simpleMeaning: to change the making of something so that it is done in factories as a regular, organized
  business activity
scope: To change the making of one thing so that it is done in factories as a regular business activity;
  not the wider change when a country or place becomes home to many factories.
examples:
- China industrialized the making of cloth, building large factories for it.
- The company industrialized the making of soap, moving it from small workshops to large factories.
