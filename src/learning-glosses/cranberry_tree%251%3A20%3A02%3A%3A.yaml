simpleMeaning: Losing its leaves each year, a shrub of the Old World that forms thickets, bearing bunches
  of white flowers and small bright red berries.
scope: Also called crampbark and guelder rose; it is the Old World shrub with white flowers and red berries,
  not the North American shrub of the same name.
examples:
- The cranberry tree forms thickets in the Old World.
- The cranberry tree bears bunches of white flowers.
