simpleMeaning: Marked by close heat and damp.
scope: This sense is also called stifling, sultry, and sulfurous, for being marked by close heat and damp,
  unlike the sense for being of sulfur, to do with sulfur, holding sulfur, or come from sulfur, and unlike
  the sense for being harsh or biting in tone.
examples:
- The air was sulphurous, marked by close heat.
- The day was sulphurous, marked by close heat and damp.
