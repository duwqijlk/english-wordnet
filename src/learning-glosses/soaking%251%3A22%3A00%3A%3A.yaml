simpleMeaning: the way a thing becomes soft and full of water after being left in water or some other
  liquid
scope: Also called a soak. This is a thing becoming soft and full of water after being left in liquid,
  not the washing of something in that way.
examples:
- A long soaking in warm water made the beans soft.
- After a good soaking, the dry cloth became soft and heavy with water.
