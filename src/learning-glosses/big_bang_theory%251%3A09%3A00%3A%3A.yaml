simpleMeaning: In cosmology, the thought that a small bit of matter, packed tight and very hot, burst
  apart 10 to 20 billion years ago and so began the universe.
scope: Also called big-bang theory, this is the thought in cosmology that the universe began when a small
  bit of matter burst apart 10 to 20 billion years ago.
examples:
- The big bang theory says a small bit of matter burst apart long ago.
- Under the big bang theory, the universe began 10 to 20 billion years ago.
