simpleMeaning: A fairly large animal that lives in trees, common in the east of North America, that people
  have now brought to England too
scope: 'Also called cat squirrel and eastern grey squirrel: a fairly large animal that lives in trees,
  common in the east of North America and now brought to England too, not a small ground animal and not
  a red squirrel.'
examples:
- The eastern gray squirrel is common in the parks of the eastern states.
- Eastern gray squirrels were brought to England and now live there too.
