simpleMeaning: In law, a person or group that has made an agreement with another side
scope: In law, one side in an agreement; not a builder paid to build things and not a bridge player.
examples:
- Both contractors signed the agreement in front of a lawyer.
- The contractor must keep every term of the deal.
