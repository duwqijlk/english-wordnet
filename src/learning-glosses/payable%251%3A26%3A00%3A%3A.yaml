simpleMeaning: A business record that shows what is owed for goods bought and work done on credit
scope: 'Also called account payable: a business record of what is owed for goods and work bought on credit,
  not a record of what others owe the business and not cash in hand.'
examples:
- The problem was to match receivables and payables in the same currency.
- The payables showed how much the shop owed its suppliers.
