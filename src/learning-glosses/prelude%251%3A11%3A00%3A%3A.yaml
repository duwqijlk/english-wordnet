simpleMeaning: something that happens first and leads into what comes after it
scope: 'Also called preliminary, and another name for this sense is overture: a thing that comes first
  and leads into what follows, not a piece of music at the start of a work, and not playing or opening
  something.'
examples:
- The small fight was a prelude to a long war.
- A short talk served as a prelude to the main meeting.
