simpleMeaning: a ship that carries the leader of a group of war ships and flies that leader's flag
scope: This is the ship for the leader of a group of war ships, flying that leader's flag; not any large
  or leading ship in a group.
examples:
- The fleet's commander stood on the flagship as its flag flew above him.
- Each flagship carries its fleet commander and flies his flag.
