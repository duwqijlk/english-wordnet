simpleMeaning: With no depth and no wide reach, it has to do with only a single side of a thing.
scope: With no depth and no wide reach, it has to do with only a single side of a thing, also called unidimensional;
  not a thing with many sides and not a flat drawing.
examples:
- The one-dimensional figure in the book seemed flat.
- Her one-dimensional view of the problem missed the rest.
