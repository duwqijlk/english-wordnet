simpleMeaning: the part of a cow, sheep, or goat that makes milk and holds it for the young to drink
scope: 'Also called bag: the milk-making part under a cow, sheep, or goat, not a breast on a person.'
examples:
- The farmer washed the cow's udder before milking her.
- The lamb pushed against its mother's udder to drink.
