simpleMeaning: A fungus with gills, its cap and stalk clearly covered with upright scales; its gills turn
  greenish as it gets older.
scope: Also called scaly pholiota; a gilled fungus whose cap and stalk are covered with upright scales
  and whose gills turn greenish with age, one of the scaly-capped kinds.
examples:
- Pholiota squarrosa grew on the old stump, its cap rough with scales.
- The gills of Pholiota squarrosa had turned greenish with age.
