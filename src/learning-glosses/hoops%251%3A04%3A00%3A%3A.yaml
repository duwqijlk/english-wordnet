simpleMeaning: a court game for two teams of five, in which points come from throwing a ball through a
  high flat ring
scope: A court game for two teams of five, also called basketball, not a game of throwing rings onto pegs
  and not a single high ring by itself.
examples:
- The boys played hoops after school.
- She was good at hoops and scored often.
