scope: A very strong drink made from grain, brewed in the autumn and kept for the spring; bock is another
  name for this sense, not a light summer beer and not a dark stout.
examples:
- He ordered a bock beer with his meal.
- This bock beer was brewed last autumn and kept through the winter.
