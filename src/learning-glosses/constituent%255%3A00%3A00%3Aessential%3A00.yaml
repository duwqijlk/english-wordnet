simpleMeaning: forming a basic part of how a thing is built, above all of how a body is made
scope: Forming a basic part of a thing's build, above all a body's; not a part that can be taken off,
  and not a member of a voting area, which are other senses of constituent.
examples:
- Iron is a constituent part of blood.
- Calcium is a constituent part of bones and teeth.
