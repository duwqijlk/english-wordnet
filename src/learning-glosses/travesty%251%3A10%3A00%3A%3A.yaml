senseId: 'travesty%1:10:00::'
synsetId: 07029364-n
simpleMeaning: a funny play that makes fun of people and things in a strong, wild way, with events that
  could not really happen
scope: 'Also called farce and farce comedy: this is a funny stage play, not a written piece that copies
  a person''s style in a funny way. It is also not the act of making something into a bad copy.'
examples:
- The play was a travesty, with wild jokes and events that could never happen.
- The theatre put on a travesty that made fun of the king in a wild way.
