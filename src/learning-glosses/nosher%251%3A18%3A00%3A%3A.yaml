simpleMeaning: A person who eats only a little at a time, or eats small bits of food between meals
scope: A person who eats only a little at a time or eats small bits of food between meals, with snacker
  as another name for this sense; not a person who eats big meals, and not a cook.
examples:
- She is a nosher who picks at food all day.
- A nosher keeps a bag of nuts by his desk.
