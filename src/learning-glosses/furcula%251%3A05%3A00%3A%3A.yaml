simpleMeaning: A forked bone in most birds, made when the two collar bones join into one.
scope: This is a forked bone in most birds made from two joined collar bones; not a rib, and not the flat
  breastbone.
examples:
- The furcula helps the bird's wings move when it flies.
- We found the furcula, the forked bone, in the cooked chicken.
