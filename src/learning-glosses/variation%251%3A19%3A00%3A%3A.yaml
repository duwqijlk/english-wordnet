simpleMeaning: In astronomy, a change in the way a planet or a satellite moves round its path, most of
  all a change in the moon's path
scope: In astronomy, a change in a planet's or a satellite's path, not a change in living things and not
  a change in music.
examples:
- The variation in the moon's orbit puzzled the astronomers.
- They tracked the variation of the satellite as it circled the earth.
