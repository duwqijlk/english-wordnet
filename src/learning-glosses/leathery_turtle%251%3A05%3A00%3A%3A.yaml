simpleMeaning: A sea turtle found over wide seas, the biggest alive, with a shell of tough skin that bends.
scope: Also called the leatherback and the leatherback turtle, this biggest of living turtles is found
  over wide seas, with a shell of tough skin that bends.
examples:
- A leathery turtle crossed the open sea.
- The leathery turtle's shell bent as it swam.
