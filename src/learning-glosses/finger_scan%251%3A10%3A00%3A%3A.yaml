simpleMeaning: Let a machine read the fine lines on the skin at the tips of the hands, and it will tell
  you who the person is.
scope: Also called finger scanning, this names the check in which a machine reads the fine lines on the
  skin at the tips of the hands to tell who a person is.
examples:
- The door opened only after a finger scan showed who she was.
- A finger scan at the gate told them who he was.
