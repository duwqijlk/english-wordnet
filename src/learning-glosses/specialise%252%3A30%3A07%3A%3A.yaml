senseId: 'specialise%2:30:07::'
synsetId: 00119074-v
simpleMeaning: When a living thing slowly takes on a new form that fits where it lives, so that in time
  it becomes a new kind.
scope: Also called specialize, this is about a living thing changing into a new kind over time, not about
  giving your time to one kind of work, and not about fitting a thing to a set purpose or saying exactly
  what you mean.
examples:
- Over many ages the fish specialised to live in dark caves.
- The plant specialised until it could live on dry rock.
