senseId: 'guerrilla%1:18:00::'
synsetId: 10170076-n
simpleMeaning: a person in a fighting group that is not a regular army, who fights a stronger force by
  damaging things it needs and by repeated small attacks
scope: Also called irregular, insurgent, and guerilla. This is a fighter in a group that is not a regular
  army, not a soldier in a regular army.
examples:
- The guerrilla hid in the hills and attacked the army's supply trucks.
- A small band of guerrillas kept fighting the much larger force.
