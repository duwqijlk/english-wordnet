simpleMeaning: a part fixed to a pipe or barrel and used to let water out
scope: A part for letting water out of a pipe or barrel, not a metal plate on a shoe, not a tool for cutting
  grooves in a hole, and not a plug for a barrel hole.
examples:
- Turn the tap on and fill the kettle with cold water.
- The tap in the kitchen drips all night if you do not close it tight.
