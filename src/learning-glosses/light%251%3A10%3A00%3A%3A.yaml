simpleMeaning: A signal you can see, made by something that shines, that warns people of danger or trouble.
scope: This is not the lamp or other device that produces the brightness, nor the general brightness of
  a place; it is the warning signal itself.
examples:
- The beacon's light warned ships away from the rocks.
- A flashing light on the dashboard warned the driver that the engine was overheating.
