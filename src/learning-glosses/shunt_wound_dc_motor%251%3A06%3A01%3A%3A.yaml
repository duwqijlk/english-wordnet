simpleMeaning: A direct-current machine whose turning part and field coils join in parallel to one power
  source, for industrial changing-speed work, as in machine tools, winding and unwinding machines and
  tensioners.
scope: Also called shunt DC motor; a motor whose turning part and field coils join side by side to one
  power source, not a motor whose parts join one after another and not a motor run on alternating current.
examples:
- A shunt wound DC motor has good speed regulation even as the load varies.
- They fitted a shunt wound DC motor to the machine tool.
