simpleMeaning: A path for electric current that is not joined up, so no current flows through it
scope: A path for electric current that is not joined up, so no current flows; not a complete path where
  current flows and not a short path that lets too much current through.
examples:
- The broken wire left an open circuit, so the lamp stayed dark.
- An open circuit means no current can flow.
