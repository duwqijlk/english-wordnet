simpleMeaning: Getting better when the signs of a sharp short illness slowly fade away.
scope: Getting better when the signs of a sharp short illness slowly fade away; not a sudden break in
  a fever and not a slow illness that never clears.
examples:
- After days of high fever, lysis began and she grew stronger.
- The doctor watched for lysis as the fever fell bit by bit.
