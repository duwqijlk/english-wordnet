simpleMeaning: a raised part on a bone, often where a muscle or a band joins the bone
scope: A raised part on a bone, often where a muscle or band joins it; eminence and tuberosity are other
  names for this sense. Not a break in a bone and not a hole in a bone.
examples:
- The tubercle on the arm bone gives the muscle a place to join.
- A tubercle near the knee helps hold a band of tissue in place.
