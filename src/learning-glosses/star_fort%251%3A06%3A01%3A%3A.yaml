simpleMeaning: Three-sided points that stick out and guard one another ring this walled place, five to
  eight in most cases, first built in Italy in the middle of the 1400s.
scope: Another name for bastion fort, star-shaped fortress, star fortress, and trace italienne, this walled
  place is ringed with points that guard one another, not a plain wall.
examples:
- Star forts were used in the defensive works of Florence.
- We walked around the star fort and counted its points.
