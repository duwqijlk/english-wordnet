synsetId: 01880900-v
simpleMeaning: to move from side to side or up and down, in a way like waves
scope: This sense is about moving up and down or from side to side; it is not about a sound that is not
  steady, and not about stopping because you are not sure.
examples:
- The line on the screen wavered up and down.
- The tall grass wavered in the wind.
