simpleMeaning: The change of shape that turns a young insect into an adult goes only part of the way in
  this kind of growth
scope: A young insect's change of shape that goes only part of the way, also called hemimetabolism and
  hemimetamorphosis, not a full change and not a change in other animals.
examples:
- Hemimetaboly means the nymphs change shape only a little at a time.
- The young insect grows by hemimetaboly, changing shape bit by bit.
