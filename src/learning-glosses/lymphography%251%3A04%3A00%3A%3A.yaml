simpleMeaning: An X-ray examination of the lymph nodes and lymph vessels after a special injected liquid
  that X-rays cannot pass through; it produces a lymphangiogram, an image of these vessels.
scope: Another name for lymphangiography; an X-ray study of lymph nodes and vessels, not a blood test
  or a biopsy.
examples:
- The doctor ordered lymphography to look at the lymph nodes and lymph vessels.
- Lymphography uses an injected contrast agent so the vessels show up on X-ray film.
