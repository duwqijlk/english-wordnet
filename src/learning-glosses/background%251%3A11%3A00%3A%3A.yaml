synsetId: 07445080-n
simpleMeaning: Interference picked up alongside a reading or observation, easily mistaken for the real
  thing you are trying to detect.
scope: Unwanted interference in a reading or observation, not the desktop area behind icons and not a
  minor event happening alongside.
examples:
- The receiver picked up background from a nearby radio tower, drowning out the faint signal.
- They had to filter out the background before the measurement meant anything.
