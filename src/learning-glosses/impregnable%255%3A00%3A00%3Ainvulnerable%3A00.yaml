simpleMeaning: safe from attack, and no one can change or harm it in any way
scope: Also called strong, secure, unassailable and inviolable, this means safe from attack and safe from
  being changed. It is not the sense of a view that cannot be beaten or shown to be wrong.
examples:
- The castle stood on a high hill and was impregnable.
- They built an impregnable safe that no thief could open.
