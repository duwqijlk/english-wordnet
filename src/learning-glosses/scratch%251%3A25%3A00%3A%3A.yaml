senseId: 'scratch%1:25:00::'
synsetId: 13927849-n
simpleMeaning: A hollow made by cutting or digging into a surface.
scope: A hollow cut into a surface — another name for a dent, prick, slit or incision — not a skin injury,
  a mere mark of damage or the rough sound of scraping.
examples:
- The old desk had a deep scratch where a knife had dug in.
- The chisel left a narrow scratch in the soft stone.
