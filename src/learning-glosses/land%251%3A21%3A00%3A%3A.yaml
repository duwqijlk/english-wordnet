simpleMeaning: a large area of ground owned by someone, often in the countryside, kept by the owner for
  their own use
scope: Not a country or nation, and not the solid part of the earth's surface.
examples:
- The family has held this land for five generations.
- The duke's land stretches from the river all the way to the hills.
