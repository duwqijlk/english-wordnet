simpleMeaning: having the sound of a reed instrument (a music tool with a thin piece that shakes as air
  passes)
scope: 'Also called wheezy: this is about a sound, not about being tall, thin and straight like a plant
  stem.'
examples:
- The old clarinet had a thin, reedy sound.
- Her reedy voice sounded thin over the phone.
