senseId: 'desynchronization%1:24:00::'
synsetId: 13868035-n
simpleMeaning: when things take place with no tie between their times
scope: This is when things take place with no tie between their times; asynchronism, asynchrony, desynchronisation
  and desynchronizing are other names for this sense, not things that take place together and not things
  that take place in a fixed order.
examples:
- The desynchronization between the two clocks grew worse each week.
- After the power cut, there was a desynchronization of the station clocks.
