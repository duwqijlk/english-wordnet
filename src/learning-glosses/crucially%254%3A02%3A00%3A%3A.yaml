senseId: 'crucially%4:02:00::'
synsetId: 00294248-r
simpleMeaning: to a degree that shows something is very important
scope: It shows that something matters to a very great degree, as in very important; it does not mean
  in a way that judges badly or in a way that is in danger.
examples:
- The new law is crucially important for poor families.
- Crucially, the bridge must be finished before winter.
