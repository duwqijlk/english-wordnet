simpleMeaning: In Judaism, a holy place that could be carried, in which the Jews carried the Ark of the
  Covenant on their way out of Egypt.
scope: In Judaism, the holy place of the Ark, not a church building and not the Ark itself.
examples:
- The Tabernacle stood at the camp's heart.
- Priests carried the Tabernacle on poles.
