simpleMeaning: To do with the way a thing moves round and round in a system.
scope: To do with the way a thing moves round and round in a system, not the use for the system that moves
  blood round the body, or the movement of the blood.
examples:
- The flow was circulatory, moving round the room again and again.
- The system was circulatory, carrying warmth to every part.
