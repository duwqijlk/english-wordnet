simpleMeaning: A herb with leaves at the base and leafy hairy stems, each bearing a single flower head
  with white or pale cream rays; from the northwest of the United States.
scope: A herb of the northwest, also called white-rayed mule's ears; not other mule's ears kinds and not
  other white-rayed herbs.
examples:
- Wyethia helianthoides blooms in the northwest meadows.
- The white rays of Wyethia helianthoides open in late spring.
