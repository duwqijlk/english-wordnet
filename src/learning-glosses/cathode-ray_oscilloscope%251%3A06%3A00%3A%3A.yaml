simpleMeaning: A piece of electronic equipment that shows changing amounts of electricity as pictures
  on a screen.
scope: A screen that shows changing electric amounts as pictures, not a radio and not a television; scope
  and oscilloscope are other names for this sense.
examples:
- The engineer watched the cathode-ray oscilloscope to check the shape of the signal.
- A cathode-ray oscilloscope showed the voltage rising and falling.
