simpleMeaning: 'used of a plant: having tall, thin stems that look weak'
scope: This sense is only about plants with tall, thin, weak stems. It is not the sense about a person
  or an animal with long legs.
examples:
- The tomato plants grew leggy in the dark room, with tall thin stems.
- She moved the leggy seedlings into the sun so their stems would grow stronger.
