simpleMeaning: To cover bare ground, people grow this plant that creeps slowly along it, its leaves staying
  green through part of the winter on stiff thin upright stems.
scope: This low plant that spreads along the ground to cover bare ground is also called barrenwort.
examples:
- The bishop's hat spread across the bare ground.
- The bishop's hat kept some green leaves through the winter.
