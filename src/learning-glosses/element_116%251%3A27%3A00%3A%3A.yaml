simpleMeaning: A kind of matter heavier than uranium, that gives off rays and is listed as number one
  hundred and sixteen
scope: This is one of the kinds of matter past uranium, listed as number one hundred and sixteen; atomic
  number 116, ununhexium and Uuh are other names for this sense, and its nearest rivals are element 115
  and the other kinds in the set.
examples:
- Element 116 was made in a laboratory.
- Scientists study element 116 and its rays.
