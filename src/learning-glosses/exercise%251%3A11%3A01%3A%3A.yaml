simpleMeaning: 'Usually plural: an event with marching groups and set speeches, held to mark an occasion.'
scope: This is a public ceremony with marching and speeches, not physical activity to keep fit, not a
  practice task, and not a military drill.
examples:
- The graduation exercises included a procession through the hall and several speeches.
- Guests gathered for the commencement exercises in the university quad.
