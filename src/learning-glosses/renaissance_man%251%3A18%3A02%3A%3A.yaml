simpleMeaning: A scholar of today who can learn more than a little about a wide range of different things.
scope: 'Also called a generalist: a scholar of today who can learn more than a little about many different
  things, not a scholar of the time of the Renaissance who could know almost everything about many topics.'
examples:
- The new professor is a Renaissance man with wide interests in science and art.
- A Renaissance man of today can learn more than a little about many different things.
