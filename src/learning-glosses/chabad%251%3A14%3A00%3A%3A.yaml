simpleMeaning: A large Hasidic Jewish movement that sends out workers to share its faith, known for warm
  welcomes, skill with new tools, hope, and stress on learning holy books.
scope: A movement of Jews that works in many places, not the form of Hasidism kept by Lithuanian and Russian
  Jews under communist rule; also called Chabad-Lubavitch, Lubavitch and Lubavitch movement.
examples:
- Chabad workers welcomed us with hot food and a warm room.
- The Chabad centre in town stays open late for study.
