senseId: 'mercury_fulminate%1:27:00::'
synsetId: 14822985-n
simpleMeaning: a chemical that, when dry, blows up with great force if hit or heated, used to set off
  explosives and to start the charge in guns
scope: A chemical that blows up when dry and is hit or heated, also called fulminate of mercury and fulminating
  mercury; not gunpowder and not a bomb itself.
examples:
- Mercury fulminate must be kept damp, since the dry chemical can blow up if struck.
- The cap held a pinch of mercury fulminate to set off the charge.
