simpleMeaning: When a job, use, or event is coming, this means getting people or things ready for it in
  advance, so they are fit for it
scope: To get people or things set and fit ahead of time, also called fix, prepare, ready, or set, not
  to start the job itself and not to put on special clothes.
examples:
- We need to gear up for the long trip ahead.
- The team geared up for the big game.
