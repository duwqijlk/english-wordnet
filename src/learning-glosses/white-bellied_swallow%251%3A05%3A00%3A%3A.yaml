simpleMeaning: a North American bird with a blue-green back and a pale front, that makes its nest in holes
  in trees
scope: 'Also called a tree swallow: a North American bird with a blue-green back and a pale front that
  nests in holes in trees, not a barn swallow and not a cliff swallow.'
examples:
- A white-bellied swallow darted out of a hole in the old oak.
- We watched a white-bellied swallow feed its young in the tree cavity.
