simpleMeaning: To explain or excuse something in a way that hides the truth.
scope: Giving a misleading explanation or excuse for something only; not affecting someone's feelings
  or judgment, not biasing or slanting something, not adding hue, not decorating with hues, not turning
  a different shade, not a thing's visible appearance as judged by hue, lightness and saturation, not
  the physical light attribute behind it, not vividness or interest, not a musical sound's quality, not
  the noun naming a misleading outward show or form, not a pigment or dye, not the physics property that
  quarks carry, and not the adjective meaning able to produce hues.
examples:
- He colored the facts to make his own role look smaller.
- The official history colors the defeat as a strategic withdrawal.
