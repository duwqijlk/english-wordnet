simpleMeaning: a plant disease whose signs show near the end of the growing season, above all a disease
  of plants of the potato family caused by the fungus Phytophthora infestans
scope: A plant disease whose signs show late in the season, not early blight and not damage from dry weather
  or insects.
examples:
- Late blight struck the potato plants just before harvest.
- The farmer lost half the crop to late blight that year.
