simpleMeaning: a person who loves one thing so much that their love for it is like a strong need they
  cannot stop
scope: 'Also called freak, nut, addict and junky: a person whose love for one thing is like a strong need,
  not a person who uses harmful drugs.'
examples:
- She is a news junkie and checks the news all through the day.
- He is a golf junkie who plays every weekend.
