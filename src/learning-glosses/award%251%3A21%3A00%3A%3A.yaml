simpleMeaning: Something given to the winner of a contest or competition, or to someone who wins a lottery.
scope: This is not the object that serves as a sign of honour; it is the thing handed over for winning.
examples:
- The award for first place was five hundred pounds.
- She gave her award money to the school.
