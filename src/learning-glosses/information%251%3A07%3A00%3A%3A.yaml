simpleMeaning: in communication theory, a number that measures how uncertain an outcome is
scope: This is the technical measure of uncertainty, not a message that is received and understood, not
  knowledge gained through study or experience, not a formal accusation of a crime, and not a collection
  of facts from which conclusions are drawn.
examples:
- The signal contained thousands of bits of information.
- Engineers measure information in bits, not in words.
