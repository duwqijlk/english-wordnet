simpleMeaning: To act as if you are someone else, when you are not that person, at times to cheat people
scope: This is claiming to be someone else, not acting in a false way to win praise and not holding still
  for a photo.
examples:
- He posed as a doctor to get work at the clinic.
- They found that he had posed as a rich buyer to cheat the sellers.
