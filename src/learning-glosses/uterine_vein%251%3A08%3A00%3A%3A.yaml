simpleMeaning: One of a pair of blood tubes on each side runs from a net of tubes in the womb into a large
  blood tube deep inside the hip.
scope: It is one of a pair of blood tubes on each side that carries blood away from the womb to a large
  blood tube deep inside the hip.
examples:
- The uterine vein on each side runs from the womb to a large blood tube in the hip.
- Blood leaves the womb through the uterine vein.
