simpleMeaning: showing signs of growth in knowing right from wrong and in learning and thought
scope: This sense is about growth in knowing right from wrong and in learning, not about being kind to
  people who suffer, and not about the study of history, language and the arts.
examples:
- The city's new schools and libraries were taken as proof of its humane progress.
- In his book, a humane culture is one that grows in learning and in respect for reason.
