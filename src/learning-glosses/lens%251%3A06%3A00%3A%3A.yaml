simpleMeaning: a clear device used to make light passing through it bend together or spread out, and to
  make images
scope: 'Also called lense: this is a clear device for bending light to make images. Not the clear part
  inside the eye and not equipment that focuses a beam of electrons.'
examples:
- The camera lens made the picture sharp and clear.
- He cleaned the lens of his glasses with a soft cloth.
