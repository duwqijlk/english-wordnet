senseId: 'evasively%4:02:00::'
synsetId: 00332382-r
simpleMeaning: in a way that tries not to give a clear answer or to deal with something directly
scope: This sense is about speaking or acting in a way that avoids dealing with something directly; it
  is not about speaking or acting in a direct, open way.
examples:
- When asked where the money was, he answered evasively.
- She spoke evasively and would not say who had taken the keys.
