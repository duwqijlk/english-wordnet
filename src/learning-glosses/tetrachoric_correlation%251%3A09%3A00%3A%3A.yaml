senseId: 'tetrachoric_correlation%1:09:00::'
synsetId: 06045448-n
simpleMeaning: Two things, each split into two kinds and spread in a bell shape, move together in a way
  a number can show.
scope: People also call it a tetrachoric correlation coefficient, and it is a number that shows how two
  things spread in a bell shape and split into two kinds move together.
examples:
- The tetrachoric correlation between the two test scores was high.
- They worked out a tetrachoric correlation for the two yes-or-no answers.
