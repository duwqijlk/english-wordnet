simpleMeaning: People who shoot wild animals go on a long trip across land for it, most often in Africa
scope: A long overland trip made by hunters, also called campaign and safari; not a short walk in the
  woods and not a trip made for sight-seeing.
examples:
- They set off on a hunting expedition across the grasslands.
- His hunting expedition in Africa lasted six weeks.
