simpleMeaning: the activity of making music with an instrument.
scope: This is not playing a game or a sport, and not singing; it is about performing on a musical instrument.
examples:
- The audience clapped loudly at the end of her piano playing.
- His playing has become much more confident since he joined the orchestra.
