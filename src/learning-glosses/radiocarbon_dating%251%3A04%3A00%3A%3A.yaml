simpleMeaning: A lab check that works out the age of once-living things from how much carbon 14 they hold,
  trusted for up to 40,000 years
scope: A lab check that works out the age of once-living things; also called carbon-14 dating and carbon
  dating, not a check that works on stone.
examples:
- Radiocarbon dating showed the cloth was 2,000 years old.
- They used radiocarbon dating on the old boat.
