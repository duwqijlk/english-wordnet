simpleMeaning: The doctor a person sees first for most health needs
scope: The doctor a person sees first for most health needs; not a doctor who treats one part of the body
  only and not a doctor in a hospital ward.
examples:
- Her primary care physician sent her to a heart doctor.
- Ask your primary care physician first if you feel unwell.
