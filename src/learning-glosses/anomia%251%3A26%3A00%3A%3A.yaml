simpleMeaning: Not being able to name things, or to know the written or spoken names of things
scope: Not being able to name things, or to know their written or spoken names; amnesic aphasia, amnestic
  aphasia, anomic aphasia and nominal aphasia are other names for this sense, not forgetting what things
  are for and not being unable to speak at all.
examples:
- Anomia made it hard for her to name everyday things.
- After the stroke, anomia left him reaching for words.
