simpleMeaning: a colour-changing dye that tells whether a liquid is an acid or a base, useful when the
  pH, how acid it is, is between 3.0 and 4.6
scope: 'Also called bromophenol blue: a dye that tells whether a liquid is an acid or a base, not the
  bromothymol blue dye and not a dye for cloth.'
examples:
- A few drops of bromphenol blue went into the test tube.
- Bromphenol blue showed the liquid was still acid.
