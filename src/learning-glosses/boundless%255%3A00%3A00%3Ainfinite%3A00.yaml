simpleMeaning: seeming to have no end or limit in amount, number, degree, or especially in size
scope: 'Also called limitless and unbounded: seeming to have no end, not a small amount or a thing with
  a clear limit.'
examples:
- The children seemed to have boundless energy all day long.
- She showed boundless kindness to everyone she met.
