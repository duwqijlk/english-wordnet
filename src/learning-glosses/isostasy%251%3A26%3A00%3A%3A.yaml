simpleMeaning: In geology, the way the pushes that lift the earth's crust and the pushes that sink it
  hold each other even.
scope: In geology, it names the state in which the pushes that lift the crust and the pushes that sink
  it hold each other even, and not one push acting on its own.
examples:
- Isostasy keeps the land from sinking too far or rising too high.
- The isostasy of the region holds the land steady as the crust moves.
