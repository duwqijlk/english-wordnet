senseId: 'moratorium%1:28:00::'
synsetId: 15300452-n
simpleMeaning: A delay allowed by law before a debt or duty must be paid or done.
scope: A delay allowed by law before a debt or duty must be met, not a simple informal wait and not a
  full pardon of the debt.
examples:
- The bank granted a moratorium on the loan.
- A moratorium gave the firm six months before it had to pay.
