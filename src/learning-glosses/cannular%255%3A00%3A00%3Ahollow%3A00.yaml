simpleMeaning: made up of a tube, or having hollow tubes through which liquid or gas can pass
scope: Made up of a tube, or having hollow tubes through which liquid or gas can pass; tubular, tubelike,
  tube-shaped and vasiform are other names for this sense, not solid and not merely round.
examples:
- The cannular stem carried water up the plant.
- The engineer chose a cannular pipe for the drain.
