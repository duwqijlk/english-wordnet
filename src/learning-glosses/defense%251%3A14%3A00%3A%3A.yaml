simpleMeaning: the accused person plus the lawyers speaking for them, treated as one side in a case
scope: The accused and their lawyers as one side; not a single court reply, a spoken rebuttal of an accusation,
  a hidden mental reaction, a justification, a sports team, military action, a defender group, a barrier,
  or protection from harm.
examples:
- The defense called its first witness.
- The defense asked the judge to dismiss the case.
