simpleMeaning: a single piece of glass that helps one eye that does not see well, held in place by the
  muscles of the face
scope: Also called eyeglass. This is for one eye only and is held by the face, not glasses for both eyes
  and not a small glass put on the eye itself.
examples:
- He wore a monocle over his right eye.
- The old man lifted his monocle to read the letter.
