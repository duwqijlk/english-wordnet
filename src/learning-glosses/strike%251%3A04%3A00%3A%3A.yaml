simpleMeaning: A time when workers stop working together to protest low pay or bad working conditions.
scope: A work stoppage — another name for this sense — not a military attack or a baseball pitch.
examples:
- The strike lasted more than a month before it was settled.
- Workers at the plant went on strike over unsafe conditions.
