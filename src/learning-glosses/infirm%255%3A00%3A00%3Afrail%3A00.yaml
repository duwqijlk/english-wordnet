simpleMeaning: having little strength in the body and muscles and little energy
scope: Also called weak, weakly, feeble, rickety and decrepit. This is about a weak body, not about a
  mind that is unsure or a choice that is not firm.
examples:
- After the long illness, he was too infirm to walk far.
- The infirm old man needed help to climb the stairs.
