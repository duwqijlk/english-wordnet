simpleMeaning: A small holder with a curved edge fits round the ball in its socket and holds a wash with
  medicine, or one that cleans, for washing the ball.
scope: Also called an eye cup and an eyecup, this is the small holder with a curved edge that one fills
  with a wash holding medicine, or one that cleans, to put on the ball in its socket.
examples:
- She used an eyebath to wash her eye with the medicated wash.
- He filled an eyebath with a cleansing wash and held it to his eye.
