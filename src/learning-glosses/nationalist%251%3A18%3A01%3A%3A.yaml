simpleMeaning: a person who supports a country's freedom to govern itself or a strong government for their
  own nation
scope: A person who backs their country's freedom to rule itself or a strong government for it; not a
  person who merely loves their country's ways, which is the adjective sense of nationalist.
examples:
- The nationalist spoke for freedom from foreign rule.
- Nationalists won seats in the new parliament.
