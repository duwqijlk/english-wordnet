simpleMeaning: In the Christian faith, the home of Satan and the powers of evil, where bad souls are made
  to suffer for ever.
scope: Also called the pit, the infernal region, the nether region, perdition and Hell; not a hot place
  on earth.
examples:
- The sinner feared the fires of the Inferno.
- In the old tale, the Inferno was a pit of fire.
