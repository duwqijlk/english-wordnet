simpleMeaning: Given picked values of x and seen values of y, the most likely value of y for any value
  of x can be guessed from their link.
scope: This is also called regression, regression toward the mean, and simple regression, a link between
  picked values of x and seen values of y that gives the most likely value of y for any value of x.
examples:
- He used statistical regression to guess the value of y.
- Statistical regression links picked values of x with seen values of y.
