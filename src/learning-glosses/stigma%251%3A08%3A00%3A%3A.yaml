simpleMeaning: a breathing hole on the outside of a land animal with jointed legs, such as an insect
scope: A breathing hole on the outside of a land animal with jointed legs; not the part of a flower that
  takes in pollen, and not a mark of shame.
examples:
- Air enters the beetle's body through a stigma in its side.
- The insect takes in air through the stigmas along its body.
