senseId: 'sleeper%1:18:02::'
synsetId: 10630366-n
simpleMeaning: A spy, saboteur, or terrorist placed in a foe's land, living as a law-abiding citizen until
  a set signal calls them to act
scope: A hidden agent planted in an enemy country, living as a law-abiding citizen until a set signal
  calls them to act, not a person asleep, not a fish, not a train car, and not a rail beam.
examples:
- The sleeper lived quietly in the town for years.
- A sleeper waits for the signal before he acts.
