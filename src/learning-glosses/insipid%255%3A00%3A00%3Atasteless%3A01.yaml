senseId: insipid%5:00:00:tasteless:01
synsetId: 02408319-s
simpleMeaning: having little or no taste or flavor, and nothing sharp or strong
scope: This sense means food or drink has almost no taste, also called flat, bland, vapid, flavorless
  and flavourless; it is not about dull talk and not about food that tastes bad.
examples:
- The soup was insipid and needed salt.
- He served an insipid tea with no taste at all.
