simpleMeaning: a white substance in the form of crystals, taken as a drug to stop pain and lower fever
scope: A white crystal-like drug that eases pain and lowers fever; amidopyrine is another name for this
  sense, not a drug that only eases pain and not one that only lowers fever.
examples:
- He took aminopyrine when the fever would not fall.
- Aminopyrine was given to ease the pain after the operation.
