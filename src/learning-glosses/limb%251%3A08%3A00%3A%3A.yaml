simpleMeaning: a jointed arm, leg, wing, or flipper of an animal, used to move or to hold things
scope: A jointed arm, leg, wing, or flipper of an animal, not a branch of a tree and not the edge of the
  sun or moon.
examples:
- The monkey swung by its limbs from branch to branch.
- A broken limb was set in a cast at the hospital.
