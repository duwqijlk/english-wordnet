synsetId: 12888586-n
simpleMeaning: A plant with soft stems, in the group Scutellaria, with a flower cover (a calyx) that,
  turned over, looks like a helmet with the front part up
scope: Also called helmetflower, this is the plant sense, not the small round cap worn on the head and
  not the top part of the skull.
examples:
- She planted skullcap in her garden for its helmet-shaped flowers.
- The skullcap in the field had a flower cover shaped like a small helmet.
