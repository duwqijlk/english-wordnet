simpleMeaning: In computing, one of the round paths on a magnetic disk that guide where facts are written
  and read.
scope: In computing, one of the round paths on a disk for writing and reading facts; track is another
  name for it, not a file and not a folder.
examples:
- The data track holds one ring of facts on the disk.
- Each data track guides the reading head.
