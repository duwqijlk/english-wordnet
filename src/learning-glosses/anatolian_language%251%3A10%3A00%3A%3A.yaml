simpleMeaning: A dead branch of the Indo-European family of tongues, known from old writings and key to
  rebuilding Proto-Indo-European.
scope: A dead branch of the Indo-European family of tongues, also called Anatolian; its nearest kin are
  other dead branches of the family, such as Tocharian and Phrygian.
examples:
- Anatolian language is known only from old writings cut in stone.
- Scholars use Anatolian language to rebuild Proto-Indo-European.
