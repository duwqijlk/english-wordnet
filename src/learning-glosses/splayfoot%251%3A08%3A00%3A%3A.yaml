simpleMeaning: a foot with a fallen arch, flat and spread out in a way that is not normal
scope: A foot with a fallen arch, also called a flatfoot or pes planus; not a foot with a high arch and
  not a foot hurt in an accident.
examples:
- His splayfoot made long walks painful.
- The doctor looked at her splayfoot and told her to wear special shoes.
