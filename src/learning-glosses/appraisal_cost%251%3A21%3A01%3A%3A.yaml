simpleMeaning: the money spent on checking that goods and services meet the rules set for them
scope: The money spent on tests and checks that goods and services meet what is asked of them, not the
  money spent on making them and not the price a buyer pays.
examples:
- Field testing and quality audits are part of the total appraisal cost.
- The appraisal cost rose when the firm added more checks on its goods.
