simpleMeaning: a tool made of two long stiff parts joined at one end, that you press together to crack
  nuts open
scope: This is the hand tool for cracking nuts, not the small bird that feeds on nuts and insects and
  not the speckled bird that feeds on nuts.
examples:
- She used a nutcracker to open the hard walnut.
- He put the nut in the nutcracker and pressed hard.
