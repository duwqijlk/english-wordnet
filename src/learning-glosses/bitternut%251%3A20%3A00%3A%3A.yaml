simpleMeaning: A tree of the east of the United States bears fruit in thin shells, too sharp in taste
  to eat, and leaves of seven or nine small parts.
scope: This tree of the east of the United States bears thin-shelled fruit too sharp to eat, and bitter
  hickory, bitter pignut, bitternut hickory and swamp hickory are other names for it.
examples:
- They gathered the thin-shelled fruit of the bitternut.
- We cracked a bitternut and found the meat too sharp to eat.
