simpleMeaning: Kind and giving, moved by care for others and a wish to help them
scope: Kind and giving from care for others, with kindly and sympathetic as other names for this sense,
  not kindness shown only in words and not giving done for show.
examples:
- A benevolent neighbour paid for the children's school books.
- The benevolent old lady gave food to every beggar at her door.
