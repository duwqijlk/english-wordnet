simpleMeaning: a small tree from southern Europe and Asia Minor that grows small nuts with hard shells
scope: Another name for this tree is pistachio tree; this is the tree itself, not its nut, the small food
  with a green inside that people eat.
examples:
- The pistachio is a small tree, so it fits in a small garden.
- A farmer planted a pistachio and waited years for the tree to bear nuts.
