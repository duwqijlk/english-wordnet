simpleMeaning: a fish like a herring, eaten as food, that travels from the sea to fresh water to lay its
  eggs
scope: The live fish itself, which leaves the sea and swims into fresh water to lay its eggs; not its
  meat served as food.
examples:
- Every spring, shad leave the sea and swim up the river.
- Fishermen catch shad as the fish move into fresh water.
