simpleMeaning: a severe skin rash that comes with atopy, a state in which the body reacts too strongly
  to things around it
scope: 'Also called atopic dermatitis: a severe skin rash in people with atopy, not a mild rash and not
  a rash from a burn.'
examples:
- Her atopic eczema itched all night.
- He uses a cream for his atopic eczema.
