simpleMeaning: a person called to speak in court because they know a great deal about the subject being
  discussed
scope: This is a person with special knowledge who speaks in court; not an ordinary person who saw an
  event and not a lawyer.
examples:
- The expert witness explained the medical facts to the jury.
- They called an expert witness to speak about the building's safety.
