senseId: 'predestinarian%1:18:00::'
synsetId: 10100277-n
simpleMeaning: A person who gives in to the belief that nothing they do can change what will happen to
  them
scope: 'Another name for a fatalist, a determinist, or a predestinationist: a person who believes they
  cannot change what will happen; not someone who thinks the future is open, and not the adjective sense.'
examples:
- As a predestinarian, he felt his fate was already fixed.
- The predestinarian accepted every setback as part of what was meant to be.
