simpleMeaning: A young broad-leafed plant kept out of the light so it grows a narrow pale head
scope: 'Also called witloof and Belgian endive: this plant is kept out of the light so it forms a narrow
  pale head, to be told apart from other leafy plants grown in full light.'
examples:
- French endive grows in the dark to keep its head white.
- We served French endive in the salad.
