simpleMeaning: A set amount used to tell how strong a field made by magnets is for each set area
scope: A set amount for how strong a field made by magnets is for each set area, not the strength itself
  and not a measure over a whole area.
examples:
- Engineers state the reading in a magnetic flux unit.
- The lab lists results in a magnetic flux unit, not in raw counts.
