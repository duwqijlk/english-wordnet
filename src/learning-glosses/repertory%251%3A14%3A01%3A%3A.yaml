simpleMeaning: all the plays, songs, operas and ballets that a performer or group can perform, and performs
  for short periods on a regular plan
scope: Also called repertoire. This is the set of works a performer or group performs, not the full range
  of skills for a job and not the theatre group itself.
examples:
- The dance company has ten ballets in its repertory this year.
- She added a new opera to the group's repertory.
