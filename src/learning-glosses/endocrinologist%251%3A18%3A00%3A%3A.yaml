simpleMeaning: A doctor who finds and treats illnesses of the set of tube-free parts that make body chemicals.
scope: A doctor who finds and treats illnesses of the body's chemical-making parts, not a doctor for the
  heart and not a doctor for the skin.
examples:
- The endocrinologist checked her blood for signs of a gland problem.
- He saw an endocrinologist about his low hormone levels.
