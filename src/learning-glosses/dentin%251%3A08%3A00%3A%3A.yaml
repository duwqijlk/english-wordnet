simpleMeaning: Round the soft pulp inside a tooth sits a ring of hardened tissue.
scope: This is also called dentine, and is the hardened tissue round a tooth's soft middle, not the hard
  stuff that makes up most of the tooth.
examples:
- The dentin round the pulp keeps the tooth strong.
- The dentin round the pulp was worn thin.
