simpleMeaning: In psychology, a state in which the mind or the feelings are under strain or held waiting
  for what will come next
scope: 'Also called stress: a worried, strained state of mind, not a pull in a rope and not a pull between
  two sides in a story.'
examples:
- The long wait filled her with tension.
- His tension grew as the news was slow to come.
