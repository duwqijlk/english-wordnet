simpleMeaning: The state of not being able to have young; a woman cannot start a child, and a man cannot
  start one in a woman
scope: Not being able to have young, also called infertility; not a sickness of the womb and not a choice
  to have no children.
examples:
- Sterility means a person cannot have young.
- The doctor spoke to them about sterility and its causes.
