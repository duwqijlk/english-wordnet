simpleMeaning: Fishes with broad mouths, with a thread shaped like a worm, fastened on, to draw in prey.
scope: Fishes with broad mouths, with a thread shaped like a worm, fastened on, to draw in prey; also
  called anglerfish, angler, allmouth, angler fish, goosefish, or lotte; not sharks with broad, flat bodies
  and wing-like side fins, that swim the way sharks do, nor the flesh of a large-headed anglerfish of
  the Atlantic waters of North America.
examples:
- Their monkfish lurked in the deep.
- The monkfish lured its prey.
