simpleMeaning: To sleep in the same bed as the person you are going to marry, still wearing all your clothes
scope: Sleeping beside the person you are going to marry while still dressed, not tying things into a
  pack and not gathering things into a group.
examples:
- In the old days, young couples would bundle together in one bed before the wedding.
- They bundled in the same bed, fully dressed, as the custom allowed.
