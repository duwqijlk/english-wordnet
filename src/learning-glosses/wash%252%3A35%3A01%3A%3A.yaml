simpleMeaning: to sort precious minerals out of the soil and gravel that hold them
scope: This is the mining sense of extracting valuable minerals, not cleaning anything with soap and water,
  not removing particles by rinsing, and not applying a thin coat to a surface.
examples:
- The miners washed the gravel for hours, looking for gold dust.
- They washed the ore in the creek to free the tin from the mud.
