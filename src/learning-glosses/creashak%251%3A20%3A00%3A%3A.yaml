simpleMeaning: Leaves turn red in autumn on this low shrub, green all year, flat on the ground, with small
  white flowers and red berries in North America and northern Eurasia.
scope: Also called bear's grape, common bearberry, hog cranberry, mealberry, mountain box, red bearberry,
  sand berry, sandberry, and wild cranberry; a low shrub, not a tall tree.
examples:
- The creashak in the rock garden turned red in autumn.
- We found creashak with white flowers and red berries on the hill.
