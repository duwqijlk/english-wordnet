simpleMeaning: one of the small bones in a finger or a toe
scope: This is one of the small bones in a finger or toe, not the finger or toe as a whole.
examples:
- He broke a phalanx in his little toe when he dropped the box.
- The X-ray showed a small crack in the phalanx of her thumb.
