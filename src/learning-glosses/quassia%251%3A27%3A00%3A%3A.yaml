simpleMeaning: a bitter substance used to kill insects, as a tonic, and to drive worms out of the body,
  got from the wood and bark of trees of two groups
scope: This is the bitter substance taken from wood and bark, not the tree it comes from.
examples:
- Quassia is so bitter that insects will not eat the leaves.
- The doctor gave quassia as a tonic.
