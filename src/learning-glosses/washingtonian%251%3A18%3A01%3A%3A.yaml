simpleMeaning: A person born or living in the city of Washington.
scope: A person of the city of Washington, not of the state of that name, not an adjective for things
  of the state, and not a word for things in the manner of George Washington.
examples:
- The Washingtonian worked near the Capitol.
- He is a Washingtonian born and raised in the city.
