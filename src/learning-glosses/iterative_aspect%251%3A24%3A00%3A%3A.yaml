simpleMeaning: A verb has this way of showing it when an action happens again and again
scope: The way a verb shows an action that happens again and again, also called iterative; not the way
  a verb shows a single finished action and not the way it shows an action still going on.
examples:
- She kept knocking, and the iterative aspect of the verb shows the action repeated.
- The iterative aspect in 'he coughed all night' shows the coughing happened over and over.
