simpleMeaning: having to do with feeling what goes on inside one's own body
scope: Of feeling what goes on inside one's own body, such as hunger or a beating heart; not of the five
  senses that take in the world outside.
examples:
- Interoceptive signals tell us when we are hungry or thirsty.
- She noticed the interoceptive feeling of her heart beating fast.
