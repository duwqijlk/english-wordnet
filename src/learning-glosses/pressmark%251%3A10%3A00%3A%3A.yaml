simpleMeaning: Letters and numbers written on a book to show where it sits on a shelf
scope: 'Also called a call mark or a call number: letters and numbers on a book showing where it sits
  on a shelf; not the book''s title and not a mark made by the reader.'
examples:
- The librarian wrote the pressmark inside the front cover.
- She found the book by its pressmark on the shelf list.
