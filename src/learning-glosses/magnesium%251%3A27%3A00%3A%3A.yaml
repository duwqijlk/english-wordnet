simpleMeaning: A light, silver-white metal that bends easily and joins with two other atoms; pure, it
  burns with a white flame, and in nature is found only joined with other elements.
scope: Not aluminium or calcium; also called Mg and atomic number 12.
examples:
- Magnesium burns with a bright white flame.
- Magnesium is found in dolomite rock.
