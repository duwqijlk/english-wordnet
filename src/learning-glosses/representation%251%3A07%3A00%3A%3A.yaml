simpleMeaning: The right to have chosen speakers with a voice in a law-making body
scope: The right to have chosen speakers with a voice in a law-making body, not the body of lawmakers
  itself and not a made picture of a thing.
examples:
- The town fought for representation in the assembly.
- Without representation, they had no voice in the laws.
