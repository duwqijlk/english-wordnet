simpleMeaning: A bar that runs from the middle of a round frame to its edge, holding it firm.
scope: A bar from the middle of a round frame to its edge; spoke and radius are other names for this sense,
  not the rim itself and not the middle part alone.
examples:
- One wheel spoke was bent after the cart hit a stone.
- The wheel spoke joins the middle of the wheel to its rim.
