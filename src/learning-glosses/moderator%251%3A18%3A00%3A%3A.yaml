senseId: 'moderator%1:18:00::'
synsetId: 10345753-n
simpleMeaning: a person who helps people who disagree to settle the matter, and tries to keep them from
  using violence
scope: A person who helps people who disagree to settle the matter without violence. It is not the person
  who leads a debate or forum, and not a substance used in a nuclear reactor.
examples:
- The moderator helped the two sides talk and reach an agreement without fighting.
- They chose a calm moderator to settle the dispute between the workers and the company.
