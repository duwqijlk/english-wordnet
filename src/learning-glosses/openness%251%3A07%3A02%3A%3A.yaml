simpleMeaning: A readiness to take in what comes from outside, above all impressions and ideas
scope: A readiness to take in impressions and ideas, not a readiness to tell others about one's own acts
  and not an open door.
examples:
- He showed an openness to new ideas that surprised his friends.
- Their openness to the proposal helped the talks move forward.
