simpleMeaning: A kind of mandarin orange, also called a cold hardy mandarin, a Christmas orange, or a
  tangerine.
scope: Also called a satsuma tree, a cold hardy mandarin, a Christmas orange, or a tangerine, a kind of
  mandarin orange, not the medium-sized nearly seedless fruit with thin smooth skin of the other sense.
examples:
- She peeled a satsuma for the children.
- The satsuma was sweet and easy to peel.
