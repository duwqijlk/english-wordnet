simpleMeaning: A tool put inside the body that makes the lining of the vagina and womb neck look bigger,
  so it can be studied in a living body.
scope: Also called a colposcope, this tool makes the lining of the vagina and the neck of the womb look
  bigger so it can be studied in a living body.
examples:
- The doctor used a vaginoscope to look at the lining of the vagina.
- With a vaginoscope, she could study the cervix in the living body.
