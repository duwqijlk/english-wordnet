senseId: 'presence%1:04:00::'
synsetId: 01236367-n
simpleMeaning: Being in a place or at an event, rather than absent.
scope: Someone actually being in a place or at an event; not simply existing, not a felt sense of something
  unseen, and not a dignified way of carrying yourself.
examples:
- Your presence at the ceremony is required by the family.
- The contract requires the director's presence at the annual meeting.
