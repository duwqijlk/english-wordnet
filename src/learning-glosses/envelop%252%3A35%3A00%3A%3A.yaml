senseId: 'envelop%2:35:00::'
synsetId: 01583316-v
simpleMeaning: to cover a thing completely on all sides, or to surround a thing completely as if with
  a cover
scope: 'Also called wrap and enclose: this sense is to cover something completely on all sides, not to
  put something inside a paper cover for posting.'
examples:
- Fog enveloped the whole village in the morning.
- She enveloped the child in a warm blanket.
