synsetId: 01500681-s
simpleMeaning: Full of meaning and suggesting more than is actually said.
scope: This describes something full of meaning, not something large, important, or statistically notable.
examples:
- Her silence was significant, hinting that she disagreed.
- He gave me a significant look before leaving the room.
