simpleMeaning: a trip across a stream or river, made by walking through the water, driving, or riding
  a horse
scope: The act of getting across a stream or river, not the shallow place in the water where you cross.
examples:
- They made the ford in the dark, wading up to their knees.
- The ford took an hour, as the horses picked their way through the water.
