simpleMeaning: connected with or following the rules of how forces make things move and work
scope: This sense is about the rules of forces and movement, not about using a machine or tool and not
  about machines or tools themselves.
examples:
- The mechanical pressure of a strong wind bent the thin trees.
- They tested the mechanical forces acting on the bridge.
