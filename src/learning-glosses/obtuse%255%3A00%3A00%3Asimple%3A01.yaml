senseId: obtuse%5:00:00:simple:01
synsetId: 02176916-s
simpleMeaning: Having a round tip, when talking about the shape of a leaf
scope: Of a leaf shape, this means round at the tip; it is not the sense that means slow to learn, and
  not the sense that means not good at understanding or judging.
examples:
- This plant has obtuse leaves, each one round at the tip.
- The leaf shape is obtuse, so the end is round, not sharp.
