simpleMeaning: The natural process in which body tissue grows tiny blood tubes (capillaries) that carry
  blood.
scope: This is the natural process by which body tissue grows tiny blood tubes; vascularization is another
  name for this sense; not the growth of new tissue after injury.
examples:
- After the injury, vascularisation brought new blood tubes into the damaged tissue.
- Doctors watched the vascularisation of the healing skin with care.
