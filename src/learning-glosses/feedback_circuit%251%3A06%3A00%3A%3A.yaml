simpleMeaning: a set of wires that sends some of what a machine puts out back into the machine at the
  start
scope: 'Also called a feedback loop: a set of wires that sends some of what a machine puts out back to
  the start, not a switch and not a wire that carries power one way.'
examples:
- The feedback circuit kept the motor at a steady speed.
- Engineers tested the feedback circuit to see how the machine would react.
