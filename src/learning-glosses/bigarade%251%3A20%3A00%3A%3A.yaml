simpleMeaning: Grown to carry new trees joined onto it, this common orange tree bears sour or bitter fruit.
scope: Also called bitter orange, bitter orange tree, marmalade orange, and sour orange, this names a
  common orange tree used to grow new trees on, bearing sour or bitter fruit.
examples:
- The bigarade bore sour fruit.
- New trees were grown on bigarade stock.
