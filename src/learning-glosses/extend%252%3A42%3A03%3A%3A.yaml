simpleMeaning: to go across a distance, an area, a time, or a range, and to go between two points or past
  a point
scope: 'Also called run, go, pass, and lead: this is about reaching across distance, time, or range, not
  about pushing a hand out or making an area bigger.'
examples:
- The road extends from the village to the river.
- His memory extends back to when he was four years old.
