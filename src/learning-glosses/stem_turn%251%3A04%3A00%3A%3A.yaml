synsetId: 00442441-n
simpleMeaning: 'In skiing, a way to change direction: the back end of one ski is pushed out to the side,
  and the other ski is brought in line with it'
scope: Also called a stem, this is a way to change direction on skis, not a straight run down a slope
  and not a jump.
examples:
- She made a stem turn to slow down before the bend.
- He learned the stem turn on his first ski lesson.
