simpleMeaning: Makers of cheap jewellery reach for this copper-and-zinc mix, at times with arsenic, when
  they want a gold look or a gold coat on things.
scope: This mix, also called tambac and tombac, passes for gold in cheap jewellery and coats things in
  gold.
examples:
- The tombak ring looked like gold but cost very little.
- The cheap jewellery was coated in gold with tombak.
