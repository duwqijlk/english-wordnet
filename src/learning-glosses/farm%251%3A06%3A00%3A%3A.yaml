simpleMeaning: land and the buildings on it, used for growing crops or raising animals, considered as
  one unit.
scope: This is not the activity of collecting fees or profits; it names the land and buildings as a single
  place of work.
examples:
- They run a small farm in the hills.
- The children visited a farm to see the animals and crops.
