simpleMeaning: a computer program that splits a user's screen into two or more windows, and the things
  shown in each window can be moved up or down on their own
scope: This is a computer program that splits a screen into windows, and the things shown in each window
  can be moved up or down on their own; it is not the border round a picture, not one still picture in
  a film, and not the bones in a body.
examples:
- Each frame on the page can be scrolled on its own.
- The website uses a frame on the left for the menu and a frame on the right for the text.
