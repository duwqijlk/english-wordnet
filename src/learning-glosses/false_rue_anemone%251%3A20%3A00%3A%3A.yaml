simpleMeaning: A slender plant that stands upright and lives for several years in eastern North America,
  with white flowers tinged with pink and tuber-like roots; it resembles meadow rue.
scope: Another name for false rue, the same plant from eastern North America; the two names refer to one
  species. It is not meadow rue, which it merely resembles. The name is a plant name.
examples:
- False rue anemone was flowering in the shade of the old stone wall.
- Botanists list false rue anemone among the spring flowers of the Ohio valley.
