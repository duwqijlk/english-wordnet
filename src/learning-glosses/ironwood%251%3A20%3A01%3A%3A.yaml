simpleMeaning: a small tree of northern Iran that grows slowly, loses its leaves in winter, and has a
  low round top
scope: This is the small tree from northern Iran, not the North American tree with the same name and not
  the very hard wood from such trees.
examples:
- In northern Iran, the ironwood grows slowly and loses its leaves in winter.
- The park planted an ironwood, a small tree with a low, round shape.
