simpleMeaning: making people feel upset and a little angry
scope: 'Also called annoying, teasing, irritating, pestering, vexing, galling, pesky, nettlesome, plaguey,
  and vexatious: making people feel upset and a little angry, not causing pain or real harm.'
examples:
- The noise from the road was bothersome all night.
- A bothersome mosquito kept flying around my head.
