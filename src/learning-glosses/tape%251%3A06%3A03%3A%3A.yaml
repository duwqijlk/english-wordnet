simpleMeaning: a narrow strip of cloth or metal marked in inches or centimetres, used to measure lengths
scope: A narrow strip marked in inches or centimetres for measuring lengths, not the strip used to store
  sounds or pictures.
examples:
- She used a tape to measure the cloth.
- The tape showed the room was three metres long.
