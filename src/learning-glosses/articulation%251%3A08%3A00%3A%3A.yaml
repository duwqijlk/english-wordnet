simpleMeaning: The meeting place of two bones or parts of the skeleton in the body, especially where they
  can move.
scope: Also called a joint, the meeting place of two bones or parts of the skeleton in the body, especially
  where they can move; not the shaping of speech sounds by the parts of the mouth, and not the putting
  of thoughts into clear words.
examples:
- The articulation of the knee lets the leg bend.
- Damage to the articulation made the joint stiff.
