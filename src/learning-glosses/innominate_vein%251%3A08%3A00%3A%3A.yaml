simpleMeaning: a blood tube made where two blood tubes in the neck and chest join
scope: A blood tube formed where two blood tubes in the neck and chest join, also called a brachiocephalic
  vein; not a single blood tube on its own and not a tube that carries blood away from the heart.
examples:
- The surgeon traced the innominate vein to its join.
- Blood flows through the innominate vein toward the heart.
