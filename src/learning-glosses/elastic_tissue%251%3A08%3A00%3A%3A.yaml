simpleMeaning: Supporting tissue that connects body parts, made mostly of elastic fibers, found in the
  deep skin layer, the walls of veins and arteries, and some tendons and ligaments.
scope: A body tissue whose main ingredient is elastic fibers. It is not a single elastic fiber, and not
  connective tissue in general, which may contain few such fibers.
examples:
- Elastic tissue in the artery wall stretches and recoils with every heartbeat.
- Years of sun exposure had damaged the elastic tissue in her skin.
