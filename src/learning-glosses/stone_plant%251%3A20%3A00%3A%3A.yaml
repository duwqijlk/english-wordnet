simpleMeaning: Africa is home to one of many kinds of plant in the Lithops group, with single yellow or
  white flowers and thick leaves that look like small rocks.
scope: This African plant of the Lithops group is also called flowering stone, lithops, living stone,
  stone-face, stone life face, and stoneface, and it has single yellow or white flowers and thick leaves
  that look like small rocks.
examples:
- She potted a stone plant.
- The stone plant flowered.
