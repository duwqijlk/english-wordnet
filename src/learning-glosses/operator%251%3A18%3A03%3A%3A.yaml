simpleMeaning: a person who buys and sells shares and raw goods in a bold, risky way, hoping prices will
  change so they can make money
scope: This is a bold, risky buyer and seller on money markets; it is not a person who runs a machine
  or a business, and not a maths sign.
examples:
- The operator bought and sold shares all day, taking big risks to make money.
- As a market operator, she traded oil and wheat in a bold way.
