simpleMeaning: Said of the shape of a leaf, like an egg with its wide end at the bottom
scope: Said of the shape of a leaf, like an egg with its wide end at the bottom; not a leaf itself and
  not a leaf with its wide end at the tip.
examples:
- The ovate shape of the leaf was wider near its base.
- She drew an ovate leaf, broad at the bottom and narrow at the top.
