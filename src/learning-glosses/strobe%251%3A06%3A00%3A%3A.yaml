simpleMeaning: a tool used in science that gives short flashes of light in time with a thing that moves
  again and again, and can make it look still
scope: 'Also called strobe light and stroboscope: a science tool that flashes in time with a moving thing.
  It is not a steady light used just to light a room.'
examples:
- The strobe flashed in time with the spinning wheel, so it looked still.
- In the lab, they used a strobe to study the fast-moving fan blades.
