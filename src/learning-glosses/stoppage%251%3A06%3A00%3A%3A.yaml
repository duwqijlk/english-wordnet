senseId: 'stoppage%1:06:00::'
synsetId: 02856708-n
simpleMeaning: something inside a pipe or tube that blocks it, so nothing can pass through
scope: Also called stop, block, closure, and blockage. This is a thing that blocks a pipe or tube, not
  the act of stopping something.
examples:
- A stoppage in the drain kept the water in the sink.
- The plumber cleared the stoppage from the pipe.
