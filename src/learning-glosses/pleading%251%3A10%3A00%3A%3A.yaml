simpleMeaning: In law, a statement set out in a clear, ordered way that says something for one side in
  a court case
scope: In law, a statement that says something for one side in a court case; not the act of asking for
  something in a strong, begging way.
examples:
- The lawyer filed a pleading that set out his client's case.
- In her pleading, she asked the court to dismiss the claim.
