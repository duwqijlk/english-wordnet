simpleMeaning: to make a person or animal calm or quiet, as by giving a drug that makes them calm or sleepy
scope: 'Also called calm, sedate, tranquillize and tranquillise: making a person or animal calm or quiet
  with a drug, not just helping someone feel less worried by talking.'
examples:
- The vet tranquilized the dog before the operation.
- The doctor tranquilized the patient so she would stay still.
