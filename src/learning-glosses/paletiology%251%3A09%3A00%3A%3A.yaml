simpleMeaning: The causes science finds — such as the causes that shaped the earth — explain past events
scope: 'Also called palaetiology: explaining past events by the causes science finds, not just telling
  the story of the past and not explaining past events by chance.'
examples:
- Paletiology seeks the causes behind ancient floods.
- His paletiology of the valley traced its shape to the slow work of rivers.
