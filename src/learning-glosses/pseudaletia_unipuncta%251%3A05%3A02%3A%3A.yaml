simpleMeaning: The young of a night-flying moth that move in huge groups and eat up plants, above all
  grass and grain.
scope: Also called army worm and armyworm; the young of a night moth that moves in huge groups, not the
  grown moth itself.
examples:
- Pseudaletia unipuncta swept through the field in huge numbers, eating the grain.
- Farmers dread Pseudaletia unipuncta when its young move in swarms across the grass.
