simpleMeaning: In polo, one of the six parts into which a match is split
scope: In polo, one of the six parts into which a match is split; chukka is another name for this sense,
  not a whole match and not a single play.
examples:
- The first chukker ended with the score tied.
- The players rested between one chukker and the next.
