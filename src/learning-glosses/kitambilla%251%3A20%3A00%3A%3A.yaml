simpleMeaning: A small, spiny, bushy tree grown for its dark purple fruit, which has sweet flesh tasting
  of gooseberries; it is cultivated in Sri Lanka and India.
scope: Another name for the ketembilla tree, also spelled kitembilla; not the fruit of the same name.
examples:
- A kitambilla grew wild at the edge of the paddy field.
- The kitambilla is covered with thorns, so pick carefully.
