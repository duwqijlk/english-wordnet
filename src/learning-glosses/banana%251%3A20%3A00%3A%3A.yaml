simpleMeaning: any of several tree-like herbs of the genus Musa that grow in tropical and subtropical
  regions, with a crown of large undivided leaves and usually hanging bunches of long fruit.
scope: The tree-like plant that produces the fruit, not the yellow fruit itself; banana tree is another
  name for this sense.
examples:
- Bananas are tall, tree-like herbs rather than true trees.
- The banana in their garden has broad leaves and a heavy bunch of fruit.
