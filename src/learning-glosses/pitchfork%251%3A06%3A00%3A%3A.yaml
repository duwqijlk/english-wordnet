simpleMeaning: A hand tool with a long handle and sharp points set far apart, used to lift hay and toss
  it up
scope: A long-handled hand tool for lifting and tossing hay, not the act of lifting with one and not a
  fork used at meals.
examples:
- He grabbed the pitchfork and started turning the hay.
- She leaned the pitchfork against the barn wall after the work was done.
