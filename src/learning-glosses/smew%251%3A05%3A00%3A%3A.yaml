simpleMeaning: the smallest kind of merganser, a diving duck, and the best at diving under water, found
  in north Eurasia
scope: The smallest kind of diving duck, not a big duck and not a duck that swims on top of the water.
examples:
- We watched a smew dive under the cold lake.
- The smew is the smallest of all the mergansers.
