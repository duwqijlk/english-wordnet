simpleMeaning: a yellow or yellow-brown substance from dead plants in soil that dissolves in water, whatever
  the water is like
scope: A yellow or yellow-brown substance from dead plants in soil that dissolves in water, not a yellow
  dye and not a substance that only dissolves in some waters.
examples:
- The lab tested the fulvic acid in the river water.
- Fulvic acid gives the soil water a yellow tint.
