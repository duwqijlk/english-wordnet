simpleMeaning: a yellow or yellow-brown stuff from dead plants in soil that melts into water, whatever
  the water is like
scope: A yellow or yellow-brown stuff from dead plants in soil that melts into water, not a yellow dye
  and not a stuff that only melts in some waters.
examples:
- The lab tested the fulvic acid in the river water.
- Fulvic acid gives the soil water a yellow tint.
