simpleMeaning: a crystal form of copper sulfate, a salt, with a sky colour, that holds water in it
scope: 'Also called blue copperas, blue vitriol and chalcanthite: a crystal form of a copper salt, not
  a blue rock or a dye.'
examples:
- The blue stone in the jar was a crystal of copper sulfate.
- The blue stone crystals turned white when they lost their water.
