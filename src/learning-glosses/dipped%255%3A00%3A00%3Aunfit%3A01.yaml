simpleMeaning: having a back that bends down in the middle in a way that is not normal, especially in
  horses
scope: This is about a back, especially a horse's back, that bends down too much in the middle; it is
  not about putting something into liquid for a short time.
examples:
- The old horse had a dipped back and could no longer carry a rider.
- A dipped spine can make a horse unfit to ride.
