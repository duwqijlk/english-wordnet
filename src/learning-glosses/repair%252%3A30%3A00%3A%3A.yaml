simpleMeaning: to make a broken thing work again, by putting in a new part or by joining the torn or broken
  pieces
scope: 'Doctor, fix, and restore are other names for this sense: to make a broken thing work again, not
  to make a new thing.'
examples:
- He repaired the bike by putting in a new wheel.
- Can you repair my shoes, please?
