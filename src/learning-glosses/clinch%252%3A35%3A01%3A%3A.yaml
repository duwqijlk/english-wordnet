senseId: 'clinch%2:35:01::'
synsetId: 01347585-v
simpleMeaning: to hold something firm by bending flat the ends of the nails or bolts that go through it
scope: To fix something with nails or bolts by flattening their ends; not the boxing hold, not a tight
  hug, and not the flattened end of a nail itself.
examples:
- He clinched the boards together by hammering the nail ends flat.
- The worker clinched each bolt so the frame could not come loose.
