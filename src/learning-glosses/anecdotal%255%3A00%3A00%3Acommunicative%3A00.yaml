simpleMeaning: full of short stories about real events, or often telling such stories
scope: This is about a person or talk that tells many short real stories, not just a thing that has the
  form of one short real story.
examples:
- His anecdotal talk kept the class awake with one short story after another.
- She gave an anecdotal history of jazz, full of stories about the players.
