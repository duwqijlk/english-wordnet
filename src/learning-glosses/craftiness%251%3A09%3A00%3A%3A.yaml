simpleMeaning: cleverness shown by being good at tricking people
scope: Cleverness shown by being good at tricking people; craft, cunning, foxiness, guile and slyness
  are other names for this sense, not honest skill and not plain good sense.
examples:
- His craftiness showed when he tricked the guards with a false story.
- She used craftiness to get past the locked door without a key.
