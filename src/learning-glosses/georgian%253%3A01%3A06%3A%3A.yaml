simpleMeaning: Of or to do with the former British colony of Georgia.
scope: This sense covers the former British colony of Georgia; the Hanoverian kings of England and the
  American state are separate senses of the same word.
examples:
- Settlers built the Georgian colony on the coast.
- The Georgian colony was a British colony in America.
