simpleMeaning: a person who does clever tricks high in the air, on a rope or a bar that swings
scope: A person who does clever tricks high in the air, on a rope or a swinging bar; not a dancer and
  not a person who does tricks on the ground.
examples:
- The aerialist swung from the trapeze high above the crowd.
- An aerialist spun on the rope as the band played.
