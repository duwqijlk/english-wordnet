simpleMeaning: a written character that shows the meaning of a logogram (a sign that stands for a whole
  word)
scope: A written character that shows meaning in a written sign, not a root number in math, not a group
  of atoms in chemistry, and not a person with strong new ideas.
examples:
- The radical in this Chinese character shows that the word is about water.
- She learned to find the radical in each new character.
