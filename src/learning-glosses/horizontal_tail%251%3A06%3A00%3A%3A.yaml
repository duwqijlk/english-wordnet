simpleMeaning: the flat side-to-side part at the back of a plane, made of the steadying surface and the
  flap that lifts or lowers the nose
scope: The flat side-to-side part at the back of a plane, made of the steadying surface and the flap that
  lifts or lowers the nose, not a wing and not the tail fin.
examples:
- The horizontal tail keeps the plane steady in flight.
- Damage to the horizontal tail made landing hard.
