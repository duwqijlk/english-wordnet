simpleMeaning: In living things, a close layer that wraps round and holds an organ or part of the body
scope: 'Also called case: in a plant or animal, a close layer round an organ or part, not a cover for
  a blade and not a dress.'
examples:
- The sheath around the nerve keeps it safe from harm.
- A thin sheath covers the young leaf as it grows.
