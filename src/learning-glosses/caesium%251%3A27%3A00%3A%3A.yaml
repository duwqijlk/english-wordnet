simpleMeaning: A soft silver-white metal that draws out into threads, liquid at ordinary warmth, the most
  ready to turn positive and the strongest at making acids mild.
scope: Also called Cs, atomic number 55 and cesium, it is the soft metal of its kind that is already liquid
  at ordinary warmth and turns positive and makes acids mild more strongly than other soft metals.
examples:
- The caesium sample was liquid at ordinary warmth.
- Caesium is a soft silver-white metal.
