simpleMeaning: of a leaf, like a sharp point, with wide pointed parts that stick out at the foot
scope: 'Also called hastate: a leaf shape like a sharp point, with wide pointed parts that stick out at
  the foot; not a leaf with a broad round tip and not a leaf with no parts at the foot.'
examples:
- The spearhead-shaped leaf stood out with its two points at the base.
- Look for spearhead-shaped leaves, wide at the foot with a sharp tip.
