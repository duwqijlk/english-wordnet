simpleMeaning: A big, long-horned wild ox of Europe, now gone, thought to be one of the forebears of tame
  cattle.
scope: 'Also called aurochs: a big, long-horned wild ox of Europe, now gone, thought to be a forebear
  of tame cattle, not a bison and not a tame cow.'
examples:
- The urus was a big wild ox of Europe, now gone.
- Tame cattle are thought to come in part from the urus.
