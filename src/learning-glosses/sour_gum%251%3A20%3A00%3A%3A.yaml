simpleMeaning: A tall straight tree of eastern North America with level branches and small leaves that
  come out late in spring and turn bright in early fall
scope: This is the tall straight tree of eastern North America; black gum and pepperidge are other names
  for it, not a low spreading tree and not a tree whose leaves come out early in spring.
examples:
- A sour gum stood at the edge of the wood, its small leaves late to open in spring.
- The sour gum turns bright in early fall.
