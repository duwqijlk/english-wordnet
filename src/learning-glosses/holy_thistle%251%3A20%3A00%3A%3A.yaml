simpleMeaning: a tall Old World plant living two years, with big leaves that clasp the stem and have white
  marks, and purple bloom heads, growing wild in California and South America
scope: 'Also called blessed thistle, lady''s thistle and milk thistle: a tall plant from the Old World
  with big white-marked leaves and purple bloom heads, now growing wild in California and South America,
  not a garden flower.'
examples:
- The holy thistle stood tall by the road, its purple bloom heads easy to spot.
- Holy thistle now grows wild in California, far from its Old World home.
