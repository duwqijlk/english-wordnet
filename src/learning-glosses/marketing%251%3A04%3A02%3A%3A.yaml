simpleMeaning: the business activities used to promote, sell, and deliver a product or service to customers
scope: This covers the whole business activity of promoting, selling, and delivering goods, not the act
  of shopping at a market.
examples:
- She works in marketing for a software company.
- The company spends millions on marketing each year.
