simpleMeaning: In mathematics, an endless flat shape with two dimensions and no boundary
scope: In mathematics, an endless flat two-dimensional region; plane is another name for this same sense,
  not a cloth article, a piece of paper, or a broad thin expanse.
examples:
- In geometry, a sheet has no edges and extends forever in two directions.
- The proof treats the surface as an endless sheet lying flat in two dimensions.
