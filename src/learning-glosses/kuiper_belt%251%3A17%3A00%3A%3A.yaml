simpleMeaning: A flat round area of small planets beyond the path of Neptune
scope: A flat round area of small planets beyond the path of Neptune; Edgeworth-Kuiper belt is another
  name for this sense; not the path of Neptune itself, and not a place of large planets.
examples:
- The Kuiper belt lies beyond the orbit of Neptune.
- Pluto is one of the small planets in the Kuiper belt.
