senseId: 'disadvantageous%3:00:00::'
synsetId: 00065808-a
simpleMeaning: making or bringing about a state of things that hurts the chance of doing well or getting
  things done
scope: A state of things that works against doing well, also called unfavorable or unfavourable, and not
  a lucky break or a fair chance.
examples:
- The late start put her in a disadvantageous position for the race.
- A disadvantageous deal left the small firm with little room to grow.
