simpleMeaning: A tool that makes holes of different widths, with a sharp edge that can be set to each
  width
scope: 'Also called an expansion bit: a tool for making holes of different widths, not a small piece of
  something and not a short moment in time.'
examples:
- He set the expansive bit to the widest size before he started to drill.
- The expansive bit cut a hole just wide enough for the pipe.
