simpleMeaning: a group of huts built as a camp, mainly for soldiers
scope: A camp made of huts, mainly for soldiers. It is not one hut on its own, and not a lasting army
  base built of stone or brick.
examples:
- The soldiers lived in a hutment near the edge of the forest.
- A new hutment was built to house the men for the winter.
