simpleMeaning: A fleshy, tawny or reddish herb of eastern North American woods that feeds on decaying
  matter and looks like Indian pipe; some classifications place it in genus Hypopitys.
scope: This is the tawny or reddish woodland herb that lives on decaying matter; pinesap is another name
  for it, not the white Indian pipe it resembles.
examples:
- A patch of false beachdrops grew in the deep shade.
- We found false beachdrops under the hemlocks, half hidden in the leaf litter.
