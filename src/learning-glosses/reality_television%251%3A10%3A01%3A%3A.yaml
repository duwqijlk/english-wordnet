simpleMeaning: A kind of show that films real life as it happens, with people who seem not to be reading
  lines from a script
scope: A kind of show that films real life; not a drama with actors and not a news show.
examples:
- Reality television follows ordinary people through their days.
- She watches reality television every evening.
