simpleMeaning: A doctor whose skill in one branch of medicine has been certified by a paper from a suitable
  medical group.
scope: A doctor with a medical group's paper showing skill in one branch, not a newly trained doctor and
  not a doctor without that paper.
examples:
- She is a diplomate in heart medicine.
- The diplomate received the group's paper last year.
