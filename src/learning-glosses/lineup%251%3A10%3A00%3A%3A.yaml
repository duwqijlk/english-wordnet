simpleMeaning: In baseball, the list that says who bats first, second, and so on for one team
scope: In baseball, the list of batters in batting order; card is another name for this sense, and it
  is not a line of people set out for the police to look at.
examples:
- The manager wrote the lineup on the board before the game.
- Their lineup had three new batters at the top.
