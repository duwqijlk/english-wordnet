simpleMeaning: A glass plate coated with a jelly-like stuff holds the image for this way of printing pictures
  by light and machine, in one colour or in more.
scope: Also called collotype and collotype printing, this method prints pictures from a glass plate coated
  with a jelly-like stuff, in one colour or in more.
examples:
- The printer used the photogelatin process to copy the picture.
- With the photogelatin process, one plate can print the picture in several colours.
