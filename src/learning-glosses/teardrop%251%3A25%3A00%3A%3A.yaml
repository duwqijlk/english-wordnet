simpleMeaning: The shape of a drop of water as it falls, wide and round below and pointed above, such
  as a jewel hanging from an earring
scope: Anything shaped like a falling drop, such as a jewel hanging from an earring; not a drop of tears
  from the eye.
examples:
- She wore teardrop earrings to the dance.
- The teardrop gem on her necklace caught the light.
