simpleMeaning: With feelers like small combs, these moths have thick bodies and dull colours, and are
  of middle size.
scope: 'Also called lasiocampid: a moth of middle size with a thick body and dull colours.'
examples:
- The lasiocampid moth rested on the bark, its comb-like feelers spread wide.
- We saw a lasiocampid moth near the lamp, its thick body easy to spot.
