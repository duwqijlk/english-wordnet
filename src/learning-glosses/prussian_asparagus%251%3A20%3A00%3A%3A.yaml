simpleMeaning: A plant of the lands of Europe, Asia and Africa, one of the stars of Bethlehem, with young
  shoots people can eat.
scope: Also called bath asparagus and Ornithogalum pyrenaicum; a plant of the lands of Europe, Asia and
  Africa with young shoots people can eat, not a plant of the New World and not one whose shoots are not
  for eating.
examples:
- Prussian asparagus grows in the garden, and we eat its young shoots.
- We picked Prussian asparagus for dinner in the spring.
