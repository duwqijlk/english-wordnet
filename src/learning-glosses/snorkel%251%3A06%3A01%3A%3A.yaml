senseId: 'snorkel%1:06:01::'
synsetId: 04258254-n
simpleMeaning: a bent tube that fits in a swimmer's mouth and reaches above the water, so the swimmer
  can breathe with the face down in the water
scope: This is the small tube a swimmer uses to breathe with the face down; it is not the air part on
  a boat that travels under water, and not the act of swimming with such a tube.
examples:
- She breathed through a snorkel while her face was in the water.
- He put the snorkel in his mouth and swam face down.
