simpleMeaning: the spot in baseball where the player who covers the middle third of the outfield stands
scope: 'Also called centerfield: the spot in the middle of the outfield in baseball, not the whole outfield
  and not the player who stands there.'
examples:
- He moved to center field after the injury.
- The coach put our fastest runner in center field.
