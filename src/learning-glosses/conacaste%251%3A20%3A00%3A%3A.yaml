simpleMeaning: a South American tropical tree with a wide, spreading crown of twice-divided leaves and
  coiled, ear-shaped pods; it is planted for shade and ornament, and its timber is prized.
scope: This is the tropical South American shade tree with a broad crown and ear-shaped pods, valued for
  timber; not a fruit tree grown for its crop.
examples:
- A conacaste shaded the village square, its wide crown spreading over the benches.
- The carpenter chose conacaste for the table because its timber is hard and polishes well.
