simpleMeaning: 'A mark of meningitis: a sick person cannot straighten the leg at the knee when the thigh
  is bent, as the back-of-thigh cords are stiff'
scope: This is a mark of meningitis, shown when the thigh is bent and the stiff back-of-thigh cords keep
  the leg from straightening at the knee.
examples:
- Kernig's sign showed that the patient might have meningitis.
- The doctor tested for Kernig's sign by bending the patient's thigh.
