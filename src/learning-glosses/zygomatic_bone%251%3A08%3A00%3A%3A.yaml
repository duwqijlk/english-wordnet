simpleMeaning: a curved piece of the face below the eye that gives the cheek its high rounded shape
scope: This is a curved piece of the face below the eye that gives the cheek its high rounded shape, also
  called zygomatic, cheekbone, jugal bone, malar, malar bone and os zygomaticum; not the jaw and not the
  part above the eye.
examples:
- The zygomatic bone was cracked when he fell off his bike.
- She could feel the zygomatic bone under the skin of her cheek.
