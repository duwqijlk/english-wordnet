senseId: 'procrustean_rule%1:10:00::'
synsetId: 07276450-n
simpleMeaning: A single measure is forced on all alike, and no notice is taken of how people differ
scope: A measure forced on everyone alike; procrustean bed and procrustean standard are other names for
  this sense, not a measure that bends to fit each person.
examples:
- The procrustean rule forced every worker into the same hours.
- She hated the procrustean rule that gave every pupil the same task.
