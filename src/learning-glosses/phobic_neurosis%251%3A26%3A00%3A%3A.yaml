simpleMeaning: a worry illness marked by very strong, baseless fear of plain things or of meeting people
scope: A worry illness of very strong, baseless fear of plain things or of meeting people; phobia and
  phobic disorder are other names for this sense, not ordinary shyness and not a passing fright.
examples:
- Her phobic neurosis filled her with fear at the thought of a crowded room.
- The doctor called her strong baseless fear a phobic neurosis.
