simpleMeaning: Islam's third pillar is a fast kept mainly in Ramadan, when Muslims give up food, drink,
  gambling and bodily pleasures between sunrise and sunset.
scope: The Islamic fast as a pillar of the faith, not the month of Ramadan itself or any ordinary period
  of going without food.
examples:
- During Ramadan, sawm lasts from first light until sunset.
- Many Muslims observe sawm as an act of devotion.
