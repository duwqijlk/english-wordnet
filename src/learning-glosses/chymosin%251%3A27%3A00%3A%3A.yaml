simpleMeaning: an enzyme, a body chemical, in the juice of the stomach that makes milk turn thick and
  set
scope: An enzyme in the juice of the stomach that makes milk turn thick and set, also called rennin; not
  a drug and not a chemical that breaks milk down.
examples:
- Chymosin in the stomach turns milk thick.
- Cheesemakers add chymosin to set the milk.
