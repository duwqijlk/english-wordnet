simpleMeaning: the quality of being easy and helpful to use, so it saves you time or trouble
scope: How easy and helpful a thing is to use, not how cheap it is and not a thing that is merely near
  at hand.
examples:
- They offered the convenience of an installment plan.
- The hotel's convenience made our stay easy.
