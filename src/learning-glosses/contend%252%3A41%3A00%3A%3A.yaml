simpleMeaning: to get something done, made, or produced even when the means at hand are few or not enough
scope: To get by with what little is at hand, also called deal, manage, cope, and grapple; not to compete
  with others and not to argue a point in court.
examples:
- We contended with just a gallon of gas on the long drive.
- They contended with half a loaf of bread every day.
