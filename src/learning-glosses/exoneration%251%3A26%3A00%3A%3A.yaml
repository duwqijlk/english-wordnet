senseId: 'exoneration%1:26:00::'
synsetId: 14598944-n
simpleMeaning: the state of being freed from blame for something or from a duty you had to do
scope: This sense is the state of being free from blame or from a duty. It is not the act of clearing
  someone's name or showing they did no wrong.
examples:
- After the new facts came out, his exoneration left him free from blame.
- His exoneration meant he no longer had to carry out the duty.
