simpleMeaning: The part of tooth care that deals with illness of the soft inner part of a tooth
scope: This is the part of tooth care that deals with illness of the soft inner part of a tooth; endodontics
  is another name for it, not tooth care in general and not the care of gums.
examples:
- She studied endodontia to treat illness of the tooth pulp.
- Endodontia deals with the soft inner part of a tooth.
