simpleMeaning: A cup fungus 3 to 8 cm high, with an orange to yellow spore-bearing top and white or pinkish
  stalks, often half in and half out of the water
scope: A small cup fungus with an orange to yellow top, not a tall mushroom and not a fungus of dry land.
examples:
- Mitrula elegans grows half in and half out of the water.
- The Mitrula elegans top is orange to yellow.
