senseId: 'diagonal_matrix%1:14:00::'
synsetId: 08285883-n
simpleMeaning: a square grid of numbers in which every number off the line from one corner to the opposite
  corner is zero
scope: A square grid of numbers in which every number off the corner-to-corner line is zero; not a grid
  with numbers everywhere and not a single row of numbers.
examples:
- The diagonal matrix had zeros everywhere except along its main line.
- She wrote the diagonal matrix on the board with zeros off the diagonal.
