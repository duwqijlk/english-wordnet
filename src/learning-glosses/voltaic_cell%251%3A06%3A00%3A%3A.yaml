simpleMeaning: Chemical power inside this pack becomes a push through a wire, in a change that cannot
  be undone, and the pack cannot be filled again.
scope: Also called a galvanic cell and a primary cell, it is a power pack that makes a push from chemical
  power and cannot be filled again.
examples:
- The voltaic cell had gone flat and could not be filled again.
- Once a voltaic cell has been used up, it cannot be filled again.
