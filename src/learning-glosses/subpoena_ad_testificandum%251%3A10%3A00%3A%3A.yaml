simpleMeaning: A court order that makes a person come to speak as a witness at a trial; one who does not
  come can be punished for contempt of court.
scope: 'Also called subpoena: a court order that makes a person come to a trial to speak as a witness.'
examples:
- The lawyer sent her a subpoena ad testificandum to make her come and speak in court.
- He got a subpoena ad testificandum and had to go to the trial as a witness.
