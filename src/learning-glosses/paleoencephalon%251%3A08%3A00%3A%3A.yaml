simpleMeaning: The older parts of the brain in its long history, that is, most of it except the outer
  layer
scope: The older parts of the brain in its long history; palaeencephalon and paleencephalon are other
  names for it, not the outer layer itself and not the whole brain.
examples:
- The paleoencephalon is the older part of the brain.
- Most of the brain outside the cortex belongs to the paleoencephalon.
