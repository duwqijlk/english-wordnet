senseId: grand%5:00:00:impressive:00
synsetId: 01287636-s
simpleMeaning: Describing actions that are impressive and ambitious in their size or reach.
scope: This is not the piano sense, and it does not mean simply large or costly; it describes ambitious
  behavior or plans.
examples:
- She made a grand gesture of apology in front of the whole staff.
- The city announced a grand plan to plant a million trees.
