simpleMeaning: A police body for the union of countries in Europe, working to make police work better
  and to help police forces in Europe work together.
scope: Also called Europol, this police body for the European Union works to make police work better and
  to help police forces in Europe work together, not the world police body.
examples:
- The European Law Enforcement Organisation helps police forces work together.
- Europol is the short name for the European Law Enforcement Organisation.
