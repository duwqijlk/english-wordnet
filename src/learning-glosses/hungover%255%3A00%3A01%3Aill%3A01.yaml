simpleMeaning: feeling ill from the effects that follow drinking alcohol
scope: This means feeling ill after drinking alcohol, not being drunk at the time and not being ill for
  another reason.
examples:
- He woke up hungover after drinking at the party.
- She felt hungover and stayed in bed all morning.
