simpleMeaning: A bruise, sickness or upset feelings can leave the skin without its normal colour, in a
  way that is not natural
scope: 'Also called lividity, pallor, paleness, achromasia, luridness and pallidness: skin without its
  natural colour, not a healthy glow and not a rash.'
examples:
- His lividness after the illness made him look ghostly pale.
- The doctor noted the lividness of the patient's hands.
