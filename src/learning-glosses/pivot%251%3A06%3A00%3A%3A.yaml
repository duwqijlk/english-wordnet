simpleMeaning: a short rod in the middle that holds up a part and lets it turn round
scope: 'Also called pin: a short rod that holds a turning part, not a person in a line of soldiers and
  not the act of turning.'
examples:
- The door turns on a small metal pivot.
- The pivot in the middle holds the wheel and lets it spin.
