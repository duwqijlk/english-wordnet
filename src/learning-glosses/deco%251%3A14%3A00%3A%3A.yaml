simpleMeaning: A way of designing things that was liked in the 1920s and 1930s, with neat set shapes and
  patterns of shapes made to be turned out in large numbers.
scope: Also called art deco, this is the 1920s and 1930s style of design with set shapes and patterns
  of shapes.
examples:
- The hotel lobby was done in deco, with bold geometric patterns.
- Deco posters from the 1930s lined the wall.
