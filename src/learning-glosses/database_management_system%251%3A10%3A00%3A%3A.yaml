simpleMeaning: A set of computer programs that help people make, keep up, and use a store of facts held
  on a computer.
scope: This is a set of computer programs for making and using a store of facts, not the store of facts
  itself or a single program that only shows facts.
examples:
- The office bought a database management system to keep its records.
- A database management system helps people use a store of facts.
