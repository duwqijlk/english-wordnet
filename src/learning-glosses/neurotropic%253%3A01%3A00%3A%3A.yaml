simpleMeaning: It marks a germ, poison, or chemical that strikes or harms the brain and nerves before
  anything else.
scope: This word marks a germ, poison, or chemical that strikes or harms the brain and nerves before anything
  else, not one that harms the body all over alike.
examples:
- The neurotropic virus attacked the nerves first.
- That neurotropic poison harms the brain before other parts.
