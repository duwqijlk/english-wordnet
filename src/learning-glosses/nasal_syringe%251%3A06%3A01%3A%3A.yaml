simpleMeaning: A syringe with a soft rubber bulb that does the work of a plunger, used to rinse an opening
  like the ear canal or clear a stuffy nose.
scope: Another name for this rinsing device with a rubber bulb, also called bulb syringe and nasal aspirator;
  not a regular plunger syringe used for injections.
examples:
- He used a nasal syringe to wash salt water through his blocked nose.
- A nasal syringe can ease a baby's congestion without any medicine.
