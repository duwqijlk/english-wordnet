simpleMeaning: a person who has both male and female sex traits and parts, so that at birth no clear choice
  of male or female can be made
scope: A person who has both male and female sex traits and parts, also called a hermaphrodite, epicene,
  androgyne, epicene person or gynandromorph; not a person who has had an operation to change sex and
  not a person attracted to both men and women.
examples:
- The baby was born intersex, with both male and female traits.
- Doctors recorded the child as intersex at birth.
