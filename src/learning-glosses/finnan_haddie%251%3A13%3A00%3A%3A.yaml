simpleMeaning: With lots of butter, a haddock is baked in the oven in most cases, though it is at times
  cooked under strong heat from above
scope: 'Also called finnan and finnan haddock: a haddock cooked with lots of butter, not a fresh haddock
  and not a fish cooked without butter.'
examples:
- She ordered finnan haddie with extra butter.
- The finnan haddie was baked until the butter bubbled.
