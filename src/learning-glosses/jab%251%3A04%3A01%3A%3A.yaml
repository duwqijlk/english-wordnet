simpleMeaning: A short, sharp push of the hand, made as if to strike someone
scope: 'Also called poke, thrust, poking, and thrusting: a short, sharp push of the hand, made as if to
  strike someone, not touching someone suddenly with a finger or elbow.'
examples:
- He gave me a jab with his finger to warn me.
- She made a jab with her fist as if to hit him.
