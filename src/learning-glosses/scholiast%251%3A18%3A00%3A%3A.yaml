simpleMeaning: a learned person who writes notes that explain a writer's work, especially an old writer
  of classical works
scope: A person who writes notes that explain an author's work, especially an old classical author; not
  the author, and not a person who just copies the text.
examples:
- The scholiast added notes to explain the poet's hard words.
- A famous scholiast wrote notes on Homer's poems.
