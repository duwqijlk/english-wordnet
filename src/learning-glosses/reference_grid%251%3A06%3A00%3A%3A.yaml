simpleMeaning: a set of lines that run across and up and down, so you can say where a point is on a picture
  or a map
scope: A set of crossing lines that mark places on a picture or map, not lines of latitude and longitude
  and not the map's key.
examples:
- The reference grid helped us find the town at square B3 on the map.
- She used the reference grid on the photo to mark where the dig had found the pot.
