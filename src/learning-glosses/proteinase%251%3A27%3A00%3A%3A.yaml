simpleMeaning: Proteins are cut into smaller peptide pieces and single amino acids by any body chemical
  of this kind, in a splitting process called proteolysis.
scope: 'Also called peptidase, protease, and proteolytic enzyme: any body chemical that cuts proteins
  into smaller pieces, not the protein it acts on.'
examples:
- The proteinase cut the protein into smaller peptide pieces and single amino acids.
- This proteinase works fast, splitting each protein into smaller peptide pieces.
