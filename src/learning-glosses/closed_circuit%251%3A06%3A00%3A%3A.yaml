simpleMeaning: A full loop of wire through which power flows or a signal travels round and round.
scope: This is a full loop of wire through which power or a signal travels round and round; loop is another
  name for this sense, not a broken loop where power cannot flow and not a short cut that lets power jump
  straight back.
examples:
- The closed circuit lets the current flow all the way round.
- When the switch breaks the closed circuit, the light goes out.
