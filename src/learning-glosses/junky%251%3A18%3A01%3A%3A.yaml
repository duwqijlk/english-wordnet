simpleMeaning: a person who loves one thing so much that it takes over their life, like a strong need
  they cannot stop
scope: Also called freak, nut, addict, and junkie. This is a person whose love for one thing is like a
  strong need, not a person with a real drug problem.
examples:
- He is a music junky who spends all his money on records.
- As a news junky, she checks the headlines many times a day.
