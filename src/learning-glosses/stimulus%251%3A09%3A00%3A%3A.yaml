simpleMeaning: any piece of information, or any thing that happens, that makes a person start to act
scope: 'Also called input: any piece of information, or any thing that happens, that makes a person act,
  not a prize offered to make someone act and not a thing that merely catches the eye.'
examples:
- The sudden noise was the stimulus that set the dogs barking.
- A sharp fall in prices acted as a stimulus to buyers.
