simpleMeaning: Of a voice or sound, rough and hard on the ear, and not pleasant to hear
scope: A rough, harsh sound that is hard on the ear; rough, scratchy, raspy, rasping and grating are other
  names for this, not a smooth voice and not a loud noise.
examples:
- His gravelly voice made him hard to hear on the phone.
- She spoke in a gravelly whisper after shouting all day.
