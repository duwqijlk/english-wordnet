simpleMeaning: a machine that makes exact new versions of typed, written, or drawn work
scope: The machine that makes exact new versions of pages; not the first page itself and not a person
  who writes out a copy by hand.
examples:
- The office copier made ten copies of the letter.
- Please put the drawing in the copier.
