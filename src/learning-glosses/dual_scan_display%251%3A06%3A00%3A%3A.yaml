simpleMeaning: A kind of flat screen in which the top and bottom halves of the picture are renewed at
  the same time.
scope: A kind of flat screen in which the top and bottom halves of the picture are renewed at the same
  time, not a screen renewed line by line and not a tube screen.
examples:
- The laptop had a dual scan display.
- A dual scan display renews both halves of the screen at once.
