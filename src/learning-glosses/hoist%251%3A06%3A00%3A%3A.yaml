simpleMeaning: a machine or tool used to lift heavy things, or large things that are hard to handle and
  move
scope: A machine or tool for lifting heavy things. Not the act of lifting itself.
examples:
- They used a hoist to lift the engine out of the car.
- The hoist lifted the heavy box onto the ship.
