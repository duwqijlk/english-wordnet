simpleMeaning: looking inside the last part of the gut and the end of the large bowel with a thin tube
  that has a light
scope: Looking inside the last part of the gut with a lighted tube, not a look at the whole belly and
  not a test of the blood.
examples:
- The doctor ordered a proctoscopy to look inside her lower bowel.
- He had a proctoscopy after he felt pain low in his gut.
