simpleMeaning: 'Children wear them at play and grown-ups wear them for sport: a light, bendy open shoe
  with a tough bottom.'
scope: It is a light open shoe like a sandal, worn by children at play and by grown-ups for sport.
examples:
- She put on her scuffers before going out to play.
- He wore his scuffers when he played sport as a grown-up.
