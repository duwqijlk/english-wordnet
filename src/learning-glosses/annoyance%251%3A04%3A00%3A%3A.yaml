simpleMeaning: doing something that troubles another person
scope: 'Also called annoying: the act of troubling someone, not the angry feeling that trouble causes,
  not the state of feeling troubled, and not an unpleasant person.'
examples:
- Playing loud music at midnight was an act of annoyance toward his neighbours.
- His annoyance of passers-by by shouting at them in the street got him a warning.
