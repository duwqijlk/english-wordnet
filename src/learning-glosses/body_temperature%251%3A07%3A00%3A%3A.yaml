simpleMeaning: how warm or cool a person's body is; in people it is normally 98.6 F or 37 C, usually checked
  to quickly show how well the person is
scope: 'Also called blood heat: how warm a person''s body is, not the warmth of the air.'
examples:
- The nurse wrote down his body temperature after the operation.
- A high body temperature can mean the body is fighting a germ.
