simpleMeaning: A thin pointed part of a plant, animal, or crystal, such as a spine, a stiff hair, or a
  crystal.
scope: Not a thorn on a stem and not a soft hair.
examples:
- An acicula on the worm helps it grip the soil.
- The crystal bore a sharp acicula at its tip.
