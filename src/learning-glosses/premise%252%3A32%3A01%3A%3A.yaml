simpleMeaning: To put an opening section at the front of a talk or a piece of writing, before the main
  part begins.
scope: Also called introduce, and another name for it is precede, this is giving a work an opening part
  before the main part, not putting words first to explain and not a claim taken as true.
examples:
- She always premises her lectures with a joke.
- He premised his lecture with a short note about the town.
