simpleMeaning: to move at an angle or to the side, usually in a way you cannot control
scope: This means to move to the side, usually without control, also called slide. It is not the noun
  for a wrong step, and not a planned move by a plane.
examples:
- The car slipped sideways on the wet road.
- His feet slipped to the side on the ice and he could not stop.
