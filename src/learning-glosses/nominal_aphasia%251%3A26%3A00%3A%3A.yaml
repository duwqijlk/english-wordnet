simpleMeaning: Not being able to name things, or to know the written or spoken names of things.
scope: Not being able to name things, or to know the written or spoken names of things, with amnesic aphasia,
  amnestic aphasia, anomia and anomic aphasia as other names for this sense, not losing one's voice and
  not forgetting what things are for.
examples:
- After the stroke, nominal aphasia left him unable to name things.
- Nominal aphasia makes it hard to find the names of objects.
