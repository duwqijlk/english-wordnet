simpleMeaning: Dull white flowers grow on this bush of Europe, which turns red in autumn and drops its
  leaves for the winter.
scope: Also called pedwood or red dogwood, this is a bush of Europe that bears dull white flowers, turns
  red in autumn, and loses its leaves in winter.
examples:
- The blood-twig in the garden turned red in autumn.
- We planted a blood-twig and watched its dull white flowers open.
