simpleMeaning: a motorbike that can be moved by pedals or by an engine with low power that uses gasoline
scope: This is a motorbike with pedals and an engine with low power that uses gasoline, not a bicycle
  with no engine and not a big, powerful motorcycle.
examples:
- His moped has pedals, but he usually uses its small engine.
- You can pedal this moped if its engine stops.
