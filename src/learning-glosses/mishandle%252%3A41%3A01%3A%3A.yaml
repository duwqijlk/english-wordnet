senseId: 'mishandle%2:41:01::'
synsetId: 02443726-v
simpleMeaning: to run something in a bad way, without the skill the job needs
scope: 'Also called mismanage and misconduct: to run something badly for lack of skill, not to do a thing
  so badly that it is spoiled or broken.'
examples:
- He mishandled the money and the club soon had none left.
- She mishandled the team's work, so nothing was done on time.
