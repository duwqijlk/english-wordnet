senseId: 'dispossession%1:04:00::'
synsetId: 01196821-n
simpleMeaning: the act of using the law to make someone, such as a person who rents land, leave that land
scope: The law-based act of making a renter leave land, also called eviction; not just losing a thing,
  and not being made to leave without the law.
examples:
- The court ordered the dispossession of the tenant from the farm.
- After the dispossession, the family had to leave the land they rented.
