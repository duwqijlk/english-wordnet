simpleMeaning: Eaten at times in salads or cooked as a green, this plant of damp places lives one or two
  years, yet in some places it is a troublesome weed.
scope: People also call it yellow watercress, and the word names a green that is both food and, in some
  places, a weed.
examples:
- The marsh cress grows in damp places and is at times eaten in salads.
- Marsh cress is a troublesome weed in some places, though it is cooked as a green.
