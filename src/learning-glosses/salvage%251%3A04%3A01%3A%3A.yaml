simpleMeaning: getting things or property out of danger, so they are not harmed or destroyed
scope: Getting things out of danger before they are harmed or destroyed, not the saving of a wrecked ship
  and not the verb of saving from ruin.
examples:
- The salvage of the books began as soon as the fire was out.
- Salvage crews worked all night to save the goods.
