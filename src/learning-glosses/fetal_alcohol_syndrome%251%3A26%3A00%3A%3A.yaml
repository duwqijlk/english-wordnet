simpleMeaning: Because the mother drank strong drink while carrying the baby, a medical condition present
  at birth makes the body grow out of shape, or the face or mind grow wrong
scope: This condition comes from the mother drinking strong drink while carrying the baby, unlike other
  conditions present at birth.
examples:
- Fetal alcohol syndrome can leave a child with a body grown out of shape.
- The baby showed fetal alcohol syndrome after the mother drank strong drink while carrying it.
