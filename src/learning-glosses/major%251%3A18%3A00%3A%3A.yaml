simpleMeaning: an officer of middle rank in the US Army, Air Force, or Marines, above a captain and below
  a lieutenant colonel
scope: This is not the adjective sense meaning greater or more serious, nor a student's principal subject,
  but a rank of officer in the armed forces.
examples:
- She was promoted to major after twelve years of service.
- The major saluted and left the room.
