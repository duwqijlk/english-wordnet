simpleMeaning: a wave whose top is broken up by the wind and looks white
scope: A wave with a white, broken top made by the wind; not a white cap that a person wears, and not
  a calm wave with a smooth top.
examples:
- Whitecaps covered the lake as the wind grew stronger.
- From the boat we could see whitecaps all across the bay.
