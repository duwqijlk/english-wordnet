simpleMeaning: Flat boards made by gluing thin sheets of wood together, one on top of another
scope: Flat boards made by gluing thin sheets of wood together, one on top of another; not a single solid
  board, and not wood cut in thick blocks.
examples:
- The builders used plywood for the floor of the new shed.
- She cut a sheet of plywood to make the back of the cupboard.
