simpleMeaning: Its loud cry sounds like a cackle, and this bird from Australia is a kind of kingfisher.
scope: Its loud cry sounds like a cackle, and this bird from Australia is a kind of kingfisher; kookaburra
  is another name for this sense, not a bird of Europe, and not a bird with a sweet song.
examples:
- A laughing jackass called loudly from the gum tree.
- The laughing jackass woke us with its cackling cry.
