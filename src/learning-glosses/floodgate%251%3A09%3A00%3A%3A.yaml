simpleMeaning: a thing that holds back a great flow of water or of other things
scope: A thing or rule that holds back a flow, not a real gate that controls how much water flows through
  a water channel.
examples:
- Strict checks were a floodgate against illegal goods entering the country.
- The court order was a floodgate that stopped the flow of false stories.
