simpleMeaning: Taken by mouth, often mixed with drink, this party drug comes as a liquid or a powder and
  leaves a person unable to fight off sexual assault or rape.
scope: This is a party drug taken by mouth, not a medicine or a drink served at a party.
examples:
- The police warned that gamma hydroxybutyrate is often mixed with alcohol at parties.
- She took gamma hydroxybutyrate in liquid form and soon could not move.
