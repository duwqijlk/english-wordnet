simpleMeaning: A burdock with heart-shaped leaves, found in open woods, hedges, and rough grass in Europe,
  except the far north, and Asia Minor, sometimes grown for medicine and cooking.
scope: Also called cocklebur, great burdock, and greater burdock; a burdock with heart-shaped leaves,
  not a tall tree and not a plant grown only for its flowers.
examples:
- Arctium lappa grows along the edge of the wood.
- The heart-shaped leaves of Arctium lappa are easy to spot.
