simpleMeaning: a person with training in putting the science of power to use in real work
scope: A person with training in the science of power and its real uses, not a person who only studies
  the science and not a person who fixes machines without such training.
examples:
- The electrical engineer planned the wiring for the new school.
- She asked an electrical engineer to check the power system before the factory opened.
