simpleMeaning: a dance step said to look like a sneeze, done by bending the head down while lifting one
  arm and elbow up at the same time
scope: A dance move, not the act of doing it and not a small bit of something wet.
examples:
- She ended the routine with a dab that made the crowd laugh.
- His dab came right on the last beat of the song.
