simpleMeaning: A bend or twist in a thing that has lost its true shape.
scope: Also called a buckle, this is a shape bent out of true by twisting or folding, not the threads
  on a loom and not a twist in the way a person thinks or judges.
examples:
- The warp in the door kept it from closing.
- Heat had left a warp in the wooden board.
