simpleMeaning: An act that treats a person unfairly, using them for gain.
scope: 'Also called using and exploitation: an act that treats a person unfairly and uses them for gain,
  not the hardship that follows from being made a victim.'
examples:
- Paying workers less and charging them more is a form of victimization.
- The report described the victimization of workers in the factory.
