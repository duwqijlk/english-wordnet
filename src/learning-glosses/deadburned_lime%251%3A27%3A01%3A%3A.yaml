senseId: 'deadburned_lime%1:27:01::'
synsetId: 92429158-n
simpleMeaning: A form of calcium oxide, a white alkaline solid, fired above 1,100° C that has lost its
  reactivity, so it bonds poorly or not at all.
scope: The same high-fired product that over-burned lime names; not ordinary quicklime or the slaked lime
  used to make mortar.
examples:
- Deadburned lime will not harden properly when mixed with water.
- Builders avoid deadburned lime because it makes weak, crumbly mortar.
