simpleMeaning: a way of speaking or writing that is pleasing and fits well, especially in how words are
  put together
scope: 'Also called felicity: a pleasing and fitting way of speaking or writing, not a lucky turn of events
  and not a happy mood.'
examples:
- Her felicitousness made the speech a joy to hear.
- The writer was praised for the felicitousness of his short sentences.
