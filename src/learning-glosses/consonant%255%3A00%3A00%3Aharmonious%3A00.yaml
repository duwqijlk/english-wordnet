simpleMeaning: having parts that go well together and make a pleasing whole
scope: This describes things whose parts fit well together, also called harmonic; it is not a letter or
  speech sound that is not a vowel.
examples:
- The soft music and the quiet room were consonant, making a calm and pleasing whole.
- He chose colours that were consonant with each other, so the room looked balanced and pleasant.
