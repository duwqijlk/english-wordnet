simpleMeaning: A monkey with a red-brown coat and white silky fringes down both sides of its body, one
  of the colobus monkeys
scope: This is a monkey with a red-brown coat and white silky fringes down both sides; not a plain black
  monkey and not a monkey with no white fringe.
examples:
- A guereza sat in the tree, its white fringes hanging down.
- The guereza's red-brown coat stood out against the green leaves.
