simpleMeaning: A seat used to put a person to death with a strong current, made to look like an ordinary
  seat for one.
scope: 'Also called chair, death chair, and hot seat: a seat used to put a person to death with a strong
  current, not an ordinary seat and not a hanging.'
examples:
- The murderer was sentenced to die in the electric chair.
- The electric chair stood in the prison room.
