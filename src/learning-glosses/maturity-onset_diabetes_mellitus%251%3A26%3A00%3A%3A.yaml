simpleMeaning: A mild illness that comes on gradually in adults, set off by obesity, severe stress, menopause
  or other factors, and usually controlled by diet and sugar-lowering drugs without insulin.
scope: Another old label for this same slow adult form of diabetes, as opposed to the childhood form that
  needs insulin from the start.
examples:
- He was diagnosed with maturity-onset diabetes mellitus at sixty and never needed insulin.
- The leaflet still uses the old label maturity-onset diabetes mellitus for this adult form.
