schema: oewn-learning-gloss-v2
senseId: 'cajole%2:32:00::'
synsetId: 00770823-v
simpleMeaning: to try to get someone to do something by asking in a kind, soft way, touching them gently,
  or saying nice things about them
scope: 'Also called coax, wheedle, inveigle, palaver, and blarney: to get someone to do something in a
  kind, soft way, not by force.'
examples:
- She cajoled him into helping by praising his work and asking in a sweet way.
- He kept cajoling his sister until she agreed to lend him the car.
