simpleMeaning: any of many fruits that are not fit to eat and that have a hard outer skin
scope: This is the hard-skinned fruit itself, which people do not eat, not a bottle made from its dried
  shell and not the plant it grows on.
examples:
- The farmer grew gourds with hard skins that people do not eat.
- A dry, hard gourd sat on the shelf as a decoration.
