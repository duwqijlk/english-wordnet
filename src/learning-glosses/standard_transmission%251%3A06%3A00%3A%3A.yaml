simpleMeaning: A gear box worked by hand, with a stick to change gears and a foot pedal to work the clutch.
scope: A stick shift is another name for this gear box, worked by hand with a stick to change gears and
  a foot pedal to work the clutch, not one that shifts by itself.
examples:
- They drove a car with a standard transmission.
- Changing gears took a stick and a foot pedal in the standard transmission.
