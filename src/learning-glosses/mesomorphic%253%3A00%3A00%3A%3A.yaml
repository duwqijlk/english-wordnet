simpleMeaning: having a strong, muscular body build in which bone, muscle and connective tissue, all formed
  from the embryo's middle layer, are especially well developed
scope: A word for a strongly muscular build, not the slender ectomorphic type or the rounder endomorphic
  one.
examples:
- The coach called him mesomorphic because of his thick, powerful shoulders and arms.
- Her mesomorphic frame suited her to sports that reward strength.
