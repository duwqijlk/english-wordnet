schema: oewn-learning-gloss-v2
senseId: 'incorrigible%3:00:00::'
synsetId: 00638296-a
simpleMeaning: not changed or made better when punished for doing wrong
scope: This describes a person or way of acting that punishment cannot change or make better, not just
  a person who is hard to deal with in a general way.
examples:
- The incorrigible boy stole again even after he was punished many times.
- She is an incorrigible liar who keeps lying after every punishment.
