simpleMeaning: Something that on its own takes an electric charge that can be turned round by an electric
  field from outside.
scope: A material that on its own takes an electric charge that can be turned round by an electric field
  from outside, not an ordinary material that keeps no charge and not a magnet.
examples:
- The ferroelectric material kept its charge after the field was switched off.
- Engineers use ferroelectric material in memory devices.
