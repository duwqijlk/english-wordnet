simpleMeaning: Hung from the lifting machine on steel wire rope, this lift carries workers and goods down
  below the ground.
scope: In mining, it is the lift that carries workers and goods below the ground, hung from the lifting
  machine.
examples:
- The mine cage carried the workers below the ground.
- Goods went down in the mine cage on steel wire rope.
