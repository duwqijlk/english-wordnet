simpleMeaning: In prosody, the strong sound on one syllable (one sound part of a word) in a small group
  of syllables in a line of poetry
scope: 'Also called beat, measure and meter: the strong sound on one sound part in a line of poetry, not
  the unit for measuring length and not rhythm as a whole.'
examples:
- In this line, the metre puts a strong sound on the first syllable of each small group.
- The teacher marked the metre of the verse to show which syllable sounds strong.
