simpleMeaning: Easy to see, hear, smell, taste, or feel distinctly.
scope: This sense is about something being easy to notice through the senses, not about being easy to
  understand or having no marks.
examples:
- From the top of the hill, the church tower was clear against the sky.
- Her voice was clear even at the back of the hall.
