simpleMeaning: Small strange hairy flowers like insects grow on thin stalks, on any of several low creeping
  plants
scope: This is one of several low creeping plants with small insect-like flowers, not the European orchid
  whose flowers look like flies.
examples:
- The fly orchid crept along the ground with tiny hairy flowers.
- We found a fly orchid with strange insect-like blooms on a thin stalk.
