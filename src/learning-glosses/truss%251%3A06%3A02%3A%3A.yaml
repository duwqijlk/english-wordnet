simpleMeaning: In architecture, a small support made of brick or stone, three-sided in shape, and usually
  not reaching far out
scope: This is a small brick or stone support, also called a corbel, not the medical belt for a hernia
  and not the large frame that holds up a roof or bridge.
examples:
- A stone truss under the beam held up the corner of the wall.
- The old church has a brick truss on each side of the door.
