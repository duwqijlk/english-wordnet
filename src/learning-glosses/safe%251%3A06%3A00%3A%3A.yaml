simpleMeaning: a strong metal box with a lock, used to keep money and valuable things secure.
scope: Not the ventilated food cupboard; this is the heavy locked box for money and valuables.
examples:
- The jewels were locked in the safe.
- Thieves broke into the office and carried off the safe.
