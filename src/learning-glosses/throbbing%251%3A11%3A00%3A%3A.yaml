simpleMeaning: one time when the heart beats fast and hard
scope: 'Also called pounding, and another name for it is throb: one time when the heart beats fast and
  hard, not the describing word for something that beats strongly again and again.'
examples:
- She put a hand on her chest and felt a strong throbbing.
- One throbbing of his heart was so hard that it hurt.
