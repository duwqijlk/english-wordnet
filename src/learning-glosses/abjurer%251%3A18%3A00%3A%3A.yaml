senseId: 'abjurer%1:18:00::'
synsetId: 09773872-n
simpleMeaning: A person who gives up a belief or claim in public, swearing it off
scope: A person who gives up a belief or claim in public, swearing it off, not someone who merely says
  a thing is untrue and not someone who quietly stops believing without swearing it off.
examples:
- The abjurer swore before the court that he had left the old faith.
- An abjurer of the old oath stood and spoke plainly.
