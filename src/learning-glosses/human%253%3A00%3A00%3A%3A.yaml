simpleMeaning: Having a person's body or qualities, not an animal's or a god's.
scope: It is about the shape or make-up of something, not about habits or feelings shared by people in
  general.
examples:
- In the story, the fox takes on a human form and walks into the village.
- The robot was given a human voice so that people would trust it.
