simpleMeaning: With shiny leaves that stay green all year and bright red berries, a low woody plant that
  spreads along the ground in the east of North America
scope: Also called partridgeberry and twinberry, this plant creeps along the ground and keeps its shiny
  leaves green all year, with bright red berries.
examples:
- Boxberry keeps its shiny leaves green all year.
- The boxberry had bright red berries among its shiny green leaves.
