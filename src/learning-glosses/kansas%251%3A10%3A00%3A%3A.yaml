simpleMeaning: The Dhegiha way of speaking used by the people it is named for
scope: This is the Dhegiha way of speaking used by the Kansa people; Kansa is another name for it, not
  the Kansa people themselves and not another Dhegiha way of speaking.
examples:
- Kansas was spoken by the Kansa people.
- She learned Kansas from her family.
