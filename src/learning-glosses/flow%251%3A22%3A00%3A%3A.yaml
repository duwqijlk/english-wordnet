simpleMeaning: Liquid or gas that comes out in a continuous, unbroken run.
scope: This is a physical stream of liquid or gas, not the main trend of events or ideas, not the amount
  passing in a given time, and not the menstrual sense.
examples:
- A steady flow of water ran from the broken pipe.
- Gas flow to the engine was cut off.
