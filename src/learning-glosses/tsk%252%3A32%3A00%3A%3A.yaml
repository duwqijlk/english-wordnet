senseId: 'tsk%2:32:00::'
synsetId: 00953943-v
simpleMeaning: to make a short clicking sound with the tongue, to show that you do not approve of something
scope: To make a 'tsk' sound to show disapproval, also called tut, and not to speak the words out loud.
examples:
- She tsked at the mess on the floor.
- He tsked in disapproval when he saw the broken vase.
