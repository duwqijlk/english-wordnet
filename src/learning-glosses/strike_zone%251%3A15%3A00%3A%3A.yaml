simpleMeaning: A pitch must pass through the space above home plate, from a hitter's knees up to the shoulders,
  for the call to go against the hitter in baseball.
scope: In baseball, it is the space above home plate, from a hitter's knees up to the shoulders, through
  which a pitch must pass for the call to go against the hitter.
examples:
- The pitch went through the strike zone, and the call went against the hitter.
- Pitches that miss the strike zone are not called against the hitter.
