simpleMeaning: Several kinds of grass of middle height, most of them feed grass of the mild lands, once
  covered the open, untouched grassland of the United States.
scope: This is a grass of middle height from the open grassland, neither tall nor low.
examples:
- Midgrass once covered the open grassland in the United States.
- Midgrass is cut for feed, since it grows to a middle height.
