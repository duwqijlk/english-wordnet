simpleMeaning: A spiral ridge cut round a rod, made to fit the teeth of a gear wheel or a toothed bar
scope: A spiral thread that drives a gear, not the soft-bodied animal, not a computer program, and not
  a nasty person.
examples:
- The worm in the gearbox turned the large wheel slowly.
- A worm drive lets a small motor move a heavy load.
