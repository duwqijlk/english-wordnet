simpleMeaning: to send a show or event out for people to watch on TV
scope: This means to send a show or event out on TV for people to watch; it is not to send it out on radio,
  and it is not just to watch TV.
examples:
- They will televise the game live tonight.
- The royal wedding was televised in many countries.
