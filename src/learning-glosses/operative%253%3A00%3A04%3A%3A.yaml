simpleMeaning: to do with care by cutting into the body, needing such care, or able to be treated that
  way, especially when compared with care by medicine
scope: Also called surgical. It is about care by cutting into the body, especially as different from care
  by medicine, not a detective, not a secret worker for a government, and not a machine that works.
examples:
- The tooth was so bad that it needed operative care, not just medicine.
- Doctors chose an operative way to fix his heart, by cutting into his body.
