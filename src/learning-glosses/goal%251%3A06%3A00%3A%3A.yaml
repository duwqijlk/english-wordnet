simpleMeaning: the frame or area on the field where players try to send the ball in order to score.
scope: Not the aim you work towards and not the point scored; this is the physical target on the field.
examples:
- The ball hit the post and bounced away from the goal.
- He stood in front of the goal, ready to save the shot.
