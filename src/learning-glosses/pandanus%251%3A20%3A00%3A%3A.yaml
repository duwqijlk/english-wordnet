simpleMeaning: With huge roots that hold it up and leaves like a pineapple's, this Old World hot-land
  tree, like a palm, bears cone-shaped fruit good to eat.
scope: 'It is also called screw pine: one of many Old World trees like a palm, with huge roots that hold
  it up and fruit good to eat.'
examples:
- The pandanus stands on huge roots.
- Pandanus fruit is good to eat.
