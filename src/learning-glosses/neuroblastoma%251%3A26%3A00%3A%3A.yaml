simpleMeaning: A harmful growth made of young nerve cells that most often spreads fast to other parts
  of the body.
scope: A harmful growth of young nerve cells that most often spreads fast, not a harmless lump and not
  a growth of bone cells.
examples:
- The child was treated for a neuroblastoma in her belly.
- A neuroblastoma can spread fast to other parts of the body.
