senseId: 'oblige%2:32:00::'
synsetId: 00886738-v
simpleMeaning: to make someone feel they must do something, or that they owe something to another person
scope: Also called hold, and another name for it is bind. This is about making a person feel they must
  do something or owe something, not about doing a kind favour for someone.
examples:
- The contract obliged him to pay for the repairs.
- Her kind help obliged us to invite her to dinner.
