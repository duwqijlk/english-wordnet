simpleMeaning: a diving bird from North America with a blue-grey bill
scope: A duck that dives and has a blue-grey bill; also called scaup, broadbill and bluebill. Not a duck
  that stays on the surface and not other diving ducks without this bill.
examples:
- A scaup duck dove under the water and came up with food.
- We saw a scaup duck with a blue-grey bill on the lake.
