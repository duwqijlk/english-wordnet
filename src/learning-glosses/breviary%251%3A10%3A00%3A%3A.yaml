simpleMeaning: In the Roman Catholic Church, a book of prayers that certain priests and members of religious
  orders say every day.
scope: A book of prayers said daily by certain priests and members of religious orders; not a hymn book
  and not a prayer book for everyone.
examples:
- The priest read from his breviary each morning.
- She carried her breviary to the chapel every day.
