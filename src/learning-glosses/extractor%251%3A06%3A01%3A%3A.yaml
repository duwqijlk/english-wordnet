simpleMeaning: A device that uses spin force to part bits from a mix.
scope: A device that uses spin force to part bits from a mix; also called centrifuge or separator; not
  a gun part that pulls an empty shell case out of the chamber and hands it to the ejector, nor a tool
  for pulling out tight-fitting parts.
examples:
- Their extractor spun at dawn.
- The extractor was used at noon.
