simpleMeaning: A guard protein made after the body is given one trigger substance but that sticks more
  strongly to a second trigger substance that was not there at the time
scope: This is a guard protein made after the body is given one trigger substance but that sticks more
  strongly to a second trigger substance, and not a guard protein that sticks most strongly to the substance
  that first caused it.
examples:
- The heteroclitic antibody bound the second antigen best.
- Researchers found a heteroclitic antibody in the sample.
