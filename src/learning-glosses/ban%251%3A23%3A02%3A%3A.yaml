simpleMeaning: A logarithmic unit (one that counts by powers of 10) for measuring information or entropy
  (how much is unknown), using base 10
scope: This is a unit for measuring information or entropy (how much is unknown); it is not stopping a
  film or newspaper from being shared, and not forcing a person to leave the place where they live.
examples:
- One ban is a unit for measuring information.
- The scientists measured the information in bans.
