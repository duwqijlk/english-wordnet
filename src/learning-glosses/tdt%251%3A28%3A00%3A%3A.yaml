simpleMeaning: In astronomy, a measure of time set by the Earth's movement around the Sun; terrestrial
  time is mean solar time put right for the unevenness of the Earth's movements.
scope: Also called ephemeris time, terrestrial dynamical time, terrestrial time, and TT; a measure of
  time set by the Earth's movement around the Sun, not the time shown by an ordinary clock.
examples:
- TDT gives time from the Earth's movement around the Sun, not from a clock.
- Astronomers use TDT when they need time put right for the Earth's uneven movements.
