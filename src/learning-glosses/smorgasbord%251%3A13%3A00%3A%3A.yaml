simpleMeaning: A buffet meal offering a wide spread of foods, from herring or smoked fish with bread through
  cheeses, pickled vegetables and jellied dishes to hot dishes.
scope: This means the buffet meal itself, not the figurative use for any mixed collection of things.
examples:
- The reception ended with a smorgasbord of herring, cheeses, pickled vegetables and hot dishes.
- He piled his plate high at the smorgasbord and went back for more.
