simpleMeaning: Heating acetic acid and glycerin together makes one of three liquids.
scope: Heating acetic acid and glycerin together gives three liquids, and this is one of them, not the
  acid or the glycerin on its own.
examples:
- When acetic acid and glycerin are heated together, acetin forms.
- The heated mix held acetin among its three liquids.
