simpleMeaning: A person who talks too much, saying silly things that annoy others
scope: A person who talks too much, saying silly things that annoy others; magpie, chatterbox, chatterer
  and babbler are other names for this sense, not a person who talks a lot but makes sense.
examples:
- Nobody wanted to sit next to the prater at dinner.
- The old prater went on and on about nothing at all.
