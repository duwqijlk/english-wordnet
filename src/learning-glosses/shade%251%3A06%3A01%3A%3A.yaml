senseId: 'shade%1:06:01::'
synsetId: 04189026-n
simpleMeaning: the dark parts in a picture or drawing that show where light does not fall, made with darker
  color or lines
scope: Dark parts drawn in a picture to show shadows, not a cover for a lamp and not the cool dark place
  out of the sun.
examples:
- The artist used soft shade to show the shadow under the tree.
- In her drawing, the shade on one side of the face makes it look round.
