simpleMeaning: Its lines stand out more on skin that has grown thick with this problem
scope: 'Another name for chronic eczema and eczema hypertrophicum: a skin problem that makes the skin
  thick and lined, not a short-lived rash and not a cut.'
examples:
- The doctor said the lichtenoid eczema had made his skin thick.
- She put cream on the lichtenoid eczema on her hands.
