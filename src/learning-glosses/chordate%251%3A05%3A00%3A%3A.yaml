simpleMeaning: Any animal that has a rod along its back (the notochord) or a backbone
scope: Any animal that has a rod along its back (the notochord) or a backbone; not an animal with no rod
  along its back and not a plant.
examples:
- A fish is a chordate because it has a backbone.
- All chordates have a rod along the back or a backbone.
