simpleMeaning: Between the small gland at the base of the brain and the part of the brain just above it
  runs a funnel-shaped stem.
scope: This funnel-shaped stem runs between the small gland at the base of the brain and the part of the
  brain just above it, and it is not the gland itself.
examples:
- The hypophyseal stalk sits between the pituitary gland and the hypothalamus.
- The hypophyseal stalk joins the gland at the base of the brain to the part above it.
