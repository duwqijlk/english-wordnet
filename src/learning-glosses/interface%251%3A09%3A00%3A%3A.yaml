senseId: 'interface%1:09:00::'
synsetId: 05772776-n
simpleMeaning: the ground two ideas or things share, where they change each other or link up with each
  other
scope: The shared ground where two ideas or fields meet and affect each other, not the surface between
  two things and not a computer part or a screen program.
examples:
- The interface between chemistry and biology is where many new ideas come from.
- She works at the interface of history and art.
