simpleMeaning: a doctor who treats illnesses of the ear, nose and throat
scope: 'Also called an otolaryngologist, an otorhinolaryngologist, and an ear-nose-and-throat doctor:
  a doctor for ear, nose and throat illness, not a doctor for the lungs and not a doctor for the skin.'
examples:
- The rhinolaryngologist looked at her sore throat and blocked ear.
- He was sent to a rhinolaryngologist for his nose bleeds.
