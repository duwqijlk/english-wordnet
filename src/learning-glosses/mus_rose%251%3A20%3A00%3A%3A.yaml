simpleMeaning: In the Old World, an upright plant that lives for years bears white or pink flowers and
  leaves that smell faintly sweet; it now grows in the United States too.
scope: Also called musk mallow, it is an upright plant of the Old World with white or pink flowers, now
  also found in the United States, not the tropical plant with yellow or pink to scarlet blooms.
examples:
- The mus rose bore white flowers with a faint sweet smell.
- Mus rose grows wild in parts of the United States.
