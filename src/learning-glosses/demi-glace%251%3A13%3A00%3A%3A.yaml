simpleMeaning: A sauce of Espagnole with more beef stock cooked down and dry wine or sherry added for
  taste
scope: A sauce of Espagnole with beef stock cooked down and wine or sherry; also called demi-glaze and
  demiglace, not a plain stock and not a white sauce.
examples:
- The chef spooned demi-glace over the roast beef.
- A little demi-glace gave the dish a deep, rich taste.
