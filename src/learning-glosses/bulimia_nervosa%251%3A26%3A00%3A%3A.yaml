simpleMeaning: A food sickness where one sways between fierce longing and hatred for food, seen in overeating,
  and then in fasts or self-made vomiting.
scope: This sense is also called binge-purge syndrome, binge-vomit syndrome, and bulimarexia, a food sickness
  where one sways between fierce longing and hatred for food, seen in overeating, and then in fasts or
  self-made vomiting.
examples:
- Bulimia nervosa sways between longing and loathing.
- The bulimia nervosa brings fasts and vomiting.
