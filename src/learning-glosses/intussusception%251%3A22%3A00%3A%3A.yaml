simpleMeaning: In biology, a cell's wall gets bigger in area when new bits of matter settle in between
  the bits already there
scope: In biology, a cell wall growing in area as new bits settle in between the bits already there; not
  the folding of an outer layer into a pocket.
examples:
- The biologist described intussusception as the way a cell wall grows in area.
- Intussusception lets new particles slip in between the old ones in the cell wall.
