simpleMeaning: A slick stuff put where two parts rub, so they move past each other with less drag.
scope: Also called lubricant, lube, and lubricator, this slick stuff is put where two parts rub, making
  their faces smooth so they slide with less drag.
examples:
- The mechanic spread lubricating substance on the hinge so the door would swing freely.
- A little lubricating substance on the chain kept the bicycle moving smoothly.
