simpleMeaning: the act of putting oil or a liquid like oil on something or someone
scope: The act of putting oil on someone or something; not the oil itself.
examples:
- The anointing of the king took place in the church, with oil put on his head.
- She watched the anointing, as oil was put on the baby's head.
