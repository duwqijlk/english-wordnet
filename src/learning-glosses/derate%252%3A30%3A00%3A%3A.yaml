simpleMeaning: To set a lower safe limit on how much power a piece of electrical equipment can carry
scope: To set a lower safe limit on the power a piece of electrical equipment can carry, not to switch
  it off and not to break it.
examples:
- The engineers had to derate the old motor in the summer heat.
- They will derate the transformer before the new line is added.
