simpleMeaning: a small thin piece that comes off when a thing is shaved, most often a piece of wood
scope: 'Also called sliver and shaving: a thin piece cut off, especially from wood; not the skin or peel
  cut from fruit or vegetables.'
examples:
- Thin parings of wood lay under the work table.
- She picked up a paring that had been shaved from the board.
