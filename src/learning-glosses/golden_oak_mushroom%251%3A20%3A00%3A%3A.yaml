scope: Also called shiitake or a shiitake mushroom, this is the east Asian fungus with a yellow or dark
  brown to blackish cap and a stem that cannot be eaten.
examples:
- We ate the golden oak mushroom.
- The golden oak mushroom had a dark brown cap.
