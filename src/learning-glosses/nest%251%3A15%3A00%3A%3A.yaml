simpleMeaning: a warm, soft, quiet place where a person can rest away from others
scope: A warm, soft, quiet place to rest away from others, not a group of bad people gathered in one place
  and not the act of settling down in a soft place.
examples:
- She made a nest of soft blankets in the corner of the room.
- The old chair by the fire was her favourite nest on cold nights.
