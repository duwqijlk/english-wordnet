simpleMeaning: A long-lived plant from Eurasia with pale pink flowers and curved pods, established in
  chalky grasslands of Britain and North America; an important fodder and honey crop in Britain.
scope: This is another name for the same pink-flowered fodder plant, not a different species or an ordinary
  clover.
examples:
- The field of sanfoin was full of pink flowers.
- Beekeepers value sanfoin for the honey it helps produce.
