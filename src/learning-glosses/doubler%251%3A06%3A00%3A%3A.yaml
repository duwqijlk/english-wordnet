simpleMeaning: An electronic device that makes the pressure or the rate of an input signal twice as great
scope: An electronic device that makes the pressure or the rate of an input signal twice as great, not
  a device that halves a signal and not a plain wire.
examples:
- The doubler raised the frequency of the input signal.
- Engineers added a doubler to the circuit.
