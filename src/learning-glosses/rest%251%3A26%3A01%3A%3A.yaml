simpleMeaning: a mild or indirect word for death, comparing lying in bed with lying in a grave
scope: This sense is a gentle way of speaking about death, not the printed symbol for silence in music
  and not a period of sleep or relaxation.
examples:
- She was laid to rest beside her parents in the village churchyard.
- The old fisherman had gone to his rest after a long life at sea.
