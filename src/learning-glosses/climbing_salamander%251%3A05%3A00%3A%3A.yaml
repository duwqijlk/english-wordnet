simpleMeaning: These four-legged animals of North America go up trees on strong legs, their long toes
  ending in somewhat flat squares
scope: This is one of several kinds of tree-living salamanders in North America, built for life in trees
  with strong legs and long flat-ended toes.
examples:
- The climbing salamander held on to the bark with its long toes.
- We saw a climbing salamander high in the branches.
