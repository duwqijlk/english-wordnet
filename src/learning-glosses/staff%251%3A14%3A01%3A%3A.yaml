simpleMeaning: the group of people who work for a leader or an organization and help do the job.
scope: This is not a long stick or pole, and it is not the verb meaning to supply workers.
examples:
- The manager called all her staff into the meeting room.
- Hospital staff worked through the night to help the injured.
