simpleMeaning: a rope or light chain used to hold back and control an animal
scope: 'Also called lead, also called tether: a rope or light chain for holding an animal, not a collar
  worn round the animal''s neck.'
examples:
- She held the dog's leash tightly as they crossed the busy road.
- He put a leash on the goat so it would not run away.
