simpleMeaning: A bad-smelling, fleshy tropical plant from Southeast Asia, grown for edible starchy underground
  stems or in greenhouses for big leaves and a dark red hood around its flower spike.
scope: One of three names for the same smelly Southeast Asian aroid, alongside devil's tongue and umbrella
  arum; it is not a real palm, nor taro.
examples:
- The snake palm's leaves filled the corner of the greenhouse.
- We could smell the snake palm from the doorway.
