simpleMeaning: great strength of feeling in the way a person speaks or writes
scope: 'Also called emphasis: great strength of feeling in speech or writing, not loudness alone and not
  anger alone.'
examples:
- She spoke with vehemence when she said the plan was unfair.
- The vehemence of his words showed how strongly he felt.
