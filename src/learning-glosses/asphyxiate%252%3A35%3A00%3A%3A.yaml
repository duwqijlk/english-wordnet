senseId: 'asphyxiate%2:35:00::'
synsetId: 01572009-v
simpleMeaning: to stop a person from getting oxygen (the part of air that the body needs to live) so that
  they cannot breathe
scope: 'Also called suffocate and smother: to stop a person from getting air so they cannot breathe; not
  the sense of dying from lack of air oneself, and not the sense of only making breathing hard.'
examples:
- The tight collar nearly asphyxiated the dog.
- Thick smoke in a small room could asphyxiate a child.
