senseId: 'severe_combined_immunodeficiency%1:26:00::'
synsetId: 14152294-n
simpleMeaning: Born with this sickness, a child lacks germ-fighting cells after a fault in one of several
  genes, catches sickness easily, and dies within a year or two without care.
scope: 'Also called severe combined immunodeficiency disease: a sickness a child is born with that weakens
  the germ-fighting cells, not a sickness caught later in life.'
examples:
- The child with severe combined immunodeficiency caught one sickness after another.
- Severe combined immunodeficiency can come from a fault in a single gene.
