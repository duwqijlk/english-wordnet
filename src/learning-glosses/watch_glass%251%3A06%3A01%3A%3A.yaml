simpleMeaning: a shallow dish used in a laboratory, as a top for a tall cup or as a dish for drying things
scope: A shallow dish used in a laboratory, as a top for a tall cup or as a dish for drying things; not
  a cup for drinking and not a beaker on its own.
examples:
- She covered the beaker with a watch glass.
- The watch glass held the crystals while they dried.
