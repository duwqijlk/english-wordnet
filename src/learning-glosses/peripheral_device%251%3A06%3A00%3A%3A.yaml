simpleMeaning: Outside the board that holds the part of a computer that does the thinking sits this piece
  of electronic gear
scope: 'Also called a peripheral or a computer peripheral: a piece of gear that works with a computer
  from outside its main board, not a part built into the board itself.'
examples:
- A printer is a peripheral device that sits outside the computer's main board.
- Disk drives are peripheral devices that plug into the computer from outside.
