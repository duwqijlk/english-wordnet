simpleMeaning: a green shrub from Chile that keeps its leaves all year and bears thin spikes of tiny white
  flowers
scope: This is a green shrub from Chile with thin spikes of tiny white flowers; bridal-wreath is another
  name for it, not a rose bush and not a lilac.
examples:
- The bridal wreath by the wall was covered in tiny white flowers.
- She planted a bridal wreath where it would get sun all day.
