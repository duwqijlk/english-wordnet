simpleMeaning: a sudden burst of power from one cloud to another cloud, or from a cloud to the earth,
  with a flash of light
scope: A sudden burst of power from cloud to cloud or from cloud to earth, with a flash of light, not
  just the flash of light on its own and not the noise that comes after it.
examples:
- Lightning struck the tall tree by the road.
- The lightning jumped from cloud to cloud.
