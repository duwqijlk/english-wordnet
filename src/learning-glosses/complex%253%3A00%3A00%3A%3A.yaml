simpleMeaning: Hard to understand or deal with because it is made of many parts that are connected to
  one another.
scope: This describes the structure of a thing, not a group of related things or buildings, and not a
  person's emotional difficulties.
examples:
- The human brain is a complex organ that scientists still do not fully understand.
- Building the bridge required a complex plan with many stages.
