simpleMeaning: Words or acts meant to confuse people, or that do confuse them
scope: Words or acts that confuse or are meant to confuse, not plain words and not a true rite with a
  clear sense.
examples:
- The contract was full of mumbo jumbo that nobody could follow.
- He called the whole ceremony mumbo jumbo.
