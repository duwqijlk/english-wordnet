simpleMeaning: an imagined line around the Earth that runs the same way as the equator and stays the same
  distance from it
scope: 'Also called parallel: an imagined line around the Earth, not freedom to act or think, and not
  the distance north or south from the equator.'
examples:
- On the map, the lines of latitude run across the page from side to side.
- The line of latitude near the top of the map is far from the equator.
