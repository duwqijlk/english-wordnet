simpleMeaning: A bush grown for its looks, from the east of India, often planted in the south of the United
  States
scope: A bush from eastern India often planted in the southern United States, also called a crepe myrtle
  and a crape myrtle; not a wild grass and not a tree grown for wood.
examples:
- The crepe flower bloomed all summer.
- We planted a crepe flower by the front steps.
