senseId: sibilant%5:00:00:soft:03
synsetId: 01160686-s
simpleMeaning: of speech sounds made by pushing air through a narrow opening, such as 'f', 's', 'z', or
  'th' in 'thin' and in 'then'
scope: This describes speech sounds made through a narrow opening, also called strident, continuant, fricative
  and spirant; it is not the noun for a consonant with a hissing sound.
examples:
- The 's' in 'sun' is a sibilant sound.
- Her speech has strong sibilant sounds at the start of many words.
