simpleMeaning: A bush of the south-east United States that gives a sore rash when it touches the skin
scope: A bush that gives a sore rash on touch, not a harmless bush and not a tree.
examples:
- Eastern poison oak gave him a sore rash where it touched his arm.
- An eastern poison oak grows as a bush in the south-east.
