simpleMeaning: the way a thing goes back to its first shape after it is pulled out long or pressed down
  small
scope: This is how well something goes back into shape; it is not a sudden sharp sound, and not a ginger
  biscuit.
examples:
- The old rubber band has lost its snap.
- This waistband still has plenty of snap and fits well.
