simpleMeaning: A child learning to swim stays up in the liquid with two air-filled bags joined together
  under the arms.
scope: They are a connected pair of air-filled bags that fit under a person's arms, keeping a child up
  in the liquid while learning to swim, not one bag worn on its own.
examples:
- The child wore water wings under the arms while learning to swim.
- With water wings on, a child learning to swim stays up in the liquid.
