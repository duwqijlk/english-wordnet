simpleMeaning: a solid piece with a sloped side, shaped like a V, that can be pushed between two things
  to push them apart
scope: A solid piece that pushes two things apart, not the large sandwich, not the mark above a letter,
  and not the golf club.
examples:
- She drove a wedge into the log to split it apart.
- A metal wedge was pushed into the crack to separate the two stones.
