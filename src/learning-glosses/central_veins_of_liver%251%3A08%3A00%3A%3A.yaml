simpleMeaning: These last small branches of the blood tubes of the blood-cleaning organ lie in its small
  parts and take in blood from its tiny blood spaces.
scope: Also called venae centrales hepatis, the last small branches of the blood tubes of the blood-cleaning
  organ; not the large blood tubes they branch from, and not a blood tube of the eye.
examples:
- The central veins of liver lie in the small parts of the organ.
- The central veins of liver take in blood from tiny blood spaces.
