simpleMeaning: In chemistry, a substance that starts a chemical change or makes it go faster, without
  itself being changed
scope: In chemistry, a substance that starts or speeds a chemical change without itself being changed;
  not the science tool that gives charged bits more speed and not a car pedal.
examples:
- The accelerator made the reaction go much faster.
- A small amount of accelerator started the change.
