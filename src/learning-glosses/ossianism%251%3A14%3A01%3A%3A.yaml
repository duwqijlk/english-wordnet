simpleMeaning: Writing in the manner of Ossian, above all in the grand old tales of heroes, made in recent
  times yet claiming to come from long ago
scope: This is writing in the manner of Ossian, above all in grand old tales of heroes, made in recent
  times yet claiming to come from long ago; writing that truly comes from long ago is a different kind.
examples:
- Scott's work shows the Ossianism of the first Celtic revival.
- The poem's Ossianism is clear in its grand old tales of heroes.
