senseId: 'obstructive_shock%1:26:00::'
synsetId: 14091163-n
simpleMeaning: A dangerous fall in the body's state, caused when something blocks the flow of blood.
scope: A dangerous state caused when blood flow is blocked; not a shock from a sudden fright, and not
  a fall in blood from loss of blood.
examples:
- The patient went into obstructive shock when a clot blocked the vessel.
- Doctors treated the obstructive shock by clearing the blockage.
