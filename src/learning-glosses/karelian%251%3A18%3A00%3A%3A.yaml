simpleMeaning: A member of the Finnish people who live in Karelia in the north-west of European Russia.
scope: One of the Finnish people of Karelia; also called Carelian; the person, not the Finnic tongue of
  the same name.
examples:
- A Karelian family had lived in Karelia for many years.
- The Karelian spoke of his home in the north-west of Russia.
