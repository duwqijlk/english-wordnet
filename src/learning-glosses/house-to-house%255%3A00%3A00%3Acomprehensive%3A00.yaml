simpleMeaning: Going to each home in turn and leaving none out.
scope: Work or a visit that covers each home in turn, leaving none out; not a visit to one home only and
  not a search of a whole town at once.
examples:
- The charity made a house-to-house collection in the village.
- Police carried out a house-to-house search of the street.
