simpleMeaning: Small sea crustaceans (animals with hard outer cases) that sweep food with feathery limbs;
  they swim free when young, then grow a hard shell and cling to underwater surfaces.
scope: Another name for a barnacle; the shelled sea animal, not the goose.
examples:
- A cirripede sweeps the water with feathery limbs.
- Cirripedes crowd the tidal rocks.
