simpleMeaning: a fairly small animal that bears live young and feeds them milk, with one pair of front
  teeth that keep growing and are made for biting through hard things
scope: A small gnawing animal such as a mouse or a rat, not a rabbit, which has two pairs of front teeth.
examples:
- Rodents had chewed through the grain sacks in the barn.
- The rodent gnawed a hole in the wooden box to reach the seeds.
