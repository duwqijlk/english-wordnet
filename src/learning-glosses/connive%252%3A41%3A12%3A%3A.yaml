senseId: 'connive%2:41:12::'
synsetId: 02591445-v
simpleMeaning: to encourage an illegal or criminal act, or to agree to it
scope: To help or agree to a crime, not to make secret plans in a dishonest way to get what you want.
examples:
- The official connived at the illegal sale and took money to say nothing.
- She connived in the crime by agreeing not to report it.
