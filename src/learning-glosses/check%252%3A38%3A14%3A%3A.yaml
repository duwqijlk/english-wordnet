simpleMeaning: To give up the animal being hunted, turn, and chase a lesser one instead.
scope: This is a hunting term, not examining something for accuracy, not making certain of something,
  not stopping in a chase when the scent is lost, not holding back a danger or an enemy, not marking a
  box with a tick, not leaving bags for safekeeping, not the betting move, not the chess move, and not
  the hockey block.
examples:
- The young hound checked and went after a rabbit instead of the stag.
- When a smaller animal broke cover, the dogs checked and chased it.
