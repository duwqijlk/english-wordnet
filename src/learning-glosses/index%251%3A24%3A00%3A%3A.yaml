senseId: 'index%1:24:00::'
synsetId: 13873264-n
simpleMeaning: A scale with numbers on it. You use it to compare things that can change, either with each
  other or with one set number.
scope: This is a scale for comparing numbers, not the list of names and topics at the back of a book,
  and not a number got from facts to show change over time.
examples:
- On this index the numbers run from 0 to 100, so the schools can be compared with each other.
- The health index compares scores for different hospitals with one set number.
