simpleMeaning: Faulty and unable to do its job, as when a machine or device fails; 'busted' is the informal
  word.
scope: A machine or device that cannot do its job; it is not something cracked or in pieces, something
  missing a part, a group thrown into confusion, or an animal trained to obey.
examples:
- The washing machine is broken, so we will wash the clothes by hand.
- My phone is broken and will not turn on.
