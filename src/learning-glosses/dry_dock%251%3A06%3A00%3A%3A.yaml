simpleMeaning: A large basin from which water can be pumped out, used to build ships or to mend a ship
  below its water line.
scope: A large basin from which water can be pumped out, used to build ships or to mend a ship below its
  water line; drydock and graving dock are other names for this sense, not a floating basin and not a
  harbour.
examples:
- The ship was taken into dry dock for repairs.
- They built the new ferry in a dry dock.
