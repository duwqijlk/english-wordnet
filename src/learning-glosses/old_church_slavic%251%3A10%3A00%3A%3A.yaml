simpleMeaning: The tongue into which the Bible was put in the 800s, the tongue of the Slavs of long ago.
scope: Also called Church Slavic, Church Slavic language, Old Bulgarian, Old Bulgarian language, Old Church
  Slavic language, Old Church Slavonic and Old Church Slavonic language; it is the old tongue of the Slavs
  in which the Bible was put in the 9th century.
examples:
- Old Church Slavic was the tongue of the Bible in the 9th century.
- The Bible was put into Old Church Slavic in the 9th century.
