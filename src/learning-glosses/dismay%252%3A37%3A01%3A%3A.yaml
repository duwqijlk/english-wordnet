simpleMeaning: to make someone feel low and sad, so they lose hope and cheer
scope: 'Also called depress: to make someone feel low and sad; it is not fear from danger, and not filling
  someone with fear or surprise.'
examples:
- The long wait for news dismayed her, and she began to lose hope.
- He was dismayed by the team's poor results and sat quietly with his head down.
