simpleMeaning: a big, strong bear with brown-yellow fur that lives in the high land of western North America
scope: This is the large North American bear itself, not a person with grey hair and not a smaller bear
  from another place.
examples:
- A grizzly came down from the hills to drink at the river.
- We saw a grizzly with two young bears near the lake.
