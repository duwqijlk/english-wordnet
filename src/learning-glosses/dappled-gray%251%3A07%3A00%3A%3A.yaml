simpleMeaning: A grey colour with darker grey spots spread over it.
scope: This is grey with a spotty pattern of darker grey marks, also called dapple-gray, dapple-grey,
  and dappled-grey, not plain grey or grey with white spots.
examples:
- The dappled-gray horse stood in the field.
- Her dappled-gray coat has darker grey marks all over it.
