simpleMeaning: to fold or gather cloth so that it forms a strip of folds
scope: This sense is folding or gathering cloth in this way, not the strip of folded cloth itself and
  not walking in a proud way to show off.
examples:
- She ruffled the edge of the curtain cloth with small, neat folds.
- He ruffled the cloth around the neck of the dress.
