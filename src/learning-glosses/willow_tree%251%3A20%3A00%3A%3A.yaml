simpleMeaning: Any of many plants of the genus Salix, a group of plants that lose their leaves in winter
  and grow as tall woody plants or bushes
scope: This is any of many plants of the genus Salix, a group of plants that lose their leaves in winter;
  willow is another name for this sense, not a plant of another genus and not one single kind of willow.
examples:
- The willow tree by the pond loses its leaves in winter.
- A willow tree and a bush of the same genus grew side by side.
