simpleMeaning: The distance a vehicle goes on one fixed amount of petrol or diesel fuel.
scope: The distance a vehicle goes on one fixed amount of petrol or diesel fuel; not the speed of the
  vehicle and not the size of the tank.
examples:
- Her car does forty miles per gallon on the motorway.
- Miles per gallon is the usual way to talk about how much fuel a car uses.
