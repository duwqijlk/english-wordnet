simpleMeaning: a building with rooms where people change their clothes for swimming
scope: A building with rooms where people change their clothes to swim; bathhouse is another name for
  this sense, and it is not a machine or a place for washing.
examples:
- They changed in the bathing machine before walking down to the sea.
- We left our clothes in the bathing machine while we swam.
