simpleMeaning: a long-lived Old World herb with blue flower heads spread like rays, grown for its root
  and for heads of crisp leaves eaten in salads
scope: Also called chicory and chicory plant; a blue-flowered herb grown for root and leaves, not a lettuce
  and not a flower grown only to look at.
examples:
- We grow succory for its crisp leaves.
- The succory in the garden has blue flower heads.
