senseId: lenient%5:00:00:permissive:01
synsetId: 01767671-s
simpleMeaning: not strict; willing to allow people to do things and not quick to punish them
scope: This sense is about not being strict and allowing things, not the other sense of this word that
  is about showing kindness and mercy in how you treat a person.
examples:
- The teacher was lenient and let the class hand in their work a day late.
- Many parents are too lenient and let their children stay up very late.
