simpleMeaning: To make a person clean in spirit, free from sin or guilt.
scope: To make a person free from sin or guilt, not clearing the bowels, not throwing up, not washing
  out with liquid, and not the sudden removal of people.
examples:
- The priest purged her of guilt after her confession.
- Years of prayer purged him of his old sins.
