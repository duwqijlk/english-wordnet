simpleMeaning: A man chosen as head of the Roman Catholic Church against another man held to be the true
  head.
scope: A rival head of the Church, chosen against the man held to be the true head; not the true head
  himself and not a bishop who serves under him.
examples:
- During the Great Schism, antipopes lived in Avignon.
- The council refused to accept the antipope as the true head of the Church.
