simpleMeaning: One of the tongues of the Tungusic group is spoken by the Evenki in eastern Siberia.
scope: This Tungusic tongue of the Evenki in eastern Siberia is also called Evenki, Ewenki, Tungus, Tungus
  language, or Tunguz language, and Evenki language and Ewenki language are other names for the same tongue.
examples:
- Tunguz is spoken by the Evenki in eastern Siberia.
- Many Evenki speak Tunguz at home.
