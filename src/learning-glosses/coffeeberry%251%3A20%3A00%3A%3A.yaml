simpleMeaning: a green shrub of the western United States that keeps its leaves all year and bears small
  red or black fruit
scope: This is a shrub of the western United States that keeps its leaves all year and bears small red
  or black fruit; not the coffee tree of warm lands in Africa and Asia.
examples:
- The coffeeberry by the fence keeps its leaves all winter.
- Small red fruit hung on the coffeeberry near the house.
