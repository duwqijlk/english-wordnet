senseId: punishable%5:00:00:illegal:00
synsetId: 01407374-s
simpleMeaning: of an act that breaks the law, one that the law says a person can be made to suffer for
scope: 'Said of an act that breaks the law: the law says the person who did it can be made to suffer for
  it. Not the sense that says a person should suffer in this way because he or she has done wrong.'
examples:
- Stealing from a shop is a punishable act in every country.
- The crime is punishable by a long time in jail.
