simpleMeaning: looking like leather, or made to look like leather, tough but easy to bend
scope: Leather-like material that is tough but easy to bend; leathered, leatherlike and leathery are other
  names for this sense. Not soft cloth and not stiff wood.
examples:
- The coriaceous leaves stayed firm in the wind.
- This coriaceous cover feels like leather but bends easily.
