senseId: stupefied%5:00:00:surprised:00
synsetId: 02366833-s
simpleMeaning: so very surprised that a person feels as if they cannot speak
scope: 'Also called dumbfounded, flabbergasted, dumbstruck, thunderstruck and dumfounded: so surprised
  that a person feels as if they cannot speak, not the sense where the mind feels numb, most often after
  a shock.'
examples:
- She stood stupefied when she heard she had won first prize.
- He was stupefied by the sudden news and said nothing.
