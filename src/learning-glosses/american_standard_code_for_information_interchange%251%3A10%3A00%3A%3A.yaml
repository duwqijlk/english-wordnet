simpleMeaning: In computer work, a set of signs for swapping data between computers of different firms;
  each character is shown by 7 ones and zeroes; used in most small computers.
scope: 'Also called ASCII: in computer work, a set of signs for swapping data between computers of different
  firms, with each character shown by 7 ones and zeroes, used in most small computers, set apart from
  other sets of signs by its 7-digit characters and its use across firms.'
examples:
- The American Standard Code for Information Interchange lets computers share text.
- American Standard Code for Information Interchange is used in most small computers.
