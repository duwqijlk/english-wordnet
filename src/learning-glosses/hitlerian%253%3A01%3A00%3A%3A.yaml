simpleMeaning: Used for things that call Adolf Hitler or his Nazi rule in Germany to mind.
scope: This word covers anything that brings Hitler or his Nazi rule to mind, from a way of rule to a
  look, act, or way of speaking tied to that time in Germany.
examples:
- The Hitlerian salute was used at Nazi meetings.
- His Hitlerian style of rule frightened the whole country.
