simpleMeaning: A round shape made of rings set one inside another, as when leaves or flower petals curl
  round
scope: A round shape of rings set one inside another, with roll, curl, scroll and coil as other names
  for this sense, not a curl of hair and not a kind of butterfly.
examples:
- A ringlet of petals curled round the centre of the flower.
- The leaves formed a ringlet of rings one inside another.
