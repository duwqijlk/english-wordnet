simpleMeaning: A cell of the cleaning tissue of the brain and spinal cord that can start to eat waste
  from nerve tissue.
scope: A cell of the cleaning tissue of the brain and spinal cord that can start to eat waste from nerve
  tissue; not a nerve cell and not a cell of the blood.
examples:
- A microgliacyte can start to eat waste from nerve tissue.
- The microgliacyte is a cell of the cleaning tissue of the brain and spinal cord.
