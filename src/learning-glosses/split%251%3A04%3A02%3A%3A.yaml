simpleMeaning: stretching the legs out in a straight line along the ground, with the body straight up,
  one leg in front and the other leg in back
scope: This is a body position with the legs in front and back, not the sweet dish, not the bowling pins,
  and not the act of tearing something.
examples:
- The dancer did a split with one leg in front and one behind.
- She can do the splits on the floor without help.
