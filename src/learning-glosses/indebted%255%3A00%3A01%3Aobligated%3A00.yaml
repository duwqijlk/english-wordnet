simpleMeaning: feeling that one owes thanks or praise to someone else for help or kindnesses
scope: Owing thanks to someone for help, not owing money and not being forced to obey.
examples:
- I am indebted to her for all her help.
- He felt indebted to the doctor who saved his life.
