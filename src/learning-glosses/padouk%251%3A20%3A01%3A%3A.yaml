simpleMeaning: a tree from south-east Asia with reddish wood marked with dark spots or stripes
scope: A tree from south-east Asia with reddish wood marked with dark spots or stripes; amboyna and padauk
  are other names for this sense, and it is not a tree with plain pale wood or a tree from Africa.
examples:
- Padouk wood is prized for its reddish colour.
- The cabinet was made from padouk.
