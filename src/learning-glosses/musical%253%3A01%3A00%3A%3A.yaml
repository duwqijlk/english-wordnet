simpleMeaning: full of music, or able to make music
scope: About something full of music, or able to make music, like an evening or an instrument; not about
  a person who is good at music or loves it, and not the play or film with singing and dancing.
examples:
- It was a musical evening, with songs and tunes all night long.
- These musical instruments can make many kinds of sound.
