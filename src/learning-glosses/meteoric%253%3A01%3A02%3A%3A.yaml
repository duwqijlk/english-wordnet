simpleMeaning: To do with what happens in the air above the earth, especially the weather.
scope: Also called meteorological, this is to do with what happens in the air above the earth, especially
  the weather; not to do with meteors or lumps of rock from space, and not like a meteor in speed or brightness
  or in lasting only a short time.
examples:
- The data were meteoric, drawn from weather and the air above the earth.
- The phenomena were meteoric, part of the weather and the air above the earth.
