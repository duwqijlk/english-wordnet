simpleMeaning: The way the amount of goods for sale and the wish to buy them shapes how buying and selling
  works in a country
scope: How buying and selling is shaped by supply and demand, not by a government order and not by one
  company alone.
examples:
- Market forces pushed the price of oil up.
- The minister said market forces, not new laws, set the price of bread.
