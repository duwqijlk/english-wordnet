simpleMeaning: To ask someone questions for a report on television, in a newspaper, or on the radio.
scope: This is what a reporter does, not what a job candidate does at a hiring meeting, and not the noun
  for the event.
examples:
- She interviewed the mayor about the new housing plan.
- The reporter interviewed several witnesses at the scene.
