synsetId: 00403618-r
simpleMeaning: In a way that shows no sense or reason.
scope: Also called mindlessly, this is acting in a way that shows no sense or reason, not the sense of
  doing a thing with no meaning or purpose.
examples:
- The temples were senselessly destroyed, though they had stood for centuries.
- They senselessly tore down the old hall for no good reason.
