simpleMeaning: A state where strong feelings burst out in wild ways and the senses and movements of the
  body stop working right.
scope: Also called hysteria, this is a state of wild feeling with troubled senses and movement.
examples:
- Her hysterical neurosis left her shaking and unable to feel her hands.
- Doctors said his hysterical neurosis made his legs give way when he grew upset.
