simpleMeaning: to fill a person with a very strong, high feeling
scope: 'Also called thrill, exhilarate, inebriate and beatify: this sense is about filling a person with
  a strong, high feeling, not about raising a person to a higher rank or praising them greatly.'
examples:
- The music exalted her, and she felt full of joy and wonder.
- He was exalted by the beauty of the mountains at sunrise.
