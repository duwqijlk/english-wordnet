senseId: 'apodeme%1:05:00::'
synsetId: 01907762-n
simpleMeaning: Inside the hard outer shell of a jointed-legged animal, a ridge-like part grows inward
  to hold up the inner organs and give muscles places to fasten on.
scope: This ridge-like part grows inside the hard shell of a jointed-legged animal, and is not the shell
  itself.
examples:
- The apodeme gives the muscles places to fasten on inside the shell.
- An apodeme holds up the inner organs of the jointed-legged animal.
