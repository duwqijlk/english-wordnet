simpleMeaning: a rough and bitter way of acting or speaking
scope: A rough and bitter way of acting, also called bitterness, acrimony, tartness and acerbity; not
  the illness that makes the skin and eyes yellow, and not the verb sense.
examples:
- He spoke with jaundice, in a rough and bitter way to everyone.
- Her jaundice showed in the cold, bitter way she answered every question.
