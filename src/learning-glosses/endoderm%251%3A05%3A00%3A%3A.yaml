simpleMeaning: The lining of the gut and the airways grows from the deepest layer of cells in a very young
  embryo.
scope: This is also called endoblast, entoblast, entoderm, and hypoblast, and it is the deepest layer
  of cells in a very young embryo, not the outer layer.
examples:
- The endoderm will form the lining of the gut.
- In the young embryo, the endoderm lies beneath the outer layers.
