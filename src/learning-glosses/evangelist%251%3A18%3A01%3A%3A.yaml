simpleMeaning: 'When written with a capital letter, any of the four spiritual leaders held to have written
  the Gospels of the New Testament: Matthew, Mark, Luke and John'
scope: This is one of the four writers of the Gospels, not a preacher of today and not a writer of another
  book of the Bible.
examples:
- The Evangelist Matthew wrote one of the four Gospels.
- St John the Evangelist is shown with an eagle.
