simpleMeaning: The fielding spot, on a baseball side, between second base and third.
scope: This sense is also called short, for the fielding spot, on a baseball side, between second base
  and third, where short is the baseball job of guarding the area between second and third base, unlike
  the sense for, in baseball, the person who plays the shortstop spot.
examples:
- The shortstop is the fielding spot between second base and third.
- Shortstops guard the fielding spot.
