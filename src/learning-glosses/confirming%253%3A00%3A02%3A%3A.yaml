simpleMeaning: Showing that a suspected illness or germ is really there.
scope: Showing that a suspected illness or germ is really there, with positive as another name for this
  sense, and not a test that merely suggests something might be there.
examples:
- A confirming test showed the illness was really there.
- The doctor waited for a confirming result before starting treatment.
