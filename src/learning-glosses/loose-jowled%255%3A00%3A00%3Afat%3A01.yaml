simpleMeaning: With folds of flesh hanging down below the chin or lower jaw.
scope: This means having folds of flesh hanging down below the chin, not simply having a fat face and
  not having a beard; jowly and double-chinned are other names for this sense.
examples:
- The loose-jowled old dog slept by the fire.
- His loose-jowled face made him look older than he was.
