simpleMeaning: a tiny spore-making lump, like a soft pad or a blister, made of a mat of fine threads that
  some fungi grow on a host
scope: A small spore-making lump some fungi grow on a host, not a mushroom cap or a spore sac.
examples:
- The acervulus forms a small cushion on the diseased leaf.
- Under the lens, an acervulus looks like a tiny blister of threads.
