senseId: 'isogone%1:15:00::'
synsetId: 08507850-n
simpleMeaning: A line joining places on the Earth's surface where a compass needle points away from true
  north by the same amount
scope: A line joining places where a compass needle points away from true north by the same amount; isogonal
  line and isogonic line are other names for this sense, not a line of equal needle dip and not a weather
  line.
examples:
- The isogone on the chart joins places with the same compass error.
- Pilots follow the isogone to correct for compass drift.
