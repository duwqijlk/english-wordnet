simpleMeaning: This bushy plant of central North America lives a single year and grows where it is not
  wanted, bearing greenish blooms and seeds with flat flaps at their sides.
scope: Also called tumbleweed, it belongs with the bushy plants of central North America that live a single
  year.
examples:
- The winged pigweed grew thick and bore greenish blooms.
- Greenish blooms marked the winged pigweed among the other plants.
