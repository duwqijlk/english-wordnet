simpleMeaning: one of the four sharp pointed bits for biting, two in each jaw, between the front cutting
  ones and the back grinding ones
scope: This is a pointed biting tooth between the front and back teeth; eye tooth, canine, canine tooth,
  cuspid and dogtooth are other names for this sense; not a front cutting tooth and not a back grinding
  tooth.
examples:
- His eyetooth was longer than the teeth beside it.
- The dentist checked her eyetooth for damage.
