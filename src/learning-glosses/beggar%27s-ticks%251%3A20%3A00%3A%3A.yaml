simpleMeaning: Prickly fruits that cling to fur and clothing grow on any of several yellow-flowered plants
  of the group Bidens.
scope: This is one of several plants of the group Bidens, with yellow flowers and prickly fruits that
  cling to fur and clothing; beggar-ticks, bur marigold, burr marigold and sticktight are other names
  for this sense.
examples:
- Prickly beggar's-ticks clung to his trousers.
- The beggar's-ticks bore yellow flowers and prickly fruits.
