simpleMeaning: one gene stops another gene from showing its effect, when the two genes have no link to
  each other
scope: 'Also called hypostasis: one gene holding back another gene that has no link to it, not a gene
  changing another gene''s code and not two genes working together.'
examples:
- Epistasis hid the effect of the second gene in the cross.
- The epistasis in the mice meant the coat colour gene never showed.
