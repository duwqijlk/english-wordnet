simpleMeaning: A belief that Europe should form one shared body in rule, way of life, peoples or races.
scope: It is a belief that Europe should form one shared body in rule, way of life, peoples or races;
  it is about what should be, not about Europe as it is now.
examples:
- Pan-Europeanism calls for closer ties across Europe.
- Supporters of Pan-Europeanism want one shared European body.
