simpleMeaning: to do with the measuring of amounts in a chemical change
scope: It concerns the amounts in a chemical change, not how fast the change runs and not the heat the
  change gives out or takes in.
examples:
- The stoichiometric ratio tells how much of each substance reacts.
- They checked the stoichiometric amounts before mixing the chemicals.
