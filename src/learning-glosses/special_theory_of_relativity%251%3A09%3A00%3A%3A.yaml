simpleMeaning: 'one account in physics: light in empty space always moves at the same speed, and the laws
  of physics stay the same in every system moving at a steady speed'
scope: Also called special relativity and the special relativity theory, this is one account in physics
  with two fixed points about light speed and physics laws.
examples:
- The special theory of relativity holds that light in empty space always moves at the same speed.
- He studied the special theory of relativity to learn why physics laws stay the same in every steady
  system.
