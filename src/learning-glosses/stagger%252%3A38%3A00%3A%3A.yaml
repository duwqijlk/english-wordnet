simpleMeaning: to walk as if one cannot keep one's steps under control
scope: To walk as if one cannot keep one's steps under control, also called lurch; not a walk that is
  not steady, and not a shock that leaves one stunned.
examples:
- The drunken man staggered into the room.
- He staggered down the hall and caught the wall.
