simpleMeaning: Covering a thing with liquid, by pouring the liquid on.
scope: 'Also called soak, douse, drench, sop, and dowse: covering a thing with liquid by pouring it on,
  not dipping a thing briefly into liquid, not pickled pork, and not a person who drinks too much.'
examples:
- She soused cold water over his hot face.
- He soused the plants with water from the can.
