simpleMeaning: to choose in an election or meeting by marking a paper or raising a hand.
scope: This is a formal choice in an election or meeting, not a casual statement of opinion.
examples:
- Most people voted for the new mayor.
- At the meeting, we voted for the plan with the lower cost.
