simpleMeaning: A creeping, mat-forming weed with bright yellow flowers, grown for edible, slightly sour
  leaves eaten raw or cooked, especially in Indian, Greek and Middle Eastern food; it grows worldwide.
scope: The edible weed also known as pussley, pussly, verdolaga or verdolagas, not an ornamental garden
  flower and not another leafy salad crop.
examples:
- Common purslane sprouted between the tomato plants.
- She picked common purslane to add crunch to the salad.
