simpleMeaning: A machine gun is fed by these bullets, most often small, carried on bendable strips linked
  one to the next.
scope: Also called a belt and belt ammunition, these bullets, most often small, are carried on bendable
  strips linked one to the next to feed a machine gun.
examples:
- The belted ammunition fed the machine gun in bendable linked strips.
- They loaded the belted ammunition into the gun.
