simpleMeaning: In Roman Catholic tradition, a name given to 33 holy men and women known for sound teaching
  about God.
scope: A title given to 33 saints for sound teaching, also called Doctor; not a doctor who treats sick
  people and not a university teacher.
examples:
- Thomas Aquinas is a Doctor of the Church.
- The Doctor of the Church wrote much about God.
