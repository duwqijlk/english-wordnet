simpleMeaning: A soldier who has joined the armed forces and serves among the ordinary soldiers in the
  ranks.
scope: A soldier serving in the ranks; not an officer who was once an ordinary soldier and has been given
  a commission.
examples:
- The ranker stood in line with the rest of their platoon.
- Every ranker in the company was given a new kit bag.
