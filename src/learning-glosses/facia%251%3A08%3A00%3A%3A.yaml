simpleMeaning: Muscles, organs, and other parts are held apart or tied together by this flat sheet or
  strip of tough, stringy tissue.
scope: A sheet of tissue that holds muscles and organs in place, not the skin or a single muscle; also
  called fascia.
examples:
- The facia holds the muscles of the thigh in place.
- Surgeons cut through the facia to reach the organs beneath.
