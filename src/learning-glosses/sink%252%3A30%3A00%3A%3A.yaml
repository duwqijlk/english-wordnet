simpleMeaning: to drop hard or all at once, or to become much lower
scope: A sharp drop in amount or value, for which slump and fall off are other names, not going under
  the surface or moving down to a lower place.
examples:
- House prices sank sharply after the boom ended.
- The company's shares sank to a five-year low.
