simpleMeaning: The part of the study of the mind that works out, in numbers, how what the senses take
  in links to what a person feels
scope: The part of the study of the mind that links, in numbers, what the senses take in to what a person
  feels; not the study of the senses alone, and not the study of thoughts alone.
examples:
- In psychophysics, she measured how a louder sound changed what people said they heard.
- His psychophysics course showed how small changes in light link to changes in what we see.
