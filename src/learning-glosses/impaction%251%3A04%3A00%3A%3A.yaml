simpleMeaning: Two things hit each other hard when one of them smashes into the other
scope: A hard hit between two things, also called impingement; not a medical blockage and not a tooth
  stuck in its socket.
examples:
- The impaction of the two cars left a deep dent in the door.
- The crash test showed the impaction at the moment the car hit the wall.
