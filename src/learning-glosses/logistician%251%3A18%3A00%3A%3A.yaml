simpleMeaning: A person with skill in planning how supplies are moved and stored
scope: A person skilled in planning the movement and storing of supplies, not the supplies themselves
  and not a soldier who moves them.
examples:
- The logistician planned the route for food and fuel to reach the camp.
- As a logistician, she knew how to keep the stores moving on time.
