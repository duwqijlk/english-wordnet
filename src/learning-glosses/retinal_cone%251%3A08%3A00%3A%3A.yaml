simpleMeaning: a cell in the back of the eye that picks up bright light and colour
scope: 'Also called a cone and a cone cell: a cell in the eye that picks up bright light and colour, not
  a rod cell that works in dim light and not the lens of the eye.'
examples:
- A retinal cone lets the eye pick up bright light and colour.
- Damage to the retinal cones can make bright light hard to bear.
