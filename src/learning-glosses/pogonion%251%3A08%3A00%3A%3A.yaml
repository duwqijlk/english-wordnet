simpleMeaning: The point on the front of the chin that sticks out most, as marked when the skull is measured
scope: A marked point on the front of the chin, not any other point on the face and not the chin itself.
examples:
- The doctor marked the pogonion on the front of the chin.
- The pogonion is the point on the chin that sticks out most.
