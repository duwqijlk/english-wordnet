simpleMeaning: hard, strong, yellow-brown wood that lasts a long time, does not let insects harm it or
  change shape, and is used for furniture and for building ships
scope: This hard wood is also called teakwood; it is the wood, not the tall tree it comes from.
examples:
- They made the table from strong teak that will last for years.
- The ship was built with teak because insects do not harm it and it keeps its shape.
