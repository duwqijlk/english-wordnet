simpleMeaning: Any of many plants of the cool north with light soft wood and flowers in long soft hanging
  strings
scope: Any of many plants of the cool north with light soft wood and flowers in long soft hanging strings;
  poplar is another name for this sense, not a plant of hot lands and not one with hard heavy wood.
examples:
- A poplar tree stood by the river.
- Poplar trees grow fast in the cool north.
