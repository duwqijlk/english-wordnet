simpleMeaning: A pond made by damming a stream, so the held-back water can turn a mill wheel.
scope: A pond made by damming a stream, so the held-back water can turn a mill wheel, not a natural lake
  and not a reservoir for drinking water.
examples:
- The millpond lay still behind the old mill.
- Ducks swam on the millpond at dawn.
