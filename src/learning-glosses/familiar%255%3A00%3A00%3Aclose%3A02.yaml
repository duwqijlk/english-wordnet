simpleMeaning: On warm, trusting terms with someone through shared interests and a friendship already
  in place.
scope: The close, affectionate sense (also called intimate), not the common-and-ordinary adjective or
  the noun for a servant or spirit.
examples:
- After a year in the same office, the two women were on familiar terms.
- He is on familiar terms with most of the people in the village.
