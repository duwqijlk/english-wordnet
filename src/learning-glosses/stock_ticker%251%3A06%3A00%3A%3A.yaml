simpleMeaning: A printing machine that by itself prints share prices on a long strip of paper
scope: A printing machine that by itself prints share prices on a long strip of paper, also called a ticker;
  not a machine that prints tickets and not a share price itself.
examples:
- The stock ticker printed the share prices on tape.
- In the old days, a stock ticker chattered all day in the office.
