simpleMeaning: a flat thin piece that guides or holds back the flow of a liquid, gas, or power
scope: 'Also called a baffle: a flat plate that guides the flow of a liquid, gas, or power, not a wall
  that blocks a room and not a board for games.'
examples:
- The baffle board in the tank slowed the water as it moved past.
- Workers fitted a baffle board to guide the hot air through the vent.
