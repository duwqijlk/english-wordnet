simpleMeaning: to change a system of counting or measuring to one based on tens
scope: To move a system to one based on tens, also called decimalize; not changing fractions into decimals,
  and not changing the coins alone.
examples:
- The country decimalised the currency in 1975.
- The government decimalised weights and measures in the 1970s.
