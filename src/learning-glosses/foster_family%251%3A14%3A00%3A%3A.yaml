simpleMeaning: The people who take in and bring up a young person who is not their own
scope: This is the people who take in and bring up a young person who is not their own; it is not the
  young person's own parents and not a family who take a child as their own by law.
examples:
- The foster family gave him a warm home.
- She stayed with a foster family for two years.
