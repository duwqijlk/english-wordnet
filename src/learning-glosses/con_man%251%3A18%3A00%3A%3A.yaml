simpleMeaning: a male cheat who wins the trust of the person he cheats and then takes their money
scope: A male cheat who wins a victim's trust first, and confidence man is another name for this sense,
  not a female cheat and not a plain thief.
examples:
- The con man posed as a bank clerk to win the old man's trust.
- She realised too late that the con man had taken her savings.
