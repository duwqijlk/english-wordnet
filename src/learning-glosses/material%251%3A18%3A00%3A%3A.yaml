simpleMeaning: A person considered good enough to be accepted into a group or hired for a job.
scope: This is the noun for a suitable candidate, not the adjective for worldly rather than spiritual
  interests, not the adjective for being made of matter, not the adjective for being directly relevant
  to a court case, not the adjective for bodily welfare, not the adjective for having physical form, not
  the adjective for something real rather than imagined, not the noun for a physical substance, not the
  noun for information used to make something, not the noun for woven cloth, and not the noun for supplies
  needed for a task.
examples:
- The coach said the young swimmer was Olympic material.
- After the interview, they agreed she was management material.
