simpleMeaning: a moth from the East that gives brownish silk
scope: This is a moth from the East that gives brownish silk, also called tussah, tusser, tussore and
  tussur; not a moth that makes white silk and not a butterfly.
examples:
- Brownish silk came from the tusseh moths on the farm.
- Tusseh silk has a warm brown colour.
