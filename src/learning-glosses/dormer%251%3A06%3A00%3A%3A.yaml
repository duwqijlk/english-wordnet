senseId: 'dormer%1:06:00::'
synsetId: 03229306-n
simpleMeaning: a part built out from a sloping roof, topped by a small roof that slopes on two sides,
  and holding an upright window
scope: 'Also called dormer window: this is the whole part that sticks out from the roof, not just the
  window in it.'
examples:
- The bedroom has a dormer that lets in light from the roof.
- They built a dormer so the top room could have an upright window.
