simpleMeaning: Built from separate parts, with joints that hold the parts together
scope: This sense means made of parts held together by joints, also called articulate; it is not one solid
  piece with no joints.
examples:
- An articulated bus bends in the middle where its two parts join.
- The toy has articulated arms that move at the joints.
