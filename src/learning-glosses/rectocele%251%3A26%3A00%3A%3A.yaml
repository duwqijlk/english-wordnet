simpleMeaning: After giving birth weakens the muscles of the pelvis, the end of the gut can push out of
  place and bulge into the vagina.
scope: 'Also called a proctocele: the end of the gut bulges into the vagina, a weakness that can follow
  giving birth.'
examples:
- The doctor said a rectocele can follow giving birth.
- She was told the rectocele came from weak muscles in the pelvis.
