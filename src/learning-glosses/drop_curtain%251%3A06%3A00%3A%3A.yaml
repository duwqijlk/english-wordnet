simpleMeaning: a cloth hung above a stage, often used as the background for a scene, that can be let down
  or pulled up
scope: 'Also called a drop or a drop cloth: a stage cloth that moves up and down, not the painter''s sheet
  that covers a floor.'
examples:
- The drop curtain came down slowly at the end of the first act.
- They painted a forest on the drop curtain to set the scene.
