scope: 'Another name for unbelieving: the view that only what is in the world can be known, not a claim
  that God does not exist and not a lack of learning.'
examples:
- He took a nescient view, saying we can know only what our senses show us.
- Her nescient answer was that no one can know what lies beyond the world.
