simpleMeaning: a band of people who plot together to do a bad or lawless deed
scope: This is a band of people who plot together to do a bad or lawless deed; conspiracy is another name
  for this sense, not a legal group of states and not one person acting alone.
examples:
- The confederacy planned to rob the bank at dawn.
- Police broke up the confederacy before it could act.
