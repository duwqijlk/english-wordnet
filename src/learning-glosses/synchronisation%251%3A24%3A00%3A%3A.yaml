senseId: 'synchronisation%1:24:00::'
synsetId: 13867436-n
simpleMeaning: The tie that holds when things happen at the same time.
scope: This sense is also called synchronization, synchronicity, synchrony, and synchronizing, for the
  tie that holds when things happen at the same time, unlike the sense for a setting that makes a thing
  happen or happen again in step, and unlike the sense for the setting of clocks to show the same time.
examples:
- Synchronisation is the tie that holds when things happen at the same time.
- Synchronisation ties things that happen together.
