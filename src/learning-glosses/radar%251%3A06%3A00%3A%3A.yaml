simpleMeaning: a tool that sends out short bursts of microwave energy and reads the echo to find and place
  far-off things
scope: A tool that finds far-off things by radio echo, not a tool that only measures size or heat.
examples:
- The radar picked up the ship long before it came into view.
- Pilots use radar to find storms ahead of them.
