simpleMeaning: The artery that runs through the narrow passage in the lower jaw to bring blood to the
  lower teeth.
scope: 'Also called inferior alveolar artery: the artery that runs through the narrow passage in the lower
  jaw to bring blood to the lower teeth, not the upper jaw artery and not a vein.'
examples:
- The arteria alveolaris inferior runs through the lower jaw to the teeth.
- The dentist traced the arteria alveolaris inferior on the scan.
