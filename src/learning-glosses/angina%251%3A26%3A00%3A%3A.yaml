simpleMeaning: Any sickness of the throat or the back of the mouth, marked by sudden fits of strong pain
  that make it hard to breathe.
scope: Any sickness of the throat marked by sudden fits of strong, choking pain; not the heart trouble
  that brings fits of chest pain when the heart gets too little air.
examples:
- Angina left his throat raw, with fits of pain that choked him.
- The doctor said the angina came in sudden attacks that made breathing hard.
