simpleMeaning: To make a sudden loud sound with the voice.
scope: 'Another name for shout and call: a sudden loud vocal sound, not a spoken exclamation of surprise
  or joy and not the act of weeping.'
examples:
- She cried out when the icy water hit her back.
- He cried loudly as the doctor set his broken arm.
