senseId: 'amicus_curiae_brief%1:10:00::'
synsetId: 06555940-n
simpleMeaning: a written paper given to a court by someone who wants to shape the result of a case they
  are not part of
scope: A written paper for a court from an outsider to the case, not the person who gives the advice and
  not a paper filed by a party to the case.
examples:
- The group filed an amicus curiae brief in the case.
- The court read the amicus curiae brief before it gave its ruling.
