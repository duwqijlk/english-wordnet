simpleMeaning: Describes metal work whose coloured glassy filling sits in spaces divided by metal, set
  hard by heat.
scope: Metal work of this kind, also called champleve; not plain metal, and not the name of the ware itself.
examples:
- The cloisonne plate shone with red and blue enamel.
- A cloisonne brooch lay in the velvet box.
