simpleMeaning: making musical sounds with the voice or an instrument, especially how exact the high or
  low level of each note is in relation to the others
scope: This is about making musical sounds at the right high or low level for each note, not singing in
  one flat tone and not one singer starting a church song alone.
examples:
- The choir's intonation was exact, with every note at the right level.
- He worked on his intonation so each note on his violin sat at the right level.
