simpleMeaning: a paper given to someone who has finished a course of study, showing that they finished
  it
scope: diploma is another name for this sense; this is a paper showing a course of study has been finished,
  not the skin of a sheep or goat prepared for writing.
examples:
- She framed her sheepskin and hung it on the wall.
- He received his sheepskin at the graduation ceremony.
