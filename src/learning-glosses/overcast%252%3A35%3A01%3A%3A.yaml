simpleMeaning: to sew over an edge of cloth with long wide stitches that slant across it
scope: To stitch over a cloth edge with long slanting stitches, not to join two sections of cloth and
  not to make the sky cloudy.
examples:
- She overcast the raw edge of the curtain before she hemmed it.
- The tailor overcast the frayed cuff with wide slanting stitches.
