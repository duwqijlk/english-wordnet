simpleMeaning: to want something very much and feel a strong need for it
scope: 'Also called starve, hunger, thirst and lust: wanting something very strongly, not just liking
  it a little or wanting it in a weak way.'
examples:
- She craves chocolate after dinner every night.
- After weeks of hard work, he craved a long rest.
