simpleMeaning: The group Adiantum holds many kinds of fern, small or large, that grow on land with fine
  leaves branching like the fingers of a hand
scope: It is also called maidenhair, and it names a land fern of the group Adiantum.
examples:
- The maidenhair fern grew on land with fine leaves like the fingers of a hand.
- Small and large kinds of maidenhair fern grow on land.
