simpleMeaning: a fuel from the ancient remains of living things, found as a vapor, burned to cook food
  and warm homes
scope: This is the fuel piped into homes, not the fuel burned in car engines, not the pedal in a car,
  and not trapped air in the stomach.
examples:
- Our house is heated by gas, so the winter bills are high.
- She turned on the gas and put the kettle on the stove.
