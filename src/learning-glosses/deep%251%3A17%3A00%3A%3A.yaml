simpleMeaning: a long, narrow, very low area with steep sides at the bottom of the ocean
scope: It is a low place on the ocean floor, not the distance from the surface to the bottom.
examples:
- The Pacific has many deeps, some deeper than any mountain is tall.
- Their ship passed over a deep where the ocean floor drops sharply.
