simpleMeaning: not a natural part of a thing and not coming from what the thing is in itself
scope: 'Also called foreign: not a natural part of a thing, but added from outside. It is not about a
  person from another country or a being from another world.'
examples:
- Jealousy is alien to her nature, so she is happy when others do well.
- Cruelty was alien to his gentle nature and shocked everyone who knew him.
