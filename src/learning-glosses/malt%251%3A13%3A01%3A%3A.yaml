simpleMeaning: a grain, usually barley, that is soaked in water so it starts to grow, then dried with
  heat, used especially for making beer and strong drinks
scope: This is the grain used to make drinks, not the strong beer itself, not a sweet milk drink, and
  not the act of turning grain into this form.
examples:
- The brewery bought sacks of malt made from barley.
- Malt is soaked and dried before it is used to make beer.
