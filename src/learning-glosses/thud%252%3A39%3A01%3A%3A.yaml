simpleMeaning: to make the sound that an engine makes when it does not have enough of the stuff that lets
  its parts move easily
scope: 'Also called scrunch: about an engine making a sound when it does not have enough of the stuff
  that lets its parts move easily, not about a heavy thing falling and hitting the ground.'
examples:
- The old engine thudded as it ran without enough oil.
- Without oil, the motor thudded loudly all the way home.
