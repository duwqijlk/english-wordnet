simpleMeaning: a large pale-green American flying insect with long tails on its back wings and a yellow
  half-moon mark on each front wing
scope: A large pale-green American flying insect, not a butterfly and not a small brown night insect.
examples:
- A luna moth rested on the porch light, its long tails trailing behind it.
- We saw a luna moth with a yellow mark on each front wing.
