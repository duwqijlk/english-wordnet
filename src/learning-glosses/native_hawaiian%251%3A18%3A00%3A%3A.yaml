simpleMeaning: A person who belongs to, or comes from, the first Polynesian people who lived on the islands
  of Hawaii
scope: A person who belongs to, or comes from, the first Polynesian people of the islands of Hawaii; its
  nearest rivals are other Pacific island peoples and other Americans of Polynesian descent.
examples:
- She is a Native Hawaiian whose family has lived on the islands for many years.
- The Native Hawaiian spoke of his ancestors who first came to the islands.
