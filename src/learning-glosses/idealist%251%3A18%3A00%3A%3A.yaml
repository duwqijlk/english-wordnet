simpleMeaning: a person who is led more by hopes and high aims than by what is useful and can work in
  real life
scope: 'Also called dreamer: a person led by hopes and high aims, not a person who thinks first about
  what is useful and can work.'
examples:
- As an idealist, she wanted free books for every child, even when there was no money to pay for them.
- He is an idealist who thinks war can end if people just talk to each other.
