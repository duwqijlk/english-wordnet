simpleMeaning: the stunned hurt and disbelief you feel after a bad thing that happens without anyone meaning
  it to
scope: 'Also called a shock, and another name for it is a daze: the stunned disbelief after a sudden bad
  event, not anger and not fear alone.'
examples:
- His mother's death left him in a stupor.
- He sat in a stupor, numb with shock after the crash.
