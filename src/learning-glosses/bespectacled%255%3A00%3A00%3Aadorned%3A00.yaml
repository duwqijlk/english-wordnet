simpleMeaning: wearing glasses, or wearing one piece of glass in front of one eye to help that eye see
scope: 'Also called spectacled: this describes a person with glasses, or one glass for one eye, on the
  face; it does not mean the glasses themselves.'
examples:
- The bespectacled teacher looked at the class over her glasses.
- A bespectacled man in a blue coat opened the door.
