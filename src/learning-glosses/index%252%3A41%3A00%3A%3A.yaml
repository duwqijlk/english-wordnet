simpleMeaning: to put a name or topic in a list in letter order at the back of a book, with its page number
scope: To put one name or topic in the list at the back of a book, not to make the whole list and not
  to change amounts so they follow prices.
examples:
- Please index the name Paris on page 42, under P.
- He indexed each new topic under its main name.
