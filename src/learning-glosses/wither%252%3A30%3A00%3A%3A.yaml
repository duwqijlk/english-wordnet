simpleMeaning: to become dry and smaller as water leaves it
scope: Here, drying out and getting smaller as water is lost; not the wider sense of losing freshness,
  strength, or life in other ways.
examples:
- The grapes began to wither in the hot sun.
- Without rain, the young plants will wither and die.
