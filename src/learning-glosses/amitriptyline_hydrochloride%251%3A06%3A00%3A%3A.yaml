  side effects and clashes with many other drugs.
scope: 'Also called amitriptyline: a drug that lifts low mood, sold as Elavil, with serious side effects,
  not a drug that lifts low mood without side effects and not a sleeping pill.'
examples:
- The doctor gave her amitriptyline hydrochloride for low mood.
- Amitriptyline hydrochloride can clash with many other drugs.
