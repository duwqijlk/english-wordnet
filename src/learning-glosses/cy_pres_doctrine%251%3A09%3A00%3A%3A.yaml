simpleMeaning: a law rule that when a gift or will cannot be carried out word for word, the giver's wish
  should be followed as nearly as can be done
scope: A law rule that when a gift or will cannot be carried out word for word, the giver's wish should
  be followed as nearly as can be done; also called cy pres, not a rule about who gets a gift.
examples:
- The cy pres doctrine let the court use the gift for a near purpose.
- Under the cy pres doctrine, the donor's wish was followed as nearly as could be done.
