simpleMeaning: a disease of wheat in which the seeds are taken over by greasy lumps of bad-smelling smut
  spores
scope: 'Also called stinking smut: this is the disease in wheat, not the fungus that causes it, not a
  light hit in baseball, and not a push.'
examples:
- Bunt left the wheat seeds full of dark, bad-smelling spores.
- Many fields of wheat were lost to bunt that year.
