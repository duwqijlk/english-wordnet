simpleMeaning: You cannot trust this person to stay true, since they change sides or break their word
scope: This is being unfaithful because you cannot be trusted; faithlessness, falseness and fickleness
  are other names for this sense. Not steady loyalty and not a single mistake.
examples:
- His inconstancy in love left her unsure where she stood.
- The king grew tired of the court's inconstancy.
