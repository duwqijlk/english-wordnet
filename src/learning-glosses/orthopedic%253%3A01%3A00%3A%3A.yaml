simpleMeaning: of or about the branch of medicine that deals with bones and joints and the muscles that
  move them
scope: Used for things to do with the branch of medicine that treats bones and joints; also called orthopaedic.
  It is not the name of a doctor or of one single treatment.
examples:
- She wore orthopedic shoes that gave her feet good support.
- He went to an orthopedic clinic to have his bad knee looked at.
