simpleMeaning: A picture stretched out of true, above all one that can only be made out when looked at
  in one special way.
scope: This is the stretched picture that can only be made out from one special viewpoint, also called
  anamorphism.
examples:
- The anamorphosis stretched the face out of shape.
- We could not make out the anamorphosis until we moved to the right place.
