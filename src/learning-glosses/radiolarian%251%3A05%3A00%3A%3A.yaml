simpleMeaning: a tiny one-celled animal with a soft body that can change shape and thin threads that spread
  out from it
scope: A tiny one-celled animal with thin threads that spread out from it, not an amoeba itself and not
  a one-celled animal without those threads.
examples:
- Under the microscope, the radiolarian showed thin threads spread out in all directions.
- The radiolarian drifted in the water, its threads spread wide.
