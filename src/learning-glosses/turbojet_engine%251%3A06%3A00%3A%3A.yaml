simpleMeaning: All the air flows through a press, a burning chamber, and a spinning wheel in this power
  unit, before it rushes out to push the plane on.
scope: Also called turbojet, this is the power unit that pushes a plane by rushing out air.
examples:
- The turbojet engine pushed the plane forward.
- The plane climbed on its turbojet engine.
