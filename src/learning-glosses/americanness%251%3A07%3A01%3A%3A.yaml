simpleMeaning: The quality of being from the United States, or like its people.
scope: This is about the quality of being from the United States, not about the country itself.
examples:
- The Americanness of the film showed in its towns, its music and its talk.
- She liked the Americanness of the old diner, with its coffee and pie.
