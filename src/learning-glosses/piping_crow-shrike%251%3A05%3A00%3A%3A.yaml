simpleMeaning: A black-and-white bird the size of a large songbird, good at copying sounds and often kept
  in a cage.
scope: A black-and-white bird the size of a large songbird, good at copying sounds and often kept in a
  cage; piping crow is another name for this sense, not a magpie and not a raven.
examples:
- The piping crow-shrike copied the kettle's whistle perfectly.
- We kept a piping crow-shrike in a cage on the veranda.
