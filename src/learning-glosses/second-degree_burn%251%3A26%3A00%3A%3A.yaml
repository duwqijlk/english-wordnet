simpleMeaning: A skin hurt that makes blisters and harms the top of the skin layer just below the surface
scope: A skin hurt that makes blisters and harms the top of the skin layer just below the surface, not
  a mild hurt that only reddens the skin and not a deep hurt that kills the skin right through.
examples:
- The second-degree burn blistered her hand.
- His arm had a second-degree burn from the hot pan.
