synsetId: 08607357-n
simpleMeaning: A line on a map links spots that all give the same reading for one thing that is measured
scope: A line on a map joining places where a measured thing has the same value, also called isarithm
  or isopleth; not a line joining places of different values and not a line drawn on a chart of the sky.
examples:
- The isogram on the weather map joins towns with the same rainfall.
- Draw an isogram through all the points that share the same value.
