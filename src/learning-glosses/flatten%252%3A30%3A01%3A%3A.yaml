simpleMeaning: to change the shape of something so that it is flat, or flatter than it was before
scope: This is about making a thing flat or flatter; not a thing becoming flat or flatter.
examples:
- He flattened the empty box before putting it in the bin.
- She flattened the dough with her hands.
