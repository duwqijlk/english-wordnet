simpleMeaning: The action of the teeth and jaws taking hold of something or chewing a piece off it.
scope: The act of gripping or chewing with teeth, also called a chomp, not the wound it leaves or the
  verb for doing it.
examples:
- He took a huge bite out of the apple.
- With one bite she tore a piece from the loaf.
