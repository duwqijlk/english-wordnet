simpleMeaning: a remark that shows you think a person or thing is bad or not worth respect
scope: A mean remark about a person or thing, not the look on the face a person makes to show the same
  feeling.
examples:
- The critic's sneer, 'Call that art?', made the painter angry.
- She did not reply to his sneer about her cooking.
