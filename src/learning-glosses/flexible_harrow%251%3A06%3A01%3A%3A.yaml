senseId: 'flexible_harrow%1:06:01::'
synsetId: 92465670-n
simpleMeaning: Used to clear weeds from crops, this farm tool has thin spring teeth set on a frame that
  bends to fit the shape of the ground.
scope: Also called flex harrow and tine weeder, this is a farm tool for clearing weeds, not a plough and
  not a tool for digging.
examples:
- They used a flexible harrow to clear the weeds.
- The flexible harrow bent to fit the shape of the field.
