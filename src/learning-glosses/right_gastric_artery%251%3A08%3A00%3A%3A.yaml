simpleMeaning: The lower end of the stomach, along its shorter inner curve, is fed by a blood vessel that
  branches off the blood vessel of the liver.
scope: 'Also called arteria gastrica dextra: a blood vessel that branches off the liver vessel to feed
  the lower end of the stomach, not the liver vessel itself.'
examples:
- The right gastric artery feeds the lower end of the stomach.
- Blood reaches the lower end of the stomach through the right gastric artery.
