simpleMeaning: A container where holy things left by dead holy people are kept or shown, above all things
  left by saints.
scope: A container where holy things left by dead holy people are kept or shown, above all things left
  by saints; not a coffin and not a place of prayer.
examples:
- The reliquary held a bone of the saint.
- Pilgrims knelt before the gold reliquary.
