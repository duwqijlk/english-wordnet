senseId: purposeless%5:00:00:worthless:00
synsetId: 02513350-s
simpleMeaning: of no use at all, and with no good reason to be there
scope: This sense says a thing is of no use and should not be there. It is not the sense about a person
  or action having no clear aim or goal.
examples:
- His long, purposeless speech gave us no useful facts.
- She cut the purposeless lines from the play.
