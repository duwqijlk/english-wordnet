senseId: 'determinant%1:09:00::'
synsetId: 05700384-n
simpleMeaning: A thing that helps to cause or settle what happens.
scope: 'Also called a determinative: a thing that helps to cause or settle what happens, not a square
  of numbers used in sums and not the spot on an antigen where an antibody fastens.'
examples:
- Money was a determinant of where they chose to live.
- Good teaching is a determinant of how well pupils learn.
