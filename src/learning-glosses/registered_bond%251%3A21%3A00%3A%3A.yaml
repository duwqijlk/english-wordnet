simpleMeaning: A debt paper whose holder is in the books of the body that put it out, passing to a new
  holder only when the named holder signs it over.
scope: A debt paper whose holder is in the books of the body that put it out, passing to a new holder
  only when the named holder signs it over; not a bearer paper, which passes by hand alone, and not a
  share, which gives part of a firm.
examples:
- The registered bond was listed in her name.
- He sold the registered bond after the holder signed it over.
