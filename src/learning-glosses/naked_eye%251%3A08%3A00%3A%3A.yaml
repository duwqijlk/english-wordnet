simpleMeaning: Sight with no help from any glass or tool that makes things look bigger, nearer, farther
  away, or clearer.
scope: It is seeing with no help from any glass or tool, and the rivals are glasses, a telescope, and
  a microscope.
examples:
- We saw the comet with the naked eye.
- The stars were clear to the naked eye.
