simpleMeaning: A person who looks after an apartment building for its owner, cleans and fixes things there,
  and takes the rent money from people who live there
scope: Also called super. This is the person who cares for an apartment building, not a person in charge
  of a police force or a school system.
examples:
- The superintendent fixed the broken pipe in our apartment building.
- We pay our rent to the superintendent each month.
