simpleMeaning: evil or cruel to the highest degree; showing cruelty, or fit for hell
scope: This means extremely evil and cruel, also called infernal, hellish, demonic, diabolical, diabolic,
  satanic and fiendish; it is not the sense of having done acts that go against what is right.
examples:
- The unholy cruelty of the guards shocked everyone who heard about it.
- He gave an unholy laugh as he watched the fire spread.
