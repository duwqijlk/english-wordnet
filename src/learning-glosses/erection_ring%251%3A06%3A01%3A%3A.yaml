simpleMeaning: Hardness lasts much longer when this band is worn round the base of the penis, usually,
  to slow the flow of blood out of the swollen organ
scope: It is also called a cock ring and a tension ring, a band that slows blood flow from the penis to
  keep it hard much longer.
examples:
- He slipped an erection ring on.
- The erection ring slowed the flow of blood from the penis.
