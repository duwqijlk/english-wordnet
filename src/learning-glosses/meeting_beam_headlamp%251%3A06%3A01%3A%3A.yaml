senseId: 'meeting_beam_headlamp%1:06:01::'
synsetId: 92449781-n
simpleMeaning: A vehicle's front light set low so it lights the road ahead and to the sides without dazzling
  other road users, used whenever other vehicles are ahead.
scope: The dipped setting of a vehicle headlight, the opposite of the main or high beam; a meeting beam
  is the same as a low or passing beam.
examples:
- The owner's manual tells drivers to use meeting beam headlamps in traffic.
- He turned on the meeting beam headlamp as another car appeared ahead.
