simpleMeaning: Its smoke cooled by passing through water, this tobacco pipe from the East is drawn through
  a long bendy tube joined to a pot.
scope: Also called a hookah, shisha, calean, chicha, hubble-bubble, kalian, narghile, nargileh, sheesha
  or water pipe, it is a tobacco pipe whose smoke is cooled by passing through water.
examples:
- She tried the hubbly-bubbly.
- The hubbly-bubbly gurgled as he drew on it.
