simpleMeaning: To open out a rolled-up thing, or to be opened out from a rolled-up state
scope: To open out a rolled-up thing; unroll is another name for this sense. Not to roll a thing up and
  not to fold a flat thing.
examples:
- She watched the sailors unfurl the great sail.
- The banner unfurled slowly in the wind.
