simpleMeaning: Used to make copies of genes or bits of genes, this large carrier in genetics is built
  from a virus that attacks germs
scope: In genetics, this large carrier, built from a virus that attacks germs, is used to copy genes or
  bits of genes; it is not a small carrier, and not the virus itself.
examples:
- The lab put the gene into a cosmid to make many copies of it.
- They used a cosmid to copy a fragment of a gene.
