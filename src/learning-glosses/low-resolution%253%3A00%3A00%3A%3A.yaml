simpleMeaning: Of computer output tools, making pictures that are not clear and sharp.
scope: Of computer output tools, making pictures that are not clear and sharp; not a tool that makes fine
  clear pictures.
examples:
- The old printer gave a low-resolution print with blurry edges.
- Her low-resolution screen made the photos look rough.
