simpleMeaning: To do with the ancient Egyptian kings.
scope: To do with the ancient kings of Egypt, not with the kings of other lands and not with the common
  people of Egypt.
examples:
- The Pharaonic age was the time of the ancient Egyptian kings.
- Pharaonic rule meant rule by the ancient kings of Egypt.
