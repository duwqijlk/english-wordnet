simpleMeaning: To burn in a slow way, with no flame to be seen.
scope: To burn slowly with no flame, not the fire itself that gives off thick smoke without a flame.
examples:
- The logs smoldered all night in the grate.
- A smoldering fire gave off smoke but no flame.
