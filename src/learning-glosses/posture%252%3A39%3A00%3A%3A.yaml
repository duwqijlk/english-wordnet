simpleMeaning: to hold your body in one position so an artist can paint, draw or take a picture of you
scope: 'Also called model, sit and pose: to hold your body still for an artist. It is not acting in a
  false way to impress others, and not a country''s strength for war.'
examples:
- The model postured in front of the artist's easel for an hour.
- He postured on the stool while the class drew him.
