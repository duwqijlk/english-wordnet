simpleMeaning: a clear understanding of what a thing is really like, got at once and not by slow thinking
scope: This sense is a deep, quick understanding of the true nature of a thing, not just seeing its outside
  or learning facts about it step by step.
examples:
- Her book gives real insight into how children learn.
- Talking to the workers gave him insight into the problem.
