simpleMeaning: the hairs on the skin standing up on their own because a person is cold, feels strong stress,
  or has skin that is red, sore, or itchy
scope: 'Also called gooseflesh: the hairs on the skin standing up on their own because a person is cold,
  feels strong stress, or has skin that is red, sore, or itchy; it is not something a person does on purpose.'
examples:
- The cold wind gave me goosebumps.
- The scary story gave her goosebumps all over her arms.
