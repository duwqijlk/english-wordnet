simpleMeaning: Small white flowers grow on a South African plant with a thick food-storing root, at least
  in part, and egg-shaped blades with shallow cuts
scope: Also called grape-leaf begonia; a South African plant with shallow-cut blades and small white flowers.
examples:
- The maple-leaf begonia in her pot has small white flowers.
- He watered the maple-leaf begonia, and its shallow-cut blades spread wide.
