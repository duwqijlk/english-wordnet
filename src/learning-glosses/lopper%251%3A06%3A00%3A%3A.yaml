senseId: 'lopper%1:06:00::'
synsetId: 04022634-n
simpleMeaning: A saw with a long handle and a bent blade at the end, sometimes with a cutter too, used
  to cut back small trees.
scope: This is a long-handled saw with a bent blade for cutting back small trees, not a short hand saw
  and not a pair of shears; pruner and pruning hook are other names for this sense.
examples:
- He used the lopper to cut back the small apple tree.
- The lopper's long handles let her reach the high branch.
