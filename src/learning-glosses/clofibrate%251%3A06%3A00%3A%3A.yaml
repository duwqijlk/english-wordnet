simpleMeaning: This drug lowers the fats in the blood; doctors give it for some illnesses of the heart
  and blood vessels, and it is sold under the trade name Atromid-S.
scope: A drug that lowers the fats in the blood, used for some heart and blood-vessel illnesses.
examples:
- The doctor gave him clofibrate to lower the fats in his blood.
- She took clofibrate for her heart illness.
