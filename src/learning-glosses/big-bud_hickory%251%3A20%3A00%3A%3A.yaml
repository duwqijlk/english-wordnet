simpleMeaning: a smooth-barked North American nut tree with seven to nine leaflets and a hard-shelled
  nut that can be eaten
scope: Also called black hickory, mockernut, mockernut hickory, and white-heart hickory; a smooth-barked
  North American nut tree, not a walnut tree and not a pecan tree.
examples:
- The big-bud hickory bore hard-shelled nuts.
- We planted a big-bud hickory in the yard.
