simpleMeaning: The oldest law force of the United States, which guards the courts, moves prisoners, guards
  witnesses, looks after goods taken from criminals, and keeps the court system working.
scope: Not the FBI; also called the United States Marshals Service and the US Marshals Service.
examples:
- The Marshals moved the prisoner to court.
- Marshals guard witnesses in danger.
