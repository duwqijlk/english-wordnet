simpleMeaning: A blocking stuff made by this bit of the body's building plans stops a switch from turning
  other bits on.
scope: It is also called regulator gene, and the blocking stuff it makes holds back the switch.
examples:
- The regulatory gene keeps the switch from turning on the other bits.
- The switch stayed off while the regulatory gene made its blocking stuff.
