simpleMeaning: In a play or story, a clash between people or powers, especially one that pushes the story
  on
scope: A clash between people or powers in a play or story, not a clash of feelings inside one person
  and not two things that do not fit together.
examples:
- The conflict between the two brothers drives the play.
- This form of conflict is at the heart of the novel.
