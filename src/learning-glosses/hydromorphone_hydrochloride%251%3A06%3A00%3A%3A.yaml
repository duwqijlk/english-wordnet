simpleMeaning: A strong drug that dulls pain and brings sleep, sold as Dilaudid, used to treat middling
  to severe pain.
scope: A strong drug that dulls pain and brings sleep, used to treat middling to severe pain, not morphine
  and not aspirin; hydromorphone is another name for this sense.
examples:
- The nurse gave hydromorphone hydrochloride for the pain.
- Hydromorphone hydrochloride comes as a tablet or a shot.
