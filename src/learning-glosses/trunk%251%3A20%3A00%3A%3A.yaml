simpleMeaning: the main part of a tree, usually covered with bark, the hard outer skin of a tree, and
  usually the part cut and sold as wood for building
scope: The main part of a tree, not a space in a car for bags, not a large case for travel, and not the
  long nose of an elephant.
examples:
- The trunk of the old tree was too wide for my arms to reach around.
- Rain ran down the rough trunk after the storm.
