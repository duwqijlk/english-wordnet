senseId: 'groundbreaking%1:04:00::'
synsetId: 00240350-n
simpleMeaning: a formal event where the ground is dug for the first time to start a building or other
  big work
scope: This is the first digging before a building or other big work starts, done as a formal event; it
  is not a new and different idea or way of doing something.
examples:
- The mayor spoke at the groundbreaking for the new school.
- They held a groundbreaking before work on the bridge began.
