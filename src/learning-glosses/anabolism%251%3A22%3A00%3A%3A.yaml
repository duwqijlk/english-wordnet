simpleMeaning: Living things build more complex stuff, like living tissue, out of simpler stuff, and store
  energy away as they do it.
scope: In living things, more complex stuff is made from simpler stuff, with energy stored away; it is
  also called constructive metabolism, not catabolism, the breaking down of stuff for energy.
examples:
- Anabolism builds living tissue from simpler stuff in the body.
- During anabolism, the body stores energy as it makes new tissue.
