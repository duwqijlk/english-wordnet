simpleMeaning: A step that runs how facts are written down, worked on, sent, or made sense of.
scope: Also called control operation; a step that runs how facts are written down, worked on, sent, or
  made sense of, not the facts themselves and not the machine that holds them.
examples:
- A control function started the data processing.
- The control function stopped the recording.
