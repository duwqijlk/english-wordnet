simpleMeaning: having to stay in your sleeping place all day and night, as a person who is ill or hurt
scope: 'Also called bed rest: having to stay in your sleeping place all day and night when ill or hurt,
  not a short nap and not a day off work.'
examples:
- Bedrest was the only treatment the doctor gave her.
- After the operation he was kept on bedrest for a week.
