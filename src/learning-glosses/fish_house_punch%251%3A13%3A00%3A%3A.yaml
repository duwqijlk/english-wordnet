simpleMeaning: A drink made from rum and brandy mixed with water or tea and sweetened with sugar syrup.
scope: A drink of rum and brandy mixed with water or tea and sweetened with sugar syrup; not a plain rum
  drink, and not a soft drink.
examples:
- They served fish house punch at the party.
- The fish house punch mixed rum, brandy and tea.
