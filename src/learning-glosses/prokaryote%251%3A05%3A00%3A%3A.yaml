simpleMeaning: bacteria are the main example of this one-celled living thing, whose cells have no nucleus
  in a skin; blue-green algae, actinomycetes, and mycoplasma are also in the group
scope: Also called procaryote; a one-celled living thing without a nucleus, not a cell with its nucleus
  held in a skin.
examples:
- A prokaryote keeps its genetic material loose, with no nucleus.
- Blue-green algae are prokaryotes, like bacteria.
