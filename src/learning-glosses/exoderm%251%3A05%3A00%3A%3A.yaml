senseId: 'exoderm%1:05:00::'
synsetId: 01466380-n
simpleMeaning: the outer layer of cells in an early embryo that grows into skin and nerve tissue
scope: This is the outer germ layer of an early embryo; ectoblast and ectoderm are other names for this
  sense; not the inner germ layer and not the middle germ layer.
examples:
- The exoderm gives rise to the skin and the nervous system.
- Cells of the exoderm develop into nerve tissue.
