simpleMeaning: Roots that smell sweet belong to this grass like plant of Europe, which has rough edged
  leaves and small groups of reddish flowers
scope: Also called galangal, a grass like plant of Europe with reddish flowers, not the southeastern Asian
  plant with sweet smelling roots.
examples:
- Galingale grew along the path with rough edged leaves and reddish flowers.
- He dug up galingale and found its roots smelled sweet.
