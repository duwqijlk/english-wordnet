simpleMeaning: Odd bursts of activity in the brain's outer layer briefly stop the body from moving or
  feeling as it should.
scope: This is the brief break in how the body moves or feels, coming from odd bursts of activity in the
  brain's outer layer.
examples:
- The focal seizure left her arm shaking for a few seconds.
- His focal seizure began with a strange feeling in one hand.
