simpleMeaning: The lower and thicker of the two small leaf-like covers that wrap round the tiny flower
  in most grasses.
scope: The lower and thicker of the two small covers that wrap round the tiny flower in most grasses,
  also called a lemma; not the upper cover and not a leaf.
examples:
- The flowering glume wraps round the tiny flower of the grass.
- In most grasses the flowering glume is the lower of the two covers.
