simpleMeaning: Describes a way of defining a word by listing all the things the word rightly names.
scope: Describes defining a word by listing all the things it rightly names; not defining by what a thing
  is and not defining by one example.
examples:
- An extensional definition of 'dog' would list every dog.
- The extensional approach names the whole class.
