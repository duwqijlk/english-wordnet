simpleMeaning: a mild kind of smallpox, a skin disease with spots, caused by a weaker form of the germ
  that causes it
scope: 'Also called milk pox, pseudosmallpox, and pseudovariola: a mild form of smallpox, not full smallpox
  and not a different skin disease like chickenpox.'
examples:
- The doctor said the alastrim was a mild form of smallpox.
- Alastrim left only a few spots on the child's skin.
