simpleMeaning: wearing clothes, particularly fine or elegant ones, and often joined with another word
scope: Being clothed, particularly in fine or elegant attire, not the separate sense for fancy or formal
  clothing and not lumber or stone smoothed by trimming; garbed, robed, attired, appareled, garmented
  and habilimented are other names for this sense.
examples:
- She was elegantly dressed for the ceremony.
- The guests were dressed in silk and gold.
