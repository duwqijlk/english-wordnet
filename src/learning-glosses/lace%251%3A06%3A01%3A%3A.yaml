simpleMeaning: a cord pulled through holes or around hooks to pull two edges together, as on a shoe
scope: A cord that pulls two edges together, not fine open cloth with a pattern.
examples:
- She tied the lace of her shoe in a bow.
- The lace of his boot came undone.
