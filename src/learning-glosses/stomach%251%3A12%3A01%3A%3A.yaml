simpleMeaning: a willingness or taste for conflict, difficulty, or unpleasant things
scope: This is a liking for hard or nasty situations, not hunger for food or the digestive organ.
examples:
- She had no stomach for another argument with her boss.
- He lacks the stomach for the long, brutal campaign.
