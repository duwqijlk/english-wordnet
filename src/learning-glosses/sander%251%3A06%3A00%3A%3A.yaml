simpleMeaning: a power tool used to make wood smooth; it moves a ring of rough paper very fast with an
  electric motor
scope: 'Also called a smoother, a drum sander and an electric sander: a power tool for making wood smooth,
  not rough paper used by hand.'
examples:
- He used a sander to make the rough table top smooth.
- The sander made a loud noise as it worked on the door.
