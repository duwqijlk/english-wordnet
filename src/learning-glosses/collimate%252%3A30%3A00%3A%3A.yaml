simpleMeaning: to set the line of sight of a tool that uses lenses so that it points true
scope: To set the line of sight of a tool that uses lenses so that it points true; not the setting itself
  as a thing, and not to clean the lenses.
examples:
- He will collimate the telescope before the night's work.
- Technicians collimate the instrument until the cross hairs line up.
