senseId: 'gas_embolism%1:26:00::'
synsetId: 14124799-n
simpleMeaning: A blockage in the blood vessels caused by an air bubble, accidentally during surgery or
  an injection under the skin, or as a complication of scuba diving.
scope: A medical term for a bubble blocking the blood vessels, not a clot or other solid blockage.
examples:
- A gas embolism can happen by accident during surgery.
- A gas embolism can be a complication of scuba diving.
