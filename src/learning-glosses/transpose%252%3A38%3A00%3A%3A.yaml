simpleMeaning: to move a number to the other side of an equation (where the two sides are equal), changing
  its plus or minus sign so the sides stay equal
scope: This is the verb for moving a number to the other side of an equation and changing its plus or
  minus sign, not the noun for a set of numbers in rows and columns and not moving a thing to another
  place or time.
examples:
- To solve it, transpose the 5 to the other side and change its sign.
- If you transpose this number, the two sides of the equation stay equal.
