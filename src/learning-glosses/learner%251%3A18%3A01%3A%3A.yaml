simpleMeaning: a person who works for an expert to get skill in a trade
scope: This is a person who works for an expert to get skill in a trade, not a child or other person who
  gets knowledge or beliefs, for example from a teacher.
examples:
- As a learner, he worked under a master carpenter for two years.
- The learner spent each day working for an expert baker.
