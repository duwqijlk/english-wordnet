simpleMeaning: In baseball, one of nine parts of a game, in which each team has a turn to hit the ball
scope: In baseball, one of nine parts of play; not one of the ten parts of a bowling game, not a single
  drawing, and not the part that holds a pair of glasses.
examples:
- Our team scored three runs in the first frame.
- The home team took the lead in the ninth frame.
