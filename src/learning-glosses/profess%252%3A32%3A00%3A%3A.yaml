simpleMeaning: to teach a subject, or to say you know a lot about it as your work
scope: To teach a subject or say you know a lot about it as your work, not to say openly that you believe
  in a religion or follow a leader.
examples:
- She professes organic chemistry at the university.
- He professes history and has taught it for many years.
