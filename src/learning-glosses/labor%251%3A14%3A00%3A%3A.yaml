simpleMeaning: the social group made up of people who do physical work or work for pay
scope: This is not the stage of childbirth and not work as an activity; it is a social group of workers,
  often set against owners or managers.
examples:
- The union says it speaks for labor in these negotiations.
- In the old mill towns, labor and management lived in separate neighborhoods.
