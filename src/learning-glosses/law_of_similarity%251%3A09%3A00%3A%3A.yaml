simpleMeaning: In the study of how people see things, parts that look alike seem to belong together as
  one thing, when all else is the same
scope: Also called similarity, this rule from the study of how people see things says that parts of what
  is seen that look alike seem to belong together as one thing, when all else is the same.
examples:
- By the law of similarity, the matching shapes seemed to belong together.
- The law of similarity says dots that look alike seem to form one group.
