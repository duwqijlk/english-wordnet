simpleMeaning: With very thin end lines and heavy upright strokes, a set of printed letters keeps a regular
  shape, based on a design from the 1700s by Gianbattista Bodoni.
scope: Also called modern, it is the printed-letter style with very thin end lines, heavy upright strokes,
  and a regular shape.
examples:
- The book was set in a modern font.
- This modern font has very thin end lines.
