simpleMeaning: The position held by the leader of a tribe
scope: This is the position held by the leader of a tribe; chieftainship is another name for this sense,
  not the leader himself and not the head of a country.
examples:
- He held the chieftaincy for twenty years.
- The chieftaincy passed to her eldest son.
