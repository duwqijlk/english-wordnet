simpleMeaning: Of the dry lands of Mexico and the southwest United States, a dark grey pig-like animal
  with a white band around its neck that is hard to see.
scope: Also called collared peccary, it is the dark grey pig-like animal of the dry lands, not a true
  pig.
examples:
- The javelina's white band was hard to see.
- A javelina lived in the dry lands of Mexico.
