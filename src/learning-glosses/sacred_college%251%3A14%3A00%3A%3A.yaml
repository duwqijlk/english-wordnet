simpleMeaning: In the Roman Catholic Church, the group of all cardinals, who choose the pope and give
  him advice
scope: Cardinalate, College of Cardinals and Sacred College of Cardinals are other names for this sense,
  and it is set apart from a single cardinal by being the whole body.
examples:
- The Sacred College elects a new pope when the old one dies.
- All the cardinals of the Sacred College met in Rome.
