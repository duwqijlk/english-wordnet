simpleMeaning: A tall water hemlock from northeastern North America that lives two years, with purple-streaked
  stems and clusters of very poisonous roots shaped like small sweet potatoes.
scope: Another name for spotted cowbane and spotted water hemlock; the tall, two-year water hemlock of
  northeastern North America, not the different plant called poison hemlock.
examples:
- Spotted hemlock is one of the most poisonous plants in North America.
- A single bite of spotted hemlock root can kill an animal.
