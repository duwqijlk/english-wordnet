simpleMeaning: A person who owes loyalty and work to a lord, and holds land from that lord in return
scope: 'Also called a liege, a vassal and a feudatory: a person who holds land from a lord and owes loyalty
  and work in return, not the lord who grants the land.'
examples:
- The liege subject swore loyalty to his lord.
- Each liege subject gave the lord a share of the harvest.
