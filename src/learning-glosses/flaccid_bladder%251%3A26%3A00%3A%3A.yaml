senseId: 'flaccid_bladder%1:26:00::'
synsetId: 14424644-n
simpleMeaning: A urinary problem in which the nerve loop that starts urination is broken, so there is
  no sense of fullness, no control over passing water, and the bladder overfills.
scope: This is a bladder whose nerve signal to empty has been cut, so it stretches without the person
  noticing; not an irritable or overactive bladder, and not a blockage in the tube that drains it.
examples:
- After his spinal injury he was left with a flaccid bladder and had to use a catheter.
- A flaccid bladder can keep stretching until urine backs up towards the kidneys.
