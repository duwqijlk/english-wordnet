simpleMeaning: The tiny living thing that makes pus and causes gonorrhea, a disease spread by sex.
scope: The tiny living thing that causes gonorrhea, not the disease itself and not other pus-making germs.
examples:
- The gonococcus was found in the patient's test.
- Gonococcus causes gonorrhea, a disease spread by sex.
