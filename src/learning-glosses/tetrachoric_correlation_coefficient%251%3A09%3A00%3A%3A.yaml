simpleMeaning: How closely two things move together is what this figure shows, when each is split into
  two kinds and spread in a bell shape.
scope: People also call it a tetrachoric correlation, and it is a figure worked out for two things spread
  in a bell shape and split into two kinds, showing how closely they move together.
examples:
- The tetrachoric correlation coefficient came out at 0.6.
- She read the tetrachoric correlation coefficient from the table.
