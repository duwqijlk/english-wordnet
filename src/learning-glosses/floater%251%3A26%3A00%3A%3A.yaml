senseId: 'floater%1:26:00::'
synsetId: 14388524-n
simpleMeaning: Bits of cells that block the light, drifting in the jelly inside the eye and in the lens,
  make dark shapes appear before your eyes.
scope: Small dark shapes seen because of bits of cells in the eye, also called spots, musca volitans,
  or muscae volitantes, not an insurance policy, a debt with a changing rate, an illegal voter, a thing
  that floats, a wanderer, or a swimmer.
examples:
- Floaters seem to drift across her view when she looks at the sky.
- The floater in his left eye came and went.
