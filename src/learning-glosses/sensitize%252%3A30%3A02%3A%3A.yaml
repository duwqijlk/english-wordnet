simpleMeaning: To make a person react to a drug or to a thing that sets off an allergy.
scope: To make a person react to a drug or to a thing that sets off an allergy, not to make a material
  react to light, not to make a person aware, and not to make a person sense a thing.
examples:
- Years of taking the drug sensitized him to penicillin.
- The treatment can sensitize patients to the medicine itself.
