simpleMeaning: Being unable to see well in low light, from too little vitamin A or from an ill of the
  back of the eye.
scope: Being unable to see well in low light from too little vitamin A or an ill of the back of the eye,
  also called moon blindness and nyctalopia; not being unable to see in bright light and not a hurt to
  the front of the eye.
examples:
- Night blindness made it hard for him to drive after dark.
- Her night blindness came from too little vitamin A.
