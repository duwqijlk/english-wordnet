simpleMeaning: A doctor who puts right faults in the bones, most of all in children
scope: A doctor who puts right faults in the bones, most of all in children, also called an orthopedist;
  not a doctor who treats teeth and not one who treats the skin.
examples:
- The orthopaedist examined the child's curved spine.
- Our orthopaedist fitted a brace for her leg.
