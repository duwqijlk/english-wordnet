schema: oewn-learning-gloss-v2
senseId: 'uncross%2:38:00::'
synsetId: 01918785-v
simpleMeaning: to move something from a position where parts lie over each other to a position where they
  lie apart
scope: This is changing something from a position where parts lie over each other to a position where
  they lie apart; it is not folding the parts over each other, and not keeping them folded.
examples:
- She uncrossed her legs and stood up.
- He uncrossed his arms and shook my hand.
