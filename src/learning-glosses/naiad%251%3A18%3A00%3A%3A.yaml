simpleMeaning: In Greek mythology, a female spirit of lakes, springs, rivers and fountains
scope: In Greek stories, this is a female spirit of fresh water. It is not the water plant with narrow
  leaves and small flowers that has the same name.
examples:
- The story tells of a naiad who lived in the lake.
- In the old tale, a naiad rose from the spring to speak to the traveller.
