simpleMeaning: In the north of the United States and in Europe grows this pondweed with leaves that float.
scope: Also called loddon pondweed and Potamogeton nodosus; this pondweed has leaves that float, not leaves
  that stand up out of the water, and it grows in the north of the United States and in Europe.
examples:
- Potamogeton americanus floats its leaves on the pond.
- We found Potamogeton americanus in the north of the United States.
