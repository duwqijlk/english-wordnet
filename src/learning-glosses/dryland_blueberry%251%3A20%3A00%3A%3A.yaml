simpleMeaning: in the east of the United States, a low bush that drops its leaves in winter and grows
  dark blue fruit that tastes sweet
scope: 'Also called dryland berry: a low bush with dark blue sweet fruit, not a tall tree and not a bush
  with sour fruit.'
examples:
- A dryland blueberry grew beside the path.
- The dryland blueberry was full of dark blue fruit.
