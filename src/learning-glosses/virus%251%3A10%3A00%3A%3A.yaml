simpleMeaning: a computer program that copies itself and usually harms files or other programs on the
  same computer badly
scope: 'This is the computer sense: a harmful program that copies itself. It is not the tiny thing that
  makes people, animals or plants ill.'
examples:
- A virus spread through the office computers and damaged many files.
- He used a safety program to find and remove the virus.
