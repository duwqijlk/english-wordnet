simpleMeaning: grip between two sliding faces, or tubes that slide one inside the other, sets how far
  this steel support gives
scope: This steel support gives in a set way, and it is also called a friction prop and a friction yielding
  prop.
examples:
- The mechanical yielding prop slid its tubes as it gave.
- Grip between the sliding faces held the mechanical yielding prop's give in check.
