simpleMeaning: relating to, in, or like the area on either side of the equator, the line around the middle
  of the earth
scope: Also called tropical. This is about being in or like the area near the equator, not one of the
  two lines around the earth with that name, and not just hot and wet weather.
examples:
- Pineapples grow well in this tropic area on either side of the equator.
- They live on a tropic island in the area near the equator.
