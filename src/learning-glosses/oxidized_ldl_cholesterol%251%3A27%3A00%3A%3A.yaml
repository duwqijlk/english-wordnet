simpleMeaning: The fatty substance in the blood, after it has been hit hard by free bits in the body,
  which is thought to harden the walls of blood tubes.
scope: The fatty substance in the blood after it has been hit hard by free bits in the body, not the same
  substance before that change.
examples:
- The oxidized LDL cholesterol in his blood was high.
- Doctors say oxidized LDL cholesterol can harden the walls of blood tubes.
