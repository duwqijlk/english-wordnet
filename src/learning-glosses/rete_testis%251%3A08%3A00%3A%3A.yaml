simpleMeaning: Seed is made in one set of tubes, and this net of small tubes carries it from there to
  the tubes that take it out of the body.
scope: It is a net of small tubes that carries seed away from the tubes where it is made, not those tubes
  themselves.
examples:
- The rete testis carried the seed on from the tubes where it was made.
- Sperm pass through the rete testis on their way out of the body.
