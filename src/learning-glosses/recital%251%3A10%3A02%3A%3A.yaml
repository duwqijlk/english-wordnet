simpleMeaning: when someone stands before other people and says, from memory, words they learned beforehand
scope: When someone stands before other people and says, from memory, words they learned beforehand; reading
  is another name for this sense, not a lesson, and not a list of things done.
examples:
- The children gave a recital of poems they had learned by heart.
- The program included a recital of well-loved poems.
