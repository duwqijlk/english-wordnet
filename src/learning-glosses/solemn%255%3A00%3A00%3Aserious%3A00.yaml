simpleMeaning: Serious, sad, and worthy of respect in the way you act, and true to the promises you make.
scope: 'Also called grave: serious, sad, and worthy of respect in the way you act, and true to promises,
  not firm and humourless in what you believe.'
examples:
- The judge was solemn as he pronounced sentence.
- She made a solemn promise to help.
