simpleMeaning: part of the study of people and how they live, that looks at people from long before writing
  and at the way they lived
scope: 'Also called archeology: the study of people from long before writing and how they lived, not the
  study of people in general.'
examples:
- She studied archaeology at university to learn about early people.
- Archaeology helped us learn how people lived thousands of years ago.
