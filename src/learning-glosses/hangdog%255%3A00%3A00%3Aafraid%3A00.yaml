simpleMeaning: made so afraid that a person gives in and does what others want
scope: This describes a person made by fear to give in and obey, not just a person who looks sad or sorry.
examples:
- The hangdog workers did as they were told, too afraid to argue.
- After the threats, he became hangdog and obeyed every order without a word.
