senseId: curable%5:00:00:tempered:02
synsetId: 01525895-s
simpleMeaning: able to be made hard by adding something, or by using something else that acts on it
scope: This sense is about a material that can be made hard. It is not about a disease that can be cured,
  and not about a person getting well.
examples:
- The metal is curable, so adding this powder will make it hard.
- This kind of steel is curable and becomes much harder after the treatment.
