simpleMeaning: Joining the main part of the breastbone and the seventh rib, this is the smallest of the
  three parts of the breastbone
scope: This name picks out the smallest of the three parts of the breastbone, the one joining the main
  part of that bone and the seventh rib.
examples:
- The xiphoid process joins the main part of the breastbone and the seventh rib.
- Of the three parts of the breastbone, the xiphoid process is the smallest.
