simpleMeaning: the idea that each country should act on its own, not together with others, to reach its
  goals
scope: The idea that each country should act alone to reach its goals; not the idea that your own country
  is better than all others, and not the wish for freedom from rule by another country.
examples:
- Nationalism led each country to make its own plans and refuse joint ones.
- After the war, nationalism grew and leaders stopped working together.
