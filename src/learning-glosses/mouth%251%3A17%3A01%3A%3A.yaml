simpleMeaning: an opening in rock or land that is shaped like a large entrance, such as a cave or a gorge.
scope: This is an opening in rock or land that looks like a mouth, not a body part on the face and not
  the act of forming words silently.
examples:
- The river vanished into the mouth of the cave.
- We stood at the mouth of the gorge and looked up.
