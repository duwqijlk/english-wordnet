simpleMeaning: A loud, ringing sound that repeats and echoes.
scope: 'Another name for clang, clank, clash, clangor, clangour or clangoring: a loud, echoing sound that
  repeats, not the verb for making a sudden bang, a vehicle collision, or a market slump.'
examples:
- The crash of cymbals echoed across the hall.
- From the kitchen came the crash of falling pans.
