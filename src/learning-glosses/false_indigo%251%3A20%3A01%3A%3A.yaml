simpleMeaning: A hairy bush of the Pacific coast of the United States bears clusters of red to dark blue
  flowers and grows upright to wide-spreading.
scope: Also called bastard indigo, this is a hairy bush of the Pacific coast, not a true indigo plant.
examples:
- The false indigo bore clusters of red flowers.
- False indigo grows along the Pacific coast.
