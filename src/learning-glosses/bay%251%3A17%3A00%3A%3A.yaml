simpleMeaning: A curved inward part of a coastline that is bigger than a cove but smaller than a gulf.
scope: This is a coastal inlet of a certain size; it is not the tree, not a dog's long cry, and not a
  section of a room.
examples:
- The boat anchored in a quiet bay sheltered from the wind.
- We swam across the bay to the far beach.
