simpleMeaning: Make one's body or a part of it free of dirt, for example by washing.
scope: This is about washing the body, not about removing dirt from clothes or rooms, or about taking
  all someone's money.
examples:
- The children cleaned themselves up before dinner.
- He cleaned his teeth after breakfast.
