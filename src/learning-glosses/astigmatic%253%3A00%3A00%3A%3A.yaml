simpleMeaning: of a fault in the eye or a lens where the curve is not round, so light rays do not meet
  at one point and things look bent
scope: Of a fault in the eye or a lens that stops light rays meeting at one point, not of a cloudy lens.
examples:
- His astigmatic eye made straight lines look curved.
- The optician said her astigmatic lens needed a special shape.
