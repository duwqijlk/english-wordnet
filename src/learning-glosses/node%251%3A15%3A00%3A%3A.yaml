simpleMeaning: In astronomy, a point where the path of a body in space (its orbit) crosses a flat surface
  (a plane)
scope: In astronomy, this is a point where a path in space crosses a flat surface, not a lump on the body
  and not the physics point of least movement.
examples:
- The moon crosses this node twice in each full trip around the Earth.
- At the node, the planet's path crosses the flat surface used to measure it.
