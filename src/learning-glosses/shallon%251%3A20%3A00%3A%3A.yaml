simpleMeaning: Dark purple berries the size of grapes, which people can eat, grow on a small shrub of
  the Pacific coast of North America that keeps its leaves all year.
scope: 'Also called salal: a small shrub that keeps its leaves all year, with dark purple berries the
  size of grapes.'
examples:
- Shallon grows along the Pacific coast.
- We picked shallon berries and ate them.
