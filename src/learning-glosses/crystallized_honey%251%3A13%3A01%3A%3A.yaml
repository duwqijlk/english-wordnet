simpleMeaning: A thick sweet food made by bees in which some of the sweet stuff inside has on its own
  turned into hard grains as it leaves the liquid.
scope: Thick sweet food from bees that has gone grainy on its own, not runny fresh food from bees and
  not sugar.
examples:
- The crystallized honey would not pour from the jar.
- He warmed the crystallized honey to make it runny again.
