simpleMeaning: rough plant food that the body cannot break down and that has little food value, yet its
  bulk keeps the gut moving
scope: Rough plant food that keeps the gut moving, not a thread, not a cell of the body, and not a person's
  inner qualities.
examples:
- Bran is full of fiber.
- Doctors say fiber helps the gut work well.
