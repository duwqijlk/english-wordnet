senseId: 'functional_disorder%1:26:00::'
synsetId: 14076866-n
simpleMeaning: A sickness that shows signs, but no fault can be found in the body or its parts that would
  cause them.
scope: This is a sickness with signs but no fault found in the body; not a sickness with a known bodily
  cause, and not a sickness of the mind alone.
examples:
- Her functional disorder left doctors puzzled, as every test came back clear.
- A functional disorder can still cause real pain, even when no fault is found.
