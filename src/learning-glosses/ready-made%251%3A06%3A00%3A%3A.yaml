simpleMeaning: A thing like a coat or a chair, built ahead of time and put on sale for anyone to buy
scope: A thing built ahead of time and put on sale, not one made to order for a single buyer and not a
  one-off work of art.
examples:
- Their flat was filled with ready-mades, all bought off the shelf.
- She bought a ready-made dress because it was already in the shop.
