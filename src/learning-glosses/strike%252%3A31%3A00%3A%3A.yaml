simpleMeaning: Work out and reach a result, such as a fair balance or a deal, after careful thought and
  weighing.
scope: This is reaching an agreement or a fair balance after thought, not giving a blow or attacking a
  target.
examples:
- The two sides struck a bargain after hours of talks.
- She struck a balance between study and rest.
