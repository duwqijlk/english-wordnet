simpleMeaning: From the corner tube of the face this blood tube runs on to meet the tube behind the jaw,
  then pours into the deep tube of the neck.
scope: 'Also called the anterior facial vein: from the corner tube of the face this blood tube runs on
  to meet the tube behind the jaw, then pours into the deep tube of the neck.'
examples:
- The vena facialis anterior joins the retromandibular vein.
- The vena facialis anterior empties into the internal jugular vein.
