simpleMeaning: White, red, or purple blooms last all summer on this plant of the group called Callirhoe,
  whose leaves are split like the fingers of a hand.
scope: This plant sits in the group called Callirhoe and not among poppies, with hand-shaped leaves and
  blooms of white, red, or purple through the summer.
examples:
- The poppy mallow bloomed all summer.
- The poppy mallow opened white blooms.
