simpleMeaning: A big handgun, usually kept in a leather case, that riders of long ago carried at their
  side
scope: A big handgun riders of long ago carried at their side, also called horse-pistol; not a small handgun
  of today and not a rifle.
examples:
- The old horse pistol hung in its holster by the saddle.
- He kept a horse pistol ready when he rode across the open land.
