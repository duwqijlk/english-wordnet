senseId: 'capture%1:22:00::'
synsetId: 13463888-n
simpleMeaning: any process in which a very small part of matter (an atom) or its center (the nucleus)
  takes in one more very small part (a particle)
scope: This is about a very small part of matter (an atom) or its center (the nucleus) taking in one more
  very small part. It is not taking a chess piece off the board, not catching a person or animal, and
  not a star or planet holding something by its pull.
examples:
- The capture happened when the atom took in a neutron.
- Scientists studied the capture of a free particle by the nucleus.
