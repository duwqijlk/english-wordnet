simpleMeaning: one smooth side of a cut stone or jewel, or of a bone
scope: This is one smooth side of a cut stone or a bone, not the whole stone and not one side of a story.
examples:
- Light shone from every facet of the diamond.
- The facet of the bone was smooth to the touch.
