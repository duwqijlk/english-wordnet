simpleMeaning: Open grass ground that people in a place may share for their animals to feed on
scope: Open grass ground that people in a place may share for their animals to feed on; commons is another
  name for this sense, not a field for one farmer's use alone, and not a park.
examples:
- Villagers may graze their sheep on the common land.
- The common land lies at the edge of the village.
