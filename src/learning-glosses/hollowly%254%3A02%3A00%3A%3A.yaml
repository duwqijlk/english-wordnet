simpleMeaning: in a way that sounds empty inside, or that seems to have no real feeling behind it
scope: This tells how a sound rings as if from an empty space, or how words feel empty and not real. It
  does not name a hole or an empty place itself.
examples:
- Her steps echoed hollowly in the empty hall.
- He laughed hollowly, but there was no joy in the sound.
