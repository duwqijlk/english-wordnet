simpleMeaning: A bird of the south-west United States, like the yellow-shafted kind but with no red neck
scope: This is a bird of the south-west United States like the yellow-shafted kind but with no red neck,
  not the yellow-shafted kind itself and not any other woodpecker.
examples:
- A gilded flicker called from the tall cactus.
- The gilded flicker lacked the red neck of its cousin.
