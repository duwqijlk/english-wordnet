simpleMeaning: A kind of tube with the air taken out, once used to change a strong electric flow into
  a steady flow in one direction
scope: This is a kind of tube with the air taken out, once used to change a strong electric flow into
  a steady flow in one direction, not any other kind of tube and not a modern part that does the same
  job.
examples:
- The old X-ray set used a kenotron in its power supply.
- A kenotron changed the high voltage for the television's picture tube.
