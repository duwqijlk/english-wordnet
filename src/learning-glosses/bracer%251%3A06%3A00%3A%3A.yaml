simpleMeaning: something that makes a person feel stronger or better again, especially a drink of strong
  alcohol
scope: This is a thing, especially a drink of strong alcohol, that gives strength back, not the cover
  worn on the arm or wrist in sports like archery.
examples:
- A small glass of brandy was his morning bracer.
- He asked for a bracer to steady himself after the shock.
