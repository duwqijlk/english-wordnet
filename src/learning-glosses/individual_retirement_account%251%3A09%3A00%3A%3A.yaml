simpleMeaning: Each year you may put in a set sum for the years after you stop work, and the tax on the
  interest it earns is put off till later
scope: This plan puts off the tax on its interest till later, rather than taxing it each year.
examples:
- She put money in an individual retirement account each year.
- His individual retirement account lets the tax on its interest wait till later.
