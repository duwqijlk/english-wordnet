simpleMeaning: a serious, sudden illness, sometimes deadly, from a staphylococcus infection, marked by
  fever, diarrhoea, sickness, reddened skin all over and shock; especially in women using very absorbent
  tampons while menstruating
scope: 'Also called toxic shock and toxic shock syndrome: a sudden illness with fever, sickness, reddened
  skin all over and shock, linked to a staphylococcus infection and to tampon use while menstruating.'
examples:
- TSS caused fever, sickness and reddened skin.
- She was treated for TSS after using tampons.
