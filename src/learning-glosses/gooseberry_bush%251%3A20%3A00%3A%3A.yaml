simpleMeaning: a thorny shrub from Europe and Asia with greenish flowers tinged with purple and egg-shaped
  yellow-green or red-purple berries
scope: Also called gooseberry; the shrub that bears gooseberries, not the fruit itself and not another
  thorny shrub.
examples:
- A gooseberry bush grows by the fence, its branches covered in thorns.
- She planted a gooseberry bush so she could pick the fruit in summer.
