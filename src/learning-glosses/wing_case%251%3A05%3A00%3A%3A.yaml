simpleMeaning: Guarding the thin back flaps that do the flying, this hard front cover is one of two on
  a beetle or some other insects.
scope: Also called elytron, this is the hard front cover on a beetle or some other insect, lying over
  the thin back flaps that do the flying to guard them.
examples:
- The beetle's wing case covered its thin back flaps.
- Under the wing case lay the thin flaps the beetle flies with.
