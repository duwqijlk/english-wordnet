senseId: 'sprit%1:06:00::'
synsetId: 04296587-n
simpleMeaning: a light pole that crosses a sail in a slanted way, where the sail runs from the front to
  the back of the boat
scope: This is a light pole on a sailing boat, not the sail itself and not the tall main pole that holds
  the sail up.
examples:
- The sprit crossed the sail at a slant and held its top corner out.
- The sailor tied the sail to the sprit before the boat left.
