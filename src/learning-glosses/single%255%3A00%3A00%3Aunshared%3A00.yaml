simpleMeaning: intended for, or used by, just one person or thing, not shared between several.
scope: This is not attention or effort fixed on one aim; it is something intended for just one person
  or thing.
examples:
- The hotel charges the same for a single room as for a double.
- The recipe makes a single serving, so there is no need to divide it.
