simpleMeaning: a power tool with a round steel plate edged with teeth, that spins on a rod for cutting
scope: A power tool with a round toothed steel plate that spins to cut; buzz saw is another name for this
  sense, not a saw worked by hand and not a band saw with a loop of teeth.
examples:
- He cut the boards with a circular saw.
- The circular saw spun fast and cut the wood in seconds.
