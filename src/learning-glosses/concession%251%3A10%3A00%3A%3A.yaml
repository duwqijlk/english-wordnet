simpleMeaning: a small business, such as a food stall in a park, that a person or firm runs inside a bigger
  one under a written deal
scope: 'Also called a grant: a deal to run a small business under a bigger one, not giving in to an argument
  and not the act of yielding.'
examples:
- He got the beer concession at the ball park.
- The company won the concession to run the snack bar in the stadium.
