simpleMeaning: a cart moved by hand, with a frame on two low wheels, a ledge at the bottom and handles
  at the top, for moving crates or other heavy loads
scope: This is the small cart moved by hand; hand truck is another name for this sense, not the motor
  vehicle built for hauling and not the verb for carrying goods.
examples:
- We borrowed a hand truck to shift the heavy boxes.
- A hand truck makes it easier to move crates through the warehouse.
