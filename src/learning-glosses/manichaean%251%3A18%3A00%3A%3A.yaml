simpleMeaning: One who holds to Manichaeism.
scope: This word is for an adherent of Manichaeism; Manichean and Manichee are other names for this sense,
  not for things to do with Manichaeism and not for the teaching of two powers.
examples:
- The Manichaean followed the teaching all his life.
- Two Manichaeans met in the town.
