simpleMeaning: A way of mending the eye by putting in a piece of clear front tissue given by another person,
  after a cloudy lens has been taken out.
scope: A way of mending the eye by putting in a piece of clear front tissue given by another person after
  a cloudy lens has been taken out, not a way of mending the eye with glass and not the taking out of
  the cloudy lens itself.
examples:
- After the cataract was removed, epikeratophakia repaired her eye.
- Epikeratophakia uses donated tissue to mend the eye.
