simpleMeaning: Made to move across frozen water, this craft rides on thin blades set under a frame in
  the shape of a cross.
scope: Also called iceboat and scooter, it rides on blades across frozen water, not on open water.
examples:
- The ice yacht moved across the frozen lake on its thin blades.
- They took the ice yacht out when the lake froze hard.
