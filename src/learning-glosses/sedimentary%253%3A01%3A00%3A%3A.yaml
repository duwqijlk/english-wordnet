simpleMeaning: Like sediment, holding sediment, or made from sediment that has built up.
scope: Used of rock or other deposits formed by the build-up of sediment.
examples:
- The rock was sedimentary, formed from sand and mud pressed together.
- These deposits are sedimentary, built up from grains carried by water.
