simpleMeaning: a single drop of the clear salty liquid that the eyes produce
scope: This is the drop of fluid itself, not the act of crying or of eyes filling with water, which belongs
  to a different sense.
examples:
- A single tear rolled down her cheek as she said goodbye.
- His story brought tears to her eyes.
