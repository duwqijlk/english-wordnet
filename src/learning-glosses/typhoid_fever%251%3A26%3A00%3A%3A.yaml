simpleMeaning: A grave infection of the gut, with the gut inflamed and sores inside it, caught from a
  germ taken in with food or water.
scope: Also called typhoid and enteric fever, this grave infection of the gut comes from a germ taken
  in with food or water.
examples:
- He caught typhoid fever from food.
- Typhoid fever inflamed his gut.
