simpleMeaning: The flesh of young Atlantic cod up to two pounds in weight, and of young haddock and pollock
  too, often grilled.
scope: Also called schrod; the flesh of young Atlantic cod, haddock, and pollock, not the young fish itself
  split and boned for cooking.
examples:
- Scrod was on the menu, served with butter.
- They ordered broiled scrod for dinner.
