simpleMeaning: in a way that does the opposite of what you are told to do and does not obey
scope: Done in a way that will not obey, also called contrarily and also called contrariwise. It is not
  done in a helpful, willing, or obedient way.
examples:
- He perversely refused to follow the simple rules.
- She perversely did the opposite of what her teacher asked.
