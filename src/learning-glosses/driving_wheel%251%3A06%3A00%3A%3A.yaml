simpleMeaning: the round part of a motor vehicle that turns engine power into the push that moves it forward
scope: The round part of a motor vehicle that moves it forward, not a steering part that turns it and
  not a spare kept in the boot.
examples:
- The driving wheel spun in the mud.
- Power goes to the driving wheels at the back.
