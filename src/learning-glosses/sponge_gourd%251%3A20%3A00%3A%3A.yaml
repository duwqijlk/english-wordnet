simpleMeaning: Farmed for the sponge made from its ripe fruit's dried fibrous interior, one of several
  tropical vines that live a season and bear large yellow flowers and edible young fruit.
scope: Another name for the tropical vine also called dishcloth gourd, luffa or rag gourd; not the dried
  sponge itself.
examples:
- Sponge gourd vines produce large yellow flowers.
- A ripe sponge gourd is dried so its fibres can be used as a sponge.
