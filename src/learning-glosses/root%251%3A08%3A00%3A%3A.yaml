simpleMeaning: the part of a tooth, nail, hair or other part of the body that is set into what is around
  it
scope: This is the hidden part of a tooth, nail or hair, not the part of a plant under the ground and
  not a basic word form.
examples:
- The dentist found decay near the root of the tooth.
- Each hair grows from a root under the skin.
