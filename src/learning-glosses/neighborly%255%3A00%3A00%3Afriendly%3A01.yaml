simpleMeaning: showing the kind and friendly qualities people expect from someone who lives near them
scope: 'Also called neighbourly: this means being kind and friendly to people who live near you, not just
  living near someone.'
examples:
- She gave us a neighborly welcome when we moved in next door.
- In a neighborly way, he offered to water our plants while we were away.
