simpleMeaning: a sudden sickness of the gut, brought on by a kind of germ, with loose bowels, fever and
  pain in the belly
scope: Also called bacillary dysentery; a gut sickness caught from germs, not food poisoning and not a
  long-lasting bowel disease.
examples:
- The doctor said the shigellosis came from dirty water.
- Shigellosis left him weak, with fever and belly pain for days.
