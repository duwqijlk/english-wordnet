simpleMeaning: a plain word for any bird of prey said to hunt and eat farm birds
scope: 'Also called hen hawk: a plain word for any bird of prey said to hunt farm birds, not the name
  of one hawk kind and not a hawk that hunts wild birds only.'
examples:
- Farmers called it a chicken hawk after it took one of their hens.
- A chicken hawk circled above the yard, watching the hens.
