simpleMeaning: being together in a peaceful, friendly way, with no fighting or bad feeling
scope: This sense is about people or groups being together without fighting; it is not the sense about
  parts of a thing matching or fitting each other well.
examples:
- They have a harmonious relationship and rarely argue.
- The neighbours live in a harmonious community where everyone helps each other.
