senseId: 'sex-limited%3:01:00::'
synsetId: 02898570-a
simpleMeaning: about features that show up in a different way in men and in women
scope: About a feature that shows up one way in men and another way in women; not a feature that is the
  same in both, and not a trait found in only one sex.
examples:
- The bright feathers are a sex-limited trait, much stronger in the males.
- This sex-limited feature shows up in a different way in the two sexes.
