simpleMeaning: One who keeps failing, and keeps losing.
scope: This sense is also called failure and loser, for one who keeps failing, and keeps losing, where
  failure is someone with a long history of losing, who comes out worse again and again.
examples:
- The nonstarter kept failing and losing.
- Nonstarters keep failing.
