simpleMeaning: make an object, such as a record, by forcing soft plastic material into shape in a mould
scope: This is specifically forming an object from plastic material, not making things by pressure in
  general.
examples:
- The factory presses vinyl into thin black discs.
- Workers pressed the warm plastic into a mould shaped like a toy.
