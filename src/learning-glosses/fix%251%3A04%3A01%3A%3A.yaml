simpleMeaning: A special permission to skip a rule or penalty, given because someone used money or pressure
  to get it.
scope: A corrupt favour that lets someone escape a rule or fee, not the repair of a broken object and
  not the setting up of something in advance.
examples:
- The businessman paid for a fix and avoided the inspection entirely.
- Investigators found that several tax fixes had been arranged for the casino owners.
