simpleMeaning: moving or looking forward in a direct way, without turning aside.
scope: This describes the direction of movement, not honest speech, not a road, and not a person's sexual
  orientation.
examples:
- The arrow flew straight and hit the centre of the target.
- Walk straight ahead until you reach the door.
