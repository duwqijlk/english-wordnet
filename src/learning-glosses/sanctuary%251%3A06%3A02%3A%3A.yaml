simpleMeaning: A holy place set apart where sacred objects are kept
scope: A holy place set apart for keeping sacred objects, not a safe place to hide from danger and not
  the area around a church altar for clergy and choir.
examples:
- The sanctuary held the sacred vessels of the temple.
- Only the priests might enter the sanctuary where the holy objects were kept.
