simpleMeaning: The thin skin that forms round an egg once it has been joined by a sperm, and stops more
  sperm from getting in
scope: The thin skin that forms round an egg once it has been joined by a sperm and stops more sperm from
  getting in; not the skin of an unfertilized egg and not the shell of an egg.
examples:
- The fertilization membrane formed round the egg.
- Once the fertilization membrane appears, no more sperm can enter.
