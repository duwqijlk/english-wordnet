simpleMeaning: to secretly collect secret information, information a government has marked secret or that
  could cause harm if known, as secret work
scope: This is doing secret work to get secret facts; it is not just watching a person in secret, and
  not the hired person who does this work.
examples:
- For ten years he would spy for another country and send back secret reports.
- She was caught spying and taking secret papers for the enemy.
