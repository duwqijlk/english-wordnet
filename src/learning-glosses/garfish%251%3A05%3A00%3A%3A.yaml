simpleMeaning: Hard scales cover the body of this old hunting creature of North American waters, which
  has long jaws lined with thin, sharp teeth.
scope: A gar, a billfish, or a garpike is another name for this old hunting creature of North American
  waters, with hard scales and long jaws lined with thin, sharp teeth.
examples:
- The garfish snapped its long jaws shut.
- Garfish moved through the water with their long jaws open.
