simpleMeaning: A set-up that oils the inside of a fuel-burning engine, in which a pump pushes oil into
  the parts that bear the load.
scope: This is a set-up that oils the inside of a fuel-burning engine by a pump pushing oil into the parts
  that bear the load, not a hand oiler, and it is also called a force-feed lubricating system, a lubricating
  system, a pressure-feed lubricating system, and a pressure feed.
examples:
- The engine has a force feed for its bearings.
- A force feed keeps the oil moving.
