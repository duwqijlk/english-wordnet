simpleMeaning: a large, rough fern that often grows several feet high; it is basically a weed fern, and
  it grows in many parts of the world
scope: 'Also called brake and pasture brake: a large, rough weed fern found in many parts of the world,
  not the fern from south-east Asia that cannot live in cold areas.'
examples:
- Tall bracken covered the hill in summer.
- The path went through thick bracken that stood as high as my waist.
