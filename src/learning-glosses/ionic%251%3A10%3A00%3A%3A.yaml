simpleMeaning: The form of Ancient Greek spoken and written in Attica and Athens and Ionia
scope: This is the form of Ancient Greek spoken and written in Attica and Athens and Ionia; Attic, Classical
  Greek and Ionic dialect are other names for this sense, and it is one old Greek way of speaking, not
  the Greek of today and not the language of Ionia alone.
examples:
- Ionic was the Greek spoken in Athens in ancient times.
- Herodotus wrote much of his history in Ionic.
