simpleMeaning: said of a thing in a state of asynergy, when its parts fail to work as one
scope: Said of a thing whose parts fail to work as one, not of one that works well and not of one that
  is hurt.
examples:
- The asynergic arm could not move in time with the other arm.
- Her asynergic leg made walking hard.
