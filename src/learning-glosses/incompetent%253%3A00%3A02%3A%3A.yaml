simpleMeaning: In law, not qualified or good enough
scope: In law, not qualified or good enough; not stupid in general, but lacking what the law asks for
  in the matter at hand.
examples:
- The court ruled the witness incompetent to testify.
- An incompetent witness cannot give evidence in court.
