simpleMeaning: a unit for measuring length, equal to 12 inches or one third of a yard
scope: 'Also called foot: this is a unit for measuring length, 12 inches, not the part at the end of a
  leg.'
examples:
- The room is 10 ft wide and 12 ft long.
- He is almost 6 ft tall.
