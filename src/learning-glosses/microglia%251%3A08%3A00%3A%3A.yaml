simpleMeaning: Supporting tissue of the brain and nerves, from the middle layer of the body as it grows,
  that can turn into cells able to eat up other cells.
scope: Of the brain's supporting tissue, able to turn into cells that eat up other cells.
examples:
- The microglia in the sample had turned into cells that eat up waste.
- Microglia are found among the nerves of the brain.
