scope: In mathematics, this is a kind of shape-study in which space is like a ball and a line is like
  a great ring round it, not flat shape-study and not shape-study where lines never meet.
examples:
- Bernhard Riemann pioneered elliptic geometry.
- In elliptic geometry, a line is like a great ring round a ball.
