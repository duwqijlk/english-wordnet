simpleMeaning: Grown in the United States for its fast growth and thick leaves, and in Europe for wood,
  this much-seen poplar stands in the east and middle of the country.
scope: The east and middle of the United States hold this much-seen poplar, grown there for its fast growth
  and thick leaves, and in Europe for wood.
examples:
- The necklace poplar grew fast and put out thick leaves.
- In Europe the necklace poplar is grown for its wood.
