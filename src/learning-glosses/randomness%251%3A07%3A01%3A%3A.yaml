simpleMeaning: In thermodynamics, a measure of how much energy in a system can no longer be used to do
  work
scope: 'Also called entropy: in thermodynamics, a measure of energy that can no longer do work, not the
  idea that things happen by chance with no pattern.'
examples:
- The randomness of the system grew as its energy spread out and could no longer do work.
- Scientists use randomness to show how much energy in a system is no longer free to do work.
