simpleMeaning: A Russian in the left-wing larger group that followed Lenin and later became the Russian
  communist party.
scope: 'Also called Bolshevist: a Russian in the left-wing larger group that followed Lenin and later
  became the Russian communist party, set apart from the insult use of the word by being a member of the
  group itself.'
examples:
- The Bolsheviks took power in 1917.
- He joined the Bolsheviks as a young man.
