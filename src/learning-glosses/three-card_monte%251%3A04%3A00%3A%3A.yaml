simpleMeaning: 'A betting game from Spain: 3 are laid face up, and players bet one will turn up again
  before the others as they are dealt one at a time'
scope: This is a betting game from Spain in which 3 are laid face up, also called monte; not poker and
  not a card trick.
examples:
- The cheat ran a game of three-card monte on the street corner.
- In three-card monte, three are laid face up and you bet one will turn up again first.
