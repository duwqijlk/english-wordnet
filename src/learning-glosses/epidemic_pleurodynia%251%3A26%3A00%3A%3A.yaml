simpleMeaning: When this catching illness breaks out widely, people feel sudden sharp pains, most often
  in the chest.
scope: This catching illness that breaks out widely is also called diaphragmatic pleurisy, epidemic myalgia
  and myosis.
examples:
- Epidemic pleurodynia broke out across the camp.
- His epidemic pleurodynia meant sharp pains in his chest.
