simpleMeaning: One of 32 directions marked on the face of a compass, showing a direction across the ground
  rather than up or down.
scope: This is not a printed arrowhead or a place on a map; it is one of the directions shown on a compass.
examples:
- The old compass shows all 32 points.
- Southeast is one of the compass points.
