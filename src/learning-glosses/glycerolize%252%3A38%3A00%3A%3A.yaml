senseId: 'glycerolize%2:38:00::'
synsetId: 01991795-v
simpleMeaning: to put something into a thick sweet liquid
scope: To put something into a thick sweet liquid; glycerolise is another name for this sense, not to
  stir the liquid into something and not to soak something in plain water.
examples:
- The lab glycerolized the samples before storing them.
- He glycerolized the cells and left them in the liquid overnight.
