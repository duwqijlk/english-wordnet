simpleMeaning: to promise that a thing is as good as you say, that facts you give about it are right,
  or that it is in the state you say
scope: To promise that a thing is as you say it is, not a written promise given when a person buys a thing.
examples:
- The seller guarantees every watch he sells.
- I guarantee that this information is true.
