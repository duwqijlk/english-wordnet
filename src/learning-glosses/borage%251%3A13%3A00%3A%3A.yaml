simpleMeaning: Sauces and mixed drinks take their taste from the leaves of this herb, and its young leaves
  can be eaten in salads or cooked.
scope: This is the herb valued for its leaves in sauces and punches, not the blue-flowered plant grown
  for medicine.
examples:
- She added borage to the sauce to give it more taste.
- Young borage leaves went into the salad.
