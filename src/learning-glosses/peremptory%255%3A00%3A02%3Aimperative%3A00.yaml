simpleMeaning: said or done in a way that does not let a person say no or argue back
scope: This sense is about an order or way of speaking that will not let a person refuse or argue back,
  not about a person who acts proud and gives orders without a good right to do so.
examples:
- 'She gave a peremptory order: ''Leave at once.'''
- His peremptory tone left no room to say no.
