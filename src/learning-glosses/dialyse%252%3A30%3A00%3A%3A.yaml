simpleMeaning: to split a mix apart by passing it through a thin skin that lets only some parts through
scope: To split a mix apart by passing it through a thin skin that lets only some parts through, also
  called dialyze; not filtering through paper, and not breaking a thing apart by force.
examples:
- The doctors dialysed the patient's blood each week.
- The lab dialysed the mixture to take out the salt.
