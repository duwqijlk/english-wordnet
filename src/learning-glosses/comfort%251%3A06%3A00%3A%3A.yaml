simpleMeaning: a bed cover made of two cloth layers with filling stitched between them
scope: Another name for this sense is quilt, comforter or puff; it is the padded bed cover, not the feeling
  of ease or the act of consoling.
examples:
- Grandma kept a folded comfort at the foot of each bed.
- The old comfort was patched in several places.
