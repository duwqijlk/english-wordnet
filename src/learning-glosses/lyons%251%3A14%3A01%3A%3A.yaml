simpleMeaning: The church council of 1274 that brought the Greek Orthodox and the Roman Catholic Church
  together again for a time.
scope: This is the church council of 1274, not the council of 1245; Second Council of Lyons is another
  name for it.
examples:
- The council at Lyons in 1274 brought the two churches together for a time.
- Lyons is remembered for the council that joined the Greek and Roman churches in 1274.
