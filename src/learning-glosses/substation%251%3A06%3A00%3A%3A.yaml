senseId: 'substation%1:06:00::'
synsetId: 04355780-n
simpleMeaning: A part of a power system where electric power is changed to a lower voltage (lower electric
  strength) and sent out through wires for use in the area
scope: This station takes electric power and changes it to a lower strength before sending it out for
  use nearby; it does not make the power, and it is not a station for trains.
examples:
- A fire at the substation cut power to the street.
- Workers fixed the damaged substation before night.
