simpleMeaning: From the side of the gland in the neck, this blood tube, one on each side, carries blood
  away into the deep blood tube in the neck.
scope: One on each side, it drains the gland in the neck into the deep blood tube in the neck.
examples:
- The middle thyroid vein drains the side of the gland in the neck.
- Each middle thyroid vein pours blood into the deep blood tube in the neck.
