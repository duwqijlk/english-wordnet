simpleMeaning: A machine or device built for fighting a war, such as a battering ram or a catapult.
scope: This is a weapon or siege machine, not a motor that turns heat into motion, not a railway locomotive,
  and not a figurative means to an end.
examples:
- The castle gate finally gave way to the attackers' siege engines.
- Medieval armies built engines of war to hurl stones at city walls.
