simpleMeaning: A control worked by foot or by hand joins or breaks the link between a spinning shaft and
  the thing that drives it.
scope: Also called a clutch, this control joins or breaks the link between a spinning shaft and the thing
  that drives it.
examples:
- He smoothly released the clutch pedal with one foot and stepped on the gas with the other.
- He pressed the clutch pedal down with his foot.
