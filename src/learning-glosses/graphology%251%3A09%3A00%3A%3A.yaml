simpleMeaning: People most often use it to learn about a writer's nature, by studying how the person writes
  by hand
scope: The study of handwriting, most often to learn about the writer's nature, not the study of writing
  systems and not a way to judge skill.
examples:
- She took a course in graphology to learn what handwriting can show.
- The graphology book said bold loops showed a strong will.
