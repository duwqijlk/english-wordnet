simpleMeaning: to do with a name, being a name, or giving a name to something
scope: This sense is about names and naming, not the sense that means very small in amount and not the
  sense about a noun or a group of words that acts like a noun.
examples:
- They kept a nominal list of all the priests in the town.
- A nominal roll listed every man who had to pay tax.
