simpleMeaning: The thin outside part of the root comes in bits, fried until crisp
scope: 'Also called potato peel and potato peelings: the thin outside part of the root comes in bits,
  fried until crisp; not a raw strip and not the whole root.'
examples:
- She ate the potato skin while it was still crisp.
- The potato skins were crisp and salty.
