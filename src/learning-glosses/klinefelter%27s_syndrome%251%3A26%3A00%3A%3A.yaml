simpleMeaning: A condition in men marked by small testes, long legs, larger breasts, less sperm, and intellectual
  disability; caused by an extra X chromosome (XXY) in the male.
scope: Also called Klinefelter syndrome and XXY-syndrome; a condition in men only, not a condition of
  women and not a single missing chromosome.
examples:
- Men with Klinefelter's syndrome often have small testes and long legs.
- His doctor said the extra X chromosome explained his Klinefelter's syndrome.
