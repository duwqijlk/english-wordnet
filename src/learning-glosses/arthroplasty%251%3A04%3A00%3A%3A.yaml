simpleMeaning: An operation that rebuilds or replaces a joint that has grown wrongly or worn away
scope: An operation that rebuilds or replaces a damaged joint; not a simple repair of a broken bone and
  not the fitting of a false limb.
examples:
- She had an arthroplasty to replace her worn hip joint.
- Arthroplasty rebuilt the knee joint that had worn away.
