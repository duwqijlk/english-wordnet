senseId: 'landmark%1:08:00::'
synsetId: 05237687-n
simpleMeaning: a part of the body used as a fixed point for finding other parts of the body, as in surgery,
  or for taking measurements
scope: A part of the body that serves as a fixed point, not a famous event in history and not a well-known
  object in a landscape.
examples:
- The surgeon used a bony landmark to find the right place for the cut.
- The doctor measured from a landmark on the patient's skull.
