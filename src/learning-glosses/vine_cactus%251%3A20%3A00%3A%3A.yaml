simpleMeaning: A desert bush of the US Southwest and Mexico whose thin, bare, thorny branches sprout leaves
  and red flower clusters once the rains come.
scope: This is the desert plant also called ocotillo and coachwhip, another name for the same shrub; it
  is not a true climbing cactus.
examples:
- The vine cactus loses its leaves in the dry season and grows them again after rain.
- A vine cactus grew beside the trail, its thin, spiny branches reaching upward.
