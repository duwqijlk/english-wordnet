simpleMeaning: a feeling of fright that is almost nice to feel
scope: Also called a shiver, a shudder, a thrill, and a quiver, this is a feeling of fright that is almost
  nice to feel, not a sudden cold dread and not the cold feeling at the start of a fever.
examples:
- A chill ran through him at the surprise ending.
- The ghost story gave her a pleasant chill.
