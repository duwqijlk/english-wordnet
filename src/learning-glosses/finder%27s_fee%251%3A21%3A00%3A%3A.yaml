simpleMeaning: Money paid to a person who finds where money help will come from, or who brings people
  together to do business.
scope: Money paid to a person who finds where money help will come from, or who brings people together
  to do business; not a wage for work done and not a gift.
examples:
- The agency got a finder's fee when their candidate was hired as the new chief.
- He earned a finder's fee for bringing the two firms together.
