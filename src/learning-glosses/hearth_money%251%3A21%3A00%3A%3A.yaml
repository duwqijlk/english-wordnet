simpleMeaning: To keep the pope's office going, Roman Catholics pay a sum once a year
scope: A yearly sum paid by Roman Catholics to keep the pope's office going, not a tax for the local church
  and not a gift to a priest.
examples:
- In the old days, hearth money was paid once a year to Rome.
- Each family gave hearth money to support the pope.
