simpleMeaning: A quick-drying paint for the finger and toe tips, to give them colour or a shine.
scope: A quick-drying paint for the finger and toe tips; nail enamel and nail polish are other names for
  this, and it is not a paint for walls or a hand cream.
examples:
- She put on red nail varnish.
- The nail varnish dried in minutes.
