schema: oewn-learning-gloss-v2
senseId: 'anyway%4:02:00::'
synsetId: 00026948-r
simpleMeaning: used to show that what you are saying explains or supports something you have just said.
scope: It is not the sense meaning 'in any way'; it marks a statement that explains or backs up what came
  before.
examples:
- He lives by the sea; anyway, that explains his love of sailing.
- The train was late again, and anyway, that is why I missed the meeting.
