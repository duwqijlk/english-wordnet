simpleMeaning: A lawyer who acts for the Crown when the British ruler is a woman.
scope: A lawyer who acts for the Crown when the British ruler is a woman, not a lawyer for a king and
  not an ordinary lawyer.
examples:
- She became a Queen's Counsel after years at the bar.
- A Queen's Counsel advises the Crown in court.
