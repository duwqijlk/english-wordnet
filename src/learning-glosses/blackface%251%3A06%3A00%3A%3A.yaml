simpleMeaning: Dark face paint, usually made from burnt cork, worn by a performer to play the part of
  a Black person.
scope: Makeup worn on stage to imitate a Black person, not ordinary stage makeup.
examples:
- In the old show, the actor appeared in blackface to play the part.
- The review talked about the play's use of blackface on stage.
