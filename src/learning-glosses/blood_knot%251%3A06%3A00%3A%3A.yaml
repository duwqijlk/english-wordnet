simpleMeaning: a way of joining two short fishing lines by winding the end of each one round the other
  two or three times
scope: A way of joining two fishing lines, also called a barrel knot, not a loop in a single line and
  not a knot for tying a hook.
examples:
- He tied the two leaders with a blood knot.
- Use a blood knot to join the two fishing lines.
