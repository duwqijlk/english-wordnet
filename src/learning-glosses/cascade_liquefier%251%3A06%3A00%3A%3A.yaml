simpleMeaning: a machine used to turn air or oxygen and other gases into a fluid
scope: A machine that turns air, oxygen and other gases into a fluid, not a machine that makes ice and
  not a tank that only stores gas.
examples:
- The cascade liquefier turned the oxygen into a fluid for storage.
- Engineers ran the cascade liquefier to turn air into a fluid.
