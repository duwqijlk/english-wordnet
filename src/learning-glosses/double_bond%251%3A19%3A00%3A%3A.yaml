senseId: 'double_bond%1:19:00::'
synsetId: 11457937-n
simpleMeaning: In chemistry, a link between two atoms in which they share two pairs of electrons, tiny
  bits that carry a charge.
scope: A link between two atoms sharing two pairs of electrons, not a single link sharing one pair and
  not a link between three atoms.
examples:
- The two atoms in a double bond share two pairs of electrons.
- Oxygen gas has a double bond between its two atoms.
