simpleMeaning: A title that a college or university gives you after you finish a course of study.
scope: This is the qualification you earn at university, not a unit of temperature or angle and not an
  amount or level of something.
examples:
- She has a degree in history from the University of Leeds.
- After three years of study, he received his degree.
