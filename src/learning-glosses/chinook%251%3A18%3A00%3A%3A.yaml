simpleMeaning: A member of a leading North American Indian people who held the mouth of the Columbia River,
  living in settlements rather than in tribes
scope: This is a member of the Chinook people, not a speaker of the Chinook language alone and not a member
  of another people of the north-west coast.
examples:
- The Chinook controlled the mouth of the Columbia River.
- Chinook families lived in settlements along the river.
