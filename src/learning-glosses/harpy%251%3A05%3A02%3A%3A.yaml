simpleMeaning: one of a kind of fruit-eating bat, of the kind called Nyctimene, known by nose holes pulled
  out into tubes that point away from each other
scope: A fruit-eating bat, not the big black-and-white eagle and not a fierce, ill-tempered woman.
examples:
- The harpy hung upside down in the tree, eating figs.
- At dusk the harpies flew out to feed on fruit.
