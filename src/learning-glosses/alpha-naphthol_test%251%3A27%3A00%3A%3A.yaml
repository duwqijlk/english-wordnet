simpleMeaning: 'a test that shows whether a liquid holds sugars and starches: if it does, a violet ring
  forms when the liquid meets a certain chemical and strong acid'
scope: A test for sugars and starches in a liquid, not a test for other chemicals.
examples:
- The alpha-naphthol test turned violet, showing sugar in the juice.
- We ran an alpha-naphthol test on the solution in class.
