simpleMeaning: Between 1775 and 1917, the Russian Empire was cut into areas, and this was one such area,
  run as part of the Empire
scope: An area cut from the Russian Empire and run as part of it between 1775 and 1917, not a town and
  not a small local area.
examples:
- Moscow was the centre of a governorate-general.
- The governorate-general covered a wide area of the Russian Empire.
