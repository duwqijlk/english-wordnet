simpleMeaning: to lose strength or power to work well, or to become dull or seem dull and not interesting
  to someone
scope: This is a thing getting weaker or starting to seem dull to someone, not the burial cloth and not
  the sense where a pleasing thing becomes too much.
examples:
- The joke palled after we heard it many times.
- The long talk soon palled on everyone in the room.
