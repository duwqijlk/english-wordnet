simpleMeaning: Words that paint a clear, lively picture of a thing.
scope: Words that paint a clear, lively picture of a thing; also called picture, depiction, or characterization;
  not showing a thing by drawing or painting or the like, nor a drawing that shows the outlines of shapes
  and things.
examples:
- The delineation brought the town to life.
- Their delineation of the market was full of colour.
