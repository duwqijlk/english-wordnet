senseId: northeasterly%5:00:01:north:00
synsetId: 01606174-s
simpleMeaning: Set in, or turned to, the north-east.
scope: This sense is also called northeast and northeastern, for being set in, or turned to, the north-east,
  where northeast is placed in, or facing, the part of a place that lies between north and east, unlike
  the sense for coming from the north-east.
examples:
- The town was northeasterly, set in the north-east.
- The coast was northeasterly, turned to the north-east.
