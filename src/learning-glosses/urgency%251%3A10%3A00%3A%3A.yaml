schema: oewn-learning-gloss-v2
senseId: 'urgency%1:10:00::'
synsetId: 07203045-n
simpleMeaning: asking again and again in a strong way for someone to do something
scope: This sense is also called urging; it is strong, repeated asking, not how important a task is and
  not the state of needing action at once.
examples:
- He spoke with urgency, begging them again and again to help.
- With great urgency, she asked the council to save the school.
