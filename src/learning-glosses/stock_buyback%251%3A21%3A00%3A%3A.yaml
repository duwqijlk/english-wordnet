simpleMeaning: Each share earns more and the price goes up when a company repurchases its own shares held
  by others, which can hold back a bid to take it over.
scope: This is a company repurchasing its own shares held by others, not shares of another company, which
  lifts what each share earns and can hold back a bid to take it over.
examples:
- The stock buyback lifted what each share earned, and the price went up.
- A stock buyback can hold back a bid to take the company over.
