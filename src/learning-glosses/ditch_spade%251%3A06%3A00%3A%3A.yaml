simpleMeaning: a digging tool with a long handle, made for cutting narrow trenches
scope: A digging tool with a long handle for cutting narrow trenches, also called a long-handled spade,
  and not a short garden tool or a tool for moving loose earth.
examples:
- He used a ditch spade to cut a narrow channel for the water.
- The ditch spade reached deep into the trench without bending.
