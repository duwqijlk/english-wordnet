simpleMeaning: The process of wave-like squeezes by the muscles of the food tube that move food along.
scope: The wave-like squeezes of the food tube that move food along; peristalsis is another name for this
  sense; not chewing and not swallowing.
examples:
- Vermiculation moves food along the food tube with wave-like squeezes.
- The doctor watched the vermiculation of the gut on the screen.
