simpleMeaning: In grammar, the job done by a group of words with a noun at its head when it names the
  place of the state or action the verb talks about.
scope: In grammar, this is the job a noun phrase does when it names a place, not the doer of the action
  and not the time of the action; locative is another name for this sense.
examples:
- The locative role of 'in the garden' is to show where she sat.
- In that sentence the locative role belongs to the phrase 'on the roof'.
