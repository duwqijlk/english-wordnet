senseId: 'mouth-to-mouth_resuscitation%1:04:00::'
synsetId: 00834287-n
simpleMeaning: 'The first emergency action when someone has collapsed with no pulse and no breathing:
  chest compressions plus artificial breathing to restore blood flow and prevent death or brain damage.'
scope: Another name for the same emergency procedure also called CPR; the name points to the breathing
  into the collapsed person's mouth, which CPR covers along with chest compressions.
examples:
- The lifeguard gave the boy mouth-to-mouth resuscitation until the ambulance arrived.
- Doctors credit mouth-to-mouth resuscitation with saving her life after the drowning.
