simpleMeaning: Upright bushy annual widely grown in warm India, Indonesia and America for feed and especially
  its edible seeds; chief source of bean sprouts for Chinese cooking; sometimes put with Phaseolus.
scope: Also called mung, mung bean, mung bean plant and Phaseolus aureus; a bushy plant grown for feed
  and seeds, the chief source of bean sprouts, not a bean grown only for its pods and not a wild plant.
examples:
- Vigna radiata is widely grown in India.
- Farmers grow Vigna radiata for its edible seeds.
