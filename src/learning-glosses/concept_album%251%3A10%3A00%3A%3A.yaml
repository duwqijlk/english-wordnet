senseId: 'concept_album%1:10:00::'
synsetId: 06604359-n
simpleMeaning: One idea holds a set of recordings together, in the music, the words, the story, or the
  way the music is put together.
scope: This set of recordings is held together by one idea, not a set of songs with no link between them.
examples:
- The concept album tells one story from the first song to the last.
- Her new concept album keeps the same idea through every track.
