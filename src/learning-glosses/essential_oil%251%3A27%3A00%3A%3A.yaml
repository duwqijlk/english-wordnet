simpleMeaning: a liquid from a plant, with the smell or taste of that plant, put in scents and in foods
  to give them flavor
scope: A liquid from a plant with the plant's smell or taste, used to scent things or flavor food, not
  a cooking oil and not a medicine.
examples:
- A few drops of essential oil made the room smell of lavender.
- The cook added essential oil of lemon to the cake.
