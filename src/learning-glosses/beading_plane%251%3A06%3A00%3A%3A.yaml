simpleMeaning: a tool with a blade that curves in, used to cut a round raised line along the edge of wood
scope: A woodwork tool that cuts a round raised line, not a flat tool and not a saw.
examples:
- He used the beading plane to shape the edge of the shelf.
- The beading plane cut a neat round line along the wood.
