senseId: 'stenosis%1:26:00::'
synsetId: 14130856-n
simpleMeaning: a part of a tube or passage inside the body that has grown too narrow
scope: Also called a stricture, this is a part of a body passage that has grown too narrow, not a tube
  that is fully blocked and not a cut in the body.
examples:
- The stenosis in the blood vessel slowed the flow of blood.
- Doctors found a stenosis where the passage had grown too narrow.
