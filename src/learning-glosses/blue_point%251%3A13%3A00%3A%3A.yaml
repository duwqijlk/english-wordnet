simpleMeaning: Oysters first from Long Island Sound but now from anywhere along the north-eastern sea
  coast, most often eaten raw.
scope: Oysters first from Long Island Sound but now from anywhere along the north-eastern sea coast, most
  often eaten raw; bluepoint is another name for this sense, not oysters from the southern coast and not
  oysters always cooked.
examples:
- We ate blue points raw with lemon.
- The blue point comes from the north-eastern coast.
