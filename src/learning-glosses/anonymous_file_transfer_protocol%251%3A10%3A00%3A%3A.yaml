simpleMeaning: A common way to share computer programs, where people can sign in as 'guest' with no secret
  word and take copies of what is on offer
scope: A common way to share computer programs, where people can sign in as 'guest' with no secret word;
  anonymous ftp is another name for this sense, not a way to buy programs and not a private sign-in with
  a secret word.
examples:
- He used anonymous file transfer protocol to get the free program.
- With anonymous file transfer protocol, anyone can copy the files as 'guest'.
