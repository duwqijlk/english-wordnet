senseId: 'improbability%1:07:00::'
synsetId: 04765707-n
simpleMeaning: the quality of being unlikely to happen or to be true
scope: This is about how unlikely a thing is to happen or to be true. It is not how likely a thing is,
  and it does not mean the thing cannot happen at all.
examples:
- The improbability of winning twice in a row did not stop him from trying.
- She laughed at the improbability of snow in the middle of summer.
