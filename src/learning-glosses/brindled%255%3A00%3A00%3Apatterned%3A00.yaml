simpleMeaning: having grey or brown lines, marks or uneven colour, used especially of a cat's patterned
  fur
scope: Also called brindle, tabby and brinded. This describes grey or brown patterned fur, especially
  a cat's, not a plain colour with no marks.
examples:
- Their brindled cat had brown and grey marks in its fur.
- A brindled coat made the kitten easy to spot among the plain black ones.
