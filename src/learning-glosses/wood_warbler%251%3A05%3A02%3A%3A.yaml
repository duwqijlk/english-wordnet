simpleMeaning: A songbird that lives in the forests of Europe and has dull yellow feathers
scope: A European songbird of the forests with dull yellow feathers, not the American wood warbler, a
  small bright-coloured songbird with a weak song.
examples:
- We heard a wood warbler singing in the forest at dawn.
- The wood warbler builds its nest low in the trees of Europe.
