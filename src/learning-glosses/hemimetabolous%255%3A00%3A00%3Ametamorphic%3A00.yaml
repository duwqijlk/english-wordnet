simpleMeaning: Of an insect whose young live in water, growing by a change that is not full, in which
  the young does not look like the grown insect
scope: Of an insect whose young live in water, growing by a change that is not full, also called hemimetabolic,
  hemimetamorphic, and hemimetamorphous, and not an insect that grows by a full change with a resting
  stage.
examples:
- The hemimetabolous nymph lives in the pond.
- Hemimetabolous insects skip the resting stage.
