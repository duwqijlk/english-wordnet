simpleMeaning: casting fake bait far out into the sea, up to 200 yards, while waves break around you
scope: This is throwing bait far out into the sea from the shore, also called surf casting; not fishing
  from a boat and not fishing in a lake or river.
examples:
- We went surf fishing at dawn, casting our lines far into the waves.
- Surf fishing lets you catch fish without a boat.
