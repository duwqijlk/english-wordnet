simpleMeaning: a big tool used when cooked meat is cut into slices
scope: A big tool used when cooked meat is cut into slices, not a small tool for eating at the table and
  not a blade for cutting.
examples:
- She steadied the roast with the carving fork while she cut slices.
- He used the carving fork to hold the turkey still as he carved it.
