simpleMeaning: a joining word, like 'and' or 'or', that links two parts of a sentence built in the same
  way
scope: A joining word, like 'and' or 'or', that links two parts of a sentence built in the same way; not
  a word that joins a main part to a lesser part, and not a word that joins words of different kinds.
examples:
- In 'tea and coffee', 'and' is a coordinating conjunction.
- A coordinating conjunction joins two parts of a sentence that match each other.
