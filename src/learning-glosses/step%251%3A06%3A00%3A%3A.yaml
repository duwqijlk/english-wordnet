simpleMeaning: one of the raised parts of a staircase that you put your foot on as you go up or down
scope: This is part of a staircase, not a ship fitting or a stage in a process.
examples:
- She tripped on the bottom step and dropped her keys.
- The wooden steps creaked as we climbed to the attic.
