simpleMeaning: a group of flowering plants with two seed leaves, herbs and some trees and shrubs, more
  or less far along in how plants have changed over time
scope: A group of plants of this kind, not one plant alone and not a group with one seed leaf.
examples:
- The asterid dicot genus includes many common garden herbs.
- Botanists place the shrub in an asterid dicot genus.
