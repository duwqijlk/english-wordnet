senseId: 'meibomian_cyst%1:26:00::'
synsetId: 14226002-n
simpleMeaning: A small lump full of fatty matter on the eyelid, made when an oil-making gland there is
  blocked
scope: Also called a chalazion; a small blocked-gland lump on the eyelid, not a stye and not a swelling
  from an injury.
examples:
- The Meibomian cyst on her eyelid was small and painless.
- A blocked gland can form a Meibomian cyst.
