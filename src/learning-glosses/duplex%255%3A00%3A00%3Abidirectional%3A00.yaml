senseId: duplex%5:00:00:bidirectional:00
synsetId: 00235348-s
simpleMeaning: letting people or machines send and get talk or information in both ways at the same time
scope: Used for a system where sending and getting talk or information happen at the same time; not a
  home with rooms on two floors joined by stairs inside it, and not changing something into such a home.
examples:
- A duplex system lets both people talk and hear at the same time.
- The office uses duplex phones, so callers can speak and listen together.
