simpleMeaning: In the Philippines, the stalks of unopened leaves of a kind of palm give fine white strands
  used to make hats.
scope: The fine white strands used to make hats come from the stalks of unopened palm leaves in the Philippines.
examples:
- The weaver worked the buntal into a hat.
- Her hat was made of buntal.
