senseId: 'kinaesthesia%1:09:00::'
synsetId: 05730155-n
simpleMeaning: How tight the muscles are, where the parts of the body are and how they move is what the
  body knows
scope: Also called feeling of movement and kinesthesia; it is knowing where your body parts are, not seeing
  them and not touching things.
examples:
- After the injury, her kinaesthesia was poor and she could not tell where her foot was without looking.
- Kinaesthesia lets a dancer know where her arms are in the dark.
