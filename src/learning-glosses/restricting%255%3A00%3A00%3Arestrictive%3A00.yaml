simpleMeaning: keeping something within a limit in how much it can do or how far it can go
scope: About something that limits what can be done or how far it can go; not about stopping something
  completely.
examples:
- A restricting rule kept new shops from opening late at night.
- The small space had a restricting effect on how the team could work.
