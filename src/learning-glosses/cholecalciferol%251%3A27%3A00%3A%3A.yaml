simpleMeaning: a vitamin that melts in fat and stops rickets, a bone disease in children
scope: A vitamin that melts in fat and stops rickets; calciferol and ergocalciferol are other names for
  this sense, not a vitamin that melts in water and not a cure for broken bones.
examples:
- Cholecalciferol helps the body use calcium to build strong bones.
- The doctor said cholecalciferol can stop rickets in children.
