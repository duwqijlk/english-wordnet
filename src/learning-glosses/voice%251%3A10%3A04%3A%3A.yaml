simpleMeaning: 'In the study of speech sounds and sound systems, a label that puts each speech sound in
  one of two groups: made with the vocal cords vibrating, or made without.'
scope: This is a technical label for speech sounds, not the sound of a person speaking or singing, and
  not a right to express an opinion.
examples:
- In phonetics class we learned that voice separates the sounds /p/ and /b/.
- The speech therapist explained that voice is what makes /z/ different from /s/.
