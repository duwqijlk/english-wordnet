simpleMeaning: a white, crystal-like carbohydrate used to make food and drink sweet and to help preserve
  them.
scope: This is the everyday sweet substance used in cooking, not the whole class of energy-giving substances
  studied in biology and not the act of adding it.
examples:
- She added a spoonful of sugar to her tea.
- Sugar is used to preserve fruit in jam.
