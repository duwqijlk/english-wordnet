simpleMeaning: When a thing is heated, it moves up in bubbles, and the same is said of other things that
  come up in that way
scope: To rise up in bubbles when heated, also called bubble up; not to boil over and not to stay still.
examples:
- The sauce began to intumesce as it heated.
- New ideas intumesced across the country in the 1960s.
