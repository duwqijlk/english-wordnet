simpleMeaning: to say a consonant sound with the tongue curled back against the roof of the mouth
scope: To make a consonant sound with the tongue curled back, not to say a sound with the tongue flat
  and not to make a sound with the lips.
examples:
- Speakers of some languages retroflex their consonants.
- She learned to retroflex the consonant at the start of the word.
