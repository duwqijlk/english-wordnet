simpleMeaning: large west African tree with large leaves split like fingers, small white flowers in groups
  where leaves join stems, and one-winged seeds; its wood is soft, white to pale yellow
scope: Also called arere, obeche, and obechi, this is a tree in west Africa, not the lively dance from
  Brazil, not the music for that dance, and not the card game of the same name.
examples:
- The samba grows tall in west Africa and has large leaves and small white flowers.
- Builders used wood from a samba because it is soft and pale.
