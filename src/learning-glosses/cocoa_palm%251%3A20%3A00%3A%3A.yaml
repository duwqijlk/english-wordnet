simpleMeaning: Big round nuts grow as fruit on this tall palm tree, which is planted far and wide through
  the warm lands
scope: Also called a coconut, a coco, a coco palm, a coconut palm, and a coconut tree, this is a tall
  palm tree whose big round nuts grow as fruit.
examples:
- Cocoa palms are planted far and wide through the warm lands.
- The cocoa palm bore big round nuts as fruit.
