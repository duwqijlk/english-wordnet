simpleMeaning: A person who gives help and support to a politician, a team, or a group like them
scope: 'Also called friend: a person who backs a politician or a team, not a winner of a contest and not
  a person who fights for a cause.'
examples:
- The champion of the local team spoke up for them at the meeting.
- She became a champion of the library, giving it money and time.
