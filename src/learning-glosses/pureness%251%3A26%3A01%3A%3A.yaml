simpleMeaning: The state of being clean from sin or moral wrong, never having learned what evil is.
scope: The state of being clean from sin or moral wrong, never having learned what evil is, also called
  whiteness, purity, and innocence; not a woman's virtue or chastity, and not being undiluted or unmixed
  with other stuff.
examples:
- The pureness of the young saint was spoken of by all who knew them.
- They kept their pureness through years of hardship and doubt.
