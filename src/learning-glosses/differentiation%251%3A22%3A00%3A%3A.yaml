simpleMeaning: In biology, the way a part of the body changes its shape and build so it can do one special
  job
scope: 'Also called specialization: in biology, a body part changing for one job, not the maths sense
  and not telling things apart as different.'
examples:
- Cell differentiation in the developing embryo helps cells become skin, blood, or bone.
- The differentiation of the bird's beak over time helped it eat one kind of food.
