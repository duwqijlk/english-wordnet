simpleMeaning: Two sides that stand against each other, with steps in between from one end to the other
scope: Two sides that stand against each other and can be more or less far apart, not a plain fight and
  not a single side on its own.
examples:
- The polar opposition between the two views left room for middle ground.
- Their polar opposition could be graded from mild to extreme.
