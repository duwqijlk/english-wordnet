simpleMeaning: When you lose and have no hope left, you stop trying and say that you have lost
scope: 'Also called quit, chuck up the sponge, drop by the wayside, drop out, and give up: to stop trying
  after a loss, not to stop for a rest and not to keep trying.'
examples:
- After two bad losses, the team fell by the wayside.
- Many runners fell by the wayside before the end of the race.
