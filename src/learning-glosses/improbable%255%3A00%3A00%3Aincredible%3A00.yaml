simpleMeaning: so far from what anyone can accept that no one can take it as true
scope: 'Also called tall, marvellous and marvelous: a claim too wild to be believed, not merely something
  with a low chance of happening.'
examples:
- He told an improbable tale of meeting the queen on a bus.
- Her improbable story of finding gold in the garden fooled no one.
