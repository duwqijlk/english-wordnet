simpleMeaning: of a soap or cleaner, made to work better by adding something extra, such as a rough grit
  or a filling stuff
scope: 'Also called built: a soap or cleaner made to work better by something added to it, not a wall
  or beam made stronger.'
examples:
- This reinforced soap cleans greasy pans better than plain soap.
- The reinforced detergent has a gritty powder mixed in.
