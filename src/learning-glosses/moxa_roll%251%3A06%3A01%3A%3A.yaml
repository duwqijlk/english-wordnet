simpleMeaning: Used to warm the skin in a kind of treatment, this stick is made of dried leaves from an
  Asian kind of mugwort, a herb
scope: 'Also called a moxa stick: a stick of dried leaves from an Asian kind of mugwort, used to warm
  the skin in a kind of treatment, not a stick for lighting a fire and not a roll of cloth.'
examples:
- The healer lit the moxa roll and held it near the patient's skin.
- She bought a moxa roll from the herb shop.
