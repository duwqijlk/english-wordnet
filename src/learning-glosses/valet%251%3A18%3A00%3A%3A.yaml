simpleMeaning: a man servant kept to look after one person's own needs
scope: A male servant for one employer's personal needs, also called man and gentleman, and not a servant
  who parks cars or a maid.
examples:
- The lord's valet laid out his clothes each morning.
- Jeeves was Bertie Wooster's valet, looking after his dress.
