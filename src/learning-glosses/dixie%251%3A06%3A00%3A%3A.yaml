simpleMeaning: a large metal pot that holds 12 gallons, used for cooking in army camps
scope: This is a large cooking pot used in army camps. It is not Dixie as a name for the south of the
  United States, and not a small pot for a home kitchen.
examples:
- The cook boiled soup for fifty soldiers in a dixie.
- They carried the dixie to the camp kitchen and filled it with water.
