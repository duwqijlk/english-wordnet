simpleMeaning: In accounting, cash a business takes in before it has given the goods or done the work,
  usually shown on its books as a debt it owes
scope: This is money a business gets before it has given the goods or done the work, also called unearned
  income, and not money a person gets without work, such as rent or interest.
examples:
- The unearned revenue rose after the firm sold year-long plans in advance.
- Unearned revenue sits on the firm's books until the goods are sent.
