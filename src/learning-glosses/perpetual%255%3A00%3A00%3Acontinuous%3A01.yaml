simpleMeaning: Something that keeps going for a very long time, with no break in time and no end set for
  it.
scope: Going on without a break and with no set end, also called constant and incessant, not a thing that
  stops and starts again.
examples:
- The perpetual hum of the machines never stopped, day or night.
- They lived with the perpetual noise of the city, night and day.
