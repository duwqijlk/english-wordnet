simpleMeaning: 'In a game, a turn to be a starter: a place among the players who begin the game.'
scope: 'This is the countable sports use: a player''s turn or place as a starter. It is not the general
  act of beginning something (the starting of the engine) and not the adjective starting used of bulging
  eyes. More often the word for this is simply ''start''.'
examples:
- His starting in the opener depended on how his shoulder felt.
- Her starting in the final surprised no one who had watched her train.
