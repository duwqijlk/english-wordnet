simpleMeaning: the quality of acting or speaking in a way that makes you seem more important or of more
  worth than you really are
scope: 'Also called largeness: acting as if you are more important than you are. It is not a claim that
  you have a right to something.'
examples:
- His pretension made him speak as if he knew more than everyone else.
- She disliked the pretension in his grand way of talking.
