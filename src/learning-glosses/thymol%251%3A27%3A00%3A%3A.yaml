simpleMeaning: a clear solid that forms crystals, used to scent perfume, to keep dead plants and animals
  from rotting, and to kill germs and fungi
scope: Also called thyme camphor and thymic acid; a solid used in perfume and to keep specimens, not a
  liquid scent and not a drug for one illness.
examples:
- The lab kept the thymol in a sealed jar.
- She added a pinch of thymol to the perfume mix.
