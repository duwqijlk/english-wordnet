simpleMeaning: With the sweet smell of a sour yellow fruit, it is an oil used far and wide in Asian cooking,
  in scents, and in cures.
scope: It is also called lemongrass and lemon grass, and it is an oil that smells of a sour yellow fruit.
examples:
- Lemongrass oil gave the food its sweet smell.
- The cure carried the sweet smell of lemongrass oil.
