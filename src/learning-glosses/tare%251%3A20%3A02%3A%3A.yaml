simpleMeaning: A one-year grass weed of grain fields and farmed land, whose seeds are sometimes thought
  to be poison.
scope: Also called cheat, bearded darnel, or darnel, a one-year grass weed of grain fields, not the counterweight
  used in weighing chemicals, not the weight of a vehicle without fuel or load, not the allowance for
  packaging weight, and not the weedy vetches grown for feed.
examples:
- Tare grew among the wheat in the field.
- The farmer pulled the tare from the grainfield.
