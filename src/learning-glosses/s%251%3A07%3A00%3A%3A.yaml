simpleMeaning: In heat work, the amount of the energy in a thing that can no longer do mechanical work.
scope: In heat work, the amount of energy in a set-up that can no longer do mechanical work; also called
  randomness and entropy, and not the yellow stuff, and not the letter.
examples:
- Entropy grows as the system loses usable energy.
- The entropy of the room went up as the heat spread.
