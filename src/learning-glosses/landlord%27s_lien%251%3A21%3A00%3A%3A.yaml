simpleMeaning: a legal right for a home's owner to hold a tenant's things until unpaid rent or damage
  to the home is paid for, putting the owner first in line
scope: A legal right over a tenant's things for unpaid rent or damage, not a loan and not a right to take
  the home itself.
examples:
- The landlord's lien let the owner hold the tenant's furniture until the rent was paid.
- Under a landlord's lien, the owner is paid before other people owed money.
