simpleMeaning: With a tip at the end, this fancy cord or braid is worn on the shoulder of a uniform to
  decorate it.
scope: Also called aglet or aiguillette, this fancy cord or braid with a tip at the end sits on the shoulder
  of a uniform to decorate it.
examples:
- An aiglet hung from the shoulder of the uniform.
- The aiglet on the shoulder caught the light as the officer saluted.
