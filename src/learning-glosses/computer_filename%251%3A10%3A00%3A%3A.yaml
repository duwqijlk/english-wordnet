simpleMeaning: In the study of number machines, the label on a set of stored words or numbers that tells
  it apart, which may hold an ending that shows its kind
scope: In the study of number machines, the label on a set of stored words or numbers that tells it apart;
  computer file name, file name and filename are other names for this sense, not the set of stored words
  itself and not a label on paper.
examples:
- The computer filename ends in .txt, which shows its kind.
- She changed the computer filename to tell it apart from the others.
