simpleMeaning: able to be shaped, bent, or pulled into a longer, thinner form
scope: 'Also called malleable, pliant, and tensile: able to be shaped or pulled out into a new form; not
  the sense of bending or twisting without breaking.'
examples:
- They soaked the leather to make it pliable enough to shape.
- The soft metal is pliable, so the worker bent it by hand.
