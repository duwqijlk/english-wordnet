simpleMeaning: held under strict control, either shut in a place or watched by guards
scope: This is not about a snug fit or a secretive manner; it is about a person being strictly shut in
  or watched.
examples:
- For the first month the prisoner was kept close, with a guard outside the door.
- The king's rivals were kept close under guard in a fortress far from the capital.
