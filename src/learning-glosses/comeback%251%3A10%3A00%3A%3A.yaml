simpleMeaning: a fast answer to something someone says or asks, most of all a clever or sharp one
scope: 'Return, counter and retort are other names for this sense: a quick answer, most of all a clever
  or sharp one, not a return to a former place or job.'
examples:
- Her comeback left the whole class laughing.
- He had a sharp comeback ready for every teasing remark.
