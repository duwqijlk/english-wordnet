simpleMeaning: the length, area, or amount of space that something covers
scope: This sense is about the size or space that something covers. It is not the sense about how far
  an action or effect goes, or the level it reaches.
examples:
- We walked across the full extent of the park.
- From the air, you can see the extent of the desert.
