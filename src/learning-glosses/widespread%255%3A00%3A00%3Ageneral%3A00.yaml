simpleMeaning: known or felt by very many people, in many places at once
scope: Known or felt by very many people in many places, not a thing spread over a wide stretch of ground.
examples:
- There was widespread fear of war after the news broke.
- The widespread belief that the town was haunted kept visitors away.
