simpleMeaning: To feel into a thing with the hands or a thin tool, to find out what is inside it
scope: To feel into a thing with the hands or a thin tool to find out what is inside it, not the thin
  tool itself, not a search into a wound, not a look into strange acts, and not to ask hard questions.
examples:
- The doctor probed the wound gently.
- He probed the anthill with a stick.
