simpleMeaning: A common North American beetle whose young feed on roots and whose adults eat the leaves
  and flowers of plants such as rose bushes, apple trees or grape vines.
scope: Another name for rose bug, the common North American beetle that feeds on rose bushes and fruit
  trees; not the similar European chafer.
examples:
- Rose chafers gathered on the flowers of the apple tree.
- In late spring, rose chafers began eating the leaves of the rose bushes.
