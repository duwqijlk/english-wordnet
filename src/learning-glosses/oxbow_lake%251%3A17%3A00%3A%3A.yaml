simpleMeaning: Still water shaped like a new moon, often here for a short time, left when a bend in a
  river is cut off from the rest of the river
scope: A curved pool of water left when a river bend is cut off, not the river itself and not a round
  pond made by rain.
examples:
- After the flood, an oxbow lake lay beside the river, cut off from its flow.
- The oxbow lake dried up by summer, as it often does.
