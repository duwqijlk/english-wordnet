simpleMeaning: A hormone from the pituitary gland and from nerve ends in the brain; it raises blood pressure
  by tightening blood vessels and cuts urine flow by helping kidneys hold water.
scope: Not other hormones from the pituitary gland, nor other substances that change blood pressure or
  urine flow; also called antidiuretic hormone, vasopressin, and ADH.
examples:
- Pitressin helps the body hold water.
- Doctors use Pitressin when blood pressure is low.
