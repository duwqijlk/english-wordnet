senseId: 'motor_aphasia%1:26:00::'
synsetId: 14121940-n
simpleMeaning: A loss of the power to get words out, in speech or in writing
scope: 'Also called expressive aphasia, ataxic aphasia or nonfluent aphasia: a loss of the power to get
  words out in speech or writing, not a loss of the power to take words in and not trouble with the voice
  alone.'
examples:
- After the stroke, motor aphasia left him unable to write a note.
- Her motor aphasia made speaking a slow struggle.
