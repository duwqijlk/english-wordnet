simpleMeaning: to make the sound of a horse's feet striking the ground, or to go along with that sound
scope: 'Also called clump: to move or make a noise like a horse''s feet on the ground, not a light tap
  and not a sharp ring.'
examples:
- The old boots clunked down the wooden stairs.
- He clunked across the yard in his heavy work boots.
