simpleMeaning: A drug taken by mouth that fights viruses and is used to treat genital herpes; it does
  not cure the sickness but eases its signs
scope: An oral drug used to treat genital herpes, also called acyclovir; it eases the signs of the sickness
  but does not cure it.
examples:
- Zovirax eased her herpes symptoms.
- He took Zovirax by mouth for genital herpes.
