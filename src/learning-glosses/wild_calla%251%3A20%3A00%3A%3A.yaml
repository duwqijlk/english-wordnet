simpleMeaning: red berries grow on a plant of wet lands and bogs in mild lands, whose small pale-green
  flowers sit half inside a white leaf-like sheath
scope: Also called water arum; a plant of wet lands and bogs, not a garden plant grown for showy flowers.
examples:
- The wild calla grows in the bog behind our house.
- We saw wild calla with red berries along the wet path.
