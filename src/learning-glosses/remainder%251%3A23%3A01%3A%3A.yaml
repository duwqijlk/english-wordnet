simpleMeaning: the amount left over after a number is divided and cannot be divided evenly
scope: The amount left over after division, not the number left after subtraction and not the act of selling
  cheaply.
examples:
- When 10 is divided by 3, the remainder is 1.
- The remainder after dividing 17 by 5 is 2.
