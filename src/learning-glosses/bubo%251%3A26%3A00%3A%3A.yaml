simpleMeaning: A lymph node (a small part of the body that helps fight sickness) that has become swollen
  and sore because of plague, gonorrhea, or tuberculosis
scope: This is a swollen lymph node caused by one of these three sicknesses, not any swelling or sore
  place in the body.
examples:
- The doctor found a bubo in the man's neck and tested him for plague.
- A painful bubo in his groin was one sign of the sickness.
