senseId: 'haematocele%1:26:00::'
synsetId: 14340648-n
simpleMeaning: Most often in the thin cover round the testicle, blood that has gathered in a hollow of
  the body makes a lump there.
scope: Also called a haematocoele, a hematocele and a hematocoele, blood gathered in a hollow of the body
  makes this lump.
examples:
- The haematocele made the thin cover round his testicle swell.
- The haematocele was a lump that could be felt.
