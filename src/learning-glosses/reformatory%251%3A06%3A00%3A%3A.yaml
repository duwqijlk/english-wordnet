simpleMeaning: A place where young or first-time lawbreakers are kept, punished, and taught to live right.
scope: A place that keeps and trains young or first offenders, not a prison for hardened criminals and
  not the adjective sense.
examples:
- The boy was sent to a reformatory for stealing cars.
- The reformatory taught him a trade.
