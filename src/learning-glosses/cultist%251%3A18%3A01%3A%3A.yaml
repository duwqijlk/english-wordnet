simpleMeaning: a member of a group with beliefs unlike most others, mostly living apart from the rest
  of society and following a leader who draws people to them
scope: A member of a group with beliefs unlike most others, living apart from the rest of society, not
  a member of a large church and not the leader of the group.
examples:
- The cultist left the town to live with the group in the hills.
- After years as a cultist, she decided to leave the group and return home.
