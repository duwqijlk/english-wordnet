simpleMeaning: the musical distance between a note and the same note eight steps higher
scope: The musical distance between a note and the same note eight steps higher; not a group of eight
  singers and not a verse of eight lines.
examples:
- Her voice rose a full octave in the song.
- The two notes are an octave apart.
