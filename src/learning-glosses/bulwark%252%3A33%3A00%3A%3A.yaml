simpleMeaning: to protect a place by putting a strong wall or bank of earth around it
scope: To protect a place with a strong wall or earth bank, not the wall or bank itself and not keeping
  someone safe in any general way.
examples:
- They bulwarked the fort with a thick earth wall.
- The town was bulwarked against attack by a ring of strong walls.
