simpleMeaning: to put soldiers into one army unit, so they fight and train as one body
scope: To place soldiers in one army unit, not to build the unit itself and not to put people under strict
  rules.
examples:
- The new soldiers were regimented into the third unit.
- He was regimented with the foot soldiers and sent north.
