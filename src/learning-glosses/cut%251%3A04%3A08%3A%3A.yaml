simpleMeaning: a sporting stroke that sends the ball turning against its own forward motion.
scope: This is the stroke that puts reverse spin on a ball, not a batter's swing at a pitched ball, not
  the act of dividing or shortening something, not a wound, not a piece of meat, not a share of profits,
  and not a snub.
examples:
- She returned the serve with a cut that spun sharply away.
- His cut kept the ball low and skidding.
