simpleMeaning: the blood vessel in the neck that branches off the main neck vessel to carry blood to the
  face, the tongue, and the outer parts of the head
scope: This is a neck blood vessel feeding the face and tongue; external carotid is another name for this
  sense; not the inner branch feeding the brain and not the main neck vessel itself.
examples:
- The external carotid artery carries blood to the face.
- The external carotid artery branches off the main vessel in the neck.
