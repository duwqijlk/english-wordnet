scope: This picture of the brain, also called a pneumoencephalogram, is made with X rays after the fluid
  around the spine is swapped for a gas, usually oxygen.
examples:
- The encephalogram showed the brain after the fluid was swapped for gas.
- An encephalogram was taken to see the brain more clearly.
