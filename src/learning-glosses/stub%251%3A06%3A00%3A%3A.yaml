simpleMeaning: a small bit left over and not used, most of all the end of a cigarette after it has been
  smoked
scope: 'Also called butt: a small unused leftover, most of all a cigarette end, not a torn-off ticket
  part and not the short piece left on a cut branch.'
examples:
- He dropped the stub of his cigarette into the ashtray.
- A stub of pencil lay on the desk.
