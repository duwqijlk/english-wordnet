simpleMeaning: A handsome woody plant of central and eastern North America, with large leaves split twice,
  green-white flowers, and large woody brown pods whose seeds stand in for a hot drink
scope: This is a handsome woody plant of central and eastern North America with large leaves and brown
  pods; bonduc, chicot and Gymnocladus dioica are other names for this sense.
examples:
- The Kentucky coffee tree has large woody brown pods.
- Seeds of the Kentucky coffee tree are used as a coffee substitute.
