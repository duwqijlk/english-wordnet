simpleMeaning: A strong wish that will not go away, to drink too much strong drink
scope: This is a strong wish that will not go away, to drink too much strong drink; alcoholism and dipsomania
  are other names for it, not a single night of drinking too much.
examples:
- His potomania ruined his health and his work.
- Potomania is a strong wish to drink too much, day after day.
