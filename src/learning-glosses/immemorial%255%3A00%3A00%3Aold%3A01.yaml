simpleMeaning: from a time so long ago that no one can remember it, no old story passed down tells of
  it, and no written record goes back that far
scope: From a very long time ago that no one can remember, not just old in a way people still remember
  and not new or recent.
examples:
- People have lived by this river since time immemorial.
- The custom is from time immemorial, long before any books were written.
