simpleMeaning: In baseball, the runner on third waits to run home until the batter has laid down a short,
  soft hit
scope: 'Also called a safety squeeze play: in baseball, a runner on third waits to run home until the
  batter has laid down a short, soft hit, not a steal of home and not a hit-and-run.'
examples:
- With the safety squeeze, the runner on third waited until the bunt was down before running home.
- The safety squeeze worked when the batter dropped the bunt and the runner scored.
