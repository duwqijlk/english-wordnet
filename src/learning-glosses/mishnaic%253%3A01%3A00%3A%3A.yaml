simpleMeaning: Said of things that belong to the Mishna, the opening part of the Talmud, or have to do
  with them.
scope: This word marks things of the Mishna, the opening part of the Talmud, not things of the rest of
  the Talmud.
examples:
- Mishnaic law comes from the first part of the Talmud.
- He studied Mishnaic texts at school.
