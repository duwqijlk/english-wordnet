simpleMeaning: Telling the front of a gland there to send out the chemical that wakes the thyroid, this
  chemical comes from a small part at the base of the brain
scope: Also called thyrotropin-releasing factor and thyrotropin-releasing hormone, this chemical from
  a small part at the base of the brain tells the front of a gland there to send out the chemical that
  wakes the thyroid.
examples:
- The brain sent out protirelin to wake the thyroid.
- Protirelin made the gland send out its thyroid chemical.
