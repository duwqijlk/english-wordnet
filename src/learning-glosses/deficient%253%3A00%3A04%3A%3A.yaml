simpleMeaning: 'of an amount: not enough to meet a need, or to do what must be done'
scope: 'Also called insufficient: this describes an amount that is too small for what is needed, not an
  amount that is large enough.'
examples:
- The supply was deficient, so the hospital soon ran out of bandages.
- His pay was deficient and could not cover the rent.
