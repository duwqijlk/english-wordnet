simpleMeaning: to make cloth by passing threads over and under each other so that slanted lines show on
  the surface
scope: This is the act of making cloth with slanted lines, not the cloth itself and not the pattern of
  lines in that cloth.
examples:
- She twilled the cotton to give the cloth slanted lines.
- The workers twill the wool on large looms.
