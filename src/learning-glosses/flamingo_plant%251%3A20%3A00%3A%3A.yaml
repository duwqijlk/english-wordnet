simpleMeaning: People often grow this anthurium for its bright red spathe, a large leaf-like part, and
  its spadix, a thick spike of tiny blooms.
scope: This anthurium, also called a flamingo flower, is often grown for its bright red spathe, a large
  leaf-like part, and spadix, a thick spike of tiny blooms.
examples:
- The flamingo plant in the hall had a bright red spathe.
- He watered the flamingo plant every morning.
