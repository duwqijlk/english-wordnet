simpleMeaning: all the people in an area who can vote to choose the person who will speak and act for
  them in government
scope: This is the group of people who vote in an area, not the area itself and not the person they choose.
examples:
- The whole constituency will vote next month to choose its new member of parliament.
- Most people in her constituency told her they wanted lower taxes and better schools.
