scope: Also called coral honeysuckle, trumpet flower, and trumpet honeysuckle, it is a North American
  vine that keeps its leaves all year and bears coral-red or orange blooms.
examples:
- The trumpet vine opened its orange blooms one by one.
- I like the trumpet vine best when its coral-red blooms are out.
