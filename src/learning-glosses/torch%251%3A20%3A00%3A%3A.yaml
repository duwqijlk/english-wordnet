simpleMeaning: a tall mullein with very hairy stems and tightly packed yellow flowers; the ancient Greeks
  and Romans dipped its stems in fat and used them as funeral lights.
scope: Another name for woolly mullein (also called great mullein and flannel mullein); it is this tall
  yellow-flowered plant, not a burning stick, a battery lamp or a gas burner.
examples:
- In ancient Rome, stalks of the torch were dipped in tallow to make funeral lights.
- The torch has tall, woolly stems and tightly packed yellow flowers.
