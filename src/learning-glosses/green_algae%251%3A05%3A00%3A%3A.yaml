simpleMeaning: Leaf-coloured water plants, often found on wet ricks, damp wood, or the top of still water
scope: These are leaf-coloured water plants; chlorophyte is another name for them, not a land plant and
  not a plant of fast water.
examples:
- Green algae covered the top of the pond.
- The green algae grew on the damp wood.
