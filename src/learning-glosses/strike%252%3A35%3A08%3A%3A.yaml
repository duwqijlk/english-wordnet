synsetId: 01552202-v
simpleMeaning: to take something out by rubbing it away, crossing it out, or treating it as if a line
  were drawn through it.
scope: Removing something by erasing or crossing it out — another name for scratch, expunge and excise
  — not a physical blow or a clock sounding the hour.
examples:
- Please strike this remark from the record.
- The editor struck the last paragraph from the article.
