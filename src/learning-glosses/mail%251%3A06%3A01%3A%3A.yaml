simpleMeaning: a vehicle such as a train, ship, or aircraft that carries letters and parcels for the postal
  service.
scope: This is the vehicle that carries the post, not the letters and parcels themselves, and not the
  postal system.
examples:
- The mail boat crosses to the island twice a week.
- He worked on the mail train between London and Edinburgh.
