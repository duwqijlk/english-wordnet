simpleMeaning: A tool for measuring how fast a liquid or gas moves, made of a pipe bent at a right angle
  with one open end facing into the flow.
scope: Also called a Pitot; a tool that measures the speed of a liquid or gas by a pipe bent at a right
  angle, its open end facing into the flow.
examples:
- The Pitot tube in the wind tunnel measured the speed of the air.
- He held the Pitot tube against the flow to read the water speed.
