simpleMeaning: A book brought out each year by the class finishing a high school or college, usually with
  photos of teachers and of the students who are finishing
scope: This is the yearly book of a finishing class, with photos of its teachers and students, not a textbook
  used for lessons and not a personal diary.
examples:
- She found her father's photo in his old school yearbook.
- Our yearbook has a page of photos for every student in the class.
