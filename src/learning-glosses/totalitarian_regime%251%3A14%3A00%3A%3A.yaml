simpleMeaning: a government that puts the state above the person and keeps strict control over every part
  of life by force
scope: This is a government that puts the state above the person and keeps strict control over every part
  of life by force; totalitarian state is another name for this sense, and it is not a free government
  or just one strict law.
examples:
- Under the totalitarian regime, people could not speak freely.
- The totalitarian regime kept strict control over the press and schools.
