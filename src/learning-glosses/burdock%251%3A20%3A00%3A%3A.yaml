simpleMeaning: any of several upright two-year plants of mild lands in Europe and Asia, with thick deep
  roots and prickly seed cases
scope: Any of several upright two-year plants of mild lands in Europe and Asia, not a one-year plant and
  not one of the warm lands; clotbur is another name for this sense.
examples:
- Burdock grows upright along the fence with thick roots.
- The burdock by the path was covered in prickly seed cases.
