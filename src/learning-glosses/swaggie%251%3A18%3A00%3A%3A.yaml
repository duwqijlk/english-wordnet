simpleMeaning: Looking for work, a worker in Australia moves from place to place with no fixed home, all
  they own tied up in a bundle.
scope: Swagger is another name for this worker in Australia who moves from place to place looking for
  work with all they own in a bundle.
examples:
- The swaggie stopped at the farm to ask for a day's work.
- The swaggie tied all they owned into a bundle before moving on.
