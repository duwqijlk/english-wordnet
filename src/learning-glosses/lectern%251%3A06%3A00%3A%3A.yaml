simpleMeaning: a desk or stand with a top that leans, used to hold a book or papers at a good height for
  a person who speaks to a group
scope: A stand with a leaning top for holding a book or papers while a person speaks to a group, not a
  flat desk for sitting and writing at.
examples:
- The speaker put her notes on the lectern before she began.
- He stood at the lectern and read the poem to the class.
