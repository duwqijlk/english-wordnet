simpleMeaning: in a wild, uncontrolled way, or to a wild, very great degree
scope: This says how something is done, in a wild and uncontrolled way or to a very great degree, not
  in a calm, controlled way.
examples:
- He laughed maniacally as the plan fell apart.
- He worked maniacally, without rest, to finish in one night.
