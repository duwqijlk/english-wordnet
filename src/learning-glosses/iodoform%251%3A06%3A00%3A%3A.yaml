simpleMeaning: A yellowish solid made of small hard bits, with a strong smell that reaches far; it is
  sometimes used to dress wounds and keep them clean.
scope: A yellowish solid with a strong smell, sometimes used to dress wounds; triiodomethane is another
  name for this sense, not a liquid medicine and not a bandage on its own.
examples:
- The nurse put iodoform on the wound to keep it clean.
- Iodoform has a sharp smell that fills the whole room.
