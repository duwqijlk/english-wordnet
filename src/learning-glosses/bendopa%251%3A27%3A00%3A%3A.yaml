scope: This is the left-turning form of dopa, sold under trade names and used as a drug to treat Parkinson's
  disease; levodopa, Brocadopa, L-dopa and Larodopa are other names for it, and it is not the right-turning
  form.
examples:
- Bendopa is used to treat Parkinson's disease.
- The doctor gave him Bendopa to treat Parkinson's disease.
