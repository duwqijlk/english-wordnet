simpleMeaning: the act of bothering a person in fun or in a mean way, most of all by making fun of them,
  and keeping at it again and again
scope: 'Also called tease: the act of bothering someone again and again, not combing tangles out of hair
  and not making someone want sex.'
examples:
- His teasing about her accent went on all day.
- The children did not like the teasing at school.
