simpleMeaning: the act of stopping all at once, with no slow cut-down, taking a drug or doing something
  else you have come to need
scope: This is stopping a drug or a habit all at once, not cutting down bit by bit, and not a cold dish
  of meat.
examples:
- He quit smoking cold turkey.
- She quit her job cold turkey.
