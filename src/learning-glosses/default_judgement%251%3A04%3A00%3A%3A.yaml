senseId: 'default_judgement%1:04:00::'
synsetId: 01191027-n
simpleMeaning: A court order in favour of the person who brought the case, given because the other side
  did not come to court
scope: A court order for the person who brought the case when the other side fails to appear; also called
  default judgment, judgement by default and judgment by default, not a decision after a full hearing.
examples:
- The judge entered a default judgement because the defendant never appeared.
- After the default judgement, she could collect the money owed.
