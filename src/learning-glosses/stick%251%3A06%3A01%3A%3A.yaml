simpleMeaning: a long, thin object that looks like a piece of wood
scope: A long thin thing shaped like wood, whether or not it is wood; it is not a real wooden tool, a
  twig cut from a tree, or the bat used in hockey or polo.
examples:
- Add a stick of cinnamon to the rice as it cooks.
- The miners lowered a stick of dynamite into the hole.
