senseId: 'tabes_dorsalis%1:26:00::'
synsetId: 14158301-n
simpleMeaning: Syphilis that affects the spinal cord, damaging sensory nerves and causing stabbing pains
  in the trunk and legs, an unsteady walk, incontinence and erectile dysfunction.
scope: This is the spinal-cord form of syphilis, not a hereditary or cerebellar ataxia; locomotor ataxia
  is another name for the same condition.
examples:
- Tabes dorsalis damages the sensory nerves of the spinal cord.
- Before penicillin, tabes dorsalis was a frequent complication of syphilis.
