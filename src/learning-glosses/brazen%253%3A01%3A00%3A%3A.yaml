simpleMeaning: A yellow metal that is hard to the touch, or a thing that only looks like that metal in
  colour or feel.
scope: Not the brazen that means shameless and bold; this is about the metal brass and things that look
  like it.
examples:
- The brazen bowl shone with a dull yellow light.
- The brazen fittings on the door were hard and cold to the touch.
