simpleMeaning: Any of several plants of the group called Verbascum, with big leaves, usually woolly, and
  spikes at the top of yellow, white, or purplish flowers.
scope: Also called flannel leaf or velvet plant; a plant of the group called Verbascum with big, usually
  woolly leaves and spikes of yellow, white, or purplish flowers.
examples:
- Mullein grew tall by the wall with woolly leaves.
- The mullein bore yellow flowers on its top spike.
