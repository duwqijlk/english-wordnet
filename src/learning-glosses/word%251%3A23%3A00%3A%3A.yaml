simpleMeaning: a run of bits, the smallest units of computer data, held in a computer's memory as one
  unit
scope: This is a unit of computer data, not a unit of language that carries meaning.
examples:
- The program reads a 32-bit word from memory at each step.
- Each word in the buffer held the code for one character.
