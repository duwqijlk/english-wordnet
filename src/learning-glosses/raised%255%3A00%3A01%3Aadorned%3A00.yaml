simpleMeaning: decorated with a pattern that stands out above the surface, made by pressing or by sewing.
scope: This is not about something being lifted up or increased; it describes a decorative pattern that
  stands out from a surface.
examples:
- The invitations had raised gold lettering on the cover.
- She wore a jacket with a raised floral pattern.
