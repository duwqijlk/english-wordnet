schema: oewn-learning-gloss-v2
senseId: 'solicit%2:32:05::'
synsetId: 00755779-v
simpleMeaning: to ask someone for something you want
scope: This sense is asking for something wanted by making a request; it is not asking again and again
  with strong pressure, and not pushing someone to break the law or disobey.
examples:
- The charity sent letters to solicit gifts from local shops.
- She visited offices to solicit help for the school fair.
