simpleMeaning: a change in what stuff is made of that runs forward and back at the same speed
scope: 'Also called equilibrium: a change in what stuff is made of that runs forward and back at the same
  speed, not a change that runs one way only and not a state of rest.'
examples:
- In chemical equilibrium the forward and back changes match.
- The mixture stays in chemical equilibrium as it stirs.
