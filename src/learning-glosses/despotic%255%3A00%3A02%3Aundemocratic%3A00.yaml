simpleMeaning: ruled by one person with full power, or like such a person
scope: This sense stresses being ruled by one person with full power, or having that kind of rule; it
  is not just a word for belonging to such a ruler.
examples:
- The people lived under a despotic government that let no one speak freely.
- His despotic rule left the country with no free press.
