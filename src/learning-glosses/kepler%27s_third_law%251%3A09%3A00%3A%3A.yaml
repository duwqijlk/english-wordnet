simpleMeaning: A rule saying that for every planet, the square of its year in years over the cube of its
  orbit's long side in Earth-sun distances is the same
scope: This is a rule about planets that links the square of the year to the cube of the orbit; harmonic
  law is another name for this sense.
examples:
- Kepler's third law links a planet's year to the size of its orbit.
- By Kepler's third law, the square of the year over the cube of the orbit is the same for all planets.
