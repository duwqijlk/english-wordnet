simpleMeaning: light, free thoughts that make up things in the mind, less deep than true imagining, as
  Coleridge saw it
scope: Light, free thoughts that make up things in the mind, less deep than true imagining, not a strong
  wish for a thing and not a thing that is dressed up.
examples:
- Her fancy took her to far lands she had never seen.
- In his fancy, the old house was a great ship.
