simpleMeaning: To shake all over in quick jerks you cannot hold still, from fear or from strong feeling
scope: 'Also called shiver, shudder and thrill: to shake in quick jerks you cannot hold still, from fear
  or excitement, not a beat of the heart.'
examples:
- She throbbed with fear as the door slowly opened.
- His whole body throbbed with excitement at the news.
