schema: oewn-learning-gloss-v2
senseId: 'heteronym%1:10:00::'
synsetId: 06303070-n
simpleMeaning: The same letters can be said in two ways, and each way is a different word
scope: Two words spelled the same but said in different ways, not two words that sound the same and not
  two words that mean the same.
examples:
- The word 'bow' is a heteronym, since it is spelled one way but said two ways.
- In the lesson on heteronyms, she showed how 'tear' can be said in two ways.
