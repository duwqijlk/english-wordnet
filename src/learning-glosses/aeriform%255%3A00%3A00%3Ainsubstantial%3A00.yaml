simpleMeaning: Light and thin, with no weight or solid body, like air itself.
scope: Light and thin, with no weight or solid body, like air itself, also called airy, aerial, ethereal,
  and aery; not a solid heavy thing and not a thing that can be held.
examples:
- The aeriform mist rose and was gone.
- Her aeriform dress seemed to float.
