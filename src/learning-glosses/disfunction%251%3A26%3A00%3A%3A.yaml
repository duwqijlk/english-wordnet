simpleMeaning: In medicine, any break in the way a part of the body works, or in the way a group of people
  works together.
scope: In medicine, any break in how a body part or a group works, also called dysfunction; not good health
  and not a single hurt.
examples:
- The disfunction of the joint kept him from walking.
- Disfunction in the group slowed every plan.
