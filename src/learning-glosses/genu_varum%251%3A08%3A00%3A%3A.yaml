simpleMeaning: At the knee, or just below it, this leg bends outward
scope: A leg bowed outward at the knee, also called bandy leg, bandyleg, bow leg and bowleg, not a leg
  bowed inward and not a straight leg.
examples:
- The child had genu varum, so his knees stood wide apart.
- Her genu varum made her legs bend outward at the knees.
