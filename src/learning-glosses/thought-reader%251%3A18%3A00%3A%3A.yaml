synsetId: 10717375-n
simpleMeaning: A person who can pass ideas straight from one mind to another
scope: A person who can pass ideas straight from one mind to another; not a stage performer who only seems
  to know what others think, and not a person who merely guesses what others think.
examples:
- The thought-reader knew what she was thinking before she spoke.
- People said the thought-reader could hear their silent ideas.
