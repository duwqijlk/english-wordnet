senseId: 'resistance%1:19:01::'
synsetId: 11524386-n
simpleMeaning: how much a material works against electric current as the current flows through it; it
  is measured in ohms
scope: How much a material holds back electric current, measured in ohms; not a force that slows movement,
  and not the electrical part itself that does this.
examples:
- Copper has low resistance, so electric current flows through it easily.
- The resistance of this material is measured in ohms.
