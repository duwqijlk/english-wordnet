simpleMeaning: A brown sea plant with edges cut like the teeth of a saw.
scope: Also called tang and serrated wrack, this brown sea plant has edges cut like the teeth of a saw,
  while the common rockweed is a different kind used for kelp.
examples:
- Fucus serratus grows on rocks at low tide.
- The serrated edges of Fucus serratus help tell it from other seaweeds.
