simpleMeaning: Under water, this tropical fish glides on huge fan-like fins on its chest, and it is no
  kin to the sea fish of a like name.
scope: This fish is also called a flying gurnard and a butterflyfish, and it glides under water on huge
  fan-like fins, not through the air like a flying fish.
examples:
- The flying robin spread its huge fan-like fins and glided under water.
- We watched a flying robin glide under water on its wide fins.
