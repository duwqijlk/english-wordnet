simpleMeaning: Tiny living things of a very old kind that grow well in very sour places at high heat
scope: This is a tiny living thing that grows well only in very sour places at high heat; not a germ of
  mild warmth and not one that likes sour places alone.
examples:
- Thermoacidophiles grow well in the hot sour springs.
- The thermoacidophile lives where few other living things can survive.
