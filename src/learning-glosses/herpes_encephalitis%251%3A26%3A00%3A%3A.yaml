scope: People also call this common brain swelling acute inclusion body encephalitis and herpes simplex
  encephalitis, and it usually strikes the sides and front of the brain.
examples:
- Herpes encephalitis struck the sides of her brain.
- The cold-sore germ brought on her herpes encephalitis.
