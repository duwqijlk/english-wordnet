simpleMeaning: Any of many saltwater perch-like fishes, above all of the Sparidae family, though not only
  of that family
scope: Any of many saltwater perch-like fishes, above all of the Sparidae family though not only of that
  family, also called bream; not a freshwater perch and not a carp.
examples:
- The sea bream was served whole with lemon.
- A sea bream swam in the shallow water near the rocks.
