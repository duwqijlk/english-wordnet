simpleMeaning: Any sickness of the muscles that does not come from a fault in the nerves.
scope: Any sickness of the muscles not caused by a nerve fault, not a sickness of the nerves and not a
  hurt muscle.
examples:
- Myopathy can weaken the arms and legs.
- Her myopathy was not caused by her nerves.
