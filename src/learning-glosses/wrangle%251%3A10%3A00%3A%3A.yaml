simpleMeaning: a single strong argument, for example one held when people try to agree on a price
scope: One strong argument, also called haggle, haggling, and wrangling; this is the noun for one such
  event, not the verb sense of arguing noisily.
examples:
- The sale ended in a long wrangle over the price.
- A wrangle broke out at the market when the buyer would not pay the price asked.
