schema: oewn-learning-gloss-v2
senseId: 'bigot%1:18:00::'
synsetId: 09873051-n
simpleMeaning: a person who has unfair fixed ideas and will not accept any views that are different from
  their own
scope: This is a person who will not accept views different from their own, not a person who only disagrees
  in a fair and open way.
examples:
- He was called a bigot for refusing to listen to anyone with different views.
- A bigot will not change his mind even when others explain their views in a calm way.
