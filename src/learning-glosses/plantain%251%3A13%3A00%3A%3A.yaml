simpleMeaning: A fruit like a banana but full of starch, always eaten cooked and used as a main vegetable
  food throughout the tropics
scope: This is the cooked fruit itself, not the banana-like tree it grows on and not the small roadside
  weed with the same name.
examples:
- For dinner we fried slices of ripe plantain.
- Plantain is always cooked before it is eaten as a vegetable.
