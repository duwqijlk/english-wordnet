simpleMeaning: A dark grey wild pig with a faint white band round its neck; it lives in half-desert lands
  of Mexico and the south-west of the United States.
scope: 'Also called collared peccary, javelina, Peccari angulatus and Tayassu angulatus: a dark grey wild
  pig with a faint white band round its neck, from half-desert lands of Mexico and the south-west of the
  United States, not a tame farm pig and not a wild pig with a clear white band.'
examples:
- Tayassu tajacu moved through the half-desert lands of Mexico.
- The Tayassu tajacu had a faint white band round its neck.
