simpleMeaning: With a long tail it can grip with, this tree-living mammal of warm America eats fruit.
scope: Also called the honey bear or the kinkajou, this tree-living mammal of warm America eats fruit
  and grips with its long tail.
examples:
- The potto grips a branch with its long tail.
- The potto eats fruit high in the trees.
