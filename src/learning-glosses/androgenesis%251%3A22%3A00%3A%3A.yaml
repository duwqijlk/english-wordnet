simpleMeaning: The young one holds only the father's threads of inheritance, because the egg's core took
  no part in the joining, in birth without mating.
scope: This is a kind of birth without mating in which the young one holds only the father's threads of
  inheritance, also called androgeny, and not birth in which the mother's threads take part.
examples:
- In androgenesis, the young one holds only the father's threads of inheritance.
- Androgenesis came about because the egg's core took no part in the joining.
