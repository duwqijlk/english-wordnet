simpleMeaning: This loose clothing is worn by Muslim women, especially in India and Pakistan; usually
  it has holes for the eyes, with a thin cloth over the holes
scope: 'Also called burqa: this is the loose clothing worn by Muslim women, not just a cloth worn over
  the hair on its own.'
examples:
- She wore a burka with small holes for her eyes.
- In that town, many women wear a burka when they go out.
