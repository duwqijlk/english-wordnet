simpleMeaning: long, flat pieces of wood taken together; an amount of such pieces of wood
scope: The wood pieces themselves, taken as a group or amount; not a floor or covering made from them,
  and not the work of putting them down.
examples:
- We bought enough planking to build the shed floor.
- A pile of planking lay next to the new house.
