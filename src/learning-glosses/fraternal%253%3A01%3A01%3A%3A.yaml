simpleMeaning: about or belonging to a group or club made up usually of men
scope: About a group or club usually of men; not the sense about twins who come from two different eggs,
  and not just a warm brother-like feeling.
examples:
- He joined a fraternal society for men in his town.
- The fraternal order held a meeting for its members every month.
