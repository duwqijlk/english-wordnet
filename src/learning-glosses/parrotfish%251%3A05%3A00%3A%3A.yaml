simpleMeaning: Bright, showy fish that live in warm seas, with teeth joined together to form a hard mouth
  like a beak
scope: 'Also called polly fish and pollyfish: a bright fish of warm seas whose teeth are joined into a
  beak-like mouth, not a bird and not any bright sea fish.'
examples:
- A parrotfish swam past the coral in the warm water.
- Parrotfish use their hard, beak-like mouths to bite food from rocks.
