simpleMeaning: A simple sea animal with a bag-like body that has no joints, and a cord along its back
  that shows clearly in its young.
scope: Also called a urochord or a urochordate; a simple sea animal with a bag-like body and a cord along
  its back that shows in its young.
examples:
- The tunicate clung to the rock, its bag-like body swaying in the current.
- In its young form the tunicate shows a clear cord along its back.
