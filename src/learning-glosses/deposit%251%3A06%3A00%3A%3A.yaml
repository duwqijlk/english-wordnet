simpleMeaning: a place where things can be left and kept safe
scope: This is a place for keeping things safe; it is not money paid into a bank, not matter laid down
  by water or wind, and not the way such matter builds up.
examples:
- Farmers keep grain in a deposit outside the town.
- He left the boxes in a deposit that keeps goods safe from theft.
