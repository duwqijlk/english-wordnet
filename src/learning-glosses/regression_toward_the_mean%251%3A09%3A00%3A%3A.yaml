simpleMeaning: From the link between chosen values of x and seen values of y, the most likely value of
  y can be guessed for any value of x.
scope: Also called regression, simple regression, and statistical regression, this is the link between
  chosen values of x and seen values of y, from which the most likely value of y can be guessed.
examples:
- Regression toward the mean helped them guess the value of y from x.
- He used regression toward the mean to work out the value of y.
