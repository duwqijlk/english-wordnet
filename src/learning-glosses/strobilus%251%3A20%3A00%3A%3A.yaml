simpleMeaning: A mass shaped like a pointed cone holds seeds, or the tiny bits that grow into new plants,
  in thin parts that overlap.
scope: Cone and strobile are other names for this mass of thin, overlapping parts that holds seeds.
examples:
- The strobilus held seeds in its thin, overlapping parts.
- A strobilus keeps the tiny bits that grow into new plants packed tight.
