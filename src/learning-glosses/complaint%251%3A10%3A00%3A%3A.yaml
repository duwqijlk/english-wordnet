simpleMeaning: words that show you are angry or unhappy about something you think is unfair
scope: Words that show anger or unhappiness about something unfair, not a sickness in the body and not
  a paper in a law case.
examples:
- She made a complaint about the loud music late at night.
- His complaint was that the room was too cold and the food was bad.
