simpleMeaning: a substance made of parts joined together, got from oil taken from the ground or from natural
  gas
scope: This sense is a substance got from oil from the ground or from natural gas, not the oil or gas
  itself and not the place where such substances are made.
examples:
- This plastic is made from a petrochemical.
- The factory turns oil into petrochemicals used to make paint.
