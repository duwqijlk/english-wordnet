senseId: 'rounding_error%1:04:00::'
synsetId: 00073997-n
simpleMeaning: In mathematics, a wrong answer that comes from shortening numbers to a handy number of
  places after the point
scope: 'Also called rounding: in mathematics, a wrong answer caused by shortening numbers, not a mistake
  in adding up and not a wrong number typed in.'
examples:
- Taxes are worked out to the nearest dollar, but the rounding error is small.
- The rounding error in the total came from shortening the figures to two places after the point.
