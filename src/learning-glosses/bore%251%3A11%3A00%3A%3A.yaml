simpleMeaning: a tall, often dangerous wave that tidal flow creates in a narrow estuary or where currents
  collide
scope: A dangerous wave pushed up by the tide where currents collide or in a narrow estuary, also called
  a tidal bore, eagre, aegir or eager, not a dull person and not a hole cut by a drill.
examples:
- The bore swept up the estuary, rocking the moored boats.
- Surfers gathered at the river mouth before the bore arrived.
