simpleMeaning: to try to be sick, and to strain as if to be sick, but bring nothing up
scope: To try to be sick and strain as if to be sick, not the sudden pull of the stomach itself and not
  a slow rise and fall.
examples:
- He heaved over the side of the boat.
- The sick child heaved again and again but brought nothing up.
