simpleMeaning: a political group of the past in the United States, active in the 1850s to keep power from
  immigrants and Roman Catholics
scope: Also called the Know-Nothing Party; a political group of the 1850s in the United States that worked
  to keep power from immigrants and Roman Catholics, not a political group of today.
examples:
- The American Party won seats in the 1850s by warning voters about immigrants.
- Members of the American Party wanted to keep Roman Catholics out of public office.
