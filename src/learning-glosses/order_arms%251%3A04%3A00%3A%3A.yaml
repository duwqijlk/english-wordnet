synsetId: 00896990-n
simpleMeaning: The rifle is held straight up on the right side, its end on the ground, in rifle drill,
  often as a word of command
scope: A rifle-drill stance with the rifle held straight up on the right, often given as a word of command;
  not a stance with the gun held across the body and not a command to fire.
examples:
- At order arms, the rifles stood straight up on the men's right sides.
- The sergeant called order arms and the line went still.
