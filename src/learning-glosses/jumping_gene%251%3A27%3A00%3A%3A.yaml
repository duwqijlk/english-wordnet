simpleMeaning: A bit of DNA that can move whole and settle at many spots along a chromosome, a thread
  in the cell, above all a bit of germ DNA.
scope: Also called transposon, it is a bit of DNA that moves about the chromosome rather than staying
  in one place.
examples:
- The jumping gene moved to a new place on the chromosome.
- A jumping gene can shift its place in the cell.
