simpleMeaning: if you add up all the cash and goods a person has, the total comes to more than a million
  dollars
scope: A person with wealth worth over a million dollars, not just any rich person and not someone with
  a billion dollars.
examples:
- The millionaire bought the old house and had it fixed up.
- She became a millionaire after selling her small shop for a large sum.
