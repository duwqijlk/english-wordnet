simpleMeaning: An operation that cuts a nerve path in the nerve network that controls the body's automatic
  work.
scope: This is an operation that cuts a nerve path, not the removal of a nerve and not a nerve block.
examples:
- The surgeon did a sympathectomy to ease the sweating.
- After the sympathectomy, his hands stayed dry.
