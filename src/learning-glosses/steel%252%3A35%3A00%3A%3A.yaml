senseId: 'steel%2:35:00::'
synsetId: 01617811-v
simpleMeaning: To coat or edge an object with steel, or fit it with steel plates.
scope: 'This is a technical verb from manufacturing: putting a steel surface, plate or edge on a tool,
  door or machine part. It is not ''steel yourself'', which means to prepare for something difficult,
  and not the noun for the metal. It appears mainly in descriptions of craft and industry.'
examples:
- The gate was steeled at the corners to take the impact of carts.
- Workers steeled the bow of the hull so it could break through ice.
