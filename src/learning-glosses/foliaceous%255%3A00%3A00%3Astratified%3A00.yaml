simpleMeaning: Above all of rock changed by heat and pressure, made of thin layers like leaves.
scope: Above all of rock changed by heat and pressure, made of thin layers like leaves, also called foliate
  or foliated; not rock with thick layers and not a leaf.
examples:
- The foliaceous rock split into thin layers.
- Foliaceous rock is made of thin layers like leaves.
