simpleMeaning: grown for show, this South American tree keeps some leaves through the year, with leaves
  of small leaflets in pairs and one at the tip, and golden blooms
scope: This South American tree, also called tipu and tipu tree, is grown for show.
examples:
- They planted a yellow jacaranda for show, and its golden blooms stood out.
- The yellow jacaranda kept some of its leaves through the year.
