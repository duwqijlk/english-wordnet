simpleMeaning: a quality of sound that lets it carry far and be heard clearly, cutting through other noise
scope: Sound that carries well, not the mental act of blaming others for your own feelings, not a prediction,
  and not a picture thrown on a screen.
examples:
- The hall was built to give every singer's voice more projection.
- Her projection was so strong that people in the back row heard every word.
