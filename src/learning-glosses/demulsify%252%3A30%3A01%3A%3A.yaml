simpleMeaning: to split a mix of liquids that will not blend, such as oil and water, back into its parts
scope: To split a mix of liquids that will not blend back into its parts; not mixing liquids together,
  and not breaking a solid apart.
examples:
- Heat can demulsify the cream in the sauce.
- The chemist demulsified the oil and water mixture.
