simpleMeaning: 'Some count it in one animal family, others in a family of its own: a big black-and-white
  plant-eater in the bamboo woods of China and Tibet.'
scope: This is the big black-and-white plant-eater of the bamboo woods of China and Tibet, also called
  a panda, giant panda, or panda bear; some count it with the bear family, and some put it in a family
  of its own.
examples:
- The coon bear ate plants in the bamboo woods.
- A coon bear moved through the bamboo woods.
