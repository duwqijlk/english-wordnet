senseId: 'earless_seal%1:05:00::'
synsetId: 02082041-n
simpleMeaning: A seal whose ears lack outer flaps, whose coat is stiff and bristly, and whose hind legs
  serve as flippers for swimming.
scope: 'Another name for hair seal and true seal: seals with no outer ear flaps, a stiff coat and hind
  flippers for swimming. Not an eared seal such as a sea lion, which has small ear flaps, nor a walrus,
  which has tusks.'
examples:
- The harbour seal is an earless seal, its ears marked only by tiny openings.
- An earless seal hauls itself over rocks by undulating its body, not by walking on flippers.
