simpleMeaning: In astronomy, two or more bodies in the sky seeming to meet or pass at the same point in
  the zodiac, the ring of star signs in the sky
scope: Bodies in the sky seeming to line up, not things set in a straight line and not the act of adjusting
  the parts of a machine.
examples:
- The alignment of the two planets could be seen at dawn.
- People watched the alignment of the moon and Venus in the evening sky.
