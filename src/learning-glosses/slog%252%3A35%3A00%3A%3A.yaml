simpleMeaning: to land a hard blow on someone or something, most of all with a fist or a bat
scope: 'Also called swig and slug: to hit hard, not to walk with heavy steps when tired or in mud.'
examples:
- He slogged the ball over the fence with one hard swing.
- The boxer slogged his opponent hard with his fist.
