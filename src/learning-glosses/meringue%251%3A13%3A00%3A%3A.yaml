simpleMeaning: a sweet food put on top, especially on pies, made from egg whites beaten with sugar
scope: A sweet topping for pies made from egg whites and sugar, not the pie itself and not cream.
examples:
- The lemon pie had a tall white meringue on top.
- She spread the meringue over the pie and put it back in the oven.
