simpleMeaning: To dirty a thing by covering it with soft wet earth, filth, or deep mud
scope: Also called mud; to dirty a thing with soft wet earth, filth, or deep mud, not to dig in the earth.
examples:
- The boys mucked their boots in the field.
- She mucked her dress while digging in the garden.
