simpleMeaning: How fast the angle changes at a point on a bent line, where the angle is between that line
  and a straight line touching it at that point
scope: This is the maths sense, about how fast an angle changes at a point on a bent line; it is not a
  bending of the body in medicine, which is often not normal.
examples:
- In maths class, we worked out the curvature at one point of the bent line.
- The teacher showed how curvature tells us how fast the angle changes at that point.
