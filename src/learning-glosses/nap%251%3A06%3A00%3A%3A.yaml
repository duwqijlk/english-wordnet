simpleMeaning: the threads that stand up from the cloth in a rug, velvet, or corduroy
scope: Also called pile, this is the raised threads on cloth like velvet or a rug; it is not a short sleep
  during the day.
examples:
- The nap of the velvet felt soft when she brushed it one way.
- For an even colour, cut the cloth so the nap of every piece runs the same way.
