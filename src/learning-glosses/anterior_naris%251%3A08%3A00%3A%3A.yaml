simpleMeaning: Either one of the two outside holes that lead into the nose
scope: Either one of the two outside holes that lead into the nose; nostril is another name for this sense,
  not a hole inside the nose and not the hole at the back of the throat.
examples:
- Air flows in through the anterior naris.
- One anterior naris was blocked by a cold.
