simpleMeaning: a place where one or more judges, or a magistrate (a judge for smaller cases), hear cases
  and decide them by the country's rules
scope: 'Also called court of justice, court of law and law court: a place where judges decide cases, not
  a sports ground and not the group of people around a king or queen.'
examples:
- The case was heard in a lawcourt in the city centre.
- He stood in the lawcourt and waited for the judges to decide his case.
