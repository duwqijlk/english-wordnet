simpleMeaning: a sea creature from warm waters, eaten as food, with sharp fins and large strong teeth
scope: A sea creature from warm waters with sharp fins and large strong teeth, eaten as food, also called
  sparid; not a creature with soft fins, and not a cold-water fish.
examples:
- Sparid fish are often served grilled in coastal towns.
- The sparid fish in the tank had sharp fins and strong teeth.
