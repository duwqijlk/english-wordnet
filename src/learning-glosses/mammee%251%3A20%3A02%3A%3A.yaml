simpleMeaning: a tree from warm parts of the Americas, with wood like mahogany and sweet egg-shaped fruit
  to eat; some group it with the fruit trees called Calocarpum
scope: 'Also called marmalade tree and sapote: the tree itself, not the fruit it bears.'
examples:
- The mammee in our yard gives sweet egg-shaped fruit each year.
- They cut mammee wood to make a table because it looks like mahogany.
