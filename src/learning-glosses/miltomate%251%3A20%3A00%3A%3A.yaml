simpleMeaning: With yellow to purple fruit good to eat, like small tomatoes, this plant of Mexico lives
  one year, now at home in the east of North America.
scope: This is a Mexican plant with yellow to purple fruit; tomatillo, jamberry and purple ground cherry
  are other names for this sense.
examples:
- The miltomate bore yellow fruit that looked like small tomatoes.
- Miltomate grows wild in the east, its purple fruit good to eat.
