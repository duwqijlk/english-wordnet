simpleMeaning: To give something your full attention because it holds you completely, as if by magic.
scope: Being completely absorbed by something you watch, hear or read; not swallowing a liquid, not consuming
  alcohol, and not raising a glass in someone's honour.
examples:
- The children drank in every word of the story.
- She stood at the cliff edge and drank in the view.
