simpleMeaning: the state of having to do something or pay something
scope: The state of having to act or pay, not a written legal agreement and not the feeling of owing a
  person for a favor they did for you.
examples:
- He is under an obligation to finish the job this week.
- She felt no obligation to pay money she did not owe.
