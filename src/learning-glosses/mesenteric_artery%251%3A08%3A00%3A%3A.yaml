simpleMeaning: One of two blood tubes from the main blood tube of the body that run between the two sheets
  of the gut fold to the gut
scope: One of two blood tubes from the main blood tube of the body, running to the gut; arteria mesenterica
  is another name for this, not a blood tube of the head and not a blood tube of the leg.
examples:
- The mesenteric artery feeds the gut.
- A block in the mesenteric artery starves the gut of blood.
