simpleMeaning: This light covering for the head shields it from the sun in hot countries
scope: Also called a pith hat, a topee or a topi, this light covering for the head shields it from the
  sun in hot countries, not a hard hat worn on a building site.
examples:
- He put on his pith helmet before going out in the sun.
- The pith helmet shielded her head from the strong sun.
