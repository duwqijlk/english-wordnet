simpleMeaning: Worn by men in Turkey, Iran, and the Caucasus, this black head covering has a high crown
  and is usually made of felt or sheepskin.
scope: Also called calpac and kalpac, this is the black head covering with a high crown that men in Turkey,
  Iran, and the Caucasus wear.
examples:
- He wore a calpack made of felt.
- He put his calpack on and went out.
