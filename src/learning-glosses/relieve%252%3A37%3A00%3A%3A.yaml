simpleMeaning: to make a strong feeling less strong, or to make a person calm
scope: 'Also called still and ease: this is about making a feeling less strong or a person calm, not about
  making pain in the body less and not about saving someone from harm.'
examples:
- A kind word relieved her fears and helped her feel calm.
- Talking to a friend relieved his worry.
