simpleMeaning: A blood condition in which the blood holds too little gamma globulin, a protein that fights
  germs, so catching an infection is more likely.
scope: A blood condition with too little of the germ-fighting protein, not too much of it and not a lack
  of red blood cells.
examples:
- His hypogammaglobulinemia left him open to chest infections.
- The test showed hypogammaglobulinemia, so the doctor gave him extra care.
