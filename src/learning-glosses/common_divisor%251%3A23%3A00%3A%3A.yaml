schema: oewn-learning-gloss-v2
senseId: 'common_divisor%1:23:00::'
synsetId: 13757132-n
simpleMeaning: a whole number that goes into two or more other whole numbers with nothing left over
scope: This is a whole number that goes into two or more other whole numbers with nothing left over, with
  common factor and common measure as other names for this sense, and not a number that leaves a bit left
  over.
examples:
- Three is a common divisor of six and nine.
- They found a common divisor that goes into both numbers with nothing left over.
