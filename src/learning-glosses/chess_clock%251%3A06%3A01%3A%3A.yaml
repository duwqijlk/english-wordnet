simpleMeaning: a device with two timers and a switch that runs one at a time, used in the board game of
  kings and queens to count each player's time
scope: A device with two timers and a switch that runs one at a time, not a single timer and not a sand
  glass.
examples:
- He pressed the chess clock after his move.
- The chess clock showed ten minutes left.
