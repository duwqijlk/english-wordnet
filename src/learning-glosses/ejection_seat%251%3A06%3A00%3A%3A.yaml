senseId: 'ejection_seat%1:06:00::'
synsetId: 03272379-n
simpleMeaning: A pilot's seat in an airplane that can be forcibly thrown out in an emergency; the pilot
  then descends by parachute.
scope: An ejector seat and a capsule are other names for this seat, which shoots a pilot out of a plane
  in an emergency so the pilot can float down under a parachute.
examples:
- The pilot pulled the handle and the ejection seat shot him clear of the burning plane.
- Every ejection seat is checked before the plane takes off.
