simpleMeaning: a light, loose dress for summer. It has no sleeves, a wide neck, and thin straps over the
  shoulders, so the arms and shoulders show
scope: A light summer dress with no sleeves and thin shoulder straps; it is not a heavy dress or a dress
  with sleeves.
examples:
- She wore a sundress on the hot day.
- Her blue sundress has thin straps over the shoulders.
