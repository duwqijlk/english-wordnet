simpleMeaning: a lab tool that cuts very thin slices of a thing so they can be looked at under a microscope
scope: A lab tool for cutting thin slices; not a knife for food and not a microscope itself.
examples:
- The scientist used a microtome to cut thin slices of the leaf.
- A microtome made slices thin enough to see under a microscope.
