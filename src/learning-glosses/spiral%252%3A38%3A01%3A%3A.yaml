simpleMeaning: to move along a winding path that turns round and round or goes sharply from side to side
scope: To move along a winding path that turns round and round or goes sharply from side to side, not
  to move in a straight line and not to wind a thing into loops.
examples:
- The road spirals up the hill in sharp turns.
- The snake spiraled across the sand from side to side.
