simpleMeaning: A tool that pinches a vessel shut is used during an operation to stop the flow of blood
scope: 'Also called haemostasis, hemostasia and hemostasis: stopping the flow of blood during an operation,
  not stopping a nosebleed on its own and not cleaning a wound.'
examples:
- The surgeon used haemostasia to stop the bleeding during the operation.
- Haemostasia kept the blood from flowing while the wound was closed.
