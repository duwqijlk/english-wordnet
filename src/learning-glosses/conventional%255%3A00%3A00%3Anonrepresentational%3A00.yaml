simpleMeaning: shown in a way that uses simple shapes and marks to stand for the real thing
scope: 'Also called formal: shown in simple form, using marks or shapes to stand for the real thing, not
  a rigid rule or custom.'
examples:
- The diagram showed the building in conventional form, with simple shapes for the rooms.
- The signs in the book were conventional, with a triangle standing for a mountain.
