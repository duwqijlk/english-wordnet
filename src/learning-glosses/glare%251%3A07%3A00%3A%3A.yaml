simpleMeaning: a light in the area you can see that is brighter than the light your eyes are used to
scope: 'Also called blaze: this is a bright light in the area you can see, not an angry look on a face.'
examples:
- The glare of the sun on the water hurt her eyes.
- A strong glare from the lamp made the page hard to read.
