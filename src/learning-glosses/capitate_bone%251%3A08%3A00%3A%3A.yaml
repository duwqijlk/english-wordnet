simpleMeaning: the wrist part with a round head that joins to the long part in the palm that leads to
  the middle finger
scope: The wrist part with a round head that joins to the long part in the palm that leads to the middle
  finger; capitate and os capitatum are other names for this sense, not a finger part and not the whole
  wrist.
examples:
- The capitate bone sits in the middle of the wrist.
- The doctor pointed to the capitate bone on the X-ray.
