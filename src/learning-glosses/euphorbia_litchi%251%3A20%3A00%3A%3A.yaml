simpleMeaning: A tree from southeastern Asia to Australia, grown mainly for its sweet edible fruit like
  lychee nuts, and sometimes put in Nephelium or another group of plants.
scope: Also called longan, longanberry, lungen, Dimocarpus longan, and Nephelium longana; a fruit tree
  of Southeast Asia, not a true lychee tree.
examples:
- Euphorbia litchi bore sweet fruit this year.
- We planted Euphorbia litchi in the orchard.
