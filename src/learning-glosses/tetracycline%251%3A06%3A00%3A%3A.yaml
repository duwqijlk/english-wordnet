simpleMeaning: Sold under a trade name, this germ-fighting drug comes from tiny living things of the Streptomyces
  group and treats many kinds of sickness caused by germs.
scope: One of many germ-fighting drugs, this one is made from tiny living things and treats sickness caused
  by germs.
examples:
- She took tetracycline for her infection.
- His infection was treated with tetracycline.
