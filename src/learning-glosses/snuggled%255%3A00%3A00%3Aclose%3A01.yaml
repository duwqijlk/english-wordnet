simpleMeaning: held close to a person or thing, as if to show love or to keep safe
scope: Held close for love or safety; nestled is another name for it, not merely lying near a thing.
examples:
- She lay snuggled in her mother's arms.
- A row of small houses stood snuggled against the hillside.
