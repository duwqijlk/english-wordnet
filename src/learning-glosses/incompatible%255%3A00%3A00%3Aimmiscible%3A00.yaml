senseId: incompatible%5:00:00:immiscible:00
synsetId: 00511821-s
simpleMeaning: used especially of solids or solutions (liquids with something mixed in them), which cannot
  mix together to form one mix that is the same all through and stays so
scope: This sense is about solids and liquids that will not mix into one even mix. It is not the sense
  about drugs that stop each other working, and not the sense about machines that cannot be used together
  without change.
examples:
- Oil and water are incompatible and will not mix into one liquid.
- These two liquids are incompatible; they separate instead of forming one mixture.
