simpleMeaning: the belief that all people are equal, and that people should be equal in politics, in money
  and work, and in daily life
scope: This belief is also called equalitarianism. It is about all people being equal, not about a single
  law or act that makes things equal.
examples:
- Egalitarianism guides parties that want the same rights for all people.
- She studies egalitarianism and its ideas about equal pay and votes.
