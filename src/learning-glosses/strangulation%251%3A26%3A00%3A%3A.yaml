simpleMeaning: The state of being unable to breathe because the air passage has been pressed shut.
scope: The state of being unable to breathe because the air passage has been pressed shut, not the act
  of squeezing the windpipe and not the squeezing shut of another part of the body.
examples:
- The victim died of strangulation after the fall.
- The doctor noted signs of strangulation in the patient.
