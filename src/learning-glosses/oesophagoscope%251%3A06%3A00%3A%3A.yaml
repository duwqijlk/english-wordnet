simpleMeaning: A tool with a lens for looking inside the food pipe
scope: A tool with a lens for looking inside the food pipe, also called esophagoscope, and not a tool
  for looking inside the stomach or a picture of the food pipe.
examples:
- The doctor used an oesophagoscope to look inside her food pipe.
- An oesophagoscope showed that the food pipe was sore.
