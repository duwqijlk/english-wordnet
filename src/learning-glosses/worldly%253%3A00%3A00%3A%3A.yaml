simpleMeaning: Of or concerned with the life of this world, not with the life of the spirit
scope: Concerned with this world rather than the spiritual world; not experienced in the ways of the world,
  the other worldly sense.
examples:
- He cared only for worldly goods and advancement.
- The church owned worldly lands as well as holy ones.
