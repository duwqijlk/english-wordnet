simpleMeaning: a sound made by hot mist, usually fixed to a boiler that makes the mist
scope: A sound made by hot mist from a boiler, not a whistle blown by mouth and not a siren.
examples:
- The steam whistle blew as the train left the station.
- The steam whistle on the old factory sounded at noon.
