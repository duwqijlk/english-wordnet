senseId: 'callus%1:26:01::'
synsetId: 14387971-n
simpleMeaning: a patch of skin that has grown thick or hard from being pressed or rubbed again and again,
  such as the sole of the foot
scope: A patch of skin grown thick or hard from being pressed or rubbed again and again; not the bone
  tissue that forms as a broken bone heals, and not the plant lump on an orchid.
examples:
- Years of barefoot walking left a callus on the sole of his foot.
- The callus on her palm came from gripping the tool.
