simpleMeaning: To handle something with the hands, or to turn something over in the mind or imagination.
scope: This is not taking part in a game or sport, not acting a role and not starting a recording; it
  is handling something by hand or turning an idea over in the mind.
examples:
- She played with the loose thread on her sleeve while she waited.
- He played with the idea of moving abroad for a year.
