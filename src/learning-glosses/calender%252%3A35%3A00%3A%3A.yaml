simpleMeaning: to press a thing between rollers or plates until it is smooth, shiny, or made thin in sheets
scope: To press a thing between rollers or plates until it is smooth, shiny, or made thin in sheets; not
  the machine that does this work.
examples:
- The mill calenders the paper to give it a smooth shine.
- They calender the cloth before cutting it into sheets.
