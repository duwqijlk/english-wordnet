senseId: 'vena_brachialis%1:08:00::'
synsetId: 05366895-n
simpleMeaning: The blood tube under the arm takes in two blood tubes from each arm, which run beside the
  arm's main blood tube.
scope: Also called brachial vein, this is the pair of blood tubes in each arm beside the arm's main blood
  tube, draining into the blood tube under the arm.
examples:
- The vena brachialis runs beside the brachial artery in each arm.
- Blood from the vena brachialis drains into the axillary vein.
