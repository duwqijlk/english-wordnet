senseId: 'anthrax%1:26:01::'
synsetId: 14095905-n
simpleMeaning: A sickness in people that does not spread from person to person, brought on by a germ that
  then poisons the blood.
scope: A human sickness that does not pass from person to person, brought on by a germ that poisons the
  blood; not the animal disease that can be passed to people.
examples:
- Anthrax in people does not spread from one person to another.
- The doctor said the anthrax came from a germ that had poisoned his blood.
