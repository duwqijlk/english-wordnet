simpleMeaning: electromagnetic radiation (energy sent out in waves) with waves longer than light you can
  see but shorter than radio waves
scope: Also called infrared emission, infrared light and infrared radiation. This is the waves themselves,
  not the part of the full range of waves where they are found, and not the word that describes things
  that use them.
examples:
- The camera can photograph infrared given off by warm bodies.
- Heat cameras record infrared that our eyes cannot see.
