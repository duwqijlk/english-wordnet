simpleMeaning: To show you liked a show by clapping your hands and calling out when it ends.
scope: This is clapping or calling out to show you liked a show, not a short quarrel or a cloth foot cover.
examples:
- The crowd spat loudly when the play ended.
- They spat and cheered after the singer's last song.
