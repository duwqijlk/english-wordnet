simpleMeaning: a mammal (an animal that feeds its young on milk) that digs holes in the ground, is mostly
  out at night, and has strong hard plates over its body
scope: This is the animal itself, a digging animal that is mostly out at night and has hard plates over
  its body; it is not just any animal that digs or is out at night.
examples:
- An armadillo dug a hole near the fence at night.
- The armadillo's hard plates protect its body.
