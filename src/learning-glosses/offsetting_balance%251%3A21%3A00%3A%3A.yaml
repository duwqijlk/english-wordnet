senseId: 'offsetting_balance%1:21:00::'
synsetId: 13431023-n
simpleMeaning: The least money a bank may ask a borrower to keep in the bank as a term for a loan, often
  asked when a line of credit is set up.
scope: The least money a bank may ask a borrower to keep in the bank as a term for a loan, also called
  compensating balance; not the money lent and not the charge for the loan.
examples:
- The bank asked for an offsetting balance before it lent the money.
- Her offsetting balance stayed in the bank while the loan ran.
