simpleMeaning: to do with the temples (the sides of the head behind the eye sockets)
scope: This sense is about the sides of the head; it is not about the time of an action, and not about
  life in this world rather than life of the spirit.
examples:
- The temporal bone is on the side of the head.
- A blow to the temporal area can hurt the side of the head.
