simpleMeaning: A calm, comfortable state, especially after worry or upset has passed.
scope: This is the calm, comfortable feeling that follows trouble, and ease is another name for the same
  state. It is not the act of easing something, not aid for people in need, and not a carved artwork.
examples:
- To his relief, the deadline was extended by a week.
- She felt a wave of relief when the test results came back clear.
