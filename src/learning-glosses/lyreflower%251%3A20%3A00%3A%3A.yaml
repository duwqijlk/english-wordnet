simpleMeaning: Deep-pink blooms that hang down, shaped like hearts, grow on this garden plant
scope: Also called bleeding heart and lyre-flower, its deep-pink blooms hang down, shaped like hearts,
  on a garden plant — not a plant with upright pale flowers.
examples:
- The lyreflower by the wall was full of deep-pink blooms.
- We grew lyreflower in the shade, where its heart-shaped blooms hung down.
