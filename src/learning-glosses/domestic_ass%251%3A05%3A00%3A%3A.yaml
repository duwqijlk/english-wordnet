simpleMeaning: A tame beast of burden come down from a wild African animal of the donkey kind, known as
  patient but stubborn
scope: A tame beast of burden come down from a wild African animal of the donkey kind, known as patient
  but stubborn; donkey is another name for it, not a horse and not a wild ass.
examples:
- The domestic ass carried the water jars up the hill.
- A domestic ass waited patiently by the gate.
