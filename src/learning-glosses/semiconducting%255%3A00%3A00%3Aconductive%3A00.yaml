senseId: semiconducting%5:00:00:conductive:00
synsetId: 00560245-s
simpleMeaning: Having the traits of a material that lets power through better than a non-conductor but
  worse than a good conductor
scope: 'Also called semiconductive: letting power through worse than a good conductor but better than
  a non-conductor, not a metal wire and not a non-conductor.'
examples:
- A semiconducting chip lets some power through, more than a non-conductor but less than a copper wire.
- The semiconducting plate lets a little power through, but not as much as a metal wire.
