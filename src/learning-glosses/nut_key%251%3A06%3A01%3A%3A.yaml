simpleMeaning: After use, a climber pulls a metal wedge, a chock, and the like out of a crack with this
  climbing tool.
scope: Also called a nut tool, this climbing tool takes a metal wedge out of a crack after use, not one
  for putting the wedge in.
examples:
- The climber used a nut key to pull the wedge from the crack.
- A nut key pulled the chock out of the crack.
