simpleMeaning: 'A vehicle light setting for driving among other traffic: it lights the road ahead and
  to the sides without blinding anyone, used whenever other vehicles are present ahead.'
scope: The dipped setting of a vehicle headlight, not the main or high beam; passing, low and meeting
  are interchangeable names for it.
examples:
- In town at night, use passing beam headlamps to avoid dazzling other drivers.
- The passing beam headlamp lit the road without blinding the cyclist ahead.
