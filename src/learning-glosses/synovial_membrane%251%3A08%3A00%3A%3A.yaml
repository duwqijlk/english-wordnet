simpleMeaning: Inside joints that move freely, a thin sheet lines the joint case and makes the fluid found
  there.
scope: 'Also called synovium: the thin sheet that lines a freely moving joint and makes its fluid, not
  the joint itself.'
examples:
- The synovial membrane lines the inside of the knee joint.
- The synovial membrane in his elbow makes the fluid found inside the joint.
