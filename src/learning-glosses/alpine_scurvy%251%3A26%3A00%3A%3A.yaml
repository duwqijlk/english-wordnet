simpleMeaning: An illness from too little niacin or tryptophan, or a fault in that change; gut trouble,
  red skin, and nerve or mind troubles, maybe from poor food or heavy drinking.
scope: Not true scurvy, nor other illnesses from poor food; also called pellagra, maidism, mal de la rosa,
  mal rosso, mayidism, and Saint Ignatius' itch.
examples:
- Alpine scurvy comes from poor food.
- Alpine scurvy brings red skin and nerve troubles.
