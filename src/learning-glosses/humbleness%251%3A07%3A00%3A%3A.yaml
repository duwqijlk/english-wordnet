simpleMeaning: A way of thinking about oneself that is modest and free of false pride.
scope: 'Also called humility: a modest way of thinking about yourself, not pride and not a low view of
  yourself.'
examples:
- Her humbleness showed in the way she thanked the whole team for the award.
- His humbleness kept him from boasting about his success.
