simpleMeaning: a person who keeps money and things and will not spend or share them, often living in a
  poor, unhappy way
scope: This is a person who holds on to money and will not spend it, not just a careful saver and not
  a poor person who has no money.
examples:
- The old miser kept his money hidden and never bought new clothes.
- Everyone knew the miser would not give even a small coin to help others.
