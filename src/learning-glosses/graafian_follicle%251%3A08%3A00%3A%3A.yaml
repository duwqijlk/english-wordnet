simpleMeaning: A body full of blood vessels in the ovary of a female mammal, holding an egg as it grows
scope: A body in the ovary holding a growing egg, not the egg itself and not the whole ovary.
examples:
- The Graafian follicle held the egg as it grew.
- Inside the Graafian follicle the egg slowly grew.
