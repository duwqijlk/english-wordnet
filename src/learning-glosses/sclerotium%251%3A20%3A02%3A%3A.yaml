simpleMeaning: a hard, usually dark lump of packed fungus threads, a growing food store for the fungus,
  that breaks off when ripe and can start new growth
scope: A hard dark lump of fungus threads that stores food; not a mushroom cap and not a seed.
examples:
- The sclerotium broke off the fungus when it was ripe.
- A sclerotium can start new growth after lying still for months.
