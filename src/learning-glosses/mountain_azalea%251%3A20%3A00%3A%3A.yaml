simpleMeaning: 'People grow this low shrub for its rose-pink flowers: it creeps and spreads like a mat,
  keeps its leaves all year, and lives high up in the Northern Hemisphere.'
scope: 'Also called alpine azalea: a low shrub of high mountains grown for its rose-pink flowers, not
  the mountain avens, a creeping shrub with large white flowers.'
examples:
- Mountain azalea grows high up in the Northern Hemisphere, and people plant it for its rose-pink flowers.
- Her mountain azalea spread like a mat under the window.
