simpleMeaning: a plant with violet flowers that lives for many years, grows in the middle of the United
  States, and has flower heads that stand alone
scope: A violet-flowered plant of the middle United States that lives for many years, not a garden flower
  from another place and not a plant that lives for only one year.
examples:
- A prairie aster grew beside the path, its violet flowers standing alone on tall stems.
- The prairie aster comes back each year, with violet flowers that stand alone.
