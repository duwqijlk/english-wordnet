simpleMeaning: the act of making something come apart into pieces or stop being whole
scope: Another name for this act is breaking, also called break. It is the act itself, not money paid
  back for goods damaged on the way or in use.
examples:
- There was much breakage when the heavy boxes fell to the floor.
- Glass cups need strong boxes to stop breakage on the way.
