simpleMeaning: A drug, sold as Imuran, that holds back the body's defence system so a new organ given
  in an operation is not pushed out by the body
scope: A drug that weakens the body's defences to keep a new organ, not a drug that kills germs and not
  a drug that stops pain.
examples:
- After the transplant she took azathioprine every day.
- The doctor gave him azathioprine so his body would accept the new kidney.
