simpleMeaning: a layer of stones and rock bits lying on top of ice where a glacier is wasting away
scope: A layer of stones and rock bits lying on top of ice where a glacier is wasting away; not the ice
  itself and not a heap of stones left by a river.
examples:
- The ablation moraine lay on top of the glacier ice.
- Stones of the ablation moraine covered the melting ice.
