simpleMeaning: In the water of a tub, this hard, fine or runny mix makes bubbles, gives it a smell, and
  makes it soft.
scope: This mix is also called bath foam, bubble bath and foaming bath.
examples:
- She poured the foam bath into the tub and watched the bubbles rise.
- The foam bath made the water full of bubbles and soft to the touch.
