simpleMeaning: showing a thought or idea by a picture, a sign, or a story that stands for it
scope: Showing an idea through a picture, a sign, or a story, not a plain statement of the idea and not
  a picture made only to look pretty.
examples:
- The figuration of justice as a woman with scales is well known.
- His figuration of hope as a rising sun ran through the poem.
