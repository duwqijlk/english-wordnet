senseId: 'stage_setting%1:06:00::'
synsetId: 03778801-n
simpleMeaning: the scenery and things put in place to show where a play or film takes place
scope: Also called setting and mise en scene; it is the scenery and things on a stage, not the written
  story and not the lights.
examples:
- The stage setting showed a small kitchen with a table and chairs.
- They changed the stage setting between the two acts.
