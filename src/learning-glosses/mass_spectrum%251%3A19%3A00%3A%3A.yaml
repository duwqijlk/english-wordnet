simpleMeaning: A machine that sorts tiny charged bits by weight shows them as a spread
scope: A spread of charged bits shown by a machine, not a spread of colours and not a range of sound.
examples:
- The mass spectrum showed a tall peak for the lightest ions.
- Scientists read the mass spectrum to work out what the sample held.
