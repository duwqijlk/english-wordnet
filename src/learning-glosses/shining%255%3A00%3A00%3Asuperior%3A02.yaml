simpleMeaning: of the very best kind; much better than most other things of its kind
scope: Of the very best kind, much better than most others. It is not the work of rubbing a thing bright,
  and not just bright after rubbing.
examples:
- She was a shining example of a kind teacher.
- Her shining honesty made everyone trust her.
