simpleMeaning: seeds with a sweet taste like liquorice, used as medicine, in cooking, and in strong drinks
scope: These are the seeds themselves, also called aniseed and anise seed; they are not the plant that
  they come from.
examples:
- The cook put anise seeds in the soup for their sweet taste.
- Ground anise seeds are used in cooking and in some strong drinks.
