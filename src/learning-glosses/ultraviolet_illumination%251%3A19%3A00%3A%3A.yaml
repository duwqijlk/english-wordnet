simpleMeaning: Rays with waves shorter than light but longer than X rays lie past the purple end of what
  the eye can see.
scope: Also called ultraviolet, ultraviolet light, and ultraviolet radiation, these are rays with waves
  shorter than light but longer than X rays, lying past the purple end of what the eye can see.
examples:
- The hidden marks glowed under ultraviolet illumination.
- The room was lit by ultraviolet illumination.
