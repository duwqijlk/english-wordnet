simpleMeaning: A catching virus sickness, a light form of a rash illness lasting three or four days; it
  can harm a baby in the womb in the first three months.
scope: Also called rubella, epidemic roseola or three-day measles; this light rash illness lasts three
  or four days and can harm a baby in the womb during the first three months.
examples:
- German measles lasted only three days for the child.
- The doctor said German measles could harm a baby in the womb.
