simpleMeaning: Of or about the branch of the Protestant Church that follows the teaching of the reformer
  whose name it bears.
scope: This is a word for things of the branch of the Protestant Church that follows the teaching of the
  reformer whose name it bears; it is not the word for Martin Luther himself or for a follower of that
  church.
examples:
- Lutheran doctrines shape the worship of that church.
- The Lutheran church in town holds its service on Sunday morning.
