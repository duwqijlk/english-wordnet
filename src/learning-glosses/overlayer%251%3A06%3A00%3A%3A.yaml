senseId: 'overlayer%1:06:00::'
synsetId: 04194276-n
simpleMeaning: a covering that keeps a building safe, made for example of boards fixed to posts and beams
  to make it strong and to hold a rain-proof outer skin
scope: A strong covering put over the frame of a building, also called sheathing and overlay; not the
  outer wall itself and not the roof.
examples:
- The builders put an overlayer of boards over the frame before they added the outer skin.
- This overlayer will make the wall strong enough to hold the rain-proof covering.
