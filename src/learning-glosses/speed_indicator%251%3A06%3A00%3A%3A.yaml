simpleMeaning: a dial fixed in a car or other vehicle that shows how fast it is going
scope: Also called speedometer, it is the vehicle's own gauge for speed, not a gauge for fuel and not
  a clock.
examples:
- The speed indicator showed 60 miles an hour.
- He glanced at the speed indicator before slowing down.
