simpleMeaning: Discomfort, blood-flow symptoms and numbness in a shoulder and arm, caused when a scalene
  muscle presses on an artery and on part of the nerve network reaching the arm.
scope: This is not carpal tunnel syndrome or thoracic outlet syndrome; here a scalene muscle presses on
  an artery and on nerves.
examples:
- Scalenus syndrome can bring numbness and discomfort to one shoulder and arm.
- The pain of scalenus syndrome comes from a muscle pressing on an artery.
