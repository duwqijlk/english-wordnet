simpleMeaning: In gymnastics, a hold on the rings or parallel bars with the body upright and the arms
  by the sides
scope: A hold in gymnastics on the rings or parallel bars, with the body upright and the arms at the sides,
  not a swing on a rope and not a jump.
examples:
- The gymnast held a straight hang on the rings with his arms at his sides.
- She practised the straight hang on the parallel bars until she could hold it still.
