simpleMeaning: strong strangeness that comes from being very different from what is usual
scope: 'Also called freakishness: strong strangeness in how something seems, not a problem in the body
  and not behaviour that breaks rules.'
examples:
- People noticed the abnormality in his voice, which sounded very different from a usual voice.
- The abnormality of the shape made the stone stand out from all the others.
