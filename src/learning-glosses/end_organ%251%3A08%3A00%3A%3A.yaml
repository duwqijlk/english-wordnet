simpleMeaning: A special part at the far tip of some nerve threads that carry movement or feeling
scope: This is a special part at the far tip of some nerve threads that carry movement or feeling, not
  the nerve thread itself and not a part in the middle of the thread.
examples:
- The end organ sits at the far tip of the nerve thread.
- Each end organ lies at the tip of its nerve thread.
