simpleMeaning: A cord or chain, often with small bright stones on it, worn round the neck to look nice,
  most of all by women
scope: Jewellery worn round the neck, not a bracelet worn on the wrist and not a ring worn on a finger.
examples:
- She wore a gold necklace to the party.
- The necklace had small blue stones set in a silver chain.
