simpleMeaning: 'the body''s repeating cycle from a girl''s first period to menopause: the womb lining
  builds up for pregnancy, and is shed as bleeding if pregnancy does not happen.'
scope: This is the whole recurring reproductive cycle from a girl's first period to menopause, not a single
  episode of menstrual bleeding and not ovulation on its own.
examples:
- The average menstrual cycle is 28 days.
- Stress can make a menstrual cycle irregular.
