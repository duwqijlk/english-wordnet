simpleMeaning: The seventh Sunday after Easter, when Christians mark the coming of the Holy Spirit to
  the Apostles; in Scotland it is one of the four days when rents are paid
scope: This is a Christian feast day after Easter; Whitsunday is another name for this sense, and it is
  not the Jewish holy day of the same name.
examples:
- Pentecost falls seven Sundays after Easter.
- On Pentecost the church marks the coming of the Holy Spirit.
