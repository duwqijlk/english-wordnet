simpleMeaning: Marks put on each word by a computer program show what kind of word it is
scope: 'Also called a pos tagger: a program that marks words by kind, not a program that checks spelling
  or grammar.'
examples:
- The part-of-speech tagger tagged every word in the sentence.
- Our part-of-speech tagger marks nouns, verbs, and adjectives.
