simpleMeaning: In British informal speech, used as a strong word to say you feel surprised
scope: This is a British informal strong word for feeling surprised; it is not about a thing that is broken
  or a person who is tired.
examples:
- Well, I'm jiggered — I did not expect to see you here!
- He said he'd be jiggered if the old car still worked.
