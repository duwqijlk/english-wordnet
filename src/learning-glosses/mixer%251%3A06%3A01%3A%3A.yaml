simpleMeaning: a piece of electronic equipment that takes in two or more signals and joins them into one
  signal that goes out
scope: This is a piece of electronic equipment for signals; it is not a kitchen tool for foods, not a
  drink added to alcohol, and not a party.
examples:
- The engineer fed three microphones into the mixer and sent one signal to the speakers.
- He used a mixer to join the voices and the music into one recording.
