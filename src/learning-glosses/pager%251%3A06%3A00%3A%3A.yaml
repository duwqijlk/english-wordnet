simpleMeaning: a small electronic machine that a person carries and that makes a set of short high sounds
  when someone wants to reach them
scope: Also called beeper, this is a small machine that makes short sounds to tell its carrier someone
  wants them, not a phone for talking.
examples:
- The doctor's pager sounded during the night, so she called the hospital at once.
- He carried a pager so the office could reach him at any time.
