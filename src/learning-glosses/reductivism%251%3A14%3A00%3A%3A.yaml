simpleMeaning: A way of making art, in carving and in painting, that began in the 1950s and put the stress
  on making shapes and colours as plain as can be.
scope: 'Also called minimalism or minimal art: a way of making art, in carving and in painting, that began
  in the 1950s and put the stress on making shapes and colours as plain as can be; not the rich and detailed
  art of earlier times.'
examples:
- Reductivism shaped the plain white sculpture in the gallery.
- The painter worked in reductivism, using only flat blocks of colour.
