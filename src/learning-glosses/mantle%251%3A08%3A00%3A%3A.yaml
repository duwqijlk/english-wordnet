simpleMeaning: In zoology, a protective layer of outer skin in shell animals that makes the stuff their
  shell is made of
scope: In zoology, the skin layer in shell animals that makes the shell, not a cloak and not a covering
  cloth.
examples:
- The mantle of the clam makes the shell.
- A snail's mantle forms the hard shell around its soft body.
