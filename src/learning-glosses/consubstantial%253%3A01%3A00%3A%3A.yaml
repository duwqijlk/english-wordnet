simpleMeaning: Describes things held to be the same in what they are made of or what they are, as the
  three persons of the Trinity.
scope: Describes things held to be the same in what they are, not merely alike and not merely joined together.
examples:
- The creed calls Father and Son consubstantial.
- Theologians debated whether the three persons are consubstantial.
