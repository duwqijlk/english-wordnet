simpleMeaning: a person who twists loose thin material, such as wool or cotton, together to make thread
scope: 'Also called spinster: a person who makes thread by twisting loose material together, not a fishing
  tool and not a board game dial.'
examples:
- The spinner worked all day twisting wool into thread.
- In the old mill, each spinner sat at a large wheel.
