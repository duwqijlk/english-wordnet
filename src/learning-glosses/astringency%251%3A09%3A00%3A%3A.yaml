simpleMeaning: A sharp taste that makes the mouth pucker; the taste felt when something makes the mouth
  pucker
scope: A sharp taste that makes the mouth pucker, also called astringence; not a sweet taste and not a
  sour taste.
examples:
- The astringency of the unripe fruit made our mouths pucker.
- Astringency is the sharp taste that draws the mouth tight.
