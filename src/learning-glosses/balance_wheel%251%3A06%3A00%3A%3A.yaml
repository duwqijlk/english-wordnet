simpleMeaning: Above all in a clock or watch, this wheel swings against the fine spring to keep its beat
  and keeps a machine moving at a steady speed
scope: Also called balance, this wheel keeps a machine moving at a steady speed, above all in a clock
  or watch.
examples:
- The balance wheel in the clock had stopped swinging.
- The balance wheel swung against the fine spring of the watch.
