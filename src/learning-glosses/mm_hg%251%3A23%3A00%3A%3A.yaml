simpleMeaning: A measure of pressure, equal to nought point nought nought one three one six times the
  pressure of the air around us, named after Torricelli.
scope: Also called millimeter of mercury and torr, this is a measure of pressure, not a measure of heat.
examples:
- The doctor wrote mm Hg after the blood pressure reading.
- Blood pressure is often given in mm Hg.
