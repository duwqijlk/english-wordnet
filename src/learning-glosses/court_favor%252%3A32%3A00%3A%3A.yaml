simpleMeaning: to try to win someone's good will with too much praise and flattery
scope: To try to win someone's good will with too much praise and flattery; court favour, curry favor
  and curry favour are other names for this sense, not honest praise and not winning good will by hard
  work.
examples:
- He courted favor with the boss by praising every word she said.
- She courted favor by flattering the manager at every chance.
