senseId: 'allegedly%4:02:00::'
synsetId: 00155440-r
simpleMeaning: according to what people say has happened or is true
scope: This word shows that a report or claim says something; it does not mean the thing is proven true,
  and it is not a plain statement of fact.
examples:
- He allegedly stole money from the shop, but the court has not decided the case.
- The singer allegedly left the band after a fight with the manager.
