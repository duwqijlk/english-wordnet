simpleMeaning: Its leaves are leathery and feel soapy, and its wood is very hard; this bush or small tree
  grows in the West Indies
scope: A bush or small tree from the West Indies, also called barbasco; not a fruit tree and not a soft-wooded
  tree.
examples:
- The joewood grew at the edge of the clearing.
- They cut a branch from the joewood for its hard wood.
