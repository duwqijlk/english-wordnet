simpleMeaning: In computing, a place to keep copies of saved work, kept up to date
scope: A store of spare copies of saved work in computing, not the work itself and not a single copy kept
  for reading.
examples:
- The backup file saved the day when the hard drive failed.
- She keeps a backup file on a second drive.
