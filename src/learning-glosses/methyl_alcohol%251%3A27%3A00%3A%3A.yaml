simpleMeaning: a light liquid that evaporates fast, burns easily, and is poisonous; used to stop water
  freezing, to dissolve things, and as a fuel, and to make spirits unfit to drink
scope: A light poisonous liquid that evaporates fast and burns easily, also called methanol, wood alcohol,
  and wood spirit; not the alcohol in drinks and not petrol.
examples:
- Methyl alcohol is poisonous, so it must never be drunk.
- The worker used methyl alcohol to keep the pipes from freezing.
