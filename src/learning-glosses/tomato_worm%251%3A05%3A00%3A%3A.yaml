simpleMeaning: Tobacco and plants like it are the food of this large green young moth, whose body bears
  white lines, much like the horned kind that feeds on the same plants.
scope: This is one of the young moths that feed on tobacco and plants like it, also called tobacco hornworm.
examples:
- A tomato worm was feeding on the tobacco leaves.
- The tomato worm grows big and green on tobacco plants.
