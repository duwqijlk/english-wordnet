simpleMeaning: Animals with no backbone use these body parts to move about or to hold on to things
scope: A body part of an animal with no backbone that is used to move about or hold on, also called foot;
  not a leg of an animal with a backbone and not a hand.
examples:
- The snail's invertebrate foot helps it crawl over the leaf.
- Barnacles grip the rock with their invertebrate foot.
