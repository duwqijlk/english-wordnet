simpleMeaning: A pattern of numbers worked out in theory, with a fixed middle value and a fixed amount
  of spread
scope: A pattern of numbers worked out in theory, with a fixed middle value and a fixed amount of spread;
  not a set of numbers counted in real life and not the curve that draws it.
examples:
- Heights in a large group often follow a normal distribution.
- In a normal distribution, most values sit near the middle.
