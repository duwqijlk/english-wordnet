senseId: 'tantalize%2:32:00::'
synsetId: 00852181-v
simpleMeaning: to keep saying unkind things to a person that find fault with them, again and again
scope: Also called ride, rag, tease, rally, cod, bait, taunt, twit, razz and tantalise. It means picking
  on a person again and again with unkind words, not holding out a wanted thing and then taking it away.
examples:
- The older boys tantalized the new boy about his shoes all week.
- Stop tantalizing her about her mistake; she has heard enough.
