simpleMeaning: a straight line or flat surface that touches a curved line or surface at one point but
  does not cross it at that point
scope: 'In maths, a line or flat surface that touches a curve at one point, not the other maths sense:
  a number worked out from the sides of a triangle with a right angle.'
examples:
- Draw a tangent that touches the circle at just one point.
- The tangent to the curve met it at a single point and did not cross it.
