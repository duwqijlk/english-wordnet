simpleMeaning: A big freshwater shellfish, a foot or more in size, that people eat, common in rivers in
  Australia
scope: A big freshwater shellfish, a foot or more in size, that people eat, common in rivers in Australia,
  not a small freshwater shellfish and not a saltwater shellfish.
examples:
- Long-clawed prawns are caught in Australian rivers.
- We ate long-clawed prawn for dinner.
