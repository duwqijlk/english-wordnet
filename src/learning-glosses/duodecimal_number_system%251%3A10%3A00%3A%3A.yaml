simpleMeaning: a way of counting where a digit's place sets its worth, using twelve as its base, with
  digits for twelve values
scope: A way of counting with twelve as its base, also called the duodecimal system; not the ten-based
  way of counting and not a way of writing numbers in words.
examples:
- In the duodecimal number system, twelve is the base.
- The duodecimal number system uses twelve digits.
