simpleMeaning: a person or business that sells meat in large amounts to shops
scope: This is a person or business in the meat trade who sells meat in large amounts to shops. It is
  not a worker who puts things into boxes or bags, and not a hiker who carries a bag on their back.
examples:
- The meat packer sold large sides of beef to shops across the city.
- As a packer, he sold meat in large amounts to local shops, not to single buyers.
