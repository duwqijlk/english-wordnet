simpleMeaning: A main nerve-set part, bearing sense-move nerve beats to and from the brain, a long tube
  from the brain's foot down the spine to the low back's top.
scope: This sense is also called medulla spinalis.
examples:
- The spinal cord bears nerve beats to the brain.
- A spinal cord runs down the spine.
