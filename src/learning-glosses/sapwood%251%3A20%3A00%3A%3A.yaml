simpleMeaning: Between the thin layer that makes new growth and the hard middle part, the fresh outer
  part of a tree trunk, most often pale, carries water up the tree.
scope: The name is for the fresh outer part of a tree trunk, most often pale, that carries water up the
  tree, not the hard middle part itself.
examples:
- They cut away the sapwood to reach the hard middle part.
- Pale sapwood carries water up the tree.
