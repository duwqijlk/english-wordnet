simpleMeaning: a plant that bears large mild thick-walled fruits, usually shaped like a bell; the main
  ones used in salads
scope: Also called paprika, pimiento, pimento, a bell pepper, and a sweet pepper plant; this is the plant,
  not the hot pepper and not the fruit itself.
examples:
- Sweet peppers grow large and mild in our garden.
- The sweet pepper in the back bed bore thick-walled bell-shaped fruit.
