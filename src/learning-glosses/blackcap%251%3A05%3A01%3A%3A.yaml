simpleMeaning: a small songbird with brown-grey feathers and a dark patch on the top of its head
scope: A small songbird with brown-grey feathers and a dark patch on the top of its head, not the fruit
  bush of the same name and not another small songbird without the dark patch.
examples:
- A blackcap sang from the top of the hedge in the morning.
- We watched a blackcap build its nest in the thick bush.
