simpleMeaning: When a person or thing shows the most important parts of something in itself, it is a clear
  case of what that something is like
scope: 'Also called epitomize and typify: a person or thing that shows the most important parts of something
  in itself, not one that lists every small part of it and not one unlike it.'
examples:
- Her quiet courage epitomises the spirit of the whole team.
- This small house epitomises the plain style of the village.
