simpleMeaning: A very prickly woody vine from the eastern US in tangles, with tough round stems, shiny
  leathery leaves, small greenish flowers, and clusters of shiny black berries you cannot eat.
scope: Not a rose or a bramble bush; also called a briar, a brier, a bullbrier, a catbrier, a greenbrier,
  a horse-brier, and a horse brier.
examples:
- The Smilax rotundifolia climbed over the fence in a thick tangle.
- We cut back the Smilax rotundifolia because its thorns tore our clothes.
