simpleMeaning: The chemical processes inside cells and tissues by which living things release energy from
  organic molecules and give off carbon dioxide, which the blood carries to the lungs.
scope: This is the cell-level energy process, not breathing in and out, either one breath or the whole
  inhale-exhale cycle; cellular respiration and internal respiration are other names for this sense.
examples:
- Respiration in the mitochondria releases energy from glucose.
- Every living cell carries out respiration to stay alive.
