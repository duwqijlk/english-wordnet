simpleMeaning: In Judaism, the Jews' day count, from 3761 BC, the assumed date of the world's creation;
  a 354-day moon year is fitted to the sun year by periodic leap years.
scope: 'Also called the Hebrew calendar: the count of days used by Jews, starting from 3761 BC, with a
  354-day moon year fitted to the sun year by leap years.'
examples:
- The Jewish calendar sets the date of Passover each spring.
- Rosh Hashanah falls on the first day of the Jewish calendar year.
