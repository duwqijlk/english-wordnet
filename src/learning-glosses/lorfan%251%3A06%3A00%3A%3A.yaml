simpleMeaning: A drug kin to morphine that stops the slow breathing caused by too much morphine but leaves
  its pain-killing work alone.
scope: 'Also called levallorphan: a morphine-kin drug that fights morphine poisoning of the breath without
  blocking pain relief, not morphine itself and not a general painkiller.'
examples:
- The doctor gave Lorfan to fight the slow breathing from the morphine.
- Lorfan left the pain relief in place while the breathing came back.
