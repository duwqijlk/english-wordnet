simpleMeaning: A pot for burning charcoal, with a grill on top for cooking, that can be carried about.
scope: A charcoal burner with a grill, for cooking; not the act of cooking over such a grill, which is
  another sense of the word.
examples:
- They lit the hibachi on the porch and grilled fish on it.
- She carried the hibachi out to the yard for the evening meal.
