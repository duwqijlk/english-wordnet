simpleMeaning: the state of food or oil that has gone bad, with a stale bad smell or taste like old cooking
  oil
scope: The bad smell and taste of food or oil that has gone bad, not fresh oil and not a bad smell from
  dirt.
examples:
- The rancidity of the old oil made the kitchen smell bad.
- She threw out the nuts because of their rancidity.
