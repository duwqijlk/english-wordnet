simpleMeaning: The head servant in charge of a great house and all its staff.
scope: This is the head servant in charge of a great house; not the owner of the house, and not an ordinary
  servant.
examples:
- The seneschal welcomed the guests and showed them to their rooms.
- In the old castle, the seneschal kept the keys and ran the household.
