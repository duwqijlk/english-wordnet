simpleMeaning: A large artery branching from the brachial artery to supply the muscles of the forearm,
  wrist and hand
scope: Also called arteria ulnaris, this large blood tube branches off the main tube of the upper arm
  to feed the muscles of the forearm, wrist, and hand.
examples:
- The ulnar artery runs down the forearm.
- Blood reached the hand through the ulnar artery.
