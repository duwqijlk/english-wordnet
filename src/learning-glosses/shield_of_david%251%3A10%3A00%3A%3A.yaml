simpleMeaning: A six-pointed star made of two equal-sided triangles, a sign of the Jewish faith.
scope: A star with six points, formed from two equal-sided triangles and used as an emblem of Judaism;
  Magen David, Mogen David, Solomon's seal and Star of David are other names for this sense.
examples:
- A Shield of David hangs above the door of the synagogue.
- Children drew a Shield of David with six points.
