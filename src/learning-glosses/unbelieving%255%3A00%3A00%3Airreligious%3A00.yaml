simpleMeaning: not believing that any god or gods are real
scope: 'Also called atheistic: not believing that any god or gods are real. Not just questioning the beliefs
  of a religion, and not the sense that only things you can see and touch can be known.'
examples:
- She is unbelieving and says no god exists.
- His unbelieving parents did not pray, because they thought no god was real.
