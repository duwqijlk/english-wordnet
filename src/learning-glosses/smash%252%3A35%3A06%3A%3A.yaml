simpleMeaning: In tennis, to hit the ball hard from above your head
scope: In tennis, a hard hit from above the head; not a car crash, not hitting something in a crash, and
  not destroying a bad group.
examples:
- When the ball came high, she smashed it over the net.
- He jumped up and smashed the ball down to the other side of the court.
