simpleMeaning: A tool that measures how dense a thing is, or its weight compared with water
scope: A tool that measures how dense a thing is, also called densimeter; not a scale that only weighs
  things and not a meter for light density.
examples:
- The densitometer showed the liquid was denser than water.
- She used a densitometer to check the acid.
