simpleMeaning: The way things come at no set time, now and then, and only by chance.
scope: Things coming at no set time, now and then, only by chance; not a casual manner.
examples:
- The casualness of her visits made them hard to plan around.
- There was a casualness about the way work came in, now busy, now slack.
