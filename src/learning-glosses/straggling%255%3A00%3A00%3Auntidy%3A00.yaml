simpleMeaning: spreading out in different directions, or spread unevenly and not in a neat order
scope: 'Also called sprawling, rambling, and straggly: this describes things that spread out in different
  directions, or are spread unevenly and not in a neat order, not people who fall behind a group.'
examples:
- The straggling branches of the bush reached across the path.
- Her straggling hair fell loosely over her shoulders.
