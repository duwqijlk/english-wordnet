simpleMeaning: A low evergreen plant of the western United States that lies flat on the ground.
scope: Also called purple heather and Phyllodoce breweri; this is a low, flat-growing evergreen herb from
  the west of the United States, not a tall shrub and not other heathers.
examples:
- Brewer's mountain heather grows on the rocky slopes.
- We found Brewer's mountain heather in the mountains.
