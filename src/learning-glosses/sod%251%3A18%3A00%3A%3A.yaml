simpleMeaning: a person who has sex through the anus, most of all a man who has it with another man
scope: An insulting word for a person who has sex through the anus, most of all a man with another man,
  also called bugger; not the top layer of grass-covered ground.
examples:
- The old law sent a sod to prison.
- He was called a sod by the other boys.
