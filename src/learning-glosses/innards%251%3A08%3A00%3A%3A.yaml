simpleMeaning: the parts inside the body that do its work, taken as a whole, especially the parts in the
  belly
scope: Also called insides, entrails and viscera. These are the working parts inside the body, especially
  the parts in the belly, not the skin, the bones and other parts of the body that do different work.
examples:
- The surgeon looked at the patient's innards during the operation.
- When the fish was cut open, its innards spilled out.
