simpleMeaning: to protect a person or thing under a paid agreement that pays money if it is lost, harmed,
  or damaged
scope: To protect a person or thing under such a paid agreement, not to buy such an agreement for a person
  or thing.
examples:
- The company insures drivers against loss from road accidents.
- This plan insures you if your car is stolen.
