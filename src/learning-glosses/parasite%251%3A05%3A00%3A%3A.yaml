simpleMeaning: an animal or plant that lives on or in another animal or plant and feeds on it, without
  helping it or killing it
scope: An animal or plant that lives on a host and feeds on it without helping or killing it; not a germ
  that causes illness, and not a person who lives off others.
examples:
- The parasite lives in the fish and feeds on its blood.
- Ticks are parasites that live on the skin of animals.
