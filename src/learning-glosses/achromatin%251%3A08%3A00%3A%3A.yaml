simpleMeaning: The part of the centre of a cell that takes up little colour from dyes used to stain it.
scope: Not the part that stains dark and not the wall of the cell.
examples:
- The achromatin stayed pale while the rest of the nucleus turned dark.
- Under the dye, the achromatin took up almost no colour.
