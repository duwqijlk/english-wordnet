simpleMeaning: Worn round the waist, this small pouch hooks onto a strap, most often with a fastener that
  pulls shut.
scope: Also called a waist pack, this small pouch hooks onto a strap and is worn round the waist, most
  often with a fastener that pulls shut.
examples:
- Keys were kept in a belt bag at the waist.
- The belt bag hung from a strap round the waist.
