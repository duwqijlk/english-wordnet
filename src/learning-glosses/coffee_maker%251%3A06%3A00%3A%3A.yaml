simpleMeaning: a machine for the kitchen that heats water and lets it run through ground beans to give
  a hot drink by itself
scope: This is a kitchen machine that brews a hot drink by itself; not a coffee grinder, which only crushes
  the beans, and not a kettle for boiling water.
examples:
- She set the timer on the coffee maker so the drink would be ready when she woke up.
- The coffee maker gurgled as hot water ran through the ground beans.
