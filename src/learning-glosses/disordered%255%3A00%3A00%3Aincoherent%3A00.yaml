senseId: disordered%5:00:00:incoherent:00
synsetId: 00467212-s
simpleMeaning: not following in a clear order, with parts that do not join up well
scope: 'Also called confused, scattered, disconnected, illogical, disjointed, garbled, and unconnected:
  this describes thoughts, words, or stories whose parts do not follow in a clear order, not things in
  a room with no order.'
examples:
- His disordered thoughts made it hard to tell the story clearly.
- She gave a disordered account, with the middle part told before the start.
