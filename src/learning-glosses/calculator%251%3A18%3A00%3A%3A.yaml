simpleMeaning: a person who is very good at working out sums, or at using machines that do sums
scope: Also called computer. This sense is a person who is very good at sums, not the small machine used
  for sums.
examples:
- Known as a fast calculator, she could add long lists of numbers in her head.
- The bank hired him as a calculator because he never made a mistake with numbers.
