simpleMeaning: A spread sample of matter from the gut, taken from the first part of the small gut after
  the stomach
scope: A test sample from the first part of the small gut, also called paraduodenal smear; not a blood
  test and not a sample from the stomach itself.
examples:
- The doctor ordered a duodenal smear to look for signs of illness.
- A duodenal smear is spread on a slide and studied under a microscope.
