simpleMeaning: a plant with long thin pointed leaves that make new roots at their tips
scope: 'Also called walking leaf: a plant with long thin pointed leaves that root at their tips, not a
  tree and not a plant that spreads only by seed.'
examples:
- The walking fern spreads when its long leaves bend down and root at the tips.
- We found a walking fern growing on the damp rock.
