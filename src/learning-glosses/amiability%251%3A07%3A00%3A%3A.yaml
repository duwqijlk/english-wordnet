simpleMeaning: A bent to be warm and easy to talk to.
scope: This sense is also called affability, bonhomie, and geniality, for a bent to be warm and easy to
  talk to, unlike the sense for a cheerful and agreeable mood.
examples:
- Her amiability made her easy to talk to.
- Amiability marked his warm manner.
