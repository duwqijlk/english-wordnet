simpleMeaning: become less strong or stop suddenly and without warning
scope: This is a fever or a spell of weather becoming weaker or ending, not a person damaging an object
  or disobeying a rule.
examples:
- The patient's fever broke during the night.
- The heat wave broke when the storms finally arrived.
