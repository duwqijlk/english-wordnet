simpleMeaning: lived in by people who moved from another country to settle there
scope: Lived in by people who settled there from another country; not empty land, and not land lived in
  only by the people who were there first.
examples:
- The colonized island had new towns built by people from a far country.
- They lived in a colonized area where newcomers from Europe ran the farms.
