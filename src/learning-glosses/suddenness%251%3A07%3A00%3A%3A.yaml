simpleMeaning: the quality of happening very fast or with no warning
scope: 'Also called abruptness: the way a thing happens very fast or with no warning, not the thing that
  happens and not a slow change that people expect.'
examples:
- The suddenness of the rain surprised everyone in the park.
- She was shocked by the suddenness of his answer.
