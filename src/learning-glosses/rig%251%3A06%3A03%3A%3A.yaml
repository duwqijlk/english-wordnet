simpleMeaning: a wheeled cart that a horse — or a team of horses — pulls along
scope: 'Also called carriage: a horse-drawn cart, not a truck and not the gear for a job.'
examples:
- The old rig waited outside the inn, its horses stamping in the cold.
- They hired a rig to carry them to the next town.
