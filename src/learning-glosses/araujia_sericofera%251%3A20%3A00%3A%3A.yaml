simpleMeaning: A strong twining bush with bunches of sweet-smelling white or pink flowers whose flat wide
  end petals catch night moths and hold them until dawn.
scope: Also called cruel plant; a strong twining bush with sweet-smelling flowers that catch night moths,
  not a soft garden flower and not a plant that eats insects by day.
examples:
- Araujia sericofera climbs over the fence in the warm garden.
- The white flowers of Araujia sericofera trap moths at night.
