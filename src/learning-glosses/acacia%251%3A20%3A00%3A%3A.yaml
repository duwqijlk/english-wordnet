simpleMeaning: any of several kinds of tree or bush that have sharp points growing on them
scope: This names a tree or bush of one of several kinds that have sharp points. It is not a tree or bush
  of a kind with no sharp points.
examples:
- An acacia grew beside the road, with sharp points on its branches.
- They sat in the shade of a tall acacia tree.
