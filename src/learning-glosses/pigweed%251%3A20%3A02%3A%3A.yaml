simpleMeaning: A plant whose leaves are sometimes cooked as greens and whose seeds serve as grain, from
  the southern United States to Central America and in India and China.
scope: A plant whose leaves are sometimes cooked as greens and whose seeds serve as grain; not the common
  weedy European plant of the same name, brought into North America and often used as a potherb.
examples:
- Pigweed grew along the field edge, its leaves picked for greens.
- They ground pigweed seeds for grain in the dry season.
