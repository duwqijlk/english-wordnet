simpleMeaning: to make a ship or other thing steady by adding heavy material to it
scope: To make something steady with heavy material, not the noun for heavy stones laid under a road or
  track and not the noun for a part in an electric light or circuit.
examples:
- They ballasted the ship with heavy stones.
- Workers ballast the small boat to keep it steady in rough water.
