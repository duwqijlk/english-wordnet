simpleMeaning: A branch of the national government of the United States.
scope: A branch of the national government of the United States; federal office and department of the
  federal government are other names for this sense, not a state government branch and not a local office.
examples:
- The federal department issued new rules this week.
- She works for a federal department in Washington.
