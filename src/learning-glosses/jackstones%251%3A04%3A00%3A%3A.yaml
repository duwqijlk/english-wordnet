simpleMeaning: In this game, a small rubber ball bounces while small pieces are tossed up and caught in
  different groups
scope: A game played by tossing and catching small pieces in groups between bounces of a ball, also called
  jacks or knucklebones; not the small pieces used to play it and not any other ball game.
examples:
- The children played jackstones on the porch all afternoon.
- She was good at jackstones and never dropped the ball.
