senseId: 'decalescence%1:19:00::'
synsetId: 11464467-n
simpleMeaning: Because the tiny crystal shapes inside a piece of metal change, the metal suddenly warms
  up more slowly while it is being heated.
scope: Heated metal suddenly warms up more slowly because of a change inside the metal itself, not because
  the heat is turned down.
examples:
- Decalescence shows as a sudden slowing in how fast the metal warms up.
- The decalescence happened because the crystal shapes inside the metal changed.
