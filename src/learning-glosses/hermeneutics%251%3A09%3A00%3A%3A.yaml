simpleMeaning: The branch of theology that deals with the rules for reading and explaining holy books.
scope: The branch of theology for the rules of reading holy books; not the study of church history, and
  not the reading of books outside religion.
examples:
- He studied hermeneutics to learn how to read old holy texts.
- Hermeneutics gives rules for explaining what the holy books mean.
