simpleMeaning: A self-report test of a person's traits, drawn from the MMPI, with several hundred yes-no
  questions, giving scores on scales such as dominance, self acceptance, self control, socialization,
  and achievement.
scope: 'Also called CPI: a self-report test, not a medical test, and not the price index of the same letters.'
examples:
- The California Personality Inventory has several hundred yes-no questions.
