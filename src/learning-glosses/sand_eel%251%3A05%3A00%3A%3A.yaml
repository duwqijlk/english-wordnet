simpleMeaning: Long and thin, these very small silver fish swim in schools and dig into shores of soft
  earth.
scope: These very small silver fish are also called a launce, a sand lance, or a sand launce; they swim
  in schools and dig into shores of soft earth.
examples:
- The sand eels burrowed into the sand.
- They watched sand eels swim in schools near the shore.
