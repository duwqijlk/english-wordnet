simpleMeaning: A body of the United Nations that puts money straight into firms and backs loans to private
  backers, joined with the World Bank.
scope: 'Also called the International Finance Corporation: a body of the United Nations that puts money
  straight into firms and backs loans to private backers, not a bank that lends to governments and not
  a charity.'
examples:
- The IFC backed the loan to the factory.
- IFC money helped the small firm grow.
