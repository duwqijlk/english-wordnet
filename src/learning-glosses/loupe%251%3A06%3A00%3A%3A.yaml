simpleMeaning: A small glass that makes things look bigger, usually set in a frame held to the eye, used
  by people who make or mend watches and jewels.
scope: A small magnifying glass, usually in an eyepiece, used by watchmakers and jewellers, not a hand-held
  reading glass.
examples:
- The jeweller held a loupe to his eye to check the stone.
- Through the loupe, the tiny marks on the watch were clear.
