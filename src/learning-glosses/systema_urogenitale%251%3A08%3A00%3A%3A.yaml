simpleMeaning: the set of body parts used for making babies and for making and passing urine
scope: This is the set of body parts for making babies and for making and passing urine, also called apparatus
  urogenitalis, genitourinary apparatus, genitourinary system, urinary apparatus, urinary system, urogenital
  apparatus and urogenital system, and not the parts used only for food or breathing.
examples:
- The doctor explained how the systema urogenitale joins the parts for making babies and the parts for
  passing urine.
- Disease of the systema urogenitale can affect both birth and passing urine.
