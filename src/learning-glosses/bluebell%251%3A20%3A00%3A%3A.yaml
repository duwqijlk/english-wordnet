simpleMeaning: A showy wildflower of damp prairie and field, with large upright bell-shaped flowers in
  a blue shade, native from eastern Colorado and Nebraska south to New Mexico and Texas.
scope: The prairie wildflower also called prairie gentian or tulip gentian, not the slender-stemmed woodland
  plant or the spring garden bulb with the same name.
examples:
- Bluebells bloomed across the damp Texas field in late summer.
- She photographed a bluebell with large upright blue flowers near the creek.
