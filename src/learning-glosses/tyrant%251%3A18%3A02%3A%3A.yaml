simpleMeaning: in old Greece, a person who held power after taking it, with no law to back their claim
  to rule
scope: In ancient Greece, a ruler who took power with no legal right to it, not a cruel dictator of any
  time or place.
examples:
- The tyrant of Athens was driven out by the people.
- In old Greece, a tyrant could rise to power without any legal right.
