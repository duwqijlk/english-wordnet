simpleMeaning: In computer science, the smallest separate part of a picture on a screen, often a coloured
  dot
scope: In computer science, the smallest part of a screen picture; not a whole picture, and not a dot
  of paint.
examples:
- The greater the number of pixels, the sharper the picture.
- A dead pixel showed as a black spot.
