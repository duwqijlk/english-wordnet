simpleMeaning: a bar or pub not owned or run by a beer maker, so it can sell beer and ale from many makers
scope: A pub not tied to one beer maker, not a bar owned by a brewery and not a private club.
examples:
- The free house on the corner sells beer from a dozen small breweries.
- They chose a free house so they could try ales from different makers.
