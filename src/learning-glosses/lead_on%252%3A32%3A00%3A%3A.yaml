simpleMeaning: To get a person to do a thing, most of all when it is not wise or is a mistake
scope: To talk a person into doing a thing, most of all a foolish one, not to show them the way and not
  to make them do it.
examples:
- He tried to lead her on with talk of easy money.
- Do not let him lead you on into a bad deal.
