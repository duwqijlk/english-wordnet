senseId: 'centre%1:18:09::'
synsetId: 09923774-n
simpleMeaning: In football, the player who lines up in the middle of the line and starts each play by
  passing the ball backward to the quarterback.
scope: This is the player himself, not the role he fills, and not a cluster of nerve cells, not a group
  of politically moderate people, not the key part of an idea. It is also not the adjective sense of holding
  neither left-wing nor right-wing views, an area near the middle of a region, the exact middle point
  of a line, a place where an activity is concentrated, the filling inside a chocolate, the thing attention
  is fixed on, a building for an activity, the basketball or hockey role, the middle of a military formation,
  a basketball or hockey player, the outfield ground ahead of the catcher, a shopping complex, the adjective
  meaning equally far from both ends, or any verb sense about moving to the middle, focusing attention,
  or having something as the main subject.
examples:
- Their centre sent the ball back before the defense could react.
- The centre limped off in the third quarter with an ankle injury.
