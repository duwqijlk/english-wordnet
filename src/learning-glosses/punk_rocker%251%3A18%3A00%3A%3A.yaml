simpleMeaning: A young person who plays or loves loud fast guitar music and belongs to its youth group.
scope: A young person in the punk youth group, also called punk; not an older fan of the music and not
  a player of other loud music.
examples:
- The punk rocker played loud fast music at the small club.
- She became a punk rocker when she joined the youth group.
