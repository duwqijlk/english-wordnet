simpleMeaning: The ridge in front of the deep fold and the ridge behind it form part of the outer layer
  of the brain, handling both feeling and moving.
scope: 'Also called sensorimotor region: a part of the brain''s outer layer that handles both feeling
  and moving, not the strip that handles feeling alone.'
examples:
- The sensorimotor area joins feeling and moving in the brain.
- Feeling and moving meet in the sensorimotor area.
