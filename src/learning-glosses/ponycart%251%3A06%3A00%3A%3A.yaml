simpleMeaning: With its axle set low, this small open vehicle has two places to sit
scope: 'Another name for pony cart and donkey cart: a small open vehicle with an axle set low and two
  places to sit, not a wagon for carrying goods and not a carriage with a roof.'
examples:
- The children rode to the fair in a ponycart.
- He hitched the horse to the ponycart.
