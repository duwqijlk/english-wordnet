simpleMeaning: a bright, showy American butterfly that looks like the monarch butterfly but is smaller
scope: A bright American butterfly that looks like the monarch but is smaller, not the monarch itself
  and not a ruler who stands in for a king.
examples:
- A viceroy rested on the milkweed beside the path.
- The viceroy looks so much like a monarch that most people cannot tell them apart.
