senseId: 'sonic_boom%1:11:00::'
synsetId: 07362641-n
simpleMeaning: A loud bang made by the shock wave of a plane flying faster than sound
scope: A loud bang made by the shock wave of a plane flying faster than sound; not a clap of thunder,
  and not the roar of a jet engine on the ground.
examples:
- A sonic boom follows an aircraft as a wake follows a ship.
- The sonic boom rattled windows across the town.
