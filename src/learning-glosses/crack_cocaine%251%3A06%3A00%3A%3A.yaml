simpleMeaning: A strong, cleaned form of the drug that is smoked, not breathed in through the nose, and
  is very hard to stop using.
scope: This is a strong smoked form of a drug, not the powder form or a medicine; also called crack and
  tornado.
examples:
- He was caught selling crack cocaine near the school.
- Crack cocaine is smoked, not snorted.
