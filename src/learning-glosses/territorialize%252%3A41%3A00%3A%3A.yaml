senseId: 'territorialize%2:41:00::'
synsetId: 02437822-v
simpleMeaning: to arrange a place so that it becomes a land with its own rules and borders
scope: To arrange a place so that it becomes a land with its own rules and borders, also called territorialise;
  not to make a land larger by adding land, and not to place a thing on a land basis.
examples:
- Congress voted to territorialize the new land.
- The plan would territorialize the region and give it a governor.
