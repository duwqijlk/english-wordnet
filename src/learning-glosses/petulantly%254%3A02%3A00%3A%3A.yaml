simpleMeaning: in a bad-tempered, childish way that shows you are annoyed
scope: This sense is about speaking or acting in a childish, annoyed way. It is not speaking in a calm
  way, and it is not strong adult anger.
examples:
- '"I do not want to go," he said petulantly.'
- She folded her arms and petulantly refused to share the toy.
