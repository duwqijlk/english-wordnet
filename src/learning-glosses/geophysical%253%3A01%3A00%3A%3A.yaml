simpleMeaning: Of or to do with the study of the earth's rocks, seas, and air by the rules of physics
scope: Of or to do with the study of the earth by the rules of physics; not a study of living things and
  not a study of the stars.
examples:
- She worked on geophysical sciences all her life.
- Geophysical data showed a fault under the town.
