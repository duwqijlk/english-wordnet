simpleMeaning: Fine words with nothing behind them — talk that is empty, not honest, or blown up beyond
  the truth.
scope: 'Also called wind, jazz, or nothingness, and also malarky: empty talk that is not meant honestly
  or is blown up beyond the truth, not honest speech.'
examples:
- Don't give me any of that malarkey.
- His speech was pure malarkey from start to finish.
