simpleMeaning: Any shrub or small tree bearing leaves in rings and flowers in branching clusters; its
  medicines are used especially to cause vomiting, loosen the bowels or lower blood pressure.
scope: Another name for rauvolfia, the same shrub or small tree; the plant itself, not the medicines obtained
  from it.
examples:
- Rauwolfia bears its leaves in rings and its flowers in branching clusters.
- Medicines made from rauwolfia have been used to loosen the bowels and lower blood pressure.
