simpleMeaning: A fever can be kept from starting, or made less bad, by a medicine that brings the body's
  heat down
scope: 'Also called an antipyretic: a medicine that brings body heat down, not a drug that kills germs
  and not a painkiller.'
examples:
- The nurse gave her a febrifuge to bring her temperature down.
- He took a febrifuge when the fever would not break.
