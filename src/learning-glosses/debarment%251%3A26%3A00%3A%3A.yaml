simpleMeaning: The state of being kept out of certain things, rights or ways of doing things that one
  would otherwise have.
scope: The state of being kept out of certain rights or practices; not a fine and not a prison sentence.
examples:
- Debarment kept him out of the profession.
- The debarment lasted for five years.
