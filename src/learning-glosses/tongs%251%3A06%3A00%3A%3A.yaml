simpleMeaning: most often with two legs joined by a hinge, handles at the top and sharp hooks at the foot,
  a tool for picking things up
scope: A tool for picking things up with two hinged legs, not a pair of scissors and not a fork.
examples:
- She lifted the ice with tongs.
- The tongs had two long legs and hooks that gripped the coal.
