senseId: 'rationalise%2:32:00::'
synsetId: 00896259-v
simpleMeaning: To stand up for a deed or act with reasons, or clear it of blame.
scope: This sense is also called excuse, apologize, apologise, and rationalize, for standing up for a
  deed or act with reasons, or clearing it of blame, where excuse is to use reasons to defend a person
  or act, to explain it, or to make it seem less wrong, and apologize is to give reasons that try to clear
  a person or act of blame, unlike the sense for framing and running by sound or craft rules, to reach
  wished ends, unlike the sense for cutting out the unneeded or unwanted, and unlike the sense for thinking
  by sound sense, or using wit and reason.
examples:
- They rationalise the act, standing up for it with reasons.
- They rationalise the deed, clearing it of blame.
