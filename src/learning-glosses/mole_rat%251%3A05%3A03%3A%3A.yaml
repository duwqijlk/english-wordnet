simpleMeaning: From eastern Europe and the Middle East, a furry gnawing animal with short legs and no
  tail has the habits and looks of a true burrower.
scope: It is the furry gnawing animal of eastern Europe and the Middle East, with the habits and looks
  of a true burrower, not the Indian kind with a scaly tail and not the African kind.
examples:
- The mole rat lives in eastern Europe.
- A mole rat looks like a true burrower.
