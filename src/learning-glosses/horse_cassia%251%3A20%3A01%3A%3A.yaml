simpleMeaning: a tree of warm parts of America that keeps some of its leaves through the year, with upright
  bunches of pink or rose flowers, grown for show
scope: 'Also called pink shower and pink shower tree: a warm-climate American tree grown for show, not
  the East Indian tree with long pods used as horse medicine.'
examples:
- The horse cassia in the park was full of upright bunches of pink flowers.
- Gardeners plant horse cassia for show in warm parts of America.
