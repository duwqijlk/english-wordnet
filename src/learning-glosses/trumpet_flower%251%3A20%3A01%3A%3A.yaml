simpleMeaning: a woody vine with flowers, from the southern United States, whose stems show a cross when
  cut across
scope: A woody vine with flowers from the southern United States, whose cut stems show a cross; cross
  vine, quarter-vine and quartervine are other names for this sense, not a honeysuckle vine with red flowers.
examples:
- The trumpet flower climbed along the fence in our garden.
- When I cut a stem of the trumpet flower across, I could see a cross inside.
