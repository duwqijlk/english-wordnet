simpleMeaning: A woman from Mexico who heals sick people with old ways of healing passed down from the
  Maya people
scope: This is a Mexican woman who heals with old Maya ways, not a trained doctor and not the male healer
  called a curandero.
examples:
- The curandera treated the child's fever with herbs.
- Villagers went to the curandera for help.
