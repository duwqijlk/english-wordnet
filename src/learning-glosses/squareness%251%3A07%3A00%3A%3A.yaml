simpleMeaning: The fact of having four straight sides of the same length and corners that meet at right
  angles
scope: The fact of having four straight sides of the same length and corners that meet at right angles,
  not roundness, not a rectangle and not a diamond shape.
examples:
- The squareness of the box made it easy to stack.
- He admired the squareness of the cut stone.
