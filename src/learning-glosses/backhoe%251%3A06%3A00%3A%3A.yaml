simpleMeaning: To shift earth, the scoop of this digging machine is pulled in toward it on a jointed arm.
scope: A digging machine with a scoop on a jointed arm that pulls earth toward it, not a machine that
  scoops earth up in front of itself.
examples:
- The backhoe dug the trench and pulled the earth toward itself.
- Workers used a backhoe to move the earth.
