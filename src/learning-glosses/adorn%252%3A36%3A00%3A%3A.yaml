simpleMeaning: To make a thing look better by putting pretty things or colour on it
scope: To make a thing look better by adding pretty things or colour, also called grace, decorate, and
  ornament, not giving power to a king or emperor.
examples:
- She adorned the table with flowers for the feast.
- They adorned the hall with bright banners.
