simpleMeaning: A second or later meeting with the same bit of germ sets the body making its guards against
  it again, fast.
scope: This is the quick making of guards against a bit of germ again, on a second or later meeting with
  that same bit, also called anamnestic response.
examples:
- After the second meeting with the same germ, an anamnestic reaction made new guards fast.
- When the same bit of germ came back a second time, an anamnestic reaction set in.
