simpleMeaning: In physics and chemistry, having an atomic weight that is no greater than average.
scope: This is the scientific sense about atomic weight, not little physical weight or density, not a
  pale colour, not light military equipment, not a small amount or low intensity, not something that shines,
  not a cheerful mood, not an unstressed syllable, and not casual sexual conduct.
examples:
- Ordinary water is called light water to distinguish it from heavy water.
- Chemists call hydrogen the lightest element because it has the lowest atomic weight.
