scope: This man-made lens put in the eye has a hinge that lets it focus both near and far, like the natural
  lens of a young person; accommodating lens implant is another name for it.
examples:
- An accommodating IOL lets her see near and far.
- The surgeon fitted an accommodating IOL in his eye.
