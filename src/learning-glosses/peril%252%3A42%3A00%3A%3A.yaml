simpleMeaning: to put a person or thing in danger of harm
scope: 'Also called threaten, menace, endanger, or jeopardize: to put a person or thing in danger of harm,
  not the noun for a bold act and not the noun for a source of danger.'
examples:
- The drought perils the wheat in the fields.
- Rising water perils the houses by the river.
