simpleMeaning: Before it grows into a fetus in higher animals, or hatches as a larva in lower ones, this
  young animal is starting to grow, its cells taking on different jobs
scope: Also called an embryo and a conceptus, this is a young animal in its early days of growth, not
  an unfertilized egg and not a newborn animal.
examples:
- The fertilized egg began to divide within a day.
- In higher animals a fertilized egg grows into a fetus.
