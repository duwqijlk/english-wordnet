simpleMeaning: The Turkish line of rulers who held the Turkish empire from the thirteenth century until
  it ended after the First World War.
scope: Also called Ottoman; this was the line of Turkish rulers that held power from the thirteenth century
  until the empire came to an end after the First World War.
examples:
- The Ottoman dynasty ruled for more than six hundred years.
- The Ottoman dynasty ended after World War I.
