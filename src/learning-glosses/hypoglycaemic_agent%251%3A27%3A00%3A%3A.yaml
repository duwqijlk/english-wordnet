simpleMeaning: Any of several medicines that lower the amount of sugar in the blood and are used to treat
  diabetes.
scope: Any of several medicines that lower blood sugar and treat diabetes; hypoglycemic agent is another
  name for it, not a medicine that raises blood sugar.
examples:
- The doctor gave him a hypoglycaemic agent to bring his blood sugar down.
- A hypoglycaemic agent helps the body use sugar better.
