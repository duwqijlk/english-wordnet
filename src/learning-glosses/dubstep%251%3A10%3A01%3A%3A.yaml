simpleMeaning: A genre of electronic music that grew out of 2-step garage, with a dark mood, sparse half-step
  and two-step rhythms, averaging 140 beats per minute and an emphasis on sub-bass.
scope: A sparse, bass-heavy style of electronic dance music that grew out of 2-step garage, usually near
  140 beats per minute. It is not house or drum and bass, the club styles it is often played alongside.
  The name dates from the early 2000s in London.
examples:
- The club shook with dubstep until the small hours.
- He built a dubstep track around a deep, wobbling bass line.
