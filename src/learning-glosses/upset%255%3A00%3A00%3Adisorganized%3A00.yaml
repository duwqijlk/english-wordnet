simpleMeaning: put into a state with no order, where things are mixed up and hard to sort out
scope: 'Also called broken, and another name for this sense is confused: it means in a mess with no order,
  not feeling worried or troubled, and not feeling ill in the body.'
examples:
- With everything so upset, we could not find the papers on the desk.
- The room was so upset after the party that nothing was in its place.
