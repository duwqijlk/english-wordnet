simpleMeaning: to put written words or numbers inside a pair of marks that set them off from the rest
scope: To put words or numbers inside a pair of marks, not to hold something up with supports and not
  a kind of punctuation mark itself.
examples:
- Please bracket this remark so it stands out from the rest.
- She bracketed the extra words in the sentence.
