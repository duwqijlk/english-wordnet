simpleMeaning: the hour when a bus, train, plane or boat that anyone can use is meant to leave the place
  where its trip starts
scope: This is the hour when shared travel is meant to leave the place where its trip starts, not the
  hour when it is meant to arrive and not the hour when a trip ends.
examples:
- The departure time for the morning train is 8:15.
- Please check the departure time before you leave home.
