simpleMeaning: rooms where the crew sleep and live, in a raised part at the front of a ship that carries
  goods
scope: Also called fo'c'sle, these are the crew's living rooms at the front of a goods ship, not rooms
  for people travelling on the ship.
examples:
- The sailors slept in the forecastle at the front of the ship.
- After supper, the crew went back to the forecastle to rest.
