simpleMeaning: any tree or low woody plant in the Zanthoxylum group, with branches that have sharp points
scope: A tree or low woody plant with sharp-pointed branches, not the one Australian tree with white flowers.
examples:
- The prickly ash in the garden has branches covered with sharp points.
- A prickly ash grew by the fence, its branches full of sharp points.
