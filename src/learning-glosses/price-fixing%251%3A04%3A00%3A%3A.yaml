simpleMeaning: Keeping the cost of a thing that is bought and sold steady, by a deal between makers or
  by the state, in trade between states
scope: Setting what a thing that is bought and sold costs, by a deal between makers or by the state, not
  by buyers and sellers in the open market.
examples:
- The price-fixing agreement kept the cost of the fuel the same across the country.
- The makers were fined for price-fixing after they agreed to hold costs steady.
