simpleMeaning: With purple flowers and small yellow fruits no one can eat, this tree from northern India
  and China now grows wild in the southern United States, giving shade.
scope: Also called azedarach, chinaberry and chinaberry tree, this is a tree from northern India and China
  with purple flowers, not a fruit tree grown for food.
examples:
- The azederach had purple flowers and small yellow fruits no one can eat.
- Azederach grows wild in the south of the United States and gives shade.
