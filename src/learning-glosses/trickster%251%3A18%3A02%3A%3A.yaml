simpleMeaning: A trouble-making being with powers beyond nature in the old stories of many early peoples;
  sometimes it has very strong bodily needs and too-large body parts
scope: This is a being from old stories, not a real person who tricks or cheats other people.
examples:
- In the old story, the trickster steals food and runs away laughing.
- Many peoples tell tales of a trickster with a huge body and a huge hunger.
