simpleMeaning: how likely an event is to happen, given as a number that sets the cases in its favour against
  all the cases that are possible
scope: 'Also called chance: how likely an event is to happen, shown as a number, not the mere quality
  of being probable.'
examples:
- The probability that an unbiased coin will fall with the head up is 0.5.
- The probability of rain tomorrow is high, so take an umbrella.
