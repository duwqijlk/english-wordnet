simpleMeaning: used of a building whose covered entrances at both ends or both sides are held up by columns
  that stand free
scope: This describes a building with covered entrance areas held up by free-standing columns at both
  ends or both sides, also called amphiprostylar, amphistylar or porticoed, not a building with columns
  on one side only or with no columns at all.
examples:
- The amphiprostyle church had a row of columns at each end.
- The guide pointed out the amphiprostyle design of the ancient hall.
