simpleMeaning: For each day, week, month, quarter or season, shows sent out on television, radio, the
  Internet and the like are put in order.
scope: Also called broadcast scheduling, this is the work of putting shows sent out on television, radio
  and the Internet in order for each day, week, month, quarter or season; other kinds of planning for
  what goes on the air are its nearest rivals.
examples:
- Broadcast programming decides what shows go on the air each day.
- She works in broadcast programming, putting the week's shows in order.
