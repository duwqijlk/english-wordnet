simpleMeaning: A thin bug with no sting, its shiny wings spread wide at rest, that eats gnats, midges,
  and more, from youth to age.
scope: This sense is also called dragonfly, darning needle, devil's darning needle, mosquito hawk, sewing
  needle, skeeter hawk, and snake doctor.
examples:
- A snake feeder hovered over the pond.
- Snake feeders eat gnats.
