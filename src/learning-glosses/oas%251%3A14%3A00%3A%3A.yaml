simpleMeaning: A group that brings together most of the countries of the Americas; set up in 1948 to help
  its members work together on defence, trade, money, social life and culture.
scope: Not the United Nations; also called the Organization of American States.
examples:
- The OAS was set up in 1948.
- Most countries of the Americas belong to the OAS.
