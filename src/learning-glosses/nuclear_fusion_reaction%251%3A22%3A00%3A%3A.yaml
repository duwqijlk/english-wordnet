simpleMeaning: Energy is set free when small centres of atoms join to form a heavier centre
scope: This is the joining of the centres of atoms, also called fusion and nuclear fusion; not the splitting
  of such a centre, which is fission.
examples:
- A nuclear fusion reaction gives off a great deal of energy.
- The lab studies the nuclear fusion reaction in stars.
