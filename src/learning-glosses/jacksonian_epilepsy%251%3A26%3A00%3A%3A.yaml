senseId: 'jacksonian_epilepsy%1:26:00::'
synsetId: 14111240-n
simpleMeaning: A seizure starting in one place in the brain, with an attack that most often moves from
  the far end of a limb toward the body, on the same side.
scope: A kind of seizure in which the attack most often moves from the far end of a limb toward the body
  on the same side; not a seizure that strikes the whole body at once or one that stays in one place.
examples:
- Jacksonian epilepsy often starts in a hand and moves up the arm.
- His Jacksonian epilepsy moved from his foot to his leg on the same side.
