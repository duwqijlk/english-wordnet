simpleMeaning: the bad feeling you get from things that you do not like; it is one end of the range of
  feelings, from good to bad
scope: This is the bad feeling itself, not the thing that makes you feel bad and not angry words between
  people.
examples:
- She felt a deep unpleasantness when she walked into the dirty, bad-smelling room.
- The unpleasantness of the long, cold wait stayed with him all day.
