simpleMeaning: A soft shoe made of animal skin, first worn by the first peoples of North America
scope: 'Also called a moccasin: a soft shoe of animal skin, not a hard boot and not a modern trainer.'
examples:
- She slipped on a pair of soft mocassins before going outside.
- The museum displayed mocassins made by Native American craftsmen.
