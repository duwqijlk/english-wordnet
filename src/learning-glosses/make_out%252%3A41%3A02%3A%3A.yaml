simpleMeaning: You still get a thing done, finished or built, even when the means you have fall short
scope: Also called contend, cope, deal, get by, grapple, manage and make do, this is getting something
  finished with only the little you have, not kissing and not doing without.
examples:
- We made out with just a gallon of gas.
- They made out on half a loaf of bread every day.
