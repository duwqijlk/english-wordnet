simpleMeaning: to have all the control of something, or to use that control to gain from it alone
scope: This is about having or using full control of something for gain; it is not just owning part of
  something or using something a lot.
examples:
- One big company monopolized the sale of oil in the whole country.
- He tried to monopolize the town's water supply so no other firm could sell water there.
