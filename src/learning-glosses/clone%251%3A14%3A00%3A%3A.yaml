simpleMeaning: grown from one cell or one living thing, without two parents, so that the whole set of
  cells or living things comes out exactly the same
scope: A group of copies all the same, not one copy alone and not a copy made by hand.
examples:
- Scientists grew a clone of cells from a single skin cell.
- The new plants were clones of the first one, all exactly alike.
