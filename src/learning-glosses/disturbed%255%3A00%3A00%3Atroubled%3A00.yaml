simpleMeaning: feeling worried and unhappy because of trouble or sadness
scope: Also called worried, upset, and distressed. This sense means feeling worried and unhappy because
  of trouble or sadness, not having feelings that change a lot with other people and not being mad.
examples:
- She felt disturbed after hearing the bad news about her son.
- He gave me a disturbed look and could not sleep that night.
