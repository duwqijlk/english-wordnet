simpleMeaning: In grammar, the way a verb shows that an action is done again and again
scope: This is the grammar noun for a verb form that shows an action done again and again, not the describing
  word for something done again and again.
examples:
- In this language, the iterative adds a sound to show the action happens again and again.
- The teacher gave 'knocked and knocked' as an example of the iterative.
