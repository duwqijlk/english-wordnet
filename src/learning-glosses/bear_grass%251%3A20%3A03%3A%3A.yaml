scope: The yucca of the southern United States with a clump of blade-like leaves at its base and a middle
  stalk of small whitish flowers, not the stemless kind of the south-west United States and Mexico and
  not the yucca of the west central United States.
examples:
- Bear grass covers the dry ground of the southern United States.
- A bear grass stalk rose in the middle of the clump, tipped with small white flowers.
