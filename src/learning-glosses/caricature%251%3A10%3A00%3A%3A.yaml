senseId: 'caricature%1:10:00::'
synsetId: 06792908-n
simpleMeaning: a picture or description of a person that makes their looks or ways seem bigger or stronger
  than they are, to make people laugh
scope: 'Also called imitation and impersonation: a picture or description made to be funny by making a
  person seem bigger or stronger than they are. It is not the verb sense, which means to make such a picture
  or description.'
examples:
- The newspaper printed a caricature of the mayor with a very long nose.
- His caricature of the teacher made the whole class laugh.
