simpleMeaning: a blue-green plant with sticky stems bears bunches of big white flowers that open in the
  evening, their cups much swollen; sometimes put in the group Lychnis
scope: 'Also called bladder campion, evening lychnis, and white cockle: a blue-green plant with sticky
  stems and big white flowers that open in the evening, not the red campion and not a garden pink.'
examples:
- White campion opened its big white flowers as the evening grew dark.
- The white campion by the fence has sticky stems and swollen flower cups.
