simpleMeaning: Of or about Linnaeus, or about the system of naming living things that he put forward.
scope: It is about Linnaeus and his system for naming living things, not about another way of naming them;
  also called Linnean.
examples:
- The Linnaean system names living things.
- She used Linnaean names for the plants.
