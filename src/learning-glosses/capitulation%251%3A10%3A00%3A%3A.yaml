simpleMeaning: It names the main parts of a subject, one by one, in a short form
scope: This names the main parts of a subject in a short form; it is not a paper that sets out the terms
  on which one side gives up in a fight.
examples:
- At the end, the teacher gave a capitulation of the lesson's main points.
- His capitulation listed the three main parts of the plan.
