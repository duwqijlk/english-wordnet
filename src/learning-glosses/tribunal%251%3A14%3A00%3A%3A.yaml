simpleMeaning: a group of people, with one or more judges, that meets to hear cases and make decisions
  in law
scope: 'Also called court: a group that includes judges and meets for legal business, not an ordinary
  meeting with no power to decide cases.'
examples:
- The tribunal heard the case over three days.
- A military tribunal will decide his fate.
