simpleMeaning: a group of land animals with wings, small heads, and short legs with four toes not joined
  by skin, found all over the world
scope: This is a whole group of land animals with wings found all over the world, not one single kind
  and not birds that live on water.
examples:
- The columbiform bird walked on the ground with its short legs and small head.
- Pigeons and doves are columbiform birds, with four toes that are not joined by skin.
