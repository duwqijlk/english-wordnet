simpleMeaning: Leaves shaped like hearts and pale blooms with purple streaks mark this tall plant of North
  America that lives year after year.
scope: Also called a tall white violet, it is a tall plant of North America that lives year after year,
  with heart-shaped leaves and pale blooms with purple streaks, not the short-stemmed kind with sweet-smelling
  blooms.
examples:
- A white violet rose above the other plants.
- The white violet stood tall with purple-streaked blooms.
