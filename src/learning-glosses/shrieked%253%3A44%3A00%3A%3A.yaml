simpleMeaning: Said in a high, sharp cry, the kind of cry that pain or great fear brings out
scope: A cry made in pain or fear, not a loud shout of joy and not a quiet moan.
examples:
- She shrieked when she saw the spider on the wall.
- He shrieked in pain as the door shut on his hand.
