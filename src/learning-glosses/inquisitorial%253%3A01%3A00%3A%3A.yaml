senseId: 'inquisitorial%3:01:00::'
synsetId: 03053519-a
simpleMeaning: Especially of a trial in which what goes on is kept secret and the one bringing the charge
  also acts as judge, asking the accused questions.
scope: Not the sense of being full of prying questions, this is the word for a trial kept secret in which
  the prosecutor also acts as judge.
examples:
- The hearing was inquisitorial, held behind closed doors.
- Their manner of questioning was inquisitorial, with the same person acting as judge.
