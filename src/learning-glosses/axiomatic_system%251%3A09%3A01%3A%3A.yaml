simpleMeaning: From a group of starting truths, used together, new truths follow by clear steps — some
  or all of the truths may be used.
scope: This name stands for a group of starting truths used together to reach new truths.
examples:
- The book builds its axiomatic system from a few starting truths.
- An axiomatic system lets mathematicians reach new truths by clear steps.
