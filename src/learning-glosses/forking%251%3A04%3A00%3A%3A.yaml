simpleMeaning: the act of splitting into two or more parts that go out in different directions
scope: Also called fork, branching and ramification. This is the act of splitting into parts, not a tool
  for eating.
examples:
- The river's forking made two smaller streams.
- We watched the forking of the path into two trails.
