simpleMeaning: In mathematics, to be the same in value or to run side by side in the same way
scope: In mathematics, this is being the same in value or running side by side, not writing letters and
  not agreeing in general.
examples:
- Each point on one line corresponds to a point on the other.
- In this sum, the two sides correspond exactly.
