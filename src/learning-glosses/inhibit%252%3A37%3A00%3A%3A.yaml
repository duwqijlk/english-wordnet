senseId: 'inhibit%2:37:00::'
synsetId: 01794202-v
simpleMeaning: to make a person feel shy and unsure, so they cannot act in their normal, free way
scope: To make someone feel shy so they cannot act freely, not to hold back and hide your own feelings,
  wishes or actions on purpose.
examples:
- His father's cold manner inhibited him, and he could not speak freely.
- Feeling watched by everyone inhibited her, so she stopped dancing.
