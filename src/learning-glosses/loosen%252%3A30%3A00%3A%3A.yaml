simpleMeaning: to become less tight and less firm
scope: 'Also called loose and relax: this is when a thing itself becomes less tight, not when a person
  makes something less tight.'
examples:
- The knot loosened after hours in the rain.
- Over time, the screws loosened and the shelf began to shake.
