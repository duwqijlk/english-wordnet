simpleMeaning: a kind of carved picture in which the shapes stick out only a little from the flat back,
  and no shape is cut free from it
scope: 'Also called bas relief, basso relievo and low relief: a carved picture whose shapes stick out
  only a little from a flat back, not a high relief where shapes stick out far and not a free-standing
  statue.'
examples:
- The church wall showed a basso rilievo of saints whose shapes barely rose from the stone.
- She chose a basso rilievo for the plaque because no figure was cut free from the back.
