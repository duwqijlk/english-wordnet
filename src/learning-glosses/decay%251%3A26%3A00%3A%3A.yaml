simpleMeaning: A weak, worn-down state that comes after a thing has broken down.
scope: A weak, worn-down state left after a thing has broken down, not the breaking down itself and not
  the slow loss of power in a battery.
examples:
- Years of neglect left the building in a state of decay.
- The old house showed clear signs of decay.
