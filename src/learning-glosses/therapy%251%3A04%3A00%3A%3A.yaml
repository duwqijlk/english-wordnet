simpleMeaning: In medicine, the act of looking after someone, for example by giving drugs or by special
  training that helps them get better
scope: 'Also called treatment: in medicine, the act of looking after a sick or hurt person, not the drug
  or tool used to do it.'
examples:
- Heat therapy gave her the best relief from pain.
- He is having therapy to help his knee heal after the injury.
