simpleMeaning: the fruit or seed of a bean or pea plant, in a case that opens along both sides when ripe,
  with seeds fixed to one side
scope: This sense is the fruit or seed in its case; it is not the bean or pea plant itself, and not only
  the case that holds the seeds.
examples:
- The ripe legume split open along both sides on the plant.
- She picked a legume and found the seeds fixed to one side of the case.
