simpleMeaning: a blanket made from buffalo hide that goes under a saddle
scope: A blanket of buffalo hide for use under a saddle, not a saddle itself and not a blanket made of
  cloth.
examples:
- He spread the apishamore over the horse's back before the saddle.
- The old apishamore was made of thick buffalo hide.
