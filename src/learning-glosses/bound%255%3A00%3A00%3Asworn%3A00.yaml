simpleMeaning: Committed by a promise made under oath.
scope: This sense means a promise made under oath, not a work contract, a chemical joining, or a book's
  cover.
examples:
- The knights were bound by their oath to defend the village.
- Every witness in court is bound by an oath to tell the truth.
