simpleMeaning: One or more engines that send out a fast stream of hot air power this airplane
scope: An airplane driven by one or more engines that send out a fast stream of hot air, also called jet
  or jet-propelled plane; not a plane with propellers and not a glider.
examples:
- The jet plane crossed the ocean in hours.
- A jet plane roared overhead.
