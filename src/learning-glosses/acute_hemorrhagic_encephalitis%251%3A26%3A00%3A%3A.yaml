simpleMeaning: a sudden swelling of the brain that acts like a stroke, caused by blood leaking out of
  its vessels
scope: A sudden brain swelling that acts like a stroke because blood has leaked from its vessels, not
  a common brain infection and not a stroke itself.
examples:
- The doctors feared acute hemorrhagic encephalitis when the patient collapsed like a stroke victim.
- Acute hemorrhagic encephalitis can strike fast, with blood leaking into the brain.
