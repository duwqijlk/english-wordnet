simpleMeaning: to walk through a small pool of shallow water, or to move your hands or feet about in the
  water
scope: To walk or play in shallow water that lies on the ground, not to make such a pool by splashing
  water and not to work a wet mixture.
examples:
- The children puddled in the shallow water after the rain.
- She puddled barefoot through the water on the path.
