senseId: 'roll%2:39:00::'
synsetId: 02202528-v
simpleMeaning: to send out a long, deep sound that echoes
scope: This sense is the verb for something such as thunder, drums or an organ pouring out a long deep
  echoing sound; it is not the sound itself, and not the quick repeated beat of a snare drum.
examples:
- Thunder rolled in the distance, low and steady.
- Drums rolled through the hall as the ceremony began.
