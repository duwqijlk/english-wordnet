simpleMeaning: The beat of a piece of music is shown in smooth movements of the body, so that people learn
  to grasp music.
scope: Also called eurhythmy, eurythmics and eurythmy, it teaches people to grasp music by moving the
  body to its beat.
examples:
- They used eurhythmics to feel the beat of the music in their bodies.
- In eurhythmics, they moved their bodies to the beat of the music.
