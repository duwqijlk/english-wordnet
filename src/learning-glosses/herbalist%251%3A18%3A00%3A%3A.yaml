simpleMeaning: a person who treats sick people with plants used as medicine
scope: A healer who uses plants as medicine, not a doctor who uses man-made drugs and not a person who
  grows plants for food.
examples:
- The herbalist gave her a tea made from roots and leaves.
- She went to see an herbalist about her bad cough.
