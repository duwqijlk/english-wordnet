simpleMeaning: a small dip or fold in a surface that is smooth in other parts
scope: 'Also called line, wrinkle, crease, seam and crinkle: a small dip or fold in a smooth surface,
  not a long cut in the ground and not the act of making such a cut.'
examples:
- A deep furrow ran across his forehead when he thought hard.
- The smooth cloth had one small furrow near the edge.
