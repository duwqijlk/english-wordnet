senseId: 'fertility%1:28:00::'
synsetId: 15301413-n
simpleMeaning: the number of babies born alive in a place, shown as part of all the people there per 1,000
  people each year
scope: Also called birthrate. This is a count for a place, not the power of soil or plants to grow well,
  and not a person's power to have children.
examples:
- The town's fertility fell to 12 births per 1,000 people this year.
- Fertility is higher in that area, with 30 live births per 1,000 people each year.
