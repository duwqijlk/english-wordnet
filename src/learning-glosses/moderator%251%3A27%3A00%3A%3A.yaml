simpleMeaning: a substance (a kind of material) used in a nuclear reactor (a machine that uses the power
  inside atoms) to slow down neutrons (very small parts inside atoms)
scope: A substance used to slow down neutrons in a nuclear reactor. It is not a person who leads a debate
  or forum, and not a person who helps people settle a dispute.
examples:
- Water can act as a moderator in this kind of reactor.
- The moderator slows the neutrons so the reaction stays under control.
