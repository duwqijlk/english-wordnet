simpleMeaning: Short electrical discharges, each lasting about ten milliseconds, that burst from the tops
  of huge storm clouds and widen into cones of blue light as they shoot upward.
scope: This is the upward flash of blue light from the top of a giant storm cloud, not an aircraft or
  a stream of liquid; blue jet and reverse lightning are other names for the same thing.
examples:
- The satellite recorded a jet rising from the cloud top in a widening cone of blue light.
- A jet lasts only about ten milliseconds, so it is hard to catch on camera.
