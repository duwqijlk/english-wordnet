simpleMeaning: to make a thing messy and untidy, with parts out of their neat place
scope: To make a thing messy and out of place, not to twist things together into a hard mass and not a
  mass of twisted things itself.
examples:
- The strong wind tangled her hair as she ran.
- He tangled his shirt when he pulled it from the bag.
