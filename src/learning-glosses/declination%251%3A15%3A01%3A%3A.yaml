synsetId: 08650469-n
simpleMeaning: In astronomy, a heavenly body's place north or south of the sky's equator, stated in degrees
  and combined with right ascension to give its position in the sky.
scope: The astronomical coordinate, another name for celestial latitude and dec; not a downward slope,
  a decline, or a polite refusal.
examples:
- The telescope's target had a declination of about 30 degrees north.
- She converted the object's right ascension and declination into a position on the sky.
