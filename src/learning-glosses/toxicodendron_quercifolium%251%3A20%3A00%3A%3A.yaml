simpleMeaning: A poison bush of the south-east United States that gives a rash when touched.
scope: Also called eastern poison oak, Rhus quercifolia and Rhus toxicodenedron, this is a poison bush
  of the south-east United States that gives a rash when touched, not a harmless bush or a bush of the
  north.
examples:
- Toxicodendron quercifolium gave him a rash on his arm.
- Do not touch Toxicodendron quercifolium in the woods.
