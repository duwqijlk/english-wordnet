simpleMeaning: A being with power beyond the natural world, worshipped by people and said to rule over
  part of the world or of life, or to stand for a force
scope: A being with power beyond nature that people worship, also called god, and not a mortal person.
examples:
- The immortals of old stories ruled the sea and the sky.
- People prayed to an immortal for a good harvest.
