simpleMeaning: A number that makes a square grid of numbers come out with a worked-out number of zero,
  after the identity grid is taken away that number of times.
scope: Characteristic root of a square matrix, eigenvalue of a matrix and eigenvalue of a square matrix
  are other names for the number that leaves a square grid of numbers with a worked-out number of zero.
examples:
- The student worked out the eigenvalue.
- He found the eigenvalue of the square matrix.
