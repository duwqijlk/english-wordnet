simpleMeaning: a climbing plant from Europe, Asia and Africa, with leaves divided into rounded parts that
  stay green all year, and with black fruits that look like berries
scope: The climbing plant itself, with leaves that stay green all year; not any other climbing plant and
  not a leaf or fruit on its own.
examples:
- Ivy covered the old stone wall from top to bottom.
- The house had ivy growing around its windows and door.
