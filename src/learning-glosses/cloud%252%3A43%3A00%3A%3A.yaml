simpleMeaning: to cover the sky with a dull layer that hides the sun.
scope: The same action is also called overcast; it means covering the sky so it turns dull, not smoke
  rising in a mass and not making something hard to see.
examples:
- By noon, the sky had clouded over and the sun was gone.
- The storm clouded the sky within minutes.
