simpleMeaning: Sometimes left over after anal sex, a foamy mix of slippery stuff and waste from the gut.
scope: The name is for the foamy mix sometimes left over after anal sex, not for the act itself.
examples:
- The word santorum came from a campaign to name a frothy mix left after anal sex.
- They used the word santorum for the frothy mix left after anal sex.
