simpleMeaning: The academic field that studies states, other political communities, and how they are ruled.
scope: This is the academic field, not the governing organization itself, not the act of governing, and
  not a particular system or form of rule.
examples:
- She majored in government at university.
- The course introduces students to government as an academic subject.
