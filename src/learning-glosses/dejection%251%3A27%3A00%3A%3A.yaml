simpleMeaning: solid waste that leaves a person's body through the bowels (the long part inside the body
  that waste passes through before it leaves)
scope: 'Also called stool, feces and faeces: solid waste that comes out of the body. It is not a feeling
  of sadness or of being low and without hope.'
examples:
- The doctor asked for a sample of the dejection for testing.
- The nurse cleaned up the dejection from the bed.
