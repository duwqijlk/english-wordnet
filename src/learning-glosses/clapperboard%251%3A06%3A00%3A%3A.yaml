simpleMeaning: A film tool used to match sound with moving pictures, made of flat pieces held before the
  camera and struck together.
scope: A film tool that matches sound with moving pictures, not a camera and not a microphone.
examples:
- The clapperboard snapped shut before the scene began.
- She held the clapperboard in front of the camera.
