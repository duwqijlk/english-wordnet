simpleMeaning: at set times again and again, or in the usual set way
scope: This sense is about doing something at set times again and again, or in the usual way. It is not
  the sense about a steady way that does not change, and not the sense about having an even shape.
examples:
- The bus comes regularly, every morning at eight.
- She visits her mother regularly on Sundays.
