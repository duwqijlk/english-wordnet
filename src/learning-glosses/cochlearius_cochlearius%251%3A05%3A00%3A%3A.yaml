simpleMeaning: A heron of tropical America, kin to the night herons.
scope: This is a heron of tropical America, kin to the night herons; broadbill, boat-billed heron and
  boatbill are other names for it, not a heron of cool lands and not a heron with a slim bill.
examples:
- Cochlearius cochlearius stood in the shallows at dusk.
- We saw a Cochlearius cochlearius by the river in the tropics.
