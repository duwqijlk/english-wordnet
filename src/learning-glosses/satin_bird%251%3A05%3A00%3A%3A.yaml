simpleMeaning: a feathered creature of south-east Australia; the male is a shiny violet blue, and the
  female is a pale grey-green
scope: 'Also called a satin bowerbird: a bird from south-east Australia, the male shiny violet blue and
  the female pale grey-green; not a crow and not a parrot.'
examples:
- The satin bird sang from the top of the gum tree.
- A female satin bird, pale grey-green, sat on the nest.
