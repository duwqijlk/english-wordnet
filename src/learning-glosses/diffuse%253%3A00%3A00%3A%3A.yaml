simpleMeaning: Of light, coming from a wide source or bounced off a surface rather than from one bright
  point
scope: Light spread out from a wide source or bounced off a surface, also called soft; not light beamed
  straight from one point and not the verb sense of spreading something through.
examples:
- The room was lit by a diffuse glow from the big windows.
- Diffuse light from the clouds made the whole field look even.
