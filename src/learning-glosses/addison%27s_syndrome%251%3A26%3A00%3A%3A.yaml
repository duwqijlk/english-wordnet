simpleMeaning: A problem with a gland, caused when the outer part of the adrenal gland stops working well,
  and marked by low blood (anaemia), great weakness and brownish skin
scope: A gland problem when the adrenal gland's outer part fails; hypoadrenalism, hypoadrenocorticism
  and Addison's disease are other names for this sense, not other gland problems with different signs.
examples:
- Addison's syndrome left her weak with brownish skin.
- He takes medicine every day for Addison's syndrome.
