simpleMeaning: A Loloish way of speaking used in western Yunnan Province, in 11 prefectures, 63 counties,
  along the upper Salween and Mekong rivers, and in southwest Liangshan prefecture of Sichuan Province.
scope: A language of southwest China, also called Lisu, spoken in western Yunnan and southwest Liangshan
  in Sichuan along the upper Salween and Mekong rivers.
examples:
- Lisu language is spoken in the mountains of Yunnan.
- She sang a song in the Lisu language at the festival.
