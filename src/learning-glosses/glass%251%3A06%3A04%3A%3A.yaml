simpleMeaning: the whole group of cups, dishes and similar items made of a brittle transparent material
scope: This is a set of cups and dishes taken together; it is not one single drinking vessel, and not
  the raw material itself.
examples:
- We washed all the glass by hand after the party.
- The museum has a fine collection of Roman glass.
