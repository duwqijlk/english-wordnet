simpleMeaning: Able to drive out or kill worms that live off the body.
scope: Able to drive out or kill worms that live off the body, also called anthelminthic, anthelmintic
  and helminthic; not a drug that kills germs and not a drug that kills lice.
examples:
- The parasiticidal drug cleared the worms from the child.
- The farmer gave the sheep a parasiticidal dose to kill the worms.
