simpleMeaning: to write what a word or phrase means in another language, between its lines in a text
scope: This is writing what a word or phrase means in another language between its lines, not explaining
  it in the same language and not giving it a false front.
examples:
- The teacher glossed the Latin words for the class.
- She glossed each line of the poem in English.
