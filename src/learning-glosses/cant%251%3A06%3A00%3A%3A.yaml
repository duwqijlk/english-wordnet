simpleMeaning: two surfaces that meet at an angle that is not a right angle
scope: Two surfaces meeting at an angle that is not a right angle; not empty talk repeated until it means
  nothing, and not a slope on a road.
examples:
- The two walls meet at a cant, not a right angle.
- The carpenter cut a cant along the edge of the board.
