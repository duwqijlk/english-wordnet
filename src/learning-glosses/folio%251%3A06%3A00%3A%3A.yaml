simpleMeaning: A large book made of big sheets of paper, each folded once to give two leaves or four pages.
scope: A large book made of big sheets folded once to give two leaves or four pages, not a single sheet
  of written or printed matter.
examples:
- The first folio of Shakespeare's plays stood on the shelf.
- The library keeps a folio of old maps in the reading room.
