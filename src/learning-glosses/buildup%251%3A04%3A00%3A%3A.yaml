simpleMeaning: the act of making an amount or pile grow larger by adding more to it
scope: A growth in amount, such as soldiers or money growing larger. Not praise or good things said in
  public about someone.
examples:
- There was a buildup of troops near the border.
- His rapid buildup of savings helped him buy a house.
