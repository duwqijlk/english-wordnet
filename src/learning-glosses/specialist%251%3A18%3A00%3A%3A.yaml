simpleMeaning: a person who knows one kind of work or study very well and gives it all their time
scope: A person who knows one field very well, not a person who knows a little about many things and not
  a doctor for all ills.
examples:
- She is a specialist in heart disease.
- The museum hired a specialist to care for the old books.
