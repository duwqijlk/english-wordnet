simpleMeaning: Leaves that float in a star shape mark one of several kinds of plant that live in the liquid,
  found in America, Europe and Asia.
scope: The sense covers plants that live in the liquid in America, Europe and Asia, with leaves that float
  in a star shape.
examples:
- In the pond, water starwort spread its star-shaped leaves across the top.
- On the pond, water starwort floated with its leaves in a star shape.
