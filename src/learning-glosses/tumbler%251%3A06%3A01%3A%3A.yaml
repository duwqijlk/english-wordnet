simpleMeaning: a moving block inside a lock that must be moved into place, as with a key, before the bolt
  can move
scope: A moving part inside a lock; not a glass, not a gymnast, and not a pigeon.
examples:
- The key turned the tumblers inside the lock.
- A good lock has several tumblers that must line up.
