simpleMeaning: In the trees of warm America lives a fruit-eating animal with a long tail that can grip
  and hold on.
scope: It is also called a kinkajou or a potto, and it is the fruit-eating animal that lives up in the
  trees of warm America, gripping with a long tail.
examples:
- The honey bear hung from a branch by its long tail.
- A honey bear reached for fruit high in the tree.
