simpleMeaning: bakeries, often large ones, use this machine to roll out the mix into a flat layer of the
  thickness they want, the same all through
scope: A machine bakeries use to roll out their mix to an even thickness, not a rolling pin and not an
  oven.
examples:
- The bakery's dough sheeter rolled the mix into a flat layer in seconds.
- She fed the dough through the dough sheeter until it was the same thickness all through.
