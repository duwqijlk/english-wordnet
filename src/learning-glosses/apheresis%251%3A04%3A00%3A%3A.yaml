senseId: 'apheresis%1:04:00::'
synsetId: 00651235-n
simpleMeaning: Blood is taken out and run through a filter that splits it into parts; some parts are kept
  back and the rest are put back into the giver.
scope: 'Also called pheresis: a medical step that splits drawn blood into parts, keeping some and giving
  the rest back, not a simple gift of whole blood.'
examples:
- The apheresis took out her blood and split it into parts.
- During apheresis, some parts of the blood are kept back and the rest given back.
