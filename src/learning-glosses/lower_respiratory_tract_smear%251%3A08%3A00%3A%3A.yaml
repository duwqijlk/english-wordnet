simpleMeaning: Thin spreads of cells from different parts of the airways, deep in the lungs, are checked
  under a lens to look for cancer and other lung sicknesses.
scope: Also called a bronchoscopic smear and a sputum smear, it is one of several cell samples from different
  parts of the lower airways, studied for cancer and other lung sicknesses.
examples:
- The lower respiratory tract smear showed no sign of cancer.
- The lower respiratory tract smear came from deep in the airways.
