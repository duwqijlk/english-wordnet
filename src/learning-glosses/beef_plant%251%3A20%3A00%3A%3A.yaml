simpleMeaning: A South American plant with decorative green-to-purple leaves and green-to-purple or red
  stems, plus spikes of small woolly flowers among dry, papery bracts.
scope: Another name for the South American ornamental plant also called beefsteak plant, not the separate
  beefsteak plant grown for its red or purple leaves.
examples:
- The beef plant has red branches and woolly flower spikes.
- Gardeners value the beef plant for its green-to-purple foliage.
