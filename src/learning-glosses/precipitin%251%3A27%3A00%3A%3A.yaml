simpleMeaning: a thing in the blood (an antibody) that joins with the thing it acts on and makes it form
  a solid and drop out of the liquid
scope: This is a blood part that makes the thing it joins form a solid and drop out of liquid, not a drug
  and not a germ itself.
examples:
- In the test, the precipitin joined with its target and formed a solid in the liquid.
- The lab added a precipitin, and the mix soon formed a solid that sank to the bottom.
