simpleMeaning: the quality of acting too fast and without sense
scope: Not the settled habit of doing rash things; about the quality of being rash and without sense.
examples:
- Trying to drive through a blizzard is the height of foolishness.
- His foolishness cost him the job he had wanted for years.
