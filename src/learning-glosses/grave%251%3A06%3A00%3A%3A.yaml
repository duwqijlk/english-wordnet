simpleMeaning: a place for putting a dead body, especially under the ground and marked by a stone
scope: A place where a dead body is put, especially under the ground. Not the mark over a letter, and
  not grave meaning very serious or very bad.
examples:
- He put flowers on his mother's grave.
- They dug a grave in the small field near the church.
