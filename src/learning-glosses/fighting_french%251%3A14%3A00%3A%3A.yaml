simpleMeaning: A group from France in World War II, set up in London by Charles de Gaulle to free France
  from German rule and bring back the republic.
scope: Also called the Free French; a wartime group that worked to free France, not the French government
  that stayed under German rule.
examples:
- The Fighting French broadcast from London during the war.
- De Gaulle led the Fighting French from London.
