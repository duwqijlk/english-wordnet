simpleMeaning: an oil with a strong smell like lemon, used a lot in Asian cooking and in perfumes and
  medicines
scope: 'Also called lemon grass and lemongrass oil: this is the oil from the plant, used in cooking, perfumes,
  and medicines, not the tall grass plant itself.'
examples:
- A few drops of lemongrass gave the soup a fresh lemon smell.
- The maker put lemongrass into the perfume to give it a lemon smell.
