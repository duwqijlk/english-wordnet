simpleMeaning: clothing and other items that are made to cover the body and be put on by a person.
scope: This is not the act of having something on your body, and it is not the harm that use causes to
  an object; it is the things themselves.
examples:
- The shop sells outdoor wear and walking boots.
- He packed light summer wear for the trip.
