simpleMeaning: People who follow this faith, chiefly in Caribbean lands and above all in Haiti, work magic
  and honour the spirits that live in things of nature.
scope: Also called voodoo, hoodooism, and vodoun, this Caribbean faith uses magic and calls on spirits
  of nature.
examples:
- Voodooism is practiced chiefly in Haiti.
- Followers of voodooism call on spirits through magic.
