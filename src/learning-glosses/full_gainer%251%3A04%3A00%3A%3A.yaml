simpleMeaning: The diver goes into the water feet first, back to the board, after throwing the feet forward
  and turning one whole backward somersault in a dive.
scope: This dive, also called a gainer, goes into the water feet first, back to the board.
examples:
- She scored well with a full gainer off the high board.
- His full gainer sent him into the water feet first.
