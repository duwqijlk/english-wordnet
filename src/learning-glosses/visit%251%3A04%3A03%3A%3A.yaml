simpleMeaning: a stay that lasts only a short time, for example as a guest
scope: This is not the act of going to see a person or place, but the time spent staying there.
examples:
- We had a lovely visit with my aunt in Bristol last summer.
- Her visit to the mountain village lasted a full week.
