simpleMeaning: The idea that new kinds of living things come about and last through natural selection.
scope: A theory of organic evolution, set apart from other theories of evolution by its claim that new
  kinds of living things come about and last through natural selection.
examples:
- Darwinism holds that natural selection shapes new species over time.
- He wrote an essay on Darwinism and the fossil record.
