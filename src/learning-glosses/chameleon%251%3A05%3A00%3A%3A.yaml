simpleMeaning: a lizard from Africa and Madagascar that can change the color of its skin and has a tongue
  that shoots out fast
scope: 'Also called chamaeleon: the lizard itself, not a person who keeps changing what they think or
  do.'
examples:
- The chameleon changed color as it moved onto the brown branch.
- A chameleon's tongue shot out in a flash.
