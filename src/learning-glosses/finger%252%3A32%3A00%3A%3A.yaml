simpleMeaning: Mark in written music which hand digit should play each note on a keyboard instrument.
scope: This is about marking a score for keyboard playing, not the body part, a glove's part, or the act
  of touching something.
examples:
- The teacher fingered the difficult passage so her pupils knew which hand digit to use.
- He fingered the new sonata in pencil before rehearsal.
