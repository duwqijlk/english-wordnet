simpleMeaning: a muscle that moves the arm and turns it in toward the middle of the body
scope: 'Also called teres major muscle and musculus teres major: a muscle that turns the arm in, not the
  teres minor, which turns the arm out.'
examples:
- The doctor tested the teres major by asking him to turn his arm inward.
- The teres major helps turn the arm inward when you reach behind your back.
