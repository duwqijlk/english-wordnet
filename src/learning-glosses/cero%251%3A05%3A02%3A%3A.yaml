simpleMeaning: a big mackerel with a long pointed nose; a food fish and game fish people value, from the
  east Atlantic coast down to Brazil
scope: A big mackerel with a long pointed nose, a food fish and game fish from the east Atlantic coast
  down to Brazil; cavalla and king mackerel are other names for this sense, not the mackerel of the United
  States coast and not a small fish.
examples:
- Cero with its long pointed nose is caught along the east Atlantic coast.
- Anglers prize cero as a game fish off Brazil.
