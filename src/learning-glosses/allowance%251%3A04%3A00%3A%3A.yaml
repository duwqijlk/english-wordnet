simpleMeaning: the act of letting something happen, or saying it may happen
scope: The act of letting something happen, not an amount of money given and not putting someone on a
  fixed amount of food.
examples:
- He objected to the allowance of smoking in the dining room.
- The allowance of pets in the flats pleased the tenants.
