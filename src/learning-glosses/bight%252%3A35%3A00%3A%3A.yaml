simpleMeaning: To tie a thing fast with a loop of rope.
scope: To tie a thing fast with a loop of rope, not the loose middle part of a slack rope, not a wide
  bay where the shore bends inward, and not a bend or curve, especially one in a coastline.
examples:
- Bight the rope to the post to hold the boat.
- He bighted the line round the cleat.
