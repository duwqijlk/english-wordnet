simpleMeaning: the act of crossing paths, as when you join your path to the path of a thing you are after
scope: The act of crossing paths to meet a thing you are after, not where lines cross and not shared ground
  between ideas.
examples:
- The intersection of the two ships' paths took place at dawn.
- He planned the intersection of his route with the runner's path.
