simpleMeaning: a short writing that gives the main points of a larger work and covers the whole thing
scope: A short writing that covers a larger work in full, not the larger work itself and not a note about
  just one part of it.
examples:
- He bought a compendium of the long history book to learn its main points fast.
- This compendium gives a short form of the whole work in one small book.
