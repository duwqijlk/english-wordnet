simpleMeaning: a gentle or roundabout way of saying something, used in place of words that would sound
  rude or too harsh
scope: A soft or roundabout phrase used instead of a harsher one; not the rude or harsh words themselves.
examples:
- Saying someone 'passed away' is a euphemism for saying they died.
- He used the euphemism 'let go' instead of saying the workers were fired.
