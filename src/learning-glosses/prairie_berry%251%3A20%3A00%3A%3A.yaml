simpleMeaning: A weedy nightshade with silvery leaves and violet, blue, or white flowers, whose roundish
  berry is much used to curdle milk, from the central United States to South America.
scope: Also called purple nightshade, silver-leaved nettle, silver-leaved nightshade, silverleaf nightshade,
  trompillo, and white horse nettle, it is a weedy nightshade with silvery leaves and violet, blue, or
  white flowers, whose roundish berry is much used to curdle milk, from the central United States to South
  America.
examples:
- Prairie berry curdles milk with its roundish berry.
- Prairie berries grow from the central United States to South America.
