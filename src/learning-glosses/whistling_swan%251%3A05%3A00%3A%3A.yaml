simpleMeaning: a North American kind of large white bird that lives on the tundra and makes a soft, high,
  clear sound
scope: A North American kind of large white bird that makes a soft sound, not the trumpeter swan and not
  the mute swan.
examples:
- We heard a whistling swan call from the lake at dawn.
- The whistling swan flew north with the other swans in spring.
