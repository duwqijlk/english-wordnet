simpleMeaning: sugar plants that show the finest growth of their kind, with big juicy stems, soft skins
  and much sweet stuff
scope: Sugar plants of the finest growth of their kind; not common wild grass and not a fruit tree.
examples:
- Noble cane grows tall in the warm fields of the islands.
- The farmers cut noble cane when its stems were full of juice.
