simpleMeaning: Old cloth left in bins and public rubbish heaps is what this person with no training gathers
  to earn a living.
scope: This is a person with no training who earns a living by gathering old cloth from bins and public
  rubbish heaps, not by any skilled trade.
examples:
- A ragpicker gathered old cloth from the bins.
- The ragpicker earned a living from what others threw away.
