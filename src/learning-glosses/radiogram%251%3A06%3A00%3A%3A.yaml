simpleMeaning: A photo made on a light-shy surface by rays other than plain light, especially by X-rays
  or gamma rays.
scope: A photo made on a light-shy surface by rays other than plain light, especially by X-rays or gamma
  rays; also called radiograph, shadowgraph, skiagram, or skiagraph; not a message sent by wireless telegraphy.
examples:
- Their radiogram showed the bone.
- The radiogram was taken at dawn.
