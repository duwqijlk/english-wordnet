simpleMeaning: In plants, a flower head on one stem with no side stems, where the flowers sit right on
  the stem and keep opening as the stem grows
scope: A plant flower head on one stem with no side stems, not a sharp point on a shoe, a fence, or a
  tool, and not the grain head of corn.
examples:
- The lavender spike held small flowers along its stem.
- The orchid's spike carried flowers that sat right on the stem.
