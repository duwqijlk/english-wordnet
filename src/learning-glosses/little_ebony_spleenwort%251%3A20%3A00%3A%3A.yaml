simpleMeaning: A plant with feathery leaves that grows in warm parts of America, from the south of the
  United States through the West Indies and Mexico to Brazil.
scope: This is a fern of warm America, not a fern of cool northern woods; black-stem spleenwort and black-stemmed
  spleenwort are other names for this sense.
examples:
- Little ebony spleenwort grows in the warm forests of Mexico.
- We saw little ebony spleenwort along the path in the West Indies.
