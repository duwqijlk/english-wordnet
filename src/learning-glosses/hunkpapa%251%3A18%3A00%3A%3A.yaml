simpleMeaning: A member of the Siouan people, a Teton Sioux division, who formerly lived in the western
  Dakotas and stood out in fighting the white move into the northern Great Plains.
scope: A member of the Siouan people, a Teton Sioux division, who formerly lived in the western Dakotas
  and stood out in fighting the white move into the northern Great Plains; this is the people, not the
  Siouan language they speak.
examples:
- The Hunkpapa lived in the western Dakotas.
- Hunkpapa fighters stood out in resisting the white move into the northern Great Plains.
