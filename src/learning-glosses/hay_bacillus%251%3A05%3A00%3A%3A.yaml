simpleMeaning: A kind of tiny rod-shaped germ found in soil and rotting plant and animal matter, some
  kinds of which make medicines that kill germs.
scope: This is a kind of tiny rod-shaped germ found in soil and rotting plant and animal matter, not a
  virus; also called grass bacillus.
examples:
- Hay bacillus lives in the soil.
- The hay bacillus in the sample made an antibiotic.
