simpleMeaning: A group on its own in the government of the United States that looks after small businesses
  and makes sure they get a fair share of work from the government.
scope: 'Also called Small Business Administration: a group of the United States government that helps
  small businesses, not a bank and not a group that gives out money.'
examples:
- The SBA helps small businesses get government work.
- She asked the SBA for help with her small business.
