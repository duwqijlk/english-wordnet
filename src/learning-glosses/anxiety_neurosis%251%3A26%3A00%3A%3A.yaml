simpleMeaning: A mind illness marked by worry spread over many things, often with body signs of fear.
scope: A mind illness of wide-spread worry with body signs of fear, not a short spell of worry and not
  a fear of one thing only.
examples:
- His anxiety neurosis left him tired and tense all day.
- She was treated for anxiety neurosis after months of worry.
