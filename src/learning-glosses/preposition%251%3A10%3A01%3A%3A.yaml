simpleMeaning: In linguistics, putting one language part before another, such as a word that describes
  another word placed before it, or a small part added before the main word
scope: This sense is the act of putting one language part before another; it is not the common use for
  a small joining word such as 'in' or 'on' that comes before a noun.
examples:
- In this grammar rule, preposition means putting a describing word before the word it describes.
- The book uses preposition for putting a small part at the front of a main word.
