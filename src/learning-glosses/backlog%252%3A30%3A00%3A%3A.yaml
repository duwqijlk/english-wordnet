simpleMeaning: to build up and make a large amount of things that are still waiting to be dealt with
scope: The act of letting things build up while they wait to be dealt with; not the noun of the same name
  for the pile of jobs that are still waiting.
examples:
- Requests backlog fast when only one person is on duty.
- If we stop for a week, the work will backlog.
