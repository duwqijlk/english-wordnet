simpleMeaning: In the Eastern Orthodox Church, a church leader whose rank is below a patriarch and above
  a bishop, the same as an archbishop in western Christianity
scope: This is a church leader in the Eastern Orthodox Church, not a person who lives in a big city and
  not the sense that means about a big city.
examples:
- The metropolitan met with bishops from across the region.
- He was made a metropolitan after many years as a bishop.
