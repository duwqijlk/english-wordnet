simpleMeaning: a pigeon of Europe and Asia with white marks on its wings and neck
scope: 'Also called a cushat or a wood pigeon: a pigeon of Europe and Asia with white marks on its wings
  and neck, not a city pigeon and not a small songbird.'
examples:
- A ringdove called from the top of the oak tree.
- We saw a ringdove with white patches on its neck in the garden.
