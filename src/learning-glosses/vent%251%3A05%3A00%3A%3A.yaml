simpleMeaning: an opening on the outside of the body of a lower animal with a backbone, for the parts
  that make pee or make young
scope: An opening in the body of a lower animal with a backbone, not an activity that lets feelings out,
  not an opening in the ground, and not a slit in clothes.
examples:
- The fish's vent is under its body, near its tail.
- The vet checked the bird's vent for signs of illness.
