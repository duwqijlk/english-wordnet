simpleMeaning: A reward that comes each time an act is done trains a person or animal to do it in a set
  way, under the control of a signal.
scope: A way of training where a reward follows the act each time, so the act is learned, not training
  by pairing things together.
examples:
- Operant conditioning taught the rat to press the bar for food.
- With operant conditioning, the child earned a star each time she finished her work.
