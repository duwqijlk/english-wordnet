simpleMeaning: To do with a way of reaching the truth by arguing back and forth.
scope: To do with the method of finding truth through argument, also called dialectical; not the system
  of reasoning itself, and not a clash of ideas.
examples:
- She used a dialectic approach to settle the question.
- The dialectic method sorted the claims one by one.
