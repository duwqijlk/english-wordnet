scope: One of many Coreopsis plants, also called coreopsis, tickseed and tickweed, with bright daisy-like
  flowers across the Americas.
examples:
- The tick-weed kept its yellow flowers open for a long time.
- Tick-weed grows across the Americas in bright yellow masses.
