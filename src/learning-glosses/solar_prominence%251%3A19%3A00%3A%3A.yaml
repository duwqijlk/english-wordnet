simpleMeaning: a great burst of glowing hydrogen gas that rises far above the sun's surface layer
scope: A great burst of glowing gas that rises far above the sun's surface layer, not a flare on the sun's
  surface and not a cloud in the sky.
examples:
- A solar prominence rose high above the sun's edge during the eclipse.
- The telescope caught a solar prominence lifting off the sun.
