simpleMeaning: What a person is like because of the family they come from, going back many years
scope: What a person is like because of the family they come from; descent and origin are other names
  for this sense; not the act of taking something out of a mixture.
examples:
- She was proud of her extraction, which went back to the first settlers.
- His extraction showed in the way he spoke and the things he knew.
