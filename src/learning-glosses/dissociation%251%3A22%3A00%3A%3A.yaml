simpleMeaning: In chemistry, a passing change that can be undone, in which a bit of matter or a charged
  bit splits into smaller bits.
scope: In chemistry, a passing change that can be undone, splitting a bit of matter into smaller bits,
  not the splitting of a person's mind from the rest of their life.
examples:
- Dissociation split the salt into smaller bits in the water.
- The dissociation of the gas could be undone by cooling it.
