simpleMeaning: A hand tool with two straight arms set at a right angle, used to mark or check exact corners.
scope: This is the L-shaped tool a builder uses to mark or check corners, not the geometric figure with
  four equal sides, and not a tile or board space shaped like one.
examples:
- The carpenter held his square against the corner to check it.
- Use a square to mark a line at exactly ninety degrees.
