senseId: 'energy_of_activation%1:19:00::'
synsetId: 11441936-n
simpleMeaning: A change, such as giving something off or a chemical change, can happen only after the
  smallest bits of matter take in power
scope: 'Also called activation energy: the power that the smallest bits of matter must take in before
  a change can happen, not the power given out by a change and not a change that needs no power.'
examples:
- The catalyst lowered the energy of activation so the reaction could start.
- They measured the energy of activation needed before the change could occur.
