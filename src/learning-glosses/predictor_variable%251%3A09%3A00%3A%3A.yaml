simpleMeaning: a changing value that can be used to guess the value of another changing value, as in statistical
  regression, a way of finding a link in numbers
scope: A changing value used to guess another changing value, not the value being guessed.
examples:
- Age was the predictor variable they used to guess income in the study.
- In the model, hours of study was a predictor variable for test scores.
