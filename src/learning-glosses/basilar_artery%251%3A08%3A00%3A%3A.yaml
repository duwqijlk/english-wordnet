simpleMeaning: The inner ear, the back part of the large brain, the small brain at the back, and the bridge
  of the brain are all fed by this single blood tube.
scope: Also called arteria basilaris, this is a single blood tube that feeds the bridge of the brain and
  the small brain at the back, not a pair of blood tubes.
examples:
- The basilar artery feeds the bridge of the brain.
- The basilar artery is a single blood tube.
