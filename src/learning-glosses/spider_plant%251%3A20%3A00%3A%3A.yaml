simpleMeaning: Kept for long-lived white to pink-purple blooms with thin parts spreading out, this plant
  comes from South America and now grows wild in warm parts of the US.
scope: This plant is also called spider flower, and it is the plant itself that is kept, not its blooms
  on their own.
examples:
- The spider plant has white blooms.
- Her spider plant has pink-purple blooms.
