simpleMeaning: A part of an insurance plan that says the company will not pay the first part of a loss,
  up to a set amount
scope: This is a part of an insurance plan, naming the first part of a loss the company will not pay.
  It is not the amount taken off before tax, and not the sense that means a cost can be taken off.
examples:
- The deductible in her plan says the company will not pay the first $500 of a loss.
- The policy includes a deductible that leaves the first part of any loss for you to pay.
