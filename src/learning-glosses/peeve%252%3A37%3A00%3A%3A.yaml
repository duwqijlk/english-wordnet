senseId: 'peeve%2:37:00::'
synsetId: 01792751-v
simpleMeaning: to make someone feel annoyed, cross, or full of bad feeling because they think they were
  treated in a way that is not fair
scope: This is making a person feel annoyed, not the annoyed mood itself.
examples:
- It peeves me when people talk loudly on a quiet train.
- His slow, careless reply peeved her for the rest of the day.
