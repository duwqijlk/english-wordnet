simpleMeaning: Old Rome had a set of rules, put together in the time of Justinian, and many new systems
  of civil law rest on them.
scope: Also called civil law, jus civile, and Justinian code, this is the set of rules of old Rome, not
  the rules of one modern land and not the rules of a church.
examples:
- Roman law still shapes the rules of many lands today.
- Students of Roman law study the rules put together in the time of Justinian.
