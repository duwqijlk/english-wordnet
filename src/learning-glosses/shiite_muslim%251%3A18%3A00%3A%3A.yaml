simpleMeaning: A member of the branch of Islam that believes Ali was Mohammed's true successor and rejects
  the first three caliphs
scope: Also called Shi'ite, Shi'ite Muslim, Shia Muslim and Shiite; a member of the branch of Islam that
  sees Ali as the true successor to Mohammed, not a member of the branch that accepts the first three
  caliphs.
examples:
- A Shiite Muslim believes Ali was the true successor to Mohammed.
- The Shiite Muslim scholar rejects the first three caliphs and honours Ali as the true successor.
