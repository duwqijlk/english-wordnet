simpleMeaning: an end you look ahead to and mean to bring about, or one that guides what you plan
scope: 'Also called purpose, design, aim, and intention: an end you mean to bring about or that guides
  your plans, not the meaning of a message.'
examples:
- His intent was to give a new translation.
- He made no secret of his intent.
