simpleMeaning: A weapon used to shoot arrows, made from a curved, springy piece of wood held tight by
  a string.
scope: This is the archery weapon, not the horsehair tool for playing a stringed instrument and not the
  tied loop.
examples:
- He drew the bow and sent the arrow into the target.
- The hunter carried a bow and a quiver of arrows.
