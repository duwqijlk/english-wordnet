synsetId: 01262989-n
simpleMeaning: to help a hurt part of the body heal well, it is held still, as in a plaster cast
scope: Holding a hurt part of the body still, as in a plaster cast, so it heals well, also called immobilization;
  not a splint on its own and not an operation.
examples:
- The doctor ordered immobilisation of her broken wrist for six weeks.
- Immobilisation of the injured knee was necessary after the fall.
