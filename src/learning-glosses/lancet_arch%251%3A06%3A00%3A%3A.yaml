simpleMeaning: A sharply pointed curved top in the Gothic style, shaped like a long thin spear.
scope: A sharply pointed curved top in the Gothic style, shaped like a long thin spear; lancet is another
  name for this sense, not a round curved top, and not a flat top over a door.
examples:
- The lancet arch above the doorway rose to a sharp point.
- Gothic churches often use a lancet arch for their tall windows.
