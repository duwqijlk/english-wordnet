simpleMeaning: Ammonia in the wee in a baby's wet nappies is thought to bring on sore red skin on its
  thighs and bottom
scope: Sore skin on a baby, also called diaper dermatitis; not a rash on an older child or adult.
examples:
- The baby's diaper rash made her cry when her nappy was changed.
- The nurse said the diaper rash would clear up once the skin was kept dry.
