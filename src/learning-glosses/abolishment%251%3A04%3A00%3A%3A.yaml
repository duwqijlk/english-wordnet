simpleMeaning: the act of ending a system, a practice, or an institution, especially ending slavery
scope: This is the ending of a system, practice or institution, also called abolition; not the ending
  of a single law and not a change that leaves the system in place.
examples:
- The abolishment of slavery came after years of struggle.
- Campaigners called for the abolishment of the old practice.
