simpleMeaning: Its flowers have a lower lip that is big, puffed up, and shaped like a slipper, on any
  plant grown in gardens, of one group.
scope: Also called a slipperwort, this garden plant of one group has flowers whose lower lip is big, puffed
  up, and shaped like a slipper.
examples:
- A calceolaria bloomed in the garden.
- She grew calceolaria for its slipper-shaped flowers.
