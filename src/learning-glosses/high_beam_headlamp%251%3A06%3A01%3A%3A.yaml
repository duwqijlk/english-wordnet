simpleMeaning: A car headlamp with a bright, middle-weighted spread and no check on light aimed at others'
  eyes, fit only when alone on the road, as its glare blinds others.
scope: A car headlamp with a bright, middle-weighted spread and no check on light aimed at others' eyes,
  fit only when alone on the road, as its glare blinds others; it is also called driving beam headlamp,
  full beam headlamp and main beam headlamp.
examples:
- The high beam headlamp lit the empty road.
- Use the high beam headlamp only when alone on the road.
