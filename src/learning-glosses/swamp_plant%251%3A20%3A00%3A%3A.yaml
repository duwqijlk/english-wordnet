simpleMeaning: plants like sedge, sphagnum, grasses, and cattails, living half in water, half on land
  in soft wet ground; most have one seed leaf, and some may be heath
scope: Also called a bog plant and a marsh plant; a half-water plant of soft wet ground, not a dry-land
  plant and not a plant that lives wholly under water.
examples:
- Swamp plants grow thick where the ground stays soft and wet.
- The swamp plant at the pond's edge had one seed leaf like a grass.
