simpleMeaning: In logic, a word like some, all, or no that shows how much of a group a claim covers
scope: Also called a logical quantifier; in logic, a word like some or all, not a grammar word that says
  how many and not a number.
examples:
- In the claim 'all birds can fly', the quantifier is 'all'.
- The teacher asked which quantifier - some, all, or no - fits the sentence.
