simpleMeaning: a thick tropical swamp plant, above all of tropical America, with large leaves whose undersides
  are covered with yellow spore cases
scope: 'Also called leather fern: a thick tropical swamp plant, above all of tropical America, with large
  leaves whose undersides are covered with yellow spore cases; not a garden fern and not a tree fern.'
examples:
- The golden fern grew thick in the wet ground near the river.
- Under the golden fern leaves, the yellow spore cases covered the undersides.
