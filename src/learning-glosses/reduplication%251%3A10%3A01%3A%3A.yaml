simpleMeaning: The small bit of sound added in a word form with a repeated part
scope: The small bit of sound added in a word form with a repeated part, not the act of saying a thing
  twice and not a word made wholly of a repeated sound.
examples:
- The reduplication in the word adds a first sound twice.
- In reduplication, one sound is copied at the start of the word.
