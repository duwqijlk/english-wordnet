scope: This sense is also called chalice vine and trumpet flower, for a Mexican evergreen climbing plant
  with large lone funnel-shaped sweet-smelling yellow blooms, purple-brown ridged in the throat, unlike
  the sense for plants of the genus Nierembergia with upturned bell-shaped blooms.
