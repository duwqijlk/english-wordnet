simpleMeaning: An 18-carbon polyunsaturated fatty acid and the only omega-3 that plants supply; canola
  oil holds the most, and the body needs it for nutrition.
scope: This is the plant-based omega-3 with 18 carbons, not the longer-chain omega-3s from fish oil and
  not linoleic acid, its omega-6 cousin.
examples:
- Flaxseed oil is a rich source of alpha-linolenic acid.
- The body converts alpha-linolenic acid into other omega-3 fats, though only in small amounts.
