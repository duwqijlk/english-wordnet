simpleMeaning: a fruit that is much like a berry, from an elder plant, used for things like wines and
  jellies
scope: This is the fruit of the elder plant, used for wines and jellies; it is not the bush or small tree
  itself, which is the next row.
examples:
- She picked elderberries in late summer to make wine.
- Elderberry jelly is dark purple and a little sharp in taste.
