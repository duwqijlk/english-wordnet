simpleMeaning: Doctors sometimes use this colourless gas, an alkene that burns easily, to put people to
  sleep; it comes from oil and natural gas and goes into making many other chemicals.
scope: A gas used in making chemicals, not the gas that heats homes; also called ethylene.
examples:
- The plant burns ethene to make plastics.
- Doctors once used ethene to put patients to sleep before surgery.
