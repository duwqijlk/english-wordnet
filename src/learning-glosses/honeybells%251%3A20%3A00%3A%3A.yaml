simpleMeaning: an African bush that stays low, with stems that spread along the ground and slim yellow
  flowers that smell like honey, growing one at a time or in pairs
scope: 'Also called honey bell: a low African bush, not a flower that grows in a bunch and not a tree.'
examples:
- Honeybells spread low stems along the dry ground behind the house.
- We found honeybells with slim yellow flowers growing in pairs.
