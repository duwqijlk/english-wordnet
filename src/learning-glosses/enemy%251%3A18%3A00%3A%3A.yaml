simpleMeaning: a person who is armed and opposed to you, especially a soldier on the opposing side in
  a war
scope: This is an armed opponent, especially a soldier on the other side in a war, not an opposing army
  as a whole, not any hostile group of people, and not someone who is personally hostile to you.
examples:
- The soldiers captured three enemies during the raid.
- He refused to show mercy to a wounded enemy.
