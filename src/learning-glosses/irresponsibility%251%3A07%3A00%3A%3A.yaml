senseId: 'irresponsibility%1:07:00::'
synsetId: 04678103-n
simpleMeaning: a way of acting that shows a person cannot be trusted, does not care about what they should
  do, and does not feel answerable for what they do
scope: This is a lasting way a person acts and cannot be trusted, not one single careless act and not
  being unable to do a job.
examples:
- His irresponsibility at work cost him his job.
- The manager was angry about their irresponsibility with money.
