simpleMeaning: modest or shy in a put-on way, most of all in a playful or teasing way
scope: Modest or shy in a put-on way, most of all in a playful or teasing way, also called demure; not
  truly shy and not a wary refusal of approaches.
examples:
- She gave a coy smile and looked away.
- She gave a coy laugh and pretended not to want the praise.
