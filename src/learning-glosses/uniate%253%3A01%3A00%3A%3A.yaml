simpleMeaning: Of former Eastern Christian churches that came under the rule of the Church of Rome but
  kept their own rites and ways and church law.
scope: Of Eastern churches that joined Rome yet kept their own rites and law, set apart from the Eastern
  churches that stayed outside Rome.
examples:
- The Uniate churches keep their old rites.
- She attends a Uniate parish that follows Rome.
