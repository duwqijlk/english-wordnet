simpleMeaning: In the study of machines that work with numbers, a way of building such a machine with
  very many orders built into its main chip
scope: In the study of machines that work with numbers, a way of building a machine with very many orders
  built into its main chip; complex instruction set computing is another name for this sense, not a machine
  with few orders and not the chip on its own.
examples:
- The complex instruction set computer has very many orders built into its main chip.
- Engineers chose a complex instruction set computer for the new machine.
