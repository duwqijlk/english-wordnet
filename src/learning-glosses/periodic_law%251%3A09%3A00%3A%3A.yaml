simpleMeaning: The number of tiny parts at the heart of each atom fixes where a bit of matter falls in
  the set pattern of how it acts, in chemistry.
scope: In chemistry, this is the rule by which the ways a bit of matter acts fall into a set pattern.
examples:
- Under the periodic law, elements with like atom counts act alike.
- By the periodic law, the ways an element acts follow from its atom count.
