simpleMeaning: This tree of tropical America bears a small fruit you can eat, its green skin tough and
  its flesh sweet, juicy and clear.
scope: Also called genip, ginep and mamoncillo, this is a small fruit with green tough skin, not a berry
  and not a nut.
examples:
- We ate a honey berry straight from the tree.
- The honey berry has green tough skin and sweet flesh.
