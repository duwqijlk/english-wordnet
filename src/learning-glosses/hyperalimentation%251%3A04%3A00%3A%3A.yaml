simpleMeaning: The feeding of a liquid food with enough nutrition through a tube into the vena cava, a
  large vein, for long-term coma, severe burns or severe digestive conditions.
scope: This is the medical procedure of feeding a patient artificially, not ordinary eating or overeating,
  and not food given by mouth or into the stomach; the liquid goes straight into a large vein.
examples:
- The patient was put on hyperalimentation after surgery left her unable to eat.
- Hyperalimentation kept him nourished through weeks of severe burns.
