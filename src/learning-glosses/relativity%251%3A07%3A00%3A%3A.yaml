simpleMeaning: the state of having meaning only when you think of it together with something else
scope: Having meaning only when seen with something else, not the science idea about space and time.
examples:
- 'The relativity of size is clear: a mouse is big next to an ant but small next to a dog.'
- He talked about the relativity of good and bad in different places.
