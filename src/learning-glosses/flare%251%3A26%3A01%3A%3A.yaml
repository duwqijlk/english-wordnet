simpleMeaning: a sudden return of the signs of a sickness, or a sudden turn for the worse
scope: A sudden return of the signs of a sickness, or a sudden turn for the worse, not red skin spreading
  from a sore spot and not a burst of flame.
examples:
- A flare of her illness kept her in bed.
- The cold caused a flare of his cough.
