simpleMeaning: People with gout take this drug, sold as Zyloprim, when too much uric acid has built up
  in the body and needs bringing down.
scope: This drug, sold as Zyloprim, is taken to bring down too much uric acid in the body.
examples:
- The uric acid in the blood came down after allopurinol was taken.
- Gout eased once allopurinol had brought the uric acid down.
