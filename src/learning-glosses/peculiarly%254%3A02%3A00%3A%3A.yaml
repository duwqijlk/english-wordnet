simpleMeaning: in a way that is different from the usual way or from what people expect
scope: 'Also called curiously, oddly and inexplicably: in a way that is different from the usual way or
  from what people expect, not just more or stronger than usual and not in a way that belongs to only
  one person or thing.'
examples:
- He is behaving rather peculiarly today and will not talk to anyone.
- Her voice sounded peculiarly quiet after the loud party.
