simpleMeaning: to send a radio or TV show or other material out widely, using a machine in space that
  goes around the earth and sends signals back
scope: To send a show out in this way, not the machine in space itself and not a place or group that depends
  on a bigger one.
examples:
- The station will satellite the concert to listeners around the world.
- They satellited the news report to stations in other countries.
