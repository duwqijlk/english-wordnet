simpleMeaning: A wood made up mainly of broad-leaved trees that drop all their leaves in one season.
scope: A wood of broad-leaved trees that drop all their leaves in one season; not a wood of trees that
  keep their leaves and not a single tree.
examples:
- A deciduous forest drops all its leaves in autumn.
- We walked through the deciduous forest in spring.
