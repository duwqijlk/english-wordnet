senseId: unmeasured%5:00:00:immeasurable:00
synsetId: 01502766-s
simpleMeaning: Past all bounds in reach or bulk or amount.
scope: This sense is also called limitless, illimitable, and measureless, for being past all bounds in
  reach or bulk or amount, where illimitable is with no bounds of size, spread, or amount, and measureless
  is boundless in spread, size, or amount, unlike the sense for not built of counted beats, not in metre.
examples:
- The sea was unmeasured, past all bounds.
- The love was unmeasured, past all bounds in amount.
