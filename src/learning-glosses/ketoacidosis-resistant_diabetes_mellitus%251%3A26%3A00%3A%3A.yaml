senseId: 'ketoacidosis-resistant_diabetes_mellitus%1:26:00::'
synsetId: 14142418-n
simpleMeaning: A mild blood-sugar problem that develops slowly in adults; obesity, stress, menopause or
  other factors can trigger it; diet and blood-sugar-lowering drugs (hypoglycemic agents) usually control
  it without insulin.
scope: This is an older name for type 2 diabetes, the form in which acids rarely reach dangerous levels;
  it is not the childhood form needing insulin at once, nor the pregnancy-only form.
examples:
- The case notes recorded ketoacidosis-resistant diabetes mellitus, treated with diet and tablets.
- In older textbooks, ketoacidosis-resistant diabetes mellitus was the standard label for this illness.
