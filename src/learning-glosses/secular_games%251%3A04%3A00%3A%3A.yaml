simpleMeaning: Ancient Roman festival every hundred years to begin a new generation, a hundred years being
  the longest life; possibly from the fifth century BC, lasting well into Christian times.
scope: A festival of ancient Rome repeated once a century, not ordinary Roman games or shows.
examples:
- The secular games were staged to mark the beginning of a new age.
- Historians still debate when the first secular games took place.
