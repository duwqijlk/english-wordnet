simpleMeaning: a place on a machine run by power, such as a battery, where power goes in or comes out
scope: A place on a machine where power goes in or out, not an end of a magnet and not an end of the Earth.
examples:
- Connect the wire to the positive pole of the battery.
- The pole of the battery was marked with a plus sign.
