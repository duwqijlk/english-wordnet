simpleMeaning: a United States office that makes sure laws and rules on drugs and other controlled substances
  are kept, aiming to stop groups that move drugs
scope: This is a United States office that makes sure laws on drugs are kept, not a police force of a
  single state, and it is also called Drug Enforcement Administration and Drug Enforcement Agency.
examples:
- The DEA stopped the drug ring.
- Agents of the DEA seized the shipment.
