simpleMeaning: a low plant that lives many years, with many thin stems on the ground, white flowers, then
  big soft red fruit you can eat, with many small seeds spread outside
scope: This sense is the low plant itself, not just the red fruit on its own and not a red mark on the
  skin.
examples:
- Strawberry plants spread quickly across the garden bed.
- She grew strawberry plants that had white flowers in spring.
