simpleMeaning: a kind of strong, thick dog with short hair, a large head, and a strong lower jaw that
  sticks out; began in England, where people used it to fight bulls
scope: This is a kind of dog; it is not the verb for throwing a cow down by its horns.
examples:
- Our bulldog has short hair and a very large head.
- She chose a bulldog because she liked its thick body and short hair.
