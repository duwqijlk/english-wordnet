simpleMeaning: a person who studies insects and gathers and studies moths and the winged insects that
  fly by day
scope: A person who gathers and studies moths and day-flying winged insects, also called a lepidopterist
  or a lepidopterologist, not a person who studies all insects in general and not a hunter of wild animals.
examples:
- The butterfly collector spent the morning netting moths in the meadow.
- As a butterfly collector, she kept careful notes on every moth and butterfly she caught.
