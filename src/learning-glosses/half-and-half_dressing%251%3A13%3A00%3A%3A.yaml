simpleMeaning: A salad dressing made of equal parts mayonnaise and vinaigrette, with minced garlic, mashed
  anchovies and grated Parmesan; it suits mixed salads especially well.
scope: A salad dressing made by combining mayonnaise and vinaigrette, not either one used on its own and
  not a plain mayonnaise dressing.
examples:
- The chef finished the greens with a half-and-half dressing.
- I make a half-and-half dressing with anchovies and Parmesan for mixed salads.
