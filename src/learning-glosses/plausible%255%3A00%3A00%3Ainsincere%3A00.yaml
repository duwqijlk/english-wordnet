simpleMeaning: ready to put forward claims that sound true but are not
scope: This is about a person who argues with claims that only sound true; not an excuse or story that
  seems reasonable and convincing.
examples:
- He was a plausible liar, and many people believed him.
- The plausible salesman gave reasons that sounded good but were false.
