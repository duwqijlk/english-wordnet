simpleMeaning: a person hired by someone to find out facts and help look into crimes
scope: 'Also called operative, private detective, private investigator, shamus, and sherlock: a person
  hired to find out facts and help look into crimes, not a police officer and not a person who guards
  a place.'
examples:
- They hired a private eye to track down the thief.
- The private eye waited outside the house all night.
