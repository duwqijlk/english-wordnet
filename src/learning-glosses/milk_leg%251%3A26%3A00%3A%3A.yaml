simpleMeaning: A painful block in the big vein of the lower limb after a woman gives birth.
scope: 'Also called phlegmasia alba dolens: a painful block in the big vein of the lower limb after a
  woman gives birth, not a cramp and not a swelling from standing.'
examples:
- Milk leg left her in pain for weeks after the birth.
- The doctor said the milk leg came from a blocked vein.
