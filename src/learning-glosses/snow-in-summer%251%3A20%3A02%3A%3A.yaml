scope: A one-year spurge of the western United States with showy white-bracted flower clusters and very
  poisonous sap, also called ghost weed or snow-on-the-mountain; not a garden flower and not a shrub.
examples:
- Snow-in-summer bloomed white along the dry roadside.
- The snow-in-summer had a sap so harmful that children were kept away.
