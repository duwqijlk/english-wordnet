simpleMeaning: a company that sells special articles, stories, or photos to newspapers, so they can print
  them at the same time
scope: This is a news company that sells material to newspapers; it is not a group of criminals working
  together, and not the act of forming a group.
examples:
- The story came from a news syndicate and ran in papers across the country.
- A syndicate sold the photos to many newspapers at the same time.
