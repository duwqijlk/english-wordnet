simpleMeaning: one of various animals that usually live on land, look like a lizard, and go back to water
  only to breed
scope: This is the small animal that lives on land and in water and looks like a lizard, not a metal rod
  with a handle used to stir a fire.
examples:
- A salamander hid under the wet leaves near the pond.
- The children found a salamander that had come back to the water to breed.
