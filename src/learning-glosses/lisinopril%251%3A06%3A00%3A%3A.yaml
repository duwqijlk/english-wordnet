simpleMeaning: a drug that blocks ACE, a body chemical that tightens blood tubes, sold as Prinivil or
  Zestril and given to bring down high blood pressure and after heart attacks
scope: A drug that blocks ACE to bring down high blood pressure, sold as Prinivil or Zestril; not a drug
  that slows the heart and not a water pill.
examples:
- The doctor gave her lisinopril after her heart attack.
- Lisinopril brought his blood pressure down within a week.
