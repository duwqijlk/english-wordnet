simpleMeaning: to beat an opponent by only a very small amount
scope: This is the verb for winning by a small margin, not the noun senses for the front of an aircraft
  or a tool.
examples:
- Our candidate nosed out the incumbent by just forty votes.
- The underdogs nosed out the champions by a single point at the buzzer.
