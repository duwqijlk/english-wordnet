simpleMeaning: Puzzled by many things that clash with each other, and left unable to think straight
scope: Puzzled by many things that clash with each other, also called lost, confused, bewildered, baffled,
  bemused, confounded, befuddled, at sea and mixed-up; not simply tired, and not afraid.
examples:
- She felt mazed by the clashing orders.
- The mazed clerk could not think straight.
