simpleMeaning: the ceremony in which a new monarch, a king or queen or emperor, is given power
scope: The crowning of a new monarch, a king or queen or emperor, not the crowning of a winner in a contest
  and not a royal wedding.
examples:
- Crowds filled the streets for the coronation of the young queen.
- The coronation took place in the great abbey.
