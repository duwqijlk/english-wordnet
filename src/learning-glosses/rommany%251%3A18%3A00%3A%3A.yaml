simpleMeaning: A dark-skinned, dark-haired person speaking Romany, traditionally living by seasonal work
  and fortune-telling, believed to come from northern India, now worldwide, mostly in Europe, North Africa
  and North America.
scope: A member of the Romani people, with dark skin and hair, speaking Romany and living by seasonal
  work and fortune-telling; also called Gypsy, Gipsy, Bohemian, Roma, Romani and Romany.
examples:
- The Rommany travel from town to town for seasonal work.
- Many Rommany speak Romany at home.
