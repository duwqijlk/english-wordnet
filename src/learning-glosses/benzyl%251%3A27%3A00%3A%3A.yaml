simpleMeaning: a group of atoms from toluene, a clear liquid, with one free link to join to something
  else
scope: 'Also called benzyl group and benzyl radical: a group of atoms from toluene with one free link,
  not a whole molecule and not a group from a different liquid.'
examples:
- The benzyl group joined to the oxygen in the new compound.
- Chemists use benzyl to build larger molecules.
