synsetId: 06019932-n
simpleMeaning: 'The fixed places used to say where things are: a thing left alone in them does not speed
  up, slow down, or turn'
scope: The fixed places used to say where things are, where a thing left alone does not speed up, slow
  down or turn, also called an inertial frame; not a frame that speeds up or turns.
examples:
- The scientist worked in an inertial reference frame to track the satellite.
- An inertial reference frame lets you say where a moving ship is without the frame itself turning.
