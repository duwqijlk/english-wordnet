simpleMeaning: A dive in which the diver folds at the waist to touch the ankles, then straightens out
  again.
scope: A dive in which the diver folds at the waist to touch the ankles, then straightens out again, not
  the act of diving in that way and not a large folding knife.
examples:
- Her jackknife was clean, with her hands touching her ankles.
- He scored well with a neat jackknife from the high board.
