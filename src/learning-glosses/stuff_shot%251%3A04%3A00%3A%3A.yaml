simpleMeaning: in basketball, pushing the ball down into the basket from above
scope: 'Also called a dunk or a dunk shot: in basketball, pushing the ball down into the basket, not throwing
  it up from far away and not a shot that misses.'
examples:
- He scored with a stuff shot, pushing the ball down through the hoop.
- Her stuff shot over the defender went straight down into the basket.
