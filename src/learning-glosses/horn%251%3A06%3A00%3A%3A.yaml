senseId: 'horn%1:06:00::'
synsetId: 03399752-n
simpleMeaning: a brass musical instrument; its tube gets wider along its length, is curled round and round,
  and is played by pressing parts to change the sound
scope: A brass musical instrument whose tube is curled round in a ring; not the other brass horn with
  a thin tube and a bright sound, not a horn on an animal's head, and not a horn in a car.
examples:
- The French horn has a long tube curled into a round shape.
- She held the horn with one hand resting inside its wide end.
