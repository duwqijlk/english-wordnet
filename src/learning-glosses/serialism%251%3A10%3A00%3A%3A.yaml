simpleMeaning: music of the 1900s built on a fixed order of notes used as the main idea of a piece
scope: A kind of music from the 1900s built on a fixed order of notes, also called serial music; not a
  free tune and not a song with words.
examples:
- The composer wrote a piece of serialism for the string quartet.
- In her serialism, the same notes came back in a set order.
