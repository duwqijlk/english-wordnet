simpleMeaning: A pain in the head caused by blocked or infected air spaces beside the nose
scope: A head pain caused by blocked or infected air spaces beside the nose, not a head pain from tiredness
  or from a blow.
examples:
- A sinus headache woke her with pressure behind her eyes.
- His sinus headache eased once the blocked passages began to clear.
