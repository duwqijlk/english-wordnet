simpleMeaning: This doctor treats the ear and the sicknesses that can hit it
scope: A doctor for the ear and its sicknesses, also called ear doctor and ear specialist; not a doctor
  for the whole body and not a doctor for the eye.
examples:
- The otologist looked inside her ear.
- Our otologist treats children with ear infections.
