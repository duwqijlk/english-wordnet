simpleMeaning: A print made by a stencil, the picture laid on a very fine mesh screen, and ink pressed
  through the bare parts of the screen onto the printing face.
scope: A print made by a stencil, the picture laid on a very fine mesh screen, and ink pressed through
  the bare parts of the screen onto the printing face; also called serigraph or silk screen print; not
  to print by silkscreen.
examples:
- Their silkscreen hung in the hall.
- The silkscreen was pulled at noon.
