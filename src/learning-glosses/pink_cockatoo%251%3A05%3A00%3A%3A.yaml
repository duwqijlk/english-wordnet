simpleMeaning: A white bird of Australia, a kind of parrot, with feathers touched with rose colour.
scope: This is a white bird of Australia, a kind of parrot, with feathers touched with rose colour; not
  a grey parrot, and not a bird with feathers of one plain colour.
examples:
- The pink cockatoo showed rose feathers in the sun.
- Pink cockatoos live in the dry parts of Australia.
