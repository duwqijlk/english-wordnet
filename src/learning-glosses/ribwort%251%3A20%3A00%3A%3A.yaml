simpleMeaning: an Old World plantain with long thin leaves marked by raised lines, now grown widely in
  mild parts of the world
scope: Not a grass, and not a tall shrub; also called buckthorn, narrow-leaved plantain, ribgrass and
  ripple-grass.
examples:
- Ribwort grew thick along the field edge.
- The ribwort leaves were long and thin.
