simpleMeaning: Making the front of the gland below the brain let out the messenger that wakes the thyroid,
  this chemical messenger comes from a small part at the brain's base.
scope: Also called protirelin and thyrotropin-releasing hormone, this chemical messenger comes from a
  small part at the base of the brain and tells the front of the gland below the brain to let out the
  messenger that wakes the thyroid.
examples:
- The thyrotropin-releasing factor told the pituitary to let out its hormone.
- Thyrotropin-releasing factor reached the front of the gland below the brain and set off the next step.
