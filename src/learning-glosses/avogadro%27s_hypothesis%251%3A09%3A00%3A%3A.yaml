simpleMeaning: The rule that equal amounts of space hold equal numbers of tiny gas parts, at the same
  heat and push, for every gas.
scope: 'Also called Avogadro''s law: the rule that equal amounts of space hold equal numbers of tiny gas
  parts at the same heat and push, for every gas.'
examples:
- Avogadro's hypothesis tells us that equal volumes of gas hold equal numbers of molecules.
- By Avogadro's hypothesis, a litre of oxygen and a litre of nitrogen hold the same number of molecules
  at the same heat and push.
