simpleMeaning: the act of cutting into an edge so it has cuts like teeth or sharp angled cuts
scope: This is cutting into an edge, not the small pits left by rust damage on a surface, and not the
  space left at the start of a line of writing.
examples:
- The indentation of the board's edge was made by cutting a row of small, tooth-like cuts.
- Deep indentation left sharp, angled cuts along the edge of the metal sheet.
