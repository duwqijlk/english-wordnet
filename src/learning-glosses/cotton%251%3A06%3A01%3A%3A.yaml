simpleMeaning: thread made from the soft fibers of a plant
scope: This is thread made from plant fibers, not cloth woven from them, not the raw fibers themselves,
  and not the plant.
examples:
- She used white cotton thread to sew the button back on.
- The cotton thread broke while he was sewing the shirt.
