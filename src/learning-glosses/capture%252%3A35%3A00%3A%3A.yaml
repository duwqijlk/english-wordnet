simpleMeaning: to take something in a way like hunting it down, or like catching it in a trap or a net
scope: 'Catch is another name for this sense: to take something in a way like hunting it, or in a trap
  or a net. Not catching a person after a chase, and not showing an idea or feeling.'
examples:
- He captured the rabbit with a trap in the field.
- They captured two foxes by setting nets in the woods.
