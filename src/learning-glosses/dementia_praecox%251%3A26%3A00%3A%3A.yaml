simpleMeaning: Any of a set of mind illnesses that twist what is real, upset thought and speech, and pull
  a person away from other people
scope: Any of a set of mind illnesses that twist what is real; also called schizophrenia, schizophrenic
  disorder and schizophrenic psychosis, not a short mood change and not a loss of memory.
examples:
- His dementia praecox made him hear things that were not real.
- Dementia praecox left her cut off from friends and family.
