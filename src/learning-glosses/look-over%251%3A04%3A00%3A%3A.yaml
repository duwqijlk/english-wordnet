senseId: 'look-over%1:04:00::'
synsetId: 00144446-n
simpleMeaning: A quick check that does not take in every part of a thing.
scope: Also called a once-over, this is a fast check that does not take in every part, not a slow careful
  study and not a search for a missing thing.
examples:
- She gave the room a quick look-over before the guests arrived.
- He did a look-over of the car and then drove off.
