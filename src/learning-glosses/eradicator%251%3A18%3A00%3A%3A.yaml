simpleMeaning: A person who wipes out pests, above all one whose job is to kill rodents and insects that
  cause trouble.
scope: A person who wipes out pests, also called exterminator and terminator; not a person who traps animals
  alive and not a person who sprays crops.
examples:
- The eradicator cleared the rats from the old warehouse in a week.
- They called in an eradicator when insects took over the kitchen.
