scope: A person who wrecks things on purpose or makes crashes happen, also called a saboteur and a wrecker;
  not a soldier in open battle and not a person who breaks things by accident.
examples:
- The diversionist cut the rail line at night.
- Police caught the diversionist before the bridge fell.
