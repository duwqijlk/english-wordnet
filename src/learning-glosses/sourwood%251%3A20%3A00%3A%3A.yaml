simpleMeaning: A shrub-like tree that sheds its leaves, from the east of North America, its bark cut deep,
  its sprays of little blooms, white and sweet, matched by sour leaves.
scope: This sense is also called sorrel tree and titi.
examples:
- A sourwood grew in the east.
- Sourwoods bear sour leaves.
