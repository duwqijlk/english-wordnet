simpleMeaning: A woman who is sharply watchful and unpleasant to be around.
scope: This sense describes a harsh, watchful woman; it is not the mythical fire-breathing monster.
examples:
- The new headmistress was a real dragon who watched every pupil closely.
- Everyone called the stern old woman a dragon behind her back.
