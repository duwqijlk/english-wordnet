simpleMeaning: a sweet juice that a flower makes, which draws in the small creatures that carry pollen
  from flower to flower
scope: The sweet juice flowers make, not the food and drink of the gods in old stories and not fruit juice.
examples:
- The bees took nectar from the flowers all morning.
- Nectar draws insects to the flower.
