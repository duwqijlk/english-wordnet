simpleMeaning: a place under a curved roof or arch where a sound made in one place can be heard plainly
  at a place far away
scope: 'Also called whispering dome: a place under a curved roof or arch where a sound made in one place
  is heard plainly at a far place, not a place for showing art and not a hall for loud music.'
examples:
- The whispering gallery let us hear a friend's soft words from far across the hall.
- Children love the whispering gallery, where a murmur on one side is heard on the other.
