simpleMeaning: a substance that usually dissolves and is used to add or change colour in cloth, hair,
  or other materials
scope: A colouring substance for cloth or hair, also called dyestuff, rather than the act of using it
  or the laboratory method of colouring specimens for microscopy.
examples:
- They used a natural dye made from berries.
- This dye works best on cotton and linen.
