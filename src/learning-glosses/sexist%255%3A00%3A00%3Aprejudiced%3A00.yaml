senseId: sexist%5:00:00:prejudiced:00
synsetId: 00286929-s
simpleMeaning: treating people in an unfair way because of their sex, usually said of men's way of thinking
  about women
scope: This describes a view, act, or words that treat people unfairly because of their sex, usually men's
  way of thinking about women; it is not the noun for a man who holds that view.
examples:
- His sexist remarks about women drivers angered everyone in the room.
- She called the rule sexist because it treated girls in a different, unfair way.
