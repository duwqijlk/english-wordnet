simpleMeaning: when a hollow part of the body grows wider or swells up
scope: 'Also called ectasia: when a hollow part of the body grows wider or swells, not a solid part growing
  bigger and not a wound.'
examples:
- The scan showed ectasis in the bladder, which had grown too wide.
- The ectasis in the aorta grew wider over the year.
