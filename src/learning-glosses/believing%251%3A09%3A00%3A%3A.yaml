simpleMeaning: the process in the mind that leads a person to be sure that something is true
scope: This sense is the whole process in the mind that ends in being sure, not one single thought and
  not a strong feeling on its own.
examples:
- Seeing is believing, as the old saying goes.
- For him, believing came slowly, only after he had checked all the facts.
