simpleMeaning: The people and firms of the United States get their mail handled and delivered by a part
  of the government on its own.
scope: Also called United States Postal Service and US Postal Service, this is a group on its own in the
  government that takes care of the mail, not the Post Office and not a private firm.
examples:
- The USPS delivered the letter to our house in three days.
- She sent the box by USPS because it was the cheapest way.
