simpleMeaning: The work of changing software so that some part of it works better or uses fewer resources
scope: 'Also called program optimization, software optimisation, and software optimization: the work of
  making a computer system run better, not the act of writing a new system and not the testing of one.'
examples:
- Program optimisation cut the app's start time in half.
- The team spent a week on program optimisation to lower memory use.
