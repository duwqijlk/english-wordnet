simpleMeaning: A small spotted sea animal of the coasts of the northern half of the world
scope: A small spotted sea animal of the coasts of the northern half of the world, not a grey seal and
  not a sea lion; common seal is another name for this sense.
examples:
- A harbor seal rested on the rocks at low tide.
- Harbor seals live along northern coasts.
