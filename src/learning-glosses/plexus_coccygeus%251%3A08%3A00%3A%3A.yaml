scope: 'Also called the coccygeal plexus: a small knot of nerves at the lower back, not a knot of nerves
  in the neck and not a single nerve.'
examples:
- The plexus coccygeus is a small knot of nerves near the tailbone.
- The doctor pointed to the plexus coccygeus on the chart.
