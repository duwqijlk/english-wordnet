simpleMeaning: a long pole that rises up and back from a boat's mast and holds the top of a four-sided
  sail that runs front to back
scope: This is the long pole that holds a sail on a boat, not the sharp metal point put on the leg of
  a fighting cock.
examples:
- The gaff held the top of the sail high above the deck.
- The crew raised the gaff to lift the sail into place.
