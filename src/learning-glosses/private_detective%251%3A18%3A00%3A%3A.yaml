simpleMeaning: a person you can hire to find out facts and help look into crimes
scope: 'Also called operative, private eye, private investigator, shamus, and sherlock: a person hired
  to find out facts and help look into crimes, not a police officer and not a person who guards a place.'
examples:
- The family hired a private detective to find the missing papers.
- A private detective followed the man and took notes.
