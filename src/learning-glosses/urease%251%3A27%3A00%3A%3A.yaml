simpleMeaning: In the germs of the gut lives a body chemical that splits urea into carbon dioxide and
  ammonia.
scope: A body chemical that splits urea into carbon dioxide and ammonia, found in the germs of the gut,
  not urea itself.
examples:
- Urease in the gut breaks urea down into simpler gases.
- The lab added urease to the sample to split the urea.
