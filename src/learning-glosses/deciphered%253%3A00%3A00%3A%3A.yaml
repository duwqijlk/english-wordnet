simpleMeaning: changed from a secret code or hard language into clear language that people can understand
scope: This is for language that was in a secret code or a hard form and is now clear; it is not language
  that is still in code, and not plain language that was clear from the start.
examples:
- The deciphered message told them where to meet.
- We read the deciphered letter with ease.
