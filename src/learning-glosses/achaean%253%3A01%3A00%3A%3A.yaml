simpleMeaning: Said of Achaea, or of the old Greek people who lived there
scope: Used to describe things from Achaea or its old Greek people, not the people themselves and not
  a member of a language group of the prehistoric Greeks.
examples:
- The Achaean coast was home to old Greek towns.
- An Achaean pot was found in the ruins.
