senseId: 'masdevallia%1:20:00::'
synsetId: 12093223-n
simpleMeaning: A tufted evergreen orchid, often small, with many-colored flowers that usually look like
  a three-cornered hat and have their outer flower parts joined into a tube at the base.
scope: One of many named kinds of tufted orchid; it is not a slipper orchid, whose flowers have a pouch,
  and not a moth orchid.
examples:
- The masdevallia produced a vivid orange flower.
- She keeps several masdevallias in a cool greenhouse.
