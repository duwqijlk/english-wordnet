simpleMeaning: to draw an animal near by copying the sound that kind of animal makes
scope: This is not just making an animal's sound; it is using a copy of that sound to bring the animal
  closer.
examples:
- The hunter called the ducks toward the blind.
- He learned to call deer by copying their mating sound.
