simpleMeaning: Being worn out leaves a person dull and with no wish to do anything
scope: Also called logginess, this is a dull state with no wish to do anything after being worn out, not
  sleepiness and not a sickness.
examples:
- After the long walk, a heavy loginess settled over her.
- His loginess kept him on the sofa all afternoon.
