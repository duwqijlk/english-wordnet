simpleMeaning: Usually purple flowers with a fan-shaped lip of deep pink, marked with spots or stripes,
  grow on this plant of the Mediterranean
scope: This plant of the Mediterranean has flowers that are usually purple, each with a fan-shaped lip
  of deep pink, marked with spots or stripes; it is also called butterfly orchis, not the Mexican kind
  that grows on other plants.
examples:
- The butterfly orchid grew in the Mediterranean.
- Purple butterfly orchids bloomed.
