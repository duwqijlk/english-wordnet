simpleMeaning: this doctor cuts the blood pump in the chest open to put right what has gone wrong, knowing
  how it is built and works
scope: 'Also called cardiologist and heart specialist: a doctor who operates on the blood pump in the
  chest, not a doctor who only gives medicine and not a doctor for the lungs.'
examples:
- The heart surgeon will operate on Tuesday.
- A heart surgeon fixed the faulty valve in her chest.
