simpleMeaning: 'Nerves that fail to work do not cause it: this word is about a sickness of the muscles'
scope: To do with a sickness of the muscles that does not come from the nerves, not a sickness of the
  nerves themselves and not a hurt muscle.
examples:
- Her myopathic weakness came from the muscles, not the nerves.
- Doctors called the weakness myopathic, not nerve damage.
