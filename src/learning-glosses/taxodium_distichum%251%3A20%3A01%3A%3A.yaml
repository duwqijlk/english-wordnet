simpleMeaning: A common swamp tree of the south-east of the United States, with a trunk wide at the base;
  it grows in wet coastal swamps and in river lands that flood.
scope: 'Also called bald cypress, pond bald cypress, southern cypress and swamp cypress: a common swamp
  tree of the south-east of the United States with a trunk wide at the base, growing in wet coastal swamps
  and river lands that flood, not a dry-land tree with a straight narrow trunk.'
examples:
- Taxodium distichum stood in the coastal swamp with its trunk wide at the base.
- We saw Taxodium distichum in the river lands that flood each year.
