simpleMeaning: A common harmless bush of eastern North America with waxy leaves made of small leaflets
  and green clustered flowers followed by red berries.
scope: Also called scarlet sumac, smooth sumac and vinegar tree; a harmless bush of eastern North America,
  not a poison bush and not a tree.
examples:
- The Rhus glabra grows across eastern North America.
- Rhus glabra has red berries after its green flowers.
