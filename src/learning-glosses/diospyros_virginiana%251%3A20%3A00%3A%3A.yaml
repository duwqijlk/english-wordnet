simpleMeaning: A medium-sized tree of dry woods in the southern and eastern United States, bearing yellow
  or orange fruit that puckers the mouth but can be eaten when fully ripe
scope: This is a medium-sized tree of dry woods in the southern and eastern United States, with yellow
  or orange fruit; possumwood and American persimmon are other names for this sense, and it stands apart
  from other fruit trees by its fruit, which puckers the mouth until fully ripe.
examples:
- Diospyros virginiana grows in the dry woods of the south.
- The Diospyros virginiana fruit can be eaten when fully ripe.
