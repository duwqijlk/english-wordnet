simpleMeaning: to break open suddenly, moving outward, usually making a noise.
scope: This is something breaking open and moving outward, usually with a noise, not forcing another thing
  to split, not coming open from pressure inside, and not the noun naming the event.
examples:
- The water pipe burst in the freezing night.
- A balloon burst somewhere behind us, making everyone jump.
