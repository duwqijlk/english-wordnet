simpleMeaning: To reach a person or place by telephone, radio, or a similar means and make contact with
  them.
scope: This means making contact by phone or radio, not catching someone after a chase, not becoming ill,
  and not understanding something correctly.
examples:
- I tried to get the office on the phone all morning, but the line was busy.
- The radio operator finally got the ship just before midnight.
