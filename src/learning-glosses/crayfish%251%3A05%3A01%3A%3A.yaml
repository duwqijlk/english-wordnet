senseId: 'crayfish%1:05:01::'
synsetId: 01987336-n
simpleMeaning: A large sea animal with a hard, spiny shell that can be eaten, like a lobster but without
  the big claws true lobsters have.
scope: Also called a crawfish, a langouste, a rock lobster, a sea crawfish, and a spiny lobster; a sea
  animal like a lobster but without big claws, not the warm-water lobsters of the other sense, not the
  small freshwater kind, and not the tiny ones boiled for food.
examples:
- The fisherman pulled a crayfish from the trap.
- They served grilled crayfish with lemon.
