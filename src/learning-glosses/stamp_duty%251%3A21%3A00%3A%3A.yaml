simpleMeaning: A tax collected by requiring a stamp to be bought and attached, usually on documents or
  publications.
scope: Stamp tax is another name for this tax, taken when a mark must be bought and fixed to papers, most
  often on documents or printed matter.
examples:
- They paid the stamp duty on the papers.
- The stamp duty was charged on the printed matter as well.
