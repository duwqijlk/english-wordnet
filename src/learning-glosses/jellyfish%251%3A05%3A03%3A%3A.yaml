simpleMeaning: a large sea animal made of many small parts joined together, with a bag-like float and
  stinging arms
scope: A large sea animal made of many small parts joined together, with a bag-like float and stinging
  arms; not the common soft sea animal that swims free.
examples:
- The Portuguese man o' war is a jellyfish with a float and stinging arms.
- The jellyfish drifted on top of the water, its float in the air.
