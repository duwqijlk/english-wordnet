simpleMeaning: The wish to hurt others, shown by being mean, spiteful, or nasty.
scope: The wish to hurt others, shown by being mean, spiteful, or nasty; spite, nastiness, spitefulness
  and cattiness are other names for this sense, not a single angry outburst and not simple rudeness.
examples:
- Her bitchiness showed in every remark she made.
- He was tired of the bitchiness in the office.
