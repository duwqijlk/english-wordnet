senseId: 'police_blotter%1:10:00::'
synsetId: 06514849-n
simpleMeaning: A daily written list of what happened, such as arrests, kept at a station where officers
  work
scope: A daily written record of events at a station where officers work; not a personal diary, and not
  a newspaper report of crimes.
examples:
- The arrest was written up in the police blotter.
- Reporters check the police blotter each morning.
