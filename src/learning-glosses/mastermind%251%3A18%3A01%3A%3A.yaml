senseId: 'mastermind%1:18:01::'
synsetId: 10146463-n
simpleMeaning: a person who can think and learn far better than most people, and who can think of new
  ideas that no one has thought of before
scope: Also called wonder, brain, genius and brainiac, this is a very clever person who thinks of new
  ideas, not just a person who is good at school work.
examples:
- The young mastermind solved problems that older scientists could not.
- Mozart was a mastermind in music from a very early age.
