simpleMeaning: a blood tube carrying blood away from egg-making organs; the right one ends in the main
  belly blood tube, the left one in the left kidney blood tube
scope: One of the blood tubes that carry blood away from an egg-making organ, also called vena ovarica;
  not a blood tube in the leg or the arm.
examples:
- The surgeon tied off the ovarian vein during the operation.
- An ovarian vein carries blood away from the ovary toward the kidney.
