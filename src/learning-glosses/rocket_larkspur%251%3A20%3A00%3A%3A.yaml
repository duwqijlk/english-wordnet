simpleMeaning: A single unbranched upright spike of blue, sometimes pink or purple, flowers rises from
  this garden-grown southern European larkspur; it is sometimes classed with the delphiniums.
scope: A garden larkspur from southern Europe with one unbranched flower spike, not the branched larkspurs
  or the salad plant also called rocket.
examples:
- The rocket larkspur by the wall sent up a single spike of cornflower-blue flowers.
- She sowed rocket larkspur for its clear blue spikes, though some plants came up pinkish.
