simpleMeaning: In a pot, this small plant with cones, or bush, is cut so its top stays flat and its branches
  grow uneven, and it keeps its leaves all year.
scope: A small plant with cones, or a bush, grown in a pot with a flat top and uneven branches.
examples:
- The ming tree on her desk had a flat top and branches that spread out unevenly.
- He watered the little ming tree and trimmed it to keep its top flat.
