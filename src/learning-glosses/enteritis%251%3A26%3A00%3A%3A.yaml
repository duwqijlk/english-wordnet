simpleMeaning: A swelling with heat and pain of the gut, above all the small gut, that most often brings
  loose watery stools.
scope: A swelling with heat and pain of the gut, above all the small gut, that most often brings loose
  watery stools, not a swelling of the stomach alone and not a block in the gut.
examples:
- Enteritis left him with loose watery stools for days.
- The doctor said enteritis was causing her gut pain.
