simpleMeaning: Sweet sky-coloured berries follow pink to coral red flowers on a low plant in clumps, losing
  its leaves in winter, from the north and high mountains of North America.
scope: Also called dwarf bilberry; it is a low northern bush, not a tall berry bush grown for fruit.
examples:
- We picked dwarf blueberries along the mountain path.
- The dwarf blueberry bushes were full of sweet fruit.
