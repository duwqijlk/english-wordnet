synsetId: 00430013-v
simpleMeaning: to make something smaller in amount, size, or level.
scope: This is not to boil a liquid down until it thickens, not to change something into another form,
  and not to lower someone in rank or position; it means to make an amount, size, or level smaller.
examples:
- We need to reduce the amount of waste we produce.
- The medicine reduced her pain within an hour.
