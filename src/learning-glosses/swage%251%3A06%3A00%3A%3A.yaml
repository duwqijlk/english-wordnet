simpleMeaning: The end of a bar, a rivet, and the like grow thicker or wider when this tool hits or presses
  the metal.
scope: Upset is another name for this tool that makes the end of a bar, a rivet, and the like thicker
  or wider by hitting or pressing the metal.
examples:
- The smith used a swage to thicken the end of the iron bar.
- A few blows with the swage spread the hot metal wider.
