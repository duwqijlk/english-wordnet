simpleMeaning: a way the mind works in which sounds or other things that are not seen bring about the
  sense of seeing colours
scope: Seeing colours when something not seen sets it off, with chromesthesia as another name for this
  sense, and not ordinary colour vision or a fault of the eyes.
examples:
- Sounds can set off her chromaesthesia, so a bell makes her see blue.
- His chromaesthesia means music brings colours to mind.
