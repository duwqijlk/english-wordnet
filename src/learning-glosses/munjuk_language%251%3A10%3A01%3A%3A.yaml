simpleMeaning: A Chadic tongue spoken south of Lake Chad, above all in the Far North Region, in the Mayo-Danay
  division and the Maga subdivision.
scope: This is one Chadic tongue of the Lake Chad area, also called Mulwi, Mulwi language, Munjuk, Musgu
  and Musgu language; its near kin are the other Chadic tongues of the same region.
examples:
- Munjuk language is spoken south of Lake Chad.
- People use the Munjuk language in the Maga subdivision.
