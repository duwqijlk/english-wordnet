simpleMeaning: Short wings and big feet mark these birds of Australasia, which lay their eggs in mounds
  of rotting plants they build, the heat hatching the eggs.
scope: Also called megapode, mound-bird, mound bird, and mound builder, these are big-footed, short-winged
  birds of Australasia that hatch their eggs in mounds of rotting plants, not birds that sit on their
  eggs to warm them.
examples:
- The scrub fowl built a mound of rotting plants for its eggs.
- We watched a scrub fowl heap up rotting plants around its eggs.
