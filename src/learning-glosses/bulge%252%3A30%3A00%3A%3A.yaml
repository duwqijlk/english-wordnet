simpleMeaning: to get bigger and stick outwards
scope: This verb means to swell and stick out by itself, also called pouch and protrude; it is not the
  noun for the raised part, and not making something else swell.
examples:
- His stomach bulged after the big meal.
- The pipe bulged as the water froze inside it.
