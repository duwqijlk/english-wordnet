synsetId: 04671415-n
simpleMeaning: the quality of a person who watches carefully for possible danger and acts in a safe way
scope: 'This is a lasting quality in a person''s character: being watchful for possible danger. It is
  not the good sense a person uses in one act to stay away from harm, and not the wider careful, wise
  quality of thinking before you act.'
examples:
- His natural caution made him check the road twice before crossing.
- A man of caution, he never climbed without a safety rope.
