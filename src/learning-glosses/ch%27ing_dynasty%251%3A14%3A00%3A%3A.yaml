simpleMeaning: The last imperial line of rulers of China, from 1644 to 1912, brought down by people who
  rose up against them; in this time China was ruled by the Manchu.
scope: 'Also called Qing, Ch''ing, Manchu, Manchu dynasty, or Qing dynasty: the last imperial line of
  rulers of China, from 1644 to 1912, brought down by people who rose up against them.'
examples:
- The Ch'ing dynasty ruled China until 1912.
- The Ch'ing dynasty fell to revolutionaries.
