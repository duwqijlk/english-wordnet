simpleMeaning: one of many kinds of very small animals (arachnids, animals with eight legs) that often
  live on animals or plants or in stored food, where they are not wanted
scope: This sense is one of the many kinds of very small animal that often live on animals, plants, or
  stored food, where they are not wanted; it is not a larger eight-legged animal such as a spider or a
  tick.
examples:
- Tiny mites were living in the stored flour.
- The dog kept scratching because mites were on its skin.
