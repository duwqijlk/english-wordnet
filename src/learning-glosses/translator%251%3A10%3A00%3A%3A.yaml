simpleMeaning: a piece of software that turns code written in one computer language into code in another
scope: A piece of software that turns one computer language into another, not a person who turns written
  words from one language into another, and not someone who speaks for people talking in different languages.
examples:
- The translator turns the old code into a form the new machine can run.
- We used a translator to change the program from C into Java.
