simpleMeaning: A female worker who plans how a firm or a well-known person is talked about in public.
scope: Also called public relations woman and publicity woman; a female worker who plans how a firm or
  a well-known person is talked about in public, not a reporter and not a seller.
examples:
- The PR woman planned the firm's first public event.
- The PR woman spoke to reporters about the firm's new plan.
