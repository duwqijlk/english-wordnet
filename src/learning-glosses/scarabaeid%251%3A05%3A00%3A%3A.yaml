simpleMeaning: Any of many kinds of thick-bodied beetles with hard spikes on their heads.
scope: A thick-bodied beetle with hard spikes on its head, also called scarabaean and scarabaeid beetle;
  not a stag beetle with great jaws and not a dung beetle that rolls dung.
examples:
- The scarabaeid has hard spikes on its head.
- We saw a scarabaeid in the garden.
