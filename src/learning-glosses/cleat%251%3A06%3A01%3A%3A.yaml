simpleMeaning: a thing for tying a rope to, usually with two short parts that stick out and that the rope
  goes around
scope: This is the piece you tie a rope around to hold the rope in place, not a part that sticks out from
  the bottom of a shoe to stop slipping and not a strip of wood or metal fixed to a surface to make that
  surface stronger.
examples:
- He tied the boat's rope around the cleat on the dock.
- Wind the rope around the cleat so the boat stays in place.
