simpleMeaning: Of or relating to the science of measuring and mapping oceans, seas, lakes and rivers
scope: Of or relating to the science of measuring and mapping waters, also called hydrographic; not of
  the study of land, and not of the study of weather.
examples:
- The hydrographical survey mapped the sea floor.
- Hydrographical charts show the depth of the harbour.
