simpleMeaning: A fungus with a wide-domed cap, cream with a hint of blue at the edge; waxy gills are blue-green
  to blue-grey, and a short stalk narrows sharply at the base.
scope: A fungus with a cream cap edged with blue, not a white button mushroom and not a toadstool.
examples:
- The Hygrophorus caeruleus has blue-green gills.
- We found a Hygrophorus caeruleus with a cream cap.
