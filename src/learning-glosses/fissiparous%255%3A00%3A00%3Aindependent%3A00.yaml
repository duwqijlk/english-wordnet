simpleMeaning: Describes a person or group that has broken away from another thing, plan or way of thinking,
  or that urges such a break.
scope: Describes a person or group that has broken away from another thing, plan or way of thinking, or
  that urges such a break; separatist and breakaway are other names for this sense, not a group that stays
  loyal and united.
examples:
- The fissiparous group broke away from the main party.
- A fissiparous faction urged the members to leave.
