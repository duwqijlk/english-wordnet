simpleMeaning: In a debate or a meeting of lawmakers, to put forward a plan for others to decide on
scope: Also called move, this is putting a plan before others to decide on in a debate or a formal meeting,
  not a plain suggestion and not a vote itself.
examples:
- She made a motion to end the debate.
- He made a motion that the club buy new books.
