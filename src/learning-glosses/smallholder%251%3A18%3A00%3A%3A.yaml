simpleMeaning: A person who owns or rents a small piece of farm land
scope: A person who owns or rents a small piece of farm land, not a great landowner and not a worker on
  another's farm.
examples:
- The smallholder grew enough food for his own family.
- Many smallholders rent their land from the village.
