simpleMeaning: A metal that can form many bonds, like chromium and tungsten in how it acts; it is used
  to make steel harder and stronger.
scope: A metal used to harden steel, not chromium and not tungsten; also called atomic number 42 and molybdenum.
examples:
- Mo is added to steel to make it harder.
- The lab tested Mo for its strength.
