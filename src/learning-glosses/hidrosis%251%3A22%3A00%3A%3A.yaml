simpleMeaning: The way the glands in the skin send out a salty liquid.
scope: The skin's glands sending out a salty liquid; sweating, perspiration and diaphoresis are other
  names for this sense, and this is not tears or any other liquid the body sends out.
examples:
- Hidrosis cooled his body as sweat covered his skin.
- The doctor noted hidrosis during the fever as the patient sweated.
