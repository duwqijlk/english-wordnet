simpleMeaning: To give someone power or authority, as is said of kings and emperors.
scope: This is the formal sense of granting power or authority, not the everyday sense of putting clothes
  on someone.
examples:
- The law clothes the courts with the authority to settle such disputes.
- The constitution clothes the president with the power to pardon.
