simpleMeaning: so unpleasant that it makes people feel strong dislike and disgust and want to turn away
scope: 'Also called wicked, foul, disgusting, revolting, distasteful, loathsome, repellent, repelling,
  skanky and repellant: so unpleasant it makes people feel disgust, not just a little bad.'
examples:
- The soup tasted yucky, so no one wanted to eat it.
- A yucky smell came from the old bin.
