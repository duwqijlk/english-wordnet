scope: 'Also called deprived: this describes people who have too little of the things needed for life,
  or who live in a place that is bad for health. Not just having little money.'
examples:
- Many disadvantaged children grow up without enough food or a safe home.
- The school gives extra help to disadvantaged families in the area.
