simpleMeaning: a small citrus tree or shrub from southeastern Asia with flattened round fruit, very sweet
  fragrant flesh and thin loose yellow-orange peel that comes off easily.
scope: Another name for mandarin and mandarin orange; this is the tree that bears the fruit, not the fruit
  itself.
examples:
- The mandarin orange tree needs warm winters and plenty of sun.
- We planted a mandarin orange tree beside the wall.
