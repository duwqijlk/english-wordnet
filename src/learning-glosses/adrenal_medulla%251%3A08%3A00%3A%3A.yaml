simpleMeaning: The inner part of the gland above the kidney, which makes the body chemical for fear and
  strain.
scope: The inner part of the gland above the kidney, not the outer part of the same gland and not the
  kidney itself.
examples:
- The adrenal medulla pours out its chemical when we are scared.
- In danger, the adrenal medulla acts within seconds.
