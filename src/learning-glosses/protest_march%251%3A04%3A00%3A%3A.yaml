simpleMeaning: a time when people walk together in the streets to show they are against something, usually
  in front of a government building, with no permit needed
scope: A walk by a group to show they are against something, usually at a government building and with
  no permit, not a street parade for fun and not a walk by soldiers.
examples:
- Hundreds joined the protest march outside the city hall.
- She took part in a protest march against the new law.
