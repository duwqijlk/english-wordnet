simpleMeaning: a low green shrub that keeps its leaves through winter in the far north of Europe, Asia,
  and America, and bears red fruit that is good to eat
scope: A low evergreen bush of the far north with red fruit you can eat, also called cowberry, foxberry,
  lingberry, lingonberry, and mountain cranberry; not a cranberry and not a raspberry bush.
examples:
- Lingenberry grows in the cold north, with red fruit on low green bushes.
- She gathered lingenberry fruit for jam.
