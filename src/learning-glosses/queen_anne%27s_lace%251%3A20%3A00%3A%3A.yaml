simpleMeaning: A Eurasian herb that has spread widely and now grows wild elsewhere, with finely cut leaves
  and flat-topped bunches of small white or yellowish flowers above thin yellowish roots.
scope: A wild Eurasian herb, also called wild carrot and Daucus carota; not the garden carrot grown for
  food and not other white-flowered weeds.
examples:
- Queen Anne's lace grows along the roadside in summer.
- She picked a bunch of Queen Anne's lace for the table.
