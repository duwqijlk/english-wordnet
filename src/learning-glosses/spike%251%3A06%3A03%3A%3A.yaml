simpleMeaning: a sharp point at the end of a long, thin piece of wood or metal
scope: A long thin sharp-pointed thing of wood or metal, not a point on a shoe or a fence, and not a holding
  device.
examples:
- He drove a wooden spike into the ground to mark the spot.
- One of the metal spikes caught his coat as he passed.
