simpleMeaning: Holy words written or cut on it or wound round it mark the round tube on a rod that Buddhists
  in Tibet use above all.
scope: This is the round tube on a rod that carries holy words and is used above all by Buddhists in Tibet.
examples:
- A prayer wheel with holy words on it turned on its rod.
- The prayer wheel spun round on its rod.
