senseId: 'hyperfocal_distance%1:07:00::'
synsetId: 05093770-n
simpleMeaning: The nearest point in front of a lens, set to focus on things far away, past which everything
  looks sharp and clear.
scope: The nearest point in front of a lens, set to focus on things far away, past which everything looks
  sharp and clear, not the nearest point at which a single thing can be seen.
examples:
- He set the hyperfocal distance so the whole street scene stayed sharp.
- With the hyperfocal distance set, the flowers and the hills were both clear.
