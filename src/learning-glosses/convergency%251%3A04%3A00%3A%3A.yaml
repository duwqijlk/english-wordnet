senseId: 'convergency%1:04:00::'
synsetId: 00147392-n
simpleMeaning: the act of things drawing nearer to each other
scope: This is the act of things coming closer together; converging and convergence are other names for
  this sense; not the act of things moving apart, and not a single meeting point.
examples:
- The convergency of the two roads made a sharp bend.
- The convergency of the lines could be seen on the map.
