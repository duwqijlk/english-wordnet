simpleMeaning: 'This craft flies up on motors that fire in turn: two or more of them, each with its own
  fuel, and each dropped off when its fuel is gone.'
scope: Multistage rocket is another name for this craft that flies up on motors fired in turn.
examples:
- The step rocket shed one motor after another as each ran out of fuel.
- The step rocket's second motor fired only after the first had dropped away.
