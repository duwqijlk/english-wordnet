simpleMeaning: Someone who thinks, speaks, and walks upright, a person alive now or long dead, one of
  the group people belong to.
scope: This is any person, alive now or long dead, who thinks, speaks, and walks upright, also called
  man, human and homo.
examples:
- All human beings think, speak, and walk upright.
- Long-dead human beings thought, spoke, and walked upright too.
