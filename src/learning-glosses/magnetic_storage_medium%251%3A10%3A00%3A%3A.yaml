simpleMeaning: The stuff itself that holds what is kept, with set patterns of small spots on it standing
  for the bits and bytes of what is put there
scope: It is also called magnetic medium and magnetic storage, and a hard disk is one such piece of stuff.
examples:
- The magnetic storage medium still held his files.
- She copied the photos onto a magnetic storage medium.
