synsetId: 06339636-n
simpleMeaning: A category of nouns, pronouns and adjectives that controls agreement in an inflected language;
  arbitrary in some tongues, in Indo-European ones usually based on sex or being alive.
scope: The grammar sense, a noun class such as masculine or feminine that governs agreement between words,
  the same thing grammatical gender names; not biological sex.
examples:
- In French every noun has a gender, and the adjectives must match it.
- German gender decides which form of the article comes before a noun.
