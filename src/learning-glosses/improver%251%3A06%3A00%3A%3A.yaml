simpleMeaning: A part put into a thing to make it better.
scope: A part put into a thing to make it better, not a person who works to make life better for others
  and not a part that makes a thing worse.
examples:
- The addition of a bathroom was a great improver for the old house.
- The addition of cinnamon was the improver that made the cake taste better.
