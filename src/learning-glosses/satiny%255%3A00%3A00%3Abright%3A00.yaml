simpleMeaning: smooth and soft like silk, with a surface that shines as it catches the light
scope: This means smooth, soft and shining like silk; it is also called slick, silken, sleek, silky and
  silklike, and it is not about being made of silk itself.
examples:
- Her satiny hair shone in the sun.
- The flowers had soft, satiny petals that caught the light.
