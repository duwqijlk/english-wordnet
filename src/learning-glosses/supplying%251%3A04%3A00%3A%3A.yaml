simpleMeaning: the work of giving things to people or places that need them
scope: Also called supply and provision, this is the work of giving things that are needed; it is not
  the things that are given themselves.
examples:
- Supplying clean water to the town took a lot of work.
- The group is in charge of supplying food to the shelters.
