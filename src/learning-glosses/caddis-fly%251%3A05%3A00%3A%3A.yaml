simpleMeaning: Looking like a small moth, this insect has two pairs of hairy, thin wings, and its young
  live in water.
scope: Also called caddice-fly, caddice fly, and caddis fly, this is a small moth-like insect with two
  pairs of hairy wings whose young live in water, not a true moth.
examples:
- A caddis-fly landed on my sleeve.
- Caddis-fly young live in the water until they grow wings.
