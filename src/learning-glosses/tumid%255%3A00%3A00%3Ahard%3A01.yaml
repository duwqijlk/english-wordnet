simpleMeaning: Of the sex organs, stiff and hard.
scope: This sense is also called erect, for what is, of the sex organs, stiff and hard, unlike the sense
  for what is swollen out of shape, especially by fluids or gas.
examples:
- The organ was tumid, stiff and hard.
- The tissue was tumid, stiff and rigid.
