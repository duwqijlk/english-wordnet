senseId: 'auditory_hyperesthesia%1:26:00::'
synsetId: 14574913-n
simpleMeaning: hearing that is far too sharp because the nerves that carry sound are too easily set off,
  so that even everyday sounds are hard to bear
scope: Also called hyperacusia and hyperacusis; hearing that is too sharp for everyday sounds, not deafness
  and not a ringing in the ears.
examples:
- Her auditory hyperesthesia made the sound of the doorbell almost unbearable.
- With auditory hyperesthesia, even a quiet radio can hurt his ears.
