simpleMeaning: A round globe of glass or clear stone used by fortune tellers to look for signs of what
  is to come.
scope: A fortune teller's globe for looking into the future, not a snow globe and not a plain glass ornament.
examples:
- The crystal ball sat on a velvet cloth on the fortune teller's table.
- She gazed into the crystal ball and claimed to see a long journey.
