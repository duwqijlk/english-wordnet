simpleMeaning: the act of putting money or capital into a business or project in the hope of making a
  profit.
scope: This is not the money that is put in, and not the time or effort given to a project; it is the
  act of putting money or capital in.
examples:
- Foreign investment in the region has grown steadily over the past decade.
- The book explains how investment works and why it carries risk.
