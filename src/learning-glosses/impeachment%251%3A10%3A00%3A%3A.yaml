simpleMeaning: a formal paper that sets out charges against a person in public office for doing wrong
  in that job
scope: This sense is the written paper with the charges, not the act of charging a leader and not the
  trial that may follow.
examples:
- The lawmakers drew up an impeachment against the governor.
- The impeachment listed three charges of wrongdoing in office.
