simpleMeaning: to move something along as if to the sound of a repeated rising and falling tune
scope: To move things along as if to a repeated rising and falling tune, not to speak or sing in that
  tune, and not the tune itself.
examples:
- The porters singsonged the bags up the hill.
- They singsonged the heavy boxes along the path.
