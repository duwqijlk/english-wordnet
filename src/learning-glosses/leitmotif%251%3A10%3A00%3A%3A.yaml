senseId: 'leitmotif%1:10:00::'
synsetId: 07042284-n
simpleMeaning: A short tune that comes back whenever a person or a situation comes back in a work, as
  in the operas of Wagner.
scope: Also called a leitmotiv, a short tune that returns with a person or situation in a work, as in
  the operas of Wagner.
examples:
- The leitmotif sounded each time the hero returned.
- She hummed the leitmotif that marks the villain's return.
