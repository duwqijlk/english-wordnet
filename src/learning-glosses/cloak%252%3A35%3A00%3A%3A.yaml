simpleMeaning: to put a loose outer garment over something, or to cover it with anything that works like
  one.
scope: This is the physical act of covering with a garment or something like one, not the garment itself,
  and not hiding something under a false appearance.
examples:
- She cloaked the child in a warm blanket.
- Dust cloaked every surface in the empty house.
