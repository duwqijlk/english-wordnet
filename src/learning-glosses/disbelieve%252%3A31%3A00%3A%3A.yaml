simpleMeaning: to hold that something is not true and to refuse to take it as true
scope: This is holding that something is not true and refusing to take it as true; not doubting it mildly
  and not ignoring it.
examples:
- She disbelieved every word of his story.
- I disbelieve the claim that the house is haunted.
