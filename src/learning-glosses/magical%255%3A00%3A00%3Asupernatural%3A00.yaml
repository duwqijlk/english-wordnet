simpleMeaning: having or using powers that go past what nature can do, or like such powers, or made for
  such powers
scope: 'Also called magic and wizard: having or using powers that go past what nature can do, not a trick
  done by hand and not a thing that is only strange or odd.'
examples:
- The old book told of magical powers and spells.
- She waved the magical wand and the door opened.
