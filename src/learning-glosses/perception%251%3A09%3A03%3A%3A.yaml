simpleMeaning: what you know because you have seen, heard, or felt it with your senses
scope: What you know from using your senses, not the act of sensing itself and not the picture your mind
  forms of what you sense.
examples:
- Her perception of the market helped her choose the right shop.
- His perception grew sharper with years of watching birds.
