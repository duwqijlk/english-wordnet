senseId: 'cauterize%2:30:01::'
synsetId: 00273913-v
simpleMeaning: to make a person stop feeling care or pity, so feelings and sense of right and wrong grow
  weak
scope: 'Also called callous and cauterise: to make feelings weak and a person care less, not to burn skin
  to close a wound.'
examples:
- Years of seeing cruelty had cauterized him, and he no longer felt pity for others.
- The hard life cauterized her feelings, so she stopped caring what was right.
