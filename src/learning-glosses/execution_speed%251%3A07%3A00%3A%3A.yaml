simpleMeaning: In computer science, how fast a computing device can carry out orders, measured in MIPS,
  a count of millions of orders a second.
scope: In computer science, how fast a device carries out orders; not the speed of a person and not the
  speed of a machine's parts moving.
examples:
- Execution speed is measured in MIPS.
- The new chip doubled the execution speed of the old one.
