simpleMeaning: Its underground stem works like sarsaparilla, and this plant of the sea coast of Europe
  now grows wild along the Atlantic coast of the United States.
scope: It is also called sand reed, a sedge of the sea coast of Europe now growing wild along the Atlantic
  coast of the United States, whose underground stem works like sarsaparilla.
examples:
- Sand sedge grew along the Atlantic coast of the United States.
- Sand sedge grew on the sea coast of Europe.
