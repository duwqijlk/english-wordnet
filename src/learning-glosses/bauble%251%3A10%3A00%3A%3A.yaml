simpleMeaning: a stick made to look like a king's stick of power, carried by a court jester, a person
  paid to make the king laugh
scope: This is a jester's stick made to look like a king's stick of power, not the cheap, bright jewelry
  or ornament also called a bauble.
examples:
- The jester waved his bauble at the king.
- In the play, the fool carries a bauble with a small head on top.
