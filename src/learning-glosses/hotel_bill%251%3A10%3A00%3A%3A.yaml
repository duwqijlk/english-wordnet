simpleMeaning: A written list of what a guest must pay for a stay.
scope: A list of what a guest owes for a stay, not a receipt for goods bought in a shop and not a bill
  for a single meal.
examples:
- She asked for the hotel bill when she checked out.
- The hotel bill showed the cost of the room and the meals.
