senseId: 'apocrine%3:00:00::'
synsetId: 00099382-a
simpleMeaning: Part of the cell that makes the fluid comes out with it, in glands that send fluid out
  of the body.
scope: These glands send fluid out of the body, and part of the cell comes out with the fluid instead
  of staying behind.
examples:
- Mother's milk is one apocrine fluid that carries part of the cell with it.
- The apocrine fluid from the gland carried part of the cell with it.
