simpleMeaning: Turning fats and oils into soap gives this thick, sweet liquid, an alcohol with three hydroxyl
  parts, each made of oxygen and hydrogen.
scope: Also called glycerol or glycerine, this names the thick, sweet liquid got by turning fats and oils
  into soap.
examples:
- The mixture held glycerin from fats and oils.
- Glycerin tastes sweet and feels thick.
