simpleMeaning: a field of study that looks at how the mind takes in what words mean
scope: 'Also called cognitive semantics: a field that looks at how the mind takes in what words mean,
  not the study of how words are put together and not the study of word sounds.'
examples:
- Her work in conceptual semantics looks at how children learn what words mean.
- Conceptual semantics asks how the mind holds the sense of a word.
