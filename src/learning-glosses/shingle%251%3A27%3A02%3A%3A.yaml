simpleMeaning: rough gravel on a beach, made of small stones smoothed by the water, or a stretch of shore
  covered with it
scope: This is about beach gravel, not about a small sign outside an office or about putting roof tiles
  on a building.
examples:
- The children walked over the shingle at the edge of the sea.
- The boat was pulled up onto the shingle.
