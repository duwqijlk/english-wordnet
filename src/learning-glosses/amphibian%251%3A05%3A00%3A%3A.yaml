simpleMeaning: an animal with a backbone and cold blood, usually living on land but having its young in
  water; the young in water change into adult form
scope: This is the animal itself, like a frog; it is not the describing word for things to do with these
  animals, and it is not a reptile.
examples:
- A frog is an amphibian that lays its eggs in the pond.
- Many amphibians live on land as adults but return to water to breed.
