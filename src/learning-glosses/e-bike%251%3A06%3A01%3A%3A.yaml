simpleMeaning: A bicycle built with a motor, which can be driven by the motor or by the rider's pedalling.
scope: A bicycle with a motor that the rider can also pedal, also called the electronic bicycle and the
  electronic bike; not a motorbike and not a plain bicycle with no motor.
examples:
- She rode her E-bike to work each morning.
- The E-bike motor helped him up the steep hill.
