simpleMeaning: a straight upright European plant that lives for one year, often grown as a salad crop
  to be picked and eaten while young and tender
scope: A straight upright European plant that lives for one year; rocket, arugula, garden rocket and rocket
  salad are other names for it, not lettuce and not a plant grown for its roots.
examples:
