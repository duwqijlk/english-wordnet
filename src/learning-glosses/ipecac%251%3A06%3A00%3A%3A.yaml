simpleMeaning: A medicine that makes a person throw up, above all after taking too much of a drug or after
  being poisoned
scope: A medicine that makes a person throw up, above all after an overdose or poisoning, not a medicine
  that stops sickness and not a cure for poison.
examples:
- The doctor gave the child ipecac after she swallowed the pills.
- Ipecac is kept in some homes in case of poisoning.
