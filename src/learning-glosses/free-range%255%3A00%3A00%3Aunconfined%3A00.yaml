simpleMeaning: Not shut up in a yard for fattening, farm animals and tame birds feed on grass and plants
  out in the open.
scope: Said of farm animals and tame birds, this word means they feed out in the open on grass and plants,
  not shut up in a yard for fattening.
examples:
- The free-range hens pecked about the yard.
- We buy free-range eggs from hens that roam outside.
