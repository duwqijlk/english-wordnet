simpleMeaning: Hills, trees, rivers and sky are what artists show in this kind of art
scope: 'Also called a landscape: a kind of art in which artists show hills, trees, rivers and sky, not
  a picture of people and not a still life of objects.'
examples:
- The gallery hung her landscape painting above the fireplace.
- He bought a landscape painting of the hills at sunset.
