simpleMeaning: The breathing parts of fish and of land-and-water animals are held up by curved pieces
  of bone or gristle, one on each side of the throat.
scope: Branchial arch and gill bar are other names for this curved piece of bone or gristle beside the
  throat.
examples:
- The gill arch supported the gills.
- Each gill arch lay on one side of the throat.
