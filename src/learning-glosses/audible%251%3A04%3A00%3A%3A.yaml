simpleMeaning: In American football, a change to the play called out loud after both teams have lined
  up.
scope: In American football, a play changed by a call after the teams have lined up, not a sound you can
  hear.
examples:
- The quarterback called an audible at the line.
- He changed to an audible when he saw the defence shift.
