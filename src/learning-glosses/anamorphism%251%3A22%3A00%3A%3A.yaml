simpleMeaning: A change in rocks deep under the ground, turning plain minerals into more complex minerals.
scope: A change in rocks deep under the ground, turning plain minerals into more complex minerals, not
  a change in rocks at the surface and not a distorted picture.
examples:
- Anamorphism changes plain minerals deep under the ground.
- The rocks showed signs of anamorphism.
