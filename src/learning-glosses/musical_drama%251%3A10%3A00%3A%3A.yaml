simpleMeaning: The songs and the story count the same in this play that is sung all through, and the songs
  fit what is done on stage
scope: A play that is sung all through in which the songs and the story count the same, not a play in
  which songs only break into the talking and not a play that is only spoken.
examples:
- The musical drama held the songs and the story in equal weight from start to end.
- In this musical drama, every song fits the action on the stage.
