simpleMeaning: A big tree from tropical America, valued as an ornamental, with leaves divided twice into
  leaflets, round flower clusters with deep red stamens, and pods that cattle eat.
scope: Another name for the large ornamental tree of the American tropics also called rain tree and saman;
  it names the whole tree, not just its pods.
examples:
- A monkey pod shaded the whole corner of the yard.
- We sat under a monkey pod and watched the cattle graze.
