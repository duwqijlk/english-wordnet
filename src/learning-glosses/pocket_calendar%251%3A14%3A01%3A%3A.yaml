simpleMeaning: It lists the days of the year, is small enough to carry in a coat or a wallet, and comes
  as a plain plastic card, a booklet, or a notebook.
scope: A pocket planner and a wallet calendar are other names for this list of the days of the year, small
  enough to carry in a coat or a wallet.
examples:
- My grandfather still uses pocket calendars.
- They keep a pocket calendar in a coat pocket.
