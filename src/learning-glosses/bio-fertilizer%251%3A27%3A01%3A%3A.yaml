simpleMeaning: A substance with living tiny beings which, put on seed, plants, or soil, settle at the
  roots or inside the plant and help growth, raising chief nutrients for the host.
scope: Also called bio fertilizer; a substance carrying living microbes that settle at plant roots or
  inside the plant and raise chief nutrients for the host.
examples:
- Bio-fertilizers help growth.
- Bio-fertilizer settles at the roots.
