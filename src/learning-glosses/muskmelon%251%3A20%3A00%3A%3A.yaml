simpleMeaning: Any of several kinds of vine whose fruit has a netted skin, flesh good to eat, and a musky
  smell.
scope: Also called a sweet melon or a sweet melon vine, this is the vine itself, not the fruit it bears.
examples:
- Muskmelon vines spread across the garden bed.
- The muskmelon climbed the fence, its leaves broad and green.
