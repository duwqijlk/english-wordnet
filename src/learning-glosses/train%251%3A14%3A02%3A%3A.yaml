simpleMeaning: A series of events, ideas or things in which each one follows on from the one before.
scope: This is not a line of carts or animals, and not a railway vehicle; it is an ordered series of events
  or thoughts.
examples:
- The decision started a train of events that nobody could stop.
- Her speech followed a clear train of thought.
