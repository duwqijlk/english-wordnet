simpleMeaning: to add notes between the lines of a text, explaining the words or phrases printed there
scope: This is adding notes between the lines of a text to explain its words or phrases, and comment is
  another name for it, not translating into another language and not giving a false front.
examples:
- The scholar glossed the old text with notes between the lines.
- She glossed the difficult words so her students could follow the story.
