simpleMeaning: a made part that helps make up a larger whole thing, most of all a part that can be taken
  off a system or put on to it
scope: A made part of a larger whole thing, most of all one that can be taken off a system or put on to
  it, also called an element or a component, not a word in grammar and not a voter.
examples:
- Each constituent of the machine can be taken out and replaced.
- The engineer listed every constituent of the new system.
