simpleMeaning: A deal in which property passes from one person to another for a set amount of money, paid
  now or promised later.
scope: This is the legal deal that transfers property for money, not a period of reduced prices or the
  act of offering goods.
examples:
- The sale of the house was completed once the buyer paid the agreed price.
- Under the contract of sale, the seller must hand over the goods by Friday.
