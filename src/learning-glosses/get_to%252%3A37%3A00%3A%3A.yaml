simpleMeaning: Little things that bother a person again and again leave them cross
scope: Also called annoy, bother, chafe, devil, get at, gravel, irritate, nark, nettle, rag, rile and
  vex, this is making a person feel cross by small troubles, not making them deeply angry and not reaching
  a place.
examples:
- His constant humming really gets to me.
- It gets to her that he never puts his shoes away.
