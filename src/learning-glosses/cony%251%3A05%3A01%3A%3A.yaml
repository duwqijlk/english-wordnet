simpleMeaning: Several kinds of long-eared animal in the hare family, with a short tail, that dig holes
  to live in; people keep some as pets and raise others for food
scope: One of several burrowing animals in the hare family, with long ears and a short tail; rabbit and
  coney are other names for this sense, not the small hoofed mammal of Africa and Asia, and not the short-eared
  burrowing mammal of rocky uplands.
examples:
- The cony dug a burrow under the hedge.
- They kept a cony as a pet in a hutch in the garden.
