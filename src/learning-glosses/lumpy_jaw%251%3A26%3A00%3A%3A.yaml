simpleMeaning: The most common and mildest form of a sickness that makes hard swellings, affecting the
  face and neck.
scope: This is the most common and mildest form of a sickness that makes hard swellings, affecting the
  face and neck, not a worse form of the same sickness and not a swelling from a bad tooth; cervicofacial
  actinomycosis is another name for this sense.
examples:
- Lumpy jaw swelled the cow's face and neck.
- The vet treated the lumpy jaw with medicine.
