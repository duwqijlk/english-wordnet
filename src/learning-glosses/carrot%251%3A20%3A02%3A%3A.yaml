simpleMeaning: the deep orange root of the plant that people grow, eaten as food
scope: This names the root as part of the grown plant, not the whole plant and not a promised reward to
  make someone act.
examples:
- The carrot's deep orange root grows down into the soft soil.
- When you pull up the plant, the carrot below the ground is long and orange.
