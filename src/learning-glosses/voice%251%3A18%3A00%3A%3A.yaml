simpleMeaning: A person who publicly speaks for another person or group, putting forward their policies
  or aims.
scope: This is a person, not a publication or other channel, and not the act of expressing something.
examples:
- She served as the voice of the striking workers during talks with management.
- The senator became the voice of rural hospitals in the budget fight.
