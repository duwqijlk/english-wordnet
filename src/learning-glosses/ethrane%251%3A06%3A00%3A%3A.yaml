simpleMeaning: A liquid that will not catch fire, breathed in to put a person to sleep for surgery.
scope: Also called enflurane, this liquid will not catch fire and is breathed in to put a person to sleep
  for surgery, not any other drug that puts a person to sleep.
examples:
- The doctor used Ethrane to put the patient to sleep.
- Ethrane is breathed in before surgery.
