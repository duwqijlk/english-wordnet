simpleMeaning: having a love or liking for someone that is not based on reason and seems silly
scope: 'Also called enamored, potty and infatuated: a love or liking for someone that is not based on
  reason and seems silly, not the sense used with another word for being overwhelmed by something.'
examples:
- He was smitten with her from the first day they met.
- Smitten by the singer, she went to every one of his shows.
