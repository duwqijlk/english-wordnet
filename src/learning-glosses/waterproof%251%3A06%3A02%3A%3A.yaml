simpleMeaning: Any cloth that water cannot get through at all.
scope: Any cloth water cannot pass through; not a coat, and not the quality of keeping water out.
examples:
- They sewed the bags from waterproof that kept out every drop.
- This waterproof is used for sails and tents.
