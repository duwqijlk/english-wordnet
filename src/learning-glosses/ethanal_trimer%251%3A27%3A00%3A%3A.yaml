simpleMeaning: This clear liquid can calm people and dissolve other things, since three units of one chemical
  join in a ring to make it.
scope: Also called paraldehyde, this is a clear liquid whose three chemical units join in a ring and which
  calms people and dissolves other things.
examples:
- The doctor gave him ethanal trimer to help him sleep.
- The lab used ethanal trimer to dissolve the sample.
