simpleMeaning: The way of thinking of people who want big, sudden changes in how a country is run and
  how people live together.
scope: The beliefs of people who want deep change in government and society, not a wish for small reforms.
examples:
- His radicalism shocked the older members of the party.
- Radicalism grew as people lost faith in slow change.
