simpleMeaning: the act of getting something that is given or sent to you
scope: The act of getting something given or sent to you, not the paper you get when you pay for something
  and not the act of telling others you got it.
examples:
- Upon receipt of the letter, she called at once.
- The receipt of the gift made her smile.
