simpleMeaning: The place where a nerve thread meets the muscle it serves.
scope: The place where a nerve thread meets the muscle it serves; neuromuscular junction is another name
  for this, and it is not the place where two nerve threads meet or the muscle itself.
examples:
- The signal crosses the myoneural junction to the muscle.
- A myoneural junction joins a nerve thread to a muscle.
