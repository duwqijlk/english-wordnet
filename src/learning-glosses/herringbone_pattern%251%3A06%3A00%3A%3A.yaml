simpleMeaning: A design of short parallel strokes set in strips, each strip slanting one way and the next
  the opposite, used in weaving, masonry, patterned wood floors and embroidery.
scope: Herringbone is another name for this design of short slanted strokes in alternating strips, not
  a single zigzag line and not one kind of embroidery stitch.
examples:
- The tiles were laid in a herringbone pattern across the hall.
- She worked a herringbone pattern into the quilt border.
