simpleMeaning: The United States intelligence agency that guards current and former presidents and vice
  presidents, their close families, and honoured foreign guests; it catches fake-money makers and stops
  forged government papers.
scope: Also called SS, United States Secret Service, US Secret Service, and USSS; the United States agency
  that guards presidents and catches fake-money makers, not the CIA and not a local police force.
examples:
- The Secret Service guards the president wherever he travels.
- The Secret Service caught the counterfeiters before they could spend the fake money.
