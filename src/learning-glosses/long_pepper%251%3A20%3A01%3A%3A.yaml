simpleMeaning: Very hot pods that taper to a fine point, usually red, grow on this plant
scope: Also called cayenne, cayenne pepper, chili pepper, chilli pepper and jalapeno, this is a plant
  that grows very hot tapering pods, usually red, not the slender climber of the eastern Himalayas.
examples:
- The long pepper plant bore very hot red pods.
- She dried the long pepper pods for cooking.
