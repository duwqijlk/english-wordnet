simpleMeaning: a plastic that softens when heated, made by joining together small parts from chemicals
  that share one small group of atoms
scope: A heat-softening plastic made from small joined parts, also called vinyl polymer and polyvinyl
  resin; not a natural rubber and not a hard glass.
examples:
- The vinyl resin in this sheet softens when it is heated.
- Workers shape the vinyl resin into tubes and bottles.
