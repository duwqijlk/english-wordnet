simpleMeaning: In medicine, any break in the way a part of the body works, or in the way a group of people
  works together
scope: In medicine, when a part of the body or a group of people stops working as it should, not a wound
  and not a disease with a clear cause.
examples:
- He went to the doctor about erectile dysfunction.
- The team's dysfunction made every meeting end in a row.
