simpleMeaning: to gain control over someone and hold them back, by making them feel awe (a strong feeling
  of wonder and respect), or by frightening them with threats
scope: This verb means to gain control over someone by making them feel awe, or by frightening them with
  threats; it is not the grown female animal whose male is called a bull.
examples:
- The boss cowed the workers with threats of losing their jobs.
- He was cowed into staying silent by his older brother.
