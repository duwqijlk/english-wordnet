simpleMeaning: To give a person a job to do, or to put a person in a post to do it
scope: Giving a person work or a post to fill, not sending a thing to a place and not giving a value to
  a number.
examples:
- The boss assigned her to the night shift.
- They assigned him a task in the new office.
