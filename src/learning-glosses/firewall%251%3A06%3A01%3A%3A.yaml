simpleMeaning: In computing, a guard of both machine parts and programs that keeps a computer or network
  safe from outside attack, often used on local networks linked to the internet
scope: In computing, a guard that keeps a computer or network safe from attack; not a wall against fire,
  and not the full use of power in a machine.
examples:
- The firewall blocked the attack on the school network.
- Our firewall keeps outside users from reaching the office computers.
