simpleMeaning: to take a thing away, by lifting, pushing, or taking it off, or to take away a thing that
  has no body
scope: To take a thing away, by lifting, pushing, or taking it off, or to take away a thing that has no
  body; also called remove, take, and pull, not to free a thing caught fast, and not to step back from
  taking part.
examples:
- Withdraw the dishes from the table.
- She withdrew her hand from the hot stove.
