simpleMeaning: being within the limits that show a body, mind or system is working as it should
scope: 'Also called normalcy: this sense is about a body, mind or system working as it should, not about
  a thing being usual and easy to expect, and not about how strong a liquid mix is.'
examples:
- The doctor said her heart had returned to normality after treatment.
- Tests showed normality in his breathing and blood pressure.
