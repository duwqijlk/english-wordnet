simpleMeaning: A flowing form of Egyptian picture-writing, used especially by the priests.
scope: A flowing form of Egyptian picture-writing, used especially by the priests; not written of, or
  belonging to, a flowing form of old Egyptian writing, nor holding to fixed kinds or ways, most held
  back and formal.
examples:
- Their hieratic flowed at dawn.
- The hieratic was read at noon.
