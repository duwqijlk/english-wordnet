simpleMeaning: to join together with other countries to make one group, said of nations
scope: This verb is about countries joining together, not a person who helps with a plan and not already
  being joined in a group.
examples:
- The small nations confederated to keep themselves safe.
- Three states chose to confederate and share one army.
