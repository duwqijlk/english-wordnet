simpleMeaning: To work out an answer by doing arithmetic or other mathematical operations.
scope: This is doing arithmetic or other mathematics, not judging something to be probable, not taking
  a part in something, not picturing something in the mind, not understanding something, and not the noun
  senses naming a diagram, the human body, a numeral, a model of a person, a notable person, a geometric
  shape, a sum of money, a person's impression, a quantity, figurative language, a perceived form, a decorative
  work, or a set pattern of dance or skating moves.
examples:
- She figured the total cost on the back of an envelope.
- He figured the tax he owed before filing the return.
