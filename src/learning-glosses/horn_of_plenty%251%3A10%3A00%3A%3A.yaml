scope: It is also called a cornucopia, the goat's curved headpiece filled with grain, flowers and fruit
  that stands for wealth and good fortune.
examples:
- The horn of plenty spilled fruit across the table in the painting.
- A horn of plenty stood for wealth at the harvest feast.
