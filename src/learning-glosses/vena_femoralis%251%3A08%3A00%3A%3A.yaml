simpleMeaning: A vein that goes with the thigh artery in the same cover, a carrying-on of the knee-pit
  vein, turning into the outer hip vein.
scope: This sense is also called femoral vein.
examples:
- A vena femoralis runs with the artery.
- Venae femorales turn into hip veins.
