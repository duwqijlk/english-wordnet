simpleMeaning: the right level of skill and work for pupils in one school year
scope: Work that fits the skill of pupils in one school year, not work that is too easy for them and not
  work meant for older pupils.
examples:
- The book is grade-appropriate for third-year pupils.
- Teachers check that tasks are grade-appropriate.
