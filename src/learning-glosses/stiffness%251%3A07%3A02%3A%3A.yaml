simpleMeaning: the awkward, graceless way of a person who is stiff and tense, as when embarrassed
scope: The awkward way of a person who is stiff and tense, as when embarrassed; also called awkwardness,
  and not stiffness of the body from cold or age.
examples:
- There was a stiffness in his manner that made the room feel awkward.
- Her stiffness at the party came from being embarrassed in front of strangers.
