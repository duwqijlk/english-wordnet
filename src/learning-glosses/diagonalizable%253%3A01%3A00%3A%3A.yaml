senseId: 'diagonalizable%3:01:00::'
synsetId: 02722204-a
simpleMeaning: able to be changed into a table of numbers with values only on the line from the top left
  to the bottom right
scope: This is about a table of numbers that can be changed so its values sit only on the line from the
  top left to the bottom right; not the act of changing it, and not a table that already has that form.
examples:
- The large diagonalizable matrix could be changed into a table with numbers only on the line from the
  top left to the bottom right.
- She showed that the system was diagonalizable before she tried to solve it.
