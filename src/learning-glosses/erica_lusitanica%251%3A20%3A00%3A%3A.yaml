simpleMeaning: An upright thick shrub from the west of the Iberian peninsula, with very many white or
  pink flowers; it now grows wild in the south-west of England.
scope: Also called Portuguese heath or Spanish heath; an upright thick shrub from the west of the Iberian
  peninsula with very many white or pink flowers, now growing wild in the south-west of England, kin to
  other heaths.
examples:
- Erica lusitanica blooms in the garden, its white flowers thick on the shrub.
- Erica lusitanica now grows wild in the south-west of England.
