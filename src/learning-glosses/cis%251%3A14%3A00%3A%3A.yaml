simpleMeaning: a league of states that had been Soviet republics before the Soviet Union broke up in December
  1991
scope: A league of former Soviet states; Commonwealth of Independent States is another name for this sense;
  not a single country and not the old Soviet Union itself.
examples:
- Armenia was one of the states in the CIS.
- The CIS was formed by states that had been part of the Soviet Union.
