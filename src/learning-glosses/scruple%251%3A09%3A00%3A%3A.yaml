simpleMeaning: a belief about what is right and wrong that stops a person from doing something bad
scope: This is a belief that stops a person from doing something wrong, not a worried feeling about an
  action, not the verb for holding back, and not a small unit of weight.
examples:
- A strong scruple stopped her from cheating in the test.
- His scruple kept him from taking money that was not his.
