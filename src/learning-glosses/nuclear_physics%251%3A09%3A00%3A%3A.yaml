simpleMeaning: The branch of physics that studies the inner structure of the centres of atoms.
scope: This is the study of what is inside the centres of atoms, also called atomic physics and nucleonics;
  not the study of whole atoms, and not the making of power from them.
examples:
- She studied nuclear physics at university.
- Nuclear physics explains how the centres of atoms are built.
