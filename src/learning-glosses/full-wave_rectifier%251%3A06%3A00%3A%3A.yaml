simpleMeaning: A device that makes an electric current flow in one way only, by turning the half that
  runs the wrong way round so it runs the right way
scope: A device that turns both halves of a changing current positive, not a device that uses only one
  half and not a transformer that changes voltage.
examples:
- The full-wave rectifier feeds the radio with steady current.
- A full-wave rectifier uses both halves of the current.
