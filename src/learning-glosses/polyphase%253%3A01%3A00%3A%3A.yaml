simpleMeaning: Of a power system whose two or more switching voltages share one rate but differ in timing,
  whether it uses them or makes them
scope: Also called multiphase, this describes a power system with two or more switching voltages of one
  rate but different timing, not a system with a single steady voltage.
examples:
- The polyphase system used two voltages of one rate but different timing.
- A polyphase supply makes two or more switching voltages.
