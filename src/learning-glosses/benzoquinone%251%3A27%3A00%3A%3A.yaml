simpleMeaning: Used to make dyes, this is any of a set of sweet-smelling yellow chemicals, some of which
  living things need for the chemical work inside them.
scope: Quinone is another name for this yellow chemical, which living things need for the chemical work
  inside them and which is used to make dyes.
examples:
- The factory used benzoquinone to make the dye.
- They added benzoquinone to the mix to make the dye.
