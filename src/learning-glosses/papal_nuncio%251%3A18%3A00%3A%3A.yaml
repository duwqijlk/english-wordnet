simpleMeaning: In the Roman Catholic Church, a person sent by the Pope to another country as his ambassador
scope: In the Roman Catholic Church, a person sent by the Pope to another country as his ambassador; nuncio
  is another name for this sense, and it is not a local priest or a representative of a king.
examples:
- The papal nuncio met the president in the capital.
- A papal nuncio speaks for the Pope abroad.
