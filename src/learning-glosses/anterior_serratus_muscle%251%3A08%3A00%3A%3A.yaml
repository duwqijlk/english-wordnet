simpleMeaning: When the arm reaches forward, these strips of flesh turn the shoulder blade and lift the
  bony case round the chest.
scope: Also called serratus anterior, serratus magnus, and musculus serratus anterior, these strips of
  flesh turn the shoulder blade and lift the bony case round the chest when the arm reaches forward.
examples:
- The anterior serratus muscle turns the shoulder blade when the arm reaches forward.
- When the chest rises to take in air, the anterior serratus muscle helps lift the bony case round it.
