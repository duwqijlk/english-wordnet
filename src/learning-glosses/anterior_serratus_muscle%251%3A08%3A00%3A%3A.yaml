simpleMeaning: Muscles that turn the scapula and lift the rib cage.
scope: Also called serratus anterior, serratus magnus, and musculus serratus anterior; these muscles turn
  the shoulder blade and lift the rib cage.
examples:
- The anterior serratus muscle turns the shoulder blade when the arm reaches forward.
- When the chest rises to take in air, the anterior serratus muscle helps lift the bony case round it.
