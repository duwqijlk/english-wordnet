simpleMeaning: a piece shaped like a rolled scroll, made to look good, especially one that holds up something
  fixed to a wall
scope: A piece made to look good, especially one holding up a thing fixed to a wall; not the board with
  screens and controls a person uses to run a machine or computer.
examples:
- The old console under the shelf was carved like a scroll.
- A stone console held up the heavy mirror on the wall.
