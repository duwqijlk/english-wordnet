simpleMeaning: a deep container on the table where the last drops from tea cups and coffee cups are poured
scope: 'Also called slop basin: a deep container on the table where the last drops from tea cups and coffee
  cups are poured, not a bowl for washing and not a bowl for serving food.'
examples:
- He poured the last drops of his tea into the slop bowl.
- The slop bowl was full of cold tea by the end of the meal.
