simpleMeaning: Small yellow flowers grow on this hairy plant from Europe and Asia, whose sharp-tasting
  part under the ground was once used as a medicine.
scope: Also called cloveroot, herb bennet and wood avens, this is a hairy plant from Europe and Asia.
examples:
- She picked a clover-root and looked at its small yellow flowers.
- He dug up the clover-root to see its root.
