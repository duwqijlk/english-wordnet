senseId: 'quick%1:08:00::'
synsetId: 05605735-n
simpleMeaning: A part of the body, such as the flesh under a nail, that feels pain very sharply.
scope: This is not the adjective meaning fast; it is the tender, sensitive flesh under a nail or under
  the skin.
examples:
- He cut his nail down to the quick.
- The thorn went deep into the quick of his thumb.
