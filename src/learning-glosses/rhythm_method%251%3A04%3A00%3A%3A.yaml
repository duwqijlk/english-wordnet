simpleMeaning: 'Family planning by counting cycle days: the egg is thought to come out two weeks before
  a period, so days 10 to 18 are the days for becoming pregnant.'
scope: 'Also called rhythm, calendar method, calendar method of birth control, and rhythm method of birth
  control: a natural way to plan a family by counting cycle days, not a drug or a device that stops pregnancy.'
examples:
- They used the rhythm method to plan their family.
- She counted days 10 to 18 under the rhythm method.
