simpleMeaning: In the past, a soldier on a horse who fought with a long spear
scope: A soldier on a horse from past times with a long spear, not a soldier on foot and not a soldier
  who fights with a gun.
examples:
- The lancer rode at the front of the soldiers on horses.
- A lancer in the old army held his long spear high.
