simpleMeaning: As it nears the batter, this throw bends, because it was sent with a spin in the game played
  with a bat
scope: Curve, bender, and curve ball are other names for this throw, which bends on its way to the batter
  instead of flying straight.
examples:
- The pitcher threw a breaking ball that curved as it neared the batter.
- He could not hit the breaking ball as it curved past him.
