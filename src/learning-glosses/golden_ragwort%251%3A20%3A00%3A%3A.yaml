simpleMeaning: This weed-like plant bears yellow flowers and at times spreads too far, growing from the
  eastern United States to Texas and at times put in the group Senecio.
scope: Also called golden groundsel, this is the yellow-flowered weed-like plant of the eastern United
  States down to Texas, at times spreading too far and at times put in the group Senecio.
examples:
- Golden ragwort had spread too far.
- The golden ragwort had yellow flowers.
