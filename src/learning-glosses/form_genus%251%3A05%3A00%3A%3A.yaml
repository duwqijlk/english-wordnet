simpleMeaning: Above all for fossil kinds, this made-up group name covers living things whose true kinship
  is not clear, grouped only by likeness in shape
scope: This made-up group name stands beside form division and form family, which name other made-up ranks,
  and it is apart from the other form genus that names the first half of a species' Latin name.
examples:
- The fossil was placed in a form genus.
- A form genus groups things by likeness in shape.
