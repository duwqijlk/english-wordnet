simpleMeaning: A calming drug sold as Atarax and Vistaril, used to treat worry and travel sickness
scope: This is a drug sold as Atarax and Vistaril, used to calm people and to treat worry and travel sickness;
  hydroxyzine is another name for this sense, not a drug that puts people to sleep and not a painkiller.
examples:
- Hydroxyzine hydrochloride was given to calm her nerves.
- The nurse gave him hydroxyzine hydrochloride before the trip.
