simpleMeaning: in warm lands far and wide live any of a small family of lizards, all harmless and useful
  killers of slugs, insects, and other such pests
scope: A small harmless lizard of warm lands that eats slugs and insects, not a large lizard and not a
  poisonous one.
examples:
- The anguid lizard slipped under the stone, hunting slugs.
- Anguid lizards do no harm and help the garden by eating insects.
