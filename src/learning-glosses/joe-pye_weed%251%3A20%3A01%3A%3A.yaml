simpleMeaning: A herb of North America with leaves in rings round the stem and bunches of small pinkish
  or purple flower heads at the top
scope: This is a North American herb with ringed leaves and small pinkish or purple flower heads; Eupatorium
  maculatum and spotted Joe-Pye weed are other names for this sense, unlike the kind whose flowers are
  spotted with purple.
examples:
- Joe-Pye weed has whorled leaves and pink flower heads.
- Joe-Pye weed by the stream had small purple flower heads at the top.
