senseId: 'idealize%2:31:01::'
synsetId: 00626604-v
simpleMeaning: to form in the mind ideas of how things could be at their best
scope: This is forming such ideas in the mind in general, not thinking of one person or thing as better
  than it is.
examples:
- People have always idealized, dreaming of a world with no war.
- As a young man, he idealized and wrote about a fair life for all.
