simpleMeaning: a large African antelope (an animal with horns that eats grass), whose head is like an
  ox and whose long tail has thick hair at the end
scope: 'Also called gnu: a large wild animal from Africa with horns, not an ox, though its head is like
  an ox, and not a small deer.'
examples:
- A wildebeest crossed the river with the herd.
- We saw a wildebeest eating grass near the trees.
