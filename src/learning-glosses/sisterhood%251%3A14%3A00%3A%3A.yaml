simpleMeaning: a group of women who live together for religious life, especially a group of nuns
scope: This is a group of women living together for religious life, especially nuns, not the family tie
  between a girl or woman and her brothers and sisters.
examples:
- She joined the sisterhood and moved into the house with the other nuns.
- The sisterhood runs a small school next to the church.
