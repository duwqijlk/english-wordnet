simpleMeaning: a flat bread, like a thin cake, cooked on a hot flat pan
scope: 'Also called chapatti: a flat bread cooked on a hot flat pan, not a thick loaf and not a fried
  bread.'
examples:
- She tore a piece of chapati to scoop up the curry.
- The cook pressed each chapati flat and laid it on the griddle.
