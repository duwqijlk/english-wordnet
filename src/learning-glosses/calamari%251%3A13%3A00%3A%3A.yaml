simpleMeaning: In Italian cooking, squid (a sea animal with long arms) that is made ready to eat as food
scope: This sense is squid served as food in Italian cooking, also called squid; it is not the living
  sea animal on its own and not any other kind of fish dish.
examples:
- We ordered calamari as the first dish at the Italian restaurant.
- The calamari was fried and served in small rings with lemon.
