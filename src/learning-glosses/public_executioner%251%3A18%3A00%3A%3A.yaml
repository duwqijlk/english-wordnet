simpleMeaning: An official whose job is to carry out a death sentence, acting on an order from a court
scope: An official whose job is to carry out a death sentence on a court's order; executioner is another
  name for this sense, not the judge who gives the sentence.
examples:
- The public executioner carried out the sentence at dawn.
- In old times the public executioner wore a hood so no one knew his face.
