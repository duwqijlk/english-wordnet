simpleMeaning: A logic link between claims p and q of the shape 'if p then q', where p true means q cannot
  be false.
scope: This sense is also called implication and logical implication, a logic link between claims p and
  q of the shape 'if p then q', where p true means q cannot be false.
examples:
- Conditional relations link claims p and q.
- The conditional relation says if p then q.
