simpleMeaning: Carrying an electric current or storing an electric charge.
scope: This is the electrical sense for a wire or circuit, not "alive," not "performed before an audience
  at the time," not "loaded with explosive," and not "full of energy or activity."
examples:
- The electrician warned that the wire was still live.
- Do not touch the live cable until the power is switched off.
