simpleMeaning: A chain of protein blocks that is alkaline, not acid, this germ-killing drug comes from
  a germ found in soil and forms a main part of tyrothricin.
scope: Also called tyrocidine, this is a germ-killing drug from a soil germ, made of a chain of protein
  blocks that is alkaline, not acid, and a main part of tyrothricin.
examples:
- The cut was treated with tyrocidin.
- The infection cleared after treatment with tyrocidin.
