simpleMeaning: A spice made from the dried, sweet-smelling bark of a tree from Sri Lanka, used as rolled
  strips or ground to a powder
scope: This is the spice as it is used in cooking, in rolled strips or ground, not the tree it comes from.
examples:
- She added a pinch of cinnamon to the cake batter.
- The recipe calls for two cinnamon sticks.
