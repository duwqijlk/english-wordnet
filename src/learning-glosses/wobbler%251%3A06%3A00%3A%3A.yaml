simpleMeaning: A thing that rocks from side to side and will not stay still
scope: A thing that rocks from side to side and will not stay still; not a person who stumbles and not
  a toy that spins.
examples:
- The old table is a wobbler; one leg is shorter than the rest.
- She set the wobbler on the shelf and watched it rock.
