simpleMeaning: Crosses of two kinds form a mixed group of blooms, single or double, in colors from white
  to purple.
scope: This is the mixed kind grown from crosses of two kinds, not either kind on its own.
examples:
- The hybrid petunias in the window box bloom in white and purple.
- She grew hybrid petunia from seed for the front bed.
