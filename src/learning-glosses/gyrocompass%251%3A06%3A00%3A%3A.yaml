simpleMeaning: a tool that shows which way is north by using a spinning wheel, not by following the pull
  of the earth's magnetic field
scope: A tool that finds north with a spinning wheel, not a needle that follows the earth's magnetic pull
  and not a map.
examples:
- The ship's gyrocompass kept working near the steel hull.
- Pilots trust the gyrocompass when magnetic fields fail.
