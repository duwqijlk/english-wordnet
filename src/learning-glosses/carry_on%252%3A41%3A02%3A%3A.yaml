simpleMeaning: to behave badly, in a silly or wrong way
scope: Also called act up, it means to behave badly in a silly or wrong way, not to keep doing a job and
  not to talk for a long time.
examples:
- The children carried on when the teacher left the room.
- Please stop carrying on and sit down quietly.
