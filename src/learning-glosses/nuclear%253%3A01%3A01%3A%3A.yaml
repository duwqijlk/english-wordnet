simpleMeaning: relating to or forming the central core of an atom
scope: This is about the core of an atom, not the core of a living cell, not weapons that release destructive
  atomic energy, and not the general sense meaning central or nucleus-like.
examples:
- He specialized in nuclear physics after earning a degree in chemistry.
- Nuclear forces hold the protons and neutrons together inside an atom.
