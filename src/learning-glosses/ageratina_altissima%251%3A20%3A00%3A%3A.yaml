simpleMeaning: An American herb with flat-topped bunches of small white flower heads, said to cause trembles
  and milk sickness, sometimes put in the genus Eupatorium.
scope: An American herb with flat-topped bunches of small white flower heads, also called white sanicle,
  white snakeroot and Eupatorium rugosum; its nearest kin are other white-flowered herbs of North America.
examples:
- Ageratina altissima grew at the wood edge with flat-topped bunches of white flowers.
- The farmer knew Ageratina altissima was said to cause milk sickness.
