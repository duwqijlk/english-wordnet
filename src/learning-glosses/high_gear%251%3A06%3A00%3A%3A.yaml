simpleMeaning: For a given engine speed, no forward setting of a vehicle gives a faster speed than this
  one
scope: The fastest forward setting of a vehicle, also called high; not a lower forward setting and not
  reverse.
examples:
- He shifted into high gear on the open road.
- The truck stayed in high gear as it cruised down the highway.
