simpleMeaning: All the teachers and learners at a place of education, taken together.
scope: This is not the buildings or the lesson time and not a group of artists with a shared style; it
  is the people of one institution as a group.
examples:
- The whole school was invited to the ceremony.
- The school gathered in the hall for the announcement.
