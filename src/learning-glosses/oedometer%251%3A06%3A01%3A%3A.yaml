senseId: 'oedometer%1:06:01::'
synsetId: 92445728-n
simpleMeaning: A tool that measures how fast and how much a bit of soil packs down under weight.
scope: A tool that measures how a bit of soil packs down under weight; not a tool that measures how wet
  soil is and not a tool that measures the weight of soil.
examples:
- The oedometer showed how fast the soil packed down.
- He used an oedometer to test the soil under weight.
