senseId: 'pride%1:04:00::'
synsetId: 00759528-n
simpleMeaning: a view of yourself that is too high and more than is right; shown as a person, as one of
  the deadly sins (very serious wrong acts)
scope: This is a view of yourself that is too high, shown as a person and counted as one of the deadly
  sins. It is not the good feeling you get from doing something well, and not the push to keep up your
  own good standards.
examples:
- In the old story, Pride walked first among the deadly sins.
- His pride was so great that he could never say he was wrong.
