simpleMeaning: The newspapers and magazines that gather news and print it for people to read
scope: Newspapers and magazines that gather and print the news, also called the press; not one single
  paper, and not news on radio or television.
examples:
- The public press reported the flood on its front pages.
- She trusts the public press to tell her what happened in town.
