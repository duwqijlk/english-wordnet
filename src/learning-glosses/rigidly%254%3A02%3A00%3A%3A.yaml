simpleMeaning: in a way that is stiff and does not bend or change
scope: This means in a stiff way, with no bending or change; the dictionary's examples show a body held
  stiff and straight. It does not name a stiff thing itself.
examples:
- He stood rigidly upright, not moving at all.
- Her body lay rigidly straight on the bed.
