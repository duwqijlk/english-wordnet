simpleMeaning: its seed gives rich oil and its tough green wood keeps termites out; this African tree
  bears yellow fruit you can eat, much like a common sweet tropical fruit
scope: Also called wild mango and dika; this African tree is valued for its seed oil and tough green wood,
  not the orchard tree grown for sweet yellow fruit.
examples:
- The wild mango tree gives rich oil from its seed.
- People prize the wild mango tree for wood that termites cannot eat.
