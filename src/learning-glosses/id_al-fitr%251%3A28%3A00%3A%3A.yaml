simpleMeaning: At the end of Ramadan, Muslims mark a day by eating together in joy.
scope: Another name for this sense is Eid al-Fitr; it is a Muslim feast day at the end of Ramadan, not
  the start of the fast.
examples:
- Muslims mark Id al-Fitr with a big family meal.
- After the last day of Ramadan, children look forward to Id al-Fitr.
