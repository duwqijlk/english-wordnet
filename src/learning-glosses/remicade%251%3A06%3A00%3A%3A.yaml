simpleMeaning: A drug that blocks TNF, a body protein, given into a vein every one to three months for
  Crohn's disease and rheumatoid arthritis.
scope: Also called infliximab; not a pill taken by mouth.
examples:
- Her doctor gave her Remicade through a drip every two months.
- Remicade helped his rheumatoid arthritis.
