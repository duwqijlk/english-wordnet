simpleMeaning: Of a part of a structure, able to hold up a weight or a pull or push without giving way
scope: A part of a structure that holds up weight, not a way of holding the body and not a link between
  two things.
examples:
- The bearing wall holds up the roof.
- That bearing beam takes the weight of the floor above.
