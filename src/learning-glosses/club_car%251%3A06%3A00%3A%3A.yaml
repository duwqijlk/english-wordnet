simpleMeaning: a train carriage with a bar and tables and chairs for sitting and resting
scope: 'Also called lounge car: it is a train carriage with a bar, tables, and chairs for sitting and
  resting, not a carriage for sleeping and not a carriage with seats in rows.'
examples:
- We had a drink in the club car on the way home.
- The club car had tables where we could sit and talk.
