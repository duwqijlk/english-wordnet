senseId: 'futurist%1:18:01::'
synsetId: 10136359-n
simpleMeaning: a person who studies God and religion and believes that the things the Bible's Book of
  Revelation says will happen will come true later
scope: A person in religion who holds this belief about the Book of Revelation; not someone who in general
  tries to tell what will happen later, and not the art sense linked to futurism.
examples:
- The futurist taught that the events in the Book of Revelation are still to come.
- As a futurist, he read the Apocalypse as a word about days still ahead.
