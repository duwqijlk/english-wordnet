simpleMeaning: to let out a sudden loud sound with the voice
scope: 'Also called call, cry, shout, scream, yell and squall: to let out a sudden loud sound with the
  voice, not to speak in a normal, quiet voice.'
examples:
- She hollered when she stepped on a sharp stone.
- He hollered across the field to warn us about the dog.
