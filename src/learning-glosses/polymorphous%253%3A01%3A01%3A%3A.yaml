simpleMeaning: Of a compound that sets in two or more shapes.
scope: This sense is of a compound that sets in two or more shapes, unlike the sense for being to do with
  more than one kind of being, apart from sex differences, in a breeding group.
examples:
- The salt was polymorphous, setting in two shapes.
- The compound was polymorphous, of two shapes.
