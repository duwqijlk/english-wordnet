simpleMeaning: A user interface in which commands are typed instead of chosen from a menu or selected
  as an icon
scope: This way of using a computer has orders typed, not picked from a list or chosen as a picture.
examples:
- He used the command line interface to start the program.
- With a command line interface, she typed the order and the machine obeyed.
