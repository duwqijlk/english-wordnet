simpleMeaning: the act of taking a whole thing apart in the mind, rather than with the hands, so as to
  study its parts and how they are related.
scope: This is not the literary criticism that studies how a text is built, and it is not a report of
  findings; it is the general mental act of taking something apart to study it.
examples:
- The course teaches the analysis of large data sets.
- His analysis of the problem broke it into four smaller questions.
