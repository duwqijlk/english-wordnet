simpleMeaning: On a doubled rope wound round the body and tied to a high point, a person climbs down a
  steep face.
scope: This person, also called rappeller, climbs down a steep face on a doubled rope tied to a high point.
examples:
- The abseiler reached the ground.
- The doubled rope held the abseiler on the steep face.
