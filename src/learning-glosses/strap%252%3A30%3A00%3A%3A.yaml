simpleMeaning: to make a blade sharp by using a flat band
scope: To make a blade sharp with a flat band, not to tie a thing, not to beat with a whip or a rod, and
  not to wrap a hurt joint.
examples:
- The barber strapped his razor before the shave.
- He strapped the blade until it was sharp enough to cut.
