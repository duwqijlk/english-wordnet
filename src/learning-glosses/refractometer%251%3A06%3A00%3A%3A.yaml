simpleMeaning: A tool that measures how much a substance bends light passing through it.
scope: A tool that measures how much a substance bends light passing through it, not a tool that measures
  heat or weight.
examples:
- The winemaker checked the juice with a refractometer.
- A refractometer showed how much the liquid bent the light.
