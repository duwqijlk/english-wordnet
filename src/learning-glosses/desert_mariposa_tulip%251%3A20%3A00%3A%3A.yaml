simpleMeaning: A short-stemmed plant with bell-shaped flowers in bright red, orange or yellow, growing
  in clusters; it ranges from southern California through Arizona to Mexico.
scope: A short desert plant with clustered bell-shaped flowers, not the taller desert sunflower.
examples:
- The desert mariposa tulip covered the rocky slope in spring.
- We found a patch of desert mariposa tulips near the trail.
