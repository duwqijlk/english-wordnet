simpleMeaning: to make a wall or building stronger by building a support against it
scope: 'This is the verb: to add a support to make a wall or building stronger, not the noun name for
  the support itself.'
examples:
- Workers buttressed the old church wall with stone.
- They buttressed the side of the old house with a strong stone support.
