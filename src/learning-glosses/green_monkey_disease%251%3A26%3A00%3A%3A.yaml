simpleMeaning: The Marburg virus spreads a sickness among monkeys with leaf-coloured fur that makes people
  badly ill or kills them when it passes to them
scope: A sickness of monkeys spread by the Marburg virus that makes people badly ill or kills them, not
  a sickness of people alone and not a mild illness that passes quickly.
examples:
- Green monkey disease killed several people in the outbreak.
- Doctors feared green monkey disease after the monkeys fell ill.
