simpleMeaning: a ship that gets its power from steam (hot water turned into a gas), with one or more engines
scope: 'Also called a steamer: a ship moved by steam power, not a ship moved by wind and not a ship moved
  by a fuel engine.'
examples:
- The steamship carried people across the sea to America.
- In 1910, a steamship took them across the Atlantic.
