simpleMeaning: A bitter herb from the Old World that grows by hedges and at the edges of woods, with leaves
  that have teeth-like edges and white or pale pink flowers.
scope: Used for a bitter herb picked by hedges, with toothed leaves and white or pale pink flowers.
examples:
- Motherwort grew along the old hedge.
- She picked motherwort with its pale pink flowers.
