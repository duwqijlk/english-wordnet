simpleMeaning: a substance put into soap or wash stuff to make it clean things better
scope: This is a substance put into soap or wash stuff to make it clean things better, also called builder;
  not the soap itself and not a substance that gives soap its smell.
examples:
- The detergent builder in this powder helps it shift grease.
- Makers add a detergent builder to make the soap clean better.
