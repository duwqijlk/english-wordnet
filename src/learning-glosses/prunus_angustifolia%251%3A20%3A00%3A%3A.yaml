scope: This is a small shrubby tree of North America with small edible yellow to reddish fruit; chickasaw
  plum, hog plum and hog plum bush are other names for this sense, and it is one of the wild plum trees
  of North America, close to the chokecherry and the pin cherry.
examples:
- Prunus angustifolia grows wild in the south of North America.
- The fruit of Prunus angustifolia turns yellow to reddish as it ripens.
