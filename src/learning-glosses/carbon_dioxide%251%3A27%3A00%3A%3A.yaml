simpleMeaning: Dead matter gives off this heavy, colourless, smell-free substance as it rots, and living
  things breathe it out; green plants take it in to make food from sunlight.
scope: 'Also called carbonic acid gas: the heavy gas living things breathe out and plants take in, not
  the gas plants give off in sunlight.'
examples:
- Plants take in carbon dioxide from the air to make food from sunlight.
- Carbon dioxide is made when living things breathe and when dead matter rots.
