simpleMeaning: In grammar, words or a phrase added to a sentence to give a word or phrase more meaning,
  but not a main part of the sentence
scope: This sense is an added part of a sentence that gives more meaning; it is not the main person or
  action the sentence is about, and not a helper or extra worker.
examples:
- In 'She sang happily', the word 'happily' is an adjunct.
- The teacher showed how an adjunct can add time or place to a sentence.
