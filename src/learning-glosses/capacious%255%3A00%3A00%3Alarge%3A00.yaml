simpleMeaning: large inside and able to hold a lot
scope: This is about how much a thing can hold inside, not just being big on the outside and not being
  wide or tall in size alone.
examples:
- She carried a capacious bag that held all her books and clothes.
- The capacious hall could hold five hundred people for the show.
