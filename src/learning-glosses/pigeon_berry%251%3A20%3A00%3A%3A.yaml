simpleMeaning: A tall, rough perennial American plant with small white flowers and dark red fruit in long
  hanging clusters; young thick stems can be eaten, but fruit and root are toxic.
scope: This is the tall American plant with edible young stems and poisonous dark fruit, not a garden
  fruit bush.
examples:
- A pigeon berry plant was sprawling over the old stone wall.
- The pigeon berry's dark fruit looks tempting but should never be eaten.
