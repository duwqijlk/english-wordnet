simpleMeaning: One of many small green plants of the group Hepaticopsida, with no tubes to carry water,
  that grow in wet places and look like green seaweeds or leafy mosses.
scope: Also called hepatic, it is a small green plant of wet places, not a moss and not a seaweed.
examples:
- Liverwort grows in wet places and looks like a green seaweed.
- The liverwort looks like a leafy moss.
