simpleMeaning: A pungent blend of cumin, ground coriander seed, turmeric and other spices.
scope: A dry powder made by blending these spices and used to flavour food; it is the spice mix itself,
  not a cooked curry dish or sauce.
examples:
- She stirred a spoonful of curry powder into the sauce.
- He added curry powder to the stew for extra flavour.
