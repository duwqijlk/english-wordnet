simpleMeaning: A drug that calms the mind and treats a severe mind sickness other drugs cannot help; sold
  as Clozaril, it is known for few bad after-effects.
scope: This is a drug that calms the mind and treats a severe mind sickness other drugs cannot help; not
  a drug for ordinary worry and not a sleeping pill.
examples:
- The doctor gave her clozapine when other drugs had not helped.
- He takes clozapine each night to keep his mind calm.
