simpleMeaning: An agency that works across many lands and lets their intelligence services work together.
scope: This agency helps the intelligence services of many lands work together, not the police of any
  one country.
examples:
- Interpol helped the police in three countries catch the thief.
- The two countries shared the news through Interpol.
