simpleMeaning: A half-solid oily mix from crude oil, put on skin in healing creams and on moving parts
  to grease them.
scope: It is also called petrolatum and mineral jelly, the half-solid oily mix from crude oil for healing
  creams and greasing.
examples:
- She put petroleum jelly on her lips.
- He used petroleum jelly to grease the hinge.
