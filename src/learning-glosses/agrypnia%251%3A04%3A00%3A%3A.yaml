simpleMeaning: a night spent awake in prayer before certain holy days, such as Easter
scope: A night spent awake in prayer before certain holy days; not the holy day itself and not a fast.
examples:
- The monks kept agrypnia before Easter.
- Agrypnia is a night of prayer before a feast.
