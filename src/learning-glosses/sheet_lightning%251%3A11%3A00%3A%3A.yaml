senseId: 'sheet_lightning%1:11:00::'
synsetId: 07428052-n
simpleMeaning: Clouds spread out light bounced back from far-off flashes, so it shows as a wide spread
  of light in the sky.
scope: It is a wide spread of light across the sky, not a narrow stroke of light.
examples:
- We watched the sheet lightning spread across the clouds.
- Far-off flashes made the sheet lightning spread across the sky.
