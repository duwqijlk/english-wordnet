simpleMeaning: A person skilled at gathering and reading numbers, above all one who uses figures to work
  out what it costs to insure people.
scope: Also called statistician, this is a person whose work is gathering and reading numbers, above all
  the figures behind what it costs to insure people.
examples:
- The actuary worked out what the new policy should cost.
- An actuary at the firm used figures to set the price of cover.
