simpleMeaning: A place where logs and cut wood are shaped and made smooth
scope: Also called a sawmill, this is a place where logs and cut wood are shaped and made smooth, not
  a place that cuts down trees and not a shop that sells wood.
examples:
- The lumbermill cut the logs into planks for the new house.
- He worked at the lumbermill all summer.
