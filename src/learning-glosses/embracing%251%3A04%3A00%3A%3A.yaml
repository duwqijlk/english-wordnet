simpleMeaning: Taking a person in your arms and holding them close, as when you meet them or show them
  love.
scope: Also called an embrace, this is holding a person close in your arms in greeting or love, not merely
  standing near a person.
examples:
- Their embracing at the station made everyone smile.
- A warm embracing followed the long parting.
