simpleMeaning: Found in heaps of hard wood dust, it is a fungus you can eat, with black caps that are
  rough and full of folds.
scope: It is a fungus you can eat, found in heaps of hard wood dust, and not one of the fungi that grow
  on open ground.
examples:
- A sawdust mushroom grew on a heap of wood dust.
- They ate a sawdust mushroom with a black wrinkled cap.
