simpleMeaning: a chemical made of oxygen and another part, with three oxygen atoms in each molecule
scope: This is a chemical with three oxygen atoms in each molecule. Not a chemical with two oxygen atoms
  and not a chemical with no oxygen at all.
examples:
- Sulfur trioxide is a trioxide used to make sulfuric acid.
- Arsenic trioxide is a trioxide that can be very harmful.
