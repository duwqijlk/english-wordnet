simpleMeaning: to break something into tiny bits by hitting it again and again or by rubbing it hard
scope: To crush or rub something into small bits; grind, crunch and mash are other names for this sense,
  and it is not the loud cry of a donkey.
examples:
- She brayed the spices in a heavy stone bowl.
- He brayed the garlic until it was a smooth paste.
