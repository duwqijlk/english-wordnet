simpleMeaning: slightly wet with sweat that has not dried, so clothes stay close against the skin
scope: This is about skin and clothes feeling wet with sweat, not about a surface that holds things to
  it like glue.
examples:
- After the run, his shirt felt sticky against his back.
- On the hot night, the children felt sticky and uncomfortable in their clothes.
