simpleMeaning: Pleased with yourself, knowing little, and caring nothing for art and culture, or set against
  them.
scope: 'Also called anti-intellectual: smug and unknowing about art and culture, not a person with that
  outlook.'
examples:
- His views on art are philistine and narrow.
- The committee was philistine about the new gallery.
