simpleMeaning: an unhappy remark said in a low voice that is hard to hear clearly
scope: 'Also called mutter and murmur: a complaint said quietly and unclearly, not the act of complaining
  and not a loud low noise.'
examples:
- She let out a grumble about the cold room.
- His grumble was so quiet I could barely hear it.
