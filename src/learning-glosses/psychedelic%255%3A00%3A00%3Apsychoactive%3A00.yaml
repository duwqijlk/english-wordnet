senseId: psychedelic%5:00:00:psychoactive:00
synsetId: 01782367-s
simpleMeaning: making what a person sees, hears, and feels seem changed and not real, or changing how
  aware they are, or sometimes a state like a serious illness of the mind
scope: About something that causes these effects, such as a drug, not about the changed mental state itself
  and not about bright colors and strange patterns.
examples:
- The psychedelic drug made the walls seem to move.
- A psychedelic mushroom can change how a person sees and hears the world.
