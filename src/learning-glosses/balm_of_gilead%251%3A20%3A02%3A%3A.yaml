simpleMeaning: In Africa and Asia grows a small tree that never loses its leaves; crush a leaf, and a
  strong smell comes off it.
scope: This small tree of Africa and Asia stays green all year, and its crushed leaves give off a strong
  smell.
examples:
- We crushed a leaf of the balm of gilead and smelled it.
- The balm of gilead stayed green through the year.
