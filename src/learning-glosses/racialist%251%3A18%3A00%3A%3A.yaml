simpleMeaning: A person who holds an unfair view that one group of people is better than all the others
  because of race
scope: 'Another name for a racist: a person who holds an unfair view that one group is better than the
  rest, not someone who simply takes pride in their own people.'
examples:
- The racialist argued that his own group was better than all the rest.
- She refused to listen to the racialist's claims about who was best.
