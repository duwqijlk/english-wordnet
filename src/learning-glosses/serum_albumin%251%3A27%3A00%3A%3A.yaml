simpleMeaning: A protein found in the clear part of blood, which keeps the blood's pressure steady
scope: A protein found in the clear part of blood that keeps the blood's pressure steady, not the like-named
  protein in egg white and not the protein that carries oxygen in blood.
examples:
- Serum albumin keeps the blood's pressure steady.
- Low serum albumin can mean poor food intake.
