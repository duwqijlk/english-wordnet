simpleMeaning: thinking in a happy way that things will go well, even when that is not likely to be true
scope: This is thinking that things will go well, even when that is not likely, not being full of happiness
  and showing a good mood.
examples:
- He stayed cheerful about the future, even though the chances were small.
- She kept a cheerful view of the plan, thinking it would work even when others doubted it.
