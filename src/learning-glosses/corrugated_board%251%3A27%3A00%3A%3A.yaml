simpleMeaning: thick paper with wavy ridges that can be stuck to flat thick paper on one side or both
scope: This is thick paper with wavy ridges, also called corrugated cardboard; not flat paper and not
  a solid sheet of wood.
examples:
- The box was made of corrugated board with wavy ridges inside.
- We cut a sheet of corrugated board to pack the glasses.
