simpleMeaning: a plant that lives one year, grown for food for farm animals and for seeds that give oil,
  found all over the United States and much of North America
scope: This is a plant grown for farm-animal food and seeds that give oil, also called mirasol; not a
  flower grown only for show.
examples:
- The farmer planted common sunflowers to feed his cows in winter.
- We pressed the common sunflower seeds for oil.
