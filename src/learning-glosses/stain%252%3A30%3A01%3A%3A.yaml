simpleMeaning: to change the color of something by using a liquid with color in it
scope: To color something on purpose with a liquid color; not making or leaving dirty marks on something,
  and not making something dirty by air.
examples:
- Stain the wood a dark brown before you put it outside.
- People once knew how to stain glass a deep blue.
