simpleMeaning: A pastry whose dough includes cream cheese, with different fillings, such as raisins, walnuts
  and cinnamon, or chocolate, walnuts and apricot jam.
scope: Another name for rugelach and rugulah, the same cream-cheese pastry; not a strudel or a Danish
  pastry.
examples:
- My grandmother makes ruggelach with a cream cheese dough and a walnut filling.
- We ate ruggelach filled with chocolate and walnuts.
