simpleMeaning: not following in a clear order, with parts that do not join up well
scope: 'Also called confused, scattered, disconnected, illogical, disjointed, unconnected, and disordered:
  with parts that do not follow in a clear order. Not clear, well-ordered speech or writing.'
examples:
- His garbled story jumped from one event to another with no clear order.
- The garbled instructions were hard to follow because the steps did not join up.
