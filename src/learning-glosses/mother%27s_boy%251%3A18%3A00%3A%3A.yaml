simpleMeaning: Too close to the woman who gave birth to him, this young male shows few of the usual interests
  of males
scope: 'Also called a mama''s boy: a young male who clings too much to the woman who gave birth to him
  and shows few of the usual interests of males, not a young male who is close to his father and not one
  with many friends of his own age.'
examples:
- He was still a mother's boy at twenty, calling home every day.
- The other lads teased him for being such a mother's boy.
