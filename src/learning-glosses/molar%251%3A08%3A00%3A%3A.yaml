simpleMeaning: a back tooth with a wide flat top for grinding food, set behind the smaller teeth in front
scope: A back tooth with a wide top for grinding food; grinder is another name for this sense, and it
  is not a front tooth or a tooth for cutting.
examples:
- The dentist filled her molar.
- He cracked a molar on a hard nut.
