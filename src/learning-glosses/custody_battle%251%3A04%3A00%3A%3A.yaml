simpleMeaning: a court case that decides which parent a child of a divorced couple lives with
scope: A court case about where a divorced couple's children will live, not a fight between the couple
  and not a case about money or a home.
examples:
- The custody battle lasted for months before the judge made a ruling.
- Their custody battle ended when the court gave the mother care of the children.
