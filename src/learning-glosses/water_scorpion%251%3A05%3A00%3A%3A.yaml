simpleMeaning: a long-legged insect of the water whose front legs are made to catch and hold prey, with
  a long tube at the end of its body for breathing
scope: A long-legged insect of the water that catches prey with its front legs, not a scorpion and not
  a water beetle.
examples:
- The water scorpion waited in the shallows, its front legs ready to seize passing prey.
- A water scorpion breathed through the long tube at the end of its body.
