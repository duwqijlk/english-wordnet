simpleMeaning: going beyond the usual limits, especially by being very good
scope: 'Also called transcendent: going beyond the usual limits, especially in how good something is,
  not just good in the normal way and not just better than one other thing.'
examples:
- Her surpassing skill as a pianist amazed everyone in the hall.
- He showed surpassing kindness to people he did not know.
