simpleMeaning: A tiny one-celled green living thing in fresh water, with one whip-like tail, often put
  with the algae.
scope: A tiny green one-celled thing of fresh water, not a plant with leaves and not a fish; no other
  name is listed for this sense.
examples:
- Under the lens, a euglena moved by its whip-like tail.
- The pond water held euglena among the algae.
