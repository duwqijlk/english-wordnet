senseId: 'vertebral_canal%1:08:00::'
synsetId: 05256575-n
simpleMeaning: The passage in one backbone after another through which the cord of the spine passes.
scope: The passage through the backbones for the cord of the spine; canalis vertebralis and spinal canal
  are other names for this sense; not the skull and not a blood tube.
examples:
- The vertebral canal carries the cord of the spine through the backbones.
- A narrow vertebral canal can press on the cord of the spine.
