simpleMeaning: In the study of sense, the idea that the smallest change you can notice in a thing you
  sense grows with the size of the thing itself
scope: In the study of sense, this idea links the smallest change you can notice to the size of the thing
  you sense, so bigger things need bigger changes to be noticed.
examples:
- Weber's law explains why you don't notice your headlights are on in the daytime.
- By Weber's law, the smallest change you notice grows with the size of the thing itself.
