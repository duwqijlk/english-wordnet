simpleMeaning: someone under another person's control who is made to do unpleasant or dishonest jobs for
  them.
scope: 'Another name for a puppet or tool: a person under someone else''s control, not a living being
  in general or an animal.'
examples:
- The dictator used his creature to spread lies about the election.
- He was little more than a creature of the company, doing its dirty work.
