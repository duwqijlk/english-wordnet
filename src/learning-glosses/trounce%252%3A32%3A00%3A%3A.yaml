simpleMeaning: to tell someone off in a hard and angry way for what they did wrong
scope: 'Also called jaw, rag, lecture, scold, chide, rebuke, berate, reprimand, remonstrate, lambaste
  and lambast: to tell someone off angrily, not to hit them with a whip or a rod.'
examples:
- The mother trounced her son for going off with a stranger.
- The boss trounced the worker in front of everyone for the costly mistake.
