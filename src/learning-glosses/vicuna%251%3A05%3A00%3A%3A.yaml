simpleMeaning: Prized for the soft woolly coat underneath it, this small wild animal of the Andes chews
  its food twice and looks like the guanaco but is smaller.
scope: Of the small wild animals of the Andes, this one looks like the guanaco but is smaller, and its
  soft woolly undercoat is prized, not the larger guanaco itself.
examples:
- A vicuna stood on the high slopes, smaller than the guanaco nearby.
- The vicuna is smaller than the guanaco standing next to it.
