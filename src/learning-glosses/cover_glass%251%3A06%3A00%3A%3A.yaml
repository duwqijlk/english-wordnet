simpleMeaning: the small bit of stuff on a microscope slide is kept under a tiny, very thin clear sheet
scope: A tiny, very thin clear sheet laid over a specimen on a microscope slide; cover slip is another
  name for this sense, not the slide itself and not the lens of the microscope.
examples:
- She placed a cover glass over the drop of water on the slide.
- The cover glass cracked when he pressed it down too hard.
