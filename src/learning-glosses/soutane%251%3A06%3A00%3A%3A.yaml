simpleMeaning: A long robe like a priest's gown, with buttons down the front, worn by Roman Catholic priests
scope: A long robe with buttons down the front worn by Roman Catholic priests, not a short jacket and
  not a robe worn by other clergy.
examples:
- The priest wore a long black soutane with buttons down the front.
- His soutane reached almost to the floor.
