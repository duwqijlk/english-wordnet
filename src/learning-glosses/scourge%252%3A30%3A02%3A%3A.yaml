simpleMeaning: To wreck a place or thing so fully that it is ruined and little is left.
scope: To destroy a place or thing completely; waste, devastate, ravage and desolate are other names for
  this sense, and it is not the whip used to punish nor the act of punishing someone.
examples:
- War scourged the countryside for years.
- The disease scourged whole towns.
