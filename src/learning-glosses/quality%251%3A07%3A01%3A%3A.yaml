simpleMeaning: In music, the special character of a complex sound that sets it apart from other sounds,
  whether a voice, a noise, or a musical tone.
scope: This is the character of a sound, not an essential and distinguishing attribute of something or
  someone, not a degree or grade of excellence or worth, not a characteristic property that defines something's
  apparent individual nature, not high social status, and not the adjective senses meaning of superior
  grade or of high social status.
examples:
- Critics praised the warm quality of her singing voice.
- The two violins had the same pitch but a different quality of sound.
