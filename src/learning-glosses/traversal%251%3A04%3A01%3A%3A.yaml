simpleMeaning: To go from one side of a place to the other
scope: To go from one side of a place to the other, traverse being another name for this sense; not to
  go around a place and not to stay in one spot.
examples:
- The traversal of the desert took three weeks.
- Their traversal of the mountains was slow and hard.
