simpleMeaning: A rock with large crystals held in a fine ground of minerals, or made of a hard stone with
  large bits in it, is called this.
scope: This word marks rocks with large crystals in a fine ground of minerals, not rocks whose grains
  are all of one size.
examples:
- The porphyritic rock had large crystals set in a fine ground.
- Large crystals stood out in the porphyritic rock.
