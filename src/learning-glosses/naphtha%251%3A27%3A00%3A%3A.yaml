simpleMeaning: Used most of all to dissolve things, it is any of several mixes of liquids, made of hydrogen
  and carbon, that turn to gas fast and catch fire fast.
scope: It dissolves things, and is one of several mixes of liquids that turn to gas fast and catch fire
  fast.
examples:
- Grease on metal can be dissolved with naphtha.
- The naphtha dissolved the grease fast.
