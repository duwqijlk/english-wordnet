simpleMeaning: a plant with no woody stem that lives for many years and grows in the woods of the eastern
  United States, with yellow flowers
scope: A plant with no woody stem that lives for many years in the woods of the eastern United States
  and has yellow flowers, not a common poppy of open fields and not a short-lived garden plant.
examples:
- The celandine poppy bloomed with bright yellow flowers under the trees.
- We found a celandine poppy growing in the woods behind the house.
