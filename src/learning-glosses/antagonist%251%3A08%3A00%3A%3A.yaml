simpleMeaning: a muscle that relaxes while another muscle tightens
scope: This is a muscle that relaxes while another muscle works; it is not a person who opposes or fights
  against someone else.
examples:
- When you bend your elbow, the triceps is the antagonist and relaxes.
- In this movement, one muscle is the antagonist while the other muscle tightens.
