simpleMeaning: to talk or act in a loving, sexual way with someone, without meaning it in a serious way
scope: To talk or act in a loving way without serious meaning, also called butterfly, romance and mash.
  It is not acting with no care, and not the noun for the acting or the woman.
examples:
- He flirted with her at the party, but he did not want a real relationship.
- She often flirts with men at work just for fun.
