simpleMeaning: A plant part with a smooth edge that has no cuts or dents in it.
scope: A plant part with a smooth edge and no cuts or dents, not a part with a toothed edge and not a
  part with deep cuts.
examples:
- The entire leaf had a smooth edge with no cuts.
- This entire leaf shows no notches at all.
