simpleMeaning: A chess piece shaped like a horse's head that moves two squares one way and one square
  at a right angle.
scope: This is the chess piece, also called a horse; it is not the titled man, and not the verb for raising
  someone to that rank.
examples:
- She moved her knight to the center of the board.
- The knight can jump over the pawns in front of it.
