simpleMeaning: an opening or tunnel made by a turning tool, most often made to find out what lies under
  the ground
scope: 'Also called bore and drill hole: an opening made by a drilling tool, most often to explore what
  lies beneath, not a natural cave and not a tunnel dug by hand.'
examples:
- The workers drilled a bore-hole to test the ground before building.
- A bore-hole near the field showed water deep below the surface.
