synsetId: 10376906-n
simpleMeaning: A child, or a person who cannot act for themselves, has someone who acts for them in law
scope: In law, one person acts for a child or a person who cannot act for themselves; not a lawyer for
  a grown person who can act for themselves.
examples:
- The court let her next friend speak for her in the case.
- His next friend signed the papers for him because he could not do it himself.
