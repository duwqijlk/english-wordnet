simpleMeaning: the flying out of small pieces of a bomb in all directions after the bomb blows up
scope: This is about a bomb blowing up and its small pieces flying out, not a computer file broken up
  and kept in many places, and not the breakdown of shared rules in society.
examples:
- The fragmentation from the exploding bomb sent small pieces flying across the field.
- Soldiers were taught to take cover, because fragmentation can hurt people far from where a bomb blows
  up.
