simpleMeaning: A food fish of fresh water or the coast, with a long thin body that narrows at both ends,
  found all over the world
scope: This is a food fish of fresh water or the coast; mullet and gray mullet are other names for this
  sense, not the flesh of the fish eaten as food and not a sea bass.
examples:
- Grey mullet swim in the harbour in large groups.
- We caught grey mullet off the pier at dawn.
