simpleMeaning: In chemistry, how capable a substance is of reacting chemically.
scope: This is a measure used in chemistry, not a person's energetic manner or the general condition of
  being busy or doing things.
examples:
- The catalyst's activity dropped sharply at low temperatures.
- Scientists measured the activity of the enzyme before and after heating.
