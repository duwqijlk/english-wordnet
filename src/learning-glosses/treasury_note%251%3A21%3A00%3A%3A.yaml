synsetId: 13416080-n
simpleMeaning: Government papers that pay back in 1 to 10 years, sold for cash, in trade for papers that
  are due, or at a sale to the highest bidder.
scope: Government debt that runs 1 to 10 years, not a share in a firm, not a bank loan, and not a short
  paper that pays back in under a year.
examples:
- She bought a Treasury note that pays back in five years.
- Treasury notes are sold at auction.
