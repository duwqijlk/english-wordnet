simpleMeaning: The bony pillar in the middle of the cochlea, the part of the inner ear that hears sound,
  shaped like a cone
scope: The bony pillar in the middle of the cochlea, not the outer wall of the ear and not the nerve that
  carries sound.
examples:
- The modiolus runs through the centre of the cochlea.
- Damage to the modiolus can harm hearing.
