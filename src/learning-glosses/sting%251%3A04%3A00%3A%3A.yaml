simpleMeaning: a trick to get money by cheating at a game of chance or by getting a person to pay for
  a thing with no worth
scope: Also called a con, this is a trick to get money by cheating or by selling a thing with no worth,
  not a sore mark from an insect and not a sharp pain.
examples:
- The sting was a trick at the card table, and he lost all his money to men who cheated him.
- She fell for the sting and paid good money for a watch that had no worth at all.
