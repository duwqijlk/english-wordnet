simpleMeaning: the fact that something can be shown to be true or proved by clear thinking
scope: That something can be shown to be true or proved by clear thinking, also called provability; not
  the act of showing something and not a thing that is already known to be true.
examples:
- The demonstrability of the claim made it easy to accept.
- Her proof showed the demonstrability of the new theory.
