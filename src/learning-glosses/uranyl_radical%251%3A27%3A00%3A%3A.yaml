simpleMeaning: a chemical part made from uranium and oxygen, with two links free to join, that links with
  acids to form salts
scope: 'Another name for uranyl and uranyl group: a chemical part with two free links, not a full chemical
  on its own and not the acid it joins with.'
examples:
- The uranyl radical joined with acid to make a salt.
- The chemist used a uranyl radical to form a new salt.
