simpleMeaning: an area of rough water in a river or the sea, made when one flow of water runs into or
  across another flow
scope: 'Also called rip and crosscurrent: an area of rough water where flows meet, not a strong flow that
  moves away from the shore.'
examples:
- The boat shook as it crossed the riptide where the two flows met.
- A riptide formed in the river where one flow ran across another.
