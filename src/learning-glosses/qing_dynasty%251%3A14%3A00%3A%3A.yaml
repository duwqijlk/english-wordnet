simpleMeaning: The last line of emperors of China, from 1644 to 1912, overthrown by rebels; under it China
  was ruled by the Manchu.
scope: The last imperial line of China, from 1644 to 1912, ruled by the Manchu; also called Qing, Ch'ing,
  Ch'ing dynasty, Manchu and Manchu dynasty.
examples:
- The Qing dynasty was the last imperial line to rule China.
- Under the Qing dynasty, Manchu rulers governed China.
