simpleMeaning: one of many plants from cold parts of the north, in the Sedum group, with thick soft leaves
  and red, yellow, or white flowers
scope: A plant from cold parts of the north with thick leaves and red, yellow, or white flowers, not a
  stone-like bone and not hard clay ware.
examples:
- The stonecrop grew in a dry patch by the wall.
- Stonecrop flowers turned the roof garden red in summer.
