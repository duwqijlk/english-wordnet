simpleMeaning: the smallest length of a track that can be set aside to store information; unless stated
  otherwise, such a piece of data is 512 bytes
scope: In computers, the smallest piece of a track set aside for storing data, not a measuring tool with
  two arms and not a shape cut from a circle.
examples:
- The disk stores data in a sector of 512 bytes.
- If one sector is damaged, that small piece of data may be lost.
