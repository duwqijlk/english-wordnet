simpleMeaning: A woman who holds the rank of baron herself, or who has it because her husband is a baron
  or has died as one
scope: A woman who holds this rank herself, or who is the wife or widow of a man who does; not the man
  himself.
examples:
- The baroness welcomed the guests to her large country house.
- After her husband died, the baroness kept his title and his land.
