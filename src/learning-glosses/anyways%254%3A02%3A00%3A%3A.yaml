simpleMeaning: Used to show that what you say next backs up or explains something you have just said
scope: This is a word used to show that what follows backs up or explains what was just said; anyway and
  anyhow are other names for this sense.
examples:
- I think they're asleep; anyways, they're quiet.
- He must be ill; anyways, he stayed in bed all day.
