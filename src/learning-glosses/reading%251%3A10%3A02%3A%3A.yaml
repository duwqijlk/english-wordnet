simpleMeaning: a public performance in which someone recites something learned by heart beforehand
scope: Not the silent act of looking at written words, and not an instrument measurement; it is a spoken
  performance from memory.
examples:
- Her reading of the famous speech was delivered entirely from memory.
- At the festival, his reading of the epic poem was given without notes.
