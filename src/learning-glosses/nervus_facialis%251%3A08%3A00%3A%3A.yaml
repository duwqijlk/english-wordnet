simpleMeaning: The nerve of the head that works the muscles of the face.
scope: The nerve of the head that works the muscles of the face, not the nerve that carries sight and
  not the nerve that carries hearing; also called facial and facial nerve.
examples:
- The nervus facialis works the muscles of the face.
- Harm to the nervus facialis can stop one side of the face from moving.
