simpleMeaning: a person who tries to help people stop fighting and live in peace
scope: This is a person who helps others stop fighting and live in peace, not fighting itself and not
  an agreement that ends a fight.
examples:
- The peacemaker sat with both sides and helped them agree.
- As a peacemaker, she listened to each group and calmed the argument.
