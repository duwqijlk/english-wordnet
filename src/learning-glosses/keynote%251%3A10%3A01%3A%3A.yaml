simpleMeaning: the main idea in a speech or in a work of writing made as art, such as a novel, poem or
  play
scope: 'This is the main idea in a speech or in a work of writing made as art. Not the verb senses: setting
  the main idea for something, or giving a main speech to people.'
examples:
- The keynote of her speech was that every child needs a safe home.
- Forgiveness is the keynote of the whole novel.
