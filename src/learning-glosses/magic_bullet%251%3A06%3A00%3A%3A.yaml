simpleMeaning: A cure or safeguard, in the form of a drug, a treatment or a preventive step, that gets
  rid of a disease or stops it
scope: A drug, treatment or preventive step that cures or stops a disease; not a partial treatment and
  not a wish.
examples:
- Doctors hoped the new drug would be a magic bullet against the disease.
- There is still no magic bullet that can cure every kind of cancer.
