simpleMeaning: People keep things in this box with a lid; it is usually big and strong.
scope: This is the lidded storage box, not the body part at the front of the torso.
examples:
- She kept her grandmother's letters in a wooden chest under the bed.
- The chest was too heavy to lift onto the truck.
