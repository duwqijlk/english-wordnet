simpleMeaning: a butterfly much like the banded kind, but with bright marks of a deep rose colour on the
  undersides of its wings
scope: A butterfly like the banded purple but with bright marks under its wings, not the banded purple
  itself and not a red admiral.
examples:
- A red-spotted purple rested on the leaf, its wings closed.
- We saw a red-spotted purple with bright marks under its wings.
