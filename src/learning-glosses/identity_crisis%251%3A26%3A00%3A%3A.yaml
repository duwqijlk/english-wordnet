simpleMeaning: A troubled state, above all in the teen years, when clashing demands leave a person lost
  and unsure of who they are and what part they play in life.
scope: A troubled state of feeling lost about who one is.
examples:
- His identity crisis began when he left school and did not know what to do next.
- She went through an identity crisis in her teens and questioned everything about herself.
