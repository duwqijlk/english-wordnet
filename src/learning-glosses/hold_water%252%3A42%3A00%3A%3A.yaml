simpleMeaning: when people test it, an idea stays true, and a thing keeps working through hard use
scope: 'Also called hold up: to stay true or last well when tested, not to keep water in a thing and not
  to lift a thing.'
examples:
- This theory won't hold water once you check the facts.
- Her story did not hold water when the police asked her more.
