simpleMeaning: 'of a check: carrying two lines drawn over it as a sign that the money may only be paid
  into an account'
scope: A check carrying two lines that limit it to deposit, not two things laid one over the other.
examples:
- The clerk would not cash the crossed check at the counter.
- Write a crossed check if the money must go straight into the payee's account.
