simpleMeaning: an anxiety disorder in which a person fears ordinary things or meeting people far more
  than the danger calls for
scope: A fear so strong and unreasonable that it is a disorder, not an ordinary dislike and not a brief
  scare.
examples:
- Her phobia of spiders kept her out of the garden.
- His phobia made meeting new people feel impossible.
