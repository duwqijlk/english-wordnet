simpleMeaning: This mineral runs from green to black and belongs to the amphibole group, a set of minerals
  built from silicon and oxygen together with calcium, sodium, magnesium and iron.
scope: It is a mineral of the amphibole group, green to black in colour, made up of silicon and oxygen
  with calcium, sodium, magnesium and iron.
examples:
- Hornblende gave the dark rock its black-green colour.
- The hornblende in this stone holds iron and magnesium.
