simpleMeaning: For homes and towns, not for war, energy from the centres of atoms is turned into electricity
  that the wires carry
scope: This is energy from the centres of atoms used to make electricity for homes and towns, also called
  atomic power; not a bomb, and not power from coal or wind.
examples:
- The town gets much of its electricity from nuclear power.
- Nuclear power plants make electricity without burning coal.
