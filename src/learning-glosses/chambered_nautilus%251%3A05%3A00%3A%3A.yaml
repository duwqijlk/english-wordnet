simpleMeaning: A cephalopod, a sea animal of the octopus and squid kind, living in the Indian and Pacific
  oceans, with a coiled shell divided inside by pale walls like pearl.
scope: Also called nautilus and pearly nautilus; a coiled-shell sea animal of the Indian and Pacific oceans,
  not an octopus and not a snail.
examples:
- The chambered nautilus swims in the Indian and Pacific oceans.
- A chambered nautilus has a coiled shell with pearly walls inside.
