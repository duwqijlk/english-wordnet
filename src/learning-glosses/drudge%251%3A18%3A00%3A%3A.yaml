simpleMeaning: a worker who has to do low-level work that needs little skill and is not interesting
scope: 'Also called peon: a person who has to do low, boring work, not a boss and not a worker doing a
  skilled job.'
examples:
- For years he was a drudge in the kitchen, washing dishes all day.
- The drudge cleaned the floors while the others gave the orders.
