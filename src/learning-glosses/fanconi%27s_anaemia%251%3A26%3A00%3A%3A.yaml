simpleMeaning: A rare sickness present from birth, in which the blood has too few cells of all kinds and
  the marrow inside the bones is too small
scope: Also called congenital pancytopenia and Fanconi's anemia, this rare sickness is present from birth,
  with too few cells of all kinds in the blood and marrow inside the bones that is too small, unlike a
  sickness caught later in life or one that affects only one kind of blood cell.
examples:
- Fanconi's anaemia is present from birth.
- A child with Fanconi's anaemia has too few blood cells.
