senseId: 'romance%2:32:01::'
synsetId: 01039782-v
simpleMeaning: to talk to or act with someone in a loving way, without meaning it in a serious way
scope: 'Butterfly, flirt and mash are other names for this sense: to talk to or act with someone in a
  loving way without being serious. Not a story book about perfect events far from everyday life, not
  an exciting, strange quality, and not telling untrue tales in a loving way or making things sound bigger
  than they are.'
examples:
- He tried to romance her with flowers, but he was not serious.
- They romanced for a few weeks and then stopped calling.
