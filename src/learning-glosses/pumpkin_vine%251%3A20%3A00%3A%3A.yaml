simpleMeaning: A rough trailing plant cultivated for its large pulpy round orange fruit with firm skin
  and many seeds; summer squashes and a few late-season squashes belong to the same species.
scope: The whole trailing plant, not the fruit it carries or a single squash.
examples:
- A pumpkin vine had crept over the fence into the neighbour's yard.
- She followed the pumpkin vine to see where the fruit was growing.
