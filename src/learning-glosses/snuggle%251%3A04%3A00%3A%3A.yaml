simpleMeaning: when you hold someone close in a loving hug, often for a long time
scope: A warm hug, also called a nestle or a cuddle; not the verb sense of settling into a cozy spot.
examples:
- She gave the little boy a long snuggle before bed.
- After the sad news, they held each other in a quiet snuggle.
