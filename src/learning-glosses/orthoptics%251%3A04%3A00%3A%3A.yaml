simpleMeaning: Above all by work that makes the eye muscles stronger, faults in seeing with both eyes
  together, such as a squint or a lazy eye, are treated without surgery.
scope: Treatment of faults in seeing with both eyes together by work that makes the eye muscles stronger,
  not by surgery on the eyes.
examples:
- Orthoptics helped her squint without surgery.
- The child went for orthoptics to make the eye muscles stronger.
