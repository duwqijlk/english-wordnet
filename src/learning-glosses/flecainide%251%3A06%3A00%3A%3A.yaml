simpleMeaning: By mouth, sold as Tambocor, this drug treats a heart that beats wrong when nothing else
  works, though it raises the risk of sudden death after a heart attack.
scope: A drug for a heart that beats wrong, used only when nothing else works, not a first-choice treatment.
examples:
- The doctor gave him flecainide when other drugs failed.
- Flecainide helped her heart beat in time.
