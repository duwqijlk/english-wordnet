simpleMeaning: able to be believed and depended on
scope: Also called trustworthy. This describes a person or thing you can believe and depend on, not a
  prisoner given special rights because he is seen as safe and honest.
examples:
- She is a trusty friend who always keeps her word.
- They took their trusty old car on the long trip.
