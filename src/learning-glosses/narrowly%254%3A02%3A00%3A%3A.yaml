simpleMeaning: in a strict, close way that leaves no room for other cases
scope: In a strict way that allows nothing outside the rule, not by a small amount and not in a small
  space.
examples:
- He interprets the law narrowly, allowing no exceptions.
- The rule was read narrowly, so few cases fit it.
