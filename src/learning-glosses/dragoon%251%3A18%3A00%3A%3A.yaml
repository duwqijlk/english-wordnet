simpleMeaning: A soldier on a horse with heavy weapons, in a European army unit of the past
scope: This is a soldier on horseback from the past in Europe; it is not the verb senses of forcing a
  person to do something or of taking control of a place with soldiers.
examples:
- A dragoon rode into the town on his horse, carrying a heavy gun.
- The museum showed the uniform worn by a dragoon two hundred years ago.
