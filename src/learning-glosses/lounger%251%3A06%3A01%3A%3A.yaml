simpleMeaning: a piece of clothing made to be comfortable and worn in free time, when a person is not
  working
scope: This is a comfortable piece of clothing worn in free time, not the chair whose back goes down so
  a person can lie back in it.
examples:
- She put on a soft lounger and read in the garden.
- He packed a light lounger to wear at the hotel.
