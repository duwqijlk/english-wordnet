simpleMeaning: When a set time ends, the person covered is paid a set sum, and if that person dies first,
  a named person is paid at once.
scope: A set sum is paid out when the set time ends, or at once to a named person if the person covered
  dies, not only on death.
examples:
- His endowment insurance will pay the set sum when the time ends.
- Her endowment insurance names the person who will receive the sum.
