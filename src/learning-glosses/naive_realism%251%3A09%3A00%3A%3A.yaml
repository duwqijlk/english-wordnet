simpleMeaning: In philosophy, the view that real things keep on being there even when no one notices them.
scope: In philosophy, the view that real things keep on being there when no one notices them; realism
  is another name for this, and it is not the view that things are only in the mind or a view about right
  and wrong.
examples:
- Naive realism says the chair is there when no one looks.
- He held to naive realism about the world.
