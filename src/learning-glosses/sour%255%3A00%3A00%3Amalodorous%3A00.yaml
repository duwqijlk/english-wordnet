simpleMeaning: Having a bad smell because it has gone stale or has been left so long that it has started
  to turn
scope: This is a bad smell from something gone stale or left so long that it has started to turn, not
  the taste felt in the mouth from vinegar or lemon juice, not the word for food that has that taste,
  and not a drink mixed with lemon juice.
examples:
- The sour milk in the fridge smelled awful.
- She threw out the sour bread because it smelled stale.
