simpleMeaning: a process in which a star or planet holds a thing in space with its pull
scope: This is the process in which a star or planet holds a thing in space with its pull. Not the process
  in which an atom takes in an extra very small piece of matter, and not the verb sense of making a body
  in space move in a new path around something.
examples:
- The planet's capture of the small rock held it in a steady path around the planet.
- Scientists studied the capture that kept the comet close to the star.
