simpleMeaning: The trade name of a man-made growth hormone of people, given to children who lack the hormone,
  whose use by sportsmen and weightlifters is not allowed.
scope: The trade name of a man-made growth hormone of people, given to children who lack the hormone,
  not a natural growth hormone and not a drug free for sportsmen to use.
examples:
- The doctor gave Protropin to the child who lacked the growth hormone.
- Protropin is banned for athletes and weightlifters.
