simpleMeaning: to push into other people's private matters and get in the way when no one asked you to
scope: Butting into other people's private matters when you are not wanted, not helping or giving advice
  that was asked for.
examples:
- Don't meddle in my affairs!
- She likes to meddle in her neighbours' plans, even when they tell her to stop.
