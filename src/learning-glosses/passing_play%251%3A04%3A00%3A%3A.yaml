simpleMeaning: A person on the same side is the one the ball goes to when one person throws it in American
  football
scope: 'Also called a pass, passing, or a passing game: in American football, the ball goes to a person
  on the same side when one person throws it, not a run with the ball and not a kick.'
examples:
- The coach sent in a passing play on third and long.
- They called a passing play when they needed ten yards.
