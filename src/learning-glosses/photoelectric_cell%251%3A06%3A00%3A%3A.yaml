simpleMeaning: How strong light and other rays are is found by this thing, which turns them into another
  kind of power
scope: 'Another name for a photocell or a photoconductive cell, also called an electric eye or a magic
  eye: a thing that turns light and other rays into power so their strength can be found, not a battery
  and not a lamp.'
examples:
- The photoelectric cell measures the light in the room.
- When light falls on the photoelectric cell, it makes power.
