simpleMeaning: An old measure of length from ancient Rome, about 4.85 English feet, the gap from the heel
  of one foot to where that heel next meets the ground
scope: An old measure of length from ancient Rome, about 4.85 English feet, the gap from the heel of one
  foot to where that heel next meets the ground, not a single step and not a modern measure of length.
examples:
- A Roman pace was about five feet long.
- He walked a Roman pace from heel to heel.
