simpleMeaning: A man-made strong drug like morphine but less likely to make people keep needing it; used
  to help people stop using heroin or stay off it
scope: The drug also called methadone, methadon, methadone hydrochloride, dolophine hydrochloride, and
  synthetic heroin; not a person who mends things, a person paid to settle trouble in dishonest ways,
  or a chemical that sets dye or a photo.
examples:
- Doctors sometimes give fixer to people who are trying to come off heroin.
- Fixer is used in clinics to help patients stay off heroin.
