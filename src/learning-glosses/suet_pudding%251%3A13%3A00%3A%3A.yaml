simpleMeaning: a sweet or savoury dish made with hard animal fat and cooked by steam or in boiling water
scope: This is a dish made with hard animal fat and cooked by steam or in boiling water, not a cake baked
  in an oven and not a dish made without fat.
examples:
- We had suet pudding with jam after Sunday lunch.
- The suet pudding was steamed for two hours before serving.
