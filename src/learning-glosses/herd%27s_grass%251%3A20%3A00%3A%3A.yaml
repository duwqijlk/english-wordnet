simpleMeaning: A plant with long round spikes, grown in the northern United States and Europe to make
  dry food for farm animals.
scope: A plant with long round spikes grown in the northern United States and Europe for hay; timothy
  is another name for this sense, and this is not a lawn plant or a plant grown for its seed.
examples:
- The farmer cut herd's grass for hay in the summer.
- Herd's grass grew tall in the northern fields.
