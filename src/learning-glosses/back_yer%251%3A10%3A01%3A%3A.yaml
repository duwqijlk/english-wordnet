simpleMeaning: In the languages of today, this Cyrillic letter Ъ shows that a consonant stays hard, made
  without lifting the tongue to the roof of the mouth.
scope: Also called hard sign, this Cyrillic letter marks a hard consonant in the languages of today.
examples:
- A back yer stands at the end of the word.
- The back yer shows that the sound before it stays hard.
