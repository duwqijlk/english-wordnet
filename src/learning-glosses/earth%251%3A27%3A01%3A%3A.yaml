simpleMeaning: In ancient Greek thought, one of the four basic substances believed to make up the universe,
  linked by the philosopher Empedocles to the bodily fluid called black bile.
scope: This is an ancient element of the universe, not the planet we live on, and not soil or ground.
examples:
- In medieval medicine, earth was one of the four elements, paired with black bile.
- The alchemists believed that earth, air, fire and water made up all matter.
