simpleMeaning: A cloth pad pressed hard on a part of the body, with or without medicine, to ease pain
  or bring down a fever
scope: A cloth pad pressed firmly on the body to ease pain or fever, not a verb sense of squeezing.
examples:
- She put a cold compress on his forehead.
- A warm compress eased the ache in her knee.
