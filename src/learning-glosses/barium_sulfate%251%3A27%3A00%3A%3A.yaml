simpleMeaning: a white powder that will not dissolve in water and blocks X-rays, used to give paint its
  colour
scope: 'Also called barium sulphate and blanc fixe: a white powder used to colour paint, not the white
  mineral that is the main source of barium.'
examples:
- The painter mixed barium sulfate into the paint to make it whiter.
- The factory buys barium sulfate as a white pigment for its paints.
