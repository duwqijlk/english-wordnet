simpleMeaning: People use the fruit of this small tree of China and Vietnam in food and as medicine to
  ease wind; it spreads out in points and smells sweet and spicy.
scope: A small tree of China and Vietnam, not the fruit it bears, which people use in food and as medicine.
examples:
- The star anise bore fruit that smelled sweet and spicy.
- They grew a star anise for its fruit, used in food and medicine.
