senseId: 'somatic_sensation%1:09:00::'
synsetId: 05729127-n
simpleMeaning: a feeling that comes from touch, from knowing where your body is, or from inside your body
scope: A feeling from touch, body position, or inside the body, also called somaesthesia, somatesthesia
  and somesthesia; not a feeling from sight or hearing and not an emotion.
examples:
- A somatic sensation told him the pressure was rising.
- The somatic sensation in her stomach warned her she was ill.
