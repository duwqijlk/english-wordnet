simpleMeaning: a burst of loud sound that breaks out all at once and fills the air
scope: 'Also called bang and blast, and clap is another name for it: a sudden burst of loud sound, not
  a volcano pouring out lava and not a tooth coming through the gum.'
examples:
- An eruption of cheers filled the hall.
- The eruption of applause startled the baby.
