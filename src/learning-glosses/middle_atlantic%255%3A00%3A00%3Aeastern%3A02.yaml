simpleMeaning: Of the part of the United States that most often means Delaware, Maryland and Virginia,
  and usually also New York, Pennsylvania and New Jersey
scope: This word describes the part of the United States that most often means Delaware, Maryland and
  Virginia; mid-Atlantic is another name for this sense.
examples:
- The middle Atlantic states include Delaware and Maryland.
- He works in a middle Atlantic city in Pennsylvania.
