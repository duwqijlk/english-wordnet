simpleMeaning: A way of speaking Middle English, once used across the whole south-east of England, including
  London and Essex.
scope: A dialect of Middle English once used across the south-east of England; its near kin are other
  Middle English dialects, and the Old English Kentish of the same name is an earlier sense.
examples:
- Kentish was spoken across the south-east of England.
- Londoners once spoke Kentish.
