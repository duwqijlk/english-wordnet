simpleMeaning: 'A bundle of rods holding an ax with a protruding blade: in ancient Rome a sign of a magistrate''s
  power, and in modern Italy a symbol of fascism.'
scope: 'A Roman emblem of office: a bundle of rods with an ax, whose blade protrudes, that stood for a
  magistrate''s power. It is not simply an ax, and it is not a flag. In modern Italy the same bundle was
  taken up as the symbol of fascism.'
examples:
- The fasces carved above the door reminded visitors of the court's authority.
- Italian fascists adopted the fasces as their emblem in the 1920s.
