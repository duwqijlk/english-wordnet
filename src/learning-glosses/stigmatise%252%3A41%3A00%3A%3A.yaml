senseId: 'stigmatise%2:41:00::'
synsetId: 02513894-v
simpleMeaning: to say in public, or in a formal way, that a person or thing is shameful
scope: This is to accuse or condemn someone openly or in a formal way, also called brand, mark, denounce,
  and stigmatize, not to praise someone and not to punish them in private.
examples:
- The paper tried to stigmatise the whole group as dishonest.
- She feared the town would stigmatise her for her choice.
