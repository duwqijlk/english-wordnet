simpleMeaning: In informal or slang talk, describes a person whose mind does not work in a normal way
scope: In loose talk, a word for a mind that does not work in a normal way, also called cracked, nuts,
  buggy, bats, crackers, daft, nutty, dotty, loopy, fruity, balmy, batty, wacky, bonkers, loony, barmy,
  loco and kooky; it is not wire for tying hay.
examples:
- After three days with no sleep, he felt a bit haywire.
- His haywire talk made no sense to anyone.
