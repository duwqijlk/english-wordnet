simpleMeaning: One of several Eastern Orthodox Churches in North America is led by this bishop
scope: A church leader in one of the Eastern Orthodox Churches in North America, not a Roman ruler of
  a province and not a church leader ranked below a patriarch.
examples:
- The exarch visited the parish in Toronto.
- As exarch, he led the Eastern Orthodox Church in that part of North America.
