simpleMeaning: this metal block shuts the back of a gun that loads from the back, pulled out to take in
  a cartridge and pushed back before a shot
scope: 'Also called breechblock: the metal block that shuts the back of a gun that loads from the back,
  not the bullet and not the trigger.'
examples:
- The soldier pulled the breech closer out and put in a fresh cartridge.
- He pushed the breech closer back before he fired the gun.
