simpleMeaning: Lose its strength or force bit by bit.
scope: This is a feeling or force growing weaker, not something becoming invisible, getting lost, or ceasing
  to exist.
examples:
- Her enthusiasm for the project disappeared after the first setback.
- The pain in his knee disappeared after a week of rest.
