simpleMeaning: To raise crops or animals on land, often improving them through farming methods.
scope: Raising plants or animals on a farm; not a person or thing getting bigger or older by itself, and
  not merely making something develop.
examples:
- They grow wheat and barley on this farm.
- The family grew vegetables for the local market.
