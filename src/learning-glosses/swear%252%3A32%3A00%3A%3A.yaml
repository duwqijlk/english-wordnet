senseId: 'swear%2:32:00::'
synsetId: 01015049-v
simpleMeaning: to say in court, after promising to tell the truth, what you know, or to write it down
  for the court
scope: This is giving facts in court after a promise to tell the truth, not using rude bad words, and
  not just saying in a serious way that something is true.
examples:
- The witness had to swear his statement before the court would accept it.
- She must swear a written statement about what she saw that night.
