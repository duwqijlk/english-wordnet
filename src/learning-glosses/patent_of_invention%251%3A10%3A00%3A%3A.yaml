simpleMeaning: A paper from the state that gives one maker alone every right over a new thing they made
scope: 'Also called a patent: a paper from the state that gives one maker alone every right over a new
  thing they made, not a plain contract and not a prize.'
examples:
- He applied for a patent of invention for his new engine.
- A patent of invention stops others from copying the design.
