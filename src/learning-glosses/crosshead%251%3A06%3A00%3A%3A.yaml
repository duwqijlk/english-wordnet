simpleMeaning: To move the rod that joins the parts back and forth, a block of metal joined to a piston
  slides on two straight rails.
scope: A metal block joined to a piston, not the piston itself and not the rod it drives.
examples:
- The crosshead slid back and forth on its rails.
- The engineer checked the crosshead and its guides.
