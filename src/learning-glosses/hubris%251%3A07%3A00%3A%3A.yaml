simpleMeaning: too much pride, and a belief that you are better or know more than you really do
scope: Too much pride that makes a person act as if they are above other people. It is not the normal
  good feeling about work done well, and not quiet trust in yourself.
examples:
- His hubris made him pay no attention to any of the warnings.
- It was hubris to think she could run the whole company alone in her first week.
