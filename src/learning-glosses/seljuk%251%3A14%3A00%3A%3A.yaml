simpleMeaning: Any one of the Turkish ruling families that ruled Asia Minor from the 11th to the 13th
  centuries; they took Byzantium and held the Holy Land against the Crusaders.
scope: A Turkish ruling family of Asia Minor, not the adjective for things of those families and not other
  Turkish ruling families of the time.
examples:
- The Seljuks ruled Asia Minor from the 11th to the 13th centuries.
- One Seljuk dynasty held the Holy Land against the Crusaders.
