simpleMeaning: In physics, the angle between a magnetic needle and the flat line where the earth meets
  the sky.
scope: In physics, the angle a magnetic needle makes with the flat line where earth meets sky, with dip
  as another name for this sense, and not the angle of an orbit or a liking for something.
examples:
- The inclination of the needle changes as you travel north.
- He measured the inclination with a compass needle.
