senseId: 'yenta%1:18:00::'
synsetId: 10822886-n
simpleMeaning: 'In Yiddish, this is a woman who cannot hold her tongue: she passes on every secret and
  every bit of talk that can make trouble.'
scope: This is the talkative gossip sense of the word, not the sense of a coarse, ill-tempered woman.
examples:
- The yenta in our building knew everyone's business before breakfast.
- She was called a yenta because no secret stayed safe with her.
