simpleMeaning: A state of the body in which a woman shows the signs of being with child, but is not with
  child
scope: 'Also called false pregnancy: a woman shows the signs of being with child but is not, not a real
  pregnancy and not a made-up claim of one.'
examples:
- Doctors found her pseudocyesis after tests showed she was not with child.
- Her pseudocyesis made her feel sick in the morning, though she was not with child.
