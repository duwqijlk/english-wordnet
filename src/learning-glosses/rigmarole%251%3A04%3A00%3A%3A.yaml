simpleMeaning: a long way of doing something that is hard to follow and hard to understand
scope: 'Also called rigamarole: a long, confusing way of doing a task; not the other sense, a set of confused
  words that mean little or nothing.'
examples:
- We went through a long rigmarole just to get a new passport.
- All that academic rigmarole was a waste of time.
