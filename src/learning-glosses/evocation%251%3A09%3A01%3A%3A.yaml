senseId: 'evocation%1:09:01::'
synsetId: 05835577-n
simpleMeaning: something that brings out a certain kind of action in a person or an animal
scope: 'Also called induction: something that brings out a kind of behavior. It is not making a picture
  in the mind of something past, and not calling up spirits with spells.'
examples:
- The loud sound caused the evocation of a fear response in the animals.
- In the test, the light led to the evocation of eating behavior in the birds.
