simpleMeaning: one of the whole numbers that can only be split by one and itself, and that split a given
  number with no part left over
scope: This is one of the numbers that split a given number with no part left over and can only be split
  by one and itself, not a number with other splits and not the number being split.
examples:
- The prime factors of 12 are 2, 2, and 3.
- To find a prime factor of 15, start with 3 and 5.
