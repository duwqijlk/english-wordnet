simpleMeaning: so bad or wrong that it brings or should bring strong blame
scope: Also called criminal. This means an act is so bad that it brings or should bring strong blame,
  not cruel and ready to cause pain, and not full of hate and meant to harm.
examples:
- Spending the aid money on himself was a vicious waste that shocked the town.
- Their vicious act of leaving the children without food brought strong blame from everyone.
