simpleMeaning: A sage of Europe and Asia with blue flowers and leaves like those of verbena, now at home
  in the United States
scope: A sage of Europe and Asia with blue flowers; vervain sage and wild sage are other names for this
  sense, and it is not a low mint or a garden rose.
examples:
