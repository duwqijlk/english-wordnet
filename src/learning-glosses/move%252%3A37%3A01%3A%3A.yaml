simpleMeaning: to make someone feel sympathy or compassion.
scope: This is not about changing place, and not about putting a proposal to a meeting; it is about stirring
  feelings of sympathy or compassion in a person.
examples:
- The story of the lost dog moved everyone in the room to tears.
- Her letter was so honest that it moved him deeply.
