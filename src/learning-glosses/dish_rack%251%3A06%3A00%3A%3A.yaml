simpleMeaning: a frame that holds plates, cups and bowls while the wash water runs off them
scope: A frame that holds plates, cups and bowls while the wash water runs off them, and not a cupboard
  for storing clean plates or a sink for washing them.
examples:
- She set the clean plates in the dish rack to dry.
- The dish rack by the sink was full of cups and bowls.
