simpleMeaning: A former political group in the United States in the 1850s that worked to keep power from
  newcomers to the country and from Roman Catholics
scope: Also called the American Party, it was a political group of the 1850s in the United States, not
  a party of today and not one that welcomed newcomers or Roman Catholics.
examples:
- The Know-Nothing Party was active in the 1850s.
- Many voters joined the Know-Nothing Party to keep power from newcomers.
