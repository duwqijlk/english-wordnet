simpleMeaning: A small green-all-year bush that forms a low mat, from southern Europe and Asia Minor,
  with stiff stems and end groups of small bell-shaped flowers.
scope: Also called spike heath; a small mat-forming bush with bell-shaped flowers, not a tall shrub and
  not a plant that grows in wet bogs.
examples:
- Bruckenthalia spiculifolia forms a low mat on the rocky slope.
- The small flowers of Bruckenthalia spiculifolia open in early summer.
