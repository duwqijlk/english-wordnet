simpleMeaning: An Australian plant grown most of all for looks and for its fine wood, and it bears nuts
  that can be eaten
scope: This is an Australian plant grown for looks, fine wood, and nuts that can be eaten, also called
  hazel, and not a shrub grown only for food.
examples:
- The hazel tree in the park bears nuts in autumn.
- We planted a hazel tree for shade and for its wood.
