simpleMeaning: A thick juice drawn from the heartwood of an acacia tree, used to dye and tan and to keep
  fishnets and sails from rotting, once used as a medicine.
scope: This sense is also called black catechu, a thick juice drawn from the heartwood of an acacia tree,
  unlike the sense for an East Indian spiny tree with twice-pinnate leaves and yellow flowers followed
  by flat pods, the source of black catechu.
examples:
- Catechu dyes cloth.
- Catechu once treated the sick.
