simpleMeaning: Under the rule of the pope, the head of the church that follows the Apostles, a thing done
  this way carries his word.
scope: Also called papal, apostolic, and pontifical, this word marks a thing as ordered by the pope or
  the papacy.
examples:
- The apostolical decree was sent out by the pope.
- The church lived under apostolical rule for many years.
