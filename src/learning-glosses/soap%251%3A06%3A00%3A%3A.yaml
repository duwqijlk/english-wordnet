simpleMeaning: A stuff that washes things clean, made by turning plant or animal fats into a new form
scope: A washing stuff made from plant or animal fats, not the act of rubbing soap over a thing.
examples:
- She washed her hands with soap and water.
- The soap left the dishes clean and bright.
