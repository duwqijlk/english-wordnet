simpleMeaning: In Morse code, the shorter of its two signals, a quick short mark rather than a long dash
scope: In Morse code only, not the verb that spreads things like dots and not the street name for a drug.
examples:
- In Morse code, a dot is the short signal and a dash is the long one.
- He tapped out a dot, then a dash, then another dot.
