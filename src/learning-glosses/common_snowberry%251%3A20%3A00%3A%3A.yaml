simpleMeaning: Spikes of pink flowers come first on this bush from the west of North America, which loses
  its leaves in autumn, and round white berries follow.
scope: Also called snowberry and waxberry, this is the bush from the west of North America with spikes
  of pink flowers followed by round white berries.
examples:
- The common snowberry bore pink flowers.
- A common snowberry showed round white berries after its pink flowers.
