simpleMeaning: A dish of meat or fish and vegetables left to soak in sauce, served with rice.
scope: A dish of meat or fish and vegetables soaked in sauce and served with rice, not a plain stew and
  not a dish served with bread.
examples:
- She cooked chicken adobo for the family meal.
- The adobo came with a mound of rice.
