simpleMeaning: 'It drains into the tube of the neck: a blood tube made where the tube of the face joins
  the tube behind the jaw.'
scope: It is a blood tube of the face and jaw, not the tube of the face on its own and not the tube of
  the neck it drains into.
examples:
- The common facial vein drains into the tube of the neck.
- The common facial vein is made where the tube of the face joins the tube behind the jaw.
