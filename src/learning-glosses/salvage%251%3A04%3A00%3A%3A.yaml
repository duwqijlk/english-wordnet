simpleMeaning: the work of pulling a ship, its crew, or its load out of danger after a wreck or a fire
scope: Saving a ship and what it carries after a wreck or fire, not saving goods in danger on land, and
  not the act of saving something from ruin in general.
examples:
- The salvage of the wreck took three long weeks.
- Salvage crews worked through the night to save the ship's cargo.
