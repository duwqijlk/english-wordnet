simpleMeaning: In basketball, the round metal hoop that the net hangs from
scope: In basketball, the hoop the net hangs from; not the outer part of a wheel and not a part that sticks
  out to make something stronger.
examples:
- The ball hit the rim and bounced away from the basket.
- He threw the ball clean through the rim, past the net.
