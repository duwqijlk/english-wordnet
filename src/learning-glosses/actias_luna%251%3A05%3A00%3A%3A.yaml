simpleMeaning: A big pale green American moth with long tails on its back wings and a yellow moon-shaped
  mark on each front wing.
scope: A big pale green American moth with long tails on its back wings, also called luna moth; its nearest
  kin are other big pale moths with marks on their wings.
examples:
- Actias luna rested on the porch light with its long tails hanging down.
- We saw Actias luna in the garden at dusk, pale green against the dark leaves.
