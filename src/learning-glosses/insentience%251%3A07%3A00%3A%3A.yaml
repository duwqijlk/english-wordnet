simpleMeaning: Being without thought or feeling, and unable to sense anything at all
scope: Having no thought and no sense of feeling; not a deep sleep and not a lack of care for others.
examples:
- After the blow, he lay in insentience for hours.
- A plant has insentience, with no mind to feel pain.
