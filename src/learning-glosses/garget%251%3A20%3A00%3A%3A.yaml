simpleMeaning: A tall, rough perennial American plant with small white flowers and dark red berries in
  long hanging clusters; young thick stems can be eaten, but berries and root are toxic.
scope: This is the tall American plant whose young stems are edible but whose berries are poisonous, not
  a garden fruit bush.
examples:
- The garget grew waist-high along the fence, its dark berries hanging in long clusters.
- Foragers pick the young stems of garget in spring but leave the poisonous berries alone.
