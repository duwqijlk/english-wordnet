simpleMeaning: To set the words of a text to make a word-list.
scope: This sense is to set the words of a text to make a word-list, unlike the sense for a tuneful state
  of things in general, and of their marks, as of colours and sounds, a fitting of parts with each other
  and with the whole, unlike the sense for the fixing of word endings by their ties to other words, and
  unlike the sense for setting by likeness or agreement.
examples:
- They concord the text, setting its words.
- They concord books.
