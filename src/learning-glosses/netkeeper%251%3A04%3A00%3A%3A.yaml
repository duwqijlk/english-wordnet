simpleMeaning: In front of the goal stands the player who tries to stop the other side from scoring, on
  an ice hockey, soccer, or lacrosse team.
scope: It is also called goalie, goalkeeper, and goaltender, the one who stands in front of the goal to
  stop the other side from scoring.
examples:
- The netkeeper stood in front of the goal for the ice hockey team.
- A good netkeeper stops the other side from scoring.
