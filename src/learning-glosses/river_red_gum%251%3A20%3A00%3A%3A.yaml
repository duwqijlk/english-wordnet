simpleMeaning: With tough wood the colour of rust for heavy building work, this somewhat bent tree grows
  mostly beside waterways.
scope: Also called river gum, this is a bent tree of the waterways that gives strong rust-coloured wood
  for heavy building work.
examples:
- River red gum wood went into the heavy beams of the bridge.
- We cut river red gum wood for the bridge beams.
