simpleMeaning: a building with glass walls and a glass roof where plants are set out in a way that looks
  pleasing
scope: Also called conservatory. This is a glass building where plants are set out to look pleasing, not
  a glass building used only to grow plants for food or for sale.
examples:
- The hothouse was full of bright flowers set out along neat paths.
- We walked through the hothouse to see the roses set out in pleasing groups.
