simpleMeaning: This pondweed floats its leaves on the water in the north of the United States and in Europe.
scope: Also called loddon pondweed and Potamogeton americanus; a pondweed with leaves that float, not
  a pondweed with leaves under the water.
examples:
- We found Potamogeton nodosus growing in the lake, its leaves floating on the water.
- Potamogeton nodosus spreads its floating leaves across the pond.
