simpleMeaning: In the study of the chemistry of living things, any of several acids made of chains of
  tiny links are parts that every living cell needs to live.
scope: In the study of the chemistry of living things, it is any of several acids made of chains of tiny
  links that every living cell holds as a part it needs.
examples:
- DNA is a nucleic acid found in every living cell.
- Every living cell holds nucleic acid as a part it needs to live.
