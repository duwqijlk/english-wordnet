simpleMeaning: A power device in which flow in one path can turn flow in a second path on and off.
scope: 'Also called relay: a power device in which flow in one path can turn flow in a second path on
  and off, not a switch worked by hand and not a wire.'
examples:
- The electrical relay clicked as the circuit closed.
- An electrical relay controls the second circuit.
