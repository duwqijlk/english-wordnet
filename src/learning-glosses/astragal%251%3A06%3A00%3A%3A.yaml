simpleMeaning: A strip with a row of small round shapes along it, put on furniture to edge or decorate
  it
scope: A strip with small round shapes along it, also called a bead, beading and beadwork; not a bone
  in the ankle and not a plain flat strip.
examples:
- The astragal edged the drawer with a row of small round shapes.
- An astragal of beaded wood framed the cabinet door.
