simpleMeaning: A fixed water creature that lives in crowded groups of tiny tube-shaped bodies, each with
  a ring of tentacles; it clings to stones or seaweed and reproduces by budding.
scope: This names the whole colony-forming animal also called a bryozoan, not one of its individual polyps.
examples:
- Under the microscope, the polyzoan looks like a tiny crown of tentacles.
- The polyzoan spreads over the rock by budding.
