simpleMeaning: A bushy perennial Old World mint with small white or yellowish flowers and sweet-smelling
  lemon-flavoured leaves, a garden runaway in northern Europe and North America.
scope: Also called beebalm, garden balm, lemon balm, and sweet balm, a bushy perennial Old World mint
  with small white or yellowish flowers and sweet-smelling lemon-flavoured leaves, a garden runaway in
  northern Europe and North America, unlike the sense for a perennial aromatic herb of eastern North America
  having variously colored tubular flowers in dense showy heads.
examples:
- Bee balm has lemon-flavoured leaves.
- Bee balm grows in northern Europe.
