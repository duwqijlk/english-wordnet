simpleMeaning: Having small cuts along the edge, like the teeth of a saw, all leaning toward the tip
scope: This is an edge with small cuts leaning toward the tip, like a saw; toothed is another name for
  this sense, not an edge with cuts leaning the other way.
examples:
- The leaf had a notched edge, with points leaning toward the tip.
- A notched blade has teeth that point toward the tip.
