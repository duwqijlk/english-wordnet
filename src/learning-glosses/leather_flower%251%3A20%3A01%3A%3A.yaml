simpleMeaning: A woody climbing plant of the warm south that bears purple or blue blooms whose outer parts
  bend back and feel tough like hide.
scope: Unlike the low woody climber of the southeast with large red-purple bell-shaped blooms, this woody
  climber of the warm south bears purple or blue blooms.
examples:
- The leather flower opened purple blooms in the warm south.
- Leather flowers with blue blooms grew in the warm south.
