simpleMeaning: reaching across every part of the Earth, with no one country or region left out
scope: Reaching over the whole Earth, also called world, global, and worldwide; not just about the Earth
  as a planet, and not about one country alone.
examples:
- A planetary crisis needs every country to act together.
- The planetary talks covered trade, health, and the seas.
