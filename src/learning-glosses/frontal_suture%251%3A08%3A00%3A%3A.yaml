simpleMeaning: The join between the two halves of the front bone of the skull, most often gone by the
  age of six
scope: The join between the two halves of the front of the skull, not another join in the skull and not
  the bone itself.
examples:
- The frontal suture closes in early childhood.
- By the age of six, the frontal suture has usually gone.
