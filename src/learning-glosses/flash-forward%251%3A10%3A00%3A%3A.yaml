senseId: 'flash-forward%1:10:00::'
synsetId: 06413430-n
simpleMeaning: A jump in a book, play or film to a later event or scene, which breaks the order of the
  tale as it is told
scope: This is a jump in a book, play or film to a later event or scene that breaks the order of the tale,
  not a look back at an earlier scene and not a scene in its true order.
examples:
- The flash-forward showed the hero as an old man.
- A flash-forward broke the story's order.
