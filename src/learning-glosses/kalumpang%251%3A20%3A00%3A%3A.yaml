simpleMeaning: Red pods holding oil-rich seeds, sometimes eaten as food, follow foul-smelling orange-red
  flowers on this big tree of the warm Old World.
scope: Its foul-smelling orange-red flowers and the oil-rich seeds in its red pods set this large tree
  of the warm Old World apart from other trees.
examples:
- Kalumpang blossoms gave off a foul smell.
- Red pods followed the kalumpang blossoms.
