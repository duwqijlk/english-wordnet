simpleMeaning: A mild condition that develops slowly in adults, triggered by obesity, severe stress, menopause
  or other factors, and usually managed by diet and sugar-lowering drugs without insulin injections.
scope: The older name for the common adult form of diabetes, the form that diet and tablets can usually
  keep in check; not the childhood form that needs insulin injections.
examples:
- The doctor explained that her maturity-onset diabetes could be kept in check with diet and tablets.
- In older medical books, maturity-onset diabetes is described as a gradual illness of later life.
