simpleMeaning: A member of one of the native peoples of North America who moved from place to place across
  the Great Plains, following the herds of wild cattle.
scope: Also called a Plains Indian, this is a member of one of the native peoples of North America who
  moved from place to place across the Great Plains following the herds of wild cattle, set apart from
  native peoples who stayed in one place and from native peoples of other parts of North America.
examples:
- The Buffalo Indian followed the herds across the plains.
- A Buffalo Indian elder told stories of the long hunts.
