simpleMeaning: The fourth great meeting of church leaders, in 451, which set out that Christ has two natures,
  human and divine.
scope: The fourth great meeting of church leaders, in 451, which set out that Christ has two natures,
  human and divine, also called Chalcedon; it is the fourth such meeting, not the third.
examples:
- The Council of Chalcedon met in 451 and defined the two natures of Christ.
- The Council of Chalcedon declared that Christ is both human and divine.
