simpleMeaning: one of the four parts a flat surface is split into by two lines that cross at right angles
scope: One of the four parts of a flat surface split by two crossing lines, not a measuring tool and not
  a quarter of a circle.
examples:
- The point lies in the upper right quadrant of the graph.
- The axes divide the plane into four quadrants.
