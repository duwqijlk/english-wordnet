simpleMeaning: the way a bookkeeper writes a deal down in two accounts, as a debt in one and as a payment
  in the other
scope: 'Also called double-entry bookkeeping: a way of writing deals down in two accounts, not a way of
  writing them down once and not a different bookkeeping rule.'
examples:
- The double entry for the sale put the amount in both accounts.
- She learned double entry in her first bookkeeping class.
