simpleMeaning: A soft silvery metal of the rare earth group, with no form that lasts unchanged, first
  found in radioactive form as a piece left when uranium splits.
scope: Also called Pm and atomic number 61; a soft silvery metal of the rare earth group, first found
  in radioactive form when uranium splits.
examples:
- Scientists found promethium in the waste left when uranium splits.
- Promethium has no form that lasts unchanged, so it is always radioactive.
