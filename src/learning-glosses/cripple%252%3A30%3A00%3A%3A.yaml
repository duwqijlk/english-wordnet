senseId: 'cripple%2:30:00::'
synsetId: 00226258-v
simpleMeaning: to hurt someone or something so badly that strength is lost, it cannot work well, and it
  is of no use or value
scope: To hurt a person, group, or thing so badly that it cannot work well; not the noun for a person
  who cannot walk in the usual way because of injury or disability in the legs or back.
examples:
- The storm crippled the town's power lines for a week.
- A lack of money crippled the whole project.
