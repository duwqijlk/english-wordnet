simpleMeaning: using plants, or parts of plants, to treat illness, especially plants that are not food
  people eat every day
scope: 'Also called herbal therapy and phytotherapy: using plants to treat illness, not eating plants
  as food and not using drugs made in a lab.'
examples:
- She turned to botanical medicine when the usual drugs did not help her.
- The clinic uses botanical medicine to treat coughs and skin rashes.
