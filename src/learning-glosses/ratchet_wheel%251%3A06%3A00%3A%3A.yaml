simpleMeaning: A round part with teeth on its edge, held still by a small catch and turned by a bar
scope: A toothed wheel held in place by a small catch and turned by a bar, not a plain wheel that turns
  freely and not a gear that drives another wheel.
examples:
- The ratchet wheel clicked as the lever turned it.
- A broken ratchet wheel let the rope slip back.
