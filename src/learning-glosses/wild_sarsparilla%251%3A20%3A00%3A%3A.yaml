simpleMeaning: People use the sweet-smelling roots of this common herb of central and eastern North America,
  which lives year after year, in place of the roots of a root drink.
scope: Also called false sarsaparilla and wild sarsaparilla, this common herb of central and eastern North
  America is known for sweet-smelling roots that stand in for the roots of a root drink.
examples:
- The wild sarsparilla grows year after year in central North America.
- Its sweet-smelling roots make wild sarsparilla a stand-in for the roots of a root drink.
