simpleMeaning: able to be kept going or kept up over time
scope: This sense means a thing can be kept going over time, not that a way of living is good for nature
  and does not use things up.
examples:
- They need a sustainable level of work that they can keep up all year.
- Is this speed sustainable for the whole race?
