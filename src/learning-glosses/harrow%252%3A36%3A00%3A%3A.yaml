simpleMeaning: to pull a farm tool over land to break up the soil and make it smooth
scope: To pull the farm tool over land; this is the verb use, not the tool itself, which is the noun use
  of the same word.
examples:
- The farmer harrowed the field before he put in the seeds.
- They harrow the land each spring to break up the hard soil.
