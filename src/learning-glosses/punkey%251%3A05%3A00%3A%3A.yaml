simpleMeaning: A tiny insect with two wings that drinks the blood of animals with fur or feathers and
  of other insects.
scope: A tiny blood-drinking insect with two wings, also called punky, biting midge, no-see-um and punkie;
  not a fly that bites people only and not a bee.
examples:
- The punkey bit her arm and left a red mark.
- Punkeys swarm near the river at dusk.
