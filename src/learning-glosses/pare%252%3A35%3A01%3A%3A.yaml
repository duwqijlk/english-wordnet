simpleMeaning: To cut away thin bits from the outside of a thing, as with a knife
scope: To cut thin bits from the outside of a thing, with whittle as another name for this sense, not
  cutting a thing in half and not trimming it to a neat edge.
examples:
- He pared the apple with a small knife.
- She pared thin shavings from the piece of wood.
