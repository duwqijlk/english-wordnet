senseId: 'sunk_fence%1:06:00::'
synsetId: 04363510-n
simpleMeaning: A ditch with a wall holding back the earth on one side, used to mark off land without spoiling
  the view.
scope: A ditch with a wall on one side that marks off land without spoiling the view; also called ha-ha
  and haw-haw; not a hedge and not a wall built above the ground.
examples:
- A sunk fence kept the sheep in without blocking the view.
- The garden was divided by a sunk fence you could hardly see.
