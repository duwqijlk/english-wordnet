simpleMeaning: A tall one-year cereal grass with kernels on large ears, widely grown in America in many
  kinds; the main cereal of Mexico and Central and South America since before Columbus.
scope: Also called corn, maize and Indian corn; a tall cereal grass with kernels on large ears, not wheat,
  another cereal grass, and not a vegetable grown for its leaves.
examples:
- Zea mays is grown across America.
- Farmers plant Zea mays for its kernels.
