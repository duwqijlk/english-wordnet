simpleMeaning: The upper pole set above the rearmost tall pole of a sailing ship.
scope: The upper pole set above the rearmost tall pole of a sailing ship; not the upper pole above the
  middle tall pole, and not the one above the front tall pole.
examples:
- The sail hung from the mizzen-topmast.
- A mizzen-topmast may carry the upper end of a staysail.
