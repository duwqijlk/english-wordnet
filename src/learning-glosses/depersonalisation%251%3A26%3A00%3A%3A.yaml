senseId: 'depersonalisation%1:26:00::'
synsetId: 14417499-n
simpleMeaning: A feeling disorder, splitting one off, where one loses touch with one's own true self,
  along with feelings of unreality and strangeness.
scope: A feeling disorder, splitting one off, where one loses touch with one's own true self, along with
  feelings of unreality and strangeness; also called depersonalisation disorder, depersonalisation neurosis,
  depersonalization, depersonalization disorder, or depersonalization neurosis; not, in thought, a loss
  of one's own self, a feeling of being a nameless cog in a faceless social machine, nor the picturing
  of a human as a mere thing, stripped of personal traits or selfhood.
examples:
- Their depersonalisation grew at dusk.
- The depersonalisation was plain in the test.
