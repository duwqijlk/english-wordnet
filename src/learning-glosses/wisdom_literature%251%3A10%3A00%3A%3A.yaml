simpleMeaning: Writings that hold wise teaching make up the five works of the Bible — Proverbs, Ecclesiastes,
  Song of Songs, the work of Solomon, and Ecclesiasticus
scope: This sense is also called sapiential book or wisdom book, and it is the name for the five works
  of the Bible held to carry wise teaching.
examples:
- Proverbs and Ecclesiastes are part of the wisdom literature of the Bible.
- She turned to the wisdom literature of the Bible.
