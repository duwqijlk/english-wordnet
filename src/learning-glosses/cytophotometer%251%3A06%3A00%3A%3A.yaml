simpleMeaning: A light-meter that can find and name body substances in a cell by gauging the strength
  of the light that goes through dyed slices of the cell's jelly.
scope: A photometer for locating and naming chemical compounds in a cell, gauging light through stained
  slices of cytoplasm.
examples:
- The cytophotometer gauged the dyed slice.
- They used a cytophotometer on the cell.
