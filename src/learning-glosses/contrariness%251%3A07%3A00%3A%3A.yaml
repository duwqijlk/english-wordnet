simpleMeaning: a person's usual way of being hard to please and behaving in odd, unusual ways
scope: 'Also called grumpiness and crankiness: a fussy, odd way of being, not a planned, stubborn fight
  against rules or guidance.'
examples:
- His contrariness showed in his odd habits and in how hard he was to please at meals.
- Her contrariness made every small change at home feel like a problem to her.
