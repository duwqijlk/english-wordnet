simpleMeaning: A good-to-eat fungus with a rounded cap that is a little sticky when fresh and wet but
  soon dries, and a thick swollen tan stalk.
scope: A good-to-eat fungus with a rounded cap and a thick swollen tan stalk, distinct from fungi that
  are not good to eat and from fungi with thin stalks.
examples:
- Boletus edulis is a good-to-eat fungus.
- We picked Boletus edulis with its thick tan stalk.
