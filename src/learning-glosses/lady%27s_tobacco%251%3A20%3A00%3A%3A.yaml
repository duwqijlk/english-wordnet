simpleMeaning: Low stems spread out from this plant and take root, so it comes back year after year in
  North America
scope: Also called ladies' tobacco, this is a long-lived North American plant that spreads by sending
  out low stems that take root, not a smoking plant and not an annual that dies in one year.
examples:
- Lady's tobacco spreads across the bed by its runners.
- We found lady's tobacco growing wild along the path.
