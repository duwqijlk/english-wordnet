simpleMeaning: in a way that speaks of one thing as if it were another thing, to show how they are alike
scope: This means speaking as if one thing were another thing to show a likeness; it is not speaking in
  the plain, direct sense of the words.
examples:
- She spoke metaphorically when she called time a thief.
- Metaphorically, the city is a jungle at night.
