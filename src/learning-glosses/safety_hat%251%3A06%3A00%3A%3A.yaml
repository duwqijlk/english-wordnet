simpleMeaning: a light hard cap of plastic or metal worn by people who build things to protect the head
scope: 'Also called a hard hat and a tin hat: a light hard cap worn by builders, not a soft cap and not
  a hat worn for style.'
examples:
- He put on his safety hat before entering the building site.
- Every worker on the site wears a safety hat.
