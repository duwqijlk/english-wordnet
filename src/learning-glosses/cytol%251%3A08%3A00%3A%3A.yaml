simpleMeaning: the soft living stuff of a cell apart from its core, full of proteins that run the cell's
  work
scope: The soft living stuff of a cell apart from its core; also called cytoplasm, not the core itself
  and not the whole cell.
examples:
- Cytol fills the cell outside its core.
- Proteins in the cytol run the cell's work.
