simpleMeaning: to make someone leave a place by pushing them or by using power
scope: To make someone leave a place by pushing or by using power, not to ask them to leave and not to
  let them stay; drive out is another name for this sense.
examples:
- The police forced them out of bed at 2 A.M.
- The crowd forced out the people who had no tickets.
