simpleMeaning: an oval object laid by a bird, especially a hen, that people eat as food
scope: This is a hen's oval body eaten as food, not the biological body from which a chick hatches, not
  a male reproductive gland, and not the verb uses.
examples:
- She boiled an egg for breakfast and made toast.
- The recipe calls for two eggs and a cup of flour.
