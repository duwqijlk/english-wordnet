simpleMeaning: loving play, or play before sex, that does not touch the sex parts of the body
scope: Also called kissing, hugging, petting, caressing, cuddling, snuggling, smooching, and necking;
  this is loving play, not sex itself.
examples:
- Their fondling stayed gentle, with holding and kissing and no touch of each other's sex parts.
- Fondling can be a soft, loving part of play before sex.
