simpleMeaning: being so unworthy that one deserves to be shamed in front of other people
scope: Being so unworthy that one deserves to be shamed in front of other people, also called ignominiousness
  or shamefulness, and not a private fault or a small mistake.
examples:
- The disgracefulness of the theft shocked the whole town.
- His disgracefulness was plain to all when the lies came out in court.
