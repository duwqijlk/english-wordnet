senseId: 'insurable_interest%1:21:00::'
synsetId: 13308563-n
simpleMeaning: a stake in a person or a thing that lets an insurance policy be issued, a stake in the
  person staying alive or in the thing being kept safe
scope: A stake in a person or a thing that lets an insurance policy be issued; not the policy itself and
  not mere ownership of the thing.
examples:
- The bank has an insurable interest in the house it lent money on.
- A wife has an insurable interest in her husband's life.
