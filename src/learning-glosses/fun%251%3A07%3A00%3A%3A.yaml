senseId: 'fun%1:07:00::'
synsetId: 04656618-n
simpleMeaning: A natural tendency to look for, or to create, things that give you amusement.
scope: This is not an amusing event or the pleasure you get from it; it is the tendency to look for or
  create amusement.
examples:
- She has a real sense of fun and can turn a boring train ride into an adventure.
- His sense of fun led him to fill the office with paper planes on his last day.
