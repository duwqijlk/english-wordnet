simpleMeaning: based on the idea that all people are equal and have a say in how they are ruled, or showing
  support for that idea
scope: Of or for the idea that all people are equal and have a say in ruling, not for what serves ordinary
  people in general.
examples:
- They voted for a democratic government.
- She lives in a democratic country where everyone can vote.
