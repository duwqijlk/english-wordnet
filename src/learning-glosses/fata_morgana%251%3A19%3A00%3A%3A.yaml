simpleMeaning: a mirage seen over the Strait of Messina, said in old stories to be the work of Morgan
  le Fay, the sorcerer of King Arthur
scope: A mirage in one named strait, not a mirage in a desert and not a real sight of land.
examples:
- Sailors in the Strait of Messina once saw a fata morgana shimmering over the water.
- The fata morgana looked like a city floating above the sea.
