simpleMeaning: A passage that should not be there, running from a pus-filled hollow to the skin.
scope: Also called a sinus, a passage that should not be there, running from a pus-filled hollow to the
  skin, not a long-standing swelling on a horse's withers.
examples:
- The fistula drained fluid onto the skin of their leg.
- Surgeons closed the fistula after the infection cleared.
