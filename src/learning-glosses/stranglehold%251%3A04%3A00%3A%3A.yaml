simpleMeaning: In wrestling, a hold in which a wrestler presses their arms against the other wrestler's
  windpipe.
scope: A wrestling hold that presses on the windpipe, not a hold on another part of the body.
examples:
- The wrestler caught their rival in a stranglehold and would not let go.
- They broke free from the stranglehold before the count ended.
