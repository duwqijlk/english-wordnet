simpleMeaning: A clear thick liquid made by mixing a chemical called pyroxylin with ether and alcohol,
  spread over cuts or photo film to cover them
scope: This is a liquid coating, not a medicine you swallow or a bandage.
examples:
- The nurse spread collodion over the small cut.
- Collodion dries into a thin coat on the skin.
