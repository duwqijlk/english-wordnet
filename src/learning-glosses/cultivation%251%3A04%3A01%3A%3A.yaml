simpleMeaning: training and teaching that help a person learn to live with others, and build up the mind
  or manners
scope: This sense is learning good manners and developing the mind through training and teaching; it is
  not growing crops on land and not a state of being perfect.
examples:
- Her cultivation was clear in the way she spoke and treated others.
- Years of reading and study gave him a cultivation that others admired.
