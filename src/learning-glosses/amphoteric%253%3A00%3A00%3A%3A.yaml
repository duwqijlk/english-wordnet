simpleMeaning: said of a substance that can work as an acid in one case and as a base in another, since
  it has the marks of both
scope: This is about a substance that can react as an acid and as a base, also called amphiprotic, not
  a substance that reacts as only one of the two.
examples:
- The amphoteric powder reacted as an acid in one test and as a base in another.
- Zinc oxide is amphoteric, so it can act in two ways.
