simpleMeaning: A climbing vine of the Old World tropics, three-part leaves, purple pea-like flowers, pods
  of edible seeds, grown for show and food in South Asia, sometimes classed with its kin.
scope: A climbing vine of warm lands, also called bonavist, hyacinth bean, Dolichos lablab, Indian bean
  and Lablab purpureus; not a bean of the New World.
examples:
- Egyptian bean grows in South Asia.
- Egyptian bean bears purple flowers and red pods.
