simpleMeaning: The quality of being able to be changed into something else, above all being able to change
  money into gold or other money with no limits.
scope: This is the quality of being able to be changed into something else, above all money into gold
  or other money with no limits, not the act of changing one thing into another and not the freedom to
  trade without rules.
examples:
- The new rules improved the convertibility of the currency.
- Traders valued the convertibility of the notes into gold.
