simpleMeaning: Often made into jellies or preserves, its juicy sharp scarlet fruit grows on a thorny tree
  of the southern United States.
scope: Also called mayhaw, it is a thorny tree of the southern United States whose juicy sharp scarlet
  fruit is often made into jellies or preserves.
examples:
- The summer haw bore scarlet fruit that year.
- She made jelly from the summer haw fruit.
