simpleMeaning: A climbing orchid whose podlike fruit produces the pods used as a flavouring; it is widely
  grown from Florida through tropical America.
scope: This is the vine that yields vanilla pods, not the flavouring made from them or the many ornamental
  orchids grown for their flowers.
examples:
- A vanilla orchid climbed up the trunk, its long green pods hanging beneath the leaves.
- Farmers in Mexico train the vanilla orchid onto supports so the vines are easy to reach at harvest.
