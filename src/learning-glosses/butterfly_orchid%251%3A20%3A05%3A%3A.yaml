simpleMeaning: thin branching sprays of small yellow and brown flowers mark any plant of the Oncidium
  group, often kept as a plant in the house
scope: Any of the Oncidium group with thin branching sprays of small yellow and brown flowers, not the
  Florida orchid with showy bright flowers; butterfly plant, dancing lady orchid and oncidium are other
  names for this sense.
examples:
- The butterfly orchid on the sill had sprays of small yellow flowers.
- She grows a butterfly orchid as a houseplant in her flat.
