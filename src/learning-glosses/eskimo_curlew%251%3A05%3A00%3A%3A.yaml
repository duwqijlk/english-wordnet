simpleMeaning: A bird of the Americas that makes its nest in the far north of North America.
scope: Also called Numenius borealis, this curlew of the Americas makes its nest in the far north, not
  a curlew of the Old World and not one that nests in the south.
examples:
- An Eskimo curlew flew north to breed.
- We saw an Eskimo curlew on the shore in spring.
