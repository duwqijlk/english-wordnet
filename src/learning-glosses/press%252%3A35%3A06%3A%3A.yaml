simpleMeaning: push with great effort while giving birth so that the baby is forced out of the body
scope: This is the effort of giving birth, not pushing an object or squeezing things together.
examples:
- The antenatal class taught her to press down hard during each contraction.
- When the doctor said the baby was ready, she pressed with all her strength.
