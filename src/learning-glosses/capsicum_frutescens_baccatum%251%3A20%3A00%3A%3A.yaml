simpleMeaning: A plant with very small, very hot, oblong red fruits, including wild forms native to tropical
  America, thought to be the ancestor of the sweet pepper and many hot peppers.
scope: Also called bird pepper and Capsicum baccatum, this is one very hot pepper plant from tropical
  America among other hot pepper plants and other small red-fruited plants, thought to be the ancestor
  of sweet and hot peppers.
examples:
- Capsicum frutescens baccatum bears very small, very hot red fruits.
- Wild forms of Capsicum frutescens baccatum grow in tropical America.
