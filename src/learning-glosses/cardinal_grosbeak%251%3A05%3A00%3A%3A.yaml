simpleMeaning: The male of this North American finch wears bright red feathers, and it has a crest on
  its head and a thick beak.
scope: Also called cardinal and redbird, it is the North American finch whose male wears bright red feathers.
examples:
- A cardinal grosbeak sang from the top of the tree.
- The male cardinal grosbeak showed off his bright red feathers.
