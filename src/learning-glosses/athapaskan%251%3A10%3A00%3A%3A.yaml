simpleMeaning: A group of the tongues of the first peoples of America, a name made up by an American man
  who studied peoples, Edward Sapir.
scope: Also called Athabascan, Athabaskan, Athapascan, and Athapaskan language; a group of tongues, not
  the people who speak them.
examples:
- Athapaskan is a group of tongues of the first peoples of America.
- The name Athapaskan was made up by Edward Sapir.
