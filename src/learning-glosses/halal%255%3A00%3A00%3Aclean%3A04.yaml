simpleMeaning: that follows Muslim rules about what people can eat
scope: This describes food, or a place that makes or sells food, that follows Muslim food rules; it is
  not the noun for meat from animals killed in the set way under Muslim law.
examples:
- The shop sells only halal meat.
- We ate in a halal kitchen while we travelled.
