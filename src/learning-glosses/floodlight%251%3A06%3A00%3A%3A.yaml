simpleMeaning: A lamp made by people that gives a wide beam of light, used when taking photos.
scope: 'Also called flood, flood lamp and photoflood: a lamp with a wide beam for taking photos, not the
  verb sense of lighting a place with such lamps.'
examples:
- She set up a floodlight to take photos of the car at night.
- The floodlight gave a wide light over the whole scene for the photo.
