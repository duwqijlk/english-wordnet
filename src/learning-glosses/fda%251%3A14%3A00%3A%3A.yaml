simpleMeaning: Foods and health goods that are new must pass this office of the United States department
  for health and human services before they can be sold.
scope: A United States office that must pass new foods and health goods before they can be sold; Food
  and Drug Administration is another name for this sense, not a maker of foods or drugs.
examples:
- The FDA approved the new drug last year.
- The FDA checks new foods before they reach the shops.
