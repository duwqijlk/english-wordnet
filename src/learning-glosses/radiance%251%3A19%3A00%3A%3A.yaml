simpleMeaning: at one small spot on a surface, the amount of ray energy, of the kind light is made of,
  that comes to it or leaves it
scope: 'Also called glow and glowing: the amount of ray energy at one spot on a surface, not the bright
  look of a shining thing and not the lovely look of good health and happiness.'
examples:
- The scientists measured the radiance reaching one point on the wall.
- The radiance leaving that spot on the surface was higher at noon.
