simpleMeaning: Feeding on fish, this large harmless hawk builds a big nest often used for years, and it
  is found all over the world.
scope: Also called osprey, fish eagle, and fish hawk, it is a large harmless hawk that feeds on fish and
  builds a big nest often used for years.
examples:
- We saw a sea eagle over the water with a fish in its claws.
- The sea eagle came back to its big nest again this year.
