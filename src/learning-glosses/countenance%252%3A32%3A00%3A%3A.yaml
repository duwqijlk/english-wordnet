simpleMeaning: to say yes to something, giving your agreement so that a person may do it
scope: 'Also called let, allow, or permit: to agree to something and let it happen, not formal approval
  and not a person''s face.'
examples:
- She countenanced her son visiting his estranged husband.
- The school would not countenance pupils leaving early.
