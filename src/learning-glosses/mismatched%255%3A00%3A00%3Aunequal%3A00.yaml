simpleMeaning: of a contest or the people in it, not set against each other in a fair way as opponents
scope: 'Of a contest or its players, also called uneven: not fairly matched as opponents, not things that
  simply do not go together.'
examples:
- The mismatched teams made for a short game.
- It was a mismatched fight, and everyone knew who would win.
