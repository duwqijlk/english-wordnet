simpleMeaning: branches that hang down a little and are covered in fine soft hairs grow on this European
  birch, whose bark is dull white to pale brown
scope: Also called white birch, this is a European birch with soft-haired branches that hang down a little.
examples:
- A downy birch stood at the far end of the garden.
- The downy birch has pale bark and branches that droop a little.
