simpleMeaning: A long-lived sweet-smelling herb of southeast Asia, with large leaves, usually bright-coloured
  or blotched, and spikes of blue-violet flowers; sometimes classed under its own genus name.
scope: A long-lived aromatic herb, also called painted nettle, Coleus blumei, Joseph's coat, and Solenostemon
  scutellarioides; not other coleus kinds and not other sweet-smelling garden herbs.
examples:
- Solenostemon blumei brightens the garden with its blotched leaves.
- The blue-violet spikes of Solenostemon blumei open in summer.
