senseId: 'sycamore%1:20:04::'
synsetId: 12424018-n
simpleMeaning: A thick-branched, spreading tree of Africa and southwest Asia, propped by low branches,
  bearing clusters of edible but poor fruit on bare twigs; the Bible mentions this tree.
scope: This sense is the fig-bearing tree of Africa and southwest Asia, the biblical sycamore; it is not
  the plane tree with flaking bark and ball-shaped fruit, and not the maple whose leaves turn yellow in
  autumn.
examples:
- The old sycamore by the river had branches that almost touched the ground.
- Farmers in East Africa often rest in the shade of a wide sycamore.
