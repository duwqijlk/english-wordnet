simpleMeaning: water that is not clear because mud has been stirred up from the bottom or small bits are
  floating in it
scope: 'Also called turbidity: water that is cloudy from mud or floating bits, not clear water.'
examples:
- The turbidness of the pond made it hard to see the fish.
- After the rain the turbidness of the stream slowly cleared.
