simpleMeaning: a reflecting telescope built so that the light is led to a plate holder or to an instrument
  that splits light into colours
scope: A reflecting telescope built so that the light is led to a plate holder or to an instrument that
  splits light into colours; coude telescope is another name for this sense, not a telescope that looks
  straight through its tube, and not a camera.
examples:
- The coude system led the light to a spectrograph in the next room.
- With a coude system, the light is led away to a spectrograph in a fixed room.
