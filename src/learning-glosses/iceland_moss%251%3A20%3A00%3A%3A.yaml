simpleMeaning: A branched, flat, partly upright growth that lives in mountains and the far north; used
  as food or medicine for people and animals, and a source of glycerol.
scope: A mountain lichen used as food and medicine, also called Iceland lichen and Cetraria islandica;
  not a true moss.
examples:
- Iceland moss carpets the Arctic rocks.
- Reindeer eat Iceland moss in winter.
