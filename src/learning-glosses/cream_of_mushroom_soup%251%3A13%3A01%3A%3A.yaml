simpleMeaning: Fungi or broth made from them are added to a plain soup, after a base of flour and fat
  is thinned with rich milk or plain milk
scope: Made by thinning a base of flour and fat with rich milk or plain milk and then adding fungi or
  broth made from them, this is a plain soup.
examples:
- She made cream of mushroom soup.
- He ate cream of mushroom soup.
