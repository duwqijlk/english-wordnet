simpleMeaning: A chemical reaction between two compounds in which parts of each are swapped to form two
  new compounds (AB+CD=AD+CB).
scope: This chemical reaction, also called double decomposition reaction and metathesis, swaps parts between
  two compounds to make two new compounds.
examples:
- A double decomposition took place when the two compounds were mixed.
- We wrote the double decomposition as AB+CD=AD+CB.
