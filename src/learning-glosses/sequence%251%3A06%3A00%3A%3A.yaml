senseId: 'sequence%1:06:00::'
synsetId: 04180233-n
simpleMeaning: a part of a film made of linked shots, one after another, that together build up one subject
  in a movie
scope: 'Also called episode: this is a part of a film, not things in a set order in general and not a
  repeated tune in music.'
examples:
- The opening sequence of the film shows the city at night.
- That long sequence in the movie tells the story of her childhood.
