simpleMeaning: A lipoprotein that carries cholesterol in blood, mostly protein with rather little cholesterol,
  whose high levels are thought to go with a lower risk of heart disease and artery hardening.
scope: Also called high-density lipoprotein, a lipoprotein that carries cholesterol in blood, mostly protein
  with rather little cholesterol, whose high levels are thought to go with a lower risk of heart disease
  and artery hardening.
examples:
- Alpha-lipoproteins carry cholesterol in blood.
- Alpha-lipoprotein levels were high.
