simpleMeaning: Almond-shaped nerve cluster in the front of the temporal lobe, linked to the hypothalamus,
  hippocampus and cingulate gyrus, and key to emotion and motivation as part of the limbic system.
scope: Another name for the amygdala, the almond-shaped brain area; the amygdaloid nucleus is a third
  name for the same structure, not a separate brain part.
examples:
- The corpus amygdaloideum lies deep in the temporal lobe.
- Older anatomy books still use the name corpus amygdaloideum.
