synsetId: 04166119-n
simpleMeaning: A tool with a design cut into it, used to make a mark, to keep a closing safe or to show
  that a document is real
scope: 'Also called stamp: a tool that presses a mark to keep a closing safe or show a paper is real.
  Not the mark itself on the paper, not the warm substance for letters, and not the sea animal.'
examples:
- She kept the office seal locked in a drawer and used it only on official papers.
- He pressed the seal firmly onto the document to leave its mark.
