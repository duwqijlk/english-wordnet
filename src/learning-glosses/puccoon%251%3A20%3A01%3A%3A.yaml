simpleMeaning: A North American woodland plant with one white spring bloom and a lobed leaf; its harsh
  root and red juice cause vomiting; the root was a stimulant and chest medicine.
scope: This white-flowered woodland plant with red sap, not the hairy-leaved puccoon of eastern North
  America grown for its red or yellow dye.
examples:
- Puccoon blooms in early spring on the forest floor.
- The red juice of puccoon stains the fingers.
