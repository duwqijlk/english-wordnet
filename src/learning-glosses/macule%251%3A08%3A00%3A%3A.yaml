simpleMeaning: Many sicknesses can leave a patch of skin that has changed colour, but it is usually flat,
  not raised
scope: Also called macula, this is a flat patch of skin whose colour has changed because of a sickness,
  not a raised bump and not a wound.
examples:
- A macule appeared on her arm after the fever.
- The doctor looked at the macule and said it was flat, not raised.
