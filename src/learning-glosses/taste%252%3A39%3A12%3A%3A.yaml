simpleMeaning: To have a flavour that clearly belongs to something and is easy to recognise.
scope: Says which flavour a thing has, not just that it has some flavour, not the act of noticing flavour,
  and not taking a small amount to try something.
examples:
- This soup tastes of garlic.
- The milk tastes slightly sour.
