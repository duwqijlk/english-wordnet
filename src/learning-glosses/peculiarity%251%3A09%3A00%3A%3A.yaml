senseId: 'peculiarity%1:09:00::'
synsetId: 05860690-n
simpleMeaning: a strange quality or part of how a person or thing is, that is not common
scope: This sense is a strange quality of a person or thing, not a strange thing that a person may want
  to keep.
examples:
- A peculiarity of her voice is that it gets higher when she is excited.
- One peculiarity of the house is a door that opens into a wall.
