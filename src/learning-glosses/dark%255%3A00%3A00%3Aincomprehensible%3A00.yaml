simpleMeaning: written or spoken in a way that is hard to follow because of its style or wording
scope: Not about evil and not about low light; this sense concerns writing or speech that is hard to understand.
examples:
- The author's dark, convoluted sentences make the essay a struggle to read.
- Even the experts found the treaty's dark wording hard to interpret.
