senseId: 'yawl%2:32:00::'
synsetId: 01048804-v
simpleMeaning: To let out cries, long and loud.
scope: This sense is also called roar, howl, wail, and ululate, for letting out cries, long and loud,
  where roar is to send out long, loud sounds with the voice, howl is to cry out in a loud voice for a
  long time, and wail is to send out long, loud cries, unlike the sense for a sailing ship with two masts,
  a small mizzen set aft of the rudderpost, and unlike the sense for a ship's small boat, usually rowed
  by 4 or 6 oars.
examples:
- They yawl, letting out cries.
- They yawl long and loud.
