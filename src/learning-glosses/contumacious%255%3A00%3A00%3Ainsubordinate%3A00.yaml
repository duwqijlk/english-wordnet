simpleMeaning: refusing to obey on purpose and sticking hard to one's own way
scope: Describing a person who will not obey and will not give in, not a person who merely disagrees and
  not a person who has made a mistake.
examples:
- The contumacious witness refused to answer the judge's questions.
- Her contumacious reply showed she would not follow the order.
