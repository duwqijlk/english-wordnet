simpleMeaning: an old coat for fighting, from the middle ages, made of small metal rings sewn onto leather
  or cloth
scope: This is a coat worn for protection in fighting long ago, made with metal rings on leather or cloth,
  not a full suit of hard metal plates.
examples:
- The soldier wore a brigandine under his outer coat.
- A brigandine in the museum still shows its small metal rings.
