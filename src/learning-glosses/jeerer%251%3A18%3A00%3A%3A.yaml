schema: oewn-learning-gloss-v2
senseId: 'jeerer%1:18:00::'
synsetId: 10580748-n
simpleMeaning: A person who laughs at a person or a thing in a cruel way, or shouts scorn at a person
  or a thing.
scope: A person who mocks others with scorn; mocker and flouter are other names for this person, not someone
  who cheers others on or laughs along in kindness.
examples:
- The jeerer in the crowd shouted at the singer.
- A jeerer mocked the speaker from the back of the hall.
