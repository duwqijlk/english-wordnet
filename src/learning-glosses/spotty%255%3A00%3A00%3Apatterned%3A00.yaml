simpleMeaning: having small areas of a different color or feel from the rest
scope: 'Also called spotted and patched: this is about a pattern of small areas of different color or
  feel, not about how good or even something is over time.'
examples:
- The cow had a spotty coat of black and white.
- A spotty pattern of light fell through the leaves onto the wall.
