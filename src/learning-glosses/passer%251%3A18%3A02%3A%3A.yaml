simpleMeaning: a student who does well enough in a test to succeed in it
scope: A student who succeeds in a test; not a person who walks past a place, and not a player who throws
  the ball in football.
examples:
- The school published the names of all the passers in this year's exam.
- As a passer, he was allowed to move on to the next level of the course.
