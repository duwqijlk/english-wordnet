simpleMeaning: to make a muscle become tight and painful all at once, or to make a muscle act as if this
  has happened to it
scope: This sense means to cause a tight and painful pulling in a muscle. It is not to suffer that pain
  yourself, not the pain itself, and not a metal strip that holds stone in place.
examples:
- The long run cramped his leg muscles badly.
- Cold water can cramp a swimmer's legs.
