senseId: 'crinkle%2:35:00::'
synsetId: 01280991-v
simpleMeaning: To press a flat, even thing until small folds appear in it, leaving a bent line where it
  was pressed; the old word crisp for this is no longer used
scope: 'Also called a wrinkle, a crisp, a crease, or a scrunch: to press a flat, even thing until small
  folds appear in it, leaving a bent line where it was pressed, not the small fold itself and not the
  thing growing folds on its own.'
examples:
- She crinkled the paper into a ball.
- The dress got crinkled in the wash.
