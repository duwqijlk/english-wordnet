simpleMeaning: In bridge, to make a high bid in order to stop the other players from bidding
scope: This is the verb for making such a bid in bridge, not the noun name for the high bid itself.
examples:
- She preempted with three hearts to make it hard for the other pair to bid.
- He preempted at a high level before his opponents could say anything.
