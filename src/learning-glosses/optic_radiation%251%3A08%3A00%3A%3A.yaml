simpleMeaning: a path of nerve threads from the relay point for sight signals to the part of the brain
  that sees
scope: A path of nerve threads from the relay point for sight signals to the part of the brain that sees;
  radiatio optica is another name for this sense, not the eye itself and not a path that carries sound.
examples:
- The optic radiation carries sight signals to the back of the brain.
- Damage to the optic radiation can blur part of what is seen.
