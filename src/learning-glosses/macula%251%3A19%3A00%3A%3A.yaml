simpleMeaning: On the bright face of the sun, a cooler, darker patch comes and goes where the pull of
  magnets is strong.
scope: Also called sunspot, this patch on the bright face of the sun comes and goes, cooler and darker
  than the rest, not the small yellow patch in the eye that gives clear sight.
examples:
- A macula darkened the face of the sun.
- The sun showed a macula that came and went.
