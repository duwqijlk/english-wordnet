simpleMeaning: A horse race held every year for horses three years old, at Churchill Downs in Louisville,
  in the state it is named for.
scope: The yearly race for three-year-old horses at Churchill Downs in Louisville, in the state it is
  named for; a race for young horses, not for older horses.
examples:
- Thousands watched the Kentucky Derby at Churchill Downs.
- He had waited all year to see the Kentucky Derby.
