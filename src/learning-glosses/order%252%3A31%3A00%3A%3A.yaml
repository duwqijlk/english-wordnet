simpleMeaning: To put things or people at a position on a scale by how good, important, or high they are.
scope: This is grading things by quality or importance, not putting them in a fixed sequence such as alphabetical
  order, not a request to buy something, and not a command.
examples:
- The judges ordered the entries from best to worst.
- The coach ordered the players from strongest to weakest.
