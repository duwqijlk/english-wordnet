simpleMeaning: to join in a folk dance in which dancers stand in two lines facing each other and follow
  set steps
scope: To join in a folk dance in two lines facing each other; contra danse and contradance are other
  names for this sense; not the dance itself as a thing, and not a modern dance.
examples:
- They will contredanse at the ball tonight.
- She learned to contredanse when she was young.
