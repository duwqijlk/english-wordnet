simpleMeaning: To equip an object with a handle or shoulder piece.
scope: This verb means fitting a gun or tool with a handle or shoulder piece, chiefly the shoulder piece
  of a rifle or shotgun. It is not the 'have on hand' sense or the 'supply with goods' sense (as in stocking
  shelves), and it is not the noun for goods or shares. Rare and technical; the pack's own example is
  'stock a rifle'.
examples:
- The gunsmith stocked the rifle with a walnut shoulder piece.
- The old shotgun was stocked in seasoned walnut.
