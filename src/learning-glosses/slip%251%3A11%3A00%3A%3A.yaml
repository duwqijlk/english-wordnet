simpleMeaning: a wrong step by chance that may make a person fall, or does make them fall
scope: This is a wrong step that may make you fall, also called trip. It is not a part cut from a plant,
  and not wet clay for pots.
examples:
- A slip on the wet floor sent him to the ground.
- She blamed her slip on the ice outside the door.
