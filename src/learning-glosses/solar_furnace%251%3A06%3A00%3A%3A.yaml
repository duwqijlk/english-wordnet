simpleMeaning: a curved mirror that focuses the sun's rays to one place, and can reach very high heat
scope: Also called solar collector and solar dish; a curved mirror that focuses the sun's rays to make
  great heat, not a furnace that burns fuel and not a flat mirror.
examples:
- The solar furnace heated the metal until it glowed.
- Scientists used the solar furnace to test how materials stand up to great heat.
