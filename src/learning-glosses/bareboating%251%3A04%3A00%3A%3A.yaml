simpleMeaning: going out on the water by hiring a bareboat, a ship with no captain or crew, and taking
  your own crew and supplies
scope: Going out on the water in a hired ship with your own crew and supplies, not a trip on a ship with
  a crew and not the ship itself.
examples:
- We saved money by bareboating around the islands.
- They spent the summer bareboating along the coast with friends as crew.
