simpleMeaning: a strong fear of one clear thing, but not a fear of open places
scope: A strong fear tied to one clear thing, not a fear of open places and not a fear with no clear cause.
examples:
- His simple phobia of dogs kept him from the park.
- Her simple phobia made her avoid high bridges.
