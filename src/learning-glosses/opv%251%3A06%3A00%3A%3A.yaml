simpleMeaning: A mouth vaccine with live but weak polio germs, given to guard a person against polio.
scope: Also called oral poliovirus vaccine, trivalent live oral poliomyelitis vaccine, Sabin vaccine and
  TOPV; it is the mouth vaccine with live but weak polio germs, given to guard against polio.
examples:
- The child was given OPV drops on the tongue.
- Health workers gave OPV to every child in the village.
