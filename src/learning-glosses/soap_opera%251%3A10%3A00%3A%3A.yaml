simpleMeaning: On radio or television, and often paid for by a firm that makes things for washing, this
  show comes in part after part, usually about family life full of feeling
scope: It is a show that comes in part after part about family life, full of feeling, not a single play
  shown once.
examples:
- The soap opera followed one family's troubles through many episodes.
- He switched on the radio to catch the next part of the soap opera.
