simpleMeaning: shown in a simple form, with marks or shapes that stand for the real thing
scope: 'Also called formal and conventional: this means shown in a simple form, not a drawing of an electric
  system or a machine system.'
examples:
- The drawing is schematic, so it uses simple lines for the roads.
- He drew a schematic plan, with boxes to stand for the houses.
