simpleMeaning: In physics, the force between the small parts of a solid or liquid that holds them together
scope: In physics, this is the force that holds the small parts of a solid or liquid together; not the
  linking of words and ideas that holds a text together.
examples:
- Water drops form because of cohesion between the tiny parts of the water.
- Cohesion helps hold a liquid together in small drops.
