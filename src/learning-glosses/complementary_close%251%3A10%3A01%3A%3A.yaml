senseId: 'complementary_close%1:10:01::'
synsetId: 92463148-n
simpleMeaning: The words at the end of a letter, such as 'sincerely yours', that by custom come just before
  the name signed and show the writer's kind feelings for the reader
scope: The polite words at the end of a letter before the name signed, not the greeting at the start and
  not the main part of the letter.
examples:
- She ended her letter with the complementary close 'Sincerely yours'.
- A complementary close is almost standard in work emails.
