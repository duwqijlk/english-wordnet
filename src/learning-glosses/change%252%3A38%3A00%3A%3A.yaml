simpleMeaning: to leave one bus, train, or route and continue the journey on another.
scope: This sense is not swapping a job or an item for another and not putting on new clothes; it is moving
  from one vehicle or route to another during a trip.
examples:
- You need to change at the next station.
- We changed from the bus to the subway downtown.
