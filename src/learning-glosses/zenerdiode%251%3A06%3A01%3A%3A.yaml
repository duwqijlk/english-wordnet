simpleMeaning: when the backward voltage hits one set point, current flowing backwards through this diode
  made of semiconductor material jumps all at once, which keeps voltage steady
scope: 'Also called stabilitron: a diode that keeps voltage steady, not a diode that only lets current
  flow one way and not a battery.'
examples:
- The zenerdiode in the circuit keeps the voltage steady.
- A zenerdiode lets current jump backwards at one set voltage.
