simpleMeaning: One branch of a group of languages spoken in the north along two rivers and in the south
  in Lam Dong and other provinces of Vietnam.
scope: Also called Black Tai; one branch of a language group of Vietnam, not the other branches of the
  same group.
examples:
- Tai Dam is spoken along the Red river.
- Tai Dam speakers live in the north of Vietnam.
