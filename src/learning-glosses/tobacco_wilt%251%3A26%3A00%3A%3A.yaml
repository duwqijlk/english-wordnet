simpleMeaning: When a germ called Pseudomonas solanacearum gets at tomatoes, potatoes, and the plant it
  is named for, and the like, they fall sick.
scope: Ring disease and ring rot are other names for this sickness of tomatoes, potatoes, and the plant
  it is named for, brought on by a germ called Pseudomonas solanacearum.
examples:
- The tobacco wilt hit the tomato plants.
- The tobacco wilt hit the potatoes as well as the tomatoes.
