simpleMeaning: To make a person feel a strong sick disgust toward a thing
scope: To make a person feel a strong sick disgust toward a thing, also called shock, offend, and outrage,
  not to fill a person with fear and worry.
examples:
- His cruelty appalled everyone who knew him.
- The filthy kitchen appalled the visitors.
