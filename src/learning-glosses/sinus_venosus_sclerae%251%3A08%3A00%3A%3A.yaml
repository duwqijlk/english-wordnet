simpleMeaning: a ring-shaped tube in the eye that drains clear watery liquid from the front part of the
  eye into small blood tubes at the front of the eye
scope: A small round drain in the eye, not a tear duct and not a blood vessel of the brain.
examples:
- The sinus venosus sclerae drains fluid from the front of the eye.
- Doctors study the sinus venosus sclerae when eye pressure rises.
