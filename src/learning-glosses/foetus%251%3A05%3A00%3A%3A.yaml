simpleMeaning: An animal with a backbone that is still inside the egg or its mother, at a late stage of
  growth when its main adult features can already be seen
scope: 'Also called fetus: a young animal with a backbone before birth or hatching, at a late stage of
  growth, not an early stage before its adult shape can be seen.'
examples:
- The foetus in its mother's body already had tiny hands and feet.
- Checks showed the foetus was growing well in its last weeks before birth.
