senseId: 'long-horned_grasshopper%1:05:00::'
synsetId: 02230618-n
simpleMeaning: Jumping insects with thin thread-like feelers of more than usual length and, on the front
  wings of the male, well-formed parts that make sound by rubbing.
scope: These are jumping insects with thin thread-like feelers of more than usual length and sound-making
  parts on the male's front wings, not a short-horned grasshopper and not a cricket; tettigoniid is another
  name for this sense.
examples:
- Long-horned grasshoppers sang in the meadow at dusk.
- The long-horned grasshopper's feelers were longer than its body.
