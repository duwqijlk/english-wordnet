senseId: 'facelift%1:04:01::'
synsetId: 00266316-n
simpleMeaning: work done to make something, such as a building, look better on the outside, but that usually
  does not make big changes
scope: This is work that makes a building or other thing look better on the outside, not an operation
  to make a person's face look younger.
examples:
- The shop got a facelift with new paint and a new sign.
- They gave the old library a facelift but kept its rooms the same.
