simpleMeaning: Fuel is given this mark by how well it holds back the sharp knock that can come in an engine
scope: A mark that tells how well fuel holds back the sharp knock that can come in an engine, also called
  octane number; not a measure of how much power fuel gives and not the fuel itself.
examples:
- The octane rating on the pump reads 91.
- Cars with high-compression engines need a high octane rating.
