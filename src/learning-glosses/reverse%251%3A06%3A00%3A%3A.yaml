simpleMeaning: the gear in a machine or car that makes it move backwards
scope: The gear that makes a car or machine go backwards, not the back side of a coin or medal and not
  a bad event that stops progress.
examples:
- He put the car into reverse and backed out of the driveway.
- The reverse on this old truck is hard to get into gear.
