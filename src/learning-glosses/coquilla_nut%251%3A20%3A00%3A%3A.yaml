simpleMeaning: A hard-shelled fruit with a warm brown shell, used in place of the white stuff from elephants'
  tusks.
scope: This is a hard-shelled fruit with a warm brown shell, used in place of ivory, not a nut people
  eat and not real ivory from an elephant.
examples:
- The coquilla nut has a hard brown shell.
- Carvers use the coquilla nut in place of ivory.
