simpleMeaning: facing away from the centre line of a body part or of a living thing
scope: Facing away from the centre line of a body part or living thing, not facing toward that line and
  not just on the back.
examples:
- The dorsal side of the leaf faces away from the stem.
- In this plant, the dorsal surface of each leaf turns away from the main stem.
