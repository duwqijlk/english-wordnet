simpleMeaning: any of several weights used in south-east Asia, above all a Chinese one of 500 grams
scope: A weight of south-east Asia, also called catty; not a pound and not a kilogram.
examples:
- The rice weighed two catties at the market.
- A cattie in China is 500 grams.
