simpleMeaning: A plant from West Africa but grown in Java and elsewhere, that stands up to the rust disease
  of the hot-drink plant
scope: A hardy kind of the hot-drink plant, also called robusta coffee, Coffea canephora and Coffea robusta,
  not the Arabica kind and not a drink made from the beans.
examples:
- Rio Nunez coffee grows well in Java.
- Farmers plant Rio Nunez coffee because it resists rust.
