senseId: 'normalize%2:30:03::'
synsetId: 00303837-v
simpleMeaning: to bring a thing to the firmness, feel, or hardness that is wanted, by heating it and then
  cooling it bit by bit
scope: 'Also called temper and anneal: to heat and cool a thing bit by bit to get the right hardness,
  not to make something normal and not to become normal again.'
examples:
- The workers normalized the steel by heating it and cooling it bit by bit.
- This glass was normalized in a hot oven and then cooled slowly to make it hard.
