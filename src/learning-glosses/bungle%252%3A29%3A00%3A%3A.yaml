simpleMeaning: to spoil something by acting without skill or in a foolish way
scope: 'To spoil something by acting without skill or in a foolish way. Not simply to make a mess of something
  or to ruin it: that sense says what happens, not how the person acted.'
examples:
- He bungled the job by dropping the wet paint on the floor.
- She bungled it when she rushed in a foolish way and mixed up the papers.
