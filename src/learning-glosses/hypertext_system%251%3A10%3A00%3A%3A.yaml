simpleMeaning: Pieces of writing, called objects, can be tied together in any order the maker chooses
  in this store of linked words, handled as a linked set of points.
scope: A store of linked words, handled as a set of joined points, is what this name fits.
examples:
- Notes can be tied together in any order with the hypertext system.
- The hypertext system lets you move from one linked piece of writing to another.
