simpleMeaning: A kind of resin with a minus charge that swaps one charged bit for another.
scope: This is the negatively charged kind of ion-exchange resin, the kind that takes in cations and gives
  out others in exchange; it has no other name in this set.
examples:
- Cation-exchange resin separates out the plus-charged bits.
- Cation-exchange resin took in the plus-charged bits and gave out others.
