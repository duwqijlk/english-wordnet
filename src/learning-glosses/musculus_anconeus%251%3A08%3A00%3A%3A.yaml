simpleMeaning: Straightening the lower arm is this muscle's work, moving the lower-arm bone away from
  the body when the palm turns down.
scope: Anconeous muscle is another name for this muscle, which straightens the lower arm and moves its
  bone away from the body when the palm turns down.
examples:
- The musculus anconeus straightens the forearm when the palm turns down.
- The musculus anconeus moves the lower-arm bone away from the body.
