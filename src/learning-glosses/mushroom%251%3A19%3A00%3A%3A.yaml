simpleMeaning: a large cloud of broken stone and dust that rises into the sky after a blast, like a cap
  on a stem, especially after a nuclear bomb
scope: This is the cloud made by a blast, in the shape of a cap on a stem. It is not a fungus that grows
  in the ground and not a food.
examples:
- A huge mushroom cloud rose into the sky after the blast.
- People far away could see the mushroom cloud from the nuclear bomb test.
