simpleMeaning: the first whole number you meet when you count up, or the mark on paper that stands for
  it
scope: 'Also called one or single: the number 1, not a playing card and not a person who is very good
  at something.'
examples:
- He has the ace but will need a two and three to go with it.
- The smallest number on the ticket was an ace, worth just one point.
