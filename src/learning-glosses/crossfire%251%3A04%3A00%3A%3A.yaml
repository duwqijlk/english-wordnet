senseId: 'crossfire%1:04:00::'
synsetId: 00992560-n
simpleMeaning: gunfire from two or more places, aimed in ways that cross each other
scope: This sense is real shooting from different places whose lines cross; it is not fire that burns,
  and not a heated talk where people exchange ideas and opinions.
examples:
- The soldiers were caught in crossfire from both hills and could not move.
- A reporter ran through the crossfire to reach a safe place.
