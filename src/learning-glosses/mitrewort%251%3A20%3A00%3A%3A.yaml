simpleMeaning: Low plants that live for years and spread by stems under the ground bear a seed case in
  the shape of a bishop's pointed hat.
scope: Also called bishop's cap and miterwort; a low plant that lives for years, with a seed case shaped
  like the pointed hat a bishop wears.
examples:
- Mitrewort spreads by stems under the ground in the damp wood.
- The mitrewort bore seed cases shaped like a bishop's pointed hat.
