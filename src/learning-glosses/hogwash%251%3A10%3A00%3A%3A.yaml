schema: oewn-learning-gloss-v2
senseId: 'hogwash%1:10:00::'
synsetId: 06624034-n
simpleMeaning: bad behavior that people should not accept, especially silly statements that are clearly
  not true
scope: Also called bunk, rot, guff and bunkum. This sense is bad talk or behavior, especially silly untrue
  statements, not food for pigs.
examples:
- His claim that he never got the letter is pure hogwash.
- Do not believe that hogwash about the school closing next week.
