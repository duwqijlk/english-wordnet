simpleMeaning: harm to the body caused by a bomb going off, especially in a shut-in place
scope: Harm to the body from a bomb going off, not a wound from a bullet and not harm from a fall.
examples:
- The soldier suffered blast trauma when the bomb went off in the tunnel.
- Doctors treated several cases of blast trauma after the explosion.
