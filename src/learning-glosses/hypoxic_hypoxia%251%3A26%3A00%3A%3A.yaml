senseId: 'hypoxic_hypoxia%1:26:00::'
synsetId: 14065113-n
simpleMeaning: Too little oxygen in the body because the blood does not take in enough oxygen in the lungs.
scope: Too little oxygen in the body because the lungs do not load the blood with enough oxygen, not too
  little oxygen from a lack of red blood cells and not from poor blood flow.
examples:
- The climber suffered hypoxic hypoxia high on the mountain.
- Hypoxic hypoxia set in when his lungs could not load the blood with oxygen.
