simpleMeaning: the act of pushing down or against something with your hand or a tool
scope: This is not the scientific measure of force on an area and not a feeling of stress; it is the physical
  action of pushing.
examples:
- A light pressure on the button starts the machine.
- He felt the pressure of her hand on his arm.
