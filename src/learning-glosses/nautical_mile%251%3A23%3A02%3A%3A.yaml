simpleMeaning: A former British unit of length equal to 6,080 feet (1,853.184 meters), 800 feet longer
  than the usual land unit.
scope: Also called mile, mi, geographical mile, and naut mi; a former British length unit, not the usual
  land unit and not the modern sea unit of 1,852 meters.
examples:
- The captain reckoned the run in nautical miles.
- One nautical mile was 800 feet longer than the usual land unit.
