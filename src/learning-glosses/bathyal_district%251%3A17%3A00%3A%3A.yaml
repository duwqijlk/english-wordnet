simpleMeaning: Down to the deep sea floor the sea floor falls steeply from the shelf at the edge of the
  land.
scope: This steep fall of the sea floor from the shelf to the deep sea floor is also called the bathyal
  zone and the continental slope.
examples:
- The bathyal district begins where the shelf ends.
- Ships crossing the bathyal district pass over a steep fall in the sea floor.
