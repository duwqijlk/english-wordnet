simpleMeaning: Taking on things that carry risk or danger is what this quality means; a person with it
  does not hold back
scope: Being ready to take on risky work, also called boldness, daring and hardihood, not skill at the
  work and not toughness of the body.
examples:
- It took great hardiness to volunteer for the rescue in the storm.
- Her hardiness showed when she agreed to lead the climb.
