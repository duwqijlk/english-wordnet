simpleMeaning: A swelling of the brain brought on by a germ carried by a mosquito from a sick horse
scope: This is a swelling of the brain brought on by a germ from a sick horse; equine encephalitis is
  another name for this sense, not a swelling of the brain from a head blow and not a horse sickness spread
  by touch.
examples:
- The horse died of equine encephalomyelitis after the mosquito season.
- Vets watch for equine encephalomyelitis when mosquitoes are thick.
