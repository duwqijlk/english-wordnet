simpleMeaning: a tree-dwelling mammal of Southeast Asia and the Philippines, active at night, lemur-like,
  gliding long distances using a skin fold from neck to tail.
scope: Another name for the flying lemur and the flying cat; it is the gliding Southeast Asian mammal,
  not a lemur or a flying squirrel.
examples:
- A colugo glided from a high branch to a lower trunk.
- The colugo's skin fold opens like a parachute when it leaps.
