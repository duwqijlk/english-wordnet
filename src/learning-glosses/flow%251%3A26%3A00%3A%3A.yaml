simpleMeaning: A steady movement of people or things that keeps going without a break, like water in a
  stream.
scope: This is a steady stream of people or things, not the movement of a liquid and not a woman's monthly
  bleeding.
examples:
- The flow of traffic slowed to a crawl near the bridge.
- Staff widened the exits to handle the flow of fans after the concert.
