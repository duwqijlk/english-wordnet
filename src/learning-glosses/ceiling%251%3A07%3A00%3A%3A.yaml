simpleMeaning: In meteorology, the height of the lowest layer of cloud.
scope: A weather reading of how high the lowest clouds sit, not an aircraft's highest reach or the inner
  roof of a room.
examples:
- Fog kept the ceiling below a thousand feet all morning.
- The forecaster expected the ceiling to rise by noon.
