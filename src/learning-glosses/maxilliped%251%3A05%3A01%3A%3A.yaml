simpleMeaning: Used to help a hard-shelled ten-legged sea animal feed, one of three pairs of limbs on
  its middle part, set just behind its jaws.
scope: 'Gnathopod is another name for it: it is one of three pairs of limbs on the middle of a hard-shelled
  ten-legged sea animal, set just behind its jaws to help it feed.'
examples:
- The maxilliped helped the crab feed.
- A crab has three pairs of maxillipeds on the middle part of its body.
