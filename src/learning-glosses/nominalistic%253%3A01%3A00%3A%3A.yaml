simpleMeaning: Of or about the view that general words are only names, not real things
scope: This concerns the view that general words are only names; not the view that they name real things
  and not a view about names in grammar.
examples:
- The nominalistic thinker denied that kinds exist.
- His nominalistic view treats 'redness' as a mere name.
