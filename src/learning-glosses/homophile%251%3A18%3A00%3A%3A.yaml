simpleMeaning: Love and desire for people of the same sex are what this person feels
scope: A person drawn in love and desire to people of their own sex, not a person drawn to people of the
  opposite sex; also called gay, homo and homosexual.
examples:
- He is a homophile who has lived openly with his partner for years.
- The homophile spoke about his feelings for men.
