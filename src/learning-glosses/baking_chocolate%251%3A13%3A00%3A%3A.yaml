simpleMeaning: With no sugar in it, this plain chocolate is used for cooking, for cake tops, for sauces,
  and for sweets
scope: Also called bitter chocolate and cooking chocolate, this plain chocolate has no sugar in it and
  is used for cooking, not sweet chocolate.
examples:
- She used baking chocolate for the cake.
- Baking chocolate went into the sauce.
