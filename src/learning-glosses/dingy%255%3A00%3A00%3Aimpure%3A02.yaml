simpleMeaning: a color made dull by stuff mixed in with it, so it is not bright and clear; the word dirty
  is often used with another word
scope: 'Also called dirty or muddy: a color dulled by impurities, not bright and clear, and not a surface
  thickly covered with dirt.'
examples:
- The dingy white paint on the walls had turned grey with age.
- Her dingy blonde hair looked dull in the dim light.
