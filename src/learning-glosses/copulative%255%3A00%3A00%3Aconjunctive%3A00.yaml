simpleMeaning: joining sentences, or parts of a sentence, in a way that follows the rules of grammar
scope: A word that joins sentences or parts of a sentence; not a verb like be that links a subject to
  words that say more about it.
examples:
- The word 'and' is a copulative conjunction in that sentence.
- She used a copulative word to join the two short sentences.
