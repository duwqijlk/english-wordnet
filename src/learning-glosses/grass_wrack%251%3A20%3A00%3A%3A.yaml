simpleMeaning: A sea plant that lives under water, with very long narrow leaves, found in great numbers
  along North Atlantic shores
scope: This underwater sea plant is also called eelgrass and sea wrack, and is not a plant of fresh water
  and not a plant of dry land.
examples:
- Grass wrack swayed under the clear water near the shore.
- The fishermen found grass wrack along the North Atlantic coast.
