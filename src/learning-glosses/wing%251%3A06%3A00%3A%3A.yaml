simpleMeaning: one of the horizontal airfoils, surfaces that air flows over, on either side of an airplane's
  body
scope: The lifting surface of an airplane, not a bird's limb or a car's wheel cover.
examples:
- Ice had formed along the leading edge of the wing.
- The passengers could see the wing lights blinking below.
