simpleMeaning: To steer a vehicle, ship, or other moving thing and settle which way it goes.
scope: This is steering a moving thing such as a ship, aircraft or vehicle and settling which way it travels;
  it is not taking somebody somewhere, not causing something to go somewhere, not aiming a weapon, camera
  or blow at a target, not intending something towards a goal, not telling someone which way to go, not
  planning and running a whole complicated undertaking, not governing or managing an organization, not
  commanding with authority, not guiding actors or conducting a musical performance, not designing something
  for a particular audience, not writing an address on an envelope, not the adjective senses (straight
  path, no go-between, plain or frank manner, unbroken family line, eastward sky motion, proportional
  relation, one-way current, immediate result, exact words, total and unmitigated), and not the adverb
  meaning without swerving.
examples:
- The helmsman directed the ship's course through the narrow strait.
- He directed the canoe toward the far bank with steady paddle strokes.
