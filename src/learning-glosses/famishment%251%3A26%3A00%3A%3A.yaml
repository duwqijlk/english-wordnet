simpleMeaning: a state of very great hunger caused by going without the food the body needs for a long
  time
scope: This is very great hunger from long lack of food; starvation is another name for this sense; not
  ordinary hunger after a missed meal and not thirst.
examples:
- Famishment followed months without enough food.
- The famishment of the prisoners shocked the visitors.
