simpleMeaning: On his 13th birthday, a Jewish boy takes up his duties as a grown member of the faith in
  this rite of Judaism.
scope: This is the rite by which a Jewish boy takes up his religious duties at thirteen.
examples:
- His bar mitzvah fell on his 13th birthday.
- The family held a bar mitzvah for their son.
