simpleMeaning: the act of settling a disagreement by giving a final say, as a person asked to judge it
scope: 'Also called arbitration and arbitrement: a final say that settles a disagreement, not a friendly
  talk with no ruling and not a court case.'
examples:
- They submitted their disagreement to arbitrament.
- The two sides agreed to accept the arbitrament and end the quarrel.
