senseId: 'homonymy%1:24:00::'
synsetId: 13831193-n
simpleMeaning: the link between two words that look the same in print but mean different things, or that
  sound the same but mean different things
scope: The link between two words that look or sound the same but mean different things, not a word with
  two meanings and not a rhyme.
examples:
- Homonymy explains why 'bank' can mean a river's edge or a place for money.
- The words 'to', 'too' and 'two' show homonymy in sound.
