simpleMeaning: A small maple of north-west North America, with stems that lie flat, take root freely,
  and form thick tangled growth
scope: A small maple with flat stems that root and form thickets; vine maple is another name for this
  sense, not a tall maple with a single straight trunk.
examples:
- Acer circinatum spreads along the forest floor.
- The Acer circinatum stems root where they touch the ground.
