simpleMeaning: The United States federal office that runs federal plans for better homes and for making
  towns new again, set up in 1965
scope: This is the United States federal office that runs federal plans for better homes and town renewal,
  also called HUD and Department of Housing and Urban Development; near rivals are the Department of Transportation
  and the Department of Energy.
examples:
- Housing and Urban Development runs federal programs for better housing and urban renewal.
- Housing and Urban Development was created in 1965 to run federal housing programs.
