simpleMeaning: too much strong feeling, and being too easily made angry or excited, especially when this
  is shown openly
scope: This is a person having too much strong feeling, and being too easily made angry or excited, especially
  when this is shown openly. It is not the tuning of a keyboard instrument.
examples:
- His temperament showed when he shouted and cried in front of everyone.
- She was known for her temperament, losing her temper over small things in public.
