simpleMeaning: A desert bush of the US Southwest and Mexico whose thin, bare, thorny branches sprout leaves
  and red flower clusters once the rains come.
scope: This is the thorny desert shrub also called coachwhip, another name for the same plant; it is not
  a true cactus, despite its spiny look.
examples:
- The ocotillo sends out bright red flowers a few weeks after the rain.
- A row of ocotillo plants lined the road into town.
