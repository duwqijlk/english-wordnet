simpleMeaning: Several egg-shaped bits sit in a cup-shaped body, holding the tiny bits that make new growth,
  in any of many kinds of growth in the group Nidulariaceae.
scope: This cup-shaped growth holds egg-shaped bits and belongs to the group Nidulariaceae.
examples:
- The bird's-nest fungus held several egg-shaped bits in its cup.
- Each bird's-nest fungus had a cup-shaped body with egg-shaped bits inside.
