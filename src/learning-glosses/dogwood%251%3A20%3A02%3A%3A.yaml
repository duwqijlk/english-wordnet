simpleMeaning: hard, strong wood from a tree or bush of the Cornus group (a group of plants that are close
  in kind); it looks like boxwood
scope: The hard wood from this tree or bush, not the tree or bush itself.
examples:
- The handle was made from dogwood, a hard wood that lasts well.
- He chose dogwood for the tool because the wood is strong and tough.
