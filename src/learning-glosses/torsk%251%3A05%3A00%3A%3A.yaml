simpleMeaning: a large fish from northern coastal waters that people eat, a close cousin of the cod
scope: This is a large fish from northern coastal waters that people eat; cusk is another name for this
  sense. Not the cod itself and not a haddock.
examples:
- The fishermen hauled a torsk aboard and put it on ice.
- Torsk is baked like cod and served with potatoes.
