simpleMeaning: a sudden chest illness with high fever and coughing, caused by tiny germs called mycoplasma,
  that strikes children and young adults above all
scope: Also called mycoplasmal pneumonia and primary atypical pneumonia; a sudden chest illness with fever
  and coughing, not a cold and not flu.
examples:
- The child had atypical pneumonia, with a high fever and a cough that would not stop.
- Atypical pneumonia is caused by tiny germs called mycoplasma.
