simpleMeaning: A mushroom with a long stem and a yellow slimy cap, bits of its torn cover hanging from
  it; gills start white and turn dark brown as it sheds spores.
scope: A mushroom set apart by the bits of torn cover hanging from its yellow slimy cap and by gills that
  start white and turn dark brown as spores are released.
examples:
- Stropharia ambigua grows in the woods, its yellow cap slimy to the touch.
- The gills of the Stropharia ambigua turn dark brown as it sheds its spores.
