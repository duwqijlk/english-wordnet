simpleMeaning: behavior that breaks a rule, good manners, the usual way of doing things, or what people
  think is right
scope: 'Also called irregularity: behavior that breaks rules or good manners. Not a problem with the body
  that a person is born with or that appears as the body grows, and not just strangeness.'
examples:
- Cheating was an abnormality that the school would not accept.
- Lying to customers is an abnormality in business practice.
