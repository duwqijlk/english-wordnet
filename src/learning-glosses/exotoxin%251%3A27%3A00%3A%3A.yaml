simpleMeaning: A poison that tiny living things give out into the stuff around them.
scope: A poison that tiny living things give out into the stuff around them; not a poison made inside
  a body cell and not a poison from a plant.
examples:
- The bacteria released an exotoxin into the wound.
- Exotoxins can cause illness even after the germs are gone.
