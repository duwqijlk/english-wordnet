simpleMeaning: a cage for small animals, usually made of wood and wire net
scope: This is a cage for small animals; it is not a small rough shelter for a person to live in.
examples:
- She keeps her rabbits in a wooden hutch in the garden.
- He cleaned the hutch and put in fresh straw for the guinea pigs.
