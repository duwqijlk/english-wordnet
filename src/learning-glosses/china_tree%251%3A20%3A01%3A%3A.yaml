simpleMeaning: A plant from north India and east Asia, with purple flowers and small yellow fruit that
  cannot be eaten; now settled in the south of the United States, giving shade.
scope: Also called chinaberry, azedarach, azederach, chinaberry tree, Melia azedarach, Melia azederach,
  Persian lilac and pride-of-India, this is a shade plant from north India, not the tropical American
  tree whose fruit was used as soap.
examples:
- The China tree gives shade over the whole yard.
- We planted a China tree for its purple flowers.
