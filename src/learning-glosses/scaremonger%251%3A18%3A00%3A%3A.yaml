simpleMeaning: a person who tells frightening stories to many people and causes trouble
scope: This is a person who tells frightening stories to many people and causes trouble; stirrer is another
  name for this sense. Not someone who warns about a real danger.
examples:
- The scaremonger told everyone that the water was not safe to drink, but it was not true.
- People stopped listening to the scaremonger after his frightening stories proved false.
