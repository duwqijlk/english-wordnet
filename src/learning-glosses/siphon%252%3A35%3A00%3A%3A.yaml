simpleMeaning: to move a liquid from one container to another through a bent tube that lets gravity pull
  it down
scope: To move a liquid from one container to another through a bent tube; not the tube itself, and not
  simply emptying a container.
examples:
- She siphoned the water from the tank into a bucket.
- He siphoned gas into the tank before the trip.
