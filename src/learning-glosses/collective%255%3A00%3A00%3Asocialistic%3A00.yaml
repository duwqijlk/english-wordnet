simpleMeaning: Run by the workers themselves, who own what they make and make it together, most of the
  time with a government watching over them
scope: Run and owned by the workers together, not owned by one boss and not run for one person's gain.
examples:
- They worked on a collective farm.
- The collective bakery was owned by its workers.
