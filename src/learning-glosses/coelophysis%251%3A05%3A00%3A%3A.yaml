simpleMeaning: one of the oldest known kinds of meat-eating dinosaur from the late Triassic that ate others
  of its own kind
scope: This is one of the oldest known meat-eating dinosaurs from the late Triassic; not a later dinosaur
  and not a plant eater.
examples:
- Coelophysis lived in the late Triassic and ate meat, even others of its own kind.
- Fossils show that Coelophysis was one of the oldest known dinosaurs.
