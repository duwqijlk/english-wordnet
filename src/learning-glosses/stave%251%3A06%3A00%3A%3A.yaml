simpleMeaning: One of the thin flat pieces of wood that make up the sides of a barrel or bucket.
scope: One of the thin flat pieces of wood that make up the sides of a barrel or bucket, with lag as another
  name for this sense, and not the act of fitting such pieces.
examples:
- A stave had come loose from the old barrel.
- The cooper fitted each stave into place.
