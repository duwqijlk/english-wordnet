simpleMeaning: Chiefly in the west of the United States, any of several kinds of grass from many groups
  grow in tufts or clumps, not spreading into a flat mat.
scope: Also called bunch grass, a grass that grows in tufts, not a grass that spreads into a flat mat.
examples:
- Bunchgrass grew in tufts, not as one flat mat.
- The bunchgrass of the west grows in clumps, not as one flat mat.
