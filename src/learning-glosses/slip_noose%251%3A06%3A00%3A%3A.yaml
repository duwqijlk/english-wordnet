simpleMeaning: A loop in a cord or rope that pulls ever tighter as the cord or rope is drawn, made with
  a knot that slides.
scope: Also called a noose or a running noose, it is a loop made with a knot that slides, which pulls
  ever tighter as the cord or rope is drawn.
examples:
- He tied a slip noose in the rope.
- The slip noose pulled tighter as he drew the cord.
