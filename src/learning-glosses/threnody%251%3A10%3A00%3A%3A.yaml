simpleMeaning: A mourning chant, made or sung in memory of the dead.
scope: This sense is also called a lament, a dirge, and a requiem, for a mourning chant, made or sung
  in memory of the dead, where a lament is a sad song or hymn, made or sung by people to remember the
  dead.
examples:
- The threnody was sung at the memorial for the dead.
- Threnodies honour those who have died.
