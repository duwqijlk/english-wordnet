simpleMeaning: A hard, corrosion-resistant mineral that is a natural mix of osmium and iridium, often
  with small amounts of rhodium and platinum, used in needles and pen nibs.
scope: This sense is the natural osmium-iridium mineral also called iridosmine; it is not the pure metal
  osmium or iridium on its own.
examples:
- Osmiridium is hard enough to be used for fountain-pen nibs.
- Miners separated osmiridium from the heavier gravel.
