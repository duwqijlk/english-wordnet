scope: A substance got from the bark of cinchona trees, used as a drug against malaria; not quinine and
  not quinidine, the other drugs from the same bark.
examples:
- Cinchonine is a drug used against malaria.
- The chemist made cinchonine from the bark of cinchona trees.
