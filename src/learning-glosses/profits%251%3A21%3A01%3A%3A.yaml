simpleMeaning: Money left from what is taken in, after what is spent in one period is taken off, counting
  loss of value in machines and other costs with no money paid.
scope: What is left of the money taken in after what is spent in a set time, also called net, profit,
  and earnings.
examples:
- The firm's profits rose sharply this year.
- Profits were shared among the workers at Christmas.
