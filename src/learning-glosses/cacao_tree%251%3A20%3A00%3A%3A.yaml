simpleMeaning: A woody plant of tropical America that bears the seeds used to make chocolate.
scope: A woody plant of tropical America that bears chocolate seeds, also called cacao and chocolate tree;
  not a coffee plant and not a fruit tree grown for its fruit.
examples:
- The cacao tree grows in the shade of taller trees.
- Farmers pick pods from the cacao tree.
