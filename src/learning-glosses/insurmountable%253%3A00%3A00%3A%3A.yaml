senseId: 'insurmountable%3:00:00::'
synsetId: 02365671-a
simpleMeaning: too hard to get past or to deal with, so no one can do it
scope: About a problem or a thing in the way that no one can get past or beat; not just hard, but with
  no way through.
examples:
- The high wall seemed insurmountable, so they turned back.
- They faced insurmountable problems and could not finish the work.
