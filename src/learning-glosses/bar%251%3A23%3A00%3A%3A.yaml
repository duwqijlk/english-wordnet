simpleMeaning: a pressure measure worth one million dynes over each square centimetre, used chiefly in
  meteorology
scope: 'The measurement sense: a scientific pressure unit, not a physical object such as a pole, block,
  railing, or counter, and not an action.'
examples:
- The pressure inside the tank was kept at two bar.
- Forecasters often state air pressure in bar rather than in older units.
