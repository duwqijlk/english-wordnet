senseId: 'craniometry%1:09:00::'
synsetId: 06156759-n
simpleMeaning: In physical anthropology, the study and measuring of dry skulls after the soft parts have
  been taken away.
scope: This is the study of dry skulls, not the study of living people or of skeletons in general.
examples:
- She studied craniometry to learn how skulls were measured.
- Craniometry was used to compare skulls from old graves.
