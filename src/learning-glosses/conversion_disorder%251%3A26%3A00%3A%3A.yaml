senseId: 'conversion_disorder%1:26:00::'
synsetId: 14410102-n
simpleMeaning: The mind turns inner conflict into bodily trouble — a limb that will not move, or feeling
  lost from part of the body — with no clear cause.
scope: This is the mind sickness in which inner conflict becomes bodily trouble, also called conversion
  hysteria or conversion reaction, and not a sickness of the body itself.
examples:
- Her conversion disorder left one arm without feeling.
- His conversion disorder showed itself as a leg that would not move.
