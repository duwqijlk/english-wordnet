simpleMeaning: Round lumps under the ground that people eat grow on this grass-like plant of China.
scope: This grass-like plant of China grows round lumps under the ground for eating, not the Trapa plant
  with spiny four-pronged fruits.
examples:
- People in China eat the round lumps of the water chestnut.
- The round lumps of the water chestnut are eaten in China.
