simpleMeaning: a large sea fish that people eat, found in many places on the coasts of Australia, New
  Zealand and the south of Africa
scope: A large food fish from the coasts of Australia, New Zealand and southern Africa, also called barracouta;
  not a small fish, and not a fish from fresh water.
examples:
- The fishermen brought in a fine snoek from the waters off the coast.
- Snoek is a popular food fish in southern Africa.
