senseId: 'epilepsia_minor%1:26:01::'
synsetId: 14111609-n
simpleMeaning: Brief attacks cloud a person's awareness in this form of epilepsy, sometimes with other
  odd signs as well.
scope: This form of epilepsy, also called petit mal and petit mal epilepsy, brings brief attacks in which
  awareness clouds over, not the short seizures with muscle twitches of the other sense.
examples:
- Her epilepsia minor meant brief moments when she lost track of what was happening.
- The doctor said his epilepsia minor attacks lasted only a few seconds.
