simpleMeaning: A set of prayers read or sung in a Roman Catholic church before a burial mass.
scope: A service of prayers read or sung before a burial mass in the Roman Catholic Church, not the burial
  mass itself.
examples:
- The Office of the Dead was sung in the church on the evening before the burial.
- The priest read the Office of the Dead with the family gathered round.
