simpleMeaning: One of several evergreen climbing plants from Australia and nearby lands, this one bears
  big bright yellow single blooms and is grown far and wide in warm places.
scope: People also call this climbing plant guinea flower, and it is one of several kinds grown in warm
  lands for its big bright yellow blooms.
examples:
- The guinea gold vine shows yellow flowers.
- In warm lands the guinea gold vine is grown for its bright blooms.
