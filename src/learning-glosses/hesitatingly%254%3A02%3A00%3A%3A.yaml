simpleMeaning: in a slow way, stopping often because you are not sure what to do or say
scope: 'Also called hesitantly: in a slow way, stopping because you are not sure, not in a quick way with
  no doubt.'
examples:
- He walked hesitatingly toward the door, stopping twice along the way.
- She answered hesitatingly, not sure of the right words.
