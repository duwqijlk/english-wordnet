simpleMeaning: the act of taking full control of people in a cruel way and keeping them under your power
scope: Cruel control over people who are kept down by force; not kind rule and not just winning one fight.
examples:
- The subjugation of the town left people afraid to speak.
- Years of subjugation by the cruel king made life hard for farmers.
