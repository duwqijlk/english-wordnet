simpleMeaning: its flower heads carry very narrow bright purple rays; the wild aster has leaves like a
  fern and grows from Alberta to Texas and Mexico
scope: Also called a tansy leaf aster; not a garden daisy and not a tall sunflower.
examples:
- A tahoka daisy blooms along the dry roadside.
- We saw tahoka daisies from Alberta to Texas.
