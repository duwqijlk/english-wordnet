simpleMeaning: a soft coat for a man, often with a belt that ties, worn at home
scope: A soft coat for a man to wear at home, also called a lounging jacket; not a coat worn outside and
  not a formal coat.
examples:
- He put on his smoking jacket and sat by the fire.
- Her father wore a smoking jacket with a tie belt in the evening.
