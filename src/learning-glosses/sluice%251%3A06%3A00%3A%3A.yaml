simpleMeaning: A channel that carries a fast flow of water, with a gate that holds the water back or lets
  it through.
scope: A channel that carries a fast flow of water, with a gate that holds the water back or lets it through;
  not the act of pouring water through such a channel.
examples:
- The water rushed down the sluice to the mill.
- They opened the sluice to let the field drain.
