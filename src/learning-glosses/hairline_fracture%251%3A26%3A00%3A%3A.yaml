simpleMeaning: The crack is no more than a thin line, and the pieces of the broken part stay joined
scope: Also called a capillary fracture, a break whose pieces stay joined with only a thin line, not a
  clean break with the pieces apart and not a break with a wide gap.
examples:
- The doctor found a hairline fracture in her wrist after the fall.
- A hairline fracture can heal without a cast if the pieces stay in place.
