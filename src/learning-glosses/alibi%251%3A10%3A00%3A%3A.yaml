senseId: 'alibi%1:10:00::'
synsetId: 06753794-n
simpleMeaning: In law, a claim by a person charged with a crime that they were somewhere else when it
  happened, so they could not have done it
scope: In law, a claim of being elsewhere when a crime took place, not the act of clearing someone with
  such a claim.
examples:
- His alibi was that he had been at work all evening.
- The lawyer asked the witness to back up the defendant's alibi.
