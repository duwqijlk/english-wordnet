simpleMeaning: A deer of the far north, with large antlers on both males and females; called reindeer
  in Eurasia and known by this name in North America.
scope: Also called reindeer, caribou or Rangifer tarandus; a deer of the far north with large antlers
  on both males and females, called reindeer in Eurasia.
examples:
- The Greenland caribou crossed the snow, its large antlers clear to see.
- A Greenland caribou calf stayed close to its mother.
