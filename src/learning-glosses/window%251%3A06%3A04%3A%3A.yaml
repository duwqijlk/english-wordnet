simpleMeaning: A flat piece of glass that fills an opening in a frame.
scope: The glass itself, not the wooden or metal frame around it and not a transparent opening in a vehicle.
examples:
- A stray ball broke the window, sending glass across the kitchen floor.
- A crack spread across the window after the hard frost.
