simpleMeaning: any of several kinds of plant with long thin leaves that grow high and do well where there
  is much water
scope: This is a kind of grass that grows high and does well in wet ground; tallgrass is another name
  for this sense. Not short grass and not grass that grows in dry ground.
examples:
- Tall-grass grows thick along the river bank.
- The field was full of tall-grass after the wet spring.
