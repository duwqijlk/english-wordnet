simpleMeaning: To put a small mark on something so it can be picked out easily.
scope: Deliberately marking something so it can be recognised; not merely leaving a mark on a surface,
  not damaging it with a flaw, and not becoming marked.
examples:
- The surveyor spotted the trees that were to be felled.
- We spotted the boundary stones with white paint.
