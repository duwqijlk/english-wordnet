simpleMeaning: A set of signs used by deaf people, in which each letter is shown by how the hand is held.
scope: A set of signs used by deaf people, in which each letter is shown by how the hand is held; also
  called manual alphabet, not spoken words and not a set of signs for whole words.
examples:
- She spelled her name with the finger alphabet.
- The finger alphabet lets deaf people spell out words by hand.
