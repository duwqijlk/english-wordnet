simpleMeaning: about or linked to the idea that a country should take and keep power over other countries
  and their land
scope: Also called imperialistic. This describes plans, actions or ideas linked to taking power over other
  lands, not a person who believes in doing this.
examples:
- The country followed imperialist plans to take power over weaker lands.
- She wrote a book about imperialist wars in the last century.
