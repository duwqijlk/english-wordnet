simpleMeaning: When people share the cost of something, each one pays the same part of it.
scope: Each person pays the same share of a cost; not one person paying for all, and not paying different
  shares.
examples:
- My boyfriend and I always go Dutch when we eat out.
- We went Dutch at the cinema, each of us paying for our own ticket.
