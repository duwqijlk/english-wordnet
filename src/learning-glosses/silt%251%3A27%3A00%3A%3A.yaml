simpleMeaning: mud or clay or small rocks left behind by a river or lake
scope: Mud, clay or small rocks left by a river or lake; not the river or lake itself.
examples:
- Silt built up at the bottom of the lake.
- The river left a thick layer of silt on the bank after the flood.
