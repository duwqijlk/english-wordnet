senseId: 'congenator%1:05:00::'
synsetId: 01330943-n
simpleMeaning: an animal or plant that is kin to another living thing, because they share a line of birth
  or are in the same group of living things
scope: This is an animal or plant kin to another through shared birth or shared group; congener, congeneric
  and relative are other names for this sense, and it is not a chemical in wine or liquor.
examples:
- The congenator shares a common ancestor with the other plant.
- Botanists found a congenator of the rare flower growing nearby.
