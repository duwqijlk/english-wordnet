simpleMeaning: to write into a deal, in clear words, what one side must do or give
scope: To set a clear demand in a written deal, also called condition and qualify; not just to say what
  you mean in plain words, and not to pick one thing for a job.
examples:
- The contract specifies the dates of the payments.
- The will specifies that she can live in the house for the rest of her life.
