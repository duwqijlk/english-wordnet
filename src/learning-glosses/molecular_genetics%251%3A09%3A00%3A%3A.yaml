simpleMeaning: The study of how the stuff that passes traits to young is built and how it works, at the
  smallest level
scope: The study of how the stuff that passes traits to young is built and works at the smallest level,
  not the study of whole living things and not the study of family trees.
examples:
- He took a course in molecular genetics at the university.
- Molecular genetics looks at how traits pass from parent to child.
