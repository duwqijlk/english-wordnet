simpleMeaning: A solitaire game where seven piles start face up; you build down in alternating colors,
  put aces above, and aim for ace-to-king runs, dealing the rest one at a time.
scope: This is the solitaire card game, not the Klondike region or river in Canada and not another one-player
  game such as spider.
examples:
- She plays Klondike on her phone during the morning commute.
- Klondike is easier to learn than most other solitaire games.
