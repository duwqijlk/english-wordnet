senseId: 'epiglottitis%1:26:00::'
synsetId: 14368957-n
simpleMeaning: A sore, swollen flap at the back of the throat that covers the windpipe, with fever, a
  very bad sore throat and trouble swallowing.
scope: This is a swelling of the flap over the windpipe, not a swelling of the voice box and not sore
  tonsils.
examples:
- Epiglottitis made it hard for the child to swallow.
- The doctor treated her epiglottitis at once.
