simpleMeaning: Berries somewhat shaped like a fruit round at the bottom and narrow at the top grow on
  an upright American thorn bush, almost without thorns.
scope: Blackthorn and pear haw are other names for this upright American thorn bush, almost without thorns.
examples:
- The pear hawthorn bears berries somewhat shaped like a fruit round at the bottom.
- A pear hawthorn is an upright American thorn bush.
