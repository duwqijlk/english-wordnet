simpleMeaning: To have sweat or blood on the face, leaving it wet
scope: Also called fume; to have sweat or blood on the face, leaving it wet, not giving off smoke and
  not smelling bad.
examples:
- After the run, his face reeked with sweat.
- The wounded man's face reeked with sweat and blood.
