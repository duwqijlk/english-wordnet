simpleMeaning: Made by adding the lightest gas to an older germ-killing drug, this germ-killing drug is
  used against tuberculosis, tularemia and germs that do not take the Gram stain.
scope: It is a germ-killing drug made from an older germ-killing drug by adding the lightest gas, and
  is used against tuberculosis, tularemia and germs that do not take the Gram stain; it is not the older
  drug itself, but a changed form of it.
examples:
- She was given dihydrostreptomycin against tuberculosis.
- Dihydrostreptomycin was used against tularemia and germs that do not take the Gram stain.
