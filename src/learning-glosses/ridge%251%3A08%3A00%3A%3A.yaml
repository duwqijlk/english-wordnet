simpleMeaning: A raised line running along a bone, a tooth, or a thin sheet of body tissue.
scope: A long raised edge on a bone or tooth, not the beam at the top of a roof and not a long raised
  line of high ground.
examples:
- A ridge runs along the top of the skull bone.
- The ridge on the tooth showed clearly in the X-ray.
