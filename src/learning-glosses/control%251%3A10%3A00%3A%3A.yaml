simpleMeaning: a policy about the economy that sets limits on prices, wages, or similar things.
scope: This is not a switch or lever on a machine, not a spirit helper at a sitting, and not the general
  act of managing something; it is a policy that limits prices, wages, or other economic matters.
examples:
- The government introduced price controls to keep food affordable.
- After the war, wage controls were gradually lifted.
