simpleMeaning: With two pairs of hooks at the sides of its mouth, this long thin jointed animal lives
  off mammals, feeding inside their noses.
scope: People also call it pentastomid, a long thin jointed animal with two pairs of hooks at the sides
  of its mouth that lives off mammals, not a true worm.
examples:
- Tongue worms live inside the noses of mammals.
- The tongue worm has two pairs of hooks at the sides of its mouth.
