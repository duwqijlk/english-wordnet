schema: oewn-learning-gloss-v2
senseId: 'containment%1:09:00::'
synsetId: 05995833-n
simpleMeaning: A plan by a country to join planned agreements with other countries, to stop an unfriendly
  power or idea spreading, or to make it talk to reach peace
scope: This is a country's plan with other countries to stop an unfriendly power from growing, not a safety
  system in a power plant and not the general act of keeping something from spreading.
examples:
- The government's policy of containment aimed to stop the other power from spreading its ideas.
- Containment was a key part of the country's plan after the war.
