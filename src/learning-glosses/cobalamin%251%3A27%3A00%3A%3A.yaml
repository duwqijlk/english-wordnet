simpleMeaning: a vitamin of the B group used to treat pernicious anemia, a blood illness in which the
  body lacks red blood cells
scope: This is a vitamin of the B group used to treat a blood illness; antipernicious anemia factor and
  cyanocobalamin are other names for this sense, not a vitamin taken for general health.
examples:
- The doctor gave her cobalamin shots for her anemia.
- He takes cobalamin each week to treat his pernicious anemia.
