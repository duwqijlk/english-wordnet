simpleMeaning: a person who believes that living things hold a special life force that mere matter cannot
  explain
scope: A person who holds that living things have a special life force, not a biologist who studies life
  in purely physical terms.
examples:
- The vitalist argued that a spark of life sets living things apart.
- As a vitalist, she held that life could not be reduced to chemistry.
