simpleMeaning: someone a firm pays to look after its papers and keep each one in its right place
scope: 'Also called a file clerk and a filing clerk: an office worker who keeps a firm''s papers in order,
  not a person who types letters and not a person who answers the phone.'
examples:
- The filer put the new letters in the right drawer.
- Ask the filer where the old contracts are kept.
