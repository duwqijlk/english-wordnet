simpleMeaning: Used as food for animals or ground into meal for feed, this sweet seed case is twisted
  round in a curl and comes from the tree it grows on.
scope: This is the sweet pod itself, not the bush or tree it grows on.
examples:
- The screw bean pods were fed to animals.
- The screw bean was ground into meal for feed.
