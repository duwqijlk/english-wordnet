simpleMeaning: 'It cannot be cut into smaller bits that mean something: it is the smallest bit of language
  that still means something on its own'
scope: The smallest bit of language that means something, not a whole word and not a letter with no meaning
  of its own.
examples:
- The morpheme 'un-' in 'unhappy' means 'not'.
- Each morpheme in the word carries its own bit of meaning.
