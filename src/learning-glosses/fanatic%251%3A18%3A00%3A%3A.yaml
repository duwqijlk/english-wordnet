senseId: 'fanatic%1:18:00::'
synsetId: 10097659-n
simpleMeaning: a person who acts because of a very strong feeling for something, as for a cause, that
  is not based on reason
scope: 'Also called fiend: this word names a person, not the describing word for showing too much strong
  feeling for and loyalty to a cause or idea.'
examples:
- He became a fanatic who would not listen to anyone who disagreed with his cause.
- A fanatic gave all his time and money to the cause he loved.
