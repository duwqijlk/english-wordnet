simpleMeaning: Tiny living things that do no harm, such as the germ Escherichia coli, live in the gut
  and help it work as it should
scope: The tiny living things in the gut that help it work, not the germs that make people sick.
examples:
- The intestinal flora in her gut help her break down food.
- Doctors say a healthy intestinal flora keeps the gut working well.
