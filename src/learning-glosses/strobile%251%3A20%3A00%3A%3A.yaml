simpleMeaning: Seeds, or the tiny bits that grow into new plants, sit in a tight mass of thin parts that
  overlap, shaped like a pointed cone.
scope: Cone and strobilus are other names for this tight mass of thin, overlapping parts that holds seeds.
examples:
- A strobile held its seeds tight in its thin, overlapping parts.
- The strobile held the tiny bits that grow into new plants in its thin parts.
