simpleMeaning: A woody herb of the Old World, often grown by people, with big blooms from pink to a deep
  rose colour.
scope: 'Also called periwinkle, cayenne jasmine, old maid or rose periwinkle: a woody Old World herb with
  big pink to deep rose blooms, not the small sea snail of the same name.'
examples:
- The red periwinkle bloomed pink in the garden bed.
- Red periwinkle grew along the old wall.
