simpleMeaning: In law, a claim kept back when a thing once held was given up, to take it back later
scope: In law, a claim to take back a thing once held, not a claim to buy a thing and not a claim to keep
  a thing one never gave up.
examples:
- The right of re-entry let her take back the land she had sold.
- Under the right of re-entry, the old owner could claim the house again.
