simpleMeaning: a climbing or ground-hugging plant from tropical America, with soft stems that live for
  years and a huge starchy root; some say the sweet potato came from it
scope: 'Also called man-of-the-earth, scammonyroot, wild potato vine, and wild sweet potato vine: a low
  plant with a huge starchy root, not the sweet potato itself.'
examples:
- The manroot climbs the fence behind the house.
- They dug up a manroot and found a root as big as a pumpkin.
