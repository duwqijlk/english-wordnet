simpleMeaning: a cry that shows deep sadness and grief
scope: 'This sense is also called wail, lament, and plaint: one cry of deep sadness. It is not the act
  or way of showing grief over time.'
examples:
- A lamentation rose from the crowd when they heard the sad news.
- Her lamentations could be heard all through the house after her son died.
