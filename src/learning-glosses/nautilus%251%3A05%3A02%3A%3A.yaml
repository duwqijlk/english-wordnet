simpleMeaning: Its females have a thin shell in a spiral shape, like paper, that breaks easily; it is
  a cephalopod mollusk (a sea animal with a soft body) from warm seas
scope: 'Also called argonaut and paper nautilus: this warm-sea animal whose females have thin, paper-like
  shells, not the other nautilus, which has a hard shell with pale pearly parts inside.'
examples:
- A female nautilus carried its thin, paper-like shell through the warm sea.
- We saw a nautilus floating near the surface, its spiral shell light and thin.
