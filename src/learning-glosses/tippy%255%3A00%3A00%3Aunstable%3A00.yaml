simpleMeaning: 'used of boats: likely to lean over easily when under sail'
scope: Used of a boat that leans over easily under sail, also called tender, crank, and cranky; not used
  of a person or of a thing on land that falls over.
examples:
- The small boat felt tippy as soon as the sails went up.
- They chose a wider boat because the old one was too tippy under sail.
