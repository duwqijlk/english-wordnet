simpleMeaning: The main bank of those countries in Europe that use the same money.
scope: The bank for the countries of Europe that use the same money, not the bank of any one country.
examples:
- The European Central Bank looks after the money of the countries that share one currency.
- News from the European Central Bank moved the markets today.
