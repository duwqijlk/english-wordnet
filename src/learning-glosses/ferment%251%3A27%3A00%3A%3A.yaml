simpleMeaning: A thing that can start a change in which one substance breaks down into simpler ones
scope: A thing that starts the change, not the change itself and not the act of causing it.
examples:
- Yeast is a ferment that makes the dough rise.
- The brewer added a ferment to the mixture to start the change.
