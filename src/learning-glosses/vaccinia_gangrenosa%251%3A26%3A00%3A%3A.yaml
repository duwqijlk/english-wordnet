senseId: 'vaccinia_gangrenosa%1:26:00::'
synsetId: 14113201-n
simpleMeaning: A grave or even deadly kind of vaccinia, found chiefly in people whose immune system is
  weak, shown by the opening sore that keeps growing.
scope: This sense is also called progressive vaccinia, for a grave form of vaccinia that can kill, mostly
  in people with a weak immune system, shown by the first sore growing steadily bigger.
examples:
- Vaccinia gangrenosa can be fatal.
- Vaccinia gangrenosa spreads the first sore.
