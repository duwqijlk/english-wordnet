simpleMeaning: strength of mind that lets a person go through hard times with courage
scope: This is strength of mind that lasts through hard times, not strength of the body and not one short
  brave act.
examples:
- She showed great fortitude during the long months after the accident.
- It took fortitude to keep working after so many losses.
