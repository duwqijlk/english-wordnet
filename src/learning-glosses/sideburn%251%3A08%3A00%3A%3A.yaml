simpleMeaning: hair that grows down the side of a man's face in front of his ears, above all when the
  rest of his beard is shaved off
scope: Hair down the side of a man's face, not a full beard and not a moustache.
examples:
- His sideburn reached down to his jaw.
- The actor grew a sideburn for the role.
