simpleMeaning: Sending out waves of electric and magnetic energy on purpose, or bouncing them back, to
  stop an enemy from using electronic devices or systems
scope: Sending out energy to stop enemy devices, also called jam and electronic jamming, not playing music
  together and not a block in a road or machine.
examples:
- The army used jamming to stop enemy radios from working.
- Jamming blocked the enemy radar during the attack.
