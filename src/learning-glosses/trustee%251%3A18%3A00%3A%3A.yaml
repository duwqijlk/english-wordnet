senseId: 'trustee%1:18:00::'
synsetId: 10751971-n
simpleMeaning: a person or organization made owner in law of money, land, or other property, to use it
  only for the good of another person
scope: This is a person or organization made owner in law of property for someone else; it is not the
  person who may use that property for his own good, and it is not just any trusted helper.
examples:
- The trustee held the money for the child until she turned 18.
- A bank acted as trustee for the family's land.
