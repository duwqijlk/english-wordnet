simpleMeaning: a tool with a large head, usually of wood, shaped like a hammer and used to pound in wedges,
  settle paving stones, or crush, flatten and smooth things.
scope: The large-headed wooden hammer tool, also called a mallet, not the insect with hard wing covers.
examples:
- He drove the wedge into the log with a beetle.
- Workers settled the paving stones using a beetle.
