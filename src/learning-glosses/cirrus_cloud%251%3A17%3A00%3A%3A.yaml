simpleMeaning: a thin white wisp high in the sky, most often made of fine ice bits, 4 to 8 miles up
scope: A thin white wisp high in the sky, most often made of fine ice bits; cirrus is another name for
  this sense, and it is not a low dark rain cloud or a puffy white cloud.
examples:
- A cirrus cloud drifted high above the mountains.
- We saw a thin cirrus cloud against the blue sky.
