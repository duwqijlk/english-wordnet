simpleMeaning: to move something about with your hands, or to turn an idea over in your mind and picture
  it
scope: 'Also called play, toy, and fiddle: moving a thing about with your hands or thinking over an idea.
  It is not cheating someone or taking their money in an unfair way.'
examples:
- She diddled with the ring on her finger while she listened.
- He diddled with the idea of moving to the country.
