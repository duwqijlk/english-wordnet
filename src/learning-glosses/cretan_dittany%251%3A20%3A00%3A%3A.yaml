simpleMeaning: A bush from Crete that stays small and gives off a sweet smell
scope: A small sweet-smelling bush from Crete, also called crete dittany, dittany of crete and hop marjoram;
  not a tall bush and not a plant from another place.
examples:
- Cretan dittany grew in a pot on the sunny wall.
- She picked cretan dittany for its sweet smell.
