simpleMeaning: One person belonging to the native people of South America who live in Brazil and Paraguay.
scope: One person belonging to the native people of South America who live in Brazil and Paraguay, not
  the language of that people and not a member of another South American people.
examples:
- The Tupi lived along the rivers of Brazil.
- A Tupi elder told the old stories.
