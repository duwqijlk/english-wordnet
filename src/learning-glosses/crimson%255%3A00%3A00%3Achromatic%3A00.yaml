simpleMeaning: A red at one end of the rainbow, next to orange, like the colour of blood or cherries or
  tomatoes or rubies
scope: 'Also called red and scarlet: a red, not a pale pink and not the red face of a person who is angry
  or has worked hard.'
examples:
- She wore a crimson dress to the party.
- The crimson leaves covered the hill in autumn.
