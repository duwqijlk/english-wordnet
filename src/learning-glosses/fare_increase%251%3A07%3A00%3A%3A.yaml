simpleMeaning: When you ride on a bus, train, or other shared way of getting about, this is the rise in
  the money you must pay
scope: A rise in what riders pay for public transport, not a rise in the price of a ticket for a show
  and not a pay rise for workers.
examples:
- The fare increase meant her bus pass cost five pounds more.
- Commuters protested the fare increase on the morning train.
