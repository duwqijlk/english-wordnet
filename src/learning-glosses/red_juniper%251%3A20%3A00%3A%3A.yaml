simpleMeaning: a low-growing juniper of the land east of the Rocky Mountains, with a pointed cone-like
  top, brown bark that comes off in shreds, and short sharp needles
scope: Also called eastern red cedar and red cedar; a small juniper of the land east of the Rocky Mountains,
  not the tall Pacific-coast tree of the same name.
examples:
- A red juniper grows at the edge of the field east of the Rockies.
- The red juniper's bark peels off in shreds.
