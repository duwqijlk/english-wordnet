simpleMeaning: Toothed wheels that work as a set are kept sealed inside this closed metal box
scope: A closed metal box for a set of toothed wheels, also called a gear box or gearbox, not the stick
  used to change the wheels and not a box for tools.
examples:
- The mechanic opened the gear case to look at the wheels inside.
- Oil leaked from the gear case of the old truck.
