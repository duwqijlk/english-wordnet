simpleMeaning: a sore lump under the skin of a tame animal, caused by the young of a botfly, a fly whose
  young grow under the skin, or of another fly
scope: A sore lump under a tame animal's skin caused by fly young, not the singing of a bird and not a
  swelling from a bite.
examples:
- The vet found a warble under the cow's hide.
- A warble forms when fly larvae grow under the skin.
