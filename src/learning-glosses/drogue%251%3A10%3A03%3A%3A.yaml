simpleMeaning: A funnel-shaped tool towed as a mark by a plane.
scope: A funnel-shaped tool towed as a mark by a plane; not a hold of a canvas-covered frame floating
  behind a ship, stopping drift or holding the head into the wind, nor a cut cloth cone on a mast, used
  at airfields to show the wind's way, nor a chute used to slow a thing that is moving fast.
examples:
- Their drogue flew at dawn.
- The drogue was towed at noon.
