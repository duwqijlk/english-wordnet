senseId: 'tidal_bore%1:11:00::'
synsetId: 07418520-n
simpleMeaning: The tide rushing in can raise a high, often dangerous wave where sea flows run into each
  other or in a narrow river mouth.
scope: This high wave, also called a bore, an eager, an aegir, and an eagre, is raised by the tide, often
  dangerous, where sea flows meet or in a narrow river mouth.
examples:
- The tidal bore rose high where the river narrows to the sea.
- A tidal bore can be dangerous when sea flows run into each other.
