schema: oewn-learning-gloss-v2
senseId: 'proportional_sample%1:09:00::'
synsetId: 06036477-n
simpleMeaning: a way of picking a few to study, where the whole group is first split into parts and a
  few are picked at random from each part
scope: 'Also called a representative sample or a stratified sample: picking a few at random from each
  part of a group, not picking a few at random from the whole group with no split and not picking a few
  by hand.'
examples:
- For the survey they used a proportional sample, taking people at random from each age group.
- A proportional sample makes sure each part of the town is in the study.
