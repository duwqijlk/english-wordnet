simpleMeaning: a written ask, made in a formal way, for something from a person in power
scope: 'Also called a request: a formal written ask to a person in power, not a prayer to God and not
  the act of writing one.'
examples:
- They signed a petition asking the town to keep the library open.
- She sent a petition to the mayor for a new bus stop.
