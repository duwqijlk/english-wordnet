simpleMeaning: a drug that makes parts of the body and the tubes inside it pull tighter
scope: This is the drug itself, not the word for describing a drug or other thing that makes soft body
  parts pull tighter.
examples:
- The doctor put an astringent on the cut to help stop the bleeding.
- This astringent is used on the skin to make it tighter.
