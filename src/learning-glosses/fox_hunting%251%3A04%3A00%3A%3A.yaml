simpleMeaning: people on horseback riding after dogs that chase a wild animal with a red coat and a bushy
  tail
scope: 'Also called foxhunt: a hunt done by people on horseback following dogs, not a hunt done on foot
  and not a horse race.'
examples:
- Fox hunting was held every Saturday in the village.
- He went fox hunting with his neighbours at dawn.
