simpleMeaning: to change a thing so it becomes hard like stone
scope: To change a thing so it becomes hard like stone; fossilize is another name for this sense, not
  to bury something and not to study old remains.
examples:
- The little animals fossilised in the mud and are now in the limestone.
- Heat and pressure fossilise wood over millions of years.
