simpleMeaning: a deep sleep from which a person cannot wake, that can come when disease of the liver is
  very bad
scope: A deep sleep a person cannot wake from, that can come with very bad liver disease, not a sleep
  from a head wound and not ordinary sleep.
examples:
- The doctors said hepatic coma can follow when the liver fails badly.
- She slipped into hepatic coma after weeks of severe liver disease.
