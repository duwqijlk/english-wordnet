simpleMeaning: a plug that closes the hole in a barrel used for holding liquid
scope: Also called tap, this is a plug that closes a barrel hole, not the device that controls how liquid
  flows out.
examples:
- He pulled the spigot out of the barrel so the drink could flow.
- The spigot kept the wine inside the big wooden barrel.
