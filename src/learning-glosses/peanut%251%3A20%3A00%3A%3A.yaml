simpleMeaning: A widely farmed New World plant grown in tropical and warm regions; its showy yellow flowers
  sit on stalks that bend to the ground, where pods ripen underground.
scope: This is the plant that grows the pods, another name for peanut vine, not the edible nut or the
  pod itself, and not the adjective meaning unimportant.
examples:
- Farmers in the warm South rotate peanut with cotton to keep the soil healthy.
- The peanut flowers are yellow and sit above the leaves on tall stalks.
