simpleMeaning: in the order of letters, starting with A, then B, then C, and so on
scope: This says how a list is put in order, by first letters from A to Z; not in the order of time or
  of size.
examples:
- The names in the book are listed alphabetically, from Adams to Young.
- Please put the cards alphabetically by the first letter of each word.
