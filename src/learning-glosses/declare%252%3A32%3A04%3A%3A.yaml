simpleMeaning: to say officially that a person or thing is something or is in a certain state
scope: This is saying in a formal way that someone is a certain thing. It is not just telling news in
  public, not saying what you support, and not naming goods to an officer at a border.
examples:
- The court declared him innocent of the crime.
- The doctors declared her well enough to go home.
