senseId: 'number%2:30:00::'
synsetId: 00236768-v
simpleMeaning: to set a limit on how many people or things are allowed.
scope: 'This is an old, mostly archaic verb: it means fixing a maximum, not counting or labelling. It
  survives in the fixed phrase ''one''s days are numbered''. It is not the everyday sense of counting
  things or giving them numbers.'
examples:
- Her days were numbered, and she knew it.
- Under the old rules the guild's apprentices were numbered at forty.
