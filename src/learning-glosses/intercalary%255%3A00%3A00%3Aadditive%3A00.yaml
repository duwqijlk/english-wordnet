simpleMeaning: The year on the calendar gains a day or a month, so it matches the year of the sun
scope: A year with a day or a month added in to match the sun's year; not a year of the usual length and
  not a month added for another reason.
examples:
- A leap year is an intercalary year, with one more day in February.
- The intercalary month kept the old calendar in line with the seasons.
