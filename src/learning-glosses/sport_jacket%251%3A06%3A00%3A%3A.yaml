simpleMeaning: a light top with buttons down one side, often striped in the colours of a club or school
scope: 'Also called blazer, sport coat, sports coat and sports jacket: a light top with buttons down one
  side, not a heavy top and not a top worn with matching trousers.'
examples:
- She bought a sport jacket in the colours of her rowing club.
- The sport jacket was light enough for a warm day.
