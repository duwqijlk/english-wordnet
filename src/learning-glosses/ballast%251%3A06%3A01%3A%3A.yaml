simpleMeaning: A device that starts fluorescent and discharge lamps, which make light when electricity
  passes through gas, and keeps them working at the right level
scope: Also called light ballast, this is a device that starts lamps and keeps them working at the right
  level, not the stone bed under streets or railway lines, not the quality that keeps a person steady,
  and not a part put into a circuit to make up for changes.
examples:
- The ballast in the ceiling light failed, so the tube would not start.
- He replaced the old ballast to stop the lamp from flashing on and off.
