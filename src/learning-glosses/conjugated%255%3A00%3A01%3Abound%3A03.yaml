simpleMeaning: Said of an organic compound, one made of carbon, having two or more double bonds with a
  single bond between each pair.
scope: Also called conjugate, said of an organic compound with double bonds set apart by single bonds.
examples:
- The compound was conjugated, with double bonds set apart by single ones.
- The fats were conjugated, with double bonds set apart by single bonds.
