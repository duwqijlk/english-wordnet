simpleMeaning: The set of dials and switches set into the front of a car or plane, where the driver or
  pilot can see and use them.
scope: Also called a dashboard, this is the set of dials and switches at the front of a car or plane,
  not the sheet of tissue that binds muscles and organs together.
examples:
- The fascia in the car held the speed dial and the radio controls.
- The pilot checked the fascia before taking off.
