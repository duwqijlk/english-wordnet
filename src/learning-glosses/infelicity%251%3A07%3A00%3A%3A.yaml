simpleMeaning: A way of saying or doing things that is not fitting and not pleasing, above all in the
  words a person uses.
scope: A way of saying or doing things that is not fitting and not pleasing, not a rude insult and not
  a slip of the tongue.
examples:
- The infelicity of his remark made the room go quiet.
- Her letter was full of infelicity.
