simpleMeaning: In microeconomic theory, a line on a graph that joins sets of goods a buyer likes equally
  well.
scope: A line that joins bundles of goods a buyer values the same; not a line that shows how much buyers
  want at each price, and not a line that shows how much sellers offer.
examples:
- Each indifference curve on the chart joins bundles the shopper likes equally.
- A higher indifference curve means the buyer is better off.
