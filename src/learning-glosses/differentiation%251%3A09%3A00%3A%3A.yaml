simpleMeaning: the act of telling things apart, based on the ways each one is not the same as the others
scope: 'Another name for this sense is distinction: the act of telling things apart. It is not the maths
  way of working out how a value changes, and not the way a body part changes in biology to do one job.'
examples:
- Clear differentiation between the two sounds helps children learn to read.
- The teacher's differentiation of fact from story made the lesson easy to follow.
