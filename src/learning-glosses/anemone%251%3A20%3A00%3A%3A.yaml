simpleMeaning: A plant that grows in woods, grown for its beautiful flowers and for leaves in rings, each
  leaf cut into many parts
scope: 'Also called windflower: a plant that grows in woods and is grown for its beautiful flowers, not
  the sea animal of the same name that looks like a flower.'
examples:
- White anemones grew under the trees in the wood.
- She planted anemones for their pretty spring flowers.
