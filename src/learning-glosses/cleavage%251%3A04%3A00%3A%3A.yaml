simpleMeaning: The act of cutting or forcing a thing apart into two or more parts
scope: The act of splitting a thing apart, not the splitting of a cell in growth and not the groove between
  two parts.
examples:
- The cleavage of the log took one hard blow of the axe.
- Cleavage of the rock along its lines made the quarry work easy.
