simpleMeaning: power you can use, made when charge runs through a wire or other thing that lets it pass
scope: Power from charge moving through a wire, not the still or moving bits of charge themselves, which
  are a different sense of the word.
examples:
- They built a car that runs on electricity.
- The electricity went out around midnight and the house went dark.
