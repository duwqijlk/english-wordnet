simpleMeaning: In numbers, a set of values of a thing that can change, shown with how often each one turns
  up in real life or in theory.
scope: In numbers, this is how often each value of a changing thing turns up, not the moving and selling
  of goods, not the way things are spread over a place, and not the plain act of giving things out.
examples:
- The distribution of marks showed most pupils scored near the middle.
- He studied the distribution of ages in the town.
