simpleMeaning: so dull and the same all the time that it tires you; nothing new or different happens
scope: Dull because it never changes and has no variety, not a voice that stays at one pitch.
examples:
- Nothing is so monotonous as the sea on a grey day.
- The monotonous work never changed from day to day.
