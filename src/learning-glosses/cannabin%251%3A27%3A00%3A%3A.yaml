scope: 'Also called cannabis resin: a sticky stuff from hemp, thought to be the drug in marijuana, not
  the plant itself and not hashish.'
examples:
- Cannabin was once thought to be the active part of marijuana.
- Chemists studied cannabin to find what makes the plant act as a drug.
