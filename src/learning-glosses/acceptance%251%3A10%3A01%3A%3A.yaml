simpleMeaning: In contract law, words that say yes to the terms of an offer, so a deal is made
scope: In contract law, words saying yes to an offer's terms so a deal is made, not warm approval and
  not a readiness to put up with people.
examples:
- Her letter of acceptance sealed the contract.
- The acceptance came by post the next morning.
