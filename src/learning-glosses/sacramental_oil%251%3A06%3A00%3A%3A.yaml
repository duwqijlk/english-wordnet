simpleMeaning: a holy cream blessed for church use, made by mixing a smooth liquid with balsam, a sweet-smelling
  tree sap
scope: 'Also called chrism, chrisom or holy oil: a holy cream blessed for use in church, not an ordinary
  skin cream and not oil used for cooking.'
examples:
- The priest anointed the child with sacramental oil during the baptism.
- A small bottle of sacramental oil stood on the altar.
