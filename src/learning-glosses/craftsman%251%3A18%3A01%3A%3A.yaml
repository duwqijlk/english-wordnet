simpleMeaning: a man who makes things by hand and is very good at this work
scope: A man who makes things by hand with great skill, not a man who only plans the work or sells what
  others make.
examples:
- The craftsman shaped the chair legs by hand with great care.
- As a craftsman, he was known for fine metal work made by hand.
