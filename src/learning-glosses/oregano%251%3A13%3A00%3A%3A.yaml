simpleMeaning: Leaves with a strong taste that people add to meat, chicken and other birds, stews, soups
  and omelets to give them more taste
scope: 'Also called marjoram: these leaves used to add taste to food, not the living oregano plant that
  the leaves come from.'
examples:
- Add dried oregano to the soup for more taste.
- She put oregano on the chicken before cooking it.
