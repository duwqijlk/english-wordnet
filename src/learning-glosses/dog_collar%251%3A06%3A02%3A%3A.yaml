simpleMeaning: a band that fits tight round a woman's neck
scope: A band that fits tight round a woman's neck, also called a collar, a choker and a neckband; not
  the stiff white band of the clergy and not a loose chain.
examples:
- She wore a dog collar of pearls.
- The dog collar sat tight against her throat.
