simpleMeaning: to concern or relate to a particular situation, case, or person.
scope: This is not to put something onto a surface or to ask formally for a job; it means that a rule,
  remark, or idea concerns a particular case.
examples:
- The discount applies only to full-price items.
- That rule does not apply to children under five.
