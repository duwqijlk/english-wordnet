simpleMeaning: To do with the smallest sounds that change sense in one language (a phoneme is such a sound).
scope: This is about the smallest sounds that change sense in one language, not the study of those sounds,
  and not sounds that do not change sense.
examples:
- The class did a phonemic study of the sounds.
- The phonemic chart showed the sounds of the language.
