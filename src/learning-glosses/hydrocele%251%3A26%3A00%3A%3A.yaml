simpleMeaning: A disorder in which clear fluid builds up in a sac in the body, especially in the bag of
  skin holding the male sex glands
scope: This is a disorder in which clear fluid builds up in a sac in the body, especially in the bag holding
  the male sex glands, not a swelling caused by a blow and not a growth of tissue.
examples:
- The hydrocele made the sac swell with fluid.
- Doctors drained the hydrocele to ease the pain.
