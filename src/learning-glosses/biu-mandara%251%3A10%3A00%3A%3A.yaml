simpleMeaning: A set of related tongues of the Chad family, spoken where Cameroon meets Nigeria, south
  of Lake Chad
scope: A set of related tongues of the Chad family from the Cameroon-Nigeria border south of Lake Chad;
  not a single tongue and not a tongue of north Africa.
examples:
- Biu-Mandara languages are spoken south of Lake Chad.
- People on the Cameroon-Nigeria border speak Biu-Mandara tongues.
