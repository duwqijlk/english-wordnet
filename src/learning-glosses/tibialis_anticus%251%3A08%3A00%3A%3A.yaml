simpleMeaning: a band of flesh on the front of the lower leg that runs from the shin bone to the big toe
  bone and small wedge bones of the foot
scope: 'Also called tibialis anterior: a band of flesh on the front of the lower leg that runs from the
  shin bone to the foot; not a muscle at the back of the leg and not a bone.'
examples:
- The tibialis anticus helps lift the front of the foot.
- He strained his tibialis anticus while running uphill.
