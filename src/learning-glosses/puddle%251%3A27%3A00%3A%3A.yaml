simpleMeaning: a mix of wet clay and sand used to line a pond, which does not let water through when dry
scope: This is the wet clay and sand mix used to line a pond, not playing in a liquid, not working wet
  concrete or mud, and not dipping plants in mud.
examples:
- The workers spread puddle along the bottom of the pond to keep the water in.
- This puddle, made of wet clay and sand, dried into a hard lining for the pond.
