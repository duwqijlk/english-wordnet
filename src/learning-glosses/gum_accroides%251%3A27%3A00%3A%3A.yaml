simpleMeaning: A resin from Australian trees that melts in alcohol, used in varnishes and in making paper
scope: This is a resin from Australian trees that melts in alcohol; acaroid resin, accaroid resin, accroides,
  accroides gum and accroides resin are other names for this sense, not a resin that melts in water and
  not a gum from other trees.
examples:
- Gum accroides was used to make the varnish shine.
- The paper maker added gum accroides to the mix.
