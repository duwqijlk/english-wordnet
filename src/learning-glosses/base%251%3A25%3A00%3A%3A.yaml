simpleMeaning: the bottom side of a geometric shape, from which a line for its height can be drawn.
scope: This is not the lowest part of a solid object or a chemical; it is the side of a flat shape used
  to measure height.
examples:
- The triangle has a base of six centimetres and a height of four.
- Draw a line from the top corner straight down to the base.
