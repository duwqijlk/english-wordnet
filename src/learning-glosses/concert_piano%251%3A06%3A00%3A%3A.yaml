simpleMeaning: a large musical instrument with keys, built to be played at public shows
scope: 'Also called concert grand: a large musical instrument with keys, built to be played at public
  shows, not an upright piano for home use and not a keyboard that makes its sound by wire.'
examples:
- He tuned the concert piano before the show.
- The concert piano stood at the front of the stage.
