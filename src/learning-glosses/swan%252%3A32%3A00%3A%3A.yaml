simpleMeaning: to say, in a serious and formal way, that something is true
scope: 'Also called swear, assert, and verify: to say in a serious and formal way that something is true;
  not the large water bird, and not moving about with no fixed place to go to.'
examples:
- I swan, I never took the money.
- He swanned before everyone that he was telling the truth.
