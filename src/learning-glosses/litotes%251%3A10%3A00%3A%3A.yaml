simpleMeaning: saying less than you mean for effect, above all saying yes by saying no to the opposite
scope: Saying less than you mean for effect, above all saying yes by saying no to the opposite; meiosis
  is another name for this sense, not saying more than you mean and not plain blunt speech.
examples:
- Saying 'I was not a little upset' when you mean 'I was very upset' is litotes.
- Her litotes made the praise sound cool and small.
