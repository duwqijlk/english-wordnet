simpleMeaning: Talk or writing that tends to go off in many directions and cover many different subjects
  instead of staying with the one thing it started on.
scope: Speech or writing that wanders off the point; not a thing that spreads out in many directions,
  which is the other sense of this word.
examples:
- He gave a rambling speech about this and that.
- Her rambling letter jumped from one subject to another.
