simpleMeaning: A star-shaped fruit or seed with a sweet warm smell, used in Asian cooking and as a medicine.
scope: A star-shaped fruit or seed used in Asian cooking and as a medicine, not the tree that bears it
  or a seed used only as a spice; also called star anise and star aniseed.
examples:
- Chinese anise gives the soup its sweet warm smell.
- The cook added Chinese anise to the medicine pot.
