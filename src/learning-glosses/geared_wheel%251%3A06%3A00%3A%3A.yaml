simpleMeaning: 'One toothed round part in a pair: it turns the other part to change how fast a thing moves
  or which way it goes.'
scope: Also called a gear, a cogwheel, or a gear wheel, this is one of a pair of toothed round parts that
  turn each other to change speed or direction.
examples:
- The geared wheel turned the other toothed part beside it.
- He oiled the geared wheel before starting the machine.
