simpleMeaning: In law, the findings of a jury on the facts it was asked to judge, which can shape the
  court's judgment
scope: In law, what a jury finds on the facts put to it, which can shape the court's judgment, not the
  judge's own ruling alone.
examples:
- The jury returned a verdict of guilty.
- We waited all day for the verdict.
