simpleMeaning: A choice food that is very dangerous because the egg sacs and liver hold a strong poison
  that harms the nerves.
scope: A choice food that can kill, also called puffer, blowfish and sea squab; not a safe fish dish and
  not a poison used as a drug.
examples:
- Only a trained cook may serve pufferfish, since its poison can kill.
- He ate pufferfish once and was lucky to feel no ill effect.
