simpleMeaning: a row of pictures that tell a story, in a paper or a book of picture stories
scope: Also called comic strip, funnies, and strip, it is a row of pictures that tell a story, not one
  picture alone and not a book of words with no pictures.
examples:
- I read the cartoon strip in the morning paper every day.
- The cartoon strip in that comic book tells a funny story in pictures.
