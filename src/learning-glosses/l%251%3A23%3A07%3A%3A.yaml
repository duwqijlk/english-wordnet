simpleMeaning: A cgs unit for how bright a face that spreads shine in every way is when it gives out or
  throws back one shine-unit for each square centimetre.
scope: A unit that tells how bright a face looks when it gives off or throws back one lumen for each square
  centimetre; also called lambert, and not the litre, and not the letter.
examples:
- The screen shines at ten L.
- A reading of one L means one lumen for each square centimetre.
