simpleMeaning: 'In psychology, a kind of practice: saying facts over and over, in the head or aloud, to
  keep them in mind for a short time'
scope: In psychology, saying facts over and over to keep them in mind for a short time.
examples:
- Her rehearsal of the phone number kept it in her mind.
- Silent rehearsal helped him learn the lines.
