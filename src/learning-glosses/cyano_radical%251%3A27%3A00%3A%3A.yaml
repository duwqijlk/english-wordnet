simpleMeaning: carbon and nitrogen joined together make a small part with one free link, found in a chemical
  stuff
scope: 'Also called cyanide group, cyanide radical and cyano group: this small part with one free link
  sits inside a chemical stuff, not on its own.'
examples:
- The cyano radical is the -CN part of the compound.
- Chemists write the cyano radical as -CN in the formula.
