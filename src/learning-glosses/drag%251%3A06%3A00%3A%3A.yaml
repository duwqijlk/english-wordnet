simpleMeaning: clothes that people usually wear if they are of the other sex, especially women's clothes
  worn by a man
scope: These are clothes worn by a person of the other sex; it is not the computer act of moving things
  on a screen, and not the force that slows movement.
examples:
- He went to the party dressed in drag.
- The actor wore drag for his part as an old woman in the play.
