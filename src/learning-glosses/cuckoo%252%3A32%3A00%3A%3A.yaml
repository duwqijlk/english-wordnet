simpleMeaning: To go on saying or sounding one thing again and again in a dull, flat way, never changing
  the note
scope: To repeat one sound over and over in a dull way, not the bird itself and not a single call.
examples:
- She cuckooed his name again and again until he answered.
- The old record cuckooed the same notes over and over.
