simpleMeaning: A clear hard plastic that can be poured into shapes or used in paints and glues.
scope: Acrylate resin and acrylic are other names for this sense, not a soft rubber and not a natural
  tree gum.
examples:
- The acrylic resin was poured into a mould and left to harden.
- Acrylic resin holds the paint fast to the wall.
