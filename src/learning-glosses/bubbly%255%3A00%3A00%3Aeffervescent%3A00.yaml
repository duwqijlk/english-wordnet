simpleMeaning: giving off small balls of gas or full of them, as when gas is put into a liquid or when
  a natural change in the liquid makes gas
scope: 'Also called bubbling, foaming, foamy, frothy, or effervescing: a drink or liquid full of, or giving
  off, small balls of gas. It is not the noun sense that means a white sparkling wine.'
examples:
- The soda was bubbly and cold when she opened the bottle.
- She poured a bubbly drink, and the gas rose to the top of the glass.
