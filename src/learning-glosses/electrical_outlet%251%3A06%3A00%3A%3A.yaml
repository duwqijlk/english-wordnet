simpleMeaning: A socket in a wiring system where current can be taken to run electrical devices.
scope: 'Also called electric outlet, electric receptacle and outlet: you push a plug into this place in
  the wires of a building to get power for a machine, not a switch that turns power on or off and not
  a light that only gives light.'
examples:
- She plugged the lamp into the electrical outlet beside the bed.
- The electrical outlet by the desk had no power, so the computer would not start.
