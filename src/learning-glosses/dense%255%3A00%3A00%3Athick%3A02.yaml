simpleMeaning: letting little or no light pass through, because the matter in it is packed close together
scope: This is about smoke, fog or the like letting little light through. It is not about growth that
  is hard to pass through, and not about a person who is slow to learn.
examples:
- Dense smoke filled the room and blocked the light.
- We walked through dense fog and could hardly see.
