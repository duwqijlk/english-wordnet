simpleMeaning: To cook a thing part of the way first, so the rest of the cooking takes less time.
scope: For food cooked in two stages, the first done ahead of time so the last is quick.
examples:
- Precook the rice the night before, so dinner is quick.
- She precooked the beans and kept them in the fridge.
