simpleMeaning: spoken in a strong way, with more force put on it than on the words around it
scope: 'Also called emphasized and emphasised: this is about a word said in a strong way. It is not the
  sense that means strong and firm in what you say or do in general.'
examples:
- He spoke the emphatic word in a loud, strong voice.
- The teacher said the emphatic part of the word again, slowly and loudly.
