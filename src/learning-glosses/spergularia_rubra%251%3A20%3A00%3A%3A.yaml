simpleMeaning: A low flat-growing weedy herb with tiny pink flowers, widespread across Europe and Asia
  on sand dunes, heath and coastal cliffs, and now growing wild in eastern North America.
scope: Also called sand spurry and sea spurry; a low weed with tiny pink flowers of dunes and cliffs,
  not a tall garden flower and not a grass.
examples:
- Spergularia rubra grew along the sandy path.
- We found Spergularia rubra on the coastal cliffs.
