simpleMeaning: a thing made by joining atoms, not from living things, that holds a joined pair of oxygen
  atoms (shown as -O-O-) with a charge of two
scope: This is a chemical that is not from living things and holds a joined pair of oxygen atoms with
  a charge of two. It is not the act of using such a chemical to bleach something.
examples:
- The lab tested a peroxide that contains an -O-O- group.
- She kept the peroxide in a dark bottle in the lab.
