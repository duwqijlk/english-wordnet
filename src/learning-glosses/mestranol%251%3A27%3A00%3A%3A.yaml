simpleMeaning: a man-made form of estrogen used with a progestin, a drug like the body's own progesterone,
  in pills taken by mouth to keep pregnancy from starting
scope: A man-made form of estrogen, used with a progestin in pills taken by mouth to keep pregnancy from
  starting; not a natural hormone of the body, and not a pill taken after the fact.
examples:
- Mestranol is used with a progestin in birth-control pills.
- The pill held mestranol, a man-made form of estrogen.
