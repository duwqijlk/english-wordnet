simpleMeaning: In a dense, heavy way.
scope: This adverb describes a dense, heavy quality in how something flows or lies, not the adjective
  for a liquid's texture or for a solid's measured distance.
examples:
- Blood flowed thick from the wound.
- Smoke lay thick over the valley.
