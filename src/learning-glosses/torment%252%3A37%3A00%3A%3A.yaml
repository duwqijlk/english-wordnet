simpleMeaning: to cause a person great pain in their mind or feelings
scope: 'Also called torture and rack: this is the act of hurting someone in mind or feelings, not the
  strong pain feeling itself and not the annoyed feeling it causes.'
examples:
- Guilt tormented him for years after the accident.
- Doubts tormented the young soldier at night.
