simpleMeaning: the top edge along the side of a boat, and the top boards along the side of a wooden boat
scope: 'Also called gun rest or gunnel: the top edge along the side of a boat, not the lower boards or
  the inside floor of the boat.'
examples:
- He rested his hand on the gunwale as the boat moved.
- Water splashed over the gunwale in the rough sea.
