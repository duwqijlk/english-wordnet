simpleMeaning: In basketball, the area in front of each basket, foul line included, usually colored differently
  from the rest of the court.
scope: This is the basketball court area also called the key, not the coating substance, the pink or red
  cheek makeup, or the act of applying color.
examples:
- He drove through the paint and scored over two defenders.
- The team's center dominates play in the paint.
