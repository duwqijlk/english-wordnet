simpleMeaning: A big kind of dog with a smooth white coat marked with black or brown spots, first came
  from Dalmatia.
scope: This is a big spotted dog first from Dalmatia, also called a carriage dog and a coach dog, not
  a small spotted dog or a hunting dog bred for pointing.
examples:
- Our dalmatian has a white coat with black spots.
- The dalmatian came from Dalmatia long ago.
