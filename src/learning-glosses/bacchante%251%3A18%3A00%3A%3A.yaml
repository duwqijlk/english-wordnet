simpleMeaning: In old Greek and Roman stories, a woman who serves Bacchus, the god of wine, as a priestess
  or follower
scope: A woman who serves Bacchus in old stories, not a man who serves him and not a priestess of another
  god.
examples:
- The bacchante poured wine at the feast.
- A bacchante danced with the others in the rite.
