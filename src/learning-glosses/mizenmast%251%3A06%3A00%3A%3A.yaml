simpleMeaning: 'Count the masts back from the front: on a ship with three or more, this is the third;
  on a yawl, ketch, or dandy, the shorter mast at the back.'
scope: Also called mizzen, mizzenmast, and mizen; the third mast from the front of a ship with three or
  more masts, or the shorter mast at the back of a yawl, ketch, or dandy.
examples:
- The mizenmast stood third from the bow on the old three-master.
- They lowered the sail from the mizenmast at dusk.
