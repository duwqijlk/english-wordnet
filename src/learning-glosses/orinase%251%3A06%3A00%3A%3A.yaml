simpleMeaning: A drug of the sulfonylurea kind, taken by mouth to treat the kind of diabetes that starts
  in grown-ups.
scope: Also called tolbutamide; this drug of the sulfonylurea kind is swallowed to treat the kind of diabetes
  that starts in grown-ups.
examples:
- The doctor gave her Orinase for her diabetes.
- Orinase is taken by mouth each morning.
