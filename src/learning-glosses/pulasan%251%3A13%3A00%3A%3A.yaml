simpleMeaning: The fruit of a tree from the East Indies, like the rambutan, a hairy red fruit, but sweeter
scope: Also called pulassan, this is the fruit of an East Indian tree, not the tree itself.
examples:
- He peeled a pulasan and ate the sweet flesh inside.
- The pulasan tastes sweeter than a rambutan.
