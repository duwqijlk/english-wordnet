simpleMeaning: A part of the law-making arm of the state that prints and binds papers for Congress and
  for the parts and bodies of the state at the national level.
scope: Also called Government Printing Office, United States Government Printing Office or US Government
  Printing Office; a part of the law-making arm of the state that prints and binds papers for Congress
  and for the parts and bodies of the state at the national level.
examples:
- The GPO printed the report for Congress.
- The GPO binds papers for the departments.
