simpleMeaning: When the reader signs in, words typed far away show up again on their machine — a world-wide
  way for one computer user to write a note to another
scope: 'Also called email and e-mail: written notes sent from one machine and read at another, not letters
  sent by post.'
examples:
- She sent the report by electronic mail instead of printing it.
- His electronic mail arrived before the meeting started.
