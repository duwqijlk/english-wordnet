simpleMeaning: In biochemistry, a long chain in a cell, made of units called nucleotides and twisted into
  two spirals; it carries the code passed on from parent to child.
scope: Not RNA or a gene; also called deoxyribonucleic acid and desoxyribonucleic acid.
examples:
- DNA carries the code for how a living thing grows.
- Each cell holds a full copy of the DNA.
