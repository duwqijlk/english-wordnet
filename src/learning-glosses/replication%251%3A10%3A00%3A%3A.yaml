simpleMeaning: In law, a written statement by the person who starts a case, made in reply to the answer
  given by the person being sued
scope: A written reply in a court case. It is not repeating a test, not the copying that happens before
  a cell divides, and not a quick spoken reply.
examples:
- The plaintiff filed a replication in answer to the defendant's plea.
- Her lawyer's replication denied the claims made in the answer.
