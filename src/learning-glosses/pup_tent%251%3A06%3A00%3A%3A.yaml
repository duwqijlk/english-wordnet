simpleMeaning: A small shelter shaped like a wedge, thick at one end and thin at the other, most often
  with no floor or windows
scope: A small wedge-shaped shelter, most often with no floor or windows; not a big shelter with a floor
  and not a bag hit in boxing.
examples:
- We slept in a pup tent on the hillside.
- His pup tent had no floor, so he put a mat down.
