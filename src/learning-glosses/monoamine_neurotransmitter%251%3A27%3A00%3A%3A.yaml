simpleMeaning: Messages pass between nerve cells with the help of this chemical, which plays a key part
  in the work
scope: This chemical carries messages between nerve cells and plays a key part in that work; not a monoamine
  with no part in nerve messages and not a different kind of message carrier in the body.
examples:
- Dopamine is a monoamine neurotransmitter that helps control movement.
- The drug works by changing how a monoamine neurotransmitter carries signals in the brain.
