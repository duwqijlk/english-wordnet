simpleMeaning: life comes to an end when the body can no longer do the work that keeps it going
scope: Also called die, go, pass, choke, exit, croak, perish, and decease; to stop living, not to run
  out of time or to breathe out.
examples:
- The old man expired peacefully in his sleep.
- She expired from cancer after a long illness.
