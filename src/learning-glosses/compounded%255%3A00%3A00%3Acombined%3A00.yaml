simpleMeaning: In chemistry, made by joining two or more substances together, or forming such a joined
  substance
scope: This is the chemistry sense of being joined into one substance, not being made worse or added to.
examples:
- Water is a compounded substance made of hydrogen and oxygen.
- The compounded material was tested in the lab.
