simpleMeaning: A fleshy herb that lives many years, with small flowers that grow alone in the leaf joints
  or at the ends of the stems.
scope: This is a fleshy herb that lives many years, with small flowers, also called seabeach sandwort;
  not a shrub and not a plant with clustered flowers.
examples:
- Arenaria peploides grew on the sandy shore.
- The small flowers of Arenaria peploides opened alone at the stem ends.
