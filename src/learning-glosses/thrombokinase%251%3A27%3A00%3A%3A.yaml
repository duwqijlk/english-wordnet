simpleMeaning: As blood starts to clot, a stuff set free from the tiny bits that help it clot turns one
  blood stuff into the stuff that makes blood clot.
scope: Also called thromboplastin, it is a stuff from blood platelets that acts as blood starts to clot.
examples:
- As blood starts to clot, thrombokinase is set free from platelets.
- As the blood clotted, thrombokinase turned prothrombin into thrombin.
