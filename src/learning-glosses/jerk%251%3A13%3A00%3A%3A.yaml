simpleMeaning: Meat that is cut into thin strips and left in the sun to dry, most often beef
scope: A food made of meat, especially beef, dried in the sun; it is not the weight-lifting move and not
  a sudden sharp move.
examples:
- The travellers carried jerk, dried beef cut in long thin pieces, for the long trip.
- They made jerk by drying strips of beef in the sun.
