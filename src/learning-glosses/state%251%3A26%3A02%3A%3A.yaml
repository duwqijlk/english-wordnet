simpleMeaning: 'In chemistry, one of the three traditional forms of matter: solids hold their shape and
  volume, liquids hold volume but take the container''s shape, and gases fill the container.'
scope: This is the chemistry form of matter, not the general condition something is in, not an emotional
  condition, not a country or its government, and not an administrative district.
examples:
- 'Water can exist in all three states: solid, liquid and gas.'
- At high temperatures, the state of the substance changes from liquid to gas.
