simpleMeaning: Saying out loud that you give up and accept that you have lost.
scope: Saying that you give up, not handing a person to the law and not the act of giving up in a fight.
examples:
- In his surrender, he said plainly that the fight was lost.
- The surrender was spoken, not written, and the crowd heard every word.
