simpleMeaning: Now growing wild in the United States, this rough, spiky weed from Europe bears tall thin
  bunches of sky-coloured flowers.
scope: This rough, spiky weed from Europe is also called blue devil, blueweed, and viper's bugloss.
examples:
- Blue thistle now grows wild in the United States.
- The blue thistle is rough and spiky to the touch.
