simpleMeaning: A thing that shines, by giving or throwing back light.
scope: This sense is a thing that shines, by giving or throwing back light, unlike the sense for any of
  the many small, silvery, North American carp-like fishes, especially of the group Notropis, unlike the
  sense for a prized food fish of the northern Atlantic and Med, its body greenish-blue with dark bars
  and few scales, if any, and unlike the sense for a swollen bruise by the eye, from a blow.
examples:
- The shiner is a thing that shines.
- Shiners shine by giving light.
