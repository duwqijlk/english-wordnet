simpleMeaning: Any of a broad group of slim, round-headed mammals with separate toes, many of which can
  draw their claws back into their paws.
scope: The whole broad family of such mammals, not just the small furry feline kept as a pet, and not
  only the large roaring wild kinds.
examples:
- Lions, lynxes and house cats are all cats, though they look very different.
- This group includes cats as varied as the cheetah and the tabby.
