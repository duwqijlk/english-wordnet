simpleMeaning: one of two strong poles with a small step in the middle, used to walk high above the ground
scope: One of two strong poles with a step in the middle, used to walk high above the ground; not a long-legged
  bird, and not a post that holds up a building.
examples:
- The clown walked across the square on stilts.
- He was so tall I thought he was on stilts.
