senseId: 'fixate%2:41:00::'
synsetId: 02544031-v
simpleMeaning: to hold on to a person or thing in your mind in an unhealthy way that you cannot let go
  of
scope: This is holding on to a person or thing in your mind in an unhealthy way, not just liking someone
  and not simply looking at something.
examples:
- He fixates on his mother, even at the age of forty.
- She began to fixate on every small mistake.
