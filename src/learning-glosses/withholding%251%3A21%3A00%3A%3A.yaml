simpleMeaning: income tax taken from workers' pay and paid straight to the government by the person or
  company they work for
scope: This is the tax money taken from pay and sent to the government, not the act of taking it from
  pay.
examples:
- Her withholding for the year was sent straight to the government by her employer.
- The withholding taken from his wages covers part of his income tax.
