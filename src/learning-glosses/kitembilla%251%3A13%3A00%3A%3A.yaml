simpleMeaning: Used above all to make preserves, this deep red-purple fruit from India is like a gooseberry,
  with tart-sweet purple flesh.
scope: Also called ketembilla and kitambilla, this is a deep red-purple Indian fruit used for preserves,
  not a gooseberry.
examples:
- She cooked kitembilla into preserves.
- The kitembilla pulp was tart and sweet.
