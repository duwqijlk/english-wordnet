senseId: 'hanging%1:04:01::'
synsetId: 01019643-n
simpleMeaning: The act of supporting an object from above so that it moves freely.
scope: This is the act of suspending an object so it can move freely (suspension and dangling are other
  names for this sense), not execution and not the decorative object itself.
examples:
- The hanging of the portrait was a small ceremony.
- The hanging of the heavy mirror took two people.
