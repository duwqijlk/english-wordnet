simpleMeaning: Some kinds trail the great marching swarms, and all are dull-colored South American animals
  that eat the small insects they find.
scope: Also called antbird, this is a dull South American bird that feeds on small insects.
examples:
- The ant bird picked insects as the swarm moved on.
- Some ant birds trail the great swarms of army ants.
