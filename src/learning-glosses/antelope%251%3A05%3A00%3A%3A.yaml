simpleMeaning: Any of various graceful Old World cud-chewing animals with long legs and horns that point
  up and back, such as gazelles, springboks, impalas, addax, gerenuks, blackbucks and dik-diks.
scope: This is the broad group name for graceful, long-legged Old World animals whose horns sweep up and
  back; gazelles and impalas belong to the group, while deer are different animals with branched antlers.
examples:
- A herd of antelope grazed at the edge of the savanna.
- The antelope lifted its head, horns tilted back, and bounded away.
