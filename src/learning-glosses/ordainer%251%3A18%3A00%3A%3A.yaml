simpleMeaning: A church leader who gives a person the right to work as a priest or minister
scope: A church leader who makes a person a priest or minister, not the person made a priest and not a
  church leader with no such power.
examples:
- The ordainer laid his hands on the young man at the service.
- As ordainer, the bishop welcomed three new priests.
