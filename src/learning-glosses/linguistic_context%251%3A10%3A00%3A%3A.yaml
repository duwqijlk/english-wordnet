simpleMeaning: To work out what a word or part of a text means, look at the talk or writing round it
scope: 'Also called context and context of use: the talk round a word that helps fix its meaning, not
  the word on its own and not the place where it is said.'
examples:
- The linguistic context made it clear that 'bank' meant the side of a river.
- Without the linguistic context, the sentence could mean two things.
