simpleMeaning: a bundle of nerve threads that carry touch and other feelings to a part in the middle of
  the brain called the thalamus
scope: 'Also called lemniscus: a bundle of nerves inside the body, not a metal strip for steel, not a
  headband, and not a piece of meat or fish.'
examples:
- Damage to the fillet can change how touch is felt.
- The fillet carries signals from the body up to the brain.
