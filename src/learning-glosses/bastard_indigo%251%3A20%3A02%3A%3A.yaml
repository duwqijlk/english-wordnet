simpleMeaning: A bushy shrub that grows on damp riverbanks and flood plains in the eastern United States,
  with fragrant leaves and tight spikes of dark purple flowers.
scope: This is the eastern North American riverbank shrub with dark purple flowers, not the East Indian
  shrub or the Pacific coast shrub with red to indigo flowers; false indigo is another name for this plant.
examples:
- Bastard indigo grows thickly along the muddy banks of the river.
- Its dark purple flowers make the bastard indigo easy to spot in late summer.
