simpleMeaning: One, a pair, or a ring of small leaf-like parts, called bracts, that are easy to see at
  the foot of a group of flowers on one stalk
scope: One, a pair, or a ring of leaf-like parts at the foot of a flower group, not the green cup under
  a single flower and not the flower head itself.
examples:
- The sunflower's involucre forms a green ring below its yellow head.
- Botanists look at the involucre to tell one kind of daisy from another.
