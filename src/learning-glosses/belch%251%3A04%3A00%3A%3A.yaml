simpleMeaning: a sudden, noisy letting out of gas from the stomach through the mouth, done without thinking
scope: 'Also called a burp: a noisy letting out of gas from the stomach, not a volcano throwing out lava.'
examples:
- He let out a loud belch after the meal.
- The baby's belch made everyone laugh.
