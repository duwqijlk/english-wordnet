simpleMeaning: The residue of malt and grain left in the mash-kettle after the mashing and lautering process.
scope: It is also called brewer's grain and draff, the leavings of malt and brewing seeds left in the
  mash-kettle once the liquid has been drawn off.
examples:
- Farmers feed spent grain to their animals.
- They cleared the spent grain out of the mash-kettle.
