simpleMeaning: a basketball shot from the line that no one may block, given because the other side broke
  a rule
scope: This is a shot in basketball from the line, given when the other side breaks a rule; charity shot,
  charity throw, charity toss, foul shot and penalty free throw are other names for it, not an ordinary
  shot during play.
examples:
- He sank the free throw to tie the game.
- She took a free throw after the foul.
