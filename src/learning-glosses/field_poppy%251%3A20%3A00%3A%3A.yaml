  people.
scope: A European flower that lives for one year, common among grain plants and often grown by people;
  also called corn poppy, not a flower that lives for many years.
examples:
- Field poppies grew among the wheat in the summer.
- The farmer lets field poppy grow at the edge of the grain field.
