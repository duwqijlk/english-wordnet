simpleMeaning: to give a place, event or thing a main idea or look that it follows throughout
scope: This is the act of giving a place or event a main idea or look, not the main tune in music and
  not the main idea in a book.
examples:
- The restaurant themes its menus around fresh food from nearby farms.
- They themed the whole party around the sea, with blue cloths and shells.
