simpleMeaning: A spruce of middling size from California and Oregon, with branches that hang down.
scope: Also called weeping spruce and Brewer's spruce; a spruce of California and Oregon, set apart from
  upright spruces by its hanging branches.
examples:
- Picea breweriana hung its branches down like a curtain.
- The Picea breweriana in the arboretum was planted in 1930.
