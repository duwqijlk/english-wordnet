synsetId: 05895546-n
simpleMeaning: in physics, no two electrons, protons or neutrons in one set can be in states with the
  same set of quantum numbers (the numbers that mark each state)
scope: 'Also called exclusion principle: a physics rule about electrons, protons and neutrons in one set,
  and the quantum numbers that mark their states.'
examples:
- The Pauli exclusion principle says no two electrons in one atom can share the same set of quantum numbers.
- The Pauli exclusion principle explains why two neutrons in one set cannot share the same set of quantum
  numbers.
