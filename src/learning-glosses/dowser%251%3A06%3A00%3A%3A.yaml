simpleMeaning: people say a stick that splits into two at one end bends down to show water or oil hidden
  under the ground
scope: 'Also called a divining rod and a dowsing rod: a forked stick said to point to water or oil under
  the ground, not a tool for digging and not a machine that finds metal.'
examples:
- He held the dowser over the dry ground and watched it dip.
- The dowser dipped sharply where the water lay under the ground.
