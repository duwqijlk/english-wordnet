simpleMeaning: a sharp powder or paste made from ground seeds
scope: This is a sharp powder or paste made from ground seeds; mustard is another name for this sense.
  Not the plant that bears the seeds and not a mild sauce.
examples:
- He spread table mustard on his sandwich.
- The table mustard in the jar was a sharp yellow paste.
