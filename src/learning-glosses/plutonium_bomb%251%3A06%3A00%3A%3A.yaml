simpleMeaning: Huge energy is set free in this nuclear weapon by splitting the centres of heavy atoms,
  such as uranium 235 or another heavy metal.
scope: Also called atom bomb, atomic bomb and fission bomb, it is a nuclear weapon in which huge energy
  is set free by splitting the centres of heavy atoms.
examples:
- They built a plutonium bomb.
- She wrote about the plutonium bomb.
