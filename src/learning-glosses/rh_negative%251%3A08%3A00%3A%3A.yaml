simpleMeaning: The red cells of this blood group have none of the Rh factor in them.
scope: Also called Rh-negative blood and Rh-negative blood type, this is a blood group with red cells
  that lack the Rh factor, not one whose red cells carry it.
examples:
- The lab report said her blood was Rh negative.
- If you are Rh negative, your red cells lack the Rh factor.
