senseId: 'external_carotid%1:08:00::'
synsetId: 05347299-n
simpleMeaning: a blood vessel in the neck that branches off the main neck vessel and carries blood to
  the face, the tongue, and the outer parts of the head
scope: This is a neck blood vessel feeding the face and tongue; external carotid artery is another name
  for this sense; not the inner branch feeding the brain and not the main neck vessel itself.
examples:
- The external carotid supplies blood to the face and tongue.
- Surgeons traced the external carotid to its branches in the neck.
