simpleMeaning: In medicine, to order a patient to use a treatment or a drug, most often by writing the
  order down
scope: In medicine, to order a patient to use a treatment or a drug, most often by writing the order down;
  not to give advice in general and not to make a law.
examples:
- The doctor prescribed steroids for my ear trouble.
- She prescribed rest and plenty of fluids.
