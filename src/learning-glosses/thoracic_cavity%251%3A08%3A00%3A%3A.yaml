simpleMeaning: Shut in by the ribs between the breathing sheet and the neck, this hollow space in a body
  with a backbone holds the lungs and heart.
scope: Chest cavity is another name for this hollow space shut in by the ribs between the breathing sheet
  and the neck, holding the lungs and heart.
examples:
- The heart sits in the thoracic cavity.
- The lungs sit in the thoracic cavity as well.
