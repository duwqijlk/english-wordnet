simpleMeaning: a hand cover made of rough cloth, used to wash and rub the skin clean
scope: A rough hand cover for washing, also called a bath glove, a bath mitt and a shower mitt; not a
  bath sponge and not a towel.
examples:
- She put on the shower glove and scrubbed her arms.
- He used a shower glove to wash his back in the bath.
