simpleMeaning: the way a surface or edge feels when it is not smooth but has parts that are not even or
  level
scope: How a surface or edge feels when it is not smooth or even; not a harsh quality for the senses and
  not small holes made by damage from chemicals or rust.
examples:
- He felt the roughness of the stone wall with his hand.
- The roughness of the wood made it hard to slide the box across.
