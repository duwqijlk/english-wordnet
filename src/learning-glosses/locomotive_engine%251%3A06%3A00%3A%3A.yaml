simpleMeaning: A wheeled machine with its own power that pulls trains along the rails.
scope: This is a wheeled machine with its own power that pulls trains, not a carriage that is pulled and
  not a stationary power unit; engine, locomotive and railway locomotive are other names for this sense.
examples:
- The locomotive engine pulled twelve carriages up the hill.
- A locomotive engine waited at the station for the next train.
