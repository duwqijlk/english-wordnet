simpleMeaning: a hinged piece that drops into a gap on a toothed wheel, to push the wheel forward or stop
  it turning back
scope: A hinged piece that drops into a gap on a toothed wheel to push it forward or stop it turning back;
  dog, click and detent are other names for this sense.
examples:
- The pawl clicked into the next notch of the wheel.
- A broken pawl let the wheel turn back.
