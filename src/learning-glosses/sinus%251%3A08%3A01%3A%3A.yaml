simpleMeaning: a wide path in the body with blood flowing through it; it does not have the thin covering
  that a normal blood vessel has
scope: A wide path for blood in the body, not an air-filled space in the bones of the head and not a path
  from a space with pus to the outside of the body.
examples:
- Blood collects in a wide sinus before it flows on through the body.
- This sinus carries blood, but it does not have the thin covering of a normal blood vessel.
