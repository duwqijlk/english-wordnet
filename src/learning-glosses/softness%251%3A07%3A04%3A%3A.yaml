simpleMeaning: a way of acting thought too womanly in a man, used as an insult
scope: A word used to insult a man for seeming womanly, not a kind way of judging and not a gentle manner.
examples:
- Critics used the word softness to mock the young prince's court.
- The old Spartans mocked the softness of the Athenians, calling it unmanly.
