simpleMeaning: a set of short pieces of writing by many writers, put together to help people learn a language
scope: A set of writings by many writers made to help learn a language, not a single writer's work and
  not a dictionary.
examples:
- The teacher gave us a chrestomathy of Greek passages.
- She learned new words from the chrestomathy.
