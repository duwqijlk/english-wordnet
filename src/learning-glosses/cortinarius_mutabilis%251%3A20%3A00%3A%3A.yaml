senseId: 'cortinarius_mutabilis%1:20:00::'
synsetId: 13096201-n
simpleMeaning: A mushroom with a red-purple cap that feels smooth and slimy, close-set violet gills underneath,
  and every part turning dark purple where it is bruised.
scope: Also called a purple-staining Cortinarius; a mushroom with a red-purple slimy cap and violet gills
  that stain dark purple when bruised, kin to other purple-capped mushrooms.
examples:
- Cortinarius mutabilis grew under the pines, its cap smooth and slimy.
- When bruised, Cortinarius mutabilis stains dark purple all over.
