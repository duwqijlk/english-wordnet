simpleMeaning: In statistics, how picked values of x are linked to seen values of y, in a way that lets
  you work out the most likely y for any x
scope: Also called regression toward the mean, simple regression, and statistical regression. In statistics,
  this is the link between x and y values; it is not the psychiatry sense, where a person goes back to
  acting like a child.
examples:
- The students used regression to study how study hours relate to test scores.
- With regression, she could predict sales from the price.
