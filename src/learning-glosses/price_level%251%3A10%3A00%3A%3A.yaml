simpleMeaning: a number that shows how much the cost of one thing, or a set of things, has gone up or
  down over time
scope: 'Also called a price index: a number that tracks how costs change over time, not the cost of one
  thing on one day.'
examples:
- The price level rose last year, so the same food cost more than before.
- Economists watch the price level to see how costs change over time.
