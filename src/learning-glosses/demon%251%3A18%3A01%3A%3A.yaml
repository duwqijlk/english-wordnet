simpleMeaning: a very cruel, evil person who shows no human kindness
scope: 'Also called monster, and another name for it is devil: this is a very cruel person. It is not
  an evil spirit in a story.'
examples:
- The prison guard was a demon who enjoyed hurting people.
- People called the cruel leader a demon for what he did to prisoners.
