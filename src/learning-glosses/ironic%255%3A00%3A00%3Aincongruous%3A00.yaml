simpleMeaning: Often marked by a sharp, sad gap between what was looked for and what came to pass
scope: Also called ironical; the sad clash between what was looked for and what came to pass, not the
  funny mocking tone.
examples:
- It was ironic that the lifeguard could not swim.
- It was ironic that the fire station burned down.
