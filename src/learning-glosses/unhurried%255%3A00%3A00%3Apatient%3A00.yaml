simpleMeaning: able to wait when something is late and stay calm, without getting upset
scope: About a person who can wait calmly when things are late, not about a slow, relaxed way of walking
  or talking.
examples:
- He was unhurried with the small children, even when they were slow.
- She stayed unhurried when the train was delayed by an hour.
