simpleMeaning: someone who gives lessons to one person at a time, as in singing or acting
scope: A private teacher in fields such as singing or acting, not someone who trains a sports team, a
  railway carriage, a horse-drawn carriage, or a bus.
examples:
- Her singing coach helped her prepare for the audition.
- He hired an acting coach to work on his monologue.
