simpleMeaning: a house that stands in a row with other houses, built of stone that is reddish brown in
  color
scope: A house built of this stone, not the reddish-brown stone itself that is used to build houses.
examples:
- They bought a brownstone in the city, with stone steps up to the front door.
- The old brownstone has three floors and a small garden behind it.
