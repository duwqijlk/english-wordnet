simpleMeaning: curved in the shape of an arch (a curved top over a door or a window)
scope: This means curved like an arch. It is not about legs that curve out at the knees, not about showing
  too much respect for others, and not about a string instrument played with a bow.
examples:
- The bowed ceiling rose high above the hall.
- They walked under the bowed roof of the old church.
