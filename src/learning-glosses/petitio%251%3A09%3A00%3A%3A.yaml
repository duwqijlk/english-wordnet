senseId: 'petitio%1:09:00::'
synsetId: 05903421-n
simpleMeaning: a flaw in reasoning where the end point is taken as given from the start, also called begging
  the question
scope: A flaw in reasoning where the end point is taken as given from the start; petitio principii is
  another name for this sense, not a flaw in the facts and not a weak example.
examples:
- 'His claim was a petitio: he took for granted the very point he had to prove.'
- The teacher marked the petitio in her essay, where the end point was already in the first lines.
