simpleMeaning: a strange way of thinking or a strange thing a person does again and again
scope: 'Also called quirk, queerness and quirkiness: a strange way of thinking or acting, not a strange
  thing that a person keeps.'
examples:
- His oddity was that he always wore a hat indoors.
- One of her oddities was counting every step she took.
