simpleMeaning: A medicine sold as Tandearil that cuts down swelling and eases pain in the joints and the
  soft pads near them
scope: A medicine for swelling and pain in the joints, not a general painkiller and not a medicine for
  infection.
examples:
- The doctor gave him oxyphenbutazone for his swollen knee.
- Oxyphenbutazone helped ease the pain in her arthritic hands.
