simpleMeaning: a small group of close advisers, not official, who give advice to the head of a government
scope: 'Also called kitchen cabinet: a small group of unofficial advisers to the head of a government,
  not a formal cabinet of ministers and not a group of paid staff.'
examples:
- The president relied on his brain trust for advice on the crisis.
- Her brain trust met in secret before the election.
