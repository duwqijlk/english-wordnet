simpleMeaning: A viral liver illness like the B kind but caused by a single-strand RNA virus, usually
  passed on through blood, as by illegal drug injection, transfusion, or blood products.
scope: A viral liver illness spread through blood; not the B kind, which comes from a different virus,
  and not a stomach bug.
examples:
- Hepatitis C is often spread through shared needles.
- He was tested for hepatitis C after the transfusion.
