simpleMeaning: Wild and out of control, driven by a strong madness that reason cannot hold back.
scope: Wild action out of control, with reason unable to hold it back, with manic as another name for
  this sense, and not being upset with fear, which is the other sense of the word.
examples:
- A frenzied mob pushed against the gates.
- The prosecutor gave a frenzied denunciation of the accused.
