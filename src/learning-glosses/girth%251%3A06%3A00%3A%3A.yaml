simpleMeaning: a strap that goes round a horse's belly and keeps its saddle from moving
scope: A band round a horse's belly that holds the saddle; cinch is another name for this sense, not the
  width round a tree or a body, and not a belt worn round a person's waist.
examples:
- He tightened the girth before riding off.
- The girth slipped and the saddle moved.
