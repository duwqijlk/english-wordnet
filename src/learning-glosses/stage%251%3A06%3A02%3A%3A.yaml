simpleMeaning: The flat shelf on a microscope where you place the slide or sample for examination.
scope: This sense is not a theatre platform or a step in a process, but the shelf that holds a sample.
examples:
- Raise the stage slowly so the slide does not crack against the lens.
- He wiped a drop of water from the microscope's stage before fitting a new specimen.
