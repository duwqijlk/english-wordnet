simpleMeaning: to go and see someone or a place for a short time.
scope: This means a short call on someone, not a long stay, not an official inspection, and not a doctor's
  appointment.
examples:
- We visited my aunt for an hour on our way home.
- He visits the museum whenever he is in town.
