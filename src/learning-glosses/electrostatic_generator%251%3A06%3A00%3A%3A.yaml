simpleMeaning: An electric device that makes a high voltage by piling up still electric charge.
scope: An electric device that piles up still charge, also called an electrostatic machine; not a battery
  and not a wire.
examples:
- The electrostatic generator built up enough charge to make a spark.
- A school electrostatic generator can lift small bits of paper.
