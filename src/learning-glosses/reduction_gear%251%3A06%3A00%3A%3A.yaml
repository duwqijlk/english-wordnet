simpleMeaning: a set of turning wheels that slow down a fast turning part, so it comes out slower
scope: A set of parts that slows a fast turning part down, not a box that changes speed in both ways and
  not a brake that stops a part.
examples:
- The reduction gear slowed the motor's fast turn to a slow turn at the wheel.
- The mill uses a reduction gear to turn the fast motor into a slow, strong turn.
