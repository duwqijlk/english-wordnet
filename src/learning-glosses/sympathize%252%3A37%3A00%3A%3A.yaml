simpleMeaning: to share in another person's pain or sorrow, showing that you feel it too
scope: To feel another person's sorrow with them or show that you do, not merely to be sorry for yourself
  and not to agree with their views.
examples:
- I sympathize with you over the loss of your mother.
- She sympathized with the workers who had lost their jobs.
