simpleMeaning: One who will not follow the set ways of behaving.
scope: One who will not follow the set ways of behaving; not one who fails to fit some rule or pattern
  of behaviour or thought that society backs, nor one who fails to follow set ways or beliefs, especially
  in religion.
examples:
- Their nonconformist left the church at dawn.
- The nonconformist spoke against the rules.
