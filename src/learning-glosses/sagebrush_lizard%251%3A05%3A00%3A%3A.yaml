simpleMeaning: In the American west between the Rocky Mountains and the Sierra Nevada, this scaly ground-dwelling
  creature likes open land with low bushes here and there.
scope: This ground-dwelling creature of the American west between the Rocky Mountains and the Sierra Nevada
  likes open land with scattered low bushes, and is not a tree-climbing creature.
examples:
- We saw a sagebrush lizard on the open ground.
- The sagebrush lizard lives among the low bushes.
