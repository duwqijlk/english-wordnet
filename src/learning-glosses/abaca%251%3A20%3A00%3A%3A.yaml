simpleMeaning: Rope, paper, and other things are made from Manila hemp, the fibre that the leaf stems
  of this banana tree of the Philippines give.
scope: This is a banana tree of the Philippines whose leaf stems give Manila hemp for rope and paper,
  and it is not the banana tree grown for fruit to eat.
examples:
- Farmers grow abaca for the fibre in its leaf stems.
- Ropes made from abaca held the load fast.
