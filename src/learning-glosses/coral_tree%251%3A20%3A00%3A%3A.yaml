simpleMeaning: A shrub or small tree of the Erythrina genus, grown as a garden ornamental for its three-part
  leaves and long clusters of scarlet to coral-red blooms, followed by black seeds.
scope: Another name for the Erythrina shrub or tree also called erythrina, not a coral or an unrelated
  red-flowered tree.
examples:
- A coral tree in full flower looks like a mass of red.
- The coral tree bears black seeds after its red flowers fade.
