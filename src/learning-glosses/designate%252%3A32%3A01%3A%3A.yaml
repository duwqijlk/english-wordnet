senseId: 'designate%2:32:01::'
synsetId: 00748465-v
simpleMeaning: an order made ahead of time, fixing what will happen to a person or a thing
scope: 'Also called fate, doom, and destine: to settle in advance what will happen to a person, not to
  point at a place and not to give someone a job.'
examples:
- She was designated to become a great pianist.
- The old law designated him to take the throne.
