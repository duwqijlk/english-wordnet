simpleMeaning: the pod of the mesquite tree, used when making leather and when adding colour
scope: 'Also called algarobilla and algarrobilla: the pod used for leather and dye, not the mesquite tree
  itself and not a pod used as animal feed.'
examples:
- The tanner bought a sack of algarroba for the dye vats.
- They steeped algarroba pods in water to colour the cloth.
