simpleMeaning: To turn the lower arm or the hand round so that the palm points down
scope: To turn the lower arm or hand so the palm faces down, not the opposite turn that brings the palm
  up.
examples:
- The therapist asked him to pronate his wrist so she could check the movement.
- When you pronate your hand, the palm faces the floor.
