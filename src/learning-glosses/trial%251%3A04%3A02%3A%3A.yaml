simpleMeaning: In law, the court process that decides whether someone is guilty or not
scope: This is a court case that decides guilt; it is not a test of how well something works, not a sports
  qualifying contest, and not a distressing event.
examples:
- Her trial lasted three weeks before the jury reached a verdict.
- The case never went to trial because both sides settled.
