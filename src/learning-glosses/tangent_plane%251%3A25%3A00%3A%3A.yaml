senseId: 'tangent_plane%1:25:00::'
synsetId: 13884747-n
simpleMeaning: In geometry, the flat surface that holds every straight line that just touches a surface
  at one chosen point
scope: In geometry, a flat surface touching another surface at a single point; not a line that cuts through
  the surface, and not the surface itself.
examples:
- The tangent plane touches the sphere at just one point.
- We drew the tangent plane at one point on the dome.
