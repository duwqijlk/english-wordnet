simpleMeaning: A work scheme under which staff build up shares bit by bit and may in the end take charge
  of the firm.
scope: A work scheme for staff to build up shares, not a bonus and not a pension.
examples:
- The employee stock ownership plan let workers buy shares each month.
- Under the employee stock ownership plan, staff may one day run the firm.
