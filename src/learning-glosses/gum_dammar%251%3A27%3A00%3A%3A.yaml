simpleMeaning: Any of several hard resins from trees of the Dipterocarpaceae family and of the Agathis
  genus, above all the amboyna pine
scope: This is any of several hard resins from trees of the Dipterocarpaceae family and the Agathis genus,
  above all the amboyna pine; damar, dammar and dammar resin are other names for this sense, not a soft
  resin and not a resin from pine trees in general.
examples:
- Gum dammar is used in varnish and inks.
- The craftsman melted gum dammar to seal the wood.
