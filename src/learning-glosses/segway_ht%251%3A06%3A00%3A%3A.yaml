simpleMeaning: A two-wheeled standing ride that keeps its own balance, made for one person to travel on
  flat paths where people walk.
scope: A self-balancing ride for one person on flat paths where people walk; Segway and Segway Human Transporter
  are other names for this sense.
examples:
- She stepped onto a Segway HT and glided down the path.
- The Segway HT kept its balance as he rode it across the square.
