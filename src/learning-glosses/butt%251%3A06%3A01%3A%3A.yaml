simpleMeaning: the small part of something that is not used, especially the end of a cigarette left after
  smoking
scope: The small end left of something, especially a cigarette, not a whole cigarette to smoke and not
  a large barrel.
examples:
- He threw the cigarette butt on the ground.
- Only a small butt of the candle was left.
