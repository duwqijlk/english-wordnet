senseId: 'analogise%2:31:00::'
synsetId: 00654954-v
simpleMeaning: to show how one thing is like another, to make a likeness clear
scope: Also called analogize; to draw a likeness between things, not to prove two things are the same
  and not to compare their size.
examples:
- The teacher will analogise the heart to a pump.
- He analogised the market to a tide.
