simpleMeaning: In botany, a small raised lump on a plant stem, where one or more leaves grow out
scope: In plants, this is the lump on a stem where leaves grow; it is not a lump on a part of the body,
  not a crossing point in space, and not a still point in a wave.
examples:
- Cut the stem just above a node, where a leaf grows out.
- New leaves came out from a node near the base of the plant.
