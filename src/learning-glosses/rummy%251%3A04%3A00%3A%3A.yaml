simpleMeaning: A card game where players collect groups of matching cards and groups of cards in order;
  the winner is the first to put down all their cards
scope: A card game, also called rum, where players make sets and groups of cards in order; this is the
  game sense, not any drink sense of rum.
examples:
- In rummy, she kept three sevens together as a set.
- He won the game of rummy by putting down all his cards first.
