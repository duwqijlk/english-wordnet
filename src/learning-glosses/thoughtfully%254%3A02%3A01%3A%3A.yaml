simpleMeaning: in a way that shows deep, careful thinking about something
scope: This sense is about giving deep, careful attention to an idea or a question. It is not the sense
  of doing something kind that shows care for what other people need.
examples:
- He stared thoughtfully out of the window, trying to decide what to do.
- She sat thoughtfully for a long time before she answered.
