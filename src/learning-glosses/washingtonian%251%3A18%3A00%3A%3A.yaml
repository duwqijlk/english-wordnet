simpleMeaning: A person born or living in the state of Washington.
scope: A person of the state of Washington, not of the city of that name, not an adjective for things
  of the state, and not a word for things in the manner of George Washington.
examples:
- The Washingtonian had grown up near Seattle.
- She is a Washingtonian who moved to Oregon last year.
