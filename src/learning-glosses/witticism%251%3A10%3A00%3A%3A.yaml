simpleMeaning: something said or written that is clever with words, or clever and odd, in a way that can
  make people laugh
scope: 'Also called humor, wit, humour and wittiness: something clever said or written that can make people
  laugh. It is not just any joke, but one that shows a clever use of words or a clever, odd idea.'
examples:
- His quick witticism made the whole room laugh.
- Her witticism was a clever play on words, and it made the whole class laugh.
