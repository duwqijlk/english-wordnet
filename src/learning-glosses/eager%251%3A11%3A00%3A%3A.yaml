simpleMeaning: a high wave, often dangerous, made by the tide when two flows of water hit each other or
  go into a narrow place where a river meets the sea
scope: 'Also called bore: a high wave made by the tide, not a person who wants something very much and
  cannot wait.'
examples:
- The eager came up the river with great force.
- Fishermen feared the eager after the full moon.
