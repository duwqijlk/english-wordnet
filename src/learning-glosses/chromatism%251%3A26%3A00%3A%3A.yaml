simpleMeaning: seeing lights of colour that are not really there
scope: Seeing coloured lights that are not really there, not colours brought on by sounds or other things
  felt.
examples:
- The patient said the chromatism made her see red lights in a dark room.
- His chromatism left him seeing flashes of colour that no one else could see.
