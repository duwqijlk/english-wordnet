senseId: 'budget%1:21:03::'
synsetId: 13442635-n
simpleMeaning: a plan that lists the money someone intends to spend and explains where the money to pay
  for it will come from.
scope: This is not a sum of money set aside, and not the act of planning spending; it is the written plan
  itself.
examples:
- The finance committee presented a detailed budget for the coming year.
- Their budget showed how the money would be spent and which grants would cover it.
