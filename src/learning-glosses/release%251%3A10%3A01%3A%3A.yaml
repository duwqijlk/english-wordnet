schema: oewn-learning-gloss-v2
senseId: 'release%1:10:01::'
synsetId: 06564805-n
simpleMeaning: An official paper showing that a debt or other obligation has been paid off or formally
  cancelled.
scope: This is a legal paper proving that a debt or obligation has been discharged, not merchandise for
  sale, not the act of setting someone free, not a process that discharges something, not a press announcement,
  not the ending of someone's employment, not a euphemism for death, not the ending of a musical phrase,
  not a part you press on a mechanism, not an outlet for creative energy, not the escape of a fluid, not
  a formal written statement of relinquishment, and not any of the verb senses.
examples:
- The lender issued a release once the final payment cleared.
- She kept the signed release with the deed to show that the mortgage had been discharged.
