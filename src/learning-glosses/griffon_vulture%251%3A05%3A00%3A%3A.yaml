simpleMeaning: A large bird of prey of southern Europe and northern Africa, with pale feathers and black
  wings
scope: This is a large bird of prey of southern Europe and northern Africa with pale feathers and black
  wings; griffon is another name for this sense, not an eagle and not a small bird of prey.
examples:
- A griffon vulture circled high above the cliffs.
- Griffon vultures feed on the remains of dead animals.
