simpleMeaning: Straight and open in the way a person speaks or acts, with no hints and no holding back
scope: Straight and open in the way a person speaks or acts, with no hints and no holding back; also called
  blunt, frank, candid, forthright, outspoken, free-spoken and plainspoken; not a soft hint and not a
  polite way of hiding what you mean.
examples:
- 'She gave a point-blank answer: no.'
- His point-blank words left no doubt.
