simpleMeaning: A germ that causes a sickness much like polio, but without the loss of movement.
scope: A germ that causes a sickness much like polio, but without the loss of movement, also called coxsackievirus;
  it causes a polio-like sickness, not polio itself.
examples:
- Coxsackie virus causes a sickness like polio without paralysis.
- Children with Coxsackie virus had fever but no loss of movement.
