senseId: 'remit%1:04:00::'
synsetId: 00122926-n
simpleMeaning: In law, the act of sending a matter to another court, especially the sending of a law case
  to another court
scope: In law, a court sending a case on to another court. It is not the verb sense of making something
  less tight or less strong.
examples:
- A remit was ordered, and the case went to another court.
- By remit, the judge sent the case to be heard in another court.
