simpleMeaning: the most important or meaningful of all, and the greatest in level or in what has been
  done
scope: 'Also called leading: the most important or greatest of all, not just better than some others and
  not first in time or place.'
examples:
- She is the preeminent scientist in her field.
- He was a preeminent poet of his time.
