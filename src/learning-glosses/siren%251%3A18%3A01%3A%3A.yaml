simpleMeaning: In old Greek tales, a sea spirit, half woman and half bird, said to sing so sweetly that
  sailors steer toward her and die on the rocks where she lives.
scope: Not a mermaid, half woman and half fish, nor a sea god; a sea spirit in old Greek tales.
examples:
- Odysseus ordered his crew to plug their ears so they would not hear the Siren's fatal song.
- The sailors steered toward the rocks when they heard the Siren sing.
