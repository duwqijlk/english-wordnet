simpleMeaning: A set of rods and levers joined to a vehicle's front wheels, pushed left or right by the
  steering gear to swivel the wheels and turn the vehicle.
scope: Of rods and levers joined to a vehicle's front wheels, pushed by the steering gear to turn the
  vehicle.
examples:
- The steering linkage swivels the front wheels.
- A worn steering linkage makes the car hard to steer.
