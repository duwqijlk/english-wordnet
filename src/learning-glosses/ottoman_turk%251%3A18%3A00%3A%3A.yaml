simpleMeaning: A member of the people named for Osman the First, above all a member of his tribe.
scope: Also called Ottoman and Osmanli, this is a member of the people named for Osman the First, above
  all a member of his tribe; other members of the same people are not of that tribe.
examples:
- An Ottoman Turk served in the sultan's army.
- The Ottoman Turk spoke of his tribe with pride.
