simpleMeaning: Twigs of reddish or violet and bark full of the bitter stuff used to tan leather mark this
  shrub of Europe and Asia.
scope: Also called basket willow, purple osier, red osier, and red willow, it is a shrub of Europe and
  Asia whose bark is full of the bitter stuff used to tan leather.
examples:
- The purple willow had twigs of reddish or violet.
- The purple willow had bark full of the bitter stuff used to tan leather.
