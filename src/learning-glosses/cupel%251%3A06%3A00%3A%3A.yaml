simpleMeaning: To take precious metals out of lead and other base metals, people who test metals use a
  small bowl of bone ash with tiny holes all through it
scope: A small bone-ash bowl used when testing metals; also called bone-ash cup and refractory pot, not
  a dish for serving food.
examples:
- The assayer put the metal in a cupel to test it.
- A cupel takes the gold out of the lead.
