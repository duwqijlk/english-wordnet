simpleMeaning: a person or thing that turns up without warning and solves a problem no one else can solve
scope: This is someone or something that turns up without warning and sorts out a problem no one can solve,
  not a planned rescue and not a hero who was there all along.
examples:
- Just when all seemed lost, a deus ex machina arrived with the missing papers.
- The play ends with a deus ex machina who pays off every debt at once.
