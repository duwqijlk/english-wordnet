simpleMeaning: A paper cover for a letter with a clear patch that lets the address inside show through
scope: This is a paper cover for a letter with a clear patch that shows the address inside; it is not
  a plain cover and not a see-through bag.
examples:
- The bill came in a window envelope so I could see my name through the clear patch.
- She used a window envelope for the letter so the address showed through.
