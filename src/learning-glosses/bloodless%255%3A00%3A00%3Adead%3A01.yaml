simpleMeaning: Having no blood, or only seeming to have none
scope: Having no blood, or looking as if it has none; not a pale face from illness or fear, and not a
  deed free of bloodshed.
examples:
- The bloodless carcass lay still on the ground.
- The bloodless wound showed no red at all.
