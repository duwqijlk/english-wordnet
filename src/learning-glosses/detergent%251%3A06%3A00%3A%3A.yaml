simpleMeaning: a thing used for washing that is not soap but can also mix oils into water and keep dirt
  in the water
scope: The washing stuff itself, which is not soap; not the science use of the word for the cleaning chemical
  in factories and washing.
examples:
- She put some detergent in the water to wash the clothes.
- This detergent can wash oil off dirty plates.
