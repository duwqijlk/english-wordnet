senseId: 'gestation%1:26:00::'
synsetId: 14069684-n
simpleMeaning: the state of having a baby growing inside a woman, and the time from when it starts to
  grow until the baby is born
scope: This sense is the state and time of a woman having a baby growing inside her, also called pregnancy
  and maternity, not just the time while an unborn young grows and develops.
examples:
- During gestation, the mother needs good food and rest.
- Her gestation lasted about nine months before the baby was born.
