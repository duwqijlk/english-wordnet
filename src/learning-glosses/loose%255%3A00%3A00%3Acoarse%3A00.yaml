simpleMeaning: 'Of a texture: shot through with many tiny openings or gaps.'
scope: This applies to textures; the same sense is also called open, and it is not about something unfastened
  or about parts packed less densely.
examples:
- The cloth had a loose weave that let the sunlight through.
- Air moved freely through the loose mesh of the screen.
