simpleMeaning: the making of copies by putting ink on paper, as when books are made
scope: Making copies with ink on paper, not the business of selling printed work, not handwriting that
  looks like print, and not all the copies made at one time.
examples:
- Printing spread books to many readers.
- The printing of the newspaper took all night.
