simpleMeaning: A work of reference putting short pieces about many subjects in one place, often in several
  volumes and in A-to-Z order, covering everything people know or one special field.
scope: 'Also called encyclopedia, cyclopaedia, or cyclopedia: a work that gathers short pieces about many
  subjects.'
examples:
- She looked up the word in the encyclopaedia.
- The school library keeps a full encyclopaedia on the shelf.
