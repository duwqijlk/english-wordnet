simpleMeaning: A costly oil and a hard white stuff like ivory come from the big nuts of this feather palm
  of tropical America
scope: This is a tropical palm, not a coconut palm or an oil palm; also called cohune.
examples:
- The cohune palm drops large nuts on the ground.
- The cohune palm gives nuts that yield a rich oil.
