simpleMeaning: An Algonquian tongue spoken by the Miami and by the people it is named for.
scope: Also called Illinois, this is the Algonquian tongue spoken by the Illinois and the Miami, not the
  people themselves and not any other Algonquian tongue.
examples:
- The Illinois language was spoken by the Illinois and the Miami peoples.
- She studied the Illinois language to learn more about Algonquian tongues.
