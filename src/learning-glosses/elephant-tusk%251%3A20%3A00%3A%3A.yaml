simpleMeaning: A long curving beak, large whitish or yellowish flowers marked with purple spots, and a
  life of one year mark this plant of the southern United States and Mexico.
scope: It is also called common devil's claw, common unicorn plant, devil's claw, proboscis flower and
  ram's horn, and it is a one-year plant with large whitish or yellowish flowers, not a plant that lives
  for years.
examples:
- The elephant-tusk has large whitish flowers marked with purple spots.
- A long curving beak grows on the elephant-tusk.
