simpleMeaning: Hard skins and autumn ripening mark the fruit of plants of the kinds Cucurbita maxima and
  Cucurbita moschata, one of many kinds.
scope: This plant is also called a winter squash plant, not the fruit with a thick skin and yellow to
  orange flesh.
examples:
- Winter squash grows ripe in the autumn.
- We planted winter squash this year.
