simpleMeaning: From the west of North America to the north of Mexico, animals feed on this good plant
  with thin leaves that grows on dry high ground and flat land.
scope: People also call it mountain rice and silkgrass, and it is the good plant animals feed on in dry
  high ground and flat land from the west of North America to the north of Mexico.
examples:
- On the dry plains, silk grass grows in the west of North America.
- Animals eat silk grass where it grows on dry high ground.
