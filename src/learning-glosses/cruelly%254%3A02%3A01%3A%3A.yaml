simpleMeaning: in a way that causes pain and suffering on purpose, with no kindness in it
scope: Done with cruelty, causing pain on purpose, not merely rough or unkind by accident.
examples:
- He treated his students cruelly.
- The prisoners were cruelly beaten and left without food.
