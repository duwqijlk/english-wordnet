simpleMeaning: the link between things that change when the rule that joins them makes a straight line,
  as in y equals a times x plus b
scope: A straight-line link between things that change, also called rectilinear regression; not a curve
  and not a single number.
examples:
- Their linear regression showed test scores rising in a straight line with hours of study.
- She drew a linear regression through the points on the graph.
