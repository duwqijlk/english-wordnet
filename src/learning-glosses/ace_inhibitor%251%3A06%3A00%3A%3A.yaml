simpleMeaning: a blood-pressure drug that stops the kidney making angiotensin II and relaxes the arteries;
  it removes salt and water by blocking the angiotensin converting enzyme and treats congestive heart
  failure
scope: 'Also called angiotensin-converting enzyme inhibitor: a blood-pressure drug that acts on the kidney
  and the arteries, helps the body remove salt and water, and is also used for congestive heart failure.'
examples:
- ACE inhibitors lower blood pressure.
- Her doctor gave her an ACE inhibitor for heart failure.
