simpleMeaning: To tell someone about danger before it comes, giving a warning well ahead of time
scope: To warn someone ahead of time, not after the danger has come; forewarn is another name for this
  sense.
examples:
- Please previse us if you see any trouble ahead.
- The letter prevised the town that the river might flood.
