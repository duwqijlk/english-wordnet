simpleMeaning: Used in the way of a small word, such as in or on, that shows how one thing stands to another
scope: Used in the way of a small word that shows how one thing stands to another; not in the way of a
  word that tells how an act is done, and not in the way of a word that joins two parts of a sentence.
examples:
- The word is used prepositionally in the phrase.
- Here 'down' works prepositionally.
