simpleMeaning: Seeds from this plant that grows in dry land give a gum used to thicken or stiffen things,
  and the plant is also grown as animal feed
scope: 'Also called guar: a dry-land plant grown for feed and for a gum from its seeds, not a bean grown
  only for eating and not a plant that needs much water.'
examples:
- Farmers grow cluster bean in dry fields for animal feed.
- The cluster bean seeds give a gum that thickens sauces.
