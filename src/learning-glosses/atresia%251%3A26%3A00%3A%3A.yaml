senseId: 'atresia%1:26:00::'
synsetId: 14072744-n
simpleMeaning: a wrong state of the body in which a normal opening or tube, such as the tube that carries
  urine out, is shut or missing
scope: A wrong state of the body in which a normal opening or tube is shut or missing, not an opening
  that is only narrow and not a cut that has healed shut.
examples:
- The baby was born with atresia of the urethra, so urine could not pass.
- The doctor found that the atresia had closed the tube completely.
