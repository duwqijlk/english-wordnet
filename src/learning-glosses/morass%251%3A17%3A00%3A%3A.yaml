simpleMeaning: low ground that is wet and soft, so your feet sink into it when you walk on it
scope: 'Also called slack, mire and quagmire: low wet ground that you sink into, not hard dry land and
  not deep open water.'
examples:
- After the rain, the path turned into a morass and our boots sank.
- They had to cross a morass to reach the farm.
