simpleMeaning: A sealed room where poison fumes are let in, used as a tool to kill people or animals
scope: This is a sealed room where poison fumes are let in, used as a tool to kill people or animals;
  death chamber is another name for this sense, not a prison cell and not a gas store.
examples:
- The gas chamber was used to kill people in the old prison.
- Animals were killed in the gas chamber.
