simpleMeaning: To frame and run by sound or craft rules, to reach wished ends.
scope: To frame and run by sound or craft rules, to reach wished ends; also called rationalize; not to
  weed out unwanted or needless things, nor to think soundly, using sense or ground, nor to stand up for,
  tell of, clear, or excuse by ground.
examples:
- Their boss would rationalise the firm.
- The clerk did rationalise the work.
