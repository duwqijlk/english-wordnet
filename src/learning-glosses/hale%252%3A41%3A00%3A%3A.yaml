senseId: 'hale%2:41:00::'
synsetId: 02510211-v
simpleMeaning: to make someone do something by using force, by a sense of duty, by strong reasons, or
  because there is no other choice
scope: 'Also called force, pressure, squeeze, and coerce: to make a person do something; not the word
  hale that means strong and healthy.'
examples:
- His debts haled him to take a job he did not want.
- A sense of duty haled him to speak at the meeting, though he did not want to.
