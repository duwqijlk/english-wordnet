schema: oewn-learning-gloss-v2
senseId: 'fatalism%1:09:01::'
synsetId: 06203765-n
simpleMeaning: A way of thinking where a person gives in and does not try to change things, because they
  believe all that happens is already fixed and cannot be stopped
scope: This is the giving-in way of thinking that comes from a belief, not the belief itself as a set
  of ideas and not a hopeful way of thinking.
examples:
- His fatalism meant he never tried to make his life better.
- Fatalism kept her from making any plans to change her job.
