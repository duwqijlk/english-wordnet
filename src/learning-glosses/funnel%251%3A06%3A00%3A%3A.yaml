simpleMeaning: In ships, the tall pipe that lets smoke out, a shaft that lets air in or lets smoke pass,
  most of all on a ship
scope: The tall pipe that lets smoke out of a ship; not the cone-shaped tool for pouring, and not just
  the shape of a cone.
examples:
- Smoke rose from the funnel of the old steamship.
- The funnel of the ship was painted black and white.
