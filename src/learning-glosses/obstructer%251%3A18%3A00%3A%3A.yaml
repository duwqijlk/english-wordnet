senseId: 'obstructer%1:18:00::'
synsetId: 10368974-n
simpleMeaning: A person who keeps getting in the way of something others want to do, on purpose and time
  after time.
scope: A person who keeps getting in the way of what others want to do; obstructionist and obstructor
  are other names for this; not a person who blocks the way by accident, and not a thing that stands in
  the road.
examples:
- The obstructer delayed every plan the council put forward.
- She was known as an obstructer of the new road.
