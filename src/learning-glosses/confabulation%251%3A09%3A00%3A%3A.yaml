simpleMeaning: In psychiatry, a memory that sounds true but is made up, filling in gaps in what a person
  remembers.
scope: In psychiatry, of a memory that sounds true but is made up, filling gaps in what a person remembers.
examples:
- His confabulation about the holiday sounded so real that no one doubted it.
- The patient's confabulation filled in the days she could not recall.
