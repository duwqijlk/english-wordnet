simpleMeaning: A blood vessel that branches off the one in the face and carries blood to the lips
scope: This is a blood vessel that branches off the one in the face to carry blood to the lips, also called
  arteria labialis, not the main vessel of the face and not a vein.
examples:
- The labial artery carries blood to the lips.
- The surgeon tied off a labial artery during the operation.
