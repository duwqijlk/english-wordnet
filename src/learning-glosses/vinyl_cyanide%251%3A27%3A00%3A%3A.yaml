simpleMeaning: a clear liquid made from propene, a nitrile (a chemical with carbon and nitrogen) with
  a double bond in it
scope: Also called acrylonitrile and propenonitrile, this is a clear liquid chemical, not a solid plastic
  and not a gas.
examples:
- Workers wear masks when they handle vinyl cyanide.
- The vinyl cyanide is stored as a clear liquid in sealed drums.
