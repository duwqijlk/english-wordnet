simpleMeaning: A clear crystal form of the drug that kills germs, working much like the G form but standing
  up better to the acids in the stomach.
scope: Also called phenoxymethyl penicillin; a crystal form of the germ-killing drug, set apart from the
  G form by its strength against stomach acids.
examples:
- The doctor gave her penicillin V for the throat infection.
- Penicillin V works well because stomach acid does not break it down so fast.
