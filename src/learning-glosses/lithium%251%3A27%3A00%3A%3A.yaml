simpleMeaning: A soft, silver-white metal that joins with one other bit, one of the alkali metals; the
  lightest metal known, found in several minerals.
scope: Also called Li, atomic number 3; not the heavier metals of the same group.
examples:
- Lithium is the lightest metal known.
- Lithium salts are used in some drugs.
