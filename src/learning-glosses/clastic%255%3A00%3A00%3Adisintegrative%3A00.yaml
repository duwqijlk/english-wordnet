simpleMeaning: Made of bits broken off older rocks, as in a mass of rounded stones or sandstone
scope: This describes a rock made of bits broken off older rocks, not a rock formed in one piece.
examples:
- Clastic rock is made of bits broken off older rocks.
- Sandstone is a clastic rock, built up from fragments of older stone.
