simpleMeaning: From the point of view of topology, the study of shapes and how their parts join together
scope: Judged by the study of shapes and how their parts join, not by size or angles and not by where
  a thing sits in space.
examples:
- Topologically, a cup and a ring are the same shape.
- The two figures are topologically the same, though one is much bigger.
