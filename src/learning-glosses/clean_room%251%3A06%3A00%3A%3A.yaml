simpleMeaning: A room where lab work is done and fine tools are put together or mended, kept almost free
  of dust and germs
scope: A room kept almost free of dust and germs, used for lab work and for putting together or mending
  fine tools, is also called a white room.
examples:
- Workers enter the clean room in special suits.
- The clean room keeps dust away from the fine tools.
