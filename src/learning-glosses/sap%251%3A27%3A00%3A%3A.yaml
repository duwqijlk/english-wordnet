simpleMeaning: the watery liquid inside a plant, full of sugars, salts, and minerals, that moves through
  the plant's tubes
scope: The juice inside a plant, not a leather club used for hitting people.
examples:
- In spring, the sap rises in the maple tree.
- They tapped the tree to collect its sweet sap.
