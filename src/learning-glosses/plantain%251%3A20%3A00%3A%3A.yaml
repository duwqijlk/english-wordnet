simpleMeaning: a banana tree with hanging groups of greenish, flat-sided fruit full of starch that can
  be eaten, in hot lands and the warm lands near them
scope: Another name for this tree is plantain tree. It is the tree itself, not the small roadside weed
  also called plantain, and not its own fruit, which is always cooked and eaten as a vegetable.
examples:
- A plantain stood at the edge of the garden, its heavy fruit hanging in a bunch.
- They cut the green fruit from the plantain and cooked it for dinner.
