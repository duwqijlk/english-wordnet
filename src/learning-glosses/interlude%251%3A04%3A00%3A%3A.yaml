senseId: 'interlude%1:04:00::'
synsetId: 00521936-n
simpleMeaning: a short show, such as music or dance, put between parts of a longer show
scope: A short show put between parts of a longer show; it is not just any short time between events,
  and not the act of playing such a piece.
examples:
- During the interlude, two dancers came on stage.
- The band played a short interlude between the two parts of the show.
