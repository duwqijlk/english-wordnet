simpleMeaning: having pointed parts that stick out, like the points of a fork; usually used together with
  another word
scope: Having pointed parts that stick out, usually used with another word before it; not the sense of
  looking like a fork split into two branches.
examples:
- We used a three-pronged fork to lift the meat.
- The tool has a two-pronged end for pulling nails.
