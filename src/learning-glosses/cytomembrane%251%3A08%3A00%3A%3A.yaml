simpleMeaning: the thin layer around a cell's inner fluid, a double sheet of fats, with proteins controlling
  which ions such as sodium, potassium or calcium pass in and out.
scope: 'Another name for cell membrane and plasma membrane: the fatty outer layer of a cell. Not an internal
  membrane such as the one around the nucleus.'
examples:
- Under the microscope the cytomembrane appeared as a double line around the cell.
- Proteins in the cytomembrane control which ions enter and leave.
