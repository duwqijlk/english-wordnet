simpleMeaning: with the end bent down in a curve like an eagle's beak
scope: This describes a nose or beak bent down at the end; it is not a shape made for catching and holding
  things.
examples:
- He had a hooked nose that curved down sharply.
- The eagle's hooked beak bent down at the tip.
