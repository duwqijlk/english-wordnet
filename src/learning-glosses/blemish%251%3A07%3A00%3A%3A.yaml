simpleMeaning: a mark or fault that makes something look worse, especially on a person's body
scope: 'Also called mar and defect: a mark that makes a thing look worse, especially on the body, not
  the verb sense of putting such a mark on something.'
examples:
- A small blemish on her cheek showed when she took off her make-up.
- The only blemish on the new table was a dark spot near the edge.
