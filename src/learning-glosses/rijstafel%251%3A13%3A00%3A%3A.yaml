simpleMeaning: a meal from Indonesia, in which many kinds of food and sauces are served with rice
scope: Not a single plate of food, and not a meal from another land; also called rijsttafel.
examples:
- A rijstafel filled the table with small bowls.
- We shared a rijstafel of many dishes.
