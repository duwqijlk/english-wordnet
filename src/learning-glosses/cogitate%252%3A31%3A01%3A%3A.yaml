senseId: 'cogitate%2:31:01::'
synsetId: 00705278-v
simpleMeaning: To think about something with care, going over it again and again in one's mind.
scope: To think about something with care, going over it again and again; not to work things out with
  reason so as to reach a choice, a finding, or an answer.
examples:
- He cogitated on the letter for days before replying.
- She cogitated quietly, turning the idea over in her mind.
