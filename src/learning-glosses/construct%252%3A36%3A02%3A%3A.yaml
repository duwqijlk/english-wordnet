simpleMeaning: to make a new thing by putting ideas, reasons and general ideas together in a clear order
scope: Making a new thing by putting ideas and reasons together in order; not a general idea itself, and
  not drawing a shape with tools by set rules.
examples:
- She constructed a strong argument by putting her reasons in order.
- You can construct a proof by linking each idea to the one before it.
