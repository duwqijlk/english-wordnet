simpleMeaning: showing or caused by energy that a substance gives off as it breaks apart inside
scope: This is about a substance that gives off energy as it breaks apart, or about something caused by
  that energy. It is not about any other kind of poison or danger.
examples:
- The radioactive waste was kept in thick metal boxes.
- Radioactive fallout fell on the land after the blast.
