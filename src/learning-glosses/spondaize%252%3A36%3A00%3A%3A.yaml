synsetId: 01707054-v
simpleMeaning: To make a line of verse have two long, heavy beats in each foot
scope: To give verse two long, heavy beats in a foot, also called spondaise; not to shorten a line and
  not to change its words.
examples:
- She spondaized the last line of the poem.
- The teacher spondaized the verse to show the slow beat.
