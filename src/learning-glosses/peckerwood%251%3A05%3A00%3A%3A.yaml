simpleMeaning: A bird with strong claws and a stiff tail for climbing, and a hard, sharp bill for making
  holes in wood to get insects
scope: This bird is also called woodpecker and pecker; it is the climbing bird that makes holes in wood
  for insects, not a bird that only eats insects on the ground.
examples:
- A peckerwood climbed the tree and tapped the wood with its bill.
- We watched a peckerwood dig insects out of the old tree.
