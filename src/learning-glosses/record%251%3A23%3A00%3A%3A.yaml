simpleMeaning: the number of games a team has won, lost or tied.
scope: Not a plastic music disk and not a written document; here it means a team's count of wins, losses
  and ties.
examples:
- The team finished the season with a record of ten wins and four losses.
- Their home record is the best in the league.
