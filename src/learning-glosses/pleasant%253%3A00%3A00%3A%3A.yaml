simpleMeaning: giving you a good, happy feeling and suiting what you like
scope: This says a thing, place or time feels good and suits what you like. It is not the sense about
  a person and their kind, polite way of acting.
examples:
- We spent a pleasant evening by the lake.
- The room had a pleasant smell and soft light.
