simpleMeaning: a lasting health problem in which a person cannot do some things because one or more arms
  or legs have been lost
scope: This is the lasting health problem after an arm or leg is lost, not the operation in which a doctor
  cuts it off.
examples:
- Living with amputation, she learned new ways to dress and cook.
- Amputation changed his daily life, but he still works and drives.
