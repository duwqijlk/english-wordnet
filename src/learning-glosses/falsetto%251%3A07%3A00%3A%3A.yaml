simpleMeaning: a man's singing voice made to sound very high, in the high part of the range of notes he
  can sing
scope: This is a man's high singing voice, not a woman's singing voice and not a man's normal speaking
  voice.
examples:
- He sang the high part in falsetto.
- The singer's falsetto sounded much higher than his usual voice.
