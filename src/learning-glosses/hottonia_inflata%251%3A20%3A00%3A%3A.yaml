simpleMeaning: A featherfoil of the east of the United States, with flower stalks under water that are
  spongy and swollen, and white flowers.
scope: This is a featherfoil of the east of the United States also called water gillyflower and American
  featherfoil, not a featherfoil of Europe or western Asia.
examples:
- The white flowers of Hottonia inflata rise above the water.
- Hottonia inflata grows with its stalks under water.
