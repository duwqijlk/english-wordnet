senseId: 'spyhole%1:06:00::'
synsetId: 03911327-n
simpleMeaning: a small hole in a door, an oven, or a like thing, that you can look through to see what
  is on the other side
scope: This is a small hole for looking through, also called eyehole and peephole; it is not a window
  and not a hole for a key.
examples:
- He looked through the spyhole in the door before he opened it.
- The spyhole in the oven door let her see the bread inside.
