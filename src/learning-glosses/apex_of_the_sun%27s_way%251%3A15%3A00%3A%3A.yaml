simpleMeaning: the point in the sky toward which our star and its planets seem to move, set against the
  fixed stars
scope: 'Also called apex: the point in the sky our star seems to move toward, not the top of a mountain
  and not the highest point of a shape.'
examples:
- The apex of the sun's way marks the direction in which our star travels through space.
- By plotting the fixed stars, they found the apex of the sun's way.
