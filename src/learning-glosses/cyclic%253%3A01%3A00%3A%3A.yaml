simpleMeaning: Following the Carnot cycle, a set of steps in which heat is turned into work.
scope: A compound or process that follows the Carnot cycle, not one whose atoms form a ring and not a
  thing that comes round again and again.
examples:
- The engine runs on a cyclic process, following the Carnot cycle.
- A cyclic change of heat and work drives the machine.
