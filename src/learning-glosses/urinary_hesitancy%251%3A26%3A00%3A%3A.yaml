simpleMeaning: Trouble starting to pass water, linked with a swollen prostate in men and a narrow water-pipe
  opening in women; it may come from emotional strain in either sex.
scope: Trouble starting to pass water, linked with a swollen prostate in men or a narrow water-pipe opening
  in women, not a pain when passing water and not a wish to pass water too often.
examples:
- Urinary hesitancy made it hard for him to start passing water.
- She had urinary hesitancy, so she found it hard to start passing water.
