simpleMeaning: a short piece of wire used to make an electrical connection
scope: This is a short wire making an electrical connection, not the rope for an animal or the strip of
  metal used in printing.
examples:
- He used a short lead to bridge the two terminals while he tested the circuit.
- The technician soldered a lead across the broken track to restore the connection.
