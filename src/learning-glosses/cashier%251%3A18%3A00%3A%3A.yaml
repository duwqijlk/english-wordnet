simpleMeaning: Someone who works at a bank and handles the money that people pay in and take out.
scope: This is a bank worker who takes money in and pays it out; teller is another name for this sense;
  not the person who takes payments in a shop.
examples:
- The cashier at the bank counted the notes and handed her the change.
- He queued at the bank while the cashier served the man ahead.
