simpleMeaning: to be a danger to a person or thing, and to put them at risk of harm
scope: To be a danger to a person or thing, not to say to a person that you will hurt or punish them.
examples:
- Dry weather threatens the crops this year.
- Pollution threatens the health of people who live near the factory.
