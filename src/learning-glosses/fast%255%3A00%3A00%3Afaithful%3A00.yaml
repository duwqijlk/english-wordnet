simpleMeaning: Always loyal and never changing in support of a friend, a promise, or a cause.
scope: This is about steady loyalty; it is not about speed, a smooth surface, or a loose way of living.
examples:
- They became fast friends in their first year of college and are still close today.
- She held fast to her promise to care for her sister's children.
