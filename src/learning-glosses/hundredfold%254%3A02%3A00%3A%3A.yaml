simpleMeaning: to a size or amount one hundred times as great as before
scope: About a change that makes something one hundred times as great; not just a small rise, and not
  one hundred in total.
examples:
- Their money grew hundredfold in ten years.
- Sales rose hundredfold after the new shop opened.
