simpleMeaning: to change your beliefs about religion, or to take up a belief about religion that you did
  not hold before
scope: About changing or taking up a religion; not the sports sense of scoring extra points, and not a
  person who has changed religion.
examples:
- She decided to convert to Buddhism after years of study.
- He converted to Islam and began to pray every day.
