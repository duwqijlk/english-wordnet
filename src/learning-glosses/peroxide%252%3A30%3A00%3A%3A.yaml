simpleMeaning: to make something light or white in colour by using a strong chemical liquid
scope: This is the action of making something light in colour, not the chemical liquid itself, which is
  the noun sense of the word.
examples:
- She peroxides her hair every summer so that it looks blond.
- He decided to peroxide his hair before the party.
