simpleMeaning: A tall pine from western North America with thick blue-green needles; when full grown its
  bark is grey-brown and split into rectangular plates.
scope: This is the tall western pine with thick blue-green needles, also called silver pine or western
  white pine — not the low shrubby pine of central Europe with the same name.
examples:
- The mountain pine on the ridge has thick blue-green needles.
- Mountain pines grow tall in western North America.
