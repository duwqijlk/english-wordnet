simpleMeaning: a pile of stones set up in memory of a person or event, or to mark the end of a piece of
  land or a path
scope: A pile of stones used as a sign or in memory of a person or event, not the small dog with rough
  hair from Scotland called a cairn terrier.
examples:
- A cairn on the hill marks the path for walkers.
- They built a small cairn of stones to remember their friend.
