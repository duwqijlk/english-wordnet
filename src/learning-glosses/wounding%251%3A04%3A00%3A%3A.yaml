simpleMeaning: the act of hurting someone and causing an injury to their body
scope: This is the act of hurting someone and causing an injury to their body; wound is another name for
  this sense. It is not pain in the feelings, and not the act of killing.
examples:
- The wounding of the soldier happened during the night attack.
- He was charged with the wounding of two men in the fight.
