simpleMeaning: A gold fluid once thought to be made by the liver and to make people quick to lose their
  temper
scope: A fluid once thought to come from the liver and to make people quick to lose their temper, also
  called choler; not a real fluid of the body and not black bile.
examples:
- Old books said yellow bile made a man quick to anger.
- The doctor of that time blamed yellow bile for his patient's bad temper.
