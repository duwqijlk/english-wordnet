simpleMeaning: a kind of tuberculosis, a serious illness that makes the glands in the body swell up
scope: 'Also called king''s evil or scrofula: a form of tuberculosis that makes the glands swell, not
  a swollen thyroid gland.'
examples:
- The doctor said the struma was a form of tuberculosis that had swollen the glands in his neck.
- Struma left her with swollen glands that the doctor had to treat.
