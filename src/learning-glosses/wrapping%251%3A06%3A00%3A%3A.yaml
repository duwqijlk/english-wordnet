simpleMeaning: the outer covering, usually paper or clear thin plastic, that goes round a thing
scope: This covering is also called wrap and wrapper. It is the material round a thing, not the act of
  putting it round something.
examples:
- She tore the wrapping off the gift.
- The book came in bright red wrapping.
