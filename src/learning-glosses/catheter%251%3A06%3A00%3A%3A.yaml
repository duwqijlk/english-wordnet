senseId: 'catheter%1:06:00::'
synsetId: 02987924-n
simpleMeaning: a thin tube that bends easily, put into the body to let fluids go in or come out, or to
  keep a passage open
scope: This is the thin medical tube put inside the body, not a tube used outside the body and not a pipe
  for water.
examples:
- The nurse put a catheter in to drain fluid from his body.
- A thin catheter kept the passage open after the operation.
