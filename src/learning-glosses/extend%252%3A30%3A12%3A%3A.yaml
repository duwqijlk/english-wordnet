simpleMeaning: to put a cheaper thing in with something so you have more of it
scope: Also called stretch. This is putting a cheaper thing in with something so you have more of it;
  it is not stretching out your body and not using all your strength.
examples:
- Extend the soup by adding water and more beans.
- They extended the meat with rice so it would feed more people.
