simpleMeaning: A device showing the path of high-energy bits of matter through over-full vapour; each
  bit strips charge from molecules, and small drops form on them in a clear line.
scope: Also called a cloud chamber; a device showing the path of high-energy bits of matter through a
  vapour, not a bubble chamber and not a spark chamber.
examples:
- The Wilson cloud chamber showed the path of the particle as a clear line.
- In the Wilson cloud chamber, drops form where the particle passed.
