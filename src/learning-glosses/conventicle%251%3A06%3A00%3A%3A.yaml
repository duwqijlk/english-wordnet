simpleMeaning: A building where people meet for worship, above all Nonconformists such as Quakers.
scope: Also called meetinghouse; a building where people meet for worship, above all Nonconformists, not
  a large church and not a private home.
examples:
- The conventicle stood at the end of the lane.
- Quakers gathered in the small conventicle each Sunday.
