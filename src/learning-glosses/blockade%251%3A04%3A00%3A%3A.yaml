simpleMeaning: In war, a move that cuts off a place that matters to the enemy, so nothing can get in or
  out
scope: A war move that cuts off a place, not the act of blocking a road so no one can pass.
examples:
- The blockade stopped all food from reaching the city.
- Enemy ships kept up the blockade for months.
