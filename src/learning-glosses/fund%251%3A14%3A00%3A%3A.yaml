simpleMeaning: a company that collects money from people who buy shares and uses it to buy stocks and
  other investments in other companies.
scope: This is not a sum of money saved for a purpose, and not a supply of something.
examples:
- She put her savings into a fund that invests in technology companies.
- The fund buys shares in many different businesses to spread the risk.
