simpleMeaning: the way a person says words clearly so that people listening can understand them
scope: 'Also called enunciation: how clearly a person speaks so listeners can understand, not the choice
  of words a writer uses.'
examples:
- Her diction was so clear that everyone in the hall could understand each word.
- Actors work on their diction so the audience can hear them well.
