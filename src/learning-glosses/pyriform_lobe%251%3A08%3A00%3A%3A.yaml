simpleMeaning: On either side of the brain, in the part that deals with smell, lies a pear-shaped part
  made of nerve cells
scope: Also called pyriform area, piriform area, or piriform lobe, this is a part of the brain that deals
  with smell, not the nose itself.
examples:
- The pyriform lobe sits on each side of the brain.
- The scan showed the pyriform lobe on both sides of the brain.
