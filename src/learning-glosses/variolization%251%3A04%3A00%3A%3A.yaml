simpleMeaning: an old method, no longer used, of putting matter from a smallpox blister into a person
  who could catch smallpox
scope: 'Another name for variolation: the old, no-longer-used way of giving smallpox matter to a person
  at risk, not a modern shot and not a cure for smallpox.'
examples:
- Variolization was used long ago to protect people against smallpox.
- In variolization, doctors took matter from a smallpox blister and put it into a healthy person.
