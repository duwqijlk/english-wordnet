simpleMeaning: A defence of the body against germs, chiefly against germs entering the body, carried out
  by B cells
scope: This is a defence of the body against germs, chiefly germs entering the body, carried out by B
  cells, not a defence carried out by T cells and not a fever.
examples:
- The humoral immune response fought the germs in his blood.
- A humoral immune response starts when B cells meet germs.
