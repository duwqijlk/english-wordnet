simpleMeaning: After an arm or a leg has been cut off, the false feeling that it is still there
scope: The false feeling that a cut-off arm or leg is still there, not a real arm or leg and not a dream.
examples:
- He felt a phantom limb itch where his leg had been.
- After the operation she still sensed her phantom limb at night.
