simpleMeaning: This writing shows what really happened in the past, not a made-up story or a tale passed
  down as myth
scope: Also called a historical document or a historical paper, this is writing kept for the true story
  of the past, not a made-up story or a tale passed down as myth.
examples:
- The museum holds a historical record of the town's first market.
- A historical record of the flood helped the town plan for the next one.
