senseId: unappeasable%5:00:00:implacable:00
synsetId: 01789850-s
simpleMeaning: Not to be soothed or won over, or moved by pleading.
scope: This sense is also called grim, stern, relentless, unrelenting, inexorable, and unforgiving, for
  not being to be soothed or won over, or moved by pleading, where grim is not able to be calmed or softened
  by begging or pleading, and stern is impossible to soften or move, even when people beg.
examples:
- He was unappeasable, not to be soothed.
- She was unappeasable, not moved by pleading.
