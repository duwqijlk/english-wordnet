simpleMeaning: having a very strong will and not giving up
scope: A person with a very strong will who does not give up; not a fact found by study, and not a time
  or place fixed by a person in charge.
examples:
- She was determined to finish the race, even when her legs hurt.
- The determined team kept working until the job was done.
