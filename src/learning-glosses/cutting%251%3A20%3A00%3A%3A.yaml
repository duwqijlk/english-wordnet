simpleMeaning: a part taken from a plant, sometimes a root, leaf or bud, used to grow a new plant by growing
  roots or by joining it to another plant
scope: 'Also called a slip: a piece taken from a plant to grow a new one; not shaping hard stuff, not
  pain that feels sharp, and not unkind speech.'
examples:
- She planted the cutting and watered it each day.
- He took a cutting from the rose bush to grow a new one.
