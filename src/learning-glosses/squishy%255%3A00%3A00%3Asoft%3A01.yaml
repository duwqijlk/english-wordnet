simpleMeaning: easy to press flat, and soft like a sponge, with many small holes, so it can be pressed
  into a smaller size
scope: 'Also called spongy, squashy and spongelike: soft and easy to press flat, not hard or firm.'
examples:
- The baby played with a soft, squishy ball.
- The bread felt squishy when I pressed it.
