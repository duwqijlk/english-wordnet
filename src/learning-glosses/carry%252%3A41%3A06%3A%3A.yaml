simpleMeaning: Do more yourself so that a weaker partner does not drag the effort down.
scope: Doing extra work to make up for a weak partner; not bearing a physical weight, not paying someone's
  costs, not a bill passing, and not the arithmetic, scent, or sailing senses here.
examples:
- I resent having to carry her through every match.
- He carried the team through the second half after their best player was injured.
