simpleMeaning: Without courage, manly strength, or firm purpose, and fearful in a shameful way
scope: Without courage, manly strength, or firm purpose, and fearful in a shameful way; unmanly and pusillanimous
  are other names for this sense, not brave and not simply shy.
examples:
- He gave a poor-spirited answer and ran off.
- The poor-spirited guard would not stand his ground.
