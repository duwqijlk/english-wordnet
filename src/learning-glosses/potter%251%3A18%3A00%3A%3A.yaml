simpleMeaning: a skilled person who shapes clay into pots and other things on a turning wheel and bakes
  them hard in a special hot oven
scope: This is a person who makes clay pots, also called a thrower, a ceramicist and a ceramist, not the
  verb sense of doing small jobs with no plan.
examples:
- The potter shaped the wet clay on her wheel.
- A potter baked the finished pots in a hot kiln.
