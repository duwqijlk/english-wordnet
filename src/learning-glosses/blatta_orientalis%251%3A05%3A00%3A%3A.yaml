simpleMeaning: A dark brown cockroach that came from the East and now lives almost everywhere.
scope: Also called the blackbeetle, the oriental cockroach, the oriental roach, and the Asiatic cockroach;
  a dark brown cockroach now found almost everywhere, not the small light-brown household kind.
