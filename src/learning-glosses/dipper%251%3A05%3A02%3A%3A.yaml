simpleMeaning: a small, thick bird that dives into water, has feet without skin between the toes, lives
  by fast streams, and eats from the bottom
scope: This bird is also called a water ouzel. It is not the small North American diving duck with thick
  head feathers, which shares the same name.
examples:
- A dipper stood on a rock in the fast stream.
- The dipper dived under the water to find food at the bottom.
