senseId: 'anaclisis%1:26:00::'
synsetId: 13953758-n
simpleMeaning: In psychoanalysis, this is a bond in which a person leans hard on others, above all tied
  by strong desire to a parent-like person, for example.
scope: In psychoanalysis, this is a bond of strong need for others, above all a tie of strong desire to
  a parent-like person, not a bond between people who stand on their own.
examples:
- His anaclisis showed in his strong need to lean on others.
- Her anaclisis kept her tied to a parent-like figure.
