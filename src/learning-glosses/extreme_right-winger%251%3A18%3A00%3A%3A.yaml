simpleMeaning: a person who holds to the old ways with great force and fights against change and new ideas
  about freedom
scope: 'Also called a reactionary and an ultraconservative: a person who stands against change, not a
  mild conservative and not a supporter of new ideas.'
examples:
- The extreme right-winger opposed every reform the parliament proposed.
- The extreme right-winger spoke out against plans to widen the vote.
