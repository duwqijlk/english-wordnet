synsetId: 05491040-n
simpleMeaning: dull-colored nerve tissue made of nerve-cell bodies and thin threads; it makes up the outer
  layer of the brain, where the nerve cells have no fatty coat
scope: Also called gray matter, gray substance, grey matter, and substantia grisea; the outer layer of
  the brain, not the white nerve tissue beneath it.
examples:
- The grey substance of the brain holds the bodies of nerve cells.
- In the grey substance, nerve cells send signals without a fatty coat.
