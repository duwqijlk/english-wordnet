simpleMeaning: An evergreen tree of the West Indies and Central America, with dark green leaves, golden
  and silky underneath, and purple fruit that can be eaten, star-shaped when cut
scope: Among evergreen fruit trees of the West Indies and Central America, this one has purple fruit that
  is star-shaped when cut and dark green leaves with golden, silky undersides; caimito and star apple
  are other names for it.
examples:
- Chrysophyllum cainito grows in the garden in Jamaica.
- We ate Chrysophyllum cainito fruit, purple outside and star-shaped inside.
