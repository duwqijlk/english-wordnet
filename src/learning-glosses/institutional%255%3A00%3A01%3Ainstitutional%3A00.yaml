simpleMeaning: like something from a large organization, above all in being all the same, dull, and lacking
  fresh ideas
scope: Like something from a large organization, in being all the same, dull, and without fresh ideas;
  not merely something that belongs to or forms an organization.
examples:
- The hospital served bland institutional food on grey trays.
- Her room had the same institutional furniture as every other room in the block.
