senseId: 'languisher%1:18:00::'
synsetId: 10266092-n
simpleMeaning: a person who slowly loses strength and spirit
scope: A person who slowly loses strength and spirit; not someone who is briefly tired after work, and
  not someone who is resting by choice.
examples:
- The languisher sat by the window all day, too weak to go out.
- She was a languisher after her long illness, with little strength left.
