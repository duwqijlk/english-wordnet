simpleMeaning: The male of a toad of Europe carries eggs that have been fertilised, wrapped round its
  back legs, till they hatch.
scope: This is a toad of Europe whose male bears the eggs; obstetrical toad is another name for this sense.
examples:
- The male midwife toad carries the eggs round its back legs until they hatch.
- Until the eggs hatch, the male midwife toad bears them wrapped round its back legs.
