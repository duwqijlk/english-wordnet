simpleMeaning: A woman who ranks above all other competitors in her sport or contest.
scope: This is a woman who outranks other competitors in her sport or contest; it is not a woman or thing
  considered the best or most important of her kind in general, not a female ruler, not the playing card,
  and not the naked mole rat that is the colony's only breeder.
examples:
- For a decade she was the queen of women's tennis.
- The defending queen of the spelling bee lost her title this year.
