synsetId: 08392081-n
simpleMeaning: A group of free states round the world, joined in loyalty to one head, yet under the rule
  of neither that head nor each other.
scope: A world group of free states joined in loyalty to one head, yet under the rule of neither that
  head nor each other; not the name of certain states in the United States, such as Massachusetts and
  Virginia, and of Puerto Rico.
examples:
- The commonwealth met once a year to talk over shared concerns.
- India is a member of the commonwealth.
