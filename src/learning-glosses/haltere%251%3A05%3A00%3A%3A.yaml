simpleMeaning: To keep a two-winged insect steady in the air, one of its two small back wings, which never
  fully grew, works as a balance.
scope: Also called a halter or a balancer, this is one of the two small back wings of a two-winged insect,
  used to keep it steady in the air.
examples:
- The fly's haltere kept it steady in the air.
- Each haltere helps the insect keep its balance in flight.
