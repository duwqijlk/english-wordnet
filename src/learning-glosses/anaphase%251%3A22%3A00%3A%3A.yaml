simpleMeaning: The step in cell division when the threads that carry what a cell inherits move to opposite
  ends of the thin frame inside the cell.
scope: The step in cell division when the threads that carry what a cell inherits move to opposite ends
  of the thin frame inside the cell, not the step when the threads line up in the middle and not the step
  when the cell splits in two.
examples:
- During anaphase the threads move to opposite ends of the cell.
- Anaphase comes after the threads line up in the middle.
