simpleMeaning: when evening comes, big white flowers open in bunches on a sticky-stemmed blue-green plant,
  their flower cups much swollen; it is sometimes put in the group Lychnis
scope: 'Also called white campion, bladder campion, and evening lychnis: a blue-green plant with sticky
  stems and big white flowers that open in the evening, not the red campion and not a garden pink.'
examples:
- White cockle grows along the path, its white flowers opening at dusk.
- The white cockle's swollen flower cups stood out among the other plants.
