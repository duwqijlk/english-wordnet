senseId: 'gag_reflex%1:04:00::'
synsetId: 00868101-n
simpleMeaning: A normal body action in which a person starts to retch; it can be set off by touching the
  soft back of the roof of the mouth.
scope: This is a normal body action of retching, also called a pharyngeal reflex; not coughing, and not
  the act of bringing food up from the stomach.
examples:
- The dentist tried not to set off her gag reflex.
- Touching the back of his mouth set off his gag reflex.
