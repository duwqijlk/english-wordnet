simpleMeaning: Any tiny living unit that wraps the nerve threads outside the brain and spine and makes
  the fatty coat around them.
scope: A tiny living unit that wraps nerve threads outside the brain and spine and makes their fatty coat,
  not a brain cell.
examples:
- Schwann cells wrap the nerve fibers outside the brain.
- A Schwann cell forms the fatty coat around a nerve thread.
