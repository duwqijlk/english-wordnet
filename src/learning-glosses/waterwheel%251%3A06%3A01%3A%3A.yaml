simpleMeaning: a wheel with buckets fixed around its outer edge, used to lift water from a stream or pond
scope: 'Also called water wheel: this wheel lifts water in buckets, not a wheel that is turned by moving
  water to make power.'
examples:
- The waterwheel lifted water from the stream into a channel for the fields.
- Buckets on the waterwheel carried pond water up as the wheel turned.
