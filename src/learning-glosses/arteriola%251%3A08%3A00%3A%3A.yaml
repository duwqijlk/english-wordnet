simpleMeaning: one of the small, thin-walled blood vessels that end in capillaries, the tiniest blood
  vessels
scope: 'Also called arteriole and capillary artery: a small, thin-walled blood vessel that ends in the
  tiniest vessels, not a big artery and not a vein.'
examples:
- Blood flows through an arteriola before it reaches the capillaries.
- Each arteriola ends in a network of capillaries.
