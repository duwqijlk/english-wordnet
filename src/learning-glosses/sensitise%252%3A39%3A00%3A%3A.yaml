simpleMeaning: to cause someone to feel or notice something, and to make them more able to feel it
scope: To cause someone to feel or notice something; sensitize is another name for this act, not making
  a person aware of a feeling and not making a thing react to light or to a drug.
examples:
- The training sensitised the dogs to the scent.
- His tongue was sensitised to good wine by years of tasting.
