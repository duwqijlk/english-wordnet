scope: These are flat worms that live on or in another living thing and hold on with cups on the outside,
  also called flukes or trematode worms, and not round worms or free-living flat worms.
examples:
- The trematode clings to the fish with the cups on its body.
- A trematode can live inside the gut of a sheep.
