simpleMeaning: a flat piece of land on a slope, with steep land above it and steep land below it
scope: Also called bench. This is flat land on a slope, not the paved area by a house and not a row of
  houses joined together.
examples:
- Farmers planted rice on a terrace cut into the hillside.
- From the terrace, we could see steep land above us and below us.
