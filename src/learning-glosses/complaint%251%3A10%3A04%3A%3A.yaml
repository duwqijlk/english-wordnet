simpleMeaning: In criminal law, a paper given to a court that describes a wrong act or crime
scope: 'Also called charge: in criminal law, a court paper about a wrong act or crime; it is not the civil-law
  paper that starts a case, and not a spoken expression of being unhappy.'
examples:
- The police filed a complaint describing the theft.
- A complaint was brought to the court, saying he had broken the law.
