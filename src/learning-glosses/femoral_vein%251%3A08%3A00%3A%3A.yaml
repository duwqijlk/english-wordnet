simpleMeaning: A vein that runs with the femoral artery in the same sheath, going on from the popliteal
  vein and turning into the outer iliac vein.
scope: A vein that runs with the femoral artery in the same sheath, going on from the popliteal vein and
  turning into the outer iliac vein, also called vena femoralis.
examples:
- The femoral vein runs with the artery.
- The femoral vein turns into the outer iliac vein.
