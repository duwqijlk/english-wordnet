simpleMeaning: a hollow space in the nose passages, behind the bridge of the nose
scope: A hollow space in the nose passages behind the bridge of the nose, also called an ethmoid sinus
  and an ethmoidal sinus; not the main nose passage and not a bone.
examples:
- The sinus ethmoidales lie behind the bridge of the nose.
- Air moves through the sinus ethmoidales in the nose.
