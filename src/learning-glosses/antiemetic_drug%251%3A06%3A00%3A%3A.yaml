simpleMeaning: a medicine that keeps sickness and vomiting away or makes them less bad
scope: 'Also called antiemetic: a medicine that stops or eases sickness and vomiting, not a medicine that
  brings on vomiting and not a painkiller.'
examples:
- The nurse gave him an antiemetic drug after the operation.
- She took an antiemetic drug to stop the vomiting.
