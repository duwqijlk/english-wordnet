simpleMeaning: With a long curving beak, this plant of the southern United States and Mexico lives for
  one year and bears large whitish or yellowish flowers marked with purple
scope: Common devil's claw, common unicorn plant, elephant-tusk, proboscis flower, and ram's horn are
  other names for this one-year plant, which does not live for years.
examples:
- The devil's claw bore large pale flowers marked with purple.
- Devil's claw grows in the southern United States and Mexico.
