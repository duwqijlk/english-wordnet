simpleMeaning: The part of medicine that deals with sicknesses of the blood and the organs that make blood.
scope: The part of medicine that deals with sicknesses of the blood and the organs that make blood; hematology
  is another name for it, not a measure of red blood cells in the blood and not a stuff that breaks red
  blood cells apart.
examples:
- She studied haematology to learn about sicknesses of the blood.
- Haematology deals with the blood and the organs that make blood.
