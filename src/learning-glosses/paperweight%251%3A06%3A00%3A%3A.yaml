simpleMeaning: a heavy thing put on top of a pile of papers to keep them in place
scope: A heavy thing that holds papers down on a desk, not a weight used to measure how heavy something
  is.
examples:
- She put a glass paperweight on the letters.
- The paperweight kept the papers from blowing away.
