simpleMeaning: A lizard of the deserts of the United States and Mexico, with long pointed scales round
  its toes.
scope: 'Also called a fringe-toed lizard: a lizard of the deserts of the United States and Mexico, with
  long pointed scales round its toes, different from other desert lizards and from the lizards of wet
  lands.'
examples:
- Uma notata ran across the hot sand.
- An Uma notata basked on a rock in the desert.
