synsetId: 05790242-n
simpleMeaning: 'A way of working on a hard question: list what might be true, then rule out each wrong
  choice in turn'
scope: 'Also called elimination: working on a hard question by ruling out wrong choices one after another,
  not guessing and not trying each choice in turn.'
examples:
- By reasoning by elimination, she crossed off each suspect until one was left.
- His reasoning by elimination left only one place the keys could be.
