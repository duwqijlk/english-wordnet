simpleMeaning: A sore with clear edges on the skin or on a wet inner surface of the body, where the flesh
  is swollen, often oozing, and the tissue dies
scope: A sore on skin or on a wet inner surface where tissue dies, not a plain cut and not a bruise.
examples:
- The ulcer on his foot took weeks to heal.
- She had an ulcer in her stomach that made eating painful.
