simpleMeaning: A person who finds customers for women who sell sex; in England, such a person is called
  a ponce.
scope: A person who finds customers for women who sell sex, not a customer and not a woman who sells sex.
examples:
- The police arrested the pimp who had been taking money from the women.
- In the film, a pimp waits outside the club for customers.
