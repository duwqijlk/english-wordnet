simpleMeaning: To go on foot with hard, heavy steps, the way you do when you are worn out or the ground
  is muddy
scope: To go on foot with hard, heavy steps, not a block of ink, not the soft part under a foot, and not
  a leaf floating on water.
examples:
- The mules padded in a circle around the grindstone.
- Tired and wet, she padded through the mud to the gate.
