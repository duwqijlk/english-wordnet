simpleMeaning: the sound you make when you move your hand across the strings of a guitar or another music
  tool with strings
scope: This is the sound itself, not the act of moving a hand across strings to make it.
examples:
- The soft strum of a guitar filled the quiet room.
- I heard one short strum, then the music started.
