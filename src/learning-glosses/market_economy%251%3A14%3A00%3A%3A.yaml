simpleMeaning: A way of running a country's trade in which buyers and sellers mostly set what is made,
  how goods and other things are shared out, and what things sell for
scope: A way of running a country's trade in which buyers and sellers mostly set what is made, how goods
  and other things are shared out, and what things sell for, also called free enterprise and laissez-faire
  economy; not a planned economy run by the state.
examples:
- In a market economy, prices are set by buyers and sellers.
- The country moved to a market economy after years of state control.
