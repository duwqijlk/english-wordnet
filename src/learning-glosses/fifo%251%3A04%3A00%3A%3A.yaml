simpleMeaning: A way of keeping stock books in which the goods that came in first are taken to be the
  goods sold first
scope: 'Also called first in first out: a way of keeping stock books in which the goods that came in first
  are taken to be the goods sold first.'
examples:
- Under FIFO, the oldest stock is sold first.
- The shop used FIFO to work out the cost of its goods.
