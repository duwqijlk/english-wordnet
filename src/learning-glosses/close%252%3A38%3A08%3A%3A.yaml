schema: oewn-learning-gloss-v2
senseId: 'close%2:38:08::'
synsetId: 02108781-v
simpleMeaning: to shift your body so that your leading shoulder and foot move nearer the target you mean
  to hit
scope: This is the fighting-stance sense, not to shut something, not to stop operating or end a meeting,
  not to finish a business deal, not to come near, not to bring parts together, not to finish a baseball
  game while protecting a lead, not to close a window on a computer screen, and not to engage an enemy
  at close quarters.
examples:
- The coach told him to close his stance before throwing the punch.
- The fighter closed her stance, moving her lead shoulder and foot toward the target.
