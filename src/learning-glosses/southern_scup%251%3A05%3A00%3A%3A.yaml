simpleMeaning: a fish that lives in the sea water off the Atlantic coast of North America, toward the
  lower part of that coast
scope: A fish that lives in the sea water off the Atlantic coast of North America, also called scup and
  southern porgy; not a fish of cold northern waters and not a fresh-water fish.
examples:
- A southern scup darted through the warm water near the shore.
- The net brought up a southern scup from the Atlantic coast.
