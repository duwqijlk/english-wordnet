senseId: 'stretch%2:30:15::'
synsetId: 00488684-v
simpleMeaning: To make something weaker or less pure by adding material that does not belong or is poor
  in quality, often swapping good ingredients for poor ones.
scope: This is about spoiling a substance's quality with inferior material, not about making a food go
  further with a cheap filler or making something longer.
examples:
- Some merchants stretch wine by adding water.
- Tests showed the honey had been stretched with cheap syrup.
