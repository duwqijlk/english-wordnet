simpleMeaning: A hanging cloth hiding the stage from the audience, rising or parting at the start and
  descending or closing between acts and at the end of the performance.
scope: Also called theatre curtain, it is the hanging cloth that hides the stage from the people watching
  and moves at the start, between acts, and at the end.
examples:
- The theater curtain rose slowly as the play began.
- When the theater curtain fell, the audience clapped.
