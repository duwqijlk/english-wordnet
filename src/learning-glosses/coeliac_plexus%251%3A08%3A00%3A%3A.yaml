simpleMeaning: A big net of sympathetic nerves (nerves that work without thought) in the belly, just behind
  the stomach.
scope: This is a big net of sympathetic nerves (nerves that work without thought) in the belly, just behind
  the stomach; abdominal nerve plexus and plexus celiacus are other names for it, not a net of nerves
  in the chest and not a single nerve.
examples:
- The coeliac plexus carries signals from the belly organs.
- Pain from the coeliac plexus can spread across the belly.
