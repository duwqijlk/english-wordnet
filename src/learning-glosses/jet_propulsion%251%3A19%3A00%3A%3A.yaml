simpleMeaning: Moving forward by pushing out a fast stream of liquid or gas behind.
scope: Moving forward by pushing out a stream behind, not by wheels or by a propeller pulling from the
  front.
examples:
- Jet propulsion drives the aircraft forward at great speed.
- The rocket uses jet propulsion to lift off the ground.
