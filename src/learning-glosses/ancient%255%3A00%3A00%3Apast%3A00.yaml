simpleMeaning: from the very distant past, especially the period before the Western Roman Empire ended.
scope: This describes things from long ago, not a living person who is simply old, and not the noun for
  a person of that era.
examples:
- The museum holds ancient pottery from Egypt.
- They studied ancient Rome at school.
