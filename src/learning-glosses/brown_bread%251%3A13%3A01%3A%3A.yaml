simpleMeaning: A loaf made from cornmeal, wheat, and flour, with molasses and soda and milk or water,
  that is dark and steamed.
scope: This is a loaf made from cornmeal, wheat, and flour, with molasses and soda and milk or water,
  dark and steamed rather than pale.
examples:
- This brown bread was made with cornmeal and wheat.
- We ate brown bread made with molasses and soda.
