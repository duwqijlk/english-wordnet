simpleMeaning: A pale powder of tiny hard bits, sold as Merthiolate, used to kill germs on skin before
  an operation
scope: This is a pale powder, sold as Merthiolate, used to kill germs on skin before an operation, also
  called sodium ethylmercurithiosalicylate; not a general wound antiseptic and not a cleaning powder.
examples:
- Thimerosal, sold as Merthiolate, was used to kill germs on skin before operations.
- The nurse dabbed thimerosal on the skin before the cut.
