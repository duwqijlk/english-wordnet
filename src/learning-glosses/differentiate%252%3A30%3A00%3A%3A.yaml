simpleMeaning: to become different from others and take on a character of its own
scope: To become different from others and take on a character of its own, not to work out a derivative
  in maths and not to mark something as different.
examples:
- Over the years the two villages differentiated, each taking on a character of its own.
- The two shops differentiated over time, one becoming a bakery and the other a bookshop.
