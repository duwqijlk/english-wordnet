simpleMeaning: any of several kinds of dog, usually with long hair, that are kept to move sheep together
  and keep them safe
scope: This is a dog kept for work with sheep, not a pet dog in general and not a dog that only guards
  a house.
examples:
- The sheepdog ran around the sheep and brought them back to the field.
- Our sheepdog watches the sheep at night and keeps foxes away.
