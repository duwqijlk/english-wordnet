simpleMeaning: Toothed wheels joined together so that turning one turns the others, passing on power and
  changing speed or the strength of the turn
scope: 'Also called train: a set of wheels with teeth that turn together to pass on power, not a single
  toothed wheel, not a steering part, and not the things you use for a job or sport.'
examples:
- The fool got his tie caught in the geartrain.
- The gears in the clock pass power from one wheel to the next.
