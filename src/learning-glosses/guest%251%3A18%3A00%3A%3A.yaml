simpleMeaning: a person who visits someone and is welcomed, given food, drink, or a place to stay
scope: A person welcomed as a visitor; not a paying customer at a hotel or restaurant, and not someone
  who lives in the house.
examples:
- We had guests for dinner last night.
- She was a guest at their wedding.
