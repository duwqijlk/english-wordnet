synsetId: 00550803-n
simpleMeaning: a player calls up feelings and responses from his or her own life to live as the part,
  in a way of playing started by Stanislavsky
scope: Also called method, it is the way of playing in which a player lives as the part by drawing on
  his or her own feelings.
examples:
- She studied method acting to play her part from her own feelings.
- Method acting asks the player to recall feelings from his or her own life.
