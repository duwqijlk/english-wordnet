simpleMeaning: one part of a larger whole, such as a person, group or structure.
scope: This is not a standard amount used for measuring, like a metre or a kilogram; it is one part of
  a whole.
examples:
- The family is the basic unit of society.
- Each unit of the course has three lessons.
