simpleMeaning: A measure for how much a thing holds, set by law in Britain; British measures hold both
  dry goods and liquids.
scope: This is a measure for how much a thing holds, set by law in Britain, for both dry goods and liquids;
  British capacity unit is another name for it; not a measure of length and not a measure of weight.
examples:
- The imperial capacity unit was used for both dry goods and liquids.
- An imperial capacity unit measured how much a jar could hold.
