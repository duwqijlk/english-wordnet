simpleMeaning: an electronic machine that picks up signals sent out for it and shows pictures on a screen
scope: The machine itself, also called television, and in British speech also called telly; not the programmes
  shown on it and not the system of sending them.
examples:
- They bought a new tv for the living room.
- The tv in the corner stayed on all evening.
