simpleMeaning: having real value and deserving respect, and being good and honest in a way people admire
scope: This sense means valuable and deserving respect in general; it is not the sense of being good enough
  to be chosen as a husband or wife, and not only about having skills that deserve notice.
examples:
- He is a worthy leader who always puts other people first.
- They gave their time and money to a worthy cause.
