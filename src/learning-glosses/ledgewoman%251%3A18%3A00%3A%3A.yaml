simpleMeaning: A woman breaks off big blocks of stone in a stone pit
scope: A woman who works in a stone pit breaking off big blocks of stone, not the male worker of the same
  job and not a woman who cuts stone into shape.
examples:
- The ledgewoman split a clean block from the rock face.
- A ledgewoman was the first to reach the new seam.
