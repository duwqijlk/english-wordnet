simpleMeaning: a flat bar you press with your foot to open or shut the valve that sets how fast an engine
  runs
scope: Also called gun, gas, throttle, accelerator or gas pedal; a foot control for an engine's speed,
  not the brake and not the clutch.
examples:
- He pressed the accelerator pedal to speed up on the motorway.
- She eased off the accelerator pedal as she neared the bend.
