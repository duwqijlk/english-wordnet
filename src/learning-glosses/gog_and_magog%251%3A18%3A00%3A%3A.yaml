simpleMeaning: The names of the enemies of God's people in the Bible, who wage war on God at the end of
  the world.
scope: The names in the Bible of the enemies of God's people who wage war on God at the end of the world,
  set beside Satan and the Antichrist, other foes of the last days.
examples:
- In the Bible, Gog and Magog are the foes who wage war at the end of the world.
- Gog and Magog stand for the last enemies of God's people.
