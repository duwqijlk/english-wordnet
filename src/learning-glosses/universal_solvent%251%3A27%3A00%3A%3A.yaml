simpleMeaning: a liquid that does not exist, once sought in old times by people who hoped it would dissolve
  anything
scope: 'Also called alcahest and alkahest: a liquid that was never found, not a real liquid used to dissolve
  things.'
examples:
- The alchemists sought a universal solvent that could dissolve any substance.
- No universal solvent was ever found, though alchemists searched for one for years.
