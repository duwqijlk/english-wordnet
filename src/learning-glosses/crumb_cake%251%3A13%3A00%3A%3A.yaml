simpleMeaning: A sweet baked food, or a coffee-time baked food, with a top of sugar, butter and flour
  mixed together
scope: This is a sweet baked food with a sugary topping, not a plain loaf and not a frosted cake.
examples:
- She baked a crumb cake for breakfast.
- A slice of crumb cake goes well with coffee.
