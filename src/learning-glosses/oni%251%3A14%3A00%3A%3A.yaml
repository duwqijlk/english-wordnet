simpleMeaning: The navy spy service of the United States, which gathers secret news, blocks enemy spies,
  looks into wrongdoing, and keeps navy secrets safe.
scope: Also called the Office of Naval Intelligence; the navy spy service, not the army spy service and
  not the navy itself.
examples:
- ONI tracked the enemy fleet.
- She works for ONI in Washington.
