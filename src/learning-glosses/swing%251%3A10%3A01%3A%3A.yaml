simpleMeaning: 'A jazz style popular in the 1930s, played by large bands: flowing rhythms, less intricate
  than the styles that came after.'
scope: 'Another name for jive or swing music: the big-band jazz style, not the jaunty rhythm, a playground
  seat, or a golf stroke.'
examples:
- The band played swing all night at the dance hall.
- Young dancers filled the club whenever the orchestra played swing.
