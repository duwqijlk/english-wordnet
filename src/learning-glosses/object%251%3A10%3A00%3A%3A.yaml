senseId: 'object%1:10:00::'
synsetId: 06321227-n
simpleMeaning: In grammar, the word or phrase in a sentence that the verb's action is done to.
scope: The grammar part that receives the action, not a physical thing, a computing item or the act of
  protesting.
examples:
- In 'She read the letter', 'the letter' is the object of the verb.
- The teacher asked the class to underline the object in each sentence.
