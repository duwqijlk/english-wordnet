simpleMeaning: In a way that leaves a person with no guard against harm.
scope: 'Also called defenseless, defenceless and defenselessly: in a way that leaves a person with no
  guard against harm, not in a weak way by choice and not in a careless way.'
examples:
- The child stood defencelessly in the middle of the road.
- She faced the crowd defencelessly, with no guard at all.
