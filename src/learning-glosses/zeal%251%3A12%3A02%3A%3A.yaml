simpleMeaning: too strong a wish and too much energy to do a thing or to reach a goal
scope: This is a drive to act that is too strong, not just normal keen interest in a thing and not calm,
  steady work on it.
examples:
- His zeal for winning led him to train all night, every night.
- She worked with such zeal to finish the road that she forgot to rest.
