simpleMeaning: a wild plum of California that stays green all year, with prickly, leathery foliage and
  white flowers
scope: A wild plum of California that stays green all year, with prickly, leathery foliage and white flowers;
  evergreen cherry, holly-leaf cherry and islay are other names for this sense, not a garden cherry and
  not a holly tree.
examples:
- Holly-leaved cherry lines the canyon paths near the coast.
- We found a holly-leaved cherry in bloom beside the trail.
