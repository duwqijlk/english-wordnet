simpleMeaning: giving the main place to things as they are seen, and not letting the maker's own feelings
  or ideas change how they are shown
scope: About how a work shows or stresses things as they are seen, with no change from personal feelings;
  not a fair, fact-based judgment in general, not the lens sense, and not the grammar sense.
examples:
- The painter chose an objective style and painted the street just as it looked, with none of her own
  feelings added.
- His objective writing describes the room just as it is seen and leaves out what he thinks about it.
