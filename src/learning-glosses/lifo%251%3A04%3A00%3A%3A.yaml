simpleMeaning: A way of counting stock in which the newest goods are counted as sold first
scope: A way of counting stock, also called last in first out, not a way of counting the oldest goods
  first and not a way of pricing goods.
examples:
- The shop uses LIFO for its stock.
- Under LIFO, the newest goods are counted as sold first.
