simpleMeaning: Moving from place to place most of the time, a community feeds itself on what it can chase,
  catch, and pick in the wild.
scope: Also called a hunting and gathering society, this community lives off wild food and moves from
  place to place.
examples:
- The hunting and gathering tribe moved from place to place.
- The hunting and gathering tribe fed itself on wild animals and plants.
