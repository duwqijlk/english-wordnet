simpleMeaning: The way of life that grew up in Europe in the 8th century, in which lords kept vassals
  safe and the vassals had to serve them in war.
scope: The way of life that grew up in Europe in the 8th century, in which lords kept vassals safe and
  the vassals had to serve them in war, also called feudalism; not a kingdom ruled by one king and not
  a modern state.
examples:
- Under the feudal system, a vassal owed his lord service in war.
- The feudal system shaped life in Europe for hundreds of years.
