simpleMeaning: a jelly food, sweet or strong in taste, made with a clear substance from animal skin and
  bone, used as a sweet dish, a salad base, or covering for food
scope: 'Also called jelly: this is the soft food itself, not the clear substance used to make it and not
  a thin sheet put over stage lights.'
examples:
- The gelatin was served in small bowls as a sweet dessert.
- A thin layer of gelatin covered the cold meat.
