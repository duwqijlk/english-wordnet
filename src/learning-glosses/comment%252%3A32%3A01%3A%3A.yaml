simpleMeaning: To add notes between the lines of a text, explaining the words or phrases printed there.
scope: This is the act of adding notes between the lines of a text, not a spoken opinion, a written remark
  on a book, or gossip about other people, and it is narrower than making any remark or explaining something
  in general.
examples:
- The teacher commented the passage line by line, writing a short note above each unfamiliar word.
- The old edition had been commented in a careful hand, with explanations squeezed between the lines of
  every page.
