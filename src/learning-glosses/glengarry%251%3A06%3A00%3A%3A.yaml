simpleMeaning: A cap from Scotland with straight sides and a fold down the middle of the top, worn by
  Highland soldiers as part of their dress
scope: A Highland cap with a fold along the top, worn as part of military dress; the soft round tam o'shanter
  and the flat Balmoral are other Scottish caps.
examples:
- He wore a Glengarry with his Highland dress.
- The Glengarry sat straight on his head.
