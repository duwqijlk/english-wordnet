simpleMeaning: the common way of treating a sick person with medicines that have effects unlike the effects
  of the illness itself
scope: The common way of treating illness with medicines whose effects are unlike the illness's effects;
  not homeopathy, which uses medicines that cause the same effects as the illness, and not surgery.
examples:
- He trusted allopathy and took a medicine that worked against his illness.
- The clinic follows allopathy, giving drugs whose effects are unlike those of the disease.
