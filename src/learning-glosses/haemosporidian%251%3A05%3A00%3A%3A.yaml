simpleMeaning: Tiny one-celled living things that live as parasites in the blood cells of animals with
  backbones, at some stage of their lives, and many of them cause sickness.
scope: Tiny one-celled living things that live as parasites in the blood cells of animals with backbones,
  at some stage of their lives, and many of them cause sickness; not a tiny living thing tied to the malaria
  germ with a stage in birds' inner organs and not a tiny bit of matter that acts strongly on other bits.
examples:
- Haemosporidians live in the blood cells of birds and other animals.
- The haemosporidian spent part of its life in the blood cells of an animal with a backbone.
