simpleMeaning: The sense that lets the mouth tell sweet, sour, bitter and salty tastes apart
scope: This is the sense that lets the mouth tell sweet, sour, bitter and salty tastes apart; taste, gustation
  and sense of taste are other names for this sense, not the sense of smell and not the act of eating.
examples:
- A cold can dull the gustatory modality for days.
- The gustatory modality helps us tell sweet from sour.
