simpleMeaning: A mark that looks like an eye, usually a spot of one color inside a ring of another color,
  as on a butterfly's wings
scope: 'Also called an ocellus: a mark that looks like an eye, not a real eye and not a plain spot of
  color.'
examples:
- The butterfly's eyespot stared back from its wing like a watching eye.
- Each eyespot on the moth's wing had a dark center ringed with gold.
