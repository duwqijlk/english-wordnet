simpleMeaning: A mammal whose young grow inside the mother before birth, fed through a placenta, the organ
  that joins mother and young; all mammals except egg-laying ones and pouch-bearing ones.
scope: A mammal whose young grow inside the mother; also called a placental, a eutherian mammal, or a
  placental mammal, not an egg-laying mammal and not a pouch-bearing mammal.
examples:
- Eutherians include dogs, whales, and people.
- The eutherian carries its young inside the body until birth.
