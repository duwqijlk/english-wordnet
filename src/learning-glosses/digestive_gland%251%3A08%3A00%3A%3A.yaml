simpleMeaning: Any body part that makes juices and sends them through tubes into the gut
scope: A body part that pours juices into the gut through tubes, not a part that stores food and not a
  duct itself.
examples:
- A digestive gland pours its juices into the gut after a meal.
- The liver is a digestive gland that sends bile into the gut.
