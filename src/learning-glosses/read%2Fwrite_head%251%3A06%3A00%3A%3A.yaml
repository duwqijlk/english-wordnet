simpleMeaning: Magnetic marks are put on a disk, and taken off again to use, by this tiny coil worked
  by a magnet, with a metal rod.
scope: Also called a head, it is the tiny coil and metal rod that put magnetic marks on a disk and take
  them off again to use.
examples:
- The read/write head moved across the disk.
- The read/write head wrote new marks on the disk and read them back.
