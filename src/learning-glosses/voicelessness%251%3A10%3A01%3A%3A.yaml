senseId: 'voicelessness%1:10:01::'
synsetId: 92423912-n
simpleMeaning: In phonetics, t, s, and f are the kind of sounds said with the cords in the throat kept
  still, not shaken.
scope: In phonetics, a consonant said with no shake of the cords in the throat; not a consonant said with
  the cords shaking.
examples:
- The voicelessness of the t in 'top' comes from the still cords.
- Voicelessness marks sounds like s and f.
