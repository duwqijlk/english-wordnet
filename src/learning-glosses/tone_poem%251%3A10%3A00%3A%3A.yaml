simpleMeaning: a piece of music for a large group of players that tells a story from a book or an old
  tale
scope: A piece for a large group of players that tells a story from a book or an old tale; symphonic poem
  is another name for this. Not a song with words, and not a piece of music with no story at all.
examples:
- The orchestra played a tone poem based on an old folk tale.
- His tone poem tells the story of a hero from a book.
