simpleMeaning: A face or thing whose edges form a neat, clear line, as if cut exactly by a sharp tool
scope: A face or thing with edges that stand out in a neat, clear line, not a rough shape and not simply
  a handsome face.
examples:
- His chiseled nose stood out in the portrait.
- Her chiseled features were clear in the photograph.
