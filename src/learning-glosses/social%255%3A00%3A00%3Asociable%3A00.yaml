simpleMeaning: Made up of people who enjoy each other's company, or set up so that members can spend time
  together.
scope: This describes a group or organization, not a friendly mood or a single pleasant occasion.
examples:
- She belongs to a social club that meets on Thursdays.
- The firm's social committee arranges outings and parties.
