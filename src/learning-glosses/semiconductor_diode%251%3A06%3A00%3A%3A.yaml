simpleMeaning: a piece of a special material that has a p-n junction, a join between two kinds of that
  material
scope: This is a piece of special material with a p-n junction; diode, crystal rectifier and junction
  rectifier are other names for this sense, and it is not a plain wire or a part that stores power.
examples:
- The radio broke because a semiconductor diode in it had failed.
- She soldered a semiconductor diode into the circuit.
