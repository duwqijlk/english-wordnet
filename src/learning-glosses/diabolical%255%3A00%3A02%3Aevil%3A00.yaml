simpleMeaning: showing sly cleverness or great evil, like a devil
scope: 'Also called devilish, diabolic, mephistophelean and mephistophelian: showing sly cleverness or
  evil like a devil, not the sense that means only very evil or cruel.'
examples:
- His diabolical plan used clever tricks to harm others.
- She gave a diabolical smile as she set her sly trap.
