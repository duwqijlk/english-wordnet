simpleMeaning: One of many turning rods, this is the line that bigger turning parts spin around
scope: Also called arbor, spindle and mandril, this is one of many turning rods, the line that bigger
  turning parts spin around, not a fixed rod and not the part that spins itself.
examples:
- The mandrel held the wheel while it turned.
- He fixed the metal disc on the mandrel before switching the lathe on.
