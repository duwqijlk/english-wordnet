senseId: 'radical_hysterectomy%1:04:00::'
synsetId: 00678677-n
simpleMeaning: The small glands near the womb, the neck of the womb, the egg sacs and tubes, and the womb
  itself are all taken out in this operation.
scope: This operation, also called panhysterectomy, takes out the womb and the parts round it rather than
  the womb alone.
examples:
- A radical hysterectomy takes more than the womb.
- The radical hysterectomy left no womb behind.
