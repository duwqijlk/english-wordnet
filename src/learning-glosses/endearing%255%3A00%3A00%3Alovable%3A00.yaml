simpleMeaning: easy to love, especially in a child-like way or in a simple way that shows little knowledge
  of the world
scope: 'Also called lovely and adorable: easy to love in a child-like way or in a simple way that shows
  little knowledge of the world, not just good to look at or kind.'
examples:
- Her endearing smile made everyone in the room feel warm towards her.
- The little boy had an endearing way of asking questions about everything he saw.
