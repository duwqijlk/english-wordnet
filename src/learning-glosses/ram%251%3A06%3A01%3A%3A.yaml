simpleMeaning: The main short-term store of a computer, holding work while on; a chip where any bit can
  be read or written in any order, each spot as quick to reach.
scope: Not the disk that keeps work when the machine is off; also called random-access memory, random
  access memory, random memory and read/write memory.
examples:
- Adding more RAM made the computer run faster.
- The RAM holds the file while you work on it.
