simpleMeaning: On the Pacific coast of northwestern America grows a very tall tree with long curving branches
  and deep green leaves.
scope: Also called a grand fir, a lowland fir or a lowland white fir, this is the very tall tree of the
  Pacific coast of northwestern America, with long curving branches and deep green leaves.
examples:
- The giant fir towered over the other trees on the coast.
- Long curving branches marked the giant fir in the forest.
