simpleMeaning: a grass with soft, fine hairs on its leaves that lasts for one year, or for one cold season,
  and comes from the lands around the Mediterranean Sea
scope: 'Also called cheatgrass, downy brome, downy bromegrass, downy cheat, and drooping brome: a grass
  with soft-haired leaves from the Mediterranean that lasts for one year, or one cold season, not a grass
  that lives for many years and not a grass with smooth leaves.'
