simpleMeaning: Farmers sometimes grow this plant of Europe to feed farm animals or to feed the soil; it
  lives for years and bears purple and pink flowers marked with spots.
scope: 'Also called flat pea: a plant of Europe that lives for years, with purple and pink flowers marked
  with spots, sometimes grown to feed farm animals or to feed the soil.'
examples:
- The narrow-leaved everlasting pea has purple and pink flowers marked with spots.
- Farmers sometimes grow the narrow-leaved everlasting pea to feed the soil.
