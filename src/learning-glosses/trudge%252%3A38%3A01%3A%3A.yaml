simpleMeaning: to walk with heavy, firm steps, as when you are tired or going through mud
scope: 'Also called pad or tramp: to walk with heavy, firm steps when you are tired or in mud, not to
  walk in a light or easy way.'
examples:
- We trudged through the deep mud to reach the house.
- She trudged home after a long day at work, too tired to hurry.
