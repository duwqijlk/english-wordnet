simpleMeaning: a flying machine held up by level blades that spin on their own as it moves, pushed forward
  by a normal propeller
scope: Also called autogyro and gyroplane; a flying machine held up by spinning blades, not a helicopter
  and not an aeroplane.
examples:
- The autogiro rose slowly, its blades spinning above it.
- An autogiro needs a propeller to push it forward.
