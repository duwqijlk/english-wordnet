simpleMeaning: A soda salt of a phosphorus chemical in which soda takes the place of all three acid bits,
  used as a helper in soaps and cleaners
scope: A soda salt of a phosphorus chemical used as a helper in soaps and cleaners, also called trisodium
  orthophosphate and trisodium phosphate; not table salt and not a soap on its own.
examples:
- The cleaner held tribasic sodium phosphate to soften the water.
- Tribasic sodium phosphate helps detergents lift dirt.
