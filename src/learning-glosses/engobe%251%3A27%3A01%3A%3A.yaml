simpleMeaning: Thin wet clay, coloured with chemicals made from metals and air, or with stains, that people
  spread over a pot before or after its first firing.
scope: This is a coloured clay coat put on a pot, not a clear glaze and not plain wet clay.
examples:
- The engobe on the Greek pots stayed black even after they were fired again.
- She dipped the bowl in engobe before its first firing.
