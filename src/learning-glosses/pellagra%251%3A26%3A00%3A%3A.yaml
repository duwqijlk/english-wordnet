simpleMeaning: illness from too little niacin (a B vitamin) or tryptophan, or trouble making niacin; stomach
  upset, red skin, mental or nerve problems; can come from poor diet, alcohol or nutrition problems
scope: This is the common name for the disease also called maidism, mal de la rosa, mal rosso and mayidism,
  not a vitamin shortage by itself and not a skin complaint alone.
examples:
- Pellagra was once common in the southern United States.
- A diet heavy in corn and low in niacin can lead to pellagra.
