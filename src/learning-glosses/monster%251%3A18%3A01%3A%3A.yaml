simpleMeaning: a person or animal whose body is very unusual or badly formed.
scope: This describes an odd or deformed person or animal, not an evil person and not a malformed fetus.
examples:
- Villagers called the gentle giant a monster because of his strange shape.
- The circus once displayed a deformed animal as a monster.
