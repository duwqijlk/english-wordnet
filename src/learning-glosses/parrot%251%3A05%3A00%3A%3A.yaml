simpleMeaning: a bird from hot lands, usually with bright colors, a short curved beak, feet with two toes
  forward and two back, and that can copy sounds
scope: This sense is the real bird, not a person who copies words or acts without knowing what they mean.
examples:
- The parrot copied the man's voice from its cage.
- A bright green parrot sat in the tree and repeated the sound.
