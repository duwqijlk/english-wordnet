simpleMeaning: A body chemical made by a small gland at the base of the brain, which helps humans grow
scope: This is a body chemical that helps humans grow; human growth hormone, somatotrophic hormone, somatotrophin,
  somatotropic hormone and somatotropin are other names for this sense, not a body chemical that controls
  sleep and not a drug that builds muscle.
examples:
- Growth hormone helps children grow taller.
- The doctor tested the boy's growth hormone levels.
