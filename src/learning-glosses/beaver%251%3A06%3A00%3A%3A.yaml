simpleMeaning: a hat made from the fur of the animal, or from other stuff much like that fur
scope: A hat made of fur or of stuff much like fur, not the animal and not a part of a helmet.
examples:
- The old man wore a beaver to church.
- Her beaver hat kept her warm in the snow.
