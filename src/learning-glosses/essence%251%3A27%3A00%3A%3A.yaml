simpleMeaning: a strong substance that holds most of the main qualities of the plant, drug, or other natural
  product it was taken from
scope: A strong substance holding most of the main qualities of the plant, drug, or other natural product
  it was taken from; not a sweet-smelling liquid for the skin, and not the best part of an idea.
examples:
- Vanilla essence gives the cake its taste.
- A few drops of essence are enough for the whole pot.
