simpleMeaning: By chance, a simple chain of steps goes on, and what will be hangs only on where things
  are now, not on how they got there.
scope: Also called Markov process, this is a chain of steps where what comes next hangs only on where
  things are now, not a chain where the past matters.
examples:
- The Markoff process predicts the next state from the present one.
- In a Markoff process, the past does not shape what comes next.
