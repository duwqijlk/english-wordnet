simpleMeaning: Blood from the legs and belly organs flows into the back of the heart's right upper room
  through this blood vessel, formed where the two hip veins join.
scope: 'Also called the inferior vena cava: a blood vessel that brings blood from the lower body into
  the heart, not one that carries blood out to the body.'
examples:
- The postcava carries blood from the legs up to the heart.
- Doctors traced the blockage to the postcava, where the two hip veins join.
