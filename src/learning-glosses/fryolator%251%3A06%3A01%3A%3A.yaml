simpleMeaning: a kitchen machine that cooks food in a deep pan of hot oil, made in a size that fits the
  work it is meant for
scope: 'Also called a deep fat fryer, a deep fryer, a frier, or a fryer: a kitchen machine for cooking
  food in hot oil, not a pan for cooking on top of a stove and not a machine for cooking food in an oven.'
examples:
- The fryolator in the diner holds gallons of hot oil.
- She lowered the basket into the fryolator.
