senseId: 'partial_eclipse%1:11:00::'
synsetId: 07383944-n
simpleMeaning: An occasion when one body in the sky hides only part of another.
scope: One body in the sky hides only part of another, not a full hiding of the sun or moon and not a
  darkening by clouds.
examples:
- During the partial eclipse, the moon hid only part of the sun.
- We watched the partial eclipse through dark glasses.
