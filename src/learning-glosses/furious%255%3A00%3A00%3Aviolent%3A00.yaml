simpleMeaning: with very strong force that hurts or breaks things
scope: This means full of very strong force, and it is also called fierce. It does not mean very angry,
  as in a person who is angry about something.
examples:
- They fought a furious battle all night.
- A furious wind tore branches from the trees.
