simpleMeaning: A branch of the Tai languages, spoken in the middle of Thailand, with Bangkok at its centre.
scope: Also called Thai or Central Thai, it is a Tai language of central Thailand centred on Bangkok,
  distinct from the Siamese cat breed and from the adjective meaning of or relating to Thailand.
examples:
- Siamese is a branch of the Tai languages spoken in central Thailand.
- People in Bangkok speak Siamese.
