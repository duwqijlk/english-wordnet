simpleMeaning: a block made with fine grit and a white powder from burnt stone rather than clay, most
  often light grey or off-white in colour
scope: 'Also called a calcium-silicate brick, a flintlime brick, or a sandlime brick: a block made with
  fine grit and white powder rather than clay, not a clay brick and not a concrete block.'
examples:
- Sand-lime bricks are pale grey and very even in size.
- The wall was built of sand-lime brick rather than clay brick.
