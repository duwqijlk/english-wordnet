senseId: 'crossbench%1:06:00::'
synsetId: 03140702-n
simpleMeaning: a seat in the House of Commons for a member who does not vote with the government or the
  Opposition most of the time
scope: A seat for a member who votes with neither side most of the time, not a seat for a government member
  and not a seat for an Opposition member.
examples:
- After the election, she took a crossbench seat in the House of Commons.
- The crossbench members rarely voted with either the government or the Opposition.
