simpleMeaning: A drug that makes a person want to sleep and not be able to stop it
scope: A drug that makes sleep come and cannot be fought off, not a person who falls asleep without warning
  and not a drug that wakes a person up.
examples:
- The doctor gave him a narcoleptic to bring on sleep.
- A narcoleptic left her unable to stay awake.
