senseId: 'stultify%2:37:00::'
synsetId: 01805062-v
simpleMeaning: To show that a person is not of sound mind, or to show that they cannot do their work well.
scope: To show that a person is not of sound mind or cannot do their work, not to take away the strength
  of a thing.
examples:
- Nobody is legally allowed to stultify himself.
- His wild claims in court only stultified him further.
