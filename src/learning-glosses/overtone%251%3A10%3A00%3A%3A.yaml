simpleMeaning: A hidden meaning or quality behind what is said or done, usually in the plural.
scope: A hidden meaning or quality behind what is said or done, usually in the plural; not a musical tone
  whose pitch is a multiple of the lowest tone.
examples:
- There were overtones of despair in her voice.
- His speech had overtones of anger beneath the calm words.
