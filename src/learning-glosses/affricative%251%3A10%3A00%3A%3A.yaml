senseId: 'affricative%1:10:00::'
synsetId: 07133698-n
simpleMeaning: A sound made by blocking the air and then letting it out as a hiss at one place, like the
  'ch' in 'chair' or the 'j' in 'joy'.
scope: Also called affricate and affricate consonant, this sound blocks the air and lets it out as a hiss
  at one place; it is not a stop on its own and not a hiss on its own.
examples:
- At the start of 'joy', the affricative sound begins with a stop and ends with a hiss.
- An affricative like 'ch' begins as a stop and ends as a hiss.
