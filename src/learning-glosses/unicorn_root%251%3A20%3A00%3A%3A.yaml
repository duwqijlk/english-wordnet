simpleMeaning: Bitter parts below ground that people say cure belly pain belong to long-lived Aletris
  plants with leaves like grass, of which there are several kinds.
scope: Also called colic root, colicroot, crow corn, and star grass, this long-lived Aletris plant has
  grass-like leaves and bitter roots said to cure belly pain.
examples:
- People said unicorn root could cure belly pain.
- The bitter roots of unicorn root were said to ease colic.
