simpleMeaning: In the way of a religious leader.
scope: In the way of a religious leader; not in the way of a government minister, and not in the way of
  an ordinary speaker.
examples:
- He was called on to visit ministerially on the dying man.
- She spoke ministerially, as if leading the whole room in prayer.
