senseId: 'fell%2:35:02::'
synsetId: 01333919-v
simpleMeaning: In sewing, to fold the edge of the cloth over and stitch it down to form a seam.
scope: This is the action of sewing a folded edge down, not the adjective meaning cruel, not an animal's
  dressed hide, not the finished folded seam itself, not the act of cutting down a tree, not the verb
  meaning to strike something down, and not the verb meaning to die quickly.
examples:
- She felled the side seam so the inside of the garment would lie flat.
- Before setting in the sleeve, the tailor felled the raw edges along the armhole.
