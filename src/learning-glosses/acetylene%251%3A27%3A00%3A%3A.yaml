simpleMeaning: A gas with no colour that catches fire easily, used above all in welding and in making
  new chemicals out of carbon.
scope: Also called alkyne and ethyne, this colourless gas catches fire easily and is used above all for
  welding and for making new chemicals out of carbon.
examples:
- The welder lit the acetylene torch.
- In the workshop, acetylene fed the welding torch.
