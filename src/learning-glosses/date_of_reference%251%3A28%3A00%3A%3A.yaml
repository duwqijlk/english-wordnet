simpleMeaning: In astronomy, a fixed point in time picked by choice, against which facts such as the place
  of a body in the sky are noted down.
scope: In astronomy, this is a fixed point in time picked by choice, also called an epoch, not a real
  date in history or the time a star is seen.
examples:
- The date of reference for the star chart was fixed long ago.
- Astronomers record each star's place against the date of reference.
