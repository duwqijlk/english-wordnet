simpleMeaning: never settling down, but going from one home or job to the next, most often without a fixed
  place to stay
scope: Never settling in one home or job, but moving from one to the next, also called floating and drifting,
  and not simply having no goal or plan.
examples:
- The aimless hippies of the sixties moved from town to town.
- After leaving school, he led an aimless life, never staying long in one job.
