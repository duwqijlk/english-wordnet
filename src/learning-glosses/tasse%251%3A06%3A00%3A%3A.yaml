simpleMeaning: one of two flat plates of armour that hang from the skirt of plates below the chest to
  guard the tops of the legs
scope: 'Also called tasset: one of two plates of armour that hang down to guard the tops of the legs,
  not a full suit of armour and not a shield.'
examples:
- The knight's tasse swung as he walked.
- One tasse was dented where a sword had struck it.
