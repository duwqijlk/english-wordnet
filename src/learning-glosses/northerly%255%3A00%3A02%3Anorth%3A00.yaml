simpleMeaning: facing or pointing toward the north
scope: Also called northern, this sense means facing or pointing toward the north; it is not the noun
  for a wind from the north and not the word for moving toward the north.
examples:
- The northerly entrance faces toward the north gate.
- They put the windows on the northerly side of the house, facing the north.
