simpleMeaning: to argue in a clever but not honest way, and to change what something means or be unclear
  about it to lead people to believe what is not true
scope: Changing what something means, or being unclear about it, to mislead people; also called twist,
  sophisticate and convolute. It is not making a person behave badly, and not a person whose sexual behaviour
  is seen as bad.
examples:
- Do not pervert my words; I never said we would pay for it.
- He perverted the meaning of the rule to win the argument.
