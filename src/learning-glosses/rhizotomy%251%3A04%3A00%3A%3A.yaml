simpleMeaning: 'a surgical operation that cuts spinal nerve roots: front nerve roots to relieve pain that
  other treatment cannot ease, back nerve roots to stop severe muscle spasms.'
scope: This is surgery that cuts spinal nerve roots to relieve lasting pain or severe muscle spasms, not
  a diagnostic nerve test or an operation on the brain.
examples:
- The surgeons performed a rhizotomy to stop the patient's severe muscle spasms.
- Doctors recommended a rhizotomy after her back pain failed to respond to other treatment.
