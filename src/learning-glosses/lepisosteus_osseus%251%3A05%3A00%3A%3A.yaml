simpleMeaning: An old kind of hunting fish of North America, covered with hard scales and with long jaws
  full of thin, sharp teeth.
scope: A hard-scaled hunting fish of North America, also called gar, billfish, garfish and garpike; not
  a shark and not a pike.
examples:
- The Lepisosteus osseus lay still in the river, waiting for small fish.
- Long jaws full of thin teeth mark the Lepisosteus osseus.
