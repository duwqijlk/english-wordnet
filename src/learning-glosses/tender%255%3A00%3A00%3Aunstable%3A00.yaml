simpleMeaning: Of a boat, likely to tip to one side with little wind when its sails are up
scope: A boat that tips to one side easily under sail, not a kind or loving person and not a soft food.
examples:
- The tender boat leaned far over in a light wind.
- A tender boat can tip easily when the sails fill.
