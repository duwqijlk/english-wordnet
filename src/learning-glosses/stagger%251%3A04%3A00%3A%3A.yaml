simpleMeaning: a walk that is not steady and not even
scope: A walk that is not steady and not even, also called stumble and lurch; not walking as if one cannot
  control one's steps, and not a shock that leaves one stunned.
examples:
- His stagger grew worse as he crossed the room.
- A stagger in her step showed she was tired.
