simpleMeaning: Any of many small green plants with no tubes to carry water, growing in wet places and
  looking like green seaweed or leafy moss.
scope: Also called a liverwort; any of many small green plants with no tubes to carry water, growing in
  wet places, not a plant of the liver and not the adjective for the liver.
examples:
- Hepatic plants covered the damp rocks.
- She found a hepatic growing by the stream.
