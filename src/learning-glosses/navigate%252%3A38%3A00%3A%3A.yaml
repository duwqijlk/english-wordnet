simpleMeaning: to work as the person in a car, plane, or ship who works out where it is, plans the way
  to go, and guides it along that way
scope: 'Also called pilot: planning and guiding the way in a car, plane, or ship, not just travelling
  in one.'
examples:
- She navigated for the driver, reading the map and telling him where to turn.
- He navigated the plane on its course across the sea.
