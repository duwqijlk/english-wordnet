simpleMeaning: Bunches at the ends of its stems hold big, bright flowers shaped like funnels on this plant.
scope: This plant bears big, bright funnel-shaped flowers in bunches at the ends of its stems, not flowers
  that grow along the sides of the stem.
examples:
- The allamanda opened its big bright flowers at the ends of the stems.
- She grew the allamanda for its showy funnel-shaped flowers.
