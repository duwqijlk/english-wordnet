simpleMeaning: A set phrase said when meeting or leaving someone later in the day, wishing them a pleasant
  time.
scope: These are the spoken words of a greeting or goodbye, not the later part of the day itself and not
  an evening spent in a particular way.
examples:
- '"Good evening," she said, holding the door open for us.'
- As he left, he said a friendly "evening" to the staff.
