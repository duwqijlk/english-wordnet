simpleMeaning: a refined ability to judge what is good, beautiful, or of high quality, especially in matters
  of beauty and art.
scope: This is not the physical sensation of flavor in the mouth, and not a personal preference for one
  thing over another; it is a refined ability to judge what is beautiful or of good quality.
examples:
- She has excellent taste in music.
- The decor shows a great deal of taste.
