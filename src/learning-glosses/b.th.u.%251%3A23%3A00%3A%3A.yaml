simpleMeaning: 'A measure of heat: the heat needed to warm one pound of water by one degree Fahrenheit
  at normal air pressure, equal to about 252 calories.'
scope: This is a measure of heat, the heat needed to warm one pound of water by one degree Fahrenheit
  at normal air pressure; British thermal unit and BTU are other names for it, and it is not a measure
  of weight or a measure of heat in the metric system.
examples:
- One B.Th.U. warms a pound of water by one degree Fahrenheit.
- The heater gives out 10,000 B.Th.U. each hour.
