simpleMeaning: to make ideas or feelings meet at one clear point and point the same way
scope: 'Also called focus, focalise, concenter and concentre: to get thoughts or feelings to a single
  clear point, not to make a picture sharp and not to look at one thing.'
examples:
- She tried to focalize her thoughts before the exam.
- The talk helped him focalize his anger into a clear plan.
