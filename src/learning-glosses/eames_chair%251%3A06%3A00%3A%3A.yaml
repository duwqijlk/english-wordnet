simpleMeaning: A seat with a back, made to a maker's plan and first of shaped thin wood, its sitting and
  leaning parts made to fit the body.
scope: A seat with a back shaped to fit the body, first made of shaped thin wood to the plan of Charles
  Eames; not a plain wooden seat and not a soft armchair.
examples:
- We bought an Eames chair for the reading corner.
- The Eames chair fits her back better than the old wooden one.
