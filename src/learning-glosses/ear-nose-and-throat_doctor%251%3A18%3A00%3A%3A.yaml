simpleMeaning: A medical specialist who treats sickness of the part that takes in sound, the part used
  to smell, or the passage at the back of the mouth
scope: A medical specialist for the ear, nose and throat, also called otolaryngologist and otorhinolaryngologist;
  not a general doctor and not a surgeon.
examples:
- The ear-nose-and-throat doctor looked inside her nose and ears.
- An ear-nose-and-throat doctor treats sickness of the ear, nose or throat.
