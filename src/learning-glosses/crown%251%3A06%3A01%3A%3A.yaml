simpleMeaning: A beautiful thing with jewels on it, worn on the head by a king or queen to show they rule
  a country
scope: This is the headpiece a king or queen wears to show power. It is not a ring of leaves for a winner,
  and not the top part of a hat.
examples:
- The queen wore a gold crown covered in jewels.
- The king's crown was kept in a locked room in the tower.
