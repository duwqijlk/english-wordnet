simpleMeaning: in a way that is very bad or sad, and that you wish were different
scope: 'Also called sadly and lamentably: done in a way that is sad or very bad. This says how bad a thing
  or state is, not just that a person feels sad.'
examples:
- The old school building was woefully in need of repair.
- He was woefully unready for the test.
