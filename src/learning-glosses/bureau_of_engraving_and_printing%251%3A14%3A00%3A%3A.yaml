simpleMeaning: The Treasury Department has a part that makes the money people use
scope: This is the part of the Treasury Department that makes the money people use, not a private bank
  and not the part of the government that makes coins.
examples:
- The Bureau of Engraving and Printing makes the dollar bills used in the United States.
- New banknotes come from the Bureau of Engraving and Printing.
