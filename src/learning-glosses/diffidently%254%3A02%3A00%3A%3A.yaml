simpleMeaning: in a shy way, without trust in what you can do
scope: Means doing something in a shy, unsure way; not in a bold or sure way.
examples:
- '''I can try,'' he said diffidently, looking down at the floor.'
- She diffidently offered her idea, afraid the others would not like it.
