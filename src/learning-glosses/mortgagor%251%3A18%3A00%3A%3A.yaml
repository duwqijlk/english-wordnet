simpleMeaning: the person who gives a loan agreement on land or buildings in return for money to be paid
  back
scope: The borrower who gives a loan agreement on land or buildings, also called mortgager; not the lender
  who gives the money and not a person who sells houses.
examples:
- We became mortgagors when the bank accepted our mortgage and loaned us the money to buy our new home.
- As mortgagor, she signed the papers for the loan.
