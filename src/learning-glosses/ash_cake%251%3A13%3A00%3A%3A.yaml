simpleMeaning: Cabbage leaves wrap a loaf of cornmeal, and the bundle bakes in the hot remains of a fire
  in the south.
scope: Also called ashcake, this southern dish is a loaf of cornmeal wrapped in cabbage leaves and baked
  in the hot remains of a fire.
examples:
- They served ash cake wrapped in cabbage leaves.
- The ash cake came out of the fire still wrapped in cabbage leaves.
