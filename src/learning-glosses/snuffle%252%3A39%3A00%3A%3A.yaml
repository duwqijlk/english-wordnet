simpleMeaning: to breathe in through the nose to find out what a smell is or where it comes from
scope: To sniff at a smell to find out what it is, also called snuff; not to draw mucus up the nose, and
  not to cry and whine.
examples:
- The dog snuffled at the closed door, trying to smell what was inside.
- She snuffled the air, wondering what was cooking.
