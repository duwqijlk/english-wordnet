simpleMeaning: A set of signs that many women feel from two to fourteen days before their monthly bleeding
  starts.
scope: This is the set of signs many women feel in the days before their monthly bleeding starts, also
  called premenstrual syndrome; other sets of signs and other monthly changes are other senses.
examples:
- PMS made her tired in the days before her period.
- She knew the signs of PMS well.
