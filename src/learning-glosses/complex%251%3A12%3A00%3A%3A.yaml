senseId: 'complex%1:12:00::'
synsetId: 07497661-n
simpleMeaning: in psychoanalysis, a group of feelings and urges that were pushed out of awareness but
  still affect how someone acts
scope: This is the psychoanalytic mix of hidden feelings and urges, not a group of connected buildings,
  not a chemical compound, not a whole made of related parts, and not the adjective for something complicated.
examples:
- Freud described how an unresolved complex could shape adult behavior.
- The patient's complex was traced back to childhood experiences.
