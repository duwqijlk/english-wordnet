simpleMeaning: A grey, washed-out layer under a dark mat of decaying plant litter marks this soil of cool
  or cold, wet conifer woods and heaths.
scope: One of several names, with podsol, podzol and podzolic soil, for this cool-climate ground; it is
  not loam, compost or potting mix.
examples:
- Podzol soil covers much of the northern conifer belt.
- A podzol soil has a dark organic top over a pale grey layer.
