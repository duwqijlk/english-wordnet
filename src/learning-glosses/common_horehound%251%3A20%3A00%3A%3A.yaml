simpleMeaning: a fragrant, hairy-leaved herb of Europe whose many white flowers cluster where leaf meets
  stem, and whose leaves give a bitter extract used in medicine and flavoring.
scope: 'Another name for white horehound: the European herb with white flowers whose bitter leaf extract
  is used in medicine and flavoring. Not black horehound, a different plant with dark flowers.'
examples:
- Common horehound grows on dry European hillsides, with hairy leaves and clusters of white flowers.
- The old cough syrup was made from common horehound and tasted sharply bitter.
