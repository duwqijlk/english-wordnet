simpleMeaning: 'Sudden lung damage with coughing and crackling sounds: the lungs swell, stiffen and turn
  fibrous, unable to take in oxygen; it strikes people breathing harsh chemical vapors, ammonia or chlorine.'
scope: This is the sudden lung injury caused by breathing harsh chemical irritants, not the newborn lung
  disease that stops the lungs expanding, and not a general word for any breathing difficulty.
examples:
- He was put on a ventilator after developing adult respiratory distress syndrome from chemical fumes.
- Adult respiratory distress syndrome left her lungs scarred and stiff.
