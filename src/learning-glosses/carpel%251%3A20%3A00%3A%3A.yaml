simpleMeaning: a part of a flower that makes seeds, on its own or as one of a group of such parts
scope: One of the seed-making parts of a flower, not the whole flower and not the part that makes pollen.
examples:
- The carpel of the lily holds the seeds as they grow.
- Each carpel in the flower can grow into a fruit.
