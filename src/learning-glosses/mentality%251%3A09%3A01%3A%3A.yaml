simpleMeaning: a person's usual way of thinking, which shapes how they see things and how they act
scope: A person's usual way of thinking, which shapes how they see things and act; mindset and outlook
  are other names for this sense, not a person's ability to think.
examples:
- Her positive mentality helped her through hard times.
- The team's winning mentality showed in every game.
