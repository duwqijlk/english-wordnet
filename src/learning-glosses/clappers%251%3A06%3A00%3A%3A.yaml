simpleMeaning: Two hollow pieces of wood or bone that click together when a dancer strikes them, usually
  while holding them between thumb and fingers, in time with Spanish dancing.
scope: The clicking pair, another name for bones, castanets and finger cymbals; not people who clap or
  the clapper inside a bell.
examples:
- The dancers beat out the rhythm with clappers.
- He held the clappers between thumb and finger and clicked them together.
