simpleMeaning: The inside of a seed, grain, nut or fruit stone, which is usually edible.
scope: 'Another name for kernel: the edible inside of a seed, grain, nut or fruit stone, not animal flesh
  used as food and not the essential part of an idea.'
examples:
- The meat of a coconut is white and rich in oil.
- He dug the meat out of the cracked walnut shell.
