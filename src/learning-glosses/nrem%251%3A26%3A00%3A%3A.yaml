simpleMeaning: A sleep state that comes round again and again, with no quick eye moves and no dreams,
  taking up about three parts in four of a night's sleep
scope: Also called nonrapid eye movement, nonrapid eye movement sleep, orthodox sleep and NREM sleep;
  a sleep state with no quick eye moves and no dreams, not the sleep state with quick eye moves and dreams.
examples:
- NREM takes up most of the night's sleep.
- During NREM, her eyes stayed still and she did not dream.
