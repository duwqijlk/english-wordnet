simpleMeaning: a person who is careful with what they have and gives others less than enough of something
scope: A person who is careful with what they have and gives others less than enough of something, not
  a generous giver and not a person who spends freely.
examples:
- The old stinter counted every spoonful of sugar.
- No one liked working for the stinter, who gave short rations.
