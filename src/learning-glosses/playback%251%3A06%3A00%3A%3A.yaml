simpleMeaning: electric equipment in a tape recorder that plays again what was put on the tape
scope: This is the electric equipment in a tape recorder that plays a tape again, not the act of playing
  a recording and not the whole tape recorder.
examples:
- He took out the playback and cleaned it before putting it back in the tape recorder.
- When the playback broke, the tape recorder could not play the tape at all.
