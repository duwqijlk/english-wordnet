simpleMeaning: ways to share words, pictures and video, usually on the Internet, where people can talk
  to each other and put up their own posts
scope: Ways to share and post, usually on the Internet; not one-way news or TV, and not a private phone
  call.
examples:
- She follows her friends on social media every day.
- The club uses social media to share news with its members.
