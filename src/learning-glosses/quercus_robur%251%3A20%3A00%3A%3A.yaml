simpleMeaning: A medium to large oak of Europe that loses its leaves in winter, with smooth leaves with
  rounded lobes and hard strong pale wood
scope: Also called common oak, pedunculate oak and English oak; a large oak of Europe, close to other
  European oaks such as the sessile oak.
examples:
- Quercus robur gives hard pale wood.
- The Quercus robur in the park is centuries old.
