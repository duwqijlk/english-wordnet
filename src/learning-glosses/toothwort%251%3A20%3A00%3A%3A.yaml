simpleMeaning: A North American plant with sharp-smelling roots covered in scales or with pointed edges
scope: A North American plant with sharp-smelling scaly roots; crinkle-root, crinkle root, crinkleroot
  and pepper root are other names for this sense, and not a garden herb or a root vegetable.
examples:
- Toothwort grows in the woods of North America.
- The toothwort has sharp-smelling roots.
