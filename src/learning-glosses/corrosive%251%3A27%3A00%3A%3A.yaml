simpleMeaning: a substance that tends to eat away or destroy what it touches, such as a strong acid or
  an alkali (a chemical that works against acids)
scope: This names the substance itself; it is not the describing word for what such a substance is like,
  which is the adjective sense in this same batch.
examples:
- Keep corrosives in a locked cupboard, away from children.
- The label warns that the liquid is a corrosive and must not touch skin.
