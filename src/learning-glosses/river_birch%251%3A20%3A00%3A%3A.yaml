simpleMeaning: a tree of wet low land in the east of the United States, with red-brown bark
scope: 'Also called black birch and red birch: a tree of wet low land in the east of the United States,
  not a tree of dry high land and not a maple.'
examples:
- River birches grow along the river bottoms in the east.
- The river birch by the swamp had red-brown bark.
