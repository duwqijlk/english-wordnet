simpleMeaning: in a way that shows deep thought about something
scope: This describes doing or saying something while thinking deeply about it, not acting or speaking
  quickly with no thought.
examples:
- He sat reflectively, thinking for a long time about what to do next.
- She listened reflectively before she gave her answer.
