simpleMeaning: a soft, thin string that you pass between your teeth to clean them
scope: This is the string for cleaning teeth, not the soft thread used for sewing pictures on cloth, and
  not the act of cleaning teeth with it.
examples:
- She uses floss every night to clean between her teeth.
- He keeps a small box of floss in his bag for after meals.
