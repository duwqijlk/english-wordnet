simpleMeaning: A soldier in the British artillery who holds a rank below that of a commissioned officer.
scope: A soldier of rank below a commissioned officer in the British artillery, not the member of a bomber
  crew who uses the bombsight and releases the bombs on the target.
examples:
- The bombardier drilled the gun crew at dawn.
- They were made a bombardier after two years in the artillery.
