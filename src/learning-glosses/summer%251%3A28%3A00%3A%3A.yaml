simpleMeaning: the warmest season of the year, which in the northern half of the world lasts from the
  longest day to the start of autumn.
scope: This is the season itself, not the verb for staying somewhere during it.
examples:
- We spent two weeks by the sea last summer.
- Summer is the busiest time for ice cream sellers.
