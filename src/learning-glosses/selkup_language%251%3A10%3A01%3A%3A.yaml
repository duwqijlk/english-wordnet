simpleMeaning: The Uralic tongue spoken by the Ostyak-Samoyed people.
scope: Ostyak-Samoyed, Ostyak-Samoyed language and Selkup are other names for this sense; this is the
  tongue of the Ostyak-Samoyed people, not the people themselves.
