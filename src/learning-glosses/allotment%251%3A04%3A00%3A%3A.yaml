simpleMeaning: the act of giving out shares of something by a plan, with each part going where the plan
  says
scope: 'Also called allocation, assignation and apportioning: the act of giving out shares by a plan,
  not the share a person gets and not a small garden plot.'
examples:
- The allotment of seats is based on the size of each state.
- The council handled the allotment of the money among the schools.
