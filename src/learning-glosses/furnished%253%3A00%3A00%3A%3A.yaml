simpleMeaning: given everything needed for a job or use, such as furniture, tools, or the right to act
scope: 'Also called equipped: given what is needed for a purpose, not bare or empty, and not the act of
  putting furniture in a room.'
examples:
- We moved into a furnished apartment with beds, chairs, and a table.
- His toolbox was completely furnished with every tool he needed.
