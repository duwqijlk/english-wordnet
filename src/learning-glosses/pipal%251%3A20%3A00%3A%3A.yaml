simpleMeaning: a fig tree of India, known for its great size and long life, with no prop roots like the
  banyan, held holy by Buddhists
scope: Also called a pipal tree, pipul, bo tree, peepul, and sacred fig; a great Indian fig tree held
  holy by Buddhists, not the banyan and not a common shade tree.
examples:
- A great pipal shaded the temple yard.
- Buddhists gather under the pipal to pray.
