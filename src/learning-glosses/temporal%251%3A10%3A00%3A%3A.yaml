senseId: 'temporal%1:10:00::'
synsetId: 06344471-n
simpleMeaning: In grammar, the job of a noun phrase (a group of words that names a thing) that shows the
  time of a state or an action named by a verb
scope: Also called temporal role. This noun is for a grammar job that shows time, not the word for things
  of this world rather than the spirit, and not the word for the sides of the head.
examples:
- In this sentence, 'on Monday' is the temporal, because it shows when the action happens.
- The teacher asked us to find the temporal in the sentence, the part that shows the time.
