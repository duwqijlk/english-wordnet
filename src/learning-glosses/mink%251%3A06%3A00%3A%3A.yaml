simpleMeaning: a coat made from the soft, shiny fur of a small, thin-bodied animal with partly webbed
  feet that lives partly in water
scope: 'Also called mink coat: a coat made from this fur, not the small animal itself that lives partly
  in water.'
examples:
- She wore a mink over her dress at the winter party.
- Her mink was soft and shiny, and she kept it in a cool room.
