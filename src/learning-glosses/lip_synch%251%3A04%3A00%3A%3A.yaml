simpleMeaning: When the sound fits exactly the act that made it, above all when a speaker's mouth moves
  match the words heard, sound and moving pictures have been joined.
scope: 'Also called lip sync, lip synchronisation, and lip synchronization: matching mouth moves to heard
  words.'
examples:
- The actor's lip synch slipped, and his words came a beat late.
- Her lip synch was flawless through the whole music video.
