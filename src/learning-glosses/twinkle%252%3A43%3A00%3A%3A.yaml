simpleMeaning: to give out light or send light back in a way that goes bright and less bright again and
  again
scope: About a light that keeps changing between bright and less bright; not the noun for a short flash
  of light, and not the happy bright look in a person's eyes.
examples:
- The stars twinkled in the clear night sky.
- The small lights on the tree twinkled in the dark room.
