simpleMeaning: Something you can see that stands for an idea you cannot see
scope: A seen thing that stands for an unseen idea; not a design for a group or quality and not a mere
  picture.
examples:
- The dove is an emblem of peace.
- The broken chain was an emblem of freedom.
