senseId: 'human_growth_hormone%1:08:00::'
synsetId: 05419992-n
simpleMeaning: A substance made by the front part of the gland below the brain, which helps a person get
  taller
scope: This is a substance made by the front part of the gland below the brain that helps a person get
  taller; growth hormone, somatotrophic hormone, somatotrophin, somatotropic hormone and somatotropin
  are other names for this sense, not a substance that makes muscles strong and not a drug that makes
  a person sleep.
examples:
- The child lacked human growth hormone and grew slowly.
- Doctors gave her human growth hormone to help her grow.
