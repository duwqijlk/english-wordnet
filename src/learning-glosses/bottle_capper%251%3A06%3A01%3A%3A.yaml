simpleMeaning: a machine worked by hand or on its own, that puts tops on drink containers
scope: 'Also called capping machine: a machine that puts tops on bottles, not a machine that fills bottles
  and not a tool for taking tops off.'
examples:
- The bottle capper put tops on all the bottles before they were packed.
- She fed the bottles into the bottle capper one by one.
