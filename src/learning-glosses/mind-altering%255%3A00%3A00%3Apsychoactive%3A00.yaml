simpleMeaning: The way a person sees things is not true to life, and the way they feel changes
scope: It changes how a person feels and sees things; not a thing that gives strong false sights like
  mind-bending, and not one that widens what a person takes in like mind-expanding.
examples:
- The drug was mind-altering and left him unsure of what was real.
- She warned him that the drink had a mind-altering effect.
