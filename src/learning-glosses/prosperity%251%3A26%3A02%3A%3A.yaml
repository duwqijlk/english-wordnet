simpleMeaning: A time when trade is growing, firms are making more money, and everyone who wants work
  has a job.
scope: A time of growth in trade, with rising gains and full work, not simply having good fortune in life.
examples:
- The town shared in the prosperity of the boom years.
- Prosperity returned when the mills reopened.
