simpleMeaning: So important that a thing cannot work or be itself without it
scope: A part a thing must have to work or to be what it is, also called key, central and fundamental;
  not simply early in time and not merely large.
examples:
- A primal need for food drives every animal.
- Trust is primal to a good marriage.
