simpleMeaning: a British measure for liquids or dry goods, equal to five fluid ounces, or 142.066 cubic
  centimeters
scope: A British measure for liquids or dry goods, not the breathing part of a fish and not the plates
  under a mushroom cap.
examples:
- The recipe called for a gill of milk.
- He poured a gill of water into the jug.
