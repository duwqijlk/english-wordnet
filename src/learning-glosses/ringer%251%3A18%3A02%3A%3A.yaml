simpleMeaning: a person who makes church bells sound, for example to call people together for a church
  service
scope: This is a person who makes church bells sound, not a winning throw in horseshoes and not a person
  who enters a contest by lying about who they are.
examples:
- The ringer pulled the ropes to make the church bells sound.
- On Sunday morning, the ringers gathered in the tower before the service.
