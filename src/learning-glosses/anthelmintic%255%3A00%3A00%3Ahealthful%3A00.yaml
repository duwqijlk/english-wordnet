simpleMeaning: Able to drive out or kill the small worms that live inside the body
scope: Able to drive out or kill the small worms that live inside the body; anthelminthic, helminthic
  and parasiticidal are other names for this sense, not a medicine for worms itself and not a drug that
  kills germs.
examples:
- An anthelmintic drug clears worms from the gut.
- Doctors gave an anthelmintic medicine to the sick child.
