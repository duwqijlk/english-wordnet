simpleMeaning: An acid that takes part in the chemical work of living cells, found in yeast and in liver
  cells, used to make dyes, drugs and sun blockers
scope: This is an acid that takes part in the chemical work of living cells, found in yeast and in liver
  cells, used to make dyes, drugs and sun blockers; para aminobenzoic acid is another name for this sense,
  and an acid found in other places with other uses is a different kind.
examples:
- PABA is used to make dyes and sun blockers.
- The lab found PABA in the yeast cells.
