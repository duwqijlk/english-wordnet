simpleMeaning: to stretch out your arms, legs, or muscles, or your whole body
scope: Also called stretch. This is about stretching out your body, not making the amount of something
  bigger by adding a cheaper thing, and not using all your strength.
examples:
- Extend your right arm above your head.
- She extended her legs and rested after the run.
