simpleMeaning: a pattern on pots or on a wall made by scratching off the top coat to show the coat below
scope: A pattern on pots or walls made by scratching off the top coat; not a painted picture and not a
  carving cut into stone.
examples:
- The wall was finished in sgraffito, with white lines scratched through the dark coat.
- She learned sgraffito from a potter in Florence.
