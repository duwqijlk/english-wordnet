synsetId: 01503801-n
simpleMeaning: 'A large edible fish of the ray group: a thick tail and a long snout, with wide side fins
  fused to its head; it swims by rippling their edges.'
scope: The fish, not the bladed boot worn for gliding on ice or the verb meaning to glide on such boots.
examples:
- The fishmonger was selling skate wings at the market.
- A skate glided over the seabed, rippling the edges of its broad fins.
