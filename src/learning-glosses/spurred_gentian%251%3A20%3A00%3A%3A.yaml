simpleMeaning: any of several kinds of plant in the group Halenia, with flowers that have narrow pointed
  parts
scope: One of several plants in the Halenia group, with flowers that have narrow pointed parts, not a
  gentian with plain flowers and not a plant with no flowers at all.
examples:
- A spurred gentian grew beside the mountain path.
- The spurred gentian has flowers with narrow pointed parts.
