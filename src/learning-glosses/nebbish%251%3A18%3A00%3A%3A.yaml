simpleMeaning: In Yiddish, this is a person with bad luck, little sense and a shy nature
scope: Also called nebbech, this is a person with bad luck, little sense and a shy nature, not a coward
  and not a fool who makes trouble for others.
examples:
- The nebbish in the story always missed his chance and never spoke up.
- Don't be such a nebbish — ask for what you need.
