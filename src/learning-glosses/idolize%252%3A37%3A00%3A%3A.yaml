senseId: 'idolize%2:37:00::'
synsetId: 01781934-v
simpleMeaning: to love a person or thing too much, or to love them without asking questions or seeing
  any faults, and to treat them as if they were a god
scope: 'Also called worship, revere, idolise, and hero-worship: loving someone too much and seeing no
  fault in them, not just liking or respecting them in a normal way.'
examples:
- Many young fans idolized the singer and thought she could do no wrong.
- He idolizes his older brother and copies everything he does.
