simpleMeaning: looking forward to something with a strong belief that it will happen
scope: 'Also called anticipation: the feeling of looking forward to something you strongly believe will
  happen; not the number in maths that is worked out from values that can change by chance.'
examples:
- He lived in expectation of a visit from his son.
- They waited with expectation, sure that help would soon come.
