simpleMeaning: the warmth of a person's body, normally 98.6 F or 37 C, which is usually checked to quickly
  see how healthy the person is
scope: 'Also called body temperature: how warm a person''s body is, not the heat of the air around them.'
examples:
- The nurse took his blood heat with a thermometer under his tongue.
- A blood heat above 100 F can mean the body is fighting an illness.
