simpleMeaning: an official written order that frees a person from punishment for a wrong act
scope: 'Also called pardon: one official written order that frees a person from punishment, not a set
  time when a group of people are let off punishment.'
examples:
- His amnesty was signed by the president, so his punishment was cancelled.
- With the written amnesty in her hand, she was freed from punishment for the crime.
