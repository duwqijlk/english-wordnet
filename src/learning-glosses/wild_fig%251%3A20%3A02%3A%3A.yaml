simpleMeaning: a tree that begins on another tree sends many thick roots down through the air, takes it
  over, and covers huge areas in southern Florida and the West Indies
scope: Also called golden fig and strangler fig; a tree that starts life on another tree and takes it
  over, not a free-standing tree grown for its fruit.
examples:
- The wild fig began life high on another tree in the forest.
- Wild fig roots run down through the air to the ground.
