simpleMeaning: A light carriage with four wheels, pulled by a horse, with two or four seats
scope: This sense is a light horse-drawn carriage for carrying people, not a car and not a heavy cart
  for carrying goods.
examples:
- They rode to church in a surrey pulled by one horse.
- The old surrey had four seats and thin, light wheels.
