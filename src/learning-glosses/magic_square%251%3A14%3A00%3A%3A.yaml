simpleMeaning: A grid with n rows and columns, filled with the first n squared whole numbers so that every
  row, column, and diagonal adds up to the same total.
scope: A number grid whose rows, columns and diagonals share one total, not a Sudoku puzzle or a plain
  counting chart.
examples:
- She filled a 3 by 3 magic square with the numbers 1 to 9.
- In a magic square, every row, column and diagonal adds up to the same number.
