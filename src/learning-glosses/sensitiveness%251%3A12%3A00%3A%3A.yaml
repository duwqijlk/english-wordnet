senseId: 'sensitiveness%1:12:00::'
synsetId: 07527704-n
simpleMeaning: Quick to sense how oneself and other people feel.
scope: Also called sensitivity, it is quick to sense feelings in oneself and others, not the body's power
  to answer outside things or to sense things at all, not the power to answer things the body can feel
  or to pick up small amounts or differences, and not the power to answer changes in feeling between people.
examples:
- Her sensitiveness to the mood of the room helped her calm the meeting.
- His sensitiveness showed in the way he noticed every small change in her voice.
