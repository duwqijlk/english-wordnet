simpleMeaning: a soft food for spreading, made mainly from plant oils and used in place of butter
scope: 'Also called margarin, marge, oleo, and oleomargarine: a food like butter but made from plant oils,
  not butter itself.'
examples:
- She spread margarine on her toast instead of butter.
- This cake was made with margarine, not butter.
