simpleMeaning: to turn into crystals (hard solids with flat sides and a regular shape) or become made
  of them
scope: 'Also called crystalize: a thing turns into crystals on its own, not someone making a thing turn
  into crystals.'
examples:
- The sugar began to crystallize as the water dried up.
- Salt will crystallize when the sea water is gone.
