simpleMeaning: the killing of people by fire because they held beliefs the church called wrong, as in
  the Spanish Inquisition
scope: The killing of people by fire for holding beliefs the church called wrong, not a trial and not
  any other death by fire.
examples:
- Many were put to death in an auto-da-fe during the Spanish Inquisition.
- The auto-da-fe was held in the town square before a large crowd.
