simpleMeaning: the point where light or other radiation comes together, or the point it spreads out from
scope: This is the optical meeting or spreading point of light, not the centre of an infection or the
  main subject of attention.
examples:
- The magnifying glass burned a hole by bringing sunlight to a focus on the leaf.
- In the diagram, the rays spread out again after passing through the focus.
