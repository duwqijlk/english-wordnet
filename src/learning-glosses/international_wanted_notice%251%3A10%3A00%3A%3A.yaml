simpleMeaning: An Interpol note asking that a sought person be held for sending back to face trial, sent
  at the ask of one member land to all its member lands.
scope: This is an Interpol note asking that a sought person be held for sending back to face trial, sent
  at the ask of one member land to all its member lands; Red Notice is another name for it; not a local
  arrest order and not a court sentence.
examples:
- Interpol sent out an International Wanted Notice for the man.
- The International Wanted Notice asked police in all lands to hold him.
