simpleMeaning: Eaten young before the seeds and skin turn hard, this is one of many fruits of the gourd
  kind that grow ripe in warm months.
scope: This is the fruit, not the plant that bears it, one of many fruits of the gourd kind eaten young.
examples:
- She picked a summer squash while it was still young.
- We ate the summer squash before its skin turned hard.
