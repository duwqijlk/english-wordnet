simpleMeaning: a careful judgement of something made by looking closely at its parts and weighing them
scope: Also called critical appraisal, this is a careful judgement of something made by looking closely
  at its parts, not a quick opinion and not a simple summary.
examples:
- Her critical analysis of the play looked closely at every scene.
- The report gave a critical analysis of the new plan.
