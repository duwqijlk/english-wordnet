simpleMeaning: a simple kind of hockey played by children on a street, on ice or on a field, using a ball
  or a can as the puck
scope: This is the children's hockey game played with a ball or a can, not the verb sense of climbing
  in an awkward way.
examples:
- They played shinny on the street after school with an old can.
- We had a game of shinny on the ice last winter.
