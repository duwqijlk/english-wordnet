simpleMeaning: A bowl-shaped container. People usually use it to hold food or liquids.
scope: A bowl-shaped container for food or liquids, not the area of land drained by a river and not a
  bathroom sink fixed in place.
examples:
- She mixed the dough in a large basin.
- He washed the fruit in a basin of cold water.
