simpleMeaning: A drug made from the periwinkle plant that stops the growth of tumours, used to treat cancer
  of the lymph system.
scope: Also called vincristine; this is the drug from the periwinkle plant that treats cancer of the lymph
  system, not the plant itself.
examples:
- The doctor gave Oncovin to treat the cancer.
- Oncovin comes from the periwinkle plant.
