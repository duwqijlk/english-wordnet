simpleMeaning: A dead tongue of old Italy, known now only from a small number of stone writings
scope: This is a dead tongue of old Italy, known now only from a small number of stone writings; Sabellian
  and Sabellian language are other names for this sense, and a tongue of old Italy still spoken today
  is a different kind.
examples:
- Osco-Umbrian survives only in a few inscriptions.
- Scholars read Osco-Umbrian from the stone writings it left behind.
