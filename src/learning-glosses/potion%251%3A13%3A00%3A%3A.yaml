simpleMeaning: a drink used as medicine, or for magic, or one that has poison in it
scope: A drink with a special power to heal, to work magic, or to harm with poison, not a plain drink
  with no such power.
examples:
- The old woman gave him a potion to cure his fever.
- She mixed a magic potion in a small glass bottle.
