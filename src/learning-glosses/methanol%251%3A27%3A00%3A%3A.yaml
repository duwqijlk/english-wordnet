simpleMeaning: A light liquid alcohol that turns to gas easily, catches fire easily, and is poisonous,
  used to stop freezing, to dissolve things, as fuel, and to spoil drinking alcohol.
scope: Also called methyl alcohol, wood alcohol, or wood spirit; a poisonous liquid alcohol used as fuel
  and to dissolve things, not a drink.
examples:
- Methanol was added to the fuel to stop it freezing.
- Never drink methanol; it is poisonous.
