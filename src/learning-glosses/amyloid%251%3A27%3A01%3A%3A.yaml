simpleMeaning: Body tissue that breaks down and decays in sickness leaves behind a waxy, see-through stuff,
  a protein made of many parts, much like starch.
scope: This is a waxy, see-through protein stuff that forms in sick body tissue, not a food stuff made
  mostly of starch.
examples:
- The amyloid found in his tissue looked waxy and clear.
- Amyloid forms when body tissue breaks down in sickness.
