simpleMeaning: A row of evenly spaced marks on a measuring tool, often with numbers, that shows how much
  is measured.
scope: The marked strip on a gauge, dial, or rule that shows measured amounts, not a weighing device,
  a series of musical notes, or a general standard for ranking things.
examples:
- The scale on the thermometer shows the temperature in both Celsius and Fahrenheit.
- Turn the dial until the needle points to zero on the scale.
