simpleMeaning: a place where big roads join at different heights, so cars can move from one road to another
  without crossing the flow of other cars
scope: A place where cars change from one big road to another, not an exchange of words or information,
  not an exchange of money, and not the act of swapping one thing for another.
examples:
- Take the next interchange to get onto the road to the airport.
- Traffic slowed at the interchange where the two big roads meet.
