simpleMeaning: To become ill with a disease or catch an illness.
scope: This is not about eating, drinking, or accepting something, and not about measuring; it means becoming
  ill with a disease.
examples:
- She took ill during the flight and was rushed to hospital.
- Several soldiers took sick after drinking the water.
