simpleMeaning: Of east and east central North America, an upright shrub that loses its leaves in fall
  and bears frosted dark-blue fruit.
scope: Among shrubs of the east, this upright one bears frosted dark-blue fruit and loses its leaves in
  fall.
examples:
- Black haw fruit hung dark-blue in the fall.
- A black haw grew in east central North America.
