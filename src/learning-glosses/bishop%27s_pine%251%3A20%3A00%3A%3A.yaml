simpleMeaning: A tree with needles in groups of two or three, found mostly along the coast of northwestern
  California.
scope: A tree with needles in groups of two or three, mostly on the northwestern California coast; bishop
  pine is another name for this sense, not a tree with needles in groups of five and not a tree from the
  eastern United States.
examples:
- Bishop's pine grows on the windy headlands.
- The bishop's pine cones opened after the fire.
