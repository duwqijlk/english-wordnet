simpleMeaning: A person runs other machines that use power from a flat sheet that power cannot pass through,
  fitted with switches, dials, and meters
scope: The flat sheet with switches, dials, and meters that runs other machines that use power, also called
  a control board, a board, a panel, and an instrument panel; not a notice board or a board for writing
  on.
examples:
- He pressed a button on the control panel to start the lift.
- All the dials on the control panel showed normal readings.
