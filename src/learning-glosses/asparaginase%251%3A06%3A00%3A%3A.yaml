simpleMeaning: a drug that fights cancer, sold as Elspar and at times used to treat lymphoblastic leukemia,
  a cancer of the blood
scope: A cancer drug used at times for one kind of blood cancer, not a drug that cures all cancers and
  not a drug for other blood diseases.
examples:
- The doctor gave the child asparaginase as part of the treatment.
- Asparaginase is one of the drugs used against lymphoblastic leukemia.
