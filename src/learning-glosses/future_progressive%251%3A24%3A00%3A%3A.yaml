senseId: 'future_progressive%1:24:00::'
synsetId: 13829615-n
simpleMeaning: A verb form that shows an action going on at a time still to come
scope: This is a verb form for an action going on at a time still to come; future progressive tense is
  another name for this sense, not the simple form for what will happen and not the form for what is going
  on now.
examples:
- The future progressive is used in the sentence 'I will be working all day tomorrow.'
- In her essay she wrote, 'I will be working all day tomorrow,' an example of the future progressive.
