scope: This word is also called .45-caliber, .45-calibre, and .45 caliber, and it is the size-name for
  a gun, or the shot it fires, when the hole down its barrel is a little less than half an inch across.
examples:
- He owned a .45 calibre pistol.
- Only .45 calibre shot fits that gun.
