senseId: 'squat%1:04:00::'
synsetId: 00345768-n
simpleMeaning: the act of getting into or staying in a low position, with the knees bent and the bottom
  close to the heels
scope: This is the low body position itself, also called squatting; it is not doing this move again and
  again as exercise, not living in a home without a right to do so, and not being short and thick.
examples:
- She stayed in a squat while she picked up the box from the floor.
- He dropped into a squat to talk to the small child at eye level.
