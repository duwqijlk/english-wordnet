simpleMeaning: One of a pair of blood channels in the tough cover of the brain; it ends in the S-shaped
  channel
scope: One of a pair of blood channels in the cover of the brain, also called sinus transversus; not a
  blood channel in the nose and not a vein that carries blood back to the heart.
examples:
- The transverse sinus drains blood from the back of the head.
- A clot in the transverse sinus can cause a severe headache.
