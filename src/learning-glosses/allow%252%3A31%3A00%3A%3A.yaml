simpleMeaning: to accept that something may be true, or may happen, and take it into account when planning
scope: This is about accepting a possible fact or outcome, not about giving permission, not about making
  something possible, and not about letting an activity go on.
examples:
- We must allow for delays caused by bad weather.
- Even allowing that he was tired, the mistake was careless.
