simpleMeaning: a hand tool with a tight thin blade, used for cutting small curves in wood
scope: A hand tool with a tight thin blade, used for cutting small curves in wood; not a tool for straight
  cuts, and not a power tool.
examples:
- He used a coping saw to cut the curve in the wood.
- A coping saw has a thin blade that turns easily round bends.
