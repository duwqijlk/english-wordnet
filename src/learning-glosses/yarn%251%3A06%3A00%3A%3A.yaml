simpleMeaning: a thin cord made by twisting together short lengths of cotton, silk, wool, nylon, or other
  such stuff, for sewing or weaving
scope: 'Also called thread: a thin twisted cord for sewing or weaving, not a story and not a single strand
  of hair.'
examples:
- She bought red yarn to knit a scarf.
- The yarn tangled as she tried to weave.
