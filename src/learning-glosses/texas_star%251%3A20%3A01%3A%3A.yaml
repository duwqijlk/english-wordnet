simpleMeaning: A one-year plant from the state of that name, with leaves cut deep like feathers, grown
  for its bright yellow flower heads that spread out like rays.
scope: 'Also called Lindheimera texana: a one-year plant from the state of that name with leaves cut deep
  like feathers, not a plant that lives for many years and not a prairie herb with lilac flowers.'
examples:
- The Texas star bloomed in the garden.
- Texas star has bright yellow flower heads.
