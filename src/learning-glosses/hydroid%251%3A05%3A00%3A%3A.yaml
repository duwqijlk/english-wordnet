simpleMeaning: Water animals that live in groups, in which the stage that stays fixed in one place is
  the main one.
scope: Water animals that live in groups, in which the stage that stays fixed in one place is the main
  one, not a jellyfish and not a coral; hydrozoan is another name for this sense.
examples:
- Hydroids grew on the pier posts like tiny plants.
- The hydroid colony spread across the rock.
