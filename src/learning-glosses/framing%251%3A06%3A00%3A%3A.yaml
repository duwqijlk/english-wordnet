simpleMeaning: something that holds a picture or a mirror up and keeps it safe, made as a stiff edge round
  it
scope: 'Also called a frame: the edge round a picture or mirror, not the picture itself and not a wooden
  border used for building.'
examples:
- The framing was much more valuable than the mirror it held.
- She chose simple dark framing for the old painting.
