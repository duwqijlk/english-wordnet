simpleMeaning: the meat of a Pacific fish that swims from salt water to fresh water
scope: The meat of this fish as food, not the live fish itself and not the meat of a fish that stays in
  one kind of water.
examples:
- We ate rainbow trout with lemon for dinner.
- The cook grilled the rainbow trout and served it with rice.
