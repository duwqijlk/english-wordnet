synsetId: 14394566-n
simpleMeaning: A problem of passing solid waste at uneven times, too seldom or with difficulty, which
  can be a sign of a blocked gut or swollen pockets in the gut
scope: 'Also called irregularity: a health problem with passing waste, not the act of making something
  useless by doing it the same way again and again.'
examples:
- He had constipation for three days and could hardly pass anything.
- Constipation can be a sign that something is blocking the gut.
