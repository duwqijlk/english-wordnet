simpleMeaning: Made so both eyes can look through them at the same time, these seeing tools come in a
  pair
scope: Seeing tools in a pair for both eyes at once, also called binoculars and field glasses; not a single
  eye glass and not a pair of reading glasses.
examples:
- She raised her opera glasses to watch the singer.
- He forgot his opera glasses and could not see the stage well.
