simpleMeaning: a standard measure for how bright light is, equal to the light of one candle spread over
  one square meter, measured at a right angle to the light
scope: This is a unit for light, not the egg or young of a small insect that lives on animals or people.
examples:
- This screen can reach a brightness of 400 nits.
- The old display was only 200 nits, so it looked dim in sunlight.
