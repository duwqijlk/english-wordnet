simpleMeaning: That turns in a circle, or has to do with turning in a circle
scope: This describes something that turns, or has to do with turning; it is not the place where roads
  meet, not an electrical machine, and not the sense that means in the shape of a circle or moving in
  a circle.
examples:
- The old phone has a rotary dial.
- Rotary motion makes the wheel turn round and round.
