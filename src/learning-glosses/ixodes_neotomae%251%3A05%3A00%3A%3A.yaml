simpleMeaning: A blood-sucking bug that as a rule does not bite people, but passes the germ of Lyme disease
  to dusky-footed wood rats
scope: A bug that carries Lyme disease to wood rats; not a bug that often bites people and not the bug
  that spreads Lyme disease to people.
examples:
- Ixodes neotomae feeds on wood rats rather than on people.
- Researchers found Ixodes neotomae carrying the Lyme disease germ.
