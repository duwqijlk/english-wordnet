simpleMeaning: a place to sit in rows that rise in steps, so people at the back can see over the heads
  of people in front
scope: A place to sit in rows that rise in steps so people at the back can see over those in front; not
  a flat floor and not a standing place.
examples:
- The tiered seat at the back gave her a clear view of the stage.
- They sat in the tiered seats above the field.
