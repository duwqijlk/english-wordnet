simpleMeaning: the hinged lid that covers the keys of a piano when it is not being played
scope: This is a hinged lid over piano keys; fallboard is another name for this sense; not the piano keys
  and not the lid over the strings.
examples:
- She closed the fall-board after playing the piano.
- The fall-board protects the keys from dust.
