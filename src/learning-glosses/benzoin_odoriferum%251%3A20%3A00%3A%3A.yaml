simpleMeaning: A shrub of the east of the United States that loses its leaves in winter, with sweet-smelling
  leaves and bark and yellow flowers, then red or yellow berries.
scope: This shrub of the eastern United States, also called spice bush, spicebush, American spicebush,
  Benjamin bush and Lindera benzoin, loses its leaves in winter and bears yellow flowers followed by red
  or yellow berries, unlike other shrubs with different leaves or fruit.
examples:
- Benzoin odoriferum grew by the stream.
- The leaves of Benzoin odoriferum smelled sweet when crushed.
