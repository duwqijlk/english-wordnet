simpleMeaning: In a sad play, the hero's own weak spot or wrong step in what they are like brings them
  down in the end
scope: A flaw in a tragic hero's character that brings their fall, not a good trait and not a mistake
  by an ordinary person.
examples:
- His hamartia was pride, and it led to his downfall.
- The play turns on the hero's hamartia.
