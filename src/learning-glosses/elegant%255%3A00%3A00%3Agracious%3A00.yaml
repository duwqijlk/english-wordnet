simpleMeaning: giving the idea of good taste, an easy way, and money
scope: This means giving the idea of good taste, an easy way and money, also called graceful and refined;
  it is not the sense about beauty and simple ease in movement or in how a thing is done.
examples:
- They live in an elegant house in a rich part of town.
- She wore an elegant dress and spoke in a calm, easy way.
