simpleMeaning: A dish of eggs that hold their shape, made by mixing eggs with milk or cream and cooking
  them
scope: Eggs mixed with milk or cream and cooked until they hold their shape, not a runny dish of eggs
  and not scrambled eggs.
examples:
- She made a firm omelet with cheese for breakfast.
- The firm omelet held its shape when he cut it.
