simpleMeaning: Seeing and hearing things that are not there is what it does to a person, and it hits them
  hard
scope: 'Also called mind-bending: it makes a person see and hear things that are not there and hits them
  hard; not a mild change in mood like mind-altering, and not a wider sense of things like mind-expanding.'
examples:
- The mind-blowing drug made her see shapes that were not in the room.
- After the mind-blowing dose, he heard voices that no one else could hear.
