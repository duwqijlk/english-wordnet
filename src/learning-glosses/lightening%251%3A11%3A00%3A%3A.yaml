simpleMeaning: the moving down of the womb into the low space between the hip bones late in pregnancy;
  people say the baby has dropped
scope: This is the baby moving down late in pregnancy; it is not a change to a lighter colour, and not
  a flash of light in the sky.
examples:
- Lightening happened two weeks before she gave birth.
- The nurse said lightening meant the baby had dropped lower.
