simpleMeaning: to build an army unit out of soldiers, putting them together so they act as one body
scope: To make soldiers into one army unit, not merely to place soldiers in a unit that already exists
  and not to put people under strict rules.
examples:
- The general regimented the new recruits into a single unit.
- They regimented the men and gave them their first orders.
