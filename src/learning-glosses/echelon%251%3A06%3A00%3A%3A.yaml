simpleMeaning: a diffraction grating (a tool that splits light into parts), made of a pile of plates of
  the same thickness set like steps, each step forward by the same amount
scope: A tool made of plates set like steps that splits light, not a level of rank in a group and not
  soldiers set out in steps.
examples:
- The scientist used an echelon to split the light for study.
- An echelon with plates set like steps helped spread the light into colours.
