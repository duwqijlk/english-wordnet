simpleMeaning: In computer science, the smallest separate part of an image on a CRT screen, a screen of
  the old tube kind, most often a small spot of colour
scope: 'Also called pixel and pel: in computer science, the smallest separate part of an image on a screen,
  not a whole picture and not a line of text.'
examples:
- The picture element was so small that I could not see it alone.
- More picture elements per inch make the image sharper.
