simpleMeaning: The state of carrying a baby that grows somewhere other than in the womb.
scope: The state of carrying a baby that grows somewhere other than in the womb; also called eccyesis,
  ectopic gestation, ectopic pregnancy, extrauterine gestation, or metacyesis, not a baby growing in the
  womb and not a false pregnancy.
examples:
- An extrauterine pregnancy must be treated at once.
- The extrauterine pregnancy was found outside the womb.
