simpleMeaning: any of many birds from Europe, Asia and Africa, with a strong beak that bends down at the
  end, that eat smaller animals
scope: A bird that eats smaller animals, not any bird with a bent beak and not a small animal that such
  a bird eats.
examples:
- A shrike sat on a branch watching for small animals to eat.
- We saw a shrike catch a mouse with its strong beak.
