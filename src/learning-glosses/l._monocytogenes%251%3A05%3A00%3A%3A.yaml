simpleMeaning: The type species of Listeria; it can cause meningitis, encephalitis, septicemia, endocarditis,
  abortion, abscesses, and listeriosis.
scope: Also called Listeria monocytogenes; the type species of the genus Listeria, capable of causing
  these infections and complications.
examples:
- L. monocytogenes can cause meningitis.
- Food left out too long may carry L. monocytogenes.
