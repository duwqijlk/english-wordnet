simpleMeaning: that can be shown as a number or amount, or that is about measuring things, or that can
  be measured
scope: About numbers, amounts, and measuring things, not about poems where long and short parts of words
  set the beat.
examples:
- They carried out a quantitative study of how much rain fell each month.
- The report gives quantitative results, with the weight of each sample in grams.
