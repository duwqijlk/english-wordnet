simpleMeaning: A stand that can be moved up and down holds a sharp point that marks, and this tool checks
  how flat a flat face is.
scope: Scribing block and surface gauge are other names for this tool that tests how flat a flat face
  is with a marking point on a stand that moves up and down.
examples:
- The worker set the surface gage on the plate to check its flat face.
- With the surface gage, the flat face was checked before the part was fitted.
