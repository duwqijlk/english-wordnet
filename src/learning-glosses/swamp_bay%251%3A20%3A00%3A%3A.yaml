simpleMeaning: a bush or small tree with quite small sweet-smelling white flowers, found in large numbers
  in the south-east of the United States
scope: This is a bush or small tree with small sweet-smelling white flowers, also called swamp laurel
  and sweet bay; not a bay tree grown for its leaves and not a tree of dry ground.
examples:
- The swamp bay was covered in small white flowers.
- Swamp bay grows in large numbers across the south-east.
