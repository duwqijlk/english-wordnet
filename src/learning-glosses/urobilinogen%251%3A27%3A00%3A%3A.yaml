simpleMeaning: A pigment precursor formed in the gut from broken-down bilirubin; oxidation turns it into
  urobilins, and some leaves in stool while some is reabsorbed and passed in bile or urine.
scope: A breakdown product of bilirubin, formed in the gut, that oxidation converts into urobilins. It
  is not bilirubin itself, nor the urobilins it produces. It is a biochemistry term, and it appears in
  tests of urine and stool.
examples:
- The lab reported a raised urobilinogen level in the urine sample.
- Urobilinogen is measured alongside bilirubin when liver function is checked.
