simpleMeaning: In woodland, a small plant feeding on dead stuff has shiny white or pale pink blooms that
  hang down and leaves like scales, turning black as it gets old.
scope: It is a small woodland plant that feeds on dead stuff, with shiny white or pale pink blooms that
  hang down and leaves like scales.
examples:
- The waxflower hung its pale pink blooms down in the woods.
- Old waxflowers in the woods had turned black.
