simpleMeaning: In golf, an iron club whose wide bottom and angled face lift the ball high into the air
scope: In golf, a club for lifting the ball high, not the solid piece that splits things apart and not
  the large sandwich.
examples:
- He used a wedge to lift the ball out of the sand.
- She chose a wedge for the short shot up onto the green.
