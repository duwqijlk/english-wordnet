simpleMeaning: A kind of oboe (a wind pipe with a double reed) that sounds one octave below the common
  oboe.
scope: A kind of oboe that sounds one octave below the common oboe, also called basset oboe; not the common
  oboe and not a bassoon.
examples:
- The heckelphone sounds an octave below the ordinary oboe.
- He played the low notes on a heckelphone.
