schema: oewn-learning-gloss-v2
senseId: 'opposite%1:24:03::'
synsetId: 13880801-n
simpleMeaning: The relationship between two things that are complete contraries.
scope: It is the relationship itself when two things are directly against each other, not the word with
  a contrary meaning, not something inverted or turned around, and not the person you compete against;
  reverse and contrary are other names.
examples:
- We expected the older child to be Sue, but the opposite was true.
- She predicted a rise, yet the opposite came about.
