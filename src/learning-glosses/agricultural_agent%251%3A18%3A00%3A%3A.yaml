simpleMeaning: People in country areas turn to this government worker for advice on farming and on running
  a home.
scope: Also called a county agent or an extension agent, this government worker advises people in country
  areas about farming and running a home.
examples:
- The agricultural agent visited farms to give advice on crops.
- A farmer called the agricultural agent for help with a garden.
