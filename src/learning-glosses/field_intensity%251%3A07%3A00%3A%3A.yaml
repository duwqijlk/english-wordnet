simpleMeaning: At one spot, all the pushes of electric or magnetic force add up to one whole push, with
  size and direction, for each bit of mass, charge, or magnetic pole.
scope: Also called field strength, this names the whole push, with size and direction, from adding all
  the pushes of electric or magnetic force at one spot.
examples:
- The field intensity at that spot was high.
- They measured the field intensity at several points in the field.
