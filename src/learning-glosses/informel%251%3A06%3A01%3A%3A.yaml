simpleMeaning: A French school of art that began in the 1950s, marked by uneven dabs and splashes of colour
  put on the canvas at random; it is like American abstract expressionism.
scope: A French art school of the 1950s, also called Art Informel; not abstract expressionism itself and
  not a single painter.
examples:
- Informel painters threw colour at the canvas.
- The show traced Informel from its start in the 1950s.
