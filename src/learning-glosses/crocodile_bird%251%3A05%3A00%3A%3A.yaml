simpleMeaning: An African courser, a fast-running ground animal, that eats the pests that live on large
  river reptiles.
scope: This is an African bird that eats the pests that live on crocodiles, not a water bird or a bird
  of prey.
examples:
- The crocodile bird picked insects off the basking reptile.
- A crocodile bird walked over the back of a resting crocodile, picking off pests.
