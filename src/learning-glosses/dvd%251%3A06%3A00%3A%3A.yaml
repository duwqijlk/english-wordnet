simpleMeaning: A film or other show stored as a computer file on a thin round disc, which a computer or
  a television set can play
scope: This is a film stored on a thin round disc for play on a computer or a television set; videodisc
  and videodisk are other names for this sense, and it is not a tape or a broadcast.
examples:
- We watched the DVD of the film last night.
- She put the DVD into the player and the film began.
