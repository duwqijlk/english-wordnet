simpleMeaning: A big tree of the East Indies, semi-evergreen, with sticky gum in its trunk, bitter tonic
  bark, seeds full of aromatic oil, and sometimes classed in the genus Melia.
scope: One of several names for this tropical tree, also called margosa, neem and nim tree; not the aromatic
  oil pressed from its seeds.
examples:
- Farmers in the East Indies once boiled arishth bark to make a bitter tonic.
- An arishth grew beside the well, its trunk sticky with gum.
