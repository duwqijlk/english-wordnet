simpleMeaning: A small tree of warm parts of America that bears big juicy fruit that tastes a little sharp
scope: This is the small tree of warm America; prickly custard apple and soursop tree are other names
  for it, not the large spiny fruit itself and not a custard apple tree.
examples:
- A soursop grows in the garden, bearing large juicy fruit.
- The soursop fruit tastes a little sharp.
