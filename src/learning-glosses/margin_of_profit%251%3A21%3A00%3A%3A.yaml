simpleMeaning: How much of the money from sales is left after costs, shown as one number over another
scope: Also called gross margin and profit margin, this is a share of sales left after costs, not the
  total money from sales and not the costs themselves.
examples:
- The margin of profit fell when costs rose.
- A thin margin of profit left little room for error.
