simpleMeaning: How hard electric or magnetic power pulls or pushes on one bit of mass, charge, or a magnet
  pole, worked out by adding every pull or push at one spot.
scope: Also called field intensity, this is the measure of how hard electric or magnetic power pulls or
  pushes on one bit of mass, charge, or a magnet pole at one spot.
examples:
- The field strength at that point was higher than at the next point.
- She worked out the field strength from the force on one small charge.
