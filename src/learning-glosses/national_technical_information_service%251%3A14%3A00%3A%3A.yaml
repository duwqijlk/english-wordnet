simpleMeaning: People go to this agency in the Technology Administration as the main place for facts about
  science, machines, building things, and trade, paid for by the government.
scope: Also called NTIS, this is an agency in the Technology Administration that gives facts paid for
  by the government, not a shop and not a library.
examples:
- The National Technical Information Service holds reports on government-funded research.
- Engineers turn to the National Technical Information Service for facts about new machines.
