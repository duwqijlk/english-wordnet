simpleMeaning: The study of how far apart people stand from each other among people of different lands
  and in different settings
scope: The study of how far apart people stand from each other, not the study of how people talk and not
  the study of how crowds move.
examples:
- Proxemics looks at how close people stand when they talk.
- In her proxemics class, students measured the space between strangers.
