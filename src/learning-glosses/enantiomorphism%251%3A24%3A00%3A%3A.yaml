simpleMeaning: The way two crystals or bits of stuff stand as mirror images of each other.
scope: The way two crystals or bits of stuff mirror each other, also called a mirror-image relation; not
  a single crystal and not a copy.
examples:
- Enantiomorphism links the two forms like left and right hands.
- The crystals show enantiomorphism in their shapes.
