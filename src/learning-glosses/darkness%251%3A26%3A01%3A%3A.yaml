simpleMeaning: a state in which moral goodness and spiritual values are missing.
scope: It is the same sense as the noun dark, meaning evil or a lack of good and spiritual values; it
  is not the absence of physical light or an unenlightened state.
examples:
- The novel shows the darkness inside a man who has lost all moral sense.
- They spoke of the powers of darkness that drove him to cruelty.
