simpleMeaning: a way of setting jewels so close together that no metal can be seen between them
scope: A way of fixing jewels close together so that no metal shows between them.
examples:
- The ring had a pave of small diamonds that hid the gold band.
- She chose a pave setting so the stones would cover the whole band.
