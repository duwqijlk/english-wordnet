simpleMeaning: in gun language, the moving parts that load a cartridge, lock it in place, fire it, and
  pull out the empty case
scope: This is the working part inside a gun, not something a person does and not a quality of a person.
examples:
- The rifle's action was stiff until he oiled it.
- He worked the action smoothly and loaded another round.
