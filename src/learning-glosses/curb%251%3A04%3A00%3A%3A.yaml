simpleMeaning: the act of holding back power or action, or of keeping something from going too far
scope: 'Also called check, and another name for it is bridle: this is the act of holding something back,
  not the raised edge at the side of a road and not the chain or strap used to control a horse.'
examples:
- The new law is meant as a curb on the power of big companies.
- After losing his job, he put a curb on his spending.
