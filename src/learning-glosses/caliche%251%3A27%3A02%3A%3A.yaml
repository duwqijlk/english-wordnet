senseId: 'caliche%1:27:02::'
synsetId: 14869748-n
simpleMeaning: a hard crust or layer in soil below the surface, covered with a mineral (calcium carbonate),
  found in dry or partly dry places
scope: Also called hardpan, this is a hard layer under soil in dry places; it is not the other sense,
  a rock or gravel in Chile and Peru.
examples:
- A thick layer of caliche lay just under the dry soil.
- Farmers could not dig through the hard caliche.
