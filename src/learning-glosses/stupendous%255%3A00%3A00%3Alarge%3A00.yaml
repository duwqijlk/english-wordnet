simpleMeaning: so great in size, force, or wide reach that it makes people feel wonder
scope: 'Also called colossal and prodigious: so large or strong that people feel wonder, not just big
  in a plain way and not just very good.'
examples:
- A stupendous field of grass stretched as far as we could see.
- The storm had stupendous force and broke trees all over town.
