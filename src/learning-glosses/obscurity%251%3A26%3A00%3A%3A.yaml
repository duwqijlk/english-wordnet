simpleMeaning: the state of being not well known and not thought important
scope: This is being little known and not thought important, not being hard to see or hard to make out
  because there is not enough light.
examples:
- He worked in obscurity for many years, and few people knew his name.
- She lived in obscurity after her short time as a singer.
