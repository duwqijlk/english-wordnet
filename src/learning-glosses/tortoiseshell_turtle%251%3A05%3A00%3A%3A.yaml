simpleMeaning: A fierce sea animal of warm seas with a beak like a hawk's, eaten as food, and its shell
  is the best of its kind
scope: A fierce sea animal of warm seas with a hawk-like beak; hawksbill, hawkbill and hawksbill turtle
  are other names for this sense, and not a land animal with a shell or a calm sea animal.
examples:
- The tortoiseshell turtle swims in warm seas.
- People once hunted the tortoiseshell turtle for its shell.
