simpleMeaning: A jet engine in which all the air goes through a compressor, a burning chamber, and a turbine,
  then is pushed out to give thrust.
scope: Also called a turbojet engine, a jet engine itself, not an aeroplane driven by one.
examples:
- The turbojet powered the plane to a great height.
- Engineers tested the new turbojet on the ground first.
