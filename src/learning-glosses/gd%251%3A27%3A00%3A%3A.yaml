simpleMeaning: A soft silvery-white metal of the rare earth group that bends easily, holds a magnet, and
  joins with three other atoms.
scope: Also called atomic number 64 or gadolinium; a soft silvery-white metal of the rare earth group
  that bends easily and holds a magnet.
examples:
- Gd is a soft silvery-white metal of the rare earth group.
- The sample of Gd bent easily and held a magnet.
