simpleMeaning: A tree from the East Indies that sends out shoots from high up which grow down into the
  ground and form new trunks.
scope: 'Also called the banyan, the banian, the banian tree, the banyan tree, the East Indian fig tree,
  and the Indian banyan: a tree from the East Indies whose high shoots grow down and form new trunks,
  not a tree with a single trunk.'
examples:
- The Ficus bengalensis sends shoots down to the ground.
- A Ficus bengalensis can form many trunks from its shoots.
