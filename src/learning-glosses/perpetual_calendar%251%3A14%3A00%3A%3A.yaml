simpleMeaning: For any date over many years, this chart or tool shows which day of the week it falls on
scope: A chart or tool that gives the day of the week for any date over many years, not a diary that records
  what happened on a date and not a list of coming events.
examples:
- She checked the perpetual calendar to see what day of the week her birthday falls on in 2040.
- The perpetual calendar on his desk covers the next hundred years.
