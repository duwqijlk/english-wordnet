simpleMeaning: done with great force or energy, or showing very strong feeling, or coming from great force,
  energy or strong feeling
scope: 'This is the wide sense: acts or things done with great force or strong feeling, not only about
  strong beliefs, and not about bright colors or loud sounds.'
examples:
- A violent storm shook the house all night.
- He made a violent attack on the door and broke it open.
