simpleMeaning: Of, or to do with, fatalism.
scope: This sense is also called fatalistic, for being of, or to do with, fatalism, unlike the sense for
  any one who bows to the belief that they cannot change their fate.
examples:
- The view was fatalist, of fatalism.
- The work was fatalist, to do with fatalism.
