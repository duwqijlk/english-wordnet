simpleMeaning: A person whose cornea is hurt or sick gets part or all of it swapped for healthy tissue
  from a donor, in this eye operation.
scope: Also called corneal graft and corneal transplant, this is an eye operation that swaps a hurt or
  sick cornea for healthy donor tissue.
examples:
- The surgeon did a keratoplasty on her left eye.
- Keratoplasty replaced the damaged cornea with donor tissue.
