simpleMeaning: Often along with diabetes, the body makes large amounts of pale, watery urine in this kidney
  sickness
scope: A kidney sickness in which the body makes large amounts of pale, watery urine, often along with
  diabetes, not a sickness in which little urine is made.
examples:
- His polyuria meant he passed large amounts of pale, watery urine.
- Polyuria often came along with her diabetes.
