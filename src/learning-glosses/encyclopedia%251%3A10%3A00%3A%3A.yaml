simpleMeaning: a book of facts, often in several volumes, with pieces on many subjects, often in A-to-Z
  order, covering all human knowledge or one special field
scope: A book of facts on many subjects, not a dictionary of word meanings and not a single-subject textbook.
examples:
- She looked up the answer in the encyclopedia.
- Our school library has a ten-volume encyclopedia.
