simpleMeaning: causing a sharp pain or a stinging feeling, used especially of cold
scope: This describes cold or wind that causes sharp pain, not a sharp taste in the mouth, not anger about
  unfair treatment, and not deep sadness.
examples:
- A bitter wind cut through his thin coat.
- We walked home in the bitter cold.
