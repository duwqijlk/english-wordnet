simpleMeaning: A roller takes the picture from a raised plate with type on it
scope: A way of moving a picture from a raised plate onto a roller, not a way of printing from flat plates
  and not a way of setting type by hand.
examples:
- The shop used letterset printing for its labels.
- Letterset printing moved the picture from the plate to the roller.
