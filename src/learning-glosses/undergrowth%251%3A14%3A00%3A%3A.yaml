simpleMeaning: the small trees, bushes, ferns and other low plants that grow under taller trees in a wood
  or forest
scope: Low plants under taller trees in a wood, not the taller trees themselves and not a single bush.
examples:
- The undergrowth was so thick that we could hardly see the path.
- Deer hid in the undergrowth beneath the tall oaks.
