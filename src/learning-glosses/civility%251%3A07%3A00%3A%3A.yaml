simpleMeaning: politeness that is formal, or done with little care or effort because it is expected
scope: Polite behaviour of this formal kind, not rude behaviour and not warm, close friendship.
examples:
- He greeted his neighbour with civility, though they were not friends.
- She answered with civility, even when she was angry with him.
