simpleMeaning: in a way that shows thinking or guessing about what might be true, without knowing for
  sure
scope: This describes a way of thinking or looking that is based on guessing, not a way based on sure
  facts or proof.
examples:
- She looked at him speculatively, trying to guess what he was thinking.
- He spoke speculatively about who might win, since no one knew yet.
