simpleMeaning: A unit of stored facts, as big as 1,000 petabytes, or 10 to the power 18 bytes.
scope: Also called exabyte; the 1,000-based big unit, not the 1,024-based one and not a bit unit.
examples:
- The archive holds three EB of film.
- One EB holds a thousand petabytes.
