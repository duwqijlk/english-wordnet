simpleMeaning: a thing put into food, gasoline, paint, or medicine to make it better
scope: A thing put into something else to make it better. Not the use of this word in maths for an equation,
  and not its sense of being made by adding amounts together.
examples:
- This food has no additives in it.
- They put an additive in the gasoline to help clean the engine.
