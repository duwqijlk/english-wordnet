simpleMeaning: paper put round a book, most often printed with words and pictures that tell people about
  the book and make them want to read it
scope: 'Also called a book jacket, a dust cover, and a dust jacket: paper round a book, not a plastic
  sheet put over a machine.'
examples:
- The dust wrapper showed a picture of the writer on the back.
- She took the dust wrapper off the book and put it in a drawer.
