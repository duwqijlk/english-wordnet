simpleMeaning: Each hind wing bears a small curved mark with a tail on its underside, marking this winged
  insect with angled wings
scope: Also called a comma, this winged insect has angled wings and a small curved mark with a tail on
  the underside of each hind wing.
examples:
- The comma butterfly has a small curved mark on the underside of each hind wing.
- The comma butterfly shows its small curved mark on the underside of each hind wing.
