simpleMeaning: The part of the study of building things that looks, with the help of number machines,
  at steps and forms that can be worked out by such machines
scope: The part of the study of building things that looks, with the help of number machines, at steps
  and forms that can be worked out by such machines; computing is another name for this sense, not the
  machine itself and not a single program.
examples:
- She studies computer science at the university.
- Computer science looks at steps and forms that number machines can work out.
