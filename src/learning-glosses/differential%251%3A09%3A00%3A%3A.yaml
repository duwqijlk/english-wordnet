senseId: 'differential%1:09:00::'
synsetId: 06024079-n
simpleMeaning: In maths, the answer you get when you work out how fast one amount is changing at one moment
  next to another amount, written as df(x)/dx
scope: In maths, also called derivative, derived function, differential coefficient, and first derivative.
  It is not the word for a quality that makes things different, and not the adjective uses about showing
  a difference.
examples:
- We worked out the differential of the function in class.
- The differential shows how fast the amount is changing.
