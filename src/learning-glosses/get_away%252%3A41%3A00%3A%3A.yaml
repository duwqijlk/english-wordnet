simpleMeaning: For a short time, a person leaves home and work behind, most often to rest or have fun
scope: Also called escape; to leave home and work for a short rest or fun, not to run off from danger
  and not to leave a job for good.
examples:
- We got away to the coast for the weekend.
- She hopes to get away from the office for a few days.
