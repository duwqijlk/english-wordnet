simpleMeaning: a close-fitting shirt with no sleeves, wide straps over the shoulders, a low neck, and
  no opening down the front; often worn over another shirt or blouse
scope: A sleeveless shirt, not a vest worn under clothes and not a dress with a front opening.
examples:
- She wore a tank top over a white shirt.
- His tank top has wide straps and a low neck.
