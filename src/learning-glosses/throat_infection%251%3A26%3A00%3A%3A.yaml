simpleMeaning: An illness of the back of the mouth and the tonsils, caused by streptococcus, a kind of
  germ.
scope: 'Also called strep throat, septic sore throat, streptococcal sore throat and streptococcus tonsilitis:
  an illness of the back of the mouth and tonsils caused by streptococcus germs, not a cold or a sore
  throat from another cause.'
examples:
- The doctor said her throat infection was caused by streptococcus and gave her medicine.
- The test showed his throat infection came from streptococcus, so the doctor gave him antibiotics.
