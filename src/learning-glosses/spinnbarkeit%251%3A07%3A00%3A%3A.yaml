simpleMeaning: Pulled into a thread or blown into a bubble, a thick sticky fluid shows how far it can
  stretch, above all the fluid made by the neck of the womb.
scope: The stretch of a thick sticky fluid into a thread or a bubble, not the fluid itself, is what this
  word names.
examples:
- The fluid's spinnbarkeit showed when it pulled into a thread.
- The spinnbarkeit let the fluid blow into a bubble.
