simpleMeaning: With holes in the nose far apart, New World monkeys and people with wide noses are the
  ones this word is about
scope: 'Also called broadnosed, platyrhine, platyrrhine, platyrrhinian and platyrrhinic: said of New World
  monkeys with holes in the nose far apart or of people with wide noses, not of monkeys with holes in
  the nose close together.'
examples:
- The platyrhinian monkey had holes in its nose set far apart.
- Platyrhinian people have broad noses.
