simpleMeaning: A shrubby tree, green all year and sweet-smelling, of the south-east United States, with
  small hard berries thickly coated in white wax used for candles.
scope: This is a shrubby tree whose small hard berries are thickly coated in white wax used for candles,
  also called bay myrtle and puckerbush.
examples:
- Myrica cerifera bears small hard berries coated in white wax.
- Candles were once made from the wax of Myrica cerifera.
