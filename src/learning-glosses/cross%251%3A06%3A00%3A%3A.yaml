simpleMeaning: A shape that shows the frame on which Jesus was put to death; used as a sign of the Christian
  faith or in coats of arms.
scope: A sign of the Christian faith, not the act of going across, and not a mark of anger.
examples:
- A gold cross hung on the wall.
- She wore a small cross.
