simpleMeaning: The white band at the end of its tail marks a bird that nests in North America and spends
  the winter in warm America.
scope: It is a bird that nests in the north and winters in the warm south, not a bird that stays in one
  place all year.
examples:
- An eastern kingbird perched on the fence.
- Eastern kingbirds return north each spring.
