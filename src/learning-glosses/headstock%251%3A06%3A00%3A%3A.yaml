simpleMeaning: In a machine or power tool, a gripping chuck or the rod of a lathe is held and turned by
  this fixed part, which keeps a spinning part moving.
scope: It is the fixed part of a machine or power tool that holds and turns a spinning part, and it does
  not move itself.
examples:
- The headstock of the lathe held the chuck and turned it.
- A loose headstock will not hold the work steady.
