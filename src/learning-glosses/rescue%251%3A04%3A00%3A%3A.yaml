simpleMeaning: the act of getting someone or something back, or of keeping them safe, from loss or danger
scope: Also called saving. This is about getting someone or something back, or keeping them safe, from
  loss or danger, not about keeping money for later use.
examples:
- The rescue of the trapped miners took two days.
- Their rescue from the burning building was shown on the news.
