simpleMeaning: Found with oil, this smooth soft mineral is a mix of compounds of hydrogen and carbon;
  some kinds go into ceresin, a soft solid, and candles.
scope: Also called ader wax, mineral wax, ozocerite, and ozokerite; it is a mineral found with oil, not
  the wax made by bees.
examples:
- Earth wax was once used to make candles.
- Miners dug earth wax from the ground near the oil.
