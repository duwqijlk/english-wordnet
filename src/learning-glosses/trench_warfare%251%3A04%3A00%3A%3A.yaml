simpleMeaning: fighting where the two sides face each other from long, deep ditches dug in the ground
scope: This is fighting from ditches that face each other; not open fighting across a field and not a
  siege of a town.
examples:
- The First World War is known for its trench warfare.
- After weeks of trench warfare, neither side had moved.
