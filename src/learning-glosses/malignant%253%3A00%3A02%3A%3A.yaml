simpleMeaning: dangerous for health, and keeps growing in a way that cannot be stopped, especially of
  a tumor (a lump of new cells in the body)
scope: About a growth that is dangerous for health and keeps growing in a way that cannot be stopped,
  especially a tumor. Not a harmless growth that does not harm health.
examples:
- The test showed that the tumor was malignant.
- Doctors removed the malignant growth before it grew more.
