simpleMeaning: In computer science, a pen-like tool that, when held to a screen, tells whether the spot
  under it is lit.
scope: In computer science, a pen-like tool for a screen, also called a light pen; not a mouse and not
  an ordinary pen.
examples:
- She touched the electronic stylus to the screen to pick a menu item.
- The electronic stylus told the computer which spot was lit.
