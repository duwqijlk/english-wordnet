simpleMeaning: In eye care, this fault leaves sight blurred because light is bent the wrong way as it
  enters the eye, as in short sight or in uneven bending.
scope: In eye care, this is the broad fault behind short sight and uneven bending, where light is bent
  wrongly in the eye.
examples:
- Street signs stayed a blur for someone with ametropia.
- The letters on the page would not come clear with ametropia.
