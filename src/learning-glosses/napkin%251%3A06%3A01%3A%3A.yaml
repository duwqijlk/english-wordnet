simpleMeaning: a folded piece of cloth put between a baby's legs and fixed at the waist, worn to catch
  solid waste from the body
scope: 'Also called diaper: a cloth a baby wears, not the small cloth used at a table to wipe the mouth
  and to cover the lap to keep clothes clean.'
examples:
- The baby needed a clean napkin, so her mother changed her.
- He washed the cloth napkins the baby had worn that day.
