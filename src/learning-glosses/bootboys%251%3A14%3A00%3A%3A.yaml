simpleMeaning: English working-class youth subculture of the late 1960s, a reaction against hippies, with
  cropped hair, work-shirts, short jeans and heavy red footwear; members attacked Asians and fought at
  football matches.
scope: Another name for the skinhead youth subculture; it names the group as a whole, not one member of
  it.
examples:
- By the early 1970s the bootboys were a familiar sight outside English football grounds.
- Police blamed clashes between bootboys and rival supporters for the trouble after the match.
