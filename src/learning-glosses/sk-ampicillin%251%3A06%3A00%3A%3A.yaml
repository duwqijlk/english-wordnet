scope: A drug of the penicillin kind made partly by chemical means; ampicillin, Polycillin and Principen
  are other names for this sense, not a penicillin found in nature unchanged.
examples:
- The doctor prescribed SK-Ampicillin for the infection.
- SK-Ampicillin is sold under the trade names Principen and Polycillin.
