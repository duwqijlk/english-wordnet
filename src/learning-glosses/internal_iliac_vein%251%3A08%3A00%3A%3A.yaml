simpleMeaning: Joining the blood tube from the outer hip, this tube deep inside the hip makes a larger
  one with it
scope: Also called the hypogastric vein, this tube in the hip joins the one from the outer hip to make
  a larger tube.
examples:
- The internal iliac vein joins the external iliac vein in the hip.
- Blood flows through the internal iliac vein towards the larger vein it helps to form.
