simpleMeaning: in a bossy way that pushes others around and lets no one say no, like a ruler with full
  power
scope: To act in a bossy way that pushes others around and lets no one say no, also called autocratically
  or magisterially, and not to lead by asking what others think.
examples:
- The new manager acts dictatorially toward his staff.
- She spoke dictatorially, and no one dared to say no.
