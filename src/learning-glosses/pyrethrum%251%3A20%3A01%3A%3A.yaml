simpleMeaning: A long-lived Asian garden plant with finely cut, fragrant leaves and white to pink-purple
  spring blooms; insecticide is made from it, and it is sometimes grouped with chrysanthemums.
scope: Another name for the plant called painted daisy, not the insecticide made from it or the white-flowered
  Balkan kind.
examples:
- A row of pyrethrum flowered white and pink along the wall all spring.
- Farmers once planted pyrethrum as a source of insecticide.
