simpleMeaning: no amount that counts for anything; not any thing at all, a word used for a single thing
  when there is none
scope: Also called nothing, zero, zip, naught, aught, nil, cipher, nada, null, cypher, zilch, goose egg
  and zippo. This means no amount at all, not the act of stopping or saying no to a plan.
examples:
- We earned nix for all that hard work.
- He knows nix about what happened.
