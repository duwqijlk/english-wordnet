simpleMeaning: With pale yellow flowers that hang down like small cups, this is one of many kinds of plant
  in a single group.
scope: Merry bells and wild oats are other names for this plant, whose pale yellow flowers hang down instead
  of standing up straight.
examples:
- Bellwort bloomed with pale yellow flowers hanging down.
- The bellwort's flowers hung down like small cups.
