simpleMeaning: a person who flies planes by going from town to town to put on shows of daring flying and
  parachuting
scope: 'Also called a stunt flier or a barnstormer: a person who goes round the country putting on shows
  of daring flying and parachuting, not a pilot of a plane that carries people and not a person who jumps
  for fun.'
examples:
- The stunt pilot looped over the airfield as the crowd watched.
- She hired a stunt pilot to open the show with a parachute jump.
