simpleMeaning: A mirror-based star-watching tool with a flat glass plate that fixes blur, so a wide stretch
  of sky can be photographed.
scope: A mirror-based star-watching tool whose flat glass plate fixes blur so a wide stretch of sky can
  be photographed; Schmidt camera is another name for this sense.
examples:
- The Schmidt telescope photographed a wide stretch of the night sky.
- Astronomers use a Schmidt telescope to map large areas of sky.
