simpleMeaning: a thin wire, usually made of tungsten (a hard metal), that gets so hot from an electric
  current that it turns white
scope: The thin wire in a bulb that heats up and glows white; not a thin thread-like fibre made by nature
  or by people.
examples:
- The filament in the old bulb broke, so the light went out.
- A hot filament glowed white inside the lamp.
