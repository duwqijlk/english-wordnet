simpleMeaning: In psychiatry, a way of guarding the mind that splits a thing you feel two ways about into
  two pictures, one good and one bad.
scope: In psychiatry, a way of guarding the mind that splits a thing you feel two ways about into a good
  picture and a bad one; idealization is another name for it, not simply liking a thing too much.
examples:
- His idealisation split his mother into a good figure and a bad one.
- Idealisation can turn a person you feel two ways about into two pictures.
