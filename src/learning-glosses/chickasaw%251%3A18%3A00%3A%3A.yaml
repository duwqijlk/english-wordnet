simpleMeaning: One of the Muskhogean group of peoples, who used to live in the north of Mississippi
scope: A member of that people, not a speaker of their tongue (the batch 4860 language sense) and not
  a member of another people.
examples:
- Her grandfather was a Chickasaw from northern Mississippi.
- The Chickasaw lived in northern Mississippi long ago.
