simpleMeaning: at the top of something, or making its top part
scope: This is about being at, or making, the top of a thing, not about being the greatest success someone
  has ever reached.
examples:
- A gold star sat as the crowning piece on top of the tree.
- The crowning stones formed the top of the arch.
