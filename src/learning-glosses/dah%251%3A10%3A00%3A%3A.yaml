simpleMeaning: In Morse code (a way of sending words with short and long signals), the longer of the two
  signals
scope: Also called dash, this is the long signal in Morse code. It is not the short signal in the same
  code.
examples:
- In Morse code, the letter A is made with a short sound and a long dah.
- He tapped out the message, dah after dah, on the old machine.
