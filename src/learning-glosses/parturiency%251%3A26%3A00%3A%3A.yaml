simpleMeaning: From the first pains until the child is born, this is the last stage of a pregnancy
scope: 'Another name for labor, confinement, childbed, travail and lying-in: the last stage of a pregnancy,
  not the whole pregnancy and not the birth itself.'
examples:
- Parturiency began at midnight, and her daughter was born at dawn.
- The nurse said her parturiency would last several hours.
