simpleMeaning: the hard outer layer, usually made of tough threads, of some fruits, especially nuts
scope: The hard outer layer of some fruits, above all nuts, not the hard cover of a sea animal and not
  the hard cover of a bird's egg.
examples:
- Crack the shell and eat the nut inside.
- The shell of the walnut was hard to break.
