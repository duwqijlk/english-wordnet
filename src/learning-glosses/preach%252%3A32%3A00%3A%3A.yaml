simpleMeaning: to speak strongly and give reasons to persuade others that something is good or right
scope: Also called advocate, this sense is speaking strongly for something you believe is good or right;
  not giving a religious talk and not speaking against something.
examples:
- She preaches the value of daily exercise to all her patients.
- Local leaders preached a plan to keep the streets clean.
