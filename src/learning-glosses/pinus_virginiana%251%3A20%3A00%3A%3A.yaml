simpleMeaning: A common small bushy pine of the east United States, with crooked spreading branches and
  short needles in pairs.
scope: A common small bushy pine of the east United States with short needles in pairs, also called scrub
  pine, Jersey pine and Virginia pine, not a tall straight pine and not a pine of the west.
examples:
- Pinus virginiana grows in the east of the United States.
- The Pinus virginiana has short needles in bunches of two.
