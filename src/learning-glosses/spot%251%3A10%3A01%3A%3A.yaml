simpleMeaning: A short piece or picture in broadcasting or a magazine, often used to advertise something.
scope: This is not the word for a small round mark or a place; it means a short broadcast or magazine
  item.
examples:
- They ran a thirty-second spot during the football match.
- The magazine sold advertising spots on its back page.
