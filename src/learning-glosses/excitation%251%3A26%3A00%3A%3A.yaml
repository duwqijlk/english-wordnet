simpleMeaning: The stirring of a body part, muscle, or gland by nerve signals or by electric power.
scope: The stirring of a body part, muscle, or gland, also called irritation and innervation; not the
  rest of a body part and not a pain in it.
examples:
- Excitation of the muscle made it pull tight.
- The nerve gave excitation to the gland, and it began to work.
