simpleMeaning: a natural fiber, such as raw cotton, wool, hemp or flax, that can be twisted to make yarn
scope: A natural fiber that can be twisted into yarn; not a paper fastener, and not a food that people
  always need.
examples:
- Staple fibers vary widely in length.
- Wool is a staple that spinners twist into yarn.
