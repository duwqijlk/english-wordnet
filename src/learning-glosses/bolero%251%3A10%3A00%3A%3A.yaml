simpleMeaning: Music made to the beat of the Spanish dance of the same name.
scope: Music made to the beat of the Spanish dance of the same name, not the Spanish dance itself, with
  three beats to the bar, danced to guitar and castanets.
examples:
- The band played a bolero, and the dancers swayed.
- A bolero filled the hall with its slow, steady beat.
