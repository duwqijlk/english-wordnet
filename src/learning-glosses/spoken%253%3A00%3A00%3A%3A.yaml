simpleMeaning: said out loud with the voice, not written; sometimes used as part of a longer word
scope: Describing language said out loud rather than written down; it is also found as the second part
  of words like soft-spoken. It is not the written form of a language.
examples:
- The spoken test asks you to answer questions out loud.
- She is a soft-spoken teacher who never shouts in class.
