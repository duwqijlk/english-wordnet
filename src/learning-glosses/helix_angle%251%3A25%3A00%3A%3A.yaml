simpleMeaning: The fixed slant at which a spiral line crosses the straight lines of a tube or a cone
scope: This is the fixed slant at which a spiral line crosses the straight lines of a tube or a cone,
  and not the slant of a straight line or the curve of the spiral itself.
examples:
- The helix angle stays the same along the spiral.
- Engineers checked the helix angle of the screw thread.
