simpleMeaning: done in too much of a hurry, without stopping to think or weigh the matter
scope: Done in too much hurry without thought, not a choice made on a whim and not a natural show of feeling.
examples:
- It was an impulsive decision to spend all his savings at once.
- Liable to such impulsive acts as hugging strangers, he often embarrassed his friends.
