simpleMeaning: A sickness-causing tiny bit of stuff in green growing things, made of one single thread
  of RNA, the stuff that carries the code of life.
scope: A sickness-causing tiny bit of stuff in green growing things, made of one single thread of RNA;
  not a bacterium and not a fungus.
examples:
- The plant virus turned the tomato leaves yellow.
- A plant virus can spread from one crop to the next.
