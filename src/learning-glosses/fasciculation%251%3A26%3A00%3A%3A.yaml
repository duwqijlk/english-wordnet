simpleMeaning: Twitching of groups of muscle fibers that lie next to each other.
scope: Twitching of groups of muscle fibers that lie next to each other, not a single sharp spasm and
  not a shaking tremor.
examples:
- The doctor noticed a fasciculation in the muscles of his arm.
- Fasciculation can be seen as small ripples under the skin.
