simpleMeaning: A cross between a mandarin orange and a lemon, with very sour fruit and orange skin.
scope: Also called lemanderin, rangpur and rangpur lime, this is a sour-fruited cross of mandarin and
  lemon, not a sweet orange.
examples:
- The Citrus limonia bears very sour fruit.
- Citrus limonia juice is too sour to drink plain.
