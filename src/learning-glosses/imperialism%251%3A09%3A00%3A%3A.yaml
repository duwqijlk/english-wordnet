simpleMeaning: a way of thinking about politics that supports a country ruling other lands
scope: A set of political ideas that supports a country ruling other lands, not a single act of spreading
  control by force or strong pressure.
examples:
- His support for colonies grew from a belief in imperialism.
- Imperialism shaped the party's view that their country should rule lands overseas.
