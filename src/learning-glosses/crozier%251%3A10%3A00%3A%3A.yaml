senseId: 'crozier%1:10:00::'
synsetId: 07282014-n
simpleMeaning: A long stick topped with a bent hook or a cross, carried by bishops as a sign of their
  office as shepherds of their people
scope: A bishop's staff topped with a hook or cross, also called a crosier; not a walking stick and not
  a king's sceptre.
examples:
- The crozier was carried before the bishop in procession.
- He took up the crozier as a sign of his office.
