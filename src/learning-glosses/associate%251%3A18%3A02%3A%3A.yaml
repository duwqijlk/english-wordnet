senseId: 'associate%1:18:02::'
synsetId: 09836579-n
simpleMeaning: a person who belongs to a group, an organization, or a business, but who is not a full
  member and has less power
scope: This is a person with a lower place in a group or business, not the title from a two-year college
  and not the act of joining or linking things together.
examples:
- He is an associate at the law firm, not yet a full partner.
- Associates of the club may use the library but cannot vote.
