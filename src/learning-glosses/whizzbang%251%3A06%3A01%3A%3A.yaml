simpleMeaning: a small shell that moves very fast, making a high rushing noise and then a loud bang when
  it hits
scope: 'Also called whizbang and whizbang shell: the same small fast shell, not a firecracker and not
  a slow shell.'
examples:
- A whizzbang passed over our heads and burst.
- The whizzbang made a rushing noise, then a bang.
