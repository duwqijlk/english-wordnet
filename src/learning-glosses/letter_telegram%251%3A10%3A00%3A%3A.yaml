simpleMeaning: Sent to another country for less money than an ordinary message, this one gets there the
  day after it is sent
scope: A low-cost message sent abroad, not an ordinary telegram and not a letter sent by post.
examples:
- She sent a letter telegram to her cousin in Canada, and it arrived the next day.
- A letter telegram was cheaper than a phone call to Europe.
