simpleMeaning: a sweater or other top with a high collar that fits closely round the neck
scope: A top with a high, close collar, not the animal with a hard shell and not hunting that animal.
examples:
- She wore a warm turtle with a high collar under her coat.
- His red turtle kept his neck warm in the cold wind.
