simpleMeaning: 'Many onward lines of unlike kinds and lengths: that is how a new way of thinking sees
  the change of ways of life.'
scope: This theory sees ways of life changing along many onward lines, not along one single line.
examples:
- Multilinear evolution sees each culture following its own onward line.
- In multilinear evolution, no two cultures need follow the same onward line.
