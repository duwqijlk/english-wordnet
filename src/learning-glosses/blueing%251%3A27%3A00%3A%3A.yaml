simpleMeaning: a substance added when washing clothes or hair to make them whiter, or to give them a faint
  sky colour
scope: 'Also called blue and bluing: a substance added to wash water to whiten clothes or hair, not a
  soap and not a hair dye.'
examples:
- She put blueing in the rinse to keep the white sheets bright.
- A little blueing in the wash gave his grey hair a faint blue tinge.
