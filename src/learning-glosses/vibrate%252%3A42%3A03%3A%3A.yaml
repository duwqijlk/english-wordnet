simpleMeaning: to be not sure what to do about something, and keep moving between two different ways of
  acting
scope: 'Also called hover: to stay unsure and move between two choices, not to shake quickly back and
  forth and not to feel a sudden strong feeling.'
examples:
- He vibrated between taking the new job and staying where he was.
- She vibrated for days between the two offers, unable to choose.
