simpleMeaning: A part with one free link, made of oxygen and hydrogen (-OH), found in bases and in some
  sour liquids and alcohols.
scope: A part with one free link, made of oxygen and hydrogen, found in bases and in some sour liquids
  and alcohols, not a methyl group and not a water molecule; hydroxyl and hydroxyl group are other names
  for this sense.
examples:
- A hydroxyl radical has one free link.
- Hydroxyl radicals react fast with other bits of matter.
