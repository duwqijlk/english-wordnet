simpleMeaning: to change things so each one is the same as the others in size, amount, or way
scope: 'Also called equal, equalize, equate and match: to make things the same as each other, not to make
  one thing better than another and not to leave things as they are.'
examples:
- Let's equalise the pay so everyone gets the same amount.
- The cook tried to equalise the two piles of flour.
