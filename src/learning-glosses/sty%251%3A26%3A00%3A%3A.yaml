simpleMeaning: An infection in a small part of the skin of the eyelid that makes oil (the sebaceous gland)
scope: This is an infection in a small part of the skin of the eyelid that makes oil, not a small pen
  or place where pigs are kept.
examples:
- She woke up with a painful sty on her left eyelid.
- The doctor told him not to rub the sty on his eye.
