simpleMeaning: the large hole at the bottom of the skull, where the cord that runs down the back passes
  through
scope: A large hole at the bottom of the skull for the cord that runs down the back, not the eye hole
  and not the hole for the ear.
examples:
- The foramen magnum sits at the base of the skull.
- The spinal cord passes through the foramen magnum on its way down the back.
