simpleMeaning: Made to look nice, this twist in a cord is a sign of love
scope: Also called love knot and lover's knot, this is a twist in a cord, made to look nice, that stands
  for love, not a twist that holds things together.
examples:
- The lovers' knot on the ring stood for their love.
- They tied a lovers' knot in the ribbon for the wedding.
