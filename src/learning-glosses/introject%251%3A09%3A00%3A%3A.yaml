simpleMeaning: In psychoanalysis, a parent figure a child takes into the mind along with that parent's
  values; the voice of conscience is usually a parent's voice taken in this way.
scope: In psychoanalysis, a parent figure taken into a child's mind with its values, not a parent in real
  life and not the verb sense of taking attitudes or ideas into one's mind.
examples:
- The introject spoke in his mother's voice whenever he felt guilty.
- Her harsh introject made her feel she had failed.
