scope: This is a small woody plant of Asia that gives a poisonous sap from which a hard shiny coating
  is made; lacquer tree, varnish tree, Chinese lacquer tree, Japanese lacquer tree, Japanese varnish tree,
  Rhus verniciflua and Toxicodendron vernicifluum are other names for this sense, and it is set apart
  from other small trees of Asia by its poisonous sap.
examples:
