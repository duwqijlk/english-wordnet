simpleMeaning: to add to a book a list in letter order of names and topics, with the pages where each
  can be found
scope: To add the whole list at the back of a book, not to put one name in a list that is already there
  and not to change amounts so they follow prices.
examples:
- They hired someone to index the new textbook before it was printed.
- She spent a week indexing the long history book for its readers.
