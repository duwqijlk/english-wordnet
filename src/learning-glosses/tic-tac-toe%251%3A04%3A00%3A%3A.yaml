simpleMeaning: A game where two players by turns set crosses and rings in a nine-box square grid, aiming
  for a row of three crosses or three rings first.
scope: This sense is also called noughts and crosses, tick-tack-toe, ticktacktoe, ticktacktoo, and tit-tat-toe.
examples:
- Tic-tac-toe is played on a grid.
- A tic-tac-toe ended in three rings.
