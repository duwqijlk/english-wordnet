simpleMeaning: Rubbish sits in this bin until workers come to take it away
scope: A bin for rubbish, also called an ash bin, ash-bin, ashbin, ashcan or dustbin; not a kitchen machine
  that grinds waste and not a truck that takes waste away.
examples:
- The garbage can was full, so we put the extra bags beside it.
- Please wheel the garbage can to the curb on Tuesday morning.
