simpleMeaning: a man of high birth in various countries, whose rank is not the same from one country to
  another
scope: This is a man of high birth whose rank changes from country to country. It is not the British-only
  sense, where a baron is a peer of the lowest rank.
examples:
- In that country, a baron was a man of high rank, though not as high as a count.
- The king made him a baron for his long service.
