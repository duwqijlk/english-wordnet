simpleMeaning: A pair of wire loops in a sensitive meter, wound so their magnetic effects cancel and outside
  fields induce no current, keeping the needle steady.
scope: The paired, self-cancelling winding of a sensitive instrument, not an ordinary winding that sets
  up a magnetic field when current flows.
examples:
- The galvanometer's astatic coils cancelled the earth's field so the needle stayed steady.
- Astatic coils must be matched in pairs, or the reading will drift.
