simpleMeaning: honoured as a winner, as if given a ring of leaves from the laurel tree
scope: For a person honoured as a winner with laurel leaves, not for a thing given a crown as named and
  not for a tooth with a crown on it.
examples:
- The crowned winner wore a ring of laurel leaves.
- The crowned hero stood before the cheering crowd.
