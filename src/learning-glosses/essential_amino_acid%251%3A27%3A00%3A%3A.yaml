simpleMeaning: A building block of body stuff that animals need but cannot make for themselves, so it
  must come in their food
scope: A building block of body stuff animals need but cannot make; not a building block the body can
  make for itself, and not a vitamin.
examples:
- Meat gives us essential amino acids our bodies cannot make.
- An essential amino acid must come in the food we eat.
