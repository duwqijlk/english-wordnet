simpleMeaning: A sudden loss of consciousness when a blood vessel in the brain breaks or is blocked, so
  the brain lacks oxygen.
scope: Also called stroke, apoplexy and cerebrovascular accident; a sudden loss of consciousness from
  a broken or blocked vessel in the brain, not a slow brain illness.
examples:
- He suffered a CVA and lost consciousness.
- A CVA can follow the rupture of a blood vessel in the brain.
