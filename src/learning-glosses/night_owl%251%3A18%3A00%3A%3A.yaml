simpleMeaning: A person who likes to stay up and do things late in the evening
scope: This is a person who likes to stay up late; nighthawk and nightbird are other names for this sense,
  and not a bird or a person who is up late only because of work.
examples:
- He is a night owl who reads until two in the morning.
- The night owl in our house does her best work after midnight.
