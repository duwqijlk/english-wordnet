simpleMeaning: At times beside an artery, a vein runs beside another part of the body, and the beats of
  the artery help the blood flow back.
scope: Also called accompanying vein, this vein runs beside another part of the body and at times beside
  an artery whose beats help blood flow back.
examples:
- The vena comitans runs beside the artery, whose beats help the blood flow back.
- Each vena comitans stays close to the structure it runs beside.
