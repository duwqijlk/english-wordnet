simpleMeaning: People who study Etruscan life in the past look most of all at the old things left behind
  and the language spoken then.
scope: The study of one old people and its past, not the study of all old times and not the study of one
  old language alone.
examples:
- She teaches Etruscology at the university.
- His work in Etruscology looks at old pots and the words cut into stone.
