simpleMeaning: the state of feeling pleased and glad because a want or need has been met
scope: 'Also called satisfaction: this is the pleased feeling when a want or need is met, not the act
  that meets the want or need.'
examples:
- She felt great gratification when her hard work was finally praised.
- Helping others gave him deep gratification that money could not give.
