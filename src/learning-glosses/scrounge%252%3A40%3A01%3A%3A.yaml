simpleMeaning: to get, or try to get, something by begging or by coaxing it out of people
scope: To get, or try to get, something by begging or by coaxing it out of people; not to buy it and not
  to earn it.
examples:
- He scrounged a cigarette from a stranger at the bus stop.
- She scrounged enough money for lunch from her friends.
