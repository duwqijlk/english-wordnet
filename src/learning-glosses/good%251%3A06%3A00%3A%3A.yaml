simpleMeaning: A basic material or product that is traded in large amounts, usually sold to companies
  that use it to make other things.
scope: This is a raw material or bulk product sold for manufacturing, not a moral quality and not something
  that is merely helpful.
examples:
- In economics, copper is a good traded in large volumes between firms.
- Timber is a good sold in bulk to furniture makers.
