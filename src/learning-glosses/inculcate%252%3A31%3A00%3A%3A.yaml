simpleMeaning: By saying the same thing over and over, with firm warnings, you fix an idea or a value
  firmly in a person's mind
scope: This is teaching an idea or value by saying it again and again with firm warnings, also called
  infuse or instill, and not just telling someone something once.
examples:
- Her parents inculcated respect for others into her from an early age.
- The teacher inculcated good study habits in his pupils by repeating the rules every day.
