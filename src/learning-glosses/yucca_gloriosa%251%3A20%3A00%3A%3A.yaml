simpleMeaning: A plant of the southeastern United States with a shorter trunk and smoother leaves than
  the Spanish bayonets it looks like.
scope: A plant of the southeastern United States, also called Spanish dagger; it is like the Spanish bayonets
  but with a shorter trunk and smoother leaves, which sets it apart from them.
examples:
- Yucca gloriosa grows near the coast of the southeast.
- The shorter trunk told us it was Yucca gloriosa.
