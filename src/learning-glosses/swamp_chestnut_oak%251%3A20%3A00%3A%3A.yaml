simpleMeaning: A middle to large tree, with leaves that fall in autumn, from wet places in the south-east
  United States, much like another tree.
scope: A middle to large tree from wet places in the south-east United States, with leaves that fall in
  autumn; not a small bush and not a tree of dry high land.
examples:
- The swamp chestnut oak grows in the wet woods of the south-east.
- Swamp chestnut oaks lose their leaves in autumn.
