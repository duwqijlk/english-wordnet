simpleMeaning: This hard, fine or runny mix makes the water of a tub soft and gives it a smell as it fills
  it with bubbles.
scope: This mix is also called bath foam, bubble bath and foam bath.
examples:
- He added the foaming bath to the tub and the water filled with bubbles.
- The foaming bath made the water soft and full of bubbles.
