simpleMeaning: a North American bush that climbs by winding around things, with yellow cases that hold
  bright red seeds
scope: 'Also called waxwork, climbing bittersweet, false bittersweet, shrubby bittersweet, and staff vine:
  this North American climbing bush, not the other plant of this name from the Old World, and not the
  taste that is both bitter and sweet.'
examples:
- Bittersweet climbed over the fence, its yellow cases opening to show red seeds.
- In the fall, bittersweet grows bright red seeds inside yellow cases along the road.
