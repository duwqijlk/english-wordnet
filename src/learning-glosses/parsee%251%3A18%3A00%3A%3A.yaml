simpleMeaning: A person who follows a faith that holds to one god, a faith that began with Zoroaster,
  whose forebears came from Persia and who now live in western India.
scope: Also called Parsi; a member of a one-god faith of old Persian roots, now living in western India,
  set apart from other Indian faith groups by its Persian forebears and its one god.
examples:
- The Parsee community in Mumbai keeps its old fire temple.
- My neighbour is a Parsee whose family came from Persia long ago.
