simpleMeaning: A handsome East Indian green-all-year tree often planted for show, with sweet-smelling
  white flowers that give a perfume, and very heavy hard wood used for railway ties.
scope: 'Also called ironwood, ironwood tree, and rose chestnut: a handsome East Indian green-all-year
  tree with sweet-smelling white flowers, not a chestnut tree and not a rose.'
examples:
- Mesua ferrea bloomed with sweet-smelling white flowers.
- The Mesua ferrea wood was so heavy it served for railway ties.
