simpleMeaning: not hard to do or to bear, and done without trouble or hardship
scope: 'Also called soft and cushy: not hard to do or to bear, and with no hardship; not of a person who
  is calm and lets things pass.'
examples:
- He found an easygoing job with short hours and no heavy work.
- The easygoing pace of the work left her fresh at the end of the day.
