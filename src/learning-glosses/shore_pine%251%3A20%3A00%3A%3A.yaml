simpleMeaning: With red to yellow-brown bark split into small squares, this low bushy pine with two needles
  grows along the coast of the northwestern United States.
scope: People also call this lodgepole, lodgepole pine, or spruce pine, a low bushy pine of the northwestern
  coast.
examples:
- A shore pine stood on the coast.
- The shore pine's needles came in twos.
