simpleMeaning: Something or someone that people see, especially a sight that is worth noticing or is not
  usual
scope: A thing or person that people see, especially one worth noticing or not usual; not a grand show
  put on for people to watch, and not a silly act that makes a person look bad.
examples:
- The burning ship was a sad spectacle seen from the shore.
- A huge rainbow over the falls was a wonderful spectacle.
