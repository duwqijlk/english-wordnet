simpleMeaning: A set of steps that cuts word endings off so that changed forms of a word all go back to
  one base form
scope: A set of steps for cutting word endings, also called a stemming algorithm; not the worker who takes
  the stiff middles out of tobacco leaves.
examples:
- The stemmer cut the endings off the words.
- A stemmer helps a search find all forms of a word.
