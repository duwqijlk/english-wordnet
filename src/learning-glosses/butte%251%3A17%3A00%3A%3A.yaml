senseId: 'butte%1:17:00::'
synsetId: 09253109-n
simpleMeaning: a hill that rises suddenly from the land around it, with a flat top and sides that slope
  down
scope: A single steep hill with a flat top in open land; not a mountain with a sharp top, and not a long
  line of low hills.
examples:
- A lone butte rose above the flat desert plain.
- They could see the flat top of the butte from far away.
