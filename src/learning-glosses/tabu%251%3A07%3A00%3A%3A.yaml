simpleMeaning: a ban that comes from the ways of a group or from a strong feeling against a thing
scope: This is a ban that comes from group ways or a strong feeling against a thing; taboo is another
  name for this sense. Not a law passed by a court and not a ban that rests on something being sacred.
examples:
- In that town, talking about pay was a tabu.
- The tabu on eating meat on that day came from old custom.
