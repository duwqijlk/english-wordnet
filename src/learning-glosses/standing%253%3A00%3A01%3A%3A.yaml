simpleMeaning: Done while on the feet, or started from that posture.
scope: This describes an action carried out or begun while upright, such as a jump or an ovation, not
  the upright posture itself and not the act of rising to it.
examples:
- The audience rose for a standing ovation.
- He cleared the fence with a standing jump.
