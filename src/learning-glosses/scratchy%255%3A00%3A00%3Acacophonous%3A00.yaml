simpleMeaning: sounding rough and hard on the ear, in a way that is not pleasant
scope: 'Also called rough, raspy, rasping, and grating: a sound that is rough and hard on the ear, not
  a rough feel on the skin.'
examples:
- His scratchy voice made the song hard to enjoy.
- The scratchy sound of the old record filled the room.
