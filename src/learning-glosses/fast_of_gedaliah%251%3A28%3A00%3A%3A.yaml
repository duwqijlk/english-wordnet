simpleMeaning: In Judaism, a small day of going without food on Tishri 3, kept in memory of the killing
  of the Jewish governor of Judah
scope: In Judaism, a small day of going without food on Tishri 3, kept in memory of the killing of the
  Jewish governor of Judah; not a main fast day and not a day that marks the temples in Jerusalem.
examples:
- The Fast of Gedaliah falls on Tishri 3.
- On the Fast of Gedaliah, Jews remember the governor of Judah.
