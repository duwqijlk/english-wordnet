simpleMeaning: to rub a special liquid or cream on someone, especially as part of a religious ceremony
  asking for God's blessing.
scope: It is not putting fuel in a machine or paint on a picture; it means putting a liquid or cream on
  a person, usually in a religious rite.
examples:
- The bishop oiled the new king's head during the ceremony.
- In the old rite, they oiled the sick to ask for healing.
