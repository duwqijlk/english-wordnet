simpleMeaning: A common sweet-smelling garden plant of the west Mediterranean, living many years, used
  to flavour food and once as a cure.
scope: Also called common thyme, this is a common sweet-smelling garden plant of the west Mediterranean
  used to flavour food and once as a cure, not a mint or a sage.
examples:
- Thymus vulgaris grows in the herb garden.
- We use Thymus vulgaris to flavour the soup.
