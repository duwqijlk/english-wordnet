simpleMeaning: An illness of the lungs and skin that brings up too much spit and makes lumps
scope: An illness of the lungs and skin with too much spit and lumps; also called coccidioidomycosis,
  coccidiomycosis and valley fever, not a cold and not a skin rash alone.
examples:
- Desert rheumatism left him coughing up sputum for weeks.
- She caught desert rheumatism after breathing dust in the valley.
