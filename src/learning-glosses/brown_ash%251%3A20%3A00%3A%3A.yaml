simpleMeaning: a strong wide-spreading tree from North America with dark wood that is heavy, and its leaves
  turn gold in autumn
scope: 'Also called basket ash, black ash and hoop ash: a strong tree from North America with heavy dark
  wood, not a tree with light wood and not a tree whose leaves stay green.'
examples:
- The brown ash in our yard has leaves that turn gold every autumn.
- They planted a brown ash for its dark heavy wood.
