simpleMeaning: a tail, most often the tail of an animal that feeds its young with milk, set behind and
  above the opening where waste leaves the body
scope: A tail, most often that of an animal that feeds its young with milk, set behind and above the opening
  where waste leaves the body, not a leg and not a tail set low on the body.
examples:
- The monkey's caudal appendage curled around the branch.
- A caudal appendage helps the animal keep its balance.
