simpleMeaning: When metals are heated to a high heat, they take in air and turn into oxides, new stuffs
  made from metal and air.
scope: The change of metals into their oxides by heating, not melting and not rusting.
examples:
- Calcination turns the metal to a grey powder.
- The ore went through calcination in the hot kiln.
