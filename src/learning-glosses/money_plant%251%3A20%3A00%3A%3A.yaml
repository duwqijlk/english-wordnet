simpleMeaning: A plant from southeast Europe grown for its sweet purple flowers and flat round seed cases,
  thin like paper and silver-white, kept indoors to look at.
scope: This is the plant grown for its flat silver-white seed cases used indoors, also called honesty,
  satin flower, satinpod, or silver dollar — not other plants grown only for their flowers.
examples:
- The money plant in the hall has flat silver-white seed cases.
- She grows a money plant for its purple flowers and its seed cases.
