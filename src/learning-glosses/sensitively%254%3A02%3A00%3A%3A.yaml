simpleMeaning: In a way that takes care of how others feel, and does not hurt or upset them.
scope: For asking or speaking about something painful, with care for how others feel.
examples:
- She asked sensitively about the attack, giving the woman time to answer.
- He spoke sensitively, knowing the news would upset them.
