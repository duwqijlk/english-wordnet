simpleMeaning: A flower plant of South and Central America whose blooms look like those of its close kin
  but are smaller, and that some put in the Oncidium group.
scope: Also called Oncidium papilio kramerianum; a flower plant of South and Central America with blooms
  smaller than its kin, not a flower plant with large yellow and reddish-brown blooms and not a flower
  plant of cold lands.
examples:
- Psychopsis krameriana bloomed in the warm glasshouse, its small flowers open for weeks.
- The Psychopsis krameriana on the shelf has smaller blooms than its kin.
