simpleMeaning: Used especially of goods that are bought and sold, not yet treated or manufactured beyond
  the simplest steps.
scope: This is about goods made with only basic steps, not food that has not been cooked.
examples:
- The factory imports raw wool from Australia.
- Raw sugar is darker and coarser than the refined kind.
