simpleMeaning: in a way, or to a degree, that deserves blame or strong disapproval
scope: To act in a way that deserves blame, not in a way that deserves praise or pity.
examples:
- He acted culpably when he hid the damage from his boss.
- She culpably kept the money that was not hers.
