simpleMeaning: The eleventh month of the civil year, and the fifth month of the church year in the Jewish
  calendar, in July and August.
scope: Not any other month of the Jewish year, such as Nisan; also called Av.
examples:
- Ab falls in July and August.
- The fast was kept in Ab.
