simpleMeaning: Dark berries like American blueberries.
scope: This sense is dark berries like American blueberries, unlike the sense for an upright blueberry
  of the west United States, with lone flowers and rather sour berries, and unlike the sense for an upright
  European blueberry, with single flowers and blue-black berries.
examples:
- Bilberries are dark berries like blueberries.
- They picked bilberries in the woods.
