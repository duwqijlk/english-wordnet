senseId: 'kinetic_theory_of_heat%1:09:00::'
synsetId: 06117946-n
simpleMeaning: The idea that a thing gets warmer as the energy of its moving parts grows
scope: An idea about why a thing gets warmer as the energy of its moving parts grows, not a fact about
  one warm thing and not a way to cool things down.
examples:
- The kinetic theory of heat says a gas warms up when its bits move faster.
- She used the kinetic theory of heat to explain why the metal grew hot.
