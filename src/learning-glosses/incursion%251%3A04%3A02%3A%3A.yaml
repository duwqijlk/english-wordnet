simpleMeaning: a mistake through which a person becomes responsible in law or is blamed
scope: This sense is a mistake that leaves a person open to blame or to being held responsible in law.
  It is not an act of entering a place or area, often by many people.
examples:
- Signing the form without reading it was an incursion that made him liable for the loss.
- The accountant's careless incursion left her open to blame for the missing money.
