senseId: 'parameter%1:09:03::'
synsetId: 05867861-n
simpleMeaning: A number that tells something about a whole group, such as its mean (average) or variance
  (how far values spread out), and worked out from part of the group
scope: This is a number about a whole group, worked out from a part of it; not a value in a curve's equation
  that can be changed to give a family of curves, and not a general factor that sets how a system works.
examples:
- The mean age is a population parameter that they worked out from the sample.
- They used the sample figures to work out the parameter for the whole town.
