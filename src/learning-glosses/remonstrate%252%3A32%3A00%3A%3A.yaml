senseId: 'remonstrate%2:32:00::'
synsetId: 00912508-v
simpleMeaning: to argue against something as a way of protest, because you do not agree with it
scope: This is arguing against something in protest, not telling a person off hard and angrily for what
  they did.
examples:
- Workers remonstrated against the new working hours.
- She remonstrated with the council about the plan to close the road.
