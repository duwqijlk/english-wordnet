simpleMeaning: A cloth like paper made in the South Pacific by beating the thin outer skin of the paper
  mulberry and Pipturus albidus
scope: A cloth like paper from the South Pacific, made by beating thin bark; also called tapa; not the
  bark itself and not woven cotton cloth.
examples:
- The women made tappa by pounding the bark.
- He wore a cloak of tappa at the feast.
