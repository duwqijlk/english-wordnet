simpleMeaning: to let something be present or let an activity go on without objecting or stopping it
scope: This is about not opposing something that happens, not about granting formal permission, not about
  making something possible, and not about accepting a fact.
examples:
- The school does not allow mobile phones in class.
- They allowed the protest to continue peacefully.
