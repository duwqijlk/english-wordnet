simpleMeaning: A tree of New Zealand that keeps its leaves all year and looks like the kawaka, a tree
  of New Zealand
scope: 'Also called pahautea: a tree of New Zealand that keeps its leaves all year, not a low shrubby
  tree of central Europe and not a tall tree of western North America.'
examples:
- The mountain pine grew on the hillside in New Zealand.
- The mountain pine keeps its leaves all year.
