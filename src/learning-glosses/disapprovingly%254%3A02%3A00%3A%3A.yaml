simpleMeaning: in a way that shows you think something is bad or wrong
scope: This is about doing something in a way that shows you think it is bad or wrong, not in a way that
  shows you like it or agree with it.
examples:
- He shook his head disapprovingly when he saw the mess.
- She looked at the boys disapprovingly and told them to stop.
