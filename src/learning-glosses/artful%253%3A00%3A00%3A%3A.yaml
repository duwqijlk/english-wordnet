simpleMeaning: A person with this quality gets what they want with skill, most of all by being clever
  or sly
scope: This is showing skill in getting what you want by being clever or sly, not seeming open and frank
  while hiding what you really mean.
examples:
- He was an artful dodger of hard questions.
- She made an artful choice of words.
