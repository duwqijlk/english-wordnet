simpleMeaning: Saying yes to what is asked, often when one does not want to.
scope: Also called assenting; saying yes to what is asked, often unwillingly, not coming into a new office
  or throne.
examples:
- His accession to their demands set a dangerous precedent.
- Her accession to the plan came only after long debate.
