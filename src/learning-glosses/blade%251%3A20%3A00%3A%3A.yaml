simpleMeaning: Especially a leaf's wide flat part, as opposed to the stalk, or a grass leaf.
scope: The plant part, also called a leaf blade, not the flat cutting part of a tool or the long thin
  strand of lint or hair.
examples:
- Each blade of grass bent under the weight of the dew.
- The broad blade of the hosta leaf catches the morning light.
