simpleMeaning: This drug, sold as Cordarone, steadies a badly out-of-beat heart, but it can kill, so it
  is used only when safer drugs have failed.
scope: This drug steadies a badly out-of-beat heart and is used only when safer drugs have failed, not
  as a drug tried first.
examples:
- The amiodarone steadied her heartbeat.
- He took amiodarone only after safer drugs had failed.
