simpleMeaning: said of a person or thing that has been checked by a proper authority and found to meet
  the rules
scope: This is being checked by a proper authority and found to meet the rules, not simply holding papers
  that show you can do a job, and not the sense of being judged mad.
examples:
- She is a certified teacher with ten years of experience.
- The certified accountant signed the report.
