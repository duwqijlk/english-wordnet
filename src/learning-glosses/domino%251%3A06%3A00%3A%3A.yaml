simpleMeaning: a small rectangular block used in a game, with a face split into two equal parts that can
  have 0 to 6 dots
scope: This is the small block used in the game, not a loose cloak worn with a half mask for a costume
  party, and not a mask that covers only the top part of the face.
examples:
- He placed a domino with six dots on the table.
- Each domino in the set has two parts with dots on its face.
