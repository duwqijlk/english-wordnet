senseId: 'consistency%1:07:01::'
synsetId: 04792423-n
simpleMeaning: In logic, the quality of a set of rules in which nothing that follows from the starting
  rules goes against anything else in the set
scope: In logic, a set of rules with no part going against another, not the everyday sense of agreeing
  with the facts.
examples:
- The consistency of the new theory impressed the logicians.
- If a system lacks consistency, one of its rules must be wrong.
