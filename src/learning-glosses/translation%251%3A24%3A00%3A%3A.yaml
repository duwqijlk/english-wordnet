simpleMeaning: In mathematics, a change that moves the starting point of the lines used to show positions
  to a new place, but keeps each line pointing the same way
scope: In mathematics, this is moving a starting point while the lines keep the same direction, not the
  process in a cell and not changing words into another language.
examples:
- In this translation, the starting point moves two steps to the right, but the lines do not turn.
- The teacher showed a translation where the starting point changed place and each line kept its direction.
