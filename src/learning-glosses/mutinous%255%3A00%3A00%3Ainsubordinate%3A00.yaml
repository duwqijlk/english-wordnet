simpleMeaning: ready to refuse the orders of the people in charge, or refusing them now
scope: About people who are ready to fight against those in charge, or are doing so now; not about an
  act or speech that shows this or tries to make others do it, and not just slow to obey.
examples:
- The mutinous sailors refused to obey the captain.
- After weeks with no pay, the soldiers grew mutinous.
