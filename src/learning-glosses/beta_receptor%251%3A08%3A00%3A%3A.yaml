simpleMeaning: Receptors believed to sit on nerve cells' walls within sympathetic nerves, to account for
  why drugs act on only some sympathetic deeds, like vessels widening and heartbeat quickening.
scope: Also called beta-adrenergic receptor and beta-adrenoceptor, receptors believed to sit on nerve
  cells' walls within sympathetic nerves, to account for why drugs act on only some sympathetic deeds,
  like vessels widening and heartbeat quickening.
examples:
- Beta receptors sit on nerve cells.
- Beta receptor explains drug effects.
