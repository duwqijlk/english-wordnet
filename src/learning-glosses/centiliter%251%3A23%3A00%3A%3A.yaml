simpleMeaning: a metric unit for how much space a thing takes up, equal to one hundredth of a larger unit
  used for the same thing
scope: 'Also called centilitre or cl: a metric unit for how much space a thing takes up, equal to one
  hundredth of a larger unit used for the same thing, not a unit of weight and not a unit of length.'
examples:
- Add ten centiliters of water to the mix.
- The cup holds twenty centiliters of juice.
