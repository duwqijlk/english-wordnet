simpleMeaning: a common antelope from India with a dark back and horns that wind round and round
scope: Also called black buck, a common antelope from India with a dark back and horns that wind round
  and round, not a deer and not another antelope with straight horns.
examples:
- The blackbuck stood on the dry grass with its horns in the sun.
- We saw a blackbuck run across the open plain.
