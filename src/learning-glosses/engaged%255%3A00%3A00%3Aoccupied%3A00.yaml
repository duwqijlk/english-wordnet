simpleMeaning: A phone or toilet in use by someone else, or showing it is not free; in Britain, this word
  is used for a busy phone line
scope: 'Also called busy: a phone or toilet already in use, not gears locked together and not a mind full
  of work.'
examples:
- Her line is engaged, so I could not get through.
- The lavatory is engaged; please wait outside.
