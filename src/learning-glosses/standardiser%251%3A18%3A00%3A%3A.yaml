simpleMeaning: A person who sets the shared pattern that things must match
scope: A person who sets the shared pattern that things must match, with standardizer as another name
  for this sense, not a person who tests or checks things.
examples:
- The standardiser fixed the size of every screw used in the factory.
- As standardiser, she wrote the rules all makers had to follow.
