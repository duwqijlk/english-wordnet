simpleMeaning: to be enough for what is wanted or needed, or to fit a rule or limit that must be kept
scope: 'Also called meet, fit, fill, satisfy and fulfill: this is about being enough for a want, need,
  rule or limit, not about carrying out a job, duty or promise.'
examples:
- This course fulfils all the rules for the degree.
- The new well fulfils the village's need for clean water.
