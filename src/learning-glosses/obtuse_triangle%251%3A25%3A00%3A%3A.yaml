simpleMeaning: With one inside corner wider than a right angle, this shape has three sides
scope: One inside corner wider than a right angle in a shape with three sides, also called an obtuse-angled
  triangle; not a leaf with a blunt tip and not a shape with three equal sides.
examples:
- The obtuse triangle on the board has one corner wider than a right angle.
- He cut out an obtuse triangle from the card.
