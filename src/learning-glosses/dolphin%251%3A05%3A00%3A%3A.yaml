simpleMeaning: small whales with teeth and a long mouth that looks like a beak; larger than a porpoise,
  a smaller sea animal much like them
scope: This is the sea animal that is a kind of small whale, not the large thin fish in warm seas with
  the same name.
examples:
- A dolphin jumped out of the water, its long mouth clear to see.
- Dolphins are small whales, bigger than porpoises.
