simpleMeaning: Of a person, rough in manner, with no elegance or social polish.
scope: This is a lasting coarseness of manner, not the sense of being uncivil or bad-mannered in what
  you say.
examples:
- For all his money, he remained a rude man with coarse table manners.
- Her rude laugh and blunt speech marked her as a woman unused to elegant company.
