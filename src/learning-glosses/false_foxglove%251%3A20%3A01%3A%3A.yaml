simpleMeaning: a one-year North American plant with many stems and single dark golden-yellow flowers in
  the leaf joints like foxglove flowers; at times put in the genus Gerardia
scope: A one-year North American plant with dark golden-yellow flowers like a foxglove's, not a true foxglove
  and not a plant that lives for years.
examples:
- The false foxglove grew along the roadside with its dark golden-yellow flowers.
