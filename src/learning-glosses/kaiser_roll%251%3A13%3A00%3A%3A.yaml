simpleMeaning: A round raised bread bun with poppy seeds, made from a square piece of dough with the corners
  folded in to the middle.
scope: This is a round raised bread bun with poppy seeds, made from a square piece of dough with the corners
  folded in to the middle, not a plain white bun and not a sweet bun.
examples:
- She bought a kaiser roll with poppy seeds for breakfast.
- The kaiser roll was round and raised, with the corners folded in.
