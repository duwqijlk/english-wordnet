synsetId: 01054589-s
simpleMeaning: so sad or badly off that people feel sorry for the person or thing, or should feel sorry
  for them
scope: Also called poor, miserable, wretched, pathetic, pitiful, hapless, pitiable and misfortunate, this
  describes a person or thing in a sad, bad state that makes people feel sorry for them.
examples:
- The lost dog gave a piteous cry for help.
- They heard piteous appeals for help from the flooded village.
