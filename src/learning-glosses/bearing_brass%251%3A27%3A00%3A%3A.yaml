simpleMeaning: a yellow metal ring or layer that lines the inside of a turning part
scope: A yellow metal ring or layer that lines the inside of a turning part, not the turning part itself
  and not a tool made of yellow metal.
examples:
- The old bearing brass had worn thin and needed replacing.
- He fitted a new bearing brass inside the wheel hub.
