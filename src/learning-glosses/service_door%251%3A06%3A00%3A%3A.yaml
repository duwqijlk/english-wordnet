simpleMeaning: a way into a building for staff, or for bringing in goods and taking out waste
scope: A way into a building for staff and goods, also called a servant's entrance and a service entrance;
  not the main door used by guests.
examples:
- The delivery man knocked at the service door.
- Please use the service door when you bring in the crates.
