simpleMeaning: an old way of judging guilt, by putting a person through painful or dangerous tests that
  people believed a god controlled; getting out alive usually meant innocence
scope: An old trial by painful tests to judge guilt, not a hard time in general.
examples:
- The accused faced an ordeal by fire to prove his innocence.
- In old times, an ordeal could decide whether a prisoner lived or died.
