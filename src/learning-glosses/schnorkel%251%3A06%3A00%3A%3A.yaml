simpleMeaning: A breathing pipe on a pull-back device with pipes for air in and air out, so a submarine
  can stay sunk for long times.
scope: This sense is also called snorkel, breather, schnorchel, and snorkel breather, for a breathing
  pipe on a pull-back device with pipes for air in and air out.
examples:
- Schnorkels let submarines stay sunk.
- The schnorkel drew air in.
