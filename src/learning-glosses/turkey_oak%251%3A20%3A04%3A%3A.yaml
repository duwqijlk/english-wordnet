simpleMeaning: Leaves shaped like a spearhead with sharp-pointed parts grow on this big tree of central
  and southern Europe and Asia Minor that drops its leaves each year.
scope: This big tree of central and southern Europe and Asia Minor is not the small shrubby kind of the
  southeastern United States.
examples:
- The turkey oak drops its leaves each year.
- Leaves shaped like a spearhead with sharp-pointed parts mark the turkey oak.
