simpleMeaning: the number one, the smallest whole number, or the written sign that stands for it
scope: The number one, the smallest whole number, or the sign that stands for it; one, single, and ace
  are other names for this sense, not a feeling of being one, and not a whole that is unbroken.
examples:
- She wrote a unity on the board to start the count.
- The unity in the sum stands for one apple.
