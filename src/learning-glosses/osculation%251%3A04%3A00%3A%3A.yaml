simpleMeaning: Touching or stroking someone softly with the lips, or one such touch
scope: A soft touch or stroke with the lips, also called kiss and buss; not a touch with the hand and
  not the meeting of two curves in mathematics.
examples:
- Their osculation was brief, a soft kiss on the cheek.
- The old film ended with an osculation between the two lovers.
