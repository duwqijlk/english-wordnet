simpleMeaning: a strange, uncommon thing that a person may want to keep and collect
scope: 'Also called curiosity, oddity, rarity, peculiarity, and oddment: a strange, uncommon thing a person
  may want to keep. Not the feeling of wanting to know about something.'
examples:
- He bought a small glass curio at the old shop.
- Her shelf held a curio from a far country.
