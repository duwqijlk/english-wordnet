simpleMeaning: of a male or female homosexual, having looks or ways that people often think of as male
scope: Said of a male or female homosexual with looks or ways people link to men; not the rude name for
  a lesbian who looks like a man, not the short haircut, and not the sense for men only who look very
  male.
examples:
- She is a butch lesbian with short hair and a strong, plain style.
- As a gay man, he liked his butch look, with short hair and men's clothes.
