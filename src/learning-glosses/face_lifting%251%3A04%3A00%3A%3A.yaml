simpleMeaning: By cutting near the hair, drawing the skin back, and cutting off extra skin, an operation
  takes away lines and other marks of age from the front of the head.
scope: Also called a lift, a facelift, cosmetic surgery, face lift, nip and tuck, rhytidectomy, and rhytidoplasty,
  this is an operation on the face, not on another part of the body.
examples:
- She chose face lifting to take away the lines on the front of her head.
- Face lifting cuts near the hair and draws the skin back.
