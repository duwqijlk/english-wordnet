simpleMeaning: A wide strap with loops or small bags for holding rounds.
scope: A wide strap with loops or small bags for holding rounds; not a strap for holding tools, and not
  a strap for holding up trousers.
examples:
- He wore a cartridge belt full of shells on the hunt.
- The cartridge belt held twelve rounds.
