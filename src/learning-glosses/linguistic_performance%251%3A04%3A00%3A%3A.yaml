simpleMeaning: In linguistics, how a person actually uses language in real situations, including grammar
  mistakes, hesitations and other non-linguistic features, rather than their underlying knowledge of the
  language.
scope: This is language as it is actually used, including its mistakes and hesitations, not linguistic
  competence, the underlying knowledge that lets someone use a language.
examples:
- Her linguistic performance was full of pauses and false starts during the interview.
- The researchers recorded the children's linguistic performance, noting every hesitation and grammar
  mistake.
