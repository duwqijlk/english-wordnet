simpleMeaning: a climbing plant from southern India and Sri Lanka, now growing wild in northern Burma
  and Assam after being taken there, with dark red berries when fully ripe
scope: This is the climbing plant itself; it is not the strong seasoning made from its berries, not the
  other plants that bear sweet or hot fruits, not those fruits, and not adding seasoning to food.
examples:
- The pepper plant climbed high over the fence, its berries turning dark red.
- Pepper grows wild in northern Burma, where its ripe berries are picked by hand.
