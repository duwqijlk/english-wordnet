simpleMeaning: In church use, music played as people walk in line.
scope: In church use, music played as people walk in line, not a thing made to be used in a procession,
  and not a thing to do with a procession in general.
examples:
- The processional filled the church as the choir walked in.
- They sang a processional at the start of the service.
