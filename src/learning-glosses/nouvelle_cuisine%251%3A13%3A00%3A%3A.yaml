simpleMeaning: Instead of leaning hard on butter and cream, this French way of cooking uses light sauces
  and tries to bring out the true taste of food.
scope: A French style of cooking with light sauces, set against cooking that leans hard on butter and
  cream.
examples:
- The restaurant serves nouvelle cuisine with light sauces.
- Her nouvelle cuisine used a light sauce on the fish.
