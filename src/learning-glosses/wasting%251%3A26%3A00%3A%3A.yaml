senseId: 'wasting%1:26:00::'
synsetId: 14389146-n
simpleMeaning: a loss of size in a part inside the body, because of illness or because the part is not
  used
scope: This sense is about one part inside the body getting smaller. It is not the wider loss of strength
  in body and mind from a long illness.
examples:
- The wasting of his leg muscle made walking hard after months in bed.
- Doctors saw wasting in the muscle because he could not move his arm for a long time.
