simpleMeaning: one of the two male sex glands that make sperm and release male hormones
scope: This is a male reproductive gland, not a hen's oval body eaten as food, and not the verb senses
  of coating food with beaten egg or throwing eggs; ball, testicle, and nut are other names for it.
examples:
- A hard blow to the eggs left him doubled over.
- He took a low kick to the eggs and had to sit out the rest of the match.
