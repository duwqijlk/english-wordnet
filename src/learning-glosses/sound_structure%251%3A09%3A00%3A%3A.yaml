simpleMeaning: The ways noises may be put together inside words
scope: The allowed ways of putting speech noises together in words, not the rules for joining words into
  sentences and not how a single word is said.
examples:
- English sound structure forbids certain clusters at the start of words.
- The sound structure of the language allows long strings of vowels.
