simpleMeaning: not one color all over, but parts or patches of different colors, usually bright
scope: 'Also called painted, multicolor, or multicolored: parts in different colors, usually bright, not
  one plain color and not a mixed group of different kinds.'
examples:
- The jester wore a motley coat of red and yellow patches.
- The painted desert looked motley in the morning light.
