simpleMeaning: a fit in which the muscles tighten hard again and again and cannot be held still
scope: A fit of muscles tightening hard and beyond control, not an earthquake and not a fit of laughter.
examples:
- The child had a convulsion and shook all over.
- The medicine stopped the convulsion.
