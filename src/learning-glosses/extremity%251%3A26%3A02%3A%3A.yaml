simpleMeaning: a very bad state, especially a state in hard times or in illness
scope: A very bad state, especially from hard times or illness; not the part at the far end of an arm
  or leg, such as a hand or foot.
examples:
- The extremity of his illness kept him in bed for weeks.
- In their extremity, the family had no food, no work, and no home.
