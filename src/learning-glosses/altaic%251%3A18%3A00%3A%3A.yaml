simpleMeaning: One who belongs to a people that speaks a tongue in the Altaic group.
scope: A member of one of the peoples who speak a tongue in the Altaic group of tongues, not the group
  of tongues itself and not the word for things to do with it.
examples:
- My friend is an Altaic whose family speaks a language of the Altaic group.
- The Altaic told us about the tongue his people speak.
