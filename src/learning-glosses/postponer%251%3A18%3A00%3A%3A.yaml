simpleMeaning: Most often out of laziness or carelessness as a habit, this person puts off work
scope: A person who puts off work, most often because they are lazy or careless as a habit; procrastinator
  and cunctator are other names for this sense, and it is not a person who does work at once.
examples:
- The postponer kept putting off the report until the end of the week.
- She called herself a postponer because she always put off her work.
