simpleMeaning: A birch of medium size from eastern North America, with white or pale grey bark and wood
  of no worth; often a tree of woods that grow back after cutting.
scope: A birch of medium size from eastern North America, also called gray birch, grey birch, American
  gray birch and American grey birch; set apart from other birches and from other trees of woods that
  grow back.
examples:
- Betula populifolia often grows in woods that come back after cutting.
- The wood of Betula populifolia is of little worth.
