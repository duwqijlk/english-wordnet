simpleMeaning: A large test of a treatment or drug shown to work in two earlier rounds, with bearable
  side effects; if it ends well, the US drug agency approves it.
scope: Also called phase III; not an early test of a new drug and not a test on animals.
examples:
- The phase III clinical trial tested the new drug on thousands of patients.
- After the phase III clinical trial, the drug won approval.
