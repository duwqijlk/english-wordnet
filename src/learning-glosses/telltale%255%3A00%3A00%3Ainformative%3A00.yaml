simpleMeaning: that shows something hidden, though no one meant to show it
scope: 'This sense is also called telling and revealing: it describes a sign that shows a hidden fact,
  though no one meant to show it.'
examples:
- The telltale smell of smoke showed that someone had been cooking.
- His telltale blush gave away his feelings.
