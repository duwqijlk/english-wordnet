simpleMeaning: In maths, a list of numbers in which the same number is added each time to get the next
  number
scope: A run of numbers that grows by the same step each time, not a run that grows by the same times
  each time and not a plain list of numbers.
examples:
- 1, 4, 7, 10, 13 is the start of an arithmetic progression.
- Each step in the arithmetic progression adds 3 to the last number.
