simpleMeaning: In chemistry, the idea that every colour-changing test substance is a weak acid or a weak
  base whose colour changes when it breaks apart
scope: This is one account of how colour-changing test substances work, also called theory of indicators,
  not the substances themselves.
examples:
- Ostwald's theory of indicators says that each indicator is a weak acid or a weak base.
- Under Ostwald's theory of indicators, the colour of an indicator changes when it breaks apart.
