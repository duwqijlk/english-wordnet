simpleMeaning: An explosive device worked by moving parts or by electricity, or a small amount of explosive,
  used to set off a bigger explosive that breaks things apart
scope: A small device or amount of explosive used to set off a bigger one, not a tight covering for the
  head and not the top of a mushroom or a column.
examples:
- The worker put a cap in the hole to set off the main charge.
- A small electric cap can set off the larger explosive.
