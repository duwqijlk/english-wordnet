simpleMeaning: to cut a thin line on a surface with a sharp pointed tool, as in work with metal
scope: This is the verb for cutting a thin line with a sharp tool, not the sharp tool itself and not a
  person who copies writing by hand.
examples:
- The worker scribed a line on the metal plate before cutting it.
- She scribed a mark on the steel with a sharp tool.
