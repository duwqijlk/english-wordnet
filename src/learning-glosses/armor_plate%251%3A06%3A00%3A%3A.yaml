simpleMeaning: A sheet of steel made extra hard to shield forts or vehicles from enemy fire.
scope: 'Also called armor plating, armour plate, plate armor, and plate armour: a sheet of steel made
  extra hard to shield forts or vehicles from enemy fire, not ordinary steel and not a shield carried
  by hand.'
examples:
- The armor plate on the tank stopped the shell.
- Workers fitted armor plate to the fort's walls.
