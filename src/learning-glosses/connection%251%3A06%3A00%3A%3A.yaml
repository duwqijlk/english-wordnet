simpleMeaning: a piece of equipment, such as a wire or pipe, that joins two things together
scope: This is not an abstract link between ideas or events and not the state of being joined; it is the
  physical piece that joins things.
examples:
- The plumber replaced the rusty connection under the sink.
- The electrician tightened every connection in the fuse box.
