synsetId: 04135005-n
simpleMeaning: a large piece of cloth, usually heavy woven cloth, that the wind pushes against to move
  a sailing boat forward
scope: 'Also called sail or sheet: this is the large cloth that catches the wind on a boat, not the heavy
  cloth itself, not a tent or painting, and not the floor of a boxing ring.'
examples:
- The wind filled the canvas and pushed the sailing boat forward.
- They raised a large canvas to catch the wind and move the boat.
