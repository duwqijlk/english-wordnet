simpleMeaning: any of several kinds of cress (a plant) that like to grow in water
scope: This names several kinds of cress that like to grow in water. It is not the yellow-green color
  that shares this name, and it is not only the cresses that grow in clear ponds and streams.
examples:
- The book lists several kinds of watercress, and all of them grow in or near water.
- Watercress grows in wet ground as well as in streams.
