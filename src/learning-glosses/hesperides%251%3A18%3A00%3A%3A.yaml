simpleMeaning: In Greek myth, a group of three to seven nymphs who watched over the golden apples Gaea
  gave Hera as a wedding gift.
scope: In Greek myth, this is a group of nymphs also called Atlantides, not a single nymph or a group
  of gods.
examples:
- The Hesperides guarded the golden apples of Hera.
- In the story, the Hesperides watched over Gaea's gift.
