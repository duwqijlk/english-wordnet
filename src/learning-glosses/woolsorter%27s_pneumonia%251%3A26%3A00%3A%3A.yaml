simpleMeaning: A lung infection caught by breathing in dust that carries anthrax spores; chills, cough
  and a fast pulse come first, then the circulation collapses.
scope: The inhaled form of anthrax, not the skin form that starts as a painless sore and not the bacterium
  itself.
examples:
- Woolsorter's pneumonia struck mill hands who breathed dust from infected fleece.
- In the early 1900s, woolsorter's pneumonia was a recognised hazard in textile mills.
