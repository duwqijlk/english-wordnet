simpleMeaning: A change in how the different groups that make up a whole compare in size
scope: A change in how the groups that make up a whole compare in size; not people moving from one place
  to another, and not a rise in the total number.
examples:
- The population shift left fewer young workers.
- A population shift changed the town's schools.
