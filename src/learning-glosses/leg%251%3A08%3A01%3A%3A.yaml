simpleMeaning: One of the long limbs a person stands and walks on; in everyday use the whole limb, but
  strictly the part from knee to ankle.
scope: This is a part of a person's body, not the support of a table or chair and not the part of a garment
  that covers it.
examples:
- He broke his leg skiing and was on crutches for weeks.
- Her legs ached after the long hike.
