simpleMeaning: To make something usual, or make it fit a set rule or measure
scope: This is making something usual or making it fit a set rule; normalize is another name for this
  sense; not becoming normal on its own, which is the other sense, and not keeping it as it is.
examples:
- They worked to normalise relations with China.
- The new law will normalise the spelling.
