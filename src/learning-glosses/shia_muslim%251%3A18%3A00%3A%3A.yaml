scope: Also called Shi'ite, Shi'ite Muslim, Shiite and Shiite Muslim; a member of the branch of Islam
  that sees Ali as the true successor to Mohammed, not a member of the branch that accepts the first three
  caliphs.
examples:
- Shia Muslim families gather for prayer on holy days.
- A Shia Muslim believes Ali was the true successor to Mohammed.
