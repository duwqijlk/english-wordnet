simpleMeaning: a thing a person can own that belongs to life on earth, not to faith or the spirit
scope: This is a thing owned in this life, also called worldly good; not a gift of faith and not a thing
  of the spirit.
examples:
- He sold his worldly possessions to live a simple life.
- Her worldly possessions meant little to her after she joined the convent.
