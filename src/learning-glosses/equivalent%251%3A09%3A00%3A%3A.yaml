simpleMeaning: a person or thing that is the same as another in worth, size, force, effect, or importance
scope: A person or thing equal to another in worth, size, force, effect, or importance; not the chemistry
  sense about the weight of a substance with the same power to join with others.
examples:
- He paid in euros, the equivalent of fifty dollars.
- This degree is the equivalent of a master's degree in her country.
