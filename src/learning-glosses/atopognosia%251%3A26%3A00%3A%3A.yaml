senseId: 'atopognosia%1:26:00::'
synsetId: 14115447-n
simpleMeaning: The loss or lack of the sense that tells where a touch falls on the body, so a person cannot
  tell where they were touched
scope: This is the loss of the sense that tells where a touch falls; atopognosis is another name for it,
  not a loss of feeling altogether and not a failure to tell hot from cold.
examples:
- Atopognosia left him unable to say where the doctor had touched his arm.
- With atopognosia she could feel the touch but not tell where it fell.
