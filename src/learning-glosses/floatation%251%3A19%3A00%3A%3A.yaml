simpleMeaning: The fact of staying on top of a liquid without going under.
scope: Staying on top of a liquid without going under, also called flotation; not sinking and not swimming.
examples:
- The floatation of the wood kept it on the surface of the pond.
- Salt water helps the floatation of a swimmer's body.
