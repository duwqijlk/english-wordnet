senseId: 'masculinisation%1:22:00::'
synsetId: 13532958-n
simpleMeaning: Most often after hormone cures, or when the small glands above the kidneys fail to work
  as they should, a woman shows the wrong growth of male body marks.
scope: Also called masculinization, virilisation, and virilization, it is when male body marks grow wrongly
  in a woman, most often after hormone cures or when the glands above the kidneys fail.
examples:
- Masculinisation can follow hormone cures.
- The woman showed masculinisation after the glands above the kidneys failed.
