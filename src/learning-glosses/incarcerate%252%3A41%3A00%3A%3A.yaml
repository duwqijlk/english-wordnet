simpleMeaning: to shut a person in a jail or a place like a jail, so they cannot leave
scope: 'Also called jail, imprison, jug, lag, or gaol: shutting a person in a jail or a place like one,
  not keeping someone in a sickbed and not holding someone back from a journey.'
examples:
- The court ordered that the thief be incarcerated for five years.
- After the trial, they incarcerated him in the county jail.
