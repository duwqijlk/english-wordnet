simpleMeaning: any device that notices a signal or other sign, such as heat, pressure, light, or movement,
  and reacts to it in its own special way
scope: sensor is another name for this sense; not a radio part that takes out sound, and not a machine
  that finds radio signals.
examples:
- A smoke detector sounded in the hall.
- The detector picked up movement near the door.
