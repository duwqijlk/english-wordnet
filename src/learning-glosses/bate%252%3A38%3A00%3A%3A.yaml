simpleMeaning: to move the wings in a wild, fast and uncontrolled way, said of falcons (birds that hunt
  other animals)
scope: About a falcon moving its wings wildly; not about soaking skins in a liquid, and not about holding
  back or making something weaker.
examples:
- The falcon began to bate, flapping its wings wildly in the cage.
- When frightened, the young falcon bated again and again.
