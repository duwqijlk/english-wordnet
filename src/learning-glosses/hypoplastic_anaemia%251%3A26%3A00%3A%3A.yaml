simpleMeaning: When the soft matter inside the bones works too poorly, the blood ends up with too few
  red cells, and the state can deepen until almost none are made.
scope: Also called hypoplastic anemia, it is a lack of red cells from marrow that works poorly, not the
  deeper state in which the marrow makes almost none.
examples:
- Her hypoplastic anaemia came from marrow that worked too slowly.
- His hypoplastic anaemia may grow into a state with almost no new blood cells made.
