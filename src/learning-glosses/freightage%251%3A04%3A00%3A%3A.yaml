simpleMeaning: a cheaper way of carrying goods for a business than the fast way of sending them
scope: 'Also called freight: carrying goods for a business at a low price, not the fast way of sending
  them and not the goods themselves.'
examples:
- Freightage kept the cost of moving the chairs low.
- The shop saved money by using freightage for its big orders.
