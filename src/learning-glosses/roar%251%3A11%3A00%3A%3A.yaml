simpleMeaning: a loud, low sound that lasts a long time
scope: A deep, long-lasting loud sound, not the sound of a lion and not a person's very loud shout; thunder,
  boom and roaring are other names for this sense.
examples:
- We could hear the roar of the waterfall from the bridge.
- A low roar came from the furnace as it started up.
