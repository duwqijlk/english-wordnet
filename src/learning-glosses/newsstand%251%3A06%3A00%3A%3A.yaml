simpleMeaning: a stall where newspapers and other printed papers that come out regularly are sold
scope: This is a stall that sells newspapers and other printed papers that come out regularly. Not a single
  newspaper or magazine on its own, and not a bookshop that sells books.
examples:
- He bought a paper from the newsstand outside the station.
- The newsstand on the corner sells maps as well as magazines.
