simpleMeaning: keeping strongly to your own ideas and not willing to change them
scope: This describes a person who holds strongly to their own ideas and will not change them, not a person
  who is open to hearing and trying other ideas.
examples:
- He is so opinionated that he never listens to anyone else in a meeting.
- My opinionated uncle argues about politics and will not change his mind.
