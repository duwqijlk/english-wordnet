simpleMeaning: a shift in the earth's crust, caused by the crust changing shape, or causing the crust
  to change shape
scope: 'Also called crustal movement: a shift of the earth''s crust, not a shift of loose ground made
  by wind or water, and not a single quake.'
examples:
- Tectonic movement lifted the sea floor over millions of years.
- The slow tectonic movement of the crust built the mountain range.
