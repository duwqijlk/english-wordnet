simpleMeaning: words that make a thing clear by telling how it is built, how it works, or what went on
  around it
scope: 'Also called account: words that make a thing clear by telling how it is built, how it works, or
  what went on around it, not the act of telling but the words that do it.'
examples:
- Her explanation made the rule clear at last.
- I liked his short explanation of the accident.
