simpleMeaning: a sudden burst of strong rays of energy from the face of the sun, tied to dark spots on
  the sun and to breaks in radio signals
scope: A sudden burst of strong rays from the face of the sun, not a bright light made by a thing and
  not a sudden burst of flame.
examples:
- A flare on the sun can break radio signals.
- The flare sent strong rays out from the sun.
