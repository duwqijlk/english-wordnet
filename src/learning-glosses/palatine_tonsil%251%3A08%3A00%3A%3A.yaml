simpleMeaning: One of two lumps of soft tissue, one on each side of the back of the mouth
scope: One of two lumps of soft tissue on each side of the back of the mouth; tonsil and faucial tonsil
  are other names for it, not the small tongue at the back of the throat and not a gland in the neck.
examples:
- Her palatine tonsil was swollen and sore.
- The doctor could see the palatine tonsil at the back of her throat.
