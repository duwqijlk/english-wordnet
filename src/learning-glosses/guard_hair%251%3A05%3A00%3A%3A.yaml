simpleMeaning: Rough outer strands that form the top coat of some animals and shield the soft strands
  below
scope: These are rough outer strands that form the top coat of some animals, not the soft undercoat and
  not the whiskers of an animal.
examples:
- The dog's guard hairs kept the rain off its soft undercoat.
- Guard hair is coarse and stands out from the fur beneath.
