simpleMeaning: Long jaws full of thin, sharp teeth and a coat of hard scales mark this old North American
  hunter of the water.
scope: Also called a gar, a garfish, and a garpike, this old North American hunter of the water has long
  jaws full of thin, sharp teeth and a coat of hard scales, not a warm-water game fish with a long toothless
  upper jaw.
examples:
- The billfish snapped its long jaws at the smaller fish.
- A billfish caught the smaller fish in its long jaws.
