simpleMeaning: A low plant that loses its leaves in winter and comes back each year, from the land north
  of the United States and from its east and middle
scope: This is a low plant that loses its leaves in winter and comes back each year; black snakeroot and
  Asarum canadense are other names for this sense, not the spice ginger.
examples:
- Canada ginger grew under the trees in the shade.
- She dug up some Canada ginger for the garden.
