simpleMeaning: the hard seed of a tree, with a strong smell, used as a spice when grated or ground into
  powder
scope: The seed used as a spice, not the tree that this seed comes from.
examples:
- She grated fresh nutmeg over the hot drink.
- A little nutmeg in the cake gives it a warm taste.
