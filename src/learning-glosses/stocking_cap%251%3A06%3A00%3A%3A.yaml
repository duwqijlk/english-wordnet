simpleMeaning: A close-fitting wool hat, often with a narrow tail ending in a tassel
scope: A close-fitting wool hat, often with a narrow tail ending in a tassel, also called a ski cap or
  a toboggan cap; not a wide-brimmed hat and not a hood.
examples:
- He wore a stocking cap with a tassel in the cold.
- The stocking cap fitted close to his head.
