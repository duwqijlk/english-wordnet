simpleMeaning: Pretty bits of metal or glass or baked clay hung loose side by side, so moving air can
  make them ring
scope: Pretty bits of metal or glass hung loose so moving air makes them ring; wind chime is another name
  for this sense, and it is not a church bell or a door bell.
examples:
- A wind bell tinkled on the porch.
- The wind bell sang in the breeze.
