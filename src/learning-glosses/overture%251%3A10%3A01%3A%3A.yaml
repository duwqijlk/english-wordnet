simpleMeaning: music played by many instruments together at the start of an opera or a long work of music
  for singers
scope: This is the opening music for an opera or a similar work, not a first suggestion made to see what
  others think, and not a first event that comes before something else.
examples:
- The overture lasted ten minutes before the opera began.
- The crowd went quiet as the overture started.
