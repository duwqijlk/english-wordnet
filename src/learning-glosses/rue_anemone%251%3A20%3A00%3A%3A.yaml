simpleMeaning: With cup-shaped blooms like those of another woodland flower, only finer and lighter, this
  woodland flower is native to eastern North America.
scope: This woodland flower of eastern North America has cup-shaped blooms like an anemone's, only finer
  and lighter, and is not the anemone itself.
examples:
- We saw a rue anemone blooming in the woods.
- I can tell a rue anemone by its cup-shaped blooms.
