simpleMeaning: A river and its smaller streams drain one stretch of land, and all the water that runs
  off it leaves by the same outlet.
scope: One stretch of land drained by a river and its smaller streams is also called a basin, a watershed,
  a catchment area, a catchment basin, a drainage area, and a river basin.
examples:
- They planned flood control in the drainage basin of the Missouri.
- The drainage basin of the Missouri takes in water from many smaller streams.
