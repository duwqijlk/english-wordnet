simpleMeaning: To surround something on every side, forming a circle around it.
scope: This is enclosing something on every side, not giving out a bell-like sound and not putting an
  identifying band on a bird's leg.
examples:
- Police ringed the building within minutes.
- Tall hedges ring the garden on every side.
