senseId: 'revert%2:30:13::'
synsetId: 00120025-v
simpleMeaning: to change back to an earlier form, as in a mutation (a change in the genes)
scope: In living things, to change back to an earlier form, as in a mutation; not to go back to an earlier
  topic, habit, or owner.
examples:
- After the change in its genes was lost, the plant reverted to its wild form.
- In the test, the cells reverted to the earlier type after the mutation changed back.
