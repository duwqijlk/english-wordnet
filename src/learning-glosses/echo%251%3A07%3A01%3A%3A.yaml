simpleMeaning: a television, radio or radar signal thrown back toward the receiver by an object
scope: This is a broadcast or radar signal returning to a receiver, not the repeated-sound sense of the
  same word and not a mere imitation.
examples:
- The radar showed a faint echo from the distant aircraft.
- Engineers studied the echo to judge how far away the object was.
