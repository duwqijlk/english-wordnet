simpleMeaning: Of the study of tiny things through a lens, or used in it.
scope: Of the study of tiny things through a lens, or used in it; also called microscopic; not to be seen
  through a lens, or using a lens, nor so small it cannot be seen without a lens.
examples:
- Their work was microscopical in kind.
- The test was microscopical and new.
