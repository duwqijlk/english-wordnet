simpleMeaning: In chemistry, a substance that helps start a chemical change but is not the substance that
  speeds the change up
scope: This is a substance that helps start a chemical change, also called a sensitizer; not the catalyst
  itself, and not a substance that only speeds the change once it has started.
examples:
- The chemist added a sensitiser to help the reaction begin.
- Without a sensitiser, the reaction was slow to start.
