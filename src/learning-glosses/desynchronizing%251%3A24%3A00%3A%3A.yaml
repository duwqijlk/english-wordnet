simpleMeaning: a state in which the times of things do not line up, because each follows its own time
scope: This is a state in which the times of things do not line up; asynchronism, asynchrony, desynchronisation
  and desynchronization are other names for this sense, not a state in which things keep the same time
  and not one in which their times follow a set plan.
examples:
- The desynchronizing of the two watches made them show different times.
- A desynchronizing of the brain waves followed the stimulus.
