simpleMeaning: Bad words about an employer are turned into something good for them by this quick-tongued
  person who speaks for them
scope: 'Also called a flack catcher, a flak, and a flak catcher: a person who speaks for an employer and
  turns criticism into something good for them, not a news reporter and not a lawyer.'
examples:
- The company hired a flack to handle the bad press.
- The flack told reporters the mistake was really a success.
