simpleMeaning: In maths, a rate that shows how a result changes when one of two or more changing amounts
  changes and the others stay the same
scope: In maths, a rate of change for one changing amount at a time; not part of a whole, and not a higher
  tone in a sound.
examples:
- The teacher asked us to find the partial of the function for x.
- Each partial shows how the result changes when just one amount changes.
