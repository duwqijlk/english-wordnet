simpleMeaning: In grammar, the plain form of a verb that states what is or what happens, as a fact, with
  no special mark.
scope: The plain verb form that states facts, not a form that gives orders and not a form that speaks
  of wishes; indicative, declarative, common mood, declarative mood and fact mood are other names for
  this sense.
examples:
- She spoke in the indicative mood.
- The indicative mood states facts plainly.
