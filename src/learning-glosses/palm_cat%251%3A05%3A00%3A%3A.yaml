simpleMeaning: High in the trees of south-east Asia and the East Indies, a meat-eating animal with a spotted
  or striped coat makes its home.
scope: Also called palm civet, this is a meat-eating animal of the trees in south-east Asia and the East
  Indies, with a spotted or striped coat.
examples:
- A palm cat lives in the trees of south-east Asia.
- The palm cat lives in the trees of the East Indies.
