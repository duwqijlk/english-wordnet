simpleMeaning: a person who gives their time and care to improving people's lives and to changing society
  for the better
scope: A person devoted to improving people's lives and changing society, not simply a person who holds
  kind ideas and not a worker for one charity.
examples:
- The humanitarian worked for years to bring clean water to the village.
- She was known as a humanitarian for her work with refugees.
