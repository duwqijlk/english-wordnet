simpleMeaning: 'A first step toward canonization, in the Roman Catholic Church: the Pope says a dead person
  lived a holy life and is worthy of public honour.'
scope: This is the Pope's act of saying a dead person lived a holy life, a first step toward canonization,
  not the canonization itself.
examples:
- The beatification of the nun was announced by the Pope.
- Her beatification was the first step toward her canonization.
