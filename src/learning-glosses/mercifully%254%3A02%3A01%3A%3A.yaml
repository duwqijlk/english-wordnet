simpleMeaning: in a kind way, by forgiving someone or by not punishing them as hard as could be done
scope: Doing something with kindness and forgiveness toward a person; not the use that means it is lucky
  that something happened.
examples:
- The judge treated the young thief mercifully and gave him a light punishment.
- She spoke mercifully to the man who had hurt her and said she forgave him.
