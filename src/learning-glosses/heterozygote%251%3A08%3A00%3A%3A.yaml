simpleMeaning: In genetics, a living thing with two unlike forms of one gene, so its young can differ
  from one another
scope: In genetics, this is a living thing with two unlike forms of one gene, so its young can differ
  from one another, and not a living thing with two like forms of one gene.
examples:
- The heterozygote can have young that differ from one another.
- A heterozygote carries two unlike forms of the gene.
