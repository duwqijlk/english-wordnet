senseId: 'mischievousness%1:07:00::'
synsetId: 04916740-n
simpleMeaning: The quality of behaving in a naughty, playful way, as children do.
scope: The quality of behaving in a naughty, playful way, as children do; not behaviour that harms others,
  and not the habit of acting like a little devil.
examples:
- His mischievousness showed in every trick he played on his sisters.
- The teacher smiled at the child's mischievousness.
