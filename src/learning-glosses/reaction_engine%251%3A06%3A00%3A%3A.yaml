simpleMeaning: A motor for a jet or rocket that works by pushing out a fast stream behind the craft
scope: A jet or rocket motor that drives a craft by sending out a fast stream, also called a reaction-propulsion
  engine; not a propeller motor and not a sail.
examples:
- The reaction engine fired and the plane shot forward.
- The reaction engine was built for the new rocket.
