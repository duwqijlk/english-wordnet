simpleMeaning: a small cover that you wear on a finger to keep it safe from harm
scope: A small cover for a finger, worn to keep it safe; not a light bed that a person sleeps on.
examples:
- She wore a rubber cot on her cut finger while she washed the dishes.
- Put a cot on your finger before you clean the sharp tools.
