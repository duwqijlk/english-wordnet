simpleMeaning: Tall yellow tubes that flare at the top, with wide mouths and lids that stand up, rise
  from this plant of the southeast United States.
scope: 'Also called trumpets, huntsman''s horn, huntsman''s horns, and yellow pitcher plant: a plant of
  the southeastern United States with tall yellow tubes.'
examples:
- The yellow trumpet stood with its wide mouth open.
- A yellow trumpet showed a lid standing up over its tube.
