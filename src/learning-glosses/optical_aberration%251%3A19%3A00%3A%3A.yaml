simpleMeaning: A fault in how a lens or mirror makes a picture, so the picture comes out poor
scope: 'Also called distortion or aberration: a lens or mirror fault that spoils a picture, not a fault
  in the eye and not a broken lens.'
examples:
- Optical aberration made the edges of the photo look bent.
- The telescope showed optical aberration in the image of the star.
