simpleMeaning: a drug that fights cancer by stopping the body from using a substance made in the body's
  own chemical work
scope: A cancer drug that stops the body from using a substance it makes, not a drug that kills germs
  and not a medicine that eases pain.
examples:
- The doctor gave her an antimetabolite to slow the growth of the tumour.
- An antimetabolite works by blocking the substances the cancer cells need to grow.
