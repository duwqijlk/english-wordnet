simpleMeaning: Describes speech or writing that wanders from the main point or takes in a wide range of
  subjects.
scope: Describes speech or writing that wanders from the main point; also called rambling, digressive,
  or discursive, not speech that stays on one point and not speech that is merely long.
examples:
- His excursive remarks wandered from gardens to politics.
- The book's excursive style covers a wide range of subjects.
