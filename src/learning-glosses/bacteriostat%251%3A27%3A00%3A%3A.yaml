simpleMeaning: a thing, made from chemicals or living matter, that stops bacteria from growing
scope: A thing that stops bacteria from growing, not a thing that kills them and not a drug that cures
  an illness.
examples:
- The lab added a bacteriostat to the dish so the bacteria would stop growing.
- This bacteriostat keeps the sample safe by holding back the growth of bacteria.
