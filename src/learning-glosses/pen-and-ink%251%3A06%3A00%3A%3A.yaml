simpleMeaning: With a writing tool and the liquid it writes with, a picture is drawn
scope: A picture drawn with a writing tool and the liquid it writes with, not a picture made with paint
  and not a print from a plate.
examples:
- Her pen-and-ink sketch of the old bridge hangs in the hall.
- He works in pen-and-ink, not in oils.
