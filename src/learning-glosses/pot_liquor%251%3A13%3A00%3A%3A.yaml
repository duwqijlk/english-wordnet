senseId: 'pot_liquor%1:13:00::'
synsetId: 07600292-n
simpleMeaning: Cook vegetables or meat in a liquid, and the liquid that is left when they are done is
  this
scope: 'Also called liquor and pot likker: the liquid left after vegetables or meat have been cooked in
  it; not plain water and not the vegetables or meat themselves.'
examples:
- She poured the pot liquor over the rice.
- The pot liquor from the boiled meat went into the soup.
