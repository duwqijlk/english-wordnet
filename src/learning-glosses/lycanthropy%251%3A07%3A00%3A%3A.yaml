simpleMeaning: In old tales, the magic power of a person to take on the form and ways of a wolf.
scope: In old tales, the magic power of a person to take on the form and ways of a wolf; not a real illness
  and not a person who only dresses as a wolf.
examples:
- The story told of a man cursed with lycanthropy.
- In the tale, lycanthropy let him run with the wolves by night.
