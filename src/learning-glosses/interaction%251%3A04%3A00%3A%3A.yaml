senseId: 'interaction%1:04:00::'
synsetId: 00039759-n
simpleMeaning: an action in which two or more people or things act on each other and have an effect on
  each other
scope: This is people or things acting on each other and having an effect on each other. It is not the
  physics sense, about energy moving between very small parts of matter.
examples:
- There was a lot of interaction between the teacher and the students in class.
- Good interaction with customers helps the shop keep people coming back.
