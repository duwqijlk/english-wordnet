simpleMeaning: to get something by paying for it in a transaction involving money
scope: This is the verb for obtaining something by paying, not the act of acquiring something for payment,
  not the thing that was bought, not a means of gaining influence or advantage, and not the mechanical
  advantage a lever provides.
examples:
- She purchased a new car last week.
- The company purchased the land for a new factory.
