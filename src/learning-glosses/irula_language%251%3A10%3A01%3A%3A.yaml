simpleMeaning: A Dravidian tongue closely related to Tamil, spoken in a hilly part of southwestern India.
scope: A tongue of the Dravidian group, close to Tamil and spoken in the hills of southwestern India;
  also called Irula, not the Tamil tongue itself or another Dravidian tongue.
examples:
- Irula language is spoken in the hills of southwestern India.
- He studies the Irula language at the university.
