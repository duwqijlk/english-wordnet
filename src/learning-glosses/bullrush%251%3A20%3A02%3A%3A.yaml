simpleMeaning: Tall marsh plant; cylindrical seed heads burst when ripe, scattering fluff; long flat leaves
  woven into mats and chair seats; native to North America, Europe, Asia and North Africa.
scope: This is the tall marsh plant with cylindrical seed heads; bulrush and cat's-tail are other names
  for it, and it is not the tall rush with soft arching stems that bullrush also names.
examples:
- The bullrush's brown seed heads burst open in late summer.
- She wove mats and chair seats from bullrush leaves.
