simpleMeaning: Coffee plants grow in the shade of this tree of the warm lands of Central America, the
  West Indies, and Puerto Rico, which bears tall bunches of white flowers.
scope: This is a flowering tree of warm America used to shade coffee plants, not a coffee plant itself.
examples:
- The guama over the coffee plants was covered in white flowers.
- Farmers plant guama to shade their coffee from the hot sun.
