simpleMeaning: A small instrument that makes a high sound when air from your mouth goes into it
scope: This is the small thing a person holds and blows into, not the act of giving a signal, not the
  high sound itself, and not the long thin pipe played as music.
examples:
- The referee carried a small whistle on a string around his neck.
- She blew into the whistle to call the class to order.
