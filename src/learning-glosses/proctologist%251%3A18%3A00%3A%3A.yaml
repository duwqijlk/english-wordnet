simpleMeaning: A doctor who looks after illnesses of the rectum and anus
scope: A doctor who treats illnesses of the lower bowel, not a doctor who treats the stomach or the skin.
examples:
- The proctologist examined him for bleeding from the rectum.
- She was sent to a proctologist about a painful lump near the anus.
