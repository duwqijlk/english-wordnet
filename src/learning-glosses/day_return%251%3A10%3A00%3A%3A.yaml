simpleMeaning: a ticket at a lower price for a trip out and back on the same date
scope: A cheap ticket for going and coming back on the same date, not a ticket for one way only and not
  a ticket that can be used on another date.
examples:
- She bought a day return to London for her morning meeting.
- A day return saved him money because he came back the same evening.
