simpleMeaning: a word or cry said suddenly and with strong feeling, showing emotion
scope: Ejaculation is another name for this sense. This is a sudden word or cry that shows strong feeling,
  not the act of putting a remark into the middle of talk.
examples:
- '''Ouch!'' is an interjection that shows pain.'
- She used the interjection 'Wow!' when she saw the gift.
