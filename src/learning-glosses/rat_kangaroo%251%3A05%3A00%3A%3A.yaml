simpleMeaning: Any of several kinds of small Australian animal about the size of a rabbit, shaped like
  a big mouse and hopping on its back legs
scope: 'Also called kangaroo rat: a small Australian animal about the size of a rabbit, not a true kangaroo
  and not a rat.'
examples:
- A rat kangaroo hopped across the dry grass at dusk.
- The rat kangaroo is about the size of a rabbit.
