simpleMeaning: an empty character, such as the one the long bar on a keyboard types, that keeps each word
  apart from the next in writing or printing
scope: This sense is the blank character between words, not an empty area or room, and not the region
  beyond the earth.
examples:
- There is an extra space before the word "and" in that line.
- Use a single space after each full stop.
