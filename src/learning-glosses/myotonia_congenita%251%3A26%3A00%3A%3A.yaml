simpleMeaning: A mild, uncommon form of muscle tightness that a person is born with, marked by stiff muscles.
scope: A mild, uncommon muscle-tightness condition present from birth, marked by stiff muscles; not the
  general muscle-tightness condition and not stiffness from an injury.
examples:
- Myotonia congenita left his hands stiff when he woke.
- She was born with myotonia congenita.
