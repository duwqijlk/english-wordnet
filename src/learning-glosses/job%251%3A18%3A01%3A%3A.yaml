simpleMeaning: A person who bears great pain and trouble for a long time without losing hope
scope: A person who bears great pain and trouble for a long time without losing hope; not a person with
  a paid post, and not a person who gives up in trouble.
examples:
- After years of illness, he remained a Job, patient to the end.
- She bore her losses like a Job, without complaint.
