simpleMeaning: In computer science, doing the same steps again and again, a set number of times or until
  a set result is reached
scope: 'Also called looping: the act of carrying out the same steps again and again in a program; not
  one single time through those steps.'
examples:
- The program used iteration to add up all the numbers in the list.
- By iteration, the computer repeated the steps until it found the answer.
