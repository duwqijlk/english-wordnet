simpleMeaning: A fern of tropical lands of the Old World or Australia that grows on trees, often in bunches
  where branches fork
scope: This is a fern that grows on trees in bunches, not a fern that grows in the ground; bird's nest
  fern is another name for this sense.
examples:
- Asplenium nidus grows in the fork of a tree.
- The bunches of Asplenium nidus hang from the branches above.
