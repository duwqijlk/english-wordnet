simpleMeaning: a musician who has fully mastered playing music and shows the highest skill and art in
  it
scope: This is the musician as a person, not the word used to describe a performance as having the highest
  skill, and not the skill itself.
examples:
- The young virtuoso played the piano for two hours without a break.
- As a virtuoso, he could play the hardest violin pieces with ease.
