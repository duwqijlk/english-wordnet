simpleMeaning: The natural quality that makes animals, plants, and other organisms different from things
  such as rocks, water, and machines.
scope: This is not a person's span of years, not liveliness or energy, and not organisms considered together.
examples:
- Scientists still cannot explain what gives a cell life.
- The origin of life on Earth remains a mystery.
