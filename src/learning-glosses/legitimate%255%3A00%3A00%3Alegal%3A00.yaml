simpleMeaning: Backed by law, or done in line with the law.
scope: Backed by law or done in line with the law, not a lawful marriage or child, not a practice that
  meets accepted standards, and not the act of making a person lawful.
examples:
- A legitimate government rules with the law behind it.
- The claim was legitimate under the new law.
