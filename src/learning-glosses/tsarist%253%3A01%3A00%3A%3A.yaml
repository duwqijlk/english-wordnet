simpleMeaning: of or about a ruler of old Russia with full power, or like such a ruler
scope: 'Also called czarist: about the rulers of old Russia who had full power, or like them, not about
  Russia or its people in general.'
examples:
- The tsarist army served the ruler of old Russia.
- She wrote a book about tsarist rule and its strong power.
