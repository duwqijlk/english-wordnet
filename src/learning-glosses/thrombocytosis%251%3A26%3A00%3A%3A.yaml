simpleMeaning: Blood with more platelets than usual, the tiny bits that help it clot, tends to form clots,
  and this goes with many growths, lasting infections and other sicknesses.
scope: It is a blood state in which platelets rise in number and clots tend to form.
examples:
- With thrombocytosis, the blood has more platelets than usual.
- The platelets in the blood were counted, and thrombocytosis was found.
