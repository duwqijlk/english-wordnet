simpleMeaning: In the group Polystichum, this is one of several kinds of plant whose fronds feel and shine
  like those of the plant it is named for.
scope: This plant in the group Polystichum is not the tropical Old World kind with glossy fronds.
examples:
- The holly fern's fronds shone.
- A holly fern has fronds that feel like those of the plant it is named for.
