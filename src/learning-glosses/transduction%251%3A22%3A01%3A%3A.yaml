simpleMeaning: In the study of genes, the carrying of gene stuff from one cell to another by a small ring
  of gene stuff, or by a virus that attacks germs.
scope: In the study of genes, the carrying of gene stuff from one cell to another, not the changing of
  energy from one form to another by a machine.
examples:
- Transduction moved the gene from one cell to another.
- The scientists used transduction to carry new gene stuff into the cells.
