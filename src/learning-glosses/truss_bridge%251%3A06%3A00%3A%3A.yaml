simpleMeaning: A way across water or a gap, held up by a frame of strong joined beams
scope: A bridge held up by a frame of joined beams, not one held up by cables or by arches, and not a
  simple flat beam across a gap.
examples:
- The old truss bridge still carries cars over the river.
- They built a truss bridge across the wide valley.
