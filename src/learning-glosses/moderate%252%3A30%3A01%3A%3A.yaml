simpleMeaning: to soften something by putting in something else, so it fits better
scope: Also called season and temper; to soften something by adding something else, not to hold feelings
  back and not to stay within limits.
examples:
- She moderated her criticism with a few kind words.
- He moderated the sauce with a little cream.
