simpleMeaning: a thing that people believed could make every sickness go away
scope: A thing believed to cure all sickness, not a sweet liquid used to hide the bad taste of medicine
  and not a thing believed to turn common metals into gold.
examples:
- People in old stories searched for an elixir that could cure every sickness.
- He hoped the strange drink was an elixir that would heal his sick child.
