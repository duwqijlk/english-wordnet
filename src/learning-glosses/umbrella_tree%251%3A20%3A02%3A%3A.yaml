simpleMeaning: Leaves made of many parts spread like fingers from one point on an upright plant of Australia
  and northern New Guinea that keeps its leaves all year.
scope: Unlike the tree of eastern North America that loses its leaves each year and bears creamy white
  flowers, this is the evergreen plant of Australia and northern New Guinea.
examples:
- The umbrella tree keeps its leaves all year round.
- Leaves spread like fingers from one point on the umbrella tree.
