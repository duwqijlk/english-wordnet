senseId: 'cosmologist%1:18:00::'
synsetId: 09839072-n
simpleMeaning: 'a scientist who studies the universe: how it began and changes over time, and how space
  and time are linked'
scope: This person studies the whole universe, not just one star or one planet, and not the weather or
  the earth alone.
examples:
- The cosmologist studied how the universe began a very long time ago.
- As a cosmologist, she looks at how space and time are linked.
