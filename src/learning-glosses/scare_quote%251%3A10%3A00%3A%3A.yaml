schema: oewn-learning-gloss-v2
senseId: 'scare_quote%1:10:00::'
synsetId: 06857644-n
simpleMeaning: The use of marks round a word to show that it is not the writer's own choice of word.
scope: Marks round a word showing it is not the writer's own word; not a direct quote of what someone
  said and not marks round spoken words.
examples:
- She put scare quotes round the word 'expert'.
- He used scare quotes round 'progress' to show it was not his word for it.
