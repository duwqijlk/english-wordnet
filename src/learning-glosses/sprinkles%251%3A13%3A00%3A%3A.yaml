simpleMeaning: Small bits of sweet chocolate put on top of food such as ice cream
scope: These are the small chocolate bits put on top of ice cream, also called jimmies; they are a topping,
  not the main food itself.
examples:
- She put chocolate sprinkles on her ice cream.
- The children wanted sprinkles on their ice cream sundae.
