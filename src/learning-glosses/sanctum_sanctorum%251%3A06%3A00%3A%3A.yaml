simpleMeaning: In Judaism, the holy innermost room of the Tabernacle in Solomon's temple, where the Ark
  of the Covenant was kept
scope: Also called the holy of holies; the innermost room of the Tabernacle, not the whole temple.
examples:
- Only the high priest entered the sanctum sanctorum.
- The sanctum sanctorum held the Ark of the Covenant.
