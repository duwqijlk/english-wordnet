simpleMeaning: of a plant ovule (the small part that can grow into a seed), turned fully back, 180 degrees,
  on its stalk
scope: In plants, this is about an ovule turned fully back on its stalk, not a thing turned upside down
  in the usual way and not things put in the opposite order.
examples:
- The inverted ovule is turned fully back on its stalk.
- This plant has inverted ovules that point back along the stalk.
