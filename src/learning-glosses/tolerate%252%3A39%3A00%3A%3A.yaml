simpleMeaning: to be able to live with a poison, a strong drug, a germ that makes you ill, or hard conditions
  around you, without being harmed by it
scope: About a body or other living thing being able to live with a poison, a strong drug, a germ or hard
  conditions around it without being harmed; not about putting up with a person or behaviour you dislike,
  and not about allowing something to happen.
examples:
- Some plants tolerate salt water that would kill other plants.
- His body tolerates the strong drug without bad effects.
