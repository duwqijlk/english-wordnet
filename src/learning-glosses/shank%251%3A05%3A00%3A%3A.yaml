simpleMeaning: the lower part of the leg of a horse or a like animal, from the back joint down to the
  joint above the hoof
scope: The lower leg of a horse or a like animal, also called a cannon; not the cut of meat from the upper
  leg, and not the narrow part of a shoe.
examples:
- The vet checked the shank of the lame horse.
- A shank injury kept the mare out of the race.
