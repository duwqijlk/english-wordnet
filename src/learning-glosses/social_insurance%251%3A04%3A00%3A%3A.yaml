simpleMeaning: Paid for by bosses and workers as well as by the government, this help from the government
  goes to people with no work or who are hurt or old
scope: It is help from the government for people with no work or who are hurt or old, paid for by bosses,
  workers and the government.
examples:
- Social insurance helped her after she lost her job.
- He lived on social insurance while he looked for work.
