simpleMeaning: A map for a person who sails a ship, showing the weather, water and sailing conditions
  that are usual in a place.
scope: A map for a person who sails a ship, showing the weather, water and sailing conditions that are
  usual in a place, also called navigational chart and pilot chart; not a land map and not a map of the
  stars.
examples:
- The captain checked the naval chart before leaving port.
- A naval chart shows the weather and water conditions.
