scope: A fairly tall timber tree of the Rocky Mountains with a narrow cone-shaped crown; subalpine fir
  and Abies lasiocarpa are other names for this sense, not other Rocky Mountain trees with wide spreading
  crowns.
examples:
- The Alpine fir grew tall on the mountain slope.
- Alpine fir timber is used for building.
