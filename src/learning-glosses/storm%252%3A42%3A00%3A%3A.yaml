simpleMeaning: To act like someone in a great rage, with fierce, forceful behaviour.
scope: This is about how a person behaves as if furious, a sense also called rage or ramp, not the weather
  turning fierce or an attack on a place.
examples:
- He stormed around the kitchen, slamming cupboard doors.
- She stormed about the house, furious at the delay.
