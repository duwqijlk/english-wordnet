simpleMeaning: A place where birds that live in groups, such as rooks, come to nest and raise their young
scope: A nesting place for birds that live in groups; not a single nest, and not a place for birds that
  live alone.
examples:
- The rookery on the cliffs was full of nesting seabirds.
- Rooks return to the same rookery each spring to breed.
