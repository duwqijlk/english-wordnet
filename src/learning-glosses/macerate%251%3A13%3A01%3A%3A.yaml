simpleMeaning: A thing softened by soaking, sometimes used to give vodka a taste.
scope: A thing softened by soaking, sometimes used to give vodka a taste; not the act of softening a thing
  by soaking it, and not a thing going soft from too much soaking.
examples:
- The macerate gave the vodka a taste of fruit.
- They left the macerate in the vodka overnight.
