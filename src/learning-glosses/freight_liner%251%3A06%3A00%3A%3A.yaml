simpleMeaning: Built so goods can be put on and taken off fast, this long-distance express train runs
  between factory towns and ports.
scope: Also called a liner train, this names the long-distance express train that runs between factory
  towns and ports with room for fast loading and unloading of goods.
examples:
- The freight liner runs between the factory town and the port.
- Goods from the factory towns travel to the ports on the freight liner.
