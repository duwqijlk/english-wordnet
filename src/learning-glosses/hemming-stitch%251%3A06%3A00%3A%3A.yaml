simpleMeaning: A way of sewing the folded edge of a skirt or dress so it stays in place.
scope: A way of sewing folded edges on skirts and dresses; not a way of joining two pieces of cloth, and
  not a fancy stitch for show.
examples:
- She used a hemming-stitch to finish the edge of her skirt.
- The dressmaker's hemming-stitch held the folded edge flat.
