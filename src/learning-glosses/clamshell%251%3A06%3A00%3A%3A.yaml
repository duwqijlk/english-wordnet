senseId: 'clamshell%1:06:00::'
synsetId: 03041093-n
simpleMeaning: a bucket with two joined parts that open and close, used to dig and lift things from under
  water
scope: This bucket tool, also called grapple, is used to dig and lift things from under water; it is not
  the hard shell of a sea animal.
examples:
- The crane lifted mud from the river with a clamshell.
- Workers used a clamshell to clear sand from the harbour floor.
