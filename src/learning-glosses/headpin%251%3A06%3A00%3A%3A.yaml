simpleMeaning: The front piece in the triangle of ten pieces set up in bowling.
scope: The front piece in the triangle of ten bowling pieces, also called kingpin; not a side piece and
  not the back piece.
examples:
- He knocked down the headpin with his first ball.
- The headpin stood at the front of the triangle, closest to the bowler.
