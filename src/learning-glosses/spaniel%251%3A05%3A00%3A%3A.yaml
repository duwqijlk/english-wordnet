simpleMeaning: one of several kinds of small to middle-sized dog used to help hunters with guns, with
  long smooth soft hair and long ears that have a fringe of hair
scope: This is a small to middle-sized dog kind bred to help hunters with guns, with long soft hair and
  long ears; it is not a big guard dog.
examples:
- The hunters took their spaniel into the fields to find birds.
- Her spaniel has long soft hair and long ears that move as it runs.
