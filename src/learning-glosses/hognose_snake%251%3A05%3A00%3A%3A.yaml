simpleMeaning: A harmless North American creature that plays dead when troubled, spreading its head and
  neck or lying still, with a snout that turns up.
scope: This harmless creature of North America is also called a puff adder or a sand viper.
examples:
- A hognose snake spread its head and neck.
- The hognose snake lay still as if dead.
