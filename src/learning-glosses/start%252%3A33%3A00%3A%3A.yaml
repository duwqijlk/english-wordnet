simpleMeaning: To play from the beginning of a game as a member of the first group of players.
scope: This is being in a game's first lineup, not beginning an action, setting something in motion, departing,
  jumping in surprise, or starting a job.
examples:
- She started at point guard for the first time this season.
- The coach decided to start the young forward instead of the veteran.
