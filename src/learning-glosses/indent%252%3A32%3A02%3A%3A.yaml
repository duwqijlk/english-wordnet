simpleMeaning: to tie a person who is learning a trade, or a servant, to one master by a written deal,
  or in a way like that
scope: 'Also called indenture: tying a person learning a trade, or a servant, to one master by a written
  deal. Not cutting paper along a rough line, not an order for goods, and not the space at the start of
  a line.'
examples:
- They indented the young apprentice to the blacksmith for five years.
- The boy was indented as a servant and had to stay with his master.
