simpleMeaning: as if from the Middle Ages, old in its ways and not open to new ideas
scope: 'Also called medieval: as if from the Middle Ages and old in its ways, not dark and full of mystery
  like a strange story.'
examples:
- His gothic views on marriage belong to a much older time.
- She called his strict, old rules gothic and closed to new ideas.
