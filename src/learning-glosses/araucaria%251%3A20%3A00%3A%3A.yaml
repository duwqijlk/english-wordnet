simpleMeaning: Big cones and seeds that can be eaten mark several kinds of tall tree from South America
  or Australia.
scope: The trees this sense covers grow tall in South America or Australia and bear big cones with seeds
  that can be eaten.
examples:
- The araucaria dropped big cones with seeds that could be eaten.
- An araucaria from Australia bore big cones.
