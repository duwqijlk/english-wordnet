simpleMeaning: acting together as one single unit that is not divided into separate parts.
scope: This is about a group or thing acting as one undivided unit, not about good health or about how
  much of something there is.
examples:
- The team moved as a whole, every player in step.
- The company acted as a whole rather than as separate departments.
