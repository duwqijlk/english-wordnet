simpleMeaning: of a set of notes in order that has half steps (the smallest steps) between its second
  and third notes, and usually its fifth and sixth, and seventh and eighth
scope: This is the music sense, about the steps between notes in a set of notes. It is not minor meaning
  less important, less serious, or a person's second subject of study.
examples:
- The song is played in a minor scale, so it sounds sad.
- She wrote the tune in B flat minor.
