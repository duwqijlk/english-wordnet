simpleMeaning: One of a group of matching parts of living things that carry the plan for dividing the
  body of a young animal into sections as it grows before birth
scope: One of a group of matching parts of living things that carry the plan for shaping the body before
  birth, not a gene that makes a body chemical; also called a homeobox gene.
examples:
- The homeobox is one of a group of matching genes.
- Scientists study the homeobox to learn how bodies take shape.
