simpleMeaning: In the Roman Catholic Church, the whole body of church leaders who choose the pope and
  give him advice
scope: In the Roman Catholic Church, the whole body of church leaders who choose the pope and give him
  advice; cardinalate, College of Cardinals and Sacred College are other names for this sense, and it
  is set apart from a single cardinal by being the whole body.
examples:
- The Sacred College of Cardinals advises the pope on Church matters.
- When a pope dies, the Sacred College of Cardinals gathers to choose his successor.
