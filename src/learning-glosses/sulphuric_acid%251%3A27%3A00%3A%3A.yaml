simpleMeaning: Chemical works use a great deal of this strong acid, H2SO4, which eats away what it touches
  and is made from sulfur dioxide.
scope: Vitriol, oil of vitriol, and sulfuric acid are other names for the strong acid, H2SO4, that eats
  away what it touches.
examples:
- The metal it touches is eaten away by sulphuric acid.
- Chemical works use sulphuric acid in great amounts.
