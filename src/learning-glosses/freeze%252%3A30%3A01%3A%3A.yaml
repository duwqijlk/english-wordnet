simpleMeaning: to stop something going on, or a habit, by putting a hold on it
scope: To stop something going on, or a habit, by putting a hold on it, not to turn cold and formal in
  manner and not to stop money from being used.
examples:
- The government decided to freeze aid to the war-torn country.
- They chose to freeze the building plan until the money came back.
