simpleMeaning: a short cord or band that joins a pocket timepiece to a man's vest
scope: A short cord or band that joins a pocket timepiece to a man's vest, also called watch chain and
  fob; not a bracelet and not a key ring.
examples:
- His watch guard hung across his vest.
- The old watch guard was made of gold links.
