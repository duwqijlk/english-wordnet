simpleMeaning: a place in the front row, close to the fight, with a clear view of the place where people
  box or wrestle
scope: 'Also called ringside: a place in the front row with a clear view of the fight, not a place high
  up at the back and not a place to stand.'
examples:
- We had a ringside seat for the big fight.
- Her ringside seat gave her a clear view of every punch.
