simpleMeaning: puzzled and unable to think clearly, because many things you face or hear do not agree
  with each other
scope: Puzzled and unable to think clearly when things do not agree, also called lost, confused, bewildered
  and baffled, not simply surprised and not lost in thought.
examples:
- She looked bemused by his strange questions.
- The bemused clerk stared at the two different lists.
