simpleMeaning: the form of a word that describes a thing or an action and shows the most of a quality
scope: This is the word form that shows the most, like fastest, not strong praise that says too much.
examples:
- '''Fastest'' is the superlative of ''fast''.'
- In 'most surely', the superlative is formed with the word most.
