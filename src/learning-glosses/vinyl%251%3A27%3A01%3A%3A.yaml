simpleMeaning: a hard-wearing shiny plastic that bends easily, used most of all for floor coverings
scope: This is a shiny, hard-wearing plastic that bends, used most of all for floors; not a stiff plastic,
  and not the chemical radical of the same name.
examples:
- The kitchen floor was covered in vinyl.
- She wiped the vinyl seat clean with a cloth.
