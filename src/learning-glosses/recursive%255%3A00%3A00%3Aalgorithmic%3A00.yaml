simpleMeaning: about or linked to a way of solving or defining something where a step uses itself again
scope: About a step or rule that uses itself again to solve or define something; not about a simple set
  of steps that never uses itself.
examples:
- She used a recursive method that calls itself to find the answer.
- A recursive rule can define a list by using the same rule again.
