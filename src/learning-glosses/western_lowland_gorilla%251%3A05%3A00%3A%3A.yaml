simpleMeaning: Among the kinds of great ape, this is the one that is smaller than all the others.
scope: The smallest kind of great ape; not a larger kind of this ape and not a chimpanzee.
examples:
- The western lowland gorilla is the smallest kind of gorilla.
- Of all the kinds of gorilla, the western lowland gorilla is the smallest.
