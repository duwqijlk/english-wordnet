simpleMeaning: a fruit from Africa, shaped like a squash, with soft flesh inside that you can eat
scope: A fruit from Africa, shaped like a squash, with soft flesh inside that you can eat, also called
  monkey bread; not a melon, and not the Australian sour gourd tree with a gourd-like fruit.
examples:
- The sour gourd split open and showed its soft pale flesh.
- We ate the sour gourd with rice.
