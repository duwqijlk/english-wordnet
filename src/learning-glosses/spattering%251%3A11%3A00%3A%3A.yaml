simpleMeaning: the noise made when something bursts out suddenly and with force, again and again
scope: 'Also called sputter, splutter, splatter, spatter, sputtering, and splattering: this is a noise
  only. It is not the act of throwing drops of liquid onto a surface.'
examples:
- From inside, we heard the spattering of rain on the metal roof.
- The spattering of hot oil from the pan could be heard across the kitchen.
