simpleMeaning: not in line with the way the world works on its own, and going against that way
scope: This sense is about a thing that goes against the way the living world works, not just a thing
  that is not normal or usual, and not a person speaking in a false way to make others notice them.
examples:
- They said the sudden death was unnatural and asked the police to look into it.
- An unnatural colour in the sky before the storm made people uneasy.
