senseId: 'gang_plough%1:06:01::'
synsetId: 92465732-n
simpleMeaning: A farm tool with two or more cutting blades, side cutters and turning boards, made to work
  all at once.
scope: This is a farm tool with two or more cutting blades that work all at once, also called a gang plow,
  a multiple-furrow plough or a multiple-furrow plow; not a farm tool with one blade, and not a harrow
  that breaks up soil.
examples:
- The gang plough turned three furrows at once.
- The farmer hitched the gang plough to the tractor.
