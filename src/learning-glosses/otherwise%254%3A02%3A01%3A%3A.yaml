senseId: 'otherwise%4:02:01::'
synsetId: 00046442-r
simpleMeaning: In other ways or respects, apart from what has just been mentioned.
scope: This is not about something being different from what was expected; it points to the other features
  of the same thing.
examples:
- The room was small but otherwise comfortable.
- He was tired but otherwise in good health.
