senseId: 'allies%1:14:02::'
synsetId: 08188491-n
simpleMeaning: The group of nations that fought the Axis in the Second World War and, with later members,
  signed the United Nations charter in 1945.
scope: The nations that fought the Axis in the Second World War, not the nations of the First World War
  and not the Axis itself.
examples:
- The Allies signed the United Nations charter in 1945.
- The Allies fought the Axis in the Second World War.
