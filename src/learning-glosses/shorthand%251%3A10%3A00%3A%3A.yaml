simpleMeaning: a way of writing fast that uses short signs in place of words and parts of words
scope: 'Also called stenography: a fast way of writing with short signs, not writing words out in full
  in the usual way.'
examples:
- She learned shorthand so she could write down what people said in meetings.
- He took notes in shorthand and typed them up later.
