simpleMeaning: To do with, or naming, the time before that long stretch of time in the earth's past.
scope: To do with the time before that long stretch of time in the earth's past, not the time of it and
  not the time after it.
examples:
- The pre-Jurassic rocks formed before that long stretch of time.
- Pre-Jurassic life lived before that long stretch of time.
