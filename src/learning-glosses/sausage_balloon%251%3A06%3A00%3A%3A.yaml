simpleMeaning: a small airship with no stiff frame, used to watch an area or to block enemy planes
scope: This is a small airship with no stiff frame, used for watching or as a barrage balloon, also called
  a sausage and a blimp; not a plane and not a hot-air balloon that carries people for fun.
examples:
- The army sent up a sausage balloon to watch the coast.
- A sausage balloon hung over the town to keep enemy planes away.
