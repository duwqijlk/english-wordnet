simpleMeaning: A fault present from birth in which the top of the head sinks in, hollow rather than rounded
  out.
scope: A fault present from birth in which the top of the head sinks in, also called clinocephalism; not
  a head hurt after birth and not a head of the usual rounded shape.
examples:
- The baby was born with clinocephaly, the top of the head sunk in.
- Doctors noted the clinocephaly at the first check.
