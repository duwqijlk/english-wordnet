simpleMeaning: At times put in the group Dolichos, this herb of the warm lands of the Old World climbs
  and is grown in India for food and for feed.
scope: Also called horse grain and poor man's pulse, it is the herb of the warm lands of the Old World
  that climbs, grown in India for food and feed and at times put in the group Dolichos.
examples:
- Horse gram fed both people and farm animals.
- Horse gram climbed as it grew in the warm lands.
