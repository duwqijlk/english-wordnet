simpleMeaning: Over North America and northern Eurasia, an evergreen shrub forms a mat, with small white
  flowers and fruit the colour of blood; its leaves turn the same colour in fall.
scope: 'Also called bear''s grape, common bearberry, creashak, hog cranberry, mealberry, mountain box,
  sand berry, sandberry, and wild cranberry: a low evergreen shrub with white flowers and fruit the colour
  of blood.'
examples:
- The red bearberry kept its leaves through the winter.
- In fall the red bearberry leaves turned the same colour as its fruit.
