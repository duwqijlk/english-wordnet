senseId: 'wheal%1:26:00::'
synsetId: 14322122-n
simpleMeaning: A raised mark on the skin, as from the blow of a whip, often seen in allergic reactions.
scope: A raised mark on the skin; welt, weal and wale are other names for this sense, not a cut and not
  a bruise.
examples:
- A wheal rose on his arm where the whip had struck.
- The allergy left a wheal on her skin.
