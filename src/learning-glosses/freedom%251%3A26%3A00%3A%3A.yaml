simpleMeaning: The state of being able to act, speak, or think as one chooses, with no limits forced on
  one from outside.
scope: This is liberty in general, not a particular legal right and not the ease of doing something without
  difficulty.
examples:
- The prisoners finally regained their freedom after ten years.
- She values the freedom to choose her own working hours.
