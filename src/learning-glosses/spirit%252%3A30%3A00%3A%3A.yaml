simpleMeaning: To spirit someone is to fill them with energy, courage or high spirits.
scope: 'This is chiefly the phrasal use ''spirit up'': to fill someone with energy, courage or liveliness.
  It is not the noun senses of spirit, such as a person''s inner self, strong alcohol or a ghost, and
  it is not ''spirit away'', which means to carry someone off secretly. The rare verb ''inspirit'' has
  the same meaning.'
examples:
- The coach's pep talk spirited the team up before the final.
- A letter from home spirited him up when he was ready to quit.
