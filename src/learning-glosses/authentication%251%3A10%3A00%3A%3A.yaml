simpleMeaning: A mark on a thing for sale that shows where it comes from and that it is real.
scope: A mark showing a thing for sale is real and where it comes from, also called a hallmark; not the
  act of checking that something is real.
examples:
- The vase bore an authentication from the maker.
- She checked the authentication stamped on the back of the watch.
