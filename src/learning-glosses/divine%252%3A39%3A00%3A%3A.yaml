senseId: 'divine%2:39:00::'
synsetId: 02112042-v
simpleMeaning: to know a thing at once, without being told and without working it out by reason, through
  some power you cannot explain
scope: To know something at once by a power you cannot explain, not to search for hidden water with a
  rod, and not the adjectives for what is holy, heavenly, or splendid.
examples:
- She seemed to divine what he was thinking before he spoke.
- He could divine the answer without any clue.
