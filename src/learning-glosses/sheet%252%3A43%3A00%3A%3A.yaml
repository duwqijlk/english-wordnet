simpleMeaning: to pour down in a heavy, continuous mass, as rain does in a thick curtain
scope: Of rain falling, to come down in a heavy, continuous mass; not wrapping something in cloth, and
  not the noun for a flat expanse.
examples:
- Rain was sheeting down so hard that we could barely see the road.
- The storm sheeted against the windows all night.
