simpleMeaning: Living things made of a single cell, much like the simple green living things that grow
  in water.
scope: Living things made of a single cell, much like the simple green living things that grow in water;
  not true algae and not a one-celled animal.
examples:
- The plantlike flagellate is a single cell that acts much like algae.
- Under the lens, plantlike flagellates look like tiny green algae.
