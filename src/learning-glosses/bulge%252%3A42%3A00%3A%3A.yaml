simpleMeaning: to stick out in a round way, or to be so full that it looks as if it sticks out
scope: Bag is another name for this sense. This is sticking out in a round way, or being so full that
  it looks as if it sticks out. Not the noun for a round part that sticks out, and not making something
  else stick out.
examples:
- His pockets bulged with coins and keys.
- The bag bulged as if it would burst from all the books inside.
