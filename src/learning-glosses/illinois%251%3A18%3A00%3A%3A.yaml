simpleMeaning: A member of the Algonquian people who once lived in the land of that name and in lands
  to the west.
scope: A member of the Algonquian people of that land, not a member of another people and not the language
  of those people.
examples:
- The Illinois hunted and farmed along the great rivers.
- An Illinois elder told stories of the old villages.
