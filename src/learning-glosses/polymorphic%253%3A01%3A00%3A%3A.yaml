simpleMeaning: about a group that breeds together and has more than one kind of member, not because males
  and females are different
scope: This word is about a breeding group with more than one kind of member, also called polymorphous,
  not about differences between males and females.
examples:
- They studied a polymorphic species in which workers and queens look very different.
- A polymorphic population has several kinds of members living and breeding together.
