simpleMeaning: a legal power that lets a person stand in an election
scope: A legal power that lets a person stand in an election, not the power to vote and not the power
  to hold office once chosen.
examples:
- The new rule limits the right to candidacy to party members who wish to stand in the election.
- She used her right to candidacy to stand in the election for mayor.
