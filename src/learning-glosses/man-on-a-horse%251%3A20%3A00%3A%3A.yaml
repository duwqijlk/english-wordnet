scope: This is a mushroom that can be eaten, with yellow gills and a sticky yellow top; not a poisonous
  mushroom and not a mushroom that grows on wood.
examples:
- We found a man-on-a-horse in the damp woods.
- The man-on-a-horse in the basket has a yellow cap.
