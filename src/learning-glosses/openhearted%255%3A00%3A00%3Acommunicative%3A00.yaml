simpleMeaning: Open in what one says, speaking one's thoughts plainly and hiding nothing.
scope: Open in what one says, speaking one's thoughts plainly and hiding nothing; not the use for a person
  moved by kindness and fellow feeling.
examples:
- She was openhearted in her advice, hiding nothing of what she thought.
- He was openhearted with the committee and said plainly what had gone wrong.
