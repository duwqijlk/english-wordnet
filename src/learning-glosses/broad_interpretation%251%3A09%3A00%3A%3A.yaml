simpleMeaning: a way of reading the United States constitution that lets the spirit of the times and the
  country's needs rightly shape court rulings, above all the Supreme Court's
scope: This is a way of reading the United States constitution that lets the spirit of the times and the
  country's needs rightly shape court rulings; judicial activism is another name for it, not a strict
  word-for-word reading and not the original-intent view.
examples:
- A broad interpretation lets judges weigh the needs of the nation.
- The court's broad interpretation shaped its ruling on the case.
