simpleMeaning: a very bad and wrong act, or a very bad and wrong thing that people keep doing
scope: 'Also called turpitude: this is a very bad act, or a very bad thing that people keep doing; it
  is not the general state of a person being bad in the way they live.'
examples:
- The film shows depravity such as beating helpless prisoners.
- They spoke of the depravity of hurting children for fun.
