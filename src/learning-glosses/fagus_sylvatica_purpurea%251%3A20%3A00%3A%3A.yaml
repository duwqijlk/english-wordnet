simpleMeaning: A form of the European beech whose leaves shine purple or copper-coloured.
scope: 'Also called the copper beech, the purple beech, Fagus purpurea and Fagus sylvatica atropunicea:
  a form of the European beech, set apart by leaves that shine purple or copper-coloured.'
examples:
- Fagus sylvatica purpurea showed purple leaves in the garden.
- The leaves of Fagus sylvatica purpurea shone copper-coloured in the sun.
