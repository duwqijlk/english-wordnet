simpleMeaning: protection against unfair treatment because of race, sex, nationality, religion or age,
  promised by the laws of the United States
scope: This is protection against unfair treatment for reasons such as race or sex, promised by United
  States law; not the right to speak freely or the right to vote.
examples:
- Freedom from discrimination is guaranteed by federal law.
- She claimed her freedom from discrimination had been violated.
