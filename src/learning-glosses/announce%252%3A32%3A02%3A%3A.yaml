simpleMeaning: to say something to the public or in an official way so that all people know it
scope: 'Also called declare: this is saying news in a public or official way, not just letting one person
  or a small group know something.'
examples:
- The president announced a new law to the whole country.
- The school announced the exam results on its official website.
