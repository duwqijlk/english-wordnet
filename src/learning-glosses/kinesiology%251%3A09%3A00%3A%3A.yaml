simpleMeaning: The part of the study of how the body works (physiology) that studies how the body moves,
  looking at how its parts work and how they are built
scope: This is the part of the study of how the body works that studies how the body moves, not the study
  of the body's build alone and not the study of how animals in general move.
examples:
- She studied kinesiology to learn how the body moves.
- Kinesiology looks at how the body's parts work when we move.
