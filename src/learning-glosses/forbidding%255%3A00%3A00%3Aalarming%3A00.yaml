simpleMeaning: Showing that something bad or sad is about to happen and making people feel afraid.
scope: Showing that something bad or sad is about to happen and making people feel afraid, with threatening,
  ominous, menacing and sinister as other names for this sense, and not merely harsh and hard to approach.
examples:
- Forbidding thunderclouds gathered over the hills.
- His forbidding tone made the room go quiet.
