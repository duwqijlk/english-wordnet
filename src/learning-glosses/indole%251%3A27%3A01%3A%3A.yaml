simpleMeaning: People take this white or pale yellow crystal-like chemical, whose tiny parts form rings,
  from coal tar and use it to make scents, drugs, and food taste better.
scope: A crystal-like chemical taken from coal tar for scents, drugs, and food taste, not a scent on its
  own and not a drug on its own.
examples:
- The lab tested the indole taken from coal tar.
- A drop of indole gave the perfume its deep smell.
