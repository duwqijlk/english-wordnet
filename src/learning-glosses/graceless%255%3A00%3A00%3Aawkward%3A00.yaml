senseId: graceless%5:00:00:awkward:00
synsetId: 01144758-s
simpleMeaning: not smooth or pleasing in movement or in how something is done, and awkward and clumsy
  in movement
scope: Also called ungraceful. This sense is about awkward movement or work, not about rude behaviour
  or a lack of kindness.
examples:
- He took a graceless fall down the steps.
- The dancers gave a graceless show full of missed steps.
