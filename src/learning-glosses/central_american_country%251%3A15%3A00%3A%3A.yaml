simpleMeaning: Any one of the lands between North America and South America; these lands, except Belize
  and Costa Rica, have low income per person and unsteady governments.
scope: Any one of the lands between North America and South America, which, except Belize and Costa Rica,
  have low income per person and unsteady governments; Central American nation is another name for this
  sense.
examples:
- Guatemala is a Central American country.
- Honduras is a Central American country too.
