synsetId: 00254978-r
simpleMeaning: in a way that is very clear to see, with no attempt to hide it
scope: In a way that is open and clear for all to see; not in a secret way and not in a small, hard-to-see
  way.
examples:
- He blatantly copied his friend's work in front of the teacher.
- They blatantly broke the rule and did not try to hide it.
