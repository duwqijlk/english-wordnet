simpleMeaning: that makes people feel very sad, or that shows very deep sadness
scope: 'Also called grievous and heartbreaking: this word is for something that brings or shows deep sadness,
  not for a small, short feeling of being a little sad.'
examples:
- It was a heartrending story about a child who lost her home.
- He let out a heartrending cry after hearing the bad news.
