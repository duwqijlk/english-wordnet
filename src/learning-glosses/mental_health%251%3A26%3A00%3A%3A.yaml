simpleMeaning: The state of a person's mind when it works well, with feelings and behaviour in good order
scope: The state of a mind working well, with feelings and behaviour in good order; not a mind in disorder
  and not the body when it is ill.
examples:
- Good mental health helps people cope with stress.
- She worked to protect her mental health.
