simpleMeaning: a way of painting on a wall that lasts a long time, using water paints on wet plaster
scope: A way of painting a wall, not the finished wall painting itself and not the act of painting it.
examples:
- Fresco lets paint sink into wet plaster so the picture lasts for years.
- The artist learned fresco while working on church walls.
