senseId: 'ankylosing_spondylitis%1:26:00::'
synsetId: 14243956-n
simpleMeaning: A chronic form of spondylitis, mostly in males, marked by poor movement of the spine, sometimes
  leading to ankylosis, the joints becoming fixed and unable to move.
scope: This sense is also called rheumatoid spondylitis.
examples:
- Ankylosing spondylitis stiffened the spine.
- His ankylosing spondylitis limited the movement of his spine.
