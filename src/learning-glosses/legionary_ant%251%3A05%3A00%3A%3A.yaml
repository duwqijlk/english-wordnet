simpleMeaning: a warm-climate wandering bug that mostly hunts other insects
scope: A warm-climate wandering bug that mostly hunts other insects, also called an army ant or a driver
  ant, not a house ant that lives in one nest and not a bee that gathers food from flowers.
examples:
- A legionary ant hunts other insects in the warm forest.
- The legionary ants moved on, looking for new prey.
