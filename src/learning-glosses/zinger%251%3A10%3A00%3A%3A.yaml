simpleMeaning: a remark that stands out because it is funny or sharp and hurtful
scope: A remark that is funny or sharp and stands out; it is not a plain, kind comment.
examples:
- He ended the talk with a zinger that made everyone laugh.
- Her zinger about the boss was sharp, and no one forgot it.
