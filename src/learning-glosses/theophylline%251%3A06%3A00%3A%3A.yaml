simpleMeaning: A clear, sharp-edged stuff that plants make, taken from tea leaves or made in a lab, used
  in medicine to open the airways of the lungs.
scope: It is the plant stuff doctors use to open the airways of the lungs.
examples:
- The doctor gave her theophylline to help her breathe more easily.
- Doctors use theophylline to open the airways of people who cannot breathe well.
