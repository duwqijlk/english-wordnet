senseId: 'adhesive_friction%1:19:00::'
synsetId: 11480680-n
simpleMeaning: the hold between a thing and the surface under it as it moves, such as between a car tire
  and the road
scope: 'Also called grip and traction: the hold between a moving thing and the surface under it, not a
  sticky stuff that joins surfaces and not the rubbing of two dry things against each other.'
examples:
- Good adhesive friction keeps the tires from sliding on the wet road.
- The adhesive friction between the wheel and the track helped the train climb the hill.
