simpleMeaning: Painters in 1905 began to use colours far brighter than life and shapes kept as plain as
  they could be, and their work left its mark on the expressionists.
scope: This names the 1905 movement of painters who chose colours far brighter than life and kept their
  shapes plain, the movement that came before the expressionists and shaped their work.
examples:
- Fauvism shocked viewers with its bright, unreal colours.
- The young painter admired fauvism and tried its plain shapes in his own work.
