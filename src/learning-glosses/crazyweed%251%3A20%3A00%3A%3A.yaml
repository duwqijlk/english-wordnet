simpleMeaning: Any of several pod-bearing plants of western North America that make farm animals act strangely
scope: This is any of several pod-bearing plants of western North America that make farm animals act strangely;
  crazy weed and locoweed are other names for it; not a harmless grass of the same fields, and not a plant
  that poisons people.
examples:
- The crazyweed made the cattle stagger.
- Ranchers pull up crazyweed before it harms the herd.
