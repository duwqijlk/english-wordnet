schema: oewn-learning-gloss-v2
senseId: 'inebriation%1:26:01::'
synsetId: 14088126-n
simpleMeaning: A continuing state of frequent intoxication from long-term heavy drinking, which damages
  health and makes the body depend on drink, with severe symptoms if drinking stops.
scope: This is the lasting condition of habitual intoxication, not the temporary state after a single
  drinking session.
examples:
- Chronic inebriation had left him unable to hold a job.
- The clinic treats people whose inebriation has damaged their liver.
