senseId: 'gourmandize%2:34:00::'
synsetId: 01195632-v
simpleMeaning: Like a pig, a person keeps on eating far past enough, with no hold on how much is taken
scope: To keep eating long past enough, with no care for manners; binge, englut, engorge, glut, gorge,
  gormandise, gormandize, ingurgitate, overeat, overgorge, overindulge, pig out, satiate and stuff are
  other names for this, not a normal meal and not eating only what you need.
examples:
- He gourmandized at the buffet until he could eat no more.
- The guests gourmandized on turkey and pie.
