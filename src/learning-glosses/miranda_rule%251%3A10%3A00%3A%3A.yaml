senseId: 'miranda_rule%1:10:00::'
synsetId: 06667819-n
simpleMeaning: Police questioning you after arrest must warn you your words can be used as proof, and
  tell you you may have a lawyer and stay silent until one guides you
scope: A law about what police must tell you after an arrest, not a law about how long police may hold
  you and not a law about trials.
examples:
- The Miranda rule means police must tell you your rights after an arrest.
- Under the Miranda rule, you may have a lawyer and stay silent.
