simpleMeaning: How the earth's crust bends and breaks is what this part of the study of rocks and the
  earth looks at.
scope: Tectonics and plate tectonics are other names for this part of the study of rocks and the earth,
  which looks at how the earth's crust bends and breaks.
examples:
- The folding and faulting of the earth's crust is explained by plate tectonic theory.
- The earth's crust bends and breaks, as plate tectonic theory shows.
