simpleMeaning: A snake of the southwestern United States whose rings copy a coral snake's; it almost swims
  through loamy soil or sand of coarse or fine grains.
scope: A sand-dwelling snake of the American Southwest; it is not the coral snake whose bands it copies.
examples:
- The banded sand snake slipped through loose dune sand.
- Its rings make a banded sand snake look like a coral snake.
