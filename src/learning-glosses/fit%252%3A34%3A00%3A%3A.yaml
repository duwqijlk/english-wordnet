simpleMeaning: To be enough to answer a need, wish, or requirement.
scope: This is the sense of being enough to answer a need or rule, not the adjective for meeting standards,
  not the adjective for being ready or inclined, not the adjective for being healthy, not the noun for
  a show of bad temper, not the noun for a sudden attack that cannot be controlled, not the noun for the
  way a garment sits on the body, not the noun for a short burst of activity, not the verb sense for being
  acceptable to someone, not the verb sense for being the right size or shape, not the verb sense for
  making something the right size, not the verb sense for putting several things or people into a space,
  not the verb sense for details agreeing or matching, not the verb sense for following a particular shape
  or size, not the verb sense for supplying something for a purpose, and not the verb sense for bringing
  things into harmony.
examples:
- This schedule does not fit the needs of working parents.
- The new budget must fit the conditions set by the grant.
