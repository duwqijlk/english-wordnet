simpleMeaning: The quality of keeping away from too much of anything.
scope: Also called moderation, this is the quality of keeping away from too much of anything, not the
  act of tempering.
examples:
- His temperance in food and drink kept him fit into old age.
- She praised his temperance, never taking more than he needed.
