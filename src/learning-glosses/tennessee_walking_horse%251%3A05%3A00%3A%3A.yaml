simpleMeaning: This animal was taught to move at a fast running walk, and it is strong enough to keep
  going for a long time.
scope: 'Also called Tennessee walker, Plantation walking horse and Walking horse: an animal taught to
  move at a fast running walk that can keep going for a long time, not a horse taught to move in another
  way.'
examples:
- The Tennessee walking horse moved at a fast running walk around the ring.
- Her Tennessee walking horse was taught to move at a fast running walk.
