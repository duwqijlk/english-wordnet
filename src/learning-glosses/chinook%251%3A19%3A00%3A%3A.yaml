simpleMeaning: A warm, dry wind blowing down the east side of the Rockies.
scope: This sense is a warm, dry wind blowing down the east side of the Rockies, unlike the sense for
  a big Pacific salmon, prized as food, whose grown fish die after spawning, and unlike the sense for
  the pink or white flesh of a big Pacific salmon.
examples:
- The chinook blew warm and dry down the Rockies.
- Chinooks warm the eastern slopes.
