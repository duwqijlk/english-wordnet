simpleMeaning: in a strong, begging way, when you ask someone to do something for you
scope: Used for the way someone asks when they are begging for help; not for asking in a calm way or for
  telling someone what to do.
examples:
- '''Please do not leave,'' she said beseechingly.'
- He held out his hands beseechingly and asked for one more chance.
