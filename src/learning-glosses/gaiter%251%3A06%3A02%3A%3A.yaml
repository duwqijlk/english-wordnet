simpleMeaning: A cloth cover, a legging, that covers the instep and ankles.
scope: A cloth cover, a legging, that covers the instep and ankles; also called spat; not a legging of
  cloth or leather, covering the leg from the knee to the ankle, nor a shoe covering the ankle, with stretchy
  bits in the sides.
examples:
- Their gaiter covered the foot.
- The gaiter was worn at dawn.
