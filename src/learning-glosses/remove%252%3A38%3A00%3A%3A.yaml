simpleMeaning: To move someone or something to a different place, for business, legal, school, or military
  reasons.
scope: Relocating a case, a group, or a person to another place, not taking something away and not dismissing
  someone from a job.
examples:
- The lawyer asked to remove the case to a federal court.
- The regiment was removed to the forest outside the city.
