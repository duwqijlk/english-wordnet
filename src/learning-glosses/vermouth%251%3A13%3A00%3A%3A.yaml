simpleMeaning: One of several white wines with herbs added to give a strong smell and taste; used as a
  drink before a meal or in mixed drinks
scope: This is a white wine with herbs added for smell and taste; it is not a plain white wine with nothing
  added, and not the mixed drink made with it.
examples:
- She ordered a glass of vermouth before dinner.
- He mixed vermouth with gin to make the drink.
