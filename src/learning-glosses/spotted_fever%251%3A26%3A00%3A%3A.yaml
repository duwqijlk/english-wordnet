simpleMeaning: any of several bad sicknesses with high body heat and a rash or marks on the skin
scope: Any of several bad sicknesses with high body heat and a rash or marks on the skin; not a mild rash
  and not a sickness with high heat but no rash.
examples:
- The doctor feared spotted fever when the rash spread.
- Spotted fever brings high heat and marks on the skin.
