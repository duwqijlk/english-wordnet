simpleMeaning: A tool that measures how dark a thing is in light or in a photo
scope: A tool that measures how dark a thing is in light or in a photo, not a ruler and not a tool that
  measures how heavy a liquid is.
examples:
- The densitometer read the darkness of the photo negative.
- She used a densitometer to check the film.
