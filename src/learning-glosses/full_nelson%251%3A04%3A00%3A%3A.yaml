simpleMeaning: Amateur wrestling does not allow this hold, in which one wrestler puts both arms under
  the other's arms and presses on the back of the neck.
scope: This wrestling hold is one amateur wrestling does not allow.
examples:
- He locked his opponent in a full nelson.
- His full nelson was ruled illegal in the amateur bout.
