simpleMeaning: The food pipe drains through small blood tubes into the big chest blood tube or the one
  beside the spine.
scope: Also called esophageal veins and venae esophageae, they are the small tubes that drain the food
  pipe, not the big chest blood tube they empty into.
examples:
- Blood leaves the food pipe through the oesophageal veins.
- The oesophageal veins carry blood to the big tube in the chest.
