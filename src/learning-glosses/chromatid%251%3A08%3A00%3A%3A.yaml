simpleMeaning: One of the two matching threads that a chromosome splits into when a cell divides
scope: One of the two matching threads that a chromosome splits into when a cell divides; not the whole
  chromosome and not the stuff inside a cell's centre.
examples:
- Each chromatid is one of two matching threads.
- During cell division, the chromatids pull apart.
