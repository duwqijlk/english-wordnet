simpleMeaning: In making electric parts, to eat away chosen bits from the top of a chip or board, with
  a liquid, a beam of light, or charged bits.
scope: In making electric parts, to eat away chosen bits from the top of a chip or board, not to cut a
  picture into a block for printing.
examples:
- The factory etched the circuit onto the small chip.
- Workers etched the board with a fine beam of light.
