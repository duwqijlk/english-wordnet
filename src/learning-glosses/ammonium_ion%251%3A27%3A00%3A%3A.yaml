simpleMeaning: In many ways this charged bit acts like a bit of an alkali metal; it is made from ammonia,
  one nitrogen bit joined to four hydrogen bits.
scope: Also called ammonium, this charged bit is made from ammonia and acts in many ways like a bit of
  an alkali metal.
examples:
- The ammonium ion comes from ammonia.
- Ammonium ions act like alkali metal ions.
