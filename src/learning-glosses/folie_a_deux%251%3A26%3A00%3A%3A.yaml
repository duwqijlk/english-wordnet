senseId: 'folie_a_deux%1:26:00::'
synsetId: 14411009-n
simpleMeaning: Two people of one family, like brother and sister or husband and wife, showing signs of
  the same mental illness at the same time, such as false beliefs.
scope: Two people of one family show signs of the same mental illness at the same time, not one person
  alone, and not two people with different illnesses.
examples:
- In folie a deux, a husband and wife both held the same false belief.
- The two sisters showed folie a deux, sharing the same false beliefs.
