simpleMeaning: A secret matter of hidden lore, like the Jewish Kabbalah, kept from most people.
scope: A secret matter of hidden lore like the Kabbalah, also called cabala, cabbalah, kabala, kabbala
  and kabbalah; not the Kabbalah itself and not a public teaching.
examples:
- He studied the cabbala in secret for years.
- The cabbala was known only to a few.
