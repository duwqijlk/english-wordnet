simpleMeaning: A side track of a railway that leaves the main track and joins it again further on.
scope: A railway side track that leaves the main track and comes back to it, not a straight track and
  not a flying trick.
examples:
- The train took the loop-line around the town.
- The loop-line left the main track at the station and joined it again past the bridge.
