simpleMeaning: In law, a ruling for the person sued when the person who sued stops going on with the case,
  as by not coming to court
scope: In law, a ruling for the person sued when the claimant stops going on with the case; non pros is
  another name for this, not a ruling after a trial and not a ruling for the claimant.
examples:
- The court recorded a non prosequitur after the plaintiff dropped the case.
- Non prosequitur left the defendant free of the claim.
