simpleMeaning: An expression or idea described this way has been used so often that it feels too familiar
  and no longer fresh.
scope: It describes words or ideas worn out by overuse, not a share of ownership or a part of a gun.
examples:
- The film relies on stock characters and a predictable ending.
- That excuse is a stock answer he uses every time.
