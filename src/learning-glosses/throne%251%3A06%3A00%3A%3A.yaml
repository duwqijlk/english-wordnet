simpleMeaning: the special chair of a king, queen, bishop, or another person of high rank, used at formal
  events
scope: This is the special chair a king, queen, bishop, or another person of high rank sits on at formal
  events; it is not a toilet and not the power or position of a ruler.
examples:
- The king sat on his throne during the ceremony.
- A golden throne stood in the great hall for the queen.
