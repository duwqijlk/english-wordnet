simpleMeaning: the way of mixing cards by cutting the pack in two and letting the cards from each half
  mix in turn at the corners
scope: A card shuffle in which cards from the two halves mix in turn at their corners, not a quick search
  through a pile of papers.
examples:
- His riffle was so smooth the cards from each half mixed in turn.
- She finished the riffle and dealt the cards.
