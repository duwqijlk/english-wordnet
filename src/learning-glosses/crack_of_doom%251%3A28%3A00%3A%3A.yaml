simpleMeaning: In the New Testament, the day at the end of time, after Armageddon, when God will judge
  each person by the good and bad in their life on earth.
scope: This is the last day of judgment in the New Testament, not a battle or a place; also called doomsday,
  day of reckoning, end of the world, and eschaton.
examples:
- They spoke of the crack of doom as the end of all things.
- The crack of doom will come after Armageddon, they believed.
