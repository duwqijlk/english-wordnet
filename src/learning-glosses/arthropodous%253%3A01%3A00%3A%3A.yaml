simpleMeaning: about animals with no backbones that are part of Arthropoda, the group of animals with
  jointed legs and hard outer covers
scope: 'Also called arthropodal and arthropodan: about animals with no backbones that are part of Arthropoda,
  not about animals with backbones and not about a worm or a snail.'
examples:
- The arthropodous crab scuttled across the rock.
- Ants, bees and shrimps are arthropodous animals.
