simpleMeaning: In counting, the part of all the counts that fall in one group, set against the whole number
  of counts
scope: In counting, the share of all counts that fall in one group, not the plain number of counts in
  that group.
examples:
- The frequency of red balls was three out of ten.
- She worked out the frequency of each answer in the survey.
