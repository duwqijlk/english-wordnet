simpleMeaning: The sound of a film, recorded on a thin strip of the film
scope: The sound track of a film; not the music of a play and not the film pictures themselves.
examples:
- The soundtrack holds the film's sound on a thin strip of the film.
- You can hear the dialogue on the soundtrack.
