synsetId: 00141213-n
simpleMeaning: the act of joining parts together so they fit tightly and hold each other in place
scope: Also called interlock, and another name for it is meshing. It is the act of joining, not the sense
  that says things are linked or locked closely together.
examples:
- The interlocking of the metal pieces made the gate strong.
- An interlocking of arms by the police held the crowd back.
