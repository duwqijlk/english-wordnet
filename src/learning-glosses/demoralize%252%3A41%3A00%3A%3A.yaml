simpleMeaning: to make a person behave in a bad way about right and wrong, or to lead them into too much
  drink or too much bodily pleasure, such as sex
scope: This sense, also called corrupt, pervert, profane, subvert, debase, misdirect, deprave, debauch,
  demoralise and vitiate, is about making a person worse in right and wrong, not about making someone
  lose hope or feel low in spirit.
examples:
- He tried to demoralize the young men by getting them drunk every night and leading them into bad habits.
- Wine and wild living demoralized him, and he no longer cared about right and wrong.
