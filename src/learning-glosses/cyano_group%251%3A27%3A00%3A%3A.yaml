simpleMeaning: in a chemical stuff, a small part made of one carbon bit and one nitrogen bit joined together,
  with one free link
scope: 'Also called cyanide group, cyanide radical and cyano radical: this is a small part with one free
  link inside a chemical stuff, not the whole stuff itself.'
examples:
- The cyano group has one free link for joining to another part.
- A cyano group can be found in this chemical compound.
