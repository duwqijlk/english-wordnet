simpleMeaning: A false charge of wrongdoing, or a spiteful twist of what someone said or did.
scope: This is a false charge of wrongdoing or a spiteful twist of what someone said or did, not honest
  criticism; also called calumny, defamation, calumniation, obloquy, and traducement.
examples:
- The article was a hatchet job on the mayor.
- Critics called the review a hatchet job.
