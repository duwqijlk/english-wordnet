simpleMeaning: Things that have to do with that church, or that are like it, are what this word is about.
scope: Said of that church; Orthodox, Greek Orthodox and Russian Orthodox are other names for this sense,
  not to do with the Roman Catholic church.
examples:
- The Eastern Orthodox church in our town is open to all.
- She grew up in an Eastern Orthodox home.
