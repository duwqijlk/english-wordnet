senseId: 'dynamic_loudspeaker%1:06:01::'
synsetId: 92463739-n
simpleMeaning: A loudspeaker in which a thin cone, hung on a flexible ring in a stiff frame, is driven
  by a wire coil sliding through a magnetic gap to make sound.
scope: 'Another name for dynamic speaker and moving-coil loudspeaker: the coil-and-cone loudspeaker that
  turns an electrical signal into sound. Not a microphone, which works the same way in reverse, nor an
  electrostatic speaker, which moves a charged film rather than a coil.'
examples:
- The old radio's dynamic loudspeaker still sounds warm and full.
- In a dynamic loudspeaker, the coil and the cone move together as one unit.
