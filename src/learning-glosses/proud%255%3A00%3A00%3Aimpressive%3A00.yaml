simpleMeaning: showing great dignity and a noble quality in the way someone or something looks or carries
  itself.
scope: This describes a dignified, noble appearance or manner, not the inner feeling of satisfaction about
  an achievement.
examples:
- The duchess made a proud entrance, her head held high.
- The old king remained proud and dignified to the end.
