simpleMeaning: the parts of the body that take in the gas we need and give off the waste gas we breathe
  out; in land animals this is done by breathing
scope: Not the set of tubes that carry blood, and not the set of parts that take in food; also called
  systema respiratorium.
examples:
- The respiratory system moves air in and out of the lungs.
- Smoke can harm the respiratory system.
