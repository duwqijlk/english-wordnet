simpleMeaning: an operation in which a surgeon takes out the small gland at the base of the brain
scope: An operation that takes out the pituitary gland, not a drug treatment and not the removal of any
  other gland.
examples:
- The surgeon planned a hypophysectomy to remove the tumour pressing on the gland.
- After the hypophysectomy, her hormone levels had to be checked each week.
