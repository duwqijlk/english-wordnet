simpleMeaning: In mathematics and logic, said of parts or roles that can swap places with each other.
scope: In mathematics and logic, parts that can swap places, not things that can take each other's place
  in use.
examples:
- The two sides of the equation are interchangeable.
- In that rule, the names are interchangeable without changing the sense.
