scope: This teaching holds that what is useful is good, and it was worked out above all by Jeremy Bentham
  and James Mill.
examples:
- Utilitarianism judges an act by the happiness it brings.
- Bentham and Mill worked out utilitarianism as the most happiness for the most people.
