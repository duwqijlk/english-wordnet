simpleMeaning: smooth and shining, throwing back light, and soft and bright like silk
scope: Smooth and shining, throwing back light, and soft and bright like silk, also called slick, silky,
  and silken, not neatly dressed and not made to cut through water or air with ease.
examples:
- The sleek fur of the otter shone in the sun.
- Her sleek black hair fell to her shoulders.
