simpleMeaning: a fault in which the bones of a joint stick together and cannot move
scope: 'Also called anchylosis: a fault in which the bones of a joint stick together and cannot move,
  not a broken joint and not a stiff muscle.'
examples:
- His ankylosis left his knee locked in one place.
- The doctor said her ankylosis had made the joint in her finger stiff and still.
