simpleMeaning: a middle-sized shark that bears live young, with a flat, wide head and an eye at each end,
  in warm waters worldwide; it can be dangerous
scope: Also called hammerhead shark, this is the shark that lives in warm seas, not the hard hitting end
  of a hammer tool.
examples:
- The hammerhead swam past the boat in the warm water.
- We saw a hammerhead with eyes at the far ends of its head.
