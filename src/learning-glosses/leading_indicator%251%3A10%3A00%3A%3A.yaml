simpleMeaning: One of 11 signs, each for a different part of the economy, that the Department of Commerce
  uses to tell what the economy will do next
scope: One of a set of 11 signs used to look ahead; not a measure of what has already happened, and not
  a single figure for one trade.
examples:
- Housing starts are a leading indicator of where the economy is headed.
- The report called the rise in orders a leading indicator of growth.
