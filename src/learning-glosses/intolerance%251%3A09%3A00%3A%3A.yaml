schema: oewn-learning-gloss-v2
senseId: 'intolerance%1:09:00::'
synsetId: 06214889-n
simpleMeaning: A way of thinking that does not accept that other people have different views or beliefs,
  and does not respect those differences
scope: Not respecting other people's different views or beliefs; this is about the mind, not about a body
  that cannot take a certain food or drug.
examples:
- The teacher would not accept intolerance toward pupils with different beliefs.
- Intolerance grows when people refuse to listen to views unlike their own.
