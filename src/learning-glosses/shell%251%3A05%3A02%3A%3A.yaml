simpleMeaning: the hard outer cover or case of some living things, such as crabs and turtles
scope: 'Also called shield: the hard outer cover of some animals such as crabs and turtles, not the hard
  cover of a soft sea animal and not the hard outer layer of a nut.'
examples:
- The crab's shell was hard and red.
- A turtle pulls its head into its shell.
