simpleMeaning: An exemption sets aside the right to stay silent, so forced words and what they bring out
  cannot be held against the witness, who need no longer fear them.
scope: Also called testimonial immunity, this exemption takes the place of the right to stay silent, so
  forced words cannot be used against the witness.
examples:
- The court gave her use immunity so she would speak freely.
- Under use immunity, his words could not be used against him.
