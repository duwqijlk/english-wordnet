simpleMeaning: a set of words for telling a computer what to do, written in the words of the person using
  it
scope: 'Also called problem-oriented language: a way of telling a computer what to do in the words of
  the person using it, not a low-level machine code and not plain English.'
examples:
- The team chose an application-oriented language so the shop staff could write their own reports.
- With an application-oriented language, the people who use the system can write the rules in their own
  words.
