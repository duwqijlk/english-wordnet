simpleMeaning: In law, the act of proving that a paper said to be a will was signed and made in the way
  the law asks
scope: This is the act of proving in court that a will is real, not the court paper that says a will is
  real and not a court letting a person who did wrong stay free.
examples:
- Probate took months while the court checked that the will was real.
- During probate, lawyers had to prove her father signed the will in the right way.
