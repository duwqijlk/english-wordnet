simpleMeaning: Paper notes put out by a state or a main bank that pass from hand to hand in place of coins.
scope: These are paper notes put out by a state or a main bank that pass from hand to hand, not coins
  or cheques, and they are also called paper currency and paper money.
examples:
- He paid in folding money.
- Folding money is easier to carry than coins.
