simpleMeaning: A dead branch of the Indo-European family of tongues, known from old writings and key to
  rebuilding Proto-Indo-European.
scope: A dead branch of the Indo-European family of tongues, also called Anatolian language; its nearest
  kin are other dead branches of the family, such as Tocharian and Phrygian.
examples:
- Anatolian is known only from old writings cut in stone.
- Scholars use Anatolian to rebuild Proto-Indo-European.
