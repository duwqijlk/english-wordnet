simpleMeaning: the skill of handling a matter in a careful and clever way
scope: Skill in handling a matter with care and a light touch, also called delicacy and another name for
  which is diplomacy; not plain strength and not a trick to cheat someone.
examples:
- She handled the angry meeting with real finesse.
- It took finesse to get both sides to agree without a fight.
