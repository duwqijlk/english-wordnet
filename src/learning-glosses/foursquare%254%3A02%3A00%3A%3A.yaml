simpleMeaning: Holding fast to what one believes, and refusing to give ground.
scope: 'Also called squarely and straightforwardly: holding fast to what one believes, and refusing to
  give ground, not the four-sided shape in geometry and not the adjective use for a person firm in belief.'
examples:
- He stood foursquare for religious liberty.
- She spoke foursquare against the plan.
