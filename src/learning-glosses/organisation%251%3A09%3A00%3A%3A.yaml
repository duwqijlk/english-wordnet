simpleMeaning: a set way of putting things in order or sorting them into groups
scope: Also called organization, system, and arrangement, this is a set way of putting things in order
  or sorting them. It is not a group of people who run something, and not the act of setting up a business.
examples:
- The organisation of the books by subject makes them easy to find.
- She changed the organisation of the topics in her report.
