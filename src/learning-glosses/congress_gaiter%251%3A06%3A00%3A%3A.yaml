simpleMeaning: a short boot that reaches the ankle, with stretchy panels in the sides so it can be pulled
  on
scope: This is a short boot that reaches the ankle and pulls on with stretchy side panels; congress boot
  and congress shoe are other names for this sense, and it is not a tall boot or a lace-up shoe.
examples:
- She pulled on the congress gaiters, and the stretchy sides let them slide over her ankles.
- The congress gaiter slipped on easily thanks to its stretchy sides.
