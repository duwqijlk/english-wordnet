simpleMeaning: A tree of the same name that shows more than one colour or shade
scope: A tree of this kind that shows more than one colour, not a tree of one plain colour and not the
  nut of the tree.
examples:
- The particolored buckeye in our garden has leaves of two different colours.
- Gardeners plant the particolored buckeye for its mixed colours.
