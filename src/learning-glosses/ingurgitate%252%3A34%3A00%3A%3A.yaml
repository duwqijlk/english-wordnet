simpleMeaning: You lose all hold on yourself and eat far more food than you need, with no shame
scope: To eat far more than you need, with no shame, also called binge, englut, engorge, glut, gorge,
  gormandise, gormandize, gourmandize, overeat, overgorge, overindulge, pig out, satiate or stuff, not
  a normal meal and not eating just to feel full.
examples:
- He ingurgitated at the buffet, piling his plate high again and again.
- The children ingurgitated on sweets after the party.
