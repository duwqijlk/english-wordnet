simpleMeaning: a thin, bristle-like or tube-shaped growth sticking out from a plant or animal
scope: This is a narrow growth on a living thing, not a pointed writing tool, not printing rules, and
  not elegance of appearance.
examples:
- The flower's style is a slender tube linking the stigma to the ovary.
- Under the lens, the bristle-like styles on the insect's leg were easy to see.
