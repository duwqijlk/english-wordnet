simpleMeaning: The old high kind of music that keeps to a set form and pleases people who judge music
  with care and know it well
scope: The old high kind of music in a set form, not the music of Europe in general and not the art of
  old Greece and Rome.
examples:
- She listens to classical before bed each night.
- Classical fills the hall when the orchestra plays.
