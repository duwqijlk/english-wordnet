schema: oewn-learning-gloss-v2
senseId: 'oscillate%2:42:00::'
synsetId: 02711906-v
simpleMeaning: to be not sure what to do about something, and keep moving between two different ways of
  acting
scope: 'Also called hover, vibrate and vacillate: to be unsure and keep changing between two choices,
  not to move back and forth again and again in a regular way.'
examples:
- He keeps oscillating between taking the new job and staying where he is.
- She oscillated for days between saying yes and saying no.
