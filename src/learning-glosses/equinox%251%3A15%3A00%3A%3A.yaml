simpleMeaning: In astronomy, one of two points in the sky where the line above Earth's middle crosses
  the path the sun seems to follow
scope: 'Also called equinoctial point: this is a point in the sky, not one of the two times in the year
  when day and night are the same length.'
examples:
- The sky chart marks the equinox where the two lines cross in the sky.
- He showed us the equinox, one of the two crossing points on the chart.
