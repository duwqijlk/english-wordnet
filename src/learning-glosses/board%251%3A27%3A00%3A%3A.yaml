simpleMeaning: a long, flat piece of cut wood that comes in many sizes and is used for many jobs.
scope: This is not a group of people who manage a company, nor getting on a train; it is a flat piece
  of wood.
examples:
- He nailed two boards together to make a shelf.
- The floor was made of wooden boards.
