simpleMeaning: so hard and firm that no begging or pleading can soften it
scope: 'Grim, stern, relentless and inexorable are other names for this sense: so hard and firm that no
  begging can soften it, not merely unwilling to change one''s mind.'
examples:
- The unrelenting judge refused every plea for mercy.
- The unrelenting official turned down every request for more time.
