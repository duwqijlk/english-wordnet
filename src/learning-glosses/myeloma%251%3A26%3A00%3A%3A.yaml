simpleMeaning: a growth in the soft part inside bones (bone marrow), made of cells usually found there,
  and usually harmful and spreading
scope: This is a growth in the soft part inside bones, not a growth in hard bone and not a word for all
  harmful growths.
examples:
- He is being treated for myeloma in a hospital.
- Myeloma starts in the bone marrow and can make the bones weak.
