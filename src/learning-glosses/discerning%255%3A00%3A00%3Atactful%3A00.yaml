simpleMeaning: quietly noticing and understanding what others feel, without drawing attention to yourself,
  and kind about it
scope: 'Also called discreet: quietly noticing what others feel and being kind about it, not about noticing
  fine differences in taste or color, and not just about having keen insight and good judgment.'
examples:
- A discerning editor fixed the line without embarrassing the writer.
- He was discerning enough to leave quietly when she became upset.
