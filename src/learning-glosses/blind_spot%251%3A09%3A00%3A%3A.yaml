simpleMeaning: a subject you know little about or judge with unfair feelings, so you fail to judge it
  well
scope: A subject you know little about or judge with unfair feelings, so you fail to judge it well; not
  a topic you know well and not the part of the eye that cannot see.
examples:
- Golf is one of his blind spots and he's proud of it.
- Money is her blind spot; she never sees when a deal is bad.
