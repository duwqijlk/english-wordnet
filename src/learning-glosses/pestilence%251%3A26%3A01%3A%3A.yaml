senseId: 'pestilence%1:26:01::'
synsetId: 14162173-n
simpleMeaning: A serious infection of rodents, sometimes deadly, caused by the bacterium Yersinia pestis;
  it reaches people by accident when a flea that has bitten an infected animal bites them.
scope: Another name for the plague, the same disease as pest and pestis, not any deadly epidemic in general
  or a harmful influence.
examples:
- Pestilence spread through the town after fleas from infected rats bit people.
- The villagers lived in fear of pestilence.
