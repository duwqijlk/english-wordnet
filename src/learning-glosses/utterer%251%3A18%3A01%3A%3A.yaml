simpleMeaning: a person who passes on fake paper money or fake coins, as if they were real
scope: A person who passes on fake money, not the person who makes it and not a person who uses real money.
examples:
- The police caught the utterer as he tried to pay with a forged note.
- The utterer passed fake coins to shopkeepers across the town.
