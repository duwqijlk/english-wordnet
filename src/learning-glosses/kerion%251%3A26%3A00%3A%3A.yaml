simpleMeaning: A swelling covered with pus-filled blisters that ooze fluid usually grows on the scalp
  or beard when ringworm gets into the hair roots there.
scope: A ringworm infection of the scalp and beard.
examples:
- The boy's kerion made his scalp swell.
- Kerion left a swelling that oozed fluid on his beard.
