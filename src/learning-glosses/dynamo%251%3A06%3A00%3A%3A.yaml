simpleMeaning: a machine that makes electric power, with a coil (the armature) that turns between the
  poles of an electromagnet (the field magnet), so electricity flows through the coil
scope: This is a machine that makes electric power with a turning coil, not a battery that stores power
  and not a motor that uses power to make things turn.
examples:
- The old bicycle lamp got its power from a small dynamo fixed by the wheel.
- As the wheel turned, the dynamo made enough power for the light.
