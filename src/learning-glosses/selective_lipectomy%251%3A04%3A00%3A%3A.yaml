simpleMeaning: Fat is broken down and taken away from one chosen place of the body in this operation,
  which shapes the body.
scope: This is also called lipectomy, and it is the operation that breaks down and takes away fat from
  one chosen place of the body.
examples:
- They had a selective lipectomy to take away fat from one chosen place.
- The selective lipectomy shaped one part of the body by taking fat away.
