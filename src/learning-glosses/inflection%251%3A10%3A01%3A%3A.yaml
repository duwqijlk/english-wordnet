simpleMeaning: the way a speaker makes their voice louder or softer, higher or lower, and changes its
  tone
scope: The way a voice rises and falls in speech, not a change in a word's form to show its grammar.
examples:
- Her inflection rose at the end of each question.
- He kept his inflection flat when he read the news.
