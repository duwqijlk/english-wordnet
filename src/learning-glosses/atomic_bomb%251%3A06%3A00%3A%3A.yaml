simpleMeaning: Splitting the cores of heavy stuff like uranium 235 or plutonium 239 frees a huge burst
  of power in this weapon
scope: Also called atom bomb, fission bomb, or plutonium bomb, this weapon's power comes from splitting
  heavy cores, not from burning or ordinary explosives.
examples:
- The atomic bomb freed a huge burst of power by splitting heavy cores.
- An atomic bomb splits uranium 235 or plutonium 239 to free its power.
