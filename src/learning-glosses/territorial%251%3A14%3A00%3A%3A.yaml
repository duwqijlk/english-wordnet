simpleMeaning: a military unit linked to a certain area
scope: This is the army group itself, not one soldier in it and not the word for belonging to an area
  or for guarding an area against people who come in.
examples:
- Our town's territorial is a large unit, and all its members train together on weekends.
- The territorial based in the next town sent its whole group to help after the flood.
