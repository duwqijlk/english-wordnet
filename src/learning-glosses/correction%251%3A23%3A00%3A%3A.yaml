simpleMeaning: an amount added to or taken from a science measure to make the result closer to the true
  value
scope: An amount added to or taken from a measure in science, not the act of putting a mistake right.
examples:
- The correction brought the reading closer to the true value.
- He applied a small correction to the measurement before writing it down.
