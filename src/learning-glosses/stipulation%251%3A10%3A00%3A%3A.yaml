senseId: 'stipulation%1:10:00::'
synsetId: 06768279-n
simpleMeaning: a thing that is taken as true, and that something else must rest on if it is to be right
  or to work
scope: 'Also called condition and precondition: a point taken as true that other things rest on, not an
  agreement made by the sides in a court case.'
examples:
- 'His argument rests on one stipulation: that the first report was true.'
- Without that basic stipulation, the whole claim falls apart.
