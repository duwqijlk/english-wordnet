simpleMeaning: In grammar, the role of a noun phrase that names something which exists only because of
  the action the verb describes.
scope: Not the ordinary idea of an outcome or consequence; this is a technical grammar label for the role
  a noun phrase plays.
examples:
- In 'she baked a cake', the phrase 'a cake' has the result role.
- The class discussed why 'a poem' counts as a result in 'he wrote a poem'.
