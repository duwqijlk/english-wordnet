simpleMeaning: a way of thinking that leads a person to back one group, view, or idea more than the other
  choices
scope: 'Also called partiality: a habit of favoring one side over others. It is not simply belonging to
  a party, and not one single act done for one side.'
examples:
- Partisanship made many voters reject the plan without reading it.
- The report showed clear partisanship toward one party.
