simpleMeaning: a person whose job is to think up or supply the dress worn by actors in a play or by people
  at a masked ball
scope: A person who plans or gives out the clothes worn on stage or at a fancy-dress party, not a person
  who sews them and not a person who acts in the play; costume designer and costumer are other names for
  this sense.
examples:
- The costumier showed the dancers their new costumes.
- Our costumier keeps a large store of hats, wigs and gowns.
