simpleMeaning: a prize made of a yellow-brown metal, or made to look like that metal, most often given
  for coming third in a contest
scope: A prize for coming third in a contest, not a prize for coming first or second.
examples:
- She won a bronze medal for finishing third in the race.
- He keeps his bronze medal in a small box on the shelf.
