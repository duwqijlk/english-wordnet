simpleMeaning: the process by which a liquid forms lumps that are partly solid and partly liquid
scope: 'Also called clotting: a liquid forming partly solid lumps, not a liquid turning fully solid or
  drying out.'
examples:
- You can see curdling when small soft lumps start to form in the milk.
- Curdling happened after lemon juice was added to the warm milk.
