simpleMeaning: A warm outer garment made of thick wool cloth, usually with a hood and fastened with toggles
scope: A warm outer garment, also called duffle coat; not a light jacket and not a rain garment.
examples:
- She wore a duffel coat with a hood against the cold wind.
- His duffel coat fastened with wooden toggles.
