simpleMeaning: the tube that carries food from the back of the mouth down to the stomach
scope: The tube that takes food from the back of the mouth to the stomach; gorge is another name for it,
  not the windpipe and not the stomach itself.
examples:
- The fish swallowed the bait whole, and it slid down its gullet.
- Food passes through the gullet on its way to the stomach.
