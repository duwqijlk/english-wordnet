simpleMeaning: a quiet feeling under what someone says, and a meaning that is there but not said in plain
  words
scope: 'Also called undertone: a hidden feeling or meaning under spoken words, not a flow of water moving
  under the surface.'
examples:
- There was an undercurrent of anger in his polite reply.
- Her happy words had an undercurrent of sadness about leaving.
