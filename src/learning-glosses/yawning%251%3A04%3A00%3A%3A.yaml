simpleMeaning: The act of opening the mouth wide and breathing in, done without meaning to, usually when
  tired or bored
scope: 'Also called a yawn: the act of opening the mouth wide and breathing in without meaning to, usually
  when tired or bored, not a wide open hole in the ground and not a face with the mouth open in boredom.'
examples:
- The yawning in the hall told him it was time to stop.
- She tried to hide her yawning during the long talk.
