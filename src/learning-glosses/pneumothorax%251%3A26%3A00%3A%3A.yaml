senseId: 'pneumothorax%1:26:00::'
synsetId: 14173018-n
simpleMeaning: Air wrongly in the space round the lung, so the lung falls flat; it may start by itself
  after a chest injury, or be brought on to treat tuberculosis
scope: A lung fallen flat because air has got into the space round it, not a lung blocked by fluid and
  not a chest wound on its own.
examples:
- The pneumothorax made his lung fall flat and left him short of breath.
- Doctors treated the pneumothorax by letting the trapped air out.
