simpleMeaning: A tall, showy annual from tropical America, with hairy stems, deep purple-flushed leaves
  and long spikes of usually red flowers; people often eat its seeds as a cereal.
scope: Another name for the tall grain plant also called purple amaranth; it is the whole plant, not just
  the seeds, and not the Asian annual with drooping crimson spikes.
examples:
- Red amaranth towered over the bed, long spikes of red flowers rising above purple-washed leaves.
- She harvests the seeds of red amaranth each autumn and cooks them as a cereal.
