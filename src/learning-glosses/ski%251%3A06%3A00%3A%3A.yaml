simpleMeaning: One of a pair of thin runners made of wood, metal or plastic, used for sliding over snow
scope: One of a pair of runners for sliding over snow, not the act of sliding over snow on them.
examples:
- She put on her skis and slid down the slope.
- His new skis are made of light plastic.
