simpleMeaning: electronic gear that sends out or takes in electric and magnetic waves that carry pictures
  and sound
scope: Gear for sending or taking in pictures and sound, also called television equipment; not a camera
  alone and not the pictures themselves.
examples:
- The school bought new video equipment for the drama studio.
- This video equipment can send out pictures and sound to every classroom.
