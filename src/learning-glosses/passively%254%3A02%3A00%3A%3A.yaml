simpleMeaning: in a way that lets things happen without trying to act, fight back, or change anything
scope: This is about letting things happen without acting, not about acting, taking part, or fighting
  back.
examples:
- He listened passively and said nothing during the whole meeting.
- She sat passively while others made all the plans for her.
