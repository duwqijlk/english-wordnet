simpleMeaning: A nerve cell that carries signals out from the brain or the cord in the spine
scope: 'Efferent neuron, motor nerve fiber and motor neuron are other names for this sense: a nerve cell
  that carries signals out from the brain or spine, not a nerve cell that carries signals in.'
examples:
- A motoneuron carries signals from the brain to the muscles.
- Damage to a motoneuron can weaken the arm.
