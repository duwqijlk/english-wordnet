simpleMeaning: An air-filled sac near the backbone in many fish that helps keep them afloat.
scope: This is an air-filled sac in many fish that helps keep them afloat, also called float or air bladder,
  and not a lung or a stomach.
examples:
- The swim bladder lets the fish stay at one depth.
- Air filled the swim bladder as the fish rose.
