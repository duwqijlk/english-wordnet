simpleMeaning: A craft that can travel beyond the earth's air, and in a strict sense a body that goes
  round the sun
scope: A craft that can travel beyond the earth's air; spacecraft and ballistic capsule are other names
  for it, not an aeroplane and not a rocket that stays near the earth.
examples:
- The space vehicle left the earth's air and travelled far into outer space.
- The space vehicle goes round the sun, far from the earth.
