simpleMeaning: A round fungus with a smooth top, at first sunk in sand; the top splits open into parts
  that spread out like the spokes of a flower head.
scope: An earthball that opens at the top into spreading parts, not the smooth earthball, whose skin cracks
  as it grows old.
examples:
- They found a star earthball buried in the sand.
- The top of the star earthball had opened into spreading segments.
