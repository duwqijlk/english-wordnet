simpleMeaning: A set of parts that oils engines which burn fuel inside, with a pump that pushes oil into
  the places where the shafts turn.
scope: This is a set of parts that oils engines which burn fuel inside, with a pump that pushes oil in,
  and it is not a set of parts worked by hand; force-feed lubricating system, force feed, pressure-feed
  lubricating system and pressure feed are other names for this sense.
examples:
- The lubricating system pumps oil to the engine bearings.
- A fault in the lubricating system can seize the engine.
