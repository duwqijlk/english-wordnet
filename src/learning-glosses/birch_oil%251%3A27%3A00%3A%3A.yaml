simpleMeaning: a liquid ester, a chemical with a strong smell of wintergreen, rubbed on the skin for small
  aches in the muscles and joints
scope: Also called methyl salicylate and sweet-birch oil, this liquid is rubbed on the skin for small
  muscle and joint aches.
examples:
- She rubbed birch oil into her sore knee.
- The trainer put birch oil on the runner's aching shoulder.
