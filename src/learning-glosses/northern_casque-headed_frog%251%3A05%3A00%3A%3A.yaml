simpleMeaning: A frog of the southwest United States that lives on land, digs, and comes out at night,
  in grassland and scrub woods, with a very hard top to its head.
scope: 'Also called lowland burrowing treefrog: a frog of the southwest United States with a very hard
  top to its head, not a frog that lives in water.'
examples:
- The northern casque-headed frog digs a burrow in the dry grass.
- At night the northern casque-headed frog comes out to hunt.
