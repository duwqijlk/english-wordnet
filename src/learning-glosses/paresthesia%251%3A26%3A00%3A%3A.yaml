senseId: 'paresthesia%1:26:00::'
synsetId: 14348204-n
simpleMeaning: Usually when the nerves near the skin are hurt, the skin feels odd things, such as tingling,
  tickling, itching or burning.
scope: It is also called paraesthesia, and it means odd feelings in the skin, usually tied to hurt in
  the nerves near the skin.
examples:
- Her paresthesia made her skin tingle and itch.
- His paresthesia made his skin burn.
