simpleMeaning: In geology, a hollow in the ground, typically filled by a lake, made when a block of ice
  trapped in stones and earth from moving ice melts
scope: In geology, a hollow left by melted ice, not a large drum and not a metal pot for boiling water.
examples:
- A kettle in the valley now holds a small lake.
- The hikers walked around a kettle left by melted ice long ago.
