simpleMeaning: one of the ten parts that a game of bowling is split into
scope: This is one of the ten parts of a bowling game; it is not the border round a picture, not one still
  picture in a film, and not the bones in a body.
examples:
- He knocked down all the pins in the first frame.
- She scored well in the last frame of the game.
