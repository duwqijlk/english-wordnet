scope: Also called physical distancing, it is the keeping of a safe space from others and the avoiding
  of crowds to slow the spread of infectious sickness, with steps like calling off group events or shutting
  schools, workplaces and public spaces.
examples:
- To practise social distancing, stay at least 6 feet from other people who are not from your household.
- Social distancing can slow the spread of sickness from one person to another.
