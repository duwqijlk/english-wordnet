simpleMeaning: Satellites and computers that find where you are by working out the latitude and longitude
  of a receiver from the times signals from different satellites take to reach it.
scope: Also called the Global Positioning System; a satellite way of finding where you are, not a paper
  map.
examples:
- GPS guided us home.
- Our car uses GPS.
