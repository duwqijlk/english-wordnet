simpleMeaning: A pipe or channel that takes fast-moving water, with a gate that holds the flow back or
  lets it through.
scope: A pipe or channel that takes fast-moving water under a gate, also called a sluice, not a gate that
  sets the flow by itself and not a still pool of water.
examples:
- Water rushed down the penstock to the mill wheel.
- The penstock carried the stream to the power house.
