simpleMeaning: pus that builds up inside a hollow space in the body, in particular the space around a
  lung
scope: Pus that builds up inside a hollow space in the body, in particular the space around a lung, not
  a build-up of pus under the skin and not a swelling full of water.
examples:
- The doctor found an empyema in the space around his lung.
- Her empyema was drained to clear the pus from her chest.
