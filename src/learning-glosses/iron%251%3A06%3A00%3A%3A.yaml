simpleMeaning: A household device with a heated flat base, pressed over fabric to take out creases.
scope: This is the device for pressing clothes, not the metal, not the golf club, and not the act of pressing
  with it.
examples:
- She left the iron on the shirt too long and scorched it.
- The iron was still hot when he put it away.
