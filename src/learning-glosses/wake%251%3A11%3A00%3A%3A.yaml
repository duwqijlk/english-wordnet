simpleMeaning: the spreading line of waves that a boat leaves behind as it moves forward.
scope: This is the water left behind a moving boat, not the night watch over a dead body and not the verb
  meaning to stir up feelings.
examples:
- The ferry left a long white wake across the bay.
- Small boats rocked in the wake of the ship.
