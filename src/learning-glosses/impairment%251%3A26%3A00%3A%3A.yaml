simpleMeaning: the state of not being able to do things because the body or the mind is not fit
scope: Also called disability and handicap. This is the state of not being able to do things because the
  body or mind is not fit, not the act of making something of no use.
examples:
- His hearing impairment made it hard for him to follow the talk.
- With a leg impairment, she could not walk far.
