synsetId: 14301335-n
simpleMeaning: A disease of pines caused by a fungus, in which bark and wood are invaded and swellings
  break out on the surface.
scope: This is the pine disease, not the fungus that causes it; white-pine rust and white pine blister
  rust are other names for the same disease.
examples:
- Blister rust has destroyed entire stands of white pine.
- Foresters watch pine trunks for the orange patches that blister rust produces.
