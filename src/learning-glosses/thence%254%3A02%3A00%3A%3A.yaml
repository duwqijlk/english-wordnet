simpleMeaning: used to bring in the point that follows from a fact or reason just given; because of that
  fact or reason
scope: 'Also called therefore, thus, so and hence: a word that brings in what follows from a fact or reason,
  not a word about a place or a time.'
examples:
- He had no money, and thence he could not buy food.
- The door was locked, and thence they could not get in.
