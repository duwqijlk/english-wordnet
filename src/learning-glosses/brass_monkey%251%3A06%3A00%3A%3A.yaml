simpleMeaning: A metal stand on old sailing ships that once held round shot in place.
scope: A metal stand that once held cannon balls on a sailing ship, not a cannon itself and not the brass
  monkey of the cold-weather saying.
examples:
- The brass monkey held the cannon balls in a neat pile on deck.
- Sailors stacked the shot on the brass monkey before the battle.
