simpleMeaning: a place that stays open late into the night and offers entertainment such as singers or
  dancers, plus dancing, food and drink
scope: This is a late-night place for music, dancing and drinking, not the stick used to hit a golf ball
  or a group of people who meet over a shared interest.
examples:
- After the concert we went to a club and danced until four in the morning.
- The club on the corner has live singers on Fridays and serves food until midnight.
