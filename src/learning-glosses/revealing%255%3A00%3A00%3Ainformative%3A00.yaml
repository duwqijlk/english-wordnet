simpleMeaning: showing something that was hidden, without meaning to do so
scope: 'Also called telling: showing something hidden without meaning to, not designed to show the body.'
examples:
- Her revealing look showed she had seen the hidden note, though she said nothing.
- The revealing mark on the water showed where the boat had gone down.
