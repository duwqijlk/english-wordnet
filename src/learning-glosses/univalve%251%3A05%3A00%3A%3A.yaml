simpleMeaning: With a head that bears eyes on stalks and a flat strong foot, this group of soft-bodied
  animals usually has one coiled shell.
scope: This group of soft-bodied animals is also called gastropod, and it usually has one coiled shell
  and a flat strong foot.
examples:
- The univalve crept along on its flat strong foot.
- The univalve's head had eyes on stalks.
