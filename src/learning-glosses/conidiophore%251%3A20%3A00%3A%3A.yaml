simpleMeaning: A special thread-like part of a fungus that makes tiny seed-like spores.
scope: A thread-like part of a fungus that makes spores, not the main body of the fungus and not the spores
  themselves.
examples:
- The conidiophore rises from the mould to release spores.
- Under the lens, each conidiophore bore a cluster of spores.
