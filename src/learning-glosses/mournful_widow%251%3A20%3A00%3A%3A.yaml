simpleMeaning: A one-year plant of the Old World with sweet-smelling flower heads from purple to deep
  red, now growing wild in the United States.
scope: Also called pincushion flower; a one-year plant of the Old World with sweet-smelling purple to
  deep red flower heads, now growing wild in the United States, not a rose and not a daisy.
examples:
- The mournful widow bloomed purple in the garden.
- Mournful widow grows wild along the roadside now.
