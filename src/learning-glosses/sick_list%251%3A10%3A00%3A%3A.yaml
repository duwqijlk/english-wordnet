synsetId: 06507815-n
simpleMeaning: the names of people who are ill, kept as a record, for example on a ship or in a group
  of soldiers
scope: A record of ill people, for example in a ship's crew or a group of soldiers; not a list of the
  dead, and not a hospital ward.
examples:
- The captain checked the sick list before the ship sailed.
- Three men were put on the sick list after the fever spread.
