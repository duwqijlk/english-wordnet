simpleMeaning: a measure of body weight equal to 14 pounds, used to say how heavy a person is
scope: This is a unit for weighing a person, 14 pounds, not the pit inside fruit, not a gemstone, and
  not a lump of rock.
examples:
- He weighs nearly eighteen stone.
- She told the doctor she had lost two stone since spring.
