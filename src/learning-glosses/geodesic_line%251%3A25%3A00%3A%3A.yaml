simpleMeaning: In maths, the way that joins two points by the least distance on a surface worked out by
  rule, straight across a flat face or curving round a ball.
scope: Also called a geodesic, this maths term names the shortest way between two points on a surface
  worked out by rule, whether straight across a flat face or curving round a ball.
examples:
- The geodesic line on the globe was the shortest way between the two towns.
- On a flat map the geodesic line runs straight, but on a ball it curves.
