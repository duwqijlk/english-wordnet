simpleMeaning: A rule of sounds that links the sounds of German with the sounds in other Indo-European
  languages.
scope: It covers German consonants and how they match the consonants in other Indo-European languages.
examples:
- Grimm's law links the sounds of German with the sounds in other Indo-European languages.
- We used Grimm's law to see how the German sounds match the sounds in other languages.
