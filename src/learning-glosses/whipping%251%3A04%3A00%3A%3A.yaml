simpleMeaning: hitting a person again and again with a long thin strip of leather, a strap or a rope,
  to punish them
scope: 'Also called lashing: hitting a person again and again to punish them, not the sewing stitch sense
  that goes over the edge of cloth.'
examples:
- The prisoner was given a whipping for trying to run away.
- In the story, the boy gets a whipping with a strap.
