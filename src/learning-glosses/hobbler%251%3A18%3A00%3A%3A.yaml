simpleMeaning: A person who walks with a slow uneven step because of a limp
scope: A person who walks with a limp, also called a limper, not someone who walks with a smooth step
  and not a person with a stiff leg from injury.
examples:
- The old hobbler crossed the street slowly.
- After the fall, he became a hobbler.
