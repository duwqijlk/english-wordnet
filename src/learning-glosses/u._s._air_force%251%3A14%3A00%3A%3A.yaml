simpleMeaning: The flying arm of the United States of America, the arm that guards the United States by
  holding the skies and space.
scope: The flying arm of the United States of America, also called Air Force, United States Air Force,
  US Air Force and USAF, not the army, not the navy, and not the flying arm of another land.
examples:
- He joined the U. S. Air Force in 1980.
- The U. S. Air Force guards the skies.
