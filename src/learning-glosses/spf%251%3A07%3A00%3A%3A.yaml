simpleMeaning: How much a sunscreen keeps the skin safe from the straight rays of the sun.
scope: 'Also called sun protection factor: how much a sunscreen keeps the skin safe from the straight
  rays of the sun, not the sunscreen itself and not a measure of heat.'
examples:
- Check the SPF on the bottle before you buy it.
- A high SPF keeps your skin safe in strong sun.
