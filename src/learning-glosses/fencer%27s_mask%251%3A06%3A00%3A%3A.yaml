simpleMeaning: a cover of fine net worn over the face by someone who fights with a sword
scope: 'Also called a fencing mask: a cover of fine net worn over the face by a sword fighter, not a cover
  worn to keep out dust and not a cover worn by a doctor.'
examples:
- He put on his fencer's mask before the bout began.
- The fencer's mask kept the tip of the blade from her face.
