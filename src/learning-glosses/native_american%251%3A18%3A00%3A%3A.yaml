simpleMeaning: This person belongs to one of the peoples who lived in North or South America before the
  Europeans arrived.
scope: 'Another name for this sense is Amerindian: a member of one of the peoples who lived in North or
  South America before the Europeans came, not a person who came later from Europe.'
examples:
- He is a Native American, a member of one of the peoples who lived here before the Europeans arrived.
- The Native American elder told stories of her people.
