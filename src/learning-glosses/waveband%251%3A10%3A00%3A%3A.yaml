simpleMeaning: Radio or television signals are sent on one of these stretches of radio signals, each close
  to the next in pitch.
scope: Also called frequency band, it is a stretch of radio signals, each close to the next in pitch,
  set aside for sending radio or television signals.
examples:
- The station broadcasts on a waveband set aside for radio signals.
- This waveband carries television signals as well as radio.
