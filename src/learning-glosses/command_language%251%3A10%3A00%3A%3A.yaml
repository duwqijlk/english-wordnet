simpleMeaning: a way of writing orders for a computer, made of steps that call up jobs for the machine
  to do
scope: A set of orders for a computer; query language and search language are other names for this sense;
  not a full way of writing programs, and not words people speak to each other.
examples:
- The command language lets users start jobs with short orders.
- She typed a command language order to list the files.
