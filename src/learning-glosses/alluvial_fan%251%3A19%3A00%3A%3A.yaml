simpleMeaning: A wide-spreading pile left where a fast stream slows and spreads out.
scope: A wide-spreading pile left where a fast stream slows and spreads out, also called alluvial cone;
  not a river delta and not a sandbar.
examples:
- An alluvial fan spread at the foot of the hill.
- The alluvial fan formed where the stream left the gorge.
