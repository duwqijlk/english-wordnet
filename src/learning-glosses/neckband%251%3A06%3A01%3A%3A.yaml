simpleMeaning: A band of jewellery that hugs a woman's neck.
scope: Also called a collar, a choker, or a dog collar, a band of jewellery that hugs a woman's neck,
  not a band of cloth that fits around the neck and is usually folded over.
examples:
- She wore a neckband of pearls to the party.
- The neckband sat tight against her throat.
