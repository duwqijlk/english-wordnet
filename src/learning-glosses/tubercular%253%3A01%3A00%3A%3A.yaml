simpleMeaning: Of the lung disease, or of those who have it.
scope: Of the lung disease, or of those who have it; not made up of, or sick with, or caused by the lung
  disease or its germ, nor marked by the sores of the lung disease, nor of a normal bump or knob on a
  bone, nor a person with the lung disease in the chest.
examples:
- Their ward was tubercular and quiet.
- The case was tubercular in kind.
