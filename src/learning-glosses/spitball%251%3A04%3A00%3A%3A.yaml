simpleMeaning: a throw in baseball that breaks the rules, because the pitcher first puts spit or Vaseline
  (a thick, greasy jelly) on the ball
scope: This is a throw in baseball that breaks the rules; it is not a small ball of chewed paper that
  someone throws.
examples:
- The pitcher was punished for throwing a spitball.
- No one is allowed to use a spitball in the game.
