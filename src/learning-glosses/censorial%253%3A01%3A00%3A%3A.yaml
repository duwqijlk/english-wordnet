simpleMeaning: About a censor, a person who checks what is said or shown and cuts out or blocks what is
  not allowed, or about the work such a person does.
scope: About a censor or a censor's work, not about a judge and not about a critic.
examples:
- The censorial board cut three scenes from the film.
- His censorial powers let him stop the book from being sold.
