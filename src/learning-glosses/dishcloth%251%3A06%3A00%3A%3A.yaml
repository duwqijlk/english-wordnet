simpleMeaning: a cloth used for washing plates, cups and other things used for eating and cooking
scope: This cloth, also called dishrag, is used to wash plates and cups in water. It is not a cloth used
  to dry plates after they have been washed.
examples:
- She washed the plates with a dishcloth and hot, soapy water.
- He hung the wet dishcloth over the tap to dry.
