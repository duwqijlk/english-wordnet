simpleMeaning: Deep lines run down the throat of this big flat-headed whale, which strains food through
  plates in its mouth; it is found in the Atlantic and Pacific.
scope: Also called fin whale, finback and finback whale, this is the big flat-headed whale with deep lines
  down its throat, found in the Atlantic and Pacific.
examples:
- The common rorqual surfaced in the Pacific.
- A common rorqual swam through the Atlantic.
