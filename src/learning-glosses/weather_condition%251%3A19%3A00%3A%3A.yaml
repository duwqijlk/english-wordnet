simpleMeaning: How hot or cold the air is, how the wind blows, how cloudy it is, and what falls from the
  sky.
scope: How hot or cold, windy, cloudy and wet the air is; weather, conditions and atmospheric condition
  are other names for this sense, not the weather in one place only and not the climate over years.
examples:
- They were hoping for good weather conditions for the trip.
- The weather conditions were too rainy for playing in the snow.
