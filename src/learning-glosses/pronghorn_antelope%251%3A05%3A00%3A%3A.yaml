simpleMeaning: Chewing its food twice, a swift deer-like animal of the western plains bears small forked
  growths on its head.
scope: Also called prongbuck and pronghorn, this is the swift deer-like animal of the western plains,
  not a true antelope.
examples:
- A pronghorn antelope ran across the plain.
- A pronghorn antelope stood among the grass.
