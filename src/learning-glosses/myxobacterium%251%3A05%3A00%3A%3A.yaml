simpleMeaning: A single germ of the kind that lives in groups in slime of its own making, in wet earth
  or in rotting plants or animal waste.
scope: Also called gliding bacteria, slime bacteria, myxobacter, or myxobacteria, it is found in wet earth
  and in rotting plants or animal waste.
examples:
- In the wet earth, a myxobacterium gathered with others in the slime.
- The myxobacterium was found in moist soil.
