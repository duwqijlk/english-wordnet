simpleMeaning: a half-solid fat from the nuts of a palm tree, used in cooking and in making soap
scope: A half-solid fat from palm nuts, used in cooking and soap making; cohune-nut oil and cohune fat
  are other names for this sense; not a thin liquid fat, and not fat from an animal.
examples:
- Cohune oil fries the fish without smoking.
- They made soap with cohune oil.
