simpleMeaning: any lifeless thing, such as a towel, money, clothing, dishes, books or toys, that can carry
  germs from one person to another
scope: This is about objects that carry germs between people, not a car or other carrier of passengers,
  and not a means of expressing an idea.
examples:
- A shared towel can be a vehicle for infection at the gym.
- Doctors warned that toys can act as a vehicle for spreading germs among children.
