simpleMeaning: a green shrub from South America that keeps its leaves all year, with bright orange trumpet-shaped
  flowers; people grow it to look at, in gardens or in the house
scope: 'Also called fire-bush and fire bush: a shrub grown for its orange flowers, not a tree and not
  a bush grown for fruit.'
examples:
- The marmalade bush by the door is covered in bright orange flowers.
- She keeps a marmalade bush in a pot in the house.
