simpleMeaning: In Islam, a grave wrong done by a Muslim for which the Koran sets a fixed punishment.
scope: In Islam, this is a grave offence also called Hudud, not a lesser wrong dealt with by a lesser
  punishment.
examples:
- Had crime covers acts such as murder and theft under Islamic law.
- The judge said the act was a had crime, so the Koran's set punishment applied.
