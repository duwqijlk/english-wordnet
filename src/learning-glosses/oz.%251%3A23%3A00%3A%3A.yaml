simpleMeaning: 'A measure of weight: one sixteenth of a pound, which is 16 drams or 28.349 grams.'
scope: A measure of weight, one sixteenth of a pound; ounce is another name for this sense, not a measure
  of length and not a measure of liquid.
examples:
- The recipe calls for 4 oz. of butter.
- He bought 8 oz. of cheese.
