simpleMeaning: People joined in one body that try to get lawmakers or officials to act for them, most
  often by talking to them again and again
scope: People joined in one body that try to get lawmakers or officials to act for them; lobby, advocacy
  group, lobby group, pressure group, special interest, special interest group and third house are other
  names for this sense, not a political party and not a club that meets only for fun.
examples:
- The special-interest group talked to lawmakers again and again to get its way.
- A special-interest group tries to move officials to act in its favor.
