simpleMeaning: having more than one side or quality, and those sides or qualities are very different from
  each other
scope: 'Also called double, dual, treble and twofold: having very different sides or qualities at the
  same time, not three times as great and not by three times.'
examples:
- His public image is threefold, at once kind to visitors, sharp in business, and quiet in private life.
- 'The role is threefold: she must be a gentle teacher, a strict judge of work, and a calm voice in a
  crisis.'
