simpleMeaning: In the West Indies, people who follow a religious system that uses witchcraft and sorcery
scope: In the West Indies, people who follow a religious system that uses witchcraft and sorcery, with
  obeah as another name for this sense; not the belief itself, and not followers of another faith.
examples:
- The obi met in secret at night.
- Some obi in the islands still keep the old rites.
