simpleMeaning: a slightly fleshy perennial with base leaves and hairy-sticky stems, each with one flower
  head of narrow pink or lavender rays; on coastal bluffs from Oregon to southern California
scope: 'Also called beach aster and seaside daisy: a low coastal plant with one pink or lavender flower
  head per stem, not a tall garden daisy and not a sea-side shrub.'
examples:
- Erigeron glaucus grows on the coastal bluffs.
- We saw Erigeron glaucus blooming pink above the sea.
