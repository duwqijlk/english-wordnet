simpleMeaning: To get a person to take up a view, a belief, or a way of acting, even by putting pressure
  on them
scope: To get a person to take up a view, a belief, or a way of acting, even by putting pressure on them,
  not just to give them facts and leave them to choose.
examples:
- She tried to persuade her brother to lend her his car for the weekend.
- You can't persuade me to buy that ugly vase, no matter how hard you try.
