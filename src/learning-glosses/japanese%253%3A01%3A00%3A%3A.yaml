simpleMeaning: Said of things that belong to Japan, or to its people, their way of life, or their tongue.
scope: Also called Nipponese, this word is said of what belongs to Japan or its people, not the tongue
  itself and not a person from Japan.
examples:
- Japanese cars are sold all over the world.
- The Japanese Emperor spoke to the crowd.
