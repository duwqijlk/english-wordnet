simpleMeaning: to do something badly and spoil or ruin it
scope: Also called blow, fumble, spoil, fluff, bumble, botch, bungle, muff, bobble and flub. This is doing
  something so badly that it is spoiled or ruined, not just running something badly.
examples:
- He mishandled the box and broke the glass inside it.
- She mishandled the job and ruined the whole plan.
