simpleMeaning: The act of giving a person what they want, need, or hunger for
scope: The act of meeting a want, need, or hunger, not the glad feeling that follows and not the state
  of being pleased.
examples:
- The satisfaction of their demand for better services took months.
- The satisfaction of a child's hunger came first at the meal.
