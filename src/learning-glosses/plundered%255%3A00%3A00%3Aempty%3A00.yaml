simpleMeaning: emptied or cleared of all things of value in a wrong way
scope: 'Also called looted, ransacked and pillaged: a place or thing emptied in a wrong way and left with
  nothing of value, not just harmed or searched.'
examples:
- The plundered village was empty, with nothing of value left in the houses.
- They came back to a plundered house and found all their gold and tools gone.
