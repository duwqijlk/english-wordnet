simpleMeaning: Someone with inside knowledge of a firm buys or sells its shares using secret news that
  has not been made public and must stay secret
scope: Buying or selling a firm's shares on secret news from within the firm; not ordinary buying and
  selling of shares and not a leak of news with no trade.
examples:
- He was charged with insider trading after selling shares before the bad news came out.
- Insider trading is against the law because it is not fair to other buyers.
