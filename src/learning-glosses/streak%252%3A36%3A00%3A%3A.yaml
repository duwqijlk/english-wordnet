simpleMeaning: to make marks on a thing with spots or patches of a different colour, as if it had been
  stained
scope: To make marks of a different colour on a thing, not the narrow mark itself and not a sudden flash.
examples:
- Rain had streaked the window with dirt.
- She streaked her hair with gold.
