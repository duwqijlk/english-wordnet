simpleMeaning: The place where two or more lines cross
scope: The place where lines cross, also called an intersection or an intersection point; not a single
  dot or mark, and not the sharp end of a tool.
examples:
- The two roads meet at a point of intersection.
- Draw the lines and mark their point of intersection.
