simpleMeaning: not easily made excited or upset; very calm and in full control of feelings
scope: 'Also called unflappable: a person stays very calm and is not easily upset; it does not mean that
  he feels nothing or cares about nothing.'
examples:
- She stayed imperturbable even when the bad news came.
- His imperturbable manner helped everyone stay calm when things went wrong.
