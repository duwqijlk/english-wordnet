simpleMeaning: funny in a rude, unkind way, sometimes saying the opposite of what you mean, showing you
  think little of someone and laughing at them
scope: This describes words or humour that is funny but mean and rude, also called sardonic; it is not
  kind joking and not straight, serious praise.
examples:
- She gave a snarky reply that made fun of his question.
- His snarky comments about the new teacher upset the class.
