simpleMeaning: a chip store that programs fill and empty while the machine runs; it hands back any bit
  in any order, and reaching one place is no slower than reaching another
scope: Also called random-access memory, random access memory, and random memory; the short-term working
  store of a computer, not the disk that keeps files when the machine is off.
examples:
- The read/write memory holds the data the program is working on.
- More read/write memory lets the computer run bigger programs.
