simpleMeaning: A plant of the desert in southern California, with blue or purple tube-shaped flowers in
  bunches at the ends of its stems.
scope: Also called whitlavia, California bluebell, and Phacelia minor; a desert plant of southern California,
  set apart from other desert plants by its tube-shaped blue or purple flowers.
examples:
- Phacelia whitlavia covered the slope in blue.
- The Phacelia whitlavia opened its flowers after the rain.
