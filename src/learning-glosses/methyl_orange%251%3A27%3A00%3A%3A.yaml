simpleMeaning: a dye built round two linked nitrogen atoms, changing colour to show whether a liquid is
  an acid or a base, used when weak bases are measured drop by drop
scope: Among dyes that change colour, this one is used when weak bases are measured drop by drop.
examples:
- A few drops of methyl orange showed the liquid was a base.
- Methyl orange turns colour when the acid meets a weak base.
