simpleMeaning: Nests of clay shaped like the thing they are named for are built by small brownish creatures
  of South America.
scope: These small brownish creatures of South America build nests of clay shaped like the thing they
  are named for, unlike the American warbler, which builds a dome-shaped nest on the ground.
examples:
- An ovenbird builds its nest out of clay.
- The ovenbird lives in South America.
