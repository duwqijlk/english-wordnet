simpleMeaning: A fern whose leafy parts are greyish and rough with small scales below, growing on rocks
  or tree trunks in the Americas and South Africa.
scope: This fern is also called gray polypody and resurrection fern; it grows on rocks or tree trunks,
  not in the ground.
examples:
- The grey polypody clung to the rock face with its greyish fronds.
- We found a grey polypody growing on an old tree trunk in the woods.
