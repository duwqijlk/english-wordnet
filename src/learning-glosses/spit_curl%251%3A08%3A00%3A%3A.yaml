simpleMeaning: a twist of hair pressed flat on the front of the head or the side of the face
scope: A twist of hair pressed flat on the forehead or cheek, also called a kiss curl; not a loose wave
  of hair and not a hairpiece.
examples:
- She wore a spit curl on her forehead for the party.
- The actor's spit curl stayed flat on his cheek all night.
