simpleMeaning: especially of some salts, turning liquid by taking in water from the air
scope: This is turning liquid by taking in water from the air, mostly said of certain salts; not melting
  from heat.
examples:
- The deliquescent salt turned wet in the damp air.
- Deliquescent crystals left out overnight had become a puddle by morning.
