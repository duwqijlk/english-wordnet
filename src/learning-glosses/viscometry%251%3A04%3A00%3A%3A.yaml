simpleMeaning: the measuring of how thick a liquid is
scope: The measuring of how thick a liquid is, and viscosimetry is another name for this sense; not the
  thickness itself and not weighing a liquid.
examples:
- Viscometry showed the oil was thicker than water.
- The lab used viscometry to test the paint.
