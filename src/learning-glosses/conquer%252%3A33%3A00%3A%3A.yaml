simpleMeaning: to beat someone or something in a fight or struggle and take control
scope: To beat someone or something by force or by a hard struggle and take control; this same sense is
  used in 'conquer your fears' and in 'conquer a country'. It is not just dealing with a small, easy problem.
examples:
- The army conquered the city after a long fight.
- They set out to conquer the land to the north.
