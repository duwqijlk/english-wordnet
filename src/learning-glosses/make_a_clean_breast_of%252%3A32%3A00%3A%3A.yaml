simpleMeaning: To say openly that you did something wrong or got something wrong
scope: Also called fess up and own up, this is saying openly that you did something wrong, not a denial
  and not a simple sorry.
examples:
- He made a clean breast of the theft and told the police what he had done.
- She made a clean breast of her mistake to her boss.
