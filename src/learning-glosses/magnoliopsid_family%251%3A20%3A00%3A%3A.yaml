simpleMeaning: A group of flowering plants whose seeds hold two first leaves, which most often show when
  the seed starts to grow
scope: A group of flowering plants whose seeds hold two first leaves, which most often show when the seed
  starts to grow, not a group with one first leaf and not a group of flowerless plants; dicot family is
  another name for this sense.
examples:
- Roses belong to the magnoliopsid family, with two first leaves in the seed.
- The magnoliopsid family covers most of the flowering plants in the garden.
