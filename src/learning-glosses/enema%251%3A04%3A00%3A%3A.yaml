synsetId: 00697197-n
simpleMeaning: liquid put into the body through the anus to help a person pass waste from the bowels;
  sometimes used to help doctors find out what is wrong
scope: Also called clyster. This is liquid put in through the anus to empty the bowels or to help a check,
  not a liquid you drink and not a shot into a vein.
examples:
- The nurse gave him an enema before the test.
- She was given an enema to empty her bowels before the operation.
