simpleMeaning: A hand-held tool with a flat face for smoothing and finishing plaster, cement, or stucco.
scope: A flat-faced hand tool for smoothing plaster or cement, also called a plasterer's float, not an
  object that stays on the water's surface, a parade platform, or a sweet iced drink.
examples:
- The plasterer ran the float over the wall to level the fresh coat.
- She cleaned the float after smoothing the cement patch.
