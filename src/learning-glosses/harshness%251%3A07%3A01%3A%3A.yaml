simpleMeaning: how rough and hard to bear something is when you feel it, hear it, see it, taste it, or
  smell it
scope: 'Also called roughness: how rough and hard to bear a thing is for the senses; not the roughness
  of a thing that scrapes skin, and not being cruel to people.'
examples:
- The harshness of the bright light hurt her eyes.
- I noticed the harshness in the sound of the old radio.
