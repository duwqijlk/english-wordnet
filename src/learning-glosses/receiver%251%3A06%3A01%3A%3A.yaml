simpleMeaning: a small part you put in or on your ear that changes electrical signals into sound you can
  hear
scope: This is the ear part of a phone or a similar device, not the court-chosen person in law, not a
  whole radio or TV set, and not a person who gets something.
examples:
- He held the receiver to his ear to hear her voice.
- The receiver was broken, so no sound came through it.
