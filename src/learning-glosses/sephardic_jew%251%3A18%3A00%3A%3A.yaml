simpleMeaning: A member of the Hebrew people whose family comes from Spain, Portugal, or North Africa.
scope: A person of the Hebrew people of Spanish, Portuguese or North African descent, also called Sephardi,
  not a Jew of other descent.
examples:
- The Sephardic Jew kept the old customs.
- She is a Sephardic Jew from Portugal.
