senseId: 'clink%1:06:00::'
synsetId: 03597432-n
simpleMeaning: A building run by the government where people accused of a crime are locked up while they
  wait for their trial, or while they serve their sentence.
scope: Slang for a prison, another name for jail; not the short ringing sound of metal or glass, nor the
  verb meaning to make that sound.
examples:
- He spent two nights in the clink for disorderly conduct.
- The old clink on the hill has been turned into a museum.
