simpleMeaning: A sign fixed to the front and back of a car showing the car's registration number
scope: Numberplate is another name for this sign fixed to the front and back of a car showing its registration
  number; it is not a maker's badge and not a parking permit.
examples:
- The license plate was hard to read in the dark.
- He noted down the license plate of the speeding car.
