simpleMeaning: a sickness spread by a virus in plants like tomatoes, potatoes and tobacco, that marks
  the leaves with spots and often makes them dry up and curl
scope: A plant sickness that marks the leaves, not a picture made of small pieces and not a pattern.
examples:
- Mosaic struck the tomato plants, and their leaves turned spotty.
- The tobacco crop was hit by mosaic, and the leaves shrivelled.
