senseId: 'haematoidin%1:27:00::'
synsetId: 14780548-n
simpleMeaning: Too much of this orange-yellow colouring stuff in the blood turns the skin yellow, as in
  jaundice; bile holds it, made when blood's red colouring breaks down.
scope: People also call this colouring stuff bilirubin and hematoidin, and it sits in bile rather than
  being the bile itself.
examples:
- Haematoidin gives bile its orange-yellow tint.
- Too much haematoidin in the blood turns the skin yellow.
