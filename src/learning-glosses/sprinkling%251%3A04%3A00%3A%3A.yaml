simpleMeaning: the rare act of putting drops of water on a person in baptism (a church act that welcomes
  a person into the Christian faith)
scope: This is the rare church act of putting drops of water on a person in baptism, not throwing water
  about at other times and not a light rain shower.
examples:
- The priest chose sprinkling for the baby's baptism instead of putting her fully under water.
- In that church, baptism by sprinkling is a rare practice.
