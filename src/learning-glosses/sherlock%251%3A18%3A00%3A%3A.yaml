simpleMeaning: a person hired to find out facts and help the police look into a crime
scope: A hired person who finds out facts and helps look into crimes, also called an operative, a private
  detective, a private eye, a private investigator and a shamus; not a police officer and not a lawyer.
examples:
- The family hired a sherlock to find the missing papers.
- The sherlock followed the man and wrote down all he did.
