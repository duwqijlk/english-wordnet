simpleMeaning: Small red marks with white middles on the skin inside the mouth and on the tongue; a sign
  of measles that shows one or two days before the measles rash
scope: These are the small red marks inside the mouth that come a day or two before the measles rash,
  not the rash itself.
examples:
- Koplik's spots appeared in her mouth.
- The doctor saw Koplik's spots and knew it was measles.
