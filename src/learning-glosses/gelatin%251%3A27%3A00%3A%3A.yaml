simpleMeaning: a substance with no colour that mixes with water and is sticky, a protein (a main part
  of living bodies) got from animal parts such as bone and skin
scope: 'Also called gelatine: the clear sticky substance itself, not the sweet jelly food made with it
  and not the thin sheet put over stage lights.'
examples:
- Gelatin is made by boiling animal bones.
- She added gelatin to the soup to make it thick.
