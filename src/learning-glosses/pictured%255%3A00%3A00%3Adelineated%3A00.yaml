simpleMeaning: shown in a drawing, in a plan or pattern, or in lines
scope: This means shown in a drawing, in a plan or pattern, or in lines, not a picture you only think
  of in your mind and not something described in words.
examples:
- The animals pictured in the book look very real.
- The house pictured on the cover has a red door.
