simpleMeaning: A shop takes this, usually stiff plastic, as proof the buyer can pay, and the firm behind
  it makes sure the shop is paid for the goods.
scope: 'Also called plastic and charge plate: a card that promises payment to a seller, not cash and not
  a card used only to take money out.'
examples:
- She paid with her charge card at the till.
- The shop takes my charge card, so I need no cash.
