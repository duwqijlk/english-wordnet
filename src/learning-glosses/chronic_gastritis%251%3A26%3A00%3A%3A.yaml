simpleMeaning: A stomach ulcer, a harmful lack of red blood cells, stomach cancer, or other ills can all
  show themselves as this lasting sore stomach lining
scope: A lasting sore stomach lining, not a short bout of stomach pain and not an ulcer itself.
examples:
- Chronic gastritis can go on for a long time.
- The doctor said chronic gastritis might point to an ulcer.
