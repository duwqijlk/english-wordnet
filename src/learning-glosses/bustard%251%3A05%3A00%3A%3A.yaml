simpleMeaning: A big, heavy game bird that spends most of its time on the ground but can fly fast and
  powerfully; grouped with wading birds, it lives on grassy plains.
scope: The heavy, ground-dwelling game bird of grassy plains; although grouped with wading birds, it is
  not a waterbird, and it is not a pheasant.
examples:
- A bustard strode across the steppe, then rose heavily into the air.
- Great bustards are among the heaviest birds capable of flight.
