simpleMeaning: A loaf made from wheat ground very fine, using flour that has most often been treated to
  make it white
scope: A loaf made with finely ground wheat flour that is usually bleached white, not a wholemeal loaf
  and not a dark loaf.
examples:
- She baked a light bread for Sunday lunch.
- Light bread is soft and white inside.
