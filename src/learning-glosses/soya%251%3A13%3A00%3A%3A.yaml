simpleMeaning: The fruit of the soybean plant, eaten in many foods and given to farm animals, especially
  as a stand-in for meat, comes from the vegetable richest in protein known.
scope: Also called a soybean, soy, or a soya bean, it is the fruit of the soybean plant, eaten in many
  foods and fed to animals.
examples:
- Soya is used in many foods, from milk to sauces.
- Farmers grow soya to feed their animals.
