simpleMeaning: To order a person charged with a crime to be held until the case against them is settled.
scope: To order a person charged with a crime to be held until the case is settled; not to free a person
  and not to pass sentence.
examples:
- The judge decided to bind over the defendant for trial.
- He was bound over until the hearing.
