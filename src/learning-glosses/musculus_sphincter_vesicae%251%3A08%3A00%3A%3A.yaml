simpleMeaning: A ring of muscle in the bladder that opens and closes, made of a thick layer of bladder
  muscle round the opening to the tube that carries urine out.
scope: Also called bladder sphincter, it is a ring of muscle in the bladder that opens and closes.
examples:
- The musculus sphincter vesicae holds urine in the bladder.
- When the musculus sphincter vesicae relaxes, urine can flow out.
