simpleMeaning: A spine that sags down more than it should, a thing seen most in horses
scope: Also called dipped, swayback and swaybacked, this is a spine that sags down more than it should,
  not a back that is straight and not a short-term ache.
examples:
- The old mare was lordotic, her back dipping low.
- The vet noted that the horse had become lordotic with age.
