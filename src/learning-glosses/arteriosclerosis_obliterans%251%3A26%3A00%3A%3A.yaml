simpleMeaning: a stage in the hardening of the arteries when blood vessels close up
scope: A stage in the hardening of the arteries when blood vessels close up, not the hardening itself
  and not a blockage by a clot.
examples:
- His arteriosclerosis obliterans had closed off the blood vessels in his leg.
- Arteriosclerosis obliterans can stop blood from reaching the feet.
