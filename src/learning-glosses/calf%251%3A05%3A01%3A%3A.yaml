simpleMeaning: A young whale, giraffe, elephant, buffalo or other large placental mammal (an animal whose
  young grow inside the mother before they are born)
scope: This is a young whale, giraffe, elephant, buffalo or other large animal of this kind; not the sense
  for a young cow on its own, and not the back part of your lower leg.
examples:
- The whale calf stayed close to its mother.
- A giraffe calf can stand soon after it is born.
