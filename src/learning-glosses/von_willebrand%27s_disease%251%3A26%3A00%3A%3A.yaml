simpleMeaning: A form of hemophilia found by Erik von Willebrand, passed down through a gene from both
  parents, marked by too little blood-clotting factor and bleeding from wet body linings.
scope: Also called angiohemophilia and vascular hemophilia; a form of hemophilia passed down in families,
  not a disease caught from others and not a short illness.
examples:
- Von Willebrand's disease runs in her family.
- People with von Willebrand's disease may bleed from the nose.
