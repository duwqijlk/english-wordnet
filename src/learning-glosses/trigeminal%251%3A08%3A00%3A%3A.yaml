simpleMeaning: The main feeling nerve of the face, which also moves the chewing muscles
scope: The main feeling nerve of the face, which also moves the chewing muscles; fifth cranial nerve,
  nervus trigeminus, trigeminal nerve and trigeminus are other names for this sense, not a nerve of the
  eye only and not a nerve of the ear.
examples:
- The trigeminal carries feeling from the face to the brain.
- Damage to the trigeminal can cause sharp face pain.
