simpleMeaning: saying that things which are not human have human feelings, such as lifeless things, animals,
  or the forces of nature
scope: Giving human feelings to things that are not human, not giving them a human shape and not real
  feelings felt by animals.
examples:
- Moreover, when hate is attributed to God in scriptural translations, it is most likely an anthropopathism.
- Saying the storm was angry at the village is an anthropopathism.
