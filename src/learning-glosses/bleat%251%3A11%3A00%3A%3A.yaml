simpleMeaning: The cry of a sheep or a goat, or any sound like it.
scope: The cry of a sheep or a goat, or a sound like it, not the cry of another farm animal.
examples:
- We heard the bleat of a goat from the field.
- The lamb gave a soft bleat when its mother came near.
