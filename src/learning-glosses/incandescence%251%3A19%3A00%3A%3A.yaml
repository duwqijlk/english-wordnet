simpleMeaning: The shine a thing gives off as it grows hot.
scope: This sense is also called glow, for the shine a thing gives off as it grows hot, where glow is
  light an object gives off once it becomes very hot.
examples:
- Incandescence is the shine a hot thing gives off.
- Incandescence grows as the thing grows hot.
