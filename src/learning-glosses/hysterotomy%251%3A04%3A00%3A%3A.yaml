senseId: 'hysterotomy%1:04:00::'
synsetId: 00678542-n
simpleMeaning: A cut made into the womb by a doctor in an operation, as when a baby is born by a cut in
  the womb
scope: A cut into the womb made in an operation, not a cut into the belly wall alone and not a birth without
  a cut.
examples:
- The surgeon performed a hysterotomy to reach the baby.
- A hysterotomy was needed when the baby could not be born in the usual way.
