simpleMeaning: Any of several plants of the group called Althaea, like the plants of the group called
  Alcea but with smaller flowers.
scope: 'Also called althaea or althea: any of several plants of the group called Althaea, like the plants
  of the group called Alcea but with smaller flowers, not the tall plants of the group called Alcea, from
  the Middle East but now found in many places, grown for their very large flowers of many colours.'
examples:
- Hollyhocks lined the cottage garden wall.
- The hollyhock by the gate had pink flowers smaller than its tall neighbour.
