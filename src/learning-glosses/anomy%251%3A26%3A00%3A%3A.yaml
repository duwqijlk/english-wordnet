senseId: 'anomy%1:26:00::'
synsetId: 14439302-n
simpleMeaning: feeling cut off and worried because there are no shared rules or limits to guide how people
  live
scope: A lonely, anxious feeling that comes when a society's rules break down; anomie is another name
  for this sense, not simple shyness and not a fear of other people.
examples:
- After the war, many felt anomy as the old rules of their town fell away.
- The town's anomy grew as its old rules lost their hold and people no longer knew what was expected of
  them.
