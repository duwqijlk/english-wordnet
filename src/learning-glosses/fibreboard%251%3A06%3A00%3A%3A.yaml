simpleMeaning: Wood chips and shavings are pressed tight with glue into stiff flat sheets that cover walls.
scope: Also called fiberboard and particle board, this is a stiff sheet of pressed wood chips used to
  cover walls, not solid wood and not cardboard.
examples:
- The cupboard back was made of thin fibreboard.
- Fibreboard sheets covered the wall behind the shelves.
