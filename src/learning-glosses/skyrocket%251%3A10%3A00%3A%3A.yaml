simpleMeaning: a rocket that carries a bright light up into the sky, or fires a rope that can save a life,
  or a harpoon
scope: 'Also called a rocket: a firework that sends bright light high into the sky, not a display of fireworks
  and not the verb for prices shooting up.'
examples:
- They set off a skyrocket over the harbour.
- The crew fired a skyrocket to carry the line to the ship.
