simpleMeaning: To push a person on, most of all with loud cheers and shouts
scope: 'Also called cheer, urge, inspire, barrack or exhort: to push a person on, most of all with loud
  cheers and shouts, not to push a thing forward and not to shout for joy.'
examples:
- The crowd tried to pep up the strikers with cheers and shouts.
- Her friends pepped her up before the big game.
