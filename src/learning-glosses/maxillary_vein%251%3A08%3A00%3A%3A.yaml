simpleMeaning: the back part of a web of veins near the jaw, joining a vein by the temple to form the
  vein behind the jaw
scope: 'Also called vena maxillaris: a vein near the jaw, not an artery and not a vein in the neck.'
examples:
- The maxillary vein joins a vein by the temple.
- The surgeon traced the maxillary vein behind the jaw.
