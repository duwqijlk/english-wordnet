schema: oewn-learning-gloss-v2
senseId: 'imaginary_place%1:09:00::'
synsetId: 05633662-n
simpleMeaning: Somewhere that is real only in thought, talked of in stories or holy books as if it were
  real
scope: Somewhere real only in thought, also called a fictitious place and a mythical place; not a real
  place on a map and not a place in a dream.
examples:
- The children drew a map of the imaginary place from their favourite book.
- In the story, the hero travels to an imaginary place that no one can find on a map.
