simpleMeaning: Now grown wild, above all in the east of North America, this sweet-smelling European mint
  bears bunches of small violet-and-white blooms.
scope: It is also called basil balm and basil thyme, and among the mints of Europe it is the sweet-smelling
  one with bunches of small violet-and-white blooms, now grown wild in the east of North America.
examples:
- The mother of thyme smells sweet.
- Mother of thyme grows wild in the east of North America.
