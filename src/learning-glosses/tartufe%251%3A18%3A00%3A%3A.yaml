simpleMeaning: A person who fakes being holy, named for the main man in a play by Moliere.
scope: This is a person who fakes being holy, named for the main man in a play by Moliere; Tartuffe is
  another name for it, not a truly holy person and not an actor playing the part.
examples:
- He was a Tartufe, all show of piety and no real faith.
- The Tartufe in the story fakes being holy.
