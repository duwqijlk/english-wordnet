simpleMeaning: In criminal law, a court's final decision that a person is guilty of a crime, and the punishment
  the court gives
scope: In criminal law, this is a court's final guilty decision and its punishment, also called sentence
  and another name for it is conviction; it is not strong disapproval, and not taking land for public
  use.
examples:
- His condemnation for the crime ended with a long time in prison.
- After her condemnation, the court ordered her to pay a heavy fine.
