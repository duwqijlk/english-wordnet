simpleMeaning: when people meet or part in the early hours of the night, they say these set words to wish
  the other person well
scope: 'Also called evening: set words said when meeting or leaving someone in the early hours of the
  night, not the time of day itself and not an afternoon greeting.'
examples:
- They said good evening as they sat down to dinner.
- He wished her good evening and held the door open.
