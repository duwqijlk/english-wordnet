scope: 'Also called mangonel and traction trebuchet: a throwing machine worked by people pulling ropes,
  not a machine worked by a spring and not a gun.'
examples:
- The soldiers used a bricole to throw stones over the castle wall.
- Men pulled the ropes of the bricole to launch the heavy stone.
