simpleMeaning: In French cooking, a skilful way of making food, done with great care and fine detail.
scope: A fine French way of making food, not plain home cooking and not food cooked fast for sale.
examples:
- The chef trained in haute cuisine in Paris.
- Her haute cuisine takes hours to prepare and looks like art on the plate.
