scope: 'Also called gorgonian coral: corals with a branching skeleton that is hard like horn or made of
  lime, not a soft coral and not a reef-building stony coral.'
examples:
- The gorgonian swayed in the warm sea current.
- Gorgonians form branching skeletons of horn or lime.
