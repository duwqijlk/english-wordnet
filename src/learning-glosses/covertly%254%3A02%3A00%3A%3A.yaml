simpleMeaning: in a secret way that hides what you are doing from other people
scope: This describes doing something in a hidden, secret way. It is not doing something openly, and not
  just doing it quietly.
examples:
- He covertly took a photo of the letter.
- They met covertly at night so no one would see them.
