simpleMeaning: A weak drug used to treat HIV by slowing down a chemical in the body that the virus needs
  to grow
scope: This is a weak drug used to treat HIV by slowing down a chemical the virus needs to grow; saquinavir
  is another name for this sense, and it is weaker than other drugs of the same kind.
examples:
- Her doctor added Invirase to the drugs she took for HIV.
- The clinic gave him Invirase as part of his HIV treatment.
