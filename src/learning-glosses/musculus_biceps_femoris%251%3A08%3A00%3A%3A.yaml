simpleMeaning: The knee bends and the leg turns outward when this thigh muscle works.
scope: Femoral biceps is another name for this thigh muscle, which bends the knee and turns the leg outward.
examples:
- The musculus biceps femoris worked as the knee bent.
- The musculus biceps femoris turns the leg outward when it works.
