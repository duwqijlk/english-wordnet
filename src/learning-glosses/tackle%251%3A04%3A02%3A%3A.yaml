simpleMeaning: In American football, a place on the front line where play starts, typically across from
  one of the guards (front-line players on the team with the ball)
scope: This is a place on the football line, not the act of bringing a player down and not the person
  who plays in that place.
examples:
- The coach moved him to tackle on the line.
- She lined up at tackle, across from the guard.
