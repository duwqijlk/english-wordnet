senseId: 'sceptically%4:02:00::'
synsetId: 00448486-r
simpleMeaning: in a way that shows doubt and does not take a thing as true too fast
scope: This way of acting with doubt, also called skeptically, is not believing a claim at once and not
  refusing to believe it for all time.
examples:
- She looked at him sceptically and asked for proof.
- He listened sceptically to the man's big claim.
