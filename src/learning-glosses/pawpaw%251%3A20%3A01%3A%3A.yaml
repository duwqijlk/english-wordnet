simpleMeaning: A small tree of the eastern United States, with long leaves and fleshy fruit.
scope: A small tree of the eastern United States, with long leaves and fleshy fruit, not the tropical
  American shrub or small tree with huge, deeply cut leaves and large yellow fruit, and not the fruit
  with yellow flesh, related to custard apples.
examples:
- A pawpaw grew beside the creek, its fruit ripe in the autumn.
- They planted a pawpaw in the garden for its shade and fruit.
