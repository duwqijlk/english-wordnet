senseId: 'doubt%1:07:00::'
synsetId: 04764777-n
simpleMeaning: a feeling of not being sure whether something is true, is a fact, or really exists.
scope: This is not a question asked to get information, and not simple lack of knowledge about a subject;
  it is the state of being unsure whether something is true or real.
examples:
- There is some doubt about whether the letter was ever sent.
- She had no doubt that he was telling the truth.
