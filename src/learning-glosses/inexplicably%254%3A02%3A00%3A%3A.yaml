simpleMeaning: in a way that is different from what is usual or expected
scope: 'Also called curiously and oddly: in a way that differs from what is usual or expected, not in
  a way that cannot be understood.'
examples:
- Inexplicably, he spoke with a husky voice.
- She behaved inexplicably that evening, quite unlike herself.
