simpleMeaning: people sharing thoughts and feelings with each other in talk, above all opinions, attitudes
  and other such things
scope: This is people sharing thoughts and feelings in talk, above all opinions and attitudes; not buying
  and selling and not a single talk.
examples:
- Their commerce of ideas lasted late into the night.
- There was much commerce of opinion at the meeting.
