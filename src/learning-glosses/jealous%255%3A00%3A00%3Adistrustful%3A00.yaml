simpleMeaning: thinking too much, without good reason, that a rival will take your place, or afraid that
  this will happen
scope: Fearing that a rival will take your place; not wanting very much what another person has or has
  done well.
examples:
- A jealous husband checked his wife's phone every day.
- She was jealous and feared her boyfriend would leave her for someone else.
