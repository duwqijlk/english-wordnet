senseId: 'asynchronous%3:00:00::'
synsetId: 02388163-a
simpleMeaning: not happening at the same time, and not having the same length of cycle or place in a cycle
scope: This is the general sense of not happening at the same time and not having the same length of cycle
  or place in a cycle, not the special sense about sending data without a shared clock.
examples:
- Their work hours are asynchronous, so they rarely meet at the same time.
- The two clocks run in an asynchronous way and soon show different times.
