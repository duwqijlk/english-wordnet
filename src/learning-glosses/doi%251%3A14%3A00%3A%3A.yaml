simpleMeaning: The United States government office set up in 1849 to keep nature safe and to guide the
  use of natural riches.
scope: This is the United States office that keeps nature safe and guides the use of natural riches, also
  called Interior, the Department of the Interior, and the Interior Department, not a state office or
  a parks group alone.
examples:
- The DoI guards wild land across the United States.
- The DoI was set up in 1849 to guide the use of natural riches.
