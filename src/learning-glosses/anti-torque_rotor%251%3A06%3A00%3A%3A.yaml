simpleMeaning: A rotor formed by a spinning blade on the tail of a helicopter with one main rotor; it
  stops the helicopter from turning the opposite way to the main rotor.
scope: This is the tail rotor that cancels the turning force of the main rotor, not the main rotor that
  lifts the aircraft. It is also not the torque it counteracts, which is a force rather than a part. The
  term is technical, used in helicopter engineering.
examples:
- When the anti-torque rotor failed, the helicopter spun out of control.
- Engineers fitted a quieter anti-torque rotor to the tail boom.
