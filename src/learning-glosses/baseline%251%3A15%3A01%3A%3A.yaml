simpleMeaning: the line at the back of each end of a tennis or handball court, which a server must not
  step over when serving
scope: The line at the back of each end of a tennis or handball court, which a server must not step over
  when serving; not the side line, and not the net.
examples:
- He served from behind the baseline.
- Her foot crossed the baseline and the serve was called a fault.
