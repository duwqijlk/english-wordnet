simpleMeaning: a break in something that is going on, made when it is stopped or cut short, and the break
  may be short or may last for good
scope: A break in something going on when it is stopped or cut short, also called discontinuance, and
  not a short rest that is part of the plan.
examples:
- The discontinuation of the bus service left the village cut off.
- A brief discontinuation in the talks did not stop them from reaching a deal.
