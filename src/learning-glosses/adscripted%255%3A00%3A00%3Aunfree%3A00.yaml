simpleMeaning: Said of a person tied to a piece of land, whose work passes to each new owner of the land.
scope: Said of a person tied to a piece of land, also called adscript; not a free worker who can leave
  and not a person owned outright.
examples:
- The adscripted workers stayed with the land when it changed hands.
- An adscripted serf passed with the estate to its new lord.
