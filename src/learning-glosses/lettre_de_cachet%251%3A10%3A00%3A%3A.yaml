senseId: 'lettre_de_cachet%1:10:00::'
synsetId: 06560101-n
simpleMeaning: a command once given by a French king that could put a person in prison or kill them by
  a signed note with his seal on it
scope: An order once given by a French king that could put a person in prison or to death by a signed
  letter under his seal, also called a cachet, not a court order of today and not a letter of pardon.
examples:
- The king signed a lettre de cachet to lock up his enemy.
- A lettre de cachet could send a man to prison without a trial.
