simpleMeaning: the wide end at the top of a flower stem, which holds the parts of the flower
scope: The wide top end of a flower stem that holds the flower parts, not an electrical part for a plug
  and not the whole flower.
examples:
- The receptacle under the flower holds all its parts in place.
- You can see the thick receptacle at the top of the stem.
