simpleMeaning: Black and white in colour, this big bird of Africa eats dead flesh, and soft feathers under
  its wings edge clothes.
scope: 'People also call it a marabou or a marabou stork: it is the big black-and-white bird of Africa
  that eats dead flesh.'
examples:
- A marabout fed on dead flesh.
- The marabout's wings were black and white.
