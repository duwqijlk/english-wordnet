simpleMeaning: to remind someone again and again, or to keep asking them to do something
scope: This is the act of reminding or urging someone again and again, not a person who finds fault and
  not just making small complaints again and again.
examples:
- She nagged him to book the tickets until he did it.
- He keeps nagging his son to clean his room.
