simpleMeaning: the point on a compass that lies halfway between south and east, 135 degrees round from
  north
scope: The compass mark halfway between south and east, not the direction itself and not a place in the
  southeast.
examples:
- Southeast is marked on the compass between south and east.
- On the map, southeast sits at 135 degrees, between south and east.
