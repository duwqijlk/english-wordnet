simpleMeaning: In a drawing, a sign that shows as bright light around a saint's head
scope: 'Also called aura and also called halo: a ring of bright light drawn around the head of a saint,
  not fame or great praise for doing something well.'
examples:
- In the old painting, a ring of glory shines around the saint's head.
- The artist drew glory as bright light around the holy man's head.
