simpleMeaning: The meat of a large sea fish with a long, sword-like upper jaw, usually cut into thick
  slices for eating.
scope: The flesh of the fish, usually served in thick slices, not the live fish itself, a large toothless
  sea fish with a long sword-like upper jaw that can warm its brain and eyes, found worldwide in warm
  waters, feeding on the cold ocean floor and coming to the surface at night.
examples:
- We had swordfish steaks for dinner.
- The swordfish on the menu was served with lemon and butter.
