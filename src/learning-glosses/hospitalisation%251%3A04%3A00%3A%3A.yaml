senseId: 'hospitalisation%1:04:00::'
synsetId: 00659870-n
simpleMeaning: Putting a sick person in a place where doctors and nurses look after them.
scope: The act of putting a sick person into a hospital for care; hospital care and hospitalization are
  other names for this sense, not a visit to a doctor and not treatment at home.
examples:
- After the accident, her hospitalisation lasted three weeks.
- The doctor arranged his hospitalisation for the operation.
