simpleMeaning: strong, stiff wood from the tree of this name, which lasts a long time without rotting
scope: This is the strong, stiff wood of the tree, not the tree itself and not wood that rots fast.
examples:
- The carpenter chose black locust for the fence posts because it lasts for years outdoors.
- Black locust from the yard was cut into boards for the porch.
