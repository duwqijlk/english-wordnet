simpleMeaning: Step by step, a living thing moves from a plain form to a more complex one as it grows
  on its own, in biology.
scope: It is also called growing, development, growth, maturation and ontogeny, and it is the way one
  living thing grows on its own in biology.
examples:
- An indicator of bone growth in children can show ontogenesis at work.
- Ontogenesis runs its course step by step, from a simple form to a more complex one.
