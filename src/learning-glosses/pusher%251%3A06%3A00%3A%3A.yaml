simpleMeaning: A small cart on four wheels, in which a baby or small child is pushed about.
scope: A small four-wheeled cart for pushing a baby or child about, not a sandal, not a person who pushes
  themself forward, and not someone who pushes.
examples:
- She folded the pusher and put it in the car boot.
- The baby slept in the pusher as they walked through the park.
