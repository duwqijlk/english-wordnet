simpleMeaning: a problem with speaking in which a person stops often and repeats some sounds without wanting
  to
scope: 'Also called stutter: a speaking problem where a person stops and repeats sounds, not just speaking
  slowly or being shy.'
examples:
- His stammer made the first sounds of some words hard to say.
- She has had a stammer since she was a child.
