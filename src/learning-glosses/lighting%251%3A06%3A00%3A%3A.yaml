simpleMeaning: the equipment, such as lamps, used to make the bright effects seen on a stage or in a film
scope: The lamps and equipment themselves, used for a stage or a film; not the skill of planning and setting
  them up, and not the state of a place being full of light.
examples:
- The stage lighting made the night scene look cold and blue.
- They rented extra lighting for the film shoot.
