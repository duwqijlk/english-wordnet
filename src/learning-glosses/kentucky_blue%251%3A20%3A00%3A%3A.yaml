simpleMeaning: A valuable field and pasture plant in Europe, above all in the middle United States, with
  tall stems and thin bright green leaves; a main part of lawn seed mixes.
scope: A field and pasture plant with tall stems and thin bright green leaves; also called June grass,
  Kentucky bluegrass, Kentucy blue grass, and Poa pratensis.
examples:
- Kentucky blue spreads fast across the lawn.
- We seeded the field with Kentucky blue.
