simpleMeaning: This time starts on the twenty-fourth of December and ends on the sixth of January.
scope: Also called Yule, Christmas, Christmastide, Christmastime and Noel, this is a period of days from
  the twenty-fourth of December to the sixth of January, not one single day.
examples:
- The house was full of guests all through Yuletide.
- We sang carols during Yuletide.
