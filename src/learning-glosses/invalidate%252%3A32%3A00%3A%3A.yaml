simpleMeaning: to make something no longer good for use, such as a ticket, a cheque, or a pass
scope: This is about making something no longer good for use, such as a ticket or a pass; not about showing
  that a claim is not true, and not about saying by law that something has no force.
examples:
- The clerk invalidated the ticket by stamping it.
- The company invalidated all old passes at the end of the year.
