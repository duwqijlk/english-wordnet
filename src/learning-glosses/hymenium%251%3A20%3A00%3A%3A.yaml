simpleMeaning: The spores of some fungi come from a layer of cells holding two kinds of spore cases.
scope: This is the spore-bearing layer of cells in some fungi, not the whole fungus itself.
examples:
- The hymenium bears the spores that the fungus sheds.
- A slice of the fungus showed the hymenium as a layer of small cells.
