simpleMeaning: In Greek myth, a beast with nine heads, and each head cut off grew back as two new heads.
scope: This is the many-headed beast of Greek myth, also called the Lernaean Hydra, not a one-headed beast
  or a sea snake.
examples:
- Hydra was slain by Hercules.
- Hercules cut off one head of the Hydra, and two grew in its place.
