schema: oewn-learning-gloss-v2
senseId: 'supposition%1:09:01::'
synsetId: 05787709-n
simpleMeaning: the act in the mind of thinking that something is or may be true
scope: This is the act of thinking something may be true, not the idea itself that a person holds, and
  not proof that it is true.
examples:
- She spent a long time in supposition, trying to work out who had taken the key.
- His supposition went on as he looked again at each small clue.
