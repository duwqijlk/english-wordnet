simpleMeaning: a group of words in the indicative mood, the form used to state facts, that says something
  is so
scope: This is a group of words that states a fact, also called a declaratory sentence; not a question
  and not a command.
examples:
- The declarative sentence 'The cat sat on the mat' states a fact.
- She wrote a declarative sentence to tell us the time of the meeting.
