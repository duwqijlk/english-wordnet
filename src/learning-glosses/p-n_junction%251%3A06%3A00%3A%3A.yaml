simpleMeaning: The meeting place of a p-type material and an n-type material, both of which carry electric
  current.
scope: The meeting place of a p-type and an n-type material; not a wire and not a switch.
examples:
- The p-n junction in the diode joins two kinds of material.
- Engineers test the p-n junction for faults.
