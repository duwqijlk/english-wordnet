simpleMeaning: Swelling and soreness of the pancreas, usually with pain in the belly
scope: Swelling and soreness of the pancreas, not of the heart and not a pain in the belly on its own.
examples:
- Her pancreatitis flared up after the rich meal, and her belly ached for days.
- The doctor treated his pancreatitis with rest and fluids.
