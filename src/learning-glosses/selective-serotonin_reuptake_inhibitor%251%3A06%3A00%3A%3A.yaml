simpleMeaning: More of a mood chemical stays free to reach the brain parts that take it up, because this
  drug stops the brain taking it back and lifts low mood.
scope: In medicine, this is a drug given for low mood, and it works by keeping a mood chemical free in
  the brain.
examples:
- They take a selective-serotonin reuptake inhibitor for low mood.
- A selective-serotonin reuptake inhibitor was started for low mood.
