simpleMeaning: This skilled worker is paid to make buildings and antique furniture good again, whether
  by mending them or by putting a new face on them.
scope: Also called preserver, restorer, and renovator, this skilled worker is paid to make buildings and
  antique furniture good again.
examples:
- The refinisher worked on the old table.
- A refinisher was hired to restore the building.
