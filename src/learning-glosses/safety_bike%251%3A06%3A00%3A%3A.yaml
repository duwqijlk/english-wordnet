synsetId: 04133167-n
simpleMeaning: Through a gear that turns it faster than the pedals, the pedals drive the back wheel of
  this two-wheeled cycle, whose wheels are of the same size.
scope: This two-wheeled cycle has wheels of the same size, with pedals driving the back wheel by a gear,
  and is also called a safety bicycle, not a cycle with one big wheel and one small wheel.
examples:
- He rides a safety bike every day.
- She fixed the gear on her safety bike.
