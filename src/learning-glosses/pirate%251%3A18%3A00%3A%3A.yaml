simpleMeaning: a person who robs at sea or comes from the sea to rob land, with no right given by any
  country to do so
scope: This sense is the person who robs at sea, not the ship that such people sail on.
examples:
- The pirate demanded gold from the ship's captain.
- Pirates attacked the town from their boats at night.
