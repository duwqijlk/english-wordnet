simpleMeaning: any of several palm-like plants of one group, among the smallest and greenest of that group
scope: Any of several palm-like plants of one group, among the smallest and greenest of that group; not
  a true palm and not a fern.
examples:
- The zamia in the pot is one of the smallest cycads.
- A zamia grows slowly in the shade.
