simpleMeaning: one of a small group of people who rule a country together
scope: One ruler among a small ruling group, not a single king who rules alone and not just a rich person
  with no power to rule.
examples:
- The oligarch met the other rulers to decide the new law.
- Each oligarch held power over one part of the country.
