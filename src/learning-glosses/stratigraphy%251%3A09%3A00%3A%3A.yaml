simpleMeaning: In geology, the study of how layers of rock lie in order and how they follow one after
  another
scope: The study of rock layers and their order in time, not geology as a whole and not the study of fossils.
examples:
- She studied stratigraphy to learn how old the rock layers were.
- Stratigraphy showed that the top layer was the youngest.
