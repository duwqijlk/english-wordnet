simpleMeaning: A wide flat board for covering walls or walls that divide rooms, made of plaster, wood
  pulp, or other stuff, used mostly to make the inside walls of houses.
scope: Also called dry wall or wallboard; a wide flat board for covering walls and making the inside walls
  of houses.
examples:
- They fixed drywall to the bare walls of the room.
- The drywall made the inside walls smooth and flat.
