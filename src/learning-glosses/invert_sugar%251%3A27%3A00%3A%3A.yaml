simpleMeaning: A mix of half glucose and half fructose, made by the splitting of sucrose with water, found
  by nature in fruits, and sweeter than glucose.
scope: 'In food making: a sugar from splitting sucrose, sweeter than glucose and found in fruit.'
examples:
- Invert sugar is sweeter than glucose.
- Invert sugar is found in fruits.
