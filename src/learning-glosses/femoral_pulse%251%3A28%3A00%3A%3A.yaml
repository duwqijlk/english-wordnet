senseId: 'femoral_pulse%1:28:00::'
synsetId: 15306182-n
simpleMeaning: the beat of the blood tube that runs down the upper leg, felt where the leg joins the body
scope: The beat of the artery in the upper leg felt at the groin, not the beat felt at the wrist and not
  the beat felt in the neck.
examples:
- The nurse felt the femoral pulse in the patient's groin.
- A weak femoral pulse can be a sign of poor blood flow in the leg.
