simpleMeaning: The liquid left after meat and vegetables have simmered, used as a base for things like
  soups or sauces.
scope: Another name for stock, the liquid used as a base for soups and sauces; not the thin soup served
  as a dish.
examples:
- The broth simmered on the stove all afternoon.
- The recipe calls for vegetable broth as the base of the soup.
