simpleMeaning: In the throat, behind the small piece that hangs down, a mass of lymph tissue sits on the
  back wall and top of the upper throat.
scope: This mass of lymph tissue in the throat is also called adenoid, pharyngeal tonsil, third tonsil,
  and tonsilla pharyngealis.
examples:
- Hypertrophy of the pharyngeal tonsils is called adenoids.
- The tonsilla adenoidea can grow big and block a child's breathing.
