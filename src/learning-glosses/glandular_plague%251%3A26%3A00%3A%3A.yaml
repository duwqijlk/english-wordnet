simpleMeaning: the most common form of this sickness in people, with chills, great weakness, wild confused
  talk, and swellings in the armpits and groin, not passed from person to person
scope: 'Also called bubonic plague and pestis bubonica: the most common form of this sickness in people,
  marked by chills, weakness, and swellings in the armpits and groin, not a plague that passes from person
  to person and not a lung plague.'
examples:
- Glandular plague was the most common form of plague in the old port towns.
- The doctor found the swellings of glandular plague in the patient's armpits.
