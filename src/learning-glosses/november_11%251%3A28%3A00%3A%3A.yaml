simpleMeaning: In the United States, the eleventh day of that month is a day off work by law, once called
  Armistice Day and called Veterans' Day since nineteen fifty-four.
scope: Also called Armistice Day, Veterans' Day and Veterans Day; this is a day off work by law, not a
  day of work and not any other day in the year.
examples:
- November 11 is a day off work in the United States.
- Schools close on November 11 for Veterans' Day.
