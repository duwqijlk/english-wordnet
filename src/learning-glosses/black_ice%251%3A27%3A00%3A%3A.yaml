simpleMeaning: Hard to see but very dangerous, this thin sheet of frozen water left by freezing mist covers
  roads and paths.
scope: This is a thin sheet of frozen water on a road or path, left by freezing mist, that is hard to
  see but very dangerous.
examples:
- The car slid on black ice on the road.
- She slipped on black ice on the sidewalk.
