simpleMeaning: Picked when fully grown, this olive is kept in salty water and then dried, pickled, or
  put in cans or in oil.
scope: Also called black olive, this is an olive picked when fully grown and kept in salty water, not
  an olive picked green.
examples:
- She added ripe olives to the salad.
- We bought a jar of ripe olives in oil.
