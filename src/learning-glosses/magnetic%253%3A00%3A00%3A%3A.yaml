simpleMeaning: able to pull iron or steel towards itself, as a magnet does
scope: Having the power to pull iron or steel; not fixed by the earth's fields, and not a person's power
  to draw others to them.
examples:
- The magnetic strip on the fridge holds the note in place.
- A magnetic lock keeps the gate shut.
