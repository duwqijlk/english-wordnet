simpleMeaning: the long part of an animal's head that sticks out in front, most of all its nose
scope: The long front part of an animal's head, most of all its nose, not the beak-like front part of
  an insect's head.
examples:
- The pig pushed its snout into the mud.
- The dog's wet snout sniffed the air.
