schema: oewn-learning-gloss-v2
senseId: 'rain_shadow%1:15:00::'
synsetId: 08646321-n
simpleMeaning: A dry place that gets little water from the sky because something in the way takes the
  wetness from the winds before they reach it
scope: A dry place with little water from the sky; not a desert with no water at all and not a wet valley
  that catches the wind.
examples:
- The town lies in the rain shadow of the mountains.
- Farmers in the rain shadow need wells for their crops.
