simpleMeaning: words that say things just as they are, in a plain, everyday or dull way
scope: Words that say things just as they are, in a plain, everyday or dull way, not the ordinary writing
  of a book and not lively, fresh speech.
examples:
- The letter was written in flat prose, with no warmth in it.
- Her prose bored the room, plain and dull from start to end.
