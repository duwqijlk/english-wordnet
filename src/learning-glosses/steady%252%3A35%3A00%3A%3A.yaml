senseId: 'steady%2:35:00::'
synsetId: 01222557-v
simpleMeaning: to hold something in place with a support, or as if with a support, so it does not move
  or fall
scope: 'Also called brace: to hold something in place so it does not move or fall. Not the describing
  word for a person who does not change their mind, and not making something still in a general way.'
examples:
- He steadied the ladder with one hand while she climbed.
- They steadied the shelf with a metal bar fixed to the wall.
