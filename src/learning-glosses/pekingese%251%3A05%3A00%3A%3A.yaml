simpleMeaning: A small Chinese kind of dog with short legs, a long soft shiny coat, and a wide flat face.
scope: Also called Peke and Pekinese; a small short-legged Chinese dog, set apart from long-legged dogs
  by its flat face and its long soft coat.
examples:
- The Pekingese slept in a basket by the fire.
- A Pekingese with a flat face won best in show.
