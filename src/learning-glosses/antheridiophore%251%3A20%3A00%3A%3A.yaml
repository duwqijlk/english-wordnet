simpleMeaning: A stalk that carries the parts that make male sex cells, as in some mosses and liverworts
scope: A stalk that carries the parts that make male sex cells, as in some mosses and liverworts, not
  a stalk that carries female parts and not the whole moss plant.
examples:
- The antheridiophore rose above the moss leaves.
- An antheridiophore carries the male parts of the moss.
