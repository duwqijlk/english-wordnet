simpleMeaning: a building where people can watch plays or films
scope: Also called house and theater. This sense is the building where plays or films are shown, not the
  plays themselves and not the art of acting or writing plays.
examples:
- We went to the theatre on Saturday to watch a new play.
- The old theatre in the town centre can hold five hundred people for a film.
