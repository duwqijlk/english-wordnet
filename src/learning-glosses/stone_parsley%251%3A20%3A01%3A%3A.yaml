simpleMeaning: A slim roadside herb of west Europe and the lands round the middle sea, with leaves like
  parsley and white blooms with sweet-smelling seeds.
scope: This sense is a slim roadside herb of west Europe and the lands round the middle sea, with leaves
  like parsley and white blooms with sweet-smelling seeds, unlike the sense for any plant of the genus
  Seseli with thick heads of small white or pink flowers and finely cut leaves.
examples:
- Stone parsley grew by the road.
- A stone parsley bore white blooms.
