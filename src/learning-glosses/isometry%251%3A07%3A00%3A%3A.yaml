simpleMeaning: Two things that measure the same, such as two places at the same height above the sea,
  two sounds just as loud, and more like them
scope: Two things that measure the same, not a way of matching one set of points to another that keeps
  every distance the same.
examples:
- The two towers show isometry in height.
- The isometry of the two sounds surprised the listeners.
