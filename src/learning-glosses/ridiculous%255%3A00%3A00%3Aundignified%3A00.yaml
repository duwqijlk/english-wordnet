simpleMeaning: making people feel scorn and pity at the same time
scope: Also called silly, this is making people feel scorn and pity at the same time, not wildly funny
  like a stage play and not so silly that people laugh at it in scorn.
examples:
- His ridiculous attempts to impress her only made people feel sorry for him.
- She looked ridiculous standing alone in her best dress, waiting for no one.
