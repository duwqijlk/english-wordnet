simpleMeaning: a body heat that rises and falls with the heat of the place around them, in animals other
  than birds and mammals
scope: 'Also called heterothermic, poikilothermic and poikilothermous: a body heat that rises and falls
  with the heat of the place around them, in animals other than birds and mammals, not a body heat kept
  steady inside the body.'
examples:
- Snakes are ectothermic, so they warm up by lying in the sun.
- An ectothermic lizard slows down when the air turns cold.
