simpleMeaning: a small flat round piece of sticky stuff, used to close a letter
scope: This is a small sticky round piece used to close a letter, not the thin cake or cookie you eat
  and not the thin bread used in a church service.
examples:
- He pressed a wafer onto the back of the letter to keep it closed.
- She used a red wafer to seal the envelope.
