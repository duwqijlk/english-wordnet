simpleMeaning: a hanging spike of ice, made when water drips and freezes as it falls
scope: This is a hanging spike of frozen dripping water, not a spear and not just any lump of ice.
examples:
- An icicle hung from the roof all winter.
- Icicles formed along the edge of the gutter.
