simpleMeaning: A written court document that sets out the reasons behind a judge's ruling.
scope: 'This is the written-document sense, the paper that records a court''s reasoning; distinct from
  opinion%1:09:00:: (a personal belief held without proof), opinion%1:10:01:: (a stated belief held with
  confidence), opinion%1:09:01:: (a view shared by most people), opinion%1:04:01:: (the reasoning itself,
  apart from the document), and opinion%1:09:02:: (a vague idea held with some confidence).'
examples:
- The court published its opinion three months after the hearing.
- A clerk added the written opinion to the case file.
