simpleMeaning: in a way that stands out very much and draws people's attention
scope: It says how something looks or happens in a way that stands out and draws people's eyes, not just
  well or in a normal way.
examples:
- The fireworks rose spectacularly over the river.
- The garden was spectacularly bright in the summer sun.
