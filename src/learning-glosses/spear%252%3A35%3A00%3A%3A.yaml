simpleMeaning: make a hole through something by driving a long pointed rod into it
scope: The act of driving a pointed rod through something, not the upward motion of a branch or mast,
  and not the rod or the barbed fishing tool itself.
examples:
- The hunter speared the boar through the heart.
- They speared the fish as it swam past the boat.
