simpleMeaning: Any shape like the thin curved moon as it looks in its first or last quarter
scope: Any shape like the thin curved moon in its first or last quarter, not a round moon and not a half
  moon.
examples:
- A thin crescent hung in the evening sky.
- She wore a crescent of silver on a chain.
