simpleMeaning: When this stuff is put in with the wash, cloth comes out firm
scope: 'Also called a laundry stiffener: a stuff put in with the wash that leaves cloth firm, not a soap
  and not a softener.'
examples:
- She added fabric stiffener to the wash so her shirts would hold their shape.
- A spoonful of fabric stiffener made the tablecloth stand up stiff and smooth.
