simpleMeaning: A product added to the wash to make cloth firm.
scope: 'Also called a laundry stiffener: a product put in with the wash that leaves cloth firm, not a
  soap and not a softener.'
examples:
- She added fabric stiffener to the wash so her shirts would hold their shape.
- A spoonful of fabric stiffener made the tablecloth stand up stiff and smooth.
