senseId: 'mould%2:36:00::'
synsetId: 01666666-v
simpleMeaning: to make a thing by pouring hot liquid, such as melted wax or metal, into a shaped hollow
  and letting it harden
scope: To make a thing by pouring hot liquid into a shaped hollow and letting it harden; cast and mold
  are other names for this sense, and it is not shaping in clay or wax by hand, nor the fungus that grows
  on damp things.
examples:
- They moulded the bronze into the shape of a horse.
- She moulded candles by pouring hot wax into tins.
