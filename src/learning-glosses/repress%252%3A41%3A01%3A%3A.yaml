simpleMeaning: to keep a person from growing in their own way or showing what they feel inside
scope: To hold back a person's natural growth or self-expression, not to hide a feeling or sound.
examples:
- Strict rules can repress a child's curiosity.
- She felt the school repressed her wish to paint.
