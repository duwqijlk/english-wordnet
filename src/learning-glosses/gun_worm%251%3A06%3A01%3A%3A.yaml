simpleMeaning: Shaped like a corkscrew, this tool pulls loads that did not fire out of the tube of a musket
scope: A corkscrew-shaped tool for pulling unfired loads from a musket, not a drill and not a cleaning
  rod.
examples:
- He used a gun worm to clear the unfired charge from the musket.
- The gun worm twisted into the barrel and drew out the old load.
