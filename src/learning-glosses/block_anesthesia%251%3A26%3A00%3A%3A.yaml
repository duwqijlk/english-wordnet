simpleMeaning: A loss of feeling in a part of the body fed by one nerve, brought on by a drug put on that
  nerve.
scope: A loss of feeling in a part of the body fed by one nerve, brought on by a drug put on that nerve;
  block anaesthesia, conduction anaesthesia, conduction anesthesia, nerve block anaesthesia and nerve
  block anesthesia are other names for this sense, not a loss of feeling in the whole body and not a loss
  of feeling from cold.
examples:
- The dentist used block anesthesia for the tooth.
- Block anesthesia took away feeling in her arm.
