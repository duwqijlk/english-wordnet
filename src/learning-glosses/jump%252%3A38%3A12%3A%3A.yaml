simpleMeaning: To leap from a plane and float down to the ground using a parachute.
scope: This is leaving an aircraft in flight and coming down under a parachute, not simply leaping down
  from a high place, and not ordinary leaping along the ground.
examples:
- The soldiers jumped from the plane and drifted down under their parachutes.
- She jumped for the first time at the airfield, strapped to an instructor.
