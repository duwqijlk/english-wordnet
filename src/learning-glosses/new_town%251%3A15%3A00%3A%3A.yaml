simpleMeaning: A planned built-up place made in a country or empty area and meant to stand on its own,
  with its own homes, schools, shops and places to play.
scope: A planned built-up place made in a country or empty area to stand on its own, not an old market
  place and not a suburb of a big city.
examples:
- The new town was built on empty fields with its own schools and shops.
- They moved to a new town that had homes, shops and places to play.
