schema: oewn-learning-gloss-v2
senseId: 'seeded%3:00:00::'
synsetId: 02262534-a
simpleMeaning: 'Of the more skilled people or teams in a tournament: put in chosen places in the list
  of who plays whom, so that they meet each other in later rounds'
scope: This is about how the more skilled players are placed in a tournament; it is not about fruit that
  has seeds in it or has had its seeds taken out.
examples:
- The seeded players were kept apart in the early rounds of the tennis competition.
- As a seeded team, they did not meet the other top team until the semi-final.
