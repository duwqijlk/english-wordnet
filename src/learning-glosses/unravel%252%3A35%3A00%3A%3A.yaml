simpleMeaning: To come apart, or to make a thing come apart, by pulling its threads or fibres loose from
  each other.
scope: Coming apart, or making a thing come apart, by pulling its threads loose; also called untangle.
examples:
- The old sweater began to unravel at the cuff.
- She tried to unravel the thread without breaking it.
