simpleMeaning: To put things in order by a clear set of rules
scope: To put things in order by a clear set of rules; systematise, systemise and systemize are other
  names for this sense, not to throw things away and not to count things.
examples:
- We need to systematize our scientific knowledge.
- She systematized the files by date.
