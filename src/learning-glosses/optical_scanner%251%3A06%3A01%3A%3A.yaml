simpleMeaning: Printed pages, with their words and pictures, go into the computer through this device,
  which turns them into a form the computer can keep.
scope: Among computer devices, this one reads printed pages into the computer for keeping.
examples:
- The optical scanner read the letter into the computer.
- A page went through the optical scanner into the computer.
