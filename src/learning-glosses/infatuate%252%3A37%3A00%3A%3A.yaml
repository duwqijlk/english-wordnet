senseId: 'infatuate%2:37:00::'
synsetId: 01764521-v
simpleMeaning: to make someone feel strong love or desire with no good sense, so they act in a silly,
  unwise way
scope: This is making someone feel strong love or desire with no good sense, so they act unwisely. Not
  calm love where a person thinks clearly, and not just liking a thing a little.
examples:
- The young singer has infatuated him, and now he follows her everywhere and cannot think clearly.
- Love has infatuated her, so she spends all her money on gifts for him.
