simpleMeaning: A small missile set, carried and fired from the shoulder, that flies low to hit aircraft,
  guided by heat and set off on impact.
scope: This is a shoulder-fired missile set for low aircraft, not a hand gun nor a large missile base.
examples:
- The soldier fired a Stinger from his shoulder.
- A Stinger can bring down a low-flying plane.
