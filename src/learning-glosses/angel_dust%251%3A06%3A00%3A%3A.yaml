simpleMeaning: As a powder taken in secret, this drug makes people see things that are not there; vets
  use it to put animals to sleep.
scope: Phencyclidine and phencyclidine hydrochloride are other names for this drug, a vet's sleep drug
  also taken in secret as a powder.
examples:
- Angel dust put the dog to sleep.
- Taken in secret, angel dust made the user see things that were not there.
