simpleMeaning: In chemistry and physics, things can be put together and blend into one even whole
scope: 'Also called mixable: things that can be blended into one even whole, not things that stay apart
  when put together.'
examples:
- Oil and water are not miscible, so they stay apart in the glass.
- The two liquids were fully miscible and formed a single clear layer.
