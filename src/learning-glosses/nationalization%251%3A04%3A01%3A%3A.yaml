simpleMeaning: The act of making something take on the ways and feel of one country
scope: The act of making something take on the ways and feel of one country; also called nationalisation;
  not the act of forming a nation.
examples:
- The nationalization of the song made it a song of the whole country.
- Nationalization gave the old tale the feel of one land.
