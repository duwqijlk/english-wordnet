senseId: 'attachment%1:10:00::'
synsetId: 06566972-n
simpleMeaning: In law, a written order that lets officials take a person's things, which may be needed
  to pay what a court has said must be paid
scope: This is a court order to take property, not the act of fixing one thing to another.
examples:
- The court issued an attachment on the debtor's car.
- The attachment let the court hold his property until the debt was paid.
