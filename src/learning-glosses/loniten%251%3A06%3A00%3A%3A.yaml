simpleMeaning: A drug that widens blood vessels, used for very high blood pressure; it can cause extra
  hair growth, so it is sold as Rogaine to treat hair loss in men.
scope: 'Also called minoxidil and Rogaine: a drug that widens blood vessels, used for very high blood
  pressure and for hair loss in men, not a drug for mild blood pressure and not a drug for hair loss in
  women.'
