senseId: 'chivaree%1:10:00::'
synsetId: 07068162-n
simpleMeaning: For a pair just married, neighbours bang pots and kettles to make a loud teasing song.
scope: This is also called belling, callathump, callithump, charivari or shivaree, and it is not a song
  played in earnest.
examples:
- The neighbours gave the couple a chivaree on their wedding night.
- We heard a chivaree of pots and kettles outside the house.
