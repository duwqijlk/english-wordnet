senseId: 'southeast_by_east%1:24:00::'
synsetId: 13854916-n
simpleMeaning: The compass point one step anticlockwise from the point halfway between south and the rising
  sun
scope: A compass point one step anticlockwise from the south-east point, not that point itself and not
  the point two steps away.
examples:
- Southeast by east lies just past southeast on the compass.
- The wind came from southeast by east all morning.
