simpleMeaning: Feeling not comfortable with other people, unsure of yourself and held back in how you
  act.
scope: Feeling not comfortable with other people, unsure of yourself and held back in how you act; awkward
  and uneasy are other names for it, not feeling calm and sure of yourself.
examples:
- He felt ill at ease among people he did not know.
- She was ill at ease at the formal dinner.
