simpleMeaning: in old use, a mix of dryness and warmth, or of the four fluids of the body, once thought
  to fix a person's health and temper
scope: An old idea about what fixes a person's health and temper, not the colour of the skin and not a
  simple mix of things.
examples:
- In old books, a person's complexion was said to shape both health and temper.
- Doctors once spoke of a dry complexion as a cause of illness.
