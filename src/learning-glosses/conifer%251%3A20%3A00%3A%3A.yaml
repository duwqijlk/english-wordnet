simpleMeaning: any tree or shrub that has cones and seeds that grow without a fruit covering them
scope: A tree or shrub with cones and seeds with no fruit around them, not a flowering tree whose seeds
  grow inside fruit.
examples:
- A pine is a conifer that keeps its green leaves all winter.
- The forest is full of conifers with tall straight trunks and cones.
