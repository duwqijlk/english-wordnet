simpleMeaning: a wash of lime and a sticky liquid mixed with water, used to make walls and other surfaces
  white
scope: A lime wash for whitening walls; not a false clearing of blame, and not paint.
examples:
- They whitewashed the cottage walls each spring.
- A coat of whitewash brightened the old barn.
