simpleMeaning: To do with kinesthesis, the sense of where the body is and how it moves.
scope: To do with the sense of where the body is and how it moves, not to do with sight and not to do
  with hearing.
examples:
- Dancers need good kinesthetic skill to know where their limbs are.
- Her kinesthetic sense told her where her arms were without her looking.
