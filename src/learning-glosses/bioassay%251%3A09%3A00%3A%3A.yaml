simpleMeaning: A test of how a thing acts on living things, judged by its effect on a living thing and
  set against a fixed measure.
scope: A test of how a thing acts on living things, set against a fixed measure, also called bio-assay;
  not a chemical test on dead matter and not a guess.
examples:
- The bioassay measured the drug's effect on living cells.
- A bioassay told them how much of the stuff to use.
