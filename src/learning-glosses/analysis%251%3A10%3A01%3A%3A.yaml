simpleMeaning: Showing grammatical links with small function words such as 'of' rather than word endings,
  as in 'the father of the bride' instead of 'the bride's father'.
scope: This is the grammatical use of small function words rather than endings; it is not the Freudian
  talking therapy, not the general investigation or abstract separation of a whole into its parts, not
  literary criticism, and not the mathematical field built on calculus and limits.
examples:
- Old English relied on case endings; modern English relies on analysis, with prepositions doing the work.
- The grammar book contrasts English's reliance on analysis with Latin's inflectional endings.
