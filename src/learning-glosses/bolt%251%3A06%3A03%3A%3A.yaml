simpleMeaning: One roll of cloth or wallpaper, with a length that is already set and clear
scope: This is cloth or paper in a roll, not a metal screw used to join parts and not the bar used to
  lock a door.
examples:
- She bought a bolt of cloth to make curtains for the new house.
- The shop sells this wallpaper by the bolt, not by the small roll.
