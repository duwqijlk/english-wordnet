simpleMeaning: The cutting away of a large amount of tissue from the prostate gland, as when the gland
  has grown too big but is not cancer
scope: This operation is also called transurethral resection of the prostate; it is not the removal of
  the whole prostate and not a treatment for cancer of the prostate.
examples:
- He had a TURP to ease his water flow.
- The surgeon carried out a TURP on the patient.
