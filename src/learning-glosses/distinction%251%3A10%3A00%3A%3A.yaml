simpleMeaning: A mark of honour given to a person for doing something very well or for standing above
  others.
scope: An honour given for fine work or standing above others, not the act of telling things apart and
  not high standing itself.
examples:
- He won a distinction in his final exams.
- The medal was a distinction few soldiers had earned.
