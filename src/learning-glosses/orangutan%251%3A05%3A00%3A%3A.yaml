simpleMeaning: a large ape with long arms that lives in trees in Borneo and Sumatra
scope: Also called orang or orangutang. This is a large ape that lives in trees, not a monkey and not
  a gorilla or a chimpanzee.
examples:
- An orangutan swung through the trees with its long arms.
- We saw an orangutan eating fruit high in a tree.
