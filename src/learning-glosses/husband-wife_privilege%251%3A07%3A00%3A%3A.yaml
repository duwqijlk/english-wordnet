senseId: 'husband-wife_privilege%1:07:00::'
synsetId: 05187813-n
simpleMeaning: One partner in a marriage cannot tell others what the other partner told them in private
  while they were married
scope: A married person's private words to their partner cannot be shared by that partner, also called
  marital communications privilege; not a right to keep quiet about other things and not a rule for unmarried
  people.
examples:
- The lawyer said the husband-wife privilege meant she did not have to repeat what her husband had told
  her in private.
- Because of the husband-wife privilege, the court could not make him share his wife's words.
