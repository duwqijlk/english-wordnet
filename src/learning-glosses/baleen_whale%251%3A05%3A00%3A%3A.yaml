simpleMeaning: Along its upper jaw this sea animal has flat plates; water flows through them, and the
  tiny sea creatures stay behind.
scope: 'This is a whalebone whale: flat plates along its upper jaw strain tiny sea creatures out of the
  water.'
examples:
- The baleen whale strained tiny sea creatures from the water as it swam.
- A baleen whale swam past the boat with its mouth open.
