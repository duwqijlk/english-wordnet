senseId: 'centre%1:09:00::'
synsetId: 05929717-n
simpleMeaning: The part of an idea, argument, or experience that matters most and carries its real point.
scope: This is the key part of an idea or experience, not a cluster of nerve cells, not a group of politically
  moderate people, not the American football role that opens a play, and not the football player who fills
  that role. It is also not the adjective sense of holding neither left-wing nor right-wing views, an
  area near the middle of a region, the exact middle point of a line, a place where an activity is concentrated,
  the filling inside a chocolate, the thing attention is fixed on, a building for an activity, the basketball
  or hockey role, the middle of a military formation, a basketball or hockey player, the outfield ground
  ahead of the catcher, a shopping complex, the adjective meaning equally far from both ends, or any verb
  sense about moving to the middle, focusing attention, or having something as the main subject.
examples:
- The centre of his lecture was a warning about climate risk.
- Behind all the jokes, the centre of the film is a story about grief.
