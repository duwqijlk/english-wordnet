simpleMeaning: a settled answer that comes at the end of making a decision
scope: 'Resolution and settlement are other names for this sense: a matter that has been decided, not
  a blockage in a pipe and not a rule that ends debate.'
examples:
- After years of talks, they finally reached closure on the pay dispute.
- He needed time to grieve before he could find closure.
