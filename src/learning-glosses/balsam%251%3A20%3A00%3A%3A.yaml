simpleMeaning: any plant with seeds that makes a thick, sticky plant liquid
scope: This is the living plant itself, not a cream with a sweet smell for the skin, and not the sticky
  stuff from the plant used for medicine or scent.
examples:
- The garden grew balsam next to the beans and peas.
- In summer, the balsam in the bed by the wall flowered tall.
