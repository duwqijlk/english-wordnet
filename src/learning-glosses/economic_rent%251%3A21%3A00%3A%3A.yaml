simpleMeaning: the extra money got from good farmed land, more than the money got from the worst farmed
  land worked in the same way
scope: Extra money from good farmland, also called rent; not the money paid to live in a house and not
  the price of the land itself.
examples:
- The economic rent of the rich valley fields was high.
- Farmers on poor soil earned no economic rent.
