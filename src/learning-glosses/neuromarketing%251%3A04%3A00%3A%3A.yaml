simpleMeaning: Selling based on studies of how buyers' bodies and minds respond to what they sense, think
  and feel.
scope: Selling based on what studies of the body and mind show about buyers, with neuro-marketing as another
  name for this sense, not selling based on sales figures alone and not a study of the brain for its own
  sake.
examples:
- The firm used neuromarketing to test how shoppers react to ads.
- Neuromarketing links brain scans to buying choices.
