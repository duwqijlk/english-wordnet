senseId: 'mandate%1:15:00::'
synsetId: 08615283-n
simpleMeaning: after the First World War, Turkey or Germany gave up a piece of land, and another European
  country ran it until the people there could run it themselves
scope: Land given up by Turkey or Germany after the First World War and run by another European country
  until it could govern itself, not a colony owned for good and not an order from a ruler.
examples:
- After the war, the region became a mandate under British rule.
- The mandate ended when the territory was ready to govern itself.
