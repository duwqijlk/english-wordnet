simpleMeaning: In printing, like the kind of type often used to print words in German.
scope: The printing type used for German, not the pointed church building style, the old East Germanic
  tongue, or the heavy old typeface.
examples:
- The old book was set in Gothic type.
- Gothic letters filled the first page of the German book.
