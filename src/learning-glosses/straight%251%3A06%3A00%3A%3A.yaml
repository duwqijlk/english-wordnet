simpleMeaning: a flat, level section of a road or track with no bends.
scope: This is a physical part of a road or track, not a card hand, not a dependable person, and not the
  direction of travel.
examples:
- The cars reached top speed on the long straight before the first corner.
- He lost control on the straight and hit the barrier.
