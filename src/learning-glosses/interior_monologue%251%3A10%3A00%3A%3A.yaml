senseId: 'interior_monologue%1:10:00::'
synsetId: 06385864-n
simpleMeaning: The thoughts of one made-up person, running one after another in that person's own words,
  make up this kind of writing
scope: This kind of writing lets the reader follow one made-up person's thoughts as if that person were
  speaking them aloud alone.
examples:
- The interior monologue let us hear the hero's thoughts as they came to him.
- Much of the novel is an interior monologue, with no one else speaking.
