simpleMeaning: Moved enough, a set of parts can shift to a steadier state, yet it stays in its steady
  state when left alone or only slightly moved.
scope: It is the steadiness that holds only while a set of parts is left alone or only slightly moved.
examples:
- Metastability kept the system in its steady state until a hard knock moved it.
- The metastability of the system showed when a slight push left it where it was.
