simpleMeaning: The way a person holds and moves their body when their movements are clumsy and not graceful.
scope: Clumsy, ungraceful movement and posture, not stiff embarrassment and not trouble from size or shape.
examples:
- His awkwardness showed in every step across the room.
- The awkwardness of her movements made her shy of dancing.
