simpleMeaning: A common tree of the eastern United States with spicy brown bark that gives off an oil
  that soon turns to air, and hard dark wood used for furniture.
scope: This is a common tree of the eastern United States with spicy bark and hard dark wood, also called
  black birch or cherry birch, and not a white birch or a paper birch.
examples:
- The sweet birch gave off a spicy smell from its bark.
- They made a table from the sweet birch.
