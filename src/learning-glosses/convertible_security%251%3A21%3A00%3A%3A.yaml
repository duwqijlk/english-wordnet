simpleMeaning: a holding in a company, usually a bond or a preferred share, that can be swapped for another
  kind of holding in the company, usually a common share
scope: This is a company holding that can be swapped for another kind, also called a convertible; not
  a fixed bond and not a plain share that cannot be swapped.
examples:
- She held a convertible security that could be swapped for common shares.
- The firm sold a convertible security that buyers could later swap for common shares.
