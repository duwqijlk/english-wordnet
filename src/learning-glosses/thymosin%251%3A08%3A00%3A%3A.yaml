simpleMeaning: The tissue that fights illness is set to work by a chemical the thymus, a gland in the
  chest, makes.
scope: One of the body's chemicals, this one comes from the thymus and sets the tissue that fights illness
  to work.
examples:
- Made by the thymus, thymosin sets the tissue that fights illness to work.
- The thymus sends thymosin to the tissue that fights illness.
