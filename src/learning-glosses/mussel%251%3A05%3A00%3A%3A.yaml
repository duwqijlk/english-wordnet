simpleMeaning: a shellfish with two shells that lives fixed to rocks and other hard things in the sea
  or in fresh water
scope: A shellfish with two shells that lives fixed to rocks in sea or fresh water; not the black shellfish
  eaten steamed in wine, which is another sense of mussel.
examples:
- Mussels clung to the rocks at low tide.
- We gathered mussels from the pier posts.
