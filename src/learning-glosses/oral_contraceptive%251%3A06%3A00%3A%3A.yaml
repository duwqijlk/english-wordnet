simpleMeaning: Two female hormones, estrogen and progestin, in a pill a woman swallows stop an egg from
  leaving the ovary, so she cannot become pregnant.
scope: It is also called pill, anovulant, anovulatory drug, birth control pill, contraceptive pill and
  oral contraceptive pill, and it is a pill a woman swallows that stops an egg from leaving the ovary.
examples:
- She takes an oral contraceptive so she cannot become pregnant.
- An oral contraceptive stopped an egg from leaving her ovary.
