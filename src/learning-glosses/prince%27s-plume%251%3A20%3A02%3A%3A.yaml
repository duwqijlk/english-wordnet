simpleMeaning: This one-season plant from southeastern Asia and Australia, now wild in North America,
  has broad oval leaves and thin spikes of crimson flowers that hang down.
scope: A crimson-spiked annual, also known as prince's-feather, princess feather and kiss-me-over-the-garden-gate.
examples:
- Prince's-plume sends up drooping spikes of crimson flowers above broad oval leaves.
- In North America, prince's-plume now grows wild far from its native southeastern Asia and Australia.
