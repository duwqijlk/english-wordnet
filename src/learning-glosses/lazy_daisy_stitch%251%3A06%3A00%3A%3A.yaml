simpleMeaning: Long loops joined together so they form the shape of a flower
scope: Loops joined together that make a flower shape in cloth; not a single short stitch and not a real
  flower sewn on.
examples:
- She used a lazy daisy stitch to make small flowers on the cloth.
- The lazy daisy stitch on the cushion formed a ring of petals.
