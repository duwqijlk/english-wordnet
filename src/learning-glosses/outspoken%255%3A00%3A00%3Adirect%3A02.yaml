senseId: outspoken%5:00:00:direct:02
synsetId: 00768027-s
simpleMeaning: speaking and acting in a plain, direct way, with no hints and no hiding of what you mean
scope: 'Also called blunt, frank, candid, forthright, free-spoken, plainspoken and point-blank: speaking
  in a plain, direct way. Not just speaking freely and strongly, without saying things straight.'
examples:
- She is outspoken about the plan and says clearly what she thinks is wrong with it.
- He gave an outspoken answer and told the boss the idea would not work.
