simpleMeaning: To compose a piece of music.
scope: This is creating music, not producing a literary work, not expressing something in written words,
  not contacting someone by letter or message, not marking words or symbols on a surface, not recording
  data on a computer, not spelling out the letters of a word, and not creating computer code or a program.
examples:
- She was asked to write a string quartet for the spring concert.
- He writes music for films, mostly for small orchestras.
