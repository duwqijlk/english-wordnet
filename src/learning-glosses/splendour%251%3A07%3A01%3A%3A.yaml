simpleMeaning: the quality of being very grand, rich and beautiful in a way that people look at with wonder
scope: 'This quality is also called splendor, grandeur, magnificence and grandness: a grand, rich beauty,
  not a single bright light or a small pretty detail.'
examples:
- Visitors stood in silence at the splendour of the palace hall.
- The splendour of the mountain view left them without words.
