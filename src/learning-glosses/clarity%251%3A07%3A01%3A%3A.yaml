schema: oewn-learning-gloss-v2
senseId: 'clarity%1:07:01::'
synsetId: 04827489-n
simpleMeaning: the quality of speech or writing that is easy to understand, with nothing hidden or hard
  to follow
scope: This is about speech or writing being easy to understand, not about how see-through a liquid is
  or how sharp a sound or a picture is.
examples:
- Her letter was written with such clarity that everyone understood it at once.
- The teacher praised the clarity of his short, plain answer.
