simpleMeaning: A sickness of the spine caused by TB, in which the back bones are eaten away so the spine
  bends.
scope: A sickness of the spine caused by TB, in which the back bones are eaten away so the spine bends,
  not a sickness of the lungs and not a hurt spine from a fall.
examples:
- Pott's disease bent his spine when he was young.
- Doctors treat Pott's disease with drugs against TB.
