simpleMeaning: a pouch with thick, strong walls below the crop (a small pouch in the throat) in many birds
  and reptiles, used to break food into small pieces
scope: 'Also called gastric mill and ventriculus: a food-breaking pouch in many birds and reptiles, not
  the stomach in general and not the crop in the throat.'
examples:
- The chicken's gizzard breaks up hard seeds.
- Birds use their gizzards to grind food.
