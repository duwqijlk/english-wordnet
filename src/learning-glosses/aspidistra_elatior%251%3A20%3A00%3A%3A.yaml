simpleMeaning: A plant that keeps its leaves all year and lives many years, with large good-looking leaves
  at its base; grown mostly indoors for its leaves.
scope: Also called aspidistra, a bar-room plant, a cast-iron plant, and Aspidistra elatio; a plant grown
  indoors for its leaves, with large good-looking leaves at its base.
examples:
- Aspidistra elatior stood in a pot by the window, grown for its large leaves.
- The Aspidistra elatior keeps its leaves all year and lives for many years.
