simpleMeaning: A fault present from birth in a male, in which the tube that carries urine out lies on
  the top of the male sex part.
scope: A fault present from birth in a male, in which the tube that carries urine out lies on the top
  of the male sex part, not a fault that comes later in life and not a tube that opens underneath.
examples:
- The boy was born with epispadias.
- Epispadias put the urine tube on the top of the male sex part.
