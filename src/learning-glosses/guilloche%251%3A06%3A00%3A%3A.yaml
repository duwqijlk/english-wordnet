simpleMeaning: A pattern on a building made of two wavy bands that cross each other.
scope: A pattern on a building made of two wavy bands that cross each other, not a plain stone border
  and not a carving of leaves.
examples:
- A guilloche runs along the edge of the old ceiling.
- The stone was carved with a guilloche of crossing bands.
