simpleMeaning: The lowest band above a row of pillars, resting straight on the tops of the pillars.
scope: The lowest band above a row of pillars, resting on their tops; not a pillar itself and not the
  roof.
examples:
- The architrave runs along the top of the pillars at the front of the temple.
- Carved letters mark the architrave above the door.
