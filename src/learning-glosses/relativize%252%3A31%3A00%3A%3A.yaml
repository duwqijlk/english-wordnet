simpleMeaning: To see or treat a thing as true only in one setting, not true on its own.
scope: To treat a thing as true only in its own setting.
examples:
- The teacher asked us to relativize the claim, and judge it only in its own time.
- Historians relativize old rules by setting them beside the customs of the day.
