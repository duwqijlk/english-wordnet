senseId: 'medical_checkup%1:04:00::'
synsetId: 00143181-n
simpleMeaning: Tests of many kinds, picked for a person's age, sex and health, make up this full look
  at the body
scope: Also called a checkup, a health check, a medical, a medical exam or a medical examination, this
  is a full look at the body with tests picked for the person, not a visit for one illness and not a single
  test.
examples:
- Her medical checkup took an hour and included blood tests and a hearing test.
- He goes for a medical checkup every year to keep track of his health.
