simpleMeaning: a grass from the lands around the Mediterranean Sea, thought to be the plant from which
  the farmed grain of today comes
scope: 'Also called animated oat: the grass thought to be the source of today''s farmed grain, not the
  farmed grain itself and not a modern grass grown for food.'
examples:
- Farmers still find wild red oat growing along the dry hills of the Mediterranean.
- The wild red oat of the old fields is thought to be the parent of the grain we grow today.
