senseId: 'artistically%4:02:00::'
synsetId: 00249854-r
simpleMeaning: in a way that shows care, skill, and a sense of beauty, as in a work of art
scope: Done with skill and a sense of beauty, as in art. It is not done in a plain, careless way, or in
  a way that is only for use.
examples:
- The room was artistically arranged, with each colour chosen with care.
- She artistically placed the flowers so the table looked like a picture.
