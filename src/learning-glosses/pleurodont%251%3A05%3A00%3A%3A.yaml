simpleMeaning: An animal whose teeth are joined to the inner side of the tooth ridge, with no sockets
scope: An animal whose teeth are joined to the inner side of the tooth ridge, with no sockets; not an
  animal with teeth set in sockets and not a toothless animal.
examples:
- The pleurodont had teeth joined to the inner side of its tooth ridge.
- A pleurodont has no sockets for its teeth.
