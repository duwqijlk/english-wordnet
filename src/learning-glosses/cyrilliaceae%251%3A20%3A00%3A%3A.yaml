simpleMeaning: A family of shrubs and trees with leathery leaves and small white flowers in clusters,
  made up of the genera Cyrilla and Cliftonia.
scope: 'Also called cyrilla family, titi family and family Cyrilliaceae: a family of shrubs and trees
  with leathery leaves and small white flowers in clusters, distinct from families with single large flowers.'
examples:
- Cyrilliaceae includes shrubs and trees with small white flowers.
- The Cyrilliaceae family has leathery leaves and flowers in clusters.
