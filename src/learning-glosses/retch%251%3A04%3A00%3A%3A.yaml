simpleMeaning: A heave of the stomach that brings nothing up, coming on its own without being willed.
scope: Also called a heave, this is a heave of the stomach that brings nothing up, not the act of trying
  to be sick and not throwing up what is in the stomach.
examples:
- A bad case of the retches kept him awake all night.
- The retch shook his whole body but brought nothing up.
