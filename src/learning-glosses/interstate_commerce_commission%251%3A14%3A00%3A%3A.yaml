senseId: 'interstate_commerce_commission%1:14:00::'
synsetId: 08142975-n
simpleMeaning: A former free-standing United States government agency that watched over firms carrying
  goods and people from one state to another and set their prices, shut down in 1995
scope: This was a former United States government agency that watched over firms carrying goods and people
  between states; ICC is another name for this sense, and it set their prices until it was shut down in
  1995, not a state office and not a firm that carries goods itself.
examples:
- The Interstate Commerce Commission once set the rates for trains crossing state lines.
- Congress shut down the Interstate Commerce Commission in 1995.
