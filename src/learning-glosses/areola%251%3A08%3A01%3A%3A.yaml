simpleMeaning: A small round patch of skin, round a nipple or round a spot or a bite where the skin turns
  red.
scope: Also called ring of color, this is a small round patch of skin round a nipple or round a spot or
  a bite, not the small space between veins on a leaf or an insect's wing.
examples:
- A red areola formed round the spot on the arm.
- The areola round the insect bite showed as a red ring.
