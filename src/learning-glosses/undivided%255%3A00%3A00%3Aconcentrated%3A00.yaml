simpleMeaning: given to only one thing or one aim, and not shared out among more than one
scope: 'Also called single and exclusive: kept on one aim only, not the sense of a whole thing that is
  not split into parts.'
examples:
- She gave the work her undivided attention.
- He listened with undivided care and did not look at his phone.
