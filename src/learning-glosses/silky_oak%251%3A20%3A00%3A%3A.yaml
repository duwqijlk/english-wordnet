simpleMeaning: a fast-growing tree of middle to tall height, with orange flowers and feathery leaves split
  twice into pairs, soft with hairs underneath; from eastern Australia
scope: A medium-to-tall Australian tree with orange flowers, not an English oak and not a pine.
examples:
- The silky oak in the garden grew tall in a few years.
- Orange flowers covered the silky oak all through spring.
