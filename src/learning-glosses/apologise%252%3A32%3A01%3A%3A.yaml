senseId: 'apologise%2:32:01::'
synsetId: 00896259-v
simpleMeaning: to defend a person or act with reasons, or to explain it so it seems less wrong
scope: 'Also called excuse, apologize, rationalize, and rationalise: using reasons to defend a person
  or act. Not saying sorry for a fault or a wrong act.'
examples:
- In his book, he apologised for the old system, giving reasons to defend how it worked.
- She apologised for his choice by explaining the reasons behind it and why she thought it was right.
