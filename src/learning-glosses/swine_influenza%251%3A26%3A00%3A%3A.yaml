simpleMeaning: Brought on by a germ thought to be the one behind the sickness of 1918, this is a sharp
  illness of pigs that spreads fast and hits the breathing tubes.
scope: Swine flu is another name for this sharp sickness of pigs that spreads fast.
examples:
- Swine influenza spread through the herd in a few days.
- The vet said swine influenza had hit the pigs on the farm.
