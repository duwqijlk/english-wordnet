senseId: 'martial_law%1:14:00::'
synsetId: 08471829-n
simpleMeaning: Civil rules give way to rules set by soldiers over ordinary people, often in war or a time
  of great trouble
scope: Rules set by soldiers over ordinary people, often in war or crisis, that take the place of the
  usual rules, not a court order and not a state of war by itself.
examples:
- Martial law was declared after the fighting began.
- Under martial law, soldiers ran the towns.
