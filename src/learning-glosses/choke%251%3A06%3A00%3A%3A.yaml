simpleMeaning: a part that controls how much air goes into the carburetor (the part that mixes air and
  fuel) of a gasoline engine
scope: This is a part in a gasoline engine, not the coil used in an electric circuit and not the act of
  struggling to breathe.
examples:
- He opened the choke before starting the cold engine.
- The choke was stuck, so the car would not start.
