simpleMeaning: skin that is sore and warm where it has been rubbed again and again
scope: Sore, warm skin where something has rubbed it again and again, not anger and not the act of rubbing.
examples:
- The tight shoes left a painful chafe on his heel.
- He had a nasty chafe on his knee after the long walk.
