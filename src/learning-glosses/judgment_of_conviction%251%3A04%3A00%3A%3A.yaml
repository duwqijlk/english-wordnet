simpleMeaning: In criminal law, after a person is found guilty of a crime, the court gives its last ruling
  and sets the punishment
scope: In criminal law, after a person is found guilty of a crime, the court gives its last ruling and
  sets the punishment, also called a conviction, sentence or condemnation; not a ruling that finds a person
  not guilty and not a fine paid without a trial.
examples:
- The judgment of conviction was read out in court.
- After the judgment of conviction, the court set the punishment.
