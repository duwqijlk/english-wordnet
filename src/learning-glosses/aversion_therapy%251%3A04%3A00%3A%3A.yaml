simpleMeaning: a way of changing how someone acts by giving them something nasty in a set way, to help
  them; above all for drink or drug habits, but with little success
scope: A way of changing how someone acts by giving them something nasty, not a talking cure and not a
  drug cure.
examples:
- Aversion therapy pairs a drink with a drug that makes the patient feel sick.
- The clinic no longer uses aversion therapy, as it had little success with drug abuse.
