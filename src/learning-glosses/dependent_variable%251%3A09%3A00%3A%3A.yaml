simpleMeaning: In statistics, the value in a maths or logic statement that shifts when another value shifts.
scope: This is a value that shifts with another value, not the value that sets it.
examples:
- If f(x) equals y, y is the dependent variable.
- In the test, the dependent variable was the score each child got.
