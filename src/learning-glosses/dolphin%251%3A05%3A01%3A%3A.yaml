simpleMeaning: a large, thin fish that lives in many warm seas, most of all around Hawaii, and is caught
  for food and for sport
scope: This is the fish with this name, not the small whale with teeth and a mouth like a beak.
examples:
- They caught a dolphin in the warm sea near Hawaii and cooked it that night.
- This kind of dolphin is a large, thin fish that people catch for sport.
