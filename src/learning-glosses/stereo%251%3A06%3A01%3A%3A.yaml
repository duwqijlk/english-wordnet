simpleMeaning: Two photos of the same thing taken from angles a little apart, which look solid and deep
  when seen side by side
scope: This is a pair of photos taken from slightly different angles that look three-dimensional together,
  not a machine that plays sound and not a word for sound with two channels.
examples:
- The museum showed a stereo of the old street.
- Look at the two pictures as a stereo and they seem to stand out.
