simpleMeaning: the act of hurting someone in return for harm they did to you, especially in the next life
scope: 'Also called vengeance and retribution: hurting someone back for harm they did, especially in the
  next life, not money you get back from money you put in.'
examples:
- He wanted payback for the man who had cheated him.
- She swore she would get payback one day for what he did to her.
