simpleMeaning: The lowest heat at which the steam of a burnable liquid can catch light in air
scope: This is the lowest heat at which the steam of a burnable liquid can catch light in air; flashpoint
  is another name for this sense, not the heat at which a liquid boils and not a moment of crisis.
examples:
- The flash point of the fuel was low.
- Heat the liquid past its flash point and it may catch light.
