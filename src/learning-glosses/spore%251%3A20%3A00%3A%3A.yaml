simpleMeaning: A small body, usually one cell. Many plants with no flowers, fungi, and some bacteria and
  protozoans make it, and it can grow into a new living thing without sex.
scope: This is the small body that can grow into a new plant, fungus, or other living thing, not a seed
  made by a flowering plant and not a baby plant.
examples:
- The fern makes many spores, and each one can grow into a new fern.
- Spores from the fungus spread through the air and landed on the wood.
