simpleMeaning: the one kind of work a person has chosen as the job they do to earn their living
scope: 'Also called specialty, and another name is specialization: the one kind of work a person has chosen
  for their living. Not a thing that has special worth or use.'
examples:
- Cooking French food is his speciality, and people travel far to eat it.
- Her speciality is heart surgery, and patients come to her from many towns.
