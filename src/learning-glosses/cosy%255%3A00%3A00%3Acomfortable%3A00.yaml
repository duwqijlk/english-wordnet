simpleMeaning: Feeling warm and comfortable, or making a place feel warm, safe and sheltered, especially
  in a small space
scope: 'This sense is also called snug, and another name for it is cozy: warm and comfortable, especially
  in a small space. It is not the cloth cover that keeps a teapot warm, and not the sense of having a
  warm, friendly, informal air.'
examples:
- We sat in a cosy corner by the fire.
- The small room felt cosy on a cold night.
