senseId: 'sterilization%1:04:01::'
synsetId: 00254786-n
simpleMeaning: The way of making a thing free of live germs or other tiny living things, usually by heat
  or by chemicals.
scope: The way of making a thing free of live germs, usually by heat or by chemicals, not the making of
  a living thing unable to have young.
examples:
- Sterilization of the instruments took place before the operation.
- Heat sterilization killed every germ on the tools.
