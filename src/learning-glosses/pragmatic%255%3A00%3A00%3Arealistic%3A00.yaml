simpleMeaning: led by what you have learned from seeing and doing things in real life, not by ideas about
  how things work
scope: 'Also called practical, and another name is hardheaded: this means led by real experience, not
  the noun for an emperor''s order that becomes law, and not the word about pragmatism, a way of thinking.'
examples:
- She took a pragmatic view and fixed the problem with the tools she had.
- His pragmatic plan used what had worked before, not new ideas.
