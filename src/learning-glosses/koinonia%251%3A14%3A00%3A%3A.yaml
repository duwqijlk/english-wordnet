simpleMeaning: Christian sharing and close bond with God or with other Christians, said above all of the
  early Christian group.
scope: Christian sharing and close bond with God or with other Christians, said above all of the early
  Christian group, not church membership in general and not the rite of sharing bread and wine.
examples:
- Koinonia bound the early Christians together in one community.
- The pastor spoke of koinonia as a close bond among believers.
