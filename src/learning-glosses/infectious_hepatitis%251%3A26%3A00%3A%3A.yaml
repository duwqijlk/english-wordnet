senseId: 'infectious_hepatitis%1:26:00::'
synsetId: 14154143-n
simpleMeaning: A sudden, not serious liver infection from an RNA virus that does not stay in the blood,
  usually caught by taking in food or drink contaminated with feces.
scope: This is the mild form spread by contaminated food or water, not the serious blood-borne forms of
  the disease.
examples:
- She was found to have infectious hepatitis after eating at a restaurant with poor hygiene.
- Infectious hepatitis spreads mainly through food or water contaminated with waste.
