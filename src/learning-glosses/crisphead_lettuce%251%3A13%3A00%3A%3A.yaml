simpleMeaning: a salad plant with crunchy light-green leaves packed tight in a firm head
scope: Also called iceberg or iceberg lettuce, this is a salad plant with crunchy, light-green leaves
  packed tight in a firm head, not a loose-leaf salad plant and not a head of cabbage.
examples:
- The crisphead lettuce in the salad stayed crunchy even after the dressing went on.
- She bought a crisphead lettuce with a firm head for the sandwiches.
