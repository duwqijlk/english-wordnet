simpleMeaning: An interpreter and guide in the Near East; under Ottoman rule in the 1700s and 1800s, in
  most cases a Greek translator of European languages for Turkish and Arab officials.
scope: The historical interpreter and guide who served travellers and officials in the Near East under
  Ottoman rule, not a modern tourist guide.
examples:
- The dragoman translated the merchants' Greek for the Turkish governor.
- A skilled dragoman guided the travellers through the Ottoman provinces.
