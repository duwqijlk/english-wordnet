simpleMeaning: the chemical name for aspirin, a drug made from salicylic acid, usually taken as tablets;
  it eases pain and inflammation, lowers fever, and slows blood clotting by blocking platelets
scope: Aspirin under its chemical name; not a different medicine, and not salicylic acid, the related
  substance it is made from.
examples:
- Acetylsalicylic acid is the chemical name for aspirin.
- Low doses of acetylsalicylic acid are sometimes given to help prevent heart attacks.
