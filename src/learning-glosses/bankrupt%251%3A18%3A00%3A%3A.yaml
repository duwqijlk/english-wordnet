simpleMeaning: a person who does not own enough of value to pay what they owe
scope: A person who cannot pay what they owe, not a person who is merely poor or short of cash for a time.
examples:
- After the shop failed, he was declared a bankrupt by the court.
- The bankrupt lost his house and his car to pay his debts.
