simpleMeaning: the act of giving a signal, such as calling someone to come, by making a high sound with
  the mouth or by blowing into a small device
scope: 'Also called whistle: this is using that sound as a signal, not the sound made by fast movement
  or steam, and not making music in that way.'
examples:
- His whistling called the dog back from the field.
- The whistling from the platform was the signal for the workers to come.
