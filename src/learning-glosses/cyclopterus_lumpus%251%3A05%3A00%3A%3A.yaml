simpleMeaning: A clumsy soft thick-bodied fish of the northern Atlantic, its belly fins joined into a
  sucker; its eggs, which people can eat, are used as caviar.
scope: Also called a lumpfish; a clumsy thick-bodied fish of the northern Atlantic whose belly fins form
  a sucker, kin to other sucker-finned fishes.
examples:
- Cyclopterus lumpus clings to rocks with the sucker formed by its belly fins.
- The roe of Cyclopterus lumpus is used for caviar.
