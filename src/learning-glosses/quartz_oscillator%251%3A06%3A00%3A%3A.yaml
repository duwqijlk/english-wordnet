senseId: 'quartz_oscillator%1:06:00::'
synsetId: 03148420-n
simpleMeaning: a device that makes electric signals which repeat at a rate fixed by the size and shape
  of a crystal that gives off a charge when squeezed
scope: This is the device whose rate is fixed by a squeezed crystal, also called a crystal oscillator;
  it is not a clock or a radio on its own.
examples:
- The quartz oscillator keeps the radio on the right frequency.
- A quartz oscillator sets the pace of the clock's signals.
