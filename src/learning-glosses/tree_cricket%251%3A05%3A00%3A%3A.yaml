simpleMeaning: A pale American insect that lives up in leafy plants and is known for its loud chirping
scope: A pale American insect that lives up in leafy plants and chirps loudly, not a ground cricket and
  not a grasshopper that jumps in fields.
examples:
- At night we heard a tree cricket chirping in the bushes.
- The tree cricket is hard to spot among the leaves.
