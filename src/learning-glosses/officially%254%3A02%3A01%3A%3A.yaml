simpleMeaning: in a way that has been allowed or agreed by people with power to decide
scope: Done with permission from people in power, not just done while a person is acting in their job
  or role.
examples:
- He was officially allowed to speak for the company.
- After the vote, the sports club was officially allowed to use the town field.
