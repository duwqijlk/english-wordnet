simpleMeaning: the few people picked from many who applied, all judged fit for the job, and the winner
  will be chosen from them
scope: The few people judged fit for a job, also called a shortlist; not the full list of people who applied,
  and not the one person who is picked in the end.
examples:
- The committee cut the 200 applicants down to a short list of five.
- Her name was on the short list for the manager's job.
