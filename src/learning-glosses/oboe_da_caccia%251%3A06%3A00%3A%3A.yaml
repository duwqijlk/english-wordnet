simpleMeaning: A low-pitched woodwind with a double reed, which came before the English horn
scope: A low-pitched woodwind with a double reed, which came before the English horn; not a high oboe,
  and not a horn of brass.
examples:
- He played the oboe da caccia in the old music.
- The oboe da caccia sounds lower than the plain oboe.
