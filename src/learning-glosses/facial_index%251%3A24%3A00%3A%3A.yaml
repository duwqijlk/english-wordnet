simpleMeaning: A number out of a hundred that gives the widest part of the front of the head as a share
  of its tallest part.
scope: A number out of a hundred that sets the widest part of the front of the head against its tallest
  part, not a head size and not a skull length.
examples:
- The facial index helps sort skulls by shape.
- They worked out the facial index from the two measures.
