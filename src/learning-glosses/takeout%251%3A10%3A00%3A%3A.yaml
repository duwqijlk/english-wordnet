simpleMeaning: In bridge, a bid you make to ask your partner to bid a suit other than the one just named.
scope: In bridge, a bid asking your partner to bid a different suit; not food taken away to eat elsewhere.
examples:
- He made a takeout bid to get his partner to change suits.
- Her takeout showed she wanted a new suit named.
