simpleMeaning: In Europe, in the Jurassic or early Cretaceous, lived this huge meat-eating dinosaur that
  walked on two legs.
scope: Also called megalosaurus, it was a huge meat-eating dinosaur that walked on two legs, not a plant-eater.
examples:
- The megalosaur hunted in Europe long ago.
- The megalosaur walked on two legs.
