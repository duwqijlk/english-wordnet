simpleMeaning: In music, setting an instrument or an electronic circuit so that it matches a set pitch
scope: In music, making an instrument or circuit sound at the right pitch, not the act of playing it and
  not a general change to a machine.
examples:
- The tuning of the piano took nearly an hour.
- A tuning fork helped her set the violin to the right pitch.
