simpleMeaning: a gentian plant from eastern North America, with bunches of stiff blue flowers
scope: A gentian plant from eastern North America with bunches of stiff blue flowers; ague weed and five-flowered
  gentian are other names for this, not the white-flowered herb of the south-east once used in folk medicine,
  and not other gentians.
examples:
- Agueweed grows in the damp woods of the east.
- The blue flowers of agueweed open in late summer.
