simpleMeaning: strong dislike of people who are different, and unfair ideas about them that will not change
scope: This is the strong, fixed dislike and unfair thinking itself. It is not one single act of unfair
  treatment.
examples:
- Bigotry made him refuse to listen to anyone from another religion.
- The town worked hard to end bigotry against new families who moved there.
