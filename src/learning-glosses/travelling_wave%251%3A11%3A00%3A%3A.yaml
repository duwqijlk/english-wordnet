schema: oewn-learning-gloss-v2
senseId: 'travelling_wave%1:11:00::'
synsetId: 07361651-n
simpleMeaning: a rise and fall that moves through stuff, and the stuff it moves through also moves in
  the same way as it goes
scope: This is a moving rise and fall whose carrier moves with it; traveling wave is another name for
  this sense. Not a wave that stands still in place.
examples:
- The travelling wave ran along the water, and the water itself moved with it.
- In the lab we made a travelling wave in a long tube of air.
