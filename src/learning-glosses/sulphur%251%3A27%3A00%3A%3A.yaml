simpleMeaning: A common substance with no taste or smell, a non-metal joining with many atoms, best seen
  in yellow crystals, found in many minerals and alone, above all in volcanic lands.
scope: A yellow substance with no taste or smell, also called sulfur, S, and atomic number 16; not a metal
  and not a yellow rock.
examples:
- The farmer dusted the vines with sulphur.
- Sulphur comes in yellow lumps.
