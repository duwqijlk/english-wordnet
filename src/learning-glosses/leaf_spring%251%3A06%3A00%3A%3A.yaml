simpleMeaning: A long narrow bendy strip made of several layers of metal held together
scope: A bendy strip of layered metal; not a coil that winds round and round, and not a single flat bar.
examples:
- The old truck's leaf spring had cracked under the load.
- A leaf spring flexes to take the bumps of the road.
