simpleMeaning: groups of animals, birds or fish above all, move from one place to another at regular times
  to feed or to breed
scope: The regular movement of animal groups to feed or breed elsewhere; not the movement of people, and
  not a one-off move.
examples:
- The migration of the birds begins each autumn.
- Whales begin their migration when the water cools.
