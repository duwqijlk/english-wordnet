simpleMeaning: A tyre filled with air that stays airtight with no separate inner part to hold the air.
scope: This is a tyre that stays airtight with no separate inner part to hold the air, also called a tubeless
  tire; not a solid tyre and not a tyre with an inner tube.
examples:
- The tubeless tyre held its air after the puncture.
- He fitted a tubeless tyre to the front wheel.
