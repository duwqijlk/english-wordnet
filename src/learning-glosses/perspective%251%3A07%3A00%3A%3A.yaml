simpleMeaning: how things look next to each other, with near things looking big and far things looking
  small
scope: How things look by distance, not a person's way of thinking about a subject.
examples:
- In the drawing, perspective makes the road look narrow in the distance.
- The artist used perspective to show how tall the tower was.
