simpleMeaning: when the body fights against tissue or an organ put in from another body, because its defence
  system sees it as foreign
scope: 'Also called refuse and resist: this is the body fighting tissue or an organ from another body,
  not refusing a person entry, not dismissing an idea, and not looking down on someone.'
examples:
- His body rejected the new liver from the donor.
- After the operation, her body began to reject the new heart.
