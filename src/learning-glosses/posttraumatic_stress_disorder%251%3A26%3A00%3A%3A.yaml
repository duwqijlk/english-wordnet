senseId: 'posttraumatic_stress_disorder%1:26:00::'
synsetId: 14409535-n
simpleMeaning: 'Guilt at having survived, the event replayed in dreams, numbness and detachment, and repeated
  thoughts and images: this anxiety condition is tied to deeply disturbing events.'
scope: This is the anxiety condition that follows deeply disturbing events, not ordinary short-term stress
  or grief after a loss.
examples:
- After the accident, he was diagnosed with posttraumatic stress disorder.
- Soldiers returning from combat may develop posttraumatic stress disorder.
