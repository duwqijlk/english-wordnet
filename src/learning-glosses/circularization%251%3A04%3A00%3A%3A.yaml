simpleMeaning: handing out printed notices as a way of advertising
scope: This is handing out printed notices as a way of advertising; circularisation is another name for
  this sense, and it is not putting notices up in one place.
examples:
- The circularization of the new shop's flyers brought in many buyers.
- They planned a circularization to spread news of the concert.
