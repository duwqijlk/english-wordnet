simpleMeaning: a monkey from India with a tuft of hair on its head like a small cap
scope: 'Also called bonnet monkey, capped macaque and crown monkey: a monkey from India with a cap-like
  tuft of hair, not a monkey from Africa and not a monkey with no tuft.'
examples:
- The bonnet macaque groomed its tuft of hair.
- A bonnet macaque sat in the tree above us.
