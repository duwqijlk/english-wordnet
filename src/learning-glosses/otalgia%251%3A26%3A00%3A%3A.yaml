simpleMeaning: Pain that stays in one place in the ear, in the middle or the inner part
scope: Pain that stays in one place in the ear, in the middle or the inner part, also called earache;
  not a pain in the outer ear and not a headache.
examples:
- Her otalgia kept her awake all night.
- The doctor asked where the otalgia hurt most.
