simpleMeaning: the act of making something less strong or less serious
scope: 'Also called moderation: making something less strong or less serious, not a partial excuse that
  makes a wrong act look less serious.'
examples:
- The mitigation of the flood damage was the council's first aim.
- Better care led to a mitigation of her pain over time.
