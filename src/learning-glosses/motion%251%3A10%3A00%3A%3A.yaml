senseId: 'motion%1:10:00::'
synsetId: 06889359-n
simpleMeaning: Sending familiar or prearranged signals by moving the body, especially the hands.
scope: This is signalling with body movements (another name for it is gesture), not a formal proposal
  put to a meeting, and not the illusion of movement created by film.
examples:
- She made a motion with her hand to tell us to stop.
- He used a quick motion of his head to call her over.
