simpleMeaning: In sport, the mistake of being in a position on the field that the rules do not allow,
  in football, soccer, ice hockey, field hockey and other games
scope: This sense is the mistake itself in a game, not the word for a player who is in that wrong place
  or ahead of the ball.
examples:
- The offside gave the other team a free kick.
- An offside stopped the attack just as the player was about to score.
