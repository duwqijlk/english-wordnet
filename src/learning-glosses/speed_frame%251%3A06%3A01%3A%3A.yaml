scope: A machine used in making cloth, that turns loose drawn fibres into twisted strands ready for spinning;
  also called fly frame, roving frame and simplex machine. Not a loom that weaves cloth and not a machine
  that spins the finished yarn.
examples:
- The mill bought a new speed frame for the spinning room.
- The speed frame turned the drawn sliver into roving.
