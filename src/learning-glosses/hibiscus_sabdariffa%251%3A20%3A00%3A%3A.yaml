simpleMeaning: An East Indian plant, sparsely prickly, a one-year herb or a long-lived bush, widely grown
  for its fleshy flower cups used in tarts and jelly and for its stem fibre.
scope: 'Also called sorrel, red sorrel, roselle, rozelle, or Jamaica sorrel: an East Indian plant grown
  for its flower cups, not a rose bush and not a tea plant.'
examples:
- The Hibiscus sabdariffa gives flower cups for jelly.
- We grow Hibiscus sabdariffa for its stem fibre.
