simpleMeaning: a covering made of rough cloth, usually made of straw or hemp (a strong plant used to make
  rope and cloth)
scope: A covering made of rough cloth, usually straw or hemp. Not the loose straw or hemp before it is
  made into cloth.
examples:
- Coarse matting covered the floor of the hut.
- They laid straw matting over the cold ground.
