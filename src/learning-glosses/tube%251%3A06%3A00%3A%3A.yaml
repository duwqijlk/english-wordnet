simpleMeaning: A hollow pipe, usually long and round, that holds things, liquids, or gases and lets them
  pass through
scope: A hollow pipe for holding and carrying things, liquids, or gases, not a part of the body, not an
  electronic part in a glass case, and not the act of riding on a blown-up ring.
examples:
- Water runs through a tube from the tank to the garden.
- He joined two tubes together to carry the gas to the stove.
