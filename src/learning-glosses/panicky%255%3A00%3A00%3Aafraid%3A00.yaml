simpleMeaning: put into very strong fear or a feeling that there is no hope
scope: 'Also called frightened, terrified, and panicked: put into very strong fear or a feeling of no
  hope, not just a little worried or nervous.'
examples:
- She grew panicky as the flood water rose around the house.
- The panicky crowd pushed toward the doors when the alarm rang.
