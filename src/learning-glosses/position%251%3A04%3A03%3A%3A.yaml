simpleMeaning: the job or role that another person rightly or usually holds and carries out
scope: This is the job or role that another person holds, not a person's rank in society, a stated opinion,
  or the situation someone is in.
examples:
- She was asked to fill the position left vacant by the retiring teacher.
- The young officer moved into the position his mentor had held for years.
