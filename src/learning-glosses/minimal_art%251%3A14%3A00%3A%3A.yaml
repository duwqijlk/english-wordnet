simpleMeaning: a style of sculpture and painting from the 1950s that keeps shapes and colours as simple
  as can be
scope: A style of sculpture and painting from the 1950s that keeps shapes and colours very simple, also
  called minimalism and reductivism; not a style full of fine detail and not a kind of music.
examples:
- Minimal art uses plain shapes and few colours.
- The show of minimal art had only simple forms.
