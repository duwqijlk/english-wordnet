simpleMeaning: the hollow space inside the body that holds the main organs; in animals that feed their
  young with milk, a sheet of muscle sets it off from the chest
scope: The hollow space that holds the main organs, not the outside part of the body between the chest
  and the hips.
examples:
- The surgeon opened the abdomen to reach the organs inside.
- In a dog, the diaphragm sets the abdomen off from the chest.
