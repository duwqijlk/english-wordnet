simpleMeaning: a rough, thick cloth that looks like the cloth used to make large bags
scope: The rough cloth itself, not a piece of clothing made from such cloth and worn in the past to show
  sorrow.
examples:
- The bag was made of coarse sackcloth.
- He wrapped the tools in a piece of sackcloth.
