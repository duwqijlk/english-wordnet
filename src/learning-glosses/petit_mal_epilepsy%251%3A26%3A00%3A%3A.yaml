simpleMeaning: In this form of epilepsy, the mind clouds briefly in short fits, and other such troubles
  may follow too.
scope: The epilepsy also called epilepsia minor and petit mal is known by short fits in which the mind
  goes blank for a moment.
examples:
- She has had petit mal epilepsy since she was a child.
- Their petit mal epilepsy brings short fits in which the mind goes blank.
