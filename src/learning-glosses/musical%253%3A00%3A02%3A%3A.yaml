simpleMeaning: good at music, or loving music very much
scope: About a person who is good at music, or who loves music very much; not about a thing that is full
  of music or can make it, and not the play or film with singing and dancing.
examples:
- She comes from a very musical family; they all play and sing well.
- He is musical and spends every evening at his piano.
