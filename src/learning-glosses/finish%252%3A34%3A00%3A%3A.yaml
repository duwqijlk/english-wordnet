simpleMeaning: Eat every bit of the food that was put on your plate or set on the table.
scope: Eating up all the food on your plate or the table only; not a surface's texture, not the point
  or time at which something stops, not top quality, not the place where a race ends, not the race that
  concludes a contest, not someone's downfall, not an event that ends something, not a wine's aftertaste,
  not the noun naming the act of completing something, not ending something in general, not finally doing
  something, not coming to an end, not giving a surface a coating, and not ending a relationship with
  someone.
examples:
- He finished his peas without complaining.
- If you finish your dinner, you can have dessert.
