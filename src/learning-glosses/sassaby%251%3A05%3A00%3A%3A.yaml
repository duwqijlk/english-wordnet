simpleMeaning: a big antelope from South Africa, thought to be the fastest animal with hooves
scope: 'Also called a topi: a large antelope from South Africa, not a small deer and not a horse.'
examples:
- A sassaby raced across the plain ahead of the herd.
- The sassaby is known as the fastest hoofed animal of its home.
