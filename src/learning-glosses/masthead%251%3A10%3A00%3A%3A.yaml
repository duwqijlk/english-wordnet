senseId: 'masthead%1:10:00::'
synsetId: 06356216-n
simpleMeaning: the name of a newspaper or magazine, usually printed on the front page and on the page
  with opinion pieces
scope: This is the printed name of a newspaper or magazine; it is not the list printed in every issue
  that gives the name of the newspaper or magazine and the names of the people who write and prepare it.
examples:
- The masthead at the top of the front page says 'The Daily News'.
- The magazine gave its masthead a new, larger look on the front page.
