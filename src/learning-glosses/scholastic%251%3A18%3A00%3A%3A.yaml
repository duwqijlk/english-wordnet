simpleMeaning: a person who cares too much about set rules and learning from books, more than those things
  are worth
scope: Also called bookworm and pedant. This is a person who cares too much about set rules and book learning,
  not the sense about an old way of school thinking, and not just any hard-working student.
examples:
- The old scholastic cared more about the exact rules of grammar than about good writing.
- He was a scholastic who spent his days arguing about small points in old books.
