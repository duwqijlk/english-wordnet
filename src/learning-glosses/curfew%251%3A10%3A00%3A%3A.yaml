simpleMeaning: A signal, usually a bell, that tells people the night-time rules keeping them indoors have
  begun.
scope: A signal, usually a bell, that tells people the night-time rules have begun, not the time when
  the signal sounds.
examples:
- The curfew rang out over the town at nine.
- When the curfew sounded, the streets emptied fast.
