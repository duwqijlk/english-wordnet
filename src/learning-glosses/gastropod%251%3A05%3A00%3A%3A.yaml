simpleMeaning: With a head that has eyes on stalks and a flat foot of muscle, this class of mollusks,
  soft-bodied animals, usually has a one-piece coiled shell.
scope: Also called a univalve, this is a class of mollusks with a one-piece coiled shell and a flat foot
  of muscle.
examples:
- The gastropod moved on its flat foot.
- A gastropod's shell was coiled in one piece.
