senseId: peremptory%5:00:00:domineering:00
synsetId: 00791150-s
simpleMeaning: too sure of yourself in a rude way, or ready to use power over others, power that is usually
  not yours by right
scope: 'Also called bossy, autocratic, dominating, and magisterial: rude and too sure of yourself, or
  using power over others; not the sense that means not allowing anyone to say no or refuse.'
examples:
- His peremptory manner upset the staff, as if he had the right to order everyone around.
- She spoke in a peremptory way and expected the workers to obey at once.
