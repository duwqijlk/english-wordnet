simpleMeaning: a place, often outdoors or in a hall, where people sell food and other goods from stalls.
scope: It is not the idea of buying and selling in general, not the demand for a product, and not a shop;
  it is a place with stalls where food and goods are sold.
examples:
- We bought fresh fish and vegetables at the market.
- The market opens early on Saturday mornings.
