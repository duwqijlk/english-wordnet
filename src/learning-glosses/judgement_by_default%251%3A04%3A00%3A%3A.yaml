simpleMeaning: In law, a court ruling for the person who brought the case, given when the other side does
  not come to court.
scope: This is a court ruling for the person who brought the case when the other side does not come to
  court; judgment by default, default judgement and default judgment are other names for it, not a ruling
  made before any trial because the facts are not in dispute.
examples:
- The judge gave a judgement by default because the defendant never came to court.
- After the defendant failed to appear, the court entered a judgement by default in her favour.
