simpleMeaning: In physics, small bits called gauge bosons carry energy between tiny bits of matter, between
  a bit and a field of force, or between two fields of force
scope: Also called interaction, the way energy moves between tiny bits of matter in physics, not the way
  people act with each other.
examples:
- The fundamental interaction between the two particles was carried by gauge bosons.
- Physicists study each fundamental interaction to learn how energy moves.
