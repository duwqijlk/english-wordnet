simpleMeaning: Cloth comes out stiff when this mix is added to clothes as they are washed
scope: 'Also called fabric stiffener: a mix put into the wash to make cloth stiff, not soap and not a
  softener.'
examples:
- She added laundry stiffener to the wash so the shirts would hold their shape.
- This laundry stiffener makes the collars stand up straight.
