senseId: 'black_tongue%1:26:00::'
synsetId: 14335228-n
simpleMeaning: A harmless change caused by some drugs that fight germs, in which small bumps on the mouth
  part used for tasting grow dark and thick.
scope: This is a harmless dark change on the mouth part used for tasting caused by drugs; furry tongue
  and hairy tongue are other names for this sense, not a sore or a lasting illness of the mouth.
examples:
- His black tongue cleared up a week after he stopped the drug.
- The doctor said the black tongue was a harmless side effect of the drug.
