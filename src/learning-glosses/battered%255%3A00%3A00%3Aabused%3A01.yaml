simpleMeaning: showing signs of harm to the body and to the feelings, after being hurt again and again
scope: This is about a person who shows harm after repeated hurt, not about a thing that is damaged by
  hits or hard use.
examples:
- The battered child was quiet and afraid of loud voices.
- The battered woman told the doctor about years of attacks at home.
