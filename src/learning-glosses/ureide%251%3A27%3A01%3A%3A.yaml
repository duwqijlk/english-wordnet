simpleMeaning: Any member of a group of compounds made from urea (a waste product found in urine) by attaching
  an acid group.
scope: A broad chemical family built on urea, not urea itself and not a simple protein.
examples:
- Some ureides occur naturally in plants.
- The sample was identified as a ureide rather than a simple amide.
