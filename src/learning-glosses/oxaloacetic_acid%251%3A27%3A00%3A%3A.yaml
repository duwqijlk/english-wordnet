simpleMeaning: An acid the body makes while breaking down fats and carbohydrates, formed when maleic acid
  takes up oxygen.
scope: This acid is also called oxalacetic acid, and the body makes it while breaking down fats and carbohydrates.
examples:
- The oxaloacetic acid forms when maleic acid takes up oxygen.
- The body uses oxaloacetic acid when it breaks down fats.
