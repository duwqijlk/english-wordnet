simpleMeaning: A flat mark on the skin from birth, pink to purple in colour
scope: A flat pink-to-purple mark on the skin from birth, also called a port-wine stain; not a raised
  mark and not a mark that comes later in life.
examples:
- The baby was born with a nevus flammeus on her cheek.
- His nevus flammeus is a flat purple mark that has been there since birth.
