simpleMeaning: The clock setting in the 11th zone west of Greenwich, set at the 165th line west; used
  in the Midway Islands.
scope: This clock setting for the 11th zone west of Greenwich, also called Bering Time, is set at the
  165th line west for the Midway Islands.
examples:
- Bering Standard Time is used in the Midway Islands.
- The ship's clock was set to Bering Standard Time.
