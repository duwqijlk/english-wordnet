simpleMeaning: the cover, often paper or clear thin plastic, that goes round a thing
scope: The cover, often paper or clear thin plastic, round a thing, not a sandwich rolled in flat bread
  and not a cloak folded round a person.
examples:
- He tore off the wrap and opened the gift.
- The wrap kept the sandwiches fresh.
