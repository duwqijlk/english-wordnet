simpleMeaning: A one-year plant with small single pink flowers, first of Europe but now settled widely
  in wet places.
scope: This is a one-year plant of wet places, not the tall marsh loosestrife of the same genus; grass
  poly and hyssop loosestrife are other names for it.
examples:
- Lythrum hyssopifolia grows in the damp field.
- The Lythrum hyssopifolia by the ditch has small pink flowers.
