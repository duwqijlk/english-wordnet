simpleMeaning: having no backbone in the body
scope: 'Also called invertebrate: this is about an animal with no backbone in its body, not about a plant
  with no sharp points and not about a person with no courage.'
examples:
- Worms are spineless animals with long, soft bodies.
- A jellyfish is spineless and has no hard parts inside.
