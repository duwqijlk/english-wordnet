simpleMeaning: the surface the sky seems to have, like the inside of a ball, where the sun, moon, stars
  and other things in space seem to lie
scope: 'Also called the heavens, the sphere, the firmament, the empyrean, the celestial sphere and the
  vault of heaven: the surface the sky seems to have, not the real sky itself and not the air close to
  the ground.'
examples:
- The poet looked up at the welkin and saw the stars spread across it.
- In the old poem, the welkin glowed red at dawn.
