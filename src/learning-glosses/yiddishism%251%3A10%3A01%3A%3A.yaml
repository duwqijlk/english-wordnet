senseId: 'yiddishism%1:10:01::'
synsetId: 92462525-n
simpleMeaning: A way of speaking from Yiddish, above all a Yiddish turn of phrase that shows up in another
  tongue.
scope: This covers a Yiddish word or turn of phrase used in another tongue, and it is not the Yiddish
  language itself.
examples:
- '''Schmooze'' is an example of a Yiddishism.'
- His English was full of Yiddishisms.
