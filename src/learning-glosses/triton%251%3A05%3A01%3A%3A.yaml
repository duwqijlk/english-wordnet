simpleMeaning: Part of its life in water and part on land, this small salamander, most often bright in
  colour, is found in North America, Europe, and northern Asia.
scope: Also called newt, this small salamander lives part of its life in water, not the sea snail of the
  same name.
examples:
- The triton moved between the water and the land.
- A triton with bright colours rested at the water's edge.
