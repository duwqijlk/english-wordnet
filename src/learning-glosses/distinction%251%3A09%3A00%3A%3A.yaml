simpleMeaning: Seeing how two things differ from each other, by looking at what each one is like.
scope: Telling things apart by what each one is like, not an honour given for success and not high standing.
examples:
- He could see no distinction between the two coats.
- The law makes a clear distinction between theft and fraud.
