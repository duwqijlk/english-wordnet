simpleMeaning: A thick skin round the mammal egg, which one sperm can pierce in making new life, usually
  round the egg once set, until it beds in the womb wall.
scope: 'Of the mammal egg: a thick skin pierced by one sperm, staying round the egg until it beds in the
  womb wall.'
examples:
- A zona pellucida ringed the egg.
- Zonae pellucidae stay round the egg.
