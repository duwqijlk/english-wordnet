simpleMeaning: a way of measuring how much of a substance that takes away sourness is in a sample, by
  how much sour liquid of known strength is used
scope: A way of measuring how much of a substance that takes away sourness is in a sample, by how much
  sour liquid of known strength is used, not a test of sourness itself and not a way of making such a
  substance.
examples:
- The lab used acidimetry to find how much base was in the sample.
- With acidimetry, she measured the base in the water sample.
