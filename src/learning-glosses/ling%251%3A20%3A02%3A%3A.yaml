simpleMeaning: a kind of water chestnut whose fruit is covered with sharp points and has two points instead
  of four
scope: A water plant whose fruit has sharp points and has two points, not four; not either of the fish
  called ling, and not the low heath plant also called ling.
examples:
- Ling grows in the shallow water at the edge of the lake.
- The fruit of the ling has two sharp points.
