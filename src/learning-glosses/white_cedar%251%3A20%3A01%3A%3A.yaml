simpleMeaning: A slow-growing tree of middle size on the east coast of the United States, much like the
  American arborvitae.
scope: A slow-growing tree of middle size on the east coast of the United States; coast white cedar, southern
  white cedar and white cypress are other names for this sense, not the small evergreen with tiny scale-like
  leaves, which is another sense of the same word.
examples:
- The white cedar grows slowly on the east coast of the United States.
- This white cedar looks much like the American arborvitae.
