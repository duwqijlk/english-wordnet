simpleMeaning: a sore swelling of body tissue, most of all just under the skin, with fever, redness and
  pain
scope: A sore swelling of body tissue, most of all just under the skin, with fever, redness and pain,
  not a cut and not a rash on the skin alone.
examples:
- Cellulitis made her leg red, swollen and painful.
- The doctor gave him medicine for the cellulitis in his arm.
