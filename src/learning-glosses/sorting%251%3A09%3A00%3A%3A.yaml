simpleMeaning: the basic way the mind puts things into groups or kinds
scope: The mind's act of putting things into groups, not the sorting of mail or goods by a set rule.
examples:
- Sorting the animals into groups helps young children learn how things go together.
- The sorting of words by meaning is a basic skill in school.
