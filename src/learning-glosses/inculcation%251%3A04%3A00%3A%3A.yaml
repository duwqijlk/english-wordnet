simpleMeaning: The act of fixing an idea or value in a person's mind by teaching it again and again
scope: This is the act of fixing an idea or value in a person's mind by teaching it again and again, also
  called ingraining or instilling, and not a single lesson.
examples:
- The inculcation of good manners took years of patient teaching.
- Through constant inculcation, the value of honesty became part of how she thought.
