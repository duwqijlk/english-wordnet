senseId: 'pretentious%3:00:00::'
synsetId: 01855216-a
simpleMeaning: showing or saying that a person or thing is important or special, often when this is not
  really true
scope: This is about a person or thing that is made to seem important or special, often when it is not
  really so. Not about a cheap and showy display.
examples:
- He gave a pretentious speech to show how important he thought he was.
- The pretentious house was built to impress guests, not because the family needed so much room.
