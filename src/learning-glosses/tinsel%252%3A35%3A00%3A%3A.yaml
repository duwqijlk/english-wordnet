senseId: 'tinsel%2:35:00::'
synsetId: 01522079-v
simpleMeaning: to weave thin, shiny threads that have metal on them in and out among other threads
scope: This means weaving shiny metal threads into cloth or other material, not the shiny thread itself
  and not just putting that thread on top to make something look pretty.
examples:
- She tinseled the cloth, weaving shiny threads through it as she made it.
- The workers tinsel the silk by weaving bright threads in with the plain ones.
