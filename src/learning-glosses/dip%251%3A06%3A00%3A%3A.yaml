simpleMeaning: a candle made by putting a wick, the string in its middle, again and again into hot melted
  wax or animal fat
scope: This is a candle made in that way; it is not a sauce for food, not a sudden fall in an amount,
  and not the act of putting something into liquid.
examples:
- She lit a dip and placed it on the table.
- He made a dip by hand to use on winter nights.
