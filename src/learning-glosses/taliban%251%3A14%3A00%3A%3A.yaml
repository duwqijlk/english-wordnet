simpleMeaning: A strict Muslim armed group; in 1995 it took over Afghanistan, and in 1996 it took Kabul
  and set up a Muslim government.
scope: 'Also called Taleban: a strict Muslim armed group that took over Afghanistan in 1995 and Kabul
  in 1996 and set up a Muslim government, not a peaceful party and not an army of another land.'
examples:
- The Taliban took Kabul in 1996.
- The Taliban set up a Muslim government in Afghanistan.
