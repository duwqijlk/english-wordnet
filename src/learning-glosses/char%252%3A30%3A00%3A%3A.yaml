simpleMeaning: to burn a thing a little, only on the outside, so that its color changes
scope: To burn a little on the outside only, also called blacken, scorch and sear; not the small fish
  with the same name.
examples:
- The cook charred the top of the fish a little.
- The fire charred the wood on the outside.
