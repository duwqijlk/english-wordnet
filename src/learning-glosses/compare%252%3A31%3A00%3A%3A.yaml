simpleMeaning: to look at two or more things and mark how they are alike or not alike
scope: To look at things and mark how they are alike or not alike, not to say one thing is like another
  and not to make -er forms.
examples:
- She compared the two coats and picked the warmer one.
- They compared prices at three shops before they bought the bike.
