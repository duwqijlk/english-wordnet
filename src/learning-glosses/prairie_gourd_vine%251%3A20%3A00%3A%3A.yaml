simpleMeaning: In dry parts of the middle and southwest United States and Mexico, a climbing growth lives
  for years, bearing small hard green fruit with pale marks that cannot be eaten.
scope: Another name for prairie gourd, buffalo gourd, calabazilla, and wild pumpkin, this names the climbing
  growth itself, not the small hard green fruit it bears.
examples:
- The prairie gourd vine grew along the dry bank.
- The prairie gourd vine bore small green fruit in the dry field.
