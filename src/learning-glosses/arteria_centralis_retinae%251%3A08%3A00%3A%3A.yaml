simpleMeaning: Going into the eyeball together with the nerve of sight, a side tube off the blood tube
  of the eye feeds the middle of the retina
scope: This middle blood tube of the retina is also called the central artery of the retina.
examples:
- The arteria centralis retinae enters the eyeball together with the nerve of sight.
- Blood reaches the retina through the arteria centralis retinae.
