simpleMeaning: the front end of the line where the two bones of the nose join
scope: The front tip of the join between the two nose bones, not the tip of the nose itself and not the
  bridge of the nose.
examples:
- The surgeon marked the rhinion before shaping the nose.
- The fracture ran close to the rhinion, where the nose bones meet.
