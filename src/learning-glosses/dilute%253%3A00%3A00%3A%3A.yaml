simpleMeaning: less strong, with less of the main part in it, lower in quality, or less pure
scope: 'Another name for this sense is diluted: it describes a mix that is already weak, not the act of
  making a mix weaker, and not making a mix less pure by adding a worse thing.'
examples:
- The dilute juice tasted weak and watery.
- Handle the dilute acid with care.
