simpleMeaning: A common black jumping insect of America that eats farm plants and also comes into houses.
scope: A common black jumping insect of America that eats farm plants and also comes into houses; not
  a green grasshopper and not a house cricket that lives only indoors.
examples:
- A field cricket sang from the corner of the room all night.
- Field crickets ate the young corn in the garden.
