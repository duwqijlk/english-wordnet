synsetId: 02602211-a
simpleMeaning: 'Said of an angle: sticking out, with the two sides meeting at less than 180 degrees.'
scope: Said of angles that stick out at less than 180 degrees, not the heraldic use for an animal shown
  leaping forward.
examples:
- The angle where the two walls met was salient, pointing outward.
- At the corner, the wall was salient, sticking out into the path.
