simpleMeaning: A small shrub from scrub and dry woodland in southern Europe and North Africa, grown for
  its showy flowers and soft, often hairy, fragrant leaves that stay green all year.
scope: Another name for rockrose, a shrub grown for its showy flowers; not a garden rose, and not the
  low sun roses that also carry this name.
examples:
- A rock rose grew beside the path, covered in showy flowers.
- Gardeners value rock rose for its evergreen leaves.
