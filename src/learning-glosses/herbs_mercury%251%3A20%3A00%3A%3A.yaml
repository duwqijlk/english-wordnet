simpleMeaning: A one-year plant from Europe and Africa, now a weed in America, once dried as a medicine
  to clear the bowels, make water pass, or treat syphilis.
scope: Also called boys-and-girls and herb mercury, this is a one-year plant from Europe and Africa, now
  a weed in America, not a plant still used as medicine.
examples:
- Herbs mercury grew wild behind the barn.
- Herbs mercury was once dried for use as a purgative.
