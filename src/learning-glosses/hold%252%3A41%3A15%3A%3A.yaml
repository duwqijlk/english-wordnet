simpleMeaning: make something less strong or less intense; soften it, keep it under control, and stop
  it from going too far
scope: This means making a feeling, force, or activity weaker or more controlled, not carrying something
  in your hands.
examples:
- She struggled to hold back her anger during the meeting.
- He held his temper long enough to finish the speech.
