simpleMeaning: a blood illness that does not get better with treatment, marked by young red blood cells
  holding iron in the soft inner part of bones
scope: A blood illness that does not get better with treatment, also called sideroblastic anaemia, sideroblastic
  anemia, or siderochrestic anaemia; not a blood illness from too little iron and not a short illness
  of the blood.
examples:
- The doctor said she had siderochrestic anemia.
- Siderochrestic anemia does not get better with the usual treatment.
