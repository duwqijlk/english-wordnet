simpleMeaning: A mistake in printed words caused by some kind of machine failure.
scope: 'Another name for a literal, a typo, a misprint and an erratum: a mistake in print caused by a
  machine failing, not a mistake made by the writer and not a wrong fact.'
examples:
- The book had a literal error on page ten, where the name was spelled wrong.
- She spotted a literal error in the newspaper and wrote to the editor.
