simpleMeaning: an unseen power no one can guess or plan for, that makes a thing turn out one way and not
  another
scope: 'Also called chance, luck, and fortune: the unseen power that makes things turn out one way and
  not another, not a source of danger.'
examples:
- They ran into each other by pure hazard, after years apart.
- It was hazard, not skill, that won him the game.
