simpleMeaning: Secret facts are given out without leave, most of all on purpose
scope: Secret facts given out without leave, most of all on purpose; leak is another name for this sense,
  not an official release and not a mistake in a pipe.
examples:
- The news leak told the papers about the secret talks.
- A news leak from inside the office gave out the plan before it was ready.
