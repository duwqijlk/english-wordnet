simpleMeaning: to perform with a delicate, instinctive feel for rhythm.
scope: Playing music with a delicate, instinctive rhythm, not the music having a certain rhythm or a jaunty
  musical rhythm, and not walking with a side-to-side sway.
examples:
- The band began to swing once the bass player found the groove.
- She knows how to swing without rushing the beat.
