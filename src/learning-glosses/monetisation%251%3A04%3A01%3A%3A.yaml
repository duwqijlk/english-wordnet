senseId: 'monetisation%1:04:01::'
synsetId: 00155509-n
simpleMeaning: The money a country by law must take is what a thing, such as gold or silver, is made into
scope: 'Also called monetization: making a thing the money a country must take by law, not printing paper
  notes and not fixing a price for gold.'
examples:
- The monetisation of silver made it the legal tender of the land.
- After the monetisation of gold, shops had to take gold coins.
