simpleMeaning: A stop worked by hand, most often through linked rods or cords.
scope: A hand-worked stop that holds a car still, also called emergency, emergency brake and hand brake;
  not the foot stop used while driving.
examples:
- She set the parking brake before leaving the car.
- The parking brake held the car on the hill.
