simpleMeaning: A drug that kills germs, a penicillin made partly by chemists and taken by mouth, used
  to treat infections caused by bacteria.
scope: Also called amoxicillin, Amoxil, Augmentin, Larotid and Trimox; a penicillin drug taken by mouth
  to treat infections caused by bacteria.
examples:
- The doctor gave Polymox for the ear infection.
- Polymox cleared the bacterial infection within a week.
