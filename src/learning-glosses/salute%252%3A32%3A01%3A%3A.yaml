scope: 'Also called present: in the military, to greet with the official movement and stand as the rules
  say; not the friendly greeting with words, a bow, or lifting a hat.'
examples:
- When the officer arrived, the soldiers saluted at once.
- The young soldier saluted and stood straight in the position the rules required.
