schema: oewn-learning-gloss-v2
senseId: 'generalization%1:09:03::'
synsetId: 05788101-n
simpleMeaning: The act of working out broad ideas by taking what a number of cases have in common.
scope: Also called abstraction or generalisation, the act of working out broad ideas from what cases have
  in common; not reasoning from detailed facts to general principles, not the carrying over of a learned
  response to a similar stimulus, and not an idea or conclusion with general application.
examples:
- Generalization lets us form broad ideas from single cases.
- The child learned by generalization, taking what one case showed and using it for others.
