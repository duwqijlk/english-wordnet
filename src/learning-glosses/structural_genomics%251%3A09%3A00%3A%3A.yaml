simpleMeaning: the part of the study of the whole set of genes that works out the shape of proteins, the
  building stuff of living things, in all three directions
scope: The part of the study of the whole set of genes that works out protein shapes; not the study of
  single genes and not the study of how genes are passed on.
examples:
- Structural genomics maps the shapes of proteins.
- They used structural genomics to work out the shape of the new protein.
