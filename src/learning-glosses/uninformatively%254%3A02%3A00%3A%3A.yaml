simpleMeaning: in a way that gives little or no useful news
scope: In a way that gives little or no useful news, not in a full and clear way and not by staying silent.
examples:
- '''I can''t tell you when the manager will arrive,'' he said rather uninformatively.'
- She answered uninformatively, leaving the question open.
