simpleMeaning: In maths, a set whose joining rule stays inside the set, gives the same result however
  joins are bracketed, has a do-nothing member, and lets each member be undone
scope: In maths, a set with a joining rule that stays inside the set, also called group; not a set of
  things with no joining rule, and not a ring.
examples:
- A mathematical group must have a do-nothing member.
- In class we checked whether the set was a mathematical group.
