simpleMeaning: A fat molecule made by adding hydrogen to an unsaturated (naturally bent) fat, which straightens
  its shape; it occurs in margarine, fried foods, baked goods and partly hardened vegetable oils.
scope: This is the altered fat with a straightened shape, not an ordinary unsaturated fat or a fully saturated
  one.
examples:
- Margarine and many fried foods contain trans fatty acids that doctors advise people to limit.
- Labels must list trans fatty acid content, so shoppers can compare margarine with butter.
