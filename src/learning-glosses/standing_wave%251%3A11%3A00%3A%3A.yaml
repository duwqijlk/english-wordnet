senseId: 'standing_wave%1:11:00::'
synsetId: 07361372-n
simpleMeaning: a wave, as a sound wave in a room or an electric wave in a wire, whose height at one place
  keeps the same relation to its height elsewhere
scope: 'Also called a stationary wave: a wave whose shape stays fixed in place, not a travelling wave
  that moves along and not a pulse that passes once.'
examples:
- The standing wave in the organ pipe held its shape while the note sounded.
- A standing wave formed in the wire when the signal bounced back.
