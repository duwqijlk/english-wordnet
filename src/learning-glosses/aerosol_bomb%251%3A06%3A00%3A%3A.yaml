simpleMeaning: A holder that keeps what is inside under pressure and lets it out as a fine mist, often
  with the help of a gas.
scope: A holder that keeps what is inside under pressure and lets it out as a fine mist, also called an
  aerosol, an aerosol can, and an aerosol container; not a pump that needs a hand squeeze and not an open
  jar.
examples:
- He shook the aerosol bomb before spraying the paint.
- An aerosol bomb lets out a fine mist at the touch of a button.
