simpleMeaning: The most common passed-down sickness, in which a child's lungs, gut, and juice-making gland
  clog with thick slime through a flaw in one gene, with no known cure.
scope: This sense is also called fibrocystic disease of the pancreas, mucoviscidosis, and pancreatic fibrosis,
  for the most common passed-down sickness, in which a child's lungs, gut, and juice-making gland clog
  with thick slime through a flaw in one gene, with no known cure.
examples:
- Cystic fibrosis clogs the lungs with mucus.
- The child with cystic fibrosis needed care.
