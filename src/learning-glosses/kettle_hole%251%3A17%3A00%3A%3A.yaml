simpleMeaning: In geology, a lake most times sits in a dip in the ground where a block of ice caught in
  earth and stones from moving ice has melted away.
scope: A kettle is another name for this hollow in the ground, made when trapped ice melts and leaves
  a place that can fill with water.
examples:
- The kettle hole was full of water.
- We walked round the edge of a kettle hole.
