simpleMeaning: a person who has skill in giving one kind of treatment that helps people with health or
  mind problems
scope: This sense is a person trained in one kind of treatment; it is not the treatment itself and not
  a general doctor.
examples:
- She sees a therapist every week for help with stress.
- The therapist taught him ways to move his arm again after the injury.
