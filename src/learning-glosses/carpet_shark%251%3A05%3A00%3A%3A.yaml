simpleMeaning: a sea fish of the western Pacific with a flat body and skin marked with spots of mixed
  colours
scope: A flat-bodied sea fish of the western Pacific with spotted skin, not a fish of the Atlantic and
  not a round-bodied hunting fish.
examples:
- The carpet shark lay flat on the sand in the shallow water.
- We saw a carpet shark with spotted skin near the reef.
