simpleMeaning: From warm parts of America comes a roundish fruit, white to almost black, that people turn
  into jam.
scope: Also called coco plum and icaco, it is the fruit of a small tree in warm parts of America, not
  the tree itself.
examples:
- Cocoa plum jam was made from the dark fruit.
- They picked cocoa plums for preserves.
