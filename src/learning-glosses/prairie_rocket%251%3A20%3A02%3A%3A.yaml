simpleMeaning: Big yellow flowers grow on one of several plants of the Erysimum kind, from North America
scope: One of several plants with big yellow flowers from North America, of the Erysimum kind; not the
  western American plant of the Cheiranthus kind that shares its name.
examples:
- The prairie rocket in the garden had big yellow flowers.
- We saw a prairie rocket growing by the road in North America.
