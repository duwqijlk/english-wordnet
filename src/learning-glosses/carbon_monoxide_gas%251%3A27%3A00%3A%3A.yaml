scope: A poison that moves through the air with no smell, made when a fuel burns without enough air; carbon
  monoxide is another name for this sense, not smoke and not the gas that plants take in.
examples:
- Carbon monoxide gas has no smell and can kill.
- The faulty heater filled the room with carbon monoxide gas.
