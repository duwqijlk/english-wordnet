simpleMeaning: the state of not getting the gas in air that the body needs to live, for example when breathing
  is stopped
scope: 'Also called asphyxiation: the body is stopped from getting the air it needs, not just a short
  feeling of being unable to breathe well.'
examples:
- He died of suffocation after smoke filled the room.
- Suffocation can happen if something covers the nose and mouth and stops breathing.
