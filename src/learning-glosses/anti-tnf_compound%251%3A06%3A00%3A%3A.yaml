simpleMeaning: A kind of drug that blocks the work of a body chemical called tumour necrosis factor, used
  for rheumatoid arthritis because that chemical starts inflammation in the joints
scope: One of several kinds of drugs used for rheumatoid arthritis, set apart by blocking the body chemical
  called tumour necrosis factor, which starts inflammation in the joints.
examples:
- The doctor prescribed an anti-TNF compound for her arthritis.
- An anti-TNF compound blocks the chemical that causes inflammation in the joints.
