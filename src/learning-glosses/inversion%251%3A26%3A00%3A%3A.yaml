simpleMeaning: A wrong state of the body in which an organ turns inwards or inside out, as when the top
  of the womb is pulled into the birth canal after childbirth.
scope: A body organ turned inward or inside out, not a tune turned upside down, not a chemical change
  in light, not a change in the order of genes, not taking on the other sex's role, and not a layer of
  cool air under warm air.
examples:
- Inversion of the womb is rare after childbirth.
- The doctor treated the inversion at once.
