simpleMeaning: An acid drug that kills germs, with many double bonds, made from a soil germ (an actinomycete).
scope: A drug acid from a soil germ, not a drug from a mould and not a drug that kills all germs.
examples:
- The lab tested mycomycin against the germ.
- Mycomycin was made from a soil germ.
