simpleMeaning: 'Cabinetwork and dyeing both use this tree of India and the East Indies: its hard wood
  smells sweet, and its deep-coloured inner wood dyes cloth'
scope: 'Also called red sandalwood, red sanderswood, and red saunders: a tree of India and the East Indies
  whose hard wood is loved for fine furniture and whose inner wood dyes cloth.'
examples:
- Red sanders grows in India, and its hard wood is loved for fine furniture.
- The dyer used red sanders to colour the cloth a deep shade.
