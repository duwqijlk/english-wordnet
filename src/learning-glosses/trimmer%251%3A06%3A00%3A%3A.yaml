simpleMeaning: A beam in a floor or roof that holds the end of another beam, so there can be an opening
  for stairs, a chimney, and so on
scope: 'The beam sense, also called trimmer joist: a beam that holds another beam in a floor or roof.
  Not the small electrical part for fine changes, and not a worker who cuts trees and bushes.'
examples:
- The carpenter fitted a trimmer to support the opening for the stairs.
- The trimmer carries the end of the header beside the chimney opening.
