simpleMeaning: One sudden touch on someone, made with a finger or an elbow
scope: 'Also called a dig: one sudden touch on a person with a finger or an elbow, not the verb sense
  of poking or thrusting and not a punch with short quick blows.'
examples:
- She gave him a jab in the ribs to get his attention.
- The jab in my side made me turn around at once.
