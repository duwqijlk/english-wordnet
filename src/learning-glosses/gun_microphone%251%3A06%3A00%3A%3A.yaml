simpleMeaning: From far away, a person can point this long tube to pick up sound from just one place
scope: 'Also called gun mike: a sound tool pointed from far off at one place, not an ordinary room microphone
  and not a hearing aid.'
examples:
- The crew set up a gun microphone to catch the actor's words from across the field.
- With a gun microphone, she could pick up the bird's call from the far side of the lake.
