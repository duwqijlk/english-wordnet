simpleMeaning: A plant with fleshy roots and upright stems, narrow juicy leaves, one reddish-orange flower
  in each upper leaf joint; from the southwestern United States; Indians once cooked its roots.
scope: Also called flame-flower, flame flower and flameflower; a plant of the southwestern United States
  with fleshy roots that Indians once cooked and one reddish-orange flower in each upper leaf joint.
examples:
- Talinum aurantiacum grew in the dry garden.
- The reddish-orange flower of Talinum aurantiacum opened in the morning.
