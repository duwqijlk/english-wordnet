simpleMeaning: To put it in grave and formal words that a thing is true
scope: 'Also called swear, swan, and verify: stating in a solemn, formal way that a thing is true, not
  standing up for one''s own views and rights and not merely putting forward a claim.'
examples:
- He asserted his innocence before God and the court.
- The witness asserted under oath that she had seen the man.
