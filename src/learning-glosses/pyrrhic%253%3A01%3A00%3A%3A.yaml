simpleMeaning: Like Pyrrhus and his deeds, above all winning a fight at such a great cost that the win
  is hardly worth it.
scope: Like Pyrrhus and his deeds, above all a win bought at such a great cost that it is hardly worth
  it.
examples:
- 'It was a pyrrhic win: they held the town but lost most of their men.'
- The pyrrhic victory cost them more than it gained.
