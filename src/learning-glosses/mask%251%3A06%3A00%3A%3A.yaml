simpleMeaning: something worn over the face to hide who a person is
scope: A covering worn to hide the face and who you are; not a covering worn to keep the face safe, and
  not a party where guests wear such coverings.
examples:
- The thief wore a mask so that no one could see his face.
- She put on a cat mask to hide who she was at the party.
