simpleMeaning: The extra amount that something in short supply is worth, above the value set for it
scope: This is the extra amount that something in short supply is worth, above the value set for it, not
  a fee for changing money and not a prize given to buyers.
examples:
- They paid a premium for water during the drought.
- Tickets sold at a premium because the show was sold out.
