simpleMeaning: any substance made of oxygen joined with another element (a basic pure substance) or with
  a radical (a group of atoms that acts as one unit)
scope: This is a substance made from oxygen joined with something else, not oxygen on its own and not
  a substance with no oxygen in it.
examples:
- Rust is an oxide that forms on iron left in wet air.
- The white powder was a metal oxide used in the factory.
