simpleMeaning: In Norse myth, one of Odin's maidens who picked the heroes to die in battle and led them
  to Valhalla
scope: A maiden of Odin in Norse myth, not a mortal warrior; she chooses which heroes die in battle and
  leads them to Valhalla.
examples:
- The Valkyrie chose the fallen hero and led him to Valhalla.
- A Valkyrie flew down to the battlefield to choose the bravest of the fallen.
