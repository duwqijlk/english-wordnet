simpleMeaning: Ordinary right and wrong mean nothing to this person, who holds that no such line exists
  at all.
scope: This person holds that ordinary distinctions between right and wrong are invalid.
examples:
- The amoralist said right and wrong were not real lines at all.
- The amoralist treated good deeds and bad ones as the same.
