simpleMeaning: an area of land on both sides of the line that divides one country or area from another
scope: The land on both sides of a dividing line, not the line itself and not land deep inside one country.
examples:
- The borderland between England and Wales has towns that look to both sides.
- People in the borderland often cross to work in the next country.
