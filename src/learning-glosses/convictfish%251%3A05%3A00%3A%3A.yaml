simpleMeaning: a kind of sea creature called a greenling, pale in colour and striped with black bands
  across its body
scope: A greenling, pale in colour and striped with black bands; also called convict fish and painted
  greenling, and not a prisoner or any other kind of sea creature.
examples:
- A convictfish darted between the rocks, its black bands easy to see.
- The convictfish in the photo has a pale body with black stripes across it.
