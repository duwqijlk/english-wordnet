senseId: 'covetousness%1:04:00::'
synsetId: 00759878-n
simpleMeaning: A shameful hunger for getting more and more, a want for wealth that can never be filled,
  held to be one of the deadly sins.
scope: A shameful, never-filled want for wealth, also called greed, avarice, avaritia, or rapacity, not
  mere greed for material wealth and not an envious eagerness to possess a thing.
examples:
- His covetousness for gold ruined his friendships.
- Covetousness is counted among the deadly sins.
