simpleMeaning: In law, a punishment in which a wrongdoer pays more than the loss itself to a person hurt
  by wrongdoing done on purpose or with spite
scope: Punitive damages and smart money are other names for this money paid as a punishment for wrongdoing
  done on purpose, not the money that merely pays for the loss.
examples:
- The judge gave exemplary damages because the wrong was done on purpose.
- Exemplary damages are meant to punish, not just to pay for the loss.
