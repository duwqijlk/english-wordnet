simpleMeaning: speaking or acting in a way that is not real or true to yourself, done to impress other
  people
scope: 'Also called affected: this sense is about a person speaking or acting in a way that does not feel
  real to make an effect on others, not a thing that goes against the living world or that is not normal.'
examples:
- Her unnatural laugh made everyone in the room feel uneasy.
- He spoke in an unnatural, grand way that did not sound like himself at all.
