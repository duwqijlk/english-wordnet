simpleMeaning: The act of putting out a fire or a light, making it stop burning.
scope: The act of putting out a fire or a light, also called extinction or extinguishing; not the thing
  that is put out, and not a single fire going out on its own.
examples:
- The quenching of the campfire took only a few minutes.
- Quenching the lights ended the show in darkness.
