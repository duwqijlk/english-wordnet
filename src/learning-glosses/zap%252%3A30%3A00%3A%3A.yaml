simpleMeaning: to cook or warm food in a microwave oven
scope: 'Also called microwave and nuke: to cook or warm food in a microwave oven, not to hit a target
  with guns or bombs, and not a sudden burst of energy.'
examples:
- Zap the soup for two minutes until it is hot.
- She zapped the rice in the microwave to warm it for dinner.
