simpleMeaning: in a way that shows no respect for a person or thing
scope: This means speaking or acting with no respect, not in a kind way and not in a way that shows praise.
examples:
- She looked disdainfully at the dirty room and turned away.
- He spoke disdainfully about the small village and its people.
