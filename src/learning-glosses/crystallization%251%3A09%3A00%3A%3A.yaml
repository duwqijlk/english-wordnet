senseId: 'crystallization%1:09:00::'
synsetId: 05780041-n
simpleMeaning: An idea in the mind that grows firm and clear, as if it were taking shape like a growing
  crystal.
scope: An idea that sets firm in the mind, not a rock formed from a liquid and not a sudden bright idea.
examples:
- The crystallization of her plan took months of thought.
- His crystallization of the idea came slowly, piece by piece.
