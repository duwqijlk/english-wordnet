simpleMeaning: to make something less tight, so it hangs or holds less firmly
scope: This means to make something less tight, also called slacken, not sending money, not letting someone
  off a debt, and not sending a court case to another court.
examples:
- She remitted the tight cord until it hung loose.
- He remitted his hold on the rope and let it slide a little.
