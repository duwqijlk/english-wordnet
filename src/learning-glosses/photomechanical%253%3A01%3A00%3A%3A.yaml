simpleMeaning: To do with ways of using pictures made by light to make the flat blocks used in printing.
scope: To do with ways of using pictures made by light to make the flat blocks used in printing; not the
  technique itself and not ordinary printing.
examples:
- Photomechanical methods turned the photo into a printing plate.
- The photomechanical process saved hours in the print shop.
