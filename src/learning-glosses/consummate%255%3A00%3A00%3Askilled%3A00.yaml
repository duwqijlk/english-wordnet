simpleMeaning: having or showing the highest level of skill at something
scope: 'Also called masterful, masterly and virtuoso: having the highest skill, not the sense that means
  complete, as in a complete fool or a complete lie.'
examples:
- She is a consummate musician who plays with great ease.
- As a consummate cook, he can make a hard dish look easy.
