simpleMeaning: After a hurt, a swelling, or an infection, a lump forms, made of the new soft stuff that
  grows over a wound.
scope: This names a lump made of the new soft stuff that grows over a wound, one that forms only after
  a hurt, a swelling, or an infection.
examples:
- A granuloma formed where the skin had been hurt.
- The granuloma grew after an infection.
