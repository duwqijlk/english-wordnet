simpleMeaning: Cattle stagger and grow restless when this deadly illness harms the brain and the cord
  down the back.
scope: Also called mad cow disease, this deadly illness of cattle harms the brain and the cord down the
  back and makes the animal stagger and grow restless.
examples:
- Bovine spongiform encephalitis killed several cattle on the farm.
- Cattle with bovine spongiform encephalitis stagger and grow restless.
