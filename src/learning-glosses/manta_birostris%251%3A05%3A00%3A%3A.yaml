simpleMeaning: The largest ray of its kind, up to 22 feet wide, found worldwide, often in the Gulf of
  Mexico and off the southern United States coast, mostly out at sea.
scope: This is a very large ray, the largest of its kind, found worldwide and most often in the Gulf of
  Mexico; Atlantic manta is another name for this sense, not a smaller kind of ray that stays close to
  shore.
examples:
- We watched a Manta birostris glide through the Gulf of Mexico.
- The Manta birostris we saw was nearly 20 feet across.
