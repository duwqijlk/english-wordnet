simpleMeaning: One of three fluid-filled loops, set almost at right angles to each other, that help you
  keep your balance
scope: One of three fluid-filled loops that help you keep your balance, not the coiled part of the ear
  that hears sound and not a loop of blood vessel.
examples:
- A semicircular canal in the ear helps you keep your balance.
- Damage to a semicircular canal can make you feel dizzy.
