synsetId: 02224722-v
simpleMeaning: to take responsibility for paying for and supporting a person, event, or activity
scope: This is to pay for and support a person, event, or activity; it is not to shop at a place as a
  customer, and not a person who presents someone for an award.
examples:
- The company will sponsor the school play this year.
- They sponsored a young runner so she could train full time.
