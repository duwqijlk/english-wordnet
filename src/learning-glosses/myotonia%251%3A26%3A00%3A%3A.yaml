simpleMeaning: Muscles that stay tight for too long and loosen only slowly after they have tightened.
scope: Muscles that stay tight for too long and loosen only slowly, not a single cramp and not weak muscles.
examples:
- Myotonia made it hard for her to let go of the handle.
- His myotonia kept the muscle tight long after the contraction.
