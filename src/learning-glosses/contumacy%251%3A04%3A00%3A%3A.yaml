senseId: 'contumacy%1:04:00::'
synsetId: 01183348-n
simpleMeaning: refusing on purpose to come to court or to do what a court has ordered, which can lead
  a judge to find a person in contempt
scope: A wilful refusal to come to court or obey its order, not the general habit of defying authority
  and not a crime on its own.
examples:
- His contumacy led the judge to hold him in contempt.
- The court warned her that her contumacy would be treated as contempt.
