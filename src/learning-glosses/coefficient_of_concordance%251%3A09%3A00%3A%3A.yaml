simpleMeaning: a number that shows how much two or more lists that put the same things in order agree
  with each other
scope: This is a number that shows how far rank lists agree; not a number for how hard one thing slides
  over another and not a plain list of ranks.
examples:
- The coefficient of concordance for the three judges was high, so their lists put the books in almost
  the same order.
- She used a coefficient of concordance to check how much the two groups agreed in their rankings.
