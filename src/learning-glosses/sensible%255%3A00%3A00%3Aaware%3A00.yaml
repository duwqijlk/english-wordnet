simpleMeaning: aware of something picked up by the senses, through a feeling in the mind or through thinking
  about it
scope: This means a person is aware of something in the mind, not that a thing can be picked up by the
  eyes, ears or other senses, and not that a choice shows good judgment.
examples:
- I am sensible that much work still needs to be done.
- She was made sensible of her mistakes and said she was sorry.
