simpleMeaning: To keep the score or to mark a place, small markers that you press into a surface
scope: Small markers pressed into a surface to keep the score or mark a place, also called a pin, not
  the wooden pin itself and not the oar holder.
examples:
- He moved the peg on the scoreboard after each round.
- The pegs on the board showed where each player stood.
