simpleMeaning: A plant that lives for years and spreads into a mat, from Asia Minor; at times put in the
  genus that shares its name.
scope: This is a mat-forming herb of Asia Minor that lives for years; turfing daisy and Tripleurospermum
  oreades tchihatchewii are other names for this sense, not the low tufted herb of Turkey with small white
  flowers.
examples:
- Matricaria oreades formed a thick mat across the rock garden.
- We planted Matricaria oreades on the dry bank in Asia Minor.
