simpleMeaning: a small folded food from India, with vegetables or meat inside it, cooked in hot oil and
  served hot
scope: This is the small folded Indian food with vegetables or meat inside, not a sweet cake and not a
  plain piece of fried bread.
examples:
- We shared a plate of hot samosas with tea.
- She bit into the samosa and tasted potatoes and peas.
