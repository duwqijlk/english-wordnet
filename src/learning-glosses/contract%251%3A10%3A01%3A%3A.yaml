simpleMeaning: in the card game of bridge, the highest offer sets how many tricks the bidder must win
scope: This means the winning bid in bridge, not a legally binding agreement, the bridge variety where
  points count only for the tricks bid, or the verbs meaning to shrink, catch an illness, or make an agreement.
examples:
- She played the hand carefully and made her contract.
- A bid of four hearts became the final contract.
