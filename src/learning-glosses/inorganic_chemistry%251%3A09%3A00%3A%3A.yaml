simpleMeaning: The study of things made of joined parts that hold no bits made of hydrogen and carbon.
scope: The study of joined-part things with no hydrogen-and-carbon bits, not the study of things built
  on hydrogen and carbon.
examples:
- She took a course in inorganic chemistry.
- Inorganic chemistry deals with metals and salts.
