simpleMeaning: A plant of northern Europe and America, looking like a tiny fir tree.
scope: Also called fir clubmoss and little clubmoss; a plant of northern Europe and America that looks
  like a tiny fir tree, not a true fir and not a moss.
examples:
- Mountain clubmoss spread across the cold hillside.
- The mountain clubmoss looked like a tiny fir.
