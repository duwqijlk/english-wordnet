simpleMeaning: a tall chair for feeding a very young child, with four long legs, a place to rest the feet,
  and a tray that can be taken off
scope: This is the tall chair a very young child sits in to eat, not a normal chair for adults.
examples:
- She put the baby in his highchair for lunch.
- He wiped food off the highchair tray after dinner.
