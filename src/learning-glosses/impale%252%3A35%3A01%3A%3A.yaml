simpleMeaning: to drive a spear or a long, sharp pole through a person or animal so that it dies
scope: 'Also called stake: to kill by driving a spear or sharp pole through the body, not just to pierce
  something without killing it.'
examples:
- The enemies were impaled and left to die.
- The hunters impaled the boar on a long spear.
