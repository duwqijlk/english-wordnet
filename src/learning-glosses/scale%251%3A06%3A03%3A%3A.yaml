simpleMeaning: A metal cover of even thickness, such as the protective plate on a big gun that guards
  its crew.
scope: This is a sheet of metal fitted as armour, not one of the small hard plates on an animal's body
  and not the plant part that covers a bud.
examples:
- The old cannon still carried an iron scale that once sheltered its crew.
- Iron scales were bolted to the carriage to protect the gunners.
