simpleMeaning: A Chinese herb with leaves made of leaflets spread like a hand, small greenish flowers,
  and forked roots with a sweet smell, thought to heal the sick.
scope: The whole herb, also called nin-sin, not the root alone that is used as a medicine.
examples:
- The shop sells ginseng tea and dried roots.
- Ginseng grows wild in the mountain woods.
