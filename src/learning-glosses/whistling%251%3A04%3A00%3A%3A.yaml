simpleMeaning: the act of making a tune by blowing air out through your lips
scope: This is making a tune by blowing air through the lips, not using the same sound to call someone,
  and not the sound of fast-moving air or steam.
examples:
- Her happy whistling of an old song filled the kitchen.
- He kept whistling a tune while he worked in the garden.
