simpleMeaning: From the northwestern United States to northern California and east to Idaho, a white waxy
  plant grows with clustered stems and loose sprays of white flowers, and almost no leaves.
scope: Also called phantom orchid, this white waxy plant with almost no leaves grows in the northwestern
  United States to northern California and east to Idaho.
examples:
- We found a snow orchid in the northwestern United States.
- The snow orchid had almost no leaves and loose sprays of white flowers.
