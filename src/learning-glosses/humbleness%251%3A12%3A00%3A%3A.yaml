simpleMeaning: A feeling of not thinking too much of oneself.
scope: A feeling of not thinking too much of oneself, not a settled way of acting without false pride
  and not the state of being humble and unimportant.
examples:
- He was filled with humbleness at the sight of the Pope.
- Her humbleness showed when she thanked the crowd for the prize.
