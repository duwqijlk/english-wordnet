simpleMeaning: a person who turns on his or her own land and gives help to its enemies, which is the crime
  called treason
scope: This is a person who turns on his or her own land, not someone who just speaks against its leaders
  and not a foreign fighter.
examples:
- The traitor gave the plans to the enemy and was put in jail for his crime.
- People called him a traitor after he turned on his own land to help its enemies.
