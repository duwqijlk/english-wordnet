simpleMeaning: to twist things round each other into a thick, mixed-up knot
scope: 'Also called tangle or mat: to twist things round each other into a thick, mixed-up knot, not to
  make a plan harder and not to speak in an angry voice.'
examples:
- The child snarled the cord of the lamp into a knot.
- Her hair snarled in the strong wind.
