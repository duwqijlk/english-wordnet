simpleMeaning: A liquid used to colour germs by a set way of staining, made of one part iodine and two
  parts potassium iodide and 300 parts water.
scope: A liquid for staining germs by one set way, set apart from other staining liquids by its fixed
  mix of one part iodine, two parts potassium iodide and 300 parts water.
examples:
- Gram's solution colours the germs so they can be seen.
- We mixed Gram's solution from one part iodine and two parts potassium iodide.
