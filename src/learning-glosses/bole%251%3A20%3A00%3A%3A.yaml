simpleMeaning: the main stem of a tree, usually covered with bark, and usually the part cut and sold as
  wood for building
scope: 'Also called trunk: the main stem of a tree, not the soft clay of the same name used as a colour
  in paint.'
examples:
- The bole of the old oak was too wide for two people to reach around.
- They cut the bole into long pieces of wood for building.
