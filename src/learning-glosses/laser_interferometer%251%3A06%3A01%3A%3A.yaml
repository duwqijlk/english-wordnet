simpleMeaning: An optical instrument that compares light beams to measure distance, using a single-colour,
  intense source, so it can handle differences of hundreds of metres, where older versions managed 20
  centimetres.
scope: This is a measuring instrument that compares light waves, not the light source it uses, not a camera
  or microscope, and not a device that measures by radar or sound.
examples:
- The engineers used a laser interferometer to check the machine's alignment to a fraction of a micrometre.
- A laser interferometer can track movement across hundreds of metres, far beyond older instruments.
