simpleMeaning: When the push inside a closed tank grows too strong, this tap opens on its own to let steam
  out, as on a steam boiler.
scope: This tap is also called escape, escape valve, relief valve, and safety valve, and it opens on its
  own when the push inside grows too strong.
examples:
- The escape cock opened when the boiler pressure rose.
- Steam hissed out through the escape cock.
