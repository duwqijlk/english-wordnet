senseId: 'exfiltration_operation%1:04:00::'
synsetId: 00985897-n
simpleMeaning: A secret rescue job to bring a person who has left their side, a person seeking safety,
  or a worker and their family out of danger.
scope: A secret rescue job to bring people out of danger, not a fight in the open and not a move of goods;
  no other name is listed for this sense.
examples:
- The exfiltration operation brought the defector and his family out at night.
- They planned an exfiltration operation to free the worker from the war zone.
