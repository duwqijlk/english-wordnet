simpleMeaning: A condition present from birth, caused by an extra copy of one chromosome, that leads to
  a flat face, short height, and learning difficulties
scope: A condition present from birth from an extra copy of one chromosome, also called mongolianism and
  mongolism; not a condition caught later in life and not a single missing chromosome.
examples:
- Children with trisomy 21 often have a flat face and short height.
- Trisomy 21 is caused by an extra copy of one chromosome.
