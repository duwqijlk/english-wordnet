simpleMeaning: One of several related languages of the Celts, spoken in Ireland and Scotland.
scope: Also called Erse, Erse language, Gaelic, Gaelic language, and Goidelic language; one of several
  related Celtic languages of Ireland and Scotland, set beside the Brythonic tongues of Wales and Brittany.
examples:
- Goidelic covers the Celtic languages of Ireland and Scotland.
- Irish is one of the Goidelic languages of the Celts.
