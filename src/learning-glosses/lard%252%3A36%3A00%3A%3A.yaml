simpleMeaning: to get food ready or cook it with soft white fat made from a pig
scope: To get food ready or cook it with soft white fat made from a pig, not to fry it in oil and not
  to bake it without fat.
examples:
- She larded the roast before putting it in the oven.
- He lards the meat to keep it soft while it cooks.
