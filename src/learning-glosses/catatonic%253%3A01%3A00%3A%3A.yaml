senseId: 'catatonic%3:01:00::'
synsetId: 03065956-a
simpleMeaning: In a still, unmoving state, especially with the limbs stiff or very limp.
scope: In a state where the limbs go stiff or very slack and the body stays still, not merely tired or
  asleep.
examples:
- After the shock she lay catatonic, her limbs stiff and still.
- He was catatonic for hours, neither moving nor speaking.
