simpleMeaning: A low plant with pale blue and purple flowers in short bunches near the ends of its stems,
  found from Nevada to Utah.
scope: Also called Jones' penstemon; a low plant of Nevada to Utah, set apart from tall penstemons by
  its short flower bunches near the stem tips.
examples:
- Penstemon dolius bloomed pale blue on the dry slope.
- We saw Penstemon dolius in short clusters near the trail in Utah.
