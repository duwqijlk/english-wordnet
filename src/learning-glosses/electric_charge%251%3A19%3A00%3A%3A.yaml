simpleMeaning: In a body, too many or too few electrons mean its power is out of balance, on the plus
  side or the minus side.
scope: A charge is another name for this out-of-balance power in a body, too much or too little because
  it holds too many or too few electrons.
examples:
- The battery needed a fresh electric charge before the radio would work.
- Rubbing the balloon gave it an electric charge that made it stick to the wall.
