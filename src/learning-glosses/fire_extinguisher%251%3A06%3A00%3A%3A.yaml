simpleMeaning: To put out small flames, a person holds this small can and works it by hand
scope: 'Also called an extinguisher and an asphyxiator: a hand-held can for putting out small flames,
  not a sprinkler in the ceiling and not a large hose used by firefighters.'
examples:
- She grabbed the fire extinguisher and put out the flames in the kitchen.
- Every classroom has a fire extinguisher on the wall.
