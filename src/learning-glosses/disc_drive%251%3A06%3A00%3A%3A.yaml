simpleMeaning: Turning a round flat store worked by magnet or by light, this piece of computer hardware
  holds it and reads information from it and writes information to it.
scope: Also called disk drive and hard drive, this piece of computer hardware holds a round flat store
  and turns it round to read and write information on it, not the store itself.
examples:
- The disc drive spun the disk and read the file.
- She saved her work on the disc drive.
