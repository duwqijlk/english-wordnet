senseId: 'hyperlipoproteinemia%1:26:00::'
synsetId: 14293882-n
simpleMeaning: Blood going round the body carries too much fat-carrying protein bits and cholesterol when
  any of several conditions makes the body handle them wrongly.
scope: Any of several conditions that leave too much fat-carrying matter and cholesterol in the blood
  fits here, not one that leaves too little.
examples:
- Blood carrying too much fat and cholesterol can be a sign of hyperlipoproteinemia.
- With hyperlipoproteinemia, the blood holds too much fat and cholesterol.
