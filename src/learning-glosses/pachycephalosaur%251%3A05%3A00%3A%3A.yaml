simpleMeaning: Ten inches of bone sit on top of the head of this two-legged plant-eater, the biggest thick-headed
  kind ever found.
scope: 'Also called pachycephalosaurus: this two-legged plant-eater has ten inches of bone on top of its
  head, and is not a meat-eater or a four-legged kind.'
examples:
- The pachycephalosaur walked on two legs in search of plants to eat.
- A pachycephalosaur skull showed ten inches of bone on top.
