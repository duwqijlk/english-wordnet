simpleMeaning: A chem bond in which one bit gives up an electron to turn a plus ion, and the other bit
  takes an electron to turn a minus ion.
scope: This sense is also called electrovalent bond and ionic bond, a chem bond in which one bit gives
  up an electron to turn a plus ion, and the other bit takes an electron to turn a minus ion.
examples:
- Electrostatic bonds swap electrons.
- The electrostatic bond turns bits into ions.
