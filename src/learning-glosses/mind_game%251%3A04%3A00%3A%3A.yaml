simpleMeaning: To gain an edge over another person, planned acts play on their thoughts to scare or muddle
  them, most times.
scope: It is a set of planned acts meant to scare or muddle a person, most times to gain an edge.
examples:
- The football players tried to play mind games with the opposition.
- The jeweler's mind game was to make lovers think a big gem meant deep love.
