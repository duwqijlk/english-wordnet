simpleMeaning: The first settlers of the United States crossed the open grasslands in the 1800s in a big
  cart with wide wheels and a curved cloth top.
scope: Also called a prairie schooner and a prairie wagon; it is a big cart with a curved cloth top, not
  an open cart.
examples:
- The covered wagon crossed the open grasslands.
- The pioneers rode in the covered wagon.
