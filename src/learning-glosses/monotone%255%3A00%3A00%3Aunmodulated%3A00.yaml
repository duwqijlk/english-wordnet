simpleMeaning: said or made as a sound that stays at the same high or low level and does not go up or
  down
scope: 'Also called flat, monotonous and monotonic: a voice or sound that stays at one level. It is not
  the maths sense where values only go up or only go down, and not one tone used again and again.'
examples:
- He spoke in a monotone voice for the whole talk.
- The teacher's monotone voice made the class feel sleepy.
