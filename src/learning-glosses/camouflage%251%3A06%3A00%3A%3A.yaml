simpleMeaning: a thing or a clever plan used to hide something or to trick people
scope: A thing or clever plan used to hide something or trick people, not the act of hiding itself and
  not an outward look that gives a false idea of what a thing is.
examples:
- A net covered with leaves served as camouflage over the hidden car.
- The fake leaves were camouflage for the gun hidden under them.
