simpleMeaning: A leafy wild bloom with sweet-smelling, slim, white or pale pink trumpet flowers, of the
  south-western United States and north Mexico.
scope: This sense is also called sweet four o'clock, for a leafy wild bloom with sweet-smelling, slim,
  white or pale pink trumpet flowers, of the south-western United States and north Mexico, unlike the
  sense for a wildflower with strong, deep pink, tube-shaped, evening-opening flowers, found in sandy
  and dry land from southern California to southern Colorado and into Mexico.
examples:
- Maravilla blooms in the desert.
- Maravilla smells sweet at dusk.
