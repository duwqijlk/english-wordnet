simpleMeaning: A stop in the flow of current to machines, so they stop working
scope: This is a stop in the flow of current to machines, so they stop working; power outage is another
  name for this sense, not a single machine breaking down, and not a planned switch-off.
examples:
- The power failure cut the lights in the whole street.
- A power failure stopped the lifts during the storm.
