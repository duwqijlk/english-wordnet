simpleMeaning: An allergic reaction that appears within minutes of contact with the trigger in a person
  already sensitized to it.
scope: Also called atopic allergy, atopy and immediate allergy, this is a bad body response that shows
  up a few minutes after contact, not a slower body response.
examples:
- Her type I allergic reaction showed up a few minutes after she touched the cat.
- His type I allergic reaction began minutes after contact with the new soap.
