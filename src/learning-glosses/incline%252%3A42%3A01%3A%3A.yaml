simpleMeaning: to be likely to do or be something because that is your nature, and to lean toward doing
  or being it
scope: 'Also called run, lean and tend: to be likely by nature to do or be something, not to make someone
  willing and not to bend the head.'
examples:
- He inclines to be quiet in large groups.
- She inclines toward telling the truth.
