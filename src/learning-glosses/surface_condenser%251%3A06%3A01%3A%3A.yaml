simpleMeaning: A device that turns steam back into water by cooling it, working at a pressure below that
  of the air outside.
scope: A device that turns steam back into water by cooling it, at a pressure below that of the air outside;
  not a boiler that makes steam and not a pump that moves water.
examples:
- The surface condenser turns the used steam back into water.
- In the power plant, the surface condenser cools the steam from the turbine.
