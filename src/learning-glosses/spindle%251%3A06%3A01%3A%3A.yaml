simpleMeaning: a turning rod, in any of different forms, that larger turning parts turn around
scope: Also called arbor. This is a turning rod that larger parts turn around, not the stick for twisting
  thread and not the thin parts seen when cells divide.
examples:
- The wheel turns on a strong metal spindle.
- He took out the spindle so the larger turning part could be fixed.
