simpleMeaning: In Britain above all, one of the great groups of people in a country, seen together as
  part of its public life, once held its own political rights.
scope: Also called estate and the three estates, this is a great group of people in a country that once
  held its own political rights, especially in Britain.
examples:
- The estate of the realm once held its own political rights.
- In Britain, the estate of the realm was one of the great groups of the country.
