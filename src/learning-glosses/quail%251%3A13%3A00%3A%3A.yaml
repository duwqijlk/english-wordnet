simpleMeaning: the meat of a small game bird, good to roast or grill when the bird is young, but needing
  slow cooking in liquid when it is older
scope: The meat of a small game bird, not the living bird itself and not the act of shrinking back in
  fear.
examples:
- The menu offered roast quail with herbs.
- Old quail must be braised, or the meat stays tough.
