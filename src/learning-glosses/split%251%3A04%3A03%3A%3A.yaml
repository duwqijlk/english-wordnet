simpleMeaning: when a company makes more shares for people to own, but the total value owned by the owners
  does not change
scope: This is about a company making more shares, not the sweet dish, not the bowling pins, and not the
  act of tearing something.
examples:
- The company announced a two-for-one split of its shares.
- After the split, she owned twice as many shares for the same total value.
