  with long strong legs and bodies shaped like a tube or flat.
scope: Also called phasmid, it is a big plant-eater with long strong legs, shaped like a tube or flat.
examples:
- A phasmid insect eats plants with long strong legs.
- The phasmid insect looked like a walking stick.
