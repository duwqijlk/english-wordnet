simpleMeaning: A sea animal with a long tube-shaped nose and a slim body covered with hard plates.
scope: A sea animal with a long tube-shaped nose and a slim body covered with hard plates; needlefish
  is another name for this sense, not a seahorse and not an eel.
examples:
- The pipefish hid among the sea grass, its long snout poking out.
- We saw a pipefish in the rock pool at low tide.
