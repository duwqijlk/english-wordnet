simpleMeaning: Any of the curled, spongy bones inside the nose in people and other animals with backbones.
scope: This is one of the curled, spongy bones inside the nose, also called turbinate and turbinate bone;
  not the hard bone of the skull and not the soft flesh of the nose.
examples:
- The turbinal helps warm the air we breathe.
- A swollen turbinal can block the nose.
