simpleMeaning: in a way that is about how a person or thing grows and changes over time
scope: It links something to the way people grow and change over time. It is not a word for how fast or
  how well something is done.
examples:
- The child is developmentally ready to start school.
- The twins are developmentally at the same stage as other children their age.
