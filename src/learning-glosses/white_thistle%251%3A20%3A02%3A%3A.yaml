simpleMeaning: Prickly leaves, stems, and pods and large pale or yellow flowers mark any plant of the
  group Argemone, found mostly in tropical America.
scope: Also called argemone, devil's fig, and prickly poppy, this is any plant of the group Argemone with
  large pale or yellow flowers and prickly leaves, unlike the other white thistle, a spiny shrub of the
  southwest of the United States and Mexico.
examples:
- White thistle opened its large yellow flowers.
- The white thistle pricked my hand with its stems.
