simpleMeaning: Be occupied with the work of putting up structures such as houses or offices.
scope: This is being occupied with construction as an activity, not making a particular thing by joining
  materials, not giving planned form to something such as a nation or a business, not ordering, supervising,
  or paying for a construction project, not forming or accumulating something steadily, not creating something
  abstract such as a reputation, not strengthening something, not developing or growing, not founding
  something on a basis, not improving a detergent's cleaning action, and not the noun senses about a person's
  body shape.
examples:
- The firm has been building in this district for over thirty years.
- Her grandfather built in this valley long before the highway came.
