simpleMeaning: People or goods ride in small cars that dangle from cables strung between tall posts.
scope: 'Also called a tram, a cable tramway, a ropeway, or a tramway: cars hang from wires held up by
  tall posts, not a train that runs on rails.'
examples:
- The aerial tramway carried people and goods in cars hung from wires.
- Freight moved on the aerial tramway in cars hung from cables.
