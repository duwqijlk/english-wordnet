simpleMeaning: A green mineral made of calcium, magnesium and silicate, one of the two kinds of jade but
  less prized than jadeite; once thought to cure kidney complaints.
scope: The softer green jade mineral; not jadeite, the harder and more valuable kind of jade, and not
  a medicine, though it was once believed to help kidney disease.
examples:
- The bowl is carved from nephrite, a softer and less prized jade than jadeite.
- Nephrite has been polished into ornaments in China for thousands of years.
