simpleMeaning: a poem that shows deep feeling, made with groups of lines (stanzas) in patterns that are
  not simple
scope: This is a poem full of feeling, built in set groups of lines. It is not a poem that tells a story,
  and it is not a short song on its own.
examples:
- He wrote an ode to honour the dead soldiers.
- The class read an ode with long, uneven groups of lines.
