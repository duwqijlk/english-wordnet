simpleMeaning: plants thought to be the most advanced kind that start with two seed leaves, with many
  small flowers packed close in heads that look like single flowers
scope: 'Also called composite plant: a group of plants with heads of many small flowers. It is not the
  describing word for plants of this same wider family.'
examples:
- Sunflowers and daisies are composites with heads made of many small flowers.
- The book lists asters as composites.
