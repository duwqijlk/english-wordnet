senseId: 'continuation%1:10:00::'
synsetId: 06411146-n
simpleMeaning: a new part added to a book or play that goes on from it and makes it longer
scope: This is an added part of a book or play, not the act of going on with an activity without stopping
  and not a thing being made longer in time.
examples:
- The author wrote a continuation of the novel ten years later.
- Fans welcomed the continuation, a new play that carried the story forward.
