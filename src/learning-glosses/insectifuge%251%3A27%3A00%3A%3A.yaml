simpleMeaning: Bugs will not come near a person who has this chemical stuff
scope: A chemical stuff that stops bugs from coming near, also called insect repellant or insect repellent;
  not a poison that kills them and not a net that blocks them.
examples:
- They packed insectifuge for the camping trip in the marsh.
- She dabbed a little insectifuge on her neck before the evening walk.
