simpleMeaning: of a leaf, with a broad round top end and a narrow bottom end
scope: 'Also called spatula-shaped: a leaf shape with a broad round top end and a narrow bottom end; not
  a leaf that is narrow at the top and not a leaf shaped like a spear point.'
examples:
- The spatulate leaf was broad at the top and thin at the base.
- Look for spatulate leaves on this low plant.
