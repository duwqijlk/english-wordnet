simpleMeaning: A tropical American plant that forms a rosette of fibrous, sword-shaped leaves near the
  ground and sends up flowers on tall spikes; some are grown as ornamentals or for fiber.
scope: Another name for the same plant called agave; not a cactus or an aloe.
examples:
- Century plants lined the dry slope, sending up tall flower spikes.
- We planted a century plant at the edge of the garden.
