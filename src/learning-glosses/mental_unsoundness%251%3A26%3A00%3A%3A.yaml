senseId: 'mental_unsoundness%1:26:00::'
synsetId: 14421118-n
simpleMeaning: a state in which the mind is troubled and a person loses their sense of where they are
  and what is going on
scope: A troubled state of mind with loss of bearings; not a short spell of unclear thinking, and not
  a mild, lasting lack of power to learn.
examples:
- His mental unsoundness left him unable to tell where he was.
- Mental unsoundness followed the long illness.
