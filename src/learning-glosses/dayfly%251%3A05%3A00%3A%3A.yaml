simpleMeaning: This slim insect has thin clear wings; its young live in water, and the grown insect lives
  on land, usually for less than two rounds of light and dark
scope: Also called a mayfly or a shadfly; a short-lived water insect, not a housefly or a dragonfly.
examples:
- A dayfly rose from the river at dusk.
- The dayfly danced above the water for a single evening.
