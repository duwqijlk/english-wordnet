simpleMeaning: a way of running the trade of a country in Europe in the 1700s, in which the government
  controlled all its business dealings to make the country richer
scope: A way of running a country's trade in 18th-century Europe, with the government controlling all
  its business; mercantilism is another name for this sense, not free trade, and not the buying and selling
  of goods as such.
examples:
- Under the mercantile system, the government controlled all trade to build the nation's wealth.
- The mercantile system ruled European trade in the 1700s.
