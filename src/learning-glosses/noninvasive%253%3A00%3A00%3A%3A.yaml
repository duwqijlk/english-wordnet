simpleMeaning: about a way of working on the body that does not cut the skin or go inside a hollow part
  of the body
scope: About a way of working on the body without cutting the skin or going inside; not surgery that cuts
  and not a probe that goes inside.
examples:
- The doctor chose a noninvasive test that needed no cut.
- Noninvasive scans can show the heart without going inside the body.
