simpleMeaning: Two sets of roots, one from the head and one from the backbone, join into one thin cord
  that carries signals.
scope: Eleventh cranial nerve, nervus accessorius, and spinal accessory are other names for this thin
  cord that carries signals, formed when two sets of roots join into one.
examples:
- The accessory nerve joins roots from the head and the backbone.
- One set of roots of the accessory nerve comes from the head, the other from the backbone.
