simpleMeaning: a large bush with many branches, grown most of all for its leaves that stay green all year
scope: A large bush grown for its green leaves that stay on all year, not a fruit tree and not a peach
  tree.
examples:
- The wild peach by the fence keeps its leaves through the winter.
- They planted a wild peach for its thick green leaves, not for fruit.
