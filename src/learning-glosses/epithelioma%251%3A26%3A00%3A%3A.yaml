simpleMeaning: a harmful growth in the thin covering tissue of the body that can spread and cause death
scope: A harmful growth in body covering tissue, not a harmless growth and not a growth in other body
  parts.
examples:
- The doctor found an epithelioma on the skin of his arm.
- An epithelioma must be cut out before it spreads to other parts of the body.
