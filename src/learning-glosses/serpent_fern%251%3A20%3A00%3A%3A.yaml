simpleMeaning: A tropical American fern grown for its big, deep blue-green fronds with deep lobes, spreading
  from brown, scaly underground stems; some botanists put it in the genus Polypodium.
scope: Also known as golden polypody and rabbit's-foot fern; not the common polypody that creeps over
  rocks.
examples:
- Serpent fern has brown, scaly underground stems and large, deeply lobed fronds.
- The fronds of serpent fern are deep blue-green.
