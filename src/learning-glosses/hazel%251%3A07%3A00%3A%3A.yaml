simpleMeaning: A brown colour with yellow or red in it, and a greenish brown when it is the colour of
  a person's eyes
scope: This is a brown colour, yellowish or reddish and greenish brown for eyes, not the bush, not its
  wood, and not the Australian tree.
examples:
- Her eyes were hazel in the sunlight.
- He wore a hazel coat that autumn.
