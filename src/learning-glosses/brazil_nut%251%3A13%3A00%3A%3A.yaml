simpleMeaning: From tropical America, a nut with three sides, white oily flesh inside, and a hard brown
  shell
scope: Also called brazil, this is the three-sided nut of tropical America, not the tall tree that bears
  it.
examples:
- He cracked a brazil nut and ate the white flesh inside.
- She bought brazil nuts with hard brown shells.
