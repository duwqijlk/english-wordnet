senseId: platitudinous%5:00:00:unoriginal:00
synsetId: 01693676-s
simpleMeaning: Boring and dull, yet put forward as if it were deep or new
scope: Boring talk or writing that claims to be deep or new; corny, bromidic and platitudinal are other
  names for this sense, not just dull talk with no such claim.
examples:
- The platitudinous sermon went on for an hour.
- His platitudinous talk made the class yawn.
