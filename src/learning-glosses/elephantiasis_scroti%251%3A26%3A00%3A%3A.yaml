simpleMeaning: Swelling of the male sex pouch caused by a long-term block in the tubes that carry body
  fluid
scope: This is swelling of the male sex pouch from a long-term block in the fluid tubes; chyloderma is
  another name for it, not a short-term injury and not a skin rash.
examples:
- His elephantiasis scroti came from a long-term block in the fluid tubes.
- Doctors treated the elephantiasis scroti by easing the block in the fluid tubes.
