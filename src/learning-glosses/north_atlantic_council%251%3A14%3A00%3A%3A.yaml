simpleMeaning: A body made up of the standing spokesmen of every NATO member country, with political power
  to decide.
scope: This is a body made up of the standing spokesmen of every NATO member country, with political power
  to decide, also called the NAC; not NATO itself and not other international bodies.
examples:
- The North Atlantic Council met to discuss the crisis.
- Every NATO member country sends a spokesman to the North Atlantic Council.
