synsetId: 06569038-n
simpleMeaning: a written order from a court that forces a witness to come to a court case, and not doing
  so may lead to punishment for not obeying the court
scope: Also called a subpoena ad testificandum, this is the written court order itself, not the act of
  giving such an order to a person.
examples:
- The court sent him a subpoena to come and speak as a witness.
- She could be punished if she did not obey the subpoena.
