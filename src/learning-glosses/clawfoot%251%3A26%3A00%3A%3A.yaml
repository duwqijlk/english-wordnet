simpleMeaning: A foot that looks like a hooked nail, with a very high arch and toes bent far back
scope: A misshapen foot with a very high arch and toes bent far back, so it looks like a hooked nail,
  is also called pes cavus.
examples:
- His clawfoot made walking painful.
- The doctor noted the clawfoot at the boy's check-up.
