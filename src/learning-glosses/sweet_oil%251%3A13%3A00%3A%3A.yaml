simpleMeaning: a mild liquid fat from plants, used as food, most of all from olives or from rape seed
scope: This is a mild plant oil used as food, most of all olive oil or oil from rape seed, not a strong
  oil and not oil for the skin or a lamp.
examples:
- She poured sweet oil over the salad.
- Sweet oil is mild enough to use in cooking every day.
