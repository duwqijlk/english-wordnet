synsetId: 05517103-n
simpleMeaning: the set of body parts that take part in making babies and in making and passing urine
scope: 'Also called urinary system, urogenital apparatus, urogenital system, genitourinary apparatus,
  genitourinary system, apparatus urogenitalis and systema urogenitale: the whole set of body parts for
  making babies and for making and passing urine, not only the parts that make urine and not only the
  parts for making babies.'
examples:
- The urinary apparatus includes the kidneys, the bladder and the sex organs.
- A scan of the urinary apparatus showed that her kidneys were healthy.
