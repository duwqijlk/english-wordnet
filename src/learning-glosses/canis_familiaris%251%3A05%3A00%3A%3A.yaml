simpleMeaning: A four-legged animal, probably descended from the common wolf, that people have kept as
  a pet or for work since very early times, in many breeds.
scope: Also called dog and domestic dog, this is the tame animal in many breeds that people have kept
  since very early times, among other wolves and other wild dog-like animals.
examples:
- The Canis familiaris barked all night.
- A Canis familiaris can be trained to work with sheep.
