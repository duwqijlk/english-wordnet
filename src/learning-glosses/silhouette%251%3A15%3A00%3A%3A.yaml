simpleMeaning: the dark edge shape of a solid thing, as thrown by its shadow
scope: The dark edge shape of a solid thing, as thrown by its shadow, not a picture filled in with one
  colour and not the act of showing a thing this way.
examples:
- The silhouette of the tree stood black against the sky.
- We saw only the silhouette of the house in the fog.
