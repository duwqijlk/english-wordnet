simpleMeaning: in a nervous way, with muscles tight and the mind unable to rest
scope: 'This says how someone sits, waits, speaks or acts: in a nervous, tight way. It is not about being
  calm or at rest, and not about a rope or wire being pulled tight.'
examples:
- He sat tensely by the phone, waiting for news.
- They waited tensely for the test results.
