simpleMeaning: taking the wet out of food, blood plasma, drugs or tissue without harming their shape,
  made ice-cold and then warmed with no air so the ice turns to gas
scope: Also called lyophilisation and lyophilization, this way of taking the wet out of food or tissue
  keeps its shape, not a way of drying things with heat.
examples:
- Freeze-drying kept the strawberries good for months.
- The lab used freeze-drying to keep the blood plasma safe.
