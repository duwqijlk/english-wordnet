simpleMeaning: a person who reads new books and other writings for a publisher and says if they are worth
  printing
scope: A person who judges new writings for a publisher, not a church reader and not a person who checks
  proofs.
examples:
- The publisher's reader liked the novel and said it should be printed.
- As a reader, she spent her days reading new manuscripts.
