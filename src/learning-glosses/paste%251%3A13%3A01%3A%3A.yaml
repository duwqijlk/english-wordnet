simpleMeaning: a tasty mixture to put on bread or crackers, or to use in making other dishes
scope: A tasty mixture to put on bread or crackers or use in making other dishes, also called spread,
  not the sticky glue, not any soft mixture, and not the hard glass used for false jewels.
examples:
- She spread the paste on a cracker.
- The paste was tasty on fresh bread.
