simpleMeaning: A cloth that is put around a dead body when the body is buried
scope: 'Also called shroud: a cloth that wraps a dead body for burial, not the verb senses about a thing
  seeming dull or about having too much of a pleasing thing.'
examples:
- The dead man's body was wrapped in a white pall.
- They placed a clean pall around the body before the burial.
