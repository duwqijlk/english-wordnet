simpleMeaning: to say things you do not mean, or to say things with no care for what is true
scope: 'Also called fake, another name for this sense is bullshit: to talk without meaning what you say
  or caring if it is true, not the male animal, not a formal letter from the pope, and not a buyer who
  expects prices to rise.'
examples:
- When he did not know the answer, he just bulled and hoped no one would notice.
- She could tell he was bulling because his story kept changing.
