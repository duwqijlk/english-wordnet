simpleMeaning: One pound's weight under gravity, speeding up by 32 feet per second every second, counts
  as this unit of force, used outside technical work.
scope: Also called pound, this is a unit of force for everyday use, not one of the units of physics.
examples:
- The spring pulled with a force of 2 lbf.
- The answer came out as 3 lbf.
