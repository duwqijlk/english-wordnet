simpleMeaning: An Asian bug brought by chance into the United States, a pest on citrus and apple trees.
scope: An Asian insect pest, also called Comstock's mealybug and Pseudococcus comstocki, set apart from
  other mealybugs by its chance arrival and its harm to citrus and apple trees.
examples:
- Comstock mealybug spread through the orchard.
- The Comstock mealybug harmed the apple trees.
