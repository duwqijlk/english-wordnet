simpleMeaning: A group from France in World War II, set up in London by Charles de Gaulle to liberate
  France from German rule and bring back the republic.
scope: Also called the Fighting French; a wartime group that worked to liberate France, not the French
  government that stayed under German rule.
examples:
- The Free French broadcast from London during the war.
- De Gaulle led the Free French from London.
