simpleMeaning: A yellow poison for insects, used as a dust or a spray to kill garden pests, house flies,
  and mites.
scope: A yellow poison for insects, used as a dust or spray on garden pests, house flies, and mites; not
  a weed killer and not a poison for rats.
examples:
- The gardener dusted the roses with malathion.
- Malathion kept the house flies down all summer.
