simpleMeaning: Stems that lie along the ground, take root freely, and form dense thickets mark a small
  maple of northwestern North America.
scope: A small maple of northwestern North America with stems that lie along the ground and take root
  freely, not a tall maple.
examples:
- The vine maple spreads by stems that lie along the ground and take root.
- We found a vine maple with stems that had taken root along the ground.
