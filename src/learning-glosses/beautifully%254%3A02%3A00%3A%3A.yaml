senseId: 'beautifully%4:02:00::'
synsetId: 00243465-r
simpleMeaning: in a way that is very pleasing
scope: This word tells how something is done, in a very pleasing way. It is not the word beautiful, which
  describes a person or a thing as very pleasing, and it does not name a person or a thing itself.
examples:
- She sang beautifully, and the whole room went quiet.
- The small garden was beautifully kept, with bright flowers in neat rows.
