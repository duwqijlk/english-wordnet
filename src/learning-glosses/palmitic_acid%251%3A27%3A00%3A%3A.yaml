simpleMeaning: A fat that takes in no more hydrogen, the main fat in meat and milk foods
scope: A fat that takes in no more hydrogen, the main fat in meat and milk foods; hexadecanoic acid is
  another name for it, not an oil that stays liquid and not a sugar.
examples:
- Palmitic acid is common in butter and beef fat.
- Too much palmitic acid can raise blood cholesterol.
