simpleMeaning: A dancer undresses slowly to music as a show, taking off one piece of clothing after another
  to excite the people watching in a sexual way.
scope: Also called strip, a show in which a dancer undresses to music to excite the watchers; not a person
  who performs such a show.
examples:
- She did a striptease for the crowd at the club.
- The striptease ended with the dancer down to their last piece of clothing.
