simpleMeaning: to fill a device or system with liquid so that it is ready to start working.
scope: This is not to add a firing charge to a weapon and not to coat a surface; it means filling something
  with liquid to prepare it for use.
examples:
- Prime the pump by pouring a little water into the top.
- The mechanic primed the fuel line before starting the engine.
