simpleMeaning: A pull toward people of one's own sex, shown in feeling or in close bodily contact
scope: A pull toward people of one's own sex, also called homosexualism, homosexuality, gayness, or queerness;
  not a pull toward people of the other sex, and not plain friendship.
examples:
- His homoeroticism showed in the poems he wrote about other men.
- The film's homoeroticism lies in the close bond between the two soldiers.
