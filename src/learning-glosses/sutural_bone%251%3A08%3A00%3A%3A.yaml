simpleMeaning: a tiny soft piece of the hard frame of the head found in the joins between the parts of
  the skull
scope: This is a tiny soft piece in the joins between skull parts, not a large skull bone and not a tooth.
examples:
- A sutural bone can sit in the join between two skull bones.
- The doctor found a small sutural bone in the suture.
