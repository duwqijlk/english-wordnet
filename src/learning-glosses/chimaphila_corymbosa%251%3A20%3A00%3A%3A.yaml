simpleMeaning: A herb of Europe and Asia with white or pinkish flowers that grow in a flat bunch at the
  tip of the stem.
scope: This is a herb of Europe and Asia with white or pinkish flowers in a flat bunch at the tip of the
  stem, also called love-in-winter, western prince's pine or Chimaphila umbellata; it is not a herb with
  flowers along the whole stem.
examples:
- Chimaphila corymbosa bloomed in the shade, its white flowers in a bunch at the stem tip.
- We found Chimaphila corymbosa under the pines, its pinkish flowers just opening.
