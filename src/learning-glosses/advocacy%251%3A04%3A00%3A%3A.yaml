simpleMeaning: strong, open support for an idea or cause, especially speaking or arguing to help win support
  for a person or thing
scope: This is speaking and acting to back an idea or cause, not just liking it in private and not giving
  plain facts about it with no side taken.
examples:
- Her advocacy for clean water helped change the law.
- He is known for his advocacy for poor families.
