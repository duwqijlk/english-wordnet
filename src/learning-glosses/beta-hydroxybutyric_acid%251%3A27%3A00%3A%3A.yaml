scope: This chemical, made from another chemical, is the one found in blood and urine when the body fails
  to break food down as it should.
examples:
- The test found beta-hydroxybutyric acid in her urine.
- Beta-hydroxybutyric acid showed up in his blood when his body could not break food down as it should.
