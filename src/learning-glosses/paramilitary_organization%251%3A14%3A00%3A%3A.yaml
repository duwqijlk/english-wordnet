simpleMeaning: A band of ordinary people set up and run like soldiers, above all to stand in for regular
  troops or to help them.
scope: A band of ordinary people run like soldiers, also called paramilitary, paramilitary force, paramilitary
  organisation and paramilitary unit; not regular troops and not a band of rebels.
examples:
- The paramilitary organization guarded the road into town.
- A paramilitary organization stood in for the army during the unrest.
