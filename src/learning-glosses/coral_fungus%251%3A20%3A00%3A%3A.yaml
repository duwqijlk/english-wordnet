simpleMeaning: Often brightly coloured, any of many fungi of a family called Clavariaceae grow in clusters
  that often branch in many tangled ways like coral
scope: Any of many fungi of the Clavariaceae family that grow in tangled coral-like clusters; not a sea
  coral and not a single mushroom with a cap and stalk.
examples:
- The coral fungus in the woods branched like a tiny sea coral.
- She photographed the coral fungus because its branches looked like coral.
