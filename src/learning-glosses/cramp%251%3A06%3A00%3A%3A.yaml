simpleMeaning: a strip of metal with each end bent to make a square corner, used to hold stone or brick
  work together
scope: A metal piece used to hold stone or brick work together, not sudden pain in a muscle and not the
  act of having that pain.
examples:
- The builders used a cramp to hold the two stones together.
- Each cramp was set into the wall to keep the bricks in place.
