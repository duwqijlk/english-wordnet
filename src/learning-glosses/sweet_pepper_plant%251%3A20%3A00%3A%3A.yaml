  plant
scope: Also called paprika, pimiento, pimento, a bell pepper, and a sweet pepper; this is the plant, not
  the hot pepper and not the fruit itself.
examples:
- The sweet pepper plant in the garden bore large bell-shaped fruit.
- We watered the sweet pepper plant every morning.
