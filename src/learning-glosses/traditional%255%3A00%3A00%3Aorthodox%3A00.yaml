simpleMeaning: relating to established religious teachings that have been accepted as correct for a long
  time.
scope: This sense concerns long-accepted religious doctrine, not everyday customs or habits handed down
  in a family.
examples:
- The priest defended the traditional doctrine of the church against modern revisions.
- In that region, families still follow the traditional teachings of their faith.
