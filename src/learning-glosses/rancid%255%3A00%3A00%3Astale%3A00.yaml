simpleMeaning: 'used of oils or fats going bad: having a strong bad smell or taste, most often because
  of a chemical change or decay'
scope: Used of oils or fats going bad, with a strong bad smell or taste; not merely smelling of age, which
  is another sense of rancid.
examples:
- The rancid butter smelled awful.
- He threw out the rancid bacon.
