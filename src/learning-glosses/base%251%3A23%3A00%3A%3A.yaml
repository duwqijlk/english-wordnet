simpleMeaning: In a counting system, the positive whole number that stands for one unit in the next place
  up.
scope: This is the number a place-value counting system is built on, not a support or foundation or the
  lowest support of a structure, not the bottom or lowest part of a thing, not the flat underside on which
  an object sits, not the lower side of a geometric figure, not a lower limit, not the basic assumptions
  something is developed from, not the most important or necessary part of something, not the attachment
  end of an organ, not a military installation or the place a mission starts from, not a baseball runner's
  station, not a word's root form, not a DNA or RNA unit, not a chemical alkali, not the middle element
  of a transistor, not a country's stock of facilities and equipment, not the main ingredient of a mixture,
  not the verb uses meaning to found something on, to set up a center of operations, or to smoke cocaine,
  and not the adjective senses meaning forming a foundation, of low birth, of inferior metal, morally
  bad, dishonorable, illegitimate, or fake.
examples:
- The accountant explained that our everyday numbers are written in base ten.
- The program converts the value into base two before storing it.
