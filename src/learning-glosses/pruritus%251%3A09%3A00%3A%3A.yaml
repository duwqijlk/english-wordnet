simpleMeaning: Allergies, infection, lymphoma, jaundice, and other things can bring on this intense itching
  feeling.
scope: An intense itching feeling that can have many causes, not the allergy or infection that brings
  it on.
examples:
- He could not stop scratching because of the pruritus.
- The doctor asked what had brought on her pruritus.
