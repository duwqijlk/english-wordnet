simpleMeaning: The gut is blocked, especially in its last part, so what is inside cannot pass on to the
  lower bowel
scope: Doctors also call this intestinal obstruction, a block in the gut that keeps its contents from
  moving on.
examples:
- The ileus kept the food from passing through his gut.
- Doctors treated the ileus so the bowel could work again.
