simpleMeaning: The bridge of the nose is made by one long hard piece with four straight sides
scope: This is the hard piece that forms the bridge of the nose, and nasal and os nasale are other names
  for this sense, not the soft tip of the nose.
examples:
- A blow broke his nasal bone.
- The nasal bone runs down the bridge of the nose.
