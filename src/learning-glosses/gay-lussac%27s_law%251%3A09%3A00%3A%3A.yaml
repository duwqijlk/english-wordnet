simpleMeaning: In physics, the density of a perfect gas kept at one pressure falls as the heat rises,
  and rises as the heat falls.
scope: In physics, also called the law of volumes or Charles's law; it says how the density of a perfect
  gas changes with heat when the pressure stays the same.
examples:
- Gay-Lussac's law tells us the density of a gas falls as it gets hotter at one pressure.
- We used Gay-Lussac's law to work out the density of the gas at the new heat.
