simpleMeaning: A written form of a piece of music, with the parts for each instrument on separate sets
  of lines across big pages.
scope: A written form of a piece of music, with each instrument's part on a separate set of lines; score
  is another name for it, not a single part alone and not a recording.
examples:
- He studied the musical score of the sonata.
- The conductor marked the musical score before the concert.
