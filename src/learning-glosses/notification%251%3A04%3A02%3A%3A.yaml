simpleMeaning: a charge of a crime made by a grand jury (a group of people in court who decide if a case
  should be tried), acting on its own
scope: In law, this is a charge of a crime that a grand jury makes on its own; it is not a short message
  that tells a person about something.
examples:
- The grand jury sent a notification charging the man with theft.
- In a notification of its own, the grand jury charged the woman with fraud.
