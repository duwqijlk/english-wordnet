simpleMeaning: A herb of south Europe, grown for its stalks, leaves, and seeds, all to eat.
scope: A herb of south Europe, grown for its stalks, leaves, and seeds, all to eat; not stalks eaten like
  celery, or sugared like angelica, nor seeds used to flavour, or pickled like capers.
examples:
- Their lovage grew in the yard.
- The lovage was cut at noon.
