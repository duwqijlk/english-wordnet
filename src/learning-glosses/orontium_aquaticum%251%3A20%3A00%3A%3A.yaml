simpleMeaning: A water plant of the south-east of the United States, with blue-green leaves and a thick
  flower stem like a club, covered with tiny yellow flowers
scope: This is a water plant of the south-east of the United States with blue-green leaves and a thick
  flower stem like a club, covered with tiny yellow flowers; golden club is another name for this sense,
  and a water plant with other leaves or other flowers is a different kind.
examples:
- Orontium aquaticum grows in the still water of the south-east.
- The Orontium aquaticum in the pond had tiny yellow flowers.
