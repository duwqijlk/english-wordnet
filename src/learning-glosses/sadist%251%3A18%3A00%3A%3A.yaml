simpleMeaning: a person who enjoys hurting other people and seeing them in pain
scope: This is a person who enjoys other people's pain, not a person who enjoys pain in their own body,
  and not just a cruel act.
examples:
- The sadist laughed while he hurt the prisoner.
- In the story, a sadist keeps animals locked up and enjoys their pain.
