simpleMeaning: a plant that lives for many years, from the western United States, with bright red flowers
  in soft, feathery spikes; grown for show
scope: A plant that lives for many years, from the western United States, with bright red flowers in soft,
  feathery spikes; grown for show; not a plant grown for food, and not a plant with white flowers.
examples:
