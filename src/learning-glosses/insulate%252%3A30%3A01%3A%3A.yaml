simpleMeaning: To guard a thing from heat, cold, or sound by putting a covering layer around it
scope: To guard a thing from heat, cold or sound with a covering layer, not to cut it off from other people
  and not to keep it apart in a room.
examples:
- We had his bedroom insulated before winter came.
- They insulated the pipes so the water would not freeze.
