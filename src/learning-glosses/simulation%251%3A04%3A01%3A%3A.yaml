simpleMeaning: the act of copying how a real situation or process works, by using something like it, especially
  for study or for training people who work
scope: This is the act of copying how a real situation or process works, to study it or to train people
  who work; it is not the copy itself and not acting in a false way to trick people.
examples:
- The hospital ran a simulation of an emergency to train new staff.
- Simulation of the flood helped the town plan where to build its walls.
