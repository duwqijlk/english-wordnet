simpleMeaning: A sea animal with no stalk that swims free and has ten soft arms, living on muddy sea floors
scope: A free-swimming sea animal with no stalk and ten soft arms on muddy sea floors, also called a comatulid;
  not a starfish and not a sea animal fixed to one place.
examples:
- The feather star drifted over the muddy sea floor.
- We saw a feather star spread its ten arms.
