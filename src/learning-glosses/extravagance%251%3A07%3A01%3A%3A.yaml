schema: oewn-learning-gloss-v2
senseId: 'extravagance%1:07:01::'
synsetId: 05126162-n
simpleMeaning: the quality of going too far, past what is right in behaviour or taste, and past what is
  likely or true
scope: This is about going too far in words or behaviour. It is not the sense about spending too much
  money.
examples:
- We were surprised by the extravagance of his description of the small party.
- The extravagance of her claim made it hard for anyone to believe it.
