simpleMeaning: a roughly three-sided flat area between two arches and the level top above them
scope: A roughly three-sided flat area between two arches and the flat top above them, also called spandril;
  not the arch itself, and not the opening under the arches.
examples:
- The spandrel between the two arches was filled with carved stone.
- Each spandrel above the doorway carried a painted design.
