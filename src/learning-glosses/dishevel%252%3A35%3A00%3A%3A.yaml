simpleMeaning: to mess a thing up so its parts fall out of place and it looks untidy
scope: 'Also called tangle, and tousle is another name for it: to mess a thing up till it looks untidy,
  not to tear it and not to press it flat.'
examples:
- The strong wind dishevelled my hair.
- The child dishevelled his shirt by rolling on the floor.
