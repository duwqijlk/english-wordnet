simpleMeaning: A plant disease that harms the leaves and stems of grain plants and other grasses.
scope: A plant disease that harms the leaves and stems of grain plants and other grasses; not a disease
  that harms only the grain heads, and not a spot caused by insects.
examples:
- Flag smut attacked the wheat leaves that summer.
- The farmer burned the plants hit by flag smut.
