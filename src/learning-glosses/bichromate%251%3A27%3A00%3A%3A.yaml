simpleMeaning: a salt made from a kind of acid that is only imagined, not one that really exists
scope: 'Also called dichromate: a salt of an acid that is only imagined, not a salt of a real acid and
  not a kind of dye.'
examples:
- The lab stored the bichromate in a sealed jar on a high shelf.
- Potassium bichromate was used in the old dye works down by the river.
