simpleMeaning: a person who is owed money by another person, or who is owed something that the other person
  has a duty to give or do
scope: This is the person who is owed money, not the person who owes the money and must pay it back.
examples:
- The bank was the main creditor, and he still owed it a lot of money.
- Creditors asked the company to pay back what it owed.
