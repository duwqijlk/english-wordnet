simpleMeaning: a defence of the body, above all against viruses, fungi, or tissue from another body, that
  works through a kind of white blood cell called T cells
scope: A body defence that works through T cells, not a defence that works through antibodies and not
  a defence against one germ only.
examples:
- The cell-mediated immune response fought the virus.
- Doctors studied the cell-mediated immune response after the transplant.
