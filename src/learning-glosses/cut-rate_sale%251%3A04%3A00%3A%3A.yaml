simpleMeaning: a time, most often short, when a shop sells things at prices much lower than usual
scope: 'Also called a sale: a time when a shop offers things at much lower prices than usual, not a single
  low price and not a shop that always sells cheap things.'
examples:
- The cut-rate sale drew long lines of shoppers to the store.
- She waited for the cut-rate sale to buy a new coat.
