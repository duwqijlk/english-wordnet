simpleMeaning: A chemical change that can run both ways, one way an oxidation and the other way a reduction.
scope: A chemical change that can run both ways; oxidation-reduction is another name for this sense, not
  a change that runs one way only and not a change with no reverse.
examples:
- Oxidoreduction in the cell runs both ways.
- The oxidoreduction step can run in either direction.
