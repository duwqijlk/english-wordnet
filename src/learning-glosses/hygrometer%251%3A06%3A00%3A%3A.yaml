senseId: 'hygrometer%1:06:00::'
synsetId: 03559640-n
simpleMeaning: A tool that measures how much water vapour the air holds, compared with the most it can
  hold.
scope: A tool for measuring how damp the air is; it measures water vapour in the air, not its heat or
  its pressure.
examples:
- The hygrometer showed the air was nearly full of water vapour.
- Gardeners use a hygrometer to check the dampness of the greenhouse air.
