simpleMeaning: Any one of a large group of plants that look like ferns and belong to the Selaginella group
scope: Any one of a large group of fern-like plants of the Selaginella group, not a true fern and not
  a true moss.
examples:
- Little club moss spread across the damp forest floor.
- The gardener planted little club moss under the trees.
