simpleMeaning: A fishtail palm found from India to the Malay Peninsula; its sap yields jaggery, a brown
  sugar, and sago comes from the pith of its trunk.
scope: Another name for kittul, kitul tree and jaggery palm; not the sago palm or the sugar palm.
examples:
- Kitul palms grow from India to the Malay Peninsula.
- The pith of the kitul yields sago.
