senseId: 'plasmodium%1:05:02::'
synsetId: 01430644-n
simpleMeaning: In some stages of such living things as slime molds, a flat sheet of cell stuff with many
  nuclei, the parts that run a cell, is seen.
scope: This flat sheet of cell stuff with many nuclei is seen in some stages of slime molds, and it is
  not the parasite that causes malaria.
examples:
- The slime mold was a plasmodium in one stage.
- Many nuclei sat in the one flat sheet of the plasmodium.
