simpleMeaning: Large sweet-smelling yellow flowers with white middles grow on this tall plant, which has
  few branches and a cone shape.
scope: This tall cone-shaped plant bears large yellow flowers, not the other kind of the same name grown
  in temple gardens.
examples:
- The pagoda tree bore large yellow flowers with white middles.
- A tall pagoda tree grew in the garden with large yellow flowers.
