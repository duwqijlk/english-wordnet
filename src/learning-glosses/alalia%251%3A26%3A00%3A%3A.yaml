simpleMeaning: a state in which the voice cords cannot move, so the person cannot speak
scope: A state in which the voice cords cannot move, so the person cannot speak; not a sore throat and
  not a voice lost from birth.
examples:
- Alalia left him unable to speak after the illness.
- The stroke caused alalia, and she could make no sound.
