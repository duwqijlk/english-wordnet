simpleMeaning: How fast cells burn fuel with oxygen is set by a chemical the neck glands make.
scope: This chemical, also called tetraiodothyronine and thyroxin, is made by the glands in the neck and
  sets the speed at which cells burn fuel with oxygen.
examples:
- The neck glands make thyroxine, and cells burn fuel with oxygen at the speed it sets.
- Cells burn fuel with oxygen at the speed thyroxine sets.
