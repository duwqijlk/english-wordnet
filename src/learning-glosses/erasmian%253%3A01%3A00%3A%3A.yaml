simpleMeaning: Things done in the way of Erasmus, or that have to do with him, are what this word is about.
scope: Said of things that have to do with Erasmus, or that are done in his way; not of things that have
  to do with any other person.
examples:
- His Erasmian views on learning were well known.
- She took an Erasmian view of the old texts.
