simpleMeaning: a person who brings two people together so they can marry, or tries to do this
scope: A person who helps others find a husband or wife; not one of the couple, and not a person who plans
  the wedding day.
examples:
- The matchmaker introduced the young man to a woman she thought he would like to marry.
- In the village, an old matchmaker helped many couples meet and marry.
