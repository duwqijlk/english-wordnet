simpleMeaning: The act of pulling up or out, uprooting, cutting off from life.
scope: The act of pulling up or out, uprooting, cutting off from life; not the act of casting a church
  member out from the communion of believers and the church's gifts, cutting one off from a holy body,
  nor the bit left out when an editor's change makes a written passage shorter, nor the cutting out of
  a body part or tissue.
examples:
- Their excision tore at dawn.
- The excision was done at noon.
