simpleMeaning: the hard part at the lower end of the spine in people and in apes that live without one
scope: This is the hard part at the lower end of the spine in people and in apes that live without one,
  and coccyx is another name for this sense, not a bone in the middle of the back and not the top of the
  spine.
examples:
- He bruised his tail bone when he fell off the chair.
- The tail bone sits at the very bottom of the spine.
