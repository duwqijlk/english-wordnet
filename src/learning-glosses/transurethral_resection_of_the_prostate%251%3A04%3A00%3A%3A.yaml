simpleMeaning: When the gland below a man's bladder has grown too big but is not cancer, an operation
  takes away a large part of it.
scope: This operation takes away a large part of the gland below a man's bladder when it has grown too
  big but is not cancer, not the whole gland.
examples:
- A transurethral resection of the prostate was done to take away the extra tissue.
- After the transurethral resection of the prostate, a large part of the gland was gone.
