simpleMeaning: the way a living thing that can move, often a simple one, goes towards something or away
  from it when something outside it acts on it
scope: The way a moving living thing goes towards or away from something outside it, not the surgical
  putting back of a body part.
examples:
- The tiny creature showed taxis by moving towards the light.
- Taxis is the movement of a small organism towards or away from a stimulus.
