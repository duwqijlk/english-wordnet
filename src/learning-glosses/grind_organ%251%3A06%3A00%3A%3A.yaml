simpleMeaning: A musical instrument that makes tunes as a round drum set with small pegs turns round inside
  it
scope: This is a musical instrument played by turning a pegged drum; barrel organ and hand organ are other
  names for this sense, not a piano and not a wind instrument blown by mouth.
examples:
- The street musician played a grind organ on the corner.
- A grind organ played an old tune as its drum turned.
