simpleMeaning: The outer shell of the earth and the rock layer just below it make up the solid part of
  the earth
scope: 'Also called lithosphere: the solid earth of crust and mantle, not the air around the earth and
  not the water on it.'
examples:
- The geosphere includes the crust we walk on.
- Earthquakes shake the geosphere deep below the surface.
