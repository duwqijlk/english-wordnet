simpleMeaning: A very soft small bread, raised in part with buttermilk and a white powder
scope: A very soft small bread, raised in part with buttermilk and a white powder; also called buttermilk
  biscuit; not a hard dry cracker, and not a sweet cake with icing.
examples:
- She baked soda biscuits for breakfast.
- The soda biscuit crumbled in his hand.
