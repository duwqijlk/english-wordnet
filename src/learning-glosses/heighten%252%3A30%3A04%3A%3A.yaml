simpleMeaning: to make something stronger and clearer, so it stands out more
scope: 'Also called compound, deepen, and intensify: to make a feeling or state stronger and easier to
  see, not to make it more extreme in amount and not to sharpen the senses.'
examples:
- The music heightened the tension in the hall.
- The news only heightened my fear.
