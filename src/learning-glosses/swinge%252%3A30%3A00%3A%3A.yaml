simpleMeaning: To mark the outside of a thing with a light touch of fire
scope: 'Also called singe: to burn only the surface a little, not to burn right through a thing.'
examples:
- Be careful not to swinge the cloth when you hold it near the candle.
- The hot iron swinged the edge of her sleeve and left a brown mark.
