senseId: 'flow%1:14:00::'
synsetId: 08478606-n
simpleMeaning: The main direction in which a series of events or ideas develops, pictured as a moving
  current.
scope: This is the main trend running through events or ideas, not a liquid moving, not the amount of
  liquid passing in a given time, and not an unbroken physical stream.
examples:
- A steady flow of new ideas kept the discussion alive all evening.
- The novel follows the flow of events from peace to war.
