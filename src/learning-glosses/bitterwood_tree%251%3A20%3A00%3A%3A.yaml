simpleMeaning: any of several trees or bushes whose wood and bark have a sharp, sour taste, from the Simaroubaceae,
  a family of plants
scope: Any of several trees or bushes with a sharp, sour taste in their wood and bark, not the West Indian
  tree that gives Jamaica quassia and not a tree with sweet wood.
examples:
- The bitterwood tree stood at the edge of the wood.
- She tasted a strip of bitterwood tree bark and found it sharp and sour.
