simpleMeaning: wood from a Taxodium tree that grows in North America, loses its leaves each year, and
  makes cones
scope: Also called bald cypress, this is wood from the tree, not the living tree itself.
examples:
- The table was made of pond cypress wood.
- He chose pond cypress for the deck because the wood holds up well.
