simpleMeaning: A cottonwood tree of the far west of North America, with dark green leaves that shine on
  top and look rusty or silvery below.
scope: Also called black cottonwood or Populus trichocarpa; a cottonwood of the far west of North America,
  not an eastern cottonwood or a willow.
examples:
- The Western balsam poplar grows along the river.
- We planted a Western balsam poplar in the yard.
