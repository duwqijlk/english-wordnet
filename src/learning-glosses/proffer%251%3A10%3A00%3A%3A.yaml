simpleMeaning: an idea or plan put to others for them to say yes or no to
scope: 'Also called suggestion and proposition: an idea or plan offered for a yes or no answer, not the
  act of holding something out to someone.'
examples:
- His proffer of a new timetable was turned down by the group.
- She made a proffer to share the work, but they did not take it.
