simpleMeaning: A fishtail palm found from India to the Malay Peninsula; its sap gives a brown sugar, and
  the soft core of its trunk gives sago.
scope: The palm itself, not the brown sugar or sago made from it; kittul, kitul and kitul tree are other
  names for the same palm.
examples:
- The sap of the jaggery palm yields a brown sugar.
- Sago is made from the soft core of the jaggery palm's trunk.
