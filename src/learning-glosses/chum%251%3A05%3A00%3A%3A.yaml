simpleMeaning: a large salmon from the Pacific Ocean, with small spots on its back, and much used as food
scope: This is a large salmon used for food, not chopped fish put in the water to draw fish in, and not
  a close friend.
examples:
- The fish market sold fresh chum caught in the Pacific.
- A chum with small spots on its back swam up the river.
