simpleMeaning: A line joining places that get the same amount of sunshine.
scope: A line joining places that get the same amount of sunshine, not a line joining places with the
  same rainfall and not a line of equal temperature.
examples:
- The isohel joined the sunniest towns on the map.
- An isohel showed which places got the same hours of sun.
