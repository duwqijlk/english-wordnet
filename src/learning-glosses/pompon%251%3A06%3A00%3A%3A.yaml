simpleMeaning: Tufts of wool or silk, gathered into a ball, are worn most often on a hat just for show.
scope: Also called a pom-pom, this is a ball of tufted wool or silk most often worn on a hat.
examples:
- A pompon sat on top of the hat.
- The pompon was made of tufted silk.
