simpleMeaning: A set of rules that makes a network easy to run and keeps its computers' talk safe, while
  the work of keeping it safe stays out of sight
scope: A set of rules for computers on a network, not one rule on its own and not the wires that join
  the computers.
examples:
- The new fast local internet protocol keeps our office computers talking safely.
- Engineers chose a fast local internet protocol to make the network easy to run.
