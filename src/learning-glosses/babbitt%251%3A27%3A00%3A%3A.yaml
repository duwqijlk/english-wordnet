simpleMeaning: Used to line the parts that turn in a machine and cut down rubbing, this is a mix of tin
  with a little copper and antimony.
scope: This is a mix of tin with a little copper and antimony used to line turning parts, not pure tin.
examples:
- The babbitt lining cut down rubbing inside the bearing.
- Babbitt is a mix of tin with a little copper and antimony.
