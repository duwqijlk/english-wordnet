simpleMeaning: a dish or sweet food shaped by being put in or on a hollow form
scope: A dish or dessert shaped in a form, not the soft earth in a garden and not the act of shaping clay;
  mold is another name for this sense.
examples:
- She turned the mould out onto a plate for dinner.
- The mould of lobster jelly was served cold.
