simpleMeaning: A plant part with an edge cut like a saw, with teeth that point toward the tip
scope: A plant part with an edge cut like a saw, with teeth that point toward the tip, not a plant part
  with a smooth edge and not one with deep cuts.
examples:
- A serrate leaf has teeth along its edge.
- You can tell it by the serrate leaf.
