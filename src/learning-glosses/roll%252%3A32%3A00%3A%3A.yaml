simpleMeaning: pronounce the /r/ sound with a quick trilling movement of the tongue
scope: This is about pronouncing the /r/ sound with a trill; it is not about making an object turn over,
  and not about drifting with no goal.
examples:
- She rolls her r's when she speaks Spanish.
- He rolled his r's to sound like a native speaker.
