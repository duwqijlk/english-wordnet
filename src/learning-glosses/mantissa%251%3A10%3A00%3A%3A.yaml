simpleMeaning: the positive part after the point in a logarithm, as .808 in log 643 = 2.808
scope: The part after the point in a logarithm; fixed-point part is another name for this sense, not the
  whole number before the point and not the logarithm itself.
examples:
- In log 643 = 2.808, the mantissa is .808.
- To find the mantissa, look at the part after the point.
