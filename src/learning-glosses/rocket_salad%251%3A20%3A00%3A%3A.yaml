simpleMeaning: a tall straight European plant that lives for one year, often grown as a crop to be picked
  and eaten while young and tender
scope: A tall straight European plant that lives for one year; rocket, arugula, garden rocket and roquette
  are other names for it, not lettuce and not a plant grown for its roots.
examples:
- Rocket salad grows fast in the spring bed.
- We picked rocket salad while it was young and tender.
