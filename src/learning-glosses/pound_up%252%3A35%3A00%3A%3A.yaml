simpleMeaning: To keep a person, animal or thing inside a closed place, so it cannot get out
scope: To keep a person, animal or thing inside a closed place so it cannot get out, also called pound;
  not to shut a door and not to put a thing away for later.
examples:
- The prisoners were pounded up in the small cell for the night.
- They pounded up the cattle in the pen before the storm.
