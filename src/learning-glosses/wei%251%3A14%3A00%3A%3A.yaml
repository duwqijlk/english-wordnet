simpleMeaning: Any of a set of ruling houses of China under an emperor, in power from 220 to 265 and from
  386 to 556
scope: Any of a set of ruling houses of China in those years, also called the Wei dynasty; not one ruler
  alone and not a later Chinese house.
examples:
- The Wei ruled China in the third century.
- A Wei emperor built the new capital.
