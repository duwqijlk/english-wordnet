simpleMeaning: white meat with little fat from an important food fish in the North Atlantic, usually cooked
  in an oven or in hot water
scope: This is the white meat eaten as food, also called cod. It is not the whole live fish itself.
examples:
- We had codfish for dinner, cooked in the oven with a little butter.
- The codfish was soft and white after she cooked it in hot water.
