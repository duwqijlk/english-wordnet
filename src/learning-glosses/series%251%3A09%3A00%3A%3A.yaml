simpleMeaning: in mathematics, the total you get by adding the terms of a finite or endless sequence
scope: This is the mathematical total of added terms, not a number of similar things coming one after
  another, not a set of television programmes, not a periodical published on a schedule, not a set of
  sports contests between the same teams, not components wired so current flows through one and then the
  other, and not a set of stamps or coins collected together.
examples:
- The sum of the infinite series is exactly two.
- She added the first ten terms of the series.
