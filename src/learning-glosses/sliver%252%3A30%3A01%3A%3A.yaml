simpleMeaning: to make a thing take the shape of thin pieces
scope: To make a thing take the shape of thin pieces, not to cut a thing into thin pieces, and not a thin
  piece itself.
examples:
- He slivered the soft clay into thin curls.
- She slivered the warm wax into thin strips for sealing jars.
