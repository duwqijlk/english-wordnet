simpleMeaning: stamps, or other marks the post office accepts, that show enough has been paid for the
  kind of mail service the piece of mail is to get or has had
scope: Stamps or marks showing the mail fee is paid, not a postmark that only shows where and when mail
  was sent.
examples:
- The envelope showed postage franking from the post office.
- Postage franking on the parcel proved the fee was paid.
