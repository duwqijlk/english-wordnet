simpleMeaning: Broken down in part by man-made means, as the juices that break down food would do it
scope: Food broken down in part before it is eaten, not food digested in the body.
examples:
- Predigested foods help people who are ill or cannot digest well.
- The doctor ordered predigested meals after the operation.
