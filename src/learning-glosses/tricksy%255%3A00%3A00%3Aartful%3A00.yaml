simpleMeaning: good at making people believe things that are not true
scope: 'Also called slick, sly, tricky, cunning, dodgy, crafty, wily and foxy: good at hiding the truth
  to fool people. Not honest and open, and not just playful or joking.'
examples:
- The tricksy salesman made the old car sound new.
- She gave a tricksy answer that hid what she really meant.
