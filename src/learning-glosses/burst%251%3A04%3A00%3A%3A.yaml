simpleMeaning: the sudden breaking apart of something.
scope: This is the event itself, not the verb for splitting apart, not the verb for making something split,
  and not a rapid volley of gunfire.
examples:
- The burst happened at midnight, when the old boiler finally gave way.
- The burst sent a shower of glass across the pavement.
