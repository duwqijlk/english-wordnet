simpleMeaning: In mathematics, working out an answer through formal steps such as adding or multiplying.
scope: Mathematical calculation only - not computer data handling fixed by a rule, not the practical steps
  of a job, not the way a machine or system performs, not a medical procedure, not a military action,
  not a business, not a planned group activity, not a mental act, not the running of a machine, and not
  the state of being in force.
examples:
- Division is the operation I find hardest in arithmetic.
- We spent the lesson practising the four basic operations of arithmetic.
