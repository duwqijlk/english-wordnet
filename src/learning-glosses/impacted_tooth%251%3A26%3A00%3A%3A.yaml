schema: oewn-learning-gloss-v2
senseId: 'impacted_tooth%1:26:00::'
synsetId: 14083899-n
simpleMeaning: a problem in which a biting part is so squeezed in its socket that it cannot come through
  in the normal way
scope: A problem where a tooth cannot come through because its socket is too tight; impaction is another
  name for this sense, not a loose tooth and not a broken tooth.
examples:
- The dentist found an impacted tooth that could not come through.
- Her impacted tooth ached for weeks before it was taken out.
