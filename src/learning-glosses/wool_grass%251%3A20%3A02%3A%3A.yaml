simpleMeaning: A sedge, a plant with thin stems that grows in clumps, from eastern North America with
  many bunches of soft hairy flower heads
scope: A plant with many bunches of soft hairy flower heads, not the grass grown for its long white-ribbed
  leaves and big plumes.
examples:
- Wool grass grows thick along the marsh edge.
- We found wool grass with its soft hairy heads in bloom.
