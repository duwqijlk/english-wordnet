senseId: 'cathode%1:06:00::'
synsetId: 02988154-n
simpleMeaning: The part of an electric device that carries a negative charge and sends out the electrons
  that flow into the device.
scope: The end of an electric device that carries a negative charge and sends out electrons, not the positive
  end of a cell or battery that supplies current.
examples:
- The cathode sends electrons into the device.
- In the battery, the cathode carries a negative charge.
