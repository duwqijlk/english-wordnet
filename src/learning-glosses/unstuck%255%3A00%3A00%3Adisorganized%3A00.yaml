simpleMeaning: thrown into a state where things are not in order and do not fit together in a clear way
scope: Also called undone, this sense means thrown out of order and no longer clear as a whole, not set
  free from a surface it was stuck to.
examples:
- After the leader left, the whole plan became unstuck and no one knew what to do next.
- The price program came unstuck because too little grain was available.
