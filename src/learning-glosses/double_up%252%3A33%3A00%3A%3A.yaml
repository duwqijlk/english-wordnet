simpleMeaning: to risk the money won on one bet by putting it all on the next bet
scope: 'Also called a parlay: to stake the winnings from one bet on a later bet, not simply to bet again
  and not to bet on two things at once.'
examples:
- After winning at the races, he decided to double up and put the whole payout on the next horse.
- She doubled up her winnings on the last race of the day.
