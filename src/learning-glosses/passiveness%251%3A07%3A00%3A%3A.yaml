simpleMeaning: The way of staying still and doing nothing, with no wish to start things
scope: 'Another name for this is passivity: the way of staying still and starting nothing, not a lack
  of strength and not a rest taken on purpose.'
examples:
- His passiveness in meetings meant others made all the choices.
- Her passiveness kept her from asking for the job.
