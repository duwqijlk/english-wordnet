simpleMeaning: a poisonous salt used in electroplating, coating metal with a thin layer by using power,
  and in making photos
scope: A poisonous salt used to coat metal and in making photos, not potassium bromide, potassium carbonate,
  or potassium sodium tartrate.
examples:
- Potassium cyanide is a poison, so workers must handle it with great care.
- The factory used potassium cyanide to coat metal parts.
