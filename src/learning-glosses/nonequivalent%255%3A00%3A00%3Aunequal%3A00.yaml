senseId: nonequivalent%5:00:00:unequal:00
synsetId: 00896269-s
simpleMeaning: Not the same in worth, amount, or meaning, and one cannot stand in for the other
scope: Two things that are not the same in worth, amount, or meaning, and one cannot take the place of
  the other; not two things that are the same in worth but only look different.
examples:
- The two sums were nonequivalent, so the trade could not go ahead.
- A pound and a kilo are nonequivalent measures.
