simpleMeaning: Said of a badly behaved child who will not do as they are told and is rude about it.
scope: Said of a badly behaved child who will not do as told and is rude about it, not a child who is
  merely noisy or lively.
examples:
- The bratty child refused to share his toys and shouted at his sister.
- She acted bratty all afternoon, stamping her feet when she did not get her way.
