simpleMeaning: a narrow raised walkway that runs out from a stage into the people watching, in a theater
  or a nightclub or some such place
scope: A walkway out from a stage for shows, not the strip planes use to take off and land, and not a
  chute for logs.
examples:
- The singer walked down the runway to greet the fans at the front.
- Models turned at the end of the runway and walked back.
