simpleMeaning: A pattern used to decorate something, for example embroidery on cloth.
scope: This is a decoration on a surface, not a machine or tool, not an emblem that stands for a family,
  and not a trick or technique used for effect in a story.
examples:
- The cushion was embroidered with a small floral device.
- The wallpaper had a repeating device of small blue flowers.
