simpleMeaning: Each note stands a whole tone from the next in this key's set of notes, but for the 2nd
  and 3rd and 5th and 6th.
scope: Also called minor scale, it is a set of notes with whole tones between them, but for the 2nd and
  3rd and 5th and 6th.
examples:
- The minor diatonic scale has whole tones between most of its notes.
- The 2nd and 3rd notes of the minor diatonic scale are not a whole tone apart.
