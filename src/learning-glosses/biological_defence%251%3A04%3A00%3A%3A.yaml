simpleMeaning: steps taken to guard against harm from germs, viruses, or poisons used as weapons
scope: 'Also called biodefence, biodefense, and biological defense: steps taken to guard against harm
  from germs, viruses, or poisons used as weapons, not the harm itself and not guarding against chemical
  weapons.'
examples:
- The country spent money on biological defence after the scare.
- Training in biological defence teaches workers how to guard against germs used as weapons.
