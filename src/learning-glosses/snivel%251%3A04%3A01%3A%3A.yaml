simpleMeaning: The heavy breathing through the nose that comes when the nose is blocked
scope: Also called sniffle and snuffle, this is hard breathing through a blocked nose, not crying or whining
  in a weak, tearful way.
examples:
- From the next room came a snivel as he tried to breathe through his blocked nose.
- His loud snivel showed that his nose was fully blocked up.
