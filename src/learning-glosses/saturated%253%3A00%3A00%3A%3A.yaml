simpleMeaning: In chemistry, used most of all of carbon compounds, where every link that can join to another
  atom is already joined
scope: In chemistry, this is said of carbon compounds whose links are all joined; not said of a colour,
  and not said of a liquid that can hold no more.
examples:
- Saturated fats are solid at room temperature.
- The label said the spread was full of saturated fat.
