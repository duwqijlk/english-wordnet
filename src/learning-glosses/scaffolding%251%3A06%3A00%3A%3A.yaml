simpleMeaning: a set of raised platforms and poles put up around a place being worked on so that workers
  can reach high places
scope: A set of raised platforms and poles around a place being worked on for workers, not a single ladder
  and not the place itself.
examples:
- The scaffolding went up around the church before the repairs began.
- Workers stood on the scaffolding to paint the top of the wall.
