senseId: 'frisson%1:12:00::'
synsetId: 07535351-n
simpleMeaning: a feeling of fear that you almost like
scope: A feeling of fear that you almost like; shiver, shudder, chill, thrill, quiver and tingle are other
  names for this sense. Not a feeling of fear with no pleasure in it, and not pain.
examples:
- A frisson of fear ran through him as the door opened.
- She felt a frisson when she heard the strange sound in the dark.
