simpleMeaning: Any of a group of hormones made in the hypothalamus and carried by blood to the pituitary
  gland, each one triggering that gland to put out a particular hormone.
scope: This is the hypothalamic hormone that drives the pituitary, not the broader chemical-substance
  sense of the term and not a hormone the pituitary itself sends out.
examples:
- A releasing factor from the hypothalamus reached the pituitary and set off the production of thyroid
  hormone.
- Each releasing factor in the blood switches on one particular pituitary output.
