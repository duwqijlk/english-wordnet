simpleMeaning: a tendency to find or make things that give amusement
scope: This is a person's way of finding or making things that give amusement; fun is another name for
  this sense. It is not one single game or one single joke.
examples:
- Her playfulness made the long trip fun for the children.
- His playfulness showed when he hid my hat and laughed.
