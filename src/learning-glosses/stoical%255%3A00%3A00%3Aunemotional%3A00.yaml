senseId: stoical%5:00:00:unemotional:00
synsetId: 00861745-s
simpleMeaning: seeming not changed by joy or pain, and showing no feelings
scope: This sense, also called stoic, is about seeming not moved by joy or pain and showing no feelings;
  it is not about a person who follows an old Greek way of thinking.
examples:
- He stayed stoical while he waited for the bad news.
- She gave a stoical smile and did not cry when she lost.
