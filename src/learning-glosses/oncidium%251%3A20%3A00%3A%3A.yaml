simpleMeaning: Small yellow and brown flowers grow in thin branching sprays on any orchid of this kind,
  often kept as a plant in the house.
scope: Also called butterfly orchid, butterfly plant, and dancing lady orchid, it is any orchid with sprays
  of small yellow and brown flowers.
examples:
- The oncidium is covered in small yellow and brown flowers.
- She keeps an oncidium as a houseplant.
