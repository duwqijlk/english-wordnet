simpleMeaning: a box in the shape of a long four-sided block, usually made of thick paper, made to hold
  a pair of shoes
scope: A real box for holding shoes, usually made of thick paper; not a building, room, or small space
  said to look like such a box, as in another sense of this word.
examples:
- She kept old letters in a shoebox under the bed.
- He put the new shoes back into the shoebox.
