synsetId: 06827301-n
simpleMeaning: In maths, a way of writing maths expressions without brackets, in which each sign for an
  action comes before the numbers it acts on.
scope: 'Also called prefix notation and Polish notation: in maths, a way of writing maths expressions
  without brackets, not the usual way with brackets and not a way that puts the sign after the numbers.'
examples:
- In Lukasiewicz notation the sign comes before the numbers.
- We wrote the maths expression in Lukasiewicz notation, without any brackets.
