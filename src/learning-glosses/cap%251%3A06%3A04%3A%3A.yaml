simpleMeaning: In dentistry, a man-made cover made to fit over a broken or rotting tooth
scope: Also called a jacket or a crown. In dentistry this is a cover for a bad tooth, not a hat you wear,
  not the top part of a mushroom, and not a small explosive device.
examples:
- The dentist fitted a cap over my broken tooth.
- Her old cap on the back tooth came loose, so she went to the dentist.
