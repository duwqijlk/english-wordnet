simpleMeaning: a person who knows a great deal about hidden and hard things few people can grasp
scope: 'Also called kabbalist: a person who knows a great deal about hidden and hard things, not a member
  of a secret group and not a teacher of everyday facts.'
examples:
- The old cabalist could read the ancient symbols no one else could make out.
- People sought the cabalist when they faced a riddle no scholar could solve.
