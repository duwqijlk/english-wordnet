synsetId: 06116427-n
simpleMeaning: A wider form of the earlier account of fast-moving things that also takes in gravity, built
  on the idea that being pulled down feels the same as speeding up.
scope: This is a wider form of the earlier account of fast-moving things that also takes in gravity; general
  relativity and general relativity theory are other names for this sense, not the narrower account that
  leaves gravity out and not Newton's old law of gravity.
examples:
- The general theory of relativity says gravity bends time and space.
- Einstein's general theory of relativity changed how we see gravity.
