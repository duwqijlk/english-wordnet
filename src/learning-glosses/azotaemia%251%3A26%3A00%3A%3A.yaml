senseId: 'azotaemia%1:26:00::'
synsetId: 14234453-n
simpleMeaning: A build-up in the blood of waste matter holding nitrogen, mostly urea, that the body would
  usually pass out in urine
scope: A harmful build-up of waste in the blood, not a lack of blood and not waste passed out in the urine
  as it should be; azotemia is another name for it.
examples:
- His azotaemia showed that his kidneys were failing.
- The blood test found azotaemia after the waste built up.
