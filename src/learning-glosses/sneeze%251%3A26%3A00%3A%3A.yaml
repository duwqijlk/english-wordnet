simpleMeaning: a sign of illness in which air is suddenly forced out of the nose, and you cannot stop
  it
scope: The name for the sudden forcing of air from the nose, not the word for doing it.
examples:
- A loud sneeze came from the back of the room.
- Her sneeze was a sign that her cold was getting worse.
