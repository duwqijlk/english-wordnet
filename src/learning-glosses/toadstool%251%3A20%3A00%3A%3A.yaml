simpleMeaning: a common name for an agaric (a kind of mushroom) that is not good to eat or can poison
  you, unlike a mushroom that is safe to eat
scope: This is the name for a bad-to-eat agaric, not a mushroom that is safe to eat.
examples:
- Do not eat that toadstool; it can poison you.
- Red toadstools grew under the trees in the wet wood.
