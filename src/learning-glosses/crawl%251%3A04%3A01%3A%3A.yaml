simpleMeaning: A slow way of moving on hands and knees, or by pulling yourself along the ground.
scope: Slow progress on hands and knees or along the ground (also called crawling, a creep or creeping),
  not the overarm swimming stroke or a very slow movement in general.
examples:
- After the fall, he could manage only a slow crawl across the floor.
- The injured climber made a painful crawl back to the tent.
