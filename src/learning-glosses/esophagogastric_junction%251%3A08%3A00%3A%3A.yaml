simpleMeaning: the place where the food pipe meets the thin skin that lines the stomach
scope: 'Also called oesophagogastric junction: the place where the food pipe meets the thin skin lining
  the stomach, not the stomach itself and not the top of the food pipe.'
examples:
- The esophagogastric junction is where food passes from the pipe into the stomach.
- Doctors checked the esophagogastric junction for signs of harm.
