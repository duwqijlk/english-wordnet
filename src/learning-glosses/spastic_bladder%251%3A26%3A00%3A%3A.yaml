simpleMeaning: 'A condition of the organ that stores urine, caused by spinal cord damage, multiple sclerosis
  or injury: the person feels no fullness, leaks urine and cannot pass it steadily.'
scope: This is the nerve-damage disorder that removes bladder sensation and control, not a urinary infection
  or a physical blockage of flow.
examples:
- After his spinal cord injury he was left with a spastic bladder and needed a catheter.
- Tests confirmed a spastic bladder, which explained her incontinence.
