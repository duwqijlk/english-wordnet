senseId: 'crisscross%2:35:00::'
synsetId: 01279364-v
simpleMeaning: to put a pattern of lines that cross each other on something, or to be made up of such
  a pattern
scope: To put lines that cross each other on a surface, or to be made of such lines, unlike the near-twin
  sense that only puts the pattern on.
examples:
- Wrinkles crisscrossed her face.
- The old map was crisscrossed with roads.
