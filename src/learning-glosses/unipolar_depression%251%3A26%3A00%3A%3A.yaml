simpleMeaning: A serious low state of mind that comes on by itself, with no high, overexcited state found
  in the classic illness where low and high states take turns.
scope: It is a low state of mind that comes on by itself, unlike the classic form of the illness where
  low and high states take turns.
examples:
- That unipolar depression came on without any high, overexcited state.
- This unipolar depression came on its own.
