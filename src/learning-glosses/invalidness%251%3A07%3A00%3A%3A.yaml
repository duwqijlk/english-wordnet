simpleMeaning: An argument is weak in this way when its end point does not follow from the points it starts
  with
scope: The weakness of an argument whose end point does not follow from its starting points, also called
  invalidity; not a mistake in the facts and not a lie.
examples:
- The invalidness of his argument was clear once the false step was pointed out.
- She showed the invalidness of the proof by finding an end point that did not follow from the starting
  points.
