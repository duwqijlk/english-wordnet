simpleMeaning: a pair of loose trousers tied around the waist with a string you pull tight, worn by men
  and women in some Asian countries
scope: 'Also called pyjama: a pair of loose trousers worn in the day, not the loose top and trousers worn
  for sleeping.'
examples:
- In the village, many men wear a pajama, loose trousers tied with a string.
- She bought a light cotton pajama to wear during the day.
