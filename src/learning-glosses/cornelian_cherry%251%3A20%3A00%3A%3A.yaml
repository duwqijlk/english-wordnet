simpleMeaning: A bush or small tree of Europe that loses its leaves in winter and bears bright red fruit.
scope: This is a bush or small tree of Europe that loses its leaves in winter and bears bright red fruit,
  not a tree grown for eating cherries and not a bush that keeps its leaves all year.
examples:
- The cornelian cherry bore bright red fruit.
- A cornelian cherry grew by the garden wall.
