simpleMeaning: People put this cheap, bright thing on to be noticed, as jewellery or as a bit of dress
scope: 'Also called bangle, bauble, fallal, gaud, novelty and trinket: a cheap, bright thing worn for
  show, not costly jewellery and not a useful tool.'
examples:
- She wore a gewgaw on her coat that sparkled in the sun.
- The market stall was full of gewgaws and bright beads.
