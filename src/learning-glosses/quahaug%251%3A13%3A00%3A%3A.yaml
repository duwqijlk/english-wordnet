simpleMeaning: Most often cooked in chowder or other clam dishes, these big round shellfish with hard
  shells come from the Atlantic coast.
scope: Quahog, hard-shell clam, and round clam are other names for this big round shellfish of the Atlantic
  coast.
examples:
- The quahaug was cooked in a chowder.
- They served quahaug in a clam dish.
