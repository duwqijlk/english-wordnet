simpleMeaning: A short report, above all an official one, given out at once for people to read or hear.
scope: A short report given out at once, above all an official one; not a long news story and not the
  verb sense of making something public.
examples:
- The hospital issued a bulletin about the patient's condition.
- We heard the news bulletin on the radio this morning.
