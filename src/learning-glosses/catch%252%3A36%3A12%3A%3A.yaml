simpleMeaning: To understand something and show it faithfully, as in a drawing or photograph.
scope: Understanding something's character and showing it faithfully, as in a picture; it is not merely
  grasping an idea, not something snagging, not a hand grab, not the thing taken, not a catcher's play,
  or a pursuit gaining ground.
examples:
- The portrait catches the quiet dignity of the old man.
- Her novel catches the mood of the city in the 1990s.
