simpleMeaning: A tree of the south of the United States and Mexico, with hard nuts shaped like the brown
  spice seed
scope: A tree of the south of the United States and Mexico, with hard nuts shaped like the brown spice
  seed; not a tree of the cold north, and not a tree with soft fruit.
examples:
- Nutmeg hickory grows in the warm south.
- The nutmeg hickory bore hard nuts in the fall.
