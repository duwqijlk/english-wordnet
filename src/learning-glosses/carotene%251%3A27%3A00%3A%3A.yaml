simpleMeaning: An orange form of a chemical made of hydrogen and carbon, its links left open, found in
  many plants and changed into vitamin A in the liver
scope: Also called carotin, this is the orange chemical that many plants hold and the liver turns into
  vitamin A, not the vitamin itself.
examples:
- Carrots get their colour from carotene.
- The body turns carotene into vitamin A in the liver.
