simpleMeaning: Off the main blood tube in the lower belly, on either side, this inner tube splits into
  smaller tubes that feed blood to the hip area and the buttocks.
scope: It is the inner blood tube off the main one in the lower belly, also called internal iliac artery.
examples:
- The hypogastric artery feeds blood to the hip area.
- The hypogastric artery feeds blood to the buttocks.
