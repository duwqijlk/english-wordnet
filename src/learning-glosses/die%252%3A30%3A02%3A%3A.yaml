simpleMeaning: In religious use, to lose one's spiritual life and be condemned to eternal punishment.
scope: This is spiritual death and damnation, not the ending of physical life, not feeling the pain of
  death, not being overwhelmed by an emotion, not a machine stopping working, not feeling indifferent,
  not pining with love or desire, not cutting or shaping metal with a die, not a baseball runner being
  out, not wine losing its sparkle, not fading away or coming to an end, and not the noun senses for a
  gambling cube, a metal-shaping device, or a screw-cutting tool.
examples:
- The preacher warned that unrepentant sinners would die a second death.
- According to the old teaching, those who reject God die spiritually.
