simpleMeaning: 'A tall glass tube that separates a mixture: poured in at the top, it washes down through
  a solid material that holds its parts back differently, forming colored bands.'
scope: This is the glass separation tube itself, not the technique that uses it, the tall stone pillar,
  or a newspaper opinion piece.
examples:
- She packed the chromatography column with silica and loaded the sample at the top.
- Colored bands moved down the chromatography column as the solvent washed through.
