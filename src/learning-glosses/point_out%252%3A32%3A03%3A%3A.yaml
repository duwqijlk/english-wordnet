senseId: 'point_out%2:32:03::'
synsetId: 00926583-v
simpleMeaning: To show or tell someone something so they notice it and see it clearly and with care
scope: To draw attention to something, clearly and carefully; not simply aiming a finger at a thing, and
  not the sharp end of something.
examples:
- She pointed out the mistake in my report.
- He pointed out that the road was closed.
