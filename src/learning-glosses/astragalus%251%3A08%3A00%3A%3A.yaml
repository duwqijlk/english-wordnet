simpleMeaning: The ankle bone that meets the leg bones where the ankle bends
scope: The ankle bone that meets the leg bones where the ankle bends, also called an anklebone, a talus
  and an astragal; not the heel bone and not a strip of beaded wood on furniture.
examples:
- The astragalus joins the leg bones to form the ankle joint.
- A break in the astragalus can stiffen the whole ankle.
