simpleMeaning: A worm of the sea, mostly, that has both sexes in one body and matched side flaps, each
  bearing stiff hairs
scope: 'Also called polychaete, polychete, and polychete worm: a sea worm with pairs of hairy flaps, not
  an earthworm and not a flatworm.'
examples:
- The polychaete worm waved its hairy flaps as it moved.
- A polychaete worm builds a tube of sand on the sea floor.
