simpleMeaning: Near the dark spots on the sun, a big bright patch most often shows on its face.
scope: Also called a facula, it is a big bright patch on the face of the sun.
examples:
- A solar facula showed as a bright patch near a dark spot on the sun.
- Near a dark spot, the solar facula shone on the face of the sun.
