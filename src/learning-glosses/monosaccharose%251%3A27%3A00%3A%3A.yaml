simpleMeaning: The simplest kind of sugar, a sugar like sucrose or fructose that stays whole in water
  and does not split into other sugars
scope: 'Monosaccharide and simple sugar are other names for this sense: a sugar that does not break down
  into other sugars, not a sugar made of two joined sugars.'
examples:
- Glucose is a monosaccharose.
- A monosaccharose does not break down into other sugars.
