simpleMeaning: Said of things that belong to that long stretch of time in the earth's past, or have to
  do with them.
scope: This word marks things of that long stretch of time in the earth's past, not the stretch of time
  itself.
examples:
- Mesozoic rocks hold the bones of dinosaurs.
- The Mesozoic age came long before people lived.
