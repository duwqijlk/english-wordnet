simpleMeaning: In groups, these tiny silver fish, long and thin like eels, push themselves into the grains
  of a beach.
scope: Launce, sand eel, and sand lance are other names for this small silver fish that digs into beaches
  of small grains, not a true eel.
examples:
- The sand launce burrowed into the beach as the wave washed over it.
- These sand launces swim in groups close to the shore.
