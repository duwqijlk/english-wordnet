simpleMeaning: A large deer from North America, where the male has large antlers with many spreading parts
scope: This is a large North American deer, the male with large antlers that branch widely; elk, wapiti
  and American elk are other names for this sense, and it is not the common deer of Europe and Asia.
examples:
- A Cervus elaphus canadensis bugled in the valley at dawn.
- The male Cervus elaphus canadensis carried huge branched antlers.
