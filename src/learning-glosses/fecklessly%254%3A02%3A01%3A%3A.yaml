schema: oewn-learning-gloss-v2
senseId: 'fecklessly%4:02:01::'
synsetId: 00165080-r
simpleMeaning: Done in a careless way, without care for what should be done and without the skill to do
  it well
scope: A careless way of acting, without care for what should be done and without skill, not a bold choice
  and not one slip.
examples:
- He fecklessly left the gate open and the dog ran off.
- She fecklessly spent the money with no thought for the bills.
