simpleMeaning: understanding that comes at once, without slow thought, from a direct feeling
scope: A knowing that comes at once from a direct feeling, not the nearness of a thing in time or place
  and not a lack of waiting.
examples:
- With immediacy, she knew the answer before she could explain why.
- The immediacy of his understanding surprised him; he just knew the man was lying.
