simpleMeaning: a shore bird often seen in the far north, that spends the cold months in South America
  and Australia
scope: A shore bird of the far north that spends the cold months in the south, not a black turnstone and
  not a bird that stays in the far north all year.
examples:
- We saw a ruddy turnstone on the shore in Peru in the cold months.
- Ruddy turnstones leave the far north and spend the cold months in Australia.
