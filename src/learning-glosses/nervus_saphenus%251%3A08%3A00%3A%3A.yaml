simpleMeaning: Small branches reach the skin on the inner side of the leg and foot from the nerve of the
  thigh, of which this is one branch.
scope: It is also called the saphenous nerve, one branch of the nerve of the thigh that reaches the skin
  on the inner side of the leg and foot.
examples:
- The nervus saphenus sends small branches to the skin on the inner side of the leg.
- A nervus saphenus reaches the skin on the inner side of the foot.
