simpleMeaning: A hollow dip with a curved-in shape, left when part of a thing has been taken away
scope: 'Also called pocket: a hollow dip left where something was taken away, not the digging cup on a
  machine and not the amount a cup holds.'
examples:
- The scoop in the sand showed where the children had dug.
- Water sat in the scoop left by the fallen stone.
