simpleMeaning: a big bird of the Old World with a crest on its head, with flaps of skin under its beak
  and sharp points on its legs
scope: A big bird of the Old World with a crest, also called lapwing, peewit and pewit, not a small shore
  bird and not a bird with no crest.
examples:
- A green plover stood in the wet field, its crest lifted.
- We heard the green plover calling over the marsh.
