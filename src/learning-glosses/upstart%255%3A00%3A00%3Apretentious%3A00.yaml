simpleMeaning: like a person who now has more money or a higher place in life but does not know how to
  act well with people there
scope: This describes a person who is newly rich or newly high in life, also called nouveau-riche, parvenu
  and parvenue; it is not the noun for such a person and not a gym move.
examples:
- His upstart manners annoyed the older families at the club.
- She spoke in a loud, upstart way that did not fit the quiet dinner.
