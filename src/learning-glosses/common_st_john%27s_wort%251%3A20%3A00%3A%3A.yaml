simpleMeaning: A bushy shrub from Europe and Asia that loses its leaves in winter, with golden yellow
  flowers and red-purple fruit, used in Spain to make a soothing skin cream.
scope: Also called tutsan or Hypericum androsaemum; a bushy shrub with golden yellow flowers and red-purple
  fruit, kin to other yellow-flowered shrubs.
examples:
- Common St John's wort grows by the wall, its golden flowers bright in June.
- In Spain, common St John's wort is used to make a soothing salve.
