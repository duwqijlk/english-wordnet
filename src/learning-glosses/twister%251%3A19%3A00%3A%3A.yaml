simpleMeaning: a strong wind storm in one small area over land that does very great damage, with a cloud
  shaped like a funnel that stretches down toward the ground
scope: 'Also called a tornado: a strong wind storm over land, not the small fried cake that has the same
  name.'
examples:
- A twister tore the roofs off houses in the town.
- The twister moved across the fields and broke many trees.
