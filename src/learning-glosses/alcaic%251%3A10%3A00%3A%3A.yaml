simpleMeaning: A kind of verse used in old Greek and Latin poems, made of groups of four lines each with
  four strong beats, said to have been first made by Alcaeus.
scope: Also called Alcaic verse; a fixed verse form of old Greek and Latin poetry, close to other fixed
  classical forms such as Sapphic verse, and not ordinary prose.
examples:
- The Alcaic lines in the poem follow the old four-line pattern.
- She wrote an Alcaic stanza for the class.
