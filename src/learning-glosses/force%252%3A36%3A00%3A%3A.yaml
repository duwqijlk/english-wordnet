simpleMeaning: to make a person feel they must act, because of a strong need, feeling, or situation.
scope: This is a strong need or situation pushing someone to act, not pressure or threats from another
  person.
examples:
- Curiosity forced her to open the letter.
- Hunger forced him to leave the house.
