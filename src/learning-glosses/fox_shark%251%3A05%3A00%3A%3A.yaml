simpleMeaning: A big open-sea fish of warm waters, with a long tail like a whip that it uses to drive
  small fish together to eat them.
scope: A big open-sea fish of warm waters with a whip-like tail; thrasher is another name for this sense,
  not a fish of cold waters and not a fish with a short tail.
examples:
- The fox shark swept its long tail to herd the small fish.
- Divers watched a fox shark swim past in the warm water.
