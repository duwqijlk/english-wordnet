simpleMeaning: a person who takes part in a contest and gets to the last stages of it
scope: This is a person still in a contest at its last stage, not the winner and not someone put out in
  an early round.
examples:
- She was one of two finalists in the singing contest.
- As a finalist, he will play one more match to decide the winner.
