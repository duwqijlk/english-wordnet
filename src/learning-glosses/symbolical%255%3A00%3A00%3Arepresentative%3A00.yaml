senseId: symbolical%5:00:00:representative:00
synsetId: 01989251-s
simpleMeaning: Standing for an idea that cannot be seen, as a thing one can see.
scope: 'Also called symbolic and emblematic: standing for an idea that cannot be seen, not merely using
  symbols in general.'
examples:
- The white dove was symbolical of peace in the painting.
- Her ring was symbolical of the promise she had made.
