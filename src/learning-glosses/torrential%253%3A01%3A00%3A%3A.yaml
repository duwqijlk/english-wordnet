simpleMeaning: to do with a very strong, fast flow of water, or made by such a flow
scope: About real fast, strong water and what it does, not the sense that means just very strong and plentiful,
  as with applause.
examples:
- Torrential erosion cut deep lines in the soft rock.
- The field showed torrential damage after the fast water rushed through.
