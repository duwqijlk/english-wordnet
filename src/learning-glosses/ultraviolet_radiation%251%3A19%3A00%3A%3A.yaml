simpleMeaning: Past the purple end of what the eye can see lie rays, and their waves run shorter than
  light but longer than X rays.
scope: Also called ultraviolet, ultraviolet illumination, and ultraviolet light, these are rays past the
  purple end of what the eye can see, with waves shorter than light but longer than X rays.
examples:
- Ultraviolet radiation filled the air.
- Ultraviolet radiation shone down on the ground.
