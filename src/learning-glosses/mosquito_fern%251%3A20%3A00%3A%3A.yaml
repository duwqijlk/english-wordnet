simpleMeaning: From the east of the United States to warm America, and now growing wild in the west and
  south of Europe, this small water plant floats free.
scope: It is also called floating fern, and it is a small water plant that floats free, not one that grows
  on land.
examples:
- The mosquito fern floats free on the pond.
- The west and south of Europe now have mosquito fern growing wild.
