simpleMeaning: to take control or a thing for oneself with no right to it, if need be by force
scope: To take control or a thing with no right to it, if need be by force; assume and seize are other
  names for this sense, not to take over a lawful post, and not simply to take something.
examples:
- He usurped my rights to the land.
- She usurped the throne after her husband died.
