simpleMeaning: 'stuff with no set shape that tends to flow and take the shape of what holds it: a liquid
  or a gas'
scope: 'Stuff with no set shape that tends to flow and take the shape of what holds it: a liquid or a
  gas; not the word for a thing able to flow, and not a stuff that stays liquid at room heat.'
examples:
- Water is a fluid that takes the shape of its cup.
- Air is a fluid, too, though we cannot see it.
