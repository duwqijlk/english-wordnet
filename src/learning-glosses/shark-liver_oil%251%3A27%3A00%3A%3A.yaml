simpleMeaning: Taken from the livers of the big sea fish it is named for, this rich yellow-to-brown fat
  softens leather and gives vitamin A.
scope: Shark oil is another name for this rich yellow-to-brown fat from the livers of the big sea fish
  it is named for, used to soften leather and as a source of vitamin A.
examples:
- The shark-liver oil was used to soften the leather.
- This shark-liver oil gives vitamin A.
