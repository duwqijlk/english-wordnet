senseId: 'green-blindness%1:26:00::'
synsetId: 14177650-n
simpleMeaning: People with this kind of poor colour sight are less able to see green light, so green and
  purplish-red look the same to them.
scope: This kind of poor colour sight is also called deuteranopia.
examples:
- Green-blindness made green and purplish-red look the same to him.
- People with green-blindness cannot tell green from purplish-red.
