simpleMeaning: A common low, bushy tree of the central and southeastern United States, shedding leaves
  each winter, with dark bark and broad three-lobed leaves shaped like clubs, often in thick groups.
scope: Also called a blackjack oak or a jack oak; a low, bushy tree of the central and southeastern United
  States, not the pirate flag, the card game, or the leather club.
examples:
- Blackjacks grew in thick stands along the ridge.
- The blackjack lost its leaves early that year.
