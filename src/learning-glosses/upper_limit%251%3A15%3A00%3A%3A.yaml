simpleMeaning: The end or edge on the top or farthest north side of a thing.
scope: The edge on the top side of a thing, not the edge on the bottom side and not the lowest end.
examples:
- The upper limit of the field ran along the top of the hill.
- They marked the upper limit of the land on its northern side.
