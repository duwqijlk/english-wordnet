simpleMeaning: to wake the nerves and cut hunger, this amphetamine-based drug is taken as clear crystals
  of a salt sold under the name Methedrine
scope: 'Also called glass, ice, trash, chalk, meth, crank, shabu, methamphetamine, chicken feed, and methamphetamine
  hydrochloride: a stimulant drug sold as Methedrine crystals, not a sleep drug, and not plain amphetamine.'
examples:
- Police found deoxyephedrine in clear crystals hidden in the car.
- He took deoxyephedrine to wake his nerves and cut his hunger.
