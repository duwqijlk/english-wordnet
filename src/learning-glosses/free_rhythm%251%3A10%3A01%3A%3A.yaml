simpleMeaning: With no beats that keep coming back and no set note lengths, this way of beating time is
  neither split into equal parts nor built from small parts.
scope: This names a way of beating time that has no beats that keep coming back and no set note lengths,
  not a beat split into equal parts and not one built from small parts.
examples:
- Some chants use a free rhythm, with no beats that keep coming back.
- The singer held a free rhythm through the chant.
