simpleMeaning: A person who gets into a place where they should not be, often by pushing through what
  stands in the way
scope: A person who gets in where they should not be, not a guest who is asked in and not a person who
  walks in by mistake.
examples:
- The penetrator got past the locked gate at night.
- Guards caught the penetrator inside the fence.
