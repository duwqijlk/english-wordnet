simpleMeaning: A green-leafed plant that keeps its leaves all year, one of a group of cone-bearing plants
  called Tsuga.
scope: A green-leafed cone-bearing plant of the group Tsuga; hemlock is another name for this sense, and
  this is not the poisonous hemlock plant or any other cone-bearing plant.
examples:
- A hemlock tree shaded the path with its green branches.
- The hemlock tree keeps its leaves through the winter.
