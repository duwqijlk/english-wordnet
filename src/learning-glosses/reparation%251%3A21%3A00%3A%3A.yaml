senseId: 'reparation%1:21:00::'
synsetId: 13313413-n
simpleMeaning: a payment that the winners of a war force a country that lost the war to make, usually
  used in the plural
scope: This is a payment made by a country that lost a war to the winners. It is not a payment for fixing
  damage in general, and not a way of saying sorry between people.
examples:
- Germany had to pay heavy reparations after the war.
- The reparations were too large for the defeated country to pay.
