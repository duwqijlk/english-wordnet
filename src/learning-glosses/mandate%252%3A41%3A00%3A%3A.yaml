senseId: 'mandate%2:41:00::'
synsetId: 02400745-v
simpleMeaning: To place a land or its people under the rule of another power by an official order.
scope: Giving control of a place to another power by an official order, not making a rule that must be
  obeyed.
examples:
- After the war, the powers agreed to mandate the territory.
- The colony was mandated to a neighbouring country.
