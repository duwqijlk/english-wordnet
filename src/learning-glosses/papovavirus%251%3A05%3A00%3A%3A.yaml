simpleMeaning: Any one of a set of germs that live in animals and are linked with, or cause, growths
scope: One of a set of animal germs linked with growths; not a germ that attacks plants, and not a single
  named sickness.
examples:
- The papovavirus found in the mice caused small growths.
- Scientists study each papovavirus to see which growths it can cause.
