simpleMeaning: The godly teaching that human reason, not god-given showing, sets out holy truth.
scope: The godly teaching that human reason, not god-given showing, sets out holy truth; not, in thought,
  the teaching that knowing comes by reason with no call on trial, nor the teaching that reason is the
  right ground for ruling conduct.
examples:
- Their rationalism shaped the creed.
- The rationalism was taught at school.
