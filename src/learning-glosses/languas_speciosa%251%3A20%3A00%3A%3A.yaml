simpleMeaning: A plant grown for its shiny oblong leaves and arching clusters of white flowers with pink
  shading and crinkled yellow lips with varied magenta stripes.
scope: A plant grown for its flowers and leaves; also called shall-flower, shell ginger, shellflower,
  Alpinia speciosa, and Alpinia zerumbet.
examples:
- Languas speciosa fills the greenhouse with white flowers.
- We grow Languas speciosa for its shining leaves.
