simpleMeaning: a large spotted wild cat of the warm parts of America, like a leopard; in some ways of
  sorting animals, it is put in the group Felis
scope: Also called jaguar, this is the large spotted wild cat of warm America; it is not the lion-like
  American cat also called panther, and not a leopard.
examples:
- A panther with dark spots moved quietly through the warm forest.
- The panther hunted at night near the river in America.
