simpleMeaning: The back part of the eyeball is filled with a clear jelly that has no colour and hides
  nothing behind it.
scope: Also called vitreous body and vitreous humour, it lies at the back of the eyeball as a clear jelly
  with no colour.
examples:
- Light reaches the back of the eye by passing through the vitreous humor.
- The vitreous humor stayed clear, and the back of the eye could be seen through it.
