senseId: 'wheeziness%1:26:00::'
synsetId: 14396260-n
simpleMeaning: The presence of an abnormal high-pitched sound, heard with a stethoscope, when an airway
  is blocked, as in asthma or chronic bronchitis.
scope: It is the high, thin whistling sound heard through a listening tube when a breathing tube is blocked,
  not a normal breath sound.
examples:
- The doctor noted wheeziness when she listened to his chest.
- Wheeziness came on when his breathing tube was blocked.
