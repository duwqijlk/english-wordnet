simpleMeaning: when fish will not bite, a set of smooth hooks dragged through the water to snag the fish
  by their bodies
scope: A set of smooth hooks dragged through the water to snag fish, not a small carriage and not a barbed
  fishing tool.
examples:
- The fisherman used a gig when the trout would not bite.
- He drew the gig through the school and hooked three fish.
