simpleMeaning: the act of unfriendly groups standing against each other
scope: The act of unfriendly groups standing against each other, not the act of one person standing against
  a thing and not a body of people joined against a thing.
examples:
- The invaders met stiff opposition from the local army.
- The government and the unions were in open opposition over the new law.
