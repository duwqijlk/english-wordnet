simpleMeaning: Baked or fried, a small oval cake of bread made from maize meal, chiefly in the southern
  United States
scope: Also called dodger and corn dodger, this is a small oval cake of bread made from maize meal, baked
  or fried, chiefly in the southern United States.
examples:
- She fried a corn dab.
- The corn dab was baked, not fried.
