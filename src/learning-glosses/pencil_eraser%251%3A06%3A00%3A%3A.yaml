simpleMeaning: Often fixed to the end of a writing stick, it is a small block of stretchy stuff, or of
  man-made stuff much like it, made for rubbing out marks.
scope: Also called rubber and rubber eraser, it is the small block often fixed to the end of a writing
  stick for rubbing out marks.
examples:
- The pencil eraser at the end of my pencil rubbed out a mark.
- She used the pencil eraser to take out a mark.
