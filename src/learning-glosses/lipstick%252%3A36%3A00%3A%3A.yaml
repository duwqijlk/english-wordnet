simpleMeaning: to draw the shape of something by going round its edge with a colored stick for the lips
scope: To draw a shape with the colored stick, not to put the color on your lips.
examples:
- She lipsticked a heart shape on the mirror.
- He lipsticked circles on his cheeks for the show.
