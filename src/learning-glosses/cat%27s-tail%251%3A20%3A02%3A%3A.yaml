simpleMeaning: Tall marsh plant; cylindrical seed heads burst when ripe, scattering fluff; long flat leaves
  woven into mats and chair seats; native to North America, Europe, Asia and North Africa.
scope: This is the tall marsh plant with cylindrical seed heads; bullrush and bulrush are other names
  for it, and it is not the tall rush with soft arching stems.
examples:
- The cat's-tail's cylindrical head burst and shed down across the water.
- Farmers once dried cat's-tail leaves to make chair seats.
