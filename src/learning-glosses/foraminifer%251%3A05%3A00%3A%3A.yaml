scope: Also called a foram, this names the tiny sea creature in a chalky shell with holes, through which
  it pushes out false feet.
examples:
- A foraminifer was found in the sea, its chalky shell full of holes.
- The foraminifer pushed a soft false foot through a hole in its shell.
