simpleMeaning: wrong acts named as crimes by written rules, not by rules made by judges
scope: Wrong acts named as crimes by written rules, not by rules made by judges; statutory offence is
  another name for this sense; not a crime under judge-made rules, and not a wrong that only brings a
  fine in a civil case.
examples:
- The statutory offense was listed in the new code.
- He was charged with a statutory offense.
