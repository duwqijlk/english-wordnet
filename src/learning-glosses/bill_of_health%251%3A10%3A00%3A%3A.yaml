simpleMeaning: a paper saying the people on a ship leaving port are free of sickness, to show at the next
  port
scope: A paper saying a ship's crew is free of sickness, not a sick note for one person and not a report
  on the ship itself.
examples:
- The captain showed the bill of health at the next port.
- Without a bill of health, the ship could not dock.
