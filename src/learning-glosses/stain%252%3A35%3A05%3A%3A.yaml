simpleMeaning: to make a thing dirty or full of spots by being left in the air; also used in a wider way,
  not about real dirt
scope: To make a thing dirty or spotty, or, in a wider way, to harm a good name; not the verb for coloring
  wood or cloth with dye, and not the verb for leaving a dirty mark by chance.
examples:
- The silver spoons were stained by many years in the open air.
- The scandal stained his good name for years.
