simpleMeaning: A tiny bit of matter that carries a force between two simplest bits of matter.
scope: This is a tiny bit of matter that carries a force between two simplest bits of matter, not a bit
  of matter that builds atoms, like a proton, and not a whole atom.
examples:
- The photon is a gauge boson that carries light's force.
- Physicists found a new gauge boson in the data.
