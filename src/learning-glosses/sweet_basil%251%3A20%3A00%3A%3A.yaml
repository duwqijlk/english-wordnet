simpleMeaning: This tropical Asian herb, yearly or long-lived, is valued for aromatic leaves and spikes
  of small white flowers; a culinary herb, it flavours salads, casseroles, sauces and some liqueurs.
scope: The living herb plant, another name for common basil; not the fresh or dried leaves sold as a seasoning.
examples:
- Sweet basil needs warmth and regular watering.
- Gardeners grow sweet basil for its aromatic leaves and spikes of small white flowers.
