simpleMeaning: a reaction in which the body responds too strongly to some thing, such as dust or a food,
  and the signs of it can be mild or very strong
scope: A body's over-strong reaction to some thing, not an illness caught from germs and not a dislike
  of a food.
examples:
- Her allergy to peanuts can be very serious.
- His allergy makes him sneeze every spring.
