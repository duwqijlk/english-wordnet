simpleMeaning: The electromagnetic waves a theoretical perfect absorber would emit; how its spectrum distributes
  energy rests on temperature alone, following Planck's radiation law.
scope: The radiation from an ideal perfect absorber, also written blackbody radiation; not the absorber
  itself or the ordinary heat glow of a real object.
examples:
- Astronomers use black-body radiation curves to estimate a star's surface temperature.
- The cavity was built so that the escaping light matched black-body radiation.
