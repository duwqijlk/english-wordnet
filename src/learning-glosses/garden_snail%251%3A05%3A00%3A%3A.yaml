simpleMeaning: Any of the soft slow creatures with shells, of the Helix group, that people do not eat,
  often pests that harm plants
scope: This is any of the soft slow creatures with shells, of the Helix group, that people do not eat,
  often pests that harm plants; not a snail people eat and not a slug.
examples:
- The garden snail eats the young leaves at night.
- Garden snails are pests in the vegetable bed.
