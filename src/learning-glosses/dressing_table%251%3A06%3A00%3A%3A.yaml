simpleMeaning: a low piece of furniture with a mirror where a person sits while putting on clothes or
  makeup
scope: A low piece of furniture with a mirror for getting dressed, also called a dresser, a vanity, and
  a toilet table; not a desk for writing and not a chest for storing clothes.
examples:
- She sat at her dressing table to put on her makeup.
- The dressing table had a large mirror and three small drawers.
