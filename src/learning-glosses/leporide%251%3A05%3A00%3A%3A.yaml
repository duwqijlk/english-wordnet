simpleMeaning: A red kind of tame rabbit, a cross between a rabbit from Europe, Africa and Asia and a
  hare
scope: A red kind of tame rabbit, crossed from rabbit and hare; not a wild rabbit, and not a hare itself.
examples:
- The leporide's red coat stood out among the other rabbits.
- Breeders keep the leporide for its rich red fur.
