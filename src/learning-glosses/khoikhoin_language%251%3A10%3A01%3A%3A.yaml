simpleMeaning: Any of the Khoisan tongues spoken by the herding people of Namibia and South Africa
scope: Any of the Khoisan tongues spoken by the herding people of Namibia and South Africa; Hottentot,
  Hottentot language, Khoikhoi, Khoikhoi language and Khoikhoin are other names for this sense; not a
  tongue of another people of the region, and not the herding people themselves.
examples:
- Khoikhoin language is a Khoisan language.
- The Khoikhoin language is spoken by herding people in Namibia.
