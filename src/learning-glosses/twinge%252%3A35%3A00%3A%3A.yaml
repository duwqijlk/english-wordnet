simpleMeaning: To catch a thing between two fingers and squeeze it hard.
scope: This is nipping a thing hard between two fingers, also called a squeeze, twitch, pinch, or tweet,
  not a light touch.
examples:
- He twinged her arm to make her turn around.
- She twinged the edge of the cloth between thumb and finger.
