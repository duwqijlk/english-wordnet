simpleMeaning: a natural part that sticks out from the body of an animal or a plant
scope: A natural part that sticks out from the body of an animal or a plant; also called process, and
  not an added tool or extra part of a machine.
examples:
- The crab's appendage helps it feel its way along the sea floor.
- An appendage grows out from the main body of the plant.
