simpleMeaning: Red or yellow blooms that hang down top tall stems on this plant of the group Kniphofia,
  whose leaves are long and thin like grass.
scope: Also called a flame-flower, a flame flower, kniphofia, or tritoma, this plant of the group Kniphofia
  has tall stems topped by red or yellow blooms that hang down, over long thin leaves like grass.
examples:
- The flameflower near the path had tall stems of red blooms.
- She planted flameflowers for their long grass-like leaves.
