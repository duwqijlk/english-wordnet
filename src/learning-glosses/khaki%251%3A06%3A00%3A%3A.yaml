simpleMeaning: a strong cloth woven with slanting lines, of a yellowish brown colour, used most of all
  for soldiers' uniforms
scope: A strong yellow-brown cloth used most of all for soldiers' uniforms, not the colour alone and not
  any brown cloth.
examples:
- He wore khaki trousers and a khaki shirt.
- The soldiers' khaki uniforms were dusty after the march.
