simpleMeaning: Trees give a sticky stuff that is most often used on sore skin
scope: A sticky stuff from trees, most often used on sore skin, also called asa dulcis, benjamin, benzoin
  and gum benjamin, not a glue and not a skin cream.
examples:
- She dabbed gum benzoin on the sore patch.
- The gum benzoin eased the itch on his arm.
