synsetId: 05716605-n
simpleMeaning: the way what we see, hear or feel in a thing is joined to what we already know from the
  past
scope: How what we sense in a thing is tied to what we already know, not the sensing itself and not the
  memory on its own.
examples:
- Her apperception of the new house was shaped by the home she grew up in.
- Apperception lets us make sense of a strange sound by matching it to sounds we know.
