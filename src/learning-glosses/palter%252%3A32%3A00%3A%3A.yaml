simpleMeaning: To use words that can be read in more than one way, or be unclear, on purpose, so as to
  mislead or hide what you know
scope: To use words that can be read in more than one way, or be unclear, on purpose, so as to mislead
  or hide what you know; equivocate, prevaricate and beat around the bush are other names for it, not
  lying outright and not staying silent.
examples:
- When asked about the money, he began to palter.
- Do not palter with me; give a straight answer.
