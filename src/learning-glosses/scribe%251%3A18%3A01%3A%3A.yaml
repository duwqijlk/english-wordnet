simpleMeaning: a person whose job is to make copies of papers and other written works by hand
scope: This is the person who copies papers and books by hand, not the sharp tool for marking wood or
  metal and not the act of marking a line.
examples:
- Long ago, a scribe copied each book by hand.
- The scribe wrote out a copy of the letter for the king.
