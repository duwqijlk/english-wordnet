simpleMeaning: the pressure of gas as it leaves a machine that squeezes gas divided by the pressure as
  it enters it
scope: The number got by dividing the out pressure of a gas machine by its in pressure; not the power
  of the machine and not the amount of gas it moves.
examples:
- The manual lists a compression ratio of 3 to 1 for this model.
- A high compression ratio means the gas leaves at much higher pressure than it entered.
