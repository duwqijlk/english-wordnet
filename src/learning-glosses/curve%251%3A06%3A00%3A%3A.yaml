simpleMeaning: a part of a road, river or train track that bends round instead of going straight
scope: 'Also called a bend: a part of a road, river or track that turns round, not a baseball throw and
  not the act of bending.'
examples:
- The road has a sharp curve just before the village.
- We walked along the curve of the river.
