senseId: 'aspirate%1:10:00::'
synsetId: 07131466-n
simpleMeaning: A speech sound made with a puff of breath.
scope: A speech sound made with a puff of breath, not the speech sound that comes with a puff of breath
  that can be heard, at the start of words beginning with a stop sound or with h, and not the act of saying
  a stop sound with a puff of breath.
examples:
- The 'h' in 'hat' is an aspirate, said with a puff of breath.
- The teacher pointed out the aspirate at the start of the word.
