senseId: 'denature%2:30:01::'
synsetId: 00554951-v
simpleMeaning: Heat, acid, alkali or ultraviolet light can take a natural protein's first nature away,
  so that all or most of it is lost
scope: This change takes a natural protein's first nature away, and it is not the making of alcohol unfit
  to drink or the spoiling of material for a bomb.
examples:
- Heat can denature the protein in an egg white.
- Acid will denature the protein and change how it works.
