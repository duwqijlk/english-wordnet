simpleMeaning: Muscles grew very weak, and the eyes would not move, in people struck by a brain swelling
  that spread widely between 1915 and 1926.
scope: 'Also called encephalitis lethargica, epidemic encephalitis, lethargic encephalitis, and sleeping
  sickness: a brain swelling that spread widely between 1915 and 1926.'
examples:
- The sleepy sickness left her unable to move her eyes.
- Cases of sleepy sickness spread widely in 1918.
