simpleMeaning: The action of making something even, or taking roughness out of it.
scope: This is the act itself, not the verb for giving a surface an even finish or the adjective for a
  surface without bumps.
examples:
- She gave the tablecloth a quick smooth with her hand.
- He gave the wet plaster one last smooth before it set.
