simpleMeaning: a person whose job is to fix cars and keep them in good working order
scope: 'Also called mechanic, automobile mechanic, car-mechanic or grease monkey: a person whose job is
  to fix and look after cars, not a person who builds cars and not a person who drives them.'
examples:
- The auto-mechanic fixed the brakes on my car.
- She took the car to an auto-mechanic for its yearly check.
