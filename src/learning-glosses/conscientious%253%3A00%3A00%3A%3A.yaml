simpleMeaning: guided by what you think is right and wrong, and trying to do what is right
scope: Guided by what is right and wrong, not just done with great care and in full detail.
examples:
- It was a conscientious decision to speak out about the unfair rule.
- He made a conscientious choice to tell the truth, even though it was hard.
