simpleMeaning: a group of peoples joined under one shared rule, such as a group of American Indians
scope: A group of peoples joined under one shared rule, such as a group of American Indians, not a group
  used to sort living things in biology.
examples:
- The tribe met to choose a new chief.
- Several tribes met to talk about shared land.
