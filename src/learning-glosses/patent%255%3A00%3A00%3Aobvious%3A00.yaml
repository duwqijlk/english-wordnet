simpleMeaning: so open to the eye and the mind that no one can miss what it means
scope: So clear that anyone can see or judge it, also called plain, apparent, evident, manifest, unmistakable,
  and palpable; not a paper granting rights, and not an open tube in the body.
examples:
- The patent advantages of the new road were plain to everyone.
- The patent lie fooled no one in the room.
