senseId: 'prologuize%2:32:00::'
synsetId: 00904052-v
simpleMeaning: To write or say the short opening piece of a play or book
scope: To write or say the short opening piece of a play or book, also called prologise or prologize;
  not to write the main part of a play and not to sum up a book at its end.
examples:
- He prologuized the collection with a short verse.
- The poet prologuized each new book.
