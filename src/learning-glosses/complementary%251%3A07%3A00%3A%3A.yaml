senseId: 'complementary%1:07:00::'
synsetId: 04983006-n
simpleMeaning: one of two colors that make white when mixed as lights, or grey when mixed as pigments
  (dry coloring matter used in paint)
scope: 'Also called complementary color: this is one of a pair of colors, not the sense that means something
  that completes a whole.'
examples:
- Yellow and blue are complementaries, because mixed together they make white light.
- The teacher showed that red and green are complementaries.
