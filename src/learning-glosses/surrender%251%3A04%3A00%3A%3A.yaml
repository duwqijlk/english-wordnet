simpleMeaning: Giving up to the other side, usually on terms both sides have agreed.
scope: The act of giving up, usually on agreed terms, not saying you give up in words and not handing
  a person to the law.
examples:
- The surrender of the fort came after weeks of siege.
- The surrender was made under agreed terms, and the soldiers laid down their arms.
