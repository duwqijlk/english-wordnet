simpleMeaning: Joining two parts of a sentence that are built in the same way.
scope: This joins two parts of a sentence built in the same way; coordinating is another name for this
  sense, not a word that joins a main part to a lesser part and not a word that shows time or place.
examples:
- ‘And’ is a coordinative word in ‘John and Mary’.
- ‘Or’ is coordinative in ‘Will you go or stay?’
