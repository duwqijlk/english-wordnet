simpleMeaning: The one you like best among a group of things.
scope: This is the one you like best among a group, not a person who is loved in a special way or a competitor
  expected to win.
examples:
- This song is my favorite; I play it every morning.
- Of all her paintings, the small blue one is her favorite.
