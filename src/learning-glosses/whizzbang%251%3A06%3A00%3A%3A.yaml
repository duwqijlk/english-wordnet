simpleMeaning: A firework that makes a whizzing sound and then a loud burst, like the shell that shares
  its name
scope: A firework that whizzes then bursts with a loud bang; whizbang is another name for this sense,
  and it is not a quiet sparkler or a big rocket.
examples:
- A whizzbang fizzed and then burst.
- We set off a whizzbang after dark.
