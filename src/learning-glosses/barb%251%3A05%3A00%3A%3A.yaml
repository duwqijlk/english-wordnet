simpleMeaning: one of the many thin parts that stand out side by side from the main middle part of a feather
scope: This is a part of a feather, not the backward point on an arrow or spear, not the pointed part
  of barbed wire, and not a hurtful remark.
examples:
- Each barb of the feather is thin and soft.
- The barbs grow out in rows from the centre of the feather.
