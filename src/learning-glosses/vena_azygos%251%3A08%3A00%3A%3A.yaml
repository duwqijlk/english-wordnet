simpleMeaning: a vein that drains the chest and abdominal walls, formed as a continuation of the right
  lower-back vein and ending in the large vein returning blood to the heart
scope: This is the vein that drains the chest and abdominal walls; azygos vein and azygous vein are other
  names for it, not separate vessels.
examples:
- The vena azygos empties into the superior vena cava.
- An enlarged vena azygos can signal blocked blood flow.
