senseId: 'client_program%1:10:01::'
synsetId: 92467010-n
simpleMeaning: Any set of coded instructions that runs on a person's own computer and gets at facts kept
  on a far-off computer.
scope: A set of coded instructions that runs on a person's own computer and gets at facts kept on a far-off
  computer, not a set of instructions that runs wholly on the far-off computer and not one that needs
  no other computer.
examples:
- The mail app is a client program that fetches your letters from a far-off computer.
- She opened a client program to read files kept on the office computer.
