synsetId: 06652665-n
simpleMeaning: 'A number that shows weight against height: take weight in pounds and divide it by height
  in inches squared; over 25 means overweight, and over 30 means obese.'
scope: Not other measures of weight, nor other health numbers; also called body mass index.
examples:
- My BMI is 24.
- A BMI over 30 means obese.
