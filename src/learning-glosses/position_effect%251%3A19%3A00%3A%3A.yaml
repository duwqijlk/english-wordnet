simpleMeaning: In genetics, how a gene shows itself changes when its place in the tiny thread that carries
  the plan for life is changed
scope: In genetics, how a gene shows itself changes when its place in the tiny thread that carries the
  plan for life changes, not the effect of a gene on the body and not a change in the gene itself.
examples:
- The position effect showed up when the gene moved to a new place in the chromosome.
- Scientists studied the position effect to see how a gene's place changes what it does.
