simpleMeaning: a look on the face that shows you think someone is bad or worth little, with the top lip
  pulled up
scope: 'Also called leer: a look on the face that shows you think little of someone, not a remark in words
  that shows the same feeling.'
examples:
- He gave a sneer when he heard the weak excuse.
- A sneer pulled up the corner of her mouth.
