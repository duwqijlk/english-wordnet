simpleMeaning: a set of plans that tells a business or a party how to run its campaign
scope: A plan book for a business or election campaign, not a book of plays for the stage and not a team's
  book of football plays.
examples:
- They borrowed a page from the playbook of the opposition.
- The party's playbook for the election was kept secret until polling day.
