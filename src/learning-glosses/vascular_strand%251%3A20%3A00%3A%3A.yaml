simpleMeaning: Made up mostly of water tubes and food tubes, one thread of the system that carries water
  and food runs through the stems and leaves of higher plants.
scope: 'Fibrovascular bundle and vascular bundle are other names for this sense: a single thread of the
  water-and-food system in the stems and leaves, not the whole system.'
examples:
- We traced the vascular strand from the stem into the leaf.
- Each vascular strand in the leaf carries water and food.
