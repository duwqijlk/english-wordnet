simpleMeaning: a person who holds views that go against the accepted views in any field, not only in religion
scope: 'This is the wide sense: a person whose views go against accepted views in any field, not only
  the narrower sense of a person whose religious beliefs go against the Roman Catholic Church.'
examples:
- In science, he was called a heretic for saying the accepted ideas about space were wrong.
- She was seen as a heretic in art because her views went against all the accepted rules.
