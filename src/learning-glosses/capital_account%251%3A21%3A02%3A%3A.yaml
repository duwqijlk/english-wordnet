simpleMeaning: In economics, papers that stand for investments are bought and sold, and those dealings
  are listed in this part of the record of a country's money in and out
scope: In economics, this is one part of a country's money record, not the whole record.
examples:
- The capital account showed a large inflow of money.
- The capital account recorded the sale of bonds.
