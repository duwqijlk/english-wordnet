simpleMeaning: the act of hurting a person again and again, with attacks and unkind words that say they
  are wrong
scope: 'Also called molestation: this is the act itself, not the very strong bad feeling that the act
  gives the person who is hurt.'
examples:
- The worker reported harassment after months of attacks and unkind words from her boss.
- The school stopped the harassment of the young student by older boys.
