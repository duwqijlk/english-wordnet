simpleMeaning: For the daily press or for radio and television, this female person writes reports of what
  has happened, as a paid job
scope: A female person who writes reports of what has happened for the daily press or for radio and television,
  as a paid job; not a man doing the same job and not a writer of books.
examples:
- The newspaperwoman interviewed the mayor for her paper.
- She worked as a newspaperwoman for twenty years.
