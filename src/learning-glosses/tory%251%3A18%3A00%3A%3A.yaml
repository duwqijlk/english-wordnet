simpleMeaning: A person who backs old ways in rule and in daily life and stands against change.
scope: This is a person who backs old ways against reform, a political conservative, not a party member
  or a wartime loyalist.
examples:
- The old Tory feared any change to the laws.
- He was a Tory who loved the old ways of his town.
