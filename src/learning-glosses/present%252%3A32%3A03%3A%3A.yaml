simpleMeaning: In the military, greet someone with an official gesture and take up the stance that rules
  require.
scope: Not the everyday act of giving a gift or introducing someone; this is only the formal military
  salute and the required stance.
examples:
- The guard presented arms as the general walked past.
- New recruits learn to present arms before they are allowed on parade.
