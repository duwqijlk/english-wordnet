simpleMeaning: a train engine that runs on power made by an oil-burning engine
scope: A train engine that runs on power made by an oil-burning engine, also called a diesel-electric
  locomotive, and not a steam engine and not a train car that only carries people.
examples:
- The diesel-electric pulled the freight cars out of the yard.
- A diesel-electric runs on power from its own oil-burning engine.
