simpleMeaning: a number after the point with a set of figures that goes on repeating and never stops
scope: 'Also called a circulating decimal or a repeating decimal: a number with figures that repeat without
  end, not a number that stops and not a whole number.'
examples:
- One third is a recurring decimal, since the figure 3 goes on and on.
- The recurring decimal 0.777... never comes to an end.
