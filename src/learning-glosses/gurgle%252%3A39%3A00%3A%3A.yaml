simpleMeaning: to run along unevenly, making a bubbling sound
scope: Water moving along in an uneven flow with a bubbling noise; also called bubble, ripple, and babble,
  not words said with such a sound and not the sound itself.
examples:
- The brook gurgled over the stones.
- Water gurgled down the drain.
