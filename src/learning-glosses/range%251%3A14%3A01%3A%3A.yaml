simpleMeaning: In mathematics, all the possible output values of a function.
scope: This is the mathematical output set of a function, not a variety of different things, not the area
  or limits within which something works, not the limit of someone's ability, not a grassy grazing tract,
  not a line of mountains, not a shooting ground, not a kitchen stove, and not any verb use such as moving
  about or varying within limits.
examples:
- For that function, the range is the set of all positive numbers.
- A function's range depends on both its rule and its domain.
