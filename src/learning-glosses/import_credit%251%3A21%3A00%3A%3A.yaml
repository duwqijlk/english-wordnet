simpleMeaning: Money set aside at a bank in the buyer's own country, which the seller abroad can take
scope: Money set aside at a home bank for a seller abroad to take, not money paid at once and not a loan
  from the seller.
examples:
- The import credit let the exporter draw money from the buyer's bank.
- They opened an import credit before the goods were shipped.
