simpleMeaning: to make someone feel they must do something because of a promise or duty, or that they
  owe you something
scope: 'Also called hold and oblige: to make someone feel they must do something or owe you something,
  not to tie or hold something fast with rope.'
examples:
- The contract binds him to pay back the money.
- Her promise binds her to help them.
