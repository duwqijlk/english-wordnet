simpleMeaning: a strange or imagined idea that someone has suddenly, without a clear reason
scope: 'Another name for a whim: a strange, sudden idea; not small personal or sewing items, and not a
  plain belief or understanding.'
examples:
- He had a strange notion that he could fly to the moon.
- Her notion of running away to join the circus did not last long.
