simpleMeaning: a thick lump of meat that has not been cooked
scope: This is a lump of raw meat; it is not cooked meat, and not a small bit of any other kind of food.
examples:
- The dog took a gobbet of raw meat from the bowl.
- She cut a gobbet from the raw meat for the stew.
