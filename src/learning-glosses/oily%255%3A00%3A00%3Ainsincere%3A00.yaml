simpleMeaning: so smooth and flattering in words and manner that it feels false and unpleasant
scope: So smooth and flattering in words and manner that it feels false and unpleasant, not the sense
  of being smeared with grease and not the sense of holding too much fat.
examples:
- His oily praise made everyone in the room uneasy.
- She gave an oily smile as she asked for a favour.
