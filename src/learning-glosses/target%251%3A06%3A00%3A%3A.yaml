simpleMeaning: A piece of sports gear set up as the thing a shooter or archer aims at.
scope: This is the physical object used in sport, not a point in space chosen to shoot at and not a goal
  you hope to reach.
examples:
- He hit the target dead centre with his third arrow.
- The targets were set up at the far end of the field.
