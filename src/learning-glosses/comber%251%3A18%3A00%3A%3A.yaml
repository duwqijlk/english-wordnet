simpleMeaning: A person who pulls apart and straightens the threads of cotton or wool
scope: A person who pulls apart and straightens cotton or wool threads; not the machine that does the
  work and not a person who spins thread.
examples:
- The comber worked the wool until it lay straight.
- As a comber, she straightened cotton threads all day.
