simpleMeaning: a person who travels to a holy place to show love and respect for their god or religion
scope: This is a person who travels to a holy place for their religion; it is not a person who travels
  for fun or for work.
examples:
- Each year, many pilgrims walk to the holy city to pray.
- The pilgrim carried little food on his long trip to the temple.
