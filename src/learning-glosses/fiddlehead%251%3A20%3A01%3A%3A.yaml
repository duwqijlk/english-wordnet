simpleMeaning: an American fern whose woolly, brown spore-bearing leaves rise in early spring before a
  circle of green leaves appears; the young fronds can be eaten while still uncurling
scope: Another name for the cinnamon fern and fiddlehead fern, with edible young fronds; not the ostrich
  fern, also called fiddlehead.
examples:
- Fiddlehead grows beside the stream in damp woodland.
- Fiddlehead produces brown spore fronds before its green leaves appear.
