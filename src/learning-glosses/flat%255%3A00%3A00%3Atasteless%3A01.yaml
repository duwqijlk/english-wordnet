simpleMeaning: Having no flavor at all, with nothing sharp or strong in it.
scope: Describes food or drink with no flavor, not something boring, and not a drink that has lost its
  bubbles.
examples:
- The soup tasted flat, as if someone had forgotten the salt.
- The sauce was flat and needed more salt.
