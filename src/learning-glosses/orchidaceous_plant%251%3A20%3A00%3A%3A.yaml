simpleMeaning: One of many kinds in the flower family whose blooms often have odd shapes and beautiful
  colours
scope: 'Also called orchid: any of many plants in the orchid family, not a single garden flower and not
  a wild grass.'
examples:
- The orchidaceous plant had blooms of a strange shape and bright colour.
- He grows an orchidaceous plant on the window ledge.
