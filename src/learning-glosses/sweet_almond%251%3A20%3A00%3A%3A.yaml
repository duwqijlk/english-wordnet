simpleMeaning: Small bushy tree from Asia and North Africa that sheds its leaves yearly, with pink flowers
  and prized edible nuts in hard green husks; grown in southern Australia and California.
scope: The tree grown for its edible sweet nuts, also called simply almond; not the bitter kind used for
  oil, nor the nut eaten on its own.
examples:
- The sweet almond bears pink blossoms in early spring.
- Farmers in California grow the sweet almond for its prized nuts.
