simpleMeaning: having or using waves that are shorter than light waves but longer than X-rays, and that
  lie past the violet end of the light we can see
scope: Describing waves shorter than light but longer than X-rays, lying past the violet end of the light
  we can see; not the name for that radiation itself.
examples:
- An ultraviolet lamp can kill germs in the water.
- Ultraviolet light can hurt your skin if you stay in the sun too long.
