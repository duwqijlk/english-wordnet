simpleMeaning: pure in a moral way, especially in never having had sex
scope: Morally pure, especially in never having had sex at all; not just the narrower sense of keeping
  away from sex that is against the law.
examples:
- The holy woman was innocent and chaste all her life.
- He stayed chaste through his youth, having no sexual relations with anyone.
