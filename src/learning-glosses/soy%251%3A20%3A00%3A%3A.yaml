simpleMeaning: An upright, bushy, hairy one-year plant with three-part leaves and purple or pink flowers;
  widely grown for food, feed and better soil, mainly for its oil-rich seeds; from Asia.
scope: This sense is the growing plant, not the soybean seed, the foods made from it, or soy sauce.
examples:
- Soy grows upright and bushy, with small purple or pink flowers.
- The soy plants in the field were still flowering.
