simpleMeaning: A small, slow-growing deciduous tree like a shrub, from dry sandy barrens of the southeastern
  United States, with leaves whose lobes end in bristles and look like a turkey's toes.
scope: Also called turkey oak and American turkey oak; a small, slow-growing deciduous tree like a shrub
  of the dry sandy barrens of the southeastern United States, its leaves with bristle-tipped lobes like
  a turkey's toes.
examples:
- Quercus laevis grew on the dry sandy barren, its leaves like a turkey's toes.
- The slow-growing Quercus laevis stayed small among the pines.
