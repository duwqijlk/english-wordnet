simpleMeaning: likely to stop people from doing something
scope: Describing something that stops people from acting, not the noun for the thing itself that does
  the stopping.
examples:
- The high price had a deterrent effect on people who wanted to buy the car.
- Steep fines are deterrent and make many drivers slow down.
