simpleMeaning: the act of holding back someone's power or actions, or of keeping something from going
  too far
scope: Not a thing that delays progress, and not the sudden stopping of a moving object.
examples:
- The court acts as a check on the power of the president.
- Parliament provides a check on hasty legislation.
