simpleMeaning: A small sweet with medicine in it, sucked to make a sore throat feel better
scope: 'Also called a pastille or a cough drop: a small sweet with medicine in it, sucked to make a sore
  throat feel better, not a sweet eaten for fun and not a pill swallowed with water.'
examples:
- She sucked a pastil to ease her sore throat.
- The pastil melted slowly and soothed his throat.
