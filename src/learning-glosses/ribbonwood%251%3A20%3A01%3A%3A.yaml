simpleMeaning: a small New Zealand tree or shrub with many sweet-smelling paper-white flower clusters
  at the leaf joints, whose bark is used to make rope
scope: Also called houhere and lacebark; not the New Zealand tree whose inner bark gives a fibre called
  New Zealand cotton, also called ribbonwood.
examples:
- The ribbonwood was covered in paper-white flowers.
- They stripped ribbonwood bark to make rope.
