simpleMeaning: a weed that lives one year in Europe and North America, with leaves in a flat ring at the
  ground, small blooms, and then long oval seed cases
scope: Also called shad-flower and whitlow grass; a one-year weed with a ring of base leaves, not a tall
  garden flower.
examples:
- Shadflower spread as a weed in the field.
- The shadflower's small blooms gave way to long seed cases.
