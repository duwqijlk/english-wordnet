simpleMeaning: a law officer who carries out the orders of a court, doing work much like a sheriff's
scope: A law officer who carries out a court's orders, much like a sheriff, not a police chief and not
  someone who lines people up for a parade.
examples:
- The marshal served the court order on the company.
- A marshal took the prisoner back to his cell.
