simpleMeaning: A person who has failed time after time, and keeps on losing.
scope: A person who has failed time after time and keeps on losing, also called failure, not a person
  who merely loses one contest.
examples:
- They called him a loser, but he kept on trying.
- The team branded him a loser after three bad seasons.
