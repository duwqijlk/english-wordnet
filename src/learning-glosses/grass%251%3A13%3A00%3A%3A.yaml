simpleMeaning: bulky plant feed such as hay for horses or cattle that browse or graze
scope: This is another name for bulky feed given to livestock, also called pasture, forage, eatage or
  pasturage, not the living plant it comes from or the verb meaning to feed animals with it.
examples:
- The herd was given fresh grass every morning.
- He carried a bundle of grass to the horses in the stall.
