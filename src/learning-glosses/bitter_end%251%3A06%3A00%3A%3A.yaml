senseId: 'bitter_end%1:06:00::'
synsetId: 02848814-n
simpleMeaning: In sailing, the inner part of a rope or cable, above all the part wound round a post on
  the ship.
scope: In sailing, the inner part of a rope or cable, above all the part wound round a post; not the free
  outer part of the rope and not the whole rope.
examples:
- Tie off the bitter end before the rope runs out.
- He held the bitter end while the sail came down.
