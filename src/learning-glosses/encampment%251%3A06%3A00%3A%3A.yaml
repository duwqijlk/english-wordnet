simpleMeaning: A place where soldiers live for a time, in shelters put up by the army
scope: This is a place where soldiers live for a time in shelters put up by the army; camp is another
  name for this sense, not the act of setting up camp, and not a holiday camp.
examples:
- The soldiers returned to their encampment at dusk.
- The army built an encampment near the river.
