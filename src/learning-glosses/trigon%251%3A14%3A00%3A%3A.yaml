simpleMeaning: In astrology, one of four sets of three signs of the zodiac, with each sign 120 degrees
  from the next
scope: This is one of four sets of three zodiac signs; triplicity is another name for this sense. Not
  one sign on its own and not a group of four signs.
examples:
- The astrologer placed Aries in a trigon with Leo and Sagittarius.
- She read about the trigon of earth signs in her book.
