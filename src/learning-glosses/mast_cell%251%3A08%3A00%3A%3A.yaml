simpleMeaning: A large cell in connective tissue holding histamine, heparin, and serotonin, which are
  released in allergic reactions or after injury or inflammation.
scope: Also called labrocyte and mastocyte, it is the big joining-tissue unit that lets body chemicals
  spill out in allergic reactions or when the body is hurt or swollen.
examples:
- Mast cells spill their chemicals in an allergic reaction.
- After the injury, mast cells spilled their chemicals.
