simpleMeaning: A tame pigeon kept for show, with blue-and-white feathers and feet thick with soft feathers.
scope: A tame pigeon kept for show, with blue-and-white feathers and feet thick with soft feathers, not
  a wild pigeon and not a racing pigeon.
examples:
- The fairy swallow won first prize at the show.
- Her fairy swallow has blue-and-white feathers and thickly feathered feet.
