simpleMeaning: a thin plastic strip covered with material that reacts to light, used in cameras to make
  negatives and slides.
scope: Not a movie shown in a cinema; here it means the material inside a camera that holds the pictures.
examples:
- He loaded a new roll of film into his camera.
- Digital cameras no longer need film.
