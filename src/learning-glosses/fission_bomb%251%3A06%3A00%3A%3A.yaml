simpleMeaning: Splitting the cores of a heavy metal such as uranium 235 or plutonium 239 sets free huge
  amounts of power in this weapon of war.
scope: Atom bomb, atomic bomb and plutonium bomb are other names for this weapon of war.
examples:
- A fission bomb splits the cores of heavy metals to set free huge power.
- The fission bomb gets its power from splitting the cores of heavy metals.
