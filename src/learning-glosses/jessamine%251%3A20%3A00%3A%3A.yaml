simpleMeaning: a bush that climbs and loses its leaves in winter, bearing sweet-smelling flowers in white,
  yellow, or red, used to make scent and to give tea a taste
scope: Also called common jasmine and true jasmine, this climbing bush loses its leaves in winter and
  bears sweet-smelling white, yellow, or red flowers for scent and for tea.
examples:
- Jessamine flowers gave the tea a sweet taste.
- Sweet-smelling white flowers grew on the jessamine.
