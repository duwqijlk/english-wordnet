simpleMeaning: a deep sound that goes on for a long time, like the sound of thunder or big bells
scope: 'Also called a roll: a deep sound that lasts a long time, not the turning movement of a wheel or
  a ball.'
examples:
- The rolling of the thunder lasted for many seconds.
- From far away came the deep rolling of the church bells.
