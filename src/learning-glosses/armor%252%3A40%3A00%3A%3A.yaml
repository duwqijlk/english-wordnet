simpleMeaning: put protective covering on someone or something to guard against injury
scope: This means fitting something with protective covering; armour is another spelling of the same sense,
  and it is not general equipping or strengthening a building against attack.
examples:
- The duke armored his knights with chain mail before the battle.
- Engineers armored the patrol truck with steel plates.
