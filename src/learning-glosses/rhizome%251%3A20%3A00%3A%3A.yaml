simpleMeaning: a plant stem that grows sideways, with new stems growing up from it and roots growing down,
  and it is the part the plant uses to make new plants
scope: This plant stem, also called rootstalk and rootstock, grows flat with parts growing up and roots
  growing down; it is not a normal root and not a stem that grows straight up.
examples:
- New shoots grew up from the thick rhizome.
- She cut the rhizome into pieces, and each piece grew into a new plant.
