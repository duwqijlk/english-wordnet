simpleMeaning: A trading and guarding group of free towns in north Germany and nearby lands, from 1241,
  strongest in 1300s with over 100 towns, a free power, last met in 1669
scope: A group of free towns in north Germany and nearby lands that joined to trade and guard as one free
  power, not a single town on its own.
examples:
- The Hanseatic League joined over 100 towns at its height.
- The last meeting of the Hanseatic League was held in 1669.
