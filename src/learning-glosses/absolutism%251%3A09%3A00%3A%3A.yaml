simpleMeaning: The teaching of an absolute being, often tied to idealism in philosophy.
scope: The teaching of an absolute being, often tied to idealism in philosophy; not a form of rule where
  the ruler is an absolute dictator, held back by no constitution, laws, or opposition, or the like, nor
  a set belief in the full and unbounded power of rule, nor sway through threat of pain and force.
examples:
- Their absolutism shaped the creed.
- The absolutism was taught at school.
