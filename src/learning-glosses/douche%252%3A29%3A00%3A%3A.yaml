simpleMeaning: to send a spray of water into a space inside the body, to clean it
scope: This is the act of cleaning a space inside the body with a spray of water; it is not the washing
  itself as a thing, and not the small tool with a tube used for this washing.
examples:
- The doctor told her to douche with warm water to clean the area.
- Some people douche with a gentle spray of water after treatment.
