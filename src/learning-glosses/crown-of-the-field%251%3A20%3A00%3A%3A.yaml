simpleMeaning: A European plant that lives for one year, with big trumpet-shaped red-purple flowers and
  poisonous seeds; a common weed of grain fields and roadsides, now growing wild in America.
scope: Another name for corn cockle and corn campion; this is the poisonous cornfield weed, not the blue
  cornflower.
examples:
- Crown-of-the-field can still be seen along country lanes in late summer.
- Few walkers realise that crown-of-the-field is poisonous.
