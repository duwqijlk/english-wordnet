senseId: 'irridentism%1:09:00::'
synsetId: 05972965-n
simpleMeaning: The belief that lands where people of one group live should be ruled by the country whose
  people are of the same group and share their past
scope: The belief that such lands should be ruled by the country of their own people; irredentism is another
  name for this sense, not plain love of one's country and not a wish to break away.
examples:
- Irridentism drove the claim for the border lands.
- The party's irridentism called for the lost lands to join the home country.
