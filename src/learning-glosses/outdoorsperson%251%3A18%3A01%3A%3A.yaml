simpleMeaning: A person who spends time out of doors, as in hunting or fishing
scope: A person who spends time out of doors, as in hunting or fishing, not a person who works indoors
  and not a person who only watches outdoor sports.
examples:
- The outdoorsperson packed a tent for the weekend.
- An outdoorsperson spends much of the year hunting or fishing.
