simpleMeaning: in a way that is hard to understand because the parts do not join up clearly
scope: Done in a way that is hard to follow because the parts do not join up, not done in a clear and
  well joined way.
examples:
- After the accident, he spoke incoherently and kept changing the subject.
- She was so tired that she answered incoherently.
