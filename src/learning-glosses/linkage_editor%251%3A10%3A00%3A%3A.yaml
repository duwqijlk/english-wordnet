simpleMeaning: a computer program that joins several parts into one working piece by sorting out the links
  between them
scope: A computer program that joins several parts into one working piece; not a program for writing text
  and not a program that turns code into machine orders.
examples:
- The linkage editor joined the parts into one program.
- She ran the linkage editor to sort out the links between modules.
