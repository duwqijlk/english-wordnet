simpleMeaning: the amount of one substance that is inside a mixture or material.
scope: This is about how much of a substance a mixture holds, not about the ideas in a message or a feeling
  of satisfaction.
examples:
- This chocolate has a high sugar content.
- The test measures the water content of the soil.
