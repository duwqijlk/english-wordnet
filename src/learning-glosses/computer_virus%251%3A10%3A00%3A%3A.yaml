simpleMeaning: A set of coded orders that spreads by copying itself and usually does great harm to files
  or other sets of orders on the same machine.
scope: Also called a virus, this set of coded orders runs on one machine, copies itself, and usually does
  great harm to its files.
examples:
- A computer virus copied itself onto every file on her machine.
- The computer virus did great harm to the office files.
