simpleMeaning: the outer layer of a very young living thing that grows into skin and nerve tissue
scope: The outer layer of a very young living thing, also called ectoderm and exoderm; not the inner layer
  and not the middle layer.
examples:
- The ectoblast develops into the skin of the embryo.
- Nerves grow from the ectoblast in the early embryo.
