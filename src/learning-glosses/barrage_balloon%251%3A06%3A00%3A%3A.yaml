simpleMeaning: Wires or a net hang below this long gas-held craft, tied to the ground to keep low-flying
  war planes away.
scope: This is a long craft tied to the ground with wires or a net hung below it, not a free craft that
  flies where it will.
examples:
- A barrage balloon hung over the town.
- The barrage balloon kept low planes away from the harbour.
