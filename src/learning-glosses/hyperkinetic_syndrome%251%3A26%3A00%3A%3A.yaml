simpleMeaning: a health problem in which a person is too active, acts without thinking first, and cannot
  keep feelings steady
scope: A health problem of too much activity, acting without thinking, and unsteady feelings, also called
  attention deficit disorder, attention deficit hyperactivity disorder, minimal brain damage, and minimal
  brain dysfunction; not just being lively and not a learning problem.
examples:
- Children with hyperkinetic syndrome often find it hard to sit still.
- Hyperkinetic syndrome can make schoolwork hard to finish.
