simpleMeaning: A part of the body that has gone hard or thick because of disease
scope: A part of the body gone hard or thick through disease, also called sclerosis; not a bruise and
  not a scar.
examples:
- The doctor felt the induration around the old wound.
- Induration of the skin can follow a long illness.
