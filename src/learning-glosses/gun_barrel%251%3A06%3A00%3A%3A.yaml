simpleMeaning: When the weapon is fired, the bullet flies out through this hollow part of it
scope: The hollow part of a shooting weapon that a bullet flies through, also called barrel, not a round
  container for storing things and not the stock of the weapon.
examples:
- He cleaned the gun barrel after firing.
- The bullet left the gun barrel at great speed.
