simpleMeaning: Purple flowers top this plant with stiff stems like wire; it lives for years and grows
  where it is not wanted, first found in Europe, now wild in many places.
scope: Also called black knapweed and lesser knapweed, this is a weedy plant with purple flowers.
examples:
- Hardheads spread along the field edge.
- The hardheads opened purple flowers in July.
