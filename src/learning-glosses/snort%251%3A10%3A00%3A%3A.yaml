simpleMeaning: a cry or noise people make to show they are not pleased or think little of someone
scope: This noise is also called bird and also called hiss; it is the sound itself, not the act of breathing
  out hard through the nose to show dislike.
examples:
- A loud snort came from the crowd when they heard the unfair plan.
- She gave a snort of dislike at the rude remark.
