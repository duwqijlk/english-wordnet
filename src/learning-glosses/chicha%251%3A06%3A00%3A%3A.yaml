simpleMeaning: A long, bendy tube runs from this pipe of the East to a pot of water, and the smoke is
  cooled as it passes through the water.
scope: 'Also called hookah, shisha, calean, hubble-bubble, hubbly-bubbly, kalian, narghile, nargileh,
  sheesha and water pipe: a pipe for smoking tobacco through water.'
examples:
- He poured water into the chicha.
- They shared the chicha.
