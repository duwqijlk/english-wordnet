simpleMeaning: a sickness in which the liver becomes swollen and sore, caused by a virus, a tiny thing
  that can make people sick, or by a poison
scope: This is one sickness of the liver caused by a virus or a poison, not a general word for all liver
  problems or for pain in other parts of the body.
examples:
- The doctor told him he had hepatitis and needed rest.
- She was in hospital with hepatitis, a sickness of the liver.
