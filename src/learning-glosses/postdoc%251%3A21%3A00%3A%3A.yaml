simpleMeaning: money given to help a person study or do research after they have finished their highest
  university degree
scope: This money, also called postdoctoral, is for study or research after the highest university degree;
  it is not the person who does that study.
examples:
- She won a postdoc to pay for two years of research at the university.
- His postdoc covered the cost of his study after his degree.
