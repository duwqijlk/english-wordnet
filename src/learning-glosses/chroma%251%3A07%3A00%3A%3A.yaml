simpleMeaning: how pure and strong a colour is, with no white mixed in, so the colour looks bright and
  clear
scope: How pure and strong a colour is, with no white mixed in, so it looks bright and clear; intensity,
  saturation and vividness are other names for this, not the colour itself and not a shade made by adding
  black.
examples:
- The red had a chroma that made it glow.
- This paint keeps its chroma even in dull light.
