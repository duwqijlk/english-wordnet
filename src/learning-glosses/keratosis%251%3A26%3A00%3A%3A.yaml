simpleMeaning: A skin problem in which the hard outer layers of skin grow too thick
scope: A skin problem with too much hard skin, not a cut or a rash and not the glassy stuff inside skin
  cells.
examples:
- The doctor said the rough patch was keratosis.
- Keratosis made the skin on his hands thick and hard.
