simpleMeaning: the process in which something becomes hard or solid as it cools, dries, or forms crystals
scope: Also called set, curing and solidifying, this is something becoming hard or solid as it cools,
  dries, or forms crystals; not the act of making a thing harder and not body tissue becoming hard and
  thick in a way that is not normal.
examples:
- The hardening of the concrete took a full day.
- We waited for the hardening of the glue before moving the wood.
