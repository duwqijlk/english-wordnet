simpleMeaning: to draw thick liquid from the nose back up into the head by breathing in hard
scope: To pull mucus back up the nose by breathing in, not to cry and whine, and not to sniff at a smell.
examples:
- She snuffled and wiped her nose on her sleeve.
- He snuffled loudly and reached for a tissue.
