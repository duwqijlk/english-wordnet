simpleMeaning: of or linked to a large area of a country that has its own local government
scope: About a large area of a country and its local government, not a church official in charge of such
  an area, and not the sense about what people from such areas are like.
examples:
- The provincial government passed a new law on schools.
- Provincial roads are paid for by the local government, not by the national one.
