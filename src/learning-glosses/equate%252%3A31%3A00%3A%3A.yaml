simpleMeaning: to think of two things as like each other or the same as each other, or to say that they
  are
scope: 'Also called compare and liken: thinking of or saying that one thing is like another, not making
  things the same in real life and not the maths sense of having the same value.'
examples:
- You cannot equate a good job with being rich.
- He equated hard work with success.
