simpleMeaning: Bread or fruit is dipped into this hot cheese or chocolate, melted until it is as thick
  as a sauce.
scope: This dish is also called fondue, and it is hot cheese or chocolate melted as thick as a sauce for
  dipping bread or fruit, not cubes of meat cooked in hot oil.
examples:
- We dipped pieces of bread into the hot fondu.
- She dipped a piece of fruit into the chocolate fondu.
