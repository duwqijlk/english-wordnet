simpleMeaning: Shaded with fine lines, some straight beside each other, some crossing.
scope: This sense is also called hatched, for shading with fine lines, some straight beside each other,
  some crossing, where hatched shows light and dark by thin lines lying side by side or crossing each
  other.
examples:
- The drawing was crosshatched with fine lines.
- The shaded parts were crosshatched with fine lines.
