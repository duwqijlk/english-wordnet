simpleMeaning: not steady and likely to fall over, as if drunk
scope: About a thing that is not steady and may fall over, as if it were drunk; not about a person who
  feels a little drunk from alcohol.
examples:
- The tipsy boat rocked from side to side in the waves.
- They set the cups down carefully on the tipsy table.
