simpleMeaning: a spotted cat with long legs and claws that stay out, from Africa and south-west Asia;
  the fastest mammal, it can be taught to hunt other animals
scope: Also called chetah, this is the fast hunting cat described here; it is not a leopard or a jaguar,
  other spotted big cats.
examples:
- A cheetah ran across the plain faster than any other mammal.
- The cheetah's long legs and spotted coat helped it hunt in the open grassland.
