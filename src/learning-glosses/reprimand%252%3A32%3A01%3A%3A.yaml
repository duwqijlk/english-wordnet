simpleMeaning: to blame a person hard and angrily for something they did wrong
scope: 'Also called a jaw, a rag, a lecture, a scold, a chide, a rebuke, or a berate: telling someone
  off angrily, not the noun sense of the telling-off itself.'
examples:
- The teacher reprimanded him for cheating on the test.
- She reprimanded the driver for parking in front of the gate.
