simpleMeaning: One of two twisted bands of tissue that hold the yolk in place, joining it to the skin
  inside the shell at each end.
scope: One of two bands that hold the yolk in place inside an egg; not the yolk itself, and not the plant
  part of the same name.
examples:
- The chalaza holds the yolk in the middle of the egg.
- You can see the chalaza as a twisted cord when you crack an egg.
