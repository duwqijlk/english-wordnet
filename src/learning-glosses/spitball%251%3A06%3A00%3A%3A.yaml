simpleMeaning: a round ball made by chewing a piece of paper and shaping it, used as something to throw
scope: This is a ball of paper made by chewing a piece of paper and shaping it, to be thrown; it is not
  the baseball pitch that breaks the rules because the pitcher puts spit or another thing on the ball.
examples:
- The boy threw a spitball at the wall when the teacher left the room.
- She rolled the wet paper into a spitball and tossed it across the room.
