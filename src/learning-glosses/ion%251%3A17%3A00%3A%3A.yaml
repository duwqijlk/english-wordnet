simpleMeaning: a tiny bit of matter with an electric charge, either plus or minus, made when an atom,
  a molecule, or a group gains or loses one or more electrons
scope: In science, a tiny bit of matter with an electric charge; not a neutral atom and not an electric
  current.
examples:
- The salt breaks into ions in water.
- An ion can carry a plus charge or a minus charge.
