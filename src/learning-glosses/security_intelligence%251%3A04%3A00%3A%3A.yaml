simpleMeaning: Intelligence about the identity, capability and intentions of hostile people or groups
  who may be engaged in spying, sabotage, subversion or terrorism
scope: This is secret knowledge about unfriendly people or groups — who they are, what they can do, and
  what they plan.
examples:
- Security intelligence warned that the group planned to spy.
- The government uses security intelligence to learn what hostile groups plan.
