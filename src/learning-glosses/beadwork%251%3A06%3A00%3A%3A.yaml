simpleMeaning: a thin strip with a row of small round shapes along it, put on the edge of furniture to
  make it look nicer
scope: 'Also called bead, beading and astragal: a raised strip that edges or makes furniture look nicer,
  not a loose bead and not a necklace of beads.'
examples:
- Beadwork runs along the edge of the wooden table.
- The old cabinet has beadwork around its doors.
