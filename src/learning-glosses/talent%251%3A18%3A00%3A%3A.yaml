senseId: 'talent%1:18:00::'
synsetId: 10709374-n
simpleMeaning: a person who is born with a very great ability in one kind of work or activity
scope: This names a person born with great ability; it is not the great ability itself, and it is not
  a skill learned only by long practice.
examples:
- The young talent played the piano for the whole hall.
- The team found a new talent who could sing and act very well.
