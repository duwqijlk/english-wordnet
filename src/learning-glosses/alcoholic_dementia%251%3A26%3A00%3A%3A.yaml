senseId: 'alcoholic_dementia%1:26:00::'
synsetId: 14419001-n
simpleMeaning: A person in the last stages of long heavy drinking loses recent things from mind while
  memories from long ago stay whole.
scope: 'Also called alcohol amnestic disorder or polyneuritic psychosis: a failing of the mind in the
  last stages of long heavy drinking, in which recent things slip away while older memories stay whole,
  not a failing that takes all memory.'
examples:
- Alcoholic dementia took hold in the last stages of his long heavy drinking.
- Alcoholic dementia left recent things forgotten while older memories stayed whole.
