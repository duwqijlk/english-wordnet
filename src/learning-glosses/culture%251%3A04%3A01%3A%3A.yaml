simpleMeaning: In biology, the process of growing microbes such as bacteria in a prepared substance that
  feeds them, for example jelly or agar.
scope: This is the lab process of growing microbes, not a society or civilization, not the artistic tastes
  of a social group, not the shared knowledge and values of a society, not a refined state of perfection,
  not the attitudes and behavior of a group, not the raising of plants or farm animals, and not the verb
  meaning to grow something in a special preparation.
examples:
- The culture of the sample in the lab took three days before any bacteria appeared.
- Bacteria from the wound were grown in culture to identify the strain.
