simpleMeaning: An antelope from East Africa that has horns which bend back and a neck that is slim.
scope: Among the antelopes of East Africa, this one is known by its slim neck and by horns that bend back.
examples:
- We saw a gerenuk in East Africa.
- The gerenuk lifted its slim neck and looked around.
