simpleMeaning: a row of atoms joined in a line that is not a ring, with one or more rows joined to its
  side
scope: A row of atoms with side rows joined to it, not a closed ring of atoms and not a straight row with
  no side rows.
examples:
- The branched chain in the molecule had two side chains attached to it.
- Scientists drew the branched chain with its side chains coming off the main line.
