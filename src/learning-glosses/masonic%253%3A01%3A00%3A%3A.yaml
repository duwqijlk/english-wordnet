simpleMeaning: Said of things that belong to the Freemasons, or have to do with Freemasonry.
scope: This word is used of things that belong to the Freemasons or have to do with Freemasonry, not of
  things that belong to any other group.
examples:
- He attended a Masonic lodge.
- She wore a Masonic ring.
