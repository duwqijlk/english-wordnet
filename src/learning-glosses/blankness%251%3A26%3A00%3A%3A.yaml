simpleMeaning: the state of being empty, with nothing there at all
scope: This is the state of being empty, with nothing there; it is not the act of making something empty
  and not a short time when you cannot think of an answer.
examples:
- She stared at the blankness of the empty page and did not know where to start.
- A feeling of blankness filled his mind after the long, tiring day.
