simpleMeaning: eggs from a lobster that cannot grow into young ones; they turn red when cooked and sit
  on food to make it look good or colour sauces
scope: This is a food made from lobster eggs; it is not the living sea animal, not its hard frame used
  to make jewelry, and not a deep pink colour.
examples:
- She spooned the coral from the lobster over the rice.
- The chef mixed coral into the sauce to give it colour.
