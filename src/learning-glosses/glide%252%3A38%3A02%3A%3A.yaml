simpleMeaning: to make a thing move or go by in a quiet, smooth way that is hard to notice
scope: To make a thing move quietly and smoothly, not to fly a glider and not a speech sound.
examples:
- She glided the tray across the table without a sound.
- He glided past the sleeping guard without waking him.
