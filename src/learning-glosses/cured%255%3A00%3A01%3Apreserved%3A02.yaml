simpleMeaning: of tobacco, aged on purpose so it will keep for a long time
scope: Of tobacco aged on purpose so it will keep, also called aged, not concrete kept damp to harden,
  and not meat in salty water or hay left to dry.
examples:
- The cured tobacco was left to age in the barn.
- Cured leaves hung in rows from the beams.
