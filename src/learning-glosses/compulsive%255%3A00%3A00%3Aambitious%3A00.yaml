simpleMeaning: Having a strong push inside to do well and reach a goal
scope: Determined and driven are other names for this sense; this is a strong wish to do well, not a person
  who cannot stop doing certain things and not a habit from a troubled mind.
examples:
- Her compulsive drive to succeed wore her out.
- He was compulsive about winning every race.
