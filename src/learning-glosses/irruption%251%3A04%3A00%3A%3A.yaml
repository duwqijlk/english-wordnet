simpleMeaning: A sudden, forceful rush inward, breaking in all at once.
scope: A sudden, forceful rush in, not a sudden outbreak of something bad, and not a sudden rise in the
  numbers of a group.
examples:
- The irruption of the crowd into the hall startled everyone.
- An irruption of water burst into the cellar.
