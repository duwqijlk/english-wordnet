simpleMeaning: a piece of music written for two people to play or sing together
scope: A piece of music for two people to perform together, also called a duo or a duette; not the dance
  for two people in ballet that shares this name.
examples:
- They played a duet for piano and violin.
- She sang a duet with her brother at the concert.
