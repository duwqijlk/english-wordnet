simpleMeaning: in a way that uses great care and effort and pays close attention to every small detail
scope: 'Also called fastidiously: done with great care and with close attention to each small detail,
  not done quickly or with little care.'
examples:
- He painstakingly checked every name on the list, one by one.
- She painstakingly wrote out each small step so no one would miss it.
