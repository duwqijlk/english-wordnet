simpleMeaning: To drag something loosely along a surface, or let it sweep the ground.
scope: To drag something loosely along a surface or let it sweep the ground, not a railway service, a
  line of coupled cars, or travel by rail; not an ordered series of things or events, a file of pack animals,
  or a chain of consequences; not a gown's trailing cloth or a set of gears; and not any act of teaching,
  learning, coaching, fitness exercise, child or animal discipline, plant shaping, or aiming.
examples:
- She trained her long scarf behind her as she ran across the yard.
- His long coat trained over the wet ground as he walked.
