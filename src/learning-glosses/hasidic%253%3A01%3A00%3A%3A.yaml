simpleMeaning: Of or about the Hasidim, a group of Jews, or about what its members believe and do.
scope: Also called Chasidic, Chassidic and Hassidic; this word describes things linked to the Hasidim,
  not other Jewish groups and not the beliefs themselves.
examples:
- He grew up in a Hasidic family in Brooklyn.
- She studies Hasidic music and prayer.
