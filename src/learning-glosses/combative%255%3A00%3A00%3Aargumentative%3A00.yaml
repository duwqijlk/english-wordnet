simpleMeaning: ready to argue or say no to others, and ready even to take a fight to a court of law
scope: 'Also called contentious, disputatious, disputative, and litigious: ready to argue and to go to
  court, not just trying hard to win while you argue.'
examples:
- His combative tone made the meeting hard, as he argued against every plan.
- She became combative and said she would take the matter to court.
