simpleMeaning: In the south, people once baked this flat maize bread without yeast, on the flat side of
  a farm tool held over an open fire.
scope: This southern bread is baked without yeast on the flat of a farm tool over an open fire, and is
  not a loaf raised with yeast.
examples:
- She baked a hoecake over an open fire.
- They ate hoecakes made of ground maize.
