simpleMeaning: A state in which the organs that clean the blood can no longer pass out waste and help
  keep the body's salts in balance.
scope: This is a state in which the organs that clean the blood can no longer pass out waste and help
  keep the body's salts in balance; renal failure is another name for it, not a short illness of those
  organs that passes on its own.
examples:
- Kidney failure left him unable to pass out waste.
- She was treated for kidney failure when her kidneys stopped working.
