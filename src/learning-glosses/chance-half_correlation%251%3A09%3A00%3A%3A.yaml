simpleMeaning: How steady a test is shows in a number worked out from marks on its two parts, matched
  one part against the other
scope: Also called a split-half correlation, it is a number that shows how steady a test is, worked out
  from marks on the test's two parts.
examples:
- The chance-half correlation for the test was high, so the test seemed steady.
- They worked out the chance-half correlation from the two parts of the test.
