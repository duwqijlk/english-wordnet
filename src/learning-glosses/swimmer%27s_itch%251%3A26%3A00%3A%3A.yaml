simpleMeaning: a skin rash that comes back when tiny worms in the water get into the skin again and again
scope: This is a skin rash that comes back after tiny water worms get into the skin, also called schistosome
  dermatitis; not a bite from one insect and not a rash from soap or sun.
examples:
- After swimming in the lake, he got swimmer's itch on his legs.
- Swimmer's itch made her arms itch for days.
