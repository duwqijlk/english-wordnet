senseId: 'duplicity%1:04:00::'
synsetId: 00754583-n
simpleMeaning: acting without honesty, by pretending to hold one set of plans while in truth you follow
  another set
scope: This is a way of acting, saying one aim while following another; it is not a single false claim
  and not an honest mistake.
examples:
- His duplicity was clear when he promised help but worked against us in secret.
- She left the job after she found duplicity in her partner's dealing with clients.
