simpleMeaning: to pass something along, or to be the way it travels from one place to another
scope: To pass something along or be the way it travels; carry, channel, conduct and convey are other
  names for this sense, and it is not giving someone knowledge or a skill.
examples:
- The cable imparts the signal from the dish to the television.
- Metal rods impart heat from the fire to the water.
