simpleMeaning: Coming from an old Greek way of ordering notes, this is one of a set of such ways in a
  tune, used in old songs of worship until 1600
scope: This way of ordering notes, coming from an old Greek way, is also called an ecclesiastical mode
  and a medieval mode, and it was used in old songs of worship until 1600.
examples:
- The choir sang the old chant in a church mode.
- The chant followed a church mode from before 1600.
