simpleMeaning: a part of the body made for taking in food by drawing it in, or for holding on to things
  by the pull of air
scope: A body part for taking in food or holding on by suction, not the flesh of a fish and not a new
  shoot from a plant's roots.
examples:
- The octopus held on to the rock with a sucker.
- The sucker on the fish lets it cling to stones.
