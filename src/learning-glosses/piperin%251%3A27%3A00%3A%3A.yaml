simpleMeaning: Something got from pepper, above all black pepper, that makes black and white pepper hot.
scope: A stuff got from pepper, above all black pepper, that makes black and white pepper hot; piperine
  is another name for this sense, not the hot stuff in chillies and not a spice on its own.
examples:
- Piperin is what gives black pepper its bite.
- White pepper owes its heat to piperin.
