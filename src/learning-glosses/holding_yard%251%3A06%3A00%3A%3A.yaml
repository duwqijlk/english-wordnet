simpleMeaning: for a short time, farm animals are kept in this fenced place
scope: 'Also called holding paddock and holding pen: a fenced place where farm animals are kept for a
  short time, not a yard where they live and not a field where they graze.'
examples:
- The cattle stood in the holding yard all morning.
- The holding yard was full of sheep waiting for the truck.
