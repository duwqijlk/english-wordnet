simpleMeaning: the skin shows small raised spots as its hairs rise by themselves, from cold, strong feelings,
  or a sore, itchy patch of skin
scope: Small raised spots where the hairs on the skin rise by themselves, also called goose bump, goose
  skin, goosebump, gooseflesh, horripilation and pilomotor reflex, not a spot that needs care and not
  a chill in the body.
examples:
- Goose pimples rose on his neck as the cold air hit him.
- Her arms were covered in goose pimples during the sad song.
