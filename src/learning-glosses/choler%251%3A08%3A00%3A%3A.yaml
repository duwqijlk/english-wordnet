simpleMeaning: A body fluid that people once thought came from the liver and made people quick to anger
scope: A body fluid that people once thought came from the liver and made people quick to anger; not anger
  itself and not the other body fluids of the old teaching.
examples:
- In old books, choler was said to come from the liver.
- His choler rose quickly when he was crossed.
