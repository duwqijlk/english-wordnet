simpleMeaning: A cover for a bed, made from two pieces of cloth with filling stitched in between them
scope: Also called comfort, this is a bed cover made of two cloth layers with filling stitched inside,
  not a powder pad and not a light pastry.
examples:
- He spread the puff over the bed.
- The puff on the bed was thick and warm.
