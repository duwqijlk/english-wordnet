simpleMeaning: The mucous lining of the uterus, which thickens under hormones; without pregnancy it is
  shed at menstruation, with pregnancy it comes away with the placenta at birth.
scope: This is the tissue lining the womb that thickens and is shed each cycle, not the muscular wall
  of the uterus, and not the placenta.
examples:
- During each cycle the endometrium thickens, then breaks down and is shed.
- The scan showed a thin endometrium, which helped explain the irregular bleeding.
