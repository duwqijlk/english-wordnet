simpleMeaning: Short electrical discharges, each lasting about ten milliseconds, that burst from the tops
  of huge storm clouds and widen into cones of blue light as they shoot upward.
scope: This is the upward flash of blue light from the top of a giant storm cloud; blue jet and jet are
  other names for the same thing, and it is not ordinary cloud-to-ground lightning.
examples:
- The team filmed reverse lightning climbing from a storm cloud at night.
- Reverse lightning spreads into a cone as it rises instead of striking downward.
