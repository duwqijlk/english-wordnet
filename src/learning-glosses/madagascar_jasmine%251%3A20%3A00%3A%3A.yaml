simpleMeaning: A twining woody vine from an island off Africa, with thick dark waxy evergreen leaves and
  clusters of large sweet-smelling white flowers along its stems; widely grown in warm regions.
scope: A climbing vine with white flowers, also called waxflower and Stephanotis floribunda, close to
  true jasmine but a different vine, widely grown in warm regions.
examples:
- Madagascar jasmine climbed the warm wall in bloom.
- The scent of Madagascar jasmine filled the garden.
