simpleMeaning: Held to be the forebear of the tame animal kept in houses, this wild hunter of Europe has
  a thick furry tail and looks like that tame animal.
scope: This wild hunter has no other name in this set, and it is not the tame animal kept in houses itself.
examples:
- A catamountain crossed the track and vanished into the trees.
- The catamountain moved through the trees with its thick tail held low.
