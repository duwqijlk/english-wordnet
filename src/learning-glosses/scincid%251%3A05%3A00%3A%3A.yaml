simpleMeaning: an alert, agile lizard with reduced legs, a long body covered in shiny scales, and a need
  for more moisture than most other lizards, living throughout the tropics worldwide.
scope: Another name for scincid lizard and skink; this is the shiny-scaled lizard with reduced legs, not
  a snake or another reptile such as a gecko.
examples:
- A small scincid darted under a rock when we approached.
- Scincids need more moisture than most other lizards.
