simpleMeaning: an amount that can change in value and can be split into smaller parts that together make
  the whole amount
scope: An amount that can be split into parts. It is not an agent that carries disease, not an agent used
  to carry material into a cell, and not a straight line with length and direction.
examples:
- The teacher showed how one vector can be split into two smaller parts.
- In this problem, the vector changes in value when the force grows stronger.
