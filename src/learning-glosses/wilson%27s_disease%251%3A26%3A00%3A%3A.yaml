simpleMeaning: A rare illness passed down in families in which the body mishandles copper, so that copper
  builds up in the liver, then in the red blood cells and the brain.
scope: 'Also called hepatolenticular degeneration: a rare illness of copper handling passed down in families,
  in which copper builds up first in the liver and then in the red blood cells and the brain.'
examples:
- Wilson's disease runs in families.
- Copper builds up in Wilson's disease.
