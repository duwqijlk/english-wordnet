simpleMeaning: one bump in a row along a wavy edge, or the dip between two, as on a leaf, cloth, shell
  rim or a red blood cell shrunk in salt water
scope: A bump or dip along a curving edge such as a leaf, cloth or shell rim, also called scallop; not
  the battlement sense, the open gap between raised blocks on a castle wall.
examples:
- A row of small crenelles ran along the leaf's edge.
- The shell's rim curved into a series of crenelles.
