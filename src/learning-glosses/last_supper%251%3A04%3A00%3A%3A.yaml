simpleMeaning: The traditional Passover meal of Jesus with his followers on the night before he was put
  to death on the cross
scope: The meal Jesus shared with his followers the night before his death, also called Lord's Supper;
  not a meal of Jesus at any other time.
examples:
- The Last Supper took place on the night before Jesus died.
- Paintings of the Last Supper show Jesus with his twelve followers.
