simpleMeaning: Each tube that carries a woman's eggs is tied in two places, and the bit between is taken
  out, so she can have no more babies.
scope: This is a lasting form of birth control for women, done by tying the tubes that carry their eggs.
examples:
- After tubal ligation, a woman cannot have more babies.
- The lasting choice she made was tubal ligation.
