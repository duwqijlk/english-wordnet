senseId: indistinguishable%5:00:00:same:00
synsetId: 02071531-s
simpleMeaning: Exactly the same as another thing, with no difference that a person can see or notice
scope: Identical is another name for this sense; this is about things that are exactly alike, not about
  things that differ but cannot be told apart.
examples:
- They wore indistinguishable hats to the party.
- Rows of indistinguishable houses lined the street.
