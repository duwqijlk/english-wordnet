simpleMeaning: In Jewish folk tales, a bad spirit that goes into a living person and takes over how that
  person acts
scope: A bad spirit that takes over a living person's body in Jewish folk tales, not a ghost that haunts
  a house; dybbuk is another name for this sense.
examples:
- In the tale, a dibbuk entered the man and spoke through him.
- She feared a dibbuk had taken over her brother's body.
