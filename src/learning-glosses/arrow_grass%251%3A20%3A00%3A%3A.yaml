simpleMeaning: Farm animals can at times be poisoned by this plant, which lives year after year in thick
  bunches in shallow water or wet soft ground.
scope: This is a plant of shallow water and marshland that lives year after year and can at times poison
  farm animals.
examples:
- Thick bunches of arrow grass grew along the edge of the pond.
- The farmer kept his cattle away from the arrow grass in the marsh.
