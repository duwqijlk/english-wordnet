simpleMeaning: a nose grown big, with wide skin pores, redness, and blood vessels that stand out, often
  seen in people who drink far too much
scope: 'Also called a brandy nose, a copper nose, a hammer nose, hypertrophic rosacea, rhinophyma, a rum-blossom,
  a rum nose, or a toper''s nose: a big red nose with wide pores, not a nose broken in a fight.'
examples:
- His potato nose was red and swollen.
- Years of heavy drinking left him with a potato nose.
