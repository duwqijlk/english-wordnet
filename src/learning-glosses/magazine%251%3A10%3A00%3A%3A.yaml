simpleMeaning: a publication that comes out regularly and contains pictures, stories and articles for
  people who buy it or subscribe.
scope: This is not a single printed copy and not the company that produces it; it is the publication itself,
  issued regularly.
examples:
- The magazine comes out every month.
- She writes articles for a travel magazine.
