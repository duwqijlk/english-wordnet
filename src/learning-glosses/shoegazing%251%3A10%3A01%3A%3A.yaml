senseId: 'shoegazing%1:10:01::'
synsetId: 91000761-n
simpleMeaning: A branch of alternative rock typically marked by significant use of guitar distortion and
  feedback, by obscured vocals, and by component musical parts blurred into indistinguishable walls of
  sound.
scope: A kind of alternative rock, marked by distorted guitars, feedback and singing that is hard to make
  out.
examples:
- The band's early records were pure shoegazing, with layers of distorted guitar and vocals buried deep
  in the mix.
- Critics called the album shoegazing because the guitars washed over everything and the singer's voice
  disappeared into the sound.
