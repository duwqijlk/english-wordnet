simpleMeaning: the weight of a basket full of raisins or figs, from 50 to 75 pounds
scope: The weight of a basket full of raisins or figs, not the basket itself and not a weak person.
examples:
- A frail of raisins weighs between 50 and 75 pounds.
- The trader sold the figs by the frail.
