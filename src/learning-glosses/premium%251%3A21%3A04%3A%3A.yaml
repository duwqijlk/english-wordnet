simpleMeaning: something given as a prize to make people buy things, take part in a contest run by a business,
  or do other such things
scope: A prize given to make people buy or join in; not a reward from the government for catching criminals
  and not a fee.
examples:
- The store gave a premium with every purchase.
- They offered a premium to customers who entered the contest.
