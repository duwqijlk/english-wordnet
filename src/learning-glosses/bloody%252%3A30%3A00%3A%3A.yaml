simpleMeaning: cover something with the red liquid that flows in the body.
scope: This is the action of covering something with red body fluid, not the adjective sense or the informal
  British intensifier.
examples:
- She bloodied her hands pulling him from the wreck.
- The fall bloodied his knees.
