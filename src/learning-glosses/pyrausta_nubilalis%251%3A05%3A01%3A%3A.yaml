simpleMeaning: A moth from Europe whose young in America bore into the stems and tops of corn and other
  plants.
scope: Also called corn borer, corn borer moth and European corn borer moth; a moth from Europe whose
  young bore into corn stems, not the young itself as a pest of maize and not a moth that eats cloth.
examples:
- Pyrausta nubilalis is a moth from Europe whose young bore into corn stems.
- Farmers in America watch for Pyrausta nubilalis in their corn fields.
