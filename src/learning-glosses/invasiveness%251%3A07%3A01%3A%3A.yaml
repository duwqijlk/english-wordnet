simpleMeaning: How far a medical act goes into the living body, by cutting it open or by putting a tool
  inside it
scope: How far a medical act goes into the living body, not how far a disease spreads through healthy
  parts of the body.
examples:
- The new keyhole method greatly reduced the invasiveness of the operation.
- Doctors weigh the invasiveness of a test before they choose it.
