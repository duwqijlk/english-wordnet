simpleMeaning: a small thin piece of wood or metal, often with a point, used to hold things together,
  hold a thing up, or fix one thing to another
scope: A small thin piece of wood or metal used to hold things together, not a piece of jewellery worn
  on clothes and not a wooden thing used in bowling.
examples:
- She used a pin to hold the hem in place.
- He fixed the note to the board with a pin.
