simpleMeaning: the skins or outer coverings that animals and other living things throw off when they shed
  their skin
scope: Skins or coverings shed by living things, not the living animal itself and not a shell it keeps.
examples:
- The scientist found the exuviae of the crab on the beach.
- Exuviae from the snake lay beside the rock where it had shed its skin.
