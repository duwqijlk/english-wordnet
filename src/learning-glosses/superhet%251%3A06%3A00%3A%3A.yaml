simpleMeaning: A radio set that joins a home-made wave with the carrier wave to make a wave above hearing
  that is then pulled apart and made louder.
scope: This sense is also called heterodyne receiver and superheterodyne receiver.
examples:
- A superhet joins two waves.
- Superhets make waves louder.
