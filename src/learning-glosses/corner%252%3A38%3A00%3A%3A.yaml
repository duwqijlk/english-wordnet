simpleMeaning: to pass around a bend in a road or path, changing direction as you go.
scope: This is not the inside angle between two walls, and not the act of trapping someone; it describes
  a vehicle or person passing around a bend.
examples:
- The taxi cornered sharply and sped down the hill.
- This little car corners well on mountain roads.
