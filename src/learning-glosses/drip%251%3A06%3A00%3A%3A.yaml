simpleMeaning: In architecture, a part that sticks out from a top edge or window sill and keeps rainwater
  away from the area below, as over a window or door
scope: In architecture, a part that sticks out to keep rain off the wall below, not water falling in drops.
examples:
- A stone drip runs above the doorway to keep rainwater clear of the wall.
- The drip over the window stops rain from running down the glass.
