simpleMeaning: Into fertilizer, animal feed, and plastics goes the main solid part of mammal urine, made
  from ammonia and carbon dioxide.
scope: Also called carbamide, this main solid part of mammal urine is made from ammonia and carbon dioxide
  and used as fertilizer, in animal feed, and in plastics.
examples:
- The lab tested the urea in the sample.
- The urea went into fertilizer bags.
