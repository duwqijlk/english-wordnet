simpleMeaning: A drug made from a chemical called phenothiazine that calms a troubled mind, used to make
  a person sleepy and calm
scope: Also called chlorpromazine; a drug made from a chemical called phenothiazine that calms a troubled
  mind, used both to calm the mind and to make a person sleepy.
examples:
- Thorazine calmed her troubled mind.
- The doctor gave him Thorazine to help him sleep.
