simpleMeaning: a large wagon made to look fine with bright decoration, used to carry a group of people
  who play music
scope: A real wagon that carries music players, often in a parade, not the idea of joining something only
  because it is popular.
examples:
- The bandwagon led the parade, with the music players sitting high on top.
- Children waved as the bright bandwagon rolled slowly down the street.
