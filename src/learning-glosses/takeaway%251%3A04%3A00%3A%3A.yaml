simpleMeaning: getting the ball or puck from the attacking team, for example by catching a pass meant
  for a player on that team
scope: In sport, getting the ball or puck from the attacking team; not food bought to eat at home, and
  not the main point you learn from something.
examples:
- The defender made a takeaway in the last minute of the game.
- A takeaway by their best player stopped the attack at once.
