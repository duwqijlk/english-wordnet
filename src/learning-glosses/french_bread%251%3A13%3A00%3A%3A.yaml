simpleMeaning: A crusty loaf made with sour dough, often baked in long thin loaves that narrow at the
  ends, or in baguettes.
scope: A crusty sour-dough loaf baked long, thin and tapered or as a baguette, a table loaf rather than
  a soft sandwich loaf.
examples:
- French bread crackled as she broke it.
- He bought a loaf of French bread for dinner.
