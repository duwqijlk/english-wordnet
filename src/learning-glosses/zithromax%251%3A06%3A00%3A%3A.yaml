simpleMeaning: A medicine that works through the whole body to kill germs, given to treat infections caused
  by germs in many parts of the body.
scope: Also called azithromycin; a medicine that works through the whole body to kill germs, not a cream
  for one spot or a drug for viruses.
examples:
- The doctor prescribed Zithromax for the infection.
- Zithromax cleared up the chest infection.
