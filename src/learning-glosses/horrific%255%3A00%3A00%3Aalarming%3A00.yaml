simpleMeaning: That fills people with fear, dread, or terror.
scope: Also called terrible, awful, dread, dreadful, frightening, fearful, dreaded, fearsome, and dire,
  this is about causing fear, dread, or terror, not about being grossly offensive to what is right.
examples:
- The news of the crash was horrific.
- They faced a horrific storm that night.
