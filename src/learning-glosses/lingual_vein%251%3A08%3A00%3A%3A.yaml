simpleMeaning: Blood from the tongue and the floor of the mouth is poured by this blood tube into the
  neck or face blood tube
scope: Also called vena lingualis, this blood tube takes blood from the tongue and the floor of the mouth
  and pours it into the neck or face blood tube.
examples:
- The lingual vein runs under the tongue.
- Blood from the floor of the mouth leaves through the lingual vein.
