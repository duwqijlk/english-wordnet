simpleMeaning: Air gets into the body through this part that picks up smells, set in the face that juts
  out in people and other mammals.
scope: The nose is another name for this part of the face, which juts out in people and other mammals
  and lets air in.
examples:
- Air went in through his olfactory organ.
- His olfactory organ picked up the smell.
