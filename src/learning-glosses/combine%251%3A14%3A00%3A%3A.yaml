simpleMeaning: A group of separate firms that join together to cut down competition, by holding back how
  much of a thing is made and sold
scope: 'Also called trust: a group of firms joined to cut down competition, not a farm machine and not
  the act of joining things together.'
examples:
- The firms formed a combine to control the price of steel.
- A combine of small makers tried to keep new firms out of the trade.
