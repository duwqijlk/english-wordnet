simpleMeaning: A haddock cooked with lots of butter, most often baked in the oven but at times cooked
  under strong heat from above
scope: 'Also called finnan haddie and finnan haddock: a haddock cooked with lots of butter, not a fresh
  haddock and not a fish cooked without butter.'
examples:
- We had finnan for supper, baked with plenty of butter.
- The finnan came to the table hot from the oven.
