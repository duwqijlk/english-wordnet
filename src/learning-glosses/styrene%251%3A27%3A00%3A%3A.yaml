simpleMeaning: a clear oily liquid that is the small piece which joins to others to make a larger material
scope: 'Also called cinnamene, phenylethylene or vinylbenzene: a clear oily liquid that is a building
  piece for a larger material, not the finished material itself and not a gas.'
examples:
- The styrene in the bottle was a clear oily liquid.
- Workers used styrene to make the larger material.
