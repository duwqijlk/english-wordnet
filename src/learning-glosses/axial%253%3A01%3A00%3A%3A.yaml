simpleMeaning: to do with, or like, an axis, a line through the middle of a thing that the thing turns
  around
scope: To do with a line a thing turns around, not to do with its outer edge and not to do with moving
  in a straight line.
examples:
- The axial line runs through the centre of the spinning wheel.
- In an axial view, you look along the line the part turns around.
