senseId: 'dihybrid%1:05:00::'
synsetId: 01330406-n
simpleMeaning: A hybrid whose parents differ in only two places in their genes, with two forms at each
  place.
scope: A cross whose parents differ at two gene places only, not a cross that differs at one place and
  not a cross that differs at many places.
examples:
- The dihybrid peas came from parents that differed at two gene places.
- A dihybrid has two forms of each of two genes.
