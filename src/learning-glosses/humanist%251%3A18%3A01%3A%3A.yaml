simpleMeaning: a person who speaks for and supports ideas that put people first, and who cares about what
  people need and how well they live
scope: 'Also called humanitarian: a person, not a describing word for a set of ideas about people''s worth,
  for values that care for people, for learning in Europe long ago, or for subjects like history and languages.'
examples:
- As a humanist, she spoke for free schools and care for the poor.
- The humanist worked to help people live better lives.
