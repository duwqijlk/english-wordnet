  sharp points on one side.
scope: Also called a corrugated fastener, it is a small strip of wavy steel with sharp points on one side,
  hammered across joins in wood in rough carpentry work.
examples:
- A wiggle nail was hammered across the wood joint.
- The wiggle nail sat across the wood joint.
