simpleMeaning: a small tree or bush of New Zealand with masses of bright white flowers that smell of honey,
  growing from the leaf joints, and bark used to make rope
scope: 'Also called lacebark and ribbonwood: a small New Zealand tree or bush, not a willow and not a
  flax plant.'
examples:
- The houhere by the stream was covered in bright white flowers that smelled of honey.
- People use houhere bark to make rope for tying things.
