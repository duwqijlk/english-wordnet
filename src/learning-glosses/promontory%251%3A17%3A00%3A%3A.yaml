simpleMeaning: a natural high piece of land, especially a rocky one that sticks out into the sea
scope: 'Also called head and headland: a high piece of land, especially rock, that sticks out into the
  sea, not a low beach and not a cliff face on its own.'
examples:
- The lighthouse stood on a rocky promontory above the sea.
- From the promontory we could see ships far out on the water.
