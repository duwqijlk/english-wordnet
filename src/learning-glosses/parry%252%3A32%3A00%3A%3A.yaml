simpleMeaning: to stay away from a duty, a question, or a problem, or to try to stay away from it
scope: To stay away from a duty, a question, or a problem, also called duck, skirt, hedge, dodge, evade
  and elude, not to block a blow in a fight.
examples:
- The minister parried every question about the missing money.
- She parried the task by saying she had no time.
