simpleMeaning: a round part of a line or road where it bends
scope: Also called turn, twist, and bend, this is a round part of a line or road, not a person who breaks
  the law.
examples:
- The car slowed for the sharp crook in the road ahead.
- They followed the crook in the path down to the river.
