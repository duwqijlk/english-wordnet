simpleMeaning: A stop on a bicycle that works when the rider pushes the pedals backwards.
scope: This is a stop on a bicycle that works when the rider pushes the pedals backwards; not a hand stop
  on the handlebars and not a stop for a car.
examples:
- Her coaster brake caught as soon as she pushed the pedals back.
- The old bike had a coaster brake instead of hand levers.
