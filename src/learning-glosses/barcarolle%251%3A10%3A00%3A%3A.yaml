simpleMeaning: a tune sung by the men who row the long, narrow boats of Venice while on the water
scope: 'Also called a barcarole: a song sung on a boat, not a piece of music for dancing and not a boat
  itself.'
examples:
- A barcarolle rose from the boat as it passed under the bridge.
- The singer ended the evening with a gentle barcarolle.
