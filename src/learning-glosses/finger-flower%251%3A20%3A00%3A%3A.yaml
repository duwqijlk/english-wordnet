simpleMeaning: A tall leafy European plant that lives two years or more and bears bunches of tube-shaped
  pink-purple blooms; its foliage provides the heart drug digitalis but poisons livestock.
scope: The European foxglove, the same poisonous plant that fairy bell and finger-root name; not a bellflower
  or another plant with bell-shaped blooms.
examples:
- One finger-flower can send up a tall spike of huge pink-purple blooms.
- Cattle grazing beside the finger-flower were poisoned by its leaves.
