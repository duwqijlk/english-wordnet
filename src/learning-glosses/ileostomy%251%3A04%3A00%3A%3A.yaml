synsetId: 00682324-n
simpleMeaning: An operation to cut an opening from the end of the small gut through the belly wall, so
  waste leaves there, for cancer or lasting sores in the large gut.
scope: An operation that makes a new way out for waste through the belly wall.
examples:
- After the ileostomy, waste left her body through the new opening.
- His ileostomy was done because of cancer of the colon.
