simpleMeaning: Given the same way to all, these steps show sharp senses, memory, thought, skill at learning,
  and how a person acts with others, and the like.
scope: It is also called test, mental test, and mental testing, and it measures a person in the same fixed
  way each time.
examples:
- The psychometric test was standardized on a large sample of students.
- A psychometric test showed how well the group could remember lists of words.
