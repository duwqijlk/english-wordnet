simpleMeaning: in a way that is short, sudden and rude, showing no time or patience for the other person
scope: Speaking or acting in a way also called short or shortly, not in a long, polite way and not in
  a friendly, warm way.
examples:
- He told me curtly to get on with it.
- She answered him curtly and walked away.
