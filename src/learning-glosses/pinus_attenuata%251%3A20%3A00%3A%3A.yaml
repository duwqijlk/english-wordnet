simpleMeaning: A middle-sized pine of the Pacific coast of the United States, with three needles in a
  bunch and a clear knob on each scale of the cone
scope: 'Also called knobcone pine: a middle-sized pine of the Pacific coast with a clear knob on each
  cone scale, not a pine with smooth cones and not a tall forest pine.'
examples:
- Each cone of Pinus attenuata has a clear knob on every scale.
- Pinus attenuata grows along the Pacific coast of the United States.
