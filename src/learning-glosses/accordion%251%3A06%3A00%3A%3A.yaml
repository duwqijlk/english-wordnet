simpleMeaning: A box-shaped musical instrument you carry, whose thin strips sound when the player pushes
  air through them from its folding sides.
scope: A box-shaped instrument played by pushing air through thin strips, not a piano and not a pipe.
examples:
- He played the accordion at the village dance.
- She carried her accordion onto the stage.
