schema: oewn-learning-gloss-v2
senseId: 'chronically%4:02:00::'
synsetId: 00141918-r
simpleMeaning: in a way that grows slowly and lasts for a long time
scope: This is about a thing that grows slowly and lasts for a long time, not about a habit that a person
  has kept for a long time.
examples:
- She is chronically ill, and her illness grew slowly over many years.
- The patient was chronically ill and needed care for a long time.
