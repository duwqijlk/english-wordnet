simpleMeaning: much more in amount or level than is usual, as much as it can be
scope: This says that an amount or level is far past the usual, not that something is at the far end of
  a place and not just a little strong.
examples:
- Extreme heat made it unsafe to work outside at noon.
- They live where extreme cold lasts for months each winter.
