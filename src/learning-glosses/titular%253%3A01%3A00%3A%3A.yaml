simpleMeaning: Of, or borne with, a title that marks a person as noble.
scope: Of, or borne with, a title that marks a person as noble, with no other sense of the word to set
  against it.
examples:
- He was titular head of the house, though his brother held the power.
- Her rank was titular, a noble name with no land behind it.
