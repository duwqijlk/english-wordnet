simpleMeaning: Growth until a thing reaches the whole world in size or reach
scope: 'Also called globalization: growth that spreads a thing across the whole world, and it is not growth
  that stays within one land, nor a change that touches only one town.'
examples:
- The globalisation of the communication industry changed how news travels.
- Globalisation has made goods from far away easy to buy.
