simpleMeaning: 'a Gestalt rule about how the mind groups what it sees: by nature we see a line as keeping
  its set direction'
scope: A Gestalt rule about how the mind groups what it sees, also called continuation or good continuation,
  not the rule about things near each other and not the rule about things moving together.
examples:
- The law of continuation says we see a line as keeping its direction.
- The law of continuation makes the broken line look whole.
