simpleMeaning: This part of the United States government protects wild land and natural resources and
  helps make use of them, and it began in eighteen forty-nine.
scope: Also called Interior, DoI and Department of the Interior, this is the part of the United States
  government that looks after wild land and natural resources, not a state office.
examples:
- The Interior Department manages national parks.
- She works for the Interior Department in Washington.
