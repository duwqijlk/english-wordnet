simpleMeaning: lying in the corner between south and west, or turned to face that way
scope: For a thing that lies or faces toward the corner between south and west, not the compass mark itself
  and not the direction it points to.
examples:
- The southwest wing of the house gets the evening sun.
- They live in a southwest corner of the county.
