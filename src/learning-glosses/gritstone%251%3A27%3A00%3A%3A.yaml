simpleMeaning: This sandstone is hard and rough, built from big grains and much of the hard stuff in sand
  and rock
scope: A hard, coarse-grained sandstone, also called grit and gritrock, not a smooth polished stone and
  not loose gravel.
examples:
- The old bridge was made of gritstone.
- Gritstone walls lined the lane, grey and rough.
