simpleMeaning: a person who cannot catch a certain illness because their body fights it off
scope: A person who cannot catch a certain illness; not the adjective senses about the body's power to
  fight off illness or about the state of being safe from illness.
examples:
- As an immune, he was sent to care for patients with the disease.
- The nurse, an immune who had already had the fever, worked on the ward.
