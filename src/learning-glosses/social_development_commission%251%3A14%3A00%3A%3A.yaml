simpleMeaning: A part of the Economic and Social Council of the United Nations that looks after how people
  live and grow.
scope: This word is for the social development part of that council, not the part that looks after how
  many people there are and not the part that looks after the standing of women.
examples:
- The Social Development Commission met to talk about how people live and grow.
- The Social Development Commission gave its report on how people live and grow.
