simpleMeaning: Wooing the crowd to spread a thing and bring it into wide use.
scope: This sense is also called generalize and popularize, for wooing the crowd to spread a thing and
  bring it into wide use, unlike the sense for speaking or writing in broad terms, and unlike the sense
  for to draw from set cases to wider cases.
examples:
- They generalise the song, wooing the crowd.
- They generalise fashions.
