simpleMeaning: In astronomy, a small hard body from beyond the earth that strikes the air around the earth
scope: A small hard body from space that hits the earth's air, not a streak of light in the sky and not
  a rock found on the ground.
examples:
- Scientists watched the meteor as it hit the earth's air.
- A meteor struck the air above the town and lit the sky.
