simpleMeaning: a stick that splits into two parts, said to bend down to show where water or oil lies under
  the ground
scope: A forked stick said to point down to water or oil under the ground, also called a dowser or a dowsing
  rod, and not a stick used to dig or a tool that truly finds water.
examples:
- He walked the field with a divining rod, watching for it to dip.
- The divining rod dipped over the spot where they hoped to find water.
