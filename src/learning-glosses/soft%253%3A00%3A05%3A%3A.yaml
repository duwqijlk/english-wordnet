simpleMeaning: 'Diffused light: it comes from a large source or bounces off a surface rather than one
  bright point.'
scope: This is about the spread of light, not how bright it is, and not a quiet sound or a yielding surface.
examples:
- The photographer waited for soft evening light instead of the harsh midday sun.
- A soft lamp behind a white shade filled the room with even light.
