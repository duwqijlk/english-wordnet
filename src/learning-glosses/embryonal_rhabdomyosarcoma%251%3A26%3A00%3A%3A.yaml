simpleMeaning: a kind of cancer that grows in muscle, found mostly in babies and young children
scope: 'Also called embryonal rhabdosarcoma: a kind of cancer that grows in muscle, found mostly in babies
  and young children, not a cancer of the bone and not a cancer found mostly in grown people.'
examples:
- The baby was treated for an embryonal rhabdomyosarcoma in her leg.
- Doctors found the embryonal rhabdomyosarcoma early, while the child was still small.
