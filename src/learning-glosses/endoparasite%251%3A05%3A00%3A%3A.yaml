simpleMeaning: one of many small living things that live inside an animal's inner body parts and take
  food from it, in particular gut worms
scope: 'Also called endozoan, entoparasite, entozoan and entozoon: a small living thing that lives inside
  an animal''s inner body parts and takes food from it, not one that lives on the skin and not one that
  lives free in soil or water.'
examples:
- The endoparasite lived in the dog's gut and took food from it.
- Endoparasites such as gut worms live inside an animal's inner body parts.
