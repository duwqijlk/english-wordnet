simpleMeaning: a formal paper that sets out a fact about money and gives its holder a right to interest
  or dividends
scope: A money paper that gives its holder a right to interest or dividends, also called security; not
  the act of giving someone such a paper.
examples:
- He held several valuable certificates in the bank.
- The certificate gave her the right to interest each year.
