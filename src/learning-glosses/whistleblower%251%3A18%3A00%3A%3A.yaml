simpleMeaning: a person who tells others about bad or wrong acts inside a group or company, hoping to
  stop them
scope: This is a person who reports wrong acts inside his or her own group or company to stop them, not
  a person who only complains about a job.
examples:
- The whistleblower told reporters about the unsafe work at the factory.
- A whistleblower inside the company showed how managers had hidden the losses.
