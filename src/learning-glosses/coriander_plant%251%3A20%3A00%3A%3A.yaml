simpleMeaning: An Old World herb with pleasant-smelling leaves and seed like those of parsley.
scope: This is an Old World herb with pleasant-smelling leaves and seed like those of parsley; coriander
  and cilantro are other names for this sense, not the seed alone used as a spice and not parsley itself.
examples:
- The coriander plant grew beside the parsley.
- We picked leaves from the coriander plant for the salad.
