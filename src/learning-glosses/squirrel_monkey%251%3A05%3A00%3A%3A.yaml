simpleMeaning: This small long-tailed animal of Central America and the south of the Americas has greenish
  fur and a black nose.
scope: Among the small animals of Central America and the south of the Americas, this one is known by
  its long tail, greenish fur, and black nose.
examples:
- The squirrel monkey sat with its long tail curled round it.
- The squirrel monkey's greenish fur and black nose stood out as it moved.
