simpleMeaning: North American plants or low bushes with showy white flowers bear fruit you can eat, blue-black
  or purplish in colour, and this is one of many kinds of them.
scope: Shadbush, juneberry, serviceberry and shadblow are other names for this North American plant with
  showy white flowers and blue-black or purplish fruit you can eat, not the European tree of the same
  name.
examples:
- White flowers covered the service tree.
- The service tree bore blue-black fruit you can eat.
