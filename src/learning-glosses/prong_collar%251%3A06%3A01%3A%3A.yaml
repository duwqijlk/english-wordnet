simpleMeaning: a dog's neck band made of chain links, with flat-ended points turned in toward the neck
scope: A dog's neck band of chain links with flat-ended points turned in toward the neck; not a flat band
  of leather, and not a chain that pulls tight.
examples:
- The prong collar sat round the dog's neck.
- He put the prong collar on the dog before the walk.
