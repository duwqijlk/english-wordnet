simpleMeaning: In music, the special character of a complex sound that sets it apart from other sounds,
  whether a voice, a noise, or a musical tone
scope: In music, the special character of a complex sound, whether a voice, a noise, or a musical tone;
  also called quality and tone.
examples:
- The timber of her soprano was rich and lovely.
- The timber of the broken bell was muffled and low.
