simpleMeaning: The back part of a gun's aim has a piece you can move, with a small hole through which
  you line up the front part with the mark.
scope: This is the back part of a gun's aim, not the front part and not the mark itself.
examples:
- Through the peep sight, the front sight lined up with the target.
- The peep sight moved to line up the front sight with the mark.
