simpleMeaning: a substance made of joined parts, used to feed plants and to give nitrogen for making other
  things
scope: A substance used to feed plants and to give nitrogen for other uses, also called calcium-cyanamide,
  not the weak acid of the same name and not a plain plant food.
examples:
- The farmer spread cyanamide on the field before planting.
- Cyanamide gave the soil nitrogen for the new crop.
