simpleMeaning: In zoology, a part or mark on an animal's head or neck that can spread out and looks like
  a cloth cover for the head
scope: In zoology, a part or mark on an animal that can spread out like a head cover, not the metal cover
  over a car engine and not a leather cover for a hawk's head.
examples:
- The cobra spread its hood and hissed.
- The snake's hood rose as it faced the dog.
