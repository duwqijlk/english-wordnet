simpleMeaning: Behaviour that annoys or upsets other people, done without care for what may happen or
  done on purpose to hurt them
scope: Also called mischief, devilry, devilment, roguery, roguishness, deviltry, mischief-making and mischievousness.
  This is behaviour that annoys or upsets others, done without care or on purpose to hurt, not the use
  of tricks to cheat someone.
examples:
- His shenanigans at work annoyed everyone in the office.
- The teacher will not put up with any shenanigans in class.
