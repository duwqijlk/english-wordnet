simpleMeaning: Its dark colour stops light from bouncing about inside the eye, where this thin layer full
  of blood vessels lies between the part that sees and the white outer coat
scope: This thin layer full of blood vessels in the eye is also called a choroid coat, and its dark colour
  stops light from bouncing about inside.
examples:
- The choroid lies between the seeing part of the eye and the white outer coat.
- A dark choroid keeps light from bouncing about inside the eye.
