simpleMeaning: A farm tool used to break up the top of the soil, to let air in, keep weeds down, and hold
  water in the ground
scope: A farm tool for breaking up the top of the soil, not a person who works the land.
examples:
- He pushed the tiller across the field to break up the soil.
- The farmer used a tiller before planting the seeds.
