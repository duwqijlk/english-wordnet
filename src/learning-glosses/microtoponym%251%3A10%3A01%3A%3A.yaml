simpleMeaning: A name for a small natural place, such as a field, a path, a bridge or a ditch.
scope: A name for a small natural place, such as a field, a path, a bridge or a ditch; not the name of
  a town and not the name of a person.
examples:
- The old microtoponym for the low field is still used by the farmers.
- Each microtoponym in the valley names a ditch or a path.
