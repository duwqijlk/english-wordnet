simpleMeaning: For a while after they come out of the egg, young birds stay in the nest
scope: For a while after they come out of the egg, young birds stay in the nest, not birds that leave
  the nest at once.
examples:
- Robins are nidicolous and stay in the nest for weeks after hatching.
- The nidicolous chicks waited in the nest for their parents to bring food.
