simpleMeaning: a tiny living unit, or a tiny living thing made of one such unit, that has a thin tail
scope: A tiny living unit, or a one-unit living thing, that has a thin tail, not one without a tail and
  not a living thing made of many units.
examples:
- A flagellated cell swims by beating its tail.
- The flagellated cell moved slowly across the slide.
