simpleMeaning: A chemical process that joins many small units into one large chain-like substance
scope: This is a chemical process that joins many small units into one large chain-like substance; polymerisation
  is another name for it, not the breaking apart of such a substance and not a change in its state.
examples:
- Polymerization turns small units into a long chain.
- The factory uses polymerization to make strong plastics.
