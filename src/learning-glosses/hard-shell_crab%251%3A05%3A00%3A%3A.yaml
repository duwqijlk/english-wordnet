simpleMeaning: A sea animal you can eat, whose outer cover is firm because it has not shed its old cover
  lately
scope: A crab you can eat with a firm outer cover, not a soft-shell crab and not a crab that has just
  shed its cover.
examples:
- We ate hard-shell crab with melted butter.
- The fisherman sorted the hard-shell crabs from the soft ones.
