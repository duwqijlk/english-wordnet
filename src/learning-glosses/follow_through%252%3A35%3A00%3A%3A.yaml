senseId: 'follow_through%2:35:00::'
synsetId: 01408670-v
simpleMeaning: to finish a stroke by letting the swing run on to its own end after a ball has been hit
  or let go
scope: In a game with a ball, to finish a stroke, not to start one and not to stop short after hitting.
examples:
- After he hit the ball, he followed through with his swing.
- The coach told her to follow through every time she served.
