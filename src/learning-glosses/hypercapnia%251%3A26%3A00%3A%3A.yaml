simpleMeaning: Blood that moves around the body holds too much carbon dioxide, a gas, in this state
scope: A state in which the blood that moves around the body holds too much carbon dioxide, also called
  hypercarbia; not a lack of oxygen and not too little carbon dioxide.
examples:
- The doctor said the hypercapnia came from too much carbon dioxide in his blood.
- The nurse watched for hypercapnia in the patient on the breathing machine.
