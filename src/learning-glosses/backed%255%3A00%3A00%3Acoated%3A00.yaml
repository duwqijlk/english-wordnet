simpleMeaning: used of film that has a coat on the back side, away from the light-sensitive layer, to
  take in light
scope: Film with a light-taking-in coat on the side away from the light-sensitive layer, not ordinary
  film with no such coat.
examples:
- The backed film kept stray light from fogging the picture.
- He loaded backed film into the old camera.
