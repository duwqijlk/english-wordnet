senseId: 'fore_edge%1:06:00::'
synsetId: 03387379-n
simpleMeaning: The side of a book's pages that turns in when the book stands on a shelf, the side far
  from the spine.
scope: The page side far from a book's spine; foredge is another name for this sense, not the spine and
  not the top or bottom side of the pages.
examples:
- The fore edge of the book was worn from years on the shelf.
- He ran his thumb along the fore edge to find his place.
