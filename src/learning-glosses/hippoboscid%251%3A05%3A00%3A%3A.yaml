simpleMeaning: A two-winged fly that sucks blood and lives on birds and mammals.
scope: A two-winged blood-sucking fly that lives on birds and mammals, not a horsefly and not a louse;
  also called a louse fly.
examples:
- The hippoboscid lives on birds and sucks their blood.
- A hippoboscid was found on the pigeon.
