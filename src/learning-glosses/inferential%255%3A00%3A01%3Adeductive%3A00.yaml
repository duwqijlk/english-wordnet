simpleMeaning: When you think in this way, you start with wide, general ideas and reach one sure, clear
  end point
scope: A way of reasoning that goes from wide ideas to one sure answer, not a claim you only draw from
  clues and not a guess.
examples:
- Her inferential thinking moved from the general rule to one clear answer.
- In an inferential argument, each step follows from the idea before it.
