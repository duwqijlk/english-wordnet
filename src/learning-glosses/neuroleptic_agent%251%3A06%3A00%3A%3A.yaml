schema: oewn-learning-gloss-v2
senseId: 'neuroleptic_agent%1:06:00::'
synsetId: 03719275-n
simpleMeaning: A person whose mind is very unwell is made calm by this medicine, when calm is what is
  wanted
scope: A medicine that makes a person whose mind is very unwell calm when calm is wanted; antipsychotic,
  antipsychotic agent, antipsychotic drug, major tranquilizer, neuroleptic and neuroleptic drug are other
  names for it, not a drug that puts a person to sleep and not a drug that lifts low mood.
examples:
- The neuroleptic agent was given to calm the man during his worst days.
- Doctors chose a neuroleptic agent when the patient needed to be kept calm.
