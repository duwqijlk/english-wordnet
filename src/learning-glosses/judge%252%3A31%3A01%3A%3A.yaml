simpleMeaning: to make a careful guess about an amount, a size or a length of time.
scope: This is not about deciding whether someone is guilty or giving an opinion on people; it is about
  estimating amounts or time.
examples:
- She judged the distance to be about ten metres.
- It is hard to judge how long the repairs will take.
