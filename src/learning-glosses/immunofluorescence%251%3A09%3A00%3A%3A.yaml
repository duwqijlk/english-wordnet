simpleMeaning: In the study of the defence of the body, a way to see bits in a piece of tissue, using
  germ-fighting bits joined to a dye that glows.
scope: A way to see bits in tissue with glowing dye.
examples:
- Immunofluorescence showed the germs glowing under the microscope.
- The lab used immunofluorescence to find the bits in the tissue sample.
