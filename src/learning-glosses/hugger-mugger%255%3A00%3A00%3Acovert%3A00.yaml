senseId: hugger-mugger%5:00:00:covert:00
synsetId: 01710918-s
simpleMeaning: It is done so that its aims and its methods stay secret, and others do not know what it
  is for or how it is done
scope: Also called secret, underground, surreptitious, undercover, clandestine, cloak-and-dagger, hole-and-corner
  and hush-hush, it is a thing done with hidden aims or ways, not an open act done for all to see.
examples:
- The hugger-mugger deal was arranged in secret, away from the public eye.
- Their hugger-mugger talks went on for weeks before anyone knew.
