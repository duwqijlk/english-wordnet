simpleMeaning: A set of people with one shared interest who try to get lawmakers or officials to act for
  them, most often by talking to them again and again
scope: This is a set of people with one shared interest who try to get lawmakers or officials to act for
  them, most often by talking to them again and again; lobby, advocacy group, lobby group, special-interest
  group, special interest, special interest group and third house are other names for it, not a political
  party and not a single person.
examples:
- The pressure group met the minister about the new law.
- A pressure group tries to get lawmakers to act for it.
