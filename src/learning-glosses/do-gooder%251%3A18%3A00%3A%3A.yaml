simpleMeaning: a person who works hard to help other people and to make life in society better
scope: A person who works hard to help other people and to make life in society better, also called a
  humanitarian or an improver, and not a person who helps only one friend or one family.
examples:
- The do-gooder spent her weekends helping the poor.
- People called him a do-gooder for his work on housing reform.
