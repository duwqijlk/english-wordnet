simpleMeaning: Something such as glass or porcelain that lets almost no heat or power pass through it
scope: This is a material such as glass or porcelain that lets almost no heat or power pass through it;
  insulator and nonconductor are other names for it, not a metal that carries power well and not a material
  that lets heat pass freely.
examples:
- Glass is a dielectric used in the capacitor.
- The dielectric kept the current from passing through.
