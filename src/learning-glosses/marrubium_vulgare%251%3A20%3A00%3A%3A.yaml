simpleMeaning: A European sweet-smelling herb with hairy leaves and many white flowers in clusters where
  leaf meets stem; its leaves give a bitter extract used as a medicine and for flavouring.
scope: A European herb whose leaves give a bitter extract; also called common horehound and white horehound.
examples:
- Marrubium vulgare grows wild along the dry banks.
- Herbalists gather Marrubium vulgare for its bitter leaves.
