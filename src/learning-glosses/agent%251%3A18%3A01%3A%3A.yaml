simpleMeaning: Someone whose job is buying and selling on behalf of other people in return for a fee.
scope: This is a commercial middleman paid a fee, not a government official and not a general representative
  who simply acts for someone else.
examples:
- The agent negotiated a lower price for the overseas buyer.
- She works as an agent for several small wineries.
