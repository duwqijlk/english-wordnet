senseId: 'dishonour%2:41:00::'
synsetId: 02552922-v
simpleMeaning: to bring shame on a person, family, or group and make others lose respect for them
scope: 'Also called shame and dishonor. This is the verb: to make someone lose the respect of others,
  not the noun for the lost respect itself.'
examples:
- He dishonoured his family by stealing from his own parents.
- The officer was sent home after he dishonoured his uniform.
