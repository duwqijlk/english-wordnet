senseId: 'flat%3:00:03::'
synsetId: 01025410-a
simpleMeaning: Showing no clear difference between light and dark areas and no gentle shading between
  them.
scope: A picture or scene where light and dark tones are hard to tell apart, not a voice or sound held
  on one pitch, and not a note lowered by a half step.
examples:
- The photo looked flat because the fog had erased all the contrast.
- Under that grey sky the whole landscape went flat and shadowless.
