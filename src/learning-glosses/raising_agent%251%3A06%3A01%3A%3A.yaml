simpleMeaning: Dough or batter grows lighter and softer when this thing is put into it.
scope: This thing, also called leaven agent and leavening agent, is put into dough or batter rather than
  being the dough itself.
examples:
- Yeast works as a raising agent in bread dough.
- She stirred a raising agent into the batter.
