simpleMeaning: A shared name for the many thin smell threads in the lining of the nose
scope: This is the shared name for the many thin smell threads in the nose lining; nervii olfactorii and
  olfactory nerve are other names for this sense, not a single smell thread and not the nerve for sight.
examples:
- The first cranial nerve carries smell signals.
- Damage to the first cranial nerve dulls smell.
