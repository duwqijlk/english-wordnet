senseId: 'reversal%1:09:00::'
synsetId: 05797813-n
simpleMeaning: a decision that undoes an earlier decision and takes its place
scope: A decision that undoes an earlier decision. It is not the act of swapping the order or places of
  things, and not a higher court's ruling that a lower court's decision was wrong.
examples:
- The council announced a reversal of its earlier decision to close the park.
- His reversal of the plan meant the work would go ahead after all.
