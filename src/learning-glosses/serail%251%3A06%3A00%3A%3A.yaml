simpleMeaning: Wives, women of the family, and concubines, women kept by a man as wives in all but name,
  have this part of a Muslim home kept for them.
scope: Harem, hareem, and seraglio are other names for this part of a Muslim home kept for the wives and
  women of the family.
examples:
- The wives lived in the serail.
- The serail was kept for the women of the family.
