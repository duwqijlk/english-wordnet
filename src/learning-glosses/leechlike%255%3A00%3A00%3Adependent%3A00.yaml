simpleMeaning: A plant or person that lives off another, taking what it needs from it and giving nothing
  back
scope: 'Another name for parasitic, bloodsucking and parasitical: a plant or person that lives off another,
  not one that lives on its own.'
examples:
- He led a leechlike existence, living off his brother's money.
- The leechlike vine clung to the tree and fed on it.
