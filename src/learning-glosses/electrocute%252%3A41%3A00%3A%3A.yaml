simpleMeaning: to kill a person by sending a strong electric current through the body, as is done in an
  electric chair
scope: This is killing as a punishment, as in an electric chair; not killing by an electric shock in an
  accident or in any other way.
examples:
- The murderer was electrocuted in the state prison.
- In the story, the prisoner is electrocuted at dawn for his crime.
