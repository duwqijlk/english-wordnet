simpleMeaning: a closed loop for electric flow that splits into two or more paths and then joins back
  to finish the loop
scope: A closed loop in which electric flow splits into two or more paths and joins back, also called
  a parallel circuit; not a single-path circuit and not an open circuit.
examples:
- The shunt circuit split the current into two paths.
- The engineer tested the shunt circuit before turning the power on.
