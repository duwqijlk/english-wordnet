simpleMeaning: Talk or acts that are not to be believed, most of all silly claims that are plainly untrue
scope: Talk or acts too false to take in, not a long bed in a ship or train and not a trough for feeding
  cattle.
examples:
- The whole story was bunk, and no one believed a word of it.
- He called the promise bunk and walked away.
