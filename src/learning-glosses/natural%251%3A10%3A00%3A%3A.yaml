simpleMeaning: a written sign in music that cancels an earlier sharp or flat note.
scope: This is only the written music sign; it is not the adjective meaning connected with the physical
  world.
examples:
- The natural in bar twelve tells the player to go back to the plain note.
- She missed the natural and played the note sharp again.
