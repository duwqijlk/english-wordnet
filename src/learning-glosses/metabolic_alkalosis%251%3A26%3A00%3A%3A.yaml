simpleMeaning: Losing acid or taking in too much alkali leaves the body too alkaline.
scope: It is the alkalosis that follows losing acid or taking in too much alkali.
examples:
- He took in too much alkali, and metabolic alkalosis followed.
- Metabolic alkalosis followed his loss of acid.
