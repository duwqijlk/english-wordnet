simpleMeaning: a furred animal that eats plants and meat and lives in Central America and South America
scope: A furred animal of Central and South America that eats plants and meat, also called coati, coati-mondi
  and coati-mundi; not the raccoon-like animal of Mexico and the southwestern United States.
examples:
- The coon cat searched the forest floor for fruit and small animals.
- A coon cat lives in the trees of Central America.
