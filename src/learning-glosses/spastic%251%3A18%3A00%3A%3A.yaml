simpleMeaning: a person who cannot move parts of the body in the usual way because the muscles stay tight
scope: This names a person who cannot move in the usual way because the muscles stay tight. It is not
  a describing word for such a person, and it is not a describing word for a part of the body that suddenly
  pulls tight.
examples:
- He worked each day as a helper for a spastic who needed care.
- The spastic lived with his family and used a chair with wheels.
