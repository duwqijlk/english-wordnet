simpleMeaning: Seeds taken from their pods and cooked as a vegetable, in the way lima is cooked.
scope: Seeds from pods, cooked as a vegetable; fava bean is another name for this sense, not a lima bean
  and not a green bean.
examples:
- Broad beans need shelling before you cook them.
- We grew broad beans along the fence this year.
