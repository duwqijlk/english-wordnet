simpleMeaning: feeling very happy, with very strong good feelings, especially with pride
scope: This sense is about feeling happy and proud, not about a thing being lifted up into the air.
examples:
- She felt uplifted after winning the prize.
- The good news left the whole team uplifted and proud.
