simpleMeaning: a person who puts off work, often because they are lazy or careless in the same way again
  and again
scope: A person who keeps putting off work, often out of laziness or habit, also called a procrastinator
  and a postponer, not a busy person and not someone who plans ahead.
examples:
- The cunctator put off the report until the last day.
- Everyone knew the cunctator would leave the job until the last minute.
