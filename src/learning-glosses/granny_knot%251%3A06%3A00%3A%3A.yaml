senseId: 'granny_knot%1:06:00::'
synsetId: 03458264-n
simpleMeaning: It slips and will not hold, because the rope is crossed the wrong way in the kind of join
  sailors make
scope: A rope join tied the wrong way round, also called granny, not a join tied the right way and not
  a safe, strong join.
examples:
- He tied a granny knot in the rope, and it slipped loose by morning.
- The sailor warned her that a granny knot would not hold the load.
