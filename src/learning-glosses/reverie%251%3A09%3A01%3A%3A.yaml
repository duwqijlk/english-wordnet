simpleMeaning: dreaming with the mind far away while still awake
scope: Dreaming while awake, with the mind far away; daydream and daydreaming are other names for this
  sense, and it is not sleep or a deep think about a problem.
examples:
- She fell into a reverie by the window.
- His reverie was broken by the sound of the bell.
