simpleMeaning: Spikes of blue-violet flowers rise above large, usually vivid or blotched leaves on this
  long-lived aromatic herb from southeast Asia; sometimes classed with coleus.
scope: The coleus grown for colourful foliage, not a stinging nettle or the other plants that share this
  common name.
examples:
- The painted nettle in the window box has leaves splashed with pink.
- Painted nettles need warm, humid air to keep their colour.
