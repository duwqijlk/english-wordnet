simpleMeaning: A one-year European plant like flax, with small white flowers, grown since very early times
  for fibre and for seeds full of oil, now growing wild widely in North America.
scope: Also called gold of pleasure; a one-year European plant like flax, grown for fibre and oil-rich
  seeds and now wild widely in North America, not true flax.
examples:
- Camelina sativa grows in the field by the road.
- Farmers press oil from Camelina sativa seeds.
