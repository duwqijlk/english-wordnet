simpleMeaning: the way a thing rests in balance, with its weight spread so it does not fall
scope: A thing resting in steady balance, not calmness under pressure and not getting ready for something
  hard.
examples:
- The acrobat kept his poise on the high wire.
- The vase lost its poise and fell from the shelf.
