simpleMeaning: In the study of the body, one fairly small place in one part of the body is home to each
  job the body does
scope: Also called localization, localisation, localisation principle, localization of function, and localization
  principle, this says one fairly small place holds each job of the body.
examples:
- Localisation of function ties each job of the body to its own place.
- Under localisation of function, each job of the body keeps its own place.
