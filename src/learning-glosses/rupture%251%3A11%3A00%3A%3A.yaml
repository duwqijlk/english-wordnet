senseId: 'rupture%1:11:00::'
synsetId: 07328414-n
simpleMeaning: the end of a close tie between people or groups, as when two sides that once worked together
  part for good
scope: A split between people or groups, also called break and breach; not a tear in the body or in a
  thing.
examples:
- They hoped to avoid a rupture in relations.
- The rupture between the two parties ended years of working together.
