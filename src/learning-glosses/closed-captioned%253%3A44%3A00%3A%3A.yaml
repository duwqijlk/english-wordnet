synsetId: 03166997-a
simpleMeaning: shown on TV with words on the screen that show only on sets with special gear, and can
  be made for viewers who cannot hear well
scope: A TV show with words on the screen that show only on sets with special gear, made for viewers who
  cannot hear well, not a show with words that all viewers see.
examples:
- The closed-captioned news let her read the words as the speaker talked.
- We turned on the closed-captioned film so my grandfather could follow it.
