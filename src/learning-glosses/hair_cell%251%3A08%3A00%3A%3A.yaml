simpleMeaning: In the organ of Corti, the coiled tube in the inner ear, a tiny living part picks up sound
scope: A tiny living part in the ear that picks up sound, not a nerve cell and not a skin cell.
examples:
- The hair cell in the inner ear sends sound signals to the brain.
- Damage to a hair cell can make hearing worse.
