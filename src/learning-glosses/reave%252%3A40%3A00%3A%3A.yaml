simpleMeaning: to steal things and take them as goods won by force
scope: 'Also called strip, rifle, plunder, loot, ransack, pillage, foray and despoil: to steal things
  and keep them as goods won by force. It is not just taking things in secret.'
examples:
- The soldiers reaved cattle and gold from the villages they passed.
- Pirates reaved goods from every ship they caught.
