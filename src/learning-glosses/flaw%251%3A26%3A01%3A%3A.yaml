simpleMeaning: a weak or bad part of a person's character
scope: A weak part of what a person is like inside, not a weak point in a plan or paper, and not the act
  of adding a bad mark to something.
examples:
- His main flaw is that he loses his temper too fast.
- She is kind and hard-working, but her one flaw is that she never listens.
