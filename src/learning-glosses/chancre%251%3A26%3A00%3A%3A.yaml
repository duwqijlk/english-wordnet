simpleMeaning: a small hard lump that does not hurt, where a germ that causes disease gets into the body,
  as in syphilis
scope: A small hard lump that does not hurt, at the place where a germ gets in, not a sore that hurts
  and not a lump caused by a blow.
examples:
- The doctor found a chancre on the man's lip where the germ had entered.
- A chancre can appear where syphilis first gets into the body.
