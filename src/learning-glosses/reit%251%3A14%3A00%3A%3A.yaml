simpleMeaning: A fund that owns and runs shops, offices and other buildings, holds loans on property and
  other property, whose shares can be bought and sold on the stock market
scope: A fund that owns and runs a group of shops, offices and other buildings and loans, also called
  a Real Estate Investment Trust, not a firm that owns a single building.
examples:
- She put her savings into a REIT.
- The REIT owns shops and offices across the country.
