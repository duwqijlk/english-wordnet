simpleMeaning: A change in a whole society as it takes up, or is made to take up, the ways of ruling and
  working of Joseph Stalin.
scope: Also called Stalinization, this is a change across a whole society as it takes up, or is made to
  take up, the ways of ruling and working of Joseph Stalin.
examples:
- Stalinisation changed the schools and the newspapers in the country.
- The new rulers pushed Stalinisation on every town.
