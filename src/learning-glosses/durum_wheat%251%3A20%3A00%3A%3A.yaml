simpleMeaning: bread and pasta are made from this wheat, whose hard dark kernels are rich in gluten, grown
  above all in southern Russia, North Africa, and northern central North America
scope: Also called durum, hard wheat, and macaroni wheat, this wheat is used for bread and pasta and has
  hard dark kernels rich in gluten.
examples:
- Durum wheat is milled into flour for pasta.
- The bakery buys durum wheat for its bread.
