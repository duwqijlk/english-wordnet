simpleMeaning: Surgery that reshapes body tissue to heal it or to make it look better.
scope: 'Also called plastic surgery: surgery that reshapes body tissue to heal it or to make it look better,
  not surgery that removes tissue and not surgery that joins broken bones.'
examples:
- She had anaplasty to reshape the skin after the burn.
- Anaplasty can heal tissue or make it look better.
