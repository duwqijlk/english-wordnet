simpleMeaning: to jump straight up, with stiff legs and a back bent in a curve
scope: 'Also called jerk, and another name for this sense is buck: to jump straight up with stiff legs,
  not a way of walking, not a knot, and not a thing that blocks the way.'
examples:
- The young horse hitched suddenly, its back bent in a curve and its legs stiff.
- Startled, the filly hitched, rising straight up with stiff legs and its back bent in a curve.
