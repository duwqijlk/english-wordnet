simpleMeaning: A non-metal, one of the salt-making elements, used most in medicine, photography and dyes,
  and found only joined with other things in small amounts, as in sea water or rocks.
scope: Also called I, iodine, and iodin; a non-metal used most in medicine, photography and dyes, found
  only joined with other things in small amounts.
examples:
- Atomic number 53 is used in medicine and in dyes.
- The doctor used atomic number 53 to clean the wound.
