simpleMeaning: The tie between a child and its mother, as mother and child
scope: This is the tie between a child and its mother; motherhood is another name for this sense, not
  being pregnant, and not the warm care of a mother.
examples:
- The court had to prove maternity before the child could be adopted.
- DNA tests can prove maternity.
