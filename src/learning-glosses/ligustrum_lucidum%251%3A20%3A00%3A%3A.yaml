simpleMeaning: An upright evergreen shrub like a small tree, from China, Korea, and Japan, with pointed
  leaves and flowers in long upright clusters; it looks like Japanese privet.
scope: Also called white wax tree and Chinese privet; an upright evergreen shrub of East Asia, not a Japanese
  privet itself and not a pine.
examples:
- Ligustrum lucidum keeps its leaves all year and bears white flowers in clusters.
- They planted Ligustrum lucidum along the wall for its glossy leaves.
