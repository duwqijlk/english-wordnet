simpleMeaning: a cloud made of very small solid bits or drops of liquid mixed in a gas
scope: This is the cloud of small bits or drops in a gas itself. It is not the can or tool that holds
  a liquid under strong push and sprays it out as a fine mist.
examples:
- Smoke forms an aerosol of tiny solid bits in the air.
- The fine spray made an aerosol that hung in the air for a minute.
