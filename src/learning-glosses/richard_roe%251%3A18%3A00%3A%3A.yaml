simpleMeaning: A person not known, or made up, who is named in a law case.
scope: A made-up or unknown person named in a law case, not a real person who takes part in it.
examples:
- In the old case, Richard Roe was named as the other party.
- The lawyer used the name Richard Roe for a person who did not exist.
