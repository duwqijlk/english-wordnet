simpleMeaning: Working slowly and with care to tire out the other side over time, without ever meeting
  them in open fight
scope: A slow, careful way of wearing down the other side, not a quick attack and not giving in.
examples:
- The general took a fabian approach, waiting for the enemy to grow tired.
- Her fabian policy avoided any direct battle with her rivals.
