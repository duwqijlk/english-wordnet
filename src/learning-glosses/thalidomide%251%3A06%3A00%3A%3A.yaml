simpleMeaning: A drug that calms and brings sleep, taken off the market after it was found to cause grave
  harm to unborn babies by stopping new blood vessels from forming.
scope: For a drug once given to calm and bring sleep, taken off the market after it was found to cause
  grave harm to unborn babies.
examples:
- Thalidomide was once given to help people sleep.
- Doctors stopped prescribing thalidomide after the birth defects were found.
