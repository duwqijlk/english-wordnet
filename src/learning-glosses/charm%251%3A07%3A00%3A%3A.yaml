simpleMeaning: a pleasing quality in a person or thing that makes people interested in it and can excite
  them
scope: 'Also called appeal: this is a pleasing quality that holds people''s interest, not a set of words
  used for magic and not the act of winning someone over so they do something.'
examples:
- Her natural charm made everyone in the room want to talk to her.
- The small town's charm lies in its quiet streets and friendly shops.
