simpleMeaning: in a way that does not shake, stop, or change, but stays firm and even
scope: 'Also called steady: in a firm, even way that does not shake; not the sense about how fast something
  changes over time.'
examples:
- He walked steadily across the icy path.
- She held the lamp steadily so we could see.
