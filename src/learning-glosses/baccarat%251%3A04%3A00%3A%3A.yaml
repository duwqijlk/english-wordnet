simpleMeaning: The banker takes on two or more players at the casino table, and the hand that comes nearest
  to nine with two or three cards takes the game.
scope: Also called chemin de fer, this casino card game sets two or more players against the banker.
examples:
- We played baccarat at the casino table.
- The banker dealt the cards for another round of baccarat.
