simpleMeaning: things that are owned and can be touched
scope: Things that are owned and can be touched, not things owned that cannot be touched, like a right,
  and not things merely used.
examples:
- The house and the car were his main tangible possessions.
- Tangible possessions, like tools and books, were listed in the will.
