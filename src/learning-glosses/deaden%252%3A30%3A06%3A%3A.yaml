senseId: 'deaden%2:30:06::'
synsetId: 00391231-v
simpleMeaning: to make something hard to make out, or to make a picture less clear to see
scope: Damp and dampen are other names for this sense; this is about making a thing hard to make out or
  making a picture less clear to see, not slowing a moving thing and not making feelings weaker.
examples:
- The mist deadened the image of the tower in the distance.
- A dirty window deadened the picture of the garden outside.
