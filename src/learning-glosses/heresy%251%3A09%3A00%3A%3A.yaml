simpleMeaning: a belief that goes against the main accepted teachings of a religion and says they are
  wrong
scope: 'Also called unorthodoxy: a belief against the accepted teachings of a religion, not the wider
  sense of any view that goes against an official position outside religion.'
examples:
- The church punished him for heresy because he denied its teachings.
- Long ago, saying that the earth moves around the sun was treated as heresy.
