simpleMeaning: a white salt in small hard clear pieces, used to keep food fresh and to stop germs
scope: A white salt that keeps food fresh and stops germs, not a salt used only to flavour food and not
  the acid it is made from.
examples:
- The jam maker stirred benzoate of soda into the fruit to keep it fresh.
- The label lists benzoate of soda as the thing that keeps the juice from going bad.
