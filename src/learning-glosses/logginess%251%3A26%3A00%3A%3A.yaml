simpleMeaning: A dull, slow state that comes from being worn out, with no wish to move or act
scope: A tired, dull state, also called loginess; not being asleep and not being ill.
examples:
- After the long night shift, a heavy logginess settled over him.
- The logginess in her limbs made even standing up feel like work.
