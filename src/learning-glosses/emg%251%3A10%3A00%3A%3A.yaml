simpleMeaning: A drawn record of the electric flows that come with the tightening of muscles
scope: This is a drawn record of the electric flows that come with muscles tightening; electromyogram
  is another name for this sense, and its nearest rivals are records of the heart and records of the brain.
examples:
- The doctor studied the EMG to see how the muscle worked.
- An EMG shows the electric flows of contracting muscles.
