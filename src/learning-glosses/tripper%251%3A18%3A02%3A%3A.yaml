senseId: 'tripper%1:18:02::'
synsetId: 10749575-n
simpleMeaning: In slang, a person who has taken a drug that makes them see things that are not there and
  is going through the visions it brings.
scope: In slang, a person going through visions after taking a drug that makes them see things that are
  not there, not a person on foot who catches their foot and nearly falls, not a catch that works as a
  switch, and not a tourist out looking at the sights.
examples:
- The tripper sat quietly while the visions passed.
- They said the tripper needed water and a calm room.
