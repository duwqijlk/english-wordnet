simpleMeaning: Force moves along a machine through a linked set of toothed wheels that turn together and
  change speed or turning force.
scope: Also called train, gear, gearing, and geartrain, this is the linked set of toothed wheels through
  which force moves along a machine.
examples:
- The power train carries force from one part of the machine to another.
- The power train changed the speed at which the parts of the machine turned.
