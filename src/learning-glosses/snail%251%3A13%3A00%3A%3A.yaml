simpleMeaning: A land creature people eat, usually served in its shell with hot butter mixed with garlic
  poured over it
scope: A land creature served as food in its shell with butter and garlic, not the live animal in the
  wild and not the act of going out to gather them.
examples:
- They ordered snails in garlic butter for a first course.
- The snail arrived in its shell, swimming in melted butter.
