simpleMeaning: Its sweet-smelling yellow blooms are used to make perfume, and they grow on a thorny bush
  or small tree from warm lands in America.
scope: People also call it cassie, flame tree, huisache, mimosa bush, sweet acacia, or sweet wattle.
examples:
- The scented wattle had sweet-smelling yellow blooms.
- The scented wattle grew as a thorny bush in warm lands.
