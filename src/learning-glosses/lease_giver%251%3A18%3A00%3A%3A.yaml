simpleMeaning: A person who gives another the right to use something for a time in return for payment
scope: A person who gives another the right to use something for a time in return for payment, not the
  person who takes the thing and not someone who sells it.
examples:
- The lease giver must keep the building in good repair.
- As lease giver, she set the rent for the year.
