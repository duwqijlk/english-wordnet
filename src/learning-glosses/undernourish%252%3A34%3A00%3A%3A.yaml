simpleMeaning: to give food that is not good enough in quality or not enough in amount
scope: 'Also called malnourish: giving food that is too little or not good enough. This is not giving
  too much food, and it is not giving enough food that is good.'
examples:
- If you undernourish the puppies, they will stay small and weak.
- The camp undernourished its workers by giving them only thin soup.
