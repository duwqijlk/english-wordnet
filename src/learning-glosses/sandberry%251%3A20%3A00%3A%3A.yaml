simpleMeaning: In autumn, the leaves of this low evergreen bush turn red; it lies flat like a mat across
  North America and northern Eurasia, with small white flowers and red fruit
scope: A low evergreen bush that lies flat like a mat, with small white flowers and red fruit, also called
  bear's grape, common bearberry, creashak, hog cranberry, mealberry, mountain box, red bearberry, sand
  berry and wild cranberry.
examples:
- Sandberries spread like a mat across the ground.
- The sandberry leaves turn red in autumn.
