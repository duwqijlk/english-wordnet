simpleMeaning: having to do with a set of ideas that shapes how a group of people or a whole country thinks
scope: This describes something shaped by a group's shared ideas, not a personal opinion and not a fact
  about the world.
examples:
- The two parties clashed over ideological differences.
- Her ideological views shaped how she voted.
