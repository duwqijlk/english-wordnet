simpleMeaning: A great sliding mass of water and mud from a volcano, pouring down its sides.
scope: A great sliding mass of water and mud from a volcano, pouring down its sides, not a flow of melted
  rock and not a slide of dry earth.
examples:
- The lahar buried the village in mud.
- After the eruption, a lahar swept down the mountain.
