simpleMeaning: With spikes of uneven yellow-red blooms, this plant grows in the wet lands of the pine
  barrens of the southeastern United States.
scope: People also call it candyweed, yellow bachelor's button and yellow milkwort; it is a plant of the
  wet lands in the pine barrens with spikes of uneven yellow-red blooms.
examples:
- The orange milkwort grows in the pine barrens of the southeastern United States.
- We saw orange milkwort with spikes of yellow-red blooms in the pine barrens.
