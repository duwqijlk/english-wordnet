synsetId: 06763053-n
simpleMeaning: a message about the future, usually hard to understand and with a hidden meaning, given
  by a priest or priestess and thought to be always right
scope: This is a message about the future given by a priest or priestess. It is not the holy place where
  people go to ask for such a message.
examples:
- The oracle given by the priestess warned the king of danger ahead.
- People believed the oracle without question, though its words were hard to understand.
