simpleMeaning: A sickness that harms the seed tops of the tall grass grown for bread.
scope: A sickness that harms the seed tops of the tall grass grown for bread, not a cut on the skin and
  not a sickness of the roots.
examples:
- Wheat scab cut the harvest short that year.
- The farmer found wheat scab on the grain tops.
