simpleMeaning: A big tree of the East Indies, semi-evergreen, with sticky gum in its trunk, bitter tonic
  bark, seeds full of aromatic oil, and sometimes classed in the genus Melia.
scope: One of several names for this tropical tree, also called arishth, margosa and nim tree; not the
  aromatic oil pressed from its seeds.
examples:
- The neem tree beside the well gives shade all year.
- They planted a neem tree for its bitter bark and the oil in its seeds.
