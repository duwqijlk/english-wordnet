senseId: 'shiver%1:04:00::'
synsetId: 00869661-n
simpleMeaning: a shaking of the body that you cannot stop, caused by cold, fear, or being excited
scope: Also called a shake and a tremble. This is the shaking of the body from cold, fear or excitement,
  not the almost happy feeling of fear.
examples:
- A shiver shook his whole body when the cold wind hit him.
- She gave a small shiver and pulled her coat tight against the cold.
