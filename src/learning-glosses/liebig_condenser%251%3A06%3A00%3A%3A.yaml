simpleMeaning: 'A tool for turning vapour back to liquid: while a liquid is distilled, the vapour runs
  through a tube cooled by water'
scope: A tool that turns vapour back to liquid during distillation; not a tool for heating and not a plain
  tube.
examples:
- The Liebig condenser cooled the vapour back into liquid.
- We fitted a Liebig condenser to the flask for the distillation.
