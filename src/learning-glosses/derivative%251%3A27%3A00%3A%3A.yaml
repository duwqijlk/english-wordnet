simpleMeaning: A substance that comes from another substance, or that people think of as coming from another
  substance
scope: This is a substance in chemistry, not a maths result about change, not a word made from another
  word, and not the adjective for coming from something else.
examples:
- This powder is a derivative made from a plant substance.
- The lab made a new derivative from the first substance.
