simpleMeaning: to draw a funny or mocking picture of someone or something
scope: This sense is the verb for drawing such a picture, not a funny drawing in a newspaper or magazine
  and not a film made from moving drawings.
examples:
- She cartoons local leaders for the newspaper every week.
- He learned to cartoon his teachers in a funny, kind way.
