simpleMeaning: too little blood reaching the muscles of the heart, which can cause chest pain
scope: 'Also called coronary insufficiency: too little blood reaching the heart muscle, not a blocked
  heart tube and not a weak heartbeat.'
examples:
- His cardiac insufficiency left him short of breath on the stairs.
- The doctor said her cardiac insufficiency could bring on chest pain.
