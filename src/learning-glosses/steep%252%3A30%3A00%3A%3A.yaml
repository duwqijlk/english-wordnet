simpleMeaning: to leave something in a liquid so the liquid takes in its flavour, or so the thing gets
  clean
scope: To leave something in liquid so the liquid takes in its flavour, or so the thing gets clean; not
  a place that rises sharply and not something far past what is fair or sensible.
examples:
- Steep the blossoms in oil for a week.
- She steeped the fruit in alcohol.
