simpleMeaning: A plant from China that lives for years, with hanging clusters of flowers from mauve-pink
  to bright sky blue.
scope: Blue poppy is another name for this sense, a plant with hanging clusters of flowers; it is not
  a plant whose flowers stand upright in single blooms.
examples:
- The Meconopsis betonicifolia flowers were a bright sky blue.
- We grew Meconopsis betonicifolia for its hanging clusters of blue flowers.
