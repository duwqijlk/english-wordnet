simpleMeaning: Said of things of the Isle of Man, the people who live there, or the tongue they speak.
scope: This word is about the Isle of Man and its people and tongue, not the old Gaelic of the island
  and not the tailless cat.
examples:
- The Manx fishing industry is a big part of island life.
- There are few Manx speakers alive today.
