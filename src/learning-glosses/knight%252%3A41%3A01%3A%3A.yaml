simpleMeaning: Give someone the honorary rank that a monarch awards for personal merit.
scope: The act of giving someone a knighthood, not the chess piece and not the person so honoured; dub
  is another name for this sense.
examples:
- The Queen knighted the scientist for his work on vaccines.
- He was knighted in 2019 for services to medicine.
