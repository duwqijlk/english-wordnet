simpleMeaning: A big three-needle pine of the south-east United States, with most long needles and bent,
  knotty limbs, its bark red-brown and cut deep, a key wood tree.
scope: This sense is also called longleaf pine and pitch pine.
examples:
- A southern yellow pine towered over the yard.
- Southern yellow pines give good wood.
