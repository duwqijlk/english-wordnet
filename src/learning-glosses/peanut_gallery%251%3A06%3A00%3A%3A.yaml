simpleMeaning: The back or top seats in a theatre balcony, which cost the least
scope: 'Also called the family circle: the back or top seats in a theatre balcony, which cost the least,
  not the front stalls and not the figurative crowd of critics.'
examples:
- We sat in the peanut gallery for the cheap seats.
- From the peanut gallery you can hear the play but not see the stage well.
