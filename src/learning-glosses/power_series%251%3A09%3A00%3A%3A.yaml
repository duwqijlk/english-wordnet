simpleMeaning: a sum made by adding terms with a changing letter raised to whole numbers that go up by
  one each time
scope: A sum built from terms with a changing letter raised to higher whole numbers, not one term on its
  own and not a list of numbers.
examples:
- The teacher wrote a power series on the board and added its first four terms.
- She used a power series to work out a close answer when the exact answer was hard to find.
