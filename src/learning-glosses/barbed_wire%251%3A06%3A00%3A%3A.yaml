simpleMeaning: strong metal thread with sharp points set at even gaps, put up to stop people or animals
  passing
scope: 'Also called barbwire: a strong metal thread with sharp points, put up to stop people or animals
  passing, not plain fencing and not a rope.'
examples:
- Barbed wire ran along the top of the fence.
- The farmer put up barbed wire to keep the cattle in.
