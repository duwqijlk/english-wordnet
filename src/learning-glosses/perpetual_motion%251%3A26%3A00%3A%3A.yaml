simpleMeaning: 'In practice it cannot happen, because of rubbing: movement that goes on for ever with
  no power from outside'
scope: Movement that goes on for ever with no power from outside, which cannot happen in practice; not
  the movement of a machine, and not ordinary movement that slows and stops.
examples:
- Perpetual motion would break the laws of physics.
- He dreamed of perpetual motion, a wheel that would turn for ever.
