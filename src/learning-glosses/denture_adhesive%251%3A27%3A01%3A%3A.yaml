simpleMeaning: Something used to hold false teeth firm in the mouth
scope: A substance that holds false teeth firm in the mouth, not the false teeth themselves and not a
  tooth cleaner.
examples:
- Denture adhesive kept her false teeth in place all day.
- He spread denture adhesive on the plate before putting it in.
