simpleMeaning: A white, crystal-like salt made of two sulfur salts joined to a light metal, one of them
  the potassium kind
scope: A double salt made of two sulfur salts, also called alum and potassium alum, and not a single salt
  made of one sulfur salt.
examples:
- Potash alum is used to clear cloudy water.
- The potash alum formed white crystals in the dish.
