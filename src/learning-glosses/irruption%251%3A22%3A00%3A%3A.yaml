simpleMeaning: A sharp, sudden rise in how many of a living thing there are, compared with before.
scope: A sharp, sudden rise in how many of a living thing there are, compared with before; not a sudden
  violent happening, and not a sudden violent bursting in.
examples:
- The irruption of mice followed the good harvest.
- An irruption of the birds filled the fields that spring.
