simpleMeaning: the job of a regent (a person who rules a country when the king or queen cannot rule)
scope: This is the job itself, not the length of time when a regent rules, which is the other sense.
examples:
- She held the regency until the young king was old enough to rule.
- The regency gave her the power to rule for the child king.
