simpleMeaning: A drug that fights cancer, sometimes used to treat a blood cancer in which young white
  blood cells grow out of control
scope: This is a drug that fights cancer, sometimes used to treat a blood cancer; asparaginase is another
  name for this sense, and its nearest rivals are drugs used for other kinds of sickness.
examples:
- The doctor gave Elspar to fight the leukaemia.
- Elspar is sometimes used to treat lymphoblastic leukaemia.
