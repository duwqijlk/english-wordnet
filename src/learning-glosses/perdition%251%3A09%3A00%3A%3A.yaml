simpleMeaning: People who have done wrong are punished without end in the home of Satan and the powers
  of evil, in Christianity.
scope: In Christianity, this place of punishment without end for people who have done wrong is also called
  pit, infernal region, and nether region.
examples:
- Those who have done wrong end in perdition.
- A life of sin ends in perdition.
