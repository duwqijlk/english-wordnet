simpleMeaning: A rare brain illness, usually fatal and usually of middle age, caused by an unknown slow
  virus, with growing loss of memory and thought and slow loss of muscle control.
scope: Also called CJD and Jakob-Creutzfeldt disease; a rare, usually fatal brain illness of middle age,
  caused by a slow virus, that takes memory and muscle control little by little.
examples:
- Creutzfeldt-Jakob disease slowly took her memory.
- He was found to have Creutzfeldt-Jakob disease in middle age.
