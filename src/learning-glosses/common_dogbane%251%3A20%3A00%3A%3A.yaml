simpleMeaning: For sore or swollen joints, old home cures use a plant of North America that lives for
  years and bears pale pink flowers in loose open groups
scope: Also called rheumatism weed and spreading dogbane; a North American plant with pink flowers, not
  a garden flower.
examples:
- Common dogbane grows along the roadside with its pale pink flowers.
- Her grandmother used common dogbane for her sore joints.
