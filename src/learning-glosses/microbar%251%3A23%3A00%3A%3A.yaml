simpleMeaning: 'A fixed measure of push, counted on its own and not against the air around it: one dyne,
  a tiny unit of force, on each square centimetre'
scope: 'Also called bar absolute and barye: a fixed unit of pressure, not a unit of length and not a unit
  of weight.'
examples:
- The microbar is used to measure very small changes in air pressure.
- Scientists recorded the pressure in microbars during the test.
