simpleMeaning: a worker who is a member of a group of workers that speaks for them
scope: A worker who is a member of a group of workers that speaks for them; unionist and union member
  are other names for this sense, not a boss and not a worker with no group behind them.
examples:
- As a trade unionist, she spoke for the factory workers.
- The trade unionists voted to strike.
