simpleMeaning: A loose sewing loop that catches only one or two threads of cloth, made so it cannot be
  seen from the front
scope: A loose sewing loop catching only one or two threads of cloth, made so it cannot be seen from the
  front; not a firm seam and not a stitch meant to show.
examples:
- She closed the hem with a slip stitch so no thread showed.
- A slip stitch held the lining in place without a mark on the outside.
