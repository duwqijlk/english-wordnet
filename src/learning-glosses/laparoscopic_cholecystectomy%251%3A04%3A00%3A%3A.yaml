simpleMeaning: the gall bladder taken out through tiny holes made in the belly, through which a thin viewing
  tube and tools are put in to do the work
scope: 'Also called lap choly: taking out the gall bladder through tiny holes in the belly, not open surgery
  and not taking out another organ.'
examples:
- Her laparoscopic cholecystectomy took out the gall bladder through tiny holes.
- The surgeon planned a laparoscopic cholecystectomy for the morning.
