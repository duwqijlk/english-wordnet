senseId: 'urban_renewal%1:04:00::'
synsetId: 00402002-n
simpleMeaning: the work of clearing away poor run-down parts of a town and building them again
scope: The clearing and rebuilding of poor run-down town areas, not building new homes on empty land and
  not a single house put right on its own.
examples:
- Urban renewal cleared the old slums and built new flats in their place.
- The council planned urban renewal for the run-down streets near the station.
