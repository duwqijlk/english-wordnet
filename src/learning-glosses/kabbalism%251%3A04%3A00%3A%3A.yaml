simpleMeaning: Old, extreme ideas about God and holy teaching that a person will not give up
scope: 'Also called cabalism: sticking to old and extreme ideas about God and holy teaching, not a new
  way of thinking about faith and not the work of a single expert.'
examples:
- His kabbalism kept him tied to the old teachings of his faith.
- Kabbalism shaped how the group read their holy books.
