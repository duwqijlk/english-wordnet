senseId: 'counterstain%1:27:00::'
synsetId: 15077779-n
simpleMeaning: a dye of a colour that stands out from the main dye, used when the main dye does not show
  the shape of the thing clearly
scope: A dye of a colour that stands out from the main dye, used when the main dye does not show the shape
  of the thing clearly; not the main dye and not a dye used on cloth.
examples:
- The counterstain made the cell walls stand out against the first stain.
- She added a counterstain so the tiny parts could be seen.
