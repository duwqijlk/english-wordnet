simpleMeaning: Pale silky hair covers this very small armadillo of Argentina, which has pink plates on
  its head and neck.
scope: Also called chlamyphore, fairy armadillo, and pichiciago, this very small armadillo of Argentina
  is the one with pale silky hair and pink plates on its head and neck.
examples:
- A pichiciego moved across the ground in Argentina.
- Pale silky hair and pink plates mark the pichiciego.
