simpleMeaning: A tree or bush of Europe and west Asia that loses its leaves each year, with grey leaves
  and small yellow fruits dusted with silver scales; at times thorny.
scope: A tree or bush of Europe and west Asia with grey leaves and small yellow fruits, also called silver
  berry and Russian olive; it loses its leaves each year, unlike evergreen trees of the same lands.
examples:
- The Elaeagnus augustifolia by the gate drops its grey leaves in autumn.
- We picked the small yellow fruits from the Elaeagnus augustifolia in the garden.
