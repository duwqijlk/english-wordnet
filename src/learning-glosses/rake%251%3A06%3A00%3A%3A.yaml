simpleMeaning: A tool with a long handle and a row of teeth at one end, used to move leaves or to loosen
  soil
scope: This is a long garden tool for moving leaves and loosening soil. It is the tool itself, not the
  job of moving leaves with it.
examples:
- He used a rake to clear the dead leaves from the lawn.
- She picked up the rake and loosened the soil in the garden bed.
