simpleMeaning: to reach out suddenly with a hand, as though to take hold of something
scope: The quick hand movement of reaching toward something, not the act of actually taking hold of it
  and not obtaining something quickly or illegally.
examples:
- The passenger grabbed for the oxygen mask as the cabin shook.
- She grabbed at the railing when the boat lurched.
