simpleMeaning: In mathematics, breaking an expression into parts that give the first expression when multiplied
  together
scope: This is breaking a maths expression into its multiplying parts; factoring and factorization are
  other names for this sense; not adding parts together and not solving an equation.
examples:
- Factorisation turns 12 into 3 times 4.
- She used factorisation to simplify the expression.
