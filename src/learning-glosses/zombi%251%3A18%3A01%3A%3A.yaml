simpleMeaning: a person who acts or answers as if without thought or feeling, like a machine
scope: Also called zombie; a person who acts like a machine, not a god, not a drink, and not a dead body
  brought back to life.
examples:
- He sat like a zombi through the whole meeting.
- She moved like a zombi after the long night.
