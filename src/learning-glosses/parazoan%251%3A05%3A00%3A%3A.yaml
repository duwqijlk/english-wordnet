simpleMeaning: a simple many-celled sea animal, with a body full of small holes held up by a frame of
  fibres; it usually lives fixed in place in groups
scope: 'Also called sponge and poriferan: a simple sea animal with a body full of small holes, fixed in
  place in groups, not a jellyfish or a coral.'
examples:
- A parazoan sits fixed to a rock and lets sea water flow through its holes.
- We saw a parazoan fixed in place with other parazoans on the reef.
