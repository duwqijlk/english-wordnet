simpleMeaning: a flat-topped opening whose straight bar is held up at both ends by blocks that stick out
  into the gap
scope: A flat-topped opening with a straight bar on blocks that stick out, not a fully rounded top and
  not a pointed top.
examples:
- The old church had a shouldered arch over its main door.
- A shouldered arch frames the window of the cottage.
