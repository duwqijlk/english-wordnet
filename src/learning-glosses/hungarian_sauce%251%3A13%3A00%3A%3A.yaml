simpleMeaning: A smooth white topping for food, made with fried cut onion, paprika and cream.
scope: This is a smooth white topping of fried onion, paprika and cream; paprika sauce is another name
  for it; not a plain white sauce without paprika and not a meat gravy.
examples:
- The cook spooned Hungarian sauce over the veal.
- Hungarian sauce gets its colour from paprika and cream.
