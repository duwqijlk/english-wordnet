simpleMeaning: having no sense of right and wrong, and no care for the life of the spirit
scope: 'Also called dark and darkness: a state with no moral or spiritual values — not the quality of
  being foul to the senses, and not simply the quality of being wicked.'
examples:
- His wickedness lay in having no moral values at all.
- In that dark time, wickedness ruled and no one spoke of right or wrong.
