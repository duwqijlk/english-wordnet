simpleMeaning: With a flat head and a jaw that sticks out, this big catfish lives in the middle of the
  United States
scope: 'Also called a flathead catfish or a goujon: a big catfish of the middle of the United States with
  a flat head and a jaw that sticks out, not a small catfish and not a fish with a round head.'
examples:
- He caught a mudcat in the river at dawn.
- The mudcat lay still on the muddy river bed.
