simpleMeaning: the act of moving the parts of a device so they sit right in relation to each other
scope: Moving a device's parts so they sit right in relation to each other, not the way things are set
  out in a straight line and not stars meeting in the sky.
examples:
- The alignment of the wheels took the mechanic an hour.
- After the repair, the alignment of the gears was perfect.
