simpleMeaning: The state of the air — how warm it is, how hard the wind blows, how much cloud there is,
  and how much rain falls — is what this word names.
scope: This names the state of the air, also called weather, conditions, and weather condition.
examples:
- The atmospheric conditions were too rainy for playing in the snow.
- They were hoping for good atmospheric conditions for the trip.
