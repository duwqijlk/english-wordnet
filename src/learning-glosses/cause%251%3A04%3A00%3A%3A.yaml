simpleMeaning: a broad term for any court proceeding in which a person seeks a legal remedy
scope: This is the court-case sense, not the event or force that produces a result, not a reason or justification,
  not a movement or campaign for a principle, not a person or thing that produces an effect, and not the
  verb for making something happen.
examples:
- The cause was listed for hearing next Monday.
- The court dismissed the cause for lack of evidence.
