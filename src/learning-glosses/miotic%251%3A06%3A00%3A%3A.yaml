simpleMeaning: This drug makes the black opening in the middle of the eye grow smaller
scope: 'Also called a miotic drug, myotic or a myotic drug: a drug that makes the black opening in the
  middle of the eye grow smaller, not a drug that makes it grow larger.'
examples:
- The eye doctor used a miotic before the test.
- A miotic made the pupil smaller within minutes.
