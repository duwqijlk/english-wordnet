simpleMeaning: tissue from the middle layer of the embryo that forms the tissue that joins the body's
  parts, blood, and muscles that move without thought
scope: Tissue from the middle layer of the embryo that forms joining tissue, blood and muscle; not tissue
  from the outer layer, and not tissue from the inner layer.
examples:
- Mesenchyme forms the tissue that joins the body's parts.
- In the young embryo, mesenchyme gives rise to blood and muscle.
