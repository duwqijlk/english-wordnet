simpleMeaning: A work of art that shows Mary, the mother of Jesus, grieving over the dead body of her
  son.
scope: This is a work of art showing Mary grieving over the dead body of Jesus; not a work showing his
  birth, and not a work showing him on the cross.
examples:
- The pieta shows Mary grieving over the dead body of Jesus.
- Michelangelo's famous pieta shows Mary holding her dead son.
