simpleMeaning: A long-lasting blood sickness marked by grainy white blood cells, seen more often in older
  people.
scope: A long-lasting blood sickness; chronic myelocytic leukemia is another name for this, and it is
  not a short blood sickness or a sickness of the red blood cells.
examples:
- He was told he had myeloid leukemia.
- Myeloid leukemia is more common in older people.
