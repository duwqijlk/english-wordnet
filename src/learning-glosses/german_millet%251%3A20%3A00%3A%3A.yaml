simpleMeaning: A grain with yellow seeds in big heads that hang down.
scope: Also called golden wonder millet and Setaria italica stramineofructa; a grain with yellow seeds
  in big hanging heads, set beside other millets with smaller or paler seed heads.
examples:
- The farmer cut the German millet when its yellow grains were ripe.
- German millet grew tall in the field, its big heads hanging down.
