simpleMeaning: Plants of this kind spend part or all of their lives in water, some rooted in mud, like
  the lotus, and some floating free, like the water hyacinth.
scope: Also called aquatic plant, hydrophyte, and water plant, this is a plant that lives in water, not
  a plant that grows on dry land.
examples:
- Hydrophytic plants lined the edge of the lake, some rooted in the mud.
- The gardener set hydrophytic plants in the shallow end of the pond.
