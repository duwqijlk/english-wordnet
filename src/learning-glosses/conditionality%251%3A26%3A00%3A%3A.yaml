simpleMeaning: the fact that something holds only if some other thing happens first
scope: Whether something holds only if another thing happens first, not whether it is true on its own
  and not whether it can be changed.
examples:
- The conditionality of the offer meant no deal without the loan.
- She disliked the conditionality of his promise.
