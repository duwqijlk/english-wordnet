simpleMeaning: about, or like, a short chant that one group sings and another group answers in turn
scope: 'Also called antiphonal: about, or like, a short chant that one group sings and another group answers
  in turn, not the singing itself and not an ordinary song sung by all together.'
examples:
- The antiphonary hymn was sung by the choir in two parts.
- They chose an antiphonary setting for the evening service.
