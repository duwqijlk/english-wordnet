simpleMeaning: the act of giving yourself, in thought or in feeling, to a plan or a way of acting
scope: 'Also called commitment, allegiance and dedication: the act of giving yourself to a plan or way
  of acting, not the quality of being true and faithful to a person or group.'
examples:
- Her loyalty to the cause led her to give years of her life to it.
- His loyalty was shown when he gave himself fully to the work of helping others.
