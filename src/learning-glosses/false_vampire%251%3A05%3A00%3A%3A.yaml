senseId: 'false_vampire%1:05:00::'
synsetId: 02147245-n
simpleMeaning: any meat-eating bat of the New or Old World, wrongly thought to drink blood, that in fact
  eats insects
scope: This is a meat-eating bat wrongly thought to drink blood; false vampire bat is another name for
  this sense; not a true blood-drinking bat and not a fruit-eating bat.
examples:
- The false vampire feeds on insects, not blood.
- People wrongly thought the false vampire sucked blood.
