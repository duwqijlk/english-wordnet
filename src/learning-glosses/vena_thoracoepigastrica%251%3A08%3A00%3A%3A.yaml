simpleMeaning: The blood tube under the arm or in the chest takes in this tube, which rises from the place
  of the blood tube near the skin of the belly.
scope: 'Also called the thoracoepigastric vein: a blood tube that rises from near the skin of the belly,
  not the blood tube under the arm and not the one in the chest.'
examples:
- The vena thoracoepigastrica opens into the vein under the arm.
- Blood from the belly wall runs through the vena thoracoepigastrica toward the chest.
