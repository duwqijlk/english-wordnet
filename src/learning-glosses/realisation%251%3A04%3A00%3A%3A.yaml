simpleMeaning: making something happen or exist, or making it seem to happen or exist
scope: 'Also called realization: this is making something happen or seem to happen, not finishing a piece
  of music, not the finished music itself, and not a sale to get money.'
examples:
- The realisation of her plan took ten years of hard work.
- His dream saw its realisation when the small shop finally opened.
