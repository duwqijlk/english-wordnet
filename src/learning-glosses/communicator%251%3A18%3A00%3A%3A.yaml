simpleMeaning: a person who shares ideas, news, or feelings with other people
scope: This sense is a person who shares ideas or news with others, not the message they share and not
  a tool or machine used to send messages.
examples:
- She is a clear communicator who explains hard ideas in simple words.
- As a communicator, he speaks to the public about health.
