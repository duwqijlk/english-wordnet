simpleMeaning: Able to be split apart into parts, or taken away from something it was joined to.
scope: Something that can be split apart into parts or taken away from what it was joined to.
examples:
- The lid is separable from the box, so you can take it off to wash it.
- The cover and the lining are separable, so each can be cleaned on its own.
