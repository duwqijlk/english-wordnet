simpleMeaning: A tree from the south of Australia with bright red flower clusters on branching stalks.
scope: This is a tree of southern Australia with bright red flower clusters; flame durrajong, flame tree
  and Brachychiton acerifolius are other names for it, not a shrub and not a tree of the northern parts
  of Australia.
examples:
- The Sterculia acerifolia in the park was covered in bright red flower clusters.
- We saw a Sterculia acerifolia with panicles of scarlet flowers.
