simpleMeaning: to hit someone hard, again and again, with a whip or a long thin stick
scope: Also called slash, whip, lash, strap, welt, lather and trounce, this is hitting a person hard with
  a whip or stick; it is not beating someone in a game and not hitting with a hand.
examples:
- The guard flogged the prisoner with a whip.
- In the old story, sailors were flogged for breaking rules.
