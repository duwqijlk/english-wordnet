simpleMeaning: a ring of thin plates that slide over each other, opening or closing to make the round
  hole in the middle wider or narrower
scope: A ring of plates that opens and closes a hole, not the coloured ring in the eye and not a flower.
examples:
- The photographer stopped down the iris to make the opening smaller.
- When the iris opens wider, more light comes through the lens.
