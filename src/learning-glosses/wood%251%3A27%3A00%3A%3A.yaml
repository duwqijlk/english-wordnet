simpleMeaning: the hard material that forms the trunk and branches of a tree, found under the outer covering.
scope: This is the material a tree is made of, not a group of trees or a musical instrument.
examples:
- The table is made of solid oak wood.
- He cut wood for the fire all afternoon.
