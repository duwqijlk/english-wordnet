simpleMeaning: Doing your share in something, such as a club, campaign or cause.
scope: A person's part in a group or cause; not a condition growing more severe or wider in scope, not
  readiness for military or naval operations, not a disposition to act or bring about change, not personal
  liveliness, not exerting influence or producing an effect, not a busy place or constant coming and going,
  not a machine in operation, not the grammatical voice where the subject is the doer or its noun, not
  verbs or participial adjectives expressing action rather than a state, not the sun's disturbed pattern,
  not volcanoes that can erupt or are erupting, not full-time work, not the chemical noun, and not the
  noun for a member.
examples:
- She has been active in the local choir for ten years.
- He remained active in politics after retiring.
