simpleMeaning: an egg-laying mammal that digs in the ground, covered with sharp points, with a long nose
  and claws for catching ants and termites, living in New Guinea
scope: Also called an anteater and an echidna; the New Guinea kind, not the Australian kind of the same
  name.
examples:
- The spiny anteater of New Guinea hunts termites at night.
