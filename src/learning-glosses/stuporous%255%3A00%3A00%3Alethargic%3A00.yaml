simpleMeaning: Left dazed and slow to take things in or do anything, as after hard blows, being drunk,
  or great tiredness.
scope: Left dazed and slow to take things in or do anything, as after hard blows, being drunk, or great
  tiredness, also called dazed, and also called foggy, groggy, or logy.
examples:
- He was stuporous after the blow, slow to answer.
- She sat stuporous with tiredness, barely able to speak.
