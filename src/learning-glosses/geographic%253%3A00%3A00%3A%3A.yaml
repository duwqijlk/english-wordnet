simpleMeaning: fixed by where a place is on the earth
scope: 'Also called geographical: fixed by where a place is on the earth, not to do with the study of
  land and places itself.'
examples:
- The north and south geographic poles are fixed points at the top and bottom of the earth.
- Its geographic centre lies in the middle of the land, far from the sea.
