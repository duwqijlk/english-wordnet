senseId: 'theory_of_gravity%1:09:00::'
synsetId: 05998974-n
simpleMeaning: The idea that the pull between two bits of matter is the product of their masses over the
  square of the gap between them.
scope: 'People also call this the theory of gravitation and gravitational theory: in physics, the name
  stands for the rule itself, not for the pull the rule describes.'
examples:
- The theory of gravity says that the Sun pulls the Earth toward it.
- Under the theory of gravity, a book and a table pull on each other, too.
