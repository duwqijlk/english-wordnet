simpleMeaning: A watery soup made from meat, fish or vegetable stock.
scope: A thin soup served as a dish, not the cooking liquid called broth or stock that soups and sauces
  are built from.
examples:
- A bowl of hot broth was all she wanted on the cold evening.
- She served a thin broth of fish and vegetables.
