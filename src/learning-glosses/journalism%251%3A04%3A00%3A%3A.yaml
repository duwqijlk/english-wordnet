simpleMeaning: work in which a person finds out what is happening, and writes about it, takes pictures
  of it, or gets it ready to print or broadcast
scope: The work of gathering and preparing news, not the newspapers and magazines themselves.
examples:
- She studied journalism at university.
- He has worked in journalism for twenty years.
