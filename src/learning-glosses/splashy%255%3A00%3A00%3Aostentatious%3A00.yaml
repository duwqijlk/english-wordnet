simpleMeaning: made to get attention and impress people, but often in a way that is too much and shows
  no good taste
scope: Also called flamboyant and showy; this is about trying too hard to impress people, not about water
  splashing or making a splash.
examples:
- The newspaper ran a splashy ad that covered half a page.
- She wore a splashy dress covered in gold and bright red shapes.
