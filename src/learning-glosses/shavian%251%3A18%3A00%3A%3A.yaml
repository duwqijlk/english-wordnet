simpleMeaning: A person who admires G. B. Shaw or his works.
scope: This names a person who admires George Bernard Shaw or his works, while the same word used as an
  adjective means 'of or relating to Shaw and his works'.
examples:
- He was a Shavian who loved the plays of G. B. Shaw.
- The Shavian in the front row knew every line of the play.
