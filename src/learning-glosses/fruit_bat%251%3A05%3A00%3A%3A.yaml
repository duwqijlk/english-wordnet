simpleMeaning: A large flying animal of warm and hot lands in the Old World, that lives on the sweet flesh
  of plants
scope: A large fruit-eating bat of warm lands; megabat is another name for this sense, not a small insect-eating
  bat and not a bat of cold lands.
examples:
- A fruit bat hung from the branch, eating figs.
- Fruit bats spread seeds through the forest.
