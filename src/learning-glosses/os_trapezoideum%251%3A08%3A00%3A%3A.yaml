simpleMeaning: The wrist bone that sits between the trapezium and the capitate bones.
scope: The wrist bone between the trapezium and the capitate bones; trapezoid is another name for this
  sense, not the wrist bone in line with the fourth and fifth fingers and not the thumb-side wrist bone.
examples:
- The os trapezoideum lies deep in the wrist.
- An os trapezoideum joins the wrist to the hand.
