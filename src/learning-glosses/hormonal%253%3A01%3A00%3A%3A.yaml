simpleMeaning: relating to, or caused by, the natural substances made inside the body that control how
  the body grows and works
scope: Relating to or caused by these body substances, not about changes caused by illness, food, or age
  on their own.
examples:
- Hormonal changes can affect mood during the teenage years.
- She saw a doctor about a hormonal problem that affected her periods.
