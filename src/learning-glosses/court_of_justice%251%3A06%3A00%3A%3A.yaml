simpleMeaning: A place where law cases are heard, run by a magistrate or by one or more judges who settle
  cases by the laws
scope: This is a place where law cases are heard, run by a magistrate or by one or more judges; lawcourt,
  court of law and law court are other names for it; not a parliament, which makes laws, and not a lawyer's
  office.
examples:
- The court of justice heard the case on Monday.
- She was called to the court of justice to give evidence.
