simpleMeaning: Any part or thing used to start the burning of a propellant (a material that burns to push
  something forward)
scope: 'Also called fuse or priming: a part or thing used to start a main material burning; not the first
  thin coat of paint put on a surface before the main paint.'
examples:
- The primer in the cartridge lights the main powder when the gun is fired.
- He replaced the old primer so the charge would burn as it should.
