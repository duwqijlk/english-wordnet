simpleMeaning: a dress with no sleeves, like an apron, worn over other clothes
scope: 'Also called jumper and pinny: a dress with no sleeves worn over other clothes, not an apron worn
  on its own and not a dress worn by itself.'
examples:
- She wore a white pinafore over her blue dress.
- The little girl put on a clean pinafore before school.
