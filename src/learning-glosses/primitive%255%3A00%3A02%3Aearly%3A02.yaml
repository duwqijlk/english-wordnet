senseId: primitive%5:00:02:early:02
synsetId: 00821744-s
simpleMeaning: Belonging to an early period in the development of a technology, and often simple and rough
  in form.
scope: This is about tools, machines, or methods from an early period of technical development, not about
  living things that have changed little from an ancestral form or about tribal societies without industry.
examples:
- The first cameras were primitive boxes that took blurry pictures.
- Early medical tools were primitive, little more than sharpened stones.
