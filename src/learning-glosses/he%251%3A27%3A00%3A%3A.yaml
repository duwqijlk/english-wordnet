simpleMeaning: A light gas with no colour, one of six that do not react; hardest of all gases to turn
  to liquid; found in amounts worth getting in some natural gases
scope: A light gas with no colour, one of six that do not react; helium and atomic number 2 are other
  names for this sense, and it is not a gas that burns nor a gas that reacts with other things.
examples:
- The balloon was filled with He.
- He is used to fill balloons and to cool magnets.
