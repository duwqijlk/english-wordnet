senseId: 'rift%1:11:00::'
synsetId: 07328414-n
simpleMeaning: A split between people or groups, as when two sides that disagree go their separate ways.
scope: A split between people or groups, and break, rupture and breach are other names for this sense;
  not a gap in the clouds.
examples:
- The rift between the two families lasted for years.
- A rift grew between the old friends after the quarrel.
