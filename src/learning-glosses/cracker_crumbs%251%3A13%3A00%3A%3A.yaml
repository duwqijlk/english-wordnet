simpleMeaning: small bits of dry biscuit, used in particular to coat food or to make a dish thicker
scope: Small bits of dry biscuit used to coat food or make a dish thicker, not whole biscuits and not
  bread crumbs.
examples:
- She rolled the fish in cracker crumbs before frying it.
- He stirred cracker crumbs into the soup to make it thicker.
