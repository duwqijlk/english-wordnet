simpleMeaning: To take all the air out of a bulb, a flask, or a jar used for tests, leaving it empty
scope: This is about taking the air out of a bulb, flask, or jar used for tests, not about moving people
  out of a place in danger.
examples:
- The worker evacuated the bulb before sealing it.
- They evacuated the flask and then filled it with gas.
