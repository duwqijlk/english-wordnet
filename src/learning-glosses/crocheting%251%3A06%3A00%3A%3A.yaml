senseId: 'crocheting%1:06:00::'
synsetId: 03137530-n
simpleMeaning: work done with a hooked needle, in which loops are linked together to form stitches
scope: This sense, also called crochet, is cloth made with one hooked needle and loops; it is not knitting
  with two needles and not sewing with a straight needle.
examples:
- She spends her evenings crocheting a warm blanket for her baby.
- Crocheting takes time, as each loop is made with a small hooked needle.
