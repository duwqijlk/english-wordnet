simpleMeaning: The state has tied money to other money or to a mix of moneys, and the set of values is
  looked over and changed at set times.
scope: This set of values is tied by the state to other money or a mix of moneys, and is looked over and
  changed at set times.
examples:
- Under a pegged exchange rate, the state ties the value to other money.
- A pegged exchange rate is looked over and changed at set times.
