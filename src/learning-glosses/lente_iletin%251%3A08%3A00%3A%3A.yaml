simpleMeaning: This trade name marks a form of insulin used to treat diabetes, a sickness in which the
  body cannot use sugar well.
scope: Also called Lente Insulin, this is a trade name for a form of insulin used to treat diabetes, not
  a name for the sickness itself.
examples:
- The doctor gave him Lente Iletin to treat his diabetes.
- Lente Iletin is a trade name for a form of insulin.
