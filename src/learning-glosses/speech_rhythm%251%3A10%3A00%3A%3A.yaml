simpleMeaning: how words in talk are set out, with loud beats and soft beats taking turns
scope: How words in talk are set out, with loud beats and soft beats taking turns; also called rhythm.
  Not the beat of music and not the speed of talk.
examples:
- The speech rhythm of his talk made it easy to follow.
- Her speech rhythm put a strong beat on every third word.
