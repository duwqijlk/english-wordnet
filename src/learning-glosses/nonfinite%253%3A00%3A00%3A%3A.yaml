scope: A verb form like 'to run' or 'running' that shows no time, no doer and no one-or-many, with non-finite
  and infinite as other names for this sense, not a verb form that shows time and not a noun.
examples:
- In 'to run', the verb form is nonfinite.
- A nonfinite verb has no tense.
