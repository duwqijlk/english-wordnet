senseId: 'transcutaneous%3:01:00::'
synsetId: 02955664-a
simpleMeaning: Through skin that is not broken; of drugs put straight on the skin, as creams or ointments,
  or in slow-release skin patches
scope: Through skin that is not broken, of drugs put on the skin; percutaneous, transdermal and transdermic
  are other names for this sense, and not through a cut in the skin or a drug taken by mouth.
examples:
- Transcutaneous drugs pass through the skin.
- The transcutaneous patch released the drug slowly.
