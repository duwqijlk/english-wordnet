simpleMeaning: A free-standing arm of the federal government that carries mail, and at times phone calls,
  between people and firms in the United States.
scope: The federal mail service, not a Navy rank and not a private firm; also called the Post Office,
  the United States Post Office, and the US Post Office.
examples:
- The PO delivers letters to every house in town.
- She posted the parcel at the PO.
