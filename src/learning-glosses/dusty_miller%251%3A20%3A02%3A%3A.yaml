simpleMeaning: A shrubby long-lived bush of the Canary Isles with white blooms and leaves and hairy stems
  set with dust-like down, sometimes put under the genus Chrysanthemum.
scope: This sense is also called silver-lace and silver lace, a shrubby long-lived bush of the Canary
  Isles with white blooms and leaves and hairy stems set with dust-like down, sometimes put under the
  genus Chrysanthemum, unlike the sense for a stiff much-branched long-lived plant of the Mediterranean
  region with very white woolly stems and leaves, and unlike the sense for an old cottage garden plant
  of southeastern Europe widely grown for its fine white woolly leafage and showy red blooms.
examples:
- Dusty millers grow on the Canary Isles.
- The dusty miller bears white blooms.
