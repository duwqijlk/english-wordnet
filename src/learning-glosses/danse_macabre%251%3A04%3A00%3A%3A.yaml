senseId: 'danse_macabre%1:04:00::'
synsetId: 00543186-n
simpleMeaning: A set of steps of the Middle Ages in which a bony figure that stands for the end of life
  leads a line of others to the grave.
scope: This is a medieval show in which a bony figure leads people to the grave, also called dance of
  death, not a real dance for fun or a play about death in general.
examples:
- The danse macabre was danced in the old town each year.
- In the danse macabre, a skeleton leads the others to the grave.
