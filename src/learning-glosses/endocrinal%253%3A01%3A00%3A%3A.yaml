simpleMeaning: having to do with glands that send juices straight into the blood, or with the juices those
  glands make
scope: 'Also called endocrine: having to do with glands that send juices straight into the blood or with
  those juices, not with glands that send juices through tubes and not with the blood itself.'
examples:
- The endocrinal system sends juices straight into the blood.
- Endocrinal glands work without tubes or ducts.
