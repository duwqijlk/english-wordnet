simpleMeaning: either the outer edge or the inner edge of the shell opening of a gastropod, a mollusc
  such as a snail
scope: The rim around a mollusc shell's opening; not the human mouth part, the petal part of a flower,
  or an insolent answer.
examples:
- The collector noted the dark lip around the shell's opening.
- The inner lip of the specimen was smooth and pale.
