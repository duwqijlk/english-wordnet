senseId: 'cauterise%2:30:01::'
synsetId: 00273913-v
simpleMeaning: To leave a person feeling nothing, by killing off feeling or the sense of right and wrong.
scope: Also called callous and cauterize, this is to deaden feeling or morals, not to burn, sear, or freeze
  living flesh with a hot iron, an electric current, or a caustic substance.
examples:
- Years of cruelty had cauterised his feelings.
- Power can cauterise a person's sense of right and wrong.
