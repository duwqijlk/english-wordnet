simpleMeaning: paper with a wrinkled surface, usually colored and used for making decorations
scope: This is the wrinkled paper used for decorations, not the soft thin cloth of the same name used
  for clothes.
examples:
- We hung long strips of pink crepe paper across the room.
- She cut flowers from red crepe paper for the party.
