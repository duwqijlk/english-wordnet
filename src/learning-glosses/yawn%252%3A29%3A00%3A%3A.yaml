simpleMeaning: to take in a deep breath through a wide open mouth, when the body lacks air or when a person
  is tired
scope: No partner name for this sense; this is the act of doing it, not the breath itself, when the body
  lacks air or a person is tired.
examples:
- The child yawned during the long performance.
- She yawned and stretched after waking up late.
