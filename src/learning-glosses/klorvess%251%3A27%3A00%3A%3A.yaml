senseId: 'klorvess%1:27:00::'
synsetId: 14885193-n
simpleMeaning: A potassium salt (KCl) sold under several brand names and taken as tablets to treat low
  potassium in the body.
scope: Also called potash muriate, potassium chloride, potassium muriate, K-Dur 20, Kaochlor, K-lor, and
  K-lyte; a potassium salt in tablet form, not a salt for cooking and not a liquid medicine.
examples:
- The doctor gave him Klorvess tablets for his low potassium.
- She takes Klorvess twice a day to keep her potassium up.
