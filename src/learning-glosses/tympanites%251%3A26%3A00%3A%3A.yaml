simpleMeaning: A swelling of the belly caused by gas building up in the gut or in the bag round the gut.
scope: This is a swelling of the belly caused by gas in the gut, not a swelling from fluid and not a tumour.
examples:
- Tympanites made his belly swell after the meal.
- His belly was swollen with gas, and the doctor said it was tympanites.
