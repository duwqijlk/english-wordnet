simpleMeaning: a long thin stick that gets thinner at one end, used to hit the white ball in pool or billiards
scope: This is the stick used in pool or billiards. It is not a line that reminds an actor what to say
  or do next, and not the act of helping someone remember words.
examples:
- He picked up his cue and hit the white ball.
- She put chalk on the tip of her cue before the shot.
