simpleMeaning: A narrow stream of tiny bits of matter, such as atoms, electrons, or small groups of atoms,
  all moving in one line
scope: A narrow stream of tiny bits of matter all moving in one line, not a ray of light and not one bit
  on its own.
examples:
- The particle beam struck the target and left a small mark.
- A particle beam of electrons is aimed at the metal plate.
