simpleMeaning: A machine that cleans the blood of waste and dirt by passing it through a thin wall, then
  sends the clean blood back into the body.
scope: A machine that cleans the blood and sends it back into the body; artificial kidney is another name
  for this sense, and this is not a machine that gives blood or one that checks the blood.
examples:
- The patient went to the clinic three times a week to use the hemodialyzer.
- A hemodialyzer cleaned his blood while his kidneys healed.
