simpleMeaning: a single whole, such as an idea or system, that is built from many connected parts.
scope: This is a noun naming the whole itself, not the adjective describing something as hard to understand,
  and not a group of buildings.
examples:
- The city's transport network is a complex of roads, rail lines, and tunnels.
- The theory is a complex of ideas drawn from several fields.
