synsetId: 05371224-n
simpleMeaning: Any one of several bent blood vessels that run side by side with blood vessels of the same
  name that carry blood away from the heart.
scope: One of several bent blood vessels that run beside matching blood vessels of the same name, not
  the matching vessel itself and not a straight blood vessel.
examples:
- The circumflex vein runs beside the artery of the same name.
- The doctor found the circumflex vein next to the artery.
