simpleMeaning: To come to an end in time, in space, or in amount, whether the end is real or only meant
  as a picture
scope: 'Also called end, finish, and stop: coming to an end in time, in space, or in amount, not stopping
  a thing yourself, and not a thing that goes on without end.'
examples:
- The music ceased at midnight.
- My land ceases at the bushes.
