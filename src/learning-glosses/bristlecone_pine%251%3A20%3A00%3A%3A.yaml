simpleMeaning: A slow-growing mountain conifer of the American West, with dense branches, cracked bark,
  needles in bunches of five, and sharply pointed cones; some live over 4,500 years.
scope: The high-mountain pine of the American West, not other pines and not the giant sequoia.
examples:
- Bristlecone pines on high ridges are among the oldest trees on Earth.
- A bristlecone pine grows slowly on a dry mountain slope.
