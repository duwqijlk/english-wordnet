simpleMeaning: the quality of being so unpleasant to the senses or the feelings that it brings a strong
  feeling of dislike and a wish to get away from it
scope: 'Also called wickedness, sliminess, and loathsomeness: the quality of being so unpleasant to the
  senses or the feelings that it brings a strong feeling of dislike. Not just being bad or wrong in what
  a person does.'
examples:
- The vileness of the smell in the old room made her step back.
- He was shocked by the vileness of the words they used.
