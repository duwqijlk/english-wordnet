simpleMeaning: any of various small mouse-like rodents of the Cricetidae family, especially the group
  Microtus, with a thick body, short tail and ears that hardly show, living in fields or meadows
scope: 'Also called field mouse: this is a small animal of fields and meadows, like a mouse, not a house
  mouse and not a rat.'
examples:
- A vole ran through the grass at the edge of the field.
- Voles live in the meadow and eat plants and seeds.
