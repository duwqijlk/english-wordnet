simpleMeaning: how good a person is at fooling others by clever tricks
scope: How good a person is at fooling others by clever tricks, also called craft; not the artful skill
  itself, not showing that skill, and not being small and pretty.
examples:
- The fox won praise for its cunning in outwitting the hunters.
- His cunning helped him talk his way out of trouble.
