simpleMeaning: Vast notes on the Hebrew Scriptures about writing, word counts, wordings and how to say
  words, written AD 600-900 by Jewish scribes in margins or at the end of texts.
scope: Notes on the Hebrew Scriptures written by Jewish scribes, not a translation and not a commentary
  on meaning; also called Masorah.
examples:
- The Masora guided scribes copying the Hebrew Scriptures.
- Scholars study the Masora to check old texts.
