simpleMeaning: A foot bent so that the toes point upward, and the person walks on the heel of the foot
scope: A foot shape where the toes point up and the walk is on the heel, not a foot turned inward and
  not a flat foot.
examples:
- The baby's talipes calcaneus meant her toes pointed up when she stood.
- With talipes calcaneus, he walked on his heels instead of the balls of his feet.
