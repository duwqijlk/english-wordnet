simpleMeaning: to remove written words or marks by rubbing them away or drawing lines through them
scope: To remove written words or marks by rubbing them away or drawing lines through them, not to shape
  paper with a blade and not to leave a thing out of a plan.
examples:
- Please cut out my name from that list.
- She cut out the wrong line and wrote the right one in its place.
