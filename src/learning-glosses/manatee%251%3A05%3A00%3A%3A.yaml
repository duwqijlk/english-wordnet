simpleMeaning: A mammal that lives in warm sea water near the coasts of America, with a flat tail that
  is round at the end
scope: A sea mammal of warm American coasts with a rounded flat tail, not a seal or a whale.
examples:
- A manatee swam slowly through the warm water near the Florida coast.
- The manatee lifted its round, flat tail above the water.
