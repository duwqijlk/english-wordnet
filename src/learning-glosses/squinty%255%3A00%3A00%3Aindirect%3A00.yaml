senseId: squinty%5:00:00:indirect:00
synsetId: 00766264-s
simpleMeaning: 'used especially of a look: turned to one side, as if the person doubts something, does
  not trust someone, or wants what someone else has'
scope: Also called squint, sidelong, and askance. This is about a look turned to one side that shows doubt,
  a lack of trust, or wanting what another person has, not about eyes that are partly closed.
examples:
- She gave him a squinty look, as if she did not trust his story.
- He cast a squinty glance at the winner's prize.
