senseId: 'deprecatio%1:10:01::'
synsetId: 92470532-n
simpleMeaning: a prayer that asks for an evil to be taken away, made against the evil itself, against
  other people, or against oneself
scope: A prayer asking for an evil to be taken away, made against the evil, against others, or against
  oneself, and not a prayer of thanks or a prayer asking for something good.
examples:
- In his speech, the lawyer made a deprecatio, praying that the evil be taken from his client.
- The old rite included a deprecatio against the sickness that had struck the village.
