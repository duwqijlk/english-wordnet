simpleMeaning: Grace shows in a slim body that bends and moves with ease
scope: A slim, graceful body that bends and moves with ease, also called lissom, lissome, lithe, sinuous,
  and supple, not a stiff or heavy build.
examples:
- The lithesome dancer bent and turned with ease.
- Her lithesome frame moved gracefully across the stage.
