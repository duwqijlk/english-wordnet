simpleMeaning: To spoil a person in their morals, through too much drink or through giving in to the pleasures
  of the body.
scope: To spoil a person in their morals, through too much drink or through giving in to the pleasures
  of the body; also called corrupt, pervert, profane, demoralize, subvert, debase, misdirect, deprave,
  debauch, or vitiate; not making someone downhearted or low in spirits.
examples:
- Socrates was accused of demoralising young men.
- The pamphlet warned that drink would demoralise the town's youth.
