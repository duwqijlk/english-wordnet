simpleMeaning: A woody Mediterranean plant that lives one year, widely grown for its dense, spike-like
  clusters of pale greenish or yellowish flowers at stem tips, with an intense spicy scent.
scope: Another name for mignonette; this is the scented Mediterranean plant, not any other species that
  carries a reseda name.
examples:
- Sweet reseda self-seeds readily once it settles into a sunny border.
- Old garden books praise sweet reseda above all flowers for its perfume.
