simpleMeaning: Big blisters with thin skins, soft bubbles of skin, grow out of healthy skin or the wet
  lining inside the body in this skin illness.
scope: Among skin illnesses that raise blisters, this one grows big thin-skinned blisters out of healthy
  skin or the wet lining inside the body.
examples:
- Pemphigus raised big blisters on skin that had been healthy.
- The blisters of pemphigus grew on the wet lining inside the body.
