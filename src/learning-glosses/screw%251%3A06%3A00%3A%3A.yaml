simpleMeaning: a thing that holds things together, with a thin end, a wound groove along its side, and
  a cut across its top
scope: A fastener with a threaded body and a slotted head, not the simple machine in rod form and not
  the propeller.
examples:
- He drove a screw into the wood to hold the hinge.
- The screw has a slot in its head for a screwdriver.
