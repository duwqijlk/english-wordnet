simpleMeaning: A home built on posts in or near a still stretch of water, found above all in old villages
  from long ago.
scope: A home built on posts in or near a still stretch of water, found above all in old villages from
  long ago; pile dwelling is another name for this sense, not a house on dry land and not a boat moored
  on the water.
examples:
- The lake dwelling stood on wooden posts above the water.
- Lake dwellings from long ago have been found under the mud.
