senseId: 'intellectualisation%1:22:00::'
synsetId: 13522262-n
simpleMeaning: In psychiatry, a way of thinking things through so that bad feelings and clashes are shut
  out of mind
scope: A way of shutting out bad feelings by thinking things through, also called intellectualization;
  not facing the feelings and not talking them out.
examples:
- His intellectualisation of the loss kept him from feeling any grief.
- She used intellectualisation to turn the row into a cool debate.
