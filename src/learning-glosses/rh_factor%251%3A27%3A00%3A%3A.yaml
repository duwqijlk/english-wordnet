simpleMeaning: A blood group marker in people of one type; if a person without it gets blood from a person
  with it, red cells may break down and anaemia may follow
scope: Also called rhesus factor and Rh; a blood group marker, close to other blood group markers such
  as the ABO groups.
examples:
- The Rh factor test showed she was positive.
- Doctors check the Rh factor before a transfusion.
