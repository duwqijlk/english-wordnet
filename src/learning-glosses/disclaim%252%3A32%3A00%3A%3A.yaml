simpleMeaning: to say that you do not have a right to something, or that something is not your responsibility
scope: This is saying you do not have a right to a thing, or that a thing is not your responsibility;
  not saying a thing is yours and not saying a fact is not true.
examples:
- She disclaimed any right to the money.
- The company disclaimed responsibility for the damage.
