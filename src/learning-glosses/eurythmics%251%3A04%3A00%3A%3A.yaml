simpleMeaning: A way of teaching people to grasp music, by showing the beat of a piece of music in smooth
  movements of the body.
scope: Also called eurhythmics, eurhythmy and eurythmy, it is a way to learn music by moving the body
  to the beat.
examples:
- Eurythmics helps people grasp music.
- In eurythmics, they move their bodies to the beat of the music.
