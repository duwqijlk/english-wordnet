simpleMeaning: Very great bravery in danger, above all in battle, of the kind that marks a hero or heroine
scope: 'Also called valor, heroism, valiance, valiancy, valorousness and valour: very great bravery when
  facing danger, especially in battle, not ordinary bravery with no danger.'
examples:
- He showed great gallantry in battle and received a medal.
- Her gallantry when she ran into the burning house saved two children.
