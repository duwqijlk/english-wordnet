schema: oewn-learning-gloss-v2
senseId: 'cephalic_index%1:24:00::'
synsetId: 13843038-n
simpleMeaning: A number, given as a percent, that shows how wide a skull is at its widest compared with
  how long it is at its longest.
scope: A percent number for how wide a skull is against how long it is, not the size of the skull and
  not its shape; breadth index and cranial index are other names for this sense.
examples:
- The cephalic index of the skull was 78 percent.
- Anthropologists use the cephalic index to compare skulls.
