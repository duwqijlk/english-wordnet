simpleMeaning: The one named before gets what is left when the owner dies; while alive, the owner runs
  the money in the bank, held as keeper for that other person.
scope: Also called savings bank trust, trust account, and trustee account; money in a bank held by its
  owner for another person, not money the other person can touch while the owner lives.
examples:
- She opened a savings account trust for her grandson.
- After she dies, the savings account trust pays what is left to the person she named.
