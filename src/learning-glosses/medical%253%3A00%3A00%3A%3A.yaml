simpleMeaning: Needing or able to be treated with drugs rather than with an operation.
scope: It is not about medicine as a subject of study, and not a general health examination.
examples:
- The treatment was medical rather than surgical, so pills should be enough.
- Her injury was medical rather than surgical, and no operation was needed.
