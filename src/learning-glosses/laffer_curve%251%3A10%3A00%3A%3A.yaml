simpleMeaning: 'A graph that claims to show how tax rates and state income hang together: income rises
  as rates rise to a best point, then falls'
scope: 'A graph that claims to show how tax rates and state income hang together: income rises as rates
  rise to a best point, then falls; not a graph of tax rates alone, and not a graph of income alone.'
examples:
- The Laffer curve shows income rising and then falling as tax rates rise.
- He drew the Laffer curve on the board.
