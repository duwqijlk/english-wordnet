senseId: 'digitigrade%3:00:00::'
synsetId: 00754691-a
simpleMeaning: Describes a mammal that walks on its toes, with the back part of its foot held up, as cats,
  dogs, and horses do.
scope: Walking on the toes with the back of the foot raised, not walking flat on the whole foot and not
  standing on the heels.
examples:
- Cats are digitigrade, so they seem to walk on tiptoe.
- A digitigrade animal lifts the back of its foot as it walks.
