simpleMeaning: a very leafy tropical shrub that spreads fast, with a bad smell, whose seeds were once
  mixed into coffee to stretch it; sometimes put in the group Cassia
scope: 'Also called coffee senna, mogdad coffee, and stinking weed: a leafy tropical shrub, not a coffee
  plant and not a garden herb.'
examples:
- The styptic weed grew thick along the road.
- Farmers pulled up the styptic weed before it spread.
