simpleMeaning: The last ruling house of China, from 1644 to 1912, brought down by men who rose against
  it; in its time the Manchu ruled China.
scope: Also called Ch'ing, Ch'ing dynasty, Manchu, Manchu dynasty, and Qing dynasty; the last ruling house
  of China, not the Ming house and not the republic that followed.
examples:
- The Qing fell in 1912.
- Qing art shows Manchu taste.
