senseId: 'shielding%1:06:01::'
synsetId: 04200222-n
simpleMeaning: a cover of metal net or flat plates that stops stray electric signals from the air around
  it reaching electronic equipment
scope: A metal cover that keeps stray signals out of electronic equipment, not a lead or concrete barrier
  against radiation and not the act of shielding from harm.
examples:
- The shielding around the wires kept out stray signals.
- Workers fitted shielding to protect the radio set.
