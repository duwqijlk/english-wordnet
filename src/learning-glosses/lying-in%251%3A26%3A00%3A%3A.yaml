simpleMeaning: This is the time from the first pains to the birth of the child, the last part of a pregnancy
scope: Also called childbed, confinement, labor, labour, parturiency, and travail, this is the last part
  of pregnancy, from the first pains to the birth of the child, not the whole pregnancy and not the birth
  itself.
examples:
- Her lying-in lasted six hours before the baby came.
- The nurse stayed with her through the lying-in.
