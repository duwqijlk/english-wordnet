simpleMeaning: One of two small bits of gristle at the back of the voice box, where the voice cords are
  fixed
scope: One of two small bits of gristle at the back of the voice box, also called an arytenoid and arytenoid
  cartilage; not the voice cords themselves and not a bone in the throat.
examples:
- The arytaenoid sits at the back of the voice box.
- Each arytaenoid holds one end of a voice cord.
