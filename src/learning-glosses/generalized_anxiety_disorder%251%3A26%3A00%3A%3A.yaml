simpleMeaning: A lasting disorder of near-constant worry that is not tied to any one cause, with symptoms
  like tension, sweating, shakiness, dizziness or irritability, continuing for over six months.
scope: This is the disorder of ongoing, unfocused worry lasting over six months; anxiety reaction is another
  name for it, not a phobia aimed at one object or situation, and not a panic attack that peaks within
  minutes.
examples:
- She was diagnosed with generalized anxiety disorder after months of constant worry.
- Generalized anxiety disorder often causes muscle tension, fatigue and trouble sleeping.
