simpleMeaning: a mass of crossed threads, full of holes, forming the inner frame of sea animals, able
  to soak up water, or any rubber or plant thing used the same way
scope: A mass of crossed threads, full of holes, that forms the inner frame of sea animals and soaks up
  water, not the sea animal itself and not the acts of wiping with it.
examples:
- She wiped the table with a sponge.
- A sponge can soak up a whole cup of water.
