simpleMeaning: an old tool, most often made of sand, used to wear down other things by rubbing
scope: This is an old tool for wearing things down by rubbing; not a smooth tool for cutting and not a
  modern machine.
examples:
- The worker used an abrading stone to smooth the edge of the bone tool.
- She rubbed the edge of the pot with an abrading stone to wear it smooth.
