simpleMeaning: In reproduction, not needing a male cell and a female cell to join
scope: In reproduction, not needing a male cell and a female cell to join; agamic, agamogenetic, apomictic
  and parthenogenetic are other names for this, not the usual kind of reproduction in which two cells
  join.
examples:
- Agamous reproduction needs no joining of male and female cells.
- Some agamous plants spread without seeds joining.
