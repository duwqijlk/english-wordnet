simpleMeaning: A tool for getting tangles out of hair and putting it in place, made flat with thin, pointed
  teeth in a row along one side
scope: A flat toothed tool for hair, not the red crest on a bird's head, not a tool for straightening
  fibers, and not the act of smoothing hair.
examples:
- She ran a comb through her hair to smooth out the tangles.
- He keeps a comb in his pocket for fixing his hair.
