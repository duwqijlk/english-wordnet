simpleMeaning: a person who lives in a town or area just outside a city and makes the trip into the city
  for work again and again
scope: This is a person who makes this trip again and again, not the train that such people ride.
examples:
- The commuter leaves her suburb home at seven each morning for work in the city.
- Commuters filled the early train into the city for work.
