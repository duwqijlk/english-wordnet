simpleMeaning: A man's high-crowned hat, often covered with silk or beaver fur.
scope: A man's high-crowned hat, often covered with silk or beaver fur; also called beaver, stovepipe,
  dress hat, high hat, opera hat, silk hat, or top hat; not a worker who cuts tops off, of trees or vegetables
  or the like, nor a most excellent jest that beats all that went before.
examples:
- Their topper sat at dawn.
- The topper was worn at noon.
