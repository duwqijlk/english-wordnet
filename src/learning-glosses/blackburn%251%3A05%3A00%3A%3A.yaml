simpleMeaning: A songbird of North American woods, black and white with an orange and black head and throat.
scope: Also called the Blackburnian warbler and Dendroica fusca; a North American wood warbler with an
  orange and black head, not other black-and-white warblers.
examples:
- We saw a Blackburn in the woods.
- The Blackburn sang from a high branch.
