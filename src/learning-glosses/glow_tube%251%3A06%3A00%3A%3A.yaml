simpleMeaning: Filled with gas, this glass pipe gives off light of a shade set by the gas, through a cold
  metal part and a one-way power part.
scope: This pipe gives off coloured light from a cold part, unlike a bulb lit by a hot wire.
examples:
- The glow tube gave off a soft orange light when the gas inside it was switched on.
- A glow tube in the sign shone blue because of the gas it held.
