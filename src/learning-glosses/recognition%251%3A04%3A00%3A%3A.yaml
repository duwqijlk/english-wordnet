simpleMeaning: an act by the person in charge of a meeting, the chair, naming a person and giving them
  the right to speak in a group that discusses and decides things
scope: This is the chair naming someone to speak in a meeting, not knowing someone again from memory and
  not the formal acceptance of a country.
examples:
- He could not speak until he got recognition from the chairman.
- She waited for recognition before she stood up to make her motion.
