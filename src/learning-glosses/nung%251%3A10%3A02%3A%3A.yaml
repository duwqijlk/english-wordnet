simpleMeaning: One branch of the Tai languages, spoken in the north of Vietnam, mainly in seven named
  provinces, and perhaps also in Ho Chi Minh City and other southern places.
scope: One branch of the Tai languages of northern Vietnam; not the other Tai branches of the same area.
examples:
- Nung is spoken in the north of Vietnam.
- Nung speakers live in Cao Bang province.
