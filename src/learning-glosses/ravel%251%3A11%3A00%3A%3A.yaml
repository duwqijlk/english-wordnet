simpleMeaning: a line of stitches that have come loose in knitted cloth
scope: 'Also called a run and a ladder: a line of stitches that have come loose, not a tangle or a knot
  in thread.'
examples:
- A ravel appeared in her stocking after she caught it on a chair.
- She sewed up the ravel in the sleeve of her sweater.
