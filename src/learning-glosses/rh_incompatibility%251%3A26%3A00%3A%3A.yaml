senseId: 'rh_incompatibility%1:26:00::'
synsetId: 13998891-n
simpleMeaning: A clash of blood kinds in which a gift of blood of one kind to a person of the other kind
  can break down red cells and bring on anaemia.
scope: A clash of Rh blood kinds that can break down red cells after a transfusion, not a clash over other
  blood kinds.
examples:
- Rh incompatibility can make a blood gift unsafe.
- Doctors test for Rh incompatibility before a transfusion.
