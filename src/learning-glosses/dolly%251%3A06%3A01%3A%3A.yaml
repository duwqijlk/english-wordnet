simpleMeaning: a flat platform on wheels, used for moving heavy things
scope: A flat platform on wheels for moving heavy things; not the wheeled stand that holds a camera, and
  not a toy doll for a child.
examples:
- We put the heavy box on a dolly and rolled it to the door.
- He used a dolly to move the fridge into the new house.
