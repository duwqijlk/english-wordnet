simpleMeaning: an American hawthorn that stands straight up, has almost no thorns, and has berries shaped
  a little like pears
scope: 'Also called pear haw and pear hawthorn: this American kind with almost no thorns, not the thorny
  kind from Europe and Asia with fruit like plums.'
examples:
- The blackthorn in the American garden had almost no thorns and pear-shaped berries.
- She picked berries from the blackthorn, a hawthorn with almost no thorns.
