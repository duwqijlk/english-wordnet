simpleMeaning: The inner organs and blood tubes get their signals through one of several cords from the
  sympathetic branch of the body's self-running system.
scope: One of several such cords, it carries signals from the sympathetic branch of the body's self-running
  system to the inner organs and blood tubes.
examples:
- The splanchnic nerve carries signals to the gut.
- A splanchnic nerve carries signals to the blood tubes.
