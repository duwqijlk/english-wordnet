simpleMeaning: a group of people chosen to speak or act for a larger group
scope: A group of people sent to speak for others, not the act of giving a job or power to another person.
examples:
- A delegation of teachers met the head of the school to ask for more books.
- The delegation from the town spoke to the mayor about the new road.
