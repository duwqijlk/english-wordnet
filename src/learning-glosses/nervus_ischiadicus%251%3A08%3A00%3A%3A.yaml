simpleMeaning: a nerve from the nerves at the base of the back that runs about halfway down the thigh
  and there splits into two nerves that go down the lower leg
scope: 'Also called sciatic nerve: a nerve that runs down the back of the thigh and splits into two, not
  a nerve of the arm and not a nerve that stays in the back.'
examples:
- The nervus ischiadicus runs about halfway down the thigh before it splits in two.
- Damage to the nervus ischiadicus can cause pain down the back of the leg.
