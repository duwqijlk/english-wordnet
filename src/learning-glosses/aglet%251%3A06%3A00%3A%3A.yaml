simpleMeaning: On the shoulder of a uniform sits this fancy cord or braid, finished with a tip and worn
  to decorate.
scope: Also called aiglet or aiguillette, this fancy cord or braid sits on the shoulder of a uniform to
  decorate it.
examples:
- The aglet on the officer's shoulder caught the light during the salute.
- An aglet hung from the shoulder of the uniform.
