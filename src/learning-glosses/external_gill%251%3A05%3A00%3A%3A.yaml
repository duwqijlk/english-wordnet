simpleMeaning: A breathing part on the outside of the body, found in some soft-bodied animals and in tadpoles
  and other young land-and-water animals.
scope: A breathing part on the outside of the body; not a breathing part hidden inside the body and not
  a lung.
examples:
- The tadpole breathed through its external gills.
- External gills wave in the water beside the young salamander's head.
