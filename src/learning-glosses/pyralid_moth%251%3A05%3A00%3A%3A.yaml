simpleMeaning: With young that are pests of crops, this is a thin, long-legged moth, usually of warm lands.
scope: Also called pyralid, this moth stands apart from other moths by its thin, long legs and its young,
  which are pests of crops.
examples:
- The pyralid moth's young ate the crops.
- The pyralid moth's young were pests of the crops.
