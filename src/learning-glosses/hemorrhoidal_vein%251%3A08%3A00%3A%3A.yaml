simpleMeaning: Any of several blood vessels that drain the walls of the tube at the end of the gut and
  the last part of the gut
scope: This is any of several blood vessels that drain the walls of the tube at the end of the gut, also
  called rectal vein and vena rectalis, and not a blood vessel that feeds the gut or one in the leg.
examples:
- The hemorrhoidal vein drains the wall of the rectum.
- Doctors traced the bleed to a hemorrhoidal vein.
