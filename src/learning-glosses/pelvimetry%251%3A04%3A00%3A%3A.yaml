simpleMeaning: measuring the size of the bony birth canal to tell if a baby can be born through it
scope: Measuring the bony birth canal before birth, not measuring the baby and not a test done during
  labour.
examples:
- The doctor ordered pelvimetry to check the birth canal.
- Pelvimetry showed the canal was wide enough for a natural birth.
