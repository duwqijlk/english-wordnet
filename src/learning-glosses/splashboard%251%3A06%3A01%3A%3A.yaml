simpleMeaning: A flat shield that keeps splashing water, mud, and the like off people.
scope: Also called a dashboard and a splasher, it stands between people and splashing water, mud, and
  the like, unlike the wide piece of wood along a boat's top edge.
examples:
- The splashboard stopped the mud from reaching the passengers.
- Rain spattered against the splashboard.
