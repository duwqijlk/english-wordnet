simpleMeaning: a person whose way of thinking or acting is strange and unlike most people
scope: A person whose way of thinking or acting is strange; flake is another name for this sense, not
  the adjective for something odd or out of the ordinary.
examples:
- The old eccentric kept a goat in his garden.
- Everyone in the village knew the eccentric who wore hats indoors.
