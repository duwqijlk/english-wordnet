simpleMeaning: Any of a group of mammals with hooves that look much alike on the outside but need not
  be close kin.
scope: 'Also called hoofed mammal: a mammal with hooves, not a mammal with paws and not a sea animal.'
examples:
- The deer is an ungulate, a mammal that walks on hooves.
- Horses, pigs and deer are all ungulates.
