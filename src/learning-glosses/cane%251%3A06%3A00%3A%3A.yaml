simpleMeaning: a stiff thin stick used to hit people, usually students, as a way to punish them
scope: This sense is a stick used to hit students to punish them, not the long thin stem of a plant.
examples:
- The teacher kept a cane to punish bad students.
- He was hit with a cane for breaking the rules.
