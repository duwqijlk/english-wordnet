senseId: 'agitate%2:41:10::'
synsetId: 02595732-v
simpleMeaning: to work hard without stopping, in a way that forces other people to notice you, to win
  a goal or back a cause or person, and speak up for them
scope: Also called campaign, fight, push and press — other names for this same sense of working in public
  for a cause or a person. Not the sense of making a person feel upset or excited.
examples:
- She agitated for better pay for nurses.
- For years, the workers agitated to win the right to vote.
