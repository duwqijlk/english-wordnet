simpleMeaning: Used to cover roofs and as bedding, these are the stems of beans, peas, potatoes, and grasses
  taken together.
scope: It is also called halm, and it is the stems of beans, peas, potatoes, and grasses taken together
  for thatching and bedding.
examples:
- The haulm was stacked for thatching.
- Haulm made soft bedding.
