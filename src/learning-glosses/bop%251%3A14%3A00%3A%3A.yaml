simpleMeaning: The law enforcement agency of the Justice Department that runs the country's prisons and
  detention facilities, holding people given prison time for federal crimes.
scope: Also called the Federal Bureau of Prisons; the Justice Department agency that runs the nation's
  federal prisons and detention centres.
examples:
- The BoP runs the federal prison in our state.
- He was moved to a BoP facility after sentencing.
