simpleMeaning: 'Ten is the base: each figure takes its worth from the place it holds in the count'
scope: This is counting by place with ten as the base, also called the decimal number system and the decimal
  system; not counting by twos, and not tallies, which give each mark the same worth.
examples:
- The decimal numeration system is the one most people use for everyday sums.
- She learned the decimal numeration system before she learned any other way of counting.
