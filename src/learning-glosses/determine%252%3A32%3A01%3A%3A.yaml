simpleMeaning: to find out and be sure about something, usually by asking questions or by making some
  other effort
scope: 'Also called see, watch, learn, and check: this is finding out and being sure, usually by asking
  or trying, not working out a fact by numbers, tests, or study.'
examples:
- Please determine whether the train leaves on time.
- She called the office to determine if she had got the job.
