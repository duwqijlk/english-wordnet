senseId: 'fiduciary_relation%1:24:00::'
synsetId: 13860585-n
simpleMeaning: In law, the tie between two people when one rightly trusts the other, whose help or care
  is asked for in some matter.
scope: In law, the tie between two people when one rightly trusts the other, whose help or care is asked
  for in some matter; not a signed contract and not a mere friendship.
examples:
- A lawyer and client stand in a fiduciary relation.
- The court said a fiduciary relation existed between the trustee and the child.
