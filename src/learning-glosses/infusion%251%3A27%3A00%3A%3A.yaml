senseId: 'infusion%1:27:00::'
synsetId: 14872955-n
simpleMeaning: a liquid you get by leaving something in a liquid, usually water, so that parts of it pass
  into the liquid
scope: 'Also called extract: this is the liquid made by soaking, not the act of soaking itself and not
  adding a new part to a group or thing.'
examples:
- She drank a warm infusion of herbs before bed.
- He poured the dark infusion into a cup.
