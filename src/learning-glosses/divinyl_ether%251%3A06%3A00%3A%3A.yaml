simpleMeaning: People once breathed this in to fall asleep, for it is a clear liquid that turns to gas
  easily and catches fire fast
scope: Also called diethyl ether, ethyl ether, ethoxyethane, vinyl ether, or ether, people once breathed
  this clear liquid in to fall asleep, since it turns to gas easily and catches fire fast.
examples:
- The patient breathed in divinyl ether and fell asleep.
- They once used divinyl ether to put people to sleep.
