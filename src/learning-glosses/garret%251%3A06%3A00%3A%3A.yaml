simpleMeaning: an open space at the top of a house, just below the roof, often used for keeping things
scope: 'Also called attic, and another name for it is loft: an open space at the top of a house under
  the roof, not a room on a lower floor.'
examples:
- They keep old boxes in the garret.
- She slept in a small garret just under the roof.
