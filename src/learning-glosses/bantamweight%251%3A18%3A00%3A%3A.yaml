simpleMeaning: a boxer who fights for fun, not for pay, and weighs 119 pounds or less
scope: An amateur boxer who weighs no more than 119 pounds, not the weight class itself and not a heavier
  boxer such as a featherweight.
examples:
- The young bantamweight won his third amateur bout on points.
- As a bantamweight, he had to weigh in at 119 pounds or less.
