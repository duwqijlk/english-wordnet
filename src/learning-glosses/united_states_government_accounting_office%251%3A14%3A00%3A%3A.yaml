simpleMeaning: An independent fair federal body that looks into things for Congress, making the executive
  branch answerable to Congress and the government answerable to the citizens of the United States
scope: 'Also called GAO or the Government Accounting Office: it works for Congress, looking into how the
  ruling body acts and answering to the people of this country.'
examples:
- The United States Government Accounting Office looked into how the money was spent.
- Congress asked the United States Government Accounting Office to check the program.
