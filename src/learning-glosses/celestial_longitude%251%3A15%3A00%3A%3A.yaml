simpleMeaning: In astronomy, how far east an object lies from the spring equinox, measured along the sky's
  equator, usually in hours, minutes and seconds, with declination giving its north-south position.
scope: The angle that tells how far around the sky a point lies, not how far north or south it is (declination)
  and not how high above the horizon it appears.
examples:
- The catalogue lists each star's celestial longitude alongside its declination.
- The two stars share a celestial longitude but sit at very different declinations.
