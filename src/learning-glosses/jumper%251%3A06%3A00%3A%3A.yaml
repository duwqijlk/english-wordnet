simpleMeaning: A dress with no sleeves, shaped like an apron, worn over other clothes
scope: A sleeveless dress worn over other clothes, not the knitted top, not the workman's jacket, and
  not the small electric connector.
examples:
- She wore a jumper over a white blouse.
- The girl's school jumper was dark blue.
