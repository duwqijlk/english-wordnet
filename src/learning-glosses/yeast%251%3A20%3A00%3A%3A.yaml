simpleMeaning: any of many kinds of tiny living things, each made of one cell, that make more of themselves
  by growing a small new part or by splitting in two
scope: A tiny living thing made of one cell that makes more of itself by budding or splitting, not the
  stuff sold to make bread rise.
examples:
- Yeast cells grow fast in warm, sweet water.
- A single yeast can split and make two new cells.
