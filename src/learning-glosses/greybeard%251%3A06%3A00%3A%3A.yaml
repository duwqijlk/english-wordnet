simpleMeaning: a jug for drinking, made of stoneware (hard clay), with a long neck and a drawing of Cardinal
  Bellarmine that makes his face look silly, from the 17th century
scope: Also called bellarmine, long-beard and longbeard. This is the old clay drinking jug, not a grey-bearded
  old man and not a plain bottle.
examples:
- The museum keeps a greybeard from the 1600s on a shelf.
- He drank beer from a greybeard with a man's face drawn on it.
