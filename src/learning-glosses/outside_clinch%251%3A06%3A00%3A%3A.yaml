simpleMeaning: A knot in which the end of the cord lies beyond the loop
scope: A knot in which the end of the cord lies beyond the loop, not a knot with the end inside the loop
  and not a knot that joins two cords.
examples:
- He tied an outside clinch to fasten the hook.
- The outside clinch held the line fast.
