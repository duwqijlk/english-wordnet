simpleMeaning: A frog much like a bullfrog, found in or near marshes and ponds in the United States and
  Canada
scope: This frog is much like a bullfrog and lives in or near marshes and ponds, not the bullfrog itself;
  green frog, spring frog and Rana clamitans are other names for this sense.
examples:
- We heard Lithobates clamitans calling from the marsh at dusk.
- A Lithobates clamitans sat on a log near the pond.
