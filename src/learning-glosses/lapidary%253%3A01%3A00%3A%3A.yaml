simpleMeaning: To do with stones of great value or with the craft of cutting and shaping them.
scope: Of stones of great value or the craft of cutting and shaping them, not the worker who cuts and
  engraves such stones, and not the expert on those stones and the art of cutting and engraving them.
examples:
- The ring was of no lapidary value, though the stone itself was large.
- His skill was lapidary, learned from years of cutting stones.
