simpleMeaning: Knives, forks and spoons used at meals.
scope: This means the cutlery used for a meal, not the metal itself and not the cup or plate given as
  a prize.
examples:
- She laid the silver on the table before the guests arrived.
- The family keeps its best silver for holidays.
