simpleMeaning: A person who speaks or writes to defend a policy or an institution and show it to be right.
scope: For a person who speaks or writes in defence of a policy or an institution, as for capital punishment.
examples:
- An apologist for capital punishment spoke at the meeting.
- The apologist defended the new policy in print.
