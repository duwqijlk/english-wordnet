simpleMeaning: one of a group of tiny one-celled living things with a clear cup-shaped body and a stalk
  that can pull back
scope: Tiny one-celled living things with a clear cup-shaped body and a stalk that can pull back; not
  a worm and not a plant.
examples:
- A vorticella fastens itself to a leaf by its stalk.
- The vorticella pulled back its stalk when touched.
