simpleMeaning: a plant that grows in North American woods, is like Chinese ginseng, and is used in its
  place
scope: This is a plant that grows in woods in North America and is used in place of Chinese ginseng; it
  is not the Chinese plant itself, and it is not the past form of sing.
examples:
- Sang grows in cool, shady woods in North America.
- He went into the woods to dig sang to sell.
