simpleMeaning: A small sound or bit set between two parts of a word makes a new one
scope: Making a new word by adding a sound or bit in the middle; not adding a bit at the start or the
  end of a word, and not joining two whole words.
examples:
- Interfixation made the new word by placing a sound between its two parts.
- The linguist gave interfixation as the way the new word was formed.
