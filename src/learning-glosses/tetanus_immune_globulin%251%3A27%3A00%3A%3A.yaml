simpleMeaning: A clean mix of globulins from the blood water of one made safe from lockjaw, giving short-time
  safety from lockjaw where the lockjaw germ may have been met.
scope: This sense is also called tetanus immunoglobulin.
examples:
- A tetanus immune globulin gave short-time safety.
- Tetanus immune globulins come from blood water.
