simpleMeaning: a piece of meat from the upper leg of a cow, a calf, a sheep, or a lamb
scope: A piece of meat from the upper leg of a cow, a calf, a sheep, or a lamb; not the lower leg of a
  horse, and not the narrow part of a shoe.
examples:
- She bought a lamb shank for the stew.
- The butcher cut the beef shank into thick slices.
