simpleMeaning: a chemical made from ammonia by taking out some of its hydrogen and putting in groups of
  carbon and hydrogen that join at one point
scope: Also called aminoalkane; a chemical built from ammonia, not ammonia itself and not a salt.
examples:
- The amine formed when the chemist swapped hydrogen for a carbon group.
- Amines are made by changing ammonia in the lab.
