simpleMeaning: In the study of light, the state of a lens or other light tool in which rays from one point
  all meet at one point
scope: In the study of light, the state of a lens or other light tool in which rays from one point all
  meet at one point; not a fault in the lens and not short sight.
examples:
- Stigmatism means rays from one point meet at one point.
- The lens showed stigmatism in the test.
