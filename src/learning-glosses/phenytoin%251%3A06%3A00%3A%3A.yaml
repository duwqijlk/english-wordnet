scope: Also called diphenylhydantoin, this is a drug that stops fits but does not put a person to sleep,
  not a drug for short fits only and not a sleeping drug.
examples:
- The doctor gave him phenytoin to stop his fits.
- Phenytoin kept the fits away without making him sleepy.
