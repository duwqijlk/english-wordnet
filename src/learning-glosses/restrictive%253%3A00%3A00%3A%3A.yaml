simpleMeaning: putting limits on what people can do or on how much of something can happen
scope: A general word for putting limits on things; not the special sense about a tax on goods brought
  into a country to protect the makers in that country.
examples:
- The town has restrictive rules about building new houses.
- Teenagers often find a restrictive home hard to live in.
