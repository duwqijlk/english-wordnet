simpleMeaning: an illness of the nose that lasts a long time, with a foul smell in the fluid that runs
  from the nose and the nose's inner parts shrinking away
scope: A long-lasting illness of the nose with a foul-smelling discharge, also called ozaena; not a short
  cold and not an illness of the throat.
examples:
- Ozena made the fluid from his nose smell foul.
- Her ozena had gone on for years before a doctor named it.
