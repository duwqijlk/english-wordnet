simpleMeaning: the act of putting right a mistake, a fault, or something bad
scope: This is an action that puts a mistake or a wrong thing right, not a medicine that makes a sick
  person well.
examples:
- The new law was a remedy for the unfair rules.
- They found a remedy for the error in the report.
