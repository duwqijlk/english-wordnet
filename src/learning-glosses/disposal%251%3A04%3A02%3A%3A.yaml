simpleMeaning: a way of looking after and running what a group of people has to do, especially its business
scope: A way of looking after and running a group's affairs, especially its business; administration is
  another name for this sense, and it is not a kitchen machine that gets rid of rubbish.
examples:
- The disposal of the charity's affairs took up most of the meeting.
- She took charge of the disposal of the society's business.
