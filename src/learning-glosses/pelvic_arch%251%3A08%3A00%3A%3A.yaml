simpleMeaning: In animals with a backbone, this bony frame bears the lower legs in people and the back
  legs or like parts in others.
scope: A hip, a pelvis and a pelvic girdle are other names for these bones, which bear the lower legs
  in people.
examples:
- The pelvic arch bears the lower legs in people.
- In other animals with a backbone, the pelvic arch bears the back legs.
