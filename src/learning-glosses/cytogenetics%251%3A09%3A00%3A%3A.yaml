simpleMeaning: The part of biology that looks at how traits pass from parent to child inside cells, with
  a marked focus on the threads that carry traits (chromosomes).
scope: This is the part of biology that looks at heredity inside cells, not the study of heredity in whole
  animals or the study of cells in general.
examples:
- She works in cytogenetics, looking at chromosomes to find the cause of the illness.
- The cytogenetics lab checks the threads that carry traits in each cell.
