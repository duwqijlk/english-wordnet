simpleMeaning: One who cuts shapes and patterns into stones of great value, working with great skill.
scope: Also called a lapidist, a worker who cuts and engraves stones of great value, not an expert who
  only knows about such stones and their cutting, and not the adjective use for things to do with precious
  stones.
examples:
- The lapidary cut the diamond with great care.
- A lapidary engraved the ruby with a fine pattern.
