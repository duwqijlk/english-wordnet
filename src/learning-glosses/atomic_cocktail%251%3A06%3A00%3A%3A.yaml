simpleMeaning: A dose of matter that gives off rays, taken by mouth to treat or find cancer
scope: This is a dose of matter that gives off rays, taken by mouth to treat or find cancer, not a drug
  given by needle and not a beam of rays aimed from outside the body.
examples:
- The doctor gave her an atomic cocktail to treat the cancer.
- An atomic cocktail can help doctors find where the cancer has spread.
