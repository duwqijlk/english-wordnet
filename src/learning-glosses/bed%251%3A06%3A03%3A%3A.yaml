simpleMeaning: The flat surface of a printing press where the frame holding the raised type is placed
  in the final stage of printing a newspaper, magazine, or book.
scope: Not a piece of furniture for sleeping, not the ground under a river, and not a layer of ore or
  coal.
examples:
- The press operator locked the type into the form and slid it onto the bed.
- A worn bed on the old press left faint lines across every printed page.
