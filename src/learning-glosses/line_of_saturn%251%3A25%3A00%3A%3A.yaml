simpleMeaning: A crease on the palm that palm readers say shows how well you will do in life
scope: A crease on the palm, also called a line of destiny or a line of fate, not a crease on the wrist
  and not a line drawn on paper.
examples:
- The line of Saturn runs down the middle of her palm.
- He looked at the line of Saturn on his hand.
