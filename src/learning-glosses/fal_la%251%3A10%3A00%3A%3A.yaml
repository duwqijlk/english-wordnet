simpleMeaning: sounds with no sense that come back in the closing lines of a song sung in parts by several
  voices
scope: 'Also called fa la: sounds with no sense sung in the refrain of a partsong, not words that carry
  sense and not the main lines of the song.'
examples:
- They sang fal la at the end of each verse.
- The choir's fal la rang out after the last line.
