simpleMeaning: A blood disorder in which the blood holds very small red cells, often found with too few
  red cells.
scope: A blood disorder in which the blood holds very small red cells, often found with too few red cells;
  not healthy blood and not a disorder of white cells.
examples:
- Microcytosis means the blood holds very small red cells.
- The test showed microcytosis, often found with too few red cells.
