simpleMeaning: a set of keys used to put information into a computer, with the keys laid out in the same
  way as on a machine for writing
scope: Also called computer keyboard. This is the whole set of keys used to put information into a computer,
  not a single key and not the computer itself.
examples:
- He pressed the letters on the keypad to enter the data into the computer.
- The keypad sits in front of the screen, its keys laid out like a typewriter.
