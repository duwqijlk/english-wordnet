senseId: 'ransomware%1:10:01::'
synsetId: 90009981-n
simpleMeaning: A harmful program that stops a computer from being used until money is paid to the person
  who did it
scope: This is a program that blocks a computer until money is paid, not a program that merely shows ads
  and not a fault in the machine.
examples:
- Ransomware locked the whole office network until the firm paid.
- The hospital's computers were hit by ransomware and staff could not open any files.
