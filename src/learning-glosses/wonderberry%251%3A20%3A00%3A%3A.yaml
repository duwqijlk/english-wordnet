simpleMeaning: a garden plant bred from black nightshade, a wild plant, with small berries you can eat
  that are orange or black
scope: 'Also called a garden huckleberry or a sunberry: a garden plant with small edible orange or black
  berries, not the wild black nightshade itself and not an ordinary huckleberry.'
examples:
- She grew wonderberry plants along the fence for their small orange berries.
- The wonderberry bushes bore black berries that we ate fresh.
