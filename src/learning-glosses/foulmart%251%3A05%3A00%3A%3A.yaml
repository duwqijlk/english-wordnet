simpleMeaning: a dark brown animal of the weasel family living in the woods of Europe and Asia, which
  gives off a bad smell when scared
scope: This is a dark brown animal of the weasel family in the woods of Europe and Asia; polecat, fitch
  and foumart are other names for it, not a true cat or a dog.
examples:
- A foulmart slipped through the undergrowth at dusk.
- The foulmart gave off a strong smell when cornered.
