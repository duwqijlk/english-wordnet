simpleMeaning: the act of moving a thin beam of light or electrons (tiny parts of atoms) over a surface,
  step by step, to make a picture for study or sending
scope: This is making a picture by moving a beam over a surface, not turning photos into a form a computer
  can use.
examples:
- The scanning of the metal plate took a few minutes.
- They used scanning with a thin beam of light to make a picture of the surface.
