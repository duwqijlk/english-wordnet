simpleMeaning: a fish of the Black Sea and the Caspian Sea, prized as a source of caviar, its eggs, and
  of isinglass, a clear jelly made from its swim bladder
scope: 'Also called a beluga and a hausen: a fish of the Black and Caspian seas prized as a source of
  caviar and isinglass, not a small river fish and not a shark.'
examples:
- The white sturgeon caught in the Caspian Sea was sold for its caviar.
- White sturgeon from the Black Sea have long been prized by fishermen.
