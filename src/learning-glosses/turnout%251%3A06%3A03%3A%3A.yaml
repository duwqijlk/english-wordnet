simpleMeaning: a short piece of railway track where trains can be kept or pass each other on the same
  line
scope: A short piece of railway track where trains can be kept or pass each other on the same line, also
  called a siding; not a dancer's leg position.
examples:
- The freight train pulled onto the turnout to let the express pass.
- A rusty turnout branched off the main line near the yard.
