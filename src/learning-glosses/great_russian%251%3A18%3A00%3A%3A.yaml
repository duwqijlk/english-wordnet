simpleMeaning: One of the main native people of Russia living in European Russia, a word used to set the
  native people of Russia apart from other peoples brought into Russia
scope: One of the main native people of European Russia, not a person of a people brought into Russia.
examples:
- The Great Russian lived in European Russia.
- A Great Russian was one of the main native people of European Russia.
