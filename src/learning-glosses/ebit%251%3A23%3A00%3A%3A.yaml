synsetId: 13652655-n
simpleMeaning: A measure of data as big as one thousand petabits, which is a one followed by eighteen
  zeros of the smallest bits.
scope: A very large measure of data; exabit and Eb are other names for this sense, not a small measure
  like a bit.
examples:
- The machine could store one Ebit of data.
- One Ebit is far more data than a home computer can hold.
