schema: oewn-learning-gloss-v2
senseId: 'ampholyte%1:27:01::'
synsetId: 92464616-n
simpleMeaning: Something that can act as an acid or as the opposite of an acid, as the liquid it is put
  in is more or less acid.
scope: 'Also called amphoteric electrolyte: a substance that can act as an acid or as the opposite of
  an acid, as the liquid it is put in is more or less acid, not a substance that is always an acid and
  not a substance that is always a base.'
examples:
- The ampholyte acted as a base in the sour liquid.
- In a bitter liquid the ampholyte acted as an acid.
