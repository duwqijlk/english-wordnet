simpleMeaning: Something that can act as an acid or as the opposite of an acid, as the liquid it is put
  in is more or less acid.
scope: 'Also called amphoteric electrolyte: a stuff that can act as an acid or as the opposite of an acid,
  as the liquid it is put in is more or less acid, not a stuff that is always an acid and not a stuff
  that is always a base.'
examples:
- The ampholyte acted as a base in the sour liquid.
- In a bitter liquid the ampholyte acted as an acid.
