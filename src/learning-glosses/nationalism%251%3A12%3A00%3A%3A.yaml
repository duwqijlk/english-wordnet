senseId: 'nationalism%1:12:00::'
synsetId: 07500187-n
simpleMeaning: the strong wish of people ruled by another country to be free and to rule their own country
scope: This is the wish for freedom felt by people ruled by another country. It is not the idea that each
  country should act alone, and not the idea that your own country and its way of life are better than
  all others.
examples:
- Nationalism grew strong as people demanded freedom from foreign rule.
- Their nationalism led them to fight for an independent country of their own.
