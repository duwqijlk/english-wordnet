simpleMeaning: to ask for something in writing, in a formal way, by sending your request to someone
scope: To ask for something in writing in a formal way, not the written request itself and not a prayer
  to a god.
examples:
- The workers petitioned the manager for safer hours.
- She petitioned the court in writing to change the ruling.
