senseId: 'deviation%1:04:00::'
synsetId: 00738697-n
simpleMeaning: a way of acting that is different from what is usual or accepted
scope: This is acting in a way that is different from what is usual or accepted; deviance is another name
  for this sense. Not an error in a compass and not a difference from the usual standard or norm.
examples:
- The school treated stealing and lying as deviation that needed help and care.
- In that town, deviation in dress or speech could draw angry looks from neighbours.
