simpleMeaning: In music, having notes or parts that sound wrong together and have not settled into a pleasant,
  finished sound
scope: 'Also called dissonant: this is about music whose notes sound wrong together and feel unfinished,
  not about a question or problem that has not been answered or settled.'
examples:
- The song ended on an unresolved chord that sounded tense.
- The unresolved notes left the music feeling unfinished.
