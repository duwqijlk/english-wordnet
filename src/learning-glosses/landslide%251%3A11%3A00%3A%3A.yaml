simpleMeaning: a large amount of dirt and rock that slides down a mountain or cliff
scope: This is dirt and rock moving down a mountain or cliff, not a big win in an election and not a small
  fall of a few stones.
examples:
- A landslide blocked the road after the heavy rain.
- The landslide buried part of the village at the foot of the cliff.
