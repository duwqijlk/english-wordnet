simpleMeaning: the money a ship's owner pays for the ship to use a landing place
scope: Money paid for a ship to use a landing place, also called dockage, and not the act of tying up
  a ship or the landing of a ship in a harbour.
examples:
- The docking fee rose when the port was rebuilt.
- The captain paid the docking fee at the harbour office.
