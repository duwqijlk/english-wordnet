schema: oewn-learning-gloss-v2
senseId: 'hodgepodge%1:09:00::'
synsetId: 05962283-n
simpleMeaning: a theory or argument made of many different ideas that do not fit well together
scope: Also called jumble and patchwork, this is a theory or argument made of ideas that do not fit together,
  not a mix of different things put together in one place and not a well-ordered set of ideas that all
  agree.
examples:
- His theory was a hodgepodge of ideas that did not fit together.
- The argument in her paper is a hodgepodge, with one claim saying the opposite of another.
