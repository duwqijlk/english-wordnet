simpleMeaning: A group of Roman Catholics begun by Saint Ignatius of Loyola in 1534 to guard the faith
  against the Reformation and to work among non-believers, strong on learning and study.
scope: 'Also called Society of Jesus: a group of Roman Catholics begun in 1534, not a group of monks and
  not a church council.'
examples:
- The Jesuit order runs many schools.
- He joined the Jesuit order to teach in its schools.
