simpleMeaning: Grown for its scented rose-pink flowers, this plant of the mountains of Iran and Iraq lives
  for many years.
scope: This is the plant of the mountains of Iran and Iraq grown for its rose-pink flowers, not the Asian
  plant grown far and wide for pink flowers and not the yearly plant of the Mediterranean with yellow
  flowers.
examples:
- The sweet sultan's rose-pink flowers smelled sweet.
- Sweet sultan grows in the mountains of Iran and Iraq.
