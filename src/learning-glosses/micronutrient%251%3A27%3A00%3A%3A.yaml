simpleMeaning: a thing the body needs, only in very small amounts, to work in a normal way, such as a
  vitamin or a mineral
scope: This is a thing the body needs in tiny amounts, such as a vitamin or a mineral, not a main food
  that the body needs in large amounts.
examples:
- Iron is a micronutrient that the body needs in small amounts.
- She takes a tablet to get enough of each micronutrient each day.
