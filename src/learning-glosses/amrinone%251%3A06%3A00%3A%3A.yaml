simpleMeaning: A drug sold as Inocor, given straight into a vein when the heart is failing, that makes
  the heart muscle beat more strongly.
scope: A drug sold as Inocor, given straight into a vein when the heart is failing, that makes the heart
  muscle beat more strongly, not a pill taken by mouth and not a drug that slows the heart.
examples:
- The nurse gave amrinone into a vein.
- Amrinone helped the failing heart beat more strongly.
