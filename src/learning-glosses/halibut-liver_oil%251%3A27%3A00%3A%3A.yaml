simpleMeaning: Taken as a source of vitamin A, this is a fat from the organ that cleans the blood in a
  large flat sea fish
scope: A fat from a large flat sea fish, taken as a source of vitamin A, not cooking fat and not a medicine
  made from plants.
examples:
- The doctor told her to take a spoonful of halibut-liver oil each day.
- Halibut-liver oil was once given to children for vitamin A.
