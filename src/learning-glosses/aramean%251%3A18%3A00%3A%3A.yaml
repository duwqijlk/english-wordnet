simpleMeaning: A person from one of the Semitic peoples who lived in Aram and parts of Mesopotamia from
  the 11th to the 8th century BC
scope: This is a member of a Semitic people of ancient Aram, not the adjective sense meaning of or relating
  to Aram; Aramaean is another name for this sense.
examples:
- An Aramean lived in Aram in the 9th century BC.
- The Aramean came from a Semitic people of ancient Mesopotamia.
