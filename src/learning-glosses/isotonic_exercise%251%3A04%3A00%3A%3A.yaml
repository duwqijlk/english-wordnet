simpleMeaning: The pull stays the same in this kind of body work, while the muscles on both sides tighten,
  change length, and move in a steady way.
scope: It is the kind of body work in which the pull stays the same while the muscles tighten and move,
  not work in which the muscles pull without moving.
examples:
- Lifting free weights is a classic isotonic exercise, since the muscles move while the pull stays steady.
- In isotonic exercise the muscles pull and move at the same time.
