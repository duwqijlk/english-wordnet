simpleMeaning: A pain-killing pill treated so it goes through the stomach whole and melts in the gut.
scope: A pain-killing pill treated to pass through the stomach whole and melt in the gut, not a pill that
  melts in the stomach and not a pill taken for the stomach itself.
examples:
- She took enteric-coated aspirin so it would not upset her stomach.
- Enteric-coated aspirin melts in the gut, not in the stomach.
