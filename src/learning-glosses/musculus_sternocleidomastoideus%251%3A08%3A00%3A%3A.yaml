simpleMeaning: A paired thick muscle from breastbone and collarbone to the skull behind the ear; it turns
  the head to the other side; together they bend neck and tilt head back.
scope: The paired neck muscle that turns and tilts the head, also called the sternocleidomastoid; not
  the trapezius at the back of the neck.
examples:
- A tightened musculus sternocleidomastoideus turns the head to the other side.
- The musculus sternocleidomastoideus runs from the breastbone and collarbone to the skull.
