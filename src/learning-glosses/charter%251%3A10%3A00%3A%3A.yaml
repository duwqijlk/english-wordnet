simpleMeaning: a paper that sets up a company or group as a legal body and says its rights; it includes
  its articles of incorporation and certificate of incorporation
scope: This is the paper that sets up a body and gives it rights, not a contract to hire transport and
  not the acts of hiring or of giving such a paper.
examples:
- The town's charter was signed in 1700.
- The university still works under its first charter.
