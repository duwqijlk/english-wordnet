simpleMeaning: The part of engineering that uses computers and phone systems to get, keep, and send news
  and facts
scope: The part of engineering that uses computers and phone systems to get, keep, and send news and facts;
  information technology is another name for this sense, and it is not the building of computers nor the
  use of phones to talk.
examples:
- She works in IT, keeping the school computers running.
- IT helps firms store and send their records.
