simpleMeaning: A tiny bit of matter, not a protein but at times a vitamin, that some enzymes need in order
  to work.
scope: This is a tiny bit of matter, not a protein but at times a vitamin, that some enzymes need in order
  to work; not an enzyme itself and not a vitamin on its own.
examples:
- The coenzyme helps the enzyme do its work.
- Without its coenzyme, the enzyme stays still.
