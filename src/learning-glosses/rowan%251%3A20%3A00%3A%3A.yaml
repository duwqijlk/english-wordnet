simpleMeaning: a tree that grows in Europe and Asia and has small round fruits that are orange-red and
  look like berries
scope: This is the tree with orange-red fruits that look like berries, not the fruit on its own and not
  another tree with red fruit.
examples:
- A rowan grew by the gate, full of orange-red fruits that look like berries.
- Rowans are planted in many northern gardens for their bright fruit.
