senseId: 'ultramicroscope%1:06:00::'
synsetId: 04513983-n
simpleMeaning: A light tool that shows bits too small for plain tools, by using light that bounces off
  them
scope: A light tool that shows tiny bits, also called a dark-field microscope, not a plain light tool
  and not a tool that uses electrons to see tiny bits.
examples:
- The lab used an ultramicroscope to see the tiny bits in the water.
- With the ultramicroscope, she could see bits too small for her plain microscope.
