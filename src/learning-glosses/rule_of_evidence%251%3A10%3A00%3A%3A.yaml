simpleMeaning: In law, a way for a court to decide if a claim put before a trial is shown true or shown
  false
scope: In law, a court test for whether a claim in a trial is true or false, not a law about how to run
  a trial and not the final decision.
examples:
- The judge explained the rule of evidence before the witness spoke.
- Under the rule of evidence, the claim had to be proved in court.
