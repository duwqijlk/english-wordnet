simpleMeaning: Grown to look at, a South American tree with golden yellow flowers that keeps some leaves
  all year, its leaves in pairs along a stem with one at the tip.
scope: Also called a tipu and a yellow jacaranda, this South American tree keeps some leaves all year
  and is grown to look at.
examples:
- The tipu tree in the park was full of golden flowers.
- They planted a tipu tree by the gate.
