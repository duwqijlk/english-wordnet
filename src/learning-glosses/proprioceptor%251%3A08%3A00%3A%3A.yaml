simpleMeaning: The brain knows where the body is and how it moves from special ends of thin cords in muscles,
  cords that join muscle to bone, and other body parts.
scope: These are the special nerve ends in muscles, tendons, and other organs, the ones that report where
  the body is and how it moves.
examples:
- A proprioceptor in the ankle told the brain that the foot had turned.
- In the neck, proprioceptors told the brain where the head was.
