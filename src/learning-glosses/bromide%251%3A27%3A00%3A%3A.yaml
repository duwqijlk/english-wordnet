simpleMeaning: any of the salts of hydrobromic acid (a strong acid), used in the past to calm people and
  help them sleep, but now mostly replaced by safer drugs
scope: This is the chemical sense, a salt once used as medicine to calm people; it is not a dull, obvious
  remark.
examples:
- The doctor gave her a bromide to help her sleep.
- Bromides were once common medicines, but doctors now use safer drugs.
