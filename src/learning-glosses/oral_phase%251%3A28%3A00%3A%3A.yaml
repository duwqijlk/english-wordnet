simpleMeaning: In the study of the mind, the time when a baby finds most joy through its mouth, by sucking,
  chewing and biting, in its first growth of body and ties.
scope: It is also called oral stage, and it is the first stage of a baby's growth, when the mouth gives
  most joy.
examples:
- In the oral phase, the baby finds comfort in sucking.
- During the oral phase, the baby chews on everything it can hold.
