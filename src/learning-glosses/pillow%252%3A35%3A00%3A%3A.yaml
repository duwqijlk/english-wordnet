simpleMeaning: to rest your head on a soft support, or to rest as if on one
scope: This is the verb for resting your head on a soft support, not the soft thing itself that you rest
  on.
examples:
- She pillowed her head on a folded coat.
- He pillowed his cheek on his arms.
