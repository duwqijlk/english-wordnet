simpleMeaning: Of music in which notes and chords are set out round one main note, such as a keynote or
  tonic.
scope: Of music in which notes and chords are set out round one main note, not of words whose pitch changes
  their meaning.
examples:
- The piece was tonal, built round one home note.
- Her early songs were tonal, with clear keynotes.
