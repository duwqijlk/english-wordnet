simpleMeaning: An angled snout lets this sea animal dig into the soft, loose floor of the western Pacific
  and Indian oceans.
scope: Also called beaked salmon, it is a sea animal of the western Pacific and Indian oceans, not the
  small northern Pacific kind that also burrows into sand.
examples:
- The sandfish buried itself in the sand with its angled snout.
- We watched a sandfish dig into the sand.
