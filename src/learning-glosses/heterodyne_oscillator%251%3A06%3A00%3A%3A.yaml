simpleMeaning: Two new notes, one higher and one lower, come out when the waves this part makes mix with
  waves coming in on the radio.
scope: Also called a local oscillator, this part makes waves that mix with incoming radio waves to give
  two new notes.
examples:
- The heterodyne oscillator mixed its waves with the incoming signal.
- A heterodyne oscillator gives the sum and difference tones from the radio signal.
