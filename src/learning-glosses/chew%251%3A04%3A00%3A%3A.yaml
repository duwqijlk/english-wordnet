simpleMeaning: the act of biting food in your mouth with your teeth to break it down so it gets soft enough
  to swallow
scope: The act of biting and breaking down food in the mouth, not doing that act and not a lump of tobacco
  kept in the mouth.
examples:
- He took a long chew before he swallowed the meat.
- After a few chews, she swallowed the bread.
