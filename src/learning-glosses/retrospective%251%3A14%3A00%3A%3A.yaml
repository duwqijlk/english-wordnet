simpleMeaning: a show of a chosen set of an artist's works, picked to stand for the work of their whole
  life
scope: A show of one artist's works from their whole working life; not a look back at past events in general,
  and not a show of new work by many artists.
examples:
- The museum held a retrospective of her paintings from sixty years of work.
- His retrospective drew crowds who wanted to see both his early and his late work.
