simpleMeaning: a storm in which very strong winds are pulled into a tall column of hot air rising over
  an area hit very badly by bombs
scope: This is a real wind storm over a bombed area, not a large fire on its own and not a strong angry
  public reaction to something.
examples:
- After the bombing, a firestorm rose over the city and pulled in air from all sides.
- The firestorm's strong winds made the fires spread even faster.
