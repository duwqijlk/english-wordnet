simpleMeaning: a piece of music written in a new way for a large group of musicians or a band to play
scope: The finished piece of music written for musicians to play, not the act of writing it that way and
  not a plan of events made for the strongest effect.
examples:
- Her orchestration of the piano piece works well for a full band.
- The orchestration uses soft strings at the start and loud drums at the end.
