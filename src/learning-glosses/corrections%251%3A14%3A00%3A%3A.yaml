simpleMeaning: the part of local government in charge of managing how people who have been found guilty
  of a crime are treated
scope: This is the local government office itself, not the whole way of holding and trying to change people
  who have been found guilty of a crime.
examples:
- For a job in corrections, look at the web page of the New Jersey Department of Corrections.
- Corrections sent a letter to say when the man would leave prison.
