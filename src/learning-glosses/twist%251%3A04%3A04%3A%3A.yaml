simpleMeaning: The action of turning something around and around to wind it up.
scope: This is the action of turning something round to wind it, not a hairstyle, a curve in a road, or
  the 1960s dance; winding is another name.
examples:
- One good twist of the key started the old clock.
- He gave the handle a quick twist to open the valve.
