simpleMeaning: one of many large two-legged bird-hipped dinosaurs with a horny bill shaped like a duck's
  and webbed feet, that may have lived partly in water
scope: Also called hadrosaur and hadrosaurus, this is a large two-legged dinosaur with a bill shaped like
  a duck's and webbed feet, not a small dinosaur.
examples:
- The duck-billed dinosaur waded through the shallow river.
- A duck-billed dinosaur skeleton stood in the museum hall.
