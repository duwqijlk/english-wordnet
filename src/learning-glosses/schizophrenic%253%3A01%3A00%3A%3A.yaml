simpleMeaning: Of schizophrenia, connected with it, or typical of it; this is a serious illness of the
  mind where a person cannot always tell what is real
scope: 'Also called schizoid: connected with schizophrenia, or typical of it. Not the noun for a person
  who has this illness, and not the sense that describes a person suffering from it.'
examples:
- The doctor studied schizophrenic symptoms in the patient.
- She wrote a book about schizophrenic illness and how to treat it.
