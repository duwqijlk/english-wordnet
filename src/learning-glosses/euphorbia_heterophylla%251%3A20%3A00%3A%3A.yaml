simpleMeaning: From the south of the United States to Peru grows a bright poinsettia.
scope: Also called mole plant, paint leaf, and Japanese poinsettia, it is a bright poinsettia found from
  the south of the United States to Peru, not the poinsettia of Christmas.
examples:
- Euphorbia heterophylla grows in the south of the United States.
- The bright leaves of Euphorbia heterophylla stood out in the field.
