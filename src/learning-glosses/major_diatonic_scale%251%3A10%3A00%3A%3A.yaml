simpleMeaning: a run of notes, most a whole tone apart, with smaller steps only from the 3rd to the 4th
  and from the 7th to the 8th
scope: Also called major scale, this run of notes is most a whole tone apart, unlike a run with half-tone
  steps all through.
examples:
- He played the major diatonic scale slowly, listening to each step.
- She sang the major diatonic scale up and down.
