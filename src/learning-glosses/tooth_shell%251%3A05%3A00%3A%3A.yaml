simpleMeaning: With a foot shaped like a spade for digging and a long narrowing tube open at both ends,
  this soft animal of the seashore is one of many kinds.
scope: People also call it tusk shell, a soft animal of the seashore with a long narrowing shell open
  at both ends and a foot shaped like a spade for digging.
examples:
- Tooth shells live at the seashore.
- The tooth shell digs with its spade-shaped foot.
