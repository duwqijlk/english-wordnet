simpleMeaning: the agreed rules for one group, with ways of acting that all who belong to it must keep
  to
scope: These are agreed rules and ways of acting that all who belong to one group must follow; code of
  behavior is another name for this sense, and they are not a law of the land or one person's own rules.
examples:
- Every nurse signed the code of conduct for the hospital.
- The code of conduct told staff how to treat patients with respect.
