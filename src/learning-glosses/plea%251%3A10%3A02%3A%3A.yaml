simpleMeaning: In law, an answer based on facts by the defendant (the person a case is brought against),
  not a claim that the case is weak in law
scope: In law, this is a fact-based answer in court, not a strong request for help and not the short answer
  of guilty or not guilty to a charge.
examples:
- The lawyer put in a plea that set out the facts of that night.
- His plea said that he was not at the place when the crime took place.
