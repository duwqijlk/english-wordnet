simpleMeaning: In the throats of fish and of animals that live in water and on land, water flows through
  one of a row of narrow openings.
scope: Also called a branchial cleft or a gill slit, this opening in the throat lets water flow through
  it.
examples:
- Water passed through the gill clefts of the fish.
- The gill cleft let water flow through the throat.
