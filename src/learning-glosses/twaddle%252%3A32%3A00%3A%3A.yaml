schema: oewn-learning-gloss-v2
senseId: 'twaddle%2:32:00::'
synsetId: 01038676-v
simpleMeaning: To talk without stopping, quickly, about things of no importance.
scope: 'Also called chatter, and other names for this are clack, prattle, gibber, gabble, blabber, blab,
  tattle, piffle, prate, palaver, and maunder: fast talk about things that do not matter, going on without
  a stop.'
examples:
- He twaddled on about the weather for an hour.
- Stop twaddling and tell us what happened.
