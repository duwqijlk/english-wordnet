simpleMeaning: leaves cover roofs and go into weaving, hard wood, and sweet sap gives palm wine and sugar;
  a tall tree with fan leaves of Africa, India, and Malaysia
scope: Also called longar palm, lontar, palmyra, palmyra palm, and wine palm; a tall fan-leaved tree,
  not the fishtail palm whose sap gives brown sugar.
examples:
- The toddy palm shaded the village square.
- Workers tapped the toddy palm for its sweet sap.
