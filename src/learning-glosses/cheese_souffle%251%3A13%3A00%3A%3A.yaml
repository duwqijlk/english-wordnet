simpleMeaning: Eggs and milk curd, with the whites beaten on their own, make this light, puffed-up dish
  with a pale sauce.
scope: A light, puffed-up dish of milk curd and eggs with a pale sauce, not an egg dish made of eggs alone.
examples:
- The cheese souffle rose high and stayed light.
- They shared a cheese souffle made with eggs and a pale sauce.
