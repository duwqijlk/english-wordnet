simpleMeaning: One ten-billionth of one metre, or 0.0001 micron, used to give the length of light waves
  and other waves
scope: One ten-billionth of one metre, or 0.0001 micron, used to give the length of light waves and other
  waves; angstrom and angstrom unit are other names for this sense, and it is not the vitamin, the DNA
  unit, the letter, or the unit of electric current also called A.
examples:
- The wavelength of the light was 5000 A.
- A is a tiny unit used for the length of light waves.
