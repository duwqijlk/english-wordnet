simpleMeaning: A small bushy tree that loses leaves, from Asia and North Africa, with pink flowers and
  nuts to eat inside hard green shells, grown in southern Australia and California.
scope: Also called almond, sweet almond, Prunus amygdalus, and Prunus dulcis; a small tree with pink flowers
  and nuts you can eat, not a tall forest tree and not a nut bush.
examples:
- Amygdalus communis grows in the warm hills of the south.
- The nuts of Amygdalus communis ripen in late summer.
