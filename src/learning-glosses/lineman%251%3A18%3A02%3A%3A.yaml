simpleMeaning: Spots on the land are marked out by this man, who measures the land with a long pole
scope: A man who measures land, not one who puts up or mends power or phone wires.
examples:
- The lineman set up his pole to mark the corner of the field.
- Our lineman walked the ground and marked each new lot.
