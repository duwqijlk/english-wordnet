simpleMeaning: A sore hurt in the skin made when a small bug pushes its sharp point into you.
scope: A sore hurt in the skin made by a small bug's sharp point, not a cut from a sharp edge and not
  a hurt from a thorn; bite and sting are other names for this sense.
examples:
- The insect bite on her arm itched all day.
- He scratched the insect bite until it bled.
