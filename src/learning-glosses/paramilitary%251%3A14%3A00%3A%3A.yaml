simpleMeaning: a band of ordinary people set up and run like soldiers, above all to stand in for regular
  troops or to help them
scope: A group of civilians run like soldiers, not the adjective for things of such a group, and not regular
  army troops themselves.
examples:
- The paramilitary patrolled the border in place of the army.
- A paramilitary force guarded the road into the town.
