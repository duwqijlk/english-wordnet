simpleMeaning: a soft, loosely twisted thread used for sewing designs on cloth
scope: This is a soft thread for sewing designs on cloth, not the thin thread used to clean between the
  teeth and not the act of cleaning teeth that way.
examples:
- She chose red floss for the flowers she sewed on the cloth.
- The floss felt soft as she sewed the design.
