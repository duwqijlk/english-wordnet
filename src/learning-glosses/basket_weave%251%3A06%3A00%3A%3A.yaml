simpleMeaning: A cloth takes the open pattern of a hand-woven holder when two or more of its threads cross
  over and under in pairs.
scope: This cloth gets its open pattern from threads crossed over and under in pairs, like the crossed
  threads of a hand-woven holder.
examples:
- The basket weave cloth had an open pattern of crossed threads.
- The basket weave showed threads crossing over and under in pairs.
