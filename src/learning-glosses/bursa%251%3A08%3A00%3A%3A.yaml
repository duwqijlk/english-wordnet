simpleMeaning: a small bag of liquid that sits between parts of the body that move, most of all at joints
scope: A small bag of liquid between moving body parts, most of all at joints, not a bag of liquid elsewhere
  in the body and not a bone.
examples:
- The bursa in her knee was swollen and sore.
- A bursa lets the tendon slide smoothly over the bone.
