simpleMeaning: A small tree of the West Indies and Florida with large odd-pinnate leaves and sprays of
  red-striped purple to white flowers and curly winged seed pods; it gives fish poisons.
scope: 'Also called fish fuddle, Piscidia erythrina, or Piscidia piscipula: a small tree of the West Indies
  and Florida, not a dogwood tree and not a cherry tree.'
examples:
- The Jamaica dogwood blooms purple and white in spring.
- Fishers crush Jamaica dogwood bark to stun fish.
