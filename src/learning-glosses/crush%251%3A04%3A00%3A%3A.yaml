simpleMeaning: the act of pressing or breaking something with great force
scope: The act itself of pressing or breaking something with force, not the verb for hurting a toe or
  finger by pressing it, and not leather with a pattern on its surface.
examples:
- The crush of the machine turned the cans into flat pieces.
- One hard crush was enough to break the shell.
