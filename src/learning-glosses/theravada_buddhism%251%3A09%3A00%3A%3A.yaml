simpleMeaning: One of two schools of Buddhist teaching, stressing salvation by one's efforts, keeping
  to Pali texts and self-purification to nirvana; main faith of Sri Lanka, Myanmar, Thailand, Laos and
  Cambodia.
scope: Also called Theravada; one of the two great schools of Buddhist teaching, not the other great school
  and not a Hindu teaching.
examples:
- Theravada Buddhism is the main faith of Sri Lanka.
- Theravada Buddhism stresses salvation through one's own efforts.
