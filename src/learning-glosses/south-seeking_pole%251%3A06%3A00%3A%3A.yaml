simpleMeaning: the end of a magnet that points toward the letter S on a compass when the magnet hangs
  free
scope: The end of a magnet that points toward the letter S on a compass, also called negative magnetic
  pole and negative pole; not the end that points the other way and not a piece of the earth itself.
examples:
- The south-seeking pole of the bar magnet swung until it faced the lower half of the compass.
- When the magnet hangs free, its south-seeking pole points toward the bottom of the map.
