simpleMeaning: to tell a person a thing is true, so they feel sure about it
scope: To tell a person a thing is true, so they feel sure about it, not to tell them a thing with no
  doubt in a firm and sure way.
examples:
- I assured him that the trip was safe.
- She assured the child that the dog would not bite.
