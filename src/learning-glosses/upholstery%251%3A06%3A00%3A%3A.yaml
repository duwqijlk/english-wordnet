simpleMeaning: the covering on a piece of furniture, made of soft filling, springs, webbing (strong strips
  of cloth) and outer cloth
scope: This is the covering itself on chairs and sofas, not the work or skill of putting such a covering
  on.
examples:
- The chair's upholstery was torn and old.
- She chose red cloth for the sofa's upholstery.
