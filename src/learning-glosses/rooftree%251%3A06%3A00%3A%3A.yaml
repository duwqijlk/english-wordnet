simpleMeaning: a beam laid along the top edge where the two sloping sides of a roof meet, giving the upper
  ends of the rafters something to fasten to
scope: A beam laid along the top edge where the two sloping sides of a roof meet; ridge and ridgepole
  are other names for it, not a rafter and not a beam that holds up a floor.
examples:
- The rooftree ran along the top of the roof.
- Carpenters fixed the rafters to the rooftree.
