simpleMeaning: a garden plant that lives one year or many years, with soft juicy leaves that people eat
  in salads, grown in many places
scope: This is the garden plant whose leaves go in salads; garden lettuce is another name for this sense,
  and it is not a wild plant grown for seed.
examples:
- She picked common lettuce from the garden for the salad.
- Common lettuce grows well in the cool spring soil.
