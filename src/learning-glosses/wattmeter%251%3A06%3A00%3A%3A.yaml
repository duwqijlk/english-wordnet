simpleMeaning: an instrument that measures the flow of power in an electric circuit
scope: A meter for the power in a circuit, not a clock for time and not a gauge for pressure.
examples:
- The wattmeter showed how much power the heater was using.
- He clipped the wattmeter onto the circuit to check the load.
