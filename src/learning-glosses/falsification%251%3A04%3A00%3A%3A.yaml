senseId: 'falsification%1:04:00::'
synsetId: 00752233-n
simpleMeaning: the act of making something not true, by changing papers, numbers or other things in a
  cheating way, or by making fake copies
scope: Also called falsehood. It is the act of making something not true, not a piece of proof that shows
  something is not true.
examples:
- He was charged with the falsification of company records.
- The falsification of the figures hid the real loss.
