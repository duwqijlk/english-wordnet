simpleMeaning: one of two small round parts on the underside of the brain, where the front curves of the
  fornix, a curved band in the brain, end
scope: One of two small round parts on the underside of the brain, where the front curves of the fornix
  end; mamillary body and mammillary body are other names for this sense, not any other part of the brain,
  and not a nerve.
examples:
- The corpus mamillare sits on the underside of the brain.
- Each corpus mamillare marks the end of a curve of the fornix.
