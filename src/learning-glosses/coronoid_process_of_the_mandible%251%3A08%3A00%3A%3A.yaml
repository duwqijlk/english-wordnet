simpleMeaning: the sharp bony point on the lower jaw where the muscle that shuts the jaw is fixed
scope: The sharp bony point on the lower jaw where the muscle that shuts the jaw is fixed, not the same
  point on other bones and not the jaw joint.
examples:
- The coronoid process of the mandible gives the jaw muscle a place to hold on.
- Surgeons checked the coronoid process of the mandible before the operation.
