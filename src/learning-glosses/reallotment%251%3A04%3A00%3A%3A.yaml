simpleMeaning: A fresh sharing out of seats or shares, most of all a fresh sharing out of seats in the
  United States Congress after a count of the people
scope: 'Also called reallocation and reapportionment: a fresh sharing out, most of all of seats in Congress
  after a census, not the first sharing out and not a change in the law itself.'
examples:
- The reallotment after the census gave the state one more seat.
- A reallotment of seats follows each count of the people.
