simpleMeaning: A loss of control over the movements of the body, with sudden jerks the person cannot stop,
  caused by lasting harm to the brain from birth.
scope: A loss of body movement control with jerks from lasting brain harm at birth, not a fit that passes
  and not a weakness from an accident later in life.
examples:
- Cerebral palsy affects the way she walks and holds things.
- The boy with cerebral palsy uses a frame to help him move.
