simpleMeaning: A part of the law-making arm of the state that prints and binds papers for Congress and
  for the parts and bodies of the state at the national level.
scope: Also called GPO, United States Government Printing Office or US Government Printing Office; a part
  of the law-making arm of the state that prints and binds papers for Congress and for the parts and bodies
  of the state at the national level.
examples:
- The Government Printing Office printed the report for Congress.
- The Government Printing Office binds papers for the departments.
