senseId: 'bridge_agent%1:18:00::'
synsetId: 09894491-n
simpleMeaning: a person who carries messages between a person in charge and a person who works in secret
  in a place held by the enemy
scope: A person who passes messages between two others, not a secret agent and not an ordinary courier
  who carries goods.
examples:
- The bridge agent met the contact in the market to pass on the new orders.
- She worked as a bridge agent, carrying sealed notes from the officer to the man in hiding.
