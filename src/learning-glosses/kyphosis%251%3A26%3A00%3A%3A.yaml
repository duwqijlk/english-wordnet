simpleMeaning: An unnatural bend backwards in the bones of the back.
scope: An unnatural bend backwards in the bones of the back; humpback and hunchback are other names for
  this sense, not a sideways bend of the spine and not a normal curve of the back.
examples:
- Kyphosis gave the old man a rounded back.
- The doctor said her kyphosis made her back bend backwards.
