simpleMeaning: A tree that grows like a thick bush, with soft silky leaves and long pointed groups of
  yellow tube-shaped flowers full of sweet liquid
scope: 'Also called coast banksia: this is the tree with silky leaves and yellow flowers, not the climbing
  plant with the same name and not the red-flowered columbine plant.'
examples:
- The honeysuckle by the coast had long groups of yellow flowers in spring.
- We planted a honeysuckle tree, and its silky leaves grew fast in the sun.
