simpleMeaning: A night animal like a badger, living in woods in Africa and the south of Asia, that eats
  meat
scope: Also called a honey badger and a ratel; a night meat-eater of wooded land, not a day animal and
  not a plant-eating badger.
examples:
- The Mellivora capensis came out after dark to hunt.
- We saw a Mellivora capensis moving through the wooded land at night.
