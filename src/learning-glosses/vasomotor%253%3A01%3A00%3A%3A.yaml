simpleMeaning: To do with the nerves and muscles that make blood tubes narrower or wider.
scope: To do with the nerves and muscles that control the width of blood tubes; not to do with the heart
  beat itself and not with blood pressure alone.
examples:
- Vasomotor nerves make the blood tubes narrower when the body is cold.
- The doctor explained the vasomotor control of blood flow to the class.
