simpleMeaning: One side of the heart is fed by this blood tube, which starts at the base of the main blood
  tube from the heart
scope: A blood tube that starts at the base of the main blood tube from the heart and feeds one side of
  it, not the tube that feeds the other side.
examples:
- The left coronary artery supplies blood to the left side of the heart.
- A blockage in the left coronary artery can cause a heart attack.
