simpleMeaning: the links that join the parts of a tale or a line of thought so it holds together
scope: The links that join the parts of a tale or a line of thought, not a fine cord used to sew and not
  a long thin thing that looks like a line.
examples:
- He lost the thread of his talk and had to stop.
- I could not follow the thread of her story.
