simpleMeaning: A head that is much too large, but without raised pressure inside the skull and with growth
  that is even on both sides, unlike water on the brain.
scope: A head that is much too large, with even growth and no raised pressure inside the skull, also called
  megacephaly or megalocephaly, not water on the brain.
examples:
- The baby was found to have macrocephaly at her check-up.
- Macrocephaly can be seen when the head grows far faster than the body.
