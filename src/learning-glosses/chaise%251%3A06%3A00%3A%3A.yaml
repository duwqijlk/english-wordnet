simpleMeaning: A vehicle with two wheels and a folding top, pulled by one horse
scope: A horse-pulled vehicle with two wheels and a folding top; not a car, and not a plain cart with
  no top.
examples:
- They rode to town in a chaise pulled by one horse.
- The chaise had two big wheels and a top that folded down.
