senseId: 'subvert%2:41:03::'
synsetId: 02585532-v
simpleMeaning: To make a person act or think in bad ways, or lead them to drink without control or to
  give in too much to pleasures of the body
scope: 'Also called corrupt, pervert, profane, demoralize, debase, misdirect, deprave, debauch, demoralise
  and vitiate: this means leading a person into bad ways, not bringing down a government or a system.'
examples:
- Wine and wild parties subverted the young men in the town.
- He was accused of trying to subvert children with drink and bad company.
