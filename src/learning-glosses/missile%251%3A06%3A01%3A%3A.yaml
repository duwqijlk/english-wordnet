simpleMeaning: a rocket that carries a warhead of ordinary or nuclear explosives, and may fly on its own
  set path or be steered from far away
scope: A rocket that carries a warhead of ordinary or nuclear explosives, not a weapon thrown by hand
  that has no motor of its own.
examples:
- The army fired a missile at the distant base.
- The missile was steered by remote control.
