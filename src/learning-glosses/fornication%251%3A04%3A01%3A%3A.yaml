simpleMeaning: sex outside a marriage, done on purpose and with bad intent, that harms the marriage
scope: 'Also called adultery and criminal conversation: sex by a married person with someone else that
  harms the marriage, not sex between two people who are not married to each other.'
examples:
- He was accused of fornication after having sex with another woman while still married.
- In the old law case, fornication was said to have harmed their marriage.
