simpleMeaning: a smooth line, high in the middle and the same on both sides, that shows how a set of values
  spreads out (the normal distribution)
scope: 'Also called normal curve: a smooth line high in the middle and the same on both sides, not a flat
  line and not a line that rises all the way across.'
examples:
- The test scores formed a bell-shaped curve, with most marks near the middle.
- A bell-shaped curve shows that very high and very low scores are rare.
