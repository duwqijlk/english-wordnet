simpleMeaning: 'The three arms of the central rule of the country: the arm that runs it, the arm that
  makes laws, and the arm that judges.'
scope: Also called U.S., U.S. government, United States, and US Government, it is the three arms of the
  country's central rule; not one arm on its own and not a state government.
examples:
- The United States government has three branches.
- The United States government makes and enforces the laws.
