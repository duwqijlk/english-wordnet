simpleMeaning: make someone feel a sharp or stinging pain or discomfort
scope: The 'sharp pain' use of bite, another name for burn and sting in this sense, not biting with the
  teeth and not a bite wound.
examples:
- The icy wind bit into his cheeks.
- The raw whiskey bit at the back of his throat.
