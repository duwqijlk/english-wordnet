simpleMeaning: The quality of answering quickly and with feeling to people and to what happens around
  one.
scope: The quality of answering quickly and with feeling to people and events; not merely being quick
  to react when something stirs one.
examples:
- Her responsiveness to the children's needs impressed the visitors.
- The dog showed great responsiveness to its owner's voice.
