simpleMeaning: that makes something more active or makes it work faster
scope: 'Another name for this sense is stimulating: it describes a thing that makes something more active.
  It is not the noun for a drug that makes the body work faster, and not a thing or event that pushes
  a person to act.'
examples:
- Coffee has a stimulant effect on the body.
- The doctor studied the stimulant effects of the plant on the mind.
