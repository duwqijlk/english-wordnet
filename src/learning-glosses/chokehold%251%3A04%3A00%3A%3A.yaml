simpleMeaning: A hold that keeps a person still, with an arm looped tight round the neck of another person,
  usually from behind.
scope: Also called a choke hold, a hold that keeps a person still, with an arm looped tight round the
  neck, usually from behind.
examples:
- He grabbed the woman in a chokehold, demanded her cash and jewelry, and then fled.
- The guard put the man in a chokehold.
