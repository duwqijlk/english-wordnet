simpleMeaning: to say words with the cords in the throat held tight
scope: To say words with the cords in the throat held tight; not to say words in a soft, loose voice and
  not to sing.
examples:
- He devoiced the words, and his voice came out harsh and tight.
- She devoiced each word slowly, with her throat held tense.
