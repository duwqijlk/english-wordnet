simpleMeaning: the quality of being very cruel and having no kindness or care for other people, in a way
  that shocks people
scope: 'Also called atrocity: the quality of being very cruel with no care for people, not one single
  cruel act.'
examples:
- The barbarity of the attack shocked everyone who heard about it.
- People spoke of the barbarity shown to prisoners during the war.
