simpleMeaning: A bristly grass that grows as a weed across nearly all mild lands.
scope: Glaucous bristlegrass, yellow bristle grass, yellow bristlegrass and yellow foxtail are other names
  for this sense, a bristly weed grass of mild lands, not foxtail millet grown as a food crop and not
  a grass found only in hot tropical lands.
examples:
- Setaria glauca grows as a weed in nearly every mild part of the world.
- The field was full of Setaria glauca, a bristly grass.
