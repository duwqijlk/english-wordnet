simpleMeaning: A break in the supply of current, so machines stop working
scope: This is a break in the supply of current, so machines stop working; power failure is another name
  for this sense, not a single machine breaking down, and not a planned switch-off.
examples:
- The ice storm caused a power outage across the town.
- A power outage stopped the lifts during the storm.
