schema: oewn-learning-gloss-v2
senseId: epicene%5:00:00:unmanly:00
synsetId: 01479632-s
simpleMeaning: With womanly marks that do not suit a man.
scope: This sense is also called sissy, emasculate, and effeminate, for having womanly marks that do not
  suit a man, unlike the sense for one having both male and female sexual marks and parts, where at birth
  no clear call of male or female can be made, and unlike the sense for being of unclear sex, neither
  one nor the other.
examples:
- His manner was epicene, womanly and unsuited.
- The style was epicene, womanly and unsuited.
