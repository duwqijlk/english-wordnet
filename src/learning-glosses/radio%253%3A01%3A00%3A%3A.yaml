simpleMeaning: used in front of another word to show that something is connected with the strong rays
  or energy given off by certain atoms
scope: This is not about sound broadcasting; it is a word part used for scientific energy and rays.
examples:
- The lab uses radiocarbon dating to find the age of ancient wood.
- Radiotherapy uses strong rays to treat cancer.
