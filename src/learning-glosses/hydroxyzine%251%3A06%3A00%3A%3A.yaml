scope: This is a drug sold as Atarax and Vistaril, used to calm people and to treat worry and travel sickness;
  hydroxyzine hydrochloride is another name for this sense, not a drug that puts people to sleep and not
  a painkiller.
examples:
- The doctor gave her hydroxyzine for her worry.
- Hydroxyzine helped with his travel sickness.
