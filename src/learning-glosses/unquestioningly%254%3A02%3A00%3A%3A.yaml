senseId: 'unquestioningly%4:02:00::'
synsetId: 00504312-r
simpleMeaning: in a way that shows no doubt at all, and that accepts things without asking why
scope: This describes doing something without asking or doubting at all. It is not about asking questions,
  and it is not about doubting or refusing.
examples:
- He followed his leader unquestioningly, never asking why.
- She accepted the orders unquestioningly and did the work at once.
