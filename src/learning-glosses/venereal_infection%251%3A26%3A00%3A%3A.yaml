simpleMeaning: A sickness that can be passed on and is caught through sex or touch of the sex parts.
scope: A sickness caught through sex; dose, sexually transmitted disease, social disease and venereal
  disease are other names for this sense; not a cold and not a skin rash.
examples:
- A venereal infection can be passed on through sex.
- He went to the clinic for a venereal infection.
