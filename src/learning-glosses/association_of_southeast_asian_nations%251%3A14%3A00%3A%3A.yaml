simpleMeaning: A group of countries in the south-east of Asia that work together on trade, money and politics,
  and joined the United States to fight terror around the world
scope: Also called ASEAN; a group of countries in the south-east of Asia that work together on trade and
  politics, not a world-wide body and not one country alone.
examples:
- The Association of Southeast Asian Nations brings together countries of the region.
- The Association of Southeast Asian Nations joined the United States to fight terrorism.
