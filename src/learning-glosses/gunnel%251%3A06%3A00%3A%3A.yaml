simpleMeaning: The topmost boards along the side of a wooden boat.
scope: The topmost boards along the side of a wooden boat; gunwale and gun rest are other names for it,
  not the living space of young officers on a warship and not a small fish.
examples:
- He sat on the gunnel of the wooden boat.
- The gunnel ran along the top edge of the boat's side.
