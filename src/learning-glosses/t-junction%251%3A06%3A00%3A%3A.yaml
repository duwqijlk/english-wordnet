simpleMeaning: A place where two roads, pipes or other things meet so that they form the shape of the
  letter T.
scope: This is a place where two roads, pipes or other things meet so that they form the shape of the
  letter T, not a crossroads and not a straight road.
examples:
- The road ends at a T-junction.
- Turn left at the T-junction.
