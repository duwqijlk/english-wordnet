simpleMeaning: A big American moth with yellow wings marked in purple or brown; its young feed on trees
  such as maple and pine.
scope: Also called an imperial moth; a big American moth with yellow wings marked in purple or brown,
  whose young feed on maple and pine, kin to other big yellow moths.
examples:
- Eacles imperialis flew past the porch light, its yellow wings marked in brown.
- The young of Eacles imperialis feed on maple and pine trees.
