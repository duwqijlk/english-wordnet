simpleMeaning: People tap this warm-land plant for its gum, and cut it for wood that is heavy and red.
scope: 'This is balata, also called a beefwood or a bully tree: people tap it for its gum and cut it for
  heavy red wood.'
examples:
- We walked past a balata tree in the warm lands.
- The balata tree was tapped for its gum.
