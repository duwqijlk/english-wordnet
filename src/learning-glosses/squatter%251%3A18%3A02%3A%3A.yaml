senseId: 'squatter%1:18:02::'
synsetId: 10662616-n
simpleMeaning: a person who moves to live on land owned by the government, in a way the law allows, and
  plans to become its owner
scope: 'Also called homesteader and nester: a person who lives on government land in a way the law allows
  and plans to own it, not a person who lives on land or in a building with no right to do so.'
examples:
- The squatter built a small house on the government land and later got the land in his own name.
- As a squatter, she lived on the public land in a lawful way while she waited to become its owner.
