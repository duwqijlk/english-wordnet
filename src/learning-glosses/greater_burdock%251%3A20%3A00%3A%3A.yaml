simpleMeaning: A burdock with heart-shaped leaves, found in open woods, hedgerows and rough grassland
  from Europe (except the far north) to Asia Minor; sometimes grown for medicine and cooking.
scope: Another name for great burdock, the heart-leaved species, not a separate or larger burdock.
examples:
- Greater burdock has large heart-shaped leaves and purple flower heads.
- Farmers sometimes grow greater burdock for its edible roots.
