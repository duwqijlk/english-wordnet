simpleMeaning: to take loud, heavy breaths, the way a worn-out person does
scope: The noisy breathing of tiredness, for which gasp, heave and puff are other names, not saying words
  while out of breath and not the noun for one short breath.
examples:
- She was panting hard by the time she reached the top of the hill.
- The dog lay in the shade, panting after its run.
