simpleMeaning: A widening of tiny blood vessels near the skin, with a red spot in the middle from which
  thin vessels spread out.
scope: 'Also called spider angioma and spider nevus: a widening of tiny blood vessels near the skin with
  a red spot in the middle, not a bite and not a birthmark.'
examples:
- A vascular spider shows as a red spot with thin vessels spreading out.
- The doctor saw a vascular spider on the man's cheek.
