simpleMeaning: A person who makes shapes to work from, for sewing, woodwork or metalwork
scope: A person who makes shapes to work from, for sewing, woodwork or metalwork, not a person who sews
  the cloth and not a person who works the wood.
examples:
- The patternmaker drew the shapes for the new dress.
- As a patternmaker, he made the shapes for the metal parts.
