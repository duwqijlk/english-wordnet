simpleMeaning: one of the thin tubes that branch through a leaf or other plant part, carrying food and
  water and holding it up
scope: One of the thin tubes that branch through a leaf, not a blood tube in the body and not a hard rib
  in an insect wing.
examples:
- The veins of the leaf stood out in the sunlight.
- Water moves through the veins to the tip of the leaf.
