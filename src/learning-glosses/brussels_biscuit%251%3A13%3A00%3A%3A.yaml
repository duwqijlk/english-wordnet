simpleMeaning: A slice of sweet raised bread baked a second time until it is brown, hard, and crisp.
scope: Also called a rusk, twice-baked bread, and zwieback; a slice of sweet raised bread baked twice,
  not a soft fresh roll and not a plain cracker.
examples:
- He dunked a Brussels biscuit in his tea.
- The Brussels biscuit snapped when she bit it.
