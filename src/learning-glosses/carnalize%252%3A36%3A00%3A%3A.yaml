simpleMeaning: to show a person or thing in a painting or statue as a thing of flesh and matter
scope: To show a subject in a painting or statue as a thing of flesh and matter, not as a thing of the
  mind or spirit and not as a plain likeness of its looks.
examples:
- In that painting, he carnalized the angel, showing her as a woman of flesh.
- The sculptor carnalized the god, giving the statue a body of flesh and muscle.
