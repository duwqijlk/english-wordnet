senseId: 'golden_handshake%1:10:00::'
synsetId: 07193499-n
simpleMeaning: A deal that pays a worker a lot of money when they leave a job, usually to get them to
  retire.
scope: A big money deal for a worker leaving a job, usually to retire, not a normal wage and not a small
  leaving gift.
examples:
- The manager got a golden handshake when she retired early.
- His golden handshake paid him a year's wages to leave the firm.
