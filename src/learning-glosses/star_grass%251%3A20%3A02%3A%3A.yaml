simpleMeaning: Many long thin heads set out like the arms of a windmill mark this grass from Australia,
  which lives for many years.
scope: Also called creeping windmill grass and windmill grass, it is a grass from Australia with long
  spikes, not the creeping lawn grass from Europe.
examples:
- We saw star grass with long spikes.
- Star grass stood out with its windmill spikes.
