simpleMeaning: Upright bushy annual grown in India, Indonesia and the US for animal feed and edible seeds,
  the main source of sprouts in Chinese cooking, and sometimes classed in genus Phaseolus.
scope: The growing crop itself, not the dried seeds sold for food or the sprouts made from them; mung
  and mung bean are shorter names for the same plant.
examples:
- Farmers in warm regions grow the mung bean plant for animal feed and for the seeds they sprout for Chinese
  cooking.
- A single mung bean plant can fill dozens of pods in a good season.
