simpleMeaning: An old-fashioned machine used to show a row of things to be memorised
scope: An old-fashioned machine for showing things to be memorised; mnemometer is another name for this,
  not a modern computer and not a book of test questions.
examples:
- The memory apparatus showed cards one by one.
- The old memory apparatus stood in the corner of the lab.
