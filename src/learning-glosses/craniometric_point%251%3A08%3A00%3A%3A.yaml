simpleMeaning: a fixed spot on the skull used as a place from which to measure the skull
scope: A fixed spot on the skull used for taking skull measures, not a spot on another bone and not a
  tool for measuring.
examples:
- The craniometric point marked where the skull was measured.
- He found the craniometric point on the top of the skull.
