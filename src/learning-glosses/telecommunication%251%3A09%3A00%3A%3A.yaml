simpleMeaning: In electrical engineering, often used in the plural, the study of how messages are sent
  over a distance by electronic means
scope: This is the field of study and work, not the systems and equipment used to send messages over a
  distance.
examples:
- She studied telecommunication at university before working on phone networks.
- He is taking a course in telecommunication to learn how messages are sent over a distance.
