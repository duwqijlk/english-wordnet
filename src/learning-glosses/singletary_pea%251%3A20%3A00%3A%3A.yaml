simpleMeaning: A thin-stemmed one-year plant of winter, from the lands around the Mediterranean Sea, long
  grown in the southern United States and planted to cover ground and feed grazing animals
scope: A thin-stemmed winter plant from the lands around the Mediterranean Sea, also called rough pea
  or wild winterpea, grown as a ground cover and feed for grazing animals, not a garden pea grown for
  its pods.
examples:
- The farmer planted singletary pea to cover the bare field through winter.
- Cattle grazed on the singletary pea that had spread across the pasture.
