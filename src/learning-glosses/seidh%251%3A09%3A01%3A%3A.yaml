simpleMeaning: a word from old Norse for one kind of magic, used in the north during the late Iron Age
scope: This is an old Norse word for a kind of magic in the late Iron Age; seithr, seid, seidhr, seidr
  and seith are other names for this sense, not modern stage magic and not a Norse god.
examples:
- The old book speaks of seidh as a form of magic.
- Seidh was feared by those who did not know it.
