simpleMeaning: Big wing-like fins let these warm-sea fish glide through the air for a short way.
scope: These fish glide through the air, unlike the flying gurnard, which glides under water.
examples:
- A flying fish leapt out of the water and glided through the air.
- The flying fish spread its wide fins and glided above the waves.
