simpleMeaning: Barnacles and other sea creatures cannot cling and build up on things below the water once
  this coat is spread on them.
scope: This coat goes on things below the water, keeping barnacles and other sea creatures from clinging
  to them and building up there.
examples:
- The antifouling paint on the hull keeps barnacles from clinging to it.
- The boat's keel was given a coat of antifouling paint before it went back in the water.
