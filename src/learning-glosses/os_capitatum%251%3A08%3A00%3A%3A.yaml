simpleMeaning: The wrist bone with a round head that joins to the third long bone of the hand
scope: 'Also called capitate or capitate bone: the wrist bone with a round head that joins the third long
  bone of the hand, not a finger bone and not a bone of the arm.'
examples:
- The os capitatum is the largest bone in the wrist.
- A break in the os capitatum can make the whole wrist ache.
