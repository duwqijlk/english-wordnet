simpleMeaning: A cup fungus with bright orange fruiting bodies shaped like cups or saucers and pale orange
  outsides.
scope: A cup fungus with bright orange fruiting bodies shaped like cups or saucers, also called orange
  peel fungus; its nearest kin are other cup fungi with bright orange fruiting bodies.
examples:
- Aleuria aurantia grew in bright orange cups on the damp ground.
- We found Aleuria aurantia with pale orange outsides in the wood.
