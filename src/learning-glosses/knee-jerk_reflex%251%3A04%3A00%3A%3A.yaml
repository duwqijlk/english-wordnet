simpleMeaning: a sharp tap below the front of the joint makes the leg straighten on its own, without the
  person meaning to move it
scope: Also called knee jerk and patellar reflex, it is a leg straightening that follows a sharp tap and
  happens without a person meaning to move.
examples:
- A sharp tap on the cord below the front of the joint set off the knee-jerk reflex.
- After the tap, the knee-jerk reflex made the leg straighten on its own.
