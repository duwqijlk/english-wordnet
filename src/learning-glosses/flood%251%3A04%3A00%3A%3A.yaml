simpleMeaning: the act of filling something with water until it spills over the top
scope: This is the act of filling something until water spills over. It is not the sea coming in between
  tides, and not a river rising onto dry land by itself.
examples:
- The flooding of the fields was done on purpose to help the crops.
- They carried out the flooding slowly, filling the tank until it ran over.
