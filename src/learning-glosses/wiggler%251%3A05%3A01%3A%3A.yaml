simpleMeaning: A land worm that digs into the soil and lets air in, often coming up when the ground is
  cool or wet, and used by people who fish as bait.
scope: Also called an earthworm, a crawler, a nightcrawler, a nightwalker, an angleworm, a dew worm, a
  fishing worm, a fishworm, or a red worm, this is a land worm that digs into the soil and lets air in.
examples:
- The wiggler surfaced after the rain cooled the ground.
- He put a wiggler on the hook as bait.
