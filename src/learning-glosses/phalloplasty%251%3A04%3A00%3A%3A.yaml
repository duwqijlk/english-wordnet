simpleMeaning: surgery that rebuilds the penis to mend a fault present at birth or an injury
scope: Surgery that rebuilds the penis to mend a fault or injury; not the removal of the penis and not
  surgery on the bladder.
examples:
- The surgeon planned a phalloplasty to mend the fault the boy was born with.
- After the injury, phalloplasty rebuilt the penis.
