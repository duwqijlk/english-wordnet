simpleMeaning: A thyroid hormone like thyroxine, another thyroid hormone, with one less iodine atom per
  molecule, made in smaller amounts; it acts the same way but more strongly and briefly.
scope: This is a separate thyroid hormone, not thyroxine itself, which has one more iodine atom and is
  made in larger amounts.
examples:
- Liothyronine has one less iodine atom than thyroxine and is made in smaller amounts.
- Though it acts like thyroxine, liothyronine is stronger and its effect is shorter.
