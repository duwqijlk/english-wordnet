simpleMeaning: A tree that grows in the warm East Indies and is grown for fruit people can eat.
scope: A tree grown for its fruit, not a tree grown only for wood or shade.
examples:
- A jambosa grew beside the house in the village.
- The jambosa bore fruit that the children ate.
