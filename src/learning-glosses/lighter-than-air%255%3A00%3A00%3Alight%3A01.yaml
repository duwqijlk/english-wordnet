simpleMeaning: of a balloon or other flying craft that stays up because it is not as heavy as the gas
  it pushes aside
scope: Of a balloon or other craft that stays up because it is not as heavy as the gas it pushes aside;
  a balloon full of hot air counts, but a plane that flies by speed and lift does not.
examples:
- The lighter-than-air craft drifted slowly over the field.
- A lighter-than-air balloon needs no engine to stay up.
