simpleMeaning: Existing in fact and able to be treated as true rather than imagined.
scope: This is not the sense of showing something's true inner character, and it is not a mathematical
  term; it means actually existing rather than imagined.
examples:
- The threat of a strike was real, and the managers took it seriously.
- Her fear of flying is real, not something she makes up for attention.
