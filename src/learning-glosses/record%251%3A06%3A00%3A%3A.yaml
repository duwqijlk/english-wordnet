simpleMeaning: a round plastic disk with a groove that plays music when a machine turns it under a needle.
scope: Not a team's wins and losses and not a written note of events; here it means the plastic disk that
  music is played from.
examples:
- My grandfather still plays old jazz records on his record player.
- She found a rare record in a music shop.
