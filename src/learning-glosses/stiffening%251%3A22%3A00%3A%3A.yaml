simpleMeaning: the process by which a thing becomes hard to bend or move
scope: This is the process of becoming hard to bend or move, not the act of becoming hard in that way.
examples:
- The stiffening of his knees made walking hard.
- We watched the stiffening of the wet cloth as it froze.
