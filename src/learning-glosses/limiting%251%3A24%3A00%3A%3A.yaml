simpleMeaning: In grammar, the link between a word and a phrase when the word narrows what the phrase
  means
scope: In grammar, the link when a word narrows what a phrase means; not the adjective sense of keeping
  something within bounds and not a rule of law.
examples:
- The word 'red' in 'the red car' is an example of limiting.
- Limiting can be seen when one word narrows another.
