simpleMeaning: A part that moves power from an engine, as in a tractor or other motor vehicle, to another
  piece of equipment, as to a pump or jackhammer.
scope: 'Also called a power takeoff: a part that moves power from an engine to another piece of equipment,
  not the engine itself and not the equipment it drives.'
examples:
- The farmer hooked the pump to the PTO of his tractor.
- A PTO lets one engine drive many kinds of farm equipment.
