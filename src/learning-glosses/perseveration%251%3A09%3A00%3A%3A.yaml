simpleMeaning: The way a thought or memory keeps coming back on its own, with nothing to set it off.
scope: The way a thought or memory keeps coming back on its own, with nothing to set it off; not a habit
  and not a dream.
examples:
- His perseveration brought the same song back all day.
- Perseveration made her repeat the question again and again.
