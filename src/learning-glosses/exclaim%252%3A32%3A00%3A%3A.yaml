simpleMeaning: to say something out loud, often with surprise, great fear, or joy
scope: 'Also called cry and shout: saying something out loud from surprise, great fear, or joy, not speaking
  in a normal, quiet way.'
examples:
- '''I won!'' he exclaimed with joy.'
- '''Help!'' she exclaimed in great fear.'
