simpleMeaning: A yearly check that older road vehicles must pass, to make sure they are safe and their
  fumes are within the allowed limits.
scope: 'Also called MOT and Ministry of Transportation test: a yearly check that older road vehicles must
  pass, to make sure they are safe and their fumes are within the allowed limits, not a check for new
  vehicles.'
examples:
- The old van passed its MOT test this morning.
- Her car failed the MOT test because of its fumes.
