simpleMeaning: a tool for land surveyors that measures angles across and up and down, made of a small
  telescope set on a three-legged stand
scope: 'Also called a transit: a tool for measuring angles in land surveys, not a telescope for looking
  at stars and not a level for checking flat ground.'
examples:
- The surveyor set up the theodolite on its tripod to measure the angle.
- With a theodolite they measured the horizontal and vertical angles of the field.
