scope: A clover from Ireland with yellowish flowers, often held the true or first one; also called hop
  clover or lesser yellow trefoil; not a creeping European clover with white to pink flowers and bright
  green leaves, settled in the United States, widely grown for fodder, nor a Eurasian plant with heart-shaped
  three-leaf leaves and white purple-veined flowers.
