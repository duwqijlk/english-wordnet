simpleMeaning: given all the tools and things needed for a certain job or task
scope: 'Also called fitted out: having the tools needed for a job or task, not having the right clothes
  and things to wear.'
examples:
- The boat was outfitted with maps, ropes, and lights for the long trip.
- Each work team was outfitted with the tools it needed for the job.
