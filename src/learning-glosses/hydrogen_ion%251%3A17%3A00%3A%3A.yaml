simpleMeaning: With one positive charge on it, the bare centre of an atom of the lightest gas stands alone,
  its circling bit gone.
scope: This is the bare centre of an atom of the lightest gas, carrying one positive charge.
examples:
- The acid gave off hydrogen ions into the water.
- Hydrogen ions drifted through the liquid, each with a positive charge.
