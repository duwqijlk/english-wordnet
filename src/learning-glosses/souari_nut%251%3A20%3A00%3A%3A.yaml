simpleMeaning: Its hard-shelled seeds give food and cooking oil, and they grow in stone fruit on a big
  South American tree with leaves in threes that it keeps all year.
scope: Also called souari or souari tree, it is the South American tree itself, not the seed it bears.
examples:
- The souari nut grows in South America.
- People cook with oil from the souari nut.
