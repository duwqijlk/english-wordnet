simpleMeaning: Its tail nearly always all one pale colour, the biggest hare of the northern plains and
  western mountains of the United States, brownish-grey in summer, pale grey in winter.
scope: Also called whitetail jackrabbit, it is the biggest hare of the northern plains and western mountains
  of the United States, brownish-grey in summer, pale grey in winter, with a tail nearly always all one
  pale colour.
examples:
- A white-tailed jackrabbit stood on the northern plain.
- The white-tailed jackrabbit bounded across the northern plain.
