simpleMeaning: The part of biology that studies how living things pass traits to their young and why they
  differ from each other
scope: 'Also called genetic science: the part of biology about how traits pass from parents to young,
  not the study of all living things in general.'
examples:
- She studies genetics at university.
- Genetics can help doctors understand why some illnesses run in families.
