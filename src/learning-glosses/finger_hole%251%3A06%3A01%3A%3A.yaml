simpleMeaning: One of a row of openings in a woodwind instrument, where the note shifts when a digit covers
  it
scope: This is one opening in a row on a woodwind instrument, not the mouthpiece and not a valve on a
  brass instrument.
examples:
- He covered the finger hole to change the note.
- One finger hole on the flute was blocked.
