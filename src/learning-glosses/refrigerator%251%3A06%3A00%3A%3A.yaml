simpleMeaning: a big box for the home that uses power to keep food cold, so food can be kept at low temperatures
scope: A power-using box for keeping food cold in the home, not a freezer that makes food hard with ice
  and not a plain cupboard for storing food.
examples:
- Put the milk in the refrigerator so it stays cold.
- She opened the refrigerator and took out some eggs.
