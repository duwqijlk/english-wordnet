senseId: 'synezesis%1:22:00::'
synsetId: 13586404-n
simpleMeaning: In cell division, the drawing together of the cell's dark thread-like matter to one side
  of the middle part of the cell at an early stage
scope: In cell division, the drawing together of the cell's dark thread-like matter to one side of its
  middle part; synizesis is another name for this sense. Not the splitting of the cell and not the spreading
  of its matter through the whole cell.
examples:
- During synezesis the chromatin bunches at one side of the nucleus.
- The textbook shows synezesis in the early prophase of meiosis.
