simpleMeaning: a flask with walls that hold no air inside, so it keeps hot drinks hot and cold drinks
  cold
scope: A flask that keeps drinks hot or cold; thermos and thermos flask are other names for this sense.
  Not an open jug, and not a kettle that heats water.
examples:
- She poured hot tea from her thermos bottle at lunch.
- He filled his thermos bottle with iced water for the walk.
