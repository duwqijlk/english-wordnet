simpleMeaning: a wide-edged chisel that a stonemason uses to shape stone
scope: The stonemason's broad-edged chisel, also called a drove chisel, not a herd of animals on the move
  or a moving crowd.
examples:
- The mason used a drove to smooth the face of the stone.
- He kept his drove sharp for shaping softer blocks.
