simpleMeaning: cloth that hangs down to cover something and keep out light, especially a window
scope: 'Also called curtain, drape, mantle and drapery: hanging cloth, especially for a window, not cloth
  for a dead body and not a sudden fear.'
examples:
- A heavy pall hung over the window and kept the room dark.
- She drew the pall across the window at night to shut out the light.
