senseId: 'backfire%1:04:00::'
synsetId: 00073852-n
simpleMeaning: a mistake in judging or planning something, which comes back and harms the person who made
  it
scope: 'Also called boomerang: a mistake in judging or planning that harms the person who made it, not
  a loud noise from an engine and not a fire set on purpose to slow a bigger fire.'
examples:
- His plan to cheat was a backfire that cost him his job.
- The lie was a backfire, and everyone stopped trusting her.
