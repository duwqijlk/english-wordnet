simpleMeaning: To make something move a particular way by applying force, literally or figuratively.
scope: This is making something move in a given direction by force, whether physical or abstract, not
  moving something toward yourself or steering a vehicle.
examples:
- The strong yen pulled prices down across the region.
- He pulled the conversation back to the main issue.
