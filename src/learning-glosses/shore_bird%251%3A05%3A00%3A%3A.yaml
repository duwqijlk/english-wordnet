simpleMeaning: any of many waders found mostly by the sea and where rivers meet the sea
scope: Any of many waders found mostly by the sea and where rivers meet the sea, also called a shorebird
  and a limicoline bird; not a sea bird that swims and not a garden bird.
examples:
- A shore bird waded at the edge of the estuary.
- We watched a shore bird feeding on the mud flats.
