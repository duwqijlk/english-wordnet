simpleMeaning: A method of execution in which the person is held up by the neck from a raised frame until
  dead.
scope: This is execution by suspending a person from the neck, not the everyday act of hanging an object
  up and not a decorative wall hanging.
examples:
- Hanging was once a common form of execution in England.
- The murderer was sentenced to hanging.
