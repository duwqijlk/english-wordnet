senseId: 'depose%2:32:00::'
synsetId: 01015049-v
simpleMeaning: to say in court, after promising to tell the truth, what you know, or to write it down
  for the court
scope: 'Also called swear: to give facts to a court after promising to tell the truth, not to take power
  away from a ruler or leader.'
examples:
- The witness deposed that she had seen the car leave at nine.
- He deposed in writing about what he knew of the theft.
