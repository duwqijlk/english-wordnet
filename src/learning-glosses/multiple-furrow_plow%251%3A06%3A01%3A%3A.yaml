simpleMeaning: A farm tool with two or more cutting blades, front blades and curved boards, all made to
  work at the same time.
scope: A farm tool with several cutting parts that work at once; gang plough, gang plow and multiple-furrow
  plough are other names for it, not a tool with one cutting part only.
examples:
- The farmer hitched the multiple-furrow plow to the tractor.
- This multiple-furrow plow cuts four lines at once.
