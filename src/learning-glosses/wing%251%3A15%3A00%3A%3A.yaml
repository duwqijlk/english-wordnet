simpleMeaning: In flight formation, the place beside another aircraft and slightly behind it
scope: A place in the air beside and behind another plane; not the aircraft's lifting surface, a bird's
  limb, or a part of a building.
examples:
- The second jet stayed on the leader's wing throughout the flypast.
- From his position on the wing, the pilot could see the whole formation ahead.
