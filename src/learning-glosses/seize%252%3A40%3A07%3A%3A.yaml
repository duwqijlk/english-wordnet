senseId: 'seize%2:40:07::'
synsetId: 02279327-v
simpleMeaning: to take control when you have no right to do so, possibly by force, and to take a thing
  as your own right or as something you own
scope: Also called assume. This means taking control or a thing as your own when you have no right to
  it, not just grabbing something with your hand.
examples:
- The general seized power after the king died.
- She seized control of the town and called it her right.
