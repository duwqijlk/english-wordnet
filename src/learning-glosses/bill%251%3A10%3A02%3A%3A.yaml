simpleMeaning: an advertisement, usually printed on a page or a small sheet called a leaflet, made to
  reach many people
scope: This is a printed notice promoting something, not a list of items in a show or menu.
examples:
- They pasted bills for the concert on walls all over town.
- A bill advertising a circus was handed out at the station.
