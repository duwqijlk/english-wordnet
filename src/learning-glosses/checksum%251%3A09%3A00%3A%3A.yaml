simpleMeaning: One number that stands for the total of the numbers in a piece of computer data, used to
  spot mistakes made when the data is sent or kept.
scope: A number used to spot mistakes in computer data, not a password and not a code that hides the data.
examples:
- The program found a wrong checksum and asked for the file again.
- A checksum lets the computer tell if the data changed in storage.
