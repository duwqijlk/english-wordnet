senseId: 'contradiction%1:10:01::'
synsetId: 07221547-n
simpleMeaning: In logic, a claim that cannot be true, whatever the case may be
scope: In logic, a claim that must be false, not the act of saying someone is wrong.
examples:
- The sentence 'he is brave and he is not brave' is a contradiction.
- A contradiction cannot be true in any case.
