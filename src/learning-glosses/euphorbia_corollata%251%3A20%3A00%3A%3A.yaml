simpleMeaning: A common plant of the United States that lives for many years, a spurge with showy white
  leaves like petals.
scope: Also called flowering spurge, tramp's spurge, and wild spurge, this common plant of the United
  States lives for many years and has showy white leaves like petals, not any other spurge.
examples:
- Euphorbia corollata grows in the open fields.
- The white leaves of Euphorbia corollata looked like petals.
