simpleMeaning: Money set aside each year by the British Parliament to pay for the costs of the royal family.
scope: A yearly sum voted by the British Parliament for the public expenses of the royal household, covering
  the costs of the royal family in its public role.
examples:
- The Civil List was voted by Parliament each year to fund the royal household.
- Parliament set the Civil List to cover the costs of the royal family.
