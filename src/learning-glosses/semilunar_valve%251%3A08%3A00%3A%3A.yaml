senseId: 'semilunar_valve%1:08:00::'
synsetId: 05402247-n
simpleMeaning: A heart flap with parts shaped like half-moons, which stops blood from flowing back into
  the heart
scope: A heart flap with half-moon-shaped parts that stops blood flowing back, not a flap between the
  heart's upper and lower rooms and not a flap in a blood vessel.
examples:
- The semilunar valve stops blood flowing back into the heart.
- Doctors listen for the sound of the semilunar valve closing.
