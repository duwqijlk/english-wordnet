simpleMeaning: paid for so that only one group of people travelling together can use it for a short time
scope: Paid for the use of one travelling group alone for a short time, also called hired and also called
  chartered; not bought, and not kept for a long time.
examples:
- The school travelled in a leased bus that was kept for their group alone.
- They flew on a leased plane hired for the whole team.
