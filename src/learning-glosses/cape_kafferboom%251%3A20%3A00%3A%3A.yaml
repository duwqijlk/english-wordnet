simpleMeaning: A small wide-spreading tree of eastern South Africa, with orange-red flowers and coral-red
  seeds, that keeps most leaves all year; it gives light soft wood for fence posts or shingles.
scope: Also called kaffir boom and Erythrina caffra; a small tree of eastern South Africa, known for its
  light soft wood as well as its orange-red flowers.
examples:
- Cape kafferboom grows in the east of South Africa.
- The orange-red flowers of Cape kafferboom open in spring.
