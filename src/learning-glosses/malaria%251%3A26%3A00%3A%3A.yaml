simpleMeaning: A disease caused by sporozoan parasites, tiny one-celled organisms, passed by the bite
  of an infected Anopheles mosquito, bringing bouts of chills and fever.
scope: A mosquito-borne infection marked by bouts of chills and fever, not dengue or yellow fever.
examples:
- Malaria brings repeated bouts of chills and fever.
- An infected Anopheles mosquito can pass malaria to a person through its bite.
