simpleMeaning: In law, one side in a court case; a person or group taking part in a court case
scope: 'Also called litigant: one side in a court case, not the judge, not a lawyer who speaks for a side,
  and not a person who saw what happened.'
examples:
- 'Both litigators in the case had to come to court next week: the woman who brought the case and the
  man she was suing.'
- As a litigator, he signed the papers in his own name because the case was his, not a client's.
