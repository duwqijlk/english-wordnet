simpleMeaning: A surgeon takes out part or all of a hurt or sick cornea and puts in its place healthy
  tissue from a donor.
scope: Also called corneal graft and keratoplasty, it is an eye operation in which a surgeon puts in healthy
  donor tissue, not a lens change.
examples:
- The corneal transplant gave her back clear sight.
- He waited months for a corneal transplant.
