simpleMeaning: a person hired to find out facts and help look into crimes
scope: 'Another name for a private eye: a person hired to find out facts and help look into crimes, also
  called an operative, a private detective, a private investigator and a sherlock; not a police officer
  and not a spy.'
examples:
- We hired a shamus to find out who was taking money from the shop.
- The shamus followed the man and took notes for the police.
