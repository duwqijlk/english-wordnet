simpleMeaning: 'of clothes or shoes: fitting tightly against the body with little space to spare, yet
  still comfortable'
scope: This is not about a competition being even or information being withheld; it is about how clothing
  sits on the body.
examples:
- The jacket is a close fit but still comfortable across the shoulders.
- These walking shoes are a close fit, yet my feet never feel squeezed.
