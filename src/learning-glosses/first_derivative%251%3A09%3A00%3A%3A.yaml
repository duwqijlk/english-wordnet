simpleMeaning: The change of one amount against another at one moment, found by working out slopes and
  tiny steps of change, written df(x)/dx.
scope: It is also called derivative, differential, derived function and differential coefficient.
examples:
- The first derivative tells how fast the amount changes at one moment.
- The first derivative of the function was zero.
