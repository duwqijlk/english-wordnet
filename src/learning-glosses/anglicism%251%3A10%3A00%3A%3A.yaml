simpleMeaning: a word or phrase used in Great Britain, especially as against American English
scope: Also called Briticism and Britishism; it is a British way of saying something, not an American
  way of saying it and not a custom of England.
examples:
- “Lift” is an Anglicism for what Americans call an elevator.
- The Anglicism puzzled the American reader.
