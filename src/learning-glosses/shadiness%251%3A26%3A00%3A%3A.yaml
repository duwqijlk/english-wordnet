senseId: 'shadiness%1:26:00::'
synsetId: 14008098-n
simpleMeaning: how dark a place is when something solid blocks the light
scope: The darkness of a place when something solid blocks the light, also called shade and shadowiness;
  not full darkness and not a dark colour.
examples:
- There's too much shadiness in the room to take good photos.
- The shadiness of the garden made it hard to read there.
