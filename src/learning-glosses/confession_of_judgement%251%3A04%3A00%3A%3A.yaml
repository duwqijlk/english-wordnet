senseId: 'confession_of_judgement%1:04:00::'
synsetId: 01190763-n
simpleMeaning: A court order made after a debtor gives a written admission, without the cost that a full
  court case brings
scope: A court order made after a debtor's written admission, also called cognovit judgement, cognovit
  judgment, and confession of judgment, not a court order after a trial and not a private deal between
  debtor and lender.
examples:
- The confession of judgement was entered without a trial.
- He signed a confession of judgement to end the case quickly.
