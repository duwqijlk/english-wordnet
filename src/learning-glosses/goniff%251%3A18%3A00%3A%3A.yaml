simpleMeaning: This Yiddish word is used to call a person a thief, a cheat, or a bad person, often as
  a general term of abuse
scope: A Yiddish word for a thief or a cheat, also called ganef, ganof and gonif, not a word for a violent
  robber and not a word for a fool.
examples:
- The old man shook his fist and called him a goniff.
- She warned me that the dealer was a goniff.
