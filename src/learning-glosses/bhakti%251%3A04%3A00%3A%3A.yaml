simpleMeaning: In Hinduism, loving devotion to a god that leads to release from rebirth and lasting peace;
  open to every person, whatever their caste or sex
scope: In Hinduism, loving devotion to a god, not worship of many gods and not a temple rite.
examples:
- Her bhakti gave her great peace.
- Bhakti is open to all, whatever their caste.
