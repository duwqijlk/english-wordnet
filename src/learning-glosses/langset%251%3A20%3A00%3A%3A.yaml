simpleMeaning: From the East Indies comes a tree whose yellow berries can be eaten
scope: A tree from the East Indies that bears yellow berries good to eat, also called langsat and lanseh
  tree; not the berry itself and not a different fruit tree.
examples:
- The langset grows well in warm, wet places.
- A langset stood at the edge of the field, full of yellow berries.
