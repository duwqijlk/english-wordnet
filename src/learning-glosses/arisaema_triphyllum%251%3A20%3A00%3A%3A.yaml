simpleMeaning: A common American spring-flowering woodland plant, with leaves that wrap the stem and an
  upright club-shaped flower spike under a green and purple hood that makes scarlet berries.
scope: Also called jack-in-the-pulpit, wake-robin, Arisaema atrorubens, and Indian turnip; an American
  woodland plant with a club-shaped flower spike, not a tall shrub and not a garden flower with plain
  round leaves.
examples:
- Arisaema triphyllum grows in the damp woods in spring.
- The scarlet berries of Arisaema triphyllum ripen in late summer.
