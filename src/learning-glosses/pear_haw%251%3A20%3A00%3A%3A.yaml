simpleMeaning: Almost without thorns, an upright American thorn bush bears berries somewhat shaped like
  a fruit round at the bottom and narrow at the top.
scope: Blackthorn and pear hawthorn are other names for this upright American thorn bush, almost without
  thorns.
examples:
- The pear haw bears berries somewhat shaped like a fruit round at the bottom.
- A pear haw is almost without thorns.
