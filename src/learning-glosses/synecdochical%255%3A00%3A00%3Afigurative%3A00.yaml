senseId: synecdochical%5:00:00:figurative:00
synsetId: 01423361-s
simpleMeaning: naming a part for the whole, or the whole for a part; one kind for a wider kind or back;
  the stuff a thing is made of for the thing
scope: Using a part's name for the whole, or the whole's name for a part, with synecdochic as another
  name for this sense, not plain literal naming and not a metaphor.
examples:
- To use 'steel' for 'sword' is synecdochical.
- His synecdochical phrase made the whole crew into 'hands'.
