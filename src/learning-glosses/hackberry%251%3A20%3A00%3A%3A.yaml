simpleMeaning: Any of several trees of the Celtis kind, with flowers that are hard to see and small fruit
  like berries
scope: This is any of several trees of the Celtis kind with flowers that are hard to see and small fruit
  like berries; nettle tree is another name for this sense, not a berry bush and not a tree with showy
  flowers.
examples:
- Hackberries ripen on the hackberry in late summer.
- The hackberry by the road bore small dark fruit.
