simpleMeaning: a person who moves about quietly and in secret, usually to do something against the law
scope: A person who moves about in secret, usually planning something against the law; not the noun for
  a person people see as dishonest and not worth respect, and not the verb for putting, bringing or taking
  a thing in secret.
examples:
- A sneak was seen near the warehouse late at night.
- The guard caught the sneak hiding behind the boxes.
