simpleMeaning: It does not join in chemical change, except in a very small way
scope: 'Also called neutral and indifferent: this is about taking part in chemical change. It is not the
  sense of being unable to move.'
examples:
- Nitrogen is an inert gas in many tests at school.
- The lab used an inert powder that did not change with the acid.
