simpleMeaning: In genetics, an unusual set of sex hormones in a man who has two Y chromosomes.
scope: In genetics, an unusual set of sex hormones in a man with two Y chromosomes; it is the male set
  with two Y chromosomes, not the usual set with one.
examples:
- The doctor said the man had XYY.
- XYY is found in some men with two Y chromosomes.
