scope: Also called Neo-Latin, Neo-Latin language and New Latin language; this is the tongue as used since
  the Renaissance, not the tongue as spoken in old Rome.
examples:
- New Latin words still turn up in the names of plants.
- Scientists used New Latin when they gave the new frog its name.
