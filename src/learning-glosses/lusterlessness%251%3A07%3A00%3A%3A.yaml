senseId: 'lusterlessness%1:07:00::'
synsetId: 04963287-n
simpleMeaning: Little or no contrast in how a surface looks, with no bright spots and no shine
scope: Also called lustrelessness, flatness, mat, matt and matte, this is a surface with little contrast
  and no shine, not a bright glossy finish and not a rough surface.
examples:
- The lusterlessness of the old paint made the wall look flat.
- She liked the lusterlessness of the matte paper.
