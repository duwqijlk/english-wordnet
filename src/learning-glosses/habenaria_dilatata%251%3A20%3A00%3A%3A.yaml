simpleMeaning: An orchid with spikes of many sweet-smelling white flowers on upright leafy stems, growing
  on wet or swampy ground through most of the West and northern North America.
scope: 'Also called bog candles and bog rein orchid: an orchid of wet or swampy ground with spikes of
  many sweet-smelling white flowers on upright leafy stems; other white-flowered orchids of the West grow
  on drier ground or have fewer flowers.'
examples:
- Habenaria dilatata grows in the wet meadow with spikes of white flowers.
- We saw Habenaria dilatata standing tall on the boggy ground.
