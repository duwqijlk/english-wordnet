simpleMeaning: a part that can be pulled in or pushed out, with pipes to let air in and out, so a boat
  under water can stay there a long time
scope: This is the air part on a boat that travels under water, also called breather, schnorchel, schnorkel,
  and snorkel breather; it is not the small tube a swimmer uses, and not the act of swimming with one.
examples:
- The submarine raised its snorkel to take in fresh air.
- With the snorkel up, the submarine could stay under water for many hours.
