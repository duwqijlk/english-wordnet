simpleMeaning: One of many kinds, this small hard-backed insect of pools and ponds usually has a smooth
  egg-shaped body and flat back legs for swimming.
scope: It names one of many kinds of small hard-backed insect of pools and ponds, not a hard-backed insect
  of dry land.
examples:
- A water beetle swam in the pond on flat back legs.
- Water beetles live in pools and ponds, with smooth egg-shaped bodies.
