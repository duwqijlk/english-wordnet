simpleMeaning: a part of a thing that gives pleasure and makes people want it
scope: 'Also called a magnet: a part of a thing that gives pleasure and draws people, not the general
  power to catch interest and not a pull between objects in nature.'
examples:
- Flowers are an attraction for bees in the spring.
- The lake was the chief attraction of the village in summer.
