simpleMeaning: the act of looking at something with care and without hurrying
scope: The act of looking with care and without hurrying, not something you say or write after thinking
  and not the facts you learn by looking.
examples:
- Careful observation of the birds took all morning.
- The nurse kept the baby under observation for a day.
