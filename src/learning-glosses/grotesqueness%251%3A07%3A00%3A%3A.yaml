simpleMeaning: how strange and twisted something looks when its shape is odd and wrong, so that it makes
  people laugh
scope: This is how strange and twisted something looks when its shape is odd and wrong; grotesquerie and
  grotesquery are other names for it, not only plain ugliness and not a joke told for fun.
examples:
- The grotesqueness of the old masks made the children laugh nervously.
- Critics wrote about the grotesqueness of the twisted statues in the garden.
