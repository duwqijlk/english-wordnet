senseId: 'existent%3:00:00::'
synsetId: 00930258-a
simpleMeaning: being real; truly there in fact and not only in thought
scope: Also called existing. This is the general sense of being real in fact. It is not limited to the
  narrower sense of being real now rather than only possible.
examples:
- The existent machinery in the factory is old but still works.
- Few existent copies of the old book are still known.
