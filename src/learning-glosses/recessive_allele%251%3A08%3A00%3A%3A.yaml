senseId: 'recessive_allele%1:08:00::'
synsetId: 05445891-n
simpleMeaning: Hidden unless its pair matches it, this gene part shows its mark on the body only when
  the other part of the pair is the same.
scope: Also called a recessive, it is one gene part of a pair, and its mark shows only when the other
  part matches it.
examples:
- A recessive allele can be passed on without its mark ever showing.
- Two matching gene parts let a recessive allele show its mark.
