simpleMeaning: In a set, unchanging way.
scope: This sense is also called unassailably and unchangeably, for a set, unchanging way, unlike the
  sense for a fixed, unchanging way, and unlike the sense for a firm, unchanging way.
examples:
- They spoke unalterably, in a set way.
- They stood unalterably, unchanging.
