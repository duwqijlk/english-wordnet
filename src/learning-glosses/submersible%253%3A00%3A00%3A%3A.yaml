simpleMeaning: able to be put under water, or to work while under water
scope: For a thing that can be put under water or work while under water; this word describes the thing,
  it is not the name of a small underwater boat itself.
examples:
- They used a submersible pump to clear water from the cellar.
- This submersible light still works deep under water.
