simpleMeaning: The part of the study of how the mind works that looks at how people work through hard
  questions
scope: This is the field of study that looks at how people work through hard questions, not the act of
  working through one hard question and not the study of memory.
examples:
- Problem solving is the part of psychology she studies at university.
- His research in problem solving looks at how children work through hard questions.
