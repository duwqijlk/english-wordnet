simpleMeaning: a supposed cure for every illness or trouble, once looked for by alchemists, people who
  tried to turn metals into gold
scope: A supposed cure for every illness or trouble; also called panacea, catholicon and cure-all, not
  a real medicine that works and not a cure for one illness only.
examples:
- The salesman sold his nostrum as a cure for every ill.
- No nostrum can cure all diseases.
