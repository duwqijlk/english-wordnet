simpleMeaning: A long table in a shop where small sewing things such as buttons and thread are sold.
scope: The part of a shop that sells small sewing things; not the till where you pay, and not a stall
  selling cloth.
examples:
- She found the buttons she needed at the notions counter.
- The notions counter in the old shop also sold pins and ribbons.
