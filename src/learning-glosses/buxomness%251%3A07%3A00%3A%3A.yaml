simpleMeaning: The state of being pleasingly plump, full of life and strength, and, for a woman, full-chested.
scope: A pleasing fullness of body with life and strength, not mere fatness and not weakness.
examples:
- Her buxomness showed in her round, lively figure.
- The portrait praised her buxomness, her plump and lively form.
