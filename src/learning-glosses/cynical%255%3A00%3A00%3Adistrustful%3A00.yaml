simpleMeaning: Thinking the worst of people and their aims, and doubting with scorn that anyone acts without
  selfish aims
scope: Believing the worst of people and doubting their good aims; not simple doubt and not anger at one
  person.
examples:
- His cynical view of politicians made him doubt every promise.
- She gave a cynical smile when he spoke of helping others.
