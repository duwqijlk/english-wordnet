schema: oewn-learning-gloss-v2
senseId: 'indiscreet%3:00:00::'
synsetId: 00776668-a
simpleMeaning: not careful about what you say or do, and not showing good sense in your choices
scope: This sense means not careful in words or acts and poor in judgment; it is not about a thing that
  is not split into separate parts, and not just about talking a lot.
examples:
- It was indiscreet of him to tell everyone her secret.
- She made an indiscreet remark about her boss at work.
