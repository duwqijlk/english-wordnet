simpleMeaning: to send out a lot of something at once, in fact or in words
scope: To send out a great amount of something, whether real or in words, not to throw up food from the
  stomach.
examples:
- The volcano spews out molten rocks every day.
- The editors of the paper spew out hostile articles about the Presidential candidate.
