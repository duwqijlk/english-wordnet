simpleMeaning: Usually marked off in centimetres and millimetres, this straight bar for measuring is one
  standard unit long
scope: 'Also called a metrestick: a straight bar one standard unit long for measuring, not a tape and
  not a ruler with no fixed length.'
examples:
- She held the meterstick against the wall to mark the height.
- The teacher drew a straight line with a meterstick.
