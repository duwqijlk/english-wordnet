simpleMeaning: A Roman building style that joins the leaves of a plant called acanthus, used in the Corinthian
  style, with the spiral scrolls of the Ionic style.
scope: This is a Roman building style, not the Corinthian or the Ionic style on its own; it joins parts
  of both.
examples:
- The temple uses the Composite order on its tall columns.
- The Composite order joins leaves and scrolls in one style.
