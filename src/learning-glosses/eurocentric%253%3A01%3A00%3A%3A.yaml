synsetId: 02726837-a
simpleMeaning: Said of things that give most of their thought to Europe and the Europeans.
scope: Also called Europocentric, this word marks a view that puts Europe first, not a view that looks
  at the whole world.
examples:
- His Eurocentric view of history left out Asia and Africa.
- The Eurocentric map put Europe at the centre of the world.
