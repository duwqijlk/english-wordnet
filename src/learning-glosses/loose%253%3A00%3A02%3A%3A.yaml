simpleMeaning: With its separate pieces spread out rather than pressed tightly together.
scope: This describes how a material's parts are spread and packed, not how tightly something is fastened,
  and not a texture full of small openings.
examples:
- The soil was loose and easy to dig.
- His boots skidded on the loose gravel.
