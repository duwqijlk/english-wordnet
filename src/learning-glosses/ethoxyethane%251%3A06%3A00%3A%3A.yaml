simpleMeaning: Quick to turn to gas and quick to catch fire, this clear liquid was once breathed in to
  put people to sleep.
scope: Also called ether, diethyl ether, divinyl ether, ethyl ether, and vinyl ether, this is a clear
  liquid that turns to gas quickly, catches fire easily, and was once breathed in to put people to sleep.
examples:
- Ethoxyethane was once used to put patients to sleep.
- The nurse kept the ethoxyethane away from flames.
