simpleMeaning: an occasion when an enemy plane, ship, tank, or missile is destroyed.
scope: It is not the act of taking a person's life; it is a military count of destroyed enemy equipment.
examples:
- The pilot scored three kills in one mission.
- The report listed the number of kills for the month.
