simpleMeaning: A lasting liquid that stays in cloth after washing, used to mark clothes, sheets, and other
  cloth things
scope: A lasting liquid that stays in cloth after washing, used to mark clothes, sheets, and other cloth
  things; not ordinary ink that washes out and not paint.
examples:
- She used marking ink to put his name on his shirts.
- The marking ink stayed in the cloth after many washes.
