simpleMeaning: Now grown wild in the United States, this plant came from the south and west of Europe,
  its stems smelling of round fruit.
scope: Also called apple mint, this plant came from southern and western Europe and now grows wild in
  the United States.
examples:
- The damp bank was thick with applemint.
- The gardener cut applemint to scent the room.
