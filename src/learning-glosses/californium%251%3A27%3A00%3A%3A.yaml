simpleMeaning: An element that gives off rays, heavier than uranium, found by striking curium with helium
  nuclei.
scope: Also called Cf and atomic number 98, it is a heavy element that gives off rays, found by striking
  curium with helium nuclei, and uranium and curium are the nearest elements a reader might mix it with.
examples:
- Californium was first found by striking curium with helium nuclei.
- Californium gives off rays like other heavy elements.
