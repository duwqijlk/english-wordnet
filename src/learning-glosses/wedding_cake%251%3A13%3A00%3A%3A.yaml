simpleMeaning: a rich sweet baked food with two or more layers, covered with frosting and pretty shapes
  and served at the party after a marriage
scope: 'Also called a bridecake: a rich sweet baked food with two or more layers, served at the party
  after a marriage, not a plain cake for everyday meals and not food served during the wedding itself.'
examples:
- The wedding cake had three tiers and white frosting with small flowers on top.
- They cut the wedding cake together at the reception while their guests watched.
