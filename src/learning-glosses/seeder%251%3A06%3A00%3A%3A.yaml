simpleMeaning: a kitchen tool that takes the small hard centres out of fruit
scope: A kitchen tool for taking the hard centres out of fruit; not a machine that sows grain in a field.
examples:
- Use a seeder to take the pips out of the cherries.
- She pressed the seeder into the halved pepper to remove the centres.
