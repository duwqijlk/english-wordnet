simpleMeaning: a news person who is paid to write or report news stories for a newspaper or for radio
  or television
scope: A news person who sends stories to a newspaper or station, not the word for things that are alike
  in some ways, and not a person who writes letters.
examples:
- The correspondent in Paris sent a report about the floods.
- She works as a foreign correspondent for a big newspaper.
