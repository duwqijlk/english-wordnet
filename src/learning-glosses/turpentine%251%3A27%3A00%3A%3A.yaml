simpleMeaning: an oleoresin (a thick, sticky substance that comes from trees) got from trees that have
  cones, especially pine trees
scope: This is the thick, sticky substance as it comes from the tree, not the thin liquid made from it
  that is used to thin paint and clean brushes.
examples:
- Workers cut the bark and collected turpentine from the pine trees.
- Turpentine taken straight from the tree is thick and sticky.
