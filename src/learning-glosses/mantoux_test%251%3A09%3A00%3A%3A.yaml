simpleMeaning: Liquid made from tuberculosis germs is put under the skin; a red patch in 1 to 3 days means
  past or present contact with them and more checks are needed
scope: A skin check for tuberculosis, in which a liquid made from tuberculosis germs is put under the
  skin and a red patch shows exposure.
examples:
- The Mantoux test showed a red patch two days after the injection.
- She had a Mantoux test to check for tuberculosis.
