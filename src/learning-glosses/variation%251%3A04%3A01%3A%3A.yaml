senseId: 'variation%1:04:01::'
synsetId: 00196043-n
simpleMeaning: the act of making a small change to something, so it is no longer quite the same as usual,
  but the change is easy to see
scope: A small but clear change from what is usual, not a made thing that differs from the usual kind
  and not a change in a planet's path or a musical theme.
examples:
- Who is responsible for these variations in taxation?
- A slight variation in the recipe changed the taste.
