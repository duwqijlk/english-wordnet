simpleMeaning: a piece of work that someone, such as a teacher, has given you to do
scope: This is a piece of work given to you to do, such as school work from a teacher; it is not a duty
  given as a job, especially in the armed forces, and not the act of giving things out to people or places.
examples:
- The teacher gave us a history assignment to finish by Friday.
- My first assignment was to write a short story about my town.
