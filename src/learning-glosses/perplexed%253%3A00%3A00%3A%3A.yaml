simpleMeaning: At a loss because things are hard to work out and your thoughts are mixed up.
scope: At a loss from hard questions and mixed-up thoughts, not merely surprised and not unable to speak.
examples:
- She was perplexed by the strange letter and read it twice.
- The perplexed crowd stared at the broken sign in silence.
