synsetId: 14671413-n
simpleMeaning: A common element, not metal, most often a gas with no colour, smell or taste, unreacting,
  two atoms joined; 78 in 100 of the air, and in every living thing.
scope: Not oxygen, the gas we breathe, nor any other gas of the air; also called N and atomic number 7.
examples:
- Nitrogen makes up most of the air we breathe.
- Plants need nitrogen to grow.
