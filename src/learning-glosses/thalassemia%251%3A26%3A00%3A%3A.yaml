simpleMeaning: a blood illness that runs in families, in which the body makes faulty hemoglobin, the part
  of the blood that carries oxygen
scope: 'Also called thalassaemia: a blood illness that runs in families, not a blood illness caused by
  a lack of iron and not one caused by blood loss.'
examples:
- The thalassemia in his family came from his grandparents.
- She was tested for thalassemia after her brother was found to have it.
