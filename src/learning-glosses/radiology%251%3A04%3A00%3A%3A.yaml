simpleMeaning: looking at the inside parts of things that light cannot pass through, by using X-rays or
  other rays that can go through things
scope: Also called radioscopy. This is the act of looking inside things with X-rays, not the wider study
  of using X-rays in medicine.
examples:
- Radiology showed a crack inside the metal part.
- They used radiology to look inside the closed box.
