simpleMeaning: A wide black stripe runs down each side of this big wild animal of South Africa, an animal
  of the antelope kind
scope: A big wild animal of South Africa, of the antelope kind, also called a gemsbuck, not a smaller
  antelope with no black stripe down its sides and not a farm animal.
examples:
- A gemsbok stood in the dry grass at the edge of the herd.
- We saw a gemsbok with a wide black band along its side.
