simpleMeaning: In astronomy, the point on the sky where day and night are equal, found in the group of
  stars called Virgo
scope: The autumn point where day and night are equal, in the stars called Virgo, not the spring point
  and not the longest day of the year.
examples:
- The autumnal equinox falls in late September each year.
- On the autumnal equinox, day and night last about the same length of time.
