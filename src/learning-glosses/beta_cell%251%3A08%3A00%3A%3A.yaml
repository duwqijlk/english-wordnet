simpleMeaning: A tiny living thing in one part of the pancreas that makes insulin, a body chemical that
  controls sugar in the blood.
scope: A tiny living thing in the pancreas that makes insulin; not a blood cell and not a nerve cell.
examples:
- A beta cell makes the insulin her body needs.
- When beta cells stop working, sugar stays too high in the blood.
