senseId: 'simulacrum%1:07:00::'
synsetId: 04686069-n
simpleMeaning: A faint and unclear likeness of a thing, with no solid substance to it.
scope: A faint, unclear likeness with little solid to it, not the real thing itself.
examples:
- The old photo was only a simulacrum of the lost painting.
- His smile was a mere simulacrum of joy.
