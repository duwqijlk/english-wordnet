simpleMeaning: The rule of Napoleon the Third in France from 1852 to 1870.
scope: It covers the years 1852 to 1870, when Napoleon III ruled France, not the earlier rule of Napoleon
  I.
examples:
- The Second Empire in France lasted from 1852 to 1870.
- Under the Second Empire, Napoleon the Third ruled France.
