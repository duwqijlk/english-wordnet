simpleMeaning: medical machines that do the work of key body parts for a very sick person, so the person
  can stay alive when they might not live without them
scope: This is medical equipment that keeps a very sick person alive; life support is another name for
  it, not a floating jacket and not a bed in a hospital ward.
examples:
- The patient is on a life-support system that breathes for him.
- Doctors kept her on the life-support system through the night.
