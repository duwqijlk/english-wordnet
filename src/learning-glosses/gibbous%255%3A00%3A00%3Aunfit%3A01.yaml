simpleMeaning: Like a back bent forward by something wrong with the bones of the spine, or having such
  a back.
scope: Like a back bent forward by something wrong with the bones of the spine, or having such a back,
  also called humped, humpbacked, hunchbacked, crookback, crookbacked, or kyphotic.
examples:
- After the illness, his back was gibbous, bent forward at the shoulders.
- The old man's spine was gibbous from years of stooping.
