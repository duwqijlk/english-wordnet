senseId: 'convex_polygon%1:25:00::'
synsetId: 13889247-n
simpleMeaning: a flat shape with straight sides that bulges out, so a longer side cuts no other side or
  corner, and any straight line cuts it in at most two points
scope: This is a shape with straight sides that bulges out, not a shape with a dent in it and not a shape
  with curved sides.
examples:
- A square is a convex polygon with four straight sides.
- A stop sign is a convex polygon with eight straight sides.
