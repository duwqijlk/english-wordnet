simpleMeaning: hiding what something really is, so that people are led the wrong way
scope: 'Also called disguised or cloaked: hiding its true nature to mislead, not marked with a pattern
  like a face mask.'
examples:
- A masked threat arrived in the letter, with no name on it.
- His masked anger hid what he really felt.
