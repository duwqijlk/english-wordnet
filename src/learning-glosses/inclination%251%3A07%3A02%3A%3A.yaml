simpleMeaning: the way a line or surface leans away from straight up
scope: The way a line or surface leans away from straight up; list, lean, leaning and tilt are other names
  for this sense, not a liking for something and not the act of bending forward.
examples:
- The tower had a pronounced inclination to the right.
- The ship developed an inclination to starboard.
