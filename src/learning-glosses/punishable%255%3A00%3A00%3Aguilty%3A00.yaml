schema: oewn-learning-gloss-v2
senseId: punishable%5:00:00:guilty:00
synsetId: 01325798-s
simpleMeaning: able to be made to suffer for doing wrong, or deserving to be made to suffer for doing
  wrong
scope: This is a person or act that can be, or deserves to be, made to suffer for doing wrong, in any
  setting; the nearest other sense is narrower, about an act that the law says can be punished.
examples:
- She felt her son's cruel act was punishable and that he should lose his free time for a week.
- A child who steals may be thought punishable, even when no law is part of it.
