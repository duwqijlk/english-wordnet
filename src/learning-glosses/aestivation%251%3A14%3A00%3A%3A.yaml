simpleMeaning: Inside a flower bud that has not yet opened, the outer flower leaves, called sepals, and
  the inner ones, called petals, sit in a set way.
scope: This is also called estivation, and it is about how flower parts sit in a bud, not about an animal
  resting through the summer.
examples:
- In aestivation, the petals lay in a set way inside the bud.
- Aestivation kept the flower leaves in their set way until the bud opened.
