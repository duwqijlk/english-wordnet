simpleMeaning: A set of steps from the Middle Ages in which a bony figure that stands for the end of life
  leads a line of people to the grave.
scope: This is a medieval show in which a bony figure leads people to the grave, also called danse macabre,
  not a real dance for fun or a play about death in general.
examples:
- The dance of death was acted out in the town square.
- In the dance of death, a skeleton leads the people to the grave.
