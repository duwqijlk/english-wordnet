senseId: 'state_of_war%1:26:00::'
synsetId: 14004888-n
simpleMeaning: a time fixed by law, begun when fighting is formally declared and ended when it is formally
  declared over, in which rules agreed between nations for fighting apply
scope: A time fixed by law between formal declarations, in which the rules agreed between nations for
  fighting apply; not a single battle, and not fighting without a formal declaration.
examples:
- A state of war was declared in November.
- The state of war ended with the peace treaty.
