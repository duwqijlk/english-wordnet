simpleMeaning: After surgery has cut one away, a soft form is put in place to take its place and make
  the chest look full again.
scope: A breast implant is a soft form put in by surgery to take the place of a breast cut away and make
  the chest look full again.
examples:
- A breast implant was put in place after the breast was cut away.
- With the breast implant in place, the chest looked full again.
