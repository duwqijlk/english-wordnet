simpleMeaning: the largest meat-eating animal of Madagascar, in some ways between a civet and a small
  furry meat-eating animal
scope: This is the largest meat-eating animal of Madagascar; fossa is another name for it, not a true
  cat and not a civet.
examples:
- The fossa cat stalked its prey through the forest.
- We saw a fossa cat at the zoo in Madagascar.
