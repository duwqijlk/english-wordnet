scope: Also called Sioux; a member of a group of North American Indian peoples who spoke a Siouan tongue,
  not the Siouan family of languages itself.
examples:
- A Siouan elder told stories of the old trails.
- The Siouan peoples once ranged from Lake Michigan to the Rocky Mountains.
