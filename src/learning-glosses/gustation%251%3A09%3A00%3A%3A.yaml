simpleMeaning: The power to tell sweet, sour, bitter and salty tastes apart in the mouth
scope: This is the power to tell sweet, sour, bitter and salty tastes apart in the mouth; taste, gustatory
  modality and sense of taste are other names for this sense, not the sense of smell and not the act of
  eating.
examples:
- His cold took away his gustation for a week.
- Gustation lets us enjoy the sweetness of fruit.
