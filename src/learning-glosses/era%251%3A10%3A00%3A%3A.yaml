simpleMeaning: In baseball, a count of how well a pitcher does; it is the mean count of earned runs given
  up by the pitcher for each nine innings pitched.
scope: A baseball count, also called an earned run average; not a long stretch of time, and not any other
  count.
examples:
- His ERA was 2.50 last year.
- ERA measures a pitcher's work.
