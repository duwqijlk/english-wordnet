simpleMeaning: 'Real deceit: a person hides the truth or says what is false, with a bad aim to hurt another.'
scope: Real cheating done to hurt another, with a bad aim; not cheating that the law only takes as cheating,
  and not a mere mistake.
examples:
- His fraud in fact was proved by the letters he had hidden.
- The court found fraud in fact because he had meant to harm her.
