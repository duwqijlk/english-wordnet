simpleMeaning: for a ship to touch or hit the ground beneath the water, for example when it sails into
  water that is too shallow.
scope: This is not about the lowest part of something, and not about the underside of a ship as a thing;
  it describes a hull making contact with the ground under the water.
examples:
- The freighter bottomed on a sandbank and had to wait for the tide.
- The ship bottomed on the reef, but the crew managed to refloat her at high tide.
