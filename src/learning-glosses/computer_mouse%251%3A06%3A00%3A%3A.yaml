simpleMeaning: A ball on its underside rolls on the pad as this small electric tool, moved by hand, shifts
  the mark on the screen.
scope: Also called mouse, this is the small electric tool moved by hand on a pad to move the mark on the
  screen.
examples:
- The computer mouse moved the mark across the screen.
- I slid the computer mouse on its pad.
