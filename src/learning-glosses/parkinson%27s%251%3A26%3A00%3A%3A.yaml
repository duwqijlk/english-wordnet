simpleMeaning: A sickness that slowly breaks down the middle of the nervous system, marked by shaking
  and by weak control of the muscles
scope: This is a sickness that slowly breaks down the nervous system, also called paralysis agitans, shaking
  palsy, Parkinson's disease, Parkinson's syndrome and Parkinsonism, not a sudden injury to the brain.
examples:
- Parkinson's makes his hands shake.
- She has Parkinson's and finds it hard to control her muscles.
