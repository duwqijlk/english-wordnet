simpleMeaning: Small sea crustaceans (animals with hard outer cases) that sweep food with feathery limbs;
  they swim free when young, then grow a hard shell and cling to underwater surfaces.
scope: The shelled sea animal, not the northern goose that shares the name; cirriped and cirripede are
  other names for this creature.
examples:
- Barnacles covered the rocks below the high tide line.
- A barnacle starts life as a free-swimming larva.
