simpleMeaning: World body of 1920 for peace and work together among countries; Woodrow Wilson's idea,
  the United States never joined, it stayed weak and ended in 1946 after its successor formed.
scope: A world body of 1920 that worked for peace among countries; its near kin are other world bodies,
  such as the United Nations, formed after it ended.
examples:
- The League of Nations was formed in 1920.
- The League of Nations ended in 1946.
