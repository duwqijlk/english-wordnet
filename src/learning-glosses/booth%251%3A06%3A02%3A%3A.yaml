simpleMeaning: a table in a restaurant or bar, with two long seats with high backs, one on each side
scope: This is a place to sit and eat at a table in a restaurant or bar, not a small closed space where
  one person votes, makes a call, or sells things.
examples:
- We sat in a booth by the window and ordered lunch.
- The four friends slid into a booth at the back of the bar.
