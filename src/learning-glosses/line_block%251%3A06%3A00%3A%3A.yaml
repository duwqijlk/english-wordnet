simpleMeaning: A hard piece with a picture cut or etched into it
scope: 'Also called a line engraving and a linecut: a hard piece with a picture cut or etched into it,
  not a flat plate with a picture drawn on it and not a stamp with raised letters.'
examples:
- The artist made a line block of the old mill for the book.
- This line block was cut by hand and still prints well.
