simpleMeaning: a person who sells cover that pays when something is lost or harmed
scope: A person who sells cover that pays for loss or harm; insurance broker is another name for this
  sense; not a person who buys the cover, and not a person who settles a claim.
examples:
- Our insurance agent helped us choose a plan for the house.
- She called her insurance agent after the storm damaged the roof.
