senseId: 'inversion%1:11:00::'
synsetId: 07440326-n
simpleMeaning: In genetics, a change in which the genes in a stretch of a chromosome come in the opposite
  order.
scope: In genetics, a change in which the genes in a stretch of a chromosome come in the opposite order,
  not the change in the order of notes in a tune, not the chemical change in how a substance turns light,
  not an organ turned inward, not taking on the other sex's role, and not a layer of warm air over cool
  air.
examples:
- The inversion changed the order of the genes in that part of the chromosome.
- Scientists found an inversion in the fruit fly's chromosome.
