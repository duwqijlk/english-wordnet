simpleMeaning: A small sliding measure that moves along a main measure and shows small parts of its divisions.
scope: A small sliding measure that shows small parts of a main measure; vernier is another name for this
  sense; not a ruler and not a fixed measure.
examples:
- She read the vernier scale to find the small part of the division.
- The vernier scale moves along the main scale.
