simpleMeaning: Cooked till its base is firm, then turned over into another pan to cook the top, this Italian
  dish like a thick omelette has cut up vegetables and meats
scope: An Italian dish like an omelette, not a thin omelette folded in half.
examples:
- She made a frittata with vegetables and ham for lunch.
- He turned the frittata over into another pan to cook the top.
