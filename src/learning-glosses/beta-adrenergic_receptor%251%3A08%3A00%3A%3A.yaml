simpleMeaning: Receptors thought to be on nerve cell walls in the sympathetic nerves, explaining why certain
  drugs touch only some of its deeds, like widened blood vessels and a faster heartbeat.
scope: Also called beta-adrenoceptor and beta receptor, receptors thought to be on nerve cell walls in
  the sympathetic nerves, explaining why certain drugs touch only some of its deeds, like widened blood
  vessels and a faster heartbeat.
examples:
- Beta-adrenergic receptors sit on nerve cells.
- Beta-adrenergic receptor explains drug effects.
