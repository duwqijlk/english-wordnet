senseId: 'immunizing_agent%1:06:00::'
synsetId: 03567919-n
simpleMeaning: any substance or living thing that starts the body's defence when put into the body, giving
  protection against sickness
scope: Any substance or living thing that starts the body's defence when put into it; immunogen is another
  name for this sense, not a drug that kills germs directly and not a vitamin.
examples:
- The vaccine works as an immunizing agent in the body.
- An immunizing agent trains the body to fight the sickness.
