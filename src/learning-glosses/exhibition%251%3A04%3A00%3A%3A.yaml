simpleMeaning: the act of showing something, such as a skill or a piece of work, so that people can see
  it
scope: The act of showing something, not a collection of things put on show for the public.
examples:
- The exhibition of her paintings drew a large crowd.
- His exhibition of skill on the piano left the audience amazed.
