simpleMeaning: the metal part of an engine that holds its cylinders and cooling passages
scope: This is the metal engine part that holds the cylinders, not a grooved wheel for a rope, and not
  the act of obstructing a person.
examples:
- The engine block was cracked and had to be replaced.
- Coolant circulates through passages inside the block.
