simpleMeaning: What keeps a nut from working loose is this washer
scope: 'Also called lock washer and lockring: a washer that keeps a nut from coming loose, not a ring
  worn on a finger and not a plain washer with no such job.'
examples:
- The lock ring kept the nut from loosening on the bolt.
- He slipped a lock ring under the nut before he tightened it.
