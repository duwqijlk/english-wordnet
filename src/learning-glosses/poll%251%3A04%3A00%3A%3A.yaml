simpleMeaning: the act of counting votes to see who got the most, such as in an election
scope: The counting of votes, such as in an election, not a survey that asks people what they think and
  not a count of heads.
examples:
- The poll showed a clear win for the mayor.
- Workers finished the poll late on election night.
