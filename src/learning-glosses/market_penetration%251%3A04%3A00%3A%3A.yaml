simpleMeaning: How far a thing for sale is known and bought by buyers in one place where goods are sold
scope: How widely a thing for sale is known and bought in one place, not how good the thing is and not
  how much it costs.
examples:
- The market penetration of the new phone grew fast in its first year.
- Market penetration was slow in the north of the country.
