synsetId: 00039730-r
simpleMeaning: in a way that is clear and leaves no doubt; 'plain' is often used in everyday talk for
  'plainly'
scope: Another name for obviously, apparently, plain, evidently, plainly and manifestly. It means clearly
  and without doubt, not in a hidden way or in a way that only seems to be true.
examples:
- It was patently clear that he had not done the work.
- Her story was patently false, and everyone knew it.
