simpleMeaning: An electronic device that makes the quiet parts of a sound quieter, so the gap between
  loud and quiet parts grows.
scope: An electronic device that widens the gap between loud and quiet sounds; not a device that only
  makes sound louder and not a device that records sound.
examples:
- The engineer used an expander to widen the dynamic range.
- An expander made the quiet notes even quieter.
