simpleMeaning: having an even surface, with no bumps, ridges or uneven patches
scope: This describes a physical surface that is even to the touch, not steady movement, a leaf edge without
  teeth, or water lying calm.
examples:
- The tabletop was smooth and cool under her fingers.
- He ran his hand over the smooth fabric of the coat.
