simpleMeaning: of small bits not mixed into a liquid or gas, held up by the liquid or gas and kept from
  sinking or falling, with nothing seen holding them
scope: About small bits held up in a liquid or gas. Not about work stopped for a time, and not about a
  thing hanging from above.
examples:
- Dust particles stayed suspended in the air.
- Tiny bits of mud were suspended in the water.
