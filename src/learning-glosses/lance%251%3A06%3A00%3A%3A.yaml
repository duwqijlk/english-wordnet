simpleMeaning: a long thin stick or pole with a sharp point at one end, used as a tool or as a thing to
  fight with
scope: 'Also called spear and shaft: this is a long pole with a sharp point, not the fishing tool with
  a hooked point and not a doctor''s small knife.'
examples:
- The knight held his lance as he rode toward the other rider.
- The old lance was made of wood with a metal point.
