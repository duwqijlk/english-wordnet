simpleMeaning: so bad or wrong that it deserves strong criticism or blame.
scope: This is not a person who breaks the law, and not the legal sense of being against the law; it describes
  an action or situation that deserves sharp blame.
examples:
- It is criminal to let that much food go to waste.
- Charging such prices for clean water is simply criminal.
