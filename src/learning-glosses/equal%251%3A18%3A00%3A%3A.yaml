simpleMeaning: a person who has the same place or rank as another person in a group
scope: A person at the same level as another person in a group, not the verb that means to be as good
  as something, and not making things the same.
examples:
- She speaks to the other team leaders as an equal, not as someone lower.
- In this group, every member is treated as an equal.
