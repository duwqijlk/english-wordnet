simpleMeaning: doing what is right and fair, in line with what most people take to be good and just
scope: Doing what is right and fair by the rules most people accept, not merely law-abiding and not self-righteous.
examples:
- The righteous judge refused the bribe.
- He led a righteous life, helping the poor.
