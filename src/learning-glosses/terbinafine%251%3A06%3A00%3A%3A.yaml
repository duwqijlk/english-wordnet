simpleMeaning: a drug taken by mouth, sold as Lamisil, that kills the fungus that harms nails
scope: A drug taken by mouth for nail fungus; not a cream for skin fungus and not another nail drug.
examples:
- Her doctor gave her terbinafine for her infected toenails.
- Terbinafine is taken as a pill, not put on the skin.
