simpleMeaning: an oil made from petroleum that catches fire easily and is burned in lamps and heaters
scope: An oil that burns easily and gives light and heat in lamps and heaters, not petrol for cars and
  not gas for cooking.
examples:
- She filled the lamp with kerosene before dark.
- The heater ran on kerosene all winter.
