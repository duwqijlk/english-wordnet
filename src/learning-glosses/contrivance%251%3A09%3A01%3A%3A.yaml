simpleMeaning: the power to think of new ideas and the skill of finding new ways to solve problems
scope: This sense is a person's skill at thinking of new ideas, not a plan made to trick people and not
  a device made for a job.
examples:
- His contrivance helped him find a new answer to every problem.
- Her contrivance let her think of a way out of every hard problem.
