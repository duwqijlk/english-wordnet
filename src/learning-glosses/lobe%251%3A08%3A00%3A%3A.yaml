simpleMeaning: In anatomy, a part of an organ or other part of the body that is somewhat round in shape
  and set apart from the rest
scope: In anatomy, this is a rounded part of an organ, not a part of a leaf and not the stronger signal
  of an antenna in one direction.
examples:
- The doctor pointed to the lower lobe of the lung.
- The ear lobe is the soft, round part at the bottom of the ear.
