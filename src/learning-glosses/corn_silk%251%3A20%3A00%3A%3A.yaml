simpleMeaning: a soft bunch of long, thread-like strands grows at the tip of an ear of maize
scope: These are the long, thread-like strands that grow in a soft bunch at the tip of an ear of maize;
  cornsilk is another name for them.
examples:
- The corn silk at the tip of the ear was long and thread-like.
- Corn silk grows in a soft bunch at the end of an ear of maize.
