simpleMeaning: A compound loses its oxygen, joins with hydrogen to form a hydrogen compound, or gains
  electrons.
scope: This is also called reduce and deoxidise, and means taking oxygen out of a substance, not putting
  oxygen in.
examples:
- The factory deoxidizes the ore before smelting it.
- He deoxidized the compound by adding hydrogen to it.
