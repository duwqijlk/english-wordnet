simpleMeaning: A living thing common in fresh and salt water, seen near the shore in great masses of water
  plants.
scope: Also called cryptomonad; a water creature, not a seaweed and not a fish.
examples:
- Cryptophytes appeared along the shore in great masses.
- The cryptophyte lives in both fresh and salt water.
