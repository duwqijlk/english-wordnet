simpleMeaning: a part in a machine that takes in the force of sudden pushes or hits and makes them weaker
scope: 'Also called a shock: this is a machine part that takes in sudden pushes, not a soft bag to sit
  on and not the layer of air that holds up a vehicle that travels on air.'
examples:
- The cushion in the machine took in the hit and kept the frame safe.
- A worn cushion let every sudden push shake the whole car.
