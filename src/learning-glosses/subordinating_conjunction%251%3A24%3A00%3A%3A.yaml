senseId: 'subordinating_conjunction%1:24:00::'
synsetId: 13822008-n
simpleMeaning: the way a joining word makes one part of a sentence belong inside another part
scope: The way one part of a sentence is put inside another by a joining word, not two parts joined side
  by side and not a word that joins words of the same kind.
examples:
- A subordinating conjunction joins a smaller part of a sentence to the main part.
- In 'I will stay when the rain stops', the subordinating conjunction 'when' puts one part inside another.
