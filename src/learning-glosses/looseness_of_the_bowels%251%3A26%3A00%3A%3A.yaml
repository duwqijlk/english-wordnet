simpleMeaning: often passing watery waste from the gut; it can be a sign of infection, food poisoning,
  colitis, or a growth in the gut
scope: Often passing watery waste from the gut, also called diarrhea, diarrhoea, and looseness, not a
  one-time stomach upset and not a blockage of the gut.
examples:
- His looseness of the bowels lasted for two days after the bad meal.
- Looseness of the bowels can be a sign of food poisoning.
