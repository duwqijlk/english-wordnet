simpleMeaning: In baseball, a high ball that drops in the gap between the inner and outer fielders.
scope: In baseball, a short, soft hit that drops into the open space between the inner and outer fielders,
  closer to a bloop hit than to a hard line drive or a deep fly ball.
examples:
- He hit a Texas leaguer that dropped just past the infield.
- The Texas leaguer fell between the shortstop and the left fielder.
