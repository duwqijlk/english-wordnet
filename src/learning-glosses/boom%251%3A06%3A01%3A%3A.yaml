simpleMeaning: a long pole that holds a microphone over the heads of actors on a film or television set
scope: A long pole holding a microphone over a film set, not a pole on a boat and not a loud sound.
examples:
- The boom dipped low over the actors during the scene.
- The sound man held the boom above the two speakers.
