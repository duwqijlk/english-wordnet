simpleMeaning: a yearly climbing or bushy growth grown for the seeds or pods people eat
scope: A yearly climbing or bushy growth grown for its seeds or pods; common bean is another name for
  this sense; not a tree, and not a growth kept for its flowers.
examples:
- We grew common bean plant along the fence.
- The common bean plant bore pods all summer.
