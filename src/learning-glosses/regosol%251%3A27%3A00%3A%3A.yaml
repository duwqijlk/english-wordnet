simpleMeaning: Fresh sand or soil left by water, still loose with nothing packed firm, makes up this kind
  of earth.
scope: It is a loose earth of fresh sand or soil left by water, with nothing packed firm in it.
examples:
- The regosol by the river was loose and freshly laid down.
- The loose earth they dug was regosol.
