simpleMeaning: Some birds have this extra feather, usually small, tucked under the base of the stem of
  one of their feathers.
scope: This small extra feather sits under the base of a feather's stem, apart from the main feather.
examples:
- The aftershaft on the bird's feather was barely visible.
- A close look at the base of a wing feather showed an aftershaft tucked underneath.
