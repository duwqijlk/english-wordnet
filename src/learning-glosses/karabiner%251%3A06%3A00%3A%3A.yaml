simpleMeaning: Climbers fasten a rope to a metal spike driven into rock, or join two ropes, with this
  oblong metal ring that has a spring clip.
scope: People also call it a carabiner or a snap ring.
examples:
- The climber clipped the rope to a karabiner.
- A karabiner joined the two ropes.
