senseId: 'corpus_luteum%1:08:00::'
synsetId: 05526265-n
simpleMeaning: After an egg leaves the ovary, yellow tissue that makes hormones forms in the burst sac
  it left, then breaks down within days unless a baby has started to grow.
scope: It is the yellow tissue left after an egg is set free, not the egg sac itself and not the ovary.
examples:
- The corpus luteum breaks down if no pregnancy begins.
- Doctors check the corpus luteum after an egg is released.
