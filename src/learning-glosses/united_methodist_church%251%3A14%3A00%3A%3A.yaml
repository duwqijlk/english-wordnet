simpleMeaning: A coming together of the Wesleyan branch and the Evangelical branch of Brethren.
scope: A Christian group made by joining two older groups; not the Wesleyan group on its own and not the
  Evangelical Brethren on their own.
examples:
- The United Methodist Church was formed by a union.
- She worships at the United Methodist Church.
