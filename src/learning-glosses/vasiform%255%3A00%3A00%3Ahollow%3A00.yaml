simpleMeaning: Made up of a tube, or having hollow tubes that fluids can pass through.
scope: Made of tubes or tube-shaped, with tubular, tubelike, cannular and tube-shaped as other names for
  it; not a solid rod and not a flat sheet.
examples:
- The vasiform parts of the plant carry water through hollow tubes.
- A vasiform shape lets fluids pass through the stem.
