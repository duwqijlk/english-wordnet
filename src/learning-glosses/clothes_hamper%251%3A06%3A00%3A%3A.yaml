simpleMeaning: a bin that keeps dirty garments until they are washed, or wet ones until they dry
scope: A bin for dirty or wet garments waiting to be washed or dried; clothes basket, laundry basket and
  voider are other names for this, not a wash basin and not a place to keep clean garments.
examples:
- The clothes hamper in the bathroom is full again.
- He carried the clothes hamper down to the laundry room.
