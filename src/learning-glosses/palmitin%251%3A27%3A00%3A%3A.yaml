simpleMeaning: A made stuff formed when a sweet thick liquid joins with a fatty stuff
scope: A made stuff formed when a sweet thick liquid joins with a fatty stuff, not the fatty stuff itself
  and not a plain fat.
examples:
- Palmitin is found in palm oil and in butter.
- The chemist separated palmitin from the fat to study it.
