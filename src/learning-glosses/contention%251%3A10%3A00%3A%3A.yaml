simpleMeaning: speech that people argue over, or a strong disagreement between people
scope: A spoken argument where people disagree strongly, also called tilt, argument, arguing, controversy,
  and disputation; it is not a point that someone says is true, and not a struggle to win a prize.
examples:
- His rude remarks caused contention among the team.
- There was much contention between the two groups over the new plan.
