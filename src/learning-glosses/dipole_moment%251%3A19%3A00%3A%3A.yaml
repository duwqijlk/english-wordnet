simpleMeaning: a measure of a pair of opposite electric charges, based on how large the charges are and
  how far apart they sit
scope: A measure of a pair of opposite electric charges, based on the size of the charges and how far
  apart they sit, not the force between them.
examples:
- Water has a large dipole moment.
- The dipole moment of the molecule was measured in the lab.
