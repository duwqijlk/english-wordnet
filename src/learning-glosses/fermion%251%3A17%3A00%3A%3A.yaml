simpleMeaning: 'The Pauli rule bars it from sharing one state with another of its kind: any tiny bit of
  matter that follows the Fermi-Dirac rules is one'
scope: This bit of matter follows the Fermi-Dirac rules, unlike a boson, which can share one state with
  others of its kind.
examples:
- A fermion cannot share one state with another fermion of its kind.
- An electron is a fermion, and it follows the Fermi-Dirac rules.
