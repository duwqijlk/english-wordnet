simpleMeaning: Folk cures for aching or swollen joints use this plant of North America, which lives for
  years and bears pale pink flowers in loose bunches.
scope: 'Also called common dogbane and spreading dogbane: a North American plant with pale pink flowers
  in loose bunches, used in folk cures for aching or swollen joints, not the Canadian dogbane of the other
  sense.'
examples:
- The rheumatism weed grows in North America and bears pale pink flowers.
- Folk healers used rheumatism weed for aching joints.
