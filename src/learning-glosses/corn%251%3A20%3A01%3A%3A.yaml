simpleMeaning: In Britain, any of various grain plants, especially the main crop of a region — wheat in
  Great Britain or oats in Scotland and Ireland
scope: This is the British name for the cereal plants themselves, especially a region's main crop, not
  the dried grain used as feed and not the spirit distilled from grain.
examples:
- The farmers were busy harvesting the corn in the fields.
- Tall corn waved in the wind across the English countryside.
