scope: People also call it orthopteron and orthopterous insect; it is one of many insects with tough front
  wings, thin back wings and mouthparts made for chewing.
examples:
- The orthopteran chewed its food with mouthparts made for chewing.
- An orthopteran with tough front wings and thin back wings passed by.
