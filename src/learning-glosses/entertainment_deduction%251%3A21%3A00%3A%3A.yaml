simpleMeaning: a sum taken off an amount a business owes for some kinds of fun it gives to others as part
  of its work
scope: A sum taken off what a business owes for some kinds of fun given as part of its work, not a sum
  taken off for any kind of fun and not a free gift.
examples:
- The firm claimed an entertainment deduction for the dinner it gave its buyers.
- An entertainment deduction can cover only some kinds of business fun.
