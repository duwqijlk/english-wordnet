simpleMeaning: In the south, a cornmeal loaf is wrapped in cabbage leaves and baked where a fire has burned
  down.
scope: Also called ash cake, this southern dish is cornmeal baked in cabbage leaves in the hot remains
  of a fire.
examples:
- They ate ashcake hot from the ashes.
- The ashcake came out of the hot ashes wrapped in cabbage leaves.
