simpleMeaning: The type species of Listeria; it can cause meningitis, encephalitis, septicemia, endocarditis,
  abortion, abscesses, and listeriosis.
scope: Also called L. monocytogenes; the type species of the genus Listeria, capable of causing these
  infections and complications.
examples:
- Listeria monocytogenes can cause meningitis.
- Listeria monocytogenes was found in the cheese.
