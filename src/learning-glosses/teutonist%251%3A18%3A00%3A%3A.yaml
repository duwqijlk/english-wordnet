simpleMeaning: A person who studies the history of the Teutonic people or language, above all how they
  shaped the history of England.
scope: A student of the Teutonic peoples and their mark on England, close to historians of Rome, Greece
  and other peoples and languages.
examples:
- The Teutonist spent years on the history of the Teutonic people.
- As a Teutonist, she traced the Teutonic mark on the history of England.
