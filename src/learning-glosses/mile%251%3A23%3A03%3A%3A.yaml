simpleMeaning: an ancient Roman measure of distance equal to 1,620 yards.
scope: This Roman measure of 1,620 yards, also called a Roman mile, is shorter than the statute mile or
  the Swedish mile.
examples:
- The legion marched a Roman mile before making camp.
- The old road was reckoned in Roman miles.
