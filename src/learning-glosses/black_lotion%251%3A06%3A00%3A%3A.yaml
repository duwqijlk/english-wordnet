simpleMeaning: A mix of calomel and limewater, used on sores caused by syphilis.
scope: A mix of calomel and limewater, used on sores caused by syphilis; blackwash is another name for
  this sense, not a wash for simple cuts and not a drink.
examples:
- The nurse dabbed black lotion on the sore.
- Black lotion was once a common treatment for syphilitic sores.
