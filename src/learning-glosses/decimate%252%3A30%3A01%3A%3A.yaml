simpleMeaning: to kill one in every ten soldiers who turned against their leaders, as was done in the
  armies of Rome
scope: This is the old Roman army act of killing one in ten soldiers who turned against their leaders,
  not killing or badly harming a large part of a group.
examples:
- As a punishment, the Roman general decimated the unit, killing one soldier in every ten.
- A commander in Rome's army could decimate men who turned against him, putting one in ten to death.
