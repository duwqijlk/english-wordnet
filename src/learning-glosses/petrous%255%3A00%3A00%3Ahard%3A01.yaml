simpleMeaning: Of bone, above all the bone at the side of the skull, as hard as stone.
scope: Of bone, above all the bone at the side of the skull, as hard as stone; not soft bone and not a
  stone itself.
examples:
- The petrous part of the skull protects the inner ear.
- The surgeon drilled through petrous bone to reach the tumour.
