simpleMeaning: A soft, bendable strip or ring that you wind around an object, either to hold it in place
  or to make it look prettier.
scope: A strip or loop that wraps around an object to bind or decorate it; not a people group, an orchestra
  or pop dance group, a radio frequency range, a stripe or stripes of contrasting color, a trim sewn onto
  a garment, a strip worn on the body, a restraint, a bird's leg marker, a finger ring, an anatomical
  cord, a machine drive belt, or a verb (tying things together, fastening a ring to a bird's foot).
examples:
- She put a rubber band around the bundle of letters.
- A plastic band held the cables together behind the desk.
