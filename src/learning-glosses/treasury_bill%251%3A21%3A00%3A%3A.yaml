simpleMeaning: A short-term promise to pay that earns no interest and is bought for less than its face
  value, and can be bought and sold on that basis for 91 days
scope: A short-term promise to pay that earns no interest, also called a T-bill; not a long-term promise
  to pay and not a loan that pays interest.
examples:
- She put her savings into a Treasury bill for 91 days.
- A Treasury bill is bought for less than the sum it pays back.
