simpleMeaning: In biology, a single living thing develops by itself, and the change runs step by step
  from a simple state to a more complex one.
scope: It is also called growing, development, growth, maturation and ontogenesis, and it is how a single
  living thing develops by itself in biology.
examples:
- An indicator of bone growth in children can show ontogeny at work.
- Ontogeny runs its course step by step, from a simple state to a more complex one.
