simpleMeaning: Bacchus is waited on by one of a group of spirits of the woods, seen as Roman fauns.
scope: Also called a satyr, this names one of the woodland spirits who wait on Bacchus and were seen as
  Roman fauns.
examples:
- The forest god in the old tale waited on Bacchus.
- The old tale tells of a forest god who waited on Bacchus.
