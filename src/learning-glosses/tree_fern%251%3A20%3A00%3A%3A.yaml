simpleMeaning: a usually tropical fern with a thick woody trunk and a crown of large fronds, found especially
  in Australia and New Zealand and mostly in a few fern families
scope: This is a fern that grows a trunk like a small tree, not a true tree and not a low fern without
  a trunk.
examples:
- A tree fern can grow several meters tall in a damp garden.
- The track was lined with tree ferns and moss.
