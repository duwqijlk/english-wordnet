simpleMeaning: of an organic compound (a substance made with carbon); having two or more double joins,
  with a single join between each double join and the next
scope: 'Also called conjugated: this describes an organic compound; it is not the grammar sense about
  verb forms and not the sense about joining things in chemistry.'
examples:
- In this conjugate compound, each double bond is kept apart by a single bond.
- A conjugate compound has two or more double bonds, each with a single bond between it and the next one.
