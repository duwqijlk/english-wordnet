senseId: 'metronome%1:06:00::'
synsetId: 03763133-n
simpleMeaning: a tool with a moving bar that makes a clicking sound to show the exact speed of a piece
  of music
scope: A music tool that clicks at a set speed to help a player keep time; it is not a clock, and it does
  not play music itself.
examples:
- She set the metronome to a slow speed and practised the piano piece.
- The metronome clicked steadily while the band played.
