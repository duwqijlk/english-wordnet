simpleMeaning: one of the two ends of a magnet, where its pull seems to be strongest
scope: One of the two ends of a magnet where its pull is strongest, not an end of the Earth and not a
  place where power goes in or out of a battery.
examples:
- The north pole of the magnet pulled the nail towards it.
- Iron filings gathered at each pole of the magnet.
