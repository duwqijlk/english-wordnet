schema: oewn-learning-gloss-v2
senseId: 'neutropenia%1:26:00::'
synsetId: 14220025-n
simpleMeaning: A low white cell count in the blood, with the fall mostly in neutrophils, the main germ-eating
  white cells.
scope: A low white cell count with the fall mostly in neutrophils, not a low red cell count and not a
  low count of all white cells.
examples:
- The blood test showed neutropenia after the treatment.
- Neutropenia left her open to germs because her white cells were low.
