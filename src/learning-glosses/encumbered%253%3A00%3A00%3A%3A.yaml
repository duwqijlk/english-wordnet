simpleMeaning: carrying too much, or slowed down by a heavy load
scope: This means weighed down by too much to carry and made slow by it, not free and able to move easily.
examples:
- The hiker was encumbered with a heavy backpack on the long climb.
- The donkey, encumbered with large packs, walked slowly up the hill.
