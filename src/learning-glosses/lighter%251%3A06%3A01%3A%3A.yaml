simpleMeaning: A boat with a flat bottom, made for moving heavy loads along waterways, most of all canals.
scope: A flat boat for heavy loads, not a tool for lighting a fire and not the stuff used to start one.
examples:
- The lighter carried coal along the canal.
- Workers loaded the lighter with heavy crates at the dock.
