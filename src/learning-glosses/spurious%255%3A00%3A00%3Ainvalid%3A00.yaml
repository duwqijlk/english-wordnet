simpleMeaning: seeming to be right, with good reasons behind it, but not in fact right or backed by good
  reasons
scope: For a claim or thought that seems right but is not; not a true claim with good reasons behind it.
examples:
- He gave a spurious argument that fell apart at once.
- The report was based on spurious claims about the cost.
