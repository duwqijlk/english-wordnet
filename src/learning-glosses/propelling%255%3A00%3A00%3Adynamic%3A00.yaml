senseId: propelling%5:00:00:dynamic:00
synsetId: 00813359-s
simpleMeaning: tending to move something forward, or able to move something forward
scope: Also called propellant, and another name for this sense is propulsive. It describes a thing that
  moves something forward, not the thing that is itself moved.
examples:
- The propelling force of the engine pushed the boat through the water.
- A propelling jet of water sent the small boat forward.
