simpleMeaning: an artist from a past time in art when feelings were put first (the Romantic Movement),
  or a person shaped by its ideas
scope: An artist of the Romantic Movement, or someone influenced by Romanticism; not just a person full
  of feeling who dreams of love.
examples:
- The painter was a romantic who put feeling and nature first in his work.
- As a romantic, the writer was shaped by the ideas of the Romantic Movement.
