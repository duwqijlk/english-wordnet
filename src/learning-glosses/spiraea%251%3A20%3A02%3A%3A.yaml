simpleMeaning: A Japanese shrub like others in its own genus, widely grown in many varieties for dense,
  colorful clusters of flowers; florists often force it to bloom at Easter.
scope: The cultivated Japanese shrub also spelled spirea, another name for the same plant; not the wider
  group name for any shrub of the genus with sprays of small white or pink flowers.
examples:
- The florist forced a pot of spiraea into bloom for Easter.
- Spiraea filled the garden bed with dense clusters of pink flowers.
