simpleMeaning: A fast run of short, loud sounds a doctor may hear through a listening tube on the chest
  in some kinds of breathing illness.
scope: Also called a rattle or rattling; heard with a stethoscope in some breathing illnesses.
examples:
- The doctor heard a rale in her chest.
- A rale sounded with every breath he took.
