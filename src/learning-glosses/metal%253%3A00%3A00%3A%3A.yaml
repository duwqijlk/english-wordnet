simpleMeaning: made of, containing, or like the hard, shiny material that conducts heat and electricity,
  or typical of that material.
scope: This is not the material itself; it describes things made of it, containing it, or like it.
examples:
- He stirred the soup with a metal spoon.
- The old bridge has a metal frame.
