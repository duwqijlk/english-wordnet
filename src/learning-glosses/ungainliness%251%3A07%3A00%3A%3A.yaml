simpleMeaning: the way a person moves and holds the body, when the movements are very awkward and not
  graceful
scope: 'Another name for gawkiness: very awkward and ungraceful movement and posture, not grace and not
  smooth, easy movement.'
examples:
- His ungainliness showed in every step across the room.
- She laughed at her own ungainliness on the dance floor.
