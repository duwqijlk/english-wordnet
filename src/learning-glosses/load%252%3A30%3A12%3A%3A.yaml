simpleMeaning: to make something less pure by adding a thing that does not belong or is of poor quality,
  often by swapping good ingredients for poor ones
scope: 'Also called stretch: to make a thing less pure by adding something poor, not an amount carried
  or worked on at one time and not a device that uses electrical power.'
examples:
- He loaded the expensive juice with cheap sugar water, so it was no longer pure.
- They loaded the medicine with cheap powder and sold it as the real thing.
