simpleMeaning: a piece of clothing made from animal skins with the hair still on, or from man-made stuff
  that looks the same
scope: This is clothing you wear, not the hair growing on a live animal and not the skin with hair taken
  from an animal to use as a material.
examples:
- She wore a fur coat even though the day was not very cold.
- The fur she wore over her dress was soft and warm.
