simpleMeaning: the act of closing a way so that nothing can pass through
scope: This is the act of closing a way so nothing can pass. It is not the blocked state that follows,
  and not a thing that blocks a pipe or tube.
examples:
- The blockage of the road by police was planned to keep people safe.
- Their blockage of the gate kept the crowd from getting in.
