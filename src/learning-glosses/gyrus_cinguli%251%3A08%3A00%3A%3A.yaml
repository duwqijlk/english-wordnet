simpleMeaning: A long bent part on the inner face of the two halves of the brain, the outer layer part
  of the brain's feeling system
scope: This is a long bent part on the inner face of the two halves of the brain; cingulate gyrus is another
  name for this sense, not a part on the outer face of the brain and not a part of the brain stem.
examples:
- The gyrus cinguli runs along the inner face of the brain.
- Damage to the gyrus cinguli can change how a person feels.
