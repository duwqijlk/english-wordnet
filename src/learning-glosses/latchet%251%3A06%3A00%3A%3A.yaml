simpleMeaning: a thin strip of leather used to tie a shoe or sandal to the foot
scope: A thin strip that ties a shoe or sandal to the foot, not a lace that ties the shoe shut and not
  a belt that holds clothes.
examples:
- The latchet on his sandal had come loose, so he tied it again.
- She pulled the latchet tight to hold the shoe on her foot.
