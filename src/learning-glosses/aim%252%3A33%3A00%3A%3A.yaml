simpleMeaning: to point something, or send something, towards a target; used for blows, weapons, and things
  like cameras
scope: 'Also called take, train, or direct: to point or send a blow, weapon or camera towards something.
  Not the noun aim, which is a goal that guides what a person plans to do.'
examples:
- She aimed the camera at the bird in the tree.
- He aimed a kick at the ball and missed.
