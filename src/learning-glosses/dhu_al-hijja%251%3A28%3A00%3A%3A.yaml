simpleMeaning: The last month of the Muslim year, when people make the holy trip to Mecca; it has one
  more day in leap years.
scope: 'Also called Dhu''l-Hijja, Dhu''l-Hijjah, and Dhu al-Hijjah: the last month of the Muslim year,
  the time of the holy trip to Mecca.'
examples:
- Dhu al-Hijja is the twelfth month of the Muslim year.
- Pilgrims travel to Mecca during Dhu al-Hijja.
