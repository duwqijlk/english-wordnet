simpleMeaning: A sickness caught by breathing in or swallowing tiny germs, with fever and small sores,
  usually in the lungs but in bad cases elsewhere in the body
scope: A sickness from tiny germs breathed in or swallowed, with fever and small sores, not a cold and
  not a sickness of the lungs alone.
examples:
- Tuberculosis spread fast in the crowded town.
- He was treated for tuberculosis for six months.
