simpleMeaning: A lump of fat in the inner lining of an artery can block the flow of blood
scope: This fatty lump sits in the inner lining of an artery and can block blood flow, not a clot of blood
  that forms in the stream.
examples:
- The atheroma in his leg artery had grown until blood could barely pass.
- Doctors found an atheroma blocking the flow of blood to her heart.
