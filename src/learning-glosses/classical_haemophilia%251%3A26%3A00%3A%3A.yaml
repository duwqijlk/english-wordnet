simpleMeaning: a blood illness in which the blood does not clot because the body lacks from birth a substance
  called factor VIII, found almost only in men
scope: A blood illness in which the blood does not clot for lack of factor VIII, found almost only in
  men; classical hemophilia is another name for this sense, not the kind caused by lack of factor IX and
  not any other bleeding illness.
examples:
- Classical haemophilia runs in families and affects almost only men.
- The boy with classical haemophilia bruised easily and bled for a long time.
