simpleMeaning: a big box for the home that uses power to keep food cold, so food can be kept at low temperatures
scope: 'Also called refrigerator: a large box in the home that keeps food cold, not a freezer, which keeps
  food much colder until it is hard.'
examples:
- Put the milk back in the icebox so it stays cold.
- She took some eggs out of the icebox to make breakfast.
