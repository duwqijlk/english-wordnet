simpleMeaning: an underwater weapon steered by electric signals from the ship that fired it, through thin
  cords joining it to the controls
scope: An underwater weapon steered from the ship that fired it, not one that steers itself and not a
  weapon fired through the air.
examples:
- The wire-guided torpedo followed the signals from the ship.
- A wire-guided torpedo can be steered after it is fired.
