simpleMeaning: Between the tube under the collar bone above and the tube of the upper arm below lies the
  stretch of the arm's main blood tube in the armpit
scope: This blood tube in the armpit is also called the axillary artery.
examples:
- The arteria axillaris runs through the armpit on its way down the arm.
- The arteria axillaris carries blood through the armpit toward the upper arm.
