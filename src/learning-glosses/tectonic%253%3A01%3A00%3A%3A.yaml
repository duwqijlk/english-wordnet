simpleMeaning: about how the hard outer layer of the earth is made up and how it moves
scope: This word describes the hard outer layer of the earth and how it moves, not daily weather or things
  made by people.
examples:
- Tectonic plates move very slowly under the sea.
- A tectonic valley formed where the hard outer layer of the earth moved.
