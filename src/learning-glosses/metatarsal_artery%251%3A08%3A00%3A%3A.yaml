simpleMeaning: Blood vessels that carry blood to the middle bones of the foot, along its top and its sole
scope: 'Also called arteria metatarsea: blood vessels in the foot, not the main vessel in the leg and
  not a vein that carries blood back.'
examples:
- The metatarsal artery was cut during the foot surgery.
- Blood flows through the metatarsal artery to the bones of the midfoot.
