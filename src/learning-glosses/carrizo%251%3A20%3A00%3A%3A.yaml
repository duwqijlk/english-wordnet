simpleMeaning: a tall North American reed with fairly broad leaves and large, feather-like flower clusters;
  it grows widely in wet places and is used for mats, screens and arrow shafts.
scope: This is a tall North American wetland grass, another name for common reed and ditch reed, not bamboo
  or a musical reed.
examples:
- Carrizo grew in dense stands along the marshy riverbank.
- The villagers cut carrizo to make mats and screens.
