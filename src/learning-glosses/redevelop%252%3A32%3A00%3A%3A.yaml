senseId: 'redevelop%2:32:00::'
synsetId: 00928281-v
simpleMeaning: To frame or work up again, of a better thought or guess.
scope: This sense is also called reformulate, for framing or working up again, of a better thought or
  guess, unlike the sense for working up a second time, to better the shade, hue, or the like, of a film
  or print.
examples:
- They redevelop the theory, framing it again.
- They redevelop the guess, working it up again.
