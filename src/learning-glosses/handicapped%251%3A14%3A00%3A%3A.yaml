senseId: 'handicapped%1:14:00::'
synsetId: 07962874-n
simpleMeaning: people as a group whose bodies do not work in the usual way, or who have lost the use of
  part of their bodies
scope: Also called disabled; this word names people as a group, not the loss of body or mind power in
  one person.
examples:
- The new bus has more room for the handicapped.
- This centre offers work and help for the handicapped.
