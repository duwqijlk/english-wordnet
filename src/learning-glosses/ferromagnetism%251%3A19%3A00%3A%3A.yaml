simpleMeaning: 'Its pull stays after the field of force is gone: stuff like iron, nickel or cobalt takes
  on a pull in such a field and keeps it'
scope: This pull stays after the field is gone, unlike ferrimagnetism, where the bits line up in opposite
  ways and only part of the pull is left.
examples:
- Iron shows ferromagnetism when it keeps its pull after the field is gone.
- The ferromagnetism of the cobalt sample kept its pull after the field was gone.
