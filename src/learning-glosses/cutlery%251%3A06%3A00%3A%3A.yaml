simpleMeaning: the knives, forks and spoons that people put on a table and use to cut food and eat it
scope: This is the set of knives, forks and spoons used at meals, not a single tool used for cutting in
  general.
examples:
- She washed the cutlery and put each knife, fork and spoon in the drawer.
- Please lay out clean cutlery for six people before dinner.
