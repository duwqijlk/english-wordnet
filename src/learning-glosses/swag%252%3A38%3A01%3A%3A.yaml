schema: oewn-learning-gloss-v2
senseId: 'swag%2:38:01::'
synsetId: 01928835-v
simpleMeaning: To walk with unsteady steps, unable to keep them in line.
scope: Also called stagger, lurch, reel, careen, or keel, this is walking with unsteady steps one cannot
  keep in line, not goods or money taken by breaking the law, not a bundle of a traveller's belongings,
  not a thing drooping, sinking, or settling from pressure or from going slack, and not the verb use for
  swaying heavily or unsteadily.
examples:
- The drunken man swagged into the room, bumping against the door.
- She swagged across the yard, her steps wandering in every direction.
