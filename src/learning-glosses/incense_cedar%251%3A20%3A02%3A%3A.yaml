simpleMeaning: Leaves like those of the cypress and bark the colour of cinnamon mark this tall tree of
  the west coast of North America.
scope: Also called red cedar, this is the tall tree of the west coast of North America with leaves like
  those of the cypress, not the kind from South America and New Zealand with scented wood.
examples:
- The incense cedar has bark the colour of cinnamon.
- Incense cedar leaves look like those of the cypress.
