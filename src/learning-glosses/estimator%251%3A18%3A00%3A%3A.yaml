simpleMeaning: 'Numbers are this person''s work: working them out in the head, or working them out on
  a calculating machine'
scope: 'Also called calculator, computer and figurer: numbers are this person''s work, whether worked
  out in the head or on a calculating machine, not a machine that does sums and not a person who guesses
  at costs.'
examples:
- The estimator worked out the sums in his head faster than anyone else.
- As an estimator, she ran the firm's calculating machines all day.
