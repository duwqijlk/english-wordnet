simpleMeaning: A lump of stuff that acts as a magnet only in a field, and the pull grows in step with
  the strength of the field.
scope: Stuff that acts as a magnet only in a field, not a lasting magnet and not a wire coil fed with
  power.
examples:
- The paramagnet lost its pull when the field was switched off.
- Aluminium is a paramagnet, weakly drawn to a magnet.
