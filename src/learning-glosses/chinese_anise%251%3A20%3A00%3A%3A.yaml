simpleMeaning: A small tree of Vietnam and the land to its north, bearing star-shaped fruit that smells
  of sweet spice, used in food and as a medicine to ease wind.
scope: A small tree of Vietnam and the land to its north, bearing star-shaped fruit that smells of sweet
  spice, used in food and as a medicine to ease wind; star anise and Illicium verum are other names for
  this sense, not the star-shaped fruit or seed itself used in cooking.
examples:
- Chinese anise bears star-shaped fruit.
- We planted a Chinese anise in the garden.
