simpleMeaning: A reason for doing something that can be backed up by clear thinking or a sound case
scope: A reason for doing something that can be backed up by clear thinking, not a feeling that drives
  a person and not an excuse made after the act.
examples:
- She had a rational motive for leaving the job early.
- 'His rational motive was clear: the plan would save money.'
