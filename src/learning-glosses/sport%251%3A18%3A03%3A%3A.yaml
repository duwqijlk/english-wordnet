simpleMeaning: a person who spends the summer in Maine but lives elsewhere the rest of the year.
scope: This is not an athletic activity, not a person who plays games, and not a way of showing off; it
  is a local Maine word for someone who stays in the state only for the summer.
examples:
- The old fisherman called the summer people sports.
- Local shops rely on the sports who come every June.
