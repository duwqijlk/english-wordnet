simpleMeaning: When it is tested, whether by hard use or by hard questions, a thing or idea comes through
  still good
scope: 'Also called hold water: to last well or stay true under a test, not to lift a thing and not to
  rob a person.'
examples:
- Her shoes won't hold up after a month of hard walking.
- His excuse did not hold up when we asked him about it.
