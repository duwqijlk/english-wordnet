simpleMeaning: a part of a helmet from long ago that moves and guards the lower part of the face
scope: Not the animal and not a hat; this is a moving part of an old helmet that guards the lower face.
examples:
- The knight lifted his beaver to speak to the king.
- The beaver on the old helmet had rusted shut.
