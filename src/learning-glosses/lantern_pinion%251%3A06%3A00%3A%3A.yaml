simpleMeaning: Round bars in place of teeth make up this small wheel in a clock, found chiefly in cheap
  clocks.
scope: Lantern wheel is another name for this small clock wheel, made of round bars in place of teeth
  and found chiefly in cheap clocks, not one with teeth.
examples:
- The lantern pinion clicked inside the cheap clock.
- A lantern pinion turned in the clock.
