simpleMeaning: in a way that shows a person wants what another person has and feels bad that they do not
  have it
scope: 'Also called jealously and covetously: in a way that shows wanting what another person has, not
  in a happy or proud way about what that person has.'
examples:
- He looked enviously at his friend's new car.
- She watched enviously as her sister opened the big gift.
