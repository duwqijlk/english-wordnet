simpleMeaning: A copy of a page made by a machine that takes a picture of it.
scope: This is a copy of a page made by a machine that takes a picture of it, not the act of making such
  a copy, and not a copy made by hand.
examples:
- The photostat of the letter was hard to read.
- She kept a photostat of the old map.
