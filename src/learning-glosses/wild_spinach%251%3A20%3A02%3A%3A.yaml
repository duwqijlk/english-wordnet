simpleMeaning: a plant from Europe that now grows in North America, often picked where it grows on its
  own to cook in a pot
scope: 'Also called allgood, fat hen and good-king-henry: a plant from Europe that now grows in North
  America, not the leaves picked for food and not the garden leaf.'
examples:
- Wild spinach grows along the roadside here, a plant brought from Europe long ago.
- We found wild spinach in the field and picked some leaves to cook in a pot.
