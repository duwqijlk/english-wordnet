simpleMeaning: land where people turn over the soil, put seeds in the ground, and grow plants
scope: 'Also called ploughland, cultivated land, and plowland: the land itself that is worked for crops,
  not a wider country area where people farm.'
examples:
- The farmland near the river is turned over every spring before seeds are put in.
- They bought farmland and grew wheat on it for many years.
