simpleMeaning: A mix of tree resin in alcohol, used to find proteins, the building blocks of living things.
scope: A mix of tree resin in alcohol, used to find proteins, not a drink of alcohol and not a medicine
  taken to cure sickness.
examples:
- The nurse used guaiac tincture to test the sample.
- A drop of guaiac tincture showed blood in the stool.
