simpleMeaning: Wildly upset, out of one's mind with fear or another very strong feeling.
scope: Wildly upset, out of one's mind with fear or another very strong feeling; frantic, frenzied and
  frenetic are other names for this sense, not calm worry and not anger alone.
examples:
- Phrenetic screams followed the crash.
- She was phrenetic with fear when the fire alarm rang.
