simpleMeaning: In Hinduism, a group in society that people get from their parents, put in order by ritual
  purity (how pure people are in holy acts)
scope: This is the Hindu group a person is born into, put in order by how pure people are in holy acts,
  not a general social class set apart by birth, job or wealth, and not a special group of insects in
  a colony.
examples:
- She was born into a high caste and married within it.
- Hindu families in the area still knew which caste each person belonged to.
