simpleMeaning: The blood tube on the outside of the groin takes in blood from the outer folds of skin
  at the opening of a woman's body.
scope: Also called venae labiales anteriores, these blood tubes take in blood from the outer folds of
  skin at the opening of a woman's body and carry it to the blood tube on the outside of the groin.
examples:
- Blood from the outer folds of skin moves through the anterior labial veins on its way to the groin.
- The anterior labial veins join the blood tube on the outside of the groin.
