simpleMeaning: feeling sick to the stomach and finding it hard to breathe, felt by people climbing high,
  above ten thousand feet
scope: Feeling sick to the stomach and finding it hard to breathe, felt by climbers above ten thousand
  feet; not ordinary travel sickness and not a cold.
examples:
- He got mountain sickness above ten thousand feet.
- Mountain sickness made her feel sick and short of breath.
