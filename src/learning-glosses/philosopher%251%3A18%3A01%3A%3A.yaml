simpleMeaning: a wise person who stays calm and thinks clearly, living by reason and keeping an even mind
scope: A wise person who stays calm and thinks clearly, living by reason, not a person who studies philosophy
  as a subject.
examples:
- The old philosopher faced bad news with calm reason.
- He lived like a philosopher, asking for little and keeping an even mind.
