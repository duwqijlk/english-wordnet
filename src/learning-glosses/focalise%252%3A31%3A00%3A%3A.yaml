senseId: 'focalise%2:31:00::'
synsetId: 00733774-v
simpleMeaning: to bring thoughts or feelings together so they all point to one clear thing
scope: 'Also called concenter, concentre, focalize and focus: to bring thoughts or feelings together to
  one clear point, not to look at one thing with the eyes and not to spread thoughts apart.'
examples:
- Try to focalise your thoughts on one clear plan.
- He needed time to focalise his ideas before the meeting.
