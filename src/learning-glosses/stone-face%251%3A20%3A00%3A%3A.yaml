simpleMeaning: A plant of Africa in the Lithops group, one of many kinds, grows thick leaves that look
  like small rocks and bears single yellow or white flowers.
scope: People also call it flowering stone, lithops, living stone, stone life face, stone plant, and stoneface,
  and it is one of the Lithops plants of Africa, with single yellow or white flowers and thick leaves
  that look like small rocks.
examples:
- They set the stone-face among the pebbles.
- A stone-face flowered.
