simpleMeaning: Thrown into a worried muddle, so you cannot think straight; rattled is the everyday word
  for it.
scope: 'Also called rattled: thrown into a worried muddle, so you cannot think straight, not merely busy
  or in a hurry.'
examples:
- She felt flustered by all the questions at once.
- The flustered clerk dropped the papers twice.
