simpleMeaning: any world that moves round the sun on a path inside the earth's path
scope: A world whose path round the sun lies inside the earth's path; not a world outside the earth's
  path and not the earth itself.
examples:
- Venus is an inferior planet because its orbit lies inside Earth's.
- Mercury is the best-known inferior planet.
