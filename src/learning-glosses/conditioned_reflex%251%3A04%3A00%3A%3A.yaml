senseId: 'conditioned_reflex%1:04:00::'
synsetId: 00865904-n
simpleMeaning: a learned reply that comes only when a given cue is there
scope: This is a learned reply that comes only when a given cue is there; acquired reflex, conditional
  reaction, conditional reflex, conditional response, conditioned reaction and conditioned response are
  other names for this sense, not a reflex you are born with and not a free act done by choice.
examples:
- The conditioned reflex made the dog drool when it heard the bell.
- After the training, a conditioned reflex took over each time the light flashed.
