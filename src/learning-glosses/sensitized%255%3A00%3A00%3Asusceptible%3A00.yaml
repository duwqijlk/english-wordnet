simpleMeaning: Likely to react in an odd or far too strong way, especially when it comes to one thing,
  or to have an allergy to it.
scope: Also called allergic or hypersensitive, likely to react in an odd or far too strong way, especially
  when it comes to one thing.
examples:
- The child was sensitized to pollen and broke out in a rash each spring.
- After years of handling the chemical, they became sensitized to it.
