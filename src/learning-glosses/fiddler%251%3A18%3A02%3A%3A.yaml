senseId: 'fiddler%1:18:02::'
synsetId: 10753892-n
simpleMeaning: a person who keeps touching and moving small things with the hands, in a nervous way and
  without thinking about it
scope: 'Also called twiddler: a person who nervously moves things about with the hands without thinking,
  not someone who tries to fix things but does it badly, and not a person who plays the violin.'
examples:
- He is a fiddler at meetings, always turning his pen round and round.
- The child was a restless fiddler, touching every button on the desk.
