simpleMeaning: A count of protons — 2, 8, 20, 28, 50, 82 or 126 — that belongs to a very stable, tightly
  bound centre of an atom.
scope: A proton count of 2, 8, 20, 28, 50, 82 or 126 that belongs to a very stable centre of an atom;
  not a lucky count and not a count of electrons.
examples:
- The magic number 82 marks a very stable nucleus.
- Physicists found that the magic number 20 gives a stable atom.
