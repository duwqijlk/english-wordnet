simpleMeaning: A French school of painting from the 1950s, in which paint was put on the cloth in uneven
  dabs and spots with no set plan; like American abstract expressionism.
scope: 'Also called Informel: a French school of painting, not American abstract expressionism itself,
  and not a single painting style with set rules.'
examples:
- Art Informel filled the gallery with wild dabs of colour.
- The painter worked in the manner of Art Informel.
