simpleMeaning: A flat round piece that acts as a seal to stop leaks.
scope: This is a flat piece that stops leaks; not the machine that washes clothes, and not a person who
  washes things for a living.
examples:
- He replaced the worn washer in the tap to stop the drip.
- A rubber washer under the lid keeps the jar airtight.
