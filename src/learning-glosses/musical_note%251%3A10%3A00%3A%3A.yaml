simpleMeaning: A written sign that shows how high or low a sound is and how long it lasts.
scope: A written sign that shows how high a sound is and how long it lasts; note and tone are other names
  for it, not a sound itself and not a written word.
examples:
- The singer held the musical note too long.
- She read the first musical note on the page before she played it.
