simpleMeaning: To make flour older or paler with Agene, a chemical that joins nitrogen to three chlorine
  atoms
scope: Also called Agenize; it is about treating flour with Agene, not about letting flour age on its
  own.
examples:
- The miller agenised the flour with Agene.
- They agenise flour to make it whiter.
