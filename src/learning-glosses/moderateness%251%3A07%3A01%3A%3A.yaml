schema: oewn-learning-gloss-v2
senseId: 'moderateness%1:07:01::'
synsetId: 05154151-n
simpleMeaning: The quality of being fair in what things cost or what is spent, neither too much nor too
  little.
scope: The quality of being fair in what things cost or what is spent, neither too much nor too little;
  not the quality of avoiding extremes in general.
examples:
- The moderateness of the prices drew many shoppers to the store.
- The moderateness of living standards here becomes clear at once.
