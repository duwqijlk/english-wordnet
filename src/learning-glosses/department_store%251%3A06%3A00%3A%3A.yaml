simpleMeaning: Many different kinds of goods are sold in this big shop, which is split into parts and
  often belongs to a group of shops under one name
scope: It is also called an emporium, a big shop split into parts that sell many kinds of goods.
examples:
- She bought the coat at a department store.
- The department store sells many kinds of goods.
