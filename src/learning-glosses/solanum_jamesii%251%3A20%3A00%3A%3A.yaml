simpleMeaning: An upright or spreading plant that lives many years, from the southwestern United States
  and Mexico, bearing small pale brown to cream-coloured tubers like potatoes.
scope: Also called wild potato; not a tomato plant and not a potato grown for food.
examples:
- The Solanum jamesii bore small tubers in the dry soil.
- We dug up Solanum jamesii tubers like tiny potatoes.
