simpleMeaning: The joining of the tiny bits of a liquid with the tiny bits of the stuff dissolved in it,
  which makes a new chemical.
scope: It is the joining of a liquid with the stuff dissolved in it, unlike a solvate, which is the new
  chemical made.
examples:
- Solvation joins the tiny bits of the liquid and the stuff in it.
- A new chemical is made by solvation.
