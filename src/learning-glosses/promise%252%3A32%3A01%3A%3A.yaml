senseId: 'promise%2:32:01::'
synsetId: 00885838-v
simpleMeaning: to say that you will give something to someone or take on a job for them
scope: This is not the bare vow 'I will do it'; it is a pledge made to someone that they will receive
  something or that you will take on a task for them.
examples:
- The company promised a bonus to every worker who finished early.
- He promised his daughter a trip to the zoo.
