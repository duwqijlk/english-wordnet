simpleMeaning: Fighting by bands of soldiers outside the regular army, with light gear and quick to move,
  inside land held by the enemy, usually by striking fast and slipping away.
scope: Fighting by bands of soldiers outside the regular army inside land held by the enemy, not a pitched
  battle between two armies and not a siege of a city.
examples:
- The rebels fought a long guerrilla warfare in the hills.
- Guerrilla warfare wore down the occupying army.
