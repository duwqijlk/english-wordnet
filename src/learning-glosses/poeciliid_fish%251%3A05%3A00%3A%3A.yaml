simpleMeaning: Usually brightly coloured and often used to keep down mosquitoes, this small fish of warm
  fresh or slightly salty water feeds at the surface and bears live young.
scope: A poeciliid, a live-bearer and a topminnow are other names for this small bright fish that feeds
  at the surface of warm water and bears live young.
examples:
- A poeciliid fish fed at the surface of the warm water.
- Poeciliid fish were put in the pond to keep down mosquitoes.
