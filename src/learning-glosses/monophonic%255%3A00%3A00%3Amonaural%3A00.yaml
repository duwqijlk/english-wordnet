simpleMeaning: One path only carries the sound, whether it is sent on, stored or played back
scope: 'Also called mono: sound sent, stored or played back through one path only, not sound sent through
  two paths at once and not live sound.'
examples:
- The old radio played monophonic sound through a single speaker.
- Her monophonic tape had no left and right channels.
