simpleMeaning: to say something in an angry, sharp, quick way that sounds unfriendly
scope: Also called snarl. This is speaking in an angry, short way; it is not taking something quickly
  in the hand, and not a sudden sharp sound.
examples:
- '"Leave me alone!" she snapped.'
- The teacher snapped at the class to be quiet at once.
