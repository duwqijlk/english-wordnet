senseId: 'likable%3:00:02::'
synsetId: 02384845-a
simpleMeaning: of a character in a story or play, making people feel care and understanding for that character
scope: 'Also called sympathetic, appealing and likeable: used for a character in a story or play who makes
  people feel care, not for a real person people enjoy being with.'
examples:
- In the play, the likable young sister makes the audience feel for her.
- The author made the main character likable, so readers cared what happened to him.
