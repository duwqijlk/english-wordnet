simpleMeaning: A straight plant from Europe that lives one year and is often grown for salads, to be picked
  young and soft.
scope: Also called rocket, arugula, garden rocket, rocket salad and roquette, and also Eruca vesicaria
  sativa; a straight one-year plant from Europe, grown for salads and picked when young and soft.
examples:
- We grow Eruca sativa for salads and pick it while it is young.
- Eruca sativa stood straight in the garden bed.
