senseId: 'watchful%3:00:00::'
synsetId: 00092165-a
simpleMeaning: Looking hard at what goes on around you, ready to notice anything new, whether now or as
  a habit
scope: Also called alert; watching with care, whether now or as a habit, not watching out for danger in
  particular and not staying awake through the night.
examples:
- The watchful guard noticed every movement.
- She kept a watchful eye on the children.
