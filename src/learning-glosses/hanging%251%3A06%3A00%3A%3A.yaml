simpleMeaning: A decoration, such as a tapestry, put up on a wall or over a window.
scope: This is the decorative object itself — wall hanging is another name for this sense — not the act
  of suspending something and not execution.
examples:
- The cold castle walls were covered with hangings.
- She admired the silk hanging above the fireplace.
