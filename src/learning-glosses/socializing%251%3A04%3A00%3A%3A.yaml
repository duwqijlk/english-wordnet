simpleMeaning: the act of meeting people to talk and spend time with them
scope: 'Also called socialization, socialising, and socialisation: the act of meeting people to talk and
  spend time together, not learning the ways of a group.'
examples:
- Socializing with old friends at the weekend is her best rest.
- He does a lot of socializing after work, meeting people for a drink and a talk.
