simpleMeaning: To take dirt, filth or unwanted stuff off something so it is free of them
scope: To take dirt, filth or unwanted stuff off something so it is free of them, not to tidy a room and
  not to wash clothes only; clean is another name for this sense.
examples:
- Make clean the kitchen before the guests arrive.
- He made clean the whole house after the party.
