simpleMeaning: a money business that sells its own shares to people and uses the money to buy shares and
  bonds put out by other businesses
scope: A money business that sells its own shares to people and uses the money to buy shares and bonds
  put out by other businesses, also called a fund, an investment company or an investment trust; not a
  bank that lends money and not a business that makes goods.
examples:
- She put her savings in an investment firm.
- The investment firm buys shares in many companies.
