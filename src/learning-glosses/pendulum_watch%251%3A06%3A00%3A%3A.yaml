simpleMeaning: In the 1700s, a small timepiece with a wheel that swings to and fro, having a false swinging
  weight fixed to it.
scope: A small timepiece of the 1700s with a false swinging weight fixed to its wheel, not a clock with
  a real swinging weight and not a plain timepiece with no such weight.
examples:
- The pendulum watch in the museum dates from 1720.
- His pendulum watch had a false swinging weight fixed to its wheel.
