simpleMeaning: moving, pointing or placed away from land that is far from the sea, toward the sea or the
  shore
scope: This describes something moving, pointing or placed toward the sea or the shore, away from land
  that is far from the sea. Not toward the land, and not out at sea itself.
examples:
- They walked in a seaward direction until they reached the shore.
- Our room was on the seaward side of the hotel, facing the water.
