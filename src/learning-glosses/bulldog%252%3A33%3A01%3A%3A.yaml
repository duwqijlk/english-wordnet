simpleMeaning: To throw a young male cow to the ground by holding its horns and twisting its neck, as
  people do in a rodeo
scope: This is an action in a rodeo with a young male cow, not the short, strong dog with a large head.
examples:
- He bulldogged the steer in just a few seconds at the rodeo.
- At the rodeo, she learned to bulldog a steer by its horns.
