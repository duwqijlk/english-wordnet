simpleMeaning: the place of an element in Mendeleyev's table, the number of protons in the centre of its
  atom, or of electrons when the atom has no charge
scope: The place of an element in Mendeleyev's table, not the weight of an atom and not the number of
  its neutrons.
examples:
- Hydrogen has the atomic number 1.
- The atomic number tells you how many protons are in the atom.
