scope: 'Also called amatungulu, natal plum and Carissa macrocarpa: a very large South African shrub with
  many close branches, forked bright green spines and shiny leaves, larger than the smaller hedging shrub
  with plum-like fruit.'
examples:
- Carissa grandiflora is a very large South African shrub.
- The Carissa grandiflora has forked bright green spines and shiny leaves.
