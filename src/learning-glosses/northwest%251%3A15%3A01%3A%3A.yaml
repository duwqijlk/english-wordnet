simpleMeaning: the part of a country, a region, or a city that lies toward the top left corner of a map
scope: A place in the upper left part of a country, a region, or a city, not the direction itself and
  not a wind from there.
examples:
- They settled in the northwest of the country.
- The northwest of the city holds the old port.
