simpleMeaning: to make someone or something wet by shooting a quick burst of liquid at it
scope: 'Also called spurt: to make someone or something wet by shooting a quick burst of liquid at it,
  not to cause liquid to come out in a squirt and not the sudden discharge itself.'
examples:
- He squirted the wall with water.
- She squirted juice from the lemon onto the fish.
