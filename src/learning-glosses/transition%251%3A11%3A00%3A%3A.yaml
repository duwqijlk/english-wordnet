simpleMeaning: A thing that happens and brings about a big change in something
scope: An event that brings about a big change, not a short piece joining two subjects, and not the act
  of changing from one state to another.
examples:
- The transition from horse-drawn carts to cars took many years.
- The transition to the new system was hard for the staff.
