simpleMeaning: A herb that lives for one year, used as a green in salads and as something that makes food
  look nice.
scope: Also called common garden cress, garden pepper cress, garden peppergrass, pepper grass, and pepperwort,
  this is a herb that lives for one year and is used in salads, not other salad herbs.
examples:
- We grew Lepidium sativum in the garden and cut its leaves for salads.
- The cook put Lepidium sativum on the dish to make the food look nice.
