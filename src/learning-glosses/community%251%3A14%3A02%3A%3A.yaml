senseId: 'community%1:14:02::'
synsetId: 07957969-n
simpleMeaning: In ecology, the living things that share one area and depend on and affect one another.
scope: This is an ecological group of living things, not a group of people in a local area, not people
  sharing a religion, ethnicity or profession, not common ownership, not a group of nations, not agreement
  about aims, and not a residential district.
examples:
- The pond supports a diverse community of plants, insects and fish.
- Scientists studied how pollution changed the community of organisms in the river.
