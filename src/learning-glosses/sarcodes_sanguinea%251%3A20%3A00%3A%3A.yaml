simpleMeaning: A thick bright red plant of the mountains of western North America that lives on dead matter
  and comes up in early spring while snow is on the ground
scope: Snow plant is another name for this sense, and it is set apart from other mountain plants by its
  bright red colour and its spring coming while snow is on the ground.
examples:
- Sarcodes sanguinea pushes up through the snow in early spring.
- The bright red Sarcodes sanguinea grows in the mountains of western North America.
