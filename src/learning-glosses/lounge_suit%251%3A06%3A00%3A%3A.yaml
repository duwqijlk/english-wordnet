simpleMeaning: A business outfit of a jacket with a skirt or trousers to match.
scope: A matching jacket and skirt or trousers for business wear, not a soft jacket worn at home and not
  formal evening dress.
examples:
- He wore a lounge suit to the interview.
- She chose a dark lounge suit for the meeting.
