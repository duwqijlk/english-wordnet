simpleMeaning: to put rubber through a heating process that makes it tough and long-lasting
scope: To put rubber through a heating process that makes it tough; vulcanize is another name for this
  sense, not rubber itself going through the process on its own.
examples:
- The factory can vulcanise rubber for tyres.
- They vulcanise the soles to make them last longer.
