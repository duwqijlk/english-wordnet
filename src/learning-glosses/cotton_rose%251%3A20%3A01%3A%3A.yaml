simpleMeaning: any plant in the group Filago, with round-topped clusters of small woolly flower heads
scope: Any plant in the group Filago, with round-topped clusters of small woolly flower heads; cudweed
  and filago are other names for this sense, not the Chinese shrub with white or pink flowers, and not
  any other rose.
examples:
- The cotton rose grew woolly flower heads along the dry bank.
- Its small woolly flower heads marked the cotton rose out from the grass.
