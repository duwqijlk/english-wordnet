simpleMeaning: 'Waves can pass either way through this device: in from a power-driven set-up and out to
  one with moving parts, or back again'
scope: This device passes waves between a power-driven set-up and one with moving parts, in either direction.
examples:
- The electromechanical transducer turns the signal from the wires into movement of the parts.
- An electromechanical transducer in the machine takes in waves and sends them on to the moving parts.
