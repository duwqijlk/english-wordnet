simpleMeaning: a plant on which no blooms grow and which makes no seeds
scope: 'Also called nonflowering: a plant with no blooms and no seeds, not a plant that blooms in spring
  and not a plant grown for its fruit.'
examples:
- Ferns are flowerless plants that spread by spores.
- The flowerless moss on the rock makes no seeds.
