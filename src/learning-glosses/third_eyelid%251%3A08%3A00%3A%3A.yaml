simpleMeaning: a fold of skin in the eye that covers and guards it, found in reptiles, birds and some
  mammals
scope: Also called the nictitating membrane, this is a fold of skin in the eye that covers and guards
  it, not the upper eyelid and not the lower eyelid.
examples:
- The lizard blinked with its third eyelid.
- A bird's third eyelid sweeps across the eye to keep it clean.
