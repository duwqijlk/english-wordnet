simpleMeaning: A rude or offensive word or phrase, most often used to express surprise or anger.
scope: This is the rude word itself (another name is swearword), not the act of saying such words, and
  not a magic spell meant to harm someone.
examples:
- He muttered a curse when the hammer slipped.
- She let out a curse as the car splashed her.
