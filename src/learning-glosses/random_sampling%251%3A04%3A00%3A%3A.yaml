senseId: 'random_sampling%1:04:00::'
synsetId: 00162875-n
simpleMeaning: choosing some members of a group by chance, so that every member has the same chance of
  being chosen
scope: A way of choosing by chance, not a way of choosing by choice, and not a count of everyone in a
  group.
examples:
- The class used random sampling to pick ten pupils for the test.
- In our random sampling, every name in the class had the same chance of being picked.
