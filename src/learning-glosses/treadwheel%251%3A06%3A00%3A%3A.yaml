simpleMeaning: a mill that gets its power from people or animals walking on a round belt or climbing steps
scope: This is a mill driven by people or animals walking on a round belt or climbing steps; tread-wheel
  and treadmill are other names for this sense. Not a mill driven by water or wind.
examples:
- The treadwheel turned the millstones as the donkey walked on the belt.
- The men climbed the steps of the treadwheel to keep the mill going.
