simpleMeaning: a small red, swollen raised spot on the skin, sometimes filled with thick yellow liquid,
  often seen with acne (a skin problem with many such spots)
scope: A small raised spot on the skin, also called pimple and hickey; it is a spot that rises on the
  skin, not a flat mark or a cut.
examples:
- A zit appeared on her chin the day before the photo.
- He tried not to touch the zit on his forehead.
