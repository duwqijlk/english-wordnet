simpleMeaning: not steady when walking, as from being weak in health or from old age
scope: 'Also called tottery: not steady when walking because of weak health or old age, not about a building
  or a system that has lost strength and is about to fall.'
examples:
- The tottering old man held the rail as he walked.
- She took small, tottering steps after her long illness.
