simpleMeaning: In angling, a bright piece of plastic or metal with hooks and feathers on it, used as bait
scope: A bright man-made bait used in angling; fisherman's lure is another name for this sense. Not live
  bait, and not a hook used on its own.
examples:
- He tied a bright fish lure to the line before casting into the lake.
- The fish lure flashed in the sun as it moved through the water.
