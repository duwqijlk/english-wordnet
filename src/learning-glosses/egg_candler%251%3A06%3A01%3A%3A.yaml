simpleMeaning: a shade that lets out only one small spot of light, about the size of a shell, used to
  check what is inside it
scope: A shade that lets out only one small spot of light, about the size of a shell, to check what is
  inside it, not a lamp itself and not a tool for breaking shells.
examples:
- She held the egg candler up to the light to test the eggs.
- He used the egg candler to check whether the eggs were good.
