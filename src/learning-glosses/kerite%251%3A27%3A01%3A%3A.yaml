simpleMeaning: a mix of tar or asphalt with oils from animals or plants, hardened with sulphur, that comes
  out looking and feeling much like rubber
scope: A tar mix hardened with sulphur that looks and feels like rubber, not rubber itself, and not plain
  tar or asphalt.
examples:
- Kerite was once used to coat telegraph wires.
- The old cable was covered in kerite, a hard black mix that felt like rubber.
