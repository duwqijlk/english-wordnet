simpleMeaning: Canada's main foreign intelligence agency, which gathers and studies information to provide
  security intelligence for the Canadian government.
scope: Also called CSIS; Canada's main foreign intelligence agency providing security information for
  the Canadian government, not the police or the army.
examples:
- The Canadian Security Intelligence Service warned the government about a threat.
- She works for the Canadian Security Intelligence Service in Ottawa.
