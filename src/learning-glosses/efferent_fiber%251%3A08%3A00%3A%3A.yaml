simpleMeaning: a nerve thread that carries signals toward muscles or glands
scope: A nerve thread carrying signals out to muscles or glands, also called motor fiber; not a thread
  carrying signals in to the brain and not a blood tube.
examples:
- The efferent fiber carries the signal to the muscle.
- When the efferent fiber fires, the gland releases its fluid.
