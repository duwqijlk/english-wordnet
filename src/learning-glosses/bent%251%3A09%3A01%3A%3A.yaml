simpleMeaning: The way a person tends to respond, staying fairly fixed over time.
scope: A fairly lasting inclination of mind — another name for set in this sense — not a knack or special
  way of doing something, and not a kind of grass or open grassland.
examples:
- Her bent was to distrust anything that sounded too simple.
- He has a conservative bent and dislikes sudden change.
