simpleMeaning: long ago, a cart pulled by a horse that took frozen water to people's homes
scope: A horse-drawn cart that once took frozen water to people's homes, also called ice-wagon; not a
  cart for carrying milk and not a modern truck.
examples:
- The ice wagon stopped at every house on the street.
- In those days, the ice wagon came twice a week.
