simpleMeaning: a bucket made of iron, used for lifting things up in wells or in mines
scope: This sense is an iron bucket used for lifting in wells or mines, not the small hard pieces of ground
  grain used as food for pets.
examples:
- The workers lowered the kibble into the well to bring up stones and earth.
- A heavy iron kibble carried rocks up from the mine.
