schema: oewn-learning-gloss-v2
senseId: 'repeatable%3:00:00::'
synsetId: 01970783-a
simpleMeaning: that someone can say again, and that is suitable for others to say again or to use as exact
  words
scope: This is about words that can be said again and shared with others. It is not about an act or a
  test that can be done again in the same way.
examples:
- His funny line was so good that it was repeatable at the party.
- Please use only repeatable words when children are listening.
