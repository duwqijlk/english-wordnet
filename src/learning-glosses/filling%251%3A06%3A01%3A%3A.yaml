simpleMeaning: In dentistry, a plug of metal, plastic, or other stuff put into a hole in a tooth that
  a dentist has made ready
scope: In dentistry, a plug put into a hole in a tooth, not the thread across cloth, not food put in pastry,
  and not the act of putting stuff in.
examples:
- The dentist put a filling in my back tooth.
- When he yawned I could see the gold filling in his tooth.
