simpleMeaning: the branch of the study of matter that deals with how chemical stuffs act and what they
  are like
scope: The branch of the study of matter that deals with how chemical stuffs act and what they are like;
  not the study of how new stuffs are made and not the study of living things.
examples:
- Physical chemistry deals with how chemical stuffs act and what they are like.
- He took physical chemistry to study the traits of matter.
