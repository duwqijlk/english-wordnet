simpleMeaning: A fine food that is most unsafe, since the eggs and liver hold a strong nerve poison
scope: A fine food that is most unsafe, since the eggs and liver hold a strong nerve poison, also called
  puffer, blowfish or pufferfish; not a plain fish dish and not a safe food.
examples:
- He ate sea squab and fell ill from the poison in its liver.
- Sea squab is a fine food, but its eggs hold a strong poison.
