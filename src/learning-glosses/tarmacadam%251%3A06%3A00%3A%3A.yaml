simpleMeaning: A flat hard surface made of layers of broken rocks pressed tight and stuck together with
  tar.
scope: A flat hard surface of layers of broken rocks pressed tight and stuck together with tar, also called
  tarmac or macadam; not the tar-and-stone paving stuff itself, which is mixed in a factory and shaped
  as it is laid.
examples:
- The drive was laid with tarmacadam and set hard in the sun.
- They resurfaced the lane with tarmacadam.
