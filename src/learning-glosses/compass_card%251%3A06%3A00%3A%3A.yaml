simpleMeaning: a flat disc that turns so that its zero mark points to the north shown by a magnet
scope: A flat turning disc that shows north, also called mariner's compass; not a hand-held needle and
  not a map.
examples:
- The compass card turned slowly as the ship changed course.
- He watched the compass card settle on north.
