simpleMeaning: a rail vehicle that carries large amounts of liquid or gas
scope: This is a rail vehicle that carries large amounts of liquid or gas; tank is another name for this
  sense. Not a road vehicle and not a rail vehicle that carries dry goods.
examples:
- The tank car carried oil to the refinery.
- A tank car of gas stood on the siding.
