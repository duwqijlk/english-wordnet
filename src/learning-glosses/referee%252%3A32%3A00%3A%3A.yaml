simpleMeaning: Give a careful expert view on work done by someone in the same job.
scope: Judging a workmate's work with expert care; not keeping order in a sports game, and not the person
  who reads a book or paper to judge it for print.
examples:
- The editor asked her to referee the young scholar's paper.
- He refereed three papers for the journal last year.
