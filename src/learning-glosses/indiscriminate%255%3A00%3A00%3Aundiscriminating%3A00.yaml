simpleMeaning: not making or seeing clear differences between things or people
scope: This is about not making or seeing clear differences between things or people. It is not about
  choosing each one with care after seeing how they differ.
examples:
- His indiscriminate praise meant he said the same good words about every piece of work, good or bad.
- She was indiscriminate in her reading and did not sort the true reports from the false ones.
