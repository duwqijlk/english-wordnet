simpleMeaning: meant to reach many people, a notice that advertises something and is usually printed on
  a page or a small sheet
scope: A notice that advertises something, usually printed, meant to reach many people; bill, circular
  and flier are other names for this sense, and it is not a person who flies or a small printed ticket.
examples:
- He handed out flyers on the street.
- A flyer for the concert was pinned to the board.
