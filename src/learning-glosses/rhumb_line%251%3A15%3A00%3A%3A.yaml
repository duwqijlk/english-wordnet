simpleMeaning: The course taken by a ship or plane that keeps one compass direction is this path on a
  round surface, cutting every north-south mark at the same angle.
scope: Loxodrome and rhumb are other names for this course, the path on a round surface that cuts every
  north-south mark at the same angle and that a ship or plane follows when it keeps one compass direction.
examples:
- They sailed along the rhumb line without changing course.
- Pilots use a rhumb line to keep one compass direction.
