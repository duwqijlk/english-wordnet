simpleMeaning: In chemistry, how strongly an atom or a group of atoms draws tiny charged bits toward itself
  when it joins another atom to make a bond between charged parts
scope: How strongly an atom pulls tiny charged bits to itself when it joins another atom, not how much
  energy it takes to pull one off; also called negativity.
examples:
- Fluorine has the highest electronegativity of all the elements.
- The electronegativity of oxygen helps explain why water bends the way it does.
