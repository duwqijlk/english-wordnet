simpleMeaning: Without the big claws of true lobsters, this large edible animal of the ocean has a spiny
  back shell.
scope: Also called crawfish, crayfish, langouste, rock lobster, and spiny lobster, it is a large edible
  animal of the ocean without the big claws of true lobsters.
examples:
- They pulled a sea crawfish from the water and saw it had no big claws.
- The sea crawfish we ate had a spiny shell.
