simpleMeaning: Any of the oldest holy writings of Hinduism, in early Sanskrit, from a Sanskrit word for
  'knowledge'; they are held to be made up of Samhitas, Brahmanas, Aranyakas and Upanishads.
scope: Any of the oldest holy writings of Hinduism, in early Sanskrit, also called Vedic literature.
examples:
- The Veda is one of the oldest holy writings of Hinduism.
- She reads the Veda in early Sanskrit.
