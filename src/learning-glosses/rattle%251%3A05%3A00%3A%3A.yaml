simpleMeaning: loose parts made of hard material that are joined together at the end of the tail of a
  kind of snake
scope: The hard loose parts on a rattlesnake's tail; not a baby's toy that makes a noise when shaken,
  and not a series of short loud sounds.
examples:
- The snake shook the rattle at the end of its tail as a warning.
- Each year the snake adds a new part to its rattle.
