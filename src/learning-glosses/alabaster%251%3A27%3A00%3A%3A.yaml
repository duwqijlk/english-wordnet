simpleMeaning: a usually white stone made of gypsum (a soft rock), packed tight with a fine grain, used
  for carving
scope: This is the stone itself, used for carving, not the word for something that looks like this stone.
examples:
- The small statue was carved from white alabaster.
- He bought a bowl made of alabaster for the table.
