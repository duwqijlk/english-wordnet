simpleMeaning: A small black-and-white fly that harms citrus and other fruits by laying eggs that hatch
  inside the fruit.
scope: Also called medfly and Mediterranean fruit fly; a small black-and-white fly that harms fruit by
  laying eggs inside it, among the small flies that harm fruit.
examples:
- The Ceratitis capitata laid eggs in the oranges, and they hatched inside the fruit.
- Ceratitis capitata harms citrus and other fruits.
