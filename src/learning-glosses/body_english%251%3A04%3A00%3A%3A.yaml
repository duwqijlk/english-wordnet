simpleMeaning: A move a player makes, as if to steer a thing already on its way in the direction wanted.
scope: A player's move that tries to steer a thing already on its way, not a move that hits the thing
  and not a move made before the thing is hit.
examples:
- He gave the ball a little body English.
- She leaned with body English as the ball rolled toward the pocket.
