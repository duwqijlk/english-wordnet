simpleMeaning: A plant growing in clumps, leaves mostly at the base, cream or pale pink fringed flowers
  in several long clusters; from Alaska to coastal central California and east to Idaho.
scope: A plant growing in clumps, also called false alumroot and fringe cups; not the true alumroot and
  not other clump-forming garden plants.
examples:
- Tellima grandiflora grows in clumps from Alaska to Idaho.
- The fringed flowers of Tellima grandiflora are cream or pale pink.
