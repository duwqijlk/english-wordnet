simpleMeaning: A broad name for many 19th-century building styles that took ideas from a wide range of
  old Italian forms in the classical style, neither Greek nor Gothic in style.
scope: Also called neo-Renaissance; a broad name for 19th-century building styles that took ideas from
  a wide range of old Italian forms in the classical style, not a single style and not a Gothic revival.
examples:
- The Renaissance revival drew on many old Italian styles, not Greek or Gothic ones.
- By the 1870s, collectors across Europe were excited by the Renaissance revival.
