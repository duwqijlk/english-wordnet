simpleMeaning: a magnet worked by electric current, as on a tape recorder, that turns changes in power
  into changes in magnet force kept on a surface and read back later
scope: A magnet worked by electric current that reads and writes on tape, not a loudspeaker and not a
  plain bar magnet.
examples:
- The magnetic head on the old tape recorder wore out.
- A magnetic head turns the changes in power into changes that can be read back later.
