simpleMeaning: A stretch of canal that can be closed off to control the water level, so boats can be raised
  or lowered as they pass through.
scope: A waterway enclosure that raises or lowers passing boats, not the door fastener, the vehicle ignition
  device, or the wrestling hold.
examples:
- The boat waited for the lock to fill before sailing through.
- They had to pass through three locks on the canal.
