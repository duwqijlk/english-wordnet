simpleMeaning: A sickness passed down in families, in which the body makes faulty haemoglobin, the red
  part of blood that carries oxygen.
scope: 'Also called thalassaemia, thalassemia, or Mediterranean anaemia: a sickness passed down in families
  in which the body makes faulty haemoglobin, not a sickness caught from another person.'
examples:
- Mediterranean anemia runs in families.
- She has Mediterranean anemia, so her body makes faulty haemoglobin.
