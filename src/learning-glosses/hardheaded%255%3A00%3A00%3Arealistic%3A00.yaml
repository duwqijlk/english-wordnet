simpleMeaning: Judging by what you have seen and done, not by theory.
scope: 'Also called practical or pragmatic: guided by real experience and what you have seen, not by theory,
  and not stubborn in the face of argument.'
examples:
- She took a hardheaded view of the firm's debts.
- A hardheaded look at the figures showed the plan would fail.
