simpleMeaning: Countries keep this reserve wealth in the International Monetary Fund to steady trade between
  countries, adding to their stocks of the yellow metal and of money that can be changed.
scope: Also called special drawing rights, this is reserve wealth in the International Monetary Fund that
  backs up other reserves.
examples:
- The fund raised its paper gold to help steady the market.
- Paper gold adds to a country's reserves without any metal changing hands.
