simpleMeaning: showing no warm or friendly feeling, and showing dislike or that you think a person is
  not good enough
scope: 'Also called icy: this is about a look, greeting or way of acting that feels unfriendly, not about
  food kept cold and not about water turned to ice.'
examples:
- She gave him a frozen smile when he came in late.
- His frozen greeting made the guests feel unwelcome.
