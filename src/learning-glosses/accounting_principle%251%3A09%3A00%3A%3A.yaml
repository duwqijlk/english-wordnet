simpleMeaning: A rule that guides how money records are kept now, used to decide how to treat hard money
  dealings.
scope: Accounting standard is another name for this sense, not a rule of law and not a way to count stock.
examples:
- This accounting principle guides how firms record sales.
- Under that accounting principle, the cost is spread over years.
