simpleMeaning: A turning copier that pushes ink through a cut sheet to make copies
scope: This copier is also called a mimeograph, a mimeo, a mimeograph machine and a Roneograph; it is
  not a photocopier and not a printing press.
examples:
- The teacher used a Roneo to copy the worksheets.
- They ran off the notices on the Roneo.
