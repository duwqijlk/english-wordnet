simpleMeaning: an animal trained to move at a fast two-beat pace, most often one trained to pull a light
  cart in a race
scope: This is an animal trained to move at a fast two-beat pace, most often one trained to pull a light
  cart in a race, also called a trotter; not an animal trained to gallop and not one trained for riding.
examples:
- The trotting horse pulled the cart round the track.
- Our trotting horse trains each morning for the next race.
