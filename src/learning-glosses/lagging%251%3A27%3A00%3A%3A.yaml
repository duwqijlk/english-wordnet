simpleMeaning: a covering put around pipes and boilers, also laid in attics, that stops heat from getting
  out
scope: A heat-keeping covering for pipes, boilers and attics, not the sense of moving slowly or falling
  behind.
examples:
- They put lagging around the hot pipes to keep the water warm.
- The lagging in the attic helps keep the house warm in winter.
