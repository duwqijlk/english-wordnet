simpleMeaning: a device with screens and controls that a worker uses to watch and control a system, especially
  a computer system
scope: This is a device with screens and controls, used to watch and control a system, especially a computer
  system. Not a curved support piece fixed to a wall, and not the act of comforting a sad person.
examples:
- The operator sat at the console and checked the power system.
- From the main console, she could control all the computers in the room.
