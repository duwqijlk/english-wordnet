simpleMeaning: Chosen by a group, this person writes down what is said at its meetings
scope: A person chosen by a group to write down what is said at its meetings, not a member who speaks
  for the group and not a secretary who keeps the group's papers.
examples:
- The rapporteur read out her notes at the end of the meeting.
- As rapporteur, he prepared the report of the committee's talks.
