synsetId: 13117946-n
simpleMeaning: The middle part of a plant's stem or root, usually round like a tube, that carries water
  and food through the plant.
scope: In plants, the middle part of the stem that carries water and food, not the stone slab of the same
  name.
examples:
- The stele runs through the middle of the stem.
- Water moves up through the stele to the leaves.
