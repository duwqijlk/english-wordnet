synsetId: 07356983-n
simpleMeaning: in music, the same tune played several times, each time using a different set of notes
  built on one main note (a different key)
scope: 'This is the music sense: a tune played again and again in different keys; it is not things set
  out in order, and not a part of a film made of linked shots.'
examples:
- In the song, a short sequence rises higher each time it comes back.
- The piano part has a sequence that repeats the same tune in three different keys.
