simpleMeaning: A shrub from the coastal mountains of California and Baja California. It has hairy branches
  and spikes of pale purple flowers; it is sometimes placed in the genus Sphaeralcea.
scope: The coastal California and Baja California shrub with pale purple flower spikes, not the marsh
  mallow used in sweets or the common low garden mallow.
examples:
- Chaparral mallow covers the dry hillsides above the coast.
- Its hairy branches and mauve flower spikes make chaparral mallow easy to recognize in spring.
