simpleMeaning: a flat round piece with one long cut that runs round and round it, holding music that a
  needle reads as it turns
scope: 'Also called a record, a platter, or a disk: a music record played with a needle, not a computer
  disc and not just any flat round thing.'
examples:
- She put a disc on the player and the room filled with music.
- The old disc crackled as the needle moved through the groove.
