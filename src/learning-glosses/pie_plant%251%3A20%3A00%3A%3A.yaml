simpleMeaning: Stems of this cross, bred for a long time from a kind of rhubarb, are often cooked in sweet
  pastry or made into sauce or preserves.
scope: 'Also called garden rhubarb: a cross bred for a long time, its stems often cooked in sweet pastry
  or made into sauce or preserves.'
examples:
- She cut pie plant stems for a sweet pastry.
- Pie plant stems go into sauce and preserves.
