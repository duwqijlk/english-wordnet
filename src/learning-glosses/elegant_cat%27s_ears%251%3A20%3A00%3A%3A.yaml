simpleMeaning: A small plant with thin, bent stems and clusters of a few white flowers with pointed petals;
  it grows from Washington and Oregon to Montana.
scope: This is the wild white-flowered plant also known as star tulip, not the yellow weed called cat's
  ear.
examples:
- Elegant cat's ears grow on rocky slopes above the river.
- We found a small patch of elegant cat's ears beside the trail.
