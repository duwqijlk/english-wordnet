simpleMeaning: the act of putting control of equipment in place with advanced technology, usually using
  electronic parts
scope: This sense, also called mechanization and mechanisation, is the act of setting up such control,
  not the state of being controlled and not the equipment itself.
examples:
- Automation of the factory made the work faster and easier to control.
- The company used automation to control the machines day and night.
