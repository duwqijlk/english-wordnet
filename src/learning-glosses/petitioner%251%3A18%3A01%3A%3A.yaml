simpleMeaning: a person who asks a court to put right a wrong done to them or to give back a right they
  have lost
scope: A person who asks a court for help about a wrong or a lost right; not the judge or lawyer in the
  case, and not just a person who signs a public request.
examples:
- The petitioner asked the court to give back his land rights.
- The judge listened to the petitioner and then read the papers.
