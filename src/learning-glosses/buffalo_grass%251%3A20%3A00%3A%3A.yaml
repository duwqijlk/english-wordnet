simpleMeaning: a short plant that grows on dry flat land in the middle of the United States, where large
  wild cattle roam
scope: A short plant growing on the dry flat land of the middle United States, not a lawn grass of the
  south and not tall grass of wet land.
examples:
- Buffalo grass covered the dry plains.
- The buffalo grass stayed short through the dry summer.
