synsetId: 03398370-n
simpleMeaning: A marked strip on a basketball court from the end line to 15 feet in front of the backboard,
  kept clear while a shot is taken from the line
scope: The marked strip under the basket on a basketball court, not the three-point line and not the whole
  court.
examples:
- He stepped into the free throw lane too soon and the shot was void.
- The free throw lane is painted a different colour from the rest of the court.
