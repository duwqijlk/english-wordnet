simpleMeaning: Of a female tame mammal, to be receptive to mating and respond to a male.
scope: This is about a female animal's readiness to mate, not about agreeing to something, putting up
  with something unpleasant, or taking on another person's costs.
examples:
- The cow accepted the bull.
- The mare would not accept the stallion until she was ready.
