simpleMeaning: A building where people keep the prizes of men and women who are well known for what they
  did.
scope: A building that holds the prizes of well-known people, not a place for shows and not a museum of
  old things.
examples:
- The singer was voted into the Hall of Fame last year.
- A visit to the Hall of Fame takes a whole morning.
