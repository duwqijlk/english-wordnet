simpleMeaning: Rose or white flowers crown a low tufted plant that lives for years, with thin evergreen
  leaves like needles, from the United States and grown widely as ground cover.
scope: Also called dwarf phlox, moss phlox, and mountain phlox; this is a low tufted plant with needlelike
  evergreen leaves and pink or white flowers, not the wiry herb of southern California with fringed pink
  flowers.
examples:
- Moss pink covered the rock garden with pink flowers.
- She grew moss pink as a ground cover along the path.
