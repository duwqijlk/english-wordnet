simpleMeaning: A short-lived metal that gives off rays, made from uranium and breaking down first into
  actinium and then into lead.
scope: This is a short-lived metal made from uranium that breaks down into actinium and then lead; Pa,
  protactinium and protoactinium are other names for it, and it is not a stable metal that lasts long
  in nature.
examples:
- Atomic number 91 is the label for protactinium in the table of elements.
- The sample of atomic number 91 broke down fast, first into actinium and then into lead.
