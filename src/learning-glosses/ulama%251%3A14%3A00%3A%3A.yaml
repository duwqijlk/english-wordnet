simpleMeaning: the group of Muslim scholars trained in Islam and Islamic law, who interpret Islamic teachings
  and laws and preserve the community's spiritual and intellectual tradition.
scope: Another name for the body of Muslim scholars also called ulema, not a single cleric or ruler.
examples:
- The ulama have long shaped how Islamic law is taught and understood.
- Local ulama gathered to discuss the new curriculum.
