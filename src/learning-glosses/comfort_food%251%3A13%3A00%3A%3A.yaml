simpleMeaning: Plain dishes that make you feel good, most often dishes high in sugar or carbohydrate,
  the kind that gives the body quick energy, tied to childhood or home cooking
scope: Plain dishes that make you feel good, most often dishes high in sugar or carbohydrate tied to childhood
  or home cooking; not rich dishes for show and not any plain dish.
examples:
- Macaroni cheese is her comfort food after a hard day.
- He missed his mother's cooking, his true comfort food.
