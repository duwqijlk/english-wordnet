simpleMeaning: A sore swelling of the tiny air sacs in the lungs, brought on by breathing in dust; breathed
  in again and again, it may turn long-lasting.
scope: This is a sore swelling of the tiny air sacs in the lungs from breathing in dust, not a sore swelling
  in the socket of a tooth.
examples:
- Breathing in dust brought on alveolitis.
- With repeated exposure, alveolitis may turn long-lasting.
