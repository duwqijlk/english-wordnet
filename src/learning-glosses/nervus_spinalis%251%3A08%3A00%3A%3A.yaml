simpleMeaning: any of 31 pairs of nerves that leave each side of the cord of nerves down the back, each
  joined to it by a front root and a back root
scope: 'Also called spinal nerve: any of the 31 pairs of nerves that leave each side of the cord of nerves
  down the back, not a nerve of the brain and not a single nerve.'
examples:
- Each nervus spinalis leaves the cord of nerves down the back through two roots.
- The nervus spinalis on each side joins the cord by a front root and a back root.
