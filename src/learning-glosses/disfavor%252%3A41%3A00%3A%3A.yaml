simpleMeaning: To put a person or thing at a disadvantage, holding them back or doing them harm.
scope: Also called disadvantage or disfavour, to put a person or thing at a disadvantage; not the noun
  sense of holding back approval from a person or a group.
examples:
- The new rule will disfavor small shops.
- The tax disfavors families with only one income.
