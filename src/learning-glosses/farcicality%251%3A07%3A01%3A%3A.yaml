simpleMeaning: The quality of being like a silly stage play, so odd and foolish as to seem absurd.
scope: The quality of being laughably silly and absurd, not a real farce on stage and not a simple mistake.
examples:
- The farcicality of the trial made the whole courtroom laugh.
- He could not hide the farcicality of wearing a crown to the meeting.
