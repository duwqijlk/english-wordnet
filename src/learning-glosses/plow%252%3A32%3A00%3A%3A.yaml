simpleMeaning: to talk or write about a subject, or show it in a work of art
scope: 'Also called deal, handle, cover, treat, and address: to talk or write about a subject in words
  or art, not the farm tool and not moving through soil like that tool.'
examples:
- This book plows the subject of love in a new way.
- In this chapter, the writer plows the history of the town.
