simpleMeaning: a large bird with a long neck that walks through shallow water on wet low land and flat
  open land in many parts of the world
scope: This is the large long-necked bird that lives near water; it is not the tall machine used to lift
  and move heavy things.
examples:
- A crane stood in the shallow water looking for food.
- Cranes flew over the flat open land at sunset.
