senseId: 'ignition_coil%1:06:00::'
synsetId: 03566040-n
simpleMeaning: Weak power from a battery goes into this wound coil and comes out strong enough to make
  the small plugs fire.
scope: It is the coil between the battery and the plugs, turning weak power into strong power, not the
  battery itself and not the plugs.
examples:
- A bad ignition coil kept the engine from starting.
- The mechanic tested the ignition coil before changing the plugs.
