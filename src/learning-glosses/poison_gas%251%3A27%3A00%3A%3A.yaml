simpleMeaning: An air-like stuff that harms you if you breathe it in or touch it, used in war with chemicals
scope: This is an air-like stuff that harms you if you breathe it in or touch it and is used in war with
  chemicals, not a gas piped into homes for heat or cooking.
examples:
- The soldiers wore masks against the poison gas.
- The troops were warned that poison gas had been used in the area.
