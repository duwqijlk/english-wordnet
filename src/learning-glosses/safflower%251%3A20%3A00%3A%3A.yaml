simpleMeaning: For its red or orange flower heads and seeds that give a costly oil, this thistle-like
  plant of Europe and Asia is grown far and wide.
scope: This thistle-like plant of Europe and Asia is grown for its red or orange flower heads and seeds
  that give oil, and is also called false saffron, not a true thistle and not a plant grown for its flowers
  alone.
examples:
- I can tell safflower by its red flower heads.
- Look for the orange flower heads on the safflower.
