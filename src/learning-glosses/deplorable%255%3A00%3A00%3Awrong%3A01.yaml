simpleMeaning: so bad or wrong that it deserves strong blame
scope: 'Also called criminal, vicious, and reprehensible: an act so wrong that it deserves strong blame,
  not a place or thing that is merely in very poor shape.'
examples:
- Stealing food from the poor was a deplorable act.
- His deplorable lies hurt many people and deserved strong blame.
