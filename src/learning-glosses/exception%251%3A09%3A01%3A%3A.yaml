synsetId: 05829606-n
simpleMeaning: a person or thing that does not fit a rule or a general statement
scope: This is a person or thing that does not follow a general rule; it is not a reason to speak badly
  about someone or something.
examples:
- All the shops close on Sunday, but this small shop is an exception.
- 'Her youngest child was the only exception: all the others were very clever.'
