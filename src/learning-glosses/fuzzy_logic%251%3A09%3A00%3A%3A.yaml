synsetId: 06176210-n
simpleMeaning: a way of working with true and false where a thing can be partly true, with a number from
  0 to 1 for how true it is
scope: A way of working with true and false that lets a thing be partly true, not the usual way in which
  a thing is either true or false, and not a guess.
examples:
- Fuzzy logic lets the washing machine judge how dirty the clothes are.
- The engineer used fuzzy logic to set the fan speed by degrees.
