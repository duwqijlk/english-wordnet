simpleMeaning: Inside the guts of animals with backbones, one of several kinds of worm feeds off its host,
  holding on with a snout that pulls back, covered in many hooked spines.
scope: 'Another name for this sense is spiny-headed worm: a worm that lives inside the guts of an animal
  with a backbone and holds on with a snout that pulls back and bears hooked spines.'
examples:
- The acanthocephalan held fast inside the gut of its host.
- Acanthocephalans live inside the guts of animals with backbones.
