simpleMeaning: So that there is enough stock but never far too much, someone watches over how much is
  kept, where it is stored, and how easy it is to reach
scope: Good stock keeping means watching how much is kept, where it is stored, and how easy it is to reach,
  so there is enough but never far too much.
examples:
- Inventory control keeps track of what is in stock and where it is stored.
- Without inventory control, a shop may hold far too much stock.
