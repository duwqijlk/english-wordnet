simpleMeaning: A shrub of lands east of the Atlantic that lives off other plants, with branching green
  stems, tough leaves, and waxy white sticky berries; the Christmas sprig of long ago.
scope: 'Also called mistletoe and Viscum album: a shrub of lands east of the Atlantic that lives off other
  plants, with branching green stems, tough leaves and waxy white sticky berries, the Christmas sprig
  of long ago, not a free-standing bush and not a holly.'
examples:
- Old World mistletoe hung from the beam at Christmas.
- The white berries of Old World mistletoe were sticky to the touch.
