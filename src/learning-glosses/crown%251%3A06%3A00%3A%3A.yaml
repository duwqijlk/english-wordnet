simpleMeaning: the top part of a hat that sits over the top of the head
scope: This is the top part of a hat. It is not the headpiece a king or queen wears, and not a ring of
  leaves worn by a winner.
examples:
- The crown of his hat was bent out of shape.
- She pushed down the crown of the hat to make it fit.
