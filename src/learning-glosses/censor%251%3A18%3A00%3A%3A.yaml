senseId: 'censor%1:18:00::'
synsetId: 09923092-n
simpleMeaning: a person whose job is to look over books, papers, letters, and plays and to stop all or
  part of what is thought rude or not allowed by the rulers
scope: This is a person with the power to stop books, letters, or plays from reaching people, in whole
  or in part; not a judge, and not a person who merely gives an opinion.
examples:
- The censor cut three pages from the play.
- Under the old laws, a censor read every letter before it was sent.
