senseId: 'polytropic_process%1:22:01::'
synsetId: 92442102-n
simpleMeaning: A change in which a gas grows bigger or is squeezed smaller while pressure times volume,
  raised to one fixed power, stays the same
scope: A kind of gas change with a fixed power in the pressure-volume rule, not a change at fixed heat,
  fixed warmth, or fixed pressure.
examples:
- In a polytropic process, the gas cools as it grows bigger.
- The book works out a polytropic process with the power n set to 1.4.
