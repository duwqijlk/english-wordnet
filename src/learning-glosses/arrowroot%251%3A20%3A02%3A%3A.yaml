simpleMeaning: A canna grown, especially, for its edible rootstock, from which the starch it is named
  for is got.
scope: A canna grown, especially, for its edible rootstock, from which the starch it is named for — arrowroot
  starch — is got; also called achira or indian shot; not a white-flowered West Indian plant, whose root
  yields the starch it is named for, nor a feeding starch got from the root of the arrowroot plant.
examples:
- Their arrowroot grew in the field.
- The arrowroot was cut at noon.
