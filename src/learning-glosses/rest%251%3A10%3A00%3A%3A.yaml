simpleMeaning: a written sign in music showing that there should be no sound for a set length of time
scope: This sense is the printed symbol for silence in music, not a period of sleep or relaxation, and
  not a gentle word for death.
examples:
- The score marks a two-beat rest before the violins enter.
- In this exercise you must count the rests as well as the notes.
