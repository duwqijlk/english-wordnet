simpleMeaning: Any of a group of enzymes, helpers in the body that speed up chemical change, sold under
  this trade name, that split milk sugar into glucose and galactose
scope: These are enzymes sold under this trade name that split milk sugar into glucose and galactose;
  lactase is another name for this sense, and they do not act on a different sugar.
examples:
- She takes Lactaid before drinking milk.
- Lactaid splits lactose into glucose and galactose.
