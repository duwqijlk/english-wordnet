simpleMeaning: A herb of the Canary Islands, grown widely for its blue, purple, red or mixed-colour flowers
  like daisies
scope: Also called cineraria and Pericallis cruenta; a Canary Islands herb grown for its blue, purple,
  red or mixed-colour daisy-like flowers, its near kin being other daisy-like garden flowers such as the
  common daisy and the aster.
examples:
- Senecio cruentus filled the pots with blue and purple flowers.
- We grow Senecio cruentus on the balcony for its bright flowers.
