simpleMeaning: a scientist who has learned to study the hard natural substances found in the earth
scope: This scientist studies the hard natural substances in the earth, not the whole earth itself and
  not living things.
examples:
- As a mineralogist, she can tell what each piece of rock is made of.
- A mineralogist was asked to check the white crystals in the rock.
