simpleMeaning: the waste that sea birds drop from their bodies, used to help plants grow
scope: This is sea bird waste used to help plants grow, not waste from other animals in general and not
  the plants that it helps.
examples:
- Farmers spread guano on the fields to help the crops grow.
- The island rocks were covered in white guano from thousands of sea birds.
