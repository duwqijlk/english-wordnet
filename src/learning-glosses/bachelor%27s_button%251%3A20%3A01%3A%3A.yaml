simpleMeaning: Grown in North America, this plant from Europe and Asia lives for one year and bears showy
  heads of blue, purple, pink, or white flowers.
scope: This one-year plant from Europe and Asia, now grown in North America, is also called bluebottle
  and cornflower, and it is not the tropical American herb with rose to red or purple flowers.
examples:
- She picked a bachelor's button with a blue flower head.
- He grew bachelor's buttons in the garden for their showy flowers.
