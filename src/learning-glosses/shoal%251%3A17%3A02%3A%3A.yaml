simpleMeaning: a bank of sand in a stretch of water, which can be seen when the water is low
scope: This is a bank of sand in water that can be seen when the water is low. Not a large group of fish
  swimming together, and not shallow water in general.
examples:
- The boat slowed down so it would not hit the shoal at low tide.
- At low tide, a long shoal of sand showed above the river water.
