simpleMeaning: A dull-coloured flying insect whose young have tufts of hair on their bodies and eat the
  leaves of many trees that lose their leaves in winter.
scope: This is a dull-coloured flying insect whose young eat leaves, also called lymantriid; not a butterfly
  and not a beetle.
examples:
- The tussock moth rested on the oak leaf.
- Tussock moths lay eggs on tree bark.
