simpleMeaning: to say that something is true in a serious, formal way
scope: swear, swan, assert and verify are other names for this sense; not just saying something in passing,
  and not denying it.
examples:
- Before the court, she affirmed that she had told the truth.
- He affirmed his support for the plan in writing.
