simpleMeaning: a payment that the government asks for in special times, meant to pay for work that in
  theory joins people together
scope: A special government tax, also called solidarity surcharge; not an ordinary tax and not a fine.
examples:
- A solidarity tax was set to pay for the repair work.
- The solidarity tax helped pay for work meant to join people together.
