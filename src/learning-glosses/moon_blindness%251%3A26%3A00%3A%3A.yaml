simpleMeaning: Swelling and soreness in a horse's eye that keeps coming back and can end with the horse
  unable to see.
scope: Also called mooneye; this is eye trouble in horses that comes back again and again, not poor sight
  in dim light.
examples:
- The vet said the old horse had moon blindness.
- Moon blindness kept coming back in the mare's left eye.
