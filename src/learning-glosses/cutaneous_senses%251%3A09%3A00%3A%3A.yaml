simpleMeaning: the power to know things outside the body by feeling them with the skin, most of all with
  the hands
scope: The power to feel things by touch, also called touch, not sight and not hearing.
examples:
- We use our cutaneous senses to tell hot from cold without looking.
- Her cutaneous senses told her the cloth was rough.
