simpleMeaning: about or connected with an area of land that a country or ruler controls
scope: This is about an area of land that a country or ruler controls; not the sense of belonging to such
  an area, not about guarding land against others coming in, and not a soldier or an army unit.
examples:
- The two countries argued over territorial claims to the island.
- The territorial government of the islands makes its own local rules.
