simpleMeaning: in swamps full of trees in the warm New World tropics lives this American stork, whose
  bill bends down like the bills of the wading birds it resembles
scope: Also called flinthead and wood stork, a stork of warm American swamps with a bill that bends down,
  not a heron and not a crane.
examples:
- The wood ibis stood in the swamp, its bill bent down toward the water.
- A wood ibis feeds in the shallow water of wooded swamps.
