simpleMeaning: A natural underground hollow that can be entered from the surface or from the sea.
scope: A natural underground space entered from land or sea, not the verb for exploring such places and
  not the verb for hollowing something out.
examples:
- The hikers sheltered in a cave when the storm began.
- The waves had carved a cave into the cliff face.
