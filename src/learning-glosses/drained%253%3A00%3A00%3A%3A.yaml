simpleMeaning: emptied of what it held, as when water or another liquid is taken out by drawing it off
scope: About something emptied of what it held, such as a tank or a marsh emptied of water; not about
  a battery that has lost all its power.
examples:
- The drained pool was dry and ready to be cleaned.
- They walked across the drained marsh to the other side.
