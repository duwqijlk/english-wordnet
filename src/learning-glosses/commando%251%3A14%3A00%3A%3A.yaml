simpleMeaning: a group of soldiers who can move on land and water and are taught to make sudden attacks
  on enemy land
scope: A whole group of soldiers taught to attack from land or water, not one single soldier in such a
  group.
examples:
- The commando moved as one group from the sea onto enemy land to attack the port.
- A new commando was formed and taught to make raids on land and from water.
