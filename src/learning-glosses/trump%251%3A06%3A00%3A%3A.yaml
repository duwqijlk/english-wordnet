simpleMeaning: a card in the group of cards that has been chosen to beat all the other groups in this
  hand
scope: This is one card from the winning group, not the whole winning group itself, not a brass music
  instrument with a bright sound, and not the act of playing such a card.
examples:
- She played a trump and won the hand.
- His only trump was the ace of hearts.
