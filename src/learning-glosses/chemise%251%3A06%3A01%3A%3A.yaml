senseId: 'chemise%1:06:01::'
synsetId: 03017234-n
simpleMeaning: A sleeveless undergarment for a woman, worn under her outer clothes.
scope: Also called a shift, a slip, or a teddy, and also called a shimmy, this is a woman's sleeveless
  undergarment; not the loose dress that hangs straight from the shoulders with no waist.
examples:
- She wore a chemise under her dress.
- The chemise was soft and sleeveless.
