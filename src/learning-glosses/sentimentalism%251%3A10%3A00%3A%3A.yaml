simpleMeaning: The showing, more than is fitting, of soft feelings, longing for the past, or sadness,
  in any form.
scope: The showing, more than is fitting, of soft feelings, longing for the past, or sadness; not a liking
  for such feelings.
examples:
- The film was full of sentimentalism, with tears at every turn.
- Critics blamed the novel's sentimentalism for its weak ending.
