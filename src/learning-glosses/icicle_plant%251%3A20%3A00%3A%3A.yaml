simpleMeaning: A plant of the Old World that lives one year, now at home far and wide in warm lands, has
  white flowers and thick leaves whose hairs look like ice.
scope: Also called ice plant, it is the Old World plant whose thick leaves are covered in hairs that look
  like ice.
examples:
- The icicle plant opened white flowers.
- Hairs on the icicle plant leaves look like ice.
