simpleMeaning: a story told with sound and moving pictures, shown as entertainment at a cinema or on television.
scope: Not the camera material and not a thin layer of something; here it means a movie.
examples:
- We watched a French film at the cinema last night.
- Her new film will be shown on television next month.
