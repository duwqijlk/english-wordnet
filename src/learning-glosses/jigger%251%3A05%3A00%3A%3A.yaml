simpleMeaning: A very young mite (a tiny animal) that sucks blood from animals with a backbone and from
  people, and makes the skin very sore and itchy
scope: This tiny animal, also called chigger, redbug and harvest mite, sucks blood and hurts the skin;
  it is not a small mast on a boat or a small glass for whiskey.
examples:
- A jigger bit his foot and the skin became very sore.
- Jiggers live in long grass and can suck blood from people walking there.
