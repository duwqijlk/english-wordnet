simpleMeaning: the study of tiny living parts taken from early unborn young that can grow into many kinds
  of body parts, and how they can be used to treat sick people
scope: The study of early cells and their use in treating sick people, not the study of cells from grown
  people and not a treatment given to one sick person.
examples:
- Embryonic stem-cell research may one day help doctors treat illnesses that have no cure yet.
- They work in embryonic stem-cell research, studying cells that can grow into many kinds of tissue.
