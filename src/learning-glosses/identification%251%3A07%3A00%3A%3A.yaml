simpleMeaning: Taking on the ways of another person or group as if they were your own, whether you mean
  to or not.
scope: Taking on another person or group's ways as if they were your own, not a paper that proves who
  you are and not the act of naming a thing.
examples:
- His identification with his father shaped everything he did.
- Her identification with the team was plain in the way she spoke.
