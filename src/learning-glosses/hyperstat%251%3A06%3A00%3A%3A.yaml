simpleMeaning: A drug that widens blood tubes and is used to treat very high blood pressure.
scope: A drug that widens blood tubes, also called diazoxide; not a drug that narrows blood tubes and
  not a drug for low blood pressure.
examples:
- The doctor gave him Hyperstat for his very high blood pressure.
- Hyperstat widened the blood tubes and brought his pressure down.
