simpleMeaning: long-lasting sweet-smelling wood from trees of this kind, most of all from the red kind,
  often used to make chests
scope: Wood from trees of this kind, not the trees themselves.
examples:
- The cedar chest was made of sweet-smelling wood that lasts for years.
- He lined the closet with cedar to keep moths away.
