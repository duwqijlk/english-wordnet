simpleMeaning: A mushroom whose top is covered with dark threads in the middle and has yellowish edges
scope: A mushroom told apart from other mushrooms of its kind, which have plain white tops or yellow plates,
  by dark threads covering only the middle of its top and yellowish edges.
examples:
- Tricholoma sejunctum stood out by the dark threads on its cap.
- The yellowish edges of Tricholoma sejunctum were easy to see.
