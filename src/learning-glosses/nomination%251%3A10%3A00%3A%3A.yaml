simpleMeaning: a speech, usually at a big meeting of a political party, that puts forward a person's name
  as a choice for an election
scope: This is the speech that puts a name forward, usually at a big party meeting, not the state of being
  the person put forward for a job or election.
examples:
- In his nomination, he put forward her name for president.
- The nomination at the meeting took only five minutes and named the candidate.
