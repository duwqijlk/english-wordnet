simpleMeaning: the plumage, the outer covering on a grown bird's body that gives it its shape
scope: The outer covering that gives a grown bird its shape, not the soft down underneath and not the
  feathers of a young bird.
examples:
- The contour feathers lay smooth over the bird's back.
- Moulting birds lose their old contour feathers and grow new ones.
