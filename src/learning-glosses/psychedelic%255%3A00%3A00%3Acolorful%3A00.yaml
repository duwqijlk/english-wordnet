simpleMeaning: having very bright colors and strange patterns, like those linked with a changed state
  of mind
scope: This describes bright colors and strange patterns; it is not the sense that means causing strange
  changes in what a person sees and feels, and not the changed state of mind itself.
examples:
- The wall was covered with a psychedelic painting in bright pink and green.
- He wore a psychedelic shirt with strange, swirling patterns.
