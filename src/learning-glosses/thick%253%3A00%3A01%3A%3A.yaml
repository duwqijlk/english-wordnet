simpleMeaning: Measuring a good distance between opposite surfaces, or having a particular measurement
  of that kind, usually across the shortest of three dimensions.
scope: This describes how far across a solid object measures, not a liquid's dense texture, a crowded
  group, or the adverb for flowing heavily.
examples:
- The ice on the pond was thick enough to bear his weight.
- Cut the bread into thick slices.
