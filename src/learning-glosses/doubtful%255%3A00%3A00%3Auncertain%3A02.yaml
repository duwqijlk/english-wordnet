simpleMeaning: not known for sure, with much that is unclear about what is true or will happen
scope: A result or fact that is not sure or clear, not a person or record that people think may be dishonest
  and may not trust.
examples:
- It is doubtful whether the bridge will hold in the storm.
- The result is still doubtful, and no one knows who will win.
