simpleMeaning: In medicine, cleaning a wound or a part of the body by washing it out with water or with
  a healing liquid
scope: In medicine, cleaning a wound or body part by washing it out; not watering dry land and not a simple
  wash of the skin.
examples:
- The nurse used irrigation to clean the deep cut.
- Irrigation of the wound took several minutes.
