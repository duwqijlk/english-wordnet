simpleMeaning: A curved piece over the wheel of a bicycle or motorbike, keeping water and mud thrown up
  by the wheel off the rider.
scope: Also called a splash-guard or a splash guard, it is a curved piece over a wheel that keeps water
  and mud thrown up by the wheel off the rider.
examples:
- The mudguard rattled every time the bicycle hit a bump.
- Mud splashed over his shoes because the mudguard was missing.
