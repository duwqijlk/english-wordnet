simpleMeaning: one of the four upright posts at the corners of a bed frame
scope: One of the four upright posts at a bed's corners, not the bed frame itself and not a post of any
  other kind of furniture.
examples:
- He tied the ribbon to the bedpost.
- The old bed had tall carved bedposts at each corner.
