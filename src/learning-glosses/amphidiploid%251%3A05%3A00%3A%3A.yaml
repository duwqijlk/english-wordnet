simpleMeaning: In genetics, a living thing or cell that has two full sets of the threads that carry what
  it inherits, one full set from each parent.
scope: In genetics, a living thing or cell that has two full sets of the threads that carry what it inherits,
  one full set from each parent, not a living thing with only one set of threads from each parent and
  not a living thing with a single set of threads in all.
examples:
- The new wheat plant was an amphidiploid.
- An amphidiploid has a double set of threads from each parent.
