simpleMeaning: Of the years before the start of the count we use today, this is the form some writers
  who are not Christians like to use
scope: Also called BCE, this marks a year as before the start of the count we use today, not a year after
  it.
examples:
- The wall was built in 200 B.C.E.
- She wrote the year as 300 B.C.E. in her notes.
