simpleMeaning: shaped like an octagon (a flat shape with eight straight sides), or having to do with such
  a shape
scope: About a shape with eight straight sides, or shaped like one; not round, not square, and not a shape
  with six sides.
examples:
- The old tower has a small octagonal window.
- They sat around an octagonal table in the garden.
