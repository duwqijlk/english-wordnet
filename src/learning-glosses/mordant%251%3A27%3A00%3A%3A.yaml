senseId: 'mordant%1:27:00::'
synsetId: 14979169-n
simpleMeaning: A substance used to treat leather or other materials before they are dyed, helping the
  dye to take.
scope: A substance that helps dye take hold in leather or cloth, not the biting-acid sense and not the
  bitter-word sense.
examples:
- The dyer dipped the cloth in mordant before the dye.
- Without mordant, the colour washed straight out.
