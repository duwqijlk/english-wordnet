simpleMeaning: The organ from an animal's head that people eat as food.
scope: This is the noun for animal head meat eaten as food, not the organ as part of a living body, not
  mental ability, not the mind or seat of reason, not a very clever and original person, not the verb
  sense for hitting someone on the head, and not the verb sense for killing by smashing the skull.
examples:
- She cooked lamb brains with butter and herbs.
- The dish is made from calves' brains.
