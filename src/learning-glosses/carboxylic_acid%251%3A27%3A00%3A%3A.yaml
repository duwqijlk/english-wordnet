simpleMeaning: a sour chemical substance made with carbon, marked by one or more groups that make it sour
scope: A sour substance of the organic kind, not a sharp mineral acid and not vinegar or a sour fruit.
examples:
- Vinegar gets its bite from a carboxylic acid called acetic acid.
- The lab tested the carboxylic acid to see how strong it was.
