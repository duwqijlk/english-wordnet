simpleMeaning: To use clues in the lines on a hand, tea leaves, an animal’s guts, the sky, or someone’s
  behavior to work out what is happening or may happen.
scope: This is not getting stored digital data, reporting a value on an instrument, or interpreting the
  wording of a message; it is finding meaning in signs from nature or behavior.
examples:
- She read the clouds and knew a storm was coming.
- He read her body language and sensed that she was nervous.
