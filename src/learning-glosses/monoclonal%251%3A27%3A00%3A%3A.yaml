simpleMeaning: In a lab, one line of cells turns out matching germ-fighting bits, every one a copy of
  the rest.
scope: It is also called monoclonal antibody, one of a class of germ-fighting bits made in a lab from
  a single line of cells.
examples:
- The lab grew a monoclonal from a single clone of cells.
- Each monoclonal in the dose matches the others exactly.
