simpleMeaning: A germ-killing drug, sold as Dynapen, used for staph infections that penicillin cannot
  cure
scope: A drug that kills staph germs penicillin cannot beat, not penicillin itself and not a drug for
  viruses.
examples:
- The doctor gave him dicloxacillin for the staph infection.
- Dicloxacillin cleared the infection that penicillin had failed to cure.
