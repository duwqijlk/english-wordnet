simpleMeaning: In genetics, the way DNA (the material in a cell that tells how a living thing grows) makes
  a copy of itself before a cell splits into two
scope: This is the copying before a cell splits, not a fast answer and not doing a test again to check
  a result.
examples:
- Replication must finish before the cell can split into two.
- During replication, DNA makes a copy of itself.
