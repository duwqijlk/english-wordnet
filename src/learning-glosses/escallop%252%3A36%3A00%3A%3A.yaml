simpleMeaning: to cook food in the oven in a sauce, milk, or some other wet food, often with small bits
  of bread on top
scope: 'Also called scallop: to cook food in the oven in a sauce or milk, often with small bits of bread
  on top, not to fry a thin slice of meat and not to eat the shellfish itself.'
examples:
- She escalloped the potatoes in milk with breadcrumbs on top.
- We escallop the fish in a white sauce for Sunday lunch.
