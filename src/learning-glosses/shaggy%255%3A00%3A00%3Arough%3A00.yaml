simpleMeaning: having a very rough raised surface, or covered with long loose hanging parts
scope: This sense is about a rough surface or rough cloth, not about thick hair that is poorly kept.
examples:
- We wiped our feet on the shaggy rug by the door.
- He wore a coat made of shaggy cloth with a rough surface.
