simpleMeaning: To do with the loss of power to move part of the body.
scope: To do with the loss of power to move part of the body, not a person who suffers that loss, and
  not a person described as so affected.
examples:
- The symptoms were paralytic, pointing to nerve damage.
- The weakness was paralytic in nature, and the doctors took it seriously.
