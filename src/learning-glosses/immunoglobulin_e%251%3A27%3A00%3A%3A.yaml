simpleMeaning: One of the five main kinds of antibody, found chiefly in the skin and the wet linings of
  the body.
scope: One of the five main kinds of antibody, also called IgE; not one of the other four kinds.
examples:
- The test looked for immunoglobulin E, one of the five main kinds of antibody.
- The test measured immunoglobulin E in her blood.
