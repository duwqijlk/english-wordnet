simpleMeaning: A drug made from the left-turning form of a body chemical, sold as Bendopa and Larodopa,
  used to treat Parkinson's disease, a shaking illness of the nerves.
scope: This is a drug for Parkinson's disease made from one form of a body chemical; levodopa, Bendopa,
  L-dopa and Larodopa are other names for it, not other drugs for shaking illnesses.
examples:
- The doctor gave her Brocadopa for her Parkinson's disease.
- Brocadopa helped his shaking hands stay still.
