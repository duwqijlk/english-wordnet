simpleMeaning: To hit someone again and again with short quick blows of the fist
scope: To strike with short quick blows of the fist, not a single sudden poke or thrust and not the noun
  sense of a sudden touch with a finger or an elbow.
examples:
- The boxer jabbed at his opponent's face through the whole round.
- He jabbed the punch bag with short quick blows to warm up.
