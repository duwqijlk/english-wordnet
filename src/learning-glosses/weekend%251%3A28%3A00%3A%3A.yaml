simpleMeaning: This is the period from Friday evening through Sunday, or more loosely any run of days
  that includes exactly one Sunday.
scope: It is the whole period at the end of the week, not a single day off or a public holiday.
examples:
- We spent the weekend at the lake.
- Her weekend begins on Friday evening.
