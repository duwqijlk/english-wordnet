simpleMeaning: a way of finding far-off things by sending out microwave pulses and listening for the echo
  that comes back
scope: Also called radar, microwave radar, and radio detection and ranging; it finds distant objects by
  echo, not a map or a compass that shows where things are.
examples:
- Radiolocation lets ships find the coast in fog.
- The plane used radiolocation to spot the runway.
