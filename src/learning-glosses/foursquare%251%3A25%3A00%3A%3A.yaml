simpleMeaning: In geometry, a flat shape with four sides all the same length and four square corners,
  a regular shape with four sides.
scope: In geometry, a flat shape with four equal sides and four square corners, also called a square,
  not standing firm without giving way.
examples:
- The foursquare plot of land had four sides of the same length.
- Draw a foursquare with each side three inches long.
