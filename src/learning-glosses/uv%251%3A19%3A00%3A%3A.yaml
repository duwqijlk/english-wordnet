simpleMeaning: Light rays beyond the violet end of what the eye can see, with waves shorter than light
  but longer than X rays
scope: This radiation is also called ultraviolet, ultraviolet illumination, ultraviolet light and ultraviolet
  radiation; it is not visible light and not X rays.
examples:
- UV from the sun can burn the skin.
- Wear cream to guard against UV.
