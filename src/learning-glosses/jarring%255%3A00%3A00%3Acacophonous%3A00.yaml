simpleMeaning: making a rough, unpleasant sound that annoys people who hear it
scope: Making a rough sound that annoys the hearer, not a sight that shocks you and not a shake that moves
  things.
examples:
- The jarring noise of the iron gate scraping on the sidewalk woke us.
- The jarring sound of the alarm made everyone cover their ears.
