simpleMeaning: A California plant, a cross of two kinds of bramble, with large dark wine-red fruit that
  tastes like a small red fruit of the bramble kind.
scope: 'Also called boysenberry bush: the plant grown in California for its large dark wine-red fruit,
  not the fruit itself.'
examples:
- The boysenberry bore large dark wine-red fruit.
- Boysenberry is a cross of two kinds of bramble.
