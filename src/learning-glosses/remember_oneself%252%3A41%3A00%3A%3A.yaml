senseId: 'remember_oneself%2:41:00::'
synsetId: 02603965-v
simpleMeaning: To get back one's good ways after a slip, or to stop acting badly.
scope: To get back one's good ways after a slip, or to stop acting badly; not to call a past thing to
  mind, not to keep a thing in mind for later, and not to wake up after a faint.
examples:
- One should remember oneself after a rude outburst and apologise.
- When one forgets one's manners, one must remember oneself and behave well.
