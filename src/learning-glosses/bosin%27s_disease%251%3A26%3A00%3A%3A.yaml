synsetId: 14367594-n
simpleMeaning: A rare long-lasting brain swelling that slowly worsens, from the measles virus, mostly
  in children and young adults; death usually comes within three years, after first measles before age
  two.
scope: 'Also called inclusion body encephalitis, sclerosing leukoencephalitis, subacute inclusion body
  encephalitis, subacute sclerosing leukoencephalitis, subacute sclerosing panencephalitis, Dawson''s
  encephalitis, SSPE, and Van Bogaert encephalitis: a rare long-lasting brain swelling from the measles
  virus, not a short illness and not a brain swelling from another cause.'
examples:
- Bosin's disease struck children who had measles before age two.
- Doctors feared Bosin's disease because death usually came within three years.
