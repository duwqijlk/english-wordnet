simpleMeaning: Pain near the egg-making part of the body, felt when an egg is set free, usually halfway
  through the monthly cycle
scope: Pain near the egg-making part of the body, felt when an egg is set free, usually halfway through
  the monthly cycle; not pain from a monthly bleed and not pain from a swollen egg-making part.
examples:
- Her mittelschmerz came halfway through the month.
- Mittelschmerz is the ache some women feel when an egg is set free.
