simpleMeaning: a person's level of physical health and fitness, whether good or poor
scope: This is about how fit and healthy someone is, as in 'in condition', not the outline or visible
  form of something.
examples:
- She runs every morning to stay in shape.
- After the injury he was badly out of shape.
