simpleMeaning: helping to build, improve, or help something grow and get better
scope: This is about work, advice, or an attitude that helps to build or improve something, not the sense
  that only points to what is good or hopeful.
examples:
- Her constructive advice helped us make the plan better.
- He took a constructive way of dealing with the problem and fixed its weak parts.
