simpleMeaning: The head of a former group that runs the United States; in nineteen forty-seven it joined
  the head of the war department to form the head of the defense department.
scope: This word is for a head of a government part that is gone, not for the head of the war department
  and not for the head of the defense department.
examples:
- The Secretary of the Navy led the department before nineteen forty-seven.
- In nineteen forty-seven, the Secretary of the Navy joined with the War Secretary to form the Defense
  Secretary.
