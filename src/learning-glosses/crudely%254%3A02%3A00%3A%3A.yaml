simpleMeaning: In a rough, plain way, in words or acts that are not polite and show no fine manners
scope: A rough, plain way of acting or speaking, not the sense that means done with no skill.
examples:
- He laughed crudely at the sad story.
- She spoke crudely, using rough words in front of the children.
