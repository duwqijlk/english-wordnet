simpleMeaning: A tall herb with bunches of white flowers touched with green; it grows in the north-west
  of the United States; at times put in the genus that shares its name.
scope: 'Also called green gentian and Frasera speciosa: a tall herb with bunches of white flowers touched
  with green, from the north-west of the United States, not a short herb with yellow flowers.'
examples:
- Swertia speciosa grew tall in the north-western United States.
- The Swertia speciosa flowers were white, flushed with green.
