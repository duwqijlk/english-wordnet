simpleMeaning: the part of a glove that covers the short, thick finger at the side of the hand
scope: This is a part of a glove, not the finger itself and not a curved strip of wood or stone.
examples:
- The thumb of my glove has a small hole in it.
- His left glove tore at the thumb when he fell.
