simpleMeaning: a way of showing a substance with marks that stand for the parts it is made of
scope: 'Also called formula: a way of showing a substance with marks that stand for the parts it is made
  of, not the stuff itself and not a set of steps for making it.'
examples:
- Water has the chemical formula H2O.
- The teacher wrote the chemical formula on the board.
