simpleMeaning: Any of several plants, mostly from lands round the Mediterranean, of the groups that share
  its name, with long thin leaves and clusters of white, pink, or yellow flowers.
scope: Any of several plants of the groups called Asphodeline and Asphodelus, mostly from lands round
  the Mediterranean, with long thin leaves and clusters of white, pink, or yellow flowers.
examples:
- Asphodel grew on the dry hillside above the sea.
- The asphodel flowers were white and pink in the spring.
