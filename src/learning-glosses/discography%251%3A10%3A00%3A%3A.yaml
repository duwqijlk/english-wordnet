simpleMeaning: a list that gives details about music recordings, telling what each one holds
scope: A list that gives details about music recordings, and not a list of books or a set of the recordings
  themselves.
examples:
- Her discography lists every album the band made, with the year of each one.
- The library keeps a discography of the singer's recordings for visitors to look through.
