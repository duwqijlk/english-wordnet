simpleMeaning: like tiny hard grains, or holding them, or full of them, or growing where those grains
  cover the ground
scope: This word is used for things that look like sand or hold some or a lot of it, or plants that grow
  in sandy places; also called sandy and arenaceous. Not a word for wet mud and not a word for bare rock.
examples:
- The sandlike soil crumbled between my fingers.
- Sandlike grass grew along the edge of the dunes.
