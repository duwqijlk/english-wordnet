simpleMeaning: A showy fleshy plant that grows low on the ground in the Rocky Mountains, with deep to
  pale pink flowers and starchy roots; it is the state flower of Montana.
scope: Also called bitterroot; a showy low plant of the Rocky Mountains with pink flowers, not a tall
  shrub and not a cactus.
examples:
- Lewisia rediviva carpets the high ground with pink flowers in spring.
- Montana chose Lewisia rediviva as its state flower.
