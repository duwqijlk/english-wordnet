simpleMeaning: A small, legless lizard of Europe that digs in the ground, with tiny eyes; people often
  think it is blind.
scope: This is a small, legless lizard of Europe with tiny eyes, also called blindworm and slowworm; not
  a snake and not a lizard with legs.
examples:
- Anguis fragilis slipped into its burrow.
- People often think Anguis fragilis is blind, but it can see.
