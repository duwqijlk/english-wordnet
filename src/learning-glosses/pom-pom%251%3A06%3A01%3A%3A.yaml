simpleMeaning: Wool or silk gathered into tufts makes a ball that is worn most often on a hat as a pretty
  extra.
scope: Also called a pompon, this decoration is a ball of wool or silk gathered into tufts, most often
  worn on a hat.
examples:
- A pom-pom sat on top of the hat.
- The pom-pom was made of tufted wool.
