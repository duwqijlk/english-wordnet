simpleMeaning: a cloth that opens in the air to slow a thing that is moving fast
scope: 'Also called a drogue or a drogue parachute: a cloth that opens in the air to slow a fast-moving
  thing, not the main parachute that carries a person down and not the small one that pulls the main parachute
  from its pack.'
examples:
- The drogue chute opened behind the space capsule to slow it down.
- Engineers tested the drogue chute on the fast-moving test vehicle.
