synsetId: 07494284-n
simpleMeaning: In computer science, when the reading and writing part inside a hard disk drive touches
  the flat round plate that holds the data, it usually breaks
scope: In computer science, a failure of the reading and writing part in a hard disk drive, not a failure
  of the whole computer and not a scratch on the disk.
examples:
- The head crash destroyed the files on the old computer.
- A head crash in the drive made the laptop stop reading its disk.
