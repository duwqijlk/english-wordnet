simpleMeaning: much like syphilis in its first stages, this catching sickness of warm lands breaks out
  in red patches of skin that grow into open sores
scope: Also called yaws and frambesia, this catching sickness of warm lands breaks out in red skin sores,
  not syphilis itself.
examples:
- Framboesia left red sores on the boy's arms.
- The nurse treated framboesia with medicine for the skin sores.
