senseId: hooked%5:00:00:curved:00
synsetId: 02324046-s
simpleMeaning: having a shape bent in a curve at one end, or like that shape, especially one that can
  catch and hold things
scope: This describes something bent in a curve at one end, in a shape that can catch and hold things;
  it is not just a nose or beak bent down at the end.
examples:
- The plant has hooked thorns that catch on clothing.
- She hung the bag on a hooked branch that held it firmly.
