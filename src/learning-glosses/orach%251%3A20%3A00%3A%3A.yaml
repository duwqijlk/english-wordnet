simpleMeaning: In dry land and in salty marshes grow soft-stemmed plants of the group called Atriplex,
  one of many kinds.
scope: Also called orache, this is one of many soft-stemmed plants of the group called Atriplex that grow
  well in dry land and salty marshes.
examples:
- The orach in the marsh grew well in salty ground.
- We found orach thriving in the dry desert soil.
