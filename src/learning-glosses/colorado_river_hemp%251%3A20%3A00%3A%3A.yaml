simpleMeaning: A tall one-year plant of the south-western United States, widely grown to feed the soil;
  it gives a strong tough plant fibre once used by native peoples for rope.
scope: 'Also called Sesbania exaltata: a tall one-year plant of the south-western United States grown
  to feed the soil, not a tree and not a plant grown for food.'
examples:
- Colorado River hemp grew tall in the field, planted to feed the soil.
- Farmers once made rope from Colorado River hemp fibre.
