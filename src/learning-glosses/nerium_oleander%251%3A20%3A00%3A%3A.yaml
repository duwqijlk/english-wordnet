simpleMeaning: A flowering shrub grown for show but poisonous, with narrow evergreen leaves and clusters
  of sweet-smelling white, pink, or red flowers; from the East Indies, widely grown in warm lands.
scope: Also called oleander and rose bay; a poisonous flowering shrub of warm lands, not a rose and not
  a safe garden plant.
examples:
- Nerium oleander lines the road with pink flowers, but every part is poisonous.
- They grow Nerium oleander in warm gardens for its sweet-smelling blooms.
