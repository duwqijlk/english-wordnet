scope: Any of a set of enzymes that speed up a chemical change, called oxidation, in a compound by a peroxide,
  found above all in plant cells, not the peroxide itself and not a plant cell.
examples:
- Peroxidase helps the cell break down the peroxide.
- The lab measured peroxidase in the leaf sample.
