simpleMeaning: a machine part that uses gas held in a closed space to soften the jolt of movement
scope: A machine part that uses gas held in a closed space to soften the jolt of movement; air cushion
  is another name for this, not a metal spring and not a part that uses oil.
examples:
- The air spring softened the jolt as the truck stopped.
- Air springs hold the coach level over bumps.
