simpleMeaning: A large shapely leaf-shedding tree with a rounded crown, widespread in eastern North America,
  with large leaves bearing three-sided spiny-tipped lobes and coarse wood less lasting than white oak
  wood.
scope: A large eastern oak, also called northern red oak and Quercus rubra; not a white oak and not a
  pine.
examples:
- Quercus borealis shades the old farmhouse.
- The wood of Quercus borealis is coarse and less lasting than white oak.
