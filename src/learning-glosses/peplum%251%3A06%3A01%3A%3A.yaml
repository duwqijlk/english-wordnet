simpleMeaning: Worn by women in ancient Greece, it is cloth fastened at the shoulders and hanging in folds
  down to the waist.
scope: Also called peplos and peplus, it is the piece of clothing worn by women in ancient Greece, fastened
  at the shoulders and hanging in folds down to the waist, not the flared ruffle worn at the waist of
  a dress or jacket.
examples:
- The peplum fell in folds to her waist.
- Her peplum was caught at the shoulders.
