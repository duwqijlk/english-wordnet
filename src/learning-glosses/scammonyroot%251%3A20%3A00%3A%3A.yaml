simpleMeaning: a tropical American plant lying flat or climbing, with soft stems living for years and
  a very big root full of starch; some say the sweet potato came from it
scope: A tropical American plant with soft stems and a very big starchy root, not the sweet potato itself;
  man-of-the-earth, manroot, wild potato vine and wild sweet potato vine are other names for this sense.
examples:
- The scammonyroot spreads flat across the garden bed.
- Farmers dig up the scammonyroot for its big starchy root.
