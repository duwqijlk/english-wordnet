simpleMeaning: in a way that shows a person is tired and nearly asleep
scope: This means speaking or acting in a tired, nearly asleep way, not in a bright, wide-awake way.
examples:
- She answered drowsily, with her eyes half closed.
- He nodded drowsily and almost fell asleep in his chair.
