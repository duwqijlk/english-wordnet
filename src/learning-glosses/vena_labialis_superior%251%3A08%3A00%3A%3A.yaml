synsetId: 05379320-n
simpleMeaning: a small tube that carries blood from the upper lip and joins the large blood tube of the
  face
scope: Also called the superior labial vein, it is a blood tube that takes blood away from the upper lip,
  not the one that takes blood away from the lower lip.
examples:
- The vena labialis superior carries blood away from the upper lip.
- The cut on her upper lip bled a lot, and the vena labialis superior took the blood back toward the face.
