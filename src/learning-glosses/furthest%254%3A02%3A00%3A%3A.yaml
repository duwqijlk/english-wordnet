senseId: 'furthest%4:02:00::'
synsetId: 00031050-r
simpleMeaning: to a distance in space or time greater than any other
scope: Also called farthest, and for this space or time sense farthest is used more often than furthest;
  it is not the sense that means to the greatest degree or level.
examples:
- He swam the furthest of all the children in the race.
- Of all the places we visited, the small island was furthest from home.
