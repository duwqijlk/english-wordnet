simpleMeaning: a court officer whose job is to carry out written court orders and other court papers,
  and to arrest people
scope: A court officer who carries out court orders and can arrest people, not a judge who decides cases
  and not a lawyer who speaks for a person in court.
examples:
- The bailiff came to the house with a court order.
- The bailiff arrested the man who had not come to court.
