simpleMeaning: 'A basic part of forming an idea: the picture in the mind of what the senses take in'
scope: 'Also called a percept or perception: the mind''s picture of what the senses take in, not the thing
  itself and not a thought about something not sensed.'
examples:
- Her perceptual experience of the room was of a bright, open space.
- A perceptual experience can change how we form ideas about the world.
