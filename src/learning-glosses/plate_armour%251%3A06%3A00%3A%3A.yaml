simpleMeaning: A sheet of steel made extra hard, used to shield forts or vehicles from enemy fire.
scope: A sheet of steel made extra hard, used to shield forts or vehicles from enemy fire; armor plate,
  armor plating, armour plate and plate armor are other names for this sense, not chain mail and not a
  shield.
examples:
- Plate armour shielded the tank from shell fire.
- The fort's walls were faced with plate armour.
