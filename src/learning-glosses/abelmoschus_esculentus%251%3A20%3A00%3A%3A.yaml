simpleMeaning: Tall coarse one-year Old World tropical plant, widely grown in southern US and West Indies
  for long sticky green pods, soup-and-stew base; sometimes put with hibiscus.
scope: A tall plant of the tropics, also called okra, gumbo, lady's-finger, okra plant, and Hibiscus esculentus;
  not other pod vegetables and not other hibiscus kinds.
examples:
- Abelmoschus esculentus grows tall in the warm South.
- The sticky pods of Abelmoschus esculentus thicken soups and stews.
