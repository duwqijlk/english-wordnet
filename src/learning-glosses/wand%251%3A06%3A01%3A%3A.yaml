simpleMeaning: A thin stick that narrows toward one end, held by a conductor to direct an orchestra or
  choir.
scope: This is the conductor's rod, not a magician's rod, a thin twig, or a ceremonial staff.
examples:
- The conductor raised the wand and the orchestra fell silent.
- She tapped the music stand with her wand to begin.
