simpleMeaning: In geology, the field that groups rocks by what they are made of, where they come from,
  and how they form.
scope: Also called petrology, it is the branch of geology that sorts rocks by what they are made of and
  how they came to be.
examples:
- Lithology groups rocks by their mineral make-up.
- She studies lithology to learn how rocks form.
