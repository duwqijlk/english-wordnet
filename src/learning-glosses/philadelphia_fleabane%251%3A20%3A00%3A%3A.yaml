simpleMeaning: A plant noted for its beauty, with a fine edge of thread-like rays around flower heads
  of very thin white or pink rays, found in the United States and Canada
scope: This is a plant noted for its beauty, with a fine edge of thread-like rays; Erigeron philadelphicus
  is another name for it, not a plant with broad rays.
examples:
- Philadelphia fleabane has very slender white or pink rays.
- The Philadelphia fleabane grows in the United States and Canada.
