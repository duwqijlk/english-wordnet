simpleMeaning: A blend of clay and chemicals in water, sent down the bore pipe to oil and chill the bit,
  rinse out the cuttings, and shore up the hole walls.
scope: This sense is also called drilling fluid, for a blend of clay and chemicals in water, sent down
  the bore pipe to oil and chill the bit, rinse out the cuttings, and shore up the hole walls.
examples:
- Drilling mud firmed the hole's sides.
- They pumped drilling mud down the pipe.
