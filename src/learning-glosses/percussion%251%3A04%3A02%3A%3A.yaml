simpleMeaning: tapping a part of the body to help find out what illness a person has
scope: This is tapping a person's body to check for illness, not the part of a band that plays drums and
  not the act of setting off a small charge in a gun.
examples:
- The doctor used percussion on his chest to listen for fluid inside.
- She learned percussion as a way to check patients during an exam.
