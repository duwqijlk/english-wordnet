simpleMeaning: In anatomy and botany, a sheath, meaning a close wrapping layer, around an organ or other
  body part.
scope: This is the biological wrapper sense, not an occurrence, a set of circumstances, a lawsuit, the
  actual state of affairs, a carrying container, a client, an experimental subject, a problem under investigation,
  an argument's statement of facts, a container's contents by quantity, a grammatical role, a passing
  mood, an odd character, a typeface, a thing's outer housing, a door or window frame, a printer's type
  tray, a pillow cover, a shop display jar, or the verbs for surveying a place before a robbery or putting
  something into a container.
examples:
- A tough case protects the seed until the pod splits open.
- The surgeon cut through the fibrous case around the gland.
