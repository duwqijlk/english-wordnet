simpleMeaning: a measure of electricity, such as a flow, a push, or a force, whose changes carry coded
  facts about where it came from
scope: A measure of electricity whose changes carry coded facts, not a move or act without words and not
  the act of telling something without words.
examples:
- The television signal broke up in the storm.
- The engineer tested the signal from the radio mast.
