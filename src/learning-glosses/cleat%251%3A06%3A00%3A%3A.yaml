simpleMeaning: a long, thin piece of wood or metal fixed to a surface to make that surface stronger
scope: A piece fixed on to make a surface stronger, not the small point on a shoe that stops slipping
  and not the part used to tie a rope.
examples:
- He screwed a wooden cleat across the board to make it stronger.
- A metal cleat holds the two parts firmly together.
