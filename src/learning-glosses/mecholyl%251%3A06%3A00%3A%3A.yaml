simpleMeaning: A drug that makes body tissues respond as if the parasympathetic nerve system were at work,
  bringing on secretions and smooth muscle work.
scope: This is a drug that acts on body tissues like the parasympathetic nerve system, bringing on secretions
  and smooth muscle work; methacholine is another name for it.
examples:
- Mecholyl is used as a drug to make body tissues respond.
- The doctor gave Mecholyl to test the parasympathetic nerve system.
