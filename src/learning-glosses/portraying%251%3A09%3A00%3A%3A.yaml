senseId: 'portraying%1:09:00::'
synsetId: 05774981-n
simpleMeaning: a showing of a person or thing in a picture, or in a picture of a person made to show what
  that person looks like
scope: 'Also called portrayal: a showing of a person or thing in a picture, not acting a part in a play
  or film and not telling about them in words.'
examples:
- His portraying of the mayor in the portrait was very true to life.
- The artist's portraying of her mother in the painting caught her kind face well.
