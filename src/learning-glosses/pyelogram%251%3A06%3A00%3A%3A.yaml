schema: oewn-learning-gloss-v2
senseId: 'pyelogram%1:06:00::'
synsetId: 04034948-n
simpleMeaning: A picture of the inside of the body, made with rays, that shows the kidneys and the tubes
  that carry urine to the bladder
scope: A picture made with rays of the kidneys and their tubes, not a picture of the bones and not a test
  of the blood.
examples:
- The doctor ordered a pyelogram to look at her kidneys.
- The pyelogram showed a stone in one of the tubes from the kidney.
