senseId: 'bulge%2:30:01::'
synsetId: 00257255-v
simpleMeaning: to make something get bigger and stick outwards
scope: This verb means to make something swell out, also called bulk; it is not swelling by itself and
  not the noun for a raised part.
examples:
- The wind bulged the sail as the boat moved faster.
- The pressure inside bulged the metal door outwards.
