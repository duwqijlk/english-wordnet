simpleMeaning: A place set apart for people with a sickness that spreads, above all leprosy
scope: 'Another name for a lazar house, a lazaret, a lazaretto and a pesthouse: a place set apart for
  people with a sickness that spreads, not a general hospital and not a home for the old.'
examples:
- They built a lazarette outside the port to hold the sick sailors.
- The lazarette kept people with the fever away from the town.
