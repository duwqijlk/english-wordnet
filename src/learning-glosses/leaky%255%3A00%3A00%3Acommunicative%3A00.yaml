simpleMeaning: likely to tell secret information to other people
scope: 'Also called tattling: this sense is about telling secret information, not about letting water
  or air pass through and not about being unable to hold in urine.'
examples:
- The office was leaky, and soon everyone knew the secret plan.
- Do not tell him; he is leaky and will pass the news on.
