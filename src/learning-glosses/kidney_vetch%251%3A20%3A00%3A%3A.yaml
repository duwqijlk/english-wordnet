simpleMeaning: a Eurasian herb, living for years, with red or yellow flower heads, common in grassland;
  once a medicine for trouble with the organ that cleans the blood
scope: A plant with red or yellow flower heads once used as a medicine, not clover, and not a garden flower
  grown for show.
examples:
- Kidney vetch dotted the meadow with red flower heads.
- Old books say kidney vetch was once used to treat kidney trouble.
