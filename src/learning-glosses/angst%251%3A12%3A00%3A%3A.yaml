senseId: 'angst%1:12:00::'
synsetId: 07541241-n
simpleMeaning: A strong feeling of worry that is not about one clear thing; usually used for worry from
  thinking about the world or being free as a person
scope: This is strong worry with no clear single cause, usually about the world or about personal freedom;
  it is not ordinary worry about one clear problem.
examples:
- He felt angst about his place in the world and whether he was truly free.
- Her book describes the angst of young people who question the meaning of life.
