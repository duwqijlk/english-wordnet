senseId: 'recapitulation%1:10:01::'
synsetId: 07052984-n
simpleMeaning: In music, the part of a piece, most often in a sonata, where tunes heard before come back
  again
scope: In music, the part of a piece where tunes heard before come back, not the first part where they
  are heard and not the growth of an unborn baby through old forms.
examples:
- The recapitulation brought back the bright first tune near the end of the sonata.
- When the recapitulation began, the hall heard the opening tune once more.
