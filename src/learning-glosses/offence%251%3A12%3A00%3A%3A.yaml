simpleMeaning: anger felt because someone has said or done something hurtful or rude
scope: Anger felt because someone has said or done something hurtful or rude; offense is another name
  for this sense, not a crime, and not a lack of good manners.
examples:
- He took offence at my question.
- No offence was meant by the joke.
