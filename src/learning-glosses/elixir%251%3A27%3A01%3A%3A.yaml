simpleMeaning: A kind of stuff that people only imagined; alchemists (people long ago who tried to make
  gold from other metals) thought it could turn cheap metals into gold.
scope: 'Also called philosopher''s stone and philosophers'' stone: a made-up thing thought to make gold,
  not a sweet liquid used in medicine and not a cure for all sickness.'
examples:
- The old book said the elixir could turn lead into gold.
- He spent years looking for an elixir that would make gold from cheap metal.
