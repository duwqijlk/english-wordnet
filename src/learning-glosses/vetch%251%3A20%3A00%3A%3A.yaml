simpleMeaning: Any of various climbing plants of the genus Vicia, with feather-like leaves of leaflets
  ending in tendrils and small flowers of various colours; some are valuable feed or soil improvers.
scope: A climbing plant of the genus Vicia, some kinds of which are grown as fodder or to improve the
  soil. It is not a pea or a clover, which are different legume genera. The word is a general name covering
  many species.
examples:
- The field was sown with vetch to enrich the soil before the wheat.
- Bees worked the small flowers of the vetch along the hedge.
