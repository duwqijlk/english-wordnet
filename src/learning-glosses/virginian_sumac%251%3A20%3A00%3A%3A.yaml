simpleMeaning: A leaf-shedding shrubby tree of eastern North America with compound leaves turning brilliant
  red in fall and dense branched clusters of greenish yellow flowers followed by crimson sour berries.
scope: Also called staghorn sumac, velvet sumac, vinegar tree, and Rhus typhina; a shrubby tree of eastern
  North America with leaves turning brilliant red in fall, not the smooth sumac and not the poison sumac.
examples:
- The Virginian sumac turned brilliant red in the fall.
- Virginian sumac bears crimson sour berries after its flowers.
