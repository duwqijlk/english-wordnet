simpleMeaning: a state that lasts for a short time in which you cannot sleep, or do not want to sleep
scope: 'Also called wakefulness: a short time when you cannot sleep or do not want to sleep, not a long-lasting
  problem with sleep and not just feeling tired in the day.'
examples:
- Sleeplessness kept him awake until morning.
- She had a night of sleeplessness before the exam.
