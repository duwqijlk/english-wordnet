simpleMeaning: A phone you carry with you, used in an area split into small zones, each with its own short-range
  transmitter and receiver.
scope: A mobile phone that works on a network split into small local zones; it is not a living unit of
  tissue, not a battery, not a small room for a prisoner or monk, and not a group inside a political movement.
examples:
- I left my cell at home, so call the office number.
- He checked his cell for messages during the break.
