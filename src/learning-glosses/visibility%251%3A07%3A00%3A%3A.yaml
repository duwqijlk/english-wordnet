simpleMeaning: how much a thing can be seen with the eye, or how clear it is to the eye
scope: How well something can be seen, not the sight itself and not a clear view of the future.
examples:
- Low visibility caused by fog made driving slow.
- The visibility was so poor that the ships stayed in port.
