simpleMeaning: Meat and vegetables cooked together in a thick soup or stew.
scope: Meat and vegetables cooked together as a thick soup or stew, not a clear soup and not a mere jumble
  of things.
examples:
- She served a hotchpotch of lamb and carrots for supper.
- The hotchpotch bubbled gently on the stove.
