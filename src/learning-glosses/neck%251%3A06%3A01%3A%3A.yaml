simpleMeaning: the thin section of a made object, shaped or placed like the part joining head and shoulders
scope: A thin section of a made object, not the garment opening and not the kissing act.
examples:
- The bottle has a narrow neck that makes pouring easy.
- A crack ran down the neck of the guitar.
