simpleMeaning: A thin spread of stuff taken from the mouth, from the tube that food goes down
scope: A thin spread of stuff from the mouth, not a spread of stuff from another part of the body and
  not a test of the blood.
examples:
- The lab made an oral smear from the swab taken inside his cheek.
- An oral smear showed the germs present in her mouth.
