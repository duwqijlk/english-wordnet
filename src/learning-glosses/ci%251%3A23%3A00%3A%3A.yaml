simpleMeaning: 'a unit that measures how radioactive a thing is: the amount of a radioactive kind of atom
  that breaks apart 37,000,000,000 times in one second'
scope: 'Also called curie: a unit that measures radioactivity, not a unit of weight and not a unit of
  length.'
examples:
- The sample gave off two Ci of radiation.
- Doctors measure the dose in Ci.
