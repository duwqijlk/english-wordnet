simpleMeaning: A fly with no wings that lives on the outside of sheep and cattle and feeds on them.
scope: 'Also called a sheep-tick, a sheep ked, or a sheep tick: a fly with no wings that lives on the
  outside of sheep and cattle, not a true tick, though it bears the name.'
examples:
- Melophagus ovinus lives on sheep and cattle.
- The sheep had Melophagus ovinus on its coat.
