simpleMeaning: A rectangular block of butter or margarine that weighs a quarter of a pound.
scope: A measured block of butter or margarine, not a wooden tool and not the rolled cannabis cigarette.
examples:
- The recipe calls for one stick of butter, melted.
- She cut a stick of margarine into the flour.
