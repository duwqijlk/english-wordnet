simpleMeaning: A weaving frame with a part that makes gaps for the shuttle to pass between the long threads;
  used to weave cloth with pictures and patterns
scope: Also called a Jacquard; a weaving frame set apart by its part that makes gaps for the shuttle,
  used for patterned cloth.
examples:
- The Jacquard loom clacked as the shuttle passed back and forth through the threads.
- She learned to work the Jacquard loom to weave cloth with a flower pattern.
