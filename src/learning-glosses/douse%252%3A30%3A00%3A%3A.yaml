simpleMeaning: to pour liquid over a thing so that it is wet all over
scope: Also called soak, and another name for it is drench; this is wetting by pouring liquid on, not
  dipping a thing into liquid.
examples:
- He doused his hot face with cold water.
- She doused the fire with a bucket of water.
