senseId: strident%5:00:00:noisy:00
synsetId: 01926766-s
simpleMeaning: very loud and easy to notice in a way that upsets people, and ready to shout out loudly
  with strong feeling
scope: Also called blatant, vociferous, clamorous and clamant. This sense is about very loud sound that
  upsets people and loud shouting with strong feeling, not a speech sound made by forcing air through
  a narrow place, and not the close sense that only means loud and harsh to hear.
examples:
- She made strident demands for change at the meeting.
- His strident voice could be heard across the street as he shouted at the crowd.
