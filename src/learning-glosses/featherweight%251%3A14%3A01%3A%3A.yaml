simpleMeaning: In fighting sports, a class of fighters heavier than bantamweights and lighter than lightweights.
scope: The weight class in fighting sports for fighters heavier than bantamweights and lighter than lightweights,
  not a boxer who weighs no more than 126 pounds and not a professional boxer of 123 to 126 pounds.
examples:
- He fought as a featherweight, heavier than the bantams.
- The featherweight class sits between bantamweight and lightweight.
