simpleMeaning: a diamond-shaped band of flesh that pulls the shoulder blade in toward the spine
scope: Not a band of flesh in the arm, and not a bone of the back; also called greater rhomboid muscle
  and musculus rhomboideus major.
examples:
- The rhomboideus major muscle pulls the shoulder blade inward.
- He strained his rhomboideus major muscle lifting the box.
