synsetId: 06335857-n
simpleMeaning: a small word like 'the' in English that points to one known thing or person
scope: A small word like 'the' that points to one known thing; not a word like 'a' that points to any
  one of many, and not a word that names a thing.
examples:
- In the phrase 'the cat', 'the' is a definite article.
- The definite article in 'the book on the desk' shows we mean one known book.
