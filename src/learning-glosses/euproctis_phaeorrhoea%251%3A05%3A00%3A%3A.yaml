simpleMeaning: A small brown and white moth from Europe, now in the east of the United States, that harms
  many shade and fruit trees.
scope: Also called brown-tail moth and browntail, this small brown and white moth from Europe now lives
  in the east of the United States and harms many shade and fruit trees, not any other small brown and
  white moth.
examples:
- Euproctis phaeorrhoea harms the fruit trees in the garden.
- The small moth Euproctis phaeorrhoea came from Europe.
