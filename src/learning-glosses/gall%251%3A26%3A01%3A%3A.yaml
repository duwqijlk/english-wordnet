simpleMeaning: An open sore on a horse's back, made by a saddle that fits badly or is put on wrong.
scope: An open sore on a horse's back from a saddle that fits badly or is put on wrong, not the juice
  from the liver, not rudeness, and not a plant swelling.
examples:
- The horse had a gall where the saddle rubbed.
- A loose girth left a gall on the mare's back.
