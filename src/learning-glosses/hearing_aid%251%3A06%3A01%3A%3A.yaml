simpleMeaning: A person whose ears do not work well can wear this small machine, run by power, to make
  sounds louder
scope: A small machine run by power that makes sounds louder, also called a deaf-aid, not a device that
  plays music and not the old cone once held to the ear.
examples:
- She put in her hearing aid before the meeting.
- His hearing aid makes voices loud enough to follow.
