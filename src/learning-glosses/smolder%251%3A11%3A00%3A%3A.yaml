simpleMeaning: A fire that gives off thick smoke while it burns, but shows no flame.
scope: A fire that burns with thick smoke and no flame, not the act of burning slowly without a flame.
examples:
- The smolder in the grate suddenly became a blaze.
- A smolder rose from the damp logs in the fireplace.
