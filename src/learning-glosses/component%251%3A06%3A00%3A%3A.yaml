simpleMeaning: one made part of a whole thing built from many parts, most of all a part that can be taken
  off or put onto a system
scope: 'Also called an element: one made part of a whole thing; not the whole thing itself and not a raw
  material.'
examples:
- Spare components for cars are sold in the shop.
- A wheel is a component of a car.
