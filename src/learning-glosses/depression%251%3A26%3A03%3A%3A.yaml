simpleMeaning: a very bad state of low mood and loss of joy so strong that a person needs care from a
  doctor or clinic
scope: This is the severe sense that needs care from a doctor, not a less severe low-mood state, not a
  low area of land, and not an angle below the horizon.
examples:
- Her depression was so severe that she needed care in a clinic.
- Doctors treated his depression because he could no longer feel any joy in life.
