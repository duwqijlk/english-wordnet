simpleMeaning: A climbing plant of the Old World with leaves cut into rounded parts that stay green all
  year, and black fruits like berries
scope: A climbing plant of the Old World with leaves cut into rounded parts that stay green all year,
  and black fruits like berries; ivy is another name for this sense, not a plant that loses its leaves
  and not a plant with red fruits.
examples:
- Common ivy covered the old stone wall.
- The common ivy kept its green leaves through winter.
