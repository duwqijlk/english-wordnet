simpleMeaning: always changing, especially in moving from one home or job to another
scope: 'Also called floating, drifting, aimless and vagrant: this describes a person or life that keeps
  changing home or job. It is not the noun for a person with no home, and not the sense about having no
  ties to a place.'
examples:
- She led a vagabond life, changing homes and jobs every year.
- His vagabond years took him from one job to the next.
