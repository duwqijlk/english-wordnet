simpleMeaning: worn down by someone who keeps complaining, again and again
scope: Also called dominated, this describes a person worn down by non-stop nagging, not a person who
  is quiet or shy by nature.
examples:
- The henpecked man nodded while his wife kept telling him what he had done wrong.
- He looked tired and henpecked after a week of non-stop nagging at home.
