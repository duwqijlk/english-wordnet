simpleMeaning: a shape left in rock by seaweed of one group, after the plant rotted away and stone took
  its place
scope: A mark in rock left by a sea plant of one group, not a living plant and not a mark left by an animal.
examples:
- The fucoid in the rock showed the shape of an old sea plant.
- She found a fucoid on the beach cliff.
