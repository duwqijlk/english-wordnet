simpleMeaning: The covering of fur, hair or wool on an animal's body.
scope: The fur, hair or wool covering an animal's body, not clothing worn outdoors and not a thin layer
  spread over a surface; pelage is another name for it.
examples:
- The dog's coat was thick and glossy after its bath.
- In winter, the horse grows a long coat to keep warm.
