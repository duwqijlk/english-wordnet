simpleMeaning: anger that a person feels because something troubles them
scope: 'Also called chafe: anger that a person feels because something troubles them, not the unpleasant
  person who troubles others, not the state of feeling troubled, and not the act of troubling someone.'
examples:
- His annoyance grew into open anger when the noise would not stop.
- She could hear the annoyance in his angry voice as he complained about the late train.
