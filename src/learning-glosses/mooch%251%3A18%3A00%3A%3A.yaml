simpleMeaning: a person who tries to get things for free by asking others
scope: 'Also called scrounger and moocher: a person who asks others for things for free, not the act of
  asking itself.'
examples:
- He is a mooch who always asks for free food.
- Everyone knew him as a mooch because he never paid for lunch.
