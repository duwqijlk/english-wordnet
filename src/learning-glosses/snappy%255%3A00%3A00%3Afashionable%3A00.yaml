simpleMeaning: dressed and acting in the newest style, in a smart way
scope: 'Also called dashing, spruce, jaunty, rakish, dapper, natty, raffish and spiffy: smart in dress
  and in the way a person acts, in the newest style, not quick and not bad-tempered.'
examples:
- He looked snappy in his new suit and hat.
- She wore a snappy red coat and walked in a bright, smart way.
