simpleMeaning: Green parts of plants that have rotted down make up most of this earth
scope: 'Also called leaf mould and leaf soil: earth made mostly of rotted plant parts, not fresh earth
  and not the stuff that grows on damp walls.'
examples:
- She spread leaf mold over the beds to feed the soil.
- The leaf mold in the bin had turned into dark, rich earth.
