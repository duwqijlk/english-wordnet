simpleMeaning: A part that takes dirt out of the liquid that greases a motor.
scope: A part that takes dirt out of the liquid that greases a motor; not the part that takes dirt out
  of fuel and not the part that takes dirt out of air.
examples:
- He changed the oil filter when he serviced the car.
- A blocked oil filter can harm the engine.
