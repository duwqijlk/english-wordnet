simpleMeaning: 'A cephalosporin antibiotic: a drug that kills bacteria, prescribed for mild to moderately
  severe infections of the skin, ears, throat, lungs or urinary tract.'
scope: This sense names the drug itself, not a trade name such as Keflex or the cephalosporin family it
  belongs to.
examples:
- The doctor prescribed cephalexin for a throat infection.
- She finished the whole course of cephalexin as directed.
