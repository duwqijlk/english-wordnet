simpleMeaning: an order for goods to be sent out to another country or brought in from another country
scope: This is an order for goods to buy from or sell to another country, not the empty space at the start
  of a line, and not a way of binding a young worker to a master.
examples:
- The company sent an indent for tea from India.
- His indent asked for fifty boxes of cloth to be shipped from abroad.
