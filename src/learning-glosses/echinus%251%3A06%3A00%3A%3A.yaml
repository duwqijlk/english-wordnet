simpleMeaning: a round egg-shaped band between the shaft of a Doric column and the flat slab above it
scope: A round band of stone on a Doric column, not the flat slab itself and not the long shaft of the
  column.
examples:
- The echinus sits just below the abacus of the column.
- You can see the echinus of the Doric column above the shaft.
