simpleMeaning: One of several kinds of dolphin, this one is found chiefly in the north Atlantic and the
  Mediterranean, with a round forehead and a well-formed beak.
scope: Also called a bottle-nosed dolphin and a bottlenose, this is one of several kinds of dolphin found
  chiefly in the north Atlantic and the Mediterranean.
examples:
- A bottlenose dolphin followed our boat through the Mediterranean.
- The bottlenose dolphin showed its well-formed beak as it surfaced.
