simpleMeaning: Along it the body sends out a liquid it has made or some other thing, this passage in the
  body whose walls are made of surface cells
scope: It is also called a channel, a canal, and a duct, a passage in the body lined with surface cells.
examples:
- The epithelial duct that drains tears from the eye was blocked.
- Poison moves out through an epithelial duct in the snake's fang.
