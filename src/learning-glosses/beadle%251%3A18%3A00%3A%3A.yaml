simpleMeaning: a person who has a small official job in a parish (the area served by one church) and does
  a set part in church ceremonies
scope: A person with a small official church job who does a set part in ceremonies, not the priest who
  leads the service and not a church teacher.
examples:
- The beadle carried the cross at the front of the group.
- During the ceremony, the beadle carried the book to the priest.
