simpleMeaning: A protein, a chemical made by the body, that helps cells change into different kinds and
  get bigger
scope: This is a body chemical that helps cells change and get bigger, not a vitamin and not a hormone
  that travels in the blood to act far away.
examples:
- The growth factor helps the cells change into skin cells.
- Doctors study growth factors to learn how wounds heal.
