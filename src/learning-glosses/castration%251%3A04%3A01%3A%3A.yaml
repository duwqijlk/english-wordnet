simpleMeaning: an operation to take out the testes or ovaries, usually to slow or stop the body's release
  of hormones, as in breast cancer in women or prostate cancer in men
scope: This is an operation on a person to take out the testes or ovaries, not the same operation on a
  male animal and not cutting bad parts from a book.
examples:
- Castration was offered as a treatment for his prostate cancer.
- After castration, her body made much less of the hormone.
