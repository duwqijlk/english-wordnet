simpleMeaning: A doctor who treats all kinds of illness and works in no one field of medicine.
scope: Also called a general practitioner; a doctor who treats all kinds of illness in no one field, set
  beside the specialist who works in one field and the surgeon who cuts.
examples:
- Our GP treats the whole family and knows us all by name.
- She went to her GP for a cough that would not go away.
