simpleMeaning: The main idea that a piece of writing or a talk builds on and sets out at length
scope: The main idea a piece of writing or a talk builds on, not a heavy load to carry and not a task
  put on someone.
examples:
- The burden of her paper was that trade makes towns grow.
- He kept coming back to the burden of his talk.
