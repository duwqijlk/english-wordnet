simpleMeaning: to break open all at once with great force, as a ripe seed pod does
scope: To break open all at once with great force, as a ripe seed pod does, and not to open bit by bit
  or to burst from heat.
examples:
- When the seed pods turned dissilient, they burst open and scattered.
- The gardener watched the dissilient pods split open all at once.
