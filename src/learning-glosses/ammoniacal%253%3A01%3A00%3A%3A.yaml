senseId: 'ammoniacal%3:01:00::'
synsetId: 02628058-a
simpleMeaning: Bearing ammonia in kind, or much like it.
scope: This sense is also called ammoniac, for what is bearing ammonia in kind, or much like it, unlike
  the sense for the sweet-smelling gum of the plant of the same name.
examples:
- The salt was ammoniacal, holding ammonia.
- The fumes were ammoniacal, smelling of ammonia.
