simpleMeaning: A net of clear fabric, loosely woven with open gaps.
scope: This sense is also called gauze and netting, for a net of clear fabric, loosely woven with open
  gaps, where gauze is a see-through cloth, woven like a loose net.
examples:
- Veiling covered her face like a loose net.
- The veiling was a net of see-through cloth.
