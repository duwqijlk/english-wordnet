simpleMeaning: A branch of the Tai language group, spoken in central and north-east Vietnam near the China
  border and south in Lam Dong, and possibly in Laos.
scope: Also called Tay; not a different Tai language such as Thai or Lao.
examples:
- Tho is spoken in the north-east of Vietnam.
- Many Tho speakers live near the border with China.
