simpleMeaning: When hot melted rock from deep in the earth, whatever it is made of, cools very fast, this
  is what forms
scope: Hot melted rock from deep in the earth that cooled very fast, whatever it is made of; not a window
  pane and not a drinking cup.
examples:
- The black rock was natural glass, formed when lava cooled fast.
- Natural glass forms when hot rock cools very fast.
