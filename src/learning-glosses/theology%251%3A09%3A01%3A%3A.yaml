simpleMeaning: the study of religion in a careful, ordered way, looking at what religion does in the world
  and what religious truth is
scope: Also called divinity. This is the study itself, not the job in religion that people train for at
  a college.
examples:
- She went to university to study theology and learn about different religions.
- His book on theology asks what religious truth means.
