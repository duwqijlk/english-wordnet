simpleMeaning: A Baptist group started in 1708 by Americans of German descent, opposed to military service
  and taking legal oaths, and who dipped people three times in water.
scope: Also called Dippers or the Church of the Brethren; a Baptist group of German descent founded in
  1708, known for refusing military service and legal oaths and for dipping people three times in water.
examples:
- The Dunkers founded their church in 1708 and dipped new members three times.
- Dunkers refused military service and would not take legal oaths.
