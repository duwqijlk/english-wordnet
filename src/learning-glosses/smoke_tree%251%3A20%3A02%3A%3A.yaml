senseId: 'smoke_tree%1:20:02::'
synsetId: 12545138-n
simpleMeaning: A grey-green shrub of southwestern deserts with sparse leaves and upright spikes of violet-blue
  blooms, valued locally for the pale honey bees make from it.
scope: This is the desert shrub with violet-blue flower spikes and prized pale honey, not the ornamental
  Cotinus shrub whose fluffy plumes look like smoke.
examples:
- A smoke tree stood alone on the dry slope, its violet spikes bright against the sand.
- Local beekeepers say the smoke tree gives the palest, finest honey in the valley.
