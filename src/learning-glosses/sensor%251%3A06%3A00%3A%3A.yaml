synsetId: 03185635-n
simpleMeaning: when it picks up a sign from the world around it, like heat, pressure, light, or movement,
  it acts on that sign in its own set way
scope: A device that picks up signs from the world and acts on them, not a sense organ in a living body.
examples:
- The sensor picked up a rise in heat and switched the fan on.
- A sensor at the door notices movement and turns on the light.
