simpleMeaning: Between the two layers of the fold holding the gut, this smaller blood tube runs from the
  gut to join the blood tube to the liver.
scope: It is also called vena mesenterica, and it is a smaller blood tube from the gut that joins the
  blood tube to the liver between the two layers of the fold holding the gut.
examples:
- The mesenteric vein carries blood from the gut toward the liver.
- The mesenteric vein ran from the gut between the two layers of the fold holding the gut.
