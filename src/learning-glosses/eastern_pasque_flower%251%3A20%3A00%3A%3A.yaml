simpleMeaning: A short hairy plant that lives for years, with early spring blue-violet or lilac blooms,
  found in North America and Siberia.
scope: A short hairy spring plant of North America and Siberia, also called the blue tulip, lion's beard,
  prairie anemone, wild crocus, American pasqueflower, American pulsatilla, Anemone ludoviciana and Pulsatilla
  patens; not a tall garden flower and not a flower of warm lands.
examples:
- The Eastern pasque flower opened in early spring.
- Eastern pasque flowers grew on the prairie in North America.
