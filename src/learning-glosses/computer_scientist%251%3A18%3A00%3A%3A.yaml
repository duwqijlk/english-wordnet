simpleMeaning: a person who studies the ideas behind working with numbers and facts, and how machines
  for that work are made
scope: A person who studies the ideas behind working with numbers and facts and how the machines for that
  work are made; not a person who fixes machines and not a person who writes steps for machines to follow.
examples:
- The computer scientist gave a talk on how machines learn.
- As a computer scientist, she designs new ways for machines to sort facts.
