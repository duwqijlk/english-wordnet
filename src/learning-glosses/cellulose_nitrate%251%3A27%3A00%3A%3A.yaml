simpleMeaning: A chemical made from plant fibre joined with nitric acid, used in shiny coatings and in
  things that blow up.
scope: A chemical from plant fibre and nitric acid for coatings and explosives, not wood pulp and not
  gunpowder; guncotton, nitrocellulose and nitrocotton are other names for this sense.
examples:
- Cellulose nitrate was once used to make film and lacquer.
- The factory stored cellulose nitrate far from any flame.
