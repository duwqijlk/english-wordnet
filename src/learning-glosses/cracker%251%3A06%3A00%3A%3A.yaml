simpleMeaning: a party gift made of a paper tube, usually with a sweet or a small gift inside, that pops
  when pulled at both ends
scope: A party gift made of a paper tube, usually with a sweet or a small gift inside, that pops when
  pulled at both ends; not the flat cake, not the computer breaker, and not the firework.
examples:
- Each guest pulled a cracker at the table.
- The cracker popped and a paper crown fell out.
