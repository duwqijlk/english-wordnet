simpleMeaning: Being taken up with what goes on inside a person, especially questions of right and wrong
  and of what they believe.
scope: 'Also called internality: being taken up with what goes on inside a person, especially questions
  of right and wrong and of what they believe; not being taken up with one''s own attitudes and values
  in particular, not the most essential part of an idea or experience, and not simply the state of being
  inward.'
examples:
- His inwardness showed in long thought about what was right.
- The novel's inwardness lies in its care for the inner lives of its people.
