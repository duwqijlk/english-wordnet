senseId: 'censored%3:00:00::'
synsetId: 00319840-a
simpleMeaning: stopped from being seen, read, or heard, or under a system that can stop it from being
  seen, read, or heard
scope: Stopped, or open to being stopped, before the public can see it, not the act of stopping it and
  not a work that is simply unpopular.
examples:
- The censored newspaper left blank spaces where stories had been cut out.
- In some countries the press is censored and cannot print certain news.
