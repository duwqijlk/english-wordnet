simpleMeaning: A metal piece that fits in a horse's mouth and is held by reins, used to control the animal
  while riding.
scope: This is not the cutting end of a drill, the end of a key, or a unit for measuring information;
  it is the metal piece in a horse's mouth.
examples:
- She checked the bit to make sure it was not hurting the horse's mouth.
- He pulled the reins, and the bit pressed against the horse's jaw.
