synsetId: 07446937-n
simpleMeaning: Liquid gets out of blood tubes, little by little, through tiny holes or breaks in the thin
  covers of their cells.
scope: Also called exudation, it is liquid escaping slowly from blood tubes through tiny holes or breaks
  in the thin covers of their cells.
examples:
- By transudation, liquid slowly left the blood tubes.
- The liquid outside the blood tubes had come there by transudation.
