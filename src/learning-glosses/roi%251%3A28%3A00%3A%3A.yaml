simpleMeaning: In business finance, the gain on a firm's whole money, shown as a part in a hundred, found
  by sharing the gains before interest, tax, or pay-outs by that money.
scope: Also called return on invested capital and return on investment; a firm's gain on its whole money,
  not its raw gain and not its tax bill.
examples:
- The ROI on the new shop was 12 per cent.
- They check the ROI before they spend more money.
