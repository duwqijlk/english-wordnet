simpleMeaning: A Russian in the smaller group that wanted slow political change and stood against the
  Bolsheviks before and during the Russian Revolution.
scope: A Russian in the smaller group that wanted slow political change and stood against the Bolsheviks,
  not a Bolshevik.
examples:
- The Menshevik sought slow change, not sudden revolution.
- Mensheviks stood against the Bolsheviks before the Russian Revolution.
