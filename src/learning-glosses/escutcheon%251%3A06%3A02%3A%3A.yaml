synsetId: 03347207-n
simpleMeaning: a flat cover put on a door, a wall or a like place, so that dirty fingers do not leave
  marks on it
scope: Also called finger plate and scutcheon. It is a flat cover on a door or wall, not a shield with
  a family sign and not a name plate on a ship.
examples:
- A small escutcheon was fixed to the wall by the door to stop dirty marks.
- They fitted an escutcheon on the door so fingers would not mark the paint.
