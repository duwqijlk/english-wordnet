simpleMeaning: In finance, what is left of the money taken in from sales after the cost of the goods and
  services sold is taken away.
scope: In finance, what is left of sales money after costs are taken away, not room for change within
  limits and not the money a broker holds.
examples:
- The shop's margin rose when costs fell.
- A thin margin left the firm with little profit.
