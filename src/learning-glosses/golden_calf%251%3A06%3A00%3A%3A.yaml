simpleMeaning: In the Old Testament, an idol made by Aaron for the Israelites to worship, broken up by
  Moses; the name is now used for anything people worship without good reason
scope: In the Old Testament, the idol Aaron made for the Israelites, broken up by Moses; now the name
  for anything worshipped without good reason, not a real animal and not a statue of a god.
examples:
- The golden calf stood in the story as a sign of false worship.
- He warned that money had become their golden calf, worshipped above all else.
