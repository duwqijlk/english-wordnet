simpleMeaning: One person from a North American Indian group that lived in Oregon by the Columbia river,
  along its side streams in Washington and northern Idaho.
scope: A member of a North American Indian people of Oregon along the Columbia river and its tributaries,
  not a Nez Perce or a Yakima, also called Sahaptino and Shahaptian, and not the Sahaptin language.
examples:
- The Sahaptin lived along the Columbia river in Oregon.
- A Sahaptin elder told stories of the river.
