simpleMeaning: Inside the body, closed hollows are lined by a two-layer cover, and the thin space between
  its layers holds a watery fluid.
scope: Serosa is another name for this lining of the closed hollows inside the body.
examples:
- Fluid had gathered between the layers of the serous membrane.
- The serous membrane lines the closed hollows inside the body.
