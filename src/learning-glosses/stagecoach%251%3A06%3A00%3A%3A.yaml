simpleMeaning: a large carriage pulled by four horses, once used to carry people and mail on set routes
  between towns
scope: 'Also called stage: a large carriage pulled by horses and used in the past for people and mail
  between towns, not a raised floor for shows and not a step in a process.'
examples:
- The stagecoach left the town at dawn with mail and six passengers.
- Travelers once crossed the hills by stagecoach, pulled by four horses.
