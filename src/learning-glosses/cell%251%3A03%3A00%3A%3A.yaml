simpleMeaning: in biology, the basic unit that makes up a living thing and performs its essential functions,
  either living alone or forming colonies or tissues in higher plants and animals
scope: This is the biological unit of living things, not a small room for a prisoner, monk, or nun, not
  a compartment in a honeycomb, not a device that makes electricity by chemical reaction, not a small
  group inside a political movement, and not a mobile phone.
examples:
- Every living thing is made of at least one cell.
- The biologist studied how cells divide and form tissues.
