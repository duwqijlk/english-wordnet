simpleMeaning: A tight garment made of something that lets liquid through, worn in cold water by people
  who dive without tanks to keep body heat in.
scope: A tight garment for diving in cold water; not a dry suit and not an ordinary swimming costume.
examples:
- He put on his wet suit before diving into the cold water.
- The wet suit kept her warm while she dived.
