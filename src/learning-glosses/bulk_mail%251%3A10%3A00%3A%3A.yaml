simpleMeaning: many copies of the same letter or advert sent to separate homes at a low price, all paid
  for together
scope: Many copies of the same letter or advert sent to separate homes at a low price, all paid for together,
  not single letters sent one by one at full price.
examples:
- The charity sent its appeal by bulk mail to thousands of homes.
- Our club uses bulk mail for the monthly newsletter.
