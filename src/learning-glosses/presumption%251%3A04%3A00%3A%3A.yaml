senseId: 'presumption%1:04:00::'
synsetId: 01228051-n
simpleMeaning: a rude act of doing something without the right to do it, as if you had that right
scope: A rude act of taking a right you do not have; not the law sense, where a fact is taken as true
  because other facts are already known.
examples:
- His presumption in using the boss's office without asking shocked everyone.
- She had the presumption to take the front seat without asking anyone.
