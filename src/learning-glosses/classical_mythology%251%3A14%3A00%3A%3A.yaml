simpleMeaning: Much of Rome's old stories were taken over from the Greeks, above all the gods, and together
  they form the shared store of old stories of Greece and Rome
scope: This is the shared old stories of Greece and Rome together, not the stories of one land alone and
  not a history of real events.
examples:
- Classical mythology tells the old stories of the gods of Greece and Rome.
- In classical mythology, many Roman gods were taken over from the Greeks.
