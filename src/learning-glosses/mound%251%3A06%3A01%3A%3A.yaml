simpleMeaning: In baseball, the small raised part of the ground where the player who throws the ball stands
scope: 'Also called hill: this is the small raised ground in baseball where the player who throws the
  ball stands, not a heap of earth or stones made by people and not that player''s job on the team.'
examples:
- He walked to the mound and threw the first ball of the game.
- The pitcher stood on the mound and got ready to throw the ball.
