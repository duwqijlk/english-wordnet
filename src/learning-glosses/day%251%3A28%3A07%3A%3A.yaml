simpleMeaning: The time a planet such as Mars takes to turn once around its own axis.
scope: This is not the everyday calendar period on Earth, not the time of daylight, and not a period in
  history; it is one planet's rotation time.
examples:
- A day on Mars lasts about 24 hours and 37 minutes.
- Scientists measured the length of a day on Venus.
