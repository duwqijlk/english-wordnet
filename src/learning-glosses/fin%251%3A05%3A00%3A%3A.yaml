simpleMeaning: A body part that fish and some other water animals use to move and keep their balance.
scope: This is the body part on a fish or other water animal, not swim gear, a car ornament, or a window
  slat.
examples:
- The fish steered with its tail fin.
- Its dorsal fin was torn in the fight.
