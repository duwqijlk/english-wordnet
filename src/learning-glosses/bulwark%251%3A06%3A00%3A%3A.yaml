simpleMeaning: a strong wall of stone or concrete that runs from the shore out into the water to stop
  the sea from washing a beach away
scope: A wall by the sea that keeps a beach safe, also called groin, mole, jetty, breakwater, seawall
  and groyne; it is not a bank of earth built around a place to keep it safe from attack, and not the
  act of keeping a place safe.
examples:
- The bulwark kept the winter waves from washing the beach away.
- Workers repaired the stone bulwark where it runs out into the sea.
