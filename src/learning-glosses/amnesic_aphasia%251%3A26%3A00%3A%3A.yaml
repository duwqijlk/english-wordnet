simpleMeaning: Being unable to name things or to know the written or spoken names of things.
scope: 'Also called amnestic aphasia, anomia, anomic aphasia and nominal aphasia: being unable to name
  things or to know the written or spoken names of things, not a loss of speech itself and not simple
  forgetfulness.'
examples:
- After the stroke she had amnesic aphasia and could not name a cup.
- Amnesic aphasia makes it hard to know the names of things.
