simpleMeaning: with frames made from the hard outer stuff of an animal, or from the shell of a tortoise,
  or from plastic made to look like either
scope: Frames made from the hard outer stuff of an animal, or from the shell of a tortoise, or from plastic
  made to look like either, not metal frames and not plain plastic frames.
examples:
- He wore horn-rimmed glasses with thick dark frames.
- Her horn-rimmed glasses suited her round face.
