simpleMeaning: Got with little work or cost, and often got unlawfully.
scope: This is about money or gains got with little effort and often unlawfully, not something that poses
  no difficulty, not free from worry, not relaxed or unhurried, not comfortable or pleasing, not having
  little impact, not easily tricked, not a gentle slope, not moderately rich, not casual sexual behavior,
  not less in demand, not lenient with rules, and not the adverb uses.
examples:
- He made easy money selling stolen phones.
- Easy money is what drew the con artists to the scheme.
