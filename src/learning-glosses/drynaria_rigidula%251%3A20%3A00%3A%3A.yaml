simpleMeaning: A giant fern that grows on other plants or on rocks, found from Asia to Polynesia and Australia.
scope: A giant fern of Asia and the Pacific that grows on plants or rocks, also called the basket fern;
  not a small ground fern and not a fern of Europe.
examples:
- Drynaria rigidula grew on the trunk of a tall tree.
- We saw a Drynaria rigidula on the rocks in Australia.
