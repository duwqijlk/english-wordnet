simpleMeaning: 'The SI unit for energy absorbed from ionizing radiation: one joule taken up by one kilogram
  of matter, and 100 rad make one unit.'
scope: A technical SI unit for radiation absorbed by matter, not the colour word gray; 100 rad make one
  gray.
examples:
- The workers' exposure was measured in grays.
- One gray means one joule of radiation energy absorbed by each kilogram of matter.
