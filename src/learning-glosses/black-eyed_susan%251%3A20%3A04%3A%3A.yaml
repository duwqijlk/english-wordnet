simpleMeaning: A one-year weedy plant with short-lived yellow flowers with dark purple centres; from the
  hot lands of the Old World, now grown wild as a weed in North America.
scope: 'Also called bladder ketmia, flower-of-an-hour, flowers-of-an-hour, and Hibiscus trionum: a one-year
  weedy plant with short-lived yellow flowers with dark purple centres, not the Maryland state flower
  and not the climbing plant of tropical Africa.'
examples:
- Black-eyed Susan grew as a weed along the edge of the field.
- The black-eyed Susan flowers opened in the morning and were gone by evening.
