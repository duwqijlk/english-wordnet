simpleMeaning: In Roman Catholic Church use, formal dress worn by a cardinal, named for the colour of
  the robes that came from Tyre
scope: This is official dress worn by a cardinal in Roman Catholic Church use, also called purple; not
  a cardinal's everyday clothes and not a bishop's dress.
examples:
- The cardinal wore the purple at the ceremony in Rome.
- He received the purple when he was made a cardinal.
