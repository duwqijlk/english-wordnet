senseId: 'reaction%1:19:00::'
synsetId: 11518861-n
simpleMeaning: In mechanics, the force that pushes back with equal strength when a force acts on an object.
scope: A physical push back from an object in mechanics, not a person's emotional response, and not a
  chemical change between substances.
examples:
- The recoil you feel is the reaction to the bullet leaving the barrel.
- When the rocket throws gas downward, the reaction pushes it upward.
