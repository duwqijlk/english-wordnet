simpleMeaning: to put a pattern of squares on a surface, or to draw lines crossing each other on it
scope: 'Also called check: marking a surface with squares or crossed lines; not colouring with many colours,
  and not the coat attendant.'
examples:
- She checkered the paper with small squares.
- He used a ruler to checker the board with crossed lines.
