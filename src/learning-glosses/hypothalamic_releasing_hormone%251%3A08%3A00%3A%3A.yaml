senseId: 'hypothalamic_releasing_hormone%1:08:00::'
synsetId: 05419585-n
simpleMeaning: Any of several chemical messengers made in the hypothalamus, a brain region, and carried
  by a vein to the pituitary gland; each prompts that gland to make one particular substance.
scope: This sense is a messenger made in the hypothalamus that tells the pituitary to produce another
  hormone; the same substances are also called hypothalamic releasing factor, and they are not the pituitary
  hormones they trigger.
examples:
- Each hypothalamic releasing hormone carries a message from the brain to the pituitary.
- The hypothalamic releasing hormone reached the pituitary and set off a burst of another hormone.
