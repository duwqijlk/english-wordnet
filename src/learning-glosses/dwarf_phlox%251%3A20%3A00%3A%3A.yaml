simpleMeaning: From the United States, planted widely as ground cover, a low plant in clumps lives for
  years, with thin leaves that stay on all winter and pink or white flowers.
scope: Also called moss phlox, moss pink, and mountain phlox; it is a low plant that covers the ground,
  not a tall upright garden plant.
examples:
- The dwarf phlox spread over the rock garden.
- Dwarf phlox blooms pink in the spring.
