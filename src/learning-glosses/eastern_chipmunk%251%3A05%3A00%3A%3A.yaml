simpleMeaning: a small striped squirrel that lives much on the ground in the east of North America and
  keeps food in its cheeks
scope: A small striped ground animal of the east, also called ground squirrel, hackee and striped squirrel;
  not a tree squirrel and not a mouse.
examples:
- An eastern chipmunk darted across the path with its cheeks full.
- The eastern chipmunk stores seeds in its cheek pouches.
