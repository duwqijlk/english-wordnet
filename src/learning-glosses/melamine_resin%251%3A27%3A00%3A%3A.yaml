simpleMeaning: When heated, this stuff sets firm and stays set; it is made by joining two chemicals, and
  goes into moulded goods, glues, and thin coats.
scope: Once heated, this stuff sets firm for good and is used in moulded goods, glues, and thin coats.
examples:
- They chose melamine resin for the moulded goods.
- They used melamine resin as a glue.
