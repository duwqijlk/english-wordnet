simpleMeaning: A drug that is not a steroid and eases swelling and pain, sold as Dolobid, used for sore
  joints and other swollen parts of the body.
scope: A drug that eases swelling and pain in sore joints, not a steroid drug and not aspirin.
examples:
- The doctor gave her diflunisal for her sore knee.
- Diflunisal eased the swelling in his hands.
