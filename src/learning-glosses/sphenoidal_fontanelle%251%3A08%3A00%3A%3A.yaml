senseId: 'sphenoidal_fontanelle%1:08:00::'
synsetId: 05551174-n
simpleMeaning: A soft patch at each side of the skull where four bones meet; as the bones harden, that
  patch turns into a joined point named the pterion.
scope: The soft side patch near the ear, not the wide one on top of the skull or the narrow one at the
  rear.
examples:
- The sphenoidal fontanelle closes during the first months of life.
- Each side of the skull has a sphenoidal fontanelle.
