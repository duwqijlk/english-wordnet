simpleMeaning: Turn a flat shape like a stretched circle round one of the lines through its middle and
  you get this shape
scope: This shape comes from turning an ellipse round one of its lines, not a ball and not a flat oval.
examples:
- The ellipsoid of revolution looked like a ball that had been stretched.
- A planet is often drawn as an ellipsoid of revolution.
