simpleMeaning: a frame of straight or crossed bars across a way in, letting air through while keeping
  out what would pass
scope: 'Also called a grate: bars across a way in that block the way but let air through, not the tool
  that spreads light into colours.'
examples:
- A grating covered the drain so no one could fall in.
- The grating over the cellar window let in air but kept out thieves.
