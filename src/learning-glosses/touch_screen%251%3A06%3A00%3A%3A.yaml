simpleMeaning: a computer display that you use by pressing parts of it with your fingers
scope: This is a computer display you use by pressing it with your fingers; touchscreen is another name
  for this sense, and it is not a plain display with a keyboard or a way of typing.
examples:
- She tapped the touch screen to open the map.
- The touch screen let him choose a song with one press.
