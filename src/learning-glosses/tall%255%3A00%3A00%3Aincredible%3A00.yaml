simpleMeaning: So unlikely that no reasonable person could accept it as true.
scope: This describes a claim or story too far-fetched to believe, as opposed to the physical height sense
  of tall.
examples:
- Grandad's tall stories about the war grew wilder every year.
- Nobody believed his tall tale about walking home from the moon.
