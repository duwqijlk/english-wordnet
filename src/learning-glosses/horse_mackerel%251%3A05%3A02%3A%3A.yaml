simpleMeaning: A big, long, flat fish eaten as food, from the Atlantic seas off Europe
scope: A big, long, flat fish eaten as food, from the Atlantic seas off Europe; not the largest tuna that
  shares its name in another sense, and not a fish of warm seas.
examples:
- The horse mackerel is caught in the Atlantic waters of Europe.
- A horse mackerel makes a good meal when grilled.
