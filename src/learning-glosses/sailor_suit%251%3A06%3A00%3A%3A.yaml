simpleMeaning: a set of clothes for a boy, made to look like the clothes worn by men who work on ships
scope: A set of clothes for a boy made to look like a ship worker's clothes, not a grown man's work clothes
  and not a school uniform.
examples:
- The little boy wore a sailor suit to the party.
- His sailor suit was made to look like a real sailor's uniform.
