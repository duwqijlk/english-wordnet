simpleMeaning: A picture or object made to stand for a quality, a kind of thing, or a group
scope: A design or object that stands for a quality, kind, or group; not a symbol of a mere idea and not
  a badge of rank.
examples:
- The rose is the emblem of England.
- The emblem on the shield stood for courage.
