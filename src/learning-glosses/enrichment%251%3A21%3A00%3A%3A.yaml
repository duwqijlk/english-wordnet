simpleMeaning: a gift that makes the person who gets it much richer
scope: This is a gift that makes someone much richer; it is not the act of making something fuller, more
  full of meaning, or better in another way.
examples:
- His uncle's gift was an enrichment that made him rich for life.
- The enrichment from her aunt's will let her buy a house and land.
