senseId: symbiotic%5:00:00:dependent:00
synsetId: 00730712-s
simpleMeaning: Used of living things, especially of different kinds, that live together, though not always
  to the good of each.
scope: For pairs of different species living together, whether or not each gains from it.
examples:
- The two kinds of creatures lived in a symbiotic way, sharing the same rock.
- Their symbiotic life together did not help either of them much.
