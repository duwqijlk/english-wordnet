simpleMeaning: Greyish leaves that most often turn black as they dry mark this North American tree, whose
  smooth leaves are covered with fine hairs.
scope: This North American tree is also called a silky willow.
examples:
- The silver willow's greyish leaves turned black as they dried.
- The silver willow is a North American tree.
