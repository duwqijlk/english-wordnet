simpleMeaning: To join two pieces of wood by cutting a step in the edge of each piece so they fit together
scope: To join wood with a step cut in the edge, not by nails alone and not with a flat edge-to-edge joint.
examples:
- He rabbeted the two boards so they fit tight.
- The carpenter rabbets each edge before he joins the frame.
