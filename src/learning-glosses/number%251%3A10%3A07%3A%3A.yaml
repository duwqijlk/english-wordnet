synsetId: 06609408-n
simpleMeaning: one part of a series that is labeled with a figure to show its place.
scope: This sense is not a written sign for a quantity, not an identification code, and not the grammar
  category of singular and plural; it is a single labeled item within an ordered series.
examples:
- Each number in the catalogue stands for one painting.
- Number five in the list was missing.
