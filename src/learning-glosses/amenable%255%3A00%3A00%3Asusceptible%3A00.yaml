synsetId: 02371053-s
simpleMeaning: ready to listen to ideas from others and to be changed by them
scope: Also called tractable. This is about a person who will listen to ideas and can be guided by them,
  not a person who refuses to listen or change.
examples:
- The amenable child listened to his teacher and changed his plan.
- She was amenable to new ideas from the team.
