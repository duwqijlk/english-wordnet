simpleMeaning: Made in the male sex glands, this chemical brings about the usual marks of a male body.
scope: The chemical behind the usual marks of a male body is also called androgenic hormone.
examples:
- A boy's body takes on male marks as he grows, helped by androgen.
- Without enough androgen, the usual male marks of the body do not appear.
