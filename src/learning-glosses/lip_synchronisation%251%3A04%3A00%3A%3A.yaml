senseId: 'lip_synchronisation%1:04:00::'
synsetId: 00912231-n
simpleMeaning: Sound on a film is lined up with the picture so the words seem to come from the mouth,
  above all the mouth moves matching the words exactly.
scope: 'Also called lip sync, lip synch, and lip synchronization: the sound of a film fitted to the picture,
  not a film with the sound left out.'
examples:
- The lip synchronisation in the old film was so good that the words seemed to come from the actors' mouths.
- Bad lip synchronisation makes the dialogue look out of step with the picture.
