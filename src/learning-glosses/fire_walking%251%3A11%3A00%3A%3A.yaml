simpleMeaning: the act of stepping with bare feet over hot stones or a bed of embers, done as part of
  a rite
scope: The rite of stepping barefoot over hot stones or embers, not a walk on a beach and not a dance
  around a fire.
examples:
- Fire walking is part of the festival in their village.
- He tried fire walking for the first time last summer.
