simpleMeaning: Tiny bits of living stuff found in the blood of animals with backbones, needed for the
  blood to clot.
scope: Also called blood platelet and thrombocyte; tiny bits of living stuff in the blood of animals with
  backbones, needed for the blood to clot.
examples:
- Platelets gather at a cut and help the blood to clot.
- A low platelet count means the blood clots slowly.
