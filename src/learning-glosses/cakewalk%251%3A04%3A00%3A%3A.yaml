simpleMeaning: A proud, high-stepping dance built on a march, once done in minstrel shows, first a contest
  among Black dancers to win a cake.
scope: A proud, high-stepping dance built on a march, once done in minstrel shows, first a contest among
  Black dancers to win a cake, not the act of performing this dance.
examples:
- The cakewalk began, and the dancers stepped high to the march.
- They won the cakewalk and took home the cake.
