simpleMeaning: To stop a sickness that catches fast from spreading, the jab is given only to people near
  a sick person kept apart, making a circle of protected people around them.
scope: This is the jab given only to people near a sick person kept apart from others, not to everyone
  in the town.
examples:
- Doctors used ring vaccination to stop the sickness from spreading.
- Only the sick man's close contacts got the jab under ring vaccination.
