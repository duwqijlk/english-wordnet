simpleMeaning: a view given, usually after an accountant's check, when a company's money reports as a
  whole neither show results fairly nor follow the accepted accounting rules of the United States
scope: An auditor's view that money reports do not show results fairly, not a clean opinion and not a
  refusal to give an opinion.
examples:
- The auditor gave an adverse opinion on the firm's accounts.
- An adverse opinion means the reports cannot be trusted as fair.
