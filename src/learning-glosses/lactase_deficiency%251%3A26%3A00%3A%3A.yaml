simpleMeaning: A disorder from birth, in which milk and milk foods cannot be digested, because lactase
  is missing or too low to split lactose.
scope: Also called lactose intolerance and milk intolerance, a disorder from birth, in which milk and
  milk foods cannot be digested, because lactase is missing or too low to split lactose.
examples:
- Lactase deficiency stops milk digestion.
- They have lactase deficiency.
