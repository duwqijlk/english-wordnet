senseId: spirant%5:00:00:soft:03
synsetId: 01160686-s
simpleMeaning: Through a narrow gap air is pushed to make a speech sound, as 'f', 's', 'z', or 'th' in
  both 'thin' and 'then'.
scope: A speech sound made by pushing air through a narrow gap, not by stopping the air, is also called
  strident, sibilant, continuant, and fricative.
examples:
- Say the spirant 'th' in 'thin'.
- The spirant 's' hisses as air passes through.
