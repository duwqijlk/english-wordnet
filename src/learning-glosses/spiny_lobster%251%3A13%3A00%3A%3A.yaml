simpleMeaning: Warm-water shellfish with no claws give the frozen tails sold most often from Australia
  and South Africa; fishermen pull them up in Florida and California too.
scope: Also called crayfish, langouste, and rock lobster, it is a clawless shellfish of warm water, not
  a lobster with big claws.
examples:
- We ate spiny lobster tails from Australia.
- The spiny lobster has no claws.
