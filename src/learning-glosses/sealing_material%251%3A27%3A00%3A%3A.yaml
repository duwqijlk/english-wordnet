simpleMeaning: Any stuff used to close joins or fill cracks in a surface that lets liquid through
scope: Any stuff used to close joins or fill cracks in a surface that lets liquid through, not glue that
  only joins two parts and not paint that only coats a top.
examples:
- He spread sealing material along the window joint.
- Sealing material filled the cracks in the wall.
