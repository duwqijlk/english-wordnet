simpleMeaning: a state of mind in which someone feels blamed or attacked and must protect themselves
scope: This is the noun for that state of mind, not the word for plans or weapons made to stop an attack,
  and not the act of giving reasons for what you said or did.
examples:
- He went on the defensive when I asked about the money.
- She took the defensive at once, though no one had blamed her.
