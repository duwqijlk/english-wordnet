simpleMeaning: A person who dislikes new inventions and machines, and keeps away from them.
scope: For someone who will not use new machines, and keeps to older ways of doing things.
examples:
- The technophobe refused to use a smartphone.
- As a technophobe, they still wrote letters by hand.
