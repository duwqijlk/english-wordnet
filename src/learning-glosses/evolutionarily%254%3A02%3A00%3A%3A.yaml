simpleMeaning: in a way to do with how living things change over time, or seen in that way
scope: This word tells how a change is seen or happens, through how living things change over time, not
  through how one thing grows in its own life.
examples:
- Evolutionarily, this change helped the animal live in cold places.
- Seen evolutionarily, the two animals are close in how they changed.
