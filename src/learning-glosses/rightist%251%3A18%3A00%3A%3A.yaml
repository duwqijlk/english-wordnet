simpleMeaning: a member of a party that stands for keeping things as they are
scope: A member of a party that stands for keeping things as they are; right-winger is another name for
  this sense, not a member of a party that stands for change and not a person who only holds such views.
examples:
- The rightist called for a return to old laws.
- Rightists in the party opposed the change.
