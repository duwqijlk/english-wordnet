simpleMeaning: a block, a flat plate, or another hard surface with a picture or lines cut into it
scope: This is the hard block or plate itself, with the picture cut into it. It is not the printed picture
  made from it, and not the act of making such plates and printing from them.
examples:
- The museum keeps the old copper engraving used to print the map.
- This engraving is a heavy wood block with the picture cut into it.
