simpleMeaning: A Navajo secret agent in World War II who sent secret messages in a code built from his
  own language, which the Japanese never broke
scope: This is a Navajo secret agent in World War II who sent messages in a code built from his own language;
  codetalker is another name for this sense, and it is not a code breaker or an ordinary radio operator.
examples:
- The windtalker sent the message in Navajo so the enemy could not read it.
- Each windtalker worked with a partner to send and receive coded orders.
