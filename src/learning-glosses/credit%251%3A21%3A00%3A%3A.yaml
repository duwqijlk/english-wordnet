simpleMeaning: an agreement that lets someone receive goods or services now and pay for them later
scope: This is a buy-now-pay-later arrangement, not a lender's estimate of repayment ability or a note
  naming a source.
examples:
- The shop offered him six months' credit on the new sofa.
- They bought the car on credit and paid it off over two years.
