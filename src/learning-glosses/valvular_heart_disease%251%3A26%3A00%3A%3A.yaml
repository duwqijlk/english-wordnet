simpleMeaning: A sickness of the chest pump that comes from narrowed valves blocking the blood flow, or
  from worn valves letting blood flow back.
scope: A sickness of the chest pump from narrowed valves blocking the blood flow or worn valves letting
  blood flow back, not a sickness of the lungs and not a single blocked blood vessel.
examples:
- Valvular heart disease blocked the flow of blood through her chest.
- Worn valves let blood flow back in valvular heart disease.
