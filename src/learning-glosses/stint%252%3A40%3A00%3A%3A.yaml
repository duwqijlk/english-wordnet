simpleMeaning: to live on a very small amount of money given to you
scope: To live on very little money, also called scrimp and skimp; it is not the small bird, and not giving
  too little to someone else.
examples:
- She had to stint on a small allowance while she looked for work.
- They stinted for months, living on very little money each week.
