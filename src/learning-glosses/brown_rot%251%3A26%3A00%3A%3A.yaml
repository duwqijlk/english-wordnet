simpleMeaning: any of certain fungus diseases of plants that turn the plant's flesh dark and make it decay
scope: This is any of certain fungus diseases of plants that turn the plant's flesh dark and make it decay,
  not a blight and not a mildew.
examples:
- Brown rot spoiled half the peaches on the tree.
- The gardener cut out the brown rot from the plums.
