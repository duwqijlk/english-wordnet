simpleMeaning: a sign of illness in which air is suddenly forced out of the nose and you cannot stop it
scope: Another name for this is a sneeze. It is air forced out of the nose, not coughing, which pushes
  air out of the mouth.
examples:
- His sneezing got worse when the cat came into the room.
- She could not stop her sneezing all morning because of her cold.
