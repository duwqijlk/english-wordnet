simpleMeaning: calm and steady in the face of trouble, in the way of a person who thinks deeply about
  life, meeting trouble with clear thinking and keeping feelings in control
scope: Also called philosophical, this means calm and steady when trouble comes, not about the study of
  philosophy or people who study it.
examples:
- He stayed philosophic about losing his job and calmly looked for a new one.
- She took a philosophic view of the delay and did not get upset.
