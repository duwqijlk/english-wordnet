simpleMeaning: in architecture, one of the three original styles of Greek building, told apart by its
  columns and entablature, or a Roman style derived from them
scope: This is an architectural style of ancient Greece or Rome, not a command, not a request for goods,
  not a biological grouping of families, not an arrangement of things in sequence, and not a religious
  community.
examples:
- The temple was built in the Doric order.
- Roman architects adapted the Corinthian order from Greek models.
