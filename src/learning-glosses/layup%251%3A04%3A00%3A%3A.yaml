simpleMeaning: In basketball, a shot taken with one hand from under or beside the basket, usually hitting
  the board behind it first
scope: Also called lay-up. It is a close one-hand shot in basketball, not a shot from far away and not
  a throw from a set place after a foul.
examples:
- He ran under the basket and scored with an easy layup.
- Her layup hit the board and dropped through the net.
