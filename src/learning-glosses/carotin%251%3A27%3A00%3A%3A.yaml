simpleMeaning: The liver turns this orange chemical into vitamin A; it is one form of a chemical made
  of hydrogen and carbon, its links left open, found in many plants
scope: Also called carotene, this orange chemical from many plants is turned into vitamin A by the liver,
  not the vitamin itself.
examples:
- Carotin gives carrots their orange colour.
- The liver turns carotin into vitamin A.
