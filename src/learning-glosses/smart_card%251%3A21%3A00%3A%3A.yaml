simpleMeaning: a plastic card with a tiny chip inside that lets its holder do things needing the facts
  kept on the chip, most often used to pay for things
scope: A plastic card with a tiny chip that holds facts, not a plain bank card and not a door key card.
examples:
- She paid with her smart card at the till.
- The smart card holds the facts the machine needs to check her pass.
