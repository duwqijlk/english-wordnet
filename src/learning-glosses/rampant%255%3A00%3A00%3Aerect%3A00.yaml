simpleMeaning: standing on its left hind leg, front legs raised, head usually seen from the side
scope: An animal standing on its left back leg with front legs raised, with rearing as another name for
  this sense, and not an animal running wild or a plant spreading fast.
examples:
- The shield bore a lion rampant.
- A lion rampant stood on the old coat of arms.
