simpleMeaning: A member of one of four speech groups of the prehistoric Greeks, heard in south-east Peloponnese,
  Crete, Rhodes, southern Aegean isles, Asia Minor coast towns, south Italy, Sicily, Epirus, Macedon
scope: This is a member of one of the four old Greek speech groups, not a citizen of Athens and not a
  later Greek.
examples:
- The Dorian came from a city on the coast of Asia Minor.
- Dorians lived in Crete and in Rhodes.
