senseId: unfaltering%5:00:00:resolute:00
synsetId: 01997735-s
simpleMeaning: Marked by firm purpose and resolve, never shaken.
scope: This sense is also called firm, steady, stiff, unwavering, steadfast, unshakable, and unbendable,
  for what is marked by firm purpose and resolve, never shaken, where firm is strong and steady in purpose,
  holding to your mind and not giving way, steady is strong in purpose, holding to your mind, and not
  giving way, and stiff is strong and steady in purpose or belief, holding fast and not giving way.
examples:
- Her faith was unfaltering, never shaken.
- He stayed unfaltering in his resolve.
