simpleMeaning: a flower that opens in a certain way
scope: A flower described by the way it opens. It is not a person who learns or grows late, and not an
  item of clothing.
examples:
- The rose is an early bloomer, opening in late spring.
- This plant is a night bloomer, so its flowers open after dark.
