simpleMeaning: A statement in which someone gives a personal opinion or belief, or adds information.
scope: This is not a note written into a book or document; it is a remark that gives an opinion or adds
  information.
examples:
- He made a brief comment about the weather before changing the subject.
- A few comments from the audience followed the talk.
