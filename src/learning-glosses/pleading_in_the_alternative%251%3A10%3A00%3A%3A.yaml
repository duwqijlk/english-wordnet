senseId: 'pleading_in_the_alternative%1:10:00::'
synsetId: 06572012-n
simpleMeaning: A court paper that puts forward facts so far apart that it is hard to tell which facts
  a person will rest on
scope: A court paper that puts forward facts too far apart to tell which facts will be used; also called
  alternative pleading, not a single clear claim and not a plain statement of facts.
examples:
- The lawyer filed a pleading in the alternative after the first claim failed.
- A pleading in the alternative lets a lawyer put forward two claims that do not match.
