simpleMeaning: A hard grey metal that breaks with ease, able to join in many ways, much like iron but
  not drawn to a magnet; used in steel; found in many minerals.
scope: Also called manganese and atomic number 25; a hard grey metal, not iron and not a soft metal.
examples:
- Mn goes into most steel.
- The mine yields Mn in dark rock.
