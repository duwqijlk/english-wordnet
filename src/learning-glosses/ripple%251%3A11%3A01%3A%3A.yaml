senseId: 'ripple%1:11:01::'
synsetId: 07360041-n
simpleMeaning: In electronics, a small wave that rides on top of a steady level, and makes it move up
  and down a little
scope: A small wave on a steady electric level, not a small wave on water and not water moving with a
  bubbling sound.
examples:
- The ripple in the power supply made the screen flicker.
- Engineers tried to cut the ripple to almost nothing.
