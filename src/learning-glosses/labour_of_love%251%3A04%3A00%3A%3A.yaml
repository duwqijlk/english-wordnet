senseId: 'labour_of_love%1:04:00::'
synsetId: 00798868-n
simpleMeaning: Work done for free, by choice, that makes something real and gives no pay
scope: 'Also called labor of love: work done for its own sake, not paid work and not work done because
  someone told you to do it.'
examples:
- She spent the summer restoring the old boat as a labour of love.
- His labour of love was the garden he built with his own hands.
