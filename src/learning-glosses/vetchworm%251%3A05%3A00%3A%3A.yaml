simpleMeaning: Corn, cotton and tomato crops are badly harmed, above all, by the young of a moth that
  flies at night.
scope: The young of a moth that flies at night, not the grown moth itself, is also called the corn earworm,
  the cotton bollworm, the tobacco budworm or the tomato fruitworm.
examples:
- The vetchworm badly harmed the corn crop.
- The vetchworm badly harmed the cotton and tomato crops.
