simpleMeaning: A small sea animal with teeth that lives in the warm sea off both the east and west sides
  of North America
scope: A small toothed sea animal of warm North American waters, not the much larger sperm whale and not
  a dolphin or porpoise.
examples:
- We saw a pygmy sperm whale rise near the boat off the coast of Florida.
- The pygmy sperm whale washed up on the beach in California was only a few feet long.
