simpleMeaning: a lack of care and a lack of action in doing what is good, shown as a person and counted
  as one of the deadly sins
scope: 'Also called sloth and acedia: this is the deadly-sin sense, about not caring to do what is good,
  not the common sense of not liking work.'
examples:
- In the old teaching, laziness was listed as one of the seven deadly sins.
- The priest warned that laziness, a failure to care about doing good, could harm the soul.
