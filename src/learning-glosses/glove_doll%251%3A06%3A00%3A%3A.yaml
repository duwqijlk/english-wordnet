simpleMeaning: This toy figure is worn on the hand, and its body is cloth and its head is empty inside
scope: A toy figure worn on the hand, also called a glove puppet and a hand puppet, not a toy figure moved
  by strings and not a doll that stands on its own.
examples:
- She put on the glove doll and made it wave at the children.
- The glove doll had a cloth body and a hollow head that fit over her hand.
