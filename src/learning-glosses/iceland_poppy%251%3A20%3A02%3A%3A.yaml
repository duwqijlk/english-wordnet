simpleMeaning: A plant of the north that lives for many years in cold lands on both sides of the world,
  with sweet-smelling white or yellow to orange or peach flowers
scope: This is a cold-land plant of both halves of the world with sweet-smelling white to peach flowers;
  also called arctic poppy and Papaver nudicaule, and it is the subarctic kind, unlike the Old World alpine
  kind.
examples:
- The Iceland poppy blooms white or yellow in the cold north.
- Iceland poppies grow on both sides of the world.
