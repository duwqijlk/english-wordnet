simpleMeaning: The state of a thing that has been made more even or steady
scope: The state of a thing that has been made more even or steady, also called regularisation; not the
  act of making a thing regular and not a thing left uneven.
examples:
- Regularization of the rules helped everyone know what to do.
- Regularization of working hours gave staff a steady week.
