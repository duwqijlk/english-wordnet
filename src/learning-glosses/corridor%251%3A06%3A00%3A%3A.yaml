simpleMeaning: a way inside a building with walls on both sides, where rooms usually open out to it
scope: This is a way inside a building that leads to rooms. It is not a room itself and not a way outside
  a building.
examples:
- Her room is at the end of the corridor.
- We waited in the corridor outside the office.
