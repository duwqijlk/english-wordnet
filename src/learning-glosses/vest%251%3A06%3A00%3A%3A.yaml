simpleMeaning: a piece of clothing for men, worn under other clothes on the top part of the body, with
  no collar
scope: This is men's clothing worn under other clothes on the top part of the body; it is not the sleeveless
  piece worn under a coat, and not putting on church clothes.
examples:
- He wore a white vest under his shirt.
- In winter he puts on a warm vest before his shirt.
