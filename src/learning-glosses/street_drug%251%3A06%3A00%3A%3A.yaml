simpleMeaning: a substance taken not to heal but often to change how the mind feels; too much can harm
  body and mind and in some cases make a person need it
scope: 'Also called a drug of abuse: a substance taken to change how the mind feels, not a medicine taken
  to heal and not a drink such as beer.'
examples:
- He was caught selling street drugs near the school.
- Street drugs can harm the body and mind when taken too much.
