simpleMeaning: Based on rules about right and wrong that do not come from personal opinion alone, or showing
  those rules in action
scope: This is based on rules about right and wrong that do not come from personal opinion alone, and
  it can be shown in action; not based on what is easy or good for oneself, and not just being kind in
  one moment.
examples:
- She is a principled person who will not lie to win.
- He made a principled choice to return the money.
