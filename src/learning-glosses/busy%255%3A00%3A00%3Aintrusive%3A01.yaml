senseId: busy%5:00:00:intrusive:01
synsetId: 01355409-s
simpleMeaning: too eager to get involved in other people's business, in a way that annoys them.
scope: This is not about having a lot to do or about a pattern full of detail; it describes a person who
  pries into the affairs of others.
examples:
- The busy neighbor kept asking about our private affairs.
- He was too busy in other people's business to notice his own.
