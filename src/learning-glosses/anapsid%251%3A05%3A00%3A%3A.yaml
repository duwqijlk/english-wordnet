simpleMeaning: The skull of this early kind of reptile has no hole in its side near the temples, and of
  the whole group only turtles are left alive.
scope: This early kind of reptile, also called anapsid reptile, is known by a skull with no hole in its
  side near the temples, and only turtles of its group are left alive.
examples:
- Long ago, anapsids walked the earth, and only turtles are left of their kind.
- The bones came from an anapsid, a reptile with no hole in the side of its skull.
