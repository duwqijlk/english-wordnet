simpleMeaning: This big bird from Europe, Asia and Africa has a tuft of feathers on its head, flaps of
  skin on its face, and sharp points
scope: Also called a lapwing, a peewit or a green plover, this big crested bird of the Old World is not
  the small olive-coloured flycatcher of North America also called a pewit.
examples:
- A pewit stood in the wet field, its crest lifted in the wind.
- We heard the pewit calling over the marsh at dusk.
