simpleMeaning: showing, coming from, or typical of the way of life that a group of people has built up
scope: About the way of life of a group of people, also called cultural or ethnical; not a person in such
  a group, and not about not following the main religions.
examples:
- They served ethnic food from their home country at the fair.
- Ethnic dress and music were a big part of the town festival.
