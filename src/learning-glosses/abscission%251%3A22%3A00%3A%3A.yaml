synsetId: 13444952-n
simpleMeaning: Once scar tissue has formed in a plant, its blooms, leaves and fruit fall away.
scope: This is the name for blooms, leaves and fruit falling away once scar tissue has formed in a plant,
  not the verb for the plant doing it.
examples:
- The branch grew bare through abscission.
- The fruit fell by abscission after scar tissue had formed.
