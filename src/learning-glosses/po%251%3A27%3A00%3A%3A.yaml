simpleMeaning: A metal that gives off rays, like tellurium and bismuth; it is found in uranium ores, but
  can also be made by hitting bismuth with neutrons in a nuclear reactor.
scope: A radioactive metal, not bismuth and not radium; also called atomic number 84 and polonium.
examples:
- Po is so radioactive that it must be kept in a sealed box.
- Scientists study Po in a safe lab.
