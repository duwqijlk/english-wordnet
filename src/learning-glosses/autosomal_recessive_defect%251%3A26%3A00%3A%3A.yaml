senseId: 'autosomal_recessive_defect%1:26:00::'
synsetId: 14185757-n
simpleMeaning: an illness a person gets only when they carry two changed genes on a chromosome that does
  not set sex
scope: 'Also called autosomal recessive disease: an illness that needs two changed genes, not an illness
  from one changed gene and not an illness from a gene on a sex chromosome.'
examples:
- Cystic fibrosis is an autosomal recessive defect that appears only when a child gets two changed genes.
- Both parents carried the gene, so their child had the autosomal recessive defect.
