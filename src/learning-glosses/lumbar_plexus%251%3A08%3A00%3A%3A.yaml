simpleMeaning: A net of nerves made from the front branches of the first four nerves of the lower back.
scope: This is a net of nerves made from the front branches of the first four nerves of the lower back,
  not the net of lymph tubes in the same place, which is the other sense of lumbar plexus; plexus lumbalis
  is another name for this sense.
examples:
- The lumbar plexus supplies nerves to the front of the thigh.
- Damage to the lumbar plexus can weaken the leg.
