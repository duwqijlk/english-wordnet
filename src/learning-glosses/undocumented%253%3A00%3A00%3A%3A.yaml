simpleMeaning: not having the needed papers, for example papers that let a person live or work in a country
scope: 'Not having the needed papers: for example, a person''s papers to live or work in a country, or
  the papers that support a tax deduction. Not the same as a thing that is just not written down.'
examples:
- Undocumented workers may find it hard to get a job.
- She lived in the country for years as an undocumented person without papers to stay.
