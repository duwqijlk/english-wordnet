synsetId: 03283825-n
simpleMeaning: While a baby is being born, this electronic device follows the unborn baby's heartbeat
  and the squeezes of the mother's womb.
scope: Also called electronic fetal monitor, electronic foetal monitor, and foetal monitor, this is a
  device that watches an unborn baby's heartbeat and the mother's womb during birth, not a device that
  treats the baby and not a general hospital screen.
examples:
- The nurse checked the fetal monitor during labor.
- A fetal monitor showed the baby's heartbeat was steady.
