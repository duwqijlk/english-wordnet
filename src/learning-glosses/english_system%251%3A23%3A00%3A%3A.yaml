simpleMeaning: The foot, the pound, the second, and the pint are the units this set of weights and measures
  is based on.
scope: Also called British Imperial System and British system, this is a set of weights and measures based
  on the foot, the pound, the second, and the pint, not the metric set of weights and measures.
examples:
- The English system uses the foot and the pound.
- In the English system, the pint is a unit of volume.
