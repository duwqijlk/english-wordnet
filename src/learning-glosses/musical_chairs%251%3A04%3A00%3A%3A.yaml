simpleMeaning: Children march round seats to music, one short of the players; when it stops dead, all
  rush to sit, one left standing is out, a seat goes, till one wins.
scope: It is a children's game in which a seat is taken away after every stop of the music, until only
  the winner is seated.
examples:
- The children played musical chairs, marching round the seats while the music played.
- At musical chairs, she found a seat just as the music stopped.
