simpleMeaning: to put a sweet, soft covering on a cake or similar sweet food
scope: Putting a sweet covering on a cake; not covering something with ice, not harming something by cold,
  and not the forming of ice.
examples:
- She frosted the birthday cake with a sweet white covering.
- He frosted each cupcake before putting it on the plate.
