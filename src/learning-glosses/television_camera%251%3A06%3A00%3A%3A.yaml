simpleMeaning: A stream of tiny charged bits reads across a surface that reacts to light, where glass
  has bent light to put a picture.
scope: People also call it a camera, and a tv camera is another name for it, and it turns a picture into
  signals by reading a light-reacting surface.
examples:
- The television camera followed the singer across the stage.
- A television camera stood at the back of the hall.
