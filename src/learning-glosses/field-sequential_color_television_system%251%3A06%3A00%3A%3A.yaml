simpleMeaning: An early kind of TV that shows pictures in colour by reading one picture part after another
  in red, green and blue.
scope: An early kind of TV that shows pictures in colour by reading one picture part after another in
  red, green and blue; also called field-sequential color television, not a later TV that shows the whole
  picture at once.
examples:
- The museum keeps a field-sequential color television system from the early days of TV.
- A field-sequential color television system showed colour by scanning one field after another.
