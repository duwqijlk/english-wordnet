simpleMeaning: A tuneful state of things in general, and of their marks, as of colours and sounds, a fitting
  of parts with each other and with the whole.
scope: A tuneful state of things in general, and of their marks, as of colours and sounds, a fitting of
  parts with each other and with the whole; also called harmony or concordance; not the fixing of word
  endings by word ties.
examples:
- Their concord held at dawn.
- The concord was plain at noon.
