simpleMeaning: A flat plate put up to remember a person or event, made of a yellow metal that is a mix
  of copper and zinc.
scope: A flat plate put up to remember a person or event, made of a yellow metal that is a mix of copper
  and zinc; brass is another name for this, and it is not a stone marker or a picture.
examples:
- A memorial tablet on the wall names the fallen soldiers.
- They placed a memorial tablet in the church.
