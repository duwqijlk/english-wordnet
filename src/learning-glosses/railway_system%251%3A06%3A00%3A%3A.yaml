simpleMeaning: Trains that carry people or goods, run by one firm as a single transport service
scope: 'Also called a railway, a railroad, a railroad line, and a railway line: a firm that runs a train
  service, not a set of tracks and not a single vehicle.'
examples:
- The railway system carries thousands of people into the city each morning.
- After the storm, the whole railway system stopped running for a day.
