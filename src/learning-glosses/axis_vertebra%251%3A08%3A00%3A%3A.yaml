simpleMeaning: The second bone of the neck, which works as a turning point that lets the head turn
scope: This is the second bone of the neck, which works as a turning point that lets the head turn; axis
  is another name for it, not the first bone of the neck and not the skull itself.
examples:
- The axis vertebra lets the head turn from side to side.
- The second bone of the neck, the axis vertebra, works as a turning point.
