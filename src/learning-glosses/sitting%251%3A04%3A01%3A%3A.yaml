simpleMeaning: in photography, the act of taking up a pose for a photograph or portrait
scope: This is the act of posing for a photograph or portrait, not the act of taking or keeping a seated
  position, not a session of a legislature or court, and not a meeting of spiritualists.
examples:
- The portrait took three sittings to complete.
- She arrived early for her first sitting with the photographer.
