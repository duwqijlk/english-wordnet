simpleMeaning: A device that opens or shuts a moving part in response to electric or air signals.
scope: A tool that opens or shuts a moving part on a signal by wire or by air, not the moving part itself
  and not a switch worked by hand.
examples:
- The positioner opened the valve when the signal came through.
- A faulty positioner left the gate half shut.
