simpleMeaning: Describing a flower with more petals than normal, packed in dense, overlapping layers.
scope: This describes the petal arrangement of a flower, not the sense meaning twice as great or many,
  not consisting of two parts or components, not large enough for two people, not having two meanings
  with intent to deceive, not paired homologous chromosomes during synapsis, not a stand-in performer,
  not a two-base hit, not a card-game stake, and not the verb or adverb senses.
examples:
- The double peonies in the border open into tight balls of overlapping petals.
- Because its many petals are so densely packed, the double bloom hides its centre.
