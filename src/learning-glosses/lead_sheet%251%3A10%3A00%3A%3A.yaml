simpleMeaning: A page that gives the words and tune of a song, with a hint of how the notes fit together,
  written in plain form
scope: A simple page with words and tune, not a full score with every part written out and not the words
  alone.
examples:
- The singer read the lead sheet and played the song on the piano.
- He wrote a lead sheet so the band could follow the tune.
