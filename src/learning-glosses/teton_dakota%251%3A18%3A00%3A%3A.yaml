simpleMeaning: Several groups that lived on the plains made up the large western branch of the Sioux people,
  and this person belongs to it.
scope: 'Also called Lakota, Teton and Teton Sioux: one who belongs to the large western branch of the
  Sioux, not a member of another branch.'
examples:
- She was a Teton Dakota of the western plains.
- The Teton Dakota lived in several groups on the plains.
