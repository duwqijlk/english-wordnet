simpleMeaning: a written order from a court that usually tells a person they must come to court in a civil
  case, or lose the case if they do not come
scope: 'Also called a process: a court order telling a person to come to a civil case, not a general order
  and not the act of calling someone.'
examples:
- The court sent him a summons to appear next week.
- She received a summons and knew she had to go to court.
