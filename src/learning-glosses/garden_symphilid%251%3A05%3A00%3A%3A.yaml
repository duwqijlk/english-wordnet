simpleMeaning: A tiny bug with many legs that often lives in the earth under market crops and glasshouse
  plants
scope: This is a tiny bug with many legs that often lives in the earth under market crops and glasshouse
  plants; garden centipede and symphilid are other names for this sense, not a true centipede and not
  a worm.
examples:
- The garden symphilid lives in the earth under the crops.
- Garden symphilids live in the earth under glasshouse plants.
