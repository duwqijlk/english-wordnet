simpleMeaning: the distance in a straight line from the tip of one side to the tip of the other side of
  the parts used for flying
scope: The full width from tip to tip across the parts used for flying; not the length of the body and
  not the width of one side alone.
examples:
- This plane has a wingspan of 60 metres, wider than the building is tall.
- An eagle's wingspan can reach over two metres from tip to tip.
