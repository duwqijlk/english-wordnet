simpleMeaning: a tiny lump with a black top that blocks a small hole in the skin
scope: A small blocked hole in the skin with a black top; it is not a flat dark mark on the skin and not
  a red spot full of yellow matter.
examples:
- She squeezed a blackhead on her nose.
- Blackheads often appear on the chin and forehead.
