simpleMeaning: a wax that comes from crude petroleum (oil from the ground), used to make candles and to
  make coverings that keep things from going bad or keep water out
scope: This wax, also called paraffin wax, is not the group of chemicals of the same name and not the
  British use for a fuel oil.
examples:
- The candles are made from paraffin.
- She put paraffin on the cheese to keep it safe from air and water.
