senseId: illogical%5:00:00:incoherent:00
synsetId: 00467212-s
simpleMeaning: not following in a clear order, with parts that do not join up well
scope: For things whose parts do not follow in a clear order, also called confused, scattered, disconnected,
  disjointed, garbled, unconnected, and disordered; not the sense about ideas that go against clear, correct
  thinking.
examples:
- His illogical story jumped from one event to another with no clear order.
- The illogical instructions were hard to follow from step to step.
