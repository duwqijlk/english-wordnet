simpleMeaning: A thin slice of meat, especially veal (meat from a young cow), usually fried or cooked
  by strong heat from above
scope: 'Also called cutlet, escallop, and scollop: a thin slice of meat, not the sea animal with a fan-shaped
  shell and not the meat of that animal.'
examples:
- She ordered a veal scallop with lemon and herbs.
- He cooked a thin scallop of veal in a hot pan.
