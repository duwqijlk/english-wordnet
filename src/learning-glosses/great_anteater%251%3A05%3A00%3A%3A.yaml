simpleMeaning: Small insects are the food of this big, shaggy, toothless animal of South America, which
  takes them with a long tongue and strong claws.
scope: Ant bear, giant anteater, and tamanoir are other names for this big, shaggy animal from South America.
examples:
- A great anteater feeds on small insects in South America.
- A great anteater licked up ants with its long tongue.
