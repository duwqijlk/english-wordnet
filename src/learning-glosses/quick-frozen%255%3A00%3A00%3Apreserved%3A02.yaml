simpleMeaning: Made very cold very fast, food keeps its taste and the good things in it that keep you
  healthy.
scope: Also called frozen and flash-frozen, this food keeps its taste and goodness because it was made
  very cold very fast.
examples:
- The quick-frozen peas kept their taste.
- The quick-frozen peas were frozen fast enough to keep the good things in them.
