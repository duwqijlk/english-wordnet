simpleMeaning: An alert, nimble lizard with shrunken limbs, a long body and glossy scales; it needs more
  moisture than most lizards and lives in tropical regions worldwide.
scope: This shiny-scaled, short-legged tropical lizard is another name for the scincid lizard; it is not
  a gecko, and not a large monitor lizard.
examples:
- A skink darted across the path and vanished under a stone.
- Skinks keep to damp leaf litter because their skin loses water easily.
