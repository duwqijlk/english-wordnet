  and oranges and in other oils that carry scent.
scope: Among plant liquids, it is the one with a lemon smell, found in lemons and oranges and in other
  oils that carry scent.
examples:
- The cleaner smelled of limonene.
- Limonene gives lemon oil its fresh smell.
