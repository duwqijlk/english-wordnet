simpleMeaning: 'Weed from Europe, common in the southwestern United States and Mexico: reddish sprawling
  stems, fern-like leaves, small reddish-lavender flowers and upright slender fruits; often grown to feed
  animals.'
scope: This is the plant name for a low forage weed, not the thread-like worm that lives in blood and
  tissues.
examples:
- Filaria grows along roadsides and in overgrazed pastures in the Southwest.
- Filaria and filaree are two names for the same low weed.
