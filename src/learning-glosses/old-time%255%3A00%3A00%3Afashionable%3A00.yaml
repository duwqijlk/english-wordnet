simpleMeaning: A thing that looks pleasing because it seems to come from long ago, though it may not be
  truly from that age
scope: Pleasing to look at because it seems to come from long ago, also called quaint and olde worlde;
  not a thing that is old in years alone and not a plain new look.
examples:
- The cottage had old-time charm, with its thatched roof.
- She loved the old-time look of the village shop.
