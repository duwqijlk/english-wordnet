simpleMeaning: The fatty coat round nerve threads is made by flat, sheet-like parts of support cells in
  body tissue.
scope: Also called oligodendroglia, it is body tissue of support cells that wrap nerve threads in a fatty
  coat.
examples:
- The oligodendria wrap nerve fibres in a fatty coat.
- Oligodendria are the cells that make the fatty coat round nerve fibres.
