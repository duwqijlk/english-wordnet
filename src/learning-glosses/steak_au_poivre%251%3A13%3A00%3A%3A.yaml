simpleMeaning: A cut of beef rolled in crushed black pepper, served with a sauce of brandy and butter
  after quick frying in a pan.
scope: This is also called pepper steak and peppered steak, beef rolled in crushed black pepper, fried
  in a pan, and served with a brandy-and-butter sauce.
examples:
- Steak au poivre comes with a sauce of brandy and butter.
- The steak au poivre was covered in crushed peppercorns.
