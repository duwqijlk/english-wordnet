simpleMeaning: a person's habit of staying away from others and turning away from friends and company
scope: 'Also called unsociability: a person''s habit of staying away from others, not shyness about talking
  and not a dislike of one person.'
examples:
- His unsociableness meant he spent his evenings alone rather than with friends.
- Her unsociableness showed when she turned down every chance to join the group.
