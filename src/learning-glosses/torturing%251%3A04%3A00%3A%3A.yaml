simpleMeaning: pain of body or mind laid on a person by others on purpose, planned or out of cruelty,
  to force out information or a confession, or for any other reason
scope: 'Also called torture: the act of causing pain to force out information or a confession, not a single
  blow struck in anger.'
examples:
- The torturing went on until he confessed.
- Torturing prisoners to get answers is a crime.
