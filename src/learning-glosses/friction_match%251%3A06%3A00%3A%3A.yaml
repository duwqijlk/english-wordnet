simpleMeaning: a thin slip of wood or card with a tip of stuff that catches fire, made to light when rubbed
scope: Also called match and lucifer, this thin slip of wood or card lights when rubbed, not a lighter
  filled with gas.
examples:
- He struck a friction match to light the candle.
- She always carries a friction match in her pocket.
