simpleMeaning: A written order from a French king of former times, by which he could send a person to
  prison or to death under his seal.
scope: 'Also called a lettre de cachet: the old French king''s written order that could put a person in
  prison or to death, not the mark of high standing.'
examples:
- The king signed a cachet ordering the man's arrest.
- A cachet could send a prisoner to jail without trial.
