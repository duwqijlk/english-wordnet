simpleMeaning: Wanting much more than one should have, and eager to take it.
scope: 'Also called ravening and voracious: wanting far more than is right and grasping at it, not living
  by preying on other animals, and not devouring food in great amounts.'
examples:
- The rapacious landlord raised the rent again and again.
- Rapacious dealers took everything the family owned.
