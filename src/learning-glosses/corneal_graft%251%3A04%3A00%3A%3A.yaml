simpleMeaning: Healthy tissue from a donor takes the place of part or all of a hurt or sick cornea in
  this eye operation.
scope: Also called corneal transplant and keratoplasty, it is an eye operation in which healthy donor
  tissue takes over, not a lens change.
examples:
- The corneal graft took well, and her sight came back.
- After the corneal graft, he had to use drops for weeks.
