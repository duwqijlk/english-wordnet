simpleMeaning: To put costly stones on something to make it look fine
scope: This is the act of putting costly stones on something to make it look fine, not the stone itself
  and not a person thought of as very good and valued.
examples:
- The queen wore a jeweled crown at the ceremony.
- The tailor jeweled the dress with small bright stones.
