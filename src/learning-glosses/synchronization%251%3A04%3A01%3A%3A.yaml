simpleMeaning: a change made so that things happen or happen again at the same time and in step with each
  other
scope: 'Also called synchronisation and synchronizing: a change that makes things happen together, not
  setting clocks to show the same time and not just the fact that things happen at the same time.'
examples:
- Careful synchronization made the lights flash together again and again.
- Synchronization of the machines kept every part moving in step.
