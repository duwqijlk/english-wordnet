simpleMeaning: a breathing machine that changes the air pressure in a box around a sick person's chest,
  pushing air in and out of their lungs so they can keep breathing
scope: A machine that helps a sick person breathe by changing air pressure around the chest, not a mask
  or tube that blows air straight into the nose or mouth.
examples:
- The iron lung kept the polio patient breathing through the night.
- Nurses checked the iron lung to be sure its air pressure was right.
