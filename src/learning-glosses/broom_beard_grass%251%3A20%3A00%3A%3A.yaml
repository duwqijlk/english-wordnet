simpleMeaning: A tough North American plant with long thin leaves, good to look at, whose leaves turn
  pale bronze in the fall.
scope: Also called prairie grass and wire grass, this is a tough North American plant with long thin leaves
  that turn pale bronze in the fall; other tough plants of North America with leaves that change colour
  in the fall are its nearest rivals.
examples:
- In the fall, the broom beard grass turned pale bronze.
- We saw broom beard grass with leaves turning pale bronze in the fall.
