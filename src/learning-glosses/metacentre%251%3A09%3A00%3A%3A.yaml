simpleMeaning: In shipbuilding, the point where vertical lines through a hull's center of buoyancy, upright
  or tilted, cross; its height above the center of gravity shows the ship's stability.
scope: 'This is the shipbuilding sense: the crossing point used to judge a vessel''s steadiness; metacenter
  is the American spelling of the same term, and it is not the center of buoyancy or the center of gravity
  themselves.'
examples:
- The metacentre must stay above the center of gravity for the ship to be stable.
- Engineers marked the metacentre on the cross-section drawing.
