simpleMeaning: the wet flesh inside a thick skin marks any of many fruits of the Citrus group, which grow
  where the weather stays warm
scope: 'Also called citrus and citrus fruit: any of many thick-skinned, juicy fruits of warm lands, not
  a thin-skinned fruit of cold lands.'
examples:
- A citrous fruit such as an orange has a thick rind and juicy pulp.
- She peeled a citrous fruit and ate the juicy flesh inside.
