simpleMeaning: carrying messages to the muscles from the brain and the cord of nerves in the back (the
  central nervous system, or CNS)
scope: About nerves carrying messages from the brain and back cord to muscles, not a machine that makes
  movement and not a general cause of action.
examples:
- Motor nerves carry messages from the brain to the muscles in your legs.
- Damage to a motor nerve can make it hard to move a hand.
