simpleMeaning: The close-grained wood of a nut tree of the group called Corylus, and of the Australian
  tree of the same name, of the group called Pomaderris
scope: This is the close-grained wood of the nut tree and of the Australian tree of the same name, not
  the tree itself and not the brown colour.
examples:
- The table was made of hazel, polished to a soft shine.
- He carved the handle from hazel.
