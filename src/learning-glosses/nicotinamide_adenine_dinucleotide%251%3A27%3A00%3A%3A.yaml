simpleMeaning: a helper substance found in most living cells and made from the B vitamin nicotinic acid,
  that hands hydrogen to substances in the steps that keep a body going
scope: A helper substance that works with enzymes in cells, not a vitamin on its own and not a hormone.
examples:
- The lab measured nicotinamide adenine dinucleotide in the liver cells.
- Nicotinamide adenine dinucleotide helps carry hydrogen during the chemical steps in a cell.
