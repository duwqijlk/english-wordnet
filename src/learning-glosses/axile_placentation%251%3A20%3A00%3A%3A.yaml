simpleMeaning: Inside a flower's seed case with many parts, the young seeds sit at or near the middle,
  on a line made of walls that have joined together.
scope: 'Inside the seed case, the young seeds sit on a middle line: that is axile placentation.'
examples:
- The axile placentation of the flower can be seen when the seed case is cut open.
- In axile placentation the young seeds grow from the middle line of the seed case.
