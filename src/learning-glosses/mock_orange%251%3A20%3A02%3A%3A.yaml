simpleMeaning: A spiny southern US shrub with shiny leaves and unpalatable citrus-like fruit; its amber
  timber served Native Americans for bows, and it is grown as a boundary hedge.
scope: This is the thorny hedge tree with inedible citrus-like fruit, not the fragrant white-flowered
  garden shrub, the thorny southern tree that bears white flowers and small black berries, or the small
  flowering evergreen that share its name.
examples:
- A row of mock orange marked the property line between the two farms.
- The mock orange by the barn bears fruit that nobody eats.
