simpleMeaning: a big, fierce fish found in warm seas all over the world, known to attack people
scope: 'Also called a great white shark, a man-eater and a man-eating shark: a big, fierce fish found
  in warm seas all over the world, known to attack people, not a small harmless shark and not a whale.'
examples:
- A white shark circled the boat before it swam away.
- Swimmers were warned that a white shark had been seen near the beach.
