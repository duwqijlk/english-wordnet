simpleMeaning: a farm tool used to break up the top of the soil, to let in air, keep down weeds and keep
  water in the soil
scope: Also called tiller, this is a farm tool for breaking up soil; it is not the person who works the
  soil or grows crops.
examples:
- The farmer pulled the cultivator across the field.
- A cultivator helps loosen the soil before planting.
