senseId: 'mental_disorder%1:26:00::'
synsetId: 14107272-n
simpleMeaning: In psychiatry, a problem with how a person thinks or feels, put in a softer way than the
  harsher name for the same trouble
scope: In psychiatry, a problem with how a person thinks or feels, put in a softer way; disturbance, folie,
  mental disturbance and psychological disorder are other names for this sense, not a passing bad mood,
  and not a fault of the body.
examples:
- A mental disorder is a problem with how a person thinks or feels.
- He sought help for a mental disorder that made daily life hard.
