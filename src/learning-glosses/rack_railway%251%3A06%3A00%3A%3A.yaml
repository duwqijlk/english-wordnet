synsetId: 03069067-n
simpleMeaning: A line built for steep mountains, where a toothed wheel under the train bites into teeth
  on a middle track to grip and climb.
scope: Also called a cog railway; a line for steep mountains where a toothed wheel grips teeth on a middle
  track.
examples:
- The rack railway climbs the steep mountain by gripping a toothed track.
- They took the rack railway up to the top of the mountain.
