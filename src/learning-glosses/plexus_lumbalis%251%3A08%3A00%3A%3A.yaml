simpleMeaning: A net of nerves formed by the front branches of the first four nerves of the lower back
scope: A net of nerves formed by the front branches of the first four nerves of the lower back; lumbar
  plexus is another name for this sense, and this is not the lymph net along the lower aorta.
examples:
- The plexus lumbalis is a net of nerves in the lower back.
- Branches of the first four lower-back nerves form the plexus lumbalis.
