simpleMeaning: to dig up a growing plant and put it in a different place or in new soil
scope: This is about moving a growing plant to new soil or a new spot, not about moving money, data or
  people between places or jobs.
examples:
- We transferred the young trees to a sunnier spot in the garden.
- Seedlings should be transferred outdoors once the frost has passed.
