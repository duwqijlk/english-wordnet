senseId: 'cryptorchidism%1:26:00::'
synsetId: 14115729-n
simpleMeaning: one or both sex glands of a male baby fail to drop into the pouch of skin below the body
  while he grows in the womb
scope: 'Also called cryptorchidy or cryptorchism: a state in which one or both sex glands fail to drop
  into the pouch below the body before birth, not an illness of the glands in grown men.'
examples:
- The doctor found that the baby had cryptorchidism.
- Cryptorchidism means one sex gland has not dropped into place.
