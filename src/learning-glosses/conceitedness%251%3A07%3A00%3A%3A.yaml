simpleMeaning: The habit of thinking too well of oneself and showing too much pride in oneself, a pride
  that is not real
scope: The habit of thinking too well of oneself, also called vanity and conceit, not a fair pride in
  real work and not simple self-trust.
examples:
- His conceitedness made him hard to work with.
- Her conceitedness showed in every boast.
