simpleMeaning: A common weed of North America with narrow leaves and small disc-like heads of yellowish
  flowers, widely established through temperate regions and sometimes placed in the genus Erigeron.
scope: This is the fleabane with narrow leaves and small yellowish, disc-like flower heads, not the daisy-like
  fleabanes with white or pink petals. It has spread widely through temperate regions, and the name is
  a common one rather than a technical term.
examples:
- Fleabane came up in the bare patch beside the driveway.
- The field was full of fleabane, its small heads nodding in the wind.
