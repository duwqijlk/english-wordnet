simpleMeaning: a tool for hitting nails with a split end for pulling nails out
scope: A tool for hitting nails with a split end for pulling nails out; carpenter's hammer and clawhammer
  are other names for this sense, not a plain mallet and not a hatchet.
examples:
- He used the claw hammer to pull the bent nail from the board.
- She reached for her claw hammer to hang the picture.
