simpleMeaning: too much praise that is not truly meant, given in a too eager way to please someone
scope: This is praise that is too strong and not honest, meant to please someone; it is not true respect
  and not honest praise for good work.
examples:
- The king expected endless adulation from the people around him.
- She smiled at the adulation, but she knew the praise was not honest.
