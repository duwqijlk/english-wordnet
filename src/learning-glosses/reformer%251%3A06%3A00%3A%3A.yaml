simpleMeaning: A machine that changes the way the small parts in hydrocarbons (made only of hydrogen and
  carbon, as in oil and fuels) fit together, to make a richer fuel
scope: A machine used to make richer fuel, not a person who argues for change in how things are done.
examples:
- The plant uses a catalytic reformer to make richer fuel from oil.
- A new reformer was put in to change the fuel and make it richer.
