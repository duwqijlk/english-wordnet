simpleMeaning: Small parts made from fat, ketone bodies, rise too high in the blood, as in diabetes
scope: 'Also called acetonemia and ketosis: too many ketone bodies in the blood, as in diabetes, not a
  normal blood level and not a sugar problem alone.'
examples:
- The doctor found ketonemia in the patient's blood test.
- Ketonemia can occur when diabetes is not under control.
