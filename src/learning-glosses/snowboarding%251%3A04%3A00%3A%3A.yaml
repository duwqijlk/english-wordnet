simpleMeaning: the act of sliding down a slope covered in snow while standing on a wide flat board
scope: Sliding down a snow-covered slope while standing on one wide flat board, not skiing on two long
  thin boards with poles, and not sledding while sitting on a flat board that slides.
examples:
- He spent the day snowboarding down the steep slope behind the lodge.
- Snowboarding down a wide, snowy slope takes good balance.
