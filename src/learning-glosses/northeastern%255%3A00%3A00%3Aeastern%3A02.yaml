simpleMeaning: about the part of the United States that in general is made up of the New England states
  and New York, and at times New Jersey and Pennsylvania
scope: This word names a set part of the United States; it is not the sense that just means sitting in
  or facing toward the north-east.
examples:
- The northeastern states, such as Maine and New York, have cold winters.
- She took a tour of northeastern colleges, from Maine to New York.
