simpleMeaning: a clear oily chemical taken from coal tar and used to make man-made resins
scope: Also called coumarone and cumarone; a clear oily chemical, not coal tar itself and not a resin.
examples:
- Benzofuran is taken from coal tar.
- The factory uses benzofuran to make resins.
