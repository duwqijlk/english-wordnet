simpleMeaning: A yellowish crystal-like solid with a strong smell, at times used to dress wounds to kill
  germs
scope: A yellowish solid with a strong smell, at times used to dress wounds, also called iodoform; not
  a liquid medicine and not a bandage on its own.
examples:
- The nurse dusted triiodomethane on the wound to keep it clean.
- Triiodomethane smells sharp and comes as a yellow powder.
