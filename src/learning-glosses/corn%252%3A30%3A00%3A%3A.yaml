simpleMeaning: keep food from spoiling by covering it with coarse rock salt in large grains
scope: This is the verb for preserving food in coarse salt, not the grain plant or the hard skin patch
  on a toe.
examples:
- They corned the beef in a barrel of coarse salt.
- The old recipe tells you to corn the pork in salt.
