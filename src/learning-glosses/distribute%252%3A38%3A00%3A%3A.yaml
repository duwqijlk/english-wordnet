simpleMeaning: to make a thing go out to many people or places
scope: To make something go out to people; not the sense of spreading widely by itself, and not the sense
  of giving out small shares one by one.
examples:
- She distributed copies of the letter to all the teachers.
- Please distribute these forms to everyone in the room.
