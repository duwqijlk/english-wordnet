simpleMeaning: spoken in a blurred way, as if the speaker's tongue were thick and heavy
scope: 'Also called thick: words spoken in a blurred way, as if the speaker had a thick tongue, not words
  that are merely soft and not words in a tongue you do not know.'
examples:
- His words came out slurred, and we could hardly make out what he said.
- After the blow to the head, her speech was slurred for an hour.
