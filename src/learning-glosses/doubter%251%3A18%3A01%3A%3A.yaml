senseId: 'doubter%1:18:01::'
synsetId: 09798565-n
simpleMeaning: A person who is unsure about something and will not take a clear side on it.
scope: A person unsure about one thing who will not take a clear side, not the one who habitually doubts
  accepted beliefs.
examples:
- The doubter in the group would not say whether the plan would work.
- She listened like a doubter, unconvinced by every claim.
