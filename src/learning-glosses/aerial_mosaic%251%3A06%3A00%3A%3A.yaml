simpleMeaning: A set of photos taken from the air, put together to make one big picture.
scope: A set of photos taken from the air, put together to make one big picture, also called a mosaic
  and a photomosaic; not one photo on its own and not a drawn map.
examples:
- The survey team made an aerial mosaic of the valley.
- An aerial mosaic joins many small photos into one view.
