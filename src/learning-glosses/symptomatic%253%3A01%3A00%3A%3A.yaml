senseId: 'symptomatic%3:01:00::'
synsetId: 02818072-a
simpleMeaning: To do with a sign of illness, or going by such a sign, or acting on it.
scope: 'Of treatment or care: easing the signs of illness rather than curing its cause.'
examples:
- The treatment was symptomatic, easing the cough without curing the illness.
- The care was symptomatic, aimed at the fever and the pain rather than the cause.
