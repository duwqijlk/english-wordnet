simpleMeaning: A one-season woody vine from Asia with long clusters of purplish flowers and densely hairy
  pods, grown in the southern United States as green manure and for grazing.
scope: Also called cowage, velvet bean, Bengal bean, Benghal bean, Florida bean, Mucuna aterrima, Mucuna
  deeringiana, and Mucuna pruriens utilis; an Asian vine grown in the southern United States for feed
  and to enrich the soil, while the common bean is a different vine grown for food.
examples:
- Stizolobium deeringiana climbs over fences in the southern United States.
- Farmers grow Stizolobium deeringiana to feed animals and enrich the soil.
