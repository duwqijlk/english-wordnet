simpleMeaning: wet food for animals, especially for pigs, made mostly of bits of food left from the kitchen,
  mixed with water or with skimmed or sour milk
scope: Wet animal food, especially for pigs; not dirty waste water that must be emptied, and not weak,
  watery food or drink for people.
examples:
- The farmer carried a bucket of slop out to the pigs.
- Fresh slop was mixed each morning from kitchen waste and water.
