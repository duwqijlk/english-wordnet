simpleMeaning: a blood vessel that serves two deep parts of the brain, the thalamus and the corpus striatum
scope: A blood vessel for deep parts of the brain, not a vessel that carries blood to the heart and not
  a vessel in the arms or legs.
examples:
- The thalamostriate vein drains blood from the thalamus.
- Doctors traced the clot to the thalamostriate vein.
