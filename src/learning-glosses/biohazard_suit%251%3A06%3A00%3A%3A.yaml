simpleMeaning: A loose one-piece cover worn to keep the wearer safe from harmful agents from living things
  or from chemicals.
scope: This loose one-piece cover is worn to keep the wearer safe from harmful agents from living things
  or from chemicals, not a tight two-piece outfit.
examples:
- She put on a biohazard suit before she entered the lab.
- The biohazard suit kept him safe from the chemicals.
