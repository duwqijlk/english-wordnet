simpleMeaning: A person of one of two peoples of the Shoshonean group, kin to the Aztecs, who live in
  the south-west of the United States
scope: A person of the northern or southern Paiute peoples, kin to the Aztecs and living in the south-west
  of the United States; Paiute is another name for this sense.
examples:
- A Piute elder told stories of the old trails.
- The Piute families lived in the dry lands of the south-west.
