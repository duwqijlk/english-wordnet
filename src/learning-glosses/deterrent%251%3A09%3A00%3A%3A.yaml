simpleMeaning: something you cannot see or touch that gets in the way of an action or makes progress slower
scope: Also called check, balk, hindrance, impediment, handicap and baulk. This is a thing you cannot
  see or touch that slows action or progress, not the describing-word sense about tending to stop someone
  from doing something.
examples:
- Fear of failure was a deterrent to quick action on the plan.
- Lack of money was the main deterrent to progress on the project.
