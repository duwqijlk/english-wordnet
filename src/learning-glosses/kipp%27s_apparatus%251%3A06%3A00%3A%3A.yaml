simpleMeaning: A piece of lab equipment that makes a gas, usually hydrogen sulfide, when a liquid acts
  on a solid, with no heating.
scope: A piece of lab equipment that makes gas when a liquid acts on a solid, with no heating; its near
  kin are other lab tools for making gases, such as gas generators.
examples:
- The Kipp's apparatus made hydrogen sulfide without heating.
- In the Kipp's apparatus, a liquid acted on a solid and gas came off with no heat.
