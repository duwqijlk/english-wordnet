senseId: 'googolplex%1:23:00::'
synsetId: 13619799-n
simpleMeaning: 'A huge number: 1 followed by a googol of zeros, that is, ten raised to the power of a
  googol, where a googol is 1 followed by 100 zeros.'
scope: A number written as 1 followed by a googol of zeros, not a googol itself and not infinity.
examples:
- A googolplex is far too large to write out in full.
- No computer could ever count up to a googolplex.
