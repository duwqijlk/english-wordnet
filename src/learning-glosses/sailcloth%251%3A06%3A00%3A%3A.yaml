simpleMeaning: Cloth that is made to be strong so it can be used for sails and tents; one kind is cotton
  canvas
scope: This is the strong cloth itself, used to make sails and tents. It is not a finished sail on a boat,
  and not light cloth used for clothes.
examples:
- The old sailcloth was tough enough to repair the tent.
- They cut the sailcloth into pieces to make new sails.
