simpleMeaning: a blood tube that carries blood away from the roof of the mouth and joins the blood tube
  of the face
scope: A blood tube that carries blood away from the roof of the mouth and joins the blood tube of the
  face; vena palatina is another name for this sense, and it is not a blood tube that brings blood to
  the mouth or a blood tube of the neck.
examples:
- The palatine vein drains blood from the palate.
- Blood leaves the roof of the mouth through the palatine vein.
