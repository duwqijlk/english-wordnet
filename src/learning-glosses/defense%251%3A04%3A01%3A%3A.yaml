simpleMeaning: the action of shielding a person or thing from an attack or injury
scope: The performed act of shielding someone or something from attack or injury; not an organized body
  of resisters (defense%1:14:03::), not protection from harm as a broad state or condition (defense%1:04:03::),
  not military action or resources (defense%1:04:00::), not the sports team (defense%1:14:01::), not a
  justification or spoken reply (defense%1:10:00::, defense%1:10:01::), not the defendant's side or plea
  (defense%1:14:00::, defense%1:04:02::), not a barrier or built structure (defense%1:06:00::), and not
  an unconscious mental process that eases anxiety about instinctive desires (defense%1:22:00::).
examples:
- The soldiers' defense of the bridge lasted three hours.
- He raised his arms in defense as the ball flew at his face.
