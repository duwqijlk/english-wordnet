simpleMeaning: Blood from Rh-positive people carries a mark; when it goes into an Rh-negative person,
  it can break down red cells and leave too few.
scope: A mark in the blood that Rh-positive people carry, which can break down red cells if their blood
  goes to an Rh-negative person.
examples:
- The nurse checked his blood for the rhesus factor before the transfusion.
- Doctors test for the rhesus factor so that Rh-negative patients do not get the wrong blood.
