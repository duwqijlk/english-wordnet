simpleMeaning: the sound made by gas or liquid rushing past all at once
scope: The sound of gas or liquid rushing past all at once; whoosh is another name for this sense, and
  it is not a soft whisper or a slow flow.
examples:
- We heard the swoosh of water in the pipes.
- The swoosh of air filled the room as the door opened.
