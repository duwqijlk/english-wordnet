simpleMeaning: In Christian teaching, God's kind help given to people as a gift, not because they have
  earned it
scope: God's kind help as a gift; grace is another name for this sense, not a reward earned by good deeds
  and not ordinary human kindness.
examples:
- They thanked God for his free grace after the harvest.
- By free grace alone, she said, are we saved.
