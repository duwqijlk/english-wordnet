simpleMeaning: making a charged particle, an atom, or a group of atoms unable to take part in chemical
  changes by locking it inside a firm ring-shaped compound
scope: The act of locking a charged bit into a firm ring-shaped compound so it cannot react.
examples:
- Sequestration holds the ion fast so it cannot react.
- By sequestration, the ion stayed locked away and took no part in the change.
