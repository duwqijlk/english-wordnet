simpleMeaning: A device made of a flat or bent piece, such as a metal plate, whose surface pushes against
  the water it moves through.
scope: A device made of a flat or bent piece whose surface pushes against the water it moves through,
  not a speedboat fitted with such pieces; foil is another name for this sense.
examples:
- The fins of a fish act as hydrofoils.
- Engineers fitted hydrofoils to the boat's hull.
