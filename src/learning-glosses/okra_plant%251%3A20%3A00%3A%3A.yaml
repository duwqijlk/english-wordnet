simpleMeaning: An Old World tropical plant, tall, coarse, living one season, widely raised in the southern
  US and West Indies for long green sticky pods, soup-and-stew bases; sometimes placed in Hibiscus.
scope: The whole plant, also called okra, gumbo and lady's-finger; not the pods sold as a vegetable, nor
  the soup called gumbo.
examples:
- The okra plants in the garden had long green pods.
- An okra plant stood at the end of the row.
