simpleMeaning: A store that sells pipes and the leaf smoked in them, cigars, and cigarettes
scope: A store selling pipes, cigars, and cigarettes; tobacconist and tobacconist shop are other names
  for this sense, and not a store selling only newspapers or a bar.
examples:
- He bought cigars at the tobacco shop.
- The tobacco shop sells pipes and cigarettes.
