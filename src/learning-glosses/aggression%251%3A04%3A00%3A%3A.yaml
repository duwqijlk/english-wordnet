simpleMeaning: a fierce, hostile act of force, usually done when nothing has been done to cause it
scope: A fierce hostile act, also called hostility; not a mere readiness to fight, which is a lasting
  temper.
examples:
- The sudden aggression of the crowd shocked the guards.
- His aggression toward strangers had no clear cause.
