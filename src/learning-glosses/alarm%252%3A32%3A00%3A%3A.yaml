simpleMeaning: to warn someone of danger or make them ready to act because of danger
scope: 'Also called alert: to warn someone and make them ready, not to make someone feel afraid and not
  a warning sound or clock.'
examples:
- She alarmed her neighbours about the flood and told them to get ready.
- The officer alarmed the soldiers and told them to prepare for danger.
