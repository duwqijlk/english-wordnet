simpleMeaning: A person who feels things far more strongly than a situation calls for.
scope: This means someone is visibly overwhelmed by feeling, not merely having strong feelings, and not
  acting from feeling instead of reason.
examples:
- He became emotional when he saw the old photographs.
- She gets emotional over the smallest setbacks.
