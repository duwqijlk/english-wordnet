simpleMeaning: used in casual speech to strengthen a word, meaning total and without any limit, often
  showing disapproval
scope: This is the strengthening use before a noun, not the sense of having every part or being finished.
examples:
- He made a complete fool of himself at the party.
- Their explanation was complete rubbish, and nobody believed it.
