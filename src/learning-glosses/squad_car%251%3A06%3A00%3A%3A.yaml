simpleMeaning: Fitted with a radio link to their base, this motor vehicle carries police officers as they
  drive round the streets.
scope: Also called a cruiser, a patrol car, a police car, a police cruiser, or a prowl car, this motor
  vehicle carries police officers round the streets with a radio link to their base.
examples:
- The squad car drove round the streets with its radio on.
- Officers in the squad car spoke to headquarters by radio.
