simpleMeaning: To check microphones that measure sound, this tool gives out one set sound of known strength
  inside a closed space.
scope: It is a sound source that checks microphones with a known sound, and not a microphone itself.
examples:
- The pistonphone gave out a sound of known strength to check the microphone.
- They checked the microphone with a pistonphone.
