simpleMeaning: not on guard against danger or being tricked
scope: Not watching out for danger or tricks; the opposite of wary, and not the same as fearless, which
  means feeling no fear.
examples:
- Unwary travelers were easy targets for thieves in the busy market.
- The unwary mouse walked straight into the trap.
