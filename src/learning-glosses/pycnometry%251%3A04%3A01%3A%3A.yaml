simpleMeaning: Weighing a liquid in a container whose size is known gives how heavy that liquid is for
  its size.
scope: A container of known size is weighed full of the liquid, and that weight gives the liquid's density.
examples:
- Finding the density of fine powders by pycnometry can go wrong, above all when the bits are full of
  tiny holes.
- The lab used pycnometry to find how dense the new liquid was.
