simpleMeaning: a long piece of equipment used in gymnastics, with no handles on top and one end longer,
  that a person jumps over along its length
scope: A piece of gymnastics equipment that a person jumps over along its length, not a male deer or other
  male animal and not a jump made by a horse.
examples:
- She ran up and jumped clean over the buck in her gym class.
- The coach placed the buck at the end of the hall for jumping practice.
