simpleMeaning: A plant with tiny white flowers hanging in loose clusters on leafy stems, in moist woods
  from Alaska to central California and east to Montana.
scope: Also called false miterwort and false mitrewort; a plant of moist woods with tiny white flowers
  in loose clusters, while the true miterwort is a different plant.
examples:
- Tiarella unifoliata hangs its tiny white flowers in loose clusters.
- We found Tiarella unifoliata in the moist woods of Alaska.
