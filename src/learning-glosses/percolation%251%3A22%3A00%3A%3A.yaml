simpleMeaning: The slow passing of a fluid through a filtering medium.
scope: The slow passing of a fluid through a filtering medium; also called infiltration; not the straining
  of a fluid to draw out or clean it, nor the act of making coffee in a percolator.
examples:
- Their percolation ran at dawn.
- The percolation was done at noon.
