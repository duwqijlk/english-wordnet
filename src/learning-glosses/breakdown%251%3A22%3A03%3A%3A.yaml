simpleMeaning: In chemistry, the splitting of one thing into two or more things that can differ from each
  other and from the first thing
scope: A chemical split of one thing into two or more new things, not decay by germs, not a list of parts,
  and not a collapse of health.
examples:
- The breakdown of water by an electric current gives hydrogen and oxygen.
- Heat caused the breakdown of the compound into simpler parts.
