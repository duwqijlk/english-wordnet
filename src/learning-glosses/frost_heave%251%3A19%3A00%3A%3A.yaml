simpleMeaning: The lifting of ground or pavement when wet soil below it freezes and swells
scope: The lifting of ground by freezing wet soil; frost heaving is another name for this sense, not a
  crack from drying and not ground sinking.
examples:
- Frost heave lifted the pavement in winter.
- The road was uneven after frost heave.
