simpleMeaning: the tail end of a fish or another water animal with a backbone
scope: The tail of a fish or another water animal with a backbone, not the tail of a land animal and not
  a fin on the side of a fish.
examples:
- The caudal fin of the trout beat hard as it swam up the stream.
- A shark steers with its caudal fin.
