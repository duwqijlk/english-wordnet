simpleMeaning: found inside or as part of a particular thing.
scope: This is not about being current, nor about having being in general; it says something is found
  inside a specified thing.
examples:
- The bacteria existing in the hot spring are studied by scientists.
- The fungus existing in the soil helps the roots grow.
