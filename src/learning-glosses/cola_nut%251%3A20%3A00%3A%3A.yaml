simpleMeaning: a bitter brown seed with caffein in it, from which a drink flavouring is made
scope: A bitter brown seed with caffein; kola nut is another name for this sense; not a sweet seed, and
  not the drink made from it.
examples:
- The cola nut is chewed for its bitter taste.
- They ground cola nut into the drink.
