simpleMeaning: a tiny one-celled animal that swims with a whip-like tail, with no plant traits such as
  making food from light
scope: This is a tiny one-celled animal that swims with a whip-like tail and has no plant traits, also
  called zoomastigote; not a plant and not a one-celled animal that makes food from light.
examples:
- The zooflagellate moved through the water with its whip-like tail.
- Under the microscope, a zooflagellate fed on tiny bits of food.
