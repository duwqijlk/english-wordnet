simpleMeaning: small things for yourself, for clothes, or for sewing, usually used in the plural
scope: Small personal things, clothes, or sewing items, usually in the plural; not an idea that someone
  has or believes.
examples:
- She keeps her notions in a small box near her sewing machine.
- Buttons, thread, and needles are notions you can buy at the shop.
