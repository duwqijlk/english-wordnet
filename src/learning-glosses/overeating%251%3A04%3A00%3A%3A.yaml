simpleMeaning: eating far too much, shown as if it were a person and counted as one of the deadly sins
  (a small set of very bad acts)
scope: Also called gluttony. This is eating far too much as a bad act in itself, not just eating one large
  meal.
examples:
- His overeating at every meal left him ill and unable to move.
- In the old story, overeating appears as a person who never stops taking food.
