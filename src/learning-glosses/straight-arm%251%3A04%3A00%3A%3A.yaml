simpleMeaning: In American football, pushing away a player who tries to stop you with one limb held out
  stiff, with your hand on the other player
scope: In American football, a move that pushes a tackler away, not a tackle and not a pass.
examples:
- The runner used a straight-arm to keep the tackler off him.
- His straight-arm sent the defender to the ground.
