simpleMeaning: a fish found in the sea off the Atlantic coast of North America, in the waters of the lower
  part of that coast
scope: A fish found in the sea water off the Atlantic coast of North America, also called scup and southern
  scup; not a fish of cold northern waters and not a fresh-water fish.
examples:
- The southern porgy swam in the warm shallow water off the coast.
- Fishermen caught a southern porgy in the Atlantic waters off Florida.
