simpleMeaning: A person showed deep respect and yielding in old China by touching the ground with the
  forehead.
scope: A former Chinese custom of touching the ground with the forehead to show respect or yielding; kowtow
  is another name for this sense, not a bow of the head and not a handshake.
examples:
- The kotow was a former Chinese custom shown before the emperor.
- He performed the kotow to show respect to the official.
