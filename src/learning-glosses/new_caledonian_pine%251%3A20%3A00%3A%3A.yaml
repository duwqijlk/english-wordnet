simpleMeaning: A very tall green tree that keeps its leaves all year, from New Caledonia and the New Hebrides,
  like the Norfolk Island tree.
scope: A very tall green tree from New Caledonia and the New Hebrides, like the Norfolk Island tree; not
  a fir and not a cedar.
examples:
- The new caledonian pine towered over the garden.
- A new caledonian pine grows fast in warm wet ground.
