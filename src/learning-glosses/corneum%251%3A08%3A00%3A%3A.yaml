simpleMeaning: The outermost layer of the skin, made of dead cells that fall off.
scope: This is the outermost layer of the skin, made of dead cells that fall off; horny layer is another
  name for this sense, not the live skin below it and not a scab.
examples:
- The corneum is the outermost layer of skin.
- Dead cells fall off the corneum.
