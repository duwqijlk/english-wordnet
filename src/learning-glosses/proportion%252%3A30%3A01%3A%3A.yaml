simpleMeaning: To shape a thing so its parts fit each other in a pleasing way
scope: To shape a thing so its parts fit each other in a pleasing way, not the noun sense of how parts
  fit in a design and not the number you get by dividing a part by the whole.
examples:
- They proportioned the windows to the height of the walls.
- The new hall was well proportioned, with wide doors and high ceilings.
