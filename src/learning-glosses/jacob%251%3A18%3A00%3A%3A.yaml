simpleMeaning: In the Old Testament, Isaac's son and Esau's brother, father of the twelve patriarchs of
  Israel; he wrestled with God, forced God to bless him, and God named him Israel.
scope: Not his brother Esau or his father Isaac; this is the man later called Israel.
examples:
- Jacob wrestled with God through the night.
- Jacob's twelve sons became the patriarchs of Israel.
