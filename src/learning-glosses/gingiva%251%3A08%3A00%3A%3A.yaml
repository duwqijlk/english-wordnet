simpleMeaning: A thin wet skin covers the flesh in the jaws that fits around the foot of every tooth and
  holds it in place.
scope: Also called a gum, this flesh in the jaw fits around the foot of each tooth under a thin wet skin.
examples:
- Food caught between the gingiva and the tooth.
- The gingiva was sore after she brushed too hard.
