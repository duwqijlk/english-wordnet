simpleMeaning: The lore of verse-beat, and the art of verse-making.
scope: This sense is also called metrics, for the lore of verse-beat, and the art of verse-making, where
  metrics is the study of the beat and line patterns of poems, and the craft of making verse, unlike the
  sense for a set way of making verse.
examples:
- Prosody is the lore of verse-beat.
- Prosody teaches verse-making.
