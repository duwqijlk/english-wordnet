simpleMeaning: jokes or playful teasing, often about another person, that are not meant to hurt anyone.
scope: It is not enjoyment or pleasure in general, and it is not an activity that people enjoy.
examples:
- He made fun of my new hat, but he was only joking.
- Their fun at his expense upset him more than they knew.
