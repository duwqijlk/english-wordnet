simpleMeaning: 'A full metric system of measures for scientists: length in meters, mass in kilograms,
  time in seconds, current in amperes, temperature in kelvins, amount in moles, and brightness in candelas.'
scope: Not the older metric measures or a national set of measures; also called SI, the International
  System, the International System of Units, the SI system, the SI unit, and Systeme International.
examples:
- The Systeme International d'Unites is used by scientists everywhere.
- France helped set up the Systeme International d'Unites.
