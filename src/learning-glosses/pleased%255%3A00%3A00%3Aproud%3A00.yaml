simpleMeaning: Feeling proud of something that you see as a sign of your own worth.
scope: Feeling proud about something that reflects on your worth, not the general sense of being happy;
  also called proud of.
examples:
- She was pleased with her daughter's performance.
- He felt pleased with himself after the promotion.
