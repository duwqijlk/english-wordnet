simpleMeaning: the part of engineering that studies how moving surfaces rub each other, as in bearings
  or gears, and how to plan them, cut wear, and oil them
scope: A branch of engineering about rubbing surfaces, not the design of whole machines and not the study
  of metals alone.
examples:
- She studied tribology to learn why the gears in the mill wore out so fast.
- Tribology helped the team choose a better oil for the bearings.
