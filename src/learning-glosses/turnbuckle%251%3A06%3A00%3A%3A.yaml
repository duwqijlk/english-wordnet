simpleMeaning: 'An oblong metal link can be made longer, shorter, or tighter by twisting: a swivel sits
  at one end, and a threaded rod screws into a thread inside the other.'
scope: A metal link that can be made longer or shorter, not a fixed coupling.
examples:
- He twisted the turnbuckle to pull the cable tight.
- The turnbuckle had worked loose and needed tightening.
