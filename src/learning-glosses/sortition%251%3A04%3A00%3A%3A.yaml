simpleMeaning: making a choice by chance, with straws, stones or other small things that are thrown or
  drawn
scope: 'Also called casting lots and drawing lots: a choice made by chance with things thrown or drawn,
  not a vote and not a plan.'
examples:
- The town used sortition to pick who would serve on the jury.
- They settled the tie by sortition, drawing straws from a hat.
