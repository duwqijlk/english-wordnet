simpleMeaning: having a gentle slope, rising or falling at a moderate angle rather than sharply
scope: This describes the angle of a slope, not something simple to do, not financial comfort, and not
  being relaxed.
examples:
- The path climbs at an easy gradient for the first mile.
- The beach has an easy slope into the water, which suits small children.
