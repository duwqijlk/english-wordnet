simpleMeaning: Before the body has a second chemical, it has this one, let go by the small gland above
  the kidney and where nerve ends meet.
scope: Also called noradrenaline, this is the body chemical the body turns into a second one, let go by
  the gland above the kidney and at nerve ends.
examples:
- Nerve ends let go of norepinephrine where they meet.
- The body turns norepinephrine into a second chemical.
