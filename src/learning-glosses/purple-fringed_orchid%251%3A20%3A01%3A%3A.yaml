simpleMeaning: Bunches of sweet-smelling violet blooms with edges cut into fine strips mark this North
  American plant of the orchid kind.
scope: Also called purple-fringed orchis, this North American orchid differs from the kind with larger,
  paler blooms.
examples:
- The purple-fringed orchid had bunches of sweet-smelling violet blooms.
- Sweet-smelling violet blooms grew in bunches on the purple-fringed orchid.
