simpleMeaning: A blood tube that comes off a larger blood tube near the jaw and feeds the bony ridge that
  holds the tooth sockets.
scope: 'Also called arteria alveolaris: a blood tube that feeds the bony ridge holding the tooth sockets,
  not the ridge itself and not a blood tube that carries blood away from the jaw.'
examples:
- The alveolar artery was cut during the operation on the jaw.
- Blood from the alveolar artery feeds the ridge that holds the teeth.
