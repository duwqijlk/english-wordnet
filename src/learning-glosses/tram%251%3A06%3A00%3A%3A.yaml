simpleMeaning: used in a mine, a cart with four wheels that rolls along rails to carry loads
scope: A cart with four wheels that runs on rails inside a mine, not a cable car hanging from wires and
  not an electric streetcar.
examples:
- The tram rolled along the narrow tracks in the coal mine.
- Miners loaded coal onto the tram and pushed it out of the tunnel.
