simpleMeaning: a sheepdog bred in Scotland, with smooth, shiny hair, thick long hair around its neck,
  and a long, narrow head
scope: This is a kind of sheepdog from Scotland with long hair and a narrow head, not any sheepdog and
  not a small pet dog.
examples:
- The collie watched the sheep on the hill all day.
- Her collie has a long, narrow head and thick hair around its neck.
