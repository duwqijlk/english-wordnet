simpleMeaning: The act of making a thing weaker by adding water or a thinning liquid to it.
scope: The act of making a thing weaker by adding water or a thinning liquid to it, not the weakened liquid
  itself.
examples:
- Dilution of the paint made it thin enough to spray.
- Too much dilution left the soup with almost no taste.
