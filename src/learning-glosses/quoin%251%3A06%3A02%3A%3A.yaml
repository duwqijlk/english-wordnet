simpleMeaning: A wedge of metal or wood that can be made wider, used by printers to hold type tight in
  its frame
scope: A wedge printers use to hold type tight; also called coign and coigne, not a wedge for splitting
  wood.
examples:
- The printer tapped the quoin to lock the type.
- He loosened the quoin before lifting the frame.
