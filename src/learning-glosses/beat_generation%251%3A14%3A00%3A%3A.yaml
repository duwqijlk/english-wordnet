simpleMeaning: a 1950s US youth movement that turned from owning things, steady jobs and conventional
  clothes toward shared homes, hallucinogenic drugs and anarchism, and loved modern jazz such as bebop.
scope: Another name for the 1950s US youth subculture also called the beatniks or the beats, not a musical
  pulse or a strike.
examples:
- The beat generation rejected steady jobs and conventional clothing.
- Writers of the beat generation met in shared apartments and listened to bebop.
