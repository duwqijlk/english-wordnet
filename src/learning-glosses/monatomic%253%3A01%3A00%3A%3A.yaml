simpleMeaning: To do with a chemical element whose smallest parts are single atoms
scope: 'Also called monoatomic: to do with a chemical element made of single atoms, not an element made
  of joined atoms and not a mixture of gases.'
examples:
- Helium is a monatomic gas.
- Argon stays monatomic even when it is hot.
