simpleMeaning: To take the bread and wine of the Eucharist, the Christian holy meal.
scope: This is taking the blessed bread and wine in a Christian service, not getting an object and not
  welcoming a person.
examples:
- The congregation received communion at the early Mass.
- She received the host from the priest and returned to her seat.
