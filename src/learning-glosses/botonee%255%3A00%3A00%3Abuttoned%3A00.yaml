simpleMeaning: used to describe a cross on a shield, with a group of three knobs at the end of each arm
scope: 'Also called botonnee: a cross with three knobs at the end of each arm, not a plain cross and not
  a cross with one knob at each end.'
examples:
- The botonee cross on the old shield had three knobs at the end of each arm.
- A botonee cross can be seen in the arms of the family.
