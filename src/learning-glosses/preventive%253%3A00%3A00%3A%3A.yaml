simpleMeaning: likely to stop something from happening or to slow it down
scope: This word means likely to stop or slow something, also called preventative, not a medicine, not
  a thing that blocks the way, and not a thing used to stop a woman having a baby.
examples:
- The city put up preventive fences to slow the flood water.
- Preventive rules made it harder for thieves to enter the building.
