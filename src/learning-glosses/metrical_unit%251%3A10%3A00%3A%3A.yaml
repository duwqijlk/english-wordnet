senseId: 'metrical_unit%1:10:00::'
synsetId: 07109509-n
simpleMeaning: In prosody, a group of 2 or 3 syllables that forms the basic beat of a poem's rhythm.
scope: In prosody, a group of 2 or 3 syllables that forms the basic beat of a poem's rhythm, also called
  a foot or a metrical foot; not a single syllable and not a whole line of verse.
examples:
- The metrical unit in this line has three syllables.
- A metrical unit forms the basic beat of the poem's rhythm.
