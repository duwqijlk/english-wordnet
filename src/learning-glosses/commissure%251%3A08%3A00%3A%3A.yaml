simpleMeaning: a bundle of nerve threads that run from one side of the brain or the cord in the back to
  the other side
scope: A bundle of nerve threads crossing from one side of the brain or back cord to the other, not a
  single nerve and not a part of the skin.
examples:
- The commissure joins the two halves of the brain.
- A cut through the commissure stops signals crossing between the sides.
