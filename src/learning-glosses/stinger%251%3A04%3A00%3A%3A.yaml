simpleMeaning: a sharp blow that causes a sharp pain
scope: A sharp blow that causes a sharp pain; not the sharp body part of a bee or wasp, not a strong drink,
  and not words that hurt a person's feelings.
examples:
- His hard slap was a real stinger.
- The quick punch landed as a stinger on her arm.
