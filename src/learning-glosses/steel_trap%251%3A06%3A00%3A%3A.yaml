simpleMeaning: a snare of hard metal with a strong spring and sharp points like teeth to hold what it
  catches
scope: A snare of hard metal with a spring and sharp points, not a cage that holds an animal alive and
  not a rope snare.
examples:
- The steel trap snapped shut on the fox's leg.
- He set a steel trap near the barn to catch rats.
