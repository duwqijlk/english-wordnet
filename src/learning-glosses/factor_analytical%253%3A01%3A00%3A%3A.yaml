senseId: 'factor_analytical%3:01:00::'
synsetId: 02735917-a
simpleMeaning: Coming from, or having to do with, sorting numbers that rise and fall together to find
  hidden groups.
scope: It describes a result or a method that comes out of the study of scores that change together, where
  hidden groups are brought out, and factor analytic is another name for this sense, while a plain count
  of scores and the act of running that study are different things.
examples:
- The factor analytical approach found three hidden groups.
- They used factor analytical tools on the data.
