simpleMeaning: The quality of being like clay in thickness or in feel.
scope: The quality of being like clay in thickness or in feel, also called clayeyness and clayishness;
  not being made of clay itself and not mere wetness.
examples:
- The clayiness of the wet soil made it stick to her boots.
- He noted the clayiness of the mixture before he shaped it.
