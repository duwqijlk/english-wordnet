simpleMeaning: In astronomy, the time when a body in space, such as a star, goes out of sight just before
  an eclipse
scope: 'Also called ingress: in astronomy, a body in space going out of sight before an eclipse, not being
  put under water for baptism.'
examples:
- Astronomers timed the immersion of the star just before the eclipse.
- The immersion was seen through a telescope just before the eclipse began.
