simpleMeaning: a short ring fixed over a rod or bar to hold a machine part in place, to guide it, or to
  stop it moving too far
scope: A short ring fixed over a rod or bar to hold, guide, or stop a machine part, not the band at the
  neck of a shirt and not the strip round an animal's neck.
examples:
- The worker fitted a collar over the shaft to hold the wheel in place.
- A loose collar on the rod made the machine shake.
