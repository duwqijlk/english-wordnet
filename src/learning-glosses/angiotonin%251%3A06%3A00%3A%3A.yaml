simpleMeaning: Any of several body stuffs, sold as Hypertensin, that make blood tubes narrow
scope: Any of several body stuffs that narrow blood tubes; angiotensin is another name for this sense,
  not a medicine that widens blood tubes and not high blood pressure itself.
examples:
- Angiotonin narrows blood vessels and raises blood pressure.
- The lab tested angiotonin levels in the blood sample.
