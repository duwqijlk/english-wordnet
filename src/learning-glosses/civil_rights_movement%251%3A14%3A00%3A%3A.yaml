simpleMeaning: A drive in the United States, starting in the 1960s and led mostly by Black people, to
  win fair treatment under the law for each Black citizen.
scope: This is a drive in the United States, starting in the 1960s and led mostly by Black people, to
  win fair treatment under the law for each Black citizen, not a drive for the vote alone and not a drive
  led by white lawmakers.
examples:
- The Civil Rights movement changed the law in the 1960s.
- Many joined the Civil Rights movement to demand fair treatment.
