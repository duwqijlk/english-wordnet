simpleMeaning: 'In martial arts, fighters learn this way of standing first: the rear leg bends deep at
  the knee, and the front leg stays straight or bends only a little'
scope: This is a way of standing in martial arts, with the rear leg bent deep and the front leg straight,
  not one in which both legs bend the same way.
examples:
- He stood in a back stance, his rear leg bent deep at the knee.
- In a back stance, her rear knee was bent low while her front leg stayed straight.
