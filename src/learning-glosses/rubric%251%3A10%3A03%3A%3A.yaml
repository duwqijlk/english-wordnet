scope: Rules telling how a Christian church service is to be run, often printed in red in a prayer book,
  not a heading that names a law, not a note that explains a hard word, and not a set rule of conduct.
examples:
- The rubric told the priest when to kneel and when to stand.
- She read the rubric in red before the service began.
