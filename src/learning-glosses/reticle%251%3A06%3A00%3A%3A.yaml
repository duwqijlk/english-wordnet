simpleMeaning: The lens you look through in a tool that shows distant things has a flat face, and this
  set of fine lines, dots, crossed hairs, or wires sits in it.
scope: Also called graticule and reticule, it is a set of fine lines, dots, crossed hairs, or wires in
  the flat face of the lens you look through in a tool that shows distant things, not the lens itself.
examples:
- The reticle in the eyepiece showed a set of fine lines.
- Looking through the reticle, the fine lines sat over the star.
