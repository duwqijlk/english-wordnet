simpleMeaning: Flesh that is a little sweet and soft to eat fills this long pod, along with small seeds;
  farm animals eat it, and it stands in for chocolate.
scope: 'Also called carob, algarroba, carob bean, locust bean, and locust pod: a long pod with sweet,
  soft flesh and small seeds, eaten by farm animals and used in place of chocolate, not the tree itself.'
examples:
- The farmer fed the algarroba bean to his goats.
- She used the algarroba bean in place of chocolate.
