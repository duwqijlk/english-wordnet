simpleMeaning: a natural thing that burns clean, with nothing bad or harmful in it, for use in a tool
  that calms bees with smoke
scope: A clean natural fuel burned to make smoke that calms bees, not a chemical spray and not a food
  for bees.
examples:
- The beekeeper packed smoker fuel into the smoker before opening the hive.
- Dry pine needles make good smoker fuel for calming bees.
