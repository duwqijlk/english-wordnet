simpleMeaning: a rich cake with dried fruit, nuts, and the outer skin of oranges or lemons, and other
  like things
scope: This is the cake with dried fruit and nuts; it is not dried fruit on its own and not a plain cake.
examples:
- She cut a thick slice of fruitcake for tea.
- We eat fruitcake at Christmas with coffee.
