simpleMeaning: A plant from Europe and Asia with jagged leaves and small white or purple-red flowers shaped
  like two lips.
scope: A plant from Europe and Asia with jagged leaves and small two-lipped white or purple-red flowers;
  not a plant with smooth leaves, and not a plant with large flowers.
examples:
- Henbit spread across the garden with its small purple flowers.
- The henbit in the field had jagged leaves and two-lipped white flowers.
