senseId: 'conversion%1:22:00::'
synsetId: 13474120-n
simpleMeaning: In psychiatry, a way the mind protects itself when strong feelings from inner conflicts
  are pushed away and show as problems in the body that have no physical cause
scope: This sense is the psychiatry sense, where hidden feelings show as body problems; it is not a change
  to a new life after a spiritual awakening and not swapping the subject and predicate in a statement.
examples:
- Her conversion left her unable to walk, though doctors found no physical cause.
- Doctors called her sudden blindness conversion, because her eyes were not damaged.
