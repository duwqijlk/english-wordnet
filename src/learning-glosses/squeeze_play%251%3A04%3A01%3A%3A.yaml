simpleMeaning: a hard push to make someone give in, by gathering power or using it in an unfair way
scope: Also called squeeze and power play; a hard push to make someone give in by gathering power, not
  a baseball play and not a fair talk.
examples:
- The boss used a squeeze play to force the workers to agree.
- She laughed at the squeeze play and walked away.
