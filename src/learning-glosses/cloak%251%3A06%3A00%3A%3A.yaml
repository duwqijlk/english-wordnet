simpleMeaning: a loose piece of clothing worn over other clothes.
scope: This is the loose garment itself, not the verb for covering something with it, and not the figurative
  covering that hides something.
examples:
- He pulled his cloak tight against the cold wind.
- The queen wore a crimson cloak lined with fur.
