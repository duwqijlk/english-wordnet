simpleMeaning: The size across a tube or a gun barrel, from one side to the other.
scope: 'Also called a bore: the size across a tube or a gun barrel, not the distance between railway rails,
  not a measuring tool, not the standard size something is judged by, and not the act of judging or fitting
  to a size.'
examples:
- The gauge of the shotgun was twelve.
- This pipe has a gauge of two inches.
