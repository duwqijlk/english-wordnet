simpleMeaning: the part of a school or college that teaches people to play and sing and to understand
  and enjoy songs and sounds
scope: The part of a school or college for teaching playing, singing, and understanding songs and sounds;
  department of music is another name for this sense, not a concert hall and not a shop that sells instruments.
examples:
- She works in the music department at the college.
- The music department offers evening classes.
