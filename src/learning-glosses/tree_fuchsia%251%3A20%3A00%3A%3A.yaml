simpleMeaning: An upright woody plant of New Zealand that loses its leaves and grows to 10 feet, with
  dark red flowers
scope: An upright New Zealand woody plant that loses its leaves and bears dark red flowers, also called
  konini and native fuchsia; not a low bush with pink flowers and not a garden fuchsia from elsewhere.
examples:
- The tree fuchsia in the garden reached 10 feet tall.
- In spring the tree fuchsia puts out dark red flowers.
