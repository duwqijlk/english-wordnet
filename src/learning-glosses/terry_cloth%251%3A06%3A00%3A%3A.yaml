simpleMeaning: Bath towels and bath robes are made from a fabric, usually cotton, with uncut loops on
  both sides.
scope: 'Also called terry and terrycloth: a fabric, usually cotton, with small uncut loops on both sides,
  used to make bath towels and bath robes.'
examples:
- She dried off with a terry cloth towel.
- The bathrobe was made of terry cloth.
