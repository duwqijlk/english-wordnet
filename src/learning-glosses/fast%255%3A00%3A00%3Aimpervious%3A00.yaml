simpleMeaning: Able to resist being destroyed, or unlikely to fade or lose color.
scope: This describes colors and materials that hold up; it is not about speed, loyalty, or morality.
examples:
- The weavers used a fast dye so the cloth would keep its deep red for years.
- These inks are colour-fast and will not fade even after decades on the wall.
