simpleMeaning: Without any wit or imagination, saying nothing in a fresh or lively way.
scope: Lacking wit or imagination, also called pedestrian, earthbound, or prosy; not the sense of merely
  dull and unexciting.
examples:
- The prosaic plot bored the whole class.
- His prosaic account left out every colourful detail.
