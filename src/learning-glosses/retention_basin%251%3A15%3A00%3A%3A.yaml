simpleMeaning: Water held in a place much like one that holds it only for a time is kept there for good,
  blocked from flowing on down the stream
scope: It is a place that stores water like a detention basin, not a pond that drains away and not a place
  that lets water flow on.
examples:
- The retention basin keeps its water from flowing downstream.
- Unlike a detention basin, the retention basin holds water for good.
