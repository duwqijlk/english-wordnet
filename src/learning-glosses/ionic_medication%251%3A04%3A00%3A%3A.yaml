simpleMeaning: 'A way of treating a sick part of the body: a small electric push in one place moves the
  bits of a drug into the flesh'
scope: A way of treating a sick part of the body with a small electric push in one place; also called
  electromotive drug administration, iontophoresis or iontotherapy; not a drug taken by mouth and not
  a treatment with no electric push.
examples:
- The doctor used ionic medication to get the drug through the skin.
- Ionic medication helped the drug reach the sore joint.
