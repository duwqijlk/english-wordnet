simpleMeaning: a change in who controls a company, that happens when it is sold or when it joins with
  another company
scope: This is a change in who controls a company, by a sale or by joining with another company, not a
  sudden change of government by force or against the law.
examples:
- The takeover of the small phone company by a larger firm was completed in June.
- Shareholders voted to accept the takeover offer from the bigger company.
