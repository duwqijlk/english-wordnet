simpleMeaning: based on beliefs, customs, or ways of doing things passed down from earlier generations.
scope: This sense concerns customs and ways of doing things handed down over time, not strict religious
  doctrine.
examples:
- They served a traditional meal of rice and fish at the festival.
- Her traditional approach to cooking came from her grandmother.
