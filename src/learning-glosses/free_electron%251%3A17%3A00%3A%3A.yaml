simpleMeaning: A tiny bit of matter with a negative charge that is not fixed to an atom, ion, or molecule
  and can move when an electric force acts on it
scope: A loose charged bit of matter, not an electron held inside an atom and not an ion.
examples:
- A free electron drifts through the metal when a voltage is applied.
- Free electrons carry the current in this wire.
