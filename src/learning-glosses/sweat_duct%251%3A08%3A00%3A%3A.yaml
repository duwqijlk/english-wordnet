simpleMeaning: a small tube that carries the salty liquid made by the skin's glands out to the skin's
  surface
scope: This is the small tube that carries the salty liquid from a skin gland to the skin's surface, not
  the gland itself and not the liquid itself.
examples:
- The sweat duct carried the moisture to her skin.
- A blocked sweat duct can cause a small bump on the skin.
