simpleMeaning: A fresh start in the spirit, coming from eager, forceful preaching of the good news, is
  the state of having taken up a new faith
scope: This is a fresh start in the spirit, the state of having taken up a new faith after eager, forceful
  preaching of the good news.
examples:
- His proselytism came from eager preaching of the good news.
- Her proselytism was a fresh start in the spirit, a new faith taken up.
