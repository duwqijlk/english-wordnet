simpleMeaning: A cloth that catches the wind, set just above the lowest cloth on a mast, held up by the
  mast above it, sometimes one of a pair
scope: A wind cloth set just above the lowest cloth on a mast, not the lowest cloth itself and not the
  cloth at the very top.
examples:
- The crew raised the topsail.
- The topsail filled with wind above the main sail.
