simpleMeaning: A big part of the brain's outer layer, on the left side in most people, holds all the parts
  that deal with words and speech
scope: A big part of the brain that holds the parts for words and speech, also called language zone; not
  the whole brain and not a part for sight or movement.
examples:
- Damage to the language area can make speech hard.
- The language area lies on the left side of the brain in most people.
