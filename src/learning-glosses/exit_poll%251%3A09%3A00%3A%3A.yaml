senseId: 'exit_poll%1:09:00::'
synsetId: 05809294-n
simpleMeaning: A count of votes asked of people as they come out of the place where they vote, most often
  done by news groups to guess who will win.
scope: A count of votes asked of people as they leave the voting place, not a count before the vote and
  not the vote itself; no other name is listed for this sense.
examples:
- The exit poll showed the mayor well ahead as voters left.
- News groups ran an exit poll outside the voting place.
