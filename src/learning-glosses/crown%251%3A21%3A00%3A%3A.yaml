simpleMeaning: an English coin worth five shillings, where a shilling is an old unit of English money
scope: This is a piece of money, an English coin. It is not something worn on the head, and not a part
  of a tooth.
examples:
- He paid for the book with a crown.
- He found a crown among the old coins in the box.
