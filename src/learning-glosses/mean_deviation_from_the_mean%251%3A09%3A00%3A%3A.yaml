senseId: 'mean_deviation_from_the_mean%1:09:00::'
synsetId: 06032825-n
simpleMeaning: The gaps between each number and the average of the set are counted without sign, then
  averaged
scope: Another name for mean deviation, this is the gaps between numbers and their average counted without
  sign and then averaged, not the average itself and not the spread found by squaring the gaps.
examples:
- The mean deviation from the mean came to three points.
- For each set of numbers we worked out the mean deviation from the mean.
