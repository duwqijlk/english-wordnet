scope: A nonstandard form of American English spoken as a rule by African Americans, also called African
  American English, African American Vernacular English, Black English, Black English Vernacular, Black
  Vernacular, Black Vernacular English, and Ebonics; not standard American English.
examples:
- AAVE is spoken by many African Americans.
