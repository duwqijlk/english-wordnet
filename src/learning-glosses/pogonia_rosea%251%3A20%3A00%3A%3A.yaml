simpleMeaning: An orchid of middle and north South America with clusters of one to three large showy rose-coloured
  flowers, at times put in the genus that shares its name
scope: Also called rosebud orchid and Cleistes rosea, this is a South American orchid with large showy
  rose-coloured flower clusters, not a small-flowered orchid.
examples:
- The Pogonia rosea bloomed in the shade.
- A Pogonia rosea grew by the stream.
