simpleMeaning: One of the blood tubes that empty into the tube at the corner of the eye or the one in
  the face, draining the outside of the nose
scope: Vena nasalis externa is another name for one of the blood tubes that drain the outside of the nose,
  not the ones that drain the inside of the nose.
examples:
- The external nasal vein drains the outside of the nose.
- Blood from the external nasal vein flows into the facial vein.
