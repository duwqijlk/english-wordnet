simpleMeaning: A luring woman, working men by her sex charms.
scope: This sense is also called tease, flirt, minx, and coquette, for a luring woman, working men by
  her sex charms, where tease is a woman who uses her looks and charm to draw men in and use them for
  her own gain, and flirt is a woman who uses her sexual charm to draw men in and use them for her own
  gain, unlike the sense for a bit of leather shaping the front of a shoe-top, unlike the sense for a
  made-up tune to play along, and unlike the sense for cooking up what is false or untrue.
examples:
- The vamp is a luring woman, working men by her sex charms.
- Vamps work men by their charms.
