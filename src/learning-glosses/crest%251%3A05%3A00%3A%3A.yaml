simpleMeaning: a growth of feathers or skin on the head of a bird or other animal that stands out and
  is easy to notice
scope: A growth of feathers or skin on the head of a bird or other animal; not the sign once used to decorate
  a helmet, and not the top of a hill or a wave.
examples:
- The rooster has a bright red crest on its head.
- A tall blue crest stood up on the bird's head.
