senseId: 'biserial_correlation%1:09:00::'
synsetId: 06043419-n
simpleMeaning: A number that shows how two things change together, where one thing can take many values
  and the other can take only two.
scope: A number showing how two things change together, one with many values and the other with only two;
  biserial correlation coefficient is another name for this sense, not a number for two things that both
  take many values and not a simple count.
examples:
- The biserial correlation links test scores to pass or fail.
- They found a biserial correlation between age and whether a person smoked.
