simpleMeaning: a tree with white bark and leaves that are whitish below, widely grown in the United States
scope: A tree with white bark and leaves that are whitish below, widely grown in the United States, also
  called abele, aspen poplar, white aspen, or white poplar; not a tree with dark bark and not a tree with
  green leaves below.
examples:
- A silver-leaved poplar stood by the farmhouse.
- The silver-leaved poplar had white bark and pale leaves.
