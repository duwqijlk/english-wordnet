simpleMeaning: the quality of being the way things are when no person has made or changed them, or of
  being based on the way such things work
scope: This is about being true to how things are in the real world, not about how close a picture or
  copy looks to the real thing it shows.
examples:
- She liked the naturalness of his way of speaking to children.
- He accepted the naturalness of death as a part of life.
