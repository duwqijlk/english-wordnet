simpleMeaning: To choose not to eat or drink particular things.
scope: This is about not consuming particular foods or drinks, not about keeping away from a person or
  place, and not about refraining from an action in general.
examples:
- During Ramadan, many Muslims avoid food and drink during daylight hours.
- My doctor told me to avoid coffee while I take this medicine.
