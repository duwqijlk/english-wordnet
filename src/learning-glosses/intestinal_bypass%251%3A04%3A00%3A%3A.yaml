simpleMeaning: an operation that makes the small intestine shorter, used to treat people who are very
  fat
scope: An operation that makes the small intestine shorter, used to treat people who are very fat; not
  an operation to remove part of the intestine and not a diet.
examples:
- The surgeon did an intestinal bypass to help her lose weight.
- An intestinal bypass shortens the small intestine.
