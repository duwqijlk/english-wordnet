simpleMeaning: Mild and gentle, with nothing harsh or severe in it.
scope: This is a gentle, mild quality in how someone acts or speaks, not a quiet sound, a yielding surface,
  a lenient attitude to rules, or mild, pleasant weather.
examples:
- He offered a soft rebuke instead of a public scolding.
- Her soft answer cooled the argument within minutes.
