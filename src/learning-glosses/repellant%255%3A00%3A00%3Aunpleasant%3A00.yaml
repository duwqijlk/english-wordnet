simpleMeaning: Serving to drive off, or tending to.
scope: Serving to drive off, or tending to; also called repellent; not highly offensive, stirring disgust,
  nor a chemical that drives animals away, nor a compound put on cloth to keep water off, nor the power
  to drive off.
examples:
- Their manner was repellant and cold.
- The smell was repellant in the hall.
