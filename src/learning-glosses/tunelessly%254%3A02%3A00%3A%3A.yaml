schema: oewn-learning-gloss-v2
senseId: 'tunelessly%4:02:00::'
synsetId: 00509752-r
simpleMeaning: in a way that does not sound like a song
scope: This is about how musical sounds are made, with no song to follow; it does not mean making sounds
  loudly, quietly, or in a good way.
examples:
- He whistled tunelessly while he walked to work.
- She hummed tunelessly under her breath in the kitchen.
