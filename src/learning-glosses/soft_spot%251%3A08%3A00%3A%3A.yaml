simpleMeaning: A thin skin-covered gap between the bones of a baby's head, before birth or soon after
scope: A thin skin-covered gap between the bones of a baby's head, before birth or soon after; also called
  fontanel and fontanelle; not a bruise, and not a hole in the skull of a grown person.
examples:
- The baby's soft spot pulsed gently.
- Do not press on a newborn's soft spot.
