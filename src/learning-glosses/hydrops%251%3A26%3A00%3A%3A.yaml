simpleMeaning: In the cells, the tissues, or the hollow spaces that hold watery liquid, too much of it
  gathers and makes a swelling.
scope: Edema, dropsy and oedema are other names for this swelling.
examples:
- The hydrops made his legs swell.
- Her belly was swollen with hydrops.
