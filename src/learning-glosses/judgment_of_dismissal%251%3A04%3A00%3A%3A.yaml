senseId: 'judgment_of_dismissal%1:04:00::'
synsetId: 01192662-n
simpleMeaning: A court decision that ends a case with no trial.
scope: A court ruling that closes a case before any trial, not a ruling that follows a trial and not a
  ruling on guilt.
examples:
- The judgment of dismissal ended the case before it reached trial.
- She asked the court for a judgment of dismissal.
