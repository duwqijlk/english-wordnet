simpleMeaning: A person whose days are spent drinking far more alcohol than is good for them.
scope: 'Also called a lush, an alcoholic, an alky, a boozer, and a dipsomaniac: a person who always drinks
  too much alcohol, not the verb sense of dipping a thing in liquid and not pickled pork.'
examples:
- The old souse spent his evenings at the bar.
- Neighbours called him a souse because he was never sober.
