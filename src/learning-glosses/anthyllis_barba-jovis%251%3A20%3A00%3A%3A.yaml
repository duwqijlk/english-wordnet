simpleMeaning: A shrub of Europe with silvery hairs, leaves that stay green all year, and pale yellow
  flowers
scope: This is a silvery shrub of Europe with pale yellow flowers, not a shrub with bright red flowers;
  silver-bush, silverbush and Jupiter's beard are other names for this sense.
examples:
- Anthyllis barba-jovis grows in Europe, with silvery leaves and pale yellow flowers.
- The silvery leaves of Anthyllis barba-jovis stay green through winter.
