simpleMeaning: In brain science, a machine that reads brain waves picks up quick ups and downs of electrical
  force between parts of the outer brain
scope: In brain science, quick ups and downs of electrical force between parts of the outer brain, not
  a steady flow of power; brain wave and brainwave are other names for this sense.
examples:
- The cortical potential showed quick ups and downs between parts of the outer brain.
- A machine that reads brain waves picked up the cortical potential.
