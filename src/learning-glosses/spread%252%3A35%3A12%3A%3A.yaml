senseId: 'spread%2:35:12::'
synsetId: 01614805-v
simpleMeaning: to cover a surface by putting something over it
scope: This is covering a surface, as when you spread toast with butter; it is not unfolding something
  folded, scattering loose items over an area, or putting a soft substance onto a surface in a layer,
  as when you spread cheese on bread.
examples:
- She spread the warm toast with butter.
- He spread the board with a thin coat of paint.
