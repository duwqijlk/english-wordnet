simpleMeaning: By force or by threat, a person knowingly makes another person do an unwanted bodily act
  — and the law treats that as a wrong.
scope: Sex offense, sexual abuse and sexual assault are other names for this wrong under the law.
examples:
- The sex crime was done by force and threat.
- The sex crime made another person do an unwanted bodily act.
