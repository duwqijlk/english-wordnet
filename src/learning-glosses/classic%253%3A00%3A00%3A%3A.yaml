simpleMeaning: Belonging to the earliest important age of a civilization, culture, or field of study.
scope: This describes the first great period of a culture or subject; it does not mean excellent, typical,
  or a famous old work.
examples:
- The course covers classic Greek drama from the fifth century BC.
- Scholars date the temple to the classic period.
