simpleMeaning: the part at the back of the brain that takes in sight signals sent through nerve threads
  from a relay deep in the brain, where seeing first happens
scope: 'Also called first visual area and striate cortex: the part of the brain where seeing starts, not
  the part that moves the eyes and not the part that hears sound.'
examples:
- The striate area lights up when we look at a picture.
- Damage to the striate area can take away sight.
