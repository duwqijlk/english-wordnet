simpleMeaning: A small gland in the brain that sends melatonin, a sleep-setting chemical, into the blood,
  under the back of the band joining the two halves of the brain.
scope: It is also called epiphysis, epiphysis cerebri and pineal gland.
examples:
- The pineal body lies deep in the brain.
- Melatonin comes from the pineal body.
