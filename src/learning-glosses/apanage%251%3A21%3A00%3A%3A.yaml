simpleMeaning: A gift of things of value given by a ruler or law-making body to keep a member of a ruling
  family who needs support.
scope: A gift from a ruler or law-making body to keep a member of a ruling family who needs support; appanage
  is another name for it, and it is not a wage for work and not a gift to a stranger.
examples:
- The prince lived on the apanage granted by the king.
- Younger sons of the family received an apanage to live on.
