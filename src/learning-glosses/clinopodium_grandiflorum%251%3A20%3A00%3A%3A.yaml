simpleMeaning: A sweet-smelling herb with large pink flowers, from south and south-east Europe, Anatolia
  and north Iran.
scope: Also called large-flowered calamint, Calamintha grandiflora and Satureja grandiflora, this is a
  sweet-smelling herb of south Europe, not a mint grown for its leaves.
examples:
- The Clinopodium grandiflorum fills the garden with scent.
- Clinopodium grandiflorum bears large pink flowers.
