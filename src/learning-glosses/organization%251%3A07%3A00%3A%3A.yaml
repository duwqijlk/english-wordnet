synsetId: 04775896-n
simpleMeaning: A neat and careful way of doing things, with everything kept in good order.
scope: The quality of being neat and methodical in how things are done only; not the act of placing people
  or things, a group of people who work together, a classifying structure, an administrative body, the
  act of arranging how a business or its activities are run, or the act of founding something.
examples:
- His compulsive organization was not an endearing quality.
- The kitchen showed the kind of organization that comes from years of practice.
