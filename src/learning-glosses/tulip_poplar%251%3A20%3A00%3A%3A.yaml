simpleMeaning: A tall North American tree that sheds its leaves, with big greenish-yellow cup-shaped flowers
  and cone-like fruit; its soft white wood is mainly used for making cabinets.
scope: This is the living tree, another name for the tulip tree, not the light wood taken from it.
examples:
- A tulip poplar can reach a height of thirty meters or more.
- The tulip poplars along the drive were full of greenish-yellow blooms.
