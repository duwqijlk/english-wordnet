simpleMeaning: In medicine, a pad and belt that a person wears to press on and hold a hernia (a body part
  that pushes out of place) in its place
scope: This is the medical pad and belt worn for a hernia, not the frame that holds up a roof or bridge,
  and not the small bracket of brick or stone in a building.
examples:
- The doctor fitted him with a truss to hold his hernia in place.
- He wore a truss under his clothes every day.
