simpleMeaning: happening again and again, coming back many times
scope: About something that keeps coming back at different times, not about something that happens only
  once or that goes on without a break.
examples:
- He has recurrent headaches that come back every few weeks.
- Recurrent flooding is a problem in this town each winter.
