simpleMeaning: a low African bush with stems that lie along the ground and thin yellow flowers that smell
  of honey, growing alone or in pairs
scope: 'Also called honeybells: a low African bush, not a flower that grows in a bunch and not a tree.'
examples:
- A honey bell grew along the edge of the dry field, its stems flat on the ground.
- The honey bell opened thin yellow flowers that smelled of honey.
