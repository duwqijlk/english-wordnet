simpleMeaning: a word acted out in one round of a game where players act without speaking and others guess
scope: The word acted out in one round of the acting and guessing game, not the whole game itself and
  not a false show.
examples:
- Her charade was the word 'bicycle', and she acted out riding one.
- The next charade was the word 'elephant', and she acted out a long trunk with her arm.
