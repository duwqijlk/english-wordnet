simpleMeaning: Its seeds give an oil that clears the bowels, from a poison plant of the Old World now
  growing wild in America.
scope: Also called caper spurge and myrtle spurge, this poison plant of the Old World now growing wild
  in America gives an oil from its seeds that clears the bowels.
examples:
- They pulled out the mole plant because it is poison.
- The mole plant gives an oil from its seeds that clears the bowels.
