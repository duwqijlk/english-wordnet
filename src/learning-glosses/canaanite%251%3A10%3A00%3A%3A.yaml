simpleMeaning: The dead language of the Semitic people who lived in Canaan before the Israelites took
  it.
scope: This is the dead language of the Semitic people who lived in Canaan before the Israelite conquest;
  Canaanite language is another name for it, not the people themselves who spoke it.
examples:
- Canaanite was spoken in the land long before the Israelites came.
- Scholars read old Canaanite writings on stone.
