simpleMeaning: Of a body in the sky, always in view above the line where the sky meets the earth, through
  the whole of its daily path round the sky.
scope: A body in the sky that stays in view all through its daily path, not one that rises and sets below
  the line where sky meets earth and not one that can be seen only in some seasons.
examples:
- The circumpolar star never sank below the horizon.
- At that far northern place the star stayed circumpolar all night.
