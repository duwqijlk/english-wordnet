simpleMeaning: Of monkeys from the Americas, it says their nose holes lie far apart; it can also be said
  of people with wide noses
scope: Also called broadnosed, platyrhine, platyrhinian, platyrrhine and platyrrhinian, this word is about
  such monkeys or people, not the monkeys themselves.
examples:
- Platyrrhinic monkeys are found in the forests of Central America.
- The platyrrhinic boy had a wide nose.
