senseId: 'conjecture%1:09:00::'
synsetId: 05900390-n
simpleMeaning: an idea about what may be true, made by guessing, usually with little hard proof
scope: 'Also called speculation: a guessed idea with little proof, not the act of forming ideas from facts
  that are not full, and not to think something is true.'
examples:
- His talk of a hidden plan was pure conjecture, with no proof to back it.
- She put the idea forward as a conjecture, not as a known fact.
