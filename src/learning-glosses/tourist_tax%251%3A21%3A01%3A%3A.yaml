simpleMeaning: Guests who stay in holiday lodgings for more than a day for a holiday, rest, or training
  pay a charge set by some towns or regions.
scope: Also called visitor's tax, this is a charge on guests staying in holiday lodgings for more than
  a day.
examples:
- The hotel added the tourist tax to our bill for the week.
- Visitors pay a tourist tax when they stay more than a day.
