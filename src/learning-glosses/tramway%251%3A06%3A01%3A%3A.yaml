simpleMeaning: Tall posts hold up wires from which cars hang, moving people or goods from place to place.
scope: Also called a tram, an aerial tramway, a cable tramway and a ropeway, this is a way of moving people
  or goods in cars hung from wires, not a railway that runs on the ground.
examples:
- We crossed the valley by tramway.
- The tramway was closed for repairs.
