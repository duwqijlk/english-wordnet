simpleMeaning: a bird of New Zealand that cannot fly, is out at night, and has a long neck and thick legs;
  the only kind left of its whole group
scope: 'Also called kiwi: a flightless night bird of New Zealand, not any other flightless bird.'
examples:
- The apteryx walked through the dark forest on its thick legs.
- An apteryx came out after dark to feed.
