simpleMeaning: having more than one side or quality, with those sides or qualities very different from
  each other
scope: Also called double, dual, treble and threefold. This means having more than one very different
  side or quality, not just more than one part.
examples:
- 'His role in the play was twofold: he was both the kind father and the cruel king.'
- Her influence was twofold, speaking to crowds in public and changing minds in private talks.
