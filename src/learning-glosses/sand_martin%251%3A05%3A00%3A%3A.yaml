simpleMeaning: A tunnel in a bank of clay or loose earth is where this swallow of the northern half of
  the world nests.
scope: Bank martin and bank swallow are other names for this swallow of the northern half of the world,
  which nests in tunnels in a bank of clay or loose earth.
examples:
- A sand martin flew in and out of the holes in the bank.
- The sand martin nested in a tunnel in the clay bank.
