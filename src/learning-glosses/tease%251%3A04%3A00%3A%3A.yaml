simpleMeaning: The act of bothering a person in fun or in a mean way, most of all by making fun of them,
  and keeping at it again and again.
scope: This is the act of bothering a person in fun or in a mean way, not the person who does it or combing
  hair to make it full.
examples:
- He ignored their teases.
- The tease hurt her feelings, even though it was meant as fun.
