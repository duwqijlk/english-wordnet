simpleMeaning: any of several shrubs and small woody plants of one group, Illicium, that keep their leaves
  all year
scope: One of a group of shrubs and small woody plants that keep their leaves all year, not a plant that
  loses its leaves in winter and not the herb anise used for flavour.
examples:
- The anise tree in the garden keeps its leaves all winter.
- We planted an anise tree beside the wall.
