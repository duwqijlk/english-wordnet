simpleMeaning: A sudden spell of schizophrenia that lasts only a few weeks or months.
scope: A sudden short spell of schizophrenia, not a long-lasting form of the same illness and not a brief
  low mood.
examples:
- He was taken to hospital during an acute schizophrenic episode.
- An acute schizophrenic episode can pass within a few weeks.
