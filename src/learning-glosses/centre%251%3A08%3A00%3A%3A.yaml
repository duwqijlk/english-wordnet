simpleMeaning: A small group of nerve cells in the body that controls one particular physical function.
scope: This is a group of nerve cells that runs one bodily function, not a set of people with middle-of-the-road
  political opinions, not the American football role that opens a play, not the key part of an idea or
  experience, and not the football player who fills that role. It is also not the adjective sense of holding
  neither left-wing nor right-wing views, an area near the middle of a region, the exact middle point
  of a line or shape, a place where an activity is concentrated, the soft filling inside a chocolate,
  the thing that attention is fixed on, a building for a particular activity, the basketball or hockey
  role, the middle of a military formation, a basketball or hockey player, the outfield ground ahead of
  the catcher, a shopping complex, the adjective meaning equally far from both ends, or any verb sense
  such as moving to the middle, focusing attention, or having something as the main subject.
examples:
- Damage to the breathing centre can make a person stop breathing during sleep.
- Doctors found the language centre on the left side of her brain.
