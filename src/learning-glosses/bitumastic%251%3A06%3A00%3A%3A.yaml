simpleMeaning: Spread over metals used in buildings and left out in the weather, this coat of asphalt
  and filter keeps them safe.
scope: This is a coat of asphalt and filter for metals used in buildings and left out in the weather,
  set apart from paint and other coats by what it is made of.
examples:
- Bitumastic kept the metal safe from the weather.
- Bitumastic was spread over the metal left out in the weather.
