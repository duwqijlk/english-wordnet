simpleMeaning: A person who is clever, or who will do dishonest things, and who knows a way around problems
scope: A clever person who is not fully honest and gets around problems, not a person who runs a machine
  and not the mathematics sense.
examples:
- He is a clever operator who can talk his way out of any problem.
- The operator knew every way to get past the office rules.
