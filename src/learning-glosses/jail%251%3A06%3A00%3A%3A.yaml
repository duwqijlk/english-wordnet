simpleMeaning: A building run by the government where people accused of a crime are locked up while they
  wait for their trial, or while they serve their sentence.
scope: The usual name for this place, with gaol as the British spelling and the slang words in this group
  as other names; not the verb meaning to lock someone up.
examples:
- She was released from jail after the charges were dropped.
- The county jail holds people awaiting trial.
