senseId: 'spiral%1:25:01::'
synsetId: 13899200-n
simpleMeaning: In maths, a line that winds round the outside of a tube or a pointed shape, always crossing
  it at the same slant
scope: In maths, a line winding round a tube or cone at one slant, not a flat winding line and not a thing
  wound into loops.
examples:
- The spiral on the screw winds round its side at one slant.
- A spiral drawn on the side of a cone keeps the same slant all the way round.
