simpleMeaning: bad or dishonest handling of another person's affairs by people who are expected to act
  for that person
scope: Bad or dishonest handling of work by people trusted to act for someone else. It is not the verb
  sense, to manage something badly, and it is not bad behaviour in general.
examples:
- The lawyer was punished for misconduct after he used a client's money for himself.
- The report found misconduct by the men trusted to run the fund for its owners.
