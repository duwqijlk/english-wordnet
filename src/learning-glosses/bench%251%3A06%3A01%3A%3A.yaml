simpleMeaning: a strong table for work, used by a person who works with wood or fixes machines
scope: A strong table for doing work with wood or machines; not a seat in a park, not the judges in a
  court, and not flat land on a slope.
examples:
- The mechanic kept her tools on the bench in the workshop.
- He laid the wood on the bench and began to cut it.
