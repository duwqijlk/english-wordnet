simpleMeaning: A slimming eating plan that is popular for only a short time.
scope: A slimming eating plan that is popular for only a short time, not a lasting healthy eating plan
  and not a doctor's eating plan.
examples:
- She tried a fad diet that cut out all bread.
- The fad diet was popular for a few months, then faded.
