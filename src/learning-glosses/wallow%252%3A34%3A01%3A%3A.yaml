simpleMeaning: To give yourself over wholly to something, and enjoy it to too great a degree, usually
  with pleasure
scope: To give yourself over wholly to something; not to roll about idly and not a pool where animals
  roll about.
examples:
- He liked to wallow in luxury on his days off.
- Do not wallow in your sorrows all day.
