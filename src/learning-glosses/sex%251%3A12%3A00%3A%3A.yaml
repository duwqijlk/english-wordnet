simpleMeaning: all the feelings that come from a strong need in the body, and the wish to meet that need
  in the way linked to making new life
scope: About strong feelings and the wish for body pleasure; not the things that show if a living thing
  is male or female, and not the male or female group itself.
examples:
- He felt sex as a strong need that stayed with him all day.
- For her, sex was a strong body need she felt again and again.
