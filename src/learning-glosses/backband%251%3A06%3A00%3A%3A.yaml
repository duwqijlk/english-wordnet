simpleMeaning: a wide strap that goes over a horse's back and holds up the poles of a cart or other horse-drawn
  vehicle
scope: A wide strap over a horse's back that holds up the poles of a cart or other horse-drawn vehicle,
  not a saddle and not a strap that goes round the horse's body.
examples:
- The backband rested across the horse's back and held the shafts steady.
- He tightened the backband before hitching the horse to the cart.
