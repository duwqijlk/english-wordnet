simpleMeaning: A light microscope with one lens that bulges out, used to make small things look bigger
scope: A light microscope with one lens that bulges out, used to make small things look bigger, not a
  pair of spectacles and not a big bench microscope; hand glass is another name for this sense.
examples:
- He used a magnifying glass to read the small print.
- The magnifying glass made the tiny insect look huge.
