simpleMeaning: a link between living things where one of them is harmed, or a living thing is harmed by
  a substance made by another
scope: A harmful link between living things, or between a living thing and a substance made by another;
  not a helpful link, and not a fight over food.
examples:
- The antibiosis between the two kinds of mold left one of them unable to grow.
- Antibiosis can slow a germ when it meets a substance made by another germ.
