simpleMeaning: Between the jelly in the middle of the eye and the back of the eye stands this clear thin
  skin.
scope: Also called a hyaloid, this clear thin skin stands between the jelly and the back of the eye, and
  it is not the jelly itself.
examples:
- Every eye has a hyaloid membrane round the jelly inside it.
- The hyaloid membrane holds the jelly away from the back of the eye.
