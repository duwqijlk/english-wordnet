simpleMeaning: a soft sea creature with a shell that digs into sand or mud, whose shell shuts tight like
  a grip
scope: A sea creature that digs into sand or mud, not its flesh as food and not the act of digging for
  it.
examples:
- We found a live clam buried in the wet sand.
- The clam shut its shell tight when we touched it.
