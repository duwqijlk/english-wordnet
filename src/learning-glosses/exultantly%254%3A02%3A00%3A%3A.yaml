simpleMeaning: in a way that shows you feel very happy because you have won or done well
scope: This is about showing great joy at winning or doing well, not just feeling calm and happy in a
  general way.
examples:
- She raised her arms exultantly after winning the race.
- He smiled exultantly when his team won the cup.
