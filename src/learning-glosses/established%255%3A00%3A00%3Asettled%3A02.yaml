simpleMeaning: fixed so firmly and completely that nothing can change it and no conditions are attached.
scope: This is not the sense of having been set up or having existed for a long time; it is about being
  fixed beyond doubt and without conditions.
examples:
- Their right to the land was now settled and unconditional.
- It is a settled fact that water boils at 100 degrees Celsius.
