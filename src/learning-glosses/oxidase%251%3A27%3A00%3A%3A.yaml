simpleMeaning: A protein in living things that speeds up changes in which a thing joins with oxygen
scope: A helper that speeds up a change using oxygen in a living thing, not the change itself and not
  a helper that works without oxygen.
examples:
- The oxidase in the cells speeds up the use of oxygen.
- Scientists added oxidase to speed up the change in the mixture.
