simpleMeaning: the steady swelling and shrinking of blood vessels with each beat of the heart
scope: 'Also called beat and heartbeat: the steady swelling and shrinking of blood vessels with each heart
  beat, not how fast the heart beats and not a seed.'
examples:
- He could feel the pulse in her wrist.
- The doctor felt for a pulse in the patient's arm.
