simpleMeaning: in a polite and careful way when dealing with other people
scope: This sense is about speaking or acting in a polite and careful way with people, not about a job
  going without problems and not about moving without shaking or stopping.
examples:
- '''And now,'' he said smoothly, ''let us go on talking.'''
- She answered the angry customer smoothly and kept her voice calm.
