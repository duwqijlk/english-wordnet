simpleMeaning: a simple sugar made of six carbon atoms and one aldehyde group, a small set of atoms joined
  to the sugar
scope: A sugar with six carbon atoms and an aldehyde group, not a sugar with four or three carbon atoms
  and not table sugar.
examples:
- Glucose is an aldohexose.
- The aldohexose has six carbon atoms in its chain.
