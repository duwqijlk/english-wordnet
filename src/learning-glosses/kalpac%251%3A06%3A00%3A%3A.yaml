simpleMeaning: 'Men in Turkey, Iran, and the Caucasus wear it: a tall black cap, most often made of felt
  or sheepskin.'
scope: Calpac and calpack are other names for this tall black cap, most often made of felt or sheepskin,
  that men wear in Turkey, Iran, and the Caucasus.
examples:
- He put on his kalpac.
- The kalpac was made of black felt.
