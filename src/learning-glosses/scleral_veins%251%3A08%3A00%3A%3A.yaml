simpleMeaning: Small blood tubes that drain blood from the white of the eye into the small blood tubes
  at the front of the eye
scope: Small blood tubes that drain the white of the eye, also called venae sclerales; not the front-of-eye
  blood tubes they join and not the blood tubes of the retina.
examples:
- The scleral veins carry blood away from the white of the eye.
- A doctor traced the scleral veins to the front of the eye.
