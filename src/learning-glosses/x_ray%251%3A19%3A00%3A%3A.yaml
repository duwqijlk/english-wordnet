simpleMeaning: Waves of very short length, made when fast-moving electrons hit a solid target, that carry
  electric and magnetic power.
scope: These are waves of very short length that carry electric and magnetic power, also called a roentgen
  ray, X-radiation and an X-ray, not a picture made with such waves.
examples:
- The machine sends out X ray when it is switched on.
- X ray can pass through skin but not through bone.
