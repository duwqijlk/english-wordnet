senseId: 'podzol%1:27:00::'
synsetId: 15017704-n
simpleMeaning: A grey, washed-out layer under a dark mat of decaying plant litter marks this soil of cool
  or cold, wet conifer woods and heaths.
scope: The soil type also spelled podsol and also called podzolic soil and podzol soil; it is a cool-climate
  ground with a dark mat above a grey leached layer, not garden topsoil.
examples:
- Podzol forms under pine woods in cool, wet climates.
- The soil profile is a podzol with a bleached layer under the surface.
