simpleMeaning: To help ships find their way, people in this field measure, describe and map the earth's
  surface waters
scope: The study of measuring, describing and mapping surface waters for ships, not the study of sea life
  and not the making of land maps.
examples:
- She studied hydrography before she joined the navy.
- The hydrography of the harbour was charted so ships could enter safely.
