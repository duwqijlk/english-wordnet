simpleMeaning: by twisting, weaving, or shaping separate strands or pieces, to make them hold together
  as one
scope: To join strands or pieces into one by twisting, weaving, or shaping them, not a single strand of
  yarn and not one layer of cloth or wood.
examples:
- She learned to ply the wool into strong yarn.
- The workers ply fabric into thick rope for the nets.
