simpleMeaning: A small bent piece of plastic or metal, put through the vagina into the womb, stops a woman
  getting pregnant
scope: This small bent piece of plastic or metal sits in the womb to stop a woman getting pregnant.
examples:
- An intrauterine device must be put in through the vagina.
- With an intrauterine device in place, a woman cannot get pregnant.
