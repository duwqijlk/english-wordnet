simpleMeaning: not real, but made to look or seem like the real thing
scope: 'Also called false, fake, imitation, and faux: made to look like the real thing, but not real itself.
  Not the other sense of this word in this batch, where a thing is made as a copy of something else.'
examples:
- She wore a necklace of simulated pearls.
- The bag was made of simulated leather.
