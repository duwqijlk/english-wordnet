simpleMeaning: Too quick to act, and giving no thought to what may come of it.
scope: Also called impulsive, impetuous, or hotheaded; quick and thoughtless in act, not the noun for
  a reckless, thoughtless person.
examples:
- The plan was madcap, drawn up in an hour.
- Their holiday was madcap, a rush from one town to the next.
