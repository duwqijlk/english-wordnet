simpleMeaning: People expect certain good manners in company, and this behaviour shows no respect for
  them
scope: Behaviour that breaks the rules of good manners; not a single rude word and not a bad temper.
examples:
- His impoliteness at the table embarrassed his hosts.
- The impoliteness of her reply shocked the whole room.
