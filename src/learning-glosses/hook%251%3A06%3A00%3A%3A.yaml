simpleMeaning: a curved or bent tool used for hanging something up or for pulling something
scope: A curved or bent tool for hanging or pulling things, not a machine part with the same shape, not
  a short punch from the side, and not a sharp curve in a shape.
examples:
- Hang your coat on the hook by the door.
- He used a strong hook to pull the heavy box toward him.
