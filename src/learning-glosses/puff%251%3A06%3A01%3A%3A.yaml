simpleMeaning: A soft round thing made of fluffy strands, used to put powder on the skin
scope: A soft round thing for putting powder on skin, not a bed cover and not a light pastry.
examples:
- She dabbed powder on her nose with a soft puff.
- The puff in her make-up bag was soft and round.
