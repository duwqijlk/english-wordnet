simpleMeaning: A tropical shrub with glossy leaves and sweet-smelling flowers that open at night, their
  petals crimped or wavy; it grows from northern India to Thailand.
scope: A tropical shrub, also called coffee rose, crape jasmine, crepe gardenia, crepe jasmine, pinwheel
  flower, East Indian rosebay, Nero's crown, and Tabernaemontana divaricate; not the lump in the throat
  and not other night-flowering shrubs.
examples:
