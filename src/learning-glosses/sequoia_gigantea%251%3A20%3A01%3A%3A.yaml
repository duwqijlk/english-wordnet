simpleMeaning: A very tall tree that keeps its leaves all year, from the south end of the west hills of
  the Sierra Nevada in California; the largest living thing.
scope: 'Also called big tree, giant sequoia, Sequoia wellingtonia, Sequoiadendron giganteum, or Sierra
  redwood: a very tall tree that keeps its leaves all year, from the south end of the west hills of the
  Sierra Nevada in California, the largest living thing, not a small tree and not a tree that loses its
  leaves in winter.'
examples:
- Sequoia gigantea is the largest living thing on earth.
- The very tall Sequoia gigantea grows in the hills of California.
