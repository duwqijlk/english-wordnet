simpleMeaning: After the fat is pressed from seeds such as linseed, cottonseed, or soybean, the solid
  lump left is fed to farm animals.
scope: What is left after pressing seeds such as linseed, cottonseed, or soybean is fed to farm animals
  as this solid lump.
examples:
- Oil cake was fed to the farm animals.
- They fed the oil cake to the farm animals after pressing the fat from the seeds.
