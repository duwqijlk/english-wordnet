simpleMeaning: the quality of making people feel interest, and of a person or thing seeming good and pleasing
  to people
scope: 'Another name for this sense is attraction: it is the quality that holds people''s interest, not
  a single place or show that people go to see.'
examples:
- Her attractiveness comes from her kind and cheerful way of talking.
- The attractiveness of the house lies in its bright rooms and large garden.
