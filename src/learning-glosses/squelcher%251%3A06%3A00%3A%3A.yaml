simpleMeaning: a set of electric wires that shuts off a receiving set when the signal grows weaker than
  the background hiss
scope: A set of electric wires that shuts off a receiving set when the signal grows weaker than the background
  hiss; squelch and squelch circuit are other names for this sense, not a part that makes sound louder
  and not a part that tunes the receiving set.
examples:
- The squelcher silenced the radio's hiss.
- A squelcher cuts off the set when the signal fades.
