simpleMeaning: In American football, this is the action of carrying the ball back the other way after
  a kickoff, punt, interception or fumble.
scope: This is the football action, not the tennis stroke that sends the ball back, not the act of coming
  or going back, not a profit, not a tax document, not a quick reply, and not the keyboard key.
examples:
- The punt return set up the winning field goal.
- He took the kickoff on the 5-yard line and turned it into a 95-yard return.
