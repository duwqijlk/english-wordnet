simpleMeaning: After a show, to clap your hands or call out so those on stage know you liked it.
scope: 'Also called spat or clap: to clap or call out after a show to show approval, not to praise in
  words alone.'
examples:
- The crowd applauded the dancers for a long time.
- She applauded when the singer finished her last song.
