simpleMeaning: A grass of South Africa that lives for many years, brought to the United States and grown
  as food for farm animals in dry places.
scope: A forage plant from South Africa now grown in dry parts of the United States, also called Chloris
  gayana.
examples:
- Rhodes grass grows well in the dry fields near the farm.
- The farmer cut Rhodes grass to feed the cows.
