simpleMeaning: One of four elements once believed to make up the universe (Empedocles, Greek thinker);
  old medicine linked it to yellow bile, one of four body fluids shaping health and temper.
scope: This is not a flame you can see, a blaze burning in a grate or strong criticism; it is one of the
  four basic substances of ancient cosmology.
examples:
- For Empedocles, fire was one of the four roots of all things, alongside earth, air and water.
- Medieval doctors matched each of the four elements with a humour, so fire was paired with yellow bile.
