simpleMeaning: A bad-smelling, fleshy tropical plant from Southeast Asia, grown for edible starchy underground
  stems or in greenhouses for big leaves and a dark red hood around its flower spike.
scope: One of three names for the same smelly Southeast Asian aroid, alongside snake palm and umbrella
  arum; it is not taro, and it is not a true palm.
examples:
- The devil's tongue in the greenhouse opened a dark red spathe.
- Farmers in Southeast Asia grow devil's tongue for its edible corms.
