simpleMeaning: a learned act that happens only when a certain sign is present
scope: This is a learned act that happens only when a certain sign is present; acquired reflex, conditional
  reaction, conditional reflex, conditional response, conditioned reflex and conditioned response are
  other names for this sense, not a reflex you are born with and not a free act done by choice.
examples:
- After weeks of training, the dog showed a conditioned reaction to the bell.
- Her conditioned reaction to the sound came without thought.
