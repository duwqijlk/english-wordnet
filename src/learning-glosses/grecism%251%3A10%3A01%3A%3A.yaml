senseId: 'grecism%1:10:01::'
synsetId: 92462523-n
simpleMeaning: Most of all to make the writing sound fine, a word or way of saying things from Greek is
  used in another tongue.
scope: A word or turn of phrase from Greek used in another tongue for effect in writing, not a word borrowed
  from French and not a plain Greek word in Greek itself.
examples:
- The Grecism in her poem came straight from Greek.
- Scholars traced the Grecism to its Greek source.
