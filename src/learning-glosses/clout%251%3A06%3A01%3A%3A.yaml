simpleMeaning: A short nail with a flat top, used for holding a sheet of metal in place on wood
scope: 'This is the nail sense: a short, flat-headed nail for metal and wood, not a hit with the fist
  in boxing.'
examples:
- He hammered a clout into the wood to hold the metal sheet in place.
- Use clouts, not long nails, to fix this thin metal sheet.
