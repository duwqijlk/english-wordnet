simpleMeaning: In wrestling, a hold where one person holds the other person's toe and twists the leg against
  its joints
scope: In wrestling, this is a hold on the toe that twists the leg, not a place to put your toes when
  climbing and not a small first chance to enter something.
examples:
- The wrestler won with a toehold that twisted his opponent's leg.
- She escaped from the toehold by rolling to one side.
