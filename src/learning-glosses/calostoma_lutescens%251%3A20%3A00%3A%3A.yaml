simpleMeaning: A spore-bearing fungus of the puffball kind, with a tough stalk and a round fruiting body
  holding a pale yellow case of spores.
scope: A puffball kind of fungus, its round fruiting body holds a pale yellow case of spores on a tough
  stalk, while other puffballs and stalked fungi of the woods are its nearest look-alikes.
examples:
- Calostoma lutescens pushed up through the leaf litter.
- The Calostoma lutescens stalk stood firm in the damp soil.
