simpleMeaning: to turn into liquid by taking in water from the air
scope: This is turning liquid by taking in water from the air; not melting from heat and not dissolving
  in water poured on it.
examples:
- This type of salt deliquesces easily in damp air.
- The crystals began to deliquesce on the humid summer day.
