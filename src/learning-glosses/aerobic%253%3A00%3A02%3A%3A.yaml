simpleMeaning: based on or using the ideas behind strong exercise for the heart and lungs, and making
  breathing and blood flow work better
scope: This word describes exercise based on strong movement for the heart and lungs; it does not mean
  needing air to live, and it is not a name for a living thing.
examples:
- Aerobic exercise like fast running made his heart beat faster.
- She does aerobic dance three times a week to stay fit.
