simpleMeaning: In psychology, the act of knowingly pushing away thoughts or wants that are not accepted
scope: 'Also called suppression: in the mind, knowingly keeping out thoughts or wants that are not accepted;
  not a rule that forbids something, and not nerves slowing down a part of the body.'
examples:
- Through inhibition, she pushed the painful wish out of her mind and would not think about it.
- In therapy, his inhibition was seen as a way of keeping unacceptable desires out of his thoughts.
