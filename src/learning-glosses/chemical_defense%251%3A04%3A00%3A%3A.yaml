simpleMeaning: steps taken to guard against attacks that use harmful stuff
scope: 'Also called chemical defence: steps to guard against attacks with harmful stuff, not the use of
  such stuff in an attack and not a defence against other kinds of attack.'
examples:
- The unit trains in chemical defense against nerve gas.
- New masks are part of the army's chemical defense plan.
