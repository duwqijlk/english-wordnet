simpleMeaning: how wide a tube or a gun barrel is, measured straight across from one side to the other
scope: 'Also called bore, gauge and calibre: a measure of how wide the inside of a tube or gun is, not
  a person''s level of skill or quality.'
examples:
- The gun is of .22 caliber and is light to hold.
- Pipes of this caliber are wide enough for the water to flow fast.
