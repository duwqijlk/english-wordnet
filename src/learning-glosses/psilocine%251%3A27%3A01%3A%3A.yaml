simpleMeaning: A tryptamine base with a changed make-up, and a serotonin-acting, psychedelic substance
  in most psychedelic mushrooms, beside its twin psilocybin, joined to phosphate.
scope: Also called psilocin, psilocyn, and psilotsin, it is a tryptamine base with a changed make-up,
  and a serotonin-acting, psychedelic substance in most psychedelic mushrooms, beside its twin psilocybin,
  joined to phosphate.
