simpleMeaning: broken into parts, so the group or thing is no longer one whole
scope: This describes a group or thing broken into parts and no longer one whole. It is not wood cut along
  its length, and not a share of money.
examples:
- A split group could not agree on a leader.
- The party stayed split after the vote, with two sides pulling apart.
