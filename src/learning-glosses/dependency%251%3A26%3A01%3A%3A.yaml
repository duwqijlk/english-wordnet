simpleMeaning: a state where the body or mind needs more and more of something it has got used to and
  cannot stop taking it, especially alcohol or strong drugs
scope: 'Also called addiction, dependence, dependance and habituation: needing alcohol or a drug in this
  way, not a land ruled by a far away country.'
examples:
- His dependency on alcohol grew after years of heavy drinking.
- She went to a clinic for help with her drug dependency.
