simpleMeaning: 'A white or colorless glassy solid, SiO2, that does not dissolve, found widely in the earth''s
  crust in several forms: quartz, cristobalite, tridymite and lechatelierite.'
scope: Another name for silicon dioxide and silicon oxide — a glassy, insoluble substance, not a particular
  mineral, since quartz is only one of its forms.
examples:
- Silica appears in the earth's crust in several forms, including quartz and cristobalite.
- 'The sample was silica: white, glassy and insoluble in water.'
