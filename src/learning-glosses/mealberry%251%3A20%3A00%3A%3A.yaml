simpleMeaning: In North America and northern Eurasia, a low shrub green all year spreads flat on the ground,
  with small white flowers and red berries; its leaves turn red in autumn
scope: 'Also called bear''s grape, common bearberry, creashak, hog cranberry, mountain box, red bearberry,
  sand berry, sandberry and wild cranberry: a low evergreen shrub with small white flowers and red berries.'
examples:
- Mealberry spread flat over the rocks, its red berries bright in autumn.
- We picked mealberry leaves as they turned red in autumn.
