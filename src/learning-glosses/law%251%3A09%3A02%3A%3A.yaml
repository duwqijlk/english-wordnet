simpleMeaning: the area of philosophy that studies the rules a society enforces and the principles behind
  the decisions that courts make.
scope: This is the philosophical study of rules and court decisions, not a rule made by a government and
  not a pattern found in nature.
examples:
- She studied the philosophy of law before becoming a judge.
- The course covers law, ethics and the principles behind court rulings.
