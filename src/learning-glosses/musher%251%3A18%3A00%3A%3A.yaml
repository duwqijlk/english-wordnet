simpleMeaning: a person who drives a team of dogs, or who travels with a team of dogs
scope: This is a person who drives a team of dogs or travels with them; it is not just any person who
  travels, and not a person who travels alone without dogs.
examples:
- The musher fed his dogs before the long trip across the snow.
- A good musher knows how each dog in the team works.
