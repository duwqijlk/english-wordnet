simpleMeaning: To count how long very small things are, you use this unit, one millionth of the main unit
  of length
scope: 'Another name for a micrometer or micron: one millionth of the main unit of length, not a tool
  for measuring and not a unit of weight.'
examples:
- The dust was two micrometres across.
- A micrometre is a millionth of a metre.
