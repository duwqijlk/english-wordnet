simpleMeaning: A woody plant of warm parts of America that bears the beans used to make cocoa
scope: A woody plant of warm parts of America that bears the beans used to make cocoa; cacao and cacao
  tree are other names for this sense, not the food made from the beans and not the beans themselves.
examples:
- The chocolate tree bears cacao beans.
- Chocolate trees grow in warm parts of America.
