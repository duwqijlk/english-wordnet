simpleMeaning: It grows wild in North America as a weed, though it came from Europe, and it spreads fast
  by stems that run under the soil.
scope: Also called couch grass, dog grass, quack grass, quackgrass, witch grass, and witchgrass; a fast-spreading
  weed from Europe that takes hold in North America.
examples:
- Quick grass spreads fast across the field by stems under the ground.
- The farmer pulled up quick grass that had taken hold in the wheat.
