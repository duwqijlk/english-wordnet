simpleMeaning: a small fruit that is dark purple and sour to eat, especially one from the Allegheny plum
  bush
scope: This is the fruit itself, not the thorny bush from Eurasia and not the wild plum plant of the north-east
  United States.
examples:
- She picked a sloe and found it too sour to eat.
- They gathered sloes, the small dark purple fruits, to make a drink.
