simpleMeaning: a swelling of the prostate gland that brings pain between the legs and trouble passing
  water, and, if bad, shaking chills and fever
scope: A swelling of the prostate gland, not a swelling of the bladder and not an infection of the kidneys.
examples:
- Prostatitis made it painful for him to pass water.
- His prostatitis brought chills and a fever when it grew severe.
