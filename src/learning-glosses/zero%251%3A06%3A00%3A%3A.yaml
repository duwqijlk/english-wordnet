simpleMeaning: The way a gun sight is set so a shot hits the middle of the mark when no wind is blowing
scope: A gun sight setting that puts shots on the middle of the mark, not the number and not the mark
  on a scale.
examples:
- He checked the zero of his rifle before the shoot.
- The zero was set so the bullet would hit dead centre.
