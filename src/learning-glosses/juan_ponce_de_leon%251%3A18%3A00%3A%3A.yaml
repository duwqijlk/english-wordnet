simpleMeaning: A Spanish sea traveller who went with Columbus on his second trip in 1493 and in 1513 found
  Florida while seeking the famed Fountain of Youth (1460-1521)
scope: This is the Spanish explorer who sailed with Columbus in 1493 and found Florida in 1513; Ponce
  de Leon is another name for this sense.
examples:
- Juan Ponce de Leon discovered Florida in 1513.
- Juan Ponce de Leon sailed with Columbus on his second trip in 1493.
