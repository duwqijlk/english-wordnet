simpleMeaning: A common finch, a small songbird, of North America, with a pale patch on the throat and
  a black-and-pale striped top of the head.
scope: A common finch of North America; whitethroat is another name for this sense, not a crow and not
  a bird without a striped crown.
examples:
- The white-throated sparrow sang from the bush, its pale throat patch showing.
- We saw a white-throated sparrow with a striped crown in the garden.
