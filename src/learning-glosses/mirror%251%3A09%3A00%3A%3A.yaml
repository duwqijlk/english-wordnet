simpleMeaning: An accurate picture or likeness of something, showing it as it really is.
scope: A picture or likeness that shows something truly, not the shiny glass object or the act of reflecting
  an image.
examples:
- The novel is a mirror of the society that produced it.
- Her calm face was a mirror of her inner peace.
