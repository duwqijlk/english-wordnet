simpleMeaning: A group with a shared interest that tries, most often by lobbying, to get lawmakers or
  officials to act in its favour
scope: This is a group that tries to get lawmakers or officials to act in its favour, also called a lobby,
  an advocacy group, a lobby group, a pressure group, a special-interest group, a special interest and
  a special interest group; not a lawmaker and not a political party.
examples:
- The third house lobbied lawmakers to act in its favour.
- Tobacco firms formed a third house to press their case.
