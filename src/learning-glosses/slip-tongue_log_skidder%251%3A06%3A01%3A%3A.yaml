simpleMeaning: In the 1800s and early 1900s, this timber-dragging machine had hanging tongs between its
  rolling wheels that lifted one end of a felled tree off the ground.
scope: 'Also called slip-tongue wheels and slip tongue log skidder: a timber-dragging machine of the 1800s
  and early 1900s with hanging tongs between its rolling wheels.'
examples:
- The slip-tongue log skidder lifted the end of the log off the ground.
- The slip-tongue log skidder was used in the 1800s.
