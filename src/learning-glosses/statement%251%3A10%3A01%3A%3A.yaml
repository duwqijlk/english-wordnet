senseId: 'statement%1:10:01::'
synsetId: 06528586-n
simpleMeaning: A document that lists money paid in and money charged or paid out.
scope: This is a paper or electronic record of money movements, not the act of saying or declaring something
  (the other sense of this word), not a spoken or written message setting out facts, not a claim offered
  as proof that something is true, not the playing of a musical theme, not a message sent without words,
  and not a line of code in a computer program.
examples:
- The bank sends me a statement at the end of every month.
- She checked the statement to see how much had been charged to her account.
