simpleMeaning: a tropical cyclone (a very strong storm with winds that move in a circle) that happens
  in the western Pacific Ocean or the Indian Ocean
scope: This is a very strong storm in the western Pacific Ocean or the Indian Ocean, not the same kind
  of storm in the Atlantic Ocean and not a small local storm.
examples:
- A typhoon hit the coast with very strong winds and heavy rain.
- Ships stayed in port while the typhoon moved across the western Pacific.
