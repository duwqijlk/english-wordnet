simpleMeaning: Flooding, filling to the brim.
scope: This sense is also called a flood, for flooding, filling to the brim, where a flood is filling
  a thing with water till it spills over the top, unlike the sense for slow inner shifting or warping
  of a solid, as by heat.
examples:
- Flowage flooded the fields.
- Flowage filled the banks to the brim.
