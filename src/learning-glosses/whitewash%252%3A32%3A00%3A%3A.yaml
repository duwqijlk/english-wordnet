simpleMeaning: to clear a person of blame after a check done with little care or by showing the facts
  in a one-sided way
scope: To clear someone of blame by a shallow check or one-sided facts, not to paint a wall white.
examples:
- The report whitewashed the mayor after the scandal.
- Critics said the inquiry whitewashed the whole affair.
