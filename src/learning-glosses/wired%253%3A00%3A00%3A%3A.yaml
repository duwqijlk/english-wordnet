simpleMeaning: fitted with wires, mainly so a place can have electric power or telephone service
scope: Fitted with wires for power or telephone service, not tense with excitement, not secretly fitted
  with listening devices, and not simply tied up with wire.
examples:
- The house is wired for the internet.
- They wired the new office for telephones.
