simpleMeaning: the smallest unit of language that has a job in building words or in the way words are
  put together in sentences
scope: This is a noun for a small unit of language, not the adjective sense about shaping things and not
  the sense about making new cells.
examples:
- The word part '-ed' is a formative that shows past time.
- In this book, each formative is listed with the job it does in a word.
