simpleMeaning: A British thinker, born in Austria, who said ideas in science can never be shown true,
  only put to the test by trying to show them false (1902-1994)
scope: Also called Popper and Karl Popper; a British thinker born in Austria who said ideas in science
  can never be shown true, not the Austrian thinker Wittgenstein and not the German thinker Kant.
examples:
- Sir Karl Raimund Popper argued that science grows by trying to prove ideas wrong.
- We read Sir Karl Raimund Popper in our philosophy class.
