simpleMeaning: In astronomy, the round outer edge of the sun, the moon, or a planet as seen in the sky
scope: In astronomy, the round outer edge of the sun, moon, or planet as seen, not an arm or leg and not
  a branch of a tree.
examples:
- The limb of the moon glowed pale in the sky.
- Sunspots appeared near the limb of the sun.
