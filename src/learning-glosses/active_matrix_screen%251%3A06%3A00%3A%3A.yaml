simpleMeaning: A display with liquid crystals for some computers that can be carried, with a separate
  tiny electric path for each dot of the picture.
scope: Not a plain display with one shared path and not a big desk monitor.
examples:
- The active matrix screen on her laptop stays bright at an angle.
- His active matrix screen shows each dot sharply.
