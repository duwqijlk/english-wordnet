simpleMeaning: One of numerous plants of the genus Gladiolus, native chiefly to tropical and South Africa,
  with sword-shaped leaves and one-sided spikes of brightly colored funnel-shaped flowers; people grow
  it widely.
scope: This noun is an informal short form of gladiolus, used mainly by gardeners, and most often in the
  plural 'glads'. It is not the adjective glad meaning pleased or happy. It names a cultivated garden
  plant grown for its tall spikes of flowers.
examples:
- She planted glads along the back fence.
- The glads in the border flowered late this year.
