simpleMeaning: At the end of a play, a short speech, often in verse, spoken by an actor straight to the
  crowd.
scope: Of a short speech spoken by an actor straight to the audience at a play's end.
examples:
- The actor spoke the epilogue to the crowd.
- An epilogue in verse closed the play.
