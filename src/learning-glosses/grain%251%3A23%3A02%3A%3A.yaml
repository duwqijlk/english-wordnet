simpleMeaning: 'a very small unit for measuring weight: 1/60 of a dram, or 64.799 milligrams, the same
  as the avoirdupois unit of the same name'
scope: This is a unit of weight set as 1/60 of a dram; not a seed, not food, and not the unit of weight
  set as 1/7000 of a pound.
examples:
- The powder was measured as twenty grains, each 1/60 of a dram.
- One grain in this measure weighs 64.799 milligrams.
