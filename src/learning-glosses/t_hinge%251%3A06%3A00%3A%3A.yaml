synsetId: 04406981-n
simpleMeaning: A joint shaped like the letter T when opened, like a long flat joint but with one part
  swapped for half of a short joint set level in the frame.
scope: Also called a tee hinge; a joint shaped like the letter T when opened, like a strap joint but with
  one part swapped, and not a plain butt joint.
examples:
- He fixed the gate with a T hinge so it would sit level in the frame.
- A T hinge looks like the letter T when the door is opened.
