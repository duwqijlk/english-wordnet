simpleMeaning: having or using waves that are longer than light waves but shorter than radio waves, and
  lying past the red end of the light people can see
scope: This describes waves or their use, not the noun that names this part of light and radio waves,
  and not the noun that names the waves themselves.
examples:
- An infrared camera can see heat that our eyes cannot see.
- The remote control sends an infrared signal to the television.
