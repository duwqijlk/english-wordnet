simpleMeaning: To make someone very tired, or to grow very tired yourself, through too much use or through
  great strain or stress
scope: 'Also called wear and tire: to make a person very tired or to grow very tired, not simply being
  tired.'
examples:
- The long hike wearied the whole group.
- Hours of hard work wearied her.
