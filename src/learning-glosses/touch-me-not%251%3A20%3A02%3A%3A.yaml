simpleMeaning: the long fruit of this Mediterranean vine bursts when ripe and, at a touch, drives its
  seeds and juice out with force
scope: Also called an exploding cucumber or a squirting cucumber; a vine whose ripe fruit bursts at a
  touch, not the North American plant of the same name with yellow or orange flowers.
examples:
- The touch-me-not vine hung over the wall, its fruit ready to burst.
- Do not brush against the touch-me-not, or its seeds will fly out.
