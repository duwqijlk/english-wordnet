senseId: 'fly%2:30:00::'
synsetId: 00152881-v
simpleMeaning: To fall fast and then be gone, as when money or time runs out quickly.
scope: A thing that shrinks to nothing in a short time, as money or time may; it is not time merely passing,
  not a person running off quickly, and not a mood changing fast.
examples:
- Money flies when you eat out every night.
- His whole paycheck flew at the casino before midnight.
