simpleMeaning: special clothes worn to hide who a person is at a party where guests wear such clothes
  and masks
scope: These are the special clothes themselves, not the party where guests wear them and not the act
  of taking part in such a party.
examples:
- Her masquerade was a long red dress with a gold mask.
- He chose a pirate masquerade, with a black hat and a false beard.
