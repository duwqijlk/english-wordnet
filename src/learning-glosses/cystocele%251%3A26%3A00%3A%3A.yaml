simpleMeaning: Sometimes after a baby is born, the bag that holds urine pushes through the wall of the
  birth canal, making a swelling
scope: Also called colpocystocele, this is a swelling where the bag that holds urine pushes through the
  wall of the birth canal.
examples:
- Her cystocele came after her last baby was born.
- The cystocele formed when the bag that holds urine pushed through the wall of the birth canal.
