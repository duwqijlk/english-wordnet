simpleMeaning: One part of the body other than the sex organs, or a thing held to have magic power, can
  bring sexual pleasure or excitement when handled
scope: Also called fetichism, this differs from the worship of a fetish by being about sexual pleasure,
  not belief.
examples:
- Fetishism gave him sexual pleasure from handling the thing.
- Her fetishism centred on one part of the body other than the sex organs.
