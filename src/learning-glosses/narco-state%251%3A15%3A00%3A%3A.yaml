simpleMeaning: An area taken over by drug gangs, run and spoiled by them, where the police have almost
  no power.
scope: An area taken over by drug gangs, run and spoiled by them, where the police have almost no power;
  not a country at war and not a poor town with a weak police force.
examples:
- The town had become a narco-state run by drug gangs.
- In the narco-state, the police hardly dared to act.
