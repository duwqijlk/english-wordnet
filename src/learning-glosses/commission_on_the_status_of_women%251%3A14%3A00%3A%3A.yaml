simpleMeaning: A part of the Economic and Social Council of the United Nations that looks after how female
  people are treated in different groups of people.
scope: This word is for a part of the Economic and Social Council, not for the council itself.
examples:
- The Commission on the Status of Women met to talk about new rules.
- She spoke at the Commission on the Status of Women about life in her country.
