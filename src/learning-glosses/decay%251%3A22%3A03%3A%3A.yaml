simpleMeaning: The breaking apart of a radioactive thing on its own, while it gives off rays that can
  harm living things
scope: The breaking apart of a radioactive thing on its own, not the rotting of dead plants and animals
  and not a slow loss of power.
examples:
- The decay of the sample gave off rays for many years.
- Scientists measured the decay of the radioactive rock.
