simpleMeaning: The most ancient known type of bird, an extinct Triassic animal with a bird-like jaw, hollow
  limbs and breastbone, yet a dinosaur-like tail and hind legs.
scope: An extinct Triassic bird known only from fossils; not a living bird and not a dinosaur, though
  its tail and hind legs were dinosaur-like.
examples:
- The fossil protoavis had a bird-like jaw but a long, dinosaur-like tail.
- Scientists consider protoavis one of the earliest known birds.
