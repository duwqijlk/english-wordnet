simpleMeaning: The whole bottom of the foot rests on the ground when the foot's inner curve is flat
scope: A foot whose inner curve is flat and rests fully on the ground, not a normal curved foot and not
  a foot hurt in an accident.
examples:
- The doctor said my fallen arch makes my feet ache after a long walk.
- Her fallen arch means the whole sole of her shoe touches the ground.
