simpleMeaning: a container made by people for holding liquids, especially an underground tank for holding
  rainwater
scope: This sense is a container for holding liquids, especially rainwater; it is not the small space
  inside the body that holds fluid and not the tank that holds water for a toilet.
examples:
- Rainwater runs from the roof into the cistern.
- The old house has a large cistern under the ground.
