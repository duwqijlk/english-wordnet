simpleMeaning: a person's own mark on the system that carries notes between computers, used to show who
  they are when they send word
scope: A person's own mark on the mail system that shows who they are, not the whole mail system; also
  called email, e-mail and email address.
examples:
- Type your e-mail address here so we can write back to you.
- I gave him my e-mail address and he sent the files that night.
