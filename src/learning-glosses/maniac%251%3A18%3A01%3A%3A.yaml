simpleMeaning: a person who cares about one thing far more than is normal, thinking of it all the time
scope: A person with an extreme love for one thing, not someone who is mentally ill.
examples:
- He is a real maniac about old trains and talks about them all day.
- The young maniac spent every free hour collecting stamps.
