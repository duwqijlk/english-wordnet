simpleMeaning: Animals that graze can be poisoned by this plant of eastern and central North America,
  whose creamy pale blooms are touched with brown or purple.
scope: A plant of eastern and central North America, it is poisonous, above all to grazing animals, and
  bears creamy pale blooms touched with brown or purple.
examples:
- Cattle avoided the white camas growing in the meadow.
- The white camas bloomed with creamy pale flowers.
