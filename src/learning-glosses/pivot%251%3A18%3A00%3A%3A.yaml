senseId: 'pivot%1:18:00::'
synsetId: 10456474-n
simpleMeaning: the person in a line of soldiers around whom the others turn and move as a group in a planned
  way
scope: This is the person in a line of soldiers that the others turn around, not the small shaft that
  a turning part rests on, and not the act of turning itself.
examples:
- As the pivot, the soldier at the end of the line stayed in place while the others turned around him.
- During the drill, the whole line wheeled around its pivot.
