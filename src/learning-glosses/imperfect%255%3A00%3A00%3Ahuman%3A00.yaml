simpleMeaning: Lacking moral strength, courage, or will, and having the limits of a human being rather
  than the powers of divine beings
scope: This is about being weak in will or character and merely human; weak and frail are other names
  for this sense. Not a verb tense for an action that is still going on.
examples:
- He knew he was only imperfect, and his courage failed him at the last moment.
- The imperfect hero made mistakes, just as any human being would.
