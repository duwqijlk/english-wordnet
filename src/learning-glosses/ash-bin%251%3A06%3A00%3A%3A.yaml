senseId: 'ash-bin%1:06:00::'
synsetId: 02750182-n
simpleMeaning: a container that holds rubbish until the rubbish is taken away
scope: 'Also called ash bin, ashbin, ashcan, dustbin and garbage can: a container for rubbish waiting
  to be taken away, not a bag of rubbish and not a place where rubbish is burned.'
examples:
- She put the bag of peelings in the ash-bin.
- The ash-bin was full, so he left the rubbish beside it.
