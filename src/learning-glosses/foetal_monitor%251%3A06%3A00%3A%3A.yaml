synsetId: 03283825-n
simpleMeaning: While she gives birth, this electronic machine follows the baby's heartbeat and the mother's
  womb squeezes
scope: Also called electronic fetal monitor, electronic foetal monitor and fetal monitor, this is a machine
  used during childbirth, not a machine that checks an adult's heart.
examples:
- The nurse watched the foetal monitor as the baby's heart beat faster.
- A foetal monitor showed the mother's contractions growing stronger.
