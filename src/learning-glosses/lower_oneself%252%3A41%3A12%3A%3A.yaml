senseId: 'lower_oneself%2:41:12::'
synsetId: 02523493-v
simpleMeaning: To act in a way that lacks honour or worth, and so lose the respect of others.
scope: This is acting in a way that lacks honour or worth, not simply bending down and not making a small
  mistake; stoop and condescend are other names for this sense.
examples:
- Lowering oneself to lies only brings shame.
- She knew that to lower oneself for money was wrong.
