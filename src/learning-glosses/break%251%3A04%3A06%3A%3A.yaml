simpleMeaning: in bowling, a turn in which the player fails to knock down all ten pins with one ball or
  with two
scope: This is a bowling turn that falls short, not the opening shot in pool and not a pause in activity.
examples:
- He was annoyed by a break in the third frame.
- Two breaks in the final game dropped her average.
