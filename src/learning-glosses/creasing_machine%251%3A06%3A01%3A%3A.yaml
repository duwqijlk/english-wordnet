simpleMeaning: A hand or electric tool for putting folds in papers, hard covers and other stiff cover
  paper
scope: This is a hand or electric tool for putting folds in papers, hard covers and other stiff cover
  paper; not a printer, which puts marks on paper, and not a cutter, which cuts paper apart.
examples:
- The creasing machine folded the covers for the book.
- She fed the thick paper into the creasing machine.
