simpleMeaning: the fixed number that links two amounts that grow together, so one is always that number
  times the other; usually written y = kx, with k the fixed number
scope: The fixed number linking two amounts that grow in step, also called constant of proportionality,
  not a number that changes with the amounts.
examples:
- In y = 3x, the factor of proportionality is 3.
- She worked out the factor of proportionality from the two sets of numbers.
