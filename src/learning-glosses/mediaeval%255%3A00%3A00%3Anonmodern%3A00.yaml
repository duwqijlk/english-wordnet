simpleMeaning: Out of date and shut to new ideas, like a thing from the Middle Ages
scope: Also called medieval and gothic, this is about a thing or a way of thinking that seems out of date
  and closed to new ideas, not about the real Middle Ages and the time of knights.
examples:
- His mediaeval views on women belonged to another age.
- The town's mediaeval attitude to newcomers kept it closed to change.
