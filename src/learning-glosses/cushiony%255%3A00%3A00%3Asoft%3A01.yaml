simpleMeaning: Made soft by cushions or padding put in or on.
scope: This sense is also called padded and cushioned, for being made soft by cushions or padding put
  in or on, where padded is softened by soft thick stuff put inside or on it.
examples:
- The seat was cushiony, soft with padding.
- The chair was cushiony, soft with cushions.
