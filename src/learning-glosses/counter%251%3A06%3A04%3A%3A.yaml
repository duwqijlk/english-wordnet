simpleMeaning: a piece of furniture with shelves and drawers, placed at the side of a dining room
scope: This is dining-room furniture with shelves and drawers, not the flat table in a shop where people
  pay, and not a small piece used in a board game.
examples:
- The plates are kept in the counter at the side of the dining room.
- She put the glasses on a shelf in the counter.
