simpleMeaning: Grown widely, this sage of western North America down to Central America has flowers of
  violet touched with the colour of the sky.
scope: This sage of western North America down to Central America has flowers of violet touched with the
  colour of the sky and is grown widely, not the shrub of dry lands with grey-white leaves.
examples:
- We saw blue sage flowering in Central America.
- The blue sage we planted had violet flowers.
