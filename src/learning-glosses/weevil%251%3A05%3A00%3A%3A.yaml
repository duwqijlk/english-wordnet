simpleMeaning: Any of several kinds of beetle, mostly small, that eat plants and what plants give, especially
  the snout beetles and the seed beetles.
scope: Any of several kinds of beetle, mostly small, that eat plants and what plants give, especially
  the snout and seed beetles, not a beetle that eats wood.
examples:
- A weevil had bored into the stored grain.
- The farmer found weevils in the sacks of seed.
