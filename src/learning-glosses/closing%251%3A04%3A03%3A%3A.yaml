simpleMeaning: the act of getting nearer to a place you are going to, so the space between you and it
  gets smaller
scope: Getting nearer to a place you are going to, not the act of shutting something.
examples:
- The closing of the two ships left little time to turn away.
- We watched the closing of the gap between the boats.
