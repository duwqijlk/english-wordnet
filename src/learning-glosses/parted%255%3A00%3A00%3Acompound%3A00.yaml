simpleMeaning: with the edge of a leaf cut in almost to the base, so the leaf is split into clear divisions
  or lobes, each like a rounded flap
scope: A leaf whose edge is cut in deep, almost to the base, not a leaf with a smooth edge and not one
  cut only at the rim.
examples:
- The parted leaves of the maple were split into deep lobes.
- She pressed a parted leaf between the pages of her book.
