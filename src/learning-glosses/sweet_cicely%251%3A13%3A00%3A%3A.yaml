simpleMeaning: People top salads and cold vegetables with its fresh fern-like leaves and green seeds,
  and use its dried seeds in candy and strong drink.
scope: This is a plant whose fresh leaves and green seeds top salads and cold vegetables, and whose dried
  seeds go into candy and strong drink.
examples:
- She cut sweet cicely to top the salad.
- The sweet cicely seeds went into the liqueur.
