simpleMeaning: Any stuff, such as thiouracil, that makes a swelling form in the front of the neck (a goiter).
scope: Any stuff that brings on a swelling in the neck, not a medicine that treats one and not the swelling
  itself.
examples:
- The doctor warned that the goitrogen in the drug could cause a goiter.
- Too much of this goitrogen made a swelling grow in her neck.
