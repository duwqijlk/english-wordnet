simpleMeaning: a picture or design made from an engraving (a piece of metal or wood with lines cut into
  it, covered with ink and pressed onto paper)
scope: A picture made from an engraving; not a picture made from a film negative, not cloth with a pattern
  on it, and not the words in a book.
examples:
- She bought a print of the old city scene at the art shop.
- The museum owns a print made from the artist's first engraving.
