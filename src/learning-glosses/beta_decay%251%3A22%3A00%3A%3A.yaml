simpleMeaning: An atom throws off a tiny bit as its core breaks down, giving off rays in the process.
scope: This is the breaking down of an atom's core that gives off rays and throws off a tiny bit, not
  alpha decay, a different kind of breaking down.
examples:
- Beta decay happens when the core of an atom breaks down and gives off rays.
- In beta decay, the atom throws off a tiny bit as it breaks down.
