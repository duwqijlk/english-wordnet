simpleMeaning: about the idea that the state controls every part of people's lives
scope: This is about the idea that the state controls every part of life; totalitarian is another name
  for this sense, and it is not a government itself or a system that leaves people free.
examples:
- The report described the country in totalistic terms, with the state shaping every part of daily life.
- She warned that totalistic rule leaves no part of life free from the state.
