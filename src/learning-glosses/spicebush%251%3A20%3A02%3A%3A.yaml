simpleMeaning: A bush with stems that spread out in an untidy way and a sweet smell, with scented brown
  flowers, that grows in the southwest United States
scope: A bush with stems that spread out in an untidy way and a sweet smell, with scented brown flowers,
  that grows in the southwest United States, not the eastern kind with yellow flowers and scarlet berries
  and not a tree.
examples:
- The spicebush spreads by the path, its brown flowers sweet-smelling.
- A spicebush grows in the southwest United States.
