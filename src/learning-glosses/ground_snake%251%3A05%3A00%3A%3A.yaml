simpleMeaning: Brightly ringed and living on land, this small shy snake keeps to the dry or half-dry lands
  of western North America.
scope: This small shy snake keeps to the dry parts of western North America, and its bright rings set
  it apart from other small snakes.
examples:
- A ground snake slipped away when we came near.
- We saw the bright rings of a ground snake.
