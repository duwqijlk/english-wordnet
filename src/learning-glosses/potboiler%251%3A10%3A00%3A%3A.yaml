simpleMeaning: Made fast to earn money, this piece of writing is of poor quality
scope: A piece of writing of poor quality made fast to earn money; not a work of lasting worth and not
  one written slowly with care.
examples:
- The novel was a potboiler he wrote in three weeks.
- She turned out potboilers to pay the rent.
