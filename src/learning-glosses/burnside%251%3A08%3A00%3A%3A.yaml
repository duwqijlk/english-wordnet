simpleMeaning: Hair that grows down the side of a man's face in front of his ears, seen most clearly when
  the rest of his beard is shaved off
scope: Hair down the side of a man's face in front of his ears; sideburn and mutton chop are other names
  for this sense, not a full beard and not hair on the chin.
examples:
- He grew a burnside on each side of his face.
- The old photo showed him with a burnside and a clean-shaven chin.
