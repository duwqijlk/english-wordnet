simpleMeaning: In computer science, a piece of software that lets the operating system talk to a device
  such as a printer or mouse.
scope: This is software, not a person at the wheel and not a golf club.
examples:
- The printer stopped working until I reinstalled its driver.
- This driver lets the laptop use the new graphics card.
