simpleMeaning: A golden thistle of southwestern Europe, grown for its sweet roots, leaves and stalks,
  all good to eat; its yellow flowers stand in for saffron.
scope: A golden thistle grown for its sweet roots, leaves and stalks, also called Scolymus hispanicus,
  with yellow flowers used in place of saffron.
examples:
- We grow Spanish oyster plant for its sweet roots and leaves.
- The Spanish oyster plant in the bed has yellow flowers used in place of saffron.
