simpleMeaning: This cultivated, spreading, carpeting weed bears bright yellow flowers; its edible, mildly
  sour leaves are eaten raw or cooked, especially in Indian, Greek and Middle Eastern cooking; it grows
  worldwide.
scope: The plural Spanish form naming this same edible weed and its leaves as food, not a different plant
  and not a prepared dish.
examples:
- Verdolagas grow wild along the irrigation ditch.
- The recipe calls for two cups of chopped verdolagas.
