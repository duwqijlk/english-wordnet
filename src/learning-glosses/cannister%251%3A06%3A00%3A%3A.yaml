simpleMeaning: a metal box that keeps dry food, like tea or flour, safe
scope: 'Also called canister and tin: a metal box for dry food, not a jar for liquids and not a bag for
  fresh food.'
examples:
- She kept the tea in a cannister on the shelf.
- The flour cannister stood beside the stove.
