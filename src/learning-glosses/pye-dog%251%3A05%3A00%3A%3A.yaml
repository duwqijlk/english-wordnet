simpleMeaning: A half-wild animal of mixed breed with no owner, often seen near villages in Asia, most
  of all in India
scope: 'Also called a pariah dog or a pie-dog: a half-wild animal of mixed breed with no owner, not a
  pet and not a wolf.'
examples:
- A pye-dog slept in the shade near the village well.
- The pye-dog followed the children home from the fields.
