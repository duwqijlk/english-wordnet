simpleMeaning: A fatty build-up blocking an artery is cleared away when doctors cut out the artery's inner
  coat.
scope: In surgery, a blocked artery is cleared by cutting out its inner coat.
examples:
- The surgeon did an endarterectomy to clear the blocked artery.
- After the endarterectomy, blood could flow through the artery again.
