simpleMeaning: In physical chemistry, a suspension, a mix in which tiny bits stay floating, of solid or
  liquid specks held inside a gas.
scope: This is the physical-chemistry sense of a particle cloud in any gas, not the everyday hot vapor
  from burning, the sign of hidden activity, the insubstantial thing, the tobacco roll, its drug slang,
  the act of using tobacco, the baseball pitch, or the two verbs for inhaling it or giving it off.
examples:
- A grey smoke of ash drifted through the tunnel after the blast.
- The air above the mill floor was thick with smoke of fine flour dust.
