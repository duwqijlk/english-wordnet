simpleMeaning: a person with special training who works on a ship that carries goods
scope: This is a trained person who works on board a trading ship, also called able-bodied seaman; not
  a sailor in the navy and not a worker on a ship with no special training.
examples:
- The able seaman climbed the mast to fix the torn sail.
- The able seaman showed the new worker how to tie the ropes.
