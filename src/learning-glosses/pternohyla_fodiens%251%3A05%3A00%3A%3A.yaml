simpleMeaning: A land frog that digs and comes out at night, of grassy ground and scrub woods, with a
  very hard top to its head, of the south-west United States
scope: Also called lowland burrowing treefrog and northern casque-headed frog, this is a digging night
  frog of grassy ground and scrub woods with a very hard head top, not a water frog and not a frog that
  comes out by day.
examples:
- The Pternohyla fodiens dug into the soft ground.
- A Pternohyla fodiens came out at night.
