senseId: 'satiate%2:34:01::'
synsetId: 01195632-v
simpleMeaning: To keep eating long past having had enough, taking far more food than one needs.
scope: 'Also called stuff, gorge, binge, engorge, glut, overeat, and overindulge: to eat far too much,
  not to be fed until one is content.'
examples:
- They satiated themselves with cake until they could eat no more.
- He satiated himself at the feast and felt ill after.
