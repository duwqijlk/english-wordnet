simpleMeaning: a dark band of grey matter deep in the brain works with the striate body and is tied to
  the body chemistry upset of Parkinson and Huntington disease
scope: Also called locus niger and nucleus niger; a dark part of the midbrain, not the striate body itself
  and not the whole midbrain.
examples:
- The substantia nigra sits deep in the middle of the brain.
- Doctors study the substantia nigra to learn how body chemistry goes wrong in Parkinson disease.
