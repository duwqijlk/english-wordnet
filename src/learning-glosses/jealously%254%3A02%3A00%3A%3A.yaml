simpleMeaning: in a way that shows fear that someone you love may leave you for another person, or that
  others may take what is yours
scope: This is about fear of losing a person you love or losing what is yours to others, not about wanting
  what another person has.
examples:
- He watched jealously as his wife talked and laughed with another man.
- She guarded her work jealously and let no one copy it.
