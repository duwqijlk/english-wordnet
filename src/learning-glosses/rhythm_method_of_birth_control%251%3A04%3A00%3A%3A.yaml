simpleMeaning: 'Days 10 to 18 are the days for becoming pregnant, since the egg is thought to come out
  two weeks before a period: natural family planning.'
scope: 'Also called rhythm, rhythm method, calendar method, and calendar method of birth control: a natural
  way to plan a family by counting cycle days, not a drug or a device that stops pregnancy.'
examples:
- They chose the rhythm method of birth control to plan their family.
- She counted days 10 to 18 under the rhythm method of birth control.
