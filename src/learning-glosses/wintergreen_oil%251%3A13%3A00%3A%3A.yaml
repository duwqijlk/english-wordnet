simpleMeaning: a liquid used to give taste, got from the low-growing teaberry plant
scope: This is a flavouring liquid got from the teaberry plant; oil of wintergreen is another name for
  this sense, not the plant itself and not a cooking oil.
examples:
- A drop of wintergreen oil gives the candy its taste.
- The pharmacist used wintergreen oil in the rub.
