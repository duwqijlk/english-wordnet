simpleMeaning: a spiral-shaped germ brings on this widespread sex disease; its signs change stage by stage,
  and a mother can pass it through the placenta to her baby before birth
scope: Also called pox, syphilis, lues, and lues venerea; not a cold and not a skin rash that comes and
  goes.
examples:
- He was treated for syph after the test came back.
- Syph can pass from a mother to her baby before birth.
