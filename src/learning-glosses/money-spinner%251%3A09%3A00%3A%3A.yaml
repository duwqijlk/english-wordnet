simpleMeaning: A plan or piece of work that keeps bringing in cash over a long time.
scope: A plan or piece of work that keeps bringing in cash over a long time, also called moneymaker; not
  a single sale, and not a plan that loses cash.
examples:
- The new shop turned out to be a real money-spinner.
- Her small bakery became a steady money-spinner for the family.
