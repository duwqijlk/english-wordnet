simpleMeaning: to join things in a chemical way so the new thing can easily be split back into the things
  it was made from
scope: This is joining things in a chemical way so the join can be undone; it is not changing a verb for
  person or tense, and not a leaf with one pair of small leaf parts.
examples:
- The two substances conjugate in this reaction and can later be split apart again.
- In the lab, these compounds conjugate easily and break down just as easily.
