senseId: 'plod%2:38:00::'
synsetId: 01925197-v
simpleMeaning: to walk with heavy, firm steps, as when you are tired or when you go through mud
scope: 'Also called pad, trudge, tramp and slog: to walk with heavy, firm steps when tired or in mud,
  not to walk in a light or quick way.'
examples:
- The tired men plodded through the mud back to camp.
- She plodded up the hill in her heavy boots.
