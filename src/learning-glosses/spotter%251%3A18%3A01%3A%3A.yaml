simpleMeaning: a worker whose job is to put spots on things, for example as marks to show what they are
scope: This worker puts spots or marks on things; this is not the worker at a dry cleaner who takes spots
  out of clothes.
examples:
- The spotter marked each finished part with a small spot of paint.
- In the factory, the spotter puts a coloured spot on every box that is ready.
