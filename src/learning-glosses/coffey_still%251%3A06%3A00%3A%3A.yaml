simpleMeaning: A large set of tools that heats a fermented mix bit by bit to draw off its alcohol on an
  industrial scale.
scope: A device for getting alcohol out of a fermented mix, made to work on an industrial scale.
examples:
- The Coffey still ran day and night.
- Whisky makers use a Coffey still to draw off alcohol from the fermented mix.
