simpleMeaning: In law, the setting up of a set of steps by which a court gives its ruling
scope: Also called proceedings; in law, the setting up of the steps that lead to a court's ruling, not
  an ordinary course of events.
examples:
- The proceeding began with a reading of the charges.
- A proceeding was started to settle the dispute in court.
