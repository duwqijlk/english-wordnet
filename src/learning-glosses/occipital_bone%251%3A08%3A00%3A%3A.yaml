simpleMeaning: A shallow dish-shaped hard part that forms the back of the skull.
scope: The hard part at the back of the skull, not the bones of the face and not the bones that form the
  sides of the skull.
examples:
- The occipital bone forms the back of the skull.
- A blow to the occipital bone can hurt the back of the head.
