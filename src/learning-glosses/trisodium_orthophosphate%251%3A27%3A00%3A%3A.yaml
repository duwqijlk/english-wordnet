simpleMeaning: A salt made from soda and phosphate, used as a helper in soaps and cleaners
scope: A soda salt used as a helper in soaps and cleaners, also called tribasic sodium phosphate and trisodium
  phosphate; not table salt and not a soap on its own.
examples:
- The factory used trisodium orthophosphate in its cleaning powder.
- Trisodium orthophosphate helps detergents lift dirt.
