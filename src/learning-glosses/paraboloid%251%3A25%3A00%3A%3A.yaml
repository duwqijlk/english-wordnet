senseId: 'paraboloid%1:25:00::'
synsetId: 13919695-n
simpleMeaning: A curved surface that, cut one way, shows bowl-shaped curves running along one straight
  line, and cut the other way shows oval shapes.
scope: A curved surface with bowl-shaped cuts one way and oval cuts the other, not a flat sheet.
examples:
- The dish had the shape of a paraboloid, curving like a bowl.
- A paraboloid can be cut to show oval shapes across its axis.
