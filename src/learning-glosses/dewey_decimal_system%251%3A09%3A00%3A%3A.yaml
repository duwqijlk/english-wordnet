synsetId: 05735372-n
simpleMeaning: A way for libraries to sort factual publications into subject groups, giving each a three-number
  code and more numbers after a point; publications sit on shelves in number order.
scope: A library sorting scheme, also called the Dewey decimal classification and the decimal system of
  classification.
examples:
- The Dewey decimal system puts each book in a numbered subject group.
- Our school library uses the Dewey decimal system for its nonfiction shelves.
