simpleMeaning: By putting a harsh fact in soft, gentle words.
scope: Putting a harsh fact in soft words, not saying it plainly and not hiding it altogether.
examples:
- His death was euphemistically called a passing away.
- She spoke euphemistically about the job losses, calling them changes.
