simpleMeaning: to tie a thing fast with a rope, a chain, or a cord
scope: To tie a thing fast with rope, chain, or cord, not to hit with a whip and not to flick about sharply.
examples:
- Lash the horse to the post before you leave.
- The sailors lashed the boxes to the deck.
