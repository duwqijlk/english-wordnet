simpleMeaning: a state of rest that comes round again, with no quick shifts of the organs of sight and
  no dreams, taking about three quarters of a normal night
scope: A state of rest with no quick shifts of the organs of sight and no dreams; also called nonrapid
  eye movement and orthodox sleep, not the sleep state with quick shifts and dreams and not being awake.
examples:
- Nonrapid eye movement sleep fills most of a normal night.
- During nonrapid eye movement sleep, the sleeper does not dream.
