senseId: 'curative%1:06:00::'
synsetId: 04081594-n
simpleMeaning: A medicine or course of care that heals sickness or eases pain.
scope: This sense is also called a cure, a remedy, and a therapeutic, for a medicine or course of care
  that heals sickness or eases pain, where a cure is a drug or a course of care that makes a sick person
  well or takes pain away, and a remedy is a drug or a course of care that makes a sick person well or
  takes pain away, unlike the sense for what tends to heal or bring back to health.
examples:
- The curative healed his sickness.
- Curatives heal sickness and ease pain.
