simpleMeaning: Soreness and swelling of the joining tissue next to the womb.
scope: Soreness of the tissue next to the womb, not a sore womb itself and not a sore bladder.
examples:
- Parametritis left her with pain low in the belly.
- The doctor treated the parametritis with rest and drugs.
