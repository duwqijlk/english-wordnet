simpleMeaning: work by a doctor to fix or change body parts, to heal them or to make them look better
scope: 'Also called anaplasty and plastic surgery: work by a doctor to fix or change body parts to heal
  them or make them look better, not work to take out a sick part and not a small cut to fix a wound.'
examples:
- After the burn, reconstructive surgery rebuilt the skin on her hand.
- He had reconstructive surgery on his nose after the crash.
