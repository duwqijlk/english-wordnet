simpleMeaning: A plant with small, thin leaves and flowers of blue and purple that grow in long, loose,
  open bunches, found from Utah and Colorado down to New Mexico and Arizona
scope: This is a plant with small narrow leaves and blue-violet flowers, also called narrow-leaf penstemon,
  not a plant with broad leaves.
examples:
- Penstemon linarioides grows in Utah and Colorado.
- The blue-violet flowers of Penstemon linarioides grow in long open clusters.
