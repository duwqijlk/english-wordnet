senseId: 'knee%1:08:00::'
synsetId: 05581233-n
simpleMeaning: the hinge joint in the human leg where the thigh bone meets the two lower leg bones, guarded
  at the front by a small flat bone
scope: The joint in a person's leg, not the matching joint in a four-legged animal, and not the cloth
  part of a trouser leg.
examples:
- He fell and scraped his knee on the gravel.
- She bent her knee and lowered herself into the chair.
