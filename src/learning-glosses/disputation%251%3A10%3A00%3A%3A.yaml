simpleMeaning: The formal putting of a stated claim and the stand against it, usually followed by a vote.
scope: The formal putting of a stated claim and the stand against it, usually followed by a vote; also
  called debate; not a quarrelsome speech act, a dispute with strong disagreement.
examples:
- Their disputation ran at dawn.
- The disputation was held at noon.
