simpleMeaning: a person who stays on their feet where others sit, such as a theatre-goer without a seat
  or a rider on a crowded bus or train
scope: A person on their feet where seats exist, not a person waiting in a line and not a seat itself.
examples:
- The standee gave up hope of a seat and stayed near the door.
- The bus was so full that every standee held on to a rail.
