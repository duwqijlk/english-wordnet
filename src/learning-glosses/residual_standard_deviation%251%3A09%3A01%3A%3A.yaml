simpleMeaning: This number judges how close values worked out from a straight line are to the true ones,
  and how far the points spread from that line.
scope: It belongs with other measures of spread, but it is the one that deals with points round a straight
  line and with values worked out from that line.
examples:
- A residual standard deviation of 0.35 meant most of the guesses made from the line were close to the
  true values.
- When the residual standard deviation grew, the line's guesses moved further from the true values.
