scope: A bright red fungus from Europe with a fruit body shaped like a small bowl; fairy cup is another
  name for this sense, not a red flower and not a cup used for drinking.
examples:
- The blood cup grows on damp wood in spring.
- We found a blood cup with a bright red bowl.
