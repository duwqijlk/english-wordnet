simpleMeaning: having no taste or flavor, and no sharp, strong taste
scope: 'Also called flat, bland, insipid, flavorless and flavourless: this is about food or drink with
  no taste. It is not the sense about a person or thing that is dull and has no life or interest.'
examples:
- The soup was vapid and needed salt and spices.
- He took a sip of the vapid tea and put the cup down.
