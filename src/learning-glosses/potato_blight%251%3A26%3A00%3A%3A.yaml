simpleMeaning: A sickness that attacks the crop of a starchy root vegetable and spoils it
scope: This is a sickness that attacks the crop of a starchy root vegetable; potato disease, potato mildew,
  potato mold and potato murrain are other names for this sense, not a sickness of grain, and not the
  yellow dwarf sickness of the same crop.
examples:
- Potato blight ruined half the crop that year.
- Farmers feared potato blight after the wet summer.
