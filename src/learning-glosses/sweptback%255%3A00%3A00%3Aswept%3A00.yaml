simpleMeaning: sloping toward the rear from the place where it joins the body, most of all the wings of
  a plane
scope: This is a wing or other part that slopes toward the rear from where it joins the body; not a wing
  that sticks straight out and not one that slopes forward.
examples:
- The jet's sweptback wings angled toward the tail.
- Sweptback wings slope toward the rear of the plane.
