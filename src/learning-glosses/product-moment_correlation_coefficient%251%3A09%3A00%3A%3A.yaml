simpleMeaning: the way most often used to work out how closely two things that change together in a straight
  line are linked
scope: The way most often used to work out how closely two things that change together in a straight line
  are linked; not a way that only ranks things in order, and not a guess about why they change together.
examples:
- The product-moment correlation coefficient showed the two sets of marks rose together.
- She worked out the product-moment correlation coefficient for height and weight.
