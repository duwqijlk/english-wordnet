simpleMeaning: Small white flowers and red fruit grow on this plant of North America and northern Eurasia,
  green all year and spreading flat; its leaves turn red in autumn.
scope: Also called bear's grape, common bearberry, creashak, mealberry, mountain box, red bearberry, sand
  berry, sandberry and wild cranberry, this is a low plant with small white flowers and red fruit, not
  a tall shrub with blue fruit.
examples:
- Hog cranberry grows low across the ground.
- We found hog cranberry with red fruit in autumn.
