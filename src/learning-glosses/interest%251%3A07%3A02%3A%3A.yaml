simpleMeaning: a quality that makes people want to look at or pay attention to something, often because
  it is unusual or exciting
scope: This is not money paid for a loan or a share in a company; it is the quality in something that
  catches attention.
examples:
- The old photographs have a special interest for historians.
- The case attracted great interest in the press.
