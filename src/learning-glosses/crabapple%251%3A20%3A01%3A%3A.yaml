simpleMeaning: one of many kinds of wild apple tree, usually with small sour fruit
scope: This is the wild tree itself, not the small sour fruit on its own and not a kind grown in gardens
  for red fruit or flowers.
examples:
- A crabapple grew by the fence and flowered in spring.
- The old crabapple tree gave small sour fruit each year.
