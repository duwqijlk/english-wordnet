senseId: 'tornado_lantern%1:06:00::'
synsetId: 03555077-n
simpleMeaning: A holder for a flame with a glass tube round it and a holed metal top that keeps strong
  wind off it, fed with oil.
scope: Also called a hurricane lamp, a hurricane lantern, a storm lamp and a storm lantern, this is an
  oil light with a glass tube round the flame, not a light with the flame left open to the wind.
examples:
- We lit the tornado lantern before the wind rose.
- She carried the tornado lantern out into the gale.
