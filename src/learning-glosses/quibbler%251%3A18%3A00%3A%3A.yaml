simpleMeaning: A person who argues by picking at small unimportant points
scope: A person who argues over small points; also called caviler, caviller and pettifogger, not a person
  who argues a strong case.
examples:
- The quibbler held up the meeting with small objections.
- No one liked the quibbler and his endless small points.
