simpleMeaning: Tiny living things in the soil that turn one kind of nitrogen salt into another kind of
  nitrogen salt.
scope: Tiny living things in the soil that turn one kind of nitrogen salt into another kind of nitrogen
  salt, with nitric bacteria as another name for this sense, not the soil germs that turn ammonia into
  a nitrogen salt and not a plant.
examples:
- Nitrobacteria in the soil change nitrites into nitrates.
- Nitrobacteria turn one nitrogen salt into another in the soil.
