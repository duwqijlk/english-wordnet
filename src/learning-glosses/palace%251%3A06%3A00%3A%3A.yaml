simpleMeaning: the official home of a very important person, such as a king or queen
scope: This is the official home of a ruler, not a large fine house owned by any rich person and not a
  castle built for defence in war.
examples:
- The king lives in a palace in the capital city.
- Guards stand at the gates of the palace all day.
