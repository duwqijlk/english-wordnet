senseId: 'sacrificial%3:01:00::'
synsetId: 03124939-a
simpleMeaning: used in or linked to a ceremony where an animal is killed or something is given as an offering
  to a god
scope: This describes a thing used in or linked to such a ceremony; it does not mean the everyday act
  of giving up something you value for a good reason.
examples:
- The priest placed the knife on the sacrificial stone.
- They led the sacrificial lamb to the place of worship.
