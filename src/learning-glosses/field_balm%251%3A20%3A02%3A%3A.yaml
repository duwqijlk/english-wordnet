simpleMeaning: a creeping, fragrant mint-family plant from Europe, with round leaves and small purple
  flowers, often grown in hanging baskets, naturalized in North America, sometimes classed in genus Nepeta.
scope: This is the trailing mint also called ground ivy, not the low-growing southern European herb that
  is the other field balm sense.
examples:
- Field balm trailed down from the hanging basket, its round leaves and small purple flowers spilling
  over the rim.
- The field balm in the hanging basket needed trimming before its stems reached the ground.
