senseId: 'specialise%2:41:00::'
synsetId: 02451029-v
simpleMeaning: To take up one area of work and stay with it, giving it most of your time.
scope: Also called specialize, this is giving your working time to one area, not a living thing changing
  into a new kind, and not fitting a thing to a set purpose or saying exactly what you mean.
examples:
- She specialises in mending old clocks.
- The baker specialises in rye bread.
