simpleMeaning: a sweet food, about the size of a cookie, made from brown sugar, butter and pecans
scope: A small sweet made with pecans, not a plain cookie and not a chocolate or other nut sweet.
examples:
- She bought a praline at the sweet shop in New Orleans.
- The pralines were soft and full of pecans.
