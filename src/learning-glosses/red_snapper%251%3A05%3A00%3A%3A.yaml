simpleMeaning: Along the Atlantic shores of North America and in the Gulf of Mexico lives a much-liked
  food fish whose head and body are rose-tinted.
scope: This is the living fish of the Atlantic and Gulf coasts, not its reddish flesh, which is a different
  sense of the same words.
examples:
- A red snapper swam off the Atlantic coast.
- Red snapper live along the shores of the Gulf of Mexico.
