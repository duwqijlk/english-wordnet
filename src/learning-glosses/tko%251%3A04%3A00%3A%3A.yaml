simpleMeaning: The end of a boxing match when the judge stops the fight because one fighter cannot go
  on
scope: A boxing result decided by the judge, also called a technical knockout; not a knockout in which
  the fighter is counted out on the floor, and not a win decided on points.
examples:
- The referee called a TKO in the third round.
- He lost by TKO after the cut over his eye got worse.
