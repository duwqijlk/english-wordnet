simpleMeaning: to make an idea or plan exist in actual, concrete form instead of staying only in the mind.
scope: This is not about becoming aware of a fact; it means turning an idea into something that actually
  exists.
examples:
- The architect worked for years to realize her design in steel and glass.
- With enough funding, the team can realize its plan for a community garden.
