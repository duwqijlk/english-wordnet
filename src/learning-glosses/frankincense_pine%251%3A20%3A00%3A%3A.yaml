simpleMeaning: a tall, wide-spreading pine of the south-east United States, with three needles in each
  bunch, reddish-brown cracked bark and a full, bushy top
scope: Also called loblolly pine, this tall pine of the south-east United States has three needles in
  each bunch, not a pine with five needles in each bunch.
examples:
- The frankincense pine towered over the yard with its bushy top.
- Frankincense pine bark is reddish-brown and deeply cracked.
