simpleMeaning: A meeting of the Catholic Church in Trento, held in three sittings from 1545-1563, condemned
  the teaching of Martin Luther and reformers, redefined doctrine, ended abuses and strengthened the papacy.
scope: A meeting of the Catholic Church in the 1500s about Luther's teaching; not a meeting of Protestant
  reformers and not a later church meeting.
examples:
- The Council of Trent met in three sessions.
- The Council of Trent condemned Luther's teaching.
