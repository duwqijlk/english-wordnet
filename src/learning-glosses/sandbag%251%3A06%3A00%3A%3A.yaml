simpleMeaning: a bag full of sand, used as a weapon, to build walls, or as a heavy weight to keep something
  steady
scope: A bag full of sand used as a weapon, for walls, or as a heavy weight. This is not the verb senses,
  such as hiding how well you can play a game to trick others, or using bags like this to protect a place.
examples:
- Soldiers put each sandbag on top of another to make a wall.
- A sandbag hung from the rope to keep the sign steady.
