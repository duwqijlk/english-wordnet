simpleMeaning: A chemical process that joins hydrogen atoms to an oil that still has room for more.
scope: A chemical process that joins hydrogen atoms to an oil that still has room for more, not oxidation
  and not the finished saturated fat.
examples:
- Food producers use hydrogenation to keep fat from becoming rancid.
- Hydrogenation turns liquid oils into solid fats.
