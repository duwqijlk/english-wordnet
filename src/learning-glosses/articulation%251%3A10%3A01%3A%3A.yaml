simpleMeaning: Saying what one thinks or feels in words that hang together and make sense.
scope: Also called voice, saying what one thinks or feels in words that hang together and make sense,
  not the shaping of speech sounds and not the joint where two bones meet.
examples:
- The articulation of her feelings took her a long time.
- His articulation of the plan left no room for doubt.
