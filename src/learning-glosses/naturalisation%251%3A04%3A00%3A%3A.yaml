simpleMeaning: The legal process by which a person from another country is given citizenship.
scope: The process by which a person from another country gains citizenship, not a visit or a work permit;
  also called naturalization.
examples:
- After five years abroad, he applied for naturalisation.
- Her naturalisation made her a citizen of her new country.
