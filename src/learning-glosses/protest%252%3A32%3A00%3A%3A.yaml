simpleMeaning: to say words that show you do not agree with something
scope: The verb sense of saying words that show you do not agree; not a noun for a formal statement, and
  not saying in a formal way that something is true.
examples:
- The crowd protested loudly when the price went up.
- She protested against the new rule at the meeting.
