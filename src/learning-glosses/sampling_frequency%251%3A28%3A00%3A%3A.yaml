simpleMeaning: In telecommunication, how often a signal that keeps changing is read
scope: How often a changing signal is read, not how loud the signal is and not the signal itself.
examples:
- The sampling frequency sets how often the signal is read.
- A higher sampling frequency gives a clearer copy of the sound.
