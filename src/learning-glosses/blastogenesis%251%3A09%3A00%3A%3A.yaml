simpleMeaning: The idea that traits passed down from parents travel in the living stuff that makes new
  life.
scope: The idea that traits passed down from parents travel in the living stuff that makes new life, not
  the idea that traits come from use and not the study of how babies grow.
examples:
- He wrote about blastogenesis in his book on heredity.
- Blastogenesis says traits pass down in the living stuff that makes new life.
