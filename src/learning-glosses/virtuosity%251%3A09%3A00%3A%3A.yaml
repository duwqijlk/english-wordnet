simpleMeaning: a very high level of skill, ease and style shown by a person who has fully mastered an
  art
scope: This is the high skill itself, shown in a performance. It is not the person who shows it, and not
  a normal level of skill that is just good enough.
examples:
- Her virtuosity on the violin amazed the crowd.
- The pianist's virtuosity showed in the fast, hard parts of the piece.
