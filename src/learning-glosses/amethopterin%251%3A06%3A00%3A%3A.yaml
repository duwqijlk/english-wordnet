simpleMeaning: A toxic drug that blocks the action of folic acid and so slows cell growth, used to treat
  some cancers, psoriasis and rheumatoid arthritis.
scope: A medical term for a toxic drug that works against the vitamin folic acid and so slows cell growth,
  given for some cancers, psoriasis and rheumatoid arthritis. It is not folic acid itself, which the body
  needs.
examples:
- Doctors gave her amethopterin to slow the growth of the tumor.
- Low doses of amethopterin are sometimes prescribed for rheumatoid arthritis.
