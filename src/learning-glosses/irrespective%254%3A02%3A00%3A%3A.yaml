simpleMeaning: in spite of everything, and with no thought for the bad points that come with it
scope: 'Also called regardless, and another name for it is disregarding: it means in spite of everything,
  not stopping because of the bad points.'
examples:
- Irrespective of the cost, they finished the work.
- She went ahead irrespective of the warnings.
