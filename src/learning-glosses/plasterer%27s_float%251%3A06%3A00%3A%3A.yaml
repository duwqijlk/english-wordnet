simpleMeaning: A hand tool with a flat face, used to make the surface of plaster, cement or stucco smooth
  and even
scope: A hand tool with a flat face for smoothing and finishing plaster, cement or stucco; float is another
  name for this sense, and this is not a trowel for spreading the mix.
examples:
- He smoothed the fresh plaster with a plasterer's float.
- She used the plasterer's float to finish the cement surface.
