simpleMeaning: an act of cleaning something to take out matter that has settled in it or other unwanted
  matter
scope: 'Also called purge: an act of cleaning something out, not the sense that means serving to clear
  a person of sin.'
examples:
- The purging of the water tank removed the sand and dirt at the bottom.
- They carried out a purging of the pipes to clear out unwanted matter.
