simpleMeaning: Flying creatures with thin, skin-like front wings and back wings
scope: A bug with thin front and back wings, also called a homopterous insect; not a bug with hard wing
  covers, and not a fly with only one pair of wings.
examples:
- Aphids are homopterans, with thin wings on front and back.
- The homopteran rested on the leaf, its clear wings folded flat.
