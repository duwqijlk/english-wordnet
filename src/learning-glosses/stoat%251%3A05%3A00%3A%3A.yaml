simpleMeaning: an animal called the ermine when it has brown fur in summer and a black end on its tail
scope: This is the ermine in its brown summer fur, with a black end on its tail. It is not the name for
  the same animal in its winter fur.
examples:
- A stoat ran across the field, its brown coat easy to see in the summer grass.
- Even in summer, the stoat's tail still has a black tip.
