simpleMeaning: a bomb made to start fires, and that works best on things that burn easily, such as fuel
scope: 'Also called firebomb: this is the bomb itself, not the describing word for a thing that can catch
  fire by itself or cause fires, and not the word for burning property on purpose.'
examples:
- They dropped incendiaries on the town, and many roofs caught fire.
- An incendiary was found near the fuel tanks before it could go off.
