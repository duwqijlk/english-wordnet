simpleMeaning: A vine with no leaves, living off other plants, with dense clusters of small white bell-shaped
  flowers on orange-yellow stems that wind around clover or flax.
scope: 'Also called love vine: a leafless vine, not a true vine with leaves, and not a weed of open ground.'
examples:
- Cuscuta gronovii twined around the clover.
- Cuscuta gronovii has no leaves of its own.
