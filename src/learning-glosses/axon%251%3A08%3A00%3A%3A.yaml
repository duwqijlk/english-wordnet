simpleMeaning: a long thin thread that carries signals away from the main part of a nerve cell
scope: 'Also called axone: a long thread that carries signals away from a nerve cell, not the short threads
  that take signals in and not the main part of the cell itself.'
examples:
- The signal raced along the axon to the next nerve cell.
- A cut axon can no longer carry signals away from its cell.
