senseId: 'shine%2:42:00::'
synsetId: 02618011-v
simpleMeaning: For light or sound, to arrive at something and either touch it or appear to, as seen or
  heard.
scope: Another name for the sense shared with 'strike' and 'fall', where light or sound reaches something;
  not the sense of a surface being bright, nor polishing one.
examples:
- The light from the window shone on her face.
- The sun shone on the fields.
