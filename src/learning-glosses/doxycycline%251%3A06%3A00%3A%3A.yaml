simpleMeaning: a medicine that fights many kinds of infection, made from tetracycline, a drug that kills
  germs
scope: A medicine that fights many kinds of infection, not a medicine for one sickness only and not a
  drug that merely eases pain.
examples:
- The doctor gave her doxycycline for the chest infection.
- He took doxycycline each morning until the infection cleared.
