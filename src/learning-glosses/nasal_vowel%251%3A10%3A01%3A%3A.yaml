simpleMeaning: In phonetics, a speech sound made with the soft part at the back of the mouth lowered,
  so air comes out through the nose as well as the mouth.
scope: In phonetics, a speech sound made with the soft part at the back of the mouth lowered, so air comes
  out through the nose as well as the mouth; not a speech sound made through the mouth alone and not a
  consonant.
examples:
- French has nasal vowels that English does not have.
- The nasal vowel in the word is made with air through the nose.
