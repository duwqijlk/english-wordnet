simpleMeaning: A writing system in which each sign stands for a syllable, used for Sanskrit and Hindi
scope: This is a writing system for Sanskrit and Hindi in which each sign stands for a syllable; Devanagari,
  Nagari and Nagari script are other names for it, and it is not a system in which each sign stands for
  a single sound.
examples:
- Hindi is written in Devanagari script.
- The book prints the prayer in Devanagari script.
