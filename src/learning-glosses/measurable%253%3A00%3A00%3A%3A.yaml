senseId: 'measurable%3:00:00::'
synsetId: 01502253-a
simpleMeaning: able to have its size, amount, or number found
scope: This describes a thing whose size, amount, or number can be found; it is not the act of finding
  that size, amount, or number itself.
examples:
- The drug had a measurable effect on blood pressure.
- There was no measurable change in temperature during the night.
