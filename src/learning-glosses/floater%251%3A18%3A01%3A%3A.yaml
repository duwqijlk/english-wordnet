senseId: 'floater%1:18:01::'
synsetId: 10764201-n
simpleMeaning: A person with no fixed home and no clear way to live, who moves from place to place.
scope: Also called vagrant, vagabond, or drifter, this is a person with no fixed home and no clear way
  to live, not a paper whose rate of interest shifts, not a policy that covers goods wherever they are,
  not the spots seen before the eyes, not a voter who votes in more than one place, not a thing that floats,
  and not a swimmer who floats in the water.
examples:
- The floater slept in doorways and moved on each week.
- Work was scarce, and the floater drifted from town to town.
