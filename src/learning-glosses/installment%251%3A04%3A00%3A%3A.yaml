simpleMeaning: the act of putting something, such as a piece of equipment, in place and getting it ready
  to use
scope: 'Also called installation, installing and instalment: the act of putting equipment in place, not
  one part payment for something and not one part of a story or show.'
examples:
- The installment of the new heating system took all morning.
- After the installment of the software, the computers were ready to use.
