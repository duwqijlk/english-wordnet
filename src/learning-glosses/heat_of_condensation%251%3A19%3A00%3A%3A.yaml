senseId: 'heat_of_condensation%1:19:00::'
synsetId: 11491759-n
simpleMeaning: The warmth given out by a fixed amount of gas at its boiling point as it turns into a liquid.
scope: Warmth given out when gas turns back into a liquid, not the warmth taken in when a liquid turns
  to gas and not the warmth of a hot gas.
examples:
- The heat of condensation warmed the cold pipes as the steam turned to water.
- Engineers used the heat of condensation to heat the building.
