simpleMeaning: a weak pump in the chest that can not move enough blood, so liquid builds up in the flesh
scope: This is a weak heart pump that lets liquid build up in the flesh, not a heart that stops at once
  and not a strong heart that moves blood well.
examples:
- He has congestive heart failure, so his legs stay swollen.
- Doctors treat congestive heart failure with drugs that help the heart pump.
