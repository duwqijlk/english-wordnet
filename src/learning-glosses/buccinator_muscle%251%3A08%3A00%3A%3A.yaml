simpleMeaning: A band of flesh in the cheek that flattens the cheek and pulls back the corner of the mouth.
scope: A band of flesh in the cheek that flattens the cheek and pulls back the corner of the mouth; cheek
  muscle and musculus buccinator are other names for this sense, not the jaw muscle and not the lip muscle.
examples:
- The buccinator muscle helps you blow out a candle.
- Chewing uses the buccinator muscle on each side.
