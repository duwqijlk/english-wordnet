synsetId: 04151847-n
simpleMeaning: A picture that shows something as it is seen, made by a process such as drawing or photography.
scope: This is a drawn or photographed image of something seen, not the painted stage structures that
  suggest a place (the other sense of this word), not the real place where an action happens, not an incident
  real or imagined, not the sight of a region itself, not a film's run of shots forming one unit of action,
  not a situation treated as an observable object, not one section of a play or performance, not a burst
  of bad temper, and not the surrounding setting in which something happens.
examples:
- She painted a quiet scene of the harbor at dawn.
- He framed the scene he had sketched and hung it in the hall.
