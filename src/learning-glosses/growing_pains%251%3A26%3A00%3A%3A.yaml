simpleMeaning: Aching in the muscles or joints that children at times feel, often put down to fast growth.
scope: Aching in the muscles or joints that children at times feel, often put down to fast growth, not
  a broken bone and not a fever.
examples:
- She had growing pains in her legs when she was nine.
- Growing pains often come at night after a busy day.
