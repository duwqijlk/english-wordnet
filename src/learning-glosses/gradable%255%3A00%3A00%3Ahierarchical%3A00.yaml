simpleMeaning: A thing is this when it can be given a place in a list by how good, how high, or how big
  it is
scope: Something that can be put in order by how good, how high, or how big it is, not something that
  has already been put in order and not something that cannot be put in order.
examples:
- The teacher said the word 'big' is gradable, since one thing can be bigger than another.
- Tall is a gradable word because we can say taller and tallest.
