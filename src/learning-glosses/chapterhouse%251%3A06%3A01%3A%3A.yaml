scope: A building joined to a house of monks or a large church, used as a meeting place, not the church
  itself and not a monk's own room.
examples:
- The monks gathered in the chapterhouse each morning to plan the day.
- The chapterhouse stands beside the cathedral, joined to it by a short passage.
