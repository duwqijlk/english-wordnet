simpleMeaning: a piece that copies how someone writes or works, or twists it, usually to make people laugh
scope: This is a piece that copies or twists how someone writes or works, usually to make people laugh;
  mockery, parody, takeoff, travesty, burlesque, spoof, lampoon, pasquinade, put-on and send-up are other
  names for this sense, and it is not a serious copy or a plain insult.
examples:
- The sendup of the detective show was the funniest part of the evening.
- She wrote a sendup of her teacher's long lectures.
