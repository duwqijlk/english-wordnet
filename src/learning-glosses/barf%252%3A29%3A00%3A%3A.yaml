simpleMeaning: to throw up what is in your stomach through your mouth
scope: 'Also called sick, cat, cast, vomit, spew, puke, chuck, purge, retch, honk, disgorge, regurgitate,
  and upchuck: to throw up what is in your stomach. Not to eat or drink.'
examples:
- He felt sick on the bus and barfed into a bag.
- The dog barfed on the floor after eating too fast.
