simpleMeaning: To force a group of people to live in one shut-off part of a town
scope: 'Also called ghettoize: to force a group to live in one shut-off part of a town; not to move people
  to a new town and not to lock people in a prison.'
examples:
- The rulers ghettoised the whole community in one quarter.
- Families were ghettoised and cut off from the rest of the town.
