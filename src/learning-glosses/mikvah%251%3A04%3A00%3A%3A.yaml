simpleMeaning: a Hebrew bath that Orthodox Jews take on set days, as before the Sabbath or after a period,
  to make the body clean in a holy way
scope: A bath for holy washing in Jewish practice, not a bath for washing off dirt or for fun.
examples:
- She went to the mikvah before the Sabbath began.
- After her period, she went to the mikvah for the holy bath.
