simpleMeaning: going against the rules of good taste, and lacking taste or beauty
scope: Going against the rules of good taste and lacking beauty; unaesthetic is another name for this
  sense, not mere plainness and not a lack of skill.
examples:
- Her inaesthetic spectacles clashed with her smart dress.
- The inaesthetic design spoiled the look of the room.
