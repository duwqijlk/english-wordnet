scope: A plant of California grown for its white flowers in long bunches, also called woodland star, Lithophragma
  affine and Lithophragma affinis.
examples:
- Tellima affinis grows in the garden with white flowers in long bunches.
- The Tellima affinis by the wall has petals that spread wide.
