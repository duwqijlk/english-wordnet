simpleMeaning: Tricks that make a person believe something false, usually to get money from that person
scope: 'Also called trickery, guile, wile and chicanery: tricks used to cheat a person, usually for money,
  not wild or harmful behavior that annoys others.'
examples:
- His shenanigans tricked many people out of their savings.
- The company's shenanigans were meant to trick buyers into paying more.
