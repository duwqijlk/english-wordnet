simpleMeaning: In philosophy, the belief that what feels right is the only test of what is good.
scope: In philosophy, the belief that feeling alone tests what is good, not the news use of shocking stories
  to please coarse tastes, not the stories themselves, and not the belief that all knowledge comes from
  experience.
examples:
- His sensationalism held that feeling alone could judge what is good.
- The lecture attacked sensationalism as a poor guide to right and wrong.
