simpleMeaning: having an allergy, or a strange or too strong reaction to something, especially to one
  thing in particular
scope: 'Also called allergic and sensitized: having too strong a reaction to one thing, not just being
  easily upset in your feelings.'
examples:
- He is hypersensitive to pollen and sneezes all spring.
- Her skin is hypersensitive to this soap.
