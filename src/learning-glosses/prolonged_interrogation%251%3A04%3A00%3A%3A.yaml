simpleMeaning: Long questioning that goes on for hours and is used to hurt a person in the mind
scope: Long questioning used as a kind of hurt in the mind, not a short set of questions, not a beating,
  and not a test of what a person knows.
examples:
- After the prolonged interrogation, he could not sleep.
- The long hours of prolonged interrogation left her worn out and afraid.
