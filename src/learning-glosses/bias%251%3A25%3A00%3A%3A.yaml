simpleMeaning: a line or cut across cloth that meets a side at a slant, not at a square corner
scope: A line or cut across cloth at a slant, also called diagonal; not a one-sided feeling and not the
  slant itself.
examples:
- She cut the cloth on a bias to make the skirt fall well.
- The bias of the fabric made the seam stretch.
