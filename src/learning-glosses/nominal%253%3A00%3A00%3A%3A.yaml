simpleMeaning: about an amount or a rate that is not changed to show the effect of prices rising over
  time
scope: About an amount or a rate before rising prices are taken into account; not about nouns or word
  groups, not about names, and not meaning very small.
examples:
- They reported the nominal GDP for last year.
- The nominal interest rate was five percent, before rising prices were considered.
