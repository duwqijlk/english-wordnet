simpleMeaning: The measuring of pressure inside the eye, by finding how much force is needed to make a
  small dent in the front of the eye
scope: The measuring of pressure inside the eye, not a test of sight and not an eye operation.
examples:
- The eye doctor used tonometry to check the pressure in her eye.
- Tonometry showed the pressure inside his eye was high.
