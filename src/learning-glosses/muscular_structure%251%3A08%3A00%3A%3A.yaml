simpleMeaning: all the flesh in a living thing that moves its body parts, taken as one whole
scope: All the moving flesh of a living thing taken as one whole; musculature is another name for this
  sense, not one single part that moves the body and not the bones.
examples:
- The muscular structure of the horse lets it run fast.
- Doctors study muscular structure to see how bodies move.
