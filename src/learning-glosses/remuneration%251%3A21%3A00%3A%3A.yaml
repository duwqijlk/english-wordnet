simpleMeaning: money that is paid to a person for work they have done
scope: This is the money paid for work itself, not the act of paying for goods or services, or making
  up for losses.
examples:
- Her remuneration includes a monthly salary and a yearly bonus.
- He asked for higher remuneration for the extra work.
