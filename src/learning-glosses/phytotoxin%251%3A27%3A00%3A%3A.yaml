simpleMeaning: Any stuff made by a plant that is much like a poison made by germs and found outside a
  cell.
scope: This is a poison-like stuff made by a plant; plant toxin is another name for this sense, not a
  poison made by an animal and not a poison made by germs inside a body cell.
examples:
- The phytotoxin in the leaves made the goats sick.
- Scientists found a phytotoxin that acts like a germ poison.
