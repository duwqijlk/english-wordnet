simpleMeaning: In the outer layer of the brain, one part has an effect on how the body moves
scope: 'Also called an excitable area, a motor cortex or a motor region: in the outer layer of the brain,
  one part has an effect on how the body moves, not a part of the brain that takes in what the senses
  report and not a part that plans what to do.'
examples:
- Damage to the motor area left his right hand weak.
- The motor area sends signals that start a movement.
