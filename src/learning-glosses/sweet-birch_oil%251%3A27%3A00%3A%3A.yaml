simpleMeaning: Wintergreen gives this liquid chemical its strong smell; it is rubbed on the skin where
  muscles and joints ache a little.
scope: Birch oil and methyl salicylate are other names for it, a liquid chemical with a strong smell of
  wintergreen, rubbed on the skin where muscles and joints ache a little.
examples:
- Rubbed on the knee, the sweet-birch oil eased the ache.
- A little sweet-birch oil on the sore joint eased the ache.
