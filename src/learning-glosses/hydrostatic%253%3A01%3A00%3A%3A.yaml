simpleMeaning: To do with liquids or gases at rest, or the pushes they give out or pass on.
scope: To do with liquids or gases at rest, or the pushes they give out or pass on, not hydrokinetic and
  not hydrodynamic.
examples:
- Hydrostatic pressure holds the water in the dam.
- The hydrostatic test checked the tank for leaks.
