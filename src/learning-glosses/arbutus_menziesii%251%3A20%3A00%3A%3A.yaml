simpleMeaning: A tree of the Pacific coast of North America, green all year, with shiny tough leaves and
  orange-red berries good to eat; wood used for furniture and bark for tanning.
scope: Also called madrona, madrono, and manzanita; a tree of the Pacific coast of North America that
  keeps its leaves all year, distinct from other coast trees that lose their leaves in winter.
examples:
- Arbutus menziesii keeps its glossy leaves all winter.
- We ate the orange-red berries of Arbutus menziesii.
