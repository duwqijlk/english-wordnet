simpleMeaning: A woody plant that loses its leaves in winter, of the group called Quercus, with acorns
  and leaves that have round parts along the sides
scope: A woody plant that loses its leaves in winter, of the group called Quercus, with acorns and leaves
  that have round parts along the sides, with oak as another name for this sense; not a plant that keeps
  its leaves all year, and not a bush.
examples:
- The oak tree in the park drops its leaves each fall.
- An oak tree stood at the edge of the field.
