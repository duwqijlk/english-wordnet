simpleMeaning: one of the parts of a flower, usually bright in color, that open out around its middle
scope: One of the bright parts that open out around the middle of a flower, not a leaf and not the stem.
examples:
- A pink petal fell from the rose.
- The petals of the tulip opened in the sun.
