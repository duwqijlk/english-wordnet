simpleMeaning: the act of a person chosen by the sides in a disagreement to decide it and give a judgment
  that the sides must accept
scope: This is the general act of a chosen person deciding, not the law use for a formal hearing to settle
  a fight between two sides.
examples:
- The two brothers took their disagreement over the land to arbitration.
- By arbitration, a person both sides trusted settled the fight about the money.
