simpleMeaning: A device for taking photographs, usually a closed box that light cannot enter, with a lens
  at the front and light-sensitive film inside at the back.
scope: This is not a piece of television equipment that sends live pictures; it is a device that records
  a still image on film.
examples:
- She packed her camera and two rolls of film for the trip.
- He took the camera out of its case and loaded a new roll of film.
