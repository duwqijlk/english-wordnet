senseId: 'cipher%1:23:00::'
synsetId: 13762308-n
simpleMeaning: an amount of no importance, or not any single thing at all
scope: This sense means an amount of no importance, also called nothing, zero, zip, naught, aught, nil,
  nix, nada, null, cypher, zilch, goose egg and zippo. It is not the number used in math work, and not
  the act of working out a math sum.
examples:
- Our team's score was a cipher, not a single point.
- All his hard work ended in a cipher, an amount of no worth.
