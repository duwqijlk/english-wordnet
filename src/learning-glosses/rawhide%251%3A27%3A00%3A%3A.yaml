simpleMeaning: animal skin, especially from cattle, that has not been made into leather; cut into strips,
  it is used for whips and ropes
scope: This is animal skin not yet made into leather, not finished leather and not a whip or rope made
  from it.
examples:
- The chair seat was woven from strips of rawhide.
- He tied the bundle with a strong piece of rawhide.
