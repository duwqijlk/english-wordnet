simpleMeaning: A single-season woody vine from Asia, bearing long clusters of purple flowers and densely
  hairy pods, which southern US farmers use as fodder and to enrich the soil.
scope: The Asian vine grown as fodder and soil improver; not its pods and stinging hairs, sold separately
  as a worm treatment.
examples:
- Cowage covered the fence with purple flower clusters and hairy pods.
- Farmers in the South planted cowage to improve tired soil.
