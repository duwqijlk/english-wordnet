senseId: 'defensive_attribution%1:09:01::'
synsetId: 92443581-n
simpleMeaning: A leaning to blame people who suffer for their bad luck, so that one feels less likely
  to suffer in the same way.
scope: A leaning to blame people who suffer for their bad luck, so one feels less likely to suffer the
  same way; not sympathy and not justice.
examples:
- Defensive attribution makes people blame the victim.
- His defensive attribution led him to say she had brought it on herself.
