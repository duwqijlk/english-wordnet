senseId: 'formalize%2:41:00::'
synsetId: 02484525-v
simpleMeaning: to make something official, or to make it follow a set way of doing things
scope: Formalise is another name for this sense. This is making something official, or making it follow
  a set way of doing things; it is not making something allowed by law.
examples:
- The club formalized its rules by writing them down and voting on them.
- They formalized the meeting by setting a time, a place, and a list of things to talk about.
