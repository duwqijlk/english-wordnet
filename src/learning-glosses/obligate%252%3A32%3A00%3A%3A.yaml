simpleMeaning: to put a person under a duty, so they feel they must do something or owe something
scope: 'Also called hold, bind, or oblige: putting a person under a duty so they feel they must do something
  or owe something, not setting money aside to meet a duty.'
examples:
- The contract obligates him to finish the work by June.
- Her promise obligates her to help them.
