simpleMeaning: Talk that sounds impressive but means nothing, or speech that is insincere or exaggerated.
scope: This is worthless or insincere talk, not moving air, not breath, and not the act of tightening
  a spring in a clock.
examples:
- Most of what the salesman said was just wind.
- Don't listen to him; it's all wind and no substance.
