simpleMeaning: a disease of joining tissue that gets worse over time, with small lumps along the arteries;
  the lumps may block an artery and cut down blood flow to that part
scope: 'Also called polyarteritis nodosa: a disease that gets worse over time, with small lumps along
  the arteries, not a single blocked artery and not a short illness.'
examples:
- Periarteritis nodosa causes small lumps along the arteries.
- The doctor said the periarteritis nodosa was cutting down blood to her hand.
