simpleMeaning: A very old flat-bodied winged bug, used by fishermen as bait, whose young in water breathe
  through gills and eat other living things, living under stones.
scope: Also called plecopteran and stonefly, this is a very old flat-bodied winged bug, used by fishermen
  as bait, whose young in water breathe through gills and eat other living things, living under stones,
  where plecopteran is an old sort of winged insect with a flat body which fishermen use for bait, its
  young in water having gills, eating other creatures and living under stones.
examples:
- The stone fly is good bait.
- Fishermen use the stone fly as bait.
