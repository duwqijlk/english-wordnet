simpleMeaning: An upright blueberry of the west United States, with lone flowers and rather sour berries.
scope: An upright blueberry of the west United States, with lone flowers and rather sour berries; also
  called mountain blue berry, mountain blueberry, or thin-leaved bilberry; not an upright European blueberry
  with lone flowers and blue-black berries, nor blue-black berries like American blueberries.
examples:
- Their bilberry grew on the hill.
- The bilberry was picked at dawn.
