simpleMeaning: A unit for the push felt on each bit of a face, equal to one newton on one square metre.
scope: This is a unit of pressure, also called pascal, not the short-lived metal and not a father.
examples:
- One Pa is one newton on one square metre.
- The gauge read 100 Pa.
