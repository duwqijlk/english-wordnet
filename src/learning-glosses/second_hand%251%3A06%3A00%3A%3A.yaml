simpleMeaning: the thin pointer on a clock or watch that moves round fastest, marking the passing of time
scope: The thin pointer on a clock or watch that moves round fastest, not the hour pointer and not the
  minute pointer; not a person who passes on news.
examples:
- The second hand swept round the dial.
- Watch the second hand to time the race.
