simpleMeaning: A device with a valve that sets how fast liquid flows through a channel.
scope: A device that controls how fast liquid flows through a channel; floodgate, head gate, penstock,
  sluice valve and sluicegate are other names for this sense, not a dam wall and not a tap on a pipe.
examples:
- The keeper opened the water gate to let more water through the sluice.
- Farmers closed the water gate when the fields had enough water.
