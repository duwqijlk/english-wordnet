simpleMeaning: Marks like a fine mesh cover a fruit with deep green flesh inside, the fruit of one kind
  of vine.
scope: Also called a net melon or a netted melon, this fruit of one kind of vine has marks like a fine
  mesh and deep green flesh, not the vine itself.
examples:
- The nutmeg melon had deep green flesh inside.
- A nutmeg melon hung from the vine.
