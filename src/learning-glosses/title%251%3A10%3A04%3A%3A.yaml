simpleMeaning: a legal paper that is signed, stamped with a seal, and formally handed over to transfer
  property and prove the holder's lawful right to own it.
scope: This is the deed or certificate that proves ownership, not a heading naming a statute or legislative
  bill, not the name of a book or other work, not a heading over a section of a text, not the status of
  being a champion, not a form of address such as Mr. or General, not an established or recognized right,
  not an informal right to something, not a noble rank, not the credits or dialogue written into a film
  or TV show, and not the verb senses meaning to give a title or to designate.
examples:
- The title to the house was handed over to the buyer at the closing.
- Keep the title in a safe place; it proves you own the car.
