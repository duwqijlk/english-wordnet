simpleMeaning: a round metal ring that lies flat, with a net hanging from it, that players try to throw
  the ball through
scope: This is the metal ring and net in the game, not a woven container for carrying things, not a score
  made by throwing the ball through it, and not the amount a container can hold.
examples:
- The ball went through the basket and fell through the net.
- She aimed at the basket and threw the ball.
