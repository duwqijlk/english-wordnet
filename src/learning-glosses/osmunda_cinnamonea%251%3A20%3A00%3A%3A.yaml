simpleMeaning: A fern of the New World whose woolly reddish-brown spore-bearing fronds rise in early spring
  and are later ringed by green fronds; the young fronds are edible while still uncurling.
scope: Also called cinnamon fern, fiddlehead, and fiddlehead fern; the young fronds are edible while still
  uncurling.
examples:
- The Osmunda cinnamonea sent up woolly fronds in early spring.
- We ate the young Osmunda cinnamonea fronds while they were still uncurling.
