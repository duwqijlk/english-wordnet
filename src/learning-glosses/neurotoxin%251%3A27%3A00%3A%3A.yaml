simpleMeaning: Any poison that harms the soft stuff that makes up the nerves.
scope: A poison that acts on nerve tissue, as in snake venom or shellfish.
examples:
- The snake's neurotoxin stopped the nerves from sending signals.
- A neurotoxin in the shellfish can numb the lips and hands.
