simpleMeaning: Out of the signals in the air it picks one, sorts the sound from it, and makes that sound
  loud enough to hear.
scope: Also called a radio, a wireless, a tuner, a radio receiver, or a radio set, it is the set that
  picks one signal out of the air and turns it into sound.
examples:
- Switch on the receiving set and a voice comes out of it.
- With a receiving set, you can hear what is sent through the air.
