simpleMeaning: one part of a molecule taken from toluene, a clear liquid, that can join to one other thing
scope: 'Also called benzyl and benzyl radical: one part of a molecule from toluene, not a whole molecule
  and not a group from a different liquid.'
examples:
- The benzyl group in the compound came from toluene.
- She drew the benzyl group with its one free link.
