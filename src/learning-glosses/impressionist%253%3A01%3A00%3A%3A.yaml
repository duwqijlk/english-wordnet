simpleMeaning: To do with the art style that shares its name, or like that style.
scope: Also called impressionistic, this is about the art style that shares its name; not the artist who
  follows that style.
examples:
- Her later work was impressionist, full of light and quick strokes.
- The music was impressionist, soft and dreamy.
