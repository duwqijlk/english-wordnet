simpleMeaning: A round disc of rough, hard stuff wears down and smooths what it is used on
scope: A round disc of rough stuff made to wear down and smooth what it is used on, also called emery
  wheel, not a flat sheet of sandpaper and not a cutting blade.
examples:
- He held the blade against the grinding wheel until the edge shone.
- Sparks flew from the grinding wheel as it smoothed the iron bar.
