senseId: 'asphyxiate%2:35:01::'
synsetId: 01478810-v
simpleMeaning: to make breathing hard for someone, or to block the way air goes in
scope: 'Also called choke, stifle, and suffocate: to make breathing hard or to block air going in, not
  the sense of taking all air away so a person cannot breathe at all, and not dying from having no air.'
examples:
- The thick smoke began to asphyxiate the workers trapped in the room.
- These fumes can asphyxiate a person by blocking the air to the lungs.
