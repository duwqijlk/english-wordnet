simpleMeaning: A tropical tree, usually coastal, sometimes grown as an ornamental for rounded heart-shaped
  leaves and showy yellow and purple flowers, yielding valuable pink to dark red wood and seed oil.
scope: This sense is the tropical coastal tree grown for its flowers, timber and seed oil; portia tree
  and seaside mahoe are other names for it, not separate plants.
examples:
- The bendy tree grew along the shore, its yellow and purple flowers bright against the leaves.
- Local carpenters value the bendy tree for its fine pink wood.
