simpleMeaning: A tooth doctor who treats illness of the soft inner part of a tooth and its nerve
scope: This is a tooth doctor who treats illness of the soft inner part of a tooth and its nerve, not
  a tooth doctor in general and not a gum doctor.
examples:
- The endodontist treated the illness in the soft inner part of her tooth.
- She saw an endodontist about the nerve in her tooth.
