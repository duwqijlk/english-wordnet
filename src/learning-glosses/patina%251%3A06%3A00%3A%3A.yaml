simpleMeaning: a thin layer of oxide (the stuff that forms on metal over a long time in air) that covers
  the surface of a metal, especially copper
scope: A thin layer on metal, especially copper, built up over a long time; not the shine on wood furniture
  that comes from age and use.
examples:
- The old copper roof now has a green patina.
- A brown patina covered the metal bowl after many years.
