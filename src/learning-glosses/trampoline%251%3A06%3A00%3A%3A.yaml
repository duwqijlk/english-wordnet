simpleMeaning: a strong cloth sheet fixed with springs to a metal frame, used in sport for jumping and
  turning in the air
scope: This is the full frame with a strong cloth sheet and springs, used for jumping and turning in the
  air, not a plain sheet and not a springboard.
examples:
- She bounced high on the trampoline and turned in the air.
- The children took turns jumping on the trampoline in the gym.
