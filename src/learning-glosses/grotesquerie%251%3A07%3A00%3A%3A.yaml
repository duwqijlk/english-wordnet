simpleMeaning: the quality of being not natural and strange, in a silly way that does not fit, or in a
  shape that is changed from what is true
scope: Also called grotesquery; this is the strange, not natural quality of a thing, not the strange thing
  itself.
examples:
- The grotesquerie of the old house made visitors stare.
- She wrote about the grotesquerie of the faces in the painting.
