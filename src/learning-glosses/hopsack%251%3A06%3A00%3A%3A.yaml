simpleMeaning: Clothes are made from this rough cotton or linen cloth, woven with wide gaps between the
  threads.
scope: It is also called hopsacking, the rough cotton or linen cloth with a loose weave that is used to
  make clothes.
examples:
- The hopsack jacket felt rough against his skin.
- She bought hopsack to make a dress.
