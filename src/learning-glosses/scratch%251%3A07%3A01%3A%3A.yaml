simpleMeaning: In golf, a handicap that gives a player no strokes.
scope: In golf, a handicap with no strokes allowed, not a mark of damage, a scraped patch of skin, or
  a starting line.
examples:
- He plays off scratch, so he receives no strokes from the field.
- A scratch handicap is rare among weekend players.
