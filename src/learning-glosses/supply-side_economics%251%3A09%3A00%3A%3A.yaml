simpleMeaning: the idea that the money system grows when making things costs less, and that rules should
  give makers more reason to use money and work to make more
scope: This is a view about keeping the cost of making things low to grow the money system, not a view
  that works through what buyers spend and not a set of rules for one firm.
examples:
- Supply-side economics says lower taxes on makers can wake up the whole money system.
- The book defends supply-side economics as a way to lift how much a country makes.
