simpleMeaning: 'Take ''monolingual'': its Greek start and Latin end come from two languages, joined to
  make a single word.'
scope: 'Also called loanblend and hybrid: a word made of bits from two languages, not a word taken whole
  from one language.'
examples:
- The word 'loan-blend' itself names words like 'monolingual', built from parts of two languages.
- A loan-blend takes its beginning from one language and its ending from another.
