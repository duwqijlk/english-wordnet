simpleMeaning: to shake with fast, small, unsteady moves
scope: 'Also called quiver and quake: a fast, small shaking movement, not one big shake and not a steady
  move.'
examples:
- His nostrils palpitated when he smelled the smoke.
- The small bird's wings palpitated weakly as it tried to fly.
