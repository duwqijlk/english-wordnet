simpleMeaning: A person given the power to act as sheriff when there is a crisis.
scope: A person given the power to act as sheriff in a crisis, not a member of a law-making body, and
  not any person who acts for others.
examples:
- The deputy took charge when the sheriff fell ill.
- Deputies were sworn in to keep order in the town.
