simpleMeaning: to live for a time in a room in someone else's home, paying for it; or to stay somewhere
  for a short time
scope: This is living in a room in someone else's home and paying for it, or staying somewhere for a short
  time. Not a small house at the gate of a large house, not a hotel, and not a small country house for
  short stays.
examples:
- She is lodging with a family near the school this term.
- We lodged in a small town for the winter.
