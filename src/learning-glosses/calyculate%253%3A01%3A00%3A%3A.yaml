simpleMeaning: having a small cup-shaped part at the base of a flower
scope: Having a small cup-shaped part at the base of a flower; calycled is another name for this sense;
  not a flower with no such part, and not one with a hood-like cover.
examples:
- The calyculate bloom shows a small cup beneath its petals.
- This calyculate plant is easy to spot by the small cup at the flower's base.
