simpleMeaning: Arab, Afghan, Persian, and Indian armies in early modern times fought with soldiers on
  riding animals with humps.
scope: Also called zamboorak, zamburak, zamburek, zumbooruck, and zumbooruk, this names the soldiers of
  early modern Arab, Afghan, Persian, and Indian armies who rode animals with humps.
examples:
- The camel cavalry rode ahead of the army.
- Arab armies used camel cavalry in early modern times.
