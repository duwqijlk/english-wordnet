simpleMeaning: not following accepted beliefs or rules
scope: Heretical is another name for this sense. This describes people or ideas that do not follow accepted
  beliefs or rules, not people or ideas that stay with what is accepted.
examples:
- He held dissident views about religion and would not follow the church's rules.
- The dissident group taught ideas that the leaders said were wrong.
