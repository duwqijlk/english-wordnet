simpleMeaning: a tall plant grown or kept mainly for the dark it gives under strong sun
scope: A tall plant grown mainly for its dark, not a plant grown for fruit and not a small bush.
examples:
- We sat under the shade tree to get out of the hot sun.
- They planted a shade tree near the porch so the yard stays cool in summer.
