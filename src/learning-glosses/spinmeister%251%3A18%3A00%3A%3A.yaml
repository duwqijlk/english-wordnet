simpleMeaning: A public relations person who puts a good light on what a firm, a political party or a
  well-known person says or does, to stop bad news
scope: A public relations person who puts a good light on what a firm, a political party or a well-known
  person says or does, to stop bad news; spin doctor is another name for this sense, not a news reporter
  and not a person who makes things up.
examples:
- The spinmeister put a good light on the party's words for the press.
- He is a spinmeister, paid to stop bad news.
