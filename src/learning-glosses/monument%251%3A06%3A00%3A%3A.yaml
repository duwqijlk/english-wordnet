simpleMeaning: a building or other structure put up to keep alive the memory of a person or an event
scope: 'Also called a memorial: a structure put up to remember a person or event, not a tomb and not a
  statue made only to look nice.'
examples:
- The town raised a monument to the soldiers who died in the war.
- Visitors left flowers at the base of the monument.
