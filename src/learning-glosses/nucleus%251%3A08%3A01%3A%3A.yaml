simpleMeaning: a mass of nerve cell bodies in the brain or spinal cord that can be picked out when the
  tissue is looked at closely
scope: This sense is a group of nerve cells in the brain or spinal cord, not the middle part of a cell,
  not the centre of an atom, and not the centre of a comet.
examples:
- The doctor pointed to a small nucleus of nerve cells deep inside the brain.
- Each nucleus in the spinal cord sends signals to a different part of the body.
