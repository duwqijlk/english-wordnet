simpleMeaning: a network arrangement in which all connected devices share one common connecting line.
scope: This is a way of laying out a network, not the metal conductor itself and not a passenger vehicle.
examples:
- The lab used a bus layout so every computer shared the same cable.
- In a bus network, a break in the main line can stop all traffic.
