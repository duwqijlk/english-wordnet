simpleMeaning: A plaything made of a board set on a middle support, ridden up and down by children at
  each end
scope: This is the playground board that goes up and down, not the unsteady rocking movement of the same
  name.
examples:
- The children took turns on the teeter in the playground.
- She sat on one end of the teeter while her brother sat on the other.
