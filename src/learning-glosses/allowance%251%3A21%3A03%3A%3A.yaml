simpleMeaning: money a company keeps back from its profits to cover a change in the worth of the things
  it owns
scope: Money a company holds back from profit to cover a change in what it owns is worth, not money paid
  back for costs and not a regular payment.
examples:
- The bank set aside an allowance for bad loans.
- The company raised its allowance after the value of its assets fell.
