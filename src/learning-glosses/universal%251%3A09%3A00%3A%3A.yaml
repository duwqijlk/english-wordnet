senseId: 'universal%1:09:00::'
synsetId: 05676203-n
simpleMeaning: a way of behaving or a pattern that is shared by everyone in one culture, or by all people
  everywhere
scope: A shared way of behaving found in a whole culture or in all people; not a rule found in all languages,
  and not the machine part that joins two turning shafts.
examples:
- Greeting guests with food is a universal in this culture.
- Some form of music seems to be a human universal.
