simpleMeaning: to put a frame of poles and boards around a building, so workers can reach high places
  and have something to stand on
scope: To put a frame of poles and boards around a building for workers, not the frame itself and not
  the platform from which people are put to death.
examples:
- Scaffold the building before painting it.
- They scaffolded the old church so the roof could be fixed.
