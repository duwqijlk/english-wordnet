simpleMeaning: A rite in the synagogue, usually at Pentecost, in which young Jews who have finished a
  course of study are taken in as adult members of the community
scope: A Jewish rite making young people adult members, not the Christian sacrament and not the act of
  making a thing valid.
examples:
- Her confirmation took place at Pentecost.
- The confirmation class studied Judaism for two years.
