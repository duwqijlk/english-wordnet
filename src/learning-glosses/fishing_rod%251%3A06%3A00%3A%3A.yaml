simpleMeaning: A pole of wood, steel or glass fibre, used to hold out the cord.
scope: A pole of wood, steel or glass fibre that holds out the cord; fishing pole is another name for
  this sense, not the cord itself, and not a short hand line.
examples:
- He cast the fishing rod into the lake.
- The fishing rod is made of light steel.
