simpleMeaning: An account made up on purpose that is not true, or is too unlikely to be believed
scope: 'Also called fiction: an invented account that is not true or too unlikely to be believed, not
  a tale of beings beyond the known world.'
examples:
- His excuse was a fable no one believed.
- The whole story turned out to be a fable.
