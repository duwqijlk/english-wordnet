simpleMeaning: a tool used by land measurers to find the angle of a slope or a rise
scope: A tool for measuring the angle of a slope or a rise, used by land measurers; clinometer is another
  name for this sense, not a tool for measuring magnetic dip and not a compass.
examples:
- The surveyor read the inclinometer before marking the slope.
- With the inclinometer, she found the hill rose at ten degrees.
