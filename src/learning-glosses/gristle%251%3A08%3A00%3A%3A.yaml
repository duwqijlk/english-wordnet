simpleMeaning: Tough, stretchy stuff in the body that mostly turns into bone in grown people.
scope: 'Also called cartilage: the tough, stretchy stuff in the body, not plain fat in meat and not hard
  bone itself.'
examples:
- He cut the gristle off the meat before cooking it.
- The chicken had a lot of gristle that was hard to chew.
