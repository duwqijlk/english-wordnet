simpleMeaning: A kind of tiny living thing found in soil and in rotting plant and animal matter, some
  kinds of which make drugs that kill germs
scope: This soil germ is also called hay bacillus, and is not a plant disease and not a medicine itself.
examples:
- The grass bacillus lives in rich soil.
- Scientists found the grass bacillus in rotting leaves.
