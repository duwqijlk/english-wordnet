simpleMeaning: Not able to move the body in a smooth, controlled way; a mark of a loss of body control,
  or brought on by it
scope: Not able to move the body in a smooth, controlled way, also called ataxic; not clumsy from tiredness
  and not weak from illness.
examples:
- His atactic walk made him stumble on the flat floor.
- The atactic movements of her hands made writing hard.
