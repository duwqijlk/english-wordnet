simpleMeaning: the system of actions a computer carries out, which lies behind the way the machine holds
  true-or-false values
scope: This is a computer's system of steps, not the study in philosophy of how we reason and not sound,
  fair judgment by itself.
examples:
- The computer's logic handles all the true-or-false checks in the program.
- A fault in the logic made the machine give the wrong answer.
