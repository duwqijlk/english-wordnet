simpleMeaning: any of many fish with spiny fins, from several groups of one large order of fishes
scope: Any of many spiny-finned fishes of one large order, not the narrower fresh-water fish caught for
  food and sport, not the fishes of America and Europe, and not a branch for resting on.
examples:
- Perch are common in the lake.
- He caught a perch with spiny fins.
