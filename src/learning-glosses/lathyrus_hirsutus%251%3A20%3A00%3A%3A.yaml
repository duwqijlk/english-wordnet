simpleMeaning: A weak-stemmed plant that lives one winter, from the Mediterranean lands, long settled
  in the south of the United States and grown to cover ground and feed farm animals
scope: A weak-stemmed winter plant, also called rough pea, singletary pea, wild winterpea and Caley pea;
  not a sweet pea and not a plant grown for its flowers.
examples:
- Lathyrus hirsutus covered the bare field through the winter.
- Farmers sow Lathyrus hirsutus to feed their animals.
