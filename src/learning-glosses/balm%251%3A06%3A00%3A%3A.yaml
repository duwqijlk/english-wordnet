simpleMeaning: A thick soft cream, usually with a medicine in it, put on the skin to heal or to calm a
  sore spot
scope: A thick cream put on the skin to heal or soothe, also called ointment and salve; not the sweet-smelling
  tree gum of the same name.
examples:
- She rubbed balm on her chapped hands.
- The balm eased the sting of the burn.
