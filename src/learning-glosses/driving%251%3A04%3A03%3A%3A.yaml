simpleMeaning: in golf, the act of hitting the ball off a small stand at the start of a hole with the
  long club used for the longest shots.
scope: This is not the act of operating a car, and not the adjective describing something with great force;
  it is only the golf stroke.
examples:
- His first drive off the tee landed on the fairway.
- A long drive can set up an easy second shot.
