simpleMeaning: A person who has or shows the soft care, warmth and love that fits a mother
scope: 'Also called maternal quality, maternity and motherliness: a person who has or shows the soft care,
  warmth and love that fits a mother, not a mother''s duties and not love in general.'
examples:
- Her maternalism showed in how she held the child close.
- People saw her maternalism in the warm way she cared for the young ones.
