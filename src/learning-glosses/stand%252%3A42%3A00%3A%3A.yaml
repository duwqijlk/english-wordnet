simpleMeaning: Keep your ground and refuse to give way, remain firm in place, or stay upright rather than
  falling.
scope: This is about holding firm on the spot or staying erect, not about measuring a certain height,
  taking a public side in a dispute, or the seating area at a stadium.
examples:
- The defenders stood their ground for six hours under heavy fire.
- The ancient pillars still stand upright, though the roof has gone.
