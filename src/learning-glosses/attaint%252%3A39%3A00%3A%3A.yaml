simpleMeaning: to judge a person guilty of a very serious crime and take away all their rights and their
  property
scope: In law, this is when a person is judged guilty of a very serious crime and loses all their rights
  and property. It is not bringing shame on a person, and not a simple fine or time in prison.
examples:
- After he was found guilty of treason, the man was attainted and lost his rights and his land.
- The court attainted the rebel, and his property was taken away.
