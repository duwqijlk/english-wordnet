simpleMeaning: A drug that fights viruses, sold as Retrovir, used to treat AIDS; its bad side effects
  can harm the liver and slow the bone marrow.
scope: 'Also called zidovudine, Retrovir and ZDV: a drug that fights viruses and treats AIDS, whose bad
  side effects can harm the liver and slow the bone marrow.'
examples:
- Her doctor prescribed AZT to treat her AIDS.
- AZT can harm the liver, so patients need blood tests.
