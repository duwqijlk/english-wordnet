simpleMeaning: a long, low area at the bottom of the ocean, with steep sides
scope: 'Also called deep: a long, low area at the bottom of the ocean. It is not the ditch dug in the
  ground to protect soldiers, and not the act of digging such a ditch.'
examples:
- A submarine went down to explore the ocean trench.
- The trench at the bottom of the ocean is the lowest place in the sea.
