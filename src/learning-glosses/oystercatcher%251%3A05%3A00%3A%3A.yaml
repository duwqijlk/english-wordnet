simpleMeaning: Shellfish and other sea food are what this black-and-white bird of the shore eats, with
  thick legs and a thick beak
scope: 'Also called oyster catcher: a black-and-white bird of the shore that lives by eating shellfish,
  not a gull and not a bird of inland waters.'
examples:
- The oystercatcher pecked at a shellfish on the wet sand.
- A pair of oystercatchers nested among the rocks above the shore.
