simpleMeaning: A material's hold against the flow of electric current, counted in ohms
scope: A material's hold against the flow of electric current, also called electric resistance, electrical
  resistance, impedance and resistance, and not a material that lets current flow with ease.
examples:
- The ohmic resistance of the wire turned much of the current into heat.
- He measured the ohmic resistance of the coil in ohms.
