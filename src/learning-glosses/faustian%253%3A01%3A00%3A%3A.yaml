simpleMeaning: Like Faust, above all in a hunger for worldly knowledge and power that can never be filled,
  even at the cost of what is good in the spirit.
scope: Like Faust, or Faustus, in a hunger for worldly knowledge and power that can never be filled, even
  at the cost of what is good in the spirit.
examples:
- Her Faustian bargain brought her fame but cost her peace of mind.
- A Faustian thirst for power drove him to sell all he held dear.
