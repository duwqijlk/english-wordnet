simpleMeaning: the longest distance a machine part that turns on a fixed point or slides back and forth
  can move when a turning part pushes it
scope: 'Also called throw and stroke: the longest move a machine part can make when pushed by a turning
  part, not the speed of the part and not a hit or blow.'
examples:
- The cam stroke of the press sets how far the arm travels.
- A longer cam stroke lets the piston move farther.
