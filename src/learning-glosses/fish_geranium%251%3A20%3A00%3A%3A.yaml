simpleMeaning: With white, pink, or red flowers, this upright geranium has wavy-edged leaves marked by
  a wide band of colour just inside the edge.
scope: Also called a bedding geranium or a zonal pelargonium, this is the upright geranium with wavy-edged
  leaves marked by a wide band of colour and white, pink, or red flowers.
examples:
- Her fish geranium bloomed with pink flowers.
- We planted a fish geranium with red flowers.
