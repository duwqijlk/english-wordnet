simpleMeaning: To make a picture of something with a pencil, chalk, or a similar tool on a surface.
scope: Producing a picture of something, not just leaving marks or lines on a surface, and not describing
  something in words.
examples:
- She drew the old church from memory, shading every window.
- He drew a map of the island on the back of an envelope.
