simpleMeaning: A broad term for any use of measuring ways to put numbers to the workings of the mind
scope: A broad term for measuring the workings of the mind with numbers; not a test of one skill and not
  a measure of the body.
examples:
- Mental measurement puts numbers to memory and thought.
- The test was an example of mental measurement.
