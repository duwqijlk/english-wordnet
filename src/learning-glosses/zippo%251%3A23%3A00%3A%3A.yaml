simpleMeaning: The word people use when the amount is none and there is not a single thing to name.
scope: Also called nothing, zero, zip, naught, aught, nil, cipher, nix, nada, null, cypher, zilch, and
  goose egg, this word means no amount or thing at all.
examples:
- After all that work, they got zippo for their trouble.
- I heard zippo about the plan from anyone.
