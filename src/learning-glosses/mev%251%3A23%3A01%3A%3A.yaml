simpleMeaning: A measure of energy, the work done by one electron sped up through a push of one million
  electron volts.
scope: 'Also called a megaelectron volt: a measure of energy, the work done by one electron sped up through
  a push of one million electron volts, not a measure of weight and not a measure of length.'
examples:
- One MeV is a tiny measure of energy.
- The particle had an energy of two MeV.
