simpleMeaning: a remark that makes a person or thing seem small or less important than they really are
scope: This is one remark of this kind, not the act of doing this, and not the word that describes such
  a remark.
examples:
- He made a belittling comment about her dress in front of everyone.
- Her belittling comment made him feel small and ashamed.
