simpleMeaning: Said of things that belong to those peoples, or have to do with their way of life or their
  tongues.
scope: Also called Indian, Amerind, and Amerindic, this word is about those peoples, their way of life,
  or their tongues, not the person sense.
examples:
- Native American religions differ from one people to another.
- She studied Native American languages at the university.
