simpleMeaning: A decorative strip in a color or material that stands out, added to something to make it
  look nicer.
scope: A decorative strip of contrasting color or material attached as an ornament; not a people group,
  an orchestra or pop dance group, a radio frequency range, a stripe or stripes of contrasting color in
  a pattern, a strip worn on the body, a loop that binds an object, a restraint, a bird's leg marker,
  a finger ring, an anatomical cord, a machine drive belt, or a verb (tying things together, fastening
  a ring to a bird's foot).
examples:
- The jacket had a band of red braid along each sleeve.
- A narrow band of gold trim edged the collar.
