synsetId: 02691302-n
simpleMeaning: A part of a plane that pushes against the air as it moves, giving force to lift or steer
  the plane in flight.
scope: Also called surface, aerofoil, and airfoil; a part of a plane that pushes against the air to lift
  or steer it, not the engine and not the body of the plane.
examples:
- The control surface moved to lift the nose.
- Ice on a control surface can spoil its lift.
