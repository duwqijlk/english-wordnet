synsetId: 01199748-n
simpleMeaning: in law, a court's second examination of how a case was conducted, especially when a higher
  court goes over the record.
scope: This is a higher court's second look at how a trial was run, not an accounting check on financial
  information, not a formal official inspection, not a fresh appraisal or evaluation, not a critical essay
  or article, not a periodical of criticism, not a summary of a longer discussion, not a follow-up medical
  examination, not a show with songs and sketches, and not practice meant to refresh the memory.
examples:
- The appeal led to a review of the trial judge's handling of the case.
- The supreme court agreed to conduct a review of the earlier proceedings.
