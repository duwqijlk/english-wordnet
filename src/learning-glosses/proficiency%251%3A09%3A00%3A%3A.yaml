senseId: 'proficiency%1:09:00::'
synsetId: 05651035-n
simpleMeaning: great skill in the basic parts of an activity, gained from much practice and from knowing
  those parts well
scope: This is skill in the basic parts of an activity, also called technique; it is not just knowing
  facts about it, and not one single way of doing a small job.
examples:
- Her proficiency at the piano grew after months of daily practice.
- This job needs real proficiency in the basic parts of the work.
