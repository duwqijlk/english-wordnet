senseId: 'incidental%3:00:00::'
synsetId: 01862869-a
simpleMeaning: Small or not important in itself, sometimes used with 'to', coming along with something
  bigger as a side effect or chance result
scope: A small side matter that comes with something bigger; incident is another name for this sense,
  not an expense, the noun sense of incidental.
examples:
- The road will bring other incidental advantages.
- She took on extra duties incidental to the job.
