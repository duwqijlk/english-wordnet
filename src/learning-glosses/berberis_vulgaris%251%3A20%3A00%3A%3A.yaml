simpleMeaning: An upright European bush that sheds its leaves each year, now growing wild across the United
  States, with bunches of juicy berries.
scope: An upright European bush with bunches of juicy berries, also called common barberry and European
  barberry; set apart from other barberry bushes and from other European bushes grown wild in America.
examples:
- Berberis vulgaris now grows wild across the United States.
- The bunches of juicy berries on Berberis vulgaris turn red in autumn.
