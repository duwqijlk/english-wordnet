simpleMeaning: A change in the genes starts, or comes faster, when a thing or a force in the world around
  acts on them
scope: Anything that can bring on a change in the genes or make such changes come faster, not the change
  itself and not a cure for it.
examples:
- X-rays are a mutagen that can change the genes of living cells.
- The lab tested the chemical to see if it was a mutagen.
