simpleMeaning: the strength of a liquid mix, shown in gram equivalents (units for counting how much of
  the thing mixed in can act with other things) for each liter
scope: The strength of a liquid mix, measured for each liter, not being usual and not working within usual
  limits.
examples:
- The normality of the acid solution was checked before the test.
- They measured the normality of the solution and wrote down the number.
