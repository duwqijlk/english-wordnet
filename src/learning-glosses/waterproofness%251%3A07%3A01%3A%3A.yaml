simpleMeaning: the state of being made so tightly that water cannot get in or out
scope: The state of being made so tightly that water cannot get in or out; watertightness is another name
  for this sense, and it is not merely keeping most water out.
examples:
- They tested the waterproofness of the new tent in heavy rain.
- The waterproofness of the boots kept her feet dry.
