simpleMeaning: to help someone get to know a new place or a new set of conditions
scope: Helping someone learn their way around a new place or situation, not the part of the world called
  the Orient and not becoming oriented by oneself.
examples:
- The dean of students tries to orient the freshmen each autumn.
- A guide will orient the new workers on their first day.
