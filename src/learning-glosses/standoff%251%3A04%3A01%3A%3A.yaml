simpleMeaning: successfully holding back an attack and keeping your place against the people who attack
  you
scope: 'Another name for repulsion: holding back an attack with success, not the end of a game where the
  scores are equal and there is no winner.'
examples:
- Their standoff at the gate stopped the attackers from getting in.
- The small group's standoff held, and the attackers went away.
