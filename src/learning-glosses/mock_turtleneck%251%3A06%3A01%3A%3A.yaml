simpleMeaning: It never folds down, this short collar that stands up on a warm top
scope: 'Also called a mock polo neck: a warm top with a short collar that stands up, not a collar that
  folds down and not a plain round neck.'
examples:
- She bought a mock turtleneck in dark blue.
- His mock turtleneck was too tight around the neck.
