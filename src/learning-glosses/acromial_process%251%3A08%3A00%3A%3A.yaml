simpleMeaning: the tip of the bony ridge on top of the shoulder blade, farthest from the body
scope: This is the farthest tip of the ridge on the shoulder blade; acromion is another name for it, not
  the tip of the arm bone and not the whole shoulder blade.
examples:
- The acromial process forms the bony point you can feel at the top of the shoulder.
- A fall on the acromial process can break the tip of the shoulder blade.
