simpleMeaning: belonging to, or about, a family of plants called Compositae
scope: This word describes a plant that belongs to this family of plants; it is not the noun for the plants
  in the family themselves, and not a thing made of parts joined together.
examples:
- Daisies are composite plants, so they belong to this large family.
- The book lists this plant as composite because it is in that family.
