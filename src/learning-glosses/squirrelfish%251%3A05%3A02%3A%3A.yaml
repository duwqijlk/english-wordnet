simpleMeaning: a small sea creature with sharp fins, like a sea bream, that lives in bays along the south-east
  coast of the United States
scope: Also called pinfish and sailor's-choice; a small sea creature like a sea bream, not the small bright
  red night fish of warm reefs.
examples:
- We caught a squirrelfish in the bay near the pier.
- A squirrelfish swam in the bay off the south-east coast.
