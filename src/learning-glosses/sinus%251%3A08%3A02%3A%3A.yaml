simpleMeaning: one of several hollow spaces full of air, especially in the bones of the head
scope: A hollow space full of air in the bones of the head, not a wide blood path inside the body and
  not a bad passage from a sore place to the skin.
examples:
- A cold can block your sinus and make your face hurt.
- The doctor said the pain came from a blocked sinus near her nose.
