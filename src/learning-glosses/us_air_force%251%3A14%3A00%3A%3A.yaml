simpleMeaning: The flying arm of the armed services of the United States, which guards the country by
  control of the skies and space and putting them to work.
scope: The flying arm of the country's armed services, also called Air Force, U. S. Air Force, United
  States Air Force, and USAF; not the army, the navy, or other armed services.
examples:
- He joined the US Air Force.
- The US Air Force flies jets.
