simpleMeaning: poking fun in a light, joking way, above all by making someone look silly
scope: 'Also called mocking or teasing: playful teasing that makes fun of someone, not a serious insult
  and not a puzzled look.'
examples:
- His quizzical smile made her laugh even as she blushed.
- She gave him a quizzical look, half teasing and half fond.
