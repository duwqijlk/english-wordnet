simpleMeaning: a jump into water in which the person bends the back and holds both arms out wide first
scope: This is a jump into water with the back bent and both arms held out wide, also called swallow dive,
  not a straight jump and not a dive that starts with a somersault.
examples:
- She did a perfect swan dive from the high board.
- The swan dive ended with barely a splash.
