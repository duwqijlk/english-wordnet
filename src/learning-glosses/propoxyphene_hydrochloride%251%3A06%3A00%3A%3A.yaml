scope: A drug sold as Darvon that dulls pain and makes a person a bit sleepy, kin to methadone but less
  likely to make a person depend on it; also called propoxyphene; not a drug for sleep on its own, and
  not a drug that wakes a person up.
examples:
- The propoxyphene hydrochloride tablets were taken for pain.
- She was given propoxyphene hydrochloride after the operation.
