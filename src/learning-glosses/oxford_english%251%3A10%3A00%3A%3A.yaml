simpleMeaning: The way of speaking the tongue of England used at a famed old university, seen by many
  as stiff and showy.
scope: It is the way of speaking the tongue of England used at a famed old university, seen by many as
  stiff and showy; it covers the sound of the speech, not the words or the spelling.
examples:
- She spoke in crisp Oxford English.
- His Oxford English sounded stiff to the farmers.
