senseId: 'alcohol-in-glass_thermometer%1:06:00::'
synsetId: 02698621-n
simpleMeaning: A measuring device with a thin tube of transparent material marked in degrees, filled with
  a liquid that rises and falls as it warms and cools.
scope: This is the liquid-filled kind of measuring device, not a digital or mercury one, and not the alcohol
  inside it.
examples:
- The laboratory still keeps an alcohol-in-glass thermometer for simple demonstrations.
- An alcohol-in-glass thermometer is safer than a mercury one if it breaks.
