simpleMeaning: Any of several drugs may bring on sickness, throwing up, hair loss, or weak bone marrow,
  yet they hold back or kill cancer cells in cancer treatment.
scope: 'Also called an antineoplastic drug and a cancer drug: a drug that fights cancer cells, while antibiotics
  fight germs and painkillers ease pain.'
examples:
- The antineoplastic drugs held back the cancer cells but brought on sickness.
- She lost hair while taking an antineoplastic for her cancer.
