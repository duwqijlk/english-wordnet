simpleMeaning: 'Beyond the ring of rocks round the sun move five large planets: Jupiter, Saturn, Uranus,
  Neptune, and Pluto.'
scope: A large planet whose path round the sun lies beyond the ring of rocks, not one of the planets inside
  it.
examples:
- Jupiter is an outer planet.
- An outer planet moves round the sun beyond the ring of rocks.
