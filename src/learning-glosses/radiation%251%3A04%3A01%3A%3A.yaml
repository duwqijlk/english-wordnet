senseId: 'radiation%1:04:01::'
synsetId: 00706833-n
simpleMeaning: In medicine, a way to treat illness, most often cancer, by putting the sick part of the
  body near a substance that gives off rays
scope: Treatment of illness with rays, not the rays themselves and not a spread of nerve fibres in the
  brain.
examples:
- She had radiation for her cancer.
- Radiation shrank the tumour.
