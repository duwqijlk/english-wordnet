synsetId: 00799359-v
simpleMeaning: You back something when you say yes to it, or when what you do shows you agree with it
scope: To say yes to something or show you back it, also called accept and consent, not to go and get
  something and not to like something.
examples:
- I go for this resolution, not the other one.
- She said she would go for the new plan.
