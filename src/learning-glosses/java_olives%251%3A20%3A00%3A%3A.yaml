simpleMeaning: A large tree of the warm lands of the Old World, with bad-smelling orange-red flowers,
  then red pods holding seeds rich in oil, at times eaten as food
scope: This is a large tree of warm lands with bad-smelling flowers and red pods holding oil-rich seeds;
  kalumpang and Sterculia foetida are other names for this sense.
examples:
- The Java olives tree bore red pods after its orange-red blossoms.
- Seeds from Java olives are sometimes used as food.
