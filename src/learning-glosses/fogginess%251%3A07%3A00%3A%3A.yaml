senseId: 'fogginess%1:07:00::'
synsetId: 04711694-n
simpleMeaning: The state of being hard to make out, with no clear edges or outlines.
scope: 'Also called softness, blurriness, and fuzziness: the state of being hard to make out, with no
  clear edges or outlines, not a clouded air that cuts down how far one can see.'
examples:
- The fogginess of the old photograph made the faces hard to tell apart.
- There was a fogginess about the print that softened every line.
