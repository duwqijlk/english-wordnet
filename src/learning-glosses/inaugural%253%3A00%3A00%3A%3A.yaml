simpleMeaning: taking place at, or typical of, the formal event where a person is put into a high office
scope: About the formal start in a high office, not the speech given at that event.
examples:
- He gave a speech at the inaugural ceremony for the new president.
- The inaugural ball was held on the night the new leader took office.
