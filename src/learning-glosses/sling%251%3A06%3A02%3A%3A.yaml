simpleMeaning: A simple weapon made of a strap with a loop. A thing to throw is put in it, spun around,
  and then let go.
scope: A strap weapon that spins a stone and lets it fly; not the cloth for a hurt arm and not the Y-shaped
  toy stick.
examples:
- The shepherd carried a sling to drive away wild animals.
- He put a stone in his sling, spun it, and let it fly.
