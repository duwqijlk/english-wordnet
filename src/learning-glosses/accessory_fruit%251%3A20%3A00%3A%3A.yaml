simpleMeaning: a fleshy food that grows from much more than the ripened seed case of a flower, as an apple
  or a strawberry
scope: 'Also called pseudocarp: the fleshy part is much more than the ripened ovary, unlike a true berry.'
examples:
- An apple is an accessory fruit because its flesh grows beyond the ovary.
- The strawberry is an accessory fruit, with flesh from more than the ovary.
