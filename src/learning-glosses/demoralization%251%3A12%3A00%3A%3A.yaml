senseId: 'demoralization%1:12:00::'
synsetId: 07553361-n
simpleMeaning: a low, sad feeling that comes when a person's will to keep going is worn down
scope: This is a low feeling from having one's spirit worn down, also called demoralisation; not a passing
  sadness and not a low feeling caused by illness.
examples:
- After the long run of losses, demoralization spread through the team.
- Her demoralization grew as each new plan fell apart.
