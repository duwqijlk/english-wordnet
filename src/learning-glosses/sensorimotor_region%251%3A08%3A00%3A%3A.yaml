simpleMeaning: Feeling and moving come together in a part of the brain's outer layer made of the ridge
  before the deep fold and the ridge behind it.
scope: 'Also called sensorimotor area: a part of the brain''s outer layer where feeling and moving come
  together, not the ridge that handles feeling alone.'
examples:
- The sensorimotor region joins the two ridges on either side of the deep fold.
- Both feeling and moving are handled in the sensorimotor region.
