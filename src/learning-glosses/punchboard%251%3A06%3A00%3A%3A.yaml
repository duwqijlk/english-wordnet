simpleMeaning: a gambling board with many holes, each holding a paper slip printed with a symbol; players
  pay a little to push one out in hope of a prize.
scope: The gambling board with prize slips hidden in its holes, not an ordinary board for punching holes
  in paper.
examples:
- He pushed out a slip from the punchboard and found he had won a dollar.
- The charity fair had a punchboard covered in bright paper slips.
