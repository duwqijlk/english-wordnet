simpleMeaning: In law, a way of telling why a thing is so, most of all how a machine works by the rules
  of nature
scope: In law, an account of the reasons behind a thing, not a basic rule to live by.
examples:
- He explained the principle of the engine in plain words.
- The book sets out the principles on which the machine works.
