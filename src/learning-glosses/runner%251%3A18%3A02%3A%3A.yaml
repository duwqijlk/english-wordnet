simpleMeaning: a baseball player of the team now batting who is standing on a base, or trying to get to
  one
scope: A player of the batting team who is on a base or trying to reach one, not a smuggler, an athlete,
  a football player, or a messenger.
examples:
- The runner stole second base.
- With a runner on third, the batter hit a fly ball.
