simpleMeaning: to happen or lie so that part or all of one thing covers part or all of another
scope: To cover part or all of another thing in time or place, not to be the shared part of two ideas
  and not to meet only at one point.
examples:
- Our vacations overlap this year.
- The two fields overlap along the river.
