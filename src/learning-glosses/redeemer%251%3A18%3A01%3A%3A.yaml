simpleMeaning: a person who buys back paper promises to pay, goods, or other business papers
scope: A person who buys back papers or goods that were sold, not a person who saves people from sin and
  not a buyer of new goods.
examples:
- The redeemer paid the bank and took back the notes.
- As redeemer, she bought back the goods the shop had sold.
