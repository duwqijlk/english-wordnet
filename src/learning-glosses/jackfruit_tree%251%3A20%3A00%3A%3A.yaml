scope: A woody plant from the East Indies, grown for its huge fruit and seeds that can be eaten; jackfruit
  is another name for this sense, not a plant grown for its wood and not a small bush.
examples:
- The jackfruit tree bore fruit as big as a melon.
- Farmers grow jackfruit tree for its huge edible fruit.
