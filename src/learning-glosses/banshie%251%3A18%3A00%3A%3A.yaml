simpleMeaning: In Irish folk tales, a woman spirit who cries out to warn that a death is near
scope: In Irish folk tales, a woman spirit who cries out to warn of a death near at hand, not a spirit
  that brings good news and not a living woman; banshee is another name for it.
examples:
- The banshie wailed outside the cottage that night.
- They said a banshie had cried before the old man's death.
