simpleMeaning: A past treatment to take out blood when there was too much of it; in medieval medicine,
  blood was one of four fluids in the body
scope: A past way to treat illness by taking out blood, not giving blood, not a blood test, and not loss
  of blood from a wound.
examples:
- In the past, doctors used bloodletting to treat people with fever.
- Bloodletting was once thought to help by taking out extra blood.
