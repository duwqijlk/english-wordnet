senseId: 'slipknot%1:06:00::'
synsetId: 04248170-n
simpleMeaning: A knot that stays loose enough to slide along the cord or rope it is tied to, made at the
  very end of the cord or rope.
scope: A knot at the end of a cord or rope that can slip along the cord or rope around which it is made,
  not a knot that holds fast once tied.
examples:
- She tied a slipknot so the rope could be loosened quickly.
- The slipknot slid along the cord when he pulled it.
