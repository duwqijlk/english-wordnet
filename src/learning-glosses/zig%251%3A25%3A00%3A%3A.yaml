simpleMeaning: a shape with sharp turns, first one way and then the other way, again and again
scope: 'Also called zigzag and zag: a shape that turns sharply from side to side, not a straight line
  and not a smooth curve.'
examples:
- The road made a sharp zig to the left, then turned right.
- Each zig in the pattern points the opposite way from the last turn.
