simpleMeaning: a person whose job is to look after horses in the building where horses are kept
scope: This is a worker who looks after horses; it is not the man who is getting married, and not the
  act of cleaning and brushing an animal.
examples:
- The groom fed the horses early each morning.
- A groom gave the horses fresh water and clean straw.
