simpleMeaning: a scar or small hollow in the skin left by a spot of smallpox, acne, or another illness
  that raises spots
scope: A mark left on the skin by a past illness, not a birthmark and not a fresh cut.
examples:
- Smallpox left a pockmark on his cheek.
- The pockmark on her chin came from acne as a teenager.
