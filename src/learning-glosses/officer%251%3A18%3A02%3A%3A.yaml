simpleMeaning: a person chosen for an important job in an organization and trusted to do it well.
scope: This is a trusted role in a club, company, or government, not a police rank and not a soldier.
examples:
- She was elected as the union officer in charge of safety.
- The bank officer signed the papers for the loan.
