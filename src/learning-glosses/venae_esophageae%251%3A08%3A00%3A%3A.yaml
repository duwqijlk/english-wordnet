simpleMeaning: Blood leaves the food pipe through these small tubes and empties into the large one in
  the upper chest or the ones beside the backbone.
scope: Also called esophageal veins and oesophageal veins, these are the small tubes that carry blood
  from the food pipe to the large one in the upper chest or the ones beside the backbone.
examples:
- The venae esophageae carry blood away from the food pipe.
- Small blood tubes, the venae esophageae, run from the food pipe to the large blood tube in the chest.
