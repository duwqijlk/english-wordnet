senseId: 'nol.pros.%2:30:00::'
synsetId: 00363921-v
simpleMeaning: The side bringing a case in court ends it by putting a formal note in the court records
  that the case is dropped
scope: The act of ending a case in court by putting a formal note in the court records that the case is
  dropped, also called nolle pros and nolle prosequi, not a judge throwing a case out and not a not-guilty
  verdict.
examples:
- The prosecutor decided to nol.pros. the case after the witness changed her story.
- They nol.pros. the charge when the key witness could not be found.
