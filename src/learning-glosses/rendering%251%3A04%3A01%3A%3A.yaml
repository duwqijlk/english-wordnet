simpleMeaning: How a performer shows what a work of art means in a performance.
scope: This is how a performer shows a work of art in a performance; interpretation is another name for
  this sense, not a drawing of a building or a coat of plaster on a wall.
examples:
- Her rendering of Milton's verse was extraordinarily moving.
- His rendering of the song brought tears to many eyes.
