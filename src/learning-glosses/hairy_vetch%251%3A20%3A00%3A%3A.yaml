simpleMeaning: A plant from Europe, much grown to feed farm animals and to cover the ground
scope: A plant from Europe grown to feed animals and cover the ground, not a pea grown for people to eat;
  hairy tare is another name for this sense.
examples:
- The farmer sowed hairy vetch to feed his cows.
- Hairy vetch covered the field through the winter.
