senseId: 'screw_wrench%1:06:00::'
synsetId: 04162238-n
simpleMeaning: a hand tool that grips and turns, with one jaw that can be moved by turning a small metal
  part
scope: This is a hand tool whose moving jaw is set by turning a small metal part; not a fixed-size tool
  and not a tool that cuts.
examples:
- He turned the screw wrench until its jaw closed on the bolt.
- She used a screw wrench to grip the bolt because the fixed one was the wrong size.
