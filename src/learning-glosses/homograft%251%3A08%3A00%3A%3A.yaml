simpleMeaning: Flesh or an organ moved from a giver of the same kind but different genes, the taker's
  body guard held down so the graft is not cast off.
scope: Flesh or an organ moved from a giver of the same kind but different genes, the taker's body guard
  held down so the graft is not cast off; it is also called allograft.
examples:
- The homograft came from a giver of the same kind.
- A homograft needs the body guard held down.
