simpleMeaning: A tall plant from Europe that lives year after year now grows on its own in the east of
  North America, where it gives trouble as a weed.
scope: Also called leafy spurge, this tall European plant is one of the kinds that now grow on their own
  in the east of North America and give trouble as weeds.
examples:
- In the east of North America, wolf's milk now grows on its own.
- Tall and long-lived, wolf's milk gives trouble as a weed in the east of North America.
