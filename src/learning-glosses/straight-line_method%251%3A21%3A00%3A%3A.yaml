simpleMeaning: In accounting, the cost of a thing is cut into equal yearly parts over its working life,
  with one part counted as the cost of each year.
scope: Straight-line method of depreciation is another name for this accounting rule, which cuts the cost
  of a thing into equal yearly parts over its working life.
examples:
- Each year the straight-line method takes the same amount off the cost of the machine.
- The firm used the straight-line method to spread the cost of its trucks over their working years.
