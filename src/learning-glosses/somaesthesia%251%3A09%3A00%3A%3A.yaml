senseId: 'somaesthesia%1:09:00::'
synsetId: 05667701-n
simpleMeaning: The faculty of bodily perception, through body sensory systems including skin senses, proprioception
  and the internal organs
scope: Also called somaesthesis, somataesthesis, somatesthesia, somatic sense, somatic sensory system,
  somatosensory system, somesthesia, or somesthesis, this sense takes in what goes on in one's own body.
examples:
- Through somaesthesia, a person can feel where an arm is.
- By somaesthesia, a person knows how the parts inside the body feel.
