simpleMeaning: to make someone feel sad and low, and take away their hope and cheer
scope: 'Also called depress, dismay, dispirit, demoralize and demoralise: to make a person feel sad and
  low, not to press a thing down in place.'
examples:
- The bad news dejected her for days.
- Losing the game dejected the whole team.
