simpleMeaning: to use the theory of the tiniest bits of energy to make a thing change only in fixed jumps,
  each a whole-number multiple of one shared step
scope: This verb means limiting a quantity to fixed steps, also called quantise; it is not the other sense
  of quantize, which means turning a changing signal into set values.
examples:
- Physicists quantize light into fixed packets of energy.
- They quantize the energy of an atom so it can take only fixed steps.
