simpleMeaning: A tree of middling size in the eastern United States, with pink flowers and small yellow
  fruit.
scope: This is a tree of middling size in the eastern United States with pink flowers and small yellow
  fruit; not an apple tree grown for fruit, and not a cherry tree, whose flowers are also pink.
examples:
- The garland crab bloomed pink in the spring.
- Small yellow fruit hung from the garland crab.
