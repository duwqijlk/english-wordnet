simpleMeaning: A man-made drug, like a body chemical, that cuts swelling; sold as Aristocort, Aristopak,
  or Kenalog
scope: A man-made drug that cuts swelling, sold as Aristocort, Aristopak, or Kenalog; not a painkiller
  and not a drug that fights germs.
examples:
- The doctor gave her triamcinolone for the swollen joint.
- Triamcinolone eased the redness and swelling within days.
