simpleMeaning: a tree from warm parts of America that keeps some of its leaves all year, with upright
  bunches of pink or rose flowers, planted for show
scope: Another name for pink shower, also called horse cassia; a tree of warm America grown for show,
  not a fruit tree and not a shade tree of cool lands.
examples:
- A pink shower tree stood at the corner of the park.
- The pink shower tree lost some leaves in the cool season.
