simpleMeaning: 'A count of repeats in a fixed stretch of time: one repeat in one unit of time is a rate
  of one hertz, named for Heinrich Rudolph Hertz.'
scope: Also called cycle, hertz, cps, and cycles/second, it gives a number for how often a thing repeats.
examples:
- The teacher wrote the rate in cycles per second on the board.
- The radio station gave its signal rate in cycles per second.
