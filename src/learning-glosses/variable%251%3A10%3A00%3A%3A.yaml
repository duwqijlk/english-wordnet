simpleMeaning: a mark such as x or y used in maths or logic to stand for a number or amount that can change
scope: A mark used in maths or logic to stand for an amount that can change, not a star whose light changes
  and not something that is likely to change.
examples:
- In the sum, the variable x stands for the number of apples.
- The teacher asked us to find the variable in the sum.
