simpleMeaning: The money spent on selling goods, such as passing ownership to buyers and moving goods
  to them
scope: The money spent on selling goods, such as passing ownership to buyers and moving goods to them;
  not the cost of making the goods and not the price buyers pay.
examples:
- The marketing cost of moving goods to buyers can be high.
- They cut the marketing cost by selling direct.
