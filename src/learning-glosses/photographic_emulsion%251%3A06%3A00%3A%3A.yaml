simpleMeaning: Tiny bits of silver bromide, held in a jelly-like stuff, make the coat on paper or film
  that reacts to light.
scope: Also called emulsion, this is the coat on paper or film that lets light leave a picture on it.
examples:
- The photographic emulsion on the paper darkened where the light fell.
- They coated the film with photographic emulsion before taking the picture.
