simpleMeaning: With too little light, a thing is hard to see or make out
scope: The state of being hard to see for lack of light, also called obscurity; not darkness itself and
  not a thing that is hidden.
examples:
- The obscureness of the room made reading hard.
- In the obscureness of the cave, shapes were hard to tell apart.
