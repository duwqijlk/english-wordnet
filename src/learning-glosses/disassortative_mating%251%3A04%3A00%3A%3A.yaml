senseId: 'disassortative_mating%1:04:00::'
synsetId: 00849562-n
simpleMeaning: Breeding between animals or plants whose features differ more than chance pairing would
  give.
scope: Breeding between unlike partners, more unlike than chance pairing, not breeding between look-alikes
  and not breeding at random.
examples:
- Disassortative mating pairs birds with very different colours.
- The disassortative mating gave young with mixed traits.
