scope: The tasty juices that drip from cooking meat, left thin, with a little water often stirred in,
  not the thick sauce made with flour, and not a sudden stroke of good luck.
examples:
- He spooned the gravy from the pan over the meat.
- The gravy in the roasting tin needed only a little water.
