simpleMeaning: A small herb of Europe and Asia, with broad leaves and lilac-pink flowers that have no
  rays, found in damp places.
scope: This is a small herb of Europe and Asia with broad leaves and lilac-pink flowers, also called butterbur,
  not a herb of dry ground.
examples:
- Bog rhubarb grows in damp places in Europe and Asia.
- The bog rhubarb has broad leaves and lilac-pink flowers.
