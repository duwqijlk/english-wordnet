simpleMeaning: Heard in one ear or both, a ringing or deep booming sound, a sign of an ear infection or
  of Meniere's disease, a sickness of the inner ear.
scope: This is a sound only the person hears inside the ear, a sign of an ear infection or of Meniere's
  disease.
examples:
- The tinnitus in her left ear grew worse in the quiet room.
- After the ear infection, tinnitus left a high ring in both his ears.
