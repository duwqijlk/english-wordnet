simpleMeaning: to fit together at the line where two parts meet, as if they were linked there
scope: This is not about fastening pieces with a separate connector; it is about two parts meeting and
  fitting together at their edges.
examples:
- The boards joint neatly along the edge.
- The panels joint so tightly that the seam almost disappears.
