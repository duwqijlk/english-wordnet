simpleMeaning: In a clock or watch, a thin coil keeps the back-and-forth wheel moving at an even pace
scope: A thin coil that keeps the back-and-forth wheel in a clock or watch moving at an even pace, not
  the wheel itself and not a big coil that drives the hands.
examples:
- The watchmaker replaced the hairspring to fix the fast-running watch.
- A bent hairspring can make a clock gain or lose time.
