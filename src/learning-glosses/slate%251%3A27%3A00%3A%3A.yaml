simpleMeaning: a rock changed by heat and pressure, with very small grains, that can be split into thin
  layers
scope: The rock itself, not thin pieces of it used on a roof, not a board once used for writing on, and
  not a list of people put forward for an election.
examples:
- The hill is made of dark slate that splits into thin sheets.
- Workers cut the slate into flat pieces at the quarry.
