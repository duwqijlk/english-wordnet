simpleMeaning: the kind of colour a thing has, decided by the main wave of light that comes from it
scope: The kind of colour a thing is, not how light or dark it is and not how strong or weak the colour
  is.
examples:
- The hue of the sky changed from blue to pink at sunset.
- She picked a paint with a warm hue for the kitchen wall.
