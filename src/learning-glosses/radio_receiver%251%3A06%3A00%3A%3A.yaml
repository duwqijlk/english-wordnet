simpleMeaning: To hear what is sent through the air, this box takes the signals in, finds the sound in
  them, and makes it loud enough to hear.
scope: Unlike one that sends signals out, this takes them in; radio, wireless, tuner, radio set, and receiving
  set are other names for it.
examples:
- The radio receiver picked up the evening news.
- They turned the radio receiver up to hear the music.
