simpleMeaning: a strong, lasting want to drink too much of drinks that can make a person drunk
scope: 'Also called dipsomania and potomania: a lasting, strong need to drink too much, not just drinking
  a lot at one time.'
examples:
- His alcoholism made it very hard for him to stop drinking.
- She asked for help because her alcoholism was harming her health and her family.
