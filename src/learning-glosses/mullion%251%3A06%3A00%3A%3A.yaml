senseId: 'mullion%1:06:00::'
synsetId: 03803790-n
simpleMeaning: a thin up-and-down strip, not made to hold weight, between the frames or glass sheets of
  a window, or between the parts of a screen
scope: This is the upright strip inside a window or screen; it is not the glass itself and not the bar
  that goes across a window.
examples:
- The window's mullion split the glass into two tall parts.
- A white mullion ran down the middle of the screen door.
