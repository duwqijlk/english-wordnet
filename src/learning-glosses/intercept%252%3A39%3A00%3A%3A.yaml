simpleMeaning: to join a phone or telegraph wire secretly, so you can get the information sent on it
scope: 'Also called tap or bug: joining a phone or telegraph line in secret to get the information sent
  on it, not stopping a person or a message on its way.'
examples:
- The police intercepted the spy's phone calls.
- He feared someone had intercepted the telegraph messages he sent.
