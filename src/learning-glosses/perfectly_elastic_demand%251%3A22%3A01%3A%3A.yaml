simpleMeaning: A market state in which what buyers want for a good falls to nothing if its price rises,
  and becomes endless if the price falls.
scope: What buyers want when a price change wipes it out or makes it endless, not what sellers offer and
  not a small change in what buyers want.
examples:
- The perfectly elastic demand for the cheap snack meant no one bought it after a small price rise.
- With perfectly elastic demand, a lower price would make buyers want endless amounts.
