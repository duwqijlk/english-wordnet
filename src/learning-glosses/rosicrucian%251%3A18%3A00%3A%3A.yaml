simpleMeaning: One of the thinkers and learned men in a secret 17th-century group that studied hidden
  lore about the unseen world and about alchemy.
scope: A man in the first secret 17th-century group of thinkers, not a member of a later group that took
  the same name.
examples:
- He was a Rosicrucian of the secret 17th-century group.
- The Rosicrucian knew the hidden lore of the alchemists.
