simpleMeaning: a drug that lowers the amount of uric acid, a waste stuff, in the blood and is used to
  treat gout
scope: A drug that lowers uric acid in the blood to treat gout, not a painkiller for sore joints and not
  a drug that stops gout attacks by cutting swelling.
examples:
- The doctor gave him probenecid to bring down the uric acid in his blood.
- She takes probenecid every day to help with her gout.
