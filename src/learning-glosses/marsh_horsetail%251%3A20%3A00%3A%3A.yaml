simpleMeaning: Found far and wide in the wet or boggy lands of the Northern Hemisphere, it is a rush-like
  plant once used to scour.
scope: This word names a rush-like plant of wet or boggy lands, set apart from other horsetails by its
  use in scouring.
examples:
- The marsh horsetail grows in wet or boggy areas of the Northern Hemisphere.
- Marsh horsetail was once used to scour, like a rush.
