simpleMeaning: giving all of yourself to a person or a cause, with strong feeling and holding nothing
  back
scope: Full and eager support with nothing held back, not polite support and not help given with doubts.
examples:
- She gave wholehearted support to her friend's plan.
- His wholehearted commitment to the team never wavered.
