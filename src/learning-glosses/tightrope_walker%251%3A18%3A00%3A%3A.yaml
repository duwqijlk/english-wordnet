simpleMeaning: a person who does tricks on a thin cord, whether it is pulled taut or left loose
scope: A person who does tricks on a thin cord; funambulist is another name for this sense. Not a juggler
  on the ground and not a person who walks a wire for work.
examples:
- The tightrope walker crossed high above the crowd on a thin cord.
- A tightrope walker must keep her balance on a cord that sways.
