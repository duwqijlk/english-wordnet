simpleMeaning: a trader who runs a shop, either as its owner or as the one in charge
scope: This is a trader who runs a shop, either as its owner or as the one in charge; shopkeeper is another
  name for this sense, and it is not a shop assistant or a customer.
examples:
- The storekeeper opened his shop at dawn.
- She asked the storekeeper for a loaf of bread.
