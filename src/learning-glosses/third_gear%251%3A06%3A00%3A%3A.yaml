simpleMeaning: the forward speed setting that comes after the second one when you count up from the lowest
  in a motor vehicle's gearbox
scope: Also called third, this is the forward speed setting that comes after the second one when you count
  up from the lowest, not first gear and not second gear.
examples:
- You shouldn't try to start in third gear.
- She changed into third gear as the car picked up speed.
