simpleMeaning: In ancient Greece, a song of praise, sung especially to call on a god or to thank one.
scope: Also called a pean; a song of praise from ancient Greece, sung to call on a god or to thank one,
  not any formal praise in words.
examples:
- The choir sang a paean to thank the god.
- A paean rose from the crowd to call on the god.
