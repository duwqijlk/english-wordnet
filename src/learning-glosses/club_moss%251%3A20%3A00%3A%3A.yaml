simpleMeaning: a very old evergreen plant that looks like a soft ground cover and bears spores in small
  thick-ended cone-like clusters
scope: A very old evergreen plant that looks like a soft ground cover and bears spores in small thick-ended
  cone-like clusters; club-moss and lycopod are other names for this, not a true moss and not a fern.
examples:
- Club moss covers the damp ground under the trees.
- The club moss releases spores from its cone-like clusters.
