simpleMeaning: In voodoo, a spirit or unseen power that brings a dead body back to life
scope: Also called zombie; in voodoo, a spirit that brings a dead body back to life, not a god, not a
  drink, and not a person who acts like a machine.
examples:
- The zombi rose from the grave at the priest's call.
- Tales of the zombi frightened the children.
