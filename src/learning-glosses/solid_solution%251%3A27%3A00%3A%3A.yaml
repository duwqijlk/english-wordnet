simpleMeaning: A hard lump in a metal mix, made when tiny bits of a second stuff settle inside a metal's
  crystals, keeping one make-up across a spread of mixes.
scope: Also called primary solid solution, it is one stuff spread evenly through a hard lump.
examples:
- This solid solution stays the same over a range of mixes.
- A solid solution forms when tiny bits of one stuff sit inside the crystals of a metal.
