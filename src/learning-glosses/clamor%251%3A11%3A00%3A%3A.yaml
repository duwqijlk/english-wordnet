simpleMeaning: A loud, hard, sharp sound that grates on the ear
scope: Also called din and blare; a loud harsh noise, not a cry raised by many people and not the act
  of crying out.
examples:
- The clamor of the market rose through the open windows.
- A clamor of bells rang out across the town.
