simpleMeaning: A strong plant with white flowers that comes back year after year and grows wild in shallow
  fresh water in the north of the United States and Asia.
scope: Also called water parsnip, this plant grows wild in shallow fresh water in the north of the United
  States and Asia, a different kind from the greater water parsnip of Europe.
examples:
- Sium suave grows wild in the shallow stream behind the farm.
- We found Sium suave with white flowers in the wet ground in Asia.
