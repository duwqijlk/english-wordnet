simpleMeaning: A small soft round fruit with one hard stone grows on one of many trees and low bushy plants,
  and many also give hard wood worth a lot.
scope: This tree is also called a cherry, and many of its kind also give hard wood worth a lot.
examples:
- The cherry tree bore small round fruit with hard stones.
- Many cherry trees give hard wood.
