simpleMeaning: A thorny plant with sweet dark fruit that most often stays joined to the part that holds
  it.
scope: A thorny plant with sweet dark fruit; blackberry is another name for this sense, not a plant with
  fruit that falls free and not a berry plant of another kind.
examples:
- The blackberry bush grows along the fence.
- We picked fruit from the blackberry bush.
