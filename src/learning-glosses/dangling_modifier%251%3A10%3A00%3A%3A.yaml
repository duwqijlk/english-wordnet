schema: oewn-learning-gloss-v2
senseId: 'dangling_modifier%1:10:00::'
synsetId: 06334815-n
simpleMeaning: Because of where it sits, a word or phrase seems to go with the wrong word, as in 'when
  young, circuses appeal to all of us'.
scope: Also called misplaced modifier; this is a word or phrase that seems to go with the wrong word because
  of where it sits, not a phrase that goes with the word it was meant for.
examples:
- In 'when young, circuses appeal to all of us', 'when young' is a dangling modifier.
- The dangling modifier made the sentence say the circuses were young.
