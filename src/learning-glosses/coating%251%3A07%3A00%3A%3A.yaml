simpleMeaning: the look or feel of a surface made to look good, or the stuff put on to give it that look
scope: The look or feel of a surface, or the stuff that gives it that look; finish and finishing are other
  names for this sense, not a thin spread over a surface, and not cloth for coats.
examples:
- The boat had a metallic coating.
- He put a clear coating on the table.
