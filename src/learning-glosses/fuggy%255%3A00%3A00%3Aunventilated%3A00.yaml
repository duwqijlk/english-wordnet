simpleMeaning: In British informal use, a place where fresh air does not move in and out well
scope: A place with too little fresh air, not a place that is merely warm, damp, or dirty.
examples:
- The fuggy little office had only one small window.
- After the long meeting, the fuggy hall felt hard to breathe in.
