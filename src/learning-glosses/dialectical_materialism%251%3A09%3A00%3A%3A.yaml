simpleMeaning: The view of Karl Marx and Friedrich Engels that the world is made of matter and moves through
  struggle between opposing forces
scope: The ideas of Marx and Engels about matter and change through struggle, not a faith and not a plan
  for running a state.
examples:
- Dialectical materialism shapes how he reads history.
- She studied dialectical materialism in her course on Marx and Engels.
