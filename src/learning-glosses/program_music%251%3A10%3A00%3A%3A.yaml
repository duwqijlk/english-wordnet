simpleMeaning: Tunes made to bring pictures or past happenings to mind for the hearer
scope: 'Also called programme music: tunes that bring pictures or events to mind, not tunes made just
  for their sound and not a song with words.'
examples:
- The program music in tonight's show paints a storm at sea.
- The class listened to program music that brought a busy market to mind.
