simpleMeaning: a dreamlike state in which a person can follow what they are told, but can hardly act on
  their own or not at all
scope: This is a dreamlike state where a person follows what they are told but can hardly act on their
  own; not full sleep and not full waking.
examples:
- After the blow, he sat in a semitrance and did what the nurse asked.
- She drifted into a semitrance and could barely lift her hand.
