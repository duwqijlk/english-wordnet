synsetId: 92463635-n
simpleMeaning: A kind of middle female singing voice, with notes from about the G below middle C, called
  G3, up to the A two octaves above middle C, called A5.
scope: A kind of middle female singing voice with a range from about the G below middle C to the A two
  octaves above it, unlike the coloratura mezzo-soprano and the dramatic mezzo-soprano.
examples:
- The lyric mezzo-soprano sang the middle part of the song.
- A lyric mezzo-soprano can reach from the G below middle C to the A two octaves above it.
