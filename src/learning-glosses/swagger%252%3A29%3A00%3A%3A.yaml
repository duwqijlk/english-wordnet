synsetId: 00012427-v
simpleMeaning: to act too sure of yourself and too proud, as if you were better than everyone else
scope: To act in a proud, show-off way, not to walk with a proud step and not to frighten someone with
  threats.
examples:
- He swaggered into the room as if he owned the place.
- Don't swagger about the office just because you won the prize.
