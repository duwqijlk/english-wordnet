simpleMeaning: Running with the main arteries of the eye in the cord to the brain, this vein is made where
  the veins of the back of the eye join.
scope: Also called central vein of retina, this vein is made where the veins of the back of the eye join
  and runs with the main arteries in the cord to the brain.
examples:
- The vena centralis retinae runs with the arteries of the eye in the cord to the brain.
- Blood leaves the back of the eye through the vena centralis retinae.
