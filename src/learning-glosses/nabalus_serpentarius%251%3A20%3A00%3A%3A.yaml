simpleMeaning: A common perennial herb of the southern and eastern United States, with drooping clusters
  of pinkish flowers and thick low leaves like a lion's foot; sometimes placed in genus Prenanthes.
scope: Also called gall of the earth, lion's foot, and Prenanthes serpentaria; a common herb of the southern
  and eastern United States, not a tree and not a grass.
examples:
- Nabalus serpentarius grows in the southern United States.
- The drooping pink flowers of Nabalus serpentarius grow above its thick low leaves.
