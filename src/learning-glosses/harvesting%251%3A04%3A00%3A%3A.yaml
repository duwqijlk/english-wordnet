simpleMeaning: the act of taking in a crop after it has grown fully and is ready
scope: 'Also called harvest: this is the act of taking in a ripe crop, not the crop itself and not the
  time of year when this work is done.'
examples:
- Harvesting of the wheat began early in the morning.
- They finished the harvesting of the apples before the rain came.
