simpleMeaning: made or shaped so that liquid or gas moves past it with the least push against it
scope: 'Also called flowing, sleek, and aerodynamic: shaped so liquid or gas can pass with the least push
  against it, not made to work better by taking out things you do not need.'
examples:
- The streamlined car cut through the air with ease.
- They gave the boat a streamlined shape so it could move fast in water.
