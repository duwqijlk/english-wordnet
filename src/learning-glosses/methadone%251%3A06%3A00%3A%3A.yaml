simpleMeaning: A man-made drug like morphine, but less likely to form a habit, used to help people stop
  taking heroin and to keep them off it.
scope: Also called a fixer, dolophine hydrochloride, methadon, methadone hydrochloride, or synthetic heroin;
  a man-made drug like morphine, not morphine itself.
examples:
- The clinic gave him methadone to ease the withdrawal.
- Methadone helped her stay off heroin.
