simpleMeaning: With red flowers, at times white, and leaves cut into fine parts, this one-year climbing
  plant of warm America now grows wild in the United States and elsewhere.
scope: 'Also called star-glory: a one-year climbing plant of warm America with red flowers, not a tree
  and not a plant that lives for years.'
examples:
- The cypress vine climbs and shows red flowers.
- A cypress vine now grows wild in the United States.
