simpleMeaning: A powder of gypsum plaster and glue that makes a soft workable paste when mixed with water,
  used to fill cracks and holes in plaster.
scope: This powdered plaster filler, not plaster of Paris or ready-mixed joint compound; 'spackle' is
  another name for it.
examples:
- Mix the spackling compound with water to make a workable paste.
- She filled the holes in the plaster with spackling compound.
