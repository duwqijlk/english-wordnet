simpleMeaning: The crust and the layer just under it make the hard part of the earth
scope: The crust and the layer just under it make the hard part of the earth, also called the geosphere,
  not the earth's hot centre and not the air above it.
examples:
- The lithosphere is broken into great plates that move slowly.
- Earthquakes happen when parts of the lithosphere shift.
