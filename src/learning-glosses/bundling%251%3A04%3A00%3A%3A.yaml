simpleMeaning: the act of tying things together into one group
scope: This is the act of tying things together into one group. It is not the old custom where a young
  man and woman who were not married lay in the same bed without taking their clothes off.
examples:
- Bundling the sticks, she tied them together into one pile.
- He did the bundling of the newspapers before taking them out.
