simpleMeaning: Skin that has lost its healthy colour after a blow, an illness, or a shock
scope: Skin that has lost its healthy colour after a blow, illness, or shock; not the healthy paleness
  some people have by nature.
examples:
- Her pallor worried the nurse, who sent for a doctor.
- The pallor of his face showed how ill he felt.
