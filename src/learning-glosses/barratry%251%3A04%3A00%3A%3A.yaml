senseId: 'barratry%1:04:00::'
synsetId: 00766696-n
simpleMeaning: Again and again, to annoy others, a person starts court cases and fights; that keeping-on
  is the wrong.
scope: This is the wrong of starting lawsuits and quarrels again and again to annoy others, not the ship
  master's fraud at sea.
examples:
- The court charged them with barratry for starting lawsuits again and again.
- Their endless quarrels were called barratry.
