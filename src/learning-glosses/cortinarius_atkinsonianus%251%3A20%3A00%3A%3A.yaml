simpleMeaning: An eatable fungus with a sticky wet cap that starts yellow, then turns olive, then brown-yellow;
  its flesh is lavender.
scope: An eatable fungus with a sticky wet cap that changes colour from yellow to olive to brown-yellow,
  unlike fungi with dry caps and unlike inedible kinds.
examples:
- Cortinarius atkinsonianus had a sticky wet cap that turned from yellow to olive.
- The flesh of Cortinarius atkinsonianus is lavender.
