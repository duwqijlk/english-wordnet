senseId: olde_worlde%5:00:00:fashionable:00
synsetId: 00976383-s
simpleMeaning: It need not be truly from long ago, but it looks pleasing because it seems to come from
  then
scope: A pleasing look from long ago that need not be real, also called quaint and old-time; not a thing
  that is old in years alone and not a modern look.
examples:
- The inn had an olde worlde charm, with low beams and a fire.
- They liked the olde worlde look of the cottage.
