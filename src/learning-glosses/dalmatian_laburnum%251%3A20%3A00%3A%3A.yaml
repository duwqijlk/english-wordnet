simpleMeaning: An upright shrub with big leaves in threes and thick bunches of yellow flowers, then seeds
  that poison; it grows in Yugoslavia and is sometimes placed in genus Cytisus.
scope: Also called Cytisus ramentaceus or Petteria ramentacea; an upright shrub with big three-part leaves
  and thick bunches of yellow flowers followed by poisonous seeds, kin to other yellow-flowered shrubs.
examples:
- Dalmatian laburnum grows in Yugoslavia, its yellow flowers in thick bunches.
- The seeds of Dalmatian laburnum are poisonous, so children must not eat them.
