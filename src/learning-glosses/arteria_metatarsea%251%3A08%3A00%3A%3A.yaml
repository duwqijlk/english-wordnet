simpleMeaning: blood vessels on the top and the sole of the foot that feed the middle part of the foot
scope: Also called metatarsal artery; these feed the middle part of the foot, not the back of the knee
  and not the muscles of the neck.
examples:
- The arteria metatarsea runs along the top of the foot.
- An arteria metatarsea on the sole of the foot feeds the middle of the foot.
