senseId: vexatious%5:00:00:disagreeable:00
synsetId: 00090253-s
simpleMeaning: Making folk cross and put out.
scope: This sense is also called annoying, teasing, irritating, pestering, vexing, galling, pesky, bothersome,
  nettlesome, and plaguey, for making folk cross and put out, where annoying is causing a person to feel
  upset and a little angry, teasing is making people feel annoyed and a little angry, and irritating is
  making people feel annoyed or bothered.
examples:
- The noise was vexatious, making folk cross.
- The delay was vexatious, making folk put out.
