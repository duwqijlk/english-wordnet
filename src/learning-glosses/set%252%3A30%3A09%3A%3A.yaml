simpleMeaning: To get something ready or arrange equipment ahead of time for a particular use or event.
scope: This is not adjusting an instrument to an exact standard, not putting an object down in a spot
  and not the hardening of a material; it is preparing or arranging things in advance.
examples:
- She set the table for six before the guests arrived.
- The staff set the chairs in rows for the morning assembly.
