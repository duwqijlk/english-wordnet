schema: oewn-learning-gloss-v2
senseId: 'continuum%1:28:00::'
synsetId: 15148671-n
simpleMeaning: A whole, a stretch, or things following one after another, in which no part is clearly
  different from the parts next to it and which is not in space
scope: This is a whole or series with no clear breaks between its parts, not a set of separate things
  and not a place or area in space.
examples:
- Language forms a continuum, with no clear line between one kind of speech and the next.
- The colours in the rainbow form a continuum, each one running into the next.
