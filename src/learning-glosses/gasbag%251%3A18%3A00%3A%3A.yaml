simpleMeaning: a person who keeps talking for a long time about dull things, and bores the people who
  hear them
scope: Also called a windbag, this is a person who talks a lot about dull things and bores listeners,
  not a quiet person and not a good speaker.
examples:
- At the party, the gasbag talked for an hour about his stamp collection.
- The old gasbag held the whole table with his long stories about taxes.
