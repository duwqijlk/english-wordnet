simpleMeaning: a soft grey-capped mushroom that can be eaten, growing in flat layers on dead wood
scope: A soft grey-capped mushroom that can be eaten, growing in flat layers on dead wood; oyster agaric
  and oyster mushroom are other names for this sense, and it is not a poisonous mushroom or a mushroom
  that grows on the ground.
examples:
- The oyster fungus grows in flat layers on a dead log.
- We found an oyster fungus on the fallen tree.
