simpleMeaning: A religious ceremony of remaining awake to pray, especially on the night before a religious
  celebration.
scope: This is the religious ceremony, not a small portable clock, not a sailor's duty period, not a guard's
  purposeful surveillance, not the period someone is on duty, not the person employed to keep watch, and
  not the verb meaning to look at or stay alert.
examples:
- The parish held an all-night prayer watch before the festival.
- The Easter watch began at midnight and lasted until dawn.
