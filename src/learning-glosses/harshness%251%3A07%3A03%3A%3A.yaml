simpleMeaning: the roughness of a thing that scrapes against something and wears away its top part
scope: The roughness of a thing that scrapes against something and wears away its top part; not how rough
  a sound, light, taste, or smell is for the senses, and not being cruel to people.
examples:
- The harshness of the sandpaper left marks on his hands.
- Workers wear gloves because of the harshness of the rough stone.
