senseId: 'understand%2:31:04::'
synsetId: 00595453-v
simpleMeaning: to know and accept why someone feels or acts as they do, and to feel sympathy for them
scope: This is not about grasping facts or the meaning of words; it is about being sympathetic to someone's
  feelings or behaviour.
examples:
- Her teacher was understanding about the late homework and gave her an extra day.
- My parents were understanding when I told them I had lost the money.
