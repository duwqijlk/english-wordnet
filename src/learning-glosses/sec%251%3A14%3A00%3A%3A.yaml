simpleMeaning: A free-standing arm of the nation's government that watches over the buying and selling
  of stocks and bonds to guard those who put money in firms.
scope: Not other arms of the government such as the tax office; also called the Securities and Exchange
  Commission.
examples:
- The SEC looked into the firm's sale of shares.
- Investors trust the SEC to watch the market.
