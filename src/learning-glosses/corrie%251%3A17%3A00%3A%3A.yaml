simpleMeaning: A half-round hollow with steep sides in a mountain, which may hold a lake.
scope: This is a half-round hollow with steep sides in a mountain, which may hold a lake; cirque and cwm
  are other names for this sense, not a valley between mountains and not a lake on flat ground.
examples:
- A small lake lay in the corrie.
- Walkers climbed down into the corrie.
