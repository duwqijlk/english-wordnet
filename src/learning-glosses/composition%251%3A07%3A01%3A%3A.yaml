simpleMeaning: the way the parts of a person or thing are put together
scope: How the parts of a person or thing are put together, not how parts are arranged in space in a picture
  and not the craft of printing with movable type.
examples:
- The composition of the rock made it hard to break.
- Scientists studied the composition of the new metal.
