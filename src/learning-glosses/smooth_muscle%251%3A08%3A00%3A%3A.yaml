simpleMeaning: in the walls of the stomach, gut, bladder, and blood tubes, but not the heart, sits a muscle
  that tightens on its own, with no thought from you
scope: 'Also called an involuntary muscle: a muscle that works on its own, not a muscle you move at will
  and not heart muscle.'
examples:
- Smooth muscle in the wall of the gut moves food along.
- The smooth muscle of the bladder tightened as it filled.
