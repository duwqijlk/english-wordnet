simpleMeaning: A newborn child that weighs less than 5.5 pounds (2500 grams), whatever the length of the
  pregnancy.
scope: This is a newborn child weighing less than five and a half pounds, whatever the length of the pregnancy,
  and it is not a child that simply looks small; low-birth-weight baby is another name for this sense.
examples:
- The low-birth-weight infant was kept warm in a special cot.
- Nurses watched the low-birth-weight infant through the night.
