simpleMeaning: A herb with many stems, each carrying narrow, slender spikes packed with rose-lavender
  flowers; it grows from the central United States and Canada south to Texas and northern Mexico.
scope: A prairie plant with many stems, each ending in a narrow spike of crowded rose-lavender flowers,
  native from the central United States and Canada to Texas and northern Mexico. It is one of the gayfeathers,
  also called blazing stars; it is not the marsh blazing star, which grows in wet meadows.
examples:
- The dotted gayfeather sent up several slender stems after the spring rain.
- Bees crowded around the dotted gayfeather in late summer.
