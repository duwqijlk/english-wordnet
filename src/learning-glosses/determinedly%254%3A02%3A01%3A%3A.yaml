simpleMeaning: in a way that shows a strong wish to succeed and with much energy
scope: 'Also called ambitiously: this means doing something with a strong wish to succeed and much energy,
  not just doing it in a firm, decided way.'
examples:
- She worked determinedly, spending long hours to win a place at a top school.
- He trained determinedly for years because he wanted to play for his country.
