simpleMeaning: a stamped mark on mail by post office workers that cancels the stamp, and it shows the
  post office and the date the mail was sent
scope: This is the mark itself on a letter or parcel, not the act of putting such a mark on mail.
examples:
- The postmark on the letter showed it was sent from London on Monday.
- She read the date in the postmark to see when the card was mailed.
