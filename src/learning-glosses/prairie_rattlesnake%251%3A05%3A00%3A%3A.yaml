simpleMeaning: Between the great river in the middle of the country and the high mountains in the west,
  this animal is found over a wide area
scope: 'Also called prairie rattler: a snake found over a wide area between the great river in the middle
  of the country and the high mountains in the west, not a snake that lives only in one small place.'
examples:
- We heard a prairie rattlesnake buzzing its tail in the dry grass.
- A prairie rattlesnake sunned itself on a flat rock at noon.
