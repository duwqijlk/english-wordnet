simpleMeaning: a world of the spirit that is not part of real life on earth, and that you cannot touch
  or see in the usual way
scope: A spirit world beyond life on earth; not the real world we live in, and not a made-up world in
  a story.
examples:
- In the old story, heroes cross into the otherworld to speak with spirits.
- She believed the otherworld lay just beyond the world we can see.
