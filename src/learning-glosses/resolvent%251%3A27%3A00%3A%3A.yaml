senseId: 'resolvent%1:27:00::'
synsetId: 15071880-n
simpleMeaning: a liquid that can take other stuff into itself so the stuff spreads through it and is gone
  from sight
scope: 'Also called a solvent, a dissolvent, a dissolver, and a dissolving agent: a liquid that takes
  other stuff into itself, not a solid that melts in heat and not a liquid that only washes dirt away.'
examples:
- Water is a resolvent for salt in the kitchen.
- The painter used a resolvent to thin the paint.
