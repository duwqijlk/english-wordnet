senseId: 'gender_role%1:04:00::'
synsetId: 00723504-n
simpleMeaning: The open way a person shows others how much they act as a man or as a woman
scope: This is the open show of how far a person acts as a man or as a woman, not a person's private sense
  of self and not a job or part played on stage.
examples:
- His gender role surprised people who knew him only at work.
- Her gender role was clear in the way she dressed and spoke.
