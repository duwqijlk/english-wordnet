simpleMeaning: of paper, cloth, or leather, with a surface made smooth and shiny, above all by being pressed
  between rollers
scope: Of paper, cloth, or leather with a surface made smooth and shiny by pressing between rollers; glossy
  is another name for this sense, not a surface that is only soft or only flat.
examples:
- The calendered paper shone under the lamp.
- She chose calendered leather for the book cover.
