simpleMeaning: going on without stopping, deep and full, with a low sound that beats again and again
scope: 'Also called grumbling: this word describes a deep, full, long sound; it is not the noun sense
  that names such a noise.'
examples:
- We heard the rumbling thunder long before the storm came.
- A rumbling train shook the small house as it passed.
