simpleMeaning: a signal that goes off on its own, usually a sound, that warns people of danger
scope: 'Also called alert: a warning signal, usually a sound, not a clock that wakes a person and not
  a feeling of fear.'
examples:
- The fire alarm sounded when smoke filled the hall.
- When the alarm goes off, leave the building at once.
