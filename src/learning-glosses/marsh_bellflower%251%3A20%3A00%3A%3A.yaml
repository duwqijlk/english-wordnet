simpleMeaning: On wet ground in the east of North America grows a plant with long thin leaves shaped like
  a spearhead and small pale blooms.
scope: This plant grows on wet ground in the east of North America, with long thin leaves and small pale
  blooms, not in dry fields.
examples:
- Marsh bellflower grew along the wet edge of the pond.
- We found marsh bellflower with small pale blooms in the marsh.
