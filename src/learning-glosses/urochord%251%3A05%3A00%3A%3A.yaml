simpleMeaning: A stiff rod in the young of a sea squirt, found mostly in the tail part.
scope: A stiff rod in the young of a sea squirt, found mostly in the tail part, not the whole animal itself
  and not the backbone of a fish.
examples:
- The urochord of the young sea squirt lies mostly in the tail part.
- In the larva, the urochord is a stiff rod that runs through the tail.
