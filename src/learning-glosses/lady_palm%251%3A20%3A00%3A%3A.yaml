simpleMeaning: Any of several small plants of the genus Rhapis, grown as plants kept inside the house.
scope: Any of several small plants of the genus Rhapis, grown as plants kept inside the house, not a tall
  outdoor palm and not a fern kept in a pot.
examples:
- A lady palm stood in the corner of the sitting room.
- She watered the lady palm every week.
