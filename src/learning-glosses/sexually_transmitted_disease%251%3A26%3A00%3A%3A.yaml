simpleMeaning: an illness that spreads from one person to another through sex or touch of the sex parts
scope: An illness that spreads through sex or touch of the sex parts, also called dose, a social disease,
  a venereal disease and a venereal infection; not a cold caught from the air and not a skin rash from
  soap.
examples:
- A sexually transmitted disease can spread through sex or touch of the sex parts.
- Doctors test for a sexually transmitted disease when patients ask.
