simpleMeaning: A lift on the snow where people hold on to a long piece of metal and are pulled up the
  hill on their skis.
scope: 'Also called Alpine lift and T-bar lift: a lift on the snow where people hold on to a long piece
  of metal, not a lift with seats.'
examples:
- She grabbed the T-bar and was pulled up the hill on her skis.
- The T-bar takes skiers up the slope.
