simpleMeaning: A healing liquid rubbed into the skin to ease stiff, sore muscles
scope: This is a healing liquid rubbed into the skin to ease stiff, sore muscles; liniment is another
  name for it, not a drink and not a cream left on the skin.
examples:
- She rubbed embrocation into her stiff shoulder.
- The embrocation eased the ache in his sore muscles.
