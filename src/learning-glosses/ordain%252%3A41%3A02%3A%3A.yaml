simpleMeaning: to give a person the power of a priest or church leader in a formal act
scope: To give a person the power of a priest or church leader in a formal act, not to give an order by
  higher power and not to put a person into a church job.
examples:
- She was ordained as a minister only last month.
- The bishop ordained him a priest.
