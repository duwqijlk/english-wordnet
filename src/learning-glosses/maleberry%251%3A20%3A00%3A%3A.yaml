simpleMeaning: Small white flowers shaped like bells hang in thick soft clusters on this bush, which loses
  its leaves in winter and has many branches.
scope: 'Also called male berry, he-huckleberry, and privet andromeda: a bush with thick clusters of small
  white bell-shaped flowers.'
examples:
- The maleberry was covered in small white bells.
- Bees worked the thick flower clusters of the maleberry.
