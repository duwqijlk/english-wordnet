simpleMeaning: Fed to farm animals and made into a thing that stands in for chocolate, this long pod holds
  small seeds in a bit sweet soft part that can be eaten.
scope: Also called carob, algarroba, algarroba bean, carob bean, and locust pod, it is the long pod whose
  sweet flesh feeds farm animals and stands in for chocolate.
examples:
- He bought a bag of locust beans to feed his goats.
- She broke open a locust bean and ate the sweet pulp inside.
