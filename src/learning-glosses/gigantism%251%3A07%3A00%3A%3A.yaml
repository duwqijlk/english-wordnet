simpleMeaning: Too much height and bulk of body.
scope: This sense is too much height and bulk of body, unlike the sense for too much size, usually brought
  on by too much growth hormone from the pituitary gland.
examples:
- Gigantism is too much height.
- Gigantism means too much bulk.
