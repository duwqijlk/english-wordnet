simpleMeaning: A yellow-green mix of drugs that kill germs, made from the tiny living thing that makes
  green pus
scope: A yellow-green mix of drugs that kill germs, made from the germ that makes green pus; not one single
  drug on its own, and not a medicine for pain.
examples:
- The doctor used pyocyanase on the wound to kill the germs.
- Pyocyanase was one of the early germ-killing drugs made from bacteria.
