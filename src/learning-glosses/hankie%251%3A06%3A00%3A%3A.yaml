simpleMeaning: a square cloth that you use to wipe your eyes or nose, or wear as part of a costume
scope: 'Also called handkerchief, hanky and hankey: a cloth for wiping the eyes or nose, not a paper tissue.'
examples:
- She took a clean hankie from her bag to wipe her eyes.
- He wore a red hankie as part of his costume.
