simpleMeaning: An animal's inner parts hold this small living thing, which feeds off the animal, in particular
  a gut worm
scope: 'Also called endoparasite, entoparasite, entozoan and entozoon: a small living thing that lives
  inside an animal''s inner parts, in particular a gut worm, not one that lives on the skin and not a
  worm that lives free.'
examples:
- The endozoan lived in the dog's gut for months.
- Vets look for an endozoan in the inner parts of sick animals.
