simpleMeaning: a timepiece that rings at a time set before so that a sleeper wakes up
scope: 'Another name for it is alarm: a timepiece that wakes a sleeper at a set time, not a watch that
  only tells the time and not a bell that rings on the hour.'
examples:
- She set her alarm clock for six in the morning.
- The alarm clock woke him before the sun came up.
