scope: A plant with large thick leaves that give a stiff fibre; sisal is another name for this sense,
  not other large-leaved plants whose leaves give no fibre.
examples:
- Agave sisalana leaves give the fibre for strong rope.
- Farmers grow Agave sisalana in Mexico and the West Indies.
