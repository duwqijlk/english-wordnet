simpleMeaning: A building style of Italy and western Europe, between the Roman and Gothic styles after
  1000, marked by round arches and vaults, piers for columns, and rich ornament and arcades.
scope: A building style of the Middle Ages, also called Romanesque architecture, not Gothic, of Italy
  and western Europe after 1000, with round arches and vaults.
examples:
- Romanesque churches have round arches and thick walls.
- The old abbey was built in the Romanesque style.
