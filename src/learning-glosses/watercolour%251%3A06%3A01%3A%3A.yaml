simpleMeaning: a paint mixed with water, with colour that can mix into water, for use by people who make
  art
scope: A paint used by artists, also called watercolor; not the finished painting made with it and not
  the way of painting with it.
examples:
- She bought a box of watercolour paints for her art class.
- He mixed the watercolour with water and put it on the paper.
