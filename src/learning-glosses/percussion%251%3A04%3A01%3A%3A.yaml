simpleMeaning: the act of playing an instrument that you hit to make sound, such as a drum
scope: This is the act of playing drums and other instruments you hit, not the group of players in a band,
  not tapping the body to check health, and not making a small cap explode.
examples:
- She learned percussion by playing the drums in the school band.
- His percussion kept a steady beat as he played the drum.
