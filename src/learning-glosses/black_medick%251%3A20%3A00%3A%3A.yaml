simpleMeaning: Now at home in North America, this low-spreading herb of Europe bears small yellow flowers
  and curved dark pods.
scope: Also called hop clover, nonesuch clover and yellow trefoil, this is a low-spreading herb of Europe
  with small yellow flowers and curved dark pods, now at home in North America; other low herbs with yellow
  flowers are its nearest rivals.
examples:
- The black medick showed small yellow flowers.
- Black medick is now at home in North America.
