simpleMeaning: a single lens that helps one eye see clearly, held in place by the muscles of the face
scope: One lens for one eye, not a pair of glasses and not a contact lens.
examples:
- He raised the eyeglass to his right eye to read the small print.
- The eyeglass stayed in place only while she kept her face still.
