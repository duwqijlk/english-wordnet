simpleMeaning: He has this place through skills he has earned, or a title he holds
scope: A man who holds a title or a standing through what he has gained himself, also called in her own
  right, in its own right or in one's own right; not a man who gains a place through birth or marriage.
examples:
- He became a leading sports figure in his own right.
- He is a peer in his own right, not through his father.
