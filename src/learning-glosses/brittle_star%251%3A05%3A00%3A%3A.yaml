simpleMeaning: a sea animal much like a flat five-armed sea creature, whose long thin arms snap off easily
  and spread from a small disc at the middle
scope: This is a sea animal much like a starfish, whose long thin arms snap off easily and spread from
  a small disc at the middle; brittle-star and serpent star are other names for it, not a true starfish
  and not a sea urchin.
examples:
- The brittle star hid under a stone at low tide.
- We saw a brittle star waving its thin arms.
