simpleMeaning: a piece of cord, string, ribbon, wire or similar used to fasten something
scope: A fastening cord or similar, not the necktie or the fastener that joins or connects parts.
examples:
- She used a strip of cloth as a tie for the curtain.
- He used a length of cord as a tie for the bundles.
