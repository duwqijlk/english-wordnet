simpleMeaning: in a way that looks good and shows good choice in style
scope: Doing something in a way that looks good and shows good choice in style; not in an ugly way, and
  not about how food tastes in the mouth.
examples:
- She tastefully chose soft colours and plain wood for the room.
- The table was tastefully set with a white cloth and a few small flowers.
