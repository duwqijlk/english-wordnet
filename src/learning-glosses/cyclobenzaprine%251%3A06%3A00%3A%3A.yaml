senseId: 'cyclobenzaprine%1:06:00::'
synsetId: 03160000-n
simpleMeaning: A drug that loosens tight muscles, sold under the trade name Flexeril, and used for sudden
  muscle cramps or fresh injury.
scope: This is a drug that loosens tight muscles, not a painkiller for general aches or a drug that puts
  a person to sleep.
examples:
- The doctor gave her cyclobenzaprine for the tight muscles in her back.
- He took cyclobenzaprine after he hurt his shoulder in the fall.
