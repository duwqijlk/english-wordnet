simpleMeaning: a wheel in a frame in a ship's rigging that guides a rope so it does not rub and wear away
scope: This is a ship's guide wheel for a rope; not the rope itself and not a wheel that lifts heavy loads.
examples:
- The fairlead guided the rope around the corner.
- A fairlead kept the rope from rubbing on the wood.
