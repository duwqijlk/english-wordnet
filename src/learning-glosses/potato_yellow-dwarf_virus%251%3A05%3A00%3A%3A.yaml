simpleMeaning: a tiny thing that spreads sickness in a root plant, so the plant stays small and its leaves
  lose their green colour
scope: This is a tiny thing that spreads sickness in a root plant, not an insect that eats leaves and
  not a plant that is short by nature.
examples:
- The potato yellow-dwarf virus made the plants stay small and their leaves lose their green colour.
- Farmers removed plants hit by potato yellow-dwarf virus so it would not spread.
