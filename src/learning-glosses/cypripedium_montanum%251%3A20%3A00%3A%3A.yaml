simpleMeaning: A leafy plant from Alaska to northern California and Wyoming, with few stems in a bunch
  and one white and dull purple flower where each upper leaf meets its stem.
scope: Also called a mountain lady's slipper; a leafy plant with a few stems in a bunch and one white
  and dull purple flower at each upper leaf, kin to other lady's slipper plants.
examples:
- Cypripedium montanum grows in the mountains, one white and dull purple flower at each leaf.
- We found Cypripedium montanum from Alaska to northern California.
