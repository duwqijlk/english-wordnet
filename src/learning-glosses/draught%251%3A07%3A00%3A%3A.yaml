senseId: 'draught%1:07:00::'
synsetId: 05142420-n
simpleMeaning: how far the lowest part of a ship goes down below the water, most of all when the ship
  is full
scope: How deep a ship sits in the water; draft is another name for this sense. Not a serving of drink
  from a keg, and not the act of pulling a load.
examples:
- The draught of the loaded ship was ten feet.
- With a deep draught, the ship could not enter the shallow harbour.
