simpleMeaning: A place to drink, a building with a bar and rooms open to everyone, that often serves light
  meals
scope: Also called a pothouse, pub, public house, or saloon, this is a drinking place with a bar and open
  rooms, not a shop that sells drink to take away and not a private club.
examples:
- They met at the gin mill for a drink after work.
- The old gin mill on the corner served light meals as well as beer.
