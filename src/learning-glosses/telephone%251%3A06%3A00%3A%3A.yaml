simpleMeaning: a piece of equipment that turns sound into electric signals, sends them far away, and turns
  signals it gets back into sound
scope: This equipment is also called phone; it is not the act of calling someone, which is the verb sense.
examples:
- I talked to him on the telephone last night.
- She picked up the telephone and answered the call.
