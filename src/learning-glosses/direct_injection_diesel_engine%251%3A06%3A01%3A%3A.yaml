simpleMeaning: A diesel-burning engine in which nozzles at the top of the combustion chamber are triggered
  either by hydraulic pump pressure or by an electronic control signal.
scope: Another name for the direct injection diesel; it is the complete engine, not the fuel injectors
  or pump, and not an indirect injection diesel engine.
examples:
- A direct injection diesel engine sprays fuel into the top of the combustion chamber.
- The injectors in a direct injection diesel engine are driven by pump pressure or an electronic signal.
