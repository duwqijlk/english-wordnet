simpleMeaning: to make someone feel a strong disgust and a wish to turn away
scope: 'Also called shock, offend, outrage, appall, and scandalise: this sense is making someone feel
  strong disgust, not spreading talk about a person''s wrongdoing.'
examples:
- His cruel joke scandalized the guests, who turned away in disgust.
- She was scandalized by the dirty and violent show.
