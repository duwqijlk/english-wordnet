simpleMeaning: a big sweat-making organ that gives off a fluid and a second kind of fluid, found in people
  in hairy parts of the body
scope: A sweat organ found in hairy parts of the body, not the small sweat organ found all over the skin.
examples:
- The apocrine glands under his arms became active in his teens.
- Apocrine glands give off a fluid that smells when skin germs act on it.
