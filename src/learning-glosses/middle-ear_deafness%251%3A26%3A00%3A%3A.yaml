senseId: 'middle-ear_deafness%1:26:00::'
synsetId: 14574738-n
simpleMeaning: Loss of the power to pick up sounds because the small bones inside the head are not working
  as they should.
scope: Hearing loss from trouble with the small bones of the middle ear; not loss caused by damage to
  the nerve that carries sounds, and not loss from a blocked outer passage.
examples:
- His middle-ear deafness came from damaged bones inside his head.
- Middle-ear deafness made it hard for her to follow talk in a noisy room.
