simpleMeaning: cold, strong feelings, or a sore, itchy spot can make the small hairs on the body rise
  on their own
scope: The small hairs on the skin rise on their own, also called goose bump, goose pimple, goosebump,
  gooseflesh, horripilation and pilomotor reflex, not rough skin and not a chill.
examples:
- She rubbed her arms, but the goose skin stayed until she warmed up.
- The cold water gave him goose skin all over.
