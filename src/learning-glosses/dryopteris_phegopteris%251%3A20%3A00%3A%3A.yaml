simpleMeaning: A fern of the beech kind that grows in North America and Eurasia.
scope: Also called the long beech fern, the narrow beech fern, the northern beech fern, Phegopteris connectilis
  and Thelypteris phegopteris; a beech fern of North America and Eurasia, not the evergreen wood fern
  that keeps its leaves all year.
examples:
- Dryopteris phegopteris grows in the damp woods of North America.
- The beech fern Dryopteris phegopteris spreads across Eurasia too.
