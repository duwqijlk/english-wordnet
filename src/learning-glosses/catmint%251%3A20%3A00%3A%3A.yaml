simpleMeaning: A hairy, fragrant perennial herb with rings of small white, purple-spotted flowers on a
  spike, once a household remedy and strongly attractive to cats.
scope: This is the flowering garden herb itself, not a culinary mint such as spearmint; catnip is another
  name for the same plant.
examples:
- Catmint grows well in full sun and comes back every spring.
- Bees crowded around the catmint in the border.
