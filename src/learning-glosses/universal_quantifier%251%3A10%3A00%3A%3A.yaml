simpleMeaning: In logic, a word or sign that says a claim holds for every member of a group
scope: A sign meaning 'for every one of them', not a sign meaning 'for some of them' and not the claim
  itself.
examples:
- In the sentence, the universal quantifier shows that the claim is true for every number.
- The universal quantifier at the start of the formula means the claim holds for all members of the class.
