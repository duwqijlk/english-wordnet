senseId: 'inheritor%1:18:00::'
synsetId: 10188177-n
simpleMeaning: A person who has the right, by law or by a will, to take over the money, goods, and land
  a dead person leaves behind.
scope: A person who has the lawful right to what a dead person leaves behind, not one who simply receives
  a gift.
examples:
- As the sole inheritor, she took over the farm and the house.
- The inheritor of the estate paid the debts first.
