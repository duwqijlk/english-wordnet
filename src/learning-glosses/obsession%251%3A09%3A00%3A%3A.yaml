simpleMeaning: a fixed thought about a thing or a person that will not go away and does harm
scope: A fixed, harmful thought about a thing or a person that will not go away, not a motive that drives
  small acts done over and over against your will.
examples:
- His obsession with the game kept him up all night.
- Her obsession with tidiness ruled her whole day.
