simpleMeaning: A long-lived herb from the East Indies to Polynesia and Australia, grown for its large
  edible root, which yields a starch called Otaheite arrowroot.
scope: Also called pia, Indian arrowroot, and Tacca leontopetaloides; a long-lived herb grown for the
  starch from its large edible root, not the true arrowroot plant of the West Indies.
examples:
- Tacca pinnatifida grows across the islands from the East Indies to Australia.
- Farmers grow Tacca pinnatifida for the starch in its large root.
