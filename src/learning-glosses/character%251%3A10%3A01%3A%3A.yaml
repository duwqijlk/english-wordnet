simpleMeaning: a formal recommendation from a past employer to a possible new one, describing the worker's
  qualifications and how reliable they are
scope: Not a person in a story, and not the qualities that make up someone's nature.
examples:
- The landlord asked for a character reference before signing the lease.
- Her former boss provided a character reference for the new job.
