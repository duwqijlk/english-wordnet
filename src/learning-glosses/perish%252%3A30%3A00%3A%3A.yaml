simpleMeaning: when a living thing dies and its body stops doing all the things that keep it alive
scope: To die, so the body stops all the work that keeps it alive; also called die, go, pass, choke, exit,
  croak, decease, and expire.
examples:
- The children perished in the fire.
- She perished from cancer at a young age.
