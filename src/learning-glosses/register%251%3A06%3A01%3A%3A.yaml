simpleMeaning: an opening, usually in the floor or a wall, that lets warm air in or keeps it out of a
  room
scope: An opening in a floor or wall that lets warm air in or keeps it out, not a sliding plate that controls
  air flow and not a machine that adds up a bill.
examples:
- Warm air came up through the register in the floor.
- She closed the register in the wall to keep the room cool.
