simpleMeaning: to carry people or things across water on a boat that goes back and forth
scope: Carrying people or things across water on such a boat, not going across on it yourself, and not
  the boat itself.
examples:
- The boat crew ferried cars across the river all day.
- They ferry food and tools to the island every week.
