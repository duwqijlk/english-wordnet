simpleMeaning: A process in which something makes material from living things break down into simpler
  parts, especially sugar breaking down into alcohol with no air present
scope: This breaking-down process is also called ferment, fermenting, zymolysis and zymosis; it is the
  process itself, not the alcohol it can make.
examples:
- Fermentation turned the sugar in the grape juice into alcohol.
- During fermentation, the mixture slowly broke down and bubbles formed.
