simpleMeaning: In grammar, a verb form with no special mark that states an act or state as a real fact
scope: 'Also called declarative, common mood, declarative mood, fact mood and indicative mood: in grammar,
  the verb form that states facts, not the adjective sense about verbs.'
examples:
- In 'She runs', the verb is in the indicative.
- Teachers call the indicative the form used for plain facts.
