simpleMeaning: A Scottish measure for liquids, equal to nine tenths of a United States pint.
scope: A Scottish measure for liquids, nine tenths of a United States pint; not a full pint, and not a
  measure for dry goods.
examples:
- He poured a mutchkin of ale for the guest.
- The old recipe called for a mutchkin of milk.
