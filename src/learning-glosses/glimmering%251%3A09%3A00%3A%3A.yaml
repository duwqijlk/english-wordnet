simpleMeaning: a faint hint of something, understood only dimly, not yet clear
scope: 'Also called glimmer: a faint, dim hint of something, not a faint light and not a clear idea.'
examples:
- He had only a glimmering of what was about to happen.
- She had a glimmering that the plan would fail.
