simpleMeaning: a place where two bones meet and can move with ease, but only by sliding flat across each
  other
scope: A place where bones meet and slide flat across each other, also called articulatio plana, not a
  hinge that swings one way and not a fixed join.
examples:
- The wrist has a gliding joint that lets the bones slide.
- A gliding joint in the ankle lets the foot move side to side.
