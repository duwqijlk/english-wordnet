simpleMeaning: A hand-written text of an old great work, with loose pages and no cover holding them together,
  not rolled up like a scroll
scope: 'Also called a codex: a hand-written text of an old great work in loose pages, not a rolled-up
  scroll and not a work with pages fixed together.'
examples:
- The scholar studied a leaf-book of the ancient poem.
- The museum keeps a leaf-book that is older than any printed copy.
