simpleMeaning: To jerk a fishing hook in quick moves through or along the top of the water
scope: To jerk a fishing hook in quick moves over the water's surface, not to move quickly across land.
examples:
- He skittered the hook across the surface to tempt the fish.
- She skittered her line through the shallow water.
