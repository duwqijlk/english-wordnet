scope: To make someone react strongly to a drug or to something that sets off a reaction in the body;
  sensitize is another name for this sense; not to make a material react to light and not to make someone
  aware.
examples:
- Long-term exposure to this medicine may sensitise you to the allergen.
- Repeated use can sensitise the patient to the drug.
