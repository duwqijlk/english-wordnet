simpleMeaning: right for the highest ruler, or owned by that ruler
scope: This is right for the highest ruler, or owned by that ruler; royal, purple, regal and majestic
  are other names for this sense, and it is not merely rich or grand.
examples:
- The palace showed imperial splendor in every room.
- He entered with an imperial air, as if he owned the place.
