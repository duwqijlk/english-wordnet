simpleMeaning: a place where two lines or paths cross each other in the shape of the letter X
scope: A crossing of two lines or paths in the shape of an X, also called a chiasm or a chiasma; not a
  single straight path and not a place where roads meet at right angles.
examples:
- The decussation of the two nerve tracts forms an X deep in the brain.
- In the diagram, the decussation showed where the two tracts crossed.
