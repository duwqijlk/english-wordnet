simpleMeaning: The line where a fatty liquid meets the liquid we drink, two liquids that will not mix.
scope: The line where a fatty liquid meets the liquid we drink, two liquids that will not mix; not the
  line where two liquids that mix meet and not the top of a liquid.
examples:
- The oil-water interface showed as a sharp line.
- Oil floated above the oil-water interface.
