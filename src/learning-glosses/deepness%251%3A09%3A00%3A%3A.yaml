senseId: 'deepness%1:09:00::'
synsetId: 05621745-n
simpleMeaning: The power of the mind to work right through an idea and grasp what lies in it.
scope: Also called depth, profundity, and astuteness, the power of the mind to work right through an idea
  and grasp what lies in it; not how far down, back, or in a thing goes, and not a low sound that is loud
  and full.
examples:
- Her deepness of thought impressed her teachers.
- The deepness of his reading showed in every essay.
