simpleMeaning: In computing, describing data sent and loaded continuously, piece by piece, as earlier
  parts are used, or continuous tape transport used mainly to back up unedited data.
scope: A computing adjective for continuous data transfer or tape backup; not the everyday sense 'flowing',
  as in streaming tears, and not the British school use meaning pupils grouped by ability. Technical,
  and the tape-transport sense is dated.
examples:
- She listened to streaming radio on the train.
- The old backup system wrote to a streaming tape drive.
