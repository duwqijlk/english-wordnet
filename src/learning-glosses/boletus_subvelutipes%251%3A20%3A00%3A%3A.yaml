simpleMeaning: A mushroom with a stalk that feels like soft velvet and, most of the time, a dull brown
  cap; hurt parts turn blue at once.
scope: It is a mushroom with a soft stalk and a dull brown cap, set apart from other mushrooms by hurt
  parts that turn blue at once.
examples:
- We found Boletus subvelutipes with a soft stalk and a dull brown cap.
- The cap of Boletus subvelutipes turned blue where it was cut.
