simpleMeaning: A Japanese orchid with white-striped leaves and thin upright clusters of rose to magenta
  flowers; often grown by people, and sometimes put in its own genus.
scope: Also called Bletilla striata; a Japanese orchid with white-striped leaves and thin upright clusters
  of rose to magenta flowers, distinct from other orchids with plain leaves or single flowers.
examples:
- Bletia striata grows in the garden with rose flowers.
- We planted Bletia striata for its white-striped leaves.
