simpleMeaning: In maths, the angle that has a given number as the ratio of the side across from it to
  the longest side of a right-angled triangle.
scope: 'Also called arc sine, arcsine, and inverse sine: the angle worked out from a given number, not
  the sine itself and not the angle from a different triangle ratio.'
examples:
- The arcsin of 0.5 is 30 degrees.
- She used arcsin to find the angle.
