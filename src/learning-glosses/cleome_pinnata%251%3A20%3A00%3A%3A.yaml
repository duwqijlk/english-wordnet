simpleMeaning: A long-lived plant of the south-western United States with stiff blue-green deeply cut
  leaves and thick feather-like spikes of yellow flowers; sometimes put in a genus of the same name.
scope: 'Also called desert plume, prince''s-plume or Stanleya pinnata: a long-lived plant of the south-western
  United States with yellow flower spikes, not a short-lived weed and not a tree.'
examples:
- Cleome pinnata grew on the dry slope, its yellow spikes standing above the blue-green leaves.
- We saw Cleome pinnata with thick feather-like spikes of yellow flowers.
