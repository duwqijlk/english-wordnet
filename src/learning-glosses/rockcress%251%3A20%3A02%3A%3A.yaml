simpleMeaning: a harmful kind of leafy plant with yellow flowers, at times put in the group of plants
  called Sisymbrium
scope: 'Also called rocket cress and yellow rocket: a harmful kind of leafy plant with yellow flowers,
  not a harmless salad green and not a garden flower.'
examples:
- The rockcress by the wall was covered in small yellow flowers.
- She pulled out the rockcress before it could spread.
