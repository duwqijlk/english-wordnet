simpleMeaning: A tow on skis that pulls people up a slope while their skis stay on the snow.
scope: A tow on skis that pulls people up a slope while their skis stay on the snow; not a chair that
  carries people in the air and not a rope tow that pulls by hand.
examples:
- Beginners use the surface lift to get up the slope.
- The surface lift pulled the skiers up without lifting them off the snow.
