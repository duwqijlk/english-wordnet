simpleMeaning: The study of features of the earth that were once at its surface but now lie under rock.
scope: 'Also called palaeogeology: the study of parts of the earth once on its surface and now under rock,
  not the study of rocks that are still on the surface and not the study of the earth''s deep core.'
examples:
- Paleogeology tells us which rocks were once at the surface.
- She took a course in paleogeology to learn about buried landforms.
