simpleMeaning: To move forward in an awkward way, not seeing where you are going.
scope: This is the verb for moving clumsily, also called fumble, not the sense of making a bad mistake.
examples:
- He blundered towards the door in the dark.
- She blundered through the woods, tripping over roots.
