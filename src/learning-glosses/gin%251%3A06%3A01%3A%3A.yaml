simpleMeaning: a trap for birds or small mammals, animals that feed their young with milk, often with
  a rope loop that slips tight
scope: A trap for birds or small mammals, often with a rope loop that slips tight; also called a snare
  or a noose, not the machine that cleans cotton, not the drink, and not the act of taking seeds out of
  cotton.
examples:
- The hunter set a gin in the woods.
- A rabbit was caught in the gin by its leg.
