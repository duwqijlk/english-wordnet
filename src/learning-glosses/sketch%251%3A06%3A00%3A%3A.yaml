simpleMeaning: a first, rough drawing that is made before a more finished work
scope: 'Also called study: a first rough drawing made before a finished work, not a funny drawing in a
  newspaper and not the action of describing something in a rough, short way, giving only the main points.'
examples:
- He made a quick sketch before starting the painting.
- The artist showed us her first sketch for the picture.
