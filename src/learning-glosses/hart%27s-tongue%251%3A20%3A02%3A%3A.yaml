simpleMeaning: Tough leaves shaped like long spearheads grow on this fern of warm America, which grows
  on land; sometimes counted with the group called Polybotrya.
scope: Also called hart's-tongue fern, this is a fern of warm America with tough spear-shaped leaves.
examples:
- Hart's-tongue grew in the shade of the rocks.
- The hart's-tongue kept its leaves through the winter.
