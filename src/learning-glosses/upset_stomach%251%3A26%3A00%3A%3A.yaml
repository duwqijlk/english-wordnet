simpleMeaning: A trouble with digestion that brings pain in the belly, a burning feeling, or a wish to
  be sick.
scope: 'Also called indigestion, dyspepsia and stomach upset: a trouble with digestion that brings belly
  pain, burning or sickness, not hunger and not a pain from an injury.'
examples:
- An upset stomach kept her awake with burning and sickness.
- He had an upset stomach after the rich meal.
