simpleMeaning: A close kin of the tree that grows by ponds, this large tree of the eastern United States
  and south-east Canada has thin leaves in bunches of three.
scope: Also called a pitch pine, it is the large tree with thin leaves in bunches of three, a close kin
  of the pond pine that grows by ponds.
examples:
- We counted the thin leaves on a northern pitch pine and found three in each bunch.
- The northern pitch pine is a close kin of the pond pine.
