simpleMeaning: A way of drawing the earth on a flat map by laying it on a pointed shape with its tip over
  one of the poles.
scope: Also called conical projection; a way of drawing the earth on a flat map from a pointed shape,
  not a drawing on a flat sheet and not a drawing on a round ball.
examples:
- A conic projection suits maps of the middle latitudes.
- The atlas uses a conic projection for North America.
