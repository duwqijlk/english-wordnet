senseId: 'gregorian_telescope%1:06:00::'
synsetId: 02981937-n
simpleMeaning: A light-gathering glass that bends light back with a dish-shaped first mirror and a saddle-shaped
  second mirror, bringing light to a point through a hole in the first mirror
scope: A glass that bends light back with two curved mirrors, not a glass that lets light pass straight
  through or a pair of field glasses; also called Cassegrainian telescope.
examples:
- The Gregorian telescope showed the stars through its two mirrors.
- He looked through a Gregorian telescope at the moon.
