simpleMeaning: The ideas of the most extreme group of the French Revolution, the group that set up the
  Reign of Terror
scope: This is the ideas of the most extreme group of the French Revolution, the group behind the Reign
  of Terror; other groups of that time held less extreme ideas.
examples:
- Jacobinism drove the most radical part of the French Revolution.
- Jacobinism led to the Reign of Terror.
