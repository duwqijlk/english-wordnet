simpleMeaning: The lever that sets off the firing parts of a weapon.
scope: 'Also called trigger: the lever you pull to fire a gun, not the safety switch and not the bullet
  itself.'
examples:
- His finger rested on the gun trigger as he aimed.
- She squeezed the gun trigger and the shot rang out.
