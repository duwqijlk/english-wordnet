simpleMeaning: of events, having very bad results and causing great harm or complete loss
scope: 'Also called black, disastrous, fatal and calamitous: said of events with very bad results, not
  just very important and not fixed beforehand by fate.'
examples:
- The fateful day of the crash ruined many lives.
- A fateful error led to the loss of the whole business.
