simpleMeaning: a body-made substance from a small gland at the base of the brain that stops pain
scope: A body-made substance from a small gland at the base of the brain that stops pain, not a drug that
  stops pain and not another body-made substance that lifts the mood.
examples:
- Running raised her beta endorphin levels and dulled the ache in her legs.
- Beta endorphin from the small gland at the base of the brain helps stop pain after hard exercise.
