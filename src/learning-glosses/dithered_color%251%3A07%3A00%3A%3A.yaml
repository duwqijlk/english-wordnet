simpleMeaning: A shade made by a pattern of small dots in unlike hues that, seen together, look like the
  shade wanted
scope: This is a shade made from a pattern of small dots in unlike hues; dithered colour, nonsolid color
  and nonsolid colour are other names for it, not a flat single shade.
examples:
- The dithered color on the screen looked smooth from a distance.
- She chose a dithered color for the old printer.
