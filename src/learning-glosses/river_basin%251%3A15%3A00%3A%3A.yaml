simpleMeaning: All the water from one stretch of land runs out at the same place, after the streams and
  rain there have fed into one big waterway.
scope: Also called basin, watershed, catchment area, catchment basin, drainage area and drainage basin,
  this is the whole stretch of land whose streams and rain feed one big waterway and run out at one place.
examples:
- They mapped the river basin to plan flood control.
- They worked on flood control in the Missouri river basin.
