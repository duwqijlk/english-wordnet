simpleMeaning: a living thing that can move on its own
scope: This is one living thing that can move on its own, also called an animal, a creature, a beast,
  or a brute; it is not a plant, which stays in one place.
examples:
- He put the fauna, a live crab, in a tank, where it moved about on its own.
- The fauna she held was a frog, and it jumped from her hands by itself.
