simpleMeaning: to hold a person back or keep them in one place, as if with metal rings locked round the
  wrists
scope: To hold a person back as if with wrist rings, also called cuff, not the rings themselves and not
  just to tie someone up.
examples:
- The police handcuffed the suspect at the scene of the crime.
- They handcuffed the prisoner to the chair so he could not move.
