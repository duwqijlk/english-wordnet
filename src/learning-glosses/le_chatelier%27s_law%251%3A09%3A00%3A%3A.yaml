simpleMeaning: An idea that says a system at rest in balance shifts to a new balance that fights a change
  put on it.
scope: A rule saying a system at rest in balance shifts to fight a change, also called Le Chatelier's
  principle, Le Chatelier-Braun principle and Le Chatelier principle; its near kin are other rules of
  chemistry about systems in balance.
examples:
- Le Chatelier's law says a system in balance fights a change.
- We used Le Chatelier's law to work out what would happen.
