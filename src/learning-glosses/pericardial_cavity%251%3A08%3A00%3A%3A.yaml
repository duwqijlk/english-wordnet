simpleMeaning: the gap between the two layers round the heart, holding fluid that lets the heart move
  with ease
scope: 'Also called pericardial space: the gap between the two layers round the heart, holding fluid that
  lets the heart move, not the heart itself and not the chest space.'
examples:
- Fluid filled the pericardial cavity after the injury.
- The pericardial cavity lets the heart beat freely.
