simpleMeaning: a light at a place where roads cross that tells cars when to stop and when to go
scope: A light at a road crossing that tells traffic when to stop and go; not the red light at the back
  of a car that shows the brakes are on.
examples:
- We waited at the stoplight until it turned green.
- The stoplight at the corner was red, so all the cars stopped.
