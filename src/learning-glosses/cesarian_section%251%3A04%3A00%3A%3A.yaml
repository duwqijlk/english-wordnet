simpleMeaning: A baby born by surgery has its mother cut open through the belly and womb, a birth once
  thought to be how Julius Caesar was born.
scope: Also called cesarean, caesarian, abdominal delivery, caesarean, caesarean delivery, caesarean section,
  caesarian delivery, caesarian section, cesarean delivery, cesarean section, and cesarian; a birth by
  surgery, not a birth the usual way.
examples:
- The doctor performed a cesarian section to bring the baby out.
- She had a cesarian section for her second child.
