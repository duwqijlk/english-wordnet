simpleMeaning: The way a thing happens in a sudden rush, with no warning at all.
scope: 'Also called suddenness: the way a thing happens in a sudden rush with no warning, not the steepness
  of a slope and not a short, rude manner.'
examples:
- The abruptness of his departure surprised everyone.
- She was startled by the abruptness of the storm.
