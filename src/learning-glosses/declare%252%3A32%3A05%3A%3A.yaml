simpleMeaning: to make something known to the public, or to make it known in an official way
scope: 'Another name for announce: to say something in public or in an official way, not to name a trump
  suit in cards and not to say you are for or against something.'
examples:
- The president declared war on the other country.
- The government declared a public holiday for tomorrow.
