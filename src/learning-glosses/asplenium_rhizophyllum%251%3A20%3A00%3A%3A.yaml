simpleMeaning: Ferns with long, narrow leaves that take root at the tip
scope: Also called walking fern, walking leaf and Camptosorus rhizophyllus; ferns whose long, narrow leaves
  take root at the tip, which is why they are called walking ferns.
examples:
- Asplenium rhizophyllum spreads as its leaves root at the tip.
- The long leaves of Asplenium rhizophyllum bend down and take root.
