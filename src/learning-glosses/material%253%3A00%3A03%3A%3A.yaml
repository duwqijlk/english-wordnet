simpleMeaning: Real and solid, so it can be treated as a fact rather than a dream, a made-up story, or
  another product of the imagination.
scope: 'This is the sense of being real and substantial rather than imagined; distinct from material%3:00:04::
  (having a physical body or visible form), material%3:00:01:: (made of matter), material%3:00:02:: (important
  to a legal case), material%5:00:00:physical:00 (about bodily welfare rather than mental or emotional
  health), and material%5:00:00:worldly:00 (about worldly rather than spiritual interests); not material%1:27:00::
  (the substance an object is made of), material%1:10:00:: (information used to make something), material%1:06:00::
  (woven cloth), material%1:06:01:: (supplies needed for a task), or material%1:18:00:: (a person thought
  fit to be hired or admitted).'
examples:
- The threat was material, not a story invented to frighten the children.
- 'Her grief was material: it had weight and did not fade when she opened her eyes.'
