simpleMeaning: A strong feeling against using or naming something, above all in Polynesia and other South
  Pacific islands, because it is sacred.
scope: This is a strong feeling against using or naming something sacred, also called taboo, and not a
  law or a custom of good manners.
examples:
- It was tabu to speak the chief's name.
- The tabu kept strangers from the sacred place.
