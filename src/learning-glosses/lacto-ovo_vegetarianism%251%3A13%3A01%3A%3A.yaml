simpleMeaning: An eating plan based mainly on plant foods that also allows some animal products, such
  as eggs (ovo), milk and cheese (lacto), but excludes meat, fish and poultry.
scope: Ovo-lacto vegetarianism is another name for this diet; it is not veganism, and not the lacto-only
  or ovo-only forms.
examples:
- She follows lacto-ovo vegetarianism, so she eats eggs and cheese but no meat.
- Lacto-ovo vegetarianism allows milk, eggs and cheese but excludes fish and poultry.
