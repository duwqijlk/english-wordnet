simpleMeaning: A blood-vessel growth on the gland above the kidney that makes too much of the chemical
  that speeds the heart, so blood pressure stays high or rises and falls.
scope: Also called phaeochromocytoma; a blood-vessel growth on the gland above the kidney, not a growth
  in the kidney itself.
examples:
- The pheochromocytoma made his blood pressure stay high for weeks.
- Surgeons took out the pheochromocytoma from the gland above his kidney.
