simpleMeaning: Describes a molecule or atom that can now take part in a chemical reaction, or can do so
  more easily than before.
scope: This is about a molecule or atom that has been made able to react, not a person who is emotionally
  stirred up, aroused, or wildly excited.
examples:
- The excited molecules reacted with the surrounding gas almost at once.
- Excited atoms in the sample reacted far more readily than the stable ones.
