senseId: 'sulcus_lateralis_cerebri%1:08:00::'
synsetId: 05231373-n
simpleMeaning: a deep cut in the brain's outer layer marks the line between front and side lobes in each
  half, deeper and more marked than any other such cut
scope: Also called lateral cerebral sulcus; the most marked cut in the brain's outer layer, not a crack
  from injury and not the whole outer layer itself.
examples:
- The sulcus lateralis cerebri marks the line between the front and side lobes.
- Doctors point to the sulcus lateralis cerebri on a scan of the brain.
