simpleMeaning: Any medicine that harms cells, often used in treatment with strong chemicals to stop the
  growth of cancer cells.
scope: This is a medicine that harms cells, often used against cancer, not a medicine that kills germs
  or one that eases pain.
examples:
- The cytotoxic drug was given to stop the cancer cells from growing.
- Her doctor warned her that the cytotoxic drug would also harm healthy cells.
