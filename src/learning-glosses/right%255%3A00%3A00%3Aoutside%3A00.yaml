simpleMeaning: Describing the side of cloth or clothing that faces or is meant to face outward.
scope: This is not the sense meaning correct or suitable, and not the political sense; it describes the
  outer face of cloth or clothing.
examples:
- The right side of the fabric is smooth and slightly shiny.
- Sew the two pieces together with their right sides facing each other.
