simpleMeaning: to go from one place to another by a longer way round instead of the straight road
scope: To take a longer way round to reach a place, not the noun sense of the roundabout road itself.
examples:
- We had to detour around the closed bridge to reach the town.
- The bus will detour through the side streets this week.
