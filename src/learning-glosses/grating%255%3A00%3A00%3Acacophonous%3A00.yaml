simpleMeaning: of a sound, rough and hard on the ears, so it hurts to listen
scope: 'Also called rough, scratchy, raspy and rasping: a harsh sound that hurts the ears, not a metal
  barrier with bars and not a grooved plate that splits light.'
examples:
- Her grating voice made everyone in the room wince.
- The grating sound of the old gate set my teeth on edge.
