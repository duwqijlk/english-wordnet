simpleMeaning: a place that can be filled with hot mist where people wash themselves, called a vapour
  bath in Britain
scope: Also called a steam bath, a vapor bath, and a vapour bath; a place for washing in hot mist, not
  a sauna and not a shower.
examples:
- After the gym, she sat in the steam room for ten minutes.
- The hotel steam room was full of warm mist.
