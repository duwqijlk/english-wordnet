simpleMeaning: An object set right in the middle of something else; flowers set in the middle of a table
  are one
scope: This is a real thing put in the middle, such as flowers on a table, not the main or most important
  part of an event or plan.
examples:
- A bowl of flowers was the centerpiece on the table.
- They put a tall candle as the centerpiece for the dinner table.
