schema: oewn-learning-gloss-v2
senseId: 'shame%2:41:01::'
synsetId: 02513727-v
simpleMeaning: to make a person do something by making them feel they have done wrong or are not good
  enough
scope: To make a person act by making them feel they have done wrong or are not good enough, not the painful
  feeling itself, and not causing someone to lose the respect of others.
examples:
- They shamed him into giving the money back.
- She shamed her brother into saying sorry.
