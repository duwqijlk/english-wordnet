simpleMeaning: An agency working to make sure the United States military gains the lead in information,
  running ground sites around the world and a set of airborne spying and watching platforms.
scope: Also called Air Force Intelligence Surveillance and Reconnaissance and Air Force ISR; an agency
  that works for United States military information lead, running ground sites around the world and airborne
  spying and watching platforms.
examples:
- AFISR runs ground sites around the world for the military.
- The AFISR platforms watch from the air to gather information.
