simpleMeaning: to tie a bird's wings and legs in place before you cook it
scope: A cooking action done to a bird before cooking; not the frame that holds up a roof or bridge, and
  not a belt worn to hold a part of the body in place.
examples:
- She trussed the chicken before putting it in the oven.
- He learned to truss a duck so its wings and legs stayed in place while it cooked.
