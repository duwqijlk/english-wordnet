simpleMeaning: a drug sold as Darvon that dulls pain and can make a person sleepy, kin to methadone but
  less likely to hook a person
scope: A drug sold as Darvon that dulls pain and can make a person sleepy, kin to methadone but less likely
  to hook a person; also called propoxyphene hydrochloride; not a drug for sleep on its own, and not a
  drug that wakes a person up.
examples:
- The doctor gave him propoxyphene for the pain after the fall.
- Propoxyphene was sold under the name Darvon.
