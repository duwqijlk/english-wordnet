simpleMeaning: To draw in prey, these sea animals dangle a thin worm-like thread from huge mouths.
scope: Also called an anglerfish, an angler, a monkfish, allmouth, an angler fish or lotte, these are
  the sea animals with huge mouths that draw in prey with a thin worm-like thread.
examples:
- The goosefish opened its huge mouth.
- The goosefish drew prey in with its worm-like thread.
