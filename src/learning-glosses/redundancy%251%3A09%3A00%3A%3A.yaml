simpleMeaning: In electronics, a way of building a system with extra copies of parts, so another part
  can take over if one part stops working
scope: In electronics, this is a back-up plan built into a system; it is not sending the same message
  again to cut errors, and not the state of being more than is needed.
examples:
- The plane's computers have redundancy, so a second computer takes over if the first fails.
- Engineers built redundancy into the power system to keep it running.
