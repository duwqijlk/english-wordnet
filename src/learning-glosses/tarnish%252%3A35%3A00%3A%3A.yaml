simpleMeaning: left in the air for a long time, a thing grows dull and spotted with dirt; it can also
  mean a good name is spoiled the same way
scope: 'Also called stain: to leave a thing dirty or spotty, or to spoil a good name the same way.'
examples:
- The silver was tarnished by the long exposure to the air.
- Her reputation was tarnished after the affair with a married man.
