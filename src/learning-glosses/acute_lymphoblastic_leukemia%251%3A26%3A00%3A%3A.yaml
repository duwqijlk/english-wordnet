simpleMeaning: A sudden leukemia showing the growth of young lymphoblast-like cells in bone marrow, lymph
  nodes, spleen, and blood, most common in children.
scope: This sense is also called acute lymphocytic leukemia, for a sudden leukemia showing the growth
