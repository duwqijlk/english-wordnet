simpleMeaning: All at once, to make a loud sound with the voice that bursts out in one go
scope: Also called call, cry, holler, scream, shout, squall and yell, this is a sudden loud sound with
  the voice, not a long speech and not a quiet word.
examples:
- He holloed across the field when he saw his friend.
- She holloed in pain when the needle went in.
