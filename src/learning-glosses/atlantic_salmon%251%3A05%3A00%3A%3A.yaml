simpleMeaning: A fish found in the sea waters of the north and in the rivers that run into them, whose
  grown fish do not die after they lay eggs.
scope: A fish of the sea waters of the north and their rivers, also called Salmo salar, whose grown fish
  do not die after they lay eggs; the pink meat of the same fish is another sense of the word.
examples:
- The Atlantic salmon swam up the river to spawn.
- Atlantic salmon return to the same river each year.
