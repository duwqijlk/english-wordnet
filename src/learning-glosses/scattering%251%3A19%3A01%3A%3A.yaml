simpleMeaning: a light fall of rain that comes down in some places and not in others close by
scope: A light fall of rain in some places and not others close by, also called a sprinkle, not the scattering
  of particles in physics and not the act of scattering.
examples:
- A scattering of rain fell on the north fields but not the south.
- The scattering passed quickly and the sun came out.
