simpleMeaning: a small bowl full of tiny holes, made from bone ash, used to test metals and take precious
  metals out of lead or other metals
scope: 'Also called cupel and refractory pot: a small porous bowl for testing metals, not a cup for drinking.'
examples:
- The bone-ash cup held the molten metal during the test.
- He placed the sample in a bone-ash cup to separate the silver from the lead.
