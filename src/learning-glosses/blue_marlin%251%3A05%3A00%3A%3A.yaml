simpleMeaning: the biggest kind of sea fish, which can grow to 2000 pounds and lives in warm seas all
  over the world
scope: The biggest of its kind of sea fish, which can grow to 2000 pounds and lives in warm seas all over
  the world, not a smaller sea fish and not a fish of cold seas.
examples:
- The blue marlin weighed nearly 2000 pounds.
- A blue marlin leapt from the warm sea.
