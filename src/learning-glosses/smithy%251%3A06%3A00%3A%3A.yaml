simpleMeaning: a place where metal is made soft with heat and then hit with a hammer to shape it
scope: 'Also called forge: a place for heating and hammering metal, not the metal worker himself and not
  a factory that makes many things by machine.'
examples:
- The horseshoes were made in the smithy at the edge of the village.
- Smoke rose from the smithy as the workers heated the iron.
