simpleMeaning: a small oyster that people eat, most often from the south shore of Long Island
scope: 'Also called bluepoint: a small oyster people eat, most often from the south shore of Long Island,
  not the wider raw-oyster sense from anywhere along the northeast coast.'
examples:
- We ordered a dozen blue points at the oyster bar.
- The blue point on the half shell came from the south shore of Long Island.
