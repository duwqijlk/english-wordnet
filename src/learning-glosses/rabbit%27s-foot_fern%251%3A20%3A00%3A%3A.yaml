simpleMeaning: A fern from tropical America, grown for its large, deeply cut, dark blue-green leaves and
  having scaly brown underground stems; it is sometimes grouped in the genus Polypodium.
scope: Another name for golden polypody; it is this tropical fern, not a Boston fern or a maidenhair fern.
examples:
- The rabbit's-foot fern has brown, scaly stems that creep along the soil.
- She grows a rabbit's-foot fern for its large, dark blue-green fronds.
