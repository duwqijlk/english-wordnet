simpleMeaning: The state flower of Maryland, from central and south-eastern United States, with daisy-like
  flowers that have dark centres and yellow to orange rays.
scope: Also called black-eyed Susan and Rudbeckia hirta; the state flower of Maryland, not a true daisy
  and not a flower of the far north.
examples:
- The Rudbeckia serotina is the state flower of Maryland.
- Rudbeckia serotina has dark centres and yellow rays.
