simpleMeaning: Round a rod or piston that moves back and forth, the stuff is pressed tight in this small
  room to make a seal.
scope: 'Also called stuffing box: the stuff is pressed tight round a moving rod or piston in this small
  room, not in a crate for shipping goods.'
examples:
- The packing box stopped the leak where the rod came out.
- They checked the packing box round the moving piston.
