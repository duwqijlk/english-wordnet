simpleMeaning: From the head of the male sex organ, a blood tube runs to join the deep blood tube of the
  groin that drains the skin between the legs.
scope: Among the blood tubes of the groin, this one runs from the head of the male sex organ to join the
  deep blood tube that drains the skin between the legs.
examples:
- The vena bulbi penis drains blood from the head of the penis.
- Blood from the vena bulbi penis flows into the vein that drains the perineum.
