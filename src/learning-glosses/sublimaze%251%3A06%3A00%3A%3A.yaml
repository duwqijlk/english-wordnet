senseId: 'sublimaze%1:06:00::'
synsetId: 03333595-n
simpleMeaning: Trade name for a nerve-acting pain-killing drug breathed in that can addict, used by vets
  in surgery, as a not-deadly gas to stop people in hostage cases, and for fun.
scope: Also called Fentanyl; a strong pain-killing drug that can be breathed in, not a drug that only
  eases mild pain and not a drug taken only by mouth.
examples:
- The vet gave the dog Sublimaze before the operation.
- Sublimaze can be breathed in as a gas.
