simpleMeaning: Into the blood tube above the eye flows blood from the gland that makes tears, through
  this tube.
scope: Also called lacrimal vein, it is the tube that carries blood away from the tear-making gland toward
  the eye's upper tube.
examples:
- The vena lacrimalis carries blood away from the gland that makes tears.
- Blood from the tear-making gland passes through the vena lacrimalis to the tube above the eye.
