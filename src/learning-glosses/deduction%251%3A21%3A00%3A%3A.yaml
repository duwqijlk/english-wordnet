simpleMeaning: an amount or share of money that is taken off a larger sum
scope: An amount or share of money taken off a larger sum; not a cut in the amount on which tax is worked
  out, and not a fact a person works out by thinking.
examples:
- A deduction of fifty dollars was taken from his pay for the uniform.
- The bill shows a deduction for the damaged box.
