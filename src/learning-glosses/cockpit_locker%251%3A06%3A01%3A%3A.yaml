simpleMeaning: In boats, a large storage box under the seats in the part of the boat where the crew sits
scope: A large storage box under the seats where the boat's crew sits; not a cupboard inside the cabin
  and not a box on deck.
examples:
- He stowed the ropes in the cockpit locker.
- The cockpit locker was full of life jackets.
