simpleMeaning: The air left in a mine after a blast, full of carbon dioxide, in which nothing can live
scope: The air left in a mine after a blast, full of carbon dioxide, in which nothing can live; blackdamp
  is another name for this sense, not the gas that burns in a mine and not fresh air.
examples:
- After the blast, chokedamp filled the mine.
- No one can live in chokedamp for long.
