simpleMeaning: In wet places all over the north half of the world grows a plant that lives for years,
  with a stem under the ground that has no smell.
scope: This plant that lives for years has a stem under the ground with no smell and is found in wet places
  all over the north half of the world, not the foul-smelling kind.
examples:
- Hedge nettle spread across the wet ground.
- This hedge nettle had no smell at all.
