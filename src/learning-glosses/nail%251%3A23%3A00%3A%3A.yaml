simpleMeaning: an old unit for measuring cloth, equal to one sixteenth of a yard
scope: This is an old measure for cloth, not the hard cover on a finger or toe and not the thin metal
  pin you hit into wood.
examples:
- The tailor measured the cloth as twelve nails long.
- In old Britain, cloth was sold by the nail, a small unit of length.
