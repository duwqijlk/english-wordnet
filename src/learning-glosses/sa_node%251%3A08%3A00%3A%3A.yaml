simpleMeaning: A small part of the heart that has the special job of setting the pace of the heartbeat
scope: This is the heart's own pace-setter, also called pacemaker, cardiac pacemaker or sinoatrial node,
  not the whole heart and not a machine fitted to the chest.
examples:
- The SA node sends the signal that starts each heartbeat.
- If the SA node fails, the heart may beat too slowly.
