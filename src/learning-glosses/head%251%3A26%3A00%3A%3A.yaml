simpleMeaning: the tip of an infected swelling on the body, where the pus collects
scope: This is not the whole infected swelling and not the body part above the neck; it is only its pointed
  top.
examples:
- The abscess came to a head and burst.
- The doctor said the head of the boil was ready to drain.
