simpleMeaning: poetry that reads the same backwards and forwards, named for Satodes, a poet of Ancient
  Greece
scope: Poetry that reads the same both ways, named for the poet Satodes; not ordinary rhyming poetry and
  not a word game.
examples:
- The sotadic verse read the same forwards and backwards.
- He wrote a sotadic verse that began 'llewd did I live, and evil I did dwell'.
