senseId: 'lividity%1:07:00::'
synsetId: 04984828-n
simpleMeaning: The skin loses its normal colour in a way that is not natural, as from a bruise, sickness
  or upset feelings
scope: 'Also called lividness, pallor, paleness, achromasia, luridness and pallidness: skin that has lost
  its natural colour, not a healthy glow and not a rash.'
examples:
- The lividity of her face after the fall worried the nurse.
- Lividity set in around the bruise, leaving the skin pale and grey.
