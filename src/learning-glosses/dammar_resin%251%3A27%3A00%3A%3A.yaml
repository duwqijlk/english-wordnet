simpleMeaning: Any of a range of hard sticky material from trees of the Dipterocarpaceae family and of
  the Agathis kind, with the amboyna pine as a marked case.
scope: This is a hard sticky material from Dipterocarpaceae and Agathis trees, also called damar, dammar,
  and gum dammar, not tree sap in general or a soft gum from other trees.
examples:
- The dammar resin was used to make a clear varnish.
- Dammar resin comes from trees of the Agathis kind.
