senseId: 'distastefully%4:02:00::'
synsetId: 00315534-r
simpleMeaning: in a way that is so unpleasant that it makes people feel sick or want to look away, or
  to that degree
scope: Also called sickeningly, disgustingly and revoltingly, this means in a way so unpleasant it makes
  people feel sick, not just in a way that shocks or offends people.
examples:
- His hands were distastefully dirty after cleaning the drains.
- The soup tasted distastefully sour and old.
