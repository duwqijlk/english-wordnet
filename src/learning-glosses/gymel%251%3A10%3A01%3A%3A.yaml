senseId: 'gymel%1:10:01::'
synsetId: 92441266-n
simpleMeaning: A way of singing, found in some old English music, in which voice parts move together a
  third apart
scope: This is a way of singing in some old English music with voice parts moving together a third apart,
  not singing in unison and not singing in rounds.
examples:
- The choir sang a gymel from a medieval manuscript.
- In the gymel, the two voices moved in parallel thirds.
