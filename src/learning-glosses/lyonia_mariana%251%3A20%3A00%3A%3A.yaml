simpleMeaning: A shrub of the coastal plain of the eastern United States that loses its leaves each year,
  with nodding pinkish-white flowers, poisonous to farm animals.
scope: 'Also called stagger bush and staggerbush: a shrub of the coastal plain with nodding pinkish-white
  flowers, not a shrub that keeps its leaves and not a shrub safe for farm animals.'
examples:
- Lyonia mariana grew on the coastal plain, its pinkish-white flowers nodding.
- Farmers keep stock away from Lyonia mariana, which is poisonous.
