simpleMeaning: a separate object that takes up space in three dimensions, is made of matter, and can be
  told apart from other objects.
scope: This is not a person's or animal's trunk and not the hollow sounding part of an instrument; it
  is any separate material object in space.
examples:
- Every body in the solar system is pulled toward the sun by gravity.
- In physics, a falling body accelerates at the same rate regardless of its mass.
