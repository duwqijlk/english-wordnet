simpleMeaning: Any of many plant-eating creatures with no poison, with a round body of 20 to 100 or more
  parts, most with two pairs of legs.
scope: Also called a milliped or millepede; a plant-eating creature with no poison, its round body made
  of 20 to 100 or more parts.
examples:
- A millipede curled up under the damp log.
- The millipede moved on its many pairs of legs.
