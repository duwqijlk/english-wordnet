simpleMeaning: A North American woodland plant with a white flower and a lobed leaf; its root and sap
  are red and cause vomiting; the root was a stimulant and chest medicine.
scope: This white-flowered woodland plant with red sap, not other plants whose roots happen to be red.
examples:
- Redroot is among the first woodland plants to flower in spring.
- A broken redroot stem drips red sap.
