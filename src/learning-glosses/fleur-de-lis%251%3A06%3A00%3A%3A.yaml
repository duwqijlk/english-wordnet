simpleMeaning: In heraldry, a set mark shaped like an iris flower.
scope: In heraldry, a set mark shaped like an iris flower; fleur-de-lys is another name for this sense,
  not a real lily, and not a mark shaped like a rose.
examples:
- The fleur-de-lis marked the old French shield.
- A fleur-de-lis stood above the castle gate.
