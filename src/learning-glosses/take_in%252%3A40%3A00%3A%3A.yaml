simpleMeaning: to get money from a sale or other business deal, or as pay for work done
scope: This is to get money from a sale or other business deal, or as pay for work done; make, clear,
  realize, gain, earn, realise, bring in and pull in are other names for this sense, and it is not letting
  a guest stay or fooling someone.
examples:
- How much does she take in each month at her new job?
- The small shop takes in a good sum every week.
