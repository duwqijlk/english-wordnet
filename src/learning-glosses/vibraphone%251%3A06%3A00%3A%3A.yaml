simpleMeaning: A percussion instrument like a xylophone, but with metal bars and turning disks in the
  parts below the bars that make a wavering sound.
scope: Also called vibes or a vibraharp, a percussion instrument like a xylophone with metal bars.
examples:
- She played a soft tune on the vibraphone.
- The vibraphone rang out above the other instruments.
