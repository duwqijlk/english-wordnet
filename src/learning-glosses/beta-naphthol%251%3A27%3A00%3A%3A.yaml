simpleMeaning: a chemical with the same parts as another chemical but put together in a different way,
  used in rubber to stop air from making it go bad
scope: A chemical like another chemical in make-up but put together in a different way, used to keep rubber
  from going bad in air, not the other kind of naphthol and not a softener added to rubber.
examples:
- Workers add beta-naphthol to the rubber mix to keep it from going bad.
- Beta-naphthol stops air from wearing the rubber down.
