simpleMeaning: A United States award for service members hurt in battle.
scope: This is a United States award for service members hurt in battle, also called the Order of the
  Purple Heart, not an award for service without wounds.
examples:
- He received a Purple Heart after being wounded.
- The Purple Heart is awarded to members wounded in action.
