simpleMeaning: In everyday speech, too proud and thinking you are better and more important than other
  people
scope: Also called snooty and bigheaded, this means too proud and thinking you are better than others,
  not dirty with wet stuff from the nose.
examples:
- He sounded snotty when he said our small shop was not good enough for him.
- Do not be so snotty about other people's clothes.
