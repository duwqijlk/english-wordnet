simpleMeaning: a pleasing arrangement in which the parts of a whole fit well together, as in a design
scope: This is not the equality of money in an account and not physical steadiness; it is the pleasing
  arrangement of parts in a whole.
examples:
- The painting has a fine balance between light and dark areas.
- The designer achieved a balance of colors and shapes.
