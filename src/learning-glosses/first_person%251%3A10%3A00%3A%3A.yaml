simpleMeaning: In grammar, the words and verb forms that point to the one speaking or writing.
scope: In grammar, the words and verb forms that point to the one speaking or writing; not the forms that
  point to the one spoken to, and not the forms that point to a person or thing spoken about.
examples:
- In the first person, the writer says 'I went to the market'.
- The story is told in the first person, so we hear the hero's own thoughts.
