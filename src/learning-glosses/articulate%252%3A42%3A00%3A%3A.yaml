simpleMeaning: to join two parts together so that they meet at a joint and can move
scope: To join bones or parts at a joint so they can move, not to speak clearly and not to be made of
  jointed parts.
examples:
- The ankle bone articulates with the leg bones to form the ankle.
- The two bones articulate at the knee.
