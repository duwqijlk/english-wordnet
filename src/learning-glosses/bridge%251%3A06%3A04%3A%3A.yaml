simpleMeaning: the thin wooden part that lifts the strings above the body of a stringed instrument
scope: The part of a stringed instrument that lifts the strings above the body, not the piece joining
  eyeglass lenses or the dental fitting of false teeth.
examples:
- The violin's bridge had shifted, so the strings buzzed against the fingerboard.
- He replaced the bridge on his fiddle before the concert.
