simpleMeaning: Fixed at birth, voice pitch, body hair, and muscle build mark a person male or female,
  yet they play no part in making children.
scope: Also called secondary sex character and secondary sexual characteristic, voice pitch, body hair,
  and muscle build are fixed at birth and mark a person male or female, not the parts of the body that
  make children.
examples:
- They count body hair as a secondary sex characteristic.
- Her voice pitch is a secondary sex characteristic.
