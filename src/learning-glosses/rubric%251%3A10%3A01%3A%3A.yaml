simpleMeaning: A note that explains a word in a text that is hard to understand.
scope: 'Also called a gloss: a note that explains a hard word in a text, not a heading for a law, not
  directions for church services, and not a rule for how a thing is to be done.'
examples:
- The rubric at the foot of the page explains the hard word.
- Each rubric in the text gives the meaning of an old word.
