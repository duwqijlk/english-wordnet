simpleMeaning: finishing or adding to a piece of music that its writer left with only a few notes written
  down
scope: 'Also called realization: the act of finishing music left with only a few notes, not the finished
  piece itself, not making something real, and not a sale to get money.'
examples:
- The realisation of the old song took months of careful work.
- Her realisation filled in the parts the writer had left blank.
