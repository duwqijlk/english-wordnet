simpleMeaning: The work of the mind by which a person gains a skill or learns something new
scope: The mind's work of gaining skill or knowledge, with learning as another name for this sense, not
  the act of getting hold of a thing and not a skill already gained by training.
examples:
- The child's acquisition of language amazed her parents.
- His acquisition of French took years of study.
