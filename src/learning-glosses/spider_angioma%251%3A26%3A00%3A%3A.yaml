senseId: 'spider_angioma%1:26:00::'
synsetId: 14271551-n
simpleMeaning: A widening of tiny blood tubes near the skin's top, with a red spot in the middle from
  which small tubes spread out
scope: A widening of tiny blood tubes near the skin's top with a red spot in the middle; spider nevus
  and vascular spider are other names for this sense, not a bruise and not a birthmark that stays flat
  and dark.
examples:
- The spider angioma on his cheek showed a red dot with small tubes spreading out.
- A spider angioma is a widening of tiny blood tubes near the skin's top.
