simpleMeaning: to send a message by waving or showing a piece of cloth
scope: To send a message with a piece of cloth, not the cloth itself and not to hang down and lose firmness.
examples:
- She flagged the start of the race with a red cloth.
- The sailor flagged a warning to the other ship.
