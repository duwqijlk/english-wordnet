simpleMeaning: A list from those in charge, of chemicals or medicines, or the like.
scope: An official list of chemicals or medicines, or the like; not a loose, handwritten copy of an ancient
  classic, made on separate pages rather than on a scroll.
examples:
- The codex listed every medicine the hospital could use.
- Pharmacists checked the new drug against the codex.
