simpleMeaning: a sow thistle from Europe and Asia that lives for one year, with soft leaves that have
  sharp points and yellow flower heads whose parts spread from the centre
scope: This is the sow thistle plant with yellow flowers described here. It is not the other milkweed
  plants, the kind with milky juice and pods that open to let out seeds.
examples:
- Milkweed with soft, spiny leaves and yellow flowers grew by the road.
- We found milkweed in the field, a one-year plant with yellow flower heads.
