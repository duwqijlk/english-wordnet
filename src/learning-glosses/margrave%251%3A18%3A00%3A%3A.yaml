simpleMeaning: Above a count in rank, this German nobleman stands on a level with a British marquess.
scope: This is a German nobleman above a count, not the soldier who ruled a border land in old Germany.
examples:
- The margrave outranked the count at court.
- The margrave sat above the count at the feast.
