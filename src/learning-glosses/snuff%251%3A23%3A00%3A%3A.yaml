simpleMeaning: a small pinch of tobacco with no smoke that you breathe in through the nose at one time
scope: A small pinch of smokeless tobacco breathed in through the nose at one time, not the act of smelling
  and not a colour.
examples:
- He took a snuff and sneezed at once.
- A pinch of snuff was all he needed to stay awake.
