senseId: 'scold%1:18:01::'
synsetId: 10581289-n
simpleMeaning: A person, especially a woman, who again and again speaks about what is wrong, and makes
  people annoyed by doing this
scope: This is a person, especially a woman, who again and again says what is wrong; not the act of telling
  a person off in anger, and not just showing that you are unhappy.
examples:
- The old scold complained about the children every day.
- Neighbours saw her as a scold because she always found fault.
