simpleMeaning: When stock is counted this way, the goods that came in most lately are counted as sold
  before the older goods
scope: A way of counting stock that counts the newest goods as sold before older ones, not a way that
  counts the oldest goods as sold before newer ones.
examples:
- The firm uses last in first out for its stock, so the newest goods are counted as sold before the older
  ones.
- Under last in first out, the goods that arrived most lately are treated as the ones sold.
