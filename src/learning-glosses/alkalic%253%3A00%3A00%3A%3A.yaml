senseId: 'alkalic%3:00:00::'
synsetId: 00025841-a
simpleMeaning: of or with a chemical that makes acids weaker, and with a pH above 7, where pH is a number
  that tells how acid a liquid is
scope: 'Another name for this is alkaline: of a thing or liquid that has to do with such a chemical, not
  of a thing that is acid, and not of a thing that is neutral.'
examples:
- The farmer spread lime on the alkalic soil to cut its sourness.
- Tests showed the water was alkalic, with a pH above 7.
