simpleMeaning: A way of counting by place in which only the figures 0 and 1 are used, with two as the
  base.
scope: A way of counting by place using only 0 and 1, also called binary number system and binary numeration
  system; not counting by tens and not a machine.
examples:
- The binary system counts with only two figures.
- In the binary system, ten is written as 1010.
