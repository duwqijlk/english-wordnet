simpleMeaning: The act of an armed force that surrounds a strong place, cuts it off, and keeps on attacking
  it.
scope: The act of an armed force that surrounds a strong place, cuts it off, and keeps on attacking it,
  also called a siege, besieging or beleaguering; not a single attack that moves on and not a cutting-off
  of trade with no attack.
examples:
- The military blockade cut the town off while the army kept attacking.
- A military blockade surrounds a strong place and isolates it.
