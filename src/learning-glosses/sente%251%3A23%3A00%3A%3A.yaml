simpleMeaning: A coin of Lesotho worth one hundredth of a loti; one hundred of the smaller coins make
  one loti.
scope: The small unit of money in Lesotho, the hundredth part of the loti; it is the subunit, not the
  loti itself.
examples:
- One sente is worth one hundredth of a loti in Lesotho.
- She paid two sente for the bread.
