simpleMeaning: 'Left alone, it can turn into a state with fits: in pregnancy, an unhealthy state with
  blood pressure too high, fluid building up, and protein leaking into the urine.'
scope: 'Also called preeclampsia: a state in pregnancy with blood pressure too high, fluid building up,
  and protein leaking into the urine, not the fits themselves.'
examples:
- The doctor found pre-eclampsia when her blood pressure rose and protein showed in her urine.
- Pre-eclampsia left alone can turn into a worse state with fits.
