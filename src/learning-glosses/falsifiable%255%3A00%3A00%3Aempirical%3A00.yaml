schema: oewn-learning-gloss-v2
senseId: falsifiable%5:00:00:empirical:00
synsetId: 00862640-s
simpleMeaning: able to be tested by trial or by watching, so it can be shown true or shown wrong
scope: This describes a claim that can be tested by trial or watching; verifiable and confirmable are
  other names for this sense; not a claim that cannot be tested and not a proven fact.
examples:
- A falsifiable claim can be tested by experiment.
- The theory was falsifiable because observation could prove it wrong.
