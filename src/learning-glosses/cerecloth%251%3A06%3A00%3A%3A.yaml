simpleMeaning: a piece of waxed material that keeps water out, once used to wrap a dead body
scope: A waxed piece that keeps water out and was once used to wrap a dead body, not a rain cover and
  not a plain burial garment.
examples:
- The old cerecloth was stiff with wax and kept the water out.
- They wrapped the body in cerecloth before the burial.
