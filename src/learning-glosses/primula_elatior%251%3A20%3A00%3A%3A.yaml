simpleMeaning: A primrose of Eurasia, with yellow flowers in a bunch that leans to one side
scope: Also called oxlip and paigle, this Eurasian primrose has yellow flowers grouped on one side of
  the stem, not spread all round it.
examples:
- Primula elatior bloomed yellow in the spring garden.
- The Primula elatior by the wall had its flowers all on one side.
