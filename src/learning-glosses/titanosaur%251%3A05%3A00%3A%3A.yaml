simpleMeaning: a plant-eating dinosaur on four legs living in and out of water, with a long thin neck
  and whip-like tail, of the Cretaceous, mostly in the Southern Hemisphere
scope: Also called a titanosaurian; a four-legged plant-eating dinosaur of the Cretaceous, not a meat-eating
  dinosaur and not a sea creature.
examples:
- The titanosaur waded through the shallow river.
- A titanosaur skeleton filled the museum hall.
