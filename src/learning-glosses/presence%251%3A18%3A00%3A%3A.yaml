simpleMeaning: a spirit that cannot be seen but is sensed as being close by.
scope: This is not the state of being in a place, and not the impressive manner in which someone carries
  themselves; it names a spirit that cannot be seen but is sensed nearby.
examples:
- She felt a presence in the empty room.
- The old house was said to have a presence that watched over it.
