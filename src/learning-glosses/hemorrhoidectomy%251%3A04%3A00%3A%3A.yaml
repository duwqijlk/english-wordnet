simpleMeaning: An operation in which swollen veins at the lower end of the gut are tied off and cut out.
scope: An operation that ties off and cuts out swollen veins at the lower end of the gut; haemorrhoidectomy
  is another name for this sense, and this is not a drug treatment or an operation on any other part of
  the gut.
examples:
- The surgeon performed a hemorrhoidectomy to remove the swollen veins.
- After the hemorrhoidectomy, the patient stayed in hospital for two days.
