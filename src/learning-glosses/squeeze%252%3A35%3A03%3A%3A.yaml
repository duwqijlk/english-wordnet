simpleMeaning: push yourself or something into a narrow gap that barely has room for it
scope: Fitting your body or an object into a gap that barely has room, not pinching something between
  the fingers, pressing things together, or making someone act; force and wedge are other names for this
  sense.
examples:
- She squeezed into the last seat on the crowded bus.
- He squeezed the box into the gap behind the sofa.
