simpleMeaning: on the lower side of something, or on the side of it that faces down
scope: This sense is about the lower side itself or the side that faces down, not just being under or
  below a thing at a lower place.
examples:
- The table is smooth on top but rough underneath.
- She taped the note underneath the lid, on its lower side.
