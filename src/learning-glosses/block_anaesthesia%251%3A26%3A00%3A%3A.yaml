schema: oewn-learning-gloss-v2
senseId: 'block_anaesthesia%1:26:00::'
synsetId: 14050878-n
simpleMeaning: A loss of feeling in a part of the body fed by one nerve, brought on by a drug put on that
  nerve.
scope: A loss of feeling in a part of the body fed by one nerve, brought on by a drug put on that nerve;
  block anesthesia, conduction anaesthesia, conduction anesthesia, nerve block anaesthesia and nerve block
  anesthesia are other names for this sense, not a loss of feeling in the whole body and not a loss of
  feeling from cold.
examples:
- The dentist used block anaesthesia for the tooth.
- Block anaesthesia took away feeling in her arm.
