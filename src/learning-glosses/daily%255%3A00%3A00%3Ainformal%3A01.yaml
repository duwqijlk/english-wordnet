simpleMeaning: suitable for normal, everyday use rather than for special events.
scope: This is not the sense 'happening every day'; here it describes clothes or things used on ordinary
  days.
examples:
- This coat is meant for daily wear, not for special occasions.
- The shoes are plain and cheap, good for daily use.
