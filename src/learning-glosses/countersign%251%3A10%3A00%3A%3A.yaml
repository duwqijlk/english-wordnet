senseId: 'countersign%1:10:00::'
synsetId: 06416663-n
simpleMeaning: A second mark of signing, put on a paper already signed, to back it up.
scope: A second mark of signing that backs up a paper already signed, not the act of adding one's own
  mark after another's.
examples:
- The bank asked for a countersign before it would pay out the money.
- Her countersign on the letter showed that she agreed with what it said.
