simpleMeaning: to do with a person who gives up comfort and strictly controls what they want and do, or
  to do with that way of living
scope: 'Also called ascetical: about such a person or that hard, simple way of living; not the noun for
  the person who lives that way.'
examples:
- He lived a simple, ascetic life, with few things of his own.
- Their ascetic practice meant no rich food and very little sleep.
