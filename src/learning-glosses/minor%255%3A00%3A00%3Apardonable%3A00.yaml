simpleMeaning: bad enough only for a punishment that lasts for a time, not for one that lasts for ever
scope: This means a wrong act should get only a punishment that lasts for a time; it is not about harm
  that is small or about low importance.
examples:
- In old church teaching, a minor sin was said to bring only a short punishment.
- He saw it as a minor fault, one that called for a punishment for a time, not for ever.
