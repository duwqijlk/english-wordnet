simpleMeaning: Said of the most recent great age in the earth's past, or of things from that age
scope: Of the most recent great age in the earth's past, not of the earlier age of the dinosaurs.
examples:
- Cenozoic rocks hold the bones of early horses.
- The Cenozoic era saw grass spread across the plains.
