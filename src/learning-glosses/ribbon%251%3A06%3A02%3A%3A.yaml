simpleMeaning: A long strip of material with ink on it, used in a typewriter to put marks on paper
scope: This is the inked strip in a typewriter, not a cloth strip for decorating and not any long thing
  that looks like a thin line.
examples:
- The old typewriter needed a new ribbon before I could type the letter.
- He changed the ribbon so the letters would print dark and clear.
