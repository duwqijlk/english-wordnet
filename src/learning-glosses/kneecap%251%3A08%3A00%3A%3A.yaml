simpleMeaning: a small, flat bone with three sides, in front of the knee, that keeps the knee joint safe
scope: 'Also called patella and kneepan: the bone in front of the knee, not the act of shooting someone
  in that bone.'
examples:
- She hurt her kneecap when she fell on the hard ground.
- The doctor checked his kneecap after the fall.
