simpleMeaning: In biology, the way some living things show two or more clearly different forms during
  their life
scope: In biology, this is the way some living things show two or more clearly different forms during
  their life, not the way one chemical stuff takes different crystal forms.
examples:
- Pleomorphism lets the fungus show two very different forms at different times in its life.
- The pleomorphism of the parasite means it looks quite different in each stage of its life.
