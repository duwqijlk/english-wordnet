simpleMeaning: A plant that grows on lawns and is often seen in the Philippines, and grows in the United
  States too.
scope: Also called Japanese carpet grass and Zoysia matrella, this is a lawn plant of the Philippines
  and the United States, not a lawn plant of other lands.
examples:
- Manila grass covers the lawns in the Philippines.
- They planted Manila grass in the yard.
