simpleMeaning: a machine that pushes small metal pieces through sheets of paper to hold them together
scope: A tool for joining paper with small metal pieces, not the small metal pieces themselves and not
  a person who joins paper.
examples:
- She used a stapler to join the two pages.
- He picked up the stapler and fastened the sheets of the report together.
