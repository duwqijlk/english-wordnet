simpleMeaning: having a frame of bone that is large and heavy next to the soft flesh around it
scope: A word for a body whose frame of bone is large and heavy next to the soft flesh around it, not
  a body with small bones and not a fat body.
examples:
- He was big-boned, with wide shoulders and large hands.
- The big-boned dog looked heavy even when it was young.
