simpleMeaning: A thing that can be beaten into thin sheets or drawn out into threads or wires has this
  way of being shaped.
scope: Also called ductileness, it names the way a thing can be beaten into thin sheets or drawn out into
  threads or wires.
examples:
- The ductility of the metal showed when the smith hammered it into a thin sheet.
- Copper is known for its ductility.
