simpleMeaning: a disorder of the glands in which too much of a hormone called ACTH makes the adrenal gland
  work harder than normal, and the person is very fat
scope: A gland disorder in which the adrenal gland works too hard, not a disorder of the pituitary gland
  and not simple overeating.
examples:
- Hyperadrenalism made her gain a great deal of weight.
- The doctor found hyperadrenalism was behind his swollen face and weight gain.
