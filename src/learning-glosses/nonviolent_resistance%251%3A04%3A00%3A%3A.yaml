simpleMeaning: Peaceful opposition to a government by going without food or refusing to work with it
scope: Peaceful opposition to a government, with nonviolence and passive resistance as other names for
  this sense; not a violent uprising, and not a refusal to pay tax alone.
examples:
- He took part in nonviolent resistance by refusing to eat.
- Nonviolent resistance helped them win their rights without fighting.
