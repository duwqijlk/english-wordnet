simpleMeaning: A mind sickness in which a person loses touch with their own real self and feels strange
  and unreal
scope: A mind sickness in which a person loses touch with their own real self and feels strange and unreal,
  also called depersonalisation, depersonalisation disorder, depersonalisation neurosis, depersonalization,
  depersonalization disorder; not ordinary daydreaming and not the feeling of being a nameless part of
  a big machine.
examples:
- Depersonalization neurosis made her feel unreal, as if she were watching herself.
- He sought help for depersonalization neurosis after months of feeling strange.
