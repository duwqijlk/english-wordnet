simpleMeaning: Saints have their life stories, and the tales told about them, set down in books and other
  writing
scope: Writing that tells the lives and tales of saints, not a life of one saint and not a book of prayers.
examples:
- The library's hagiology shelf held lives of the saints from many lands.
- He studied hagiology to learn the tales told about the early saints.
