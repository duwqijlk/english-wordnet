simpleMeaning: To include someone or something in a group when you make a tally.
scope: This is treating someone as part of a group in a tally, not working out how many there are and
  not giving weight to someone's wishes.
examples:
- You can count her among the few who supported the plan from the start.
- He counted the retired teacher as one of his strongest allies.
