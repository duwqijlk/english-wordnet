simpleMeaning: an American stork with a bill that bends down, like the true ibises, living in wooded swamps
  of the warm parts of the Americas
scope: An American stork with a downward-curved bill that lives in wooded swamps; wood ibis and wood stork
  are other names for this sense. Not a true ibis, and not a stork of dry open land.
examples:
- The flinthead stood in the swamp, its long bill curved down toward the water.
- We saw a flinthead wading through the wooded swamp at dawn.
