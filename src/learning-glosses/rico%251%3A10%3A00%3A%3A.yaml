simpleMeaning: A law meant to wipe out gangs of criminals by setting harsh punishments and taking their
  goods and money
scope: A law meant to wipe out gangs of criminals by setting harsh punishments and taking their goods
  and money, also called the anti-racketeering law, the Racketeer Influenced and Corrupt Organizations
  Act and the RICO Act, not a law about one crime alone and not a law that only fines people.
examples:
- RICO lets the state take a gang's money.
- Prosecutors used RICO against the crime ring.
