simpleMeaning: show someone or something in a picture made with colour
scope: This is about showing a person or scene in a picture, not about coating a surface with paint and
  not about the general activity of making pictures.
examples:
- The artist painted her grandmother from an old photograph.
- He painted the harbour at dawn.
