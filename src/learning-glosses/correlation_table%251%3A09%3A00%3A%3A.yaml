simpleMeaning: 'A two-way grid showing how two variables relate: one variable''s scores run down the side,
  the other''s across the top, and each cell counts how often two scores went together.'
scope: A statistical display that tallies paired scores in a grid; not a correlation coefficient, which
  is a single number, and not a scatter plot of points.
examples:
- The correlation table showed how often high anxiety scores went with poor sleep scores.
- Each cell of the correlation table held the number of students with that pair of scores.
