senseId: 'a_posteriori%3:00:00::'
synsetId: 00140394-a
simpleMeaning: reasoning that moves from facts or single cases to broad rules, or from effects to causes
scope: Reasoning that moves from facts or single cases to broad rules, or from effects to causes; not
  reasoning from a broad rule down to a single case.
examples:
- The a posteriori demonstration moved from facts to a broad rule.
- That proof is a posteriori, built from what was seen.
