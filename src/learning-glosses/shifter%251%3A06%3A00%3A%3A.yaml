simpleMeaning: a machine part used to put gears in use or take them out of use
scope: 'Also called gearshift and gearstick: a part a person moves to put a gear in use or take it out
  of use, not the gear itself.'
examples:
- He moved the shifter to change gear as the car went up the hill.
- The shifter in the old car is stiff and hard to move.
