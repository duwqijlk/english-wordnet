simpleMeaning: In computers, a board with wires that plugs in goes into this opening in a small computer
scope: 'Also called a slot: an opening in a small computer for a board that plugs in, not a hole in a
  wall and not a time set aside for something.'
examples:
- The expansion slot in my old computer held the new sound board.
- He pushed the card into the expansion slot and turned the computer on.
