simpleMeaning: a bed of cloth or rope net that hangs, usually from two trees, and moves to and fro with
  ease
scope: A bed of cloth or rope net that hangs, usually from two trees, and moves to and fro, not a bag
  and not a loose dress.
examples:
- He slept in a sack hung between two trees.
- The sack swayed in the warm wind.
