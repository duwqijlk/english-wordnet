simpleMeaning: A tobacco pipe from the East, its long bendy tube joined to a pot where the smoke is cooled
  by passing through water.
scope: Also called a hookah, shisha, calean, chicha, hubbly-bubbly, kalian, narghile, nargileh, sheesha
  or water pipe, it is a tobacco pipe with a long tube joined to a pot of water.
examples:
- He smoked a hubble-bubble.
- The hubble-bubble bubbled as the smoke passed through the water.
