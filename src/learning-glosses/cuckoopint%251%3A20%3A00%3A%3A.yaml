simpleMeaning: In early spring this common European arum comes up, with a pointed leaf-like cover and
  a short purple spike, and gives a starch called arum
scope: A common European arum that comes up in early spring and gives a starch called arum; also called
  jack-in-the-pulpit and lords-and-ladies, not a tropical arum grown for food.
examples:
- Cuckoopint was already up in the garden by the first week of spring.
- The starch called arum comes from the cuckoopint.
