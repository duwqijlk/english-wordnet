simpleMeaning: Red-brown timber from the inner part of the sweet gum tree, cut for making furniture.
scope: Red-brown timber from the inner part of the sweet gum tree, not the pale outer timber of the same
  tree and not oak.
examples:
- The table was made of hazelwood, polished to a warm red-brown.
- Hazelwood from the sweet gum tree is prized for fine furniture.
