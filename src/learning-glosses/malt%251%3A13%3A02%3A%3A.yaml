senseId: 'malt%1:13:02::'
synsetId: 07905249-n
simpleMeaning: a kind of lager (a kind of beer) with much alcohol; by law it has too much alcohol to be
  sold as lager or beer
scope: This sense is a strong lager drink that the law does not let shops sell as lager or beer. It is
  not the grain used to make drinks, and not a milkshake made with malt powder.
examples:
- The shop sells this strong drink as malt liquor, not as ordinary beer.
- Because it had so much alcohol, the malt had to be labelled malt liquor, not lager.
