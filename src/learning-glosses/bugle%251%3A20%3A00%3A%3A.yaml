simpleMeaning: Any of a group of low green plants from Europe and Asia that live one year or many, stay
  green all year, and cover bare ground
scope: A low, evergreen plant used to cover bare ground; not the brass horn and not a glass bead.
examples:
- Bugle spread over the bare bank under the trees.
- They planted bugle as ground cover round the pond.
