simpleMeaning: A part of the Economic and Social Council of the United Nations that looks after the rights
  of people.
scope: This word is for one part of that council, not for the part that looks after how female people
  are treated and not for the part that looks after numbers.
examples:
- The Commission on Human Rights met to discuss the case.
- She wrote to the Commission on Human Rights about the prisoners.
