senseId: 'automatic_choke%1:06:00::'
synsetId: 02763303-n
simpleMeaning: a part in an engine that by itself sets how much air goes to the part that mixes air and
  fuel
scope: An engine part that sets the air flow by itself, not a hand-set air valve and not a part that feeds
  fuel.
examples:
- The automatic choke failed, so the engine got too little air when cold.
- A working automatic choke lets the engine start well on a cold morning.
