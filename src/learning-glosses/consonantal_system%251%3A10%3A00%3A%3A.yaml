simpleMeaning: the full set of speech sounds in one language that are not vowels
scope: The full set of speech sounds in one language that are not vowels, also called consonant system;
  not the vowel sounds and not the written letters.
examples:
- The consonantal system of French uses sounds English lacks.
- Learners must master the consonantal system of the new language.
