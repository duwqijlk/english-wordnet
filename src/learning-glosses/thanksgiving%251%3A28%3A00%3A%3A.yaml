simpleMeaning: A day on the fourth Thursday of November in the United States and second Monday of October
  in Canada, for a 1621 feast held by the Pilgrims and the Wampanoag
scope: Thanksgiving Day is another name for this sense; not Christmas and not any harvest feast.
examples:
- We eat turkey on Thanksgiving every year.
- Thanksgiving falls in late November in the United States.
