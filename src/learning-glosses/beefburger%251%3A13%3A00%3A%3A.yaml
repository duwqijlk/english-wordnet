simpleMeaning: Often with other things added, a fried flat cake of minced meat from cattle comes in a
  bun as a sandwich.
scope: This is a fried flat cake of minced meat from cattle served in a bun; hamburger and burger are
  other names for this sense.
examples:
- He ordered a beefburger with cheese and onions.
- She ate her beefburger in a bun with pickles and sauce.
