simpleMeaning: 'To sick is to throw up: to bring the contents of your stomach back up through your mouth.'
scope: 'This is a rare, dialectal verb; in ordinary English people say ''vomit'' or ''throw up''. Do not
  confuse it with the adjective sick, which means feeling ill or feeling that you may vomit: the verb
  means actually bringing the contents up. The dialect verb ''cat'' is another name for the same act.'
examples:
- The toddler sicked up his lunch all over the floor.
- He sicked up the medicine almost as soon as he swallowed it.
