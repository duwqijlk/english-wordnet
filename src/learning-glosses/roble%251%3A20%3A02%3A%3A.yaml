simpleMeaning: a large tree from Trinidad and Guyana with paired leaflets, yellow flowers in violet-scented
  clusters, long smooth seed pods, and planted as an ornamental in parks and large gardens.
scope: This is the large ornamental tree from Trinidad and Guyana, not the tall California oak that shares
  the name roble.
examples:
- A roble stands at the centre of the park's formal garden.
- The roble bears long smooth pods and clusters of yellow flowers.
