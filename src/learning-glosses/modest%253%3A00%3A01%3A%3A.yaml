simpleMeaning: not shocking or rude in how you act or how you look, in matters of sex
scope: About how a person acts and looks where sex is concerned; not the sense of being humble and not
  drawing attention to yourself.
examples:
- She chose a modest dress that covered her arms and knees.
- She behaved modestly in public and would not even kiss her boyfriend there.
