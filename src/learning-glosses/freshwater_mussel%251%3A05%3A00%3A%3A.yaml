simpleMeaning: in the rivers of the middle of the United States, a soft animal with two hard shells that
  is found there in great numbers
scope: 'Also called freshwater clam: a two-shelled river animal found in great numbers in the middle of
  the United States, not a sea mussel and not a snail.'
examples:
- Freshwater mussels were thick on the stones in the river.
- The freshwater mussel is common in rivers here.
