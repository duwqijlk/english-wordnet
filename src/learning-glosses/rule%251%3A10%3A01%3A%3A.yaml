simpleMeaning: In linguistics, a statement about how a language is or should be used.
scope: A language-use statement only; not a behavior principle, a normative example, a conduct guide,
  an accepted general truth, a math method, a natural law, a game's directions, a religious order's regulations,
  a reign, legal authority, a measuring stick, or any verb use (holding power, deciding, prevailing, declaring,
  matching zodiac signs, drawing lines, keeping in check, excelling).
examples:
- English has a rule that adjectives normally come before nouns.
- The grammar rule says the verb must agree with its subject.
