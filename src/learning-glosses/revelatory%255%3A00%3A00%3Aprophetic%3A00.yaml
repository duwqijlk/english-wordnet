simpleMeaning: that says great destruction or the final end of all things will come
scope: Also called apocalyptic, this is about great destruction or final doom that is said to be coming.
  It is not just about showing or telling something new.
examples:
- His revelatory speech warned that the city would be destroyed.
- The book's revelatory ending spoke of fire and the end of the world.
