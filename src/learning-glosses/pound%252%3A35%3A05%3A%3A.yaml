simpleMeaning: to force a person, animal or thing to stay inside an enclosure or within limits.
scope: Confining a person, animal or thing within any limits, not putting an animal specifically into
  a pound or striking something hard.
examples:
- The prisoners were pounded in a narrow cell overnight.
- The herd was pounded inside a walled field until morning.
