senseId: 'radio-frequency_spectrum%1:19:00::'
synsetId: 11521386-n
simpleMeaning: Messages sent through the air travel on wave lengths, and this is the whole set of them,
  from broadcasts and radar to television
scope: The whole range of wave lengths used to send messages; also called radio spectrum, not the range
  of light the eye can see, and not one wave length used by a single station.
examples:
- The radio-frequency spectrum is shared by many users.
- Television uses part of the radio-frequency spectrum.
