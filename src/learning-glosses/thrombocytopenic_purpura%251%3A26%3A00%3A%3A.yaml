senseId: 'thrombocytopenic_purpura%1:26:00::'
synsetId: 14588998-n
simpleMeaning: purple or red spots on the skin caused by too few blood platelets in the blood, which can
  have many causes
scope: Purple or red spots on the skin from too few blood platelets; idiopathic thrombocytopenic purpura
  and purpura hemorrhagica are other names for this sense, not a disease in which the platelets fail to
  work.
examples:
- The child had thrombocytopenic purpura, with purple spots on her arms.
- A blood test showed that his thrombocytopenic purpura came from a low platelet count.
