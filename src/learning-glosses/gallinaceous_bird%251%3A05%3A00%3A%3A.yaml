simpleMeaning: kept on a farm or hunted for sport, a heavy, thick-bodied animal with wings that feeds
  mostly on the ground
scope: Another name for this kind is gallinacean; it is not a hunting bird that catches prey in the air
  and not a small songbird that feeds in trees.
examples:
- The gallinaceous bird scratched at the dry earth for grain.
- We saw a gallinaceous bird pecking at seeds beside the farm track.
