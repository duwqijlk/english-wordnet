simpleMeaning: In the limbs of animals with backbones, a long tube-shaped bone with marrow inside.
scope: In the limbs of animals with backbones, a long tube-shaped bone with marrow inside; long bone is
  another name for this sense, not a short bone and not a flat bone.
examples:
- The os longum in her arm held soft marrow.
- An os longum grows at both ends.
