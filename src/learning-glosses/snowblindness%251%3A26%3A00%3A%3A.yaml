simpleMeaning: A short loss of sight caused by sunlight bounced off white flakes or ice
scope: A short loss of sight from sunlight bounced off white flakes or ice; also called snow-blindness;
  not lasting harm to the eyes, and not a loss of sight from looking straight at the sun.
examples:
- Snowblindness made him shade his eyes on the glacier.
- She got snowblindness after a day on the bright slopes.
