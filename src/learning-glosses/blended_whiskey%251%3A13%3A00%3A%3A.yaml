simpleMeaning: A drink made by mixing two or more strong grain drinks, or one such drink with plain spirit.
scope: A drink made by mixing two or more strong grain drinks, or one such drink with plain spirit; blended
  whisky is another name for this sense, not a single grain drink and not a mixed cocktail.
examples:
- He ordered a glass of blended whiskey.
- This blended whiskey mixes two grain drinks.
