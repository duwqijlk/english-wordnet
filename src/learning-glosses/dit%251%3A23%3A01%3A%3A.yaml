simpleMeaning: A ten-count unit that sizes up what is known or unknown.
scope: This sense is also called a ban, for a ten-count unit that sizes up what is known or unknown, where
  a ban is a unit counting by powers of 10, for measuring information or entropy, how much is unknown,
  using base 10, unlike the sense for the short one of two wire signals in the Morse code.
examples:
- The dit is a ten-count unit.
- Dits size up what is known or unknown.
