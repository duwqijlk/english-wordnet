simpleMeaning: to agree officially to a deal or rule and accept the duty that comes with it.
scope: This is not the simple act of writing your name, and it is not a hand movement that gives a message;
  it is giving formal approval by that act.
examples:
- Both sides signed the peace agreement on Friday.
- He signed the lease, so the flat is ours for two years.
