simpleMeaning: In a way that worships idols, or gives something too much honour
scope: In a way that worships an idol or honours a thing too much, not in a respectful way and not in
  prayer to God.
examples:
- The people idolatrously worshipped the Golden Calf.
- He idolatrously followed every word of his hero.
