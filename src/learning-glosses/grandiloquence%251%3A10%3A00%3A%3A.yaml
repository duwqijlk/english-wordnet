senseId: 'grandiloquence%1:10:00::'
synsetId: 07084469-n
simpleMeaning: a way of speaking or writing that uses big, showy words and far too much fancy decoration
scope: A showy, over-decorated way of speaking or writing, also called grandiosity, magniloquence, ornateness
  and rhetoric, not plain speech and not a fine style used with care.
examples:
- His grandiloquence made the short speech last an hour.
- The review mocked the grandiloquence of the novel.
