simpleMeaning: The twist put on a magnet, or on a thing with two poles, when it is set in the lines of
  force round a magnet
scope: The twist put on a magnet or on a thing with two poles when it is set in the lines of force round
  a magnet, not the pull on iron and not the magnet's strength; moment of a magnet is another name for
  this sense.
examples:
- The magnetic moment of the needle made it turn to line up with the field.
- Physicists measure the magnetic moment to learn how strong a magnet is.
