scope: Also called bitter-bark, fever tree and Georgia bark; a shrub or small tree of wet ground in the
  southwestern United States, grown for show, with large pink or white outer flower parts, its bark used
  to treat fever.
examples:
- Pinckneya pubens grew beside the swamp, its pink sepals bright in spring.
- The bark of Pinckneya pubens was once used to treat fever.
