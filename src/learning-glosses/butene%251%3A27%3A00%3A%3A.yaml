simpleMeaning: any one of three forms of a chemical made of carbon and hydrogen, with the formula C4H8,
  all used to make man-made rubber
scope: Any one of three forms of a chemical made of carbon and hydrogen, with the formula C4H8, all used
  to make man-made rubber, also called butylene, and not a liquid fuel or natural rubber.
examples:
- Butene is one of the chemicals used to make rubber.
- The plant cracks oil to get butene.
