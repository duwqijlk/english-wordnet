simpleMeaning: Barbs, quills, spines, thorns, or stiff hairs and the like cover a plant or animal said
  to be this way, keeping harm away
scope: Prickly, bristled, barbed, thorny, bristly, spiny, burred, barbellate, briery, burry, setaceous,
  and setose are other names for what is said of a plant or animal covered with sharp bits that keep harm
  away.
examples:
- The briary hedge tore at his sleeves.
- She pushed through the briary bushes.
