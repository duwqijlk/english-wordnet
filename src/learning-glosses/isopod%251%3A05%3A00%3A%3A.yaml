simpleMeaning: Any of many kinds of small hard-shelled animals with seven pairs of legs made for crawling,
  living on land or in water.
scope: Any of many kinds of small hard-shelled animals with seven pairs of legs made for crawling, not
  a spider and not a crab with claws.
examples:
- The isopod curled up when the stone was lifted.
- Isopods crawled under the damp leaves.
