simpleMeaning: Round cases on this upright, bushy mallow plant or small tree hold seeds wrapped in many
  long, hairy threads.
scope: Also called cotton, it is the plant whose seed cases hold the fibers, not the cloth made from them.
examples:
- The cotton plant grows bolls full of soft fiber.
- Farmers pick the cotton plant's bolls by hand.
