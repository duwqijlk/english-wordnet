simpleMeaning: A person who thinks deeply and quietly, turning things over in the mind.
scope: A person who thinks deeply and quietly; muser is another name for this sense, not the heavy grinding
  tool and not a person who daydreams without thinking.
examples:
- He is a muller, sitting for hours in quiet thought.
- The old muller spent the afternoon turning the problem over in his mind.
