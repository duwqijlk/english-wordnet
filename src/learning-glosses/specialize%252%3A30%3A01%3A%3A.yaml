simpleMeaning: to shape or fit a thing so it is made for one set job, not for general use
scope: This is about fitting a thing for one set job, not about a person working in one field, not about
  a living thing changing to fit its home, and not about giving fine points of what you mean.
examples:
- The team specialized its tools for deep-sea work.
- They specialized the program to test one kind of engine.
