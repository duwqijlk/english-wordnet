simpleMeaning: Small white flowers grow in tight, tall spikes on this plant, and its bulb is used as a
  medicine.
scope: Sea onion and sea squill are other names for this plant, whose bulb is used as medicine, not the
  Old World plant with pink, blue, or white blooms.
examples:
- The squill bore small white flowers in tight spikes.
- The squill bulb was kept for use as a medicine.
