simpleMeaning: A length used in finding the way, exactly 1,852 metres, once set by one minute of arc in
  latitude.
scope: A length used in finding the way, exactly 1,852 metres, once set by one minute of arc in latitude;
  also called mile, mi, air mile, naut mi and nautical mile, not a land mile and not a kilometre.
examples:
- The ship was ten international nautical miles from shore.
- One international nautical mile is 1,852 metres.
