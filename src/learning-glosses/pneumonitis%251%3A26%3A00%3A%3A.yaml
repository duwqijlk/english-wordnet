simpleMeaning: A germ or an allergy can bring on this swelling of the lungs.
scope: A swelling of the lungs caused by a germ or an allergy, not a lung injury and not an ordinary cold.
examples:
- The doctor said the pneumonitis would clear up with rest.
- Her pneumonitis came on after a bad allergy.
