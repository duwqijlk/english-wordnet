simpleMeaning: long-lived plants of the lily family with thick poison stems that run sideways under the
  soil
scope: These are long-lived lily-family plants with thick poison stems under the soil; hellebore is another
  name for this sense; not other lilies without poison stems and not a short-lived herb.
examples:
- False hellebore comes back year after year in the same spot.
- The false hellebore has thick poison stems under the soil.
