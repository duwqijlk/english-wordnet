simpleMeaning: how pure and strong a colour is, with no white mixed in, so the colour looks bright and
  clear
scope: 'Also called intensity, saturation and chroma: this is about how pure a colour is with no white
  in it, not how bright the light is or how dark a colour is.'
examples:
- The vividness of the red paint made it stand out.
- She chose the cloth for the vividness of its blue colour, with no white mixed in.
