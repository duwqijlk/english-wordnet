schema: oewn-learning-gloss-v2
senseId: 'torpor%1:26:00::'
synsetId: 14038092-n
simpleMeaning: a state in which the body and mind do not work, and a person can only partly feel or answer
  to things around them
scope: This is a deep state where the body and mind stop working and feeling is partly lost, not just
  being tired and having no energy.
examples:
- After the illness, he fell into a deep torpor and hardly answered when we spoke.
- The animal lay in torpor, not moving or feeling much.
