simpleMeaning: the colour part of paint that mixes into water
scope: The colour part of paint that mixes into water, also called watercolour; not a finished picture,
  not paint as a whole, and not the act of painting.
examples:
- She buys her watercolor as dry blocks of colour.
- A little watercolor goes a long way when you mix it with water.
