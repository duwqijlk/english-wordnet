simpleMeaning: a hand tool for holding things tight, with two arms joined in the middle, and usually with
  rough ends that have small teeth and close together
scope: 'Also called pair of pliers, and also called plyers: a two-armed hand tool for holding things tight,
  not tweezers for picking up very small things.'
examples:
- He used pliers to hold the wire while he worked.
- She pulled the small nail out with a pair of pliers.
