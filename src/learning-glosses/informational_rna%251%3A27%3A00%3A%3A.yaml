simpleMeaning: The pattern for making protein; the kind of acid in cells that carries news from DNA in
  the cell's centre to the places where protein is made.
scope: 'Also called mRNA, messenger RNA and template RNA: the pattern for making protein, the kind of
  acid in cells that carries news from DNA in the cell''s centre to the places where protein is made;
  other kinds of acid in cells carry no such news or make no protein.'
examples:
- Informational RNA carries news from DNA to the places where protein is made.
- Without informational RNA, the cell could not make protein.
