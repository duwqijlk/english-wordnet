simpleMeaning: In ancient Greece, a song of strong feeling, usually sung to honour Dionysus
scope: In ancient Greece, a song of strong feeling usually sung to honour Dionysus, and not a quiet prayer
  or a song about any god.
examples:
- The choir sang a dithyramb to honour Dionysus at the festival.
- A dithyramb filled the theatre with loud, joyful song.
