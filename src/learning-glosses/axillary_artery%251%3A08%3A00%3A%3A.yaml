simpleMeaning: Joining the tube under the collar bone above to the main tube of the upper arm below, this
  stretch of the arm's main blood tube lies in the armpit.
scope: It is the armpit stretch of the arm's main blood tube, also called arteria axillaris, running on
  from the tube under the collar bone into the main tube of the upper arm.
examples:
- The axillary artery runs through the armpit.
- The surgeon tied off the axillary artery above the wound.
