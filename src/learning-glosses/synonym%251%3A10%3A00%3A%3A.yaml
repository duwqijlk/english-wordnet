simpleMeaning: a pair of words that can be used one in place of the other in a given setting, with the
  same sense there
scope: 'Also called equivalent word: a pair of words with the same sense in a given setting. Not a word
  with the opposite sense.'
examples:
- In this sentence, 'big' and 'large' are synonyms.
- The teacher asked us to find a synonym for 'happy'.
