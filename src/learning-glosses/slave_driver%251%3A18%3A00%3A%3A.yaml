simpleMeaning: A person who watches over people held as property while they work
scope: A person who watches over people held as property while they work; not the person who owns them,
  and not a cruel boss who overworks free workers, which is the other sense of the word.
examples:
- The slave driver stood over the workers with a whip.
- A slave driver set the pace in the fields.
