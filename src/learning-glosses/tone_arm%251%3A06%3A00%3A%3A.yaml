simpleMeaning: a light, well-balanced moving part of a machine that holds the small case with the needle
scope: A light, balanced part of a machine that holds the needle's case; pickup and pickup arm are other
  names for this. Not the start or end of a note, and not the disc the needle plays.
examples:
- The tone arm moved slowly across the record.
- He lifted the tone arm and put the needle back at the start.
