simpleMeaning: the thicker of the two hard parts in a person's lower leg, on the inner side, between the
  knee and the ankle
scope: The thicker of the two hard parts in a person's lower leg, also called the shin, the tibia and
  the shinbone; not the thinner outer bone and not the thigh bone.
examples:
- He broke his shin bone in the fall.
- The shin bone runs from the knee down to the ankle.
