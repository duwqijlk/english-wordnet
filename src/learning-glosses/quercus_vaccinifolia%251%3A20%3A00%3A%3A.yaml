simpleMeaning: A low wide-spreading or ground-hugging bush of the south-west United States, with small
  nuts and leaves like those of the huckleberry.
scope: Also called huckleberry oak; a low wide-spreading bush of the south-west United States, not a tall
  tree and not a bush with big nuts.
examples:
- Quercus vaccinifolia hugs the ground on the dry hills.
- The small nuts of Quercus vaccinifolia ripen in the autumn.
