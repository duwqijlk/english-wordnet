simpleMeaning: a tube with a part inside that pushes liquid out through a thin needle, used to put medicine
  into the body
scope: 'Also called hypo and hypodermic syringe: a tool for putting medicine into the body with a needle,
  not a needle on its own and not a bottle of medicine.'
examples:
- The nurse filled the hypodermic with medicine and gave the patient a shot.
- He picked up a clean hypodermic before putting the needle into the man's arm.
