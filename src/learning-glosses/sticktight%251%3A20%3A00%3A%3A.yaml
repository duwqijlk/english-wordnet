simpleMeaning: With yellow flowers and prickly fruits that cling to fur and clothes, one of several kinds
  of plant of the Bidens group.
scope: This is also called beggar's-ticks, beggar-ticks, bur marigold, and burr marigold, one of several
  kinds of plant with yellow flowers and prickly fruits that cling to fur and clothes.
examples:
- She found sticktight fruits on her coat.
- The sticktight plant had yellow flowers.
