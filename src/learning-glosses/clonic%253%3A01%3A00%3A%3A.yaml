simpleMeaning: a muscle trouble where wrong nerve signals make a muscle tighten and relax over and over
  again very fast
scope: Muscles that tighten and relax in quick turns, not a muscle held tight without a break and not
  a single quick twitch.
examples:
- The clonic jerks made his arm shake in quick, even turns.
- Her clonic spasm kept the leg moving in and out in fast beats.
