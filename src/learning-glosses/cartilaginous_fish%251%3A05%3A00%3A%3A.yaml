simpleMeaning: a water animal whose frame can get hard with chalk-like matter but does not turn to bone
scope: Also called chondrichthian, it is a water animal whose frame can get hard but does not turn to
  bone, not a water animal with a frame of true bone and not a soft sea creature with no frame.
examples:
- The shark is a cartilaginous fish, so its frame is not made of true bone.
- A ray is a cartilaginous fish with a flat body and a frame that can get hard.
