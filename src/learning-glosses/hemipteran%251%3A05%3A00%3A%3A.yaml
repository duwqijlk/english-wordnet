simpleMeaning: With front wings thick like hide at the base and a tube-like mouth for drinking, small
  creatures that usually grow up without a full change of shape.
scope: People also call these small creatures bug, hemipteron, and hemipterous insect, and they drink
  through a tube-like mouth and grow up without a full change of shape.
examples:
- A hemipteran sucked sap through its tube-like mouth.
- The hemipteran had front wings thick like hide at the base.
