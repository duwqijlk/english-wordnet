simpleMeaning: In the past, a horse pulled this cart from house to house to bring people frozen water
scope: A horse-drawn cart that once brought frozen water to houses, also called ice wagon; not a cart
  that carries goods and not a truck.
examples:
- The ice-wagon came down our street every morning.
- Before fridges, the ice-wagon man left a block at the back door.
