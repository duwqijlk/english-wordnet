simpleMeaning: Too plain to be missed by the mind, the senses, or good judgment
scope: 'Also called plain, apparent, evident, manifest, palpable and patent: so clear to mind, senses
  and judgment that it cannot be missed.'
examples:
- The effects of the drought were unmistakable in the dry fields.
- Her unmistakable anger showed in every word she spoke.
