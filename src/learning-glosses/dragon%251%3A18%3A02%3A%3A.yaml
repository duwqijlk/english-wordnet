simpleMeaning: A creature from Germanic myth, usually shown breathing fire, with a reptile-like body and
  sometimes wings.
scope: This is the fire-breathing monster of myth, not the insulting term for a fierce, unpleasant woman
  or the small tropical lizard also called a dragon.
examples:
- The dragon in the story guarded a cave and breathed fire at anyone who came near.
- Old paintings often show dragons with wings as well as scaly bodies.
