simpleMeaning: The hard inner part of a palo santo tree, from which comes a sweet-smelling oil used in
  scents
scope: This is the hard inner part of a palo santo tree that gives a sweet-smelling oil; guaiac wood is
  another name for this sense, not the bark of the tree and not the whole tree.
examples:
- Guaiacum wood is prized for the oil in its heart.
- A drop of oil from guaiacum wood scented the whole room.
