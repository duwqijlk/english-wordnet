simpleMeaning: A person of the Muslim ruling family that ruled India until 1857.
scope: Also called Mogul; a person of the Muslim ruling family that ruled India until 1857, not a ruler
  of India after 1857 and not other Muslim rulers.
examples:
- He was a Moghul of the old ruling family.
- The Moghuls ruled India until 1857.
