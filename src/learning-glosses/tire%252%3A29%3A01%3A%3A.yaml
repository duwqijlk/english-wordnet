simpleMeaning: to drain someone's energy, or to lose energy, through too much use, heavy strain or stress
scope: Becoming or making someone physically worn out, not losing interest, the wheel part, or using up
  a supply; wear is another name for this sense.
examples:
- The long climb tired the children quickly.
- She tires easily after a poor night's sleep.
