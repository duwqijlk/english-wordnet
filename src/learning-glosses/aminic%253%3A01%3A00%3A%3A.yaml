simpleMeaning: Any of a set of carbon-based nitrogen compounds got from ammonia is what this word is used
  of, when a thing has to do with them or holds them
scope: Also called amino, this is said of a thing that holds, or has to do with, any of a set of carbon-based
  nitrogen compounds got from ammonia.
examples:
- The aminic salt held nitrogen compounds got from ammonia.
- Chemists call the compound aminic when it holds nitrogen got from ammonia.
