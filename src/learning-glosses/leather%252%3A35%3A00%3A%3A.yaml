simpleMeaning: beat someone with a narrow strip cut from animal hide
scope: The action of striking with a strip, not the noun for the material, and not a general word for
  whipping or beating.
examples:
- The guard threatened to leather the prisoner if he spoke again.
- In the old story, the cruel master leathered his servant for arriving late.
