simpleMeaning: To turn or hold something so that it lines up evenly and straight.
scope: This means turning something already in place so its lines are even, not making it into a new geometric
  shape or paying off what is owed.
examples:
- He squared his shoulders and walked into the interview.
- The sergeant squared his cap before the inspection.
