simpleMeaning: A chute used to slow a thing that is moving fast.
scope: A chute used to slow a thing that is moving fast; not a hold of a canvas-covered frame floating
  behind a ship, stopping drift or holding the head into the wind, nor a cut cloth cone on a mast, used
  at airfields to show the wind's way, nor a funnel-shaped tool towed as a mark by a plane.
examples:
- Their drogue opened at dawn.
- The drogue was seen at noon.
