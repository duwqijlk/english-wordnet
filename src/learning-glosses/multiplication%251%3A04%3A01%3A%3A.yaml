simpleMeaning: the act of having young, or of making more living things by having young
scope: 'Also called generation: having young and making more living things that way, not the maths act
  of working out a number by times, and not a large increase in number.'
examples:
- By multiplication, a single pair of mice produced dozens of babies in a year.
- Multiplication is how these insects produce offspring, each mother laying many eggs.
