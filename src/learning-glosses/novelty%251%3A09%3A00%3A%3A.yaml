simpleMeaning: the fresh quality of something new that takes people by surprise
scope: The freshness of being new and surprising, also called freshness, not a cheap showy ornament and
  not newness that merely refreshes.
examples:
- The novelty of the first snow delighted the children.
- After a week, the novelty of the new game had worn off.
