simpleMeaning: a very fast motor vehicle that leads the racing vehicles round the first slow lap and then
  leaves the track
scope: A very fast motor vehicle that leads the racing vehicles round the first slow lap and then leaves
  the track; not a racing vehicle itself and not the vehicle that follows at the end.
examples:
- The pace car led the field round the first lap.
- After the first lap the pace car pulled off the track.
