simpleMeaning: The seventh great church meeting in 787, which said no to the breaking of holy pictures
  and set rules for how holy pictures may be honoured
scope: Also called Second Council of Nicaea; the seventh great church meeting in 787, not the first great
  church meeting in 325.
examples:
- Nicaea met in 787 to settle the use of holy pictures.
- The bishops at Nicaea agreed that holy pictures could be honoured.
