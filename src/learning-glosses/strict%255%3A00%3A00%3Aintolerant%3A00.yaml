simpleMeaning: not able to give up part of what you want to reach an agreement, or to change in any way
scope: 'Also called rigid: this means not able to give up part of what you want to reach an agreement,
  or to change in any way; it is not about making hard demands on people, and not about following a rule
  in an exact way.'
examples:
- She is so strict that she will not agree to any plan but her own.
- Their strict parents would not change their decision, however much the children asked.
