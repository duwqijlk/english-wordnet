simpleMeaning: an electrical device that changes the mix of high and low waves in signals that pass through
  it
scope: This is an electrical device for changing signals; it is not a thing that cleans liquid or air
  by letting it pass through, not the act of taking something out of a liquid by passing it through such
  a thing, and not the act of flowing slowly through.
examples:
- The filter altered the frequency range of the signals passing through the circuit.
- He fitted a filter to cut out unwanted high-frequency signals from the audio.
