simpleMeaning: The work of a person who helps two sides reach agreement, or anything to do with that person
scope: About a person who helps two sides reach agreement, or that person's work, not about a judge who
  decides a case and not about a lawyer who argues one side.
examples:
- The committee took on a mediatorial role in the talks between the two sides.
- Her mediatorial work helped the two sides reach agreement.
