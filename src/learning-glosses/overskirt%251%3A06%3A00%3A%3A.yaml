simpleMeaning: A piece of clothing worn on the outside, on top of another piece of clothing
scope: A piece of clothing worn on the outside, on top of another piece of clothing, not a piece of clothing
  worn on its own.
examples:
- She wore an overskirt over her long skirt for the dance.
- The overskirt added a layer of lace above her skirt.
