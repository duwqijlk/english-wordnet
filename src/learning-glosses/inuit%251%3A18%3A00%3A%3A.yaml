simpleMeaning: A person of a people living in the Arctic, in northern Canada, Greenland, Alaska, or eastern
  Siberia, called 'eaters of raw flesh' by the Algonquians but 'the people' by themselves.
scope: 'Also called Eskimo and Esquimau: one of the Arctic people who call themselves ''the people'',
  not one of the Algonquian peoples who named them.'
examples:
- The Inuit elder told stories of life on the ice.
- Inuit families in northern Canada hunt and fish in the Arctic.
