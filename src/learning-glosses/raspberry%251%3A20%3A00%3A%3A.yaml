simpleMeaning: a woody plant with stems that bear fruit, usually red but sometimes black or yellow, which
  come off the plant when ripe and are rounder and smaller than blackberries
scope: A woody plant with stems that bear red, black or yellow fruit; not the fruit itself, not the rude
  noise, and not a blackberry bush.
examples:
- The raspberry canes grew along the fence.
- We planted a raspberry bush in the garden.
