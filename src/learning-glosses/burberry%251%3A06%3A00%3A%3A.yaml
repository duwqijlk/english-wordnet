simpleMeaning: A light raincoat with a belt, most often made of tan gabardine cloth with a lining in a
  set checked pattern; named for the firm that first made it.
scope: A light belted raincoat in the style first made by one firm, told apart from other raincoats by
  its tan cloth and checked lining, not a heavy coat for cold weather.
examples:
- She wore her Burberry against the light rain.
- His Burberry had the checked lining that marks the make.
