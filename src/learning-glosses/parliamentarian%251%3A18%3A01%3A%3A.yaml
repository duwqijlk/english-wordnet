simpleMeaning: a person chosen by voting to be a member of the British Parliament, in the House of Commons
scope: This is a person chosen as a member of the British Parliament, not a person who only knows the
  rules for running its meetings.
examples:
- The parliamentarian spoke in the House of Commons.
- Voters chose a new parliamentarian for their area.
