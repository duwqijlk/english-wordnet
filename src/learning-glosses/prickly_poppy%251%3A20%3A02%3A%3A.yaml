simpleMeaning: Mostly in the warm parts of the Americas grows any of many kinds of plant with sharp leaves,
  stems, and pods and big white or yellow flowers
scope: Also called argemone, devil's fig, and white thistle; a plant with sharp leaves and big white or
  yellow flowers.
examples:
- The prickly poppy had big white flowers and sharp leaves.
- She wore gloves to pick the prickly poppy stems without a scratch.
