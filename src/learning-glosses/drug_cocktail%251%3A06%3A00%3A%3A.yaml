simpleMeaning: taken together to treat AIDS and HIV, a mix of medicines that stop the virus from copying
  itself in two different ways
scope: Also called highly active antiretroviral therapy, this is a mix of medicines used to treat AIDS
  and HIV, not a single drug taken on its own.
examples:
- Her drug cocktail kept the virus under control.
- The doctor changed his drug cocktail after the blood tests.
