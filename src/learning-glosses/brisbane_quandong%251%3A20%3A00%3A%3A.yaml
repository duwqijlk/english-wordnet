simpleMeaning: A tree of Australia with hard white wood and shiny green leaves, white flowers, and then
  shiny blue fruit with one seed.
scope: Also called blue fig, quandong, the quandong tree, the silver quandong tree and Elaeocarpus grandis,
  this Australian tree has hard white wood, shiny green leaves, white flowers and shiny blue fruit with
  one seed, unlike the lilly pilly and the macadamia tree, which are other Australian trees with fruit.
examples:
- Brisbane quandong grew beside the creek.
- The Brisbane quandong bore blue fruit in summer.
