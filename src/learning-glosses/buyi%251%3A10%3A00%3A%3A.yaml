simpleMeaning: One branch of the Tai languages, spoken in south and southwest Guizhou, on the Guizhou-Yunnan
  plateau, and in Yunnan and Sichuan.
scope: Also called Bouyei and Yay; one branch of the Tai languages, not the other Tai branches of the
  same area.
examples:
- Buyi is spoken in Guizhou.
- Buyi speakers live in southwest China.
