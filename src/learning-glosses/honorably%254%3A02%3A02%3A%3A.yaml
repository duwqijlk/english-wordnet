senseId: 'honorably%4:02:02::'
synsetId: 00493074-r
simpleMeaning: in a way that is honest and fair and that people can respect
scope: This tells how an act is done in an honest, fair way people respect. It is close to the other sense
  of honorably, with honor, but this sense is about acting in an honest and fair way.
examples:
- He acted honorably and told the truth even when it cost him his job.
- The judge decided the case honorably, without taking money from either side.
