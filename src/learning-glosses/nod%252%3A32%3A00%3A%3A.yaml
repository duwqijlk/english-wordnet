simpleMeaning: Move the head down and up again to show that you agree or confirm something.
scope: This is the deliberate head movement that signals yes, not the drowsy head-drop of falling asleep
  and not a gentle swaying.
examples:
- She nodded when I asked whether she understood.
- He nodded to show that he agreed with the plan.
