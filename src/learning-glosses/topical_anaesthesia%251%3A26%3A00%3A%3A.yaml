senseId: 'topical_anaesthesia%1:26:00::'
synsetId: 14051569-n
simpleMeaning: Loss of feeling only in the skin or in the wet linings of the body, as when a numbing drug
  is put on the surface
scope: Loss of feeling only in the skin or wet linings; topical anesthesia is another name for this sense,
  and not loss of feeling in the whole body or a deep sleep.
examples:
- Topical anaesthesia numbed the skin before the cut.
- The dentist used topical anaesthesia on the gum.
