simpleMeaning: 'Hard things hold this sea creature fast: it has two shells, one dark and long, and lives,
  above all, where the sea meets the land when the tide is out.'
scope: Also called marine mussel, this sea creature with two shells lives stuck to hard things, above
  all where the sea meets the land when the tide is out.
examples:
- The mytilid clung to the rock where the tide had gone out.
- Mytilids live stuck to hard things in the zone between high and low tide.
