simpleMeaning: A pretty coat of a different material, laid on a surface as an inlay or an overlay.
scope: 'Also called encrustation: a pretty coat of a different material, laid on a surface as an inlay
  or an overlay; not a hard outer coat that covers a thing.'
examples:
- The incrustation of coloured stone made the box look rich.
- Craftsmen added incrustation to the tabletop in patterns of light wood.
