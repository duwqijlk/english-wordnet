simpleMeaning: about ideas in a very general way, with too much thinking about ideas and too little about
  real things
scope: For ideas that are too far from real life, not for the study of what the world is and why things
  are as they are.
examples:
- His talk was so metaphysical that no one could link it to real life.
- The book's metaphysical ideas were hard to follow and had little to do with daily life.
