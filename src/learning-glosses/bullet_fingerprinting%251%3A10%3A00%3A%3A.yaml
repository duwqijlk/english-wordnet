simpleMeaning: The one-of-a-kind marks each gun leaves on the shot it fires and on its spent case show
  which gun fired it.
scope: Also called ballistic fingerprinting and ballistic identification, this finds the gun from the
  marks it leaves on a shot, not from marks left by a person's hand.
examples:
- Bullet fingerprinting showed the shot came from that gun.
- By bullet fingerprinting, they matched the spent case to one gun.
