simpleMeaning: In biochemistry, a drug that joins with a spot on a cell and starts a change in the body
scope: A drug that joins with a part of a cell and starts a change in the body; not a drug that blocks
  a cell and not a drug that works on its own.
examples:
- The agonist binds to the cell and starts a reaction in the body.
- Doctors gave the patient an agonist to trigger a response in the body.
