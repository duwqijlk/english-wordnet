simpleMeaning: something hard or painful that you choose to do to yourself to make up for doing wrong
scope: A hard thing you choose to do to make up for wrong, not the church act of saying you are sorry
  and being forgiven.
examples:
- He gave up sweets for a month as a penance for his lie.
- As a penance, she did extra hard work to make up for her mistake.
