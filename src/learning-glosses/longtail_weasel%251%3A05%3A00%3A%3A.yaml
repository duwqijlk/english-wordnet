simpleMeaning: The usual American kind of small hunting mammal, a big one with a black tip to its tail.
scope: The common big American weasel with a black-tipped tail; long-tailed weasel is another name for
  this sense, not the smaller short-tailed kind.
examples:
- A longtail weasel darted across the path with a mouse in its mouth.
- The longtail weasel hunted mice in the field at dusk.
