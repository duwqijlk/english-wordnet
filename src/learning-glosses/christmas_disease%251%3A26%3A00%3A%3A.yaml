simpleMeaning: A sickness in which the blood does not clot well, like hemophilia A, but caused by a lack
  of factor IX from birth.
scope: This is a sickness in which the blood does not clot well, like hemophilia A but caused by a lack
  of factor IX from birth, also called haemophilia B or hemophilia B; it is not hemophilia A itself.
examples:
- The boy has Christmas disease, so his blood clots slowly.
- Doctors found Christmas disease when the boy's blood would not clot well.
