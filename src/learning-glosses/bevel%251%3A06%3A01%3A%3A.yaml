simpleMeaning: The place where two surfaces meet at a slant, not at a right angle.
scope: Also called a cant, the place where two surfaces meet at a slant, not at a right angle, not the
  hinged tool for drawing or measuring angles of any size, and not the verb use for cutting or shaping
  such an edge.
examples:
- The bevel along the edge of the table caught the light.
- He sanded the bevel until the two faces met cleanly.
