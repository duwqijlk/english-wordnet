simpleMeaning: What can be seen and tested is what this person puts weight on, and guesswork about where
  things come from or what they are for is set aside.
scope: Also called positivist, this is a person who puts weight on what can be seen and tested and sets
  aside guesswork about origins or ultimate causes.
examples:
- The rationalist asked for facts that could be seen and tested.
- As a rationalist, he set aside guesswork about where things come from.
