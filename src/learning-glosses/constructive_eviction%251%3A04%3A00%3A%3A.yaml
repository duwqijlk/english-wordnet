simpleMeaning: by making the place unfit to live in, a landlord forces a tenant to leave, with no force
  used and no court order
scope: 'Also called eviction: a landlord forcing a tenant out by making the place unfit to live in, not
  a court-ordered removal and not a lockout.'
examples:
- The tenant left after the constructive eviction made the flat unfit to live in.
- A constructive eviction needs no court order.
