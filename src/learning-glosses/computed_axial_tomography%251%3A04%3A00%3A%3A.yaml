synsetId: 00903174-n
simpleMeaning: 'a way of looking at organs inside the body: X rays pass through them, and a machine joins
  the pictures into flat slices along one line'
scope: 'Also called computed tomography, computerized axial tomography, and computerized tomography: a
  way of seeing inside the body with X rays, not a single X-ray picture and not an ultrasound scan.'
examples:
- The computed axial tomography showed the organs inside her chest.
- Doctors used computed axial tomography to look at his liver.
