senseId: 'irrigate%2:29:00::'
synsetId: 00079704-v
simpleMeaning: to put a liquid on something in a steady flow or spray, to cool it, clean it, or kill germs
  on it
scope: This is putting liquid on a thing or a part of the body to cool, clean, or kill germs on it, not
  putting water on land or crops.
examples:
- The nurse will irrigate the wound with clean water to wash out the dirt.
- He irrigated his eyes with a steady flow of water to cool them.
