simpleMeaning: one of a set of raised ridges that travels over the surface of a liquid, especially over
  a large body of water
scope: A ridge moving over water or another liquid, not a spell of unusual weather or a hairstyle in curves.
examples:
- A wave broke against the side of the boat.
- The waves were too high for the small boat to leave the harbor.
