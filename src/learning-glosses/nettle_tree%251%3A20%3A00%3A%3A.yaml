simpleMeaning: Any of several kinds of the Celtis plant, with plain flowers that are hard to see and small
  fruits like berries.
scope: Any of several kinds of the Celtis plant with plain flowers and small berry-like fruits, also called
  hackberry; not a stinging nettle plant and not a berry bush.
examples:
- The nettle tree in the park bore small berry-like fruits.
- A nettle tree grew beside the path, its flowers hard to see.
