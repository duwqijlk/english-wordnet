simpleMeaning: In corporate finance, the share, as a percentage, earned on a firm's whole capital, found
  by dividing that capital into earnings before interest, taxes, or dividends are paid.
scope: This sense is also called return on investment, for the share, as a percentage, earned on a firm's
  whole capital.
examples:
- Return on invested capital rose this year.
- The return on invested capital beat last year's mark.
