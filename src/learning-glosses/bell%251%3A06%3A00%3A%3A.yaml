simpleMeaning: An object you strike to make a ringing note, with a hollow metal body.
scope: The metal instrument itself, not the sound it makes, the button outside a door, or a set of tuned
  orchestral bells.
examples:
- She rang the bell to call the children in.
- The church bell rang at noon.
