simpleMeaning: An orchid with thin, nearly leafless red-brown stems and loose bunches of red-brown flowers;
  it grows in open brushy woods of southeastern Arizona and central Texas.
scope: 'Also called Texas purple spike: an orchid with thin red-brown stems, not a tall garden orchid
  and not a desert cactus.'
examples:
- The Hexalectris warnockii blooms in the brushy woods.
- We saw Hexalectris warnockii in southeastern Arizona.
