simpleMeaning: saying or hinting that a person is to blame for a wrong act
scope: This says or hints that a person is to blame for a wrong act; criminatory, incriminating and incriminatory
  are other names for this sense, not proof of guilt and not a word for being innocent.
examples:
- The criminative letter seemed to blame him for the missing money.
- Her criminative words hinted that he had done wrong.
