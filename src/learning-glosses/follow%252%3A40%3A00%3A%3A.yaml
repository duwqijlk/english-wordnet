simpleMeaning: adopt a theory, idea, policy, strategy, or plan and put it into practice
scope: This is not obeying a person's orders, watching how something develops, or chasing someone; it
  is adopting a chosen theory, idea, policy, strategy, or plan.
examples:
- The company followed a strategy of steady, cautious growth.
- Early doctors followed the theory that bad air caused disease.
