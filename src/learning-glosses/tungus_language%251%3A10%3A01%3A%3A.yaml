simpleMeaning: The Tungusic language of the Evenki people in eastern Siberia.
scope: Also called Evenki, Evenki language, Ewenki, Ewenki language, Tungus, Tunguz and Tunguz language,
  this is the tongue of the Evenki in eastern Siberia, not a member of the Tungus people.
examples:
- Tungus language is the tongue of the Evenki in eastern Siberia.
- The Evenki speak the Tungus language in eastern Siberia.
