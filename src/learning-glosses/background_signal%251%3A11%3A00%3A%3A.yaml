simpleMeaning: Stray noise that turns up alongside a reading and can pass for the thing the reading is
  meant to show.
scope: 'This is also called background: it is the stray noise that turns up with a reading, not the thing
  the reading is meant to show.'
examples:
- They could hardly hear one another over the background signal on the bad connection.
- They had to filter out the background signal before they could trust the numbers.
