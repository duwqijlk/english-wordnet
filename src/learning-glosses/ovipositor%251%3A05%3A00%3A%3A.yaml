simpleMeaning: A tube at the end of the belly of many female insects, and of some fishes, through which
  eggs are laid
scope: A tube at the end of the belly of many female insects, and of some fishes, through which eggs are
  laid, not a mouth part and not a leg.
examples:
- The ovipositor lets the wasp lay eggs inside a leaf.
- She watched the insect push its ovipositor into the bark.
