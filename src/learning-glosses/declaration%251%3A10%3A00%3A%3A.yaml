simpleMeaning: Words said or written in a strong, plain way that leaves no doubt what is meant
scope: This is a strong plain statement, said or written, not a list of goods for tax or duty, not a statement
  given in law without an oath, and not the top bid in bridge.
examples:
- Her declaration of love surprised them all.
- He made a declaration that he would not give in.
