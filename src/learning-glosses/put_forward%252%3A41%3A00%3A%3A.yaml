senseId: 'put_forward%2:41:00::'
synsetId: 02378876-v
simpleMeaning: To say again and again that what you think and what is owed to you must be seen
scope: Also called assert, this is pressing for your views and rights to be accepted, not putting a plan
  before others and not moving a thing in front of you.
examples:
- She put forward her claim to the chair at every meeting.
- He put forward his view that the plan was unfair, and would not let it go.
