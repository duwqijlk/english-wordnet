simpleMeaning: a loud noise made when fuel burns suddenly in the part of an engine that takes fuel in,
  or in the pipe that lets gases out
scope: The loud noise from an engine, not gases going back after a gun is fired, not a fire set on purpose
  to stop a bigger fire, and not a plan that goes wrong.
examples:
- The old car's engine gave a loud backfire as it started.
- We heard a backfire from the truck's engine down the street.
