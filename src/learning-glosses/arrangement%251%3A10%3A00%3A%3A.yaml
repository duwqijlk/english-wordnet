simpleMeaning: A piece of music changed so that a certain set of voices or instruments can play or sing
  it
scope: A piece of music changed for a certain set of voices or instruments, not the work of changing a
  piece of music and not a neat set of things put in order.
examples:
- The choir sang an arrangement of the old song.
- This arrangement was written for brass and strings.
