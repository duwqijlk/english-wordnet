simpleMeaning: a good result a person earns for good acts, or a bad result a person earns for wrong acts
scope: 'Also called reward and wages: it is what good or bad acts earn a person, not a sum of money given
  to end a debt or to win unfair help.'
examples:
- The payoff for years of hard study was a place at a good school.
- 'His years of lying had a sad payoff: no one trusted him any more.'
