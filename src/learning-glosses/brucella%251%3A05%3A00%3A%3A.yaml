simpleMeaning: A germ that needs air to live and causes a fever illness, and that can be used as a weapon
  in war.
scope: This is a germ that needs air to live and causes a fever illness; it is set apart from germs that
  live without air and from harmless germs by its use as a weapon in war.
examples:
- Brucella gave the farm workers a fever.
- The lab kept the Brucella sample sealed.
