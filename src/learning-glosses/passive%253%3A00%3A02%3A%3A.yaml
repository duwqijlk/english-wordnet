simpleMeaning: In grammar, showing that the subject of a sentence is the one the action happens to, not
  the one who does it
scope: In grammar, the adjective for a sentence whose subject is acted on, not the noun name for that
  verb form and not peaceful resistance to wrongs.
examples:
- Her writing was full of passive sentences.
- The passive form puts the doer at the end.
