simpleMeaning: A legal holiday in Canada that marks the day Canada became a Dominion in eighteen sixty-seven.
scope: A legal holiday in Canada marking Dominion status, also called Dominion Day, not a holiday of another
  country and not an ordinary working day.
examples:
- July 1 is a holiday across Canada.
- On July 1, Canadians mark the day their country became a Dominion.
