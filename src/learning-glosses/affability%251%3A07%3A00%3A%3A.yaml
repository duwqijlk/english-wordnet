simpleMeaning: a friendly way of being, so that other people find it easy to talk to you
scope: 'Also called bonhomie, geniality, and amiability: this is a person''s friendly, easy-to-talk-to
  nature, not a single friendly act.'
examples:
- Her affability made new students feel welcome at once.
- People liked his affability and found him easy to talk to.
