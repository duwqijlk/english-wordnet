simpleMeaning: An evergreen shrub, sometimes a small tree, with leathery leaves and striking bunches of
  bell-shaped blooms.
scope: The evergreen shrub or small tree kind with leathery leaves and bell-shaped blooms; azaleas belong
  to the same group and are often confused with it.
examples:
- Rhododendrons flower in late spring, with clusters of bell-shaped blooms.
- The rhododendron beside the porch keeps its leathery leaves all winter.
