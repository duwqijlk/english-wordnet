senseId: 'secondary_sexual_characteristic%1:07:00::'
synsetId: 05014984-n
simpleMeaning: A person is marked male or female by voice pitch, body hair, and muscle build, fixed at
  birth, though none of them helps make children.
scope: Also called secondary sex character, secondary sex characteristic, and secondary sexual characteristic,
  these features are fixed at birth and mark a person male or female, not the parts of the body that make
  children.
examples:
- Strong muscles count as a secondary sexual characteristic.
- The pitch of her voice is a secondary sexual characteristic.
