simpleMeaning: A way of acting without care for danger because a person feels they have no hope
scope: The careless, dangerous way a person acts when they feel they have no hope, not just the feeling
  of having no hope itself.
examples:
- In desperation, he drove through the deep flood water without thinking.
- Her desperation led her to take a dangerous risk.
