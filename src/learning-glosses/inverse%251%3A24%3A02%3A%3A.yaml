simpleMeaning: something that is opposite in order, in kind, or in what it does
scope: This is a thing that is opposite, not the describing word for something that is opposite in nature
  or effect to another amount.
examples:
- When the first plan failed, he tried the inverse.
- The inverse of this order is to start at the end and work back to the start.
