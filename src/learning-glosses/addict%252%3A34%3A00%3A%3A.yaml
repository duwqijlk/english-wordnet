simpleMeaning: to make a person, or yourself, need a thing and be unable to stop, especially a strong
  drug
scope: To make a person, or yourself, need a thing and be unable to stop, especially a strong drug; also
  called hook, not a person who loves a thing and not a person whose body already needs one.
examples:
- The drug can addict a person in a few weeks.
- He feared the pills would addict him.
