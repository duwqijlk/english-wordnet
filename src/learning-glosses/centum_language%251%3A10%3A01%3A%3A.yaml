simpleMeaning: In word study, a tongue of the Indo-European family that keeps the old lip-and-back sounds
  and turns old front sounds into back sounds like /k/ or 'kh'.
scope: Not the Satem languages, nor other families of languages; this is one of the Indo-European languages
  that keeps the old lip-and-back sounds.
examples:
- Centum languages keep old sounds.
- Latin is a Centum language.
