simpleMeaning: A square piece of cloth for wiping the eyes or nose, or worn as part of a costume
scope: A square piece of cloth for wiping the eyes or nose, or worn as part of a costume, not a towel
  and not a scarf; handkerchief, hanky and hankie are other names for this sense.
examples:
- He pulled a hankey from his pocket to wipe his eyes.
- Her hankey matched her costume.
