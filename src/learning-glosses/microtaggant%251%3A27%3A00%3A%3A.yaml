senseId: 'microtaggant%1:27:00::'
synsetId: 14976793-n
simpleMeaning: A tiny marked bit, too small to see, that can be traced, put in explosives or other risky
  goods to find them or to stop fakes.
scope: This is a tiny tracing bit put in goods, not an explosive itself and not a mark on paper.
examples:
- A Microtaggant in the powder lets police trace the explosive.
- Makers add a Microtaggant to stop fakes.
