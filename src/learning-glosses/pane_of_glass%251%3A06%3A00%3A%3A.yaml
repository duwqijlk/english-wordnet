simpleMeaning: A flat piece of clear, hard stuff cut to fit a window or a door
scope: 'Another name for a pane: a flat piece cut to fit a window or door, not a whole window and not
  a sheet of glass still uncut.'
examples:
- The storm broke a pane of glass in the kitchen window.
- He cut the pane of glass to fit the door.
