simpleMeaning: to change a building into a home with rooms on two floors, with stairs inside that join
  the two floors
scope: To change a house into a home on two floors; it is not the name for such a home itself, and not
  the word for sending messages both ways at the same time.
examples:
- They decided to duplex the old house, turning it into a home spread over two floors.
- The owner duplexed the building by putting in stairs inside to join the two floors.
