simpleMeaning: one of many kinds of small to medium-sized round or egg-shaped fruit with smooth skin and
  one hard stone inside
scope: This is the fruit itself, not the tree that the fruit grows on.
examples:
- She ate a sweet plum for lunch.
- Fresh plums are soft and full of juice.
