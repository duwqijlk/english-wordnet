simpleMeaning: one of many kinds of plant that grows back each year from a bulb under the ground, with
  long narrow or wide pointed leaves and most often one bright flower
scope: A plant grown from a bulb, not a tree and not any flower with bright petals.
examples:
- Tulips in the garden come back every spring from their bulbs.
- She planted a row of tulips along the front wall.
