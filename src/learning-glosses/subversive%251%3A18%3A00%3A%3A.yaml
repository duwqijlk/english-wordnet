simpleMeaning: a person who backs complete change in how a country is ruled or how society is run, through
  revolution
scope: revolutionary is another name for this sense; not a person who only disagrees with the government,
  and not someone who protests in a lawful way.
examples:
- The police arrested several subversives after the failed uprising.
- He was known as a subversive who wrote pamphlets against the king.
