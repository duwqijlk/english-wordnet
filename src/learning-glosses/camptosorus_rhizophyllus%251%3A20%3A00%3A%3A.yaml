simpleMeaning: Ferns with long narrow pointed leaves that take root at the tip.
scope: 'Also called walking fern, walking leaf or Asplenium rhizophyllum: ferns with long narrow pointed
  leaves that take root at the tip, not ferns whose leaves never touch the ground to root.'
examples:
- The Camptosorus rhizophyllus bent down until its leaf tip touched the soil.
- Camptosorus rhizophyllus spread across the rock by rooting at the tips.
