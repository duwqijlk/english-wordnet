senseId: 'dipsomania%1:16:00::'
synsetId: 09204890-n
simpleMeaning: A strong wish that does not go away, to drink alcohol until one has had far too much
scope: A lasting, overpowering wish to drink far too much alcohol, not a liking for one drink and not
  thirst; alcoholism and potomania are other names for this sense.
examples:
- His dipsomania drove him to drink far too much every night.
- Dipsomania left her unable to stop drinking once she started.
