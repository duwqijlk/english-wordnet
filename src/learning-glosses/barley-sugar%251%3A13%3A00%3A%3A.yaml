simpleMeaning: The sweet stuff from cane, melted and cooled till it turns hard and clear, breaks easily
  in the mouth.
scope: This is also called barley candy, the hard, clear sweet that breaks easily.
examples:
- A piece of barley-sugar broke easily between the teeth.
- The barley-sugar broke with a snap.
