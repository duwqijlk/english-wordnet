simpleMeaning: A switch that turns other bits of the body's building plans on is held back by a blocking
  stuff this bit of the plans makes.
scope: It is also called regulatory gene, and it makes a blocking stuff that holds back the switch.
examples:
- Without the regulator gene, the switch would stay on.
- The regulator gene holds the switch back.
