simpleMeaning: to bring a feeling or act down in strength, soften it, hold it in, and stop it going past
  a set point
scope: 'Also called control, hold, check, contain, or curb: to bring something down in strength and keep
  it within set limits, not the adjective for being within reasonable limits.'
examples:
- You should moderate your alcohol intake.
- She tried to moderate her anger.
