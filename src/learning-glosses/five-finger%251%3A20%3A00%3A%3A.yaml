simpleMeaning: People say this plant heals, and gardeners grow its many kinds for flowers with as many
  petals as on one hand, common in mild parts of the world.
scope: Also called cinquefoil, this is one of many kinds of plant grown for its flowers, not a proven
  medicine.
examples:
- She planted five-finger in the front bed for its flowers.
- The five-finger in the garden is said to have healing powers, but I would not take it.
