simpleMeaning: Extra play after the set time ends, used to settle a tied game, as in basketball
scope: Extra play after the set time ends to settle a tied game, as in basketball, not the set time itself
  and not a break between games.
examples:
- The overtime period gave both teams one last chance to win.
- A goal in the overtime period settled the tied game.
