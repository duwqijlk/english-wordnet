senseId: 'clarified_butter%1:13:00::'
synsetId: 07864747-n
simpleMeaning: The fat from milk, made clear by heating and taking out the solid bits that settle.
scope: The fat from milk made clear by heat, also called drawn butter; not plain butter with its milk
  solids still in it and not a spread made from plants.
examples:
- She fried the fish in clarified butter.
- Clarified butter has no milk solids left in it.
