simpleMeaning: In sports, a run of hits that follow one another with no break, each hit after the one
  before
scope: In sports, a run of hits with no break, also called an exchange; not getting better in an illness
  and not a large meeting of people.
examples:
- The rally lasted twenty hits before the ball hit the net.
- After a short rally, she won the point with a strong shot.
