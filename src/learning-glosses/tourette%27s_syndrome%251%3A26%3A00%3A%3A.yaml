simpleMeaning: A nerve illness marked by twisted face movements and jerks and moves of the upper body
  and grunts and shouts and involuntary obscene speech.
scope: A nerve illness of jerks, grunts and shouts, set apart from other nerve illnesses by its tics and
  involuntary obscene speech; also called Gilles de la Tourette syndrome.
examples:
- Tourette's syndrome often starts in childhood.
- His Tourette's syndrome brings sudden tics and shouts.
