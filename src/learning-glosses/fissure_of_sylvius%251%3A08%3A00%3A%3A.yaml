simpleMeaning: the deepest and clearest groove in the brain's outer layer, dividing the front lobes from
  the side lobes on both sides of the brain
scope: The deepest and clearest groove in the brain's outer layer, also called lateral cerebral sulcus,
  sulcus lateralis cerebri and Sylvian fissure; it divides the front lobes from the side lobes on both
  sides of the brain.
examples:
- The fissure of Sylvius divides the front and side lobes.
- Doctors trace the fissure of Sylvius on brain scans.
