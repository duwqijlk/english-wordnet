simpleMeaning: a salt of copper called copper sulfate, in sky-coloured crystals that hold water
scope: 'Also called blue copperas, blue stone and chalcanthite: a copper salt in crystal form, not a gemstone
  and not a paint colour.'
examples:
- The blue vitriol in the bottle was a mass of sky-coloured crystals.
- She dissolved blue vitriol in water to spray the vines.
