simpleMeaning: People eat the leaves and stalks of this beet, grown for food although its root stays thin
scope: Also called chard, leaf beet, or spinach beet, this beet is grown for food for its leaves and stalks,
  which people eat, although its root is not swollen.
examples:
- We picked the chard plant leaves and ate the stalks too.
- The chard plant had leaves we could eat.
