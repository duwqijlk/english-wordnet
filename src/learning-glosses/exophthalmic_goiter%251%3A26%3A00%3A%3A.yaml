simpleMeaning: a condition with an overactive thyroid gland, a swollen neck, and eyes that stick out
scope: This is an overactive thyroid with bulging eyes; not an overactive thyroid alone and not bulging
  eyes from another cause.
examples:
- Her exophthalmic goiter caused her eyes to bulge.
- The doctor treated his exophthalmic goiter and the swelling in his neck.
