simpleMeaning: to put a person or thing on a list of people or things to shut out, so that others stop
  using or dealing with them
scope: The act of putting someone or something on such a list to shut them out; not the list itself.
examples:
- The group blacklisted the company after it cheated its workers.
- Many books were blacklisted, so shops stopped selling them.
