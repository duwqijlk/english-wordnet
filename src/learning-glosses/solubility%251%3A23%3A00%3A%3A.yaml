simpleMeaning: How much of one stuff can be mixed into another liquid before no more will mix in
scope: How much of one stuff can be mixed into another liquid before no more will mix in; not how fast
  it mixes, and not how hot the liquid is.
examples:
- Salt has high solubility in water.
- The solubility of sugar falls as the water cools.
