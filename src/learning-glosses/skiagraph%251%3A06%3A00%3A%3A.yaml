simpleMeaning: a picture formed by rays we cannot see, above all X-rays or gamma rays, on a surface that
  reacts to those rays
scope: It is also called a skiagram, a radiogram, a radiograph, or a shadowgraph, a picture made by rays
  other than light we can see, not a picture made with a camera and ordinary light.
examples:
- A skiagraph was made with gamma rays.
- They looked at the skiagraph made by the rays.
