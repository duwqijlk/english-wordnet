simpleMeaning: a thin piece cut or shaved off a thing, especially a piece of wood
scope: A thin piece cut or shaved off a thing, especially a piece of wood, also called shaving; not the
  act of cutting a thing into such pieces.
examples:
- A sliver of wood from the broken chair pierced his finger.
- She cut a thin sliver of lemon for the tea.
