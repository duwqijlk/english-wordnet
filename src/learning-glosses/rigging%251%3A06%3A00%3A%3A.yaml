simpleMeaning: the ropes and other gear that hold up a ship's tall posts and sails
scope: The ropes and gear that hold up a ship's masts and sails, also called tackle, not the whole set
  of masts, sails, and spars on a ship.
examples:
- The crew checked the rigging before the ship left port.
- Strong winds strained the rigging holding the sails.
