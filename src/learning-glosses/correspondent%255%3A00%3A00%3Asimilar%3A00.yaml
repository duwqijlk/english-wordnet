simpleMeaning: Sharing some likeness with another thing, but not sharing all of it; the two match in part
  and differ in part
scope: Alike in some ways but different in others, also called analogous; it is not the person who writes
  or reports news for a newspaper or for television.
examples:
- Brains and computers are correspondent in some ways, but they are not the same.
- Their accounts are correspondent in many details, though they differ in a few places.
