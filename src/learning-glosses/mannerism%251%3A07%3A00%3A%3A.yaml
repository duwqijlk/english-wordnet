senseId: 'mannerism%1:07:00::'
synsetId: 04771497-n
simpleMeaning: a way of acting or a small habit that is special to one person and makes that person different
  from others
scope: 'Also called idiosyncrasy and foible: a personal way of acting that marks one person out, not a
  false show put on on purpose to look different.'
examples:
- His mannerism of tapping the table while he thinks is easy to notice.
- One mannerism she has is tilting her head when she listens.
