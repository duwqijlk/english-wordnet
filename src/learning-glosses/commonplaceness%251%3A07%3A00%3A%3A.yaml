simpleMeaning: being plain and usual because a thing is seen or met with very often
scope: This is plainness that comes from a thing being seen very often, also called commonness and everydayness;
  not something new or rare.
examples:
- The commonplaceness of the old chairs made them easy to miss.
- After years on the same street, the commonplaceness of the shops bored him.
