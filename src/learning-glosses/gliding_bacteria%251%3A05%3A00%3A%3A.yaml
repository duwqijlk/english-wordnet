simpleMeaning: In slime they make themselves, tiny living things that move along smoothly gather, living
  in wet soil or in rotting plants or animal waste.
scope: Also called a myxobacter, myxobacteria, a myxobacterium, or slime bacteria, these tiny living things
  live in wet soil, rotting plants, or animal waste.
examples:
- Gliding bacteria gathered in the slime on the wet soil.
- The gliding bacteria lived in rotting plant matter.
