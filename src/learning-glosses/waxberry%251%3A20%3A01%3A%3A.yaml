simpleMeaning: Grey-green berries with a coat over them grow on a shrub from eastern North America that
  loses its leaves in winter and smells sweet.
scope: Also called a bayberry, a candleberry and a swamp candleberry, this is the eastern shrub alone,
  not the western shrub with pink flowers and round white berries.
examples:
- The waxberry had lost its leaves, but its grey-green berries were still there.
- We gathered grey-green berries from the waxberry.
