senseId: 'escarpment%1:17:00::'
synsetId: 09297058-n
simpleMeaning: A long steep slope or cliff at the edge of high flat land or a long raised line of land,
  usually made when the land is worn away
scope: 'Also called scarp: a long steep slope made by nature at the edge of high land, not a steep slope
  built by people in front of a fort.'
examples:
- From the top of the escarpment we could see the plain far below.
- The road runs along the foot of a high escarpment.
