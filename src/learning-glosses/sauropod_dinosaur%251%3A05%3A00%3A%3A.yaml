simpleMeaning: A plant-eater of long ago, it had a small head, a very long neck and tail, and five-toed
  legs, and it was the biggest land animal known.
scope: Also called sauropod, it is a plant-eater of long ago with a small head on a very long neck, not
  a meat-eater of long ago.
examples:
- A sauropod dinosaur moved its small head on its very long neck.
- No land animal known was bigger than the sauropod dinosaur.
