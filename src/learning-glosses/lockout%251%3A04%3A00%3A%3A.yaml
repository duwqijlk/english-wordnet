senseId: 'lockout%1:04:00::'
synsetId: 00203469-n
simpleMeaning: A move by bosses to keep workers out of the workplace until they accept the bosses' terms,
  as a way of pushing back against what the workers ask for.
scope: A move by management to shut workers out of the workplace until they agree to terms, not a strike
  by the workers themselves.
examples:
- The lockout began after the union refused the new contract.
- During the lockout, no worker was allowed through the factory gates.
