simpleMeaning: The act of measuring how high a sound or other wave goes, at set times again and again,
  to change it into numbers a computer can store
scope: Measuring a changing signal at set times to make it digital; not choosing a small group of things
  or people to study in statistics.
examples:
- Sampling turns the singer's voice into numbers the computer can store.
- The machine does sampling many times each second to record the sound.
