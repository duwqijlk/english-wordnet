simpleMeaning: a show or display that is made to look far grander or more complex than necessary
scope: Not the economic making of goods, and not an ordinary play; it is an overdone spectacle.
examples:
- The awards ceremony was a production, with lasers, smoke, and a forty-piece orchestra.
- Their small wedding turned into a production, complete with rehearsed speeches and a film crew.
