simpleMeaning: A hard lump sticks out behind the ear, low down at the base of the skull, on the side bone
  of the head
scope: A lump on the side bone of the head behind the ear, also called mastoid, mastoid bone, and mastoidal,
  not the ear itself and not the jaw.
examples:
- The mastoid process sticks out behind the ear.
- The surgeon felt the mastoid process at the base of the skull.
