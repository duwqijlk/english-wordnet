simpleMeaning: A poison plant from northern Europe with hood-shaped blue-purple flowers; its dried leaves
  and roots give aconite.
scope: A poison plant with hood-shaped blue-purple flowers, also called monkshood, helmet flower and helmetflower;
  its nearest kin are other poison plants with blue flowers.
examples:
- Aconitum napellus grew along the damp bank with blue-purple flowers.
- The gardener warned us that Aconitum napellus is a poison plant.
