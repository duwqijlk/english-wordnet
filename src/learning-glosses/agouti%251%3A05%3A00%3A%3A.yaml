simpleMeaning: a quick long legged rodent the size of a rabbit, from Central and South America and the
  West Indies, eaten as food
scope: A rabbit sized rodent of the Americas, eaten as food; not a rabbit and not a rat.
examples:
- An agouti darted across the path into the bushes.
- In the village, agouti meat is cooked for supper.
