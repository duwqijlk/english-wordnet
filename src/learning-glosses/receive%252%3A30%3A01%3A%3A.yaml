simpleMeaning: To be given a particular kind of treatment or response, such as praise, criticism, or attention.
scope: This sense is not about taking in something through the senses or getting a physical object, but
  about being met with a particular response or handling.
examples:
- The new plan received strong criticism from residents.
- Her first novel received high praise from critics.
