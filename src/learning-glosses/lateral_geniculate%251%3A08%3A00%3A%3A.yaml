simpleMeaning: This knot of nerve cells works as a way station for sight, passing what the eye sees on
  to the back of the brain.
scope: People also call it corpus geniculatum laterale and lateral geniculate body, the knot of nerve
  cells that passes sight on to the back of the brain.
examples:
- The lateral geniculate handles signals on their way from the eye to the brain.
- Signals from the retina pass through the lateral geniculate.
