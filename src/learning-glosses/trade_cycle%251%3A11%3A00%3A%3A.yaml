simpleMeaning: A pattern that keeps coming back in business life, made of bad times, good times, growth,
  and fall
scope: A pattern that keeps coming back in business life; business cycle is another name for this sense,
  and not a single bad time or a one-way rise.
examples:
- The trade cycle moved from bad times to good times and back again.
- Economists study the trade cycle to tell when bad times will give way to good times.
