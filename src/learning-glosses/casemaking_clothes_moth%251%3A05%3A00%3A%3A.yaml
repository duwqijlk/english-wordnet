simpleMeaning: An insect whose young live in tubes of their food stuff, held fast with silk that they
  spin.
scope: An insect whose young live in tubes of their food stuff, held fast with silk that they spin; not
  an insect whose young live in the open, and not an insect that eats leaves.
examples:
- The casemaking clothes moth's young live in tubes made of wool.
- Larvae of the casemaking clothes moth spin silk tubes.
