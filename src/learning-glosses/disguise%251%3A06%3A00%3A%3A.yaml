simpleMeaning: clothes or other things you wear that change how you look so that people do not know who
  you are
scope: Clothes or other things worn to hide who you are; not the act of hiding who or what something is,
  and not a false outward look that hides what a thing truly is.
examples:
- He wore a false beard and dark glasses as a disguise.
- Her disguise was so good that her own friends did not know her.
