simpleMeaning: The police taking in suspects, in a planned and thorough way.
scope: The police gathering up suspects in a planned way, not the gathering of livestock for counting
  or sale, and not a short list or summary of news.
examples:
- The police carried out a roundup of suspects after the robbery.
- A roundup of suspects took place at dawn.
