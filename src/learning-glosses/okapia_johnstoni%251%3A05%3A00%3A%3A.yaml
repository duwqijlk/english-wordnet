simpleMeaning: An animal like a giraffe, but smaller, with a much shorter neck and stripes on its legs.
scope: Also called okapi; an animal like a small giraffe with a short neck and striped legs, while the
  true giraffe is much taller.
examples:
- The Okapia johnstoni moved through the forest, its striped legs hard to see.
- Okapia johnstoni looks like a small giraffe with a short neck.
