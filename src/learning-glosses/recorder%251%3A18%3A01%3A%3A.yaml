simpleMeaning: A lawyer who works as a judge some of the time in a town or borough.
scope: A lawyer who works as a judge some of the time in a town; not a wind instrument, and not a person
  who keeps records.
examples:
- The recorder heard the case in the town court.
- She sat as recorder for two weeks each year.
