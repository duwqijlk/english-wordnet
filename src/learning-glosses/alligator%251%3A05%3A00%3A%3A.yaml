simpleMeaning: one of two kinds of reptile, a large animal that lives in and out of water, related to
  crocodiles but with a shorter, wider nose
scope: One of two kinds of reptile, a large animal that lives in and out of water, related to crocodiles
  but with a shorter, wider nose; not the leather made from its skin and not paint that has cracked.
examples:
- An alligator lay still in the muddy river.
- Alligators have shorter, wider snouts than crocodiles.
