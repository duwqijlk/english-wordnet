simpleMeaning: a very large flat area of land with no trees in the far north, where the ground below the
  top layer stays frozen all the time
scope: This is a wide, flat land area in the far north with ground that stays frozen below the top; it
  is not sea covered in ice and not a forest.
examples:
- Reindeer cross the tundra in search of food.
- Few plants can grow in the cold tundra.
