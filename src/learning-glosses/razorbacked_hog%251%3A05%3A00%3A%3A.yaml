simpleMeaning: a pig with a ridge on its back, thin and long-legged, a wild or half-wild pig of mixed
  farm stock found mostly in the south-east United States
scope: Also called razorback and razorback hog; a wild pig of the south-east United States, not a whale
  and not a farm pig.
examples:
- A razorbacked hog wallowed in the mud by the creek.
- The razorbacked hogs roam the woods south of town.
