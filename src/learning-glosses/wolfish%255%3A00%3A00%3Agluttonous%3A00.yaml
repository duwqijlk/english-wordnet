senseId: wolfish%5:00:00:gluttonous:00
synsetId: 00010745-s
simpleMeaning: eating food or wanting food in very large amounts
scope: Also called ravenous, ravening, voracious and rapacious, this sense is about eating or wanting
  a lot of food, not about looking or acting like a wolf.
examples:
- With a wolfish appetite, he ate three large plates in minutes.
- The hungry children fell on the food in a wolfish way and soon asked for more.
