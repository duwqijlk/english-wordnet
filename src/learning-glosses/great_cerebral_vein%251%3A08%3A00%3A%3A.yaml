simpleMeaning: Two inner veins of the brain join to make this vein, which runs on into the straight sinus,
  a straight blood channel.
scope: Also called the vena cerebri magna, this vein of the brain is made from two inner veins and runs
  on into the straight sinus.
examples:
- The great cerebral vein is made from two inner veins of the brain.
- The great cerebral vein runs on into the straight sinus.
