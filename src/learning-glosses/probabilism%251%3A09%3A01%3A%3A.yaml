simpleMeaning: 'a Roman Catholic way of deciding right and wrong: when learned views differ, a person
  may follow any view with strong grounds, even if another view has stronger grounds'
scope: A Catholic rule for choosing between expert views, not the philosophy idea that likelihood alone
  can ground belief.
examples:
- Under probabilism, a priest could follow the less likely opinion if it still had strong grounds.
- Probabilism lets a person act on any opinion with strong grounds when experts disagree.
