simpleMeaning: In computer science, this is a unit that measures how fast a computer works, and one megaflops
  is a million sums with decimal points each second.
scope: Also called megaflop and million floating point operations per second, this is a unit for measuring
  the speed of a computer system, not a unit of how much data a computer holds.
examples:
- The old machine ran at only a few MFLOPs.
- Engineers measured the system in MFLOPs.
