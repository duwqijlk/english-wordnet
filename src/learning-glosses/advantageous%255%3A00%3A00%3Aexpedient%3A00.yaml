simpleMeaning: right for reaching a set goal, and suggesting no care about being fair to others
scope: This is about a way that works for a set goal and does not care about fairness. It is not the wider
  sense of simply being helpful or giving someone a better chance.
examples:
- He thought it would be advantageous to hide the bad news until after the vote.
- It was advantageous for her to blame her rival, even though it was not fair.
