simpleMeaning: with legs that bend out away from each other at the knees
scope: This is about the shape of a person's legs. It is not about a curved shape in a building, not about
  showing too much respect, and not about a string instrument played with a bow.
examples:
- His bowed legs made it hard for him to run fast.
- She was bowed at the knees from birth, so her legs curved out.
