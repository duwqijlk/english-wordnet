simpleMeaning: Ink stays on the flat parts of a plate and is pushed away by the rest, so copies can be
  made from the plate.
scope: Planographic printing is another name for this craft, in which ink stays on the flat parts of a
  plate and is pushed away by the rest.
examples:
- The copies were made by planography from a flat plate.
- A flat plate was used in planography to make the copies.
