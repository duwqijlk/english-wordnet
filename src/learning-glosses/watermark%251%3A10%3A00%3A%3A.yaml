simpleMeaning: a special mark put into paper when it is made, which you can see when you hold the paper
  up to the light
scope: This is a mark made in paper and seen when you hold it to light; it is not the line that shows
  the level water reached.
examples:
- Hold the bank note up and you can see the watermark in the paper.
- The fine paper has a watermark that shows a small flower.
