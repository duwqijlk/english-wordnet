simpleMeaning: any of the blood tubes that serve the two halves of the brain
scope: Any of the blood tubes that serve the two halves of the brain, not the blood tubes that bring blood
  to the brain and not the blood tubes in the arm.
examples:
- Blood leaves the brain through a cerebral vein.
- The cerebral vein drains blood from the top of the brain.
