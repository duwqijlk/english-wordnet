simpleMeaning: Under a charged field, charged bits drift through a liquid with bits spread through it,
  plus bits to the minus end and minus bits to the plus end
scope: This motion, also called cataphoresis, dielectrolysis, and ionophoresis, moves charged bits in
  a liquid under a charged field, plus bits to the minus end and minus bits to the plus end.
examples:
- Electrophoresis lets scientists sort charged bits in a liquid.
- In electrophoresis, plus bits move to the minus end of the field.
