simpleMeaning: One of the two holes at the back of the nose, where the nose cavity joins the passage that
  leads to the throat
scope: One of the two holes at the back of the nose, also called a choana; not the front opening of the
  nose and not the throat itself.
examples:
- Air passes through the internal nostril into the throat.
- The doctor looked at the internal nostril with a small light.
