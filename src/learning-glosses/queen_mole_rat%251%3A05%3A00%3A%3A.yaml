simpleMeaning: In a colony of hairless burrowers, one much bigger female alone has young, and only a few
  males father them.
scope: Also called a queen; the one much bigger female in a colony that alone has young.
examples:
- The queen mole rat is the only female in the colony to have young.
- Only a few males father the young of the queen mole rat.
