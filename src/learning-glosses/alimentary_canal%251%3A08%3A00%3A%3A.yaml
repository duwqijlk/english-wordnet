simpleMeaning: A tube of mucous membrane and muscle running about 8.3 metres from mouth to anus, working
  in digestion and getting rid of waste.
scope: This sense is also called alimentary tract, digestive tract, digestive tube, and gastrointestinal
  tract, for a tube of mucous membrane and muscle running about eight point three metres from mouth to
  anus, working in digestion and getting rid of waste.
examples:
- The alimentary canal runs from mouth to anus.
- Alimentary canals digest food.
