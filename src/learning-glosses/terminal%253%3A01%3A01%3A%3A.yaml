simpleMeaning: having to do with the start or end points of a route along which goods are carried
scope: Of the ends of a delivery route, not the spot where power enters a battery and not the last stage
  of a thing.
examples:
- Freight pickup is a terminal service at the end of the route.
- Terminal charges are paid where the goods are picked up.
