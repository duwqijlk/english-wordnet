simpleMeaning: The theatre worker who gets the objects the actors use ready and keeps them in order
scope: The stage crew member in charge of the props; not the male-only or female-only form of the job,
  and not an actor.
examples:
- The property master checked every cup and letter before the curtain went up.
- Ask the property master where the old sword is kept.
