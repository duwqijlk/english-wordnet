simpleMeaning: Seed cases that open out and look like small shields grow on this plant of the south-east
  of Europe, which bears yellow flowers.
scope: A plant of south-east Europe, not the mustard plant its flowers look like, and not a small shield.
examples:
- We found buckler mustard with yellow flowers and pods that opened like small shields.
- She pressed a buckler mustard pod and watched its valves spring open.
