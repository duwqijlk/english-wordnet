senseId: 'permissive%3:00:01::'
synsetId: 01767351-a
simpleMeaning: ready, willing, or able to let others do things, and not strict in making others follow
  rules
scope: About a person or set of rules that lets people do things and is not strict, not about making people
  follow one set way.
examples:
- Permissive parents let their children choose their own bedtime.
- The school has permissive rules about when homework is done.
