simpleMeaning: A small fern that grows on rocks in the cool north and in Hawaii, with feather-like leaves
  split into pairs of small leaflets.
scope: A small rock fern of the cool north and Hawaii with feather-like leaves; not a tall tree fern and
  not a fern of warm lowland woods.
examples:
- Maidenhair spleenwort grew in the cracks of the old wall.
- The maidenhair spleenwort clung to the damp rock.
