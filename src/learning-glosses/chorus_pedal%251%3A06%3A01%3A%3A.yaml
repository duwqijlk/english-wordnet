simpleMeaning: An electric box that takes one sound and makes it come out sounding like several, by holding
  it back a tiny moment and shifting its pitch a little
scope: One sound goes into this electric box and comes out sounding like several at once.
examples:
- He pressed the chorus pedal and one note sounded like three.
- She switched on the chorus pedal and her single note came out sounding like several.
