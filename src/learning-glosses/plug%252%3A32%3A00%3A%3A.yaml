synsetId: 00978519-v
simpleMeaning: to say good things about a thing in public to help sell it or make it known
scope: To speak well of a thing in public so people will buy it or want it; not a thing that fills a hole,
  and not the electrical part you put in a wall socket.
examples:
- She plugged the new book on the radio show last night.
- He plugged his small shop at every chance he got.
