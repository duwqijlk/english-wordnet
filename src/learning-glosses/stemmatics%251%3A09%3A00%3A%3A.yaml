simpleMeaning: In the humanities, this study of hand-written texts works out how a text passed down, by
  setting surviving copies side by side, at times sorting them into family trees.
scope: Also called stemmatology; it works out how a text passed down by setting its surviving copies side
  by side.
examples:
- Stemmatics helped her work out which copy of the poem came first.
- In stemmatics, the copies that survive are set side by side.
