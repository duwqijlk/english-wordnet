simpleMeaning: the side of a coin without a head on it, usually spoken of in the plural
scope: The headless side of a coin, normally used in the plural, not an animal's body part or the rear
  of a ship or aircraft.
examples:
- He tossed the coin and called tails.
- The coin landed on tails, so she chose first.
