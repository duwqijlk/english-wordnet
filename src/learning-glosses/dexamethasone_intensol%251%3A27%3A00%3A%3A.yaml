scope: Also called dexamethasone, Decadron, Dexone, Hexadrol and Oradexon, it is a drug that treats allergies
  and swelling, standing apart from other allergy drugs by calming swelling too.
examples:
- The doctor gave her Dexamethasone Intensol for her allergy.
- Dexamethasone Intensol reduced the swelling in his knee.
