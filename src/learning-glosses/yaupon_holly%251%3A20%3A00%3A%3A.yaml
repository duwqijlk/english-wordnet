simpleMeaning: a bush with green leaves all year, a kind of prickly-leaved plant that grows wild in the
  southeast of North America
scope: This is a bush with green leaves all year that grows wild in the southeast of North America; not
  a tree, and not a plant that loses its leaves in winter.
examples:
- Yaupon holly grows along the roads in Florida.
- The yaupon holly kept its green leaves through the winter.
