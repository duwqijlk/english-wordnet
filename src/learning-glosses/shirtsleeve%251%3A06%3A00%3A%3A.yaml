simpleMeaning: the part of a shirt that covers the arm
scope: This is the arm part of a shirt only, not the whole shirt and not a part that covers the arm on
  another kind of clothing.
examples:
- He tore his shirtsleeve on a nail.
- Her shirtsleeve was wet up to the elbow.
