simpleMeaning: A tree of India that sends out shoots in the air which grow down into the ground and form
  new trunks.
scope: A wide-spreading Indian tree with aerial shoots that root and form new trunks, also called the
  banyan, the banian, the banian tree, the banyan tree, Ficus bengalensis and the Indian banyan; not a
  palm and not a tree that grows from one trunk only.
examples:
- The East Indian fig tree spread over the whole garden.
- An East Indian fig tree put out shoots that rooted in the soil.
