simpleMeaning: A net of lymph tubes lying along the lower part of the aorta and the hip blood tubes
scope: A net of lymph tubes lying along the lower part of the aorta and the hip blood tubes; lumbar plexus
  is another name for this sense, and this is not the net of nerves of the lower back.
examples:
- The plexus lumbalis lies along the lower aorta.
- Lymph tubes of the plexus lumbalis run beside the hip blood tubes.
