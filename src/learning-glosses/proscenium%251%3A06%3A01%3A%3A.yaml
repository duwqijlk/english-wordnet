simpleMeaning: The bit of a present-day stage before the curtain, on the band's side of it.
scope: The bit of a present-day stage before the curtain, on the band's side of it; also called apron
  or forestage; not the wall that parts the stage from the seats in a modern playhouse.
examples:
- Their proscenium framed the play.
- The proscenium was lit at dawn.
