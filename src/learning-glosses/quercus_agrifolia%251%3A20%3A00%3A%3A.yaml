simpleMeaning: A very varied evergreen oak of the coast of western North America, often a shrub, with
  small thick dark-green leaves usually with spiny teeth
scope: Also called coast live oak and California live oak; an evergreen oak of the western coast, close
  to other live oaks of California and the south-west.
examples:
- Quercus agrifolia keeps its leaves through winter.
- A Quercus agrifolia shades the coastal path.
