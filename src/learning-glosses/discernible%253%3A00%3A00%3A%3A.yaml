synsetId: 00584163-a
simpleMeaning: that you can notice with any of your senses, or work out in your mind
scope: Able to be noticed by the senses or worked out by the mind, not something hidden from view and
  not a guess with no sign behind it.
examples:
- No discernible cause could be found for the noise.
- From the hill, the town was easily discernible in the clear air.
