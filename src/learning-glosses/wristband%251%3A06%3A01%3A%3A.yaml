simpleMeaning: a band of cloth, leather, or linked metal parts that is fixed to a watch and goes around
  the wrist
scope: This sense is the band that holds a watch, also called bracelet, watchband, watchstrap and watch
  bracelet. It is not the part of a sleeve that covers the wrist.
examples:
- The leather wristband on his watch broke.
- She chose a metal wristband for her new wristwatch.
