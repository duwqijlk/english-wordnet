simpleMeaning: A way of finding breast lumps by taking pictures that show warm spots on the skin
scope: A heat-picture test for breast lumps, not an X-ray of the breast and not a hand check by a doctor.
examples:
- Mammothermography can show a warm spot where a lump is growing.
- The clinic offered mammothermography as a check for breast lumps.
