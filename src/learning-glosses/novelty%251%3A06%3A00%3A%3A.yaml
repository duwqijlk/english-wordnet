simpleMeaning: a cheap piece of jewellery that draws the eye, or a bit of decoration worn on clothes
scope: Cheap showy jewellery or decoration on clothing, also called trinket or bangle, and not the quality
  of being new.
examples:
- She wore a novelty brooch on her coat.
- The shop sold novelty badges and pins.
