senseId: 'ablative%1:10:00::'
synsetId: 06323408-n
simpleMeaning: In grammar, a word form that shows with what a thing is done, or how, or where, or who
  does it in a passive sentence.
scope: This word form, also called ablative case, shows the doer, tool, way or place in a sentence, and
  is not the adjective sense meaning tending to wear away at great heat.
examples:
- The ablative shows the tool in the sentence.
- In the ablative, the doer of a passive verb is marked.
