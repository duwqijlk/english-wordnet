simpleMeaning: In botany, a plant whose life, from seed to death, normally takes two growing seasons;
  those that flower usually bloom and set fruit in the second season
scope: In botany, a two-season plant, not a plant that lives one season and not one that lives many years.
examples:
- The gardener grew biennials that would flower next year.
- A biennial takes two seasons from seed to death.
