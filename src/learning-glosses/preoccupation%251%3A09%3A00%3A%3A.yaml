schema: oewn-learning-gloss-v2
senseId: 'preoccupation%1:09:00::'
synsetId: 05708052-n
simpleMeaning: the state of mind when you keep thinking about one thing so much that it is hard to think
  about other things
scope: This is the state of mind when you keep thinking about one thing; not the idea itself that you
  keep thinking about.
examples:
- His preoccupation with work made him miss what his friend said.
- Her preoccupation was so deep that she did not hear her name called.
