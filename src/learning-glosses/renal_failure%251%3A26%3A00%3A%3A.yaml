simpleMeaning: The kidneys no longer able to pass waste out of the body and to help keep the salts in
  the blood in balance.
scope: 'Also called kidney failure: the kidneys no longer able to pass waste out of the body and to help
  keep the salts in the blood in balance, not a short illness of the kidneys.'
examples:
- Renal failure left waste building up in his blood.
- The doctor treated her renal failure with a special diet.
