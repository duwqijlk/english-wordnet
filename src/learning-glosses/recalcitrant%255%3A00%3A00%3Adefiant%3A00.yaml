simpleMeaning: keeping on refusing to obey people in power, and not giving in
scope: About a person who keeps refusing to obey people in power, not a person who says no once.
examples:
- The recalcitrant students refused to follow the head teacher's order.
- The council faced a recalcitrant group that would not obey the new law.
