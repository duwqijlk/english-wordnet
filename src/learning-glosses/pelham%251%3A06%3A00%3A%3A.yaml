simpleMeaning: A bit with a straight bar that goes in the horse's mouth, made to work both as a curb and
  as a snaffle.
scope: This is a bit that works both as a curb and as a snaffle, not a curb on its own or a snaffle on
  its own.
examples:
- He rode with a Pelham in the horse's mouth.
- The Pelham gave him both curb and snaffle control.
