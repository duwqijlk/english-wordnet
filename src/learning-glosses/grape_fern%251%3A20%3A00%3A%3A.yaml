simpleMeaning: Small round bunches of spore cases grow on the leafy part of a fern of the group Botrychium
scope: A fern whose spore cases grow in small round bunches, not a plant that bears fruit to eat and not
  a vine.
examples:
- The grape fern grew in the shade of the old oak.
- She found a grape fern with small bunches of spore cases on its frond.
