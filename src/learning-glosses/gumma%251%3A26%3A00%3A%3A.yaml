simpleMeaning: In the late stage of syphilis, a disease spread through sex, this small springy lump of
  new flesh shows up
scope: A small springy lump of new flesh in the late stage of syphilis, not a lump from a cut or bruise
  and not an early sign of the disease.
examples:
- The doctor found a gumma on the man's leg.
- A gumma showed that the syphilis had reached a late stage.
