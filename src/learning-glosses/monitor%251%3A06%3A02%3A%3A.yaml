simpleMeaning: The pictures or words a machine shows on a TV screen or a computer screen after taking
  in signals
scope: The picture shown on a screen, not the machine that watches over a system, not the machine that
  checks signals, and not the big lizard.
examples:
- The monitor showed the weather map on its screen.
- She watched the football match on the monitor in the living room.
