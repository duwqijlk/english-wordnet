simpleMeaning: 'Its seeds can stand in for coffee: this fine-looking tree of central and eastern North
  America bears big woody brown pods, green-white flowers, and large twice-feathered leaves.'
scope: 'Also called chicot: a handsome North American tree with green-white flowers, not the tropical
  bonduc with prickly pods used for jewelry.'
examples:
- The bonduc bore large brown pods.
- People ground bonduc seeds to make a drink like coffee.
