senseId: 'phrasal_idiom%1:10:00::'
synsetId: 07169038-n
simpleMeaning: A saying whose meaning you cannot guess from the words that make it up
scope: 'Also called phrase, idiom, and idiomatic expression: a saying whose meanings you cannot guess
  from its words, not a single word and not a plain group of words whose sense is clear.'
examples:
- Kick the bucket is a phrasal idiom; you cannot guess its meaning from the words kick and bucket.
- She used a phrasal idiom that puzzled the learners, since its words did not give its meaning away.
