simpleMeaning: to cheat and steal from the person or company you work for
scope: This means to cheat and steal from the person you work for, not to play a violin and not to move
  something about with your hands.
examples:
- He was caught fiddling at work and stealing money from his employer.
- The manager was fiddling, taking money that belonged to the company.
