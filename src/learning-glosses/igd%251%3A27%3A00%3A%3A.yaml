simpleMeaning: This is a kind of protein in the blood that fights sickness, one of five main kinds, found
  only in a small amount in the clear part of blood.
scope: Another name for this sense is immunoglobulin D; it is one of five kinds of proteins in the blood
  that fight sickness, not the other four kinds.
examples:
- The lab found a small amount of IgD in her blood.
- IgD is one of the five kinds of antibodies in the blood.
