senseId: 'low_relief%1:06:00::'
synsetId: 02806295-n
simpleMeaning: This carved work has shapes that stick out only a little from its flat back, with none
  cut away underneath
scope: Also called bas relief, basso relievo and basso rilievo, this is a carved work whose shapes stand
  out only a little, not a work with shapes cut deep and not a flat picture.
examples:
- The low relief on the wall showed horses standing out only a little from the stone.
- She carved a low relief in which no shape was cut away underneath.
