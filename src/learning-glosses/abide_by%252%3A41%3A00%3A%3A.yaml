simpleMeaning: to do what someone's rules, orders, or wishes say you should do
scope: To do what someone's rules, orders, or wishes say; follow and comply are other names for this sense,
  not to stay somewhere and not to break a rule.
examples:
- You must abide by the rules of the school.
- She agreed to abide by the court's decision.
