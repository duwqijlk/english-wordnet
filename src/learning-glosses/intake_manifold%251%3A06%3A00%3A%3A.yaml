simpleMeaning: a pipe with branches that carries fuel to each chamber of an engine where fuel burns
scope: A pipe with branches that carries fuel to each chamber of an engine where fuel burns; not a pipe
  that carries burnt gases out and not the tank that holds the fuel.
examples:
- A crack in the intake manifold made the engine run badly.
- The mechanic replaced the intake manifold on the old car.
