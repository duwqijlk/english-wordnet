simpleMeaning: In the infield, counted round from home plate against the clock, this is the place where
  the player who guards the bag after the second bag stands to field.
scope: Third is another name for this fielding place in the infield, counted round from home plate against
  the clock.
examples:
- He played third base all through the match.
- The ball flew past third base and into the stands.
