senseId: 'intransitively%4:02:00::'
synsetId: 00383087-r
simpleMeaning: in grammar, when a verb is used with no word after it naming what the action is done to
scope: In grammar, when a verb is used with no word after it naming what the action is done to; not when
  a verb takes a word after it, and not when the verb has no subject.
examples:
- The verb 'sleep' is used intransitively, since it takes no object.
- In 'the baby cried', 'cried' is used intransitively.
