simpleMeaning: A kind of club moss, also known as prince's pine or princess pine.
scope: Also called princess pine and tree clubmoss, this is a kind of club moss also known as ground pine
  and prince's pine, not the low flowering herb that shares the name ground pine.
examples:
- The ground fir spread in a low green mat under the tall trees.
- We found ground fir growing beside the path in the woods.
