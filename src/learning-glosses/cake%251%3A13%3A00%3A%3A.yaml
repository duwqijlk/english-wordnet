simpleMeaning: food that is made from a mix of flour, sugar, eggs, and fat, or is based on such a mix,
  typically cooked in an oven
scope: This is the sweet food you eat, made from flour, sugar, eggs, and fat; it is not a hard block of
  soap or wax.
examples:
- She made a chocolate cake for my birthday.
- We ate a slice of cake with tea.
