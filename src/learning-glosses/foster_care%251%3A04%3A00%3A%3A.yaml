simpleMeaning: Watched-over looking after of children who have broken the law or not been looked after,
  most often in a home or place that stands in for their own home.
scope: Watched-over looking after of troubled or left-alone children, most often in a home that stands
  in for their own; not looking after by their own parents and not adoption.
examples:
- The boy went into foster care after his parents died.
- Foster care gave her a safe home for two years.
