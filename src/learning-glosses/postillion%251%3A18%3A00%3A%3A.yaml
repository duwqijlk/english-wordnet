simpleMeaning: Someone who rides the horse on the left of a pair to guide the horses that pull a carriage,
  above all one with no driver
scope: Someone who rides the horse on the left of a pair to guide the horses that pull a carriage, above
  all one with no driver; postilion is another name for this sense, not the driver of the carriage and
  not a rider of one horse alone.
examples:
- The postillion rode the left horse of the pair.
- A postillion guided the carriage through the town.
