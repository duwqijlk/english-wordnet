simpleMeaning: One oft caught for wrongdoing, especially the same wrongdoing.
scope: This sense is one oft caught for wrongdoing, especially the same wrongdoing, unlike the sense for,
  in electronics, a device that boosts a signal before sending it on again, unlike the sense for a gun
  that can fire many shots with no fresh load, and unlike the sense for a folk who repeats.
examples:
- The repeater is oft caught for wrongdoing.
- Repeaters reoffend.
