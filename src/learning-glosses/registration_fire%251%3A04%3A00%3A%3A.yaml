simpleMeaning: Shots sent out to get exact facts, so that later shots can hit what is aimed at.
scope: Shots sent out to get exact facts, so that later shots can hit what is aimed at; not shots meant
  to hit at once, and not flames that burn.
examples:
- The guns opened registration fire before the attack.
- Registration fire gave the gunners the range.
