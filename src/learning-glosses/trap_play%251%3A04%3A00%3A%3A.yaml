synsetId: 00978356-n
simpleMeaning: In American football, the runner goes through the gap the lineman left after a defender
  has been let past the line and then shut off.
scope: Also called mousetrap, it lets a defender cross the line and then blocks that defender off, so
  the runner can go through the gap, not a play where the defender is held at the line.
examples:
- A trap play let the defender cross before the runner went through the gap.
- The runner went through the gap on a trap play, once the defender had been shut off.
