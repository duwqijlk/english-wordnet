simpleMeaning: draw people or things in with irresistible force, temptation or other means
scope: Attracting people or things by force or temptation, not the plain physical kind that pulls something
  in, and not the mouth-based sexual act; suck in is another name for this sense.
examples:
- The boom sucked thousands of young workers into the city.
- The new festival sucks visitors in from neighbouring towns every summer.
