simpleMeaning: a wind tool that sounds with one thin shaking strip, like a clarinet or a saxophone
scope: A wind tool that sounds with one thin shaking strip, like a clarinet or a saxophone, also called
  single-reed woodwind; not a wind tool with two thin shaking strips and not a wind tool with no shaking
  strip.
examples:
- A clarinet is a single-reed instrument.
- The single-reed instrument sounded soft and low.
