simpleMeaning: To name your partner's suit again in the bidding, at a higher level than before.
scope: A bid that lifts your partner's suit to a higher level; it is not betting more than the previous
  player at poker, not lifting an object, and not growing crops.
examples:
- She raised her partner's hearts from one to three.
- With good trump support, he raised to four spades.
