simpleMeaning: Its first double link sits three atoms from the start of its chain of carbon atoms, which
  makes this fatty acid one with many double links.
scope: It is also called omega-3 fatty acid, a fatty acid with many double links in its chain of carbon
  atoms.
examples:
- Omega-3 differs from omega-6 in where its first double link sits.
- In omega-3, the first double link sits three atoms from the start of the chain.
