simpleMeaning: Of sulfur, to do with sulfur, holding sulfur, or come from sulfur.
scope: This sense is also called sulfurous, for what is of sulfur, to do with sulfur, holding sulfur,
  or come from sulfur, unlike the sense for weather marked by heavy heat and damp, and unlike the sense
  for a tone that is harsh or biting.
examples:
- The water is sulphurous, smelling of sulfur.
- Sulphurous fumes rose from the hot spring.
