simpleMeaning: Growing above all on damp fairly sour ground, this North American plant lives one year
  and bears blooms most times yellow and at times red-gold.
scope: People also call it celandine, jewelweed, lady's earrings and touch-me-not; it is a North American
  plant of one year with yellow blooms.
examples:
- The orange balsam grows on wet sour soil in North America.
- Orange balsam bears yellow blooms on damp sour ground.
