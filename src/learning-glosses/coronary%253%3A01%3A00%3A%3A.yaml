senseId: 'coronary%3:01:00::'
synsetId: 02996039-a
simpleMeaning: going around something like a crown, especially of the blood vessels that go around the
  heart
scope: This describes something that goes around like a crown, especially the blood vessels around the
  heart; it is not the noun sense for a blockage of blood flow in the heart by a blood clot.
examples:
- The coronary arteries go around the heart like a crown.
- Doctors checked the coronary vessels around his heart.
