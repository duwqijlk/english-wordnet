simpleMeaning: tending to stop bleeding by making the soft flesh or blood tubes shrink
scope: 'Also called hemostatic: something that stops bleeding by making the flesh or blood tubes shrink,
  not a bandage that only covers a cut and not a drug that makes the blood thick.'
examples:
- The doctor pressed a styptic pad onto the cut to stop the bleeding.
- A styptic pencil helped the small cut on his chin stop bleeding.
