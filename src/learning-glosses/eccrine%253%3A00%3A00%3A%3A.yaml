synsetId: 00099589-a
simpleMeaning: To keep body heat steady, glands like these send a clear watery fluid out through a duct,
  without losing any part of the cell
scope: Of glands that send fluid out, not of glands that lose part of the cell when they work, and not
  of sweat itself.
examples:
- Eccrine glands in the skin make the sweat that cools us down.
- Her eccrine glands worked hard as she ran in the heat.
