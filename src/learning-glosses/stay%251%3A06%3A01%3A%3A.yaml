simpleMeaning: a thin strip of metal or bone placed inside a garment such as a corset to make it firm
  and hold its shape
scope: This sense is a stiffening piece sewn into clothing, not a period spent somewhere or a delay.
examples:
- The dressmaker slid a thin metal stay into the seam to keep the collar upright.
- The corset was fitted with a steel stay along each side.
