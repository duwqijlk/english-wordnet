simpleMeaning: In medicine, an unborn baby whose body is so badly deformed that it usually cannot survive.
scope: This medical term describes a malformed fetus, not a cruel person or an unusually deformed person
  or animal.
examples:
- Older medical reports sometimes described a severely malformed fetus as a monster.
- The museum's anatomy collection includes a preserved monster that died at birth.
