simpleMeaning: Bee wax, the sweet food bees make, and the young of insects make up the food of this small
  bird of the warm lands of Africa and Asia.
scope: It is a small bird that eats bee wax and the sweet food bees make, not the bright songbird of the
  Americas called a honeycreeper.
examples:
- A honey guide picked at the wax of an old comb.
- The honey guide flew down to feed on the sweet food in the hive.
