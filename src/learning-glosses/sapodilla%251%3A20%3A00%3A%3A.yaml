simpleMeaning: a big green tree of warm America that keeps its leaves all year, giving gum for chewing
  and fruit to eat; some put it in the group called Achras
scope: A big tree of warm America grown for chewing gum and fruit, not the fruit itself, which is a different
  sense of sapodilla; sapodilla tree is another name for this sense.
examples:
- The sapodilla in the garden gives fruit each year.
- Workers tap the sapodilla for chicle gum.
