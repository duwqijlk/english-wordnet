simpleMeaning: to speak in an unfair, insulting way that puts a person or group down
scope: To insult a person or group with unfair words, not notes joined by a curved line to be played smoothly
  and not unclear speech.
examples:
- Your comments are slurring your co-workers, and they have noticed.
- He would never slur a whole group of people because of their race.
