simpleMeaning: A small to mid-size fish that lives on the bottom of shallow coastal water and fresh water,
  is caught for food and sport, and makes a beating sound
scope: A fish that lives on the bottom of shallow coastal water and makes a beating sound, not a musical
  instrument and not a metal container for liquids.
examples:
- The drum swam near the bottom of the shallow bay.
- Fishermen caught a drum in the river and heard its beating sound.
