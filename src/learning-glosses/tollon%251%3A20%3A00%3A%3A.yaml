simpleMeaning: a treelike bush keeping its leaves all year, grown for show, with big white flowers and
  red berry-like fruits, on the American Pacific coast; often in the group Photinia
scope: Also called toyon; a showy evergreen bush of the Pacific coast, not a tree and not a berry bush
  grown for fruit.
examples:
- The tollon bloomed white in spring.
- They planted a tollon by the fence.
