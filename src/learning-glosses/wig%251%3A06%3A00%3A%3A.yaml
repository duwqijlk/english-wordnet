simpleMeaning: a covering for the head made of real hair or man-made hair
scope: A thing you wear on your head to look like hair, not the British slang sense that means angry words
  for telling someone off.
examples:
- She wore a long brown wig to cover her short hair.
- He bought a wig made of real hair.
