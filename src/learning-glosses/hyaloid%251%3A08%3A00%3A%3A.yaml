simpleMeaning: Round the jelly inside the eye, this clear thin skin keeps it apart from the back of the
  eye.
scope: This clear thin skin round the jelly inside the eye is also called a hyaloid membrane, and it is
  not the jelly itself.
examples:
- The jelly stays wrapped in the hyaloid inside the eye.
- Without the hyaloid, the jelly would touch the back of the eye.
