simpleMeaning: A grain plant grown for food for people and animals, with stems and growth like maize but
  with leaves that have sawtooth edges.
scope: This is a grain plant grown for food, with stems and growth like maize but with leaves that have
  sawtooth edges; great millet, kaffir and kafir corn are other names for it, not maize itself.
examples:
- Farmers plant kaffir corn for food for people and animals.
- The kaffir corn had leaves with sawtooth edges.
