senseId: 'parhelic_ring%1:19:00::'
synsetId: 11507933-n
simpleMeaning: A bright halo level with the horizon at the sun's height, caused by ice crystals in the
  atmosphere
scope: This bright circle of light, also called a parhelic circle and a solar halo, comes from sunlight
  meeting tiny ice crystals high in the air.
examples:
- A parhelic ring appeared as a bright circle of light level with the ground.
- The parhelic ring ran level with the ground at the height of the sun.
