simpleMeaning: Tame farm animals of the cattle kind, taken as a group, whether male or female, young or
  old.
scope: Tame cattle taken as a group, not wild cattle and not a single animal on its own.
examples:
- The cows grazed in the field all day.
- Wait till the cows come home, he joked, and went back to work.
