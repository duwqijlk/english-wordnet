simpleMeaning: To count a length as small as one trillionth of a metre, you use this metric unit
scope: Also called a picometer or a picometre, this is a length of one trillionth of a metre, not a billionth
  like a micromillimeter.
examples:
- The wavelength was measured in micromicrons, each one a trillionth of a metre.
- A micromicron is far too small a unit for measuring a room.
