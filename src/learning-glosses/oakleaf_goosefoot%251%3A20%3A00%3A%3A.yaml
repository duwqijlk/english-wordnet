simpleMeaning: In North America it grows wild as a weed; a plant of Europe that lives one year, with spikes
  of greenish blooms and blades white and hairy underneath.
scope: It is also called oak-leaved goosefoot, a one-year plant of Europe whose blades are white and hairy
  underneath.
examples:
- Oakleaf goosefoot is common as a weed in North America.
- The oakleaf goosefoot lives only one year.
