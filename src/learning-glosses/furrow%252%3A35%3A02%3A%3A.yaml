schema: oewn-learning-gloss-v2
senseId: 'furrow%2:35:02::'
synsetId: 01280213-v
simpleMeaning: to cut a long, shallow line into a tall stone post that holds up part of a building
scope: This sense is only about cutting a line into a tall stone post; it is not digging a line in soil
  in general, and not a long cut in the ground as a thing.
examples:
- Workers furrowed the column to give its sides long straight lines.
- The tall stone column was carefully furrowed along its whole length.
