simpleMeaning: A serious promise, made to yourself, to another person, or to a god, to do a thing or to
  act in a set way
scope: A serious promise about what you will do or how you will act, not the act of giving yourself to
  a god by such a promise.
examples:
- They took vows of poverty when they joined the order.
- She made a vow never to speak of what she had seen.
