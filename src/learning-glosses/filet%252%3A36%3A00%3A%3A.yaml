simpleMeaning: to add lace with patterns made of lines and shapes, as a decoration
scope: Also called fillet, this means adding patterned lace as decoration; it is not a beef steak and
  not cutting meat or fish into pieces.
examples:
- She fileted the edge of the cloth with lace patterned with squares and triangles.
- They fileted the border of the dress with lace made of repeating diamond shapes.
