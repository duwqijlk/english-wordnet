simpleMeaning: A plantain from the Old World, with long narrow ribbed leaves, now growing widely in mild
  lands.
scope: Also called narrow-leaved plantain, ribgrass, ribwort, or ripple-grass, an Old World plantain with
  long narrow ribbed leaves; not the Rhamnus shrub of the same name and not the Bumelia shrub.
examples:
- Buckthorn grows along the hedges in the old fields.
- The leaves of the buckthorn are long, narrow, and ribbed.
