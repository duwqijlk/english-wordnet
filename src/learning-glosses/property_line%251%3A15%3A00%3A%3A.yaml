senseId: 'property_line%1:15:00::'
synsetId: 08532497-n
simpleMeaning: The edge where one piece of land ends and the next piece begins
scope: The edge between two pieces of land, not a wall or fence built on it, and not the edge of a single
  piece of land.
examples:
- The fence stands on the property line between our two gardens.
- They argued for years over where the property line ran.
