simpleMeaning: In maths, this step works on a thing and gives it back with no change at all
scope: In maths, a step that leaves a thing just as it was, also called identity and identity element;
  not a step that changes a thing and not a new number.
examples:
- Multiplying by one is the identity operator, since it changes nothing.
- The identity operator acts on a number and gives back the same number.
