simpleMeaning: the job of athletes who play games or take part in competitions for money.
scope: This is not a game played for fun, not a single competition, and not the Maine word for a summer
  visitor; it is the paid occupation of athletes who compete for money.
examples:
- He has made a career in professional sport.
- She earns her living from sport.
