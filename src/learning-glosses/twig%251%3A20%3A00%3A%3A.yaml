simpleMeaning: a small thin branch, or a small part that grows out from a branch, especially at its end;
  usually a branch from this year or last year
scope: This is a small thin branch, usually from this year or last year, not the verb sense of spreading
  out like such a branch.
examples:
- The new twigs that grew this spring are still green and thin.
- A small twig from last year's growth snapped off the bush.
