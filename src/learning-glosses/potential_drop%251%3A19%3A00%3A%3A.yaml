simpleMeaning: The gap in electric push between two spots in a loop of wire, counted in volts
scope: Also called potential, voltage, electric potential and potential difference, it is the gap in electric
  push between two points in a circuit, not the push at one point alone.
examples:
- The meter showed a potential drop of two volts across the wire.
- A big potential drop between the two ends can stop the lamp from lighting.
