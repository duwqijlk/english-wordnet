simpleMeaning: One of a set of green colouring stuffs found in living things that make food from light;
  four kinds occur in nature
scope: One of a set of green colouring stuffs found in living things that make food from light, with four
  kinds in nature; chlorophyll is another name for this sense, not the small part in a plant cell that
  holds it and not the green water growth.
examples:
- Chlorophyl gives leaves their green colour.
- Four forms of chlorophyl occur in nature.
