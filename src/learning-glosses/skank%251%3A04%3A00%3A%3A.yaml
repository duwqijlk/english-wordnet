simpleMeaning: A dance with a steady beat to reggae music, done bent forward with the hands held out and
  the knees bent.
scope: A dance to reggae music, not the foul substance that shares the same name, and not the verb for
  doing this dance.
examples:
- They did the skank to the reggae band all night.
- She learned the skank from her older brother.
