simpleMeaning: 'A coin that was used in the United Kingdom: an old silver coin, or a bronze coin worth
  two pennies, counted in decimals'
scope: Also called twopence, this is a single United Kingdom coin worth two pennies, not a one-penny coin.
examples:
- In the old shop, a sweet cost just a tuppence.
- He found a tuppence in his grandfather's coin box.
