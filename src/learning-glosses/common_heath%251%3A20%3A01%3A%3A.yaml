simpleMeaning: Flowers that run from white through rose to a deep red with a touch of purple grow on this
  thin tall bush from the south of Australia and Tasmania.
scope: This is the thin tall kind that grows in the south of Australia and Tasmania, not the small low
  kind with sweet-smelling ivory flowers.
examples:
- The common heath showed white flowers.
- We saw a common heath with deep red flowers.
