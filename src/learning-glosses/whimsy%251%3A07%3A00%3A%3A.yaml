senseId: 'whimsy%1:07:00::'
synsetId: 04679198-n
simpleMeaning: the way a person acts in ways others cannot guess, going by a sudden wish more than by
  clear thought or good sense
scope: Also called capriciousness, flightiness and arbitrariness, this is a person's way of acting on
  sudden wishes, not one odd idea by itself.
examples:
- Her whimsy made each day's plan change without warning.
- People liked his whimsy, but they never knew what he would do next.
