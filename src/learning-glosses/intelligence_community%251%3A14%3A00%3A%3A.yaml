simpleMeaning: A group of government offices that gather secret information for the United States government,
  led by the Director of Central Intelligence.
scope: Also called the United States Intelligence Community, this is a group of government offices, not
  one office on its own.
examples:
- The Intelligence Community warned the president about the threat.
- Members of the Intelligence Community share what they learn.
