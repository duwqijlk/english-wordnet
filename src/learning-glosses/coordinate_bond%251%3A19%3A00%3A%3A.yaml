simpleMeaning: a link between two atoms in which one atom gives both electrons, the tiny bits of charge
  that atoms share
scope: A link between two atoms where one atom gives both shared electrons; dative bond is another name
  for this sense, not a link where each atom gives one electron.
examples:
- A coordinate bond forms when one atom donates both electrons.
- The ammonia molecule uses a coordinate bond to join with a proton.
