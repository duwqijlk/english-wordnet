simpleMeaning: a leafy green of the cabbage family with a thick round yellow root that can be eaten
scope: 'Also called rutabaga, swede and turnip cabbage: a leafy green with a thick round yellow root that
  can be eaten, not a turnip and not a cabbage with leaves only.'
examples:
- The rutabaga plant grew big yellow roots in the garden.
- We pulled a rutabaga plant and cooked its thick root.
