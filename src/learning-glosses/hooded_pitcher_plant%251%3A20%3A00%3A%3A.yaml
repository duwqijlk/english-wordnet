simpleMeaning: Trumpet-shaped leaves with their openings shut by a curved cover mark this yellow-flowered
  kind of the southeast of the United States.
scope: It is a yellow-flowered kind of the southeast, set apart from kinds with open tops by trumpet-shaped
  leaves whose openings are shut by a curved cover.
examples:
- The hooded pitcher plant grew in the southeast of the United States.
- A hooded pitcher plant held a curved cover over its opening.
