senseId: 'morchella_conica%1:20:00::'
synsetId: 13054337-n
simpleMeaning: A morel whose pitted top part joins the stalk with almost no loose edge round it, grey
  when young and black when old.
scope: This is a morel whose pitted top part joins the stalk with almost no loose edge round it, grey
  when young and black when old; black morel, conic morel, narrowhead morel and Morchella angusticeps
  are other names for this sense, not a morel with a loose edge round the stalk and not a morel that stays
  pale when old.
examples:
- The Morchella conica we found was grey and young.
- An old Morchella conica had turned black.
