simpleMeaning: Players who break the rules sit out their time in this closed seat at the side of the rink
  in ice hockey.
scope: In ice hockey, this closed seat at the side of the rink holds players sitting out time, and it
  is not the rink itself.
examples:
- The penalty box held players sitting out time.
- A player sat in the penalty box for breaking the rules.
