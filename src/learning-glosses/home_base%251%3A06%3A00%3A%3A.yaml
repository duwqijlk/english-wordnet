simpleMeaning: A firm runs its work from this main workplace, usually named in the plural
scope: Also called central office, headquarters, home office or main office, this is a firm's main workplace,
  not a branch workplace and not the baseball plate where the batter stands.
examples:
- Many companies have their home base in New York.
- The firm's home base handles all its accounts and planning.
