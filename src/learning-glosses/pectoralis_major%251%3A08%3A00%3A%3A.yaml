simpleMeaning: A muscle joined to bone in the chest that pulls the arm in toward the body and turns it
scope: 'Also called a greater pectoral muscle and musculus pectoralis major: a chest muscle that pulls
  the arm in and turns it, not the smaller chest muscle under it and not a muscle of the back.'
examples:
- The pectoralis major pulls his arm across his chest.
- She tore her pectoralis major while lifting weights.
