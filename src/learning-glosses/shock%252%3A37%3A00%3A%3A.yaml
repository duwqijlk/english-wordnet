simpleMeaning: to fill someone with extreme fear or horror.
scope: This is the horror sense, not the one meaning to surprise someone greatly, and not the disgust
  or electric-current senses.
examples:
- The sight of the crash shocked everyone on the bus.
- It shocked her to hear how badly he had been treated.
