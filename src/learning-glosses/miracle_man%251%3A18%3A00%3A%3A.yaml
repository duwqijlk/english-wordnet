simpleMeaning: A male person who says he can do wonderful things that cannot be explained by natural laws,
  or is said to be able to do them.
scope: A male person who says he can do wonderful things that cannot be explained by natural laws, or
  is said to be able to do them; not a female person who does this, and not the general word for any person
  who does this.
examples:
- The villagers called him a miracle man after the sick child recovered.
- A self-styled miracle man drew crowds to the market square.
