simpleMeaning: A heavy, yellow, poisonous oily liquid made by nitrating glycerol; it explodes and is used
  in explosives and in medicine to widen blood vessels (trade names Nitrospan and Nitrostat).
scope: A technical chemical name for the liquid itself, not glycerol, the thick alcohol it is made from.
examples:
- Doctors gave him glyceryl trinitrate to ease his chest pain.
- The factory handled glyceryl trinitrate with great care because it is explosive.
