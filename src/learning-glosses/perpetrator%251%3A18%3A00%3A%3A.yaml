simpleMeaning: A person who does something wrong
scope: A person who does something wrong; not a person who is blamed by mistake, and not a person who
  merely watches wrong being done.
examples:
- The police caught the perpetrator of the robbery within a week.
- No one knew who the perpetrator of the cruel trick had been.
