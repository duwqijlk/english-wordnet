simpleMeaning: Animals are fed on this long pod, and its somewhat sweet flesh is used in place of chocolate;
  it holds small seeds and flesh that can be eaten.
scope: 'Also called carob, algarroba, algarroba bean, locust bean and locust pod: a long pod whose flesh
  can be eaten, not the tree that bears it.'
examples:
- The carob bean is a long pod with small seeds and somewhat sweet flesh.
- Carob beans are fed to animals and used in place of chocolate.
