simpleMeaning: a yellow drug that forms clear hard bits, made from a tiny living thing in soil and sold
  as Terramycin, used to fight many kinds of germ illness
scope: A yellow drug made from a tiny living thing in soil, also called hydroxytetracycline and oxytetracycline
  hydrochloride; not a drug made in a lab from chemicals and not a drug for pain.
examples:
- The vet gave the calf oxytetracycline for its infection.
- Oxytetracycline is used to fight many kinds of germ illness.
