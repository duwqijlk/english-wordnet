simpleMeaning: music that is sung or played at the same time as the main part, to support it while the
  main part stays the most important part
scope: This is the music that goes with the main part, also called support, backup, and musical accompaniment;
  it is not going with a person to keep them safe.
examples:
- The piano played a soft accompaniment while she sang.
- He sang with only a guitar accompaniment.
