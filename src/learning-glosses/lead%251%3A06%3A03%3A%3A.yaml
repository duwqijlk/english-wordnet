simpleMeaning: a rope or light chain used to hold back and control an animal
scope: This is the rope or chain for an animal, not a short wire joining points in a circuit or the timing
  of a spark.
examples:
- She kept the dog on a lead while they crossed the road.
- The puppy chewed through its lead and ran off across the park.
