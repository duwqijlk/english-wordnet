senseId: 'longanimity%1:07:00::'
synsetId: 04647895-n
simpleMeaning: The quality of putting up with delay or poor ability in a kind way.
scope: 'Also called patience and forbearance: putting up with slow or poor work while staying kind and
  calm, not anger at a delay and not a refusal to wait.'
examples:
- His longanimity with the slow queue surprised everyone.
- She showed great longanimity while the new worker learned the job.
