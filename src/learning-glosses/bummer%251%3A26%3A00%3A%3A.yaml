simpleMeaning: something that happens that makes you feel annoyed, upset, or let down
scope: This names an annoying or disappointing thing that happens; it is the experience itself, not just
  a passing bad feeling.
examples:
- Losing our tickets was a real bummer.
- It was a bummer that rain stopped the game.
