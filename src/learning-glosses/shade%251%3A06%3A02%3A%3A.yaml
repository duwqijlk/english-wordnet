simpleMeaning: a cover for a lamp, made to look pretty, that stops a person from seeing the light bulb
  straight on
scope: A cover for a lamp, not the dark place out of the sun and not dark parts drawn in a picture.
examples:
- She put a cloth shade on the lamp by her bed.
- The lamp shade is blue and lets soft light through.
