simpleMeaning: Air driven back by the turning propeller of an aircraft.
scope: Air driven back by the turning propeller of an aircraft, also called a race, a wash, or a slipstream;
  not the wave that spreads behind a boat as it moves forward.
examples:
- The backwash from the propeller blew dust across the field.
- Standing behind the plane, they felt the backwash of its propeller.
