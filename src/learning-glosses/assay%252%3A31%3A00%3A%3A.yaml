simpleMeaning: To test chemical matter and learn what it holds.
scope: This sense is to test chemical substances and learn what they hold, unlike the sense for a substance
  now being tested to find what it is made of.
examples:
- They assay the ore to find what it holds.
- Chemists assay samples of the metal.
