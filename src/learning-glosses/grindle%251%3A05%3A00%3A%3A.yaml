simpleMeaning: This meat-eating fish of an early kind lives in slow fresh water in North America; a fin
  on its back runs almost the whole length of its long body.
scope: Also called bowfin and dogfish, this is a long meat-eating freshwater fish with a very long back
  fin, not a pike or a carp.
examples:
- The grindle lay still in the slow water, waiting for smaller fish.
- A grindle's back fin runs nearly the whole length of its long body.
