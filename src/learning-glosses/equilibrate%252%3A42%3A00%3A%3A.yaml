simpleMeaning: to bring things to a steady state where each side holds the same weight
scope: To bring things to a steady state; balance, equilibrise and equilibrize are other names for this
  sense, not bringing a chemical mix to a standstill.
examples:
- He worked to equilibrate the load on both sides of the boat.
- She tried to equilibrate work and rest in her life.
