simpleMeaning: Small wallabies with a hard, horn-like point on the tip of the tail.
scope: Small wallabies with a hard point on the tip of the tail; nail-tailed kangaroo is another name
  for this, and it is not a big kangaroo or a wallaby with no point on its tail.
examples:
- The nail-tailed wallaby hopped through the scrub.
- A nail-tailed wallaby has a hard point on its tail.
