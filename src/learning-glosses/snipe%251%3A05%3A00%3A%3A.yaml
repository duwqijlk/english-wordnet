simpleMeaning: a bird of the sandpiper family with a straight bill, hunted for sport, found in wet low
  land in the Old World and the New World, like a woodcock
scope: This is the bird itself, found in wet low land; not the act of hunting or shooting it.
examples:
- We saw a snipe standing in the wet grass near the river.
- The hunter waited in the wet field for a snipe to fly up.
