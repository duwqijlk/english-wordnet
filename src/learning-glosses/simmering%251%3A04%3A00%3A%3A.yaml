simpleMeaning: the cooking of food in water or other liquid once the liquid has been heated to the boil
scope: Food cooking in a liquid heated to the boil; boiling is another name for this sense, not frying,
  and not cooking in an oven.
examples:
- The simmering of the soup filled the kitchen with steam.
- She left the pot at a gentle simmering while she set the table.
