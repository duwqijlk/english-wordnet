schema: oewn-learning-gloss-v2
senseId: 'paramagnetism%1:19:00::'
synsetId: 11500921-n
simpleMeaning: The way stuff such as aluminium or platinum turns magnetic in a field and loses it when
  the field is taken away.
scope: The short-lived pull some stuff shows in a field, not the lasting pull of iron and not the pull
  of a lodestone.
examples:
- Paramagnetism made the aluminium rod twitch toward the magnet.
- The paramagnetism vanished as soon as the field was cut.
