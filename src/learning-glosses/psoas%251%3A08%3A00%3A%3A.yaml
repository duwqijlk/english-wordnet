simpleMeaning: Deep in the belly, one of a pair of cords of flesh bends the body forward at the waist
  and turns the leg at the hip.
scope: It is one of the pair of muscles that bend the body forward and turn the leg, and it lies deep
  in the belly and hip.
examples:
- The psoas tightens when a person bends forward to lift a box.
- After the long climb, the psoas ached on both sides.
