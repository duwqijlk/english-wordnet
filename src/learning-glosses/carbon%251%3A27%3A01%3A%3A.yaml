senseId: 'carbon%1:27:01::'
synsetId: 14821983-n
simpleMeaning: A thin sheet of paper with a dark waxy coat on one side, often with black stuff in it,
  used to copy marks onto a sheet put under it
scope: Thin coated paper for copying by hand, not a copy made with it and not plain writing paper.
examples:
- She put a sheet of carbon paper under the letter to make a copy.
- The carbon paper left dark marks on her fingers.
