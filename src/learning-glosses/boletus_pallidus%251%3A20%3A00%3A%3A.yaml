simpleMeaning: A mushroom-like fungus whose cap starts off-white and turns dull brown, with a stalk of
  the same shade and pale greenish-yellow tubes below
scope: A fungus whose cap fades from off-white to dull brown, not one whose cap stays white and not a
  fungus with a scarlet pore face.
examples:
- The Boletus pallidus we found had a dingy brown cap.
- Young Boletus pallidus caps are off-white.
