simpleMeaning: round the long threads of nerve fibres, a coat of myelin wraps and keeps their signals
  apart from others
scope: This coat of myelin wraps round nerve threads, and it is also called a myelin sheath.
examples:
- The medullary sheath wraps round the axon.
- The medullary sheath keeps the nerve signal apart from others.
