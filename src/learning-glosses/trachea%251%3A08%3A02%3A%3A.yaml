simpleMeaning: one of the small tubes that make up the breathing parts of most insects and many arachnids
  (animals like spiders)
scope: One small breathing tube in an insect or a spider-like animal, not the larger tube in the throat
  that carries air down toward the lungs.
examples:
- An insect takes in air through tiny openings that lead to each trachea.
- Under the microscope, we could see a trachea inside the small insect.
