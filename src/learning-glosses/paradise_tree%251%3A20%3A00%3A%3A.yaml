simpleMeaning: a medium-large plant from warm North and South America, with leaves of paired leaflets
  plus one at the tip, long bunches of small pale yellow flowers, then scarlet fruit
scope: 'Also called bitterwood: a medium to large tree from warm parts of the Americas, with paired leaflets,
  pale yellow flowers, and bright red fruit, not a palm or a fruit tree grown for food.'
examples:
- The paradise tree outside the house had long bunches of pale yellow flowers.
- A paradise tree drops bright red fruit after its flowers fade.
