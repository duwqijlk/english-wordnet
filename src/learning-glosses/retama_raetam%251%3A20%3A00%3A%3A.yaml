scope: A desert shrub of Syria and Arabia with small white flowers; also called juniper, juniper bush,
  raetam, retem and Genista raetam.
examples:
- Retama raetam blooms with small white flowers in the desert.
- The juniper of the Old Testament is Retama raetam.
