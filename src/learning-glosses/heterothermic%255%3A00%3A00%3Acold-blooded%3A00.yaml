synsetId: 02543547-s
simpleMeaning: This animal's body heat goes up and down with the heat of the place around it, and it is
  not a bird or a mammal
scope: Said of an animal other than a bird or mammal whose body heat changes with the air around it, also
  called ectothermic, poikilothermic and poikilothermous, not of a warm-blooded animal.
examples:
- The lizard is heterothermic, so its body cools on a cold night.
- Heterothermic animals warm up again when the sun comes out.
