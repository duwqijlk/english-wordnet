simpleMeaning: troubled again and again, most of all by small things that will not stop
scope: This is being worn down by small troubles that keep coming; annoyed and vexed are other names for
  this sense, not a single big trouble and not anger at one thing.
examples:
- Harassed working mothers juggle jobs, children, and endless small demands.
- The harassed father sighed as the phone rang for the fifth time that morning.
