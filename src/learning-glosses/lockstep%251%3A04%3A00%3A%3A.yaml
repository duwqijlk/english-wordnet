senseId: 'lockstep%1:04:00::'
synsetId: 00292244-n
simpleMeaning: a way of walking in a line, one behind the other, where each person moves the same leg
  at the same time, close behind the person in front
scope: This is walking in a line with legs moving together, close behind the person in front, not walking
  freely at your own pace.
examples:
- The prisoners marched in lockstep, their ankles chained close together.
- The guards moved in lockstep down the hall, each step matching the man ahead.
