simpleMeaning: In golf, the backward lean of the face of some clubs, made to send the ball up high
scope: In golf, the backward lean of a club face that sends the ball up high, not an open floor at the
  top of a house and not a drawing of a ship's lines.
examples:
- This club has more loft than the one you used.
- He chose a wedge with plenty of loft for the short shot.
