simpleMeaning: Some people hold that spells can make things happen that nature does not allow, by drawing
  on hidden powers or bad spirits.
scope: People also call it sorcery, necromancy and black art, and it is the belief that spells draw on
  hidden powers or bad spirits to bring about unnatural effects.
examples:
- He feared that black magic had caused the strange illness.
- In the story, black magic was blamed for the failed harvest.
