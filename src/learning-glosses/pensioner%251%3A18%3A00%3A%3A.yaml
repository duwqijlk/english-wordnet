simpleMeaning: a person who gets money from a pension fund
scope: This is a person who gets money from a pension fund. It is not the fund itself, and not the people
  who run the fund.
examples:
- As a pensioner, he gets a payment each month from his old job's fund.
- The pensioners were told their payments would rise next year.
