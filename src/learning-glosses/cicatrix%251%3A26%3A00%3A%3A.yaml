simpleMeaning: the mark that stays after a wound has healed, most often on the skin
scope: This is the mark that stays after a wound has healed, most often on the skin; cicatrice and scar
  are other names for this sense, not a new cut and not a birthmark.
examples:
- The cicatrix on his forehead came from a childhood accident.
- Her cicatrix had shrunk to a small white line.
