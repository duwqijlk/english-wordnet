simpleMeaning: A plant of moist woods whose tiny white flowers hang in loose clusters on leafy stems;
  it grows from Alaska to central California and east to Montana.
scope: This is the woodland plant with tiny white flowers in loose clusters, not the true miterwort that
  the 'false' in its name sets it against. It is a botanical name, and 'false mitrewort' is another spelling
  of the same plant.
examples:
- False miterwort carpeted the damp floor of the ravine.
- On a walk in the Coast Range we found false miterwort beside a stream.
