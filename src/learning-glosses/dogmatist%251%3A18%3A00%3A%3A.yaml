simpleMeaning: a person who holds fixed views and will not listen to others, and who states them as if
  they must be right
scope: A person who holds fixed views and will not listen to others, also called a doctrinaire, and not
  a person who asks questions or changes their mind.
examples:
- The old dogmatist refused to hear any plan but his own.
- She called him a dogmatist after he dismissed every new idea.
