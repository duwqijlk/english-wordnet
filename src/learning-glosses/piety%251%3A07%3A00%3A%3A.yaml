simpleMeaning: the quality of being good and right because you live by your religion and show deep respect
  for God
scope: 'Also called piousness: being good and right because you live by your religion and show deep respect
  for God, not just general goodness with no link to religion.'
examples:
- Her piety was clear in the way she prayed every day and helped the poor.
- The old man's piety shaped the way he lived his whole life.
