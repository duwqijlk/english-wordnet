senseId: 'conceptualisation%1:04:00::'
synsetId: 00942658-n
simpleMeaning: Thinking up an idea or a way to explain a thing, and putting it into words in the mind
scope: Thinking up an idea or a way to explain a thing, and putting it into words in the mind; formulation
  and conceptualization are other names for this sense, not simply having an idea and not writing it down.
examples:
- The conceptualisation of the plan took shape in her mind.
- His conceptualisation put the idea into words before he wrote it down.
