simpleMeaning: about church leaders who are not tied by the promises of people who live apart in a monastery,
  a place set apart for prayer
scope: This is about church leaders not tied to a monastery, not about life in the world outside religion
  and not about turning away from religion.
examples:
- The secular clergy lived in the town and served its church.
- He joined the secular clergy and did not enter a monastery.
