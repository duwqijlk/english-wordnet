simpleMeaning: A branch of the upper jaw artery that brings blood to the bony ridge holding the teeth.
scope: 'Also called alveolar artery: a branch of the upper jaw artery that brings blood to the bony ridge
  holding the teeth, not the main jaw artery and not a vein.'
examples:
- The arteria alveolaris feeds the ridge that holds the upper teeth.
- Damage to the arteria alveolaris can starve the tooth ridge of blood.
