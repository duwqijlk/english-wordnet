schema: oewn-learning-gloss-v2
senseId: 'stray%2:32:00::'
synsetId: 00782620-v
simpleMeaning: to stop being clear or to turn away, especially from the main subject or the main line
  of an argument, when writing, thinking, or speaking
scope: 'Also called wander: to turn away from the main subject in writing, thinking, or speaking, not
  to walk from place to place with no goal and not a lost animal.'
examples:
- Please do not stray from the main point in your essay.
- His thoughts strayed while he was speaking, and he lost the main point.
