simpleMeaning: Used a great deal in work with chemicals, this strong acid, H2SO4, eats away what it touches
  and is made from sulfur dioxide.
scope: Also called vitriol, sulfuric acid, and sulphuric acid, it is a strong acid made from sulfur dioxide
  and used a great deal in work with chemicals.
examples:
- Oil of vitriol was used in the chemical works.
- A drop of oil of vitriol fell on the cloth and ate a hole in it.
