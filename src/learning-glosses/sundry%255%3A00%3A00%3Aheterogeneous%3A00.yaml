simpleMeaning: made up of different kinds of things put together with no clear order
scope: Also called mixed, motley, assorted and miscellaneous. It means made of different kinds with no
  clear order, not made of one kind only.
examples:
- She packed sundry small things into one bag for the trip.
- The box held sundry tools, papers and bits of cloth.
