simpleMeaning: the act of moving your body to get away from an opponent, a person chasing you, or a bad
  situation, by a clever move
scope: About getting away by moving your body, not about not doing a duty by a trick and not about words
  that hide an unpleasant truth.
examples:
- His evasion let him slip past the guard who was chasing him.
- The player's clever evasion took him away from his opponent in one turn.
