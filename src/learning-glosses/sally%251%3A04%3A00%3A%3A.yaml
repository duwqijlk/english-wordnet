simpleMeaning: A sudden rush out by soldiers trapped in a place, to attack those around them
scope: A sudden rush out by trapped soldiers to attack; not a planned attack from outside, and not a retreat.
examples:
- The garrison made a sally at dawn to drive off the attackers.
- A bold sally from the fort caught the enemy by surprise.
