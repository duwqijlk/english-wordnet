senseId: 'calumny%1:10:00::'
synsetId: 06732328-n
simpleMeaning: a false claim that someone did a wrong thing, or an untrue telling of someone's words or
  actions meant to harm them
scope: This is false, harmful talk about a person, also called defamation, calumniation, hatchet job,
  obloquy and traducement; it is not a true charge or fair words about a person.
examples:
- The paper printed a calumny about the mayor, saying he stole money he never took.
- She went to court over the calumny after he spread false stories about her work.
