simpleMeaning: A fish of the Atlantic kind that spends its whole life in lakes in New England and the
  southeast of Canada, with no run to the sea.
scope: Lake salmon is another name for this Atlantic fish, which spends its whole life in lakes in New
  England and the southeast of Canada, not the kind that swims out to sea.
examples:
- Fishermen look for landlocked salmon in the lakes of New England.
- The landlocked salmon in the lake never reach the sea.
