simpleMeaning: The water is taken out by freezing it in a space with almost no air, and the word is used
  of body tissue, blood, serum, and other such matter.
scope: Also called freeze-dried and lyophilized, this is the word for body tissue, blood, serum, and other
  such matter dried by freezing in a space with almost no air.
examples:
- The lyophilised tissue was ready for use.
- Lyophilised serum was kept until it was needed.
