simpleMeaning: Something like air, breathed in to take away pain, used by dentists and in operations.
scope: Something like air, breathed in to take away pain, used by dentists and in operations; nitrous
  oxide is another name for this sense, not a liquid drug, and not a substance breathed in to help a person
  breathe.
examples:
- The dentist gave her laughing gas before filling the tooth.
- Laughing gas eased the pain during the small operation.
