simpleMeaning: to shout loudly at a person in a rude way to show you do not like them or what they are
  doing
scope: This is the act of shouting in that rude way at a person, not the noun name for one single rude
  shout itself.
examples:
- The crowd catcalled the speaker as he left the stage.
- Some fans catcalled at the players after the bad game.
