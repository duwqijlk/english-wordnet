simpleMeaning: A navy officer given an official rank above a captain and below a rear admiral, and the
  lowest rank of admiral
scope: This is the navy rank between captain and rear admiral, not a captain in charge of one ship and
  not the highest admiral.
examples:
- Commodore Lee was put in charge of a group of navy ships.
- The commodore gave orders to the captains who served under him.
