schema: oewn-learning-gloss-v2
senseId: 'intuit%2:31:00::'
synsetId: 00592156-v
simpleMeaning: to know or understand something by feeling, without thinking it through step by step
scope: This is knowing by feeling at once, not learning by careful thought and not knowing because someone
  told you.
examples:
- She intuited that something was wrong before anyone spoke.
- A good teacher can intuit when a child does not understand.
