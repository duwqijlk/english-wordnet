simpleMeaning: An animal whose food is mainly grass and other plants
scope: An animal that eats mainly plants, not an animal that eats mainly meat and not one that eats both
  plants and meat.
examples:
- Horses are herbivores, and they live mainly on grass.
- The big dinosaurs in the book were herbivores that ate leaves and other plants.
