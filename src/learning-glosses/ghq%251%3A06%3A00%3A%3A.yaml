simpleMeaning: The military headquarters where a commander runs and plans the work of the armed forces.
scope: Also called a command post and general headquarters; the military base where a commander runs and
  plans the forces, set beside a forward base and a single unit's base.
examples:
- Orders went out from GHQ to all the units in the field.
- The commander ran the whole campaign from GHQ.
