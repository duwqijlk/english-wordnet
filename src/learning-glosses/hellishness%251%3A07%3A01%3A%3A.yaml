simpleMeaning: 'It feels like a nightmare: a thing or time so bad that it is sad, hard, and frightening
  all at once'
scope: How bad, sad, hard or frightening something is, also called nightmarishness, not just a hard time
  and not a bad dream itself.
examples:
- The hellishness of the journey wore everyone down.
- After the flood, the hellishness of life in the camp was hard to bear.
