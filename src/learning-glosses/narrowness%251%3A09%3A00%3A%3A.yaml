simpleMeaning: A leaning towards finding fault with views one disagrees with, or with behaviour that shocks.
scope: Also called narrow-mindedness, a leaning towards finding fault with views one disagrees with or
  with behaviour that shocks, not the property of being narrow in width.
examples:
- His narrowness showed in every argument.
- Narrowness made her quick to condemn new ideas.
