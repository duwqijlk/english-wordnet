simpleMeaning: a large, strong tractor with a wide flat part at the front that pushes earth and makes
  ground flat
scope: 'Also called a dozer: a large, strong tractor that pushes earth flat, not a small farm tractor
  used only for pulling things.'
examples:
- The bulldozer pushed earth flat to make room for the new road.
- A bulldozer cleared the ground before building began.
