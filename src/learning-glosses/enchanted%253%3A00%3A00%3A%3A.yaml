simpleMeaning: changed or controlled in some way by magic, by spells or by words with magic power
scope: Under the power of magic through spells or magic words, not just very pleased or very happy about
  something.
examples:
- The enchanted prince had to live as a frog.
- They walked into an enchanted forest full of strange sounds.
