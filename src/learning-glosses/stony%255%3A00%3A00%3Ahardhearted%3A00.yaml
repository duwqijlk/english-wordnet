simpleMeaning: showing no soft or kind feelings and not willing to care about the feelings of others
scope: 'Also called flint: showing no soft or kind feelings for others, not ground that has many rocks
  or stones.'
examples:
- His stony face showed no care when she told him her sad news.
- She gave him a stony look and would not listen to his pain.
