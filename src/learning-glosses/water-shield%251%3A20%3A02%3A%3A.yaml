simpleMeaning: With floating oval leaves and purple flowers, this plant lives in lakes and slow-moving
  streams and does well in aquariums.
scope: Also called water-target, this plant with floating oval leaves and purple flowers lives in lakes
  and slow streams; not the eastern North American water-shield with white yellow-spotted flowers.
examples:
- Water-shield floated on the lake with purple flowers.
- She planted water-shield in the aquarium.
