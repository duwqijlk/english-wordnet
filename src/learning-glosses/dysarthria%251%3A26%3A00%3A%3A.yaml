simpleMeaning: A state in which a person cannot shape words well because the outer nerves that move the
  mouth or the speech muscles themselves are faulty.
scope: A person cannot shape words well because the outer nerves that move the mouth or the speech muscles
  are faulty, not because the person has lost the words themselves.
examples:
- Dysarthria made her words hard to follow.
- His dysarthria came from weak speech muscles.
