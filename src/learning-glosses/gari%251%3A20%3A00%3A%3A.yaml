simpleMeaning: Cassava with long thick roots people can eat and soft stems that break easily, used especially
  to make cassiri, a drink that makes people drunk, and tapioca
scope: Also called manioc, bitter cassava, mandioc, mandioca and tapioca plant, this is a cassava plant
  with long roots people can eat and soft stems that break easily, not the cassiri drink or the tapioca
  made from it.
examples:
- Farmers grew gari for its long roots.
- They used gari to make tapioca for the family meal.
