simpleMeaning: Said of a vowel or syllable that is pronounced without emphasis, so it does not stand out
  in the word.
scope: This is not about brightness, weight or food; it is a label for a vowel or syllable that carries
  little or no emphasis.
examples:
- The final syllable carries only light stress, so the word ends quietly.
- In 'banana', the first and last syllables get light stress and the middle one is strong.
