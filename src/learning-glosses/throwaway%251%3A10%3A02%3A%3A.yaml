simpleMeaning: words said in a light, easy way, with the speaker choosing to make them sound less important
  than they are
scope: This sense is words said lightly on purpose, not a printed advertisement and not a thing made to
  be used once and thrown away.
examples:
- His throwaway remark about quitting was said lightly, but it worried us.
- '''I could do that job,'' he added as a throwaway line, trying to sound like he did not care.'
