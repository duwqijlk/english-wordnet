senseId: 'blot_out%2:30:00::'
synsetId: 00314788-v
simpleMeaning: to make something impossible to read, see, or notice by covering it up or hiding it
scope: 'Also called hide, obscure, obliterate, and veil: to make a thing unreadable or unnoticeable by
  covering it, not to destroy it entirely, and not to make it merely faint.'
examples:
- The fog began to blot out the hills, and soon we could see nothing at all.
- The new building will blot out our view of the river.
