simpleMeaning: a strong feeling of anger that comes from thinking you have been treated in a wrong or
  unfair way
scope: 'Also called anger: a strong angry feeling about a wrong you think was done to you. Not the sense
  where this anger is named as one of the seven deadly sins.'
examples:
- His unfair dismissal filled him with ire.
- She could not hide her ire at the way she had been treated.
