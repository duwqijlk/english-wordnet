simpleMeaning: A court order sent after a claim is filed, telling all those concerned to say why the judgment
  asked for should not be given
scope: 'Process of monition is another name for this sense: a court order telling those concerned to say
  why a judgment should not be given, not a warning about coming danger.'
examples:
- The court sent a monition to all parties in the case.
- After the claim was filed, a monition went out to those concerned.
