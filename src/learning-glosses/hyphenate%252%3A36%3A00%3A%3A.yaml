senseId: 'hyphenate%2:36:00::'
synsetId: 01704185-v
simpleMeaning: To join words with a short line, or to split a word at the end of a line with one.
scope: To join or split words with a short line, also called hyphen; not to join words in any other way.
examples:
- Please hyphenate these words and names before you print the list.
- She hyphenated the long word at the end of the line.
