simpleMeaning: the act of making something harder to deal with or harder to understand
scope: The act of making a thing harder, not a new event that makes a situation harder, and not a hard
  state itself.
examples:
- The complication of the rules made the game hard to follow.
- Complicating the plan only slowed the work down.
