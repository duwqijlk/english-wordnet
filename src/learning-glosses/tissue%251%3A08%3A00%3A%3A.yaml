simpleMeaning: a part of a living thing made of cells (the small parts living things are made of) that
  are alike in build and do the same job
scope: This is a part of a living thing made of cells that do the same job, not soft paper for wiping
  your nose and not making cloth by crossing threads over and under each other.
examples:
- Muscle tissue helps the body move.
- The doctor took a small piece of tissue from the skin to test it.
