simpleMeaning: a worker who gets useful stuff out of loose sand and gravel by washing it or scooping it
  up
scope: A worker who gets useful stuff out of loose sand and gravel by washing or scooping, not a deep-mine
  worker and not a quarry worker.
examples:
- The placer miner washed sand in a pan to find gold.
- Placer miners scooped gravel from the river bed.
