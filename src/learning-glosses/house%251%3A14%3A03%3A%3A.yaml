simpleMeaning: All the people watching a performance or a film together in a theater or cinema.
scope: This is not the building where the performance takes place and not the performers on stage; it
  is only the spectators as a group.
examples:
- The house rose to applaud the young singer.
- A full house watched the final scene in silence.
