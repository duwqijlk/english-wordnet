simpleMeaning: Who made a car is shown by this figure on the front of the car
scope: A sign of the car maker on the front of a car, not a part of the engine and not a light or a mirror.
examples:
- The hood ornament on the old car was shaped like a bird.
- She polished the hood ornament until it shone.
