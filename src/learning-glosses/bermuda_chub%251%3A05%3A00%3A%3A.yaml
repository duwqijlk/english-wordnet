simpleMeaning: A fish people catch for food and for sport, found near a group of Atlantic islands and
  near Florida, that often swims after ships
scope: Also called a rudderfish or Kyphosus sectatrix, this is a fish caught for food and sport, not a
  fish of fresh water.
examples:
- They caught a Bermuda chub off the coast.
- The Bermuda chub often follows ships.
