simpleMeaning: Great arcs of pointed side teeth mark this wild pig that lives in Indonesia.
scope: This wild pig of Indonesia, known by its great curving teeth, is also called babiroussa and babirusa.
examples:
- A babirussa crossed our path, its teeth curving back.
- The babirussa's huge teeth bent up and back.
