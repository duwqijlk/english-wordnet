simpleMeaning: a thing said that leaves no kind or fitting thing to say back
scope: A remark that leaves no polite reply, also called a stopper; not a rude insult, and not a question
  that needs an answer.
examples:
- Her blunt comment about his job was a real conversation stopper.
- Saying 'I don't care' can be a conversation stopper at dinner.
