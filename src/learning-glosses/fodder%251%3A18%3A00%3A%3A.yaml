simpleMeaning: soldiers treated as easy to lose under heavy fire from big guns
scope: Soldiers treated as easy to lose under heavy fire from big guns; not coarse food for farm animals,
  and not the act of feeding animals.
examples:
- The general treated his men as fodder, sending them into heavy fire.
- Young soldiers became fodder in the first days of the battle.
