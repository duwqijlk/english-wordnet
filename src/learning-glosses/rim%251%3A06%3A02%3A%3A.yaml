simpleMeaning: The ring around the outside of a wheel; the tire is fixed to this ring
scope: The outer part of a wheel that holds the tire, not a part that sticks out to make something strong,
  and not the hoop in basketball.
examples:
- He bent the rim of the bicycle wheel when he hit the stone.
- The new tire was put onto the metal rim.
