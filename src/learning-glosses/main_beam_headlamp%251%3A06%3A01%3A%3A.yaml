simpleMeaning: A car lamp giving bright, middle-weighted light, with no check on light reaching other
  road users' eyes, fit only for lone driving, as its glare blinds other drivers.
scope: This sense is also called driving beam headlamp, full beam headlamp and high beam headlamp, for
  a car lamp giving bright, middle-weighted light, with no check on light reaching other road users' eyes,
  fit only for lone driving, as its glare blinds other drivers.
examples:
- Main beam headlamps dazzle oncoming drivers.
- The main beam headlamp lit the lone road.
