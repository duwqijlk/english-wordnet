simpleMeaning: a word or group of words with no meaning of its own, added to make a sentence longer or
  a line of a poem follow a set beat
scope: This is a word added only to fill a sentence or a line of a poem, not a rude or angry word used
  to swear.
examples:
- In this sentence, the word is an expletive added only to fill the line.
- The poet used an expletive to make the line of the poem complete.
