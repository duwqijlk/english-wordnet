simpleMeaning: like a pig, rough and greedy, taking and eating far more than is needed
scope: 'Also called piggy, piggish, hoggish, or swinish: it calls a person or their ways rough and greedy
  like a pig, not a real pig on a farm.'
examples:
- His porcine table manners made the others stare as he grabbed food with both hands.
- The porcine father ate far more than he needed and took food from his son's plate.
