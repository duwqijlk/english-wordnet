simpleMeaning: a sickness in the body that often lasts a long time and gives a reason to say you are unhappy
scope: 'Also called ill: a sickness in the body, not words that say you are unhappy with something and
  not a paper in a law case.'
examples:
- She went to the doctor with a stomach complaint that had lasted for months.
- His main complaint was a bad back that never got better.
