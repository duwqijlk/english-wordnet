simpleMeaning: A common plant of North America that lives for years, with leaves like a low shrub and
  small white flower heads.
scope: A common North American plant that lives for years, with leaves like a low shrub and small white
  flower heads; not the much-branched kind with starry white flowers.
examples:
- Heath aster grows along the roadside in late summer.
- The heath aster has small white flower heads and leaves like a low shrub.
