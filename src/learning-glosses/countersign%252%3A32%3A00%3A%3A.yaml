synsetId: 00999477-v
simpleMeaning: To sign a paper after someone else has signed it, so as to show that it is real and true.
scope: To sign a paper after someone else has signed it, not the second signature itself on a paper already
  signed.
examples:
- You must countersign on this line of the contract.
- The manager countersigned the form after the clerk.
