simpleMeaning: the alleles, the forms of a gene, that are set at fixed places in a living thing
scope: 'Also called a genotype: the set of gene forms at fixed places in a living thing, not the set of
  traits the living thing shows.'
examples:
- Scientists mapped his genetic constitution from a blood sample.
- The genetic constitution of the plant was set at birth.
