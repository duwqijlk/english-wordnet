simpleMeaning: A slow-growing tree of middle size on the east coast of the United States, like the American
  arborvitae
scope: A slow-growing tree of middle size on the east coast; coast white cedar, white cedar and white
  cypress are other names for it, not a fast-growing pine and not a western tree.
examples:
- A southern white cedar grows slowly on the east coast.
- The southern white cedar looks like the American arborvitae.
