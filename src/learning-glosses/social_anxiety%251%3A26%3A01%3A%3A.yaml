simpleMeaning: a bad uneasy feeling or fear when with other people, from worry about being judged by them
scope: A bad uneasy feeling or fear around other people, from worry about being judged; not the stronger
  fear called a phobia, and not a fear of open places.
examples:
- Her social anxiety made parties hard for her.
- His social anxiety grew when he had to speak to strangers.
