simpleMeaning: A common nonmetal, normally a colourless, odourless, tasteless, inert gas of two atoms;
  it makes up nearly four-fifths of the air by volume and is found in all living tissues.
scope: 'Also called N and nitrogen: a common nonmetal gas of two atoms, not a metal and not a gas with
  a smell.'
examples:
- Atomic number 7 makes up most of the air we breathe.
- Nitrogen, atomic number 7, is found in all living things.
