simpleMeaning: a sea reptile from the Mesozoic, the age of dinosaurs, with a body shaped like a porpoise
  and fins on its back and tail and limbs shaped like paddles
scope: A sea reptile of a past age, not a dolphin or a whale, which look much the same but are mammals,
  and not a fish.
examples:
- The museum shows a full ichthyosaur skeleton found in an old sea bed.
- Ichthyosaurs hunted fish in warm seas millions of years ago.
