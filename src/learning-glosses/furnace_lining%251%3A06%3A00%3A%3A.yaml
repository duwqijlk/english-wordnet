simpleMeaning: A coat inside the walls of a hot oven, made of stuff that melts only at very high heat.
scope: This is a coat inside the walls of a hot oven, also called a refractory; not the outer wall of
  the oven, and not the fuel that heats it.
examples:
- The furnace lining must stand heat that would melt most stone.
- Workers put a new furnace lining inside the old oven.
