simpleMeaning: a small fish of the salmon kind from the north Pacific coasts and the Great Lakes
scope: 'Also called coho, coho salmon, and cohoe: a small salmon from the north Pacific coasts and the
  Great Lakes, not a large salmon and not a trout.'
examples:
- Fishermen caught a blue jack off the northern Pacific coast.
- A blue jack is a small salmon found in the Great Lakes.
