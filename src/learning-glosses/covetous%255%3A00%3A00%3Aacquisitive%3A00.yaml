simpleMeaning: wanting far too much to get things, such as wealth
scope: 'Also called greedy, grasping, prehensile, grabby, and avaricious: wanting too much to get things
  such as wealth. It is not the sense about wanting what another person has.'
examples:
- The covetous king kept taking more land and gold for himself.
- Covetous buyers tried to buy every house in town, hoping to grow rich.
