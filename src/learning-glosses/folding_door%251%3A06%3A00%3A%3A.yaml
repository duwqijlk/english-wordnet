simpleMeaning: An inside way through a wall that opens by bending back in parts, not by turning on hinges.
scope: This is an inside way through a wall that opens by bending back in parts, not a door that turns
  on hinges, and it is also called an accordion door.
examples:
- The folding door opened onto the hall.
- She pushed the folding door back in sections.
