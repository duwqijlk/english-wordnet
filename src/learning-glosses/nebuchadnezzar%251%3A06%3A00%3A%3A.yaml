simpleMeaning: Used most of all for show, this very big wine bottle holds as much as 20 normal wine bottles
scope: A very big wine bottle, holding as much as 20 normal bottles, kept for show, not an everyday bottle
  and not a small bottle for the table.
examples:
- The restaurant put a nebuchadnezzar of champagne in the window for show.
- A nebuchadnezzar stood on the shelf, far too big to pour from at dinner.
