simpleMeaning: in a way that seems as if the mind is ill and confused and cannot think clearly
scope: It describes talking or acting as if the mind were ill and confused. The nearest rival is the other
  sense of this word for a person who truly is in that state.
examples:
- The children ran deliriously around the garden, shouting and laughing as if they could not think clearly,
  though they were perfectly well.
- When she heard the good news, she talked deliriously for a minute, as if her mind were confused, but
  she was not ill at all.
