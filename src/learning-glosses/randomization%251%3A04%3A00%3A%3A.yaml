senseId: 'randomization%1:04:00::'
synsetId: 01010943-n
simpleMeaning: setting out what was seen in a mixed-up order on purpose, so the order acts as if it were
  left to chance
scope: 'Also called randomisation: a set order made on purpose with no pattern, not a true chance event
  and not choosing members of a group by chance.'
examples:
- The study used randomization to mix up the order of the tasks.
- With randomization, the list was put in a new order that had no plan behind it.
