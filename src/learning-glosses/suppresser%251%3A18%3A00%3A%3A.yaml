senseId: 'suppresser%1:18:00::'
synsetId: 10697911-n
simpleMeaning: A person who stops something from happening or being said
scope: A person who stops free speech or action; suppressor is another name for this sense, not a gene
  that hides another gene's effect and not a device that blocks electric currents.
examples:
- The new rulers acted as suppressers of free speech.
- Suppressers of the protest broke up the march.
