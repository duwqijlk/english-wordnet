simpleMeaning: This part in radios and TV sets has three wire ends and slows the flow of power, and its
  middle end slides to change the electric push.
scope: Also called pot, this part in radios and TV sets changes the electric push with its middle end.
examples:
- She turned the potentiometer.
- He turned the potentiometer in the radio.
