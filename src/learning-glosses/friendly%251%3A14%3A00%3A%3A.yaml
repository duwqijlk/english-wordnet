simpleMeaning: soldiers who belong to your own army or to an army that fights on your side
scope: These are soldiers on your own side in a war, not enemy soldiers, and not the common use of the
  word to mean kind and ready to help.
examples:
- The friendlies arrived in trucks to help the trapped soldiers.
- A group of friendlies held the bridge until morning.
