simpleMeaning: In phonetics, any speech sound made with the tongue near or touching the back of the ridge
  behind the upper teeth
scope: In phonetics, any speech sound made with the tongue near or touching the back of the ridge behind
  the upper teeth; post-alveolar consonant, postalveolar and postalveolar consonant are other names for
  this sense, not a sound made with the lips and not a sound made at the front of the teeth.
examples:
- The 'sh' sound is post-alveolar.
- Post-alveolar sounds use the tongue near the ridge.
