simpleMeaning: not in good shape, not strong, and not able to work hard or keep going for long
scope: 'Also called soft and flaccid: a body that is not in good shape and not strong; not just about
  soft, loose flesh, and not about a weak argument.'
examples:
- After months without exercise, he felt flabby and soon got tired.
- The flabby new soldiers could not keep up on the long run.
