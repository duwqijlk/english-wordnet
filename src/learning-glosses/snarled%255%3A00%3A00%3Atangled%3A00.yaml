simpleMeaning: Twisted and caught together in knots, so the threads cross and hold each other fast
scope: Twisted string or thread tied in knots, not a single knot and not a tangle of hair.
examples:
- The snarled thread would not come free from the spool.
- She pulled at the snarled string until the knots loosened.
