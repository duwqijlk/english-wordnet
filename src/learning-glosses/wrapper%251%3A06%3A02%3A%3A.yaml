simpleMeaning: A sheet, usually paper or clear film, folded round a thing so it is not bare
scope: The cover put round a thing, also called wrap and wrapping, not a cloak and not a dressing gown.
examples:
- He tore off the wrapper and ate the sweet.
- The wrapper kept the book clean on the shelf.
