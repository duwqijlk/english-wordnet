simpleMeaning: in accounting, a check that is less thorough than an audit and gives people with an interest
  some assurance that financial information is reliable.
scope: This is a limited accounting check on financial information, not a court's reexamination of legal
  proceedings, not a formal official inspection, not a fresh appraisal or evaluation, not a critical essay
  or article, not a periodical of criticism, not a summary of a longer discussion, not a follow-up medical
  examination, not a show with songs and sketches, and not practice meant to refresh the memory.
examples:
- The bank asked for an independent review of the company's accounts before approving the loan.
- A review gives lenders some assurance that the figures are reliable, though it is not a full audit.
