simpleMeaning: to give the fine points of what you mean, saying it clearly
scope: To give the fine points of what you mean, also called specify; not to fit a thing for one set job
  and not to work in one field.
examples:
- Could you please specialize your criticism of my paper?
- She specialized her request so we knew just what she wanted.
