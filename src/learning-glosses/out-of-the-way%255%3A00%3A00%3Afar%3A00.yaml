simpleMeaning: Roads that get a lot of use and towns full of people are far from this place
scope: A place far from towns and busy roads, also called off the beaten track and out of the way; not
  a busy town centre and not a place on a main road.
examples:
- They found a quiet out-of-the-way resort.
- The cottage stood in an out-of-the-way corner of the valley.
