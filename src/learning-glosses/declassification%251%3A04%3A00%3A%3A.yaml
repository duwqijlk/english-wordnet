simpleMeaning: The act of the government taking away or cutting back the limits on a secret paper or weapon.
scope: This is the government taking away or cutting back limits on a secret paper or weapon, not the
  act of hiding a paper or the act of making a new weapon.
examples:
- Declassification meant the old papers could at last be read.
- The government ordered the declassification of the secret files.
