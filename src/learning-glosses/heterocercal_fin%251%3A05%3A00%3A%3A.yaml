simpleMeaning: The backbone bends up into the bigger part of this tail fin, whose two parts are not the
  same size, as in sharks.
scope: This is a shark's tail fin with unequal parts, the backbone bending up into the bigger part, not
  a fin with two equal parts.
examples:
- The heterocercal fin of the shark has unequal lobes.
- In the heterocercal fin, the backbone turns upward into the larger lobe.
