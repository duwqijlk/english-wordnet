simpleMeaning: Standard time six hours behind Greenwich time, counted from the 90th line of longitude,
  used in the middle part of the United States
scope: 'Also called Central Standard Time and Central Time: the standard time of the middle part of the
  United States, not the time of the east coast and not the time of the west coast.'
examples:
- Our flight lands at noon CST.
- CST is six hours behind Greenwich time.
