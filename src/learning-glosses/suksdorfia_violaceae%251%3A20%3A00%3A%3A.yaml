simpleMeaning: A thin, delicate plant with wide roundish leaves cut deep and deep pink to violet tube-shaped
  flowers, from British Columbia to northern Oregon and west to Idaho and Montana.
scope: Also called violet suksdorfia; a thin plant with tube-shaped pink to violet flowers, not a tall
  shrub and not a garden flower with plain round leaves.
examples:
- Suksdorfia violaceae grows from British Columbia to northern Oregon.
- The deep pink flowers of Suksdorfia violaceae open in late spring.
