simpleMeaning: A random scattering of things in every direction.
scope: This is the scattered arrangement of things, not the act of something widening or extending, not
  the overall process or result of distributing things across a wide area, and not weight gained around
  a person's middle.
examples:
- From the plane we saw a wide spread of small farms across the plain.
- The map showed a spread of villages along the coast.
