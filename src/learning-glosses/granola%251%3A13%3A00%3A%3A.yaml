simpleMeaning: a cereal food made mainly of rolled oats, with dried fruit, nuts, and honey or brown sugar
scope: This is the loose oat cereal mixture; it is not plain rolled oats on their own, and not dried fruit
  and nuts without oats.
examples:
- She ate granola with milk for breakfast.
- He mixed nuts and honey into the granola.
