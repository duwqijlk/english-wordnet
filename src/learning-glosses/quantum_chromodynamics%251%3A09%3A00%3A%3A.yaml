simpleMeaning: 'The theory of the force that binds particles inside atomic nuclei: particles such as protons
  and neutrons are made of quarks, tiny building blocks that gluons hold together.'
scope: This is the theory of the force that holds nuclei together, not a theory of gravity or of electric
  and magnetic forces.
examples:
- Quantum chromodynamics explains how quarks stay bound inside protons.
- She studied quantum chromodynamics to understand the force that holds atomic nuclei together.
