simpleMeaning: A pump worked by hand that looks like a pistol, used to push thick oil into machine parts
scope: This is a pump worked by hand that looks like a pistol; gun is another name for it, not a pump
  for water and not a weapon that fires.
examples:
- He used a grease gun on the tractor.
- The grease gun pushed oil into the old joints.
