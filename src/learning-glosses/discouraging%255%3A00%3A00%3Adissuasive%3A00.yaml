senseId: discouraging%5:00:00:dissuasive:00
synsetId: 01775905-s
simpleMeaning: showing that you do not like something, in order to make someone not do it
scope: This sense shows you do not like something, in order to persuade someone not to do it. It is not
  the other sense of the same word, which takes away a person's hope, confidence or wish to go on.
examples:
- She gave him a discouraging look when he reached for a third cake.
- His discouraging words about smoking were meant to make his son give it up.
