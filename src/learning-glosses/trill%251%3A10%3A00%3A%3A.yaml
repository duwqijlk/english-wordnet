senseId: 'trill%1:10:00::'
synsetId: 06873227-n
simpleMeaning: In music, one note that keeps switching quickly back and forth with the note a half step
  above it
scope: 'Also called a shake: a musical note that wavers quickly with the note just above it, not the sound
  of a rolled r in speech and not the act of singing or playing such notes.'
examples:
- The singer held a long trill at the end of the song.
- The flute played a trill that rose and fell in quick turns.
