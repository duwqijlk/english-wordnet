simpleMeaning: a white water flower of Egypt and southeast Africa, held holy by the Egyptians
scope: A white water flower of Egypt and southeast Africa, held holy by the Egyptians; not the pink or
  white flower of eastern Asia, which is another sense of lotus.
examples:
- The lotus floated on the still water of the Nile.
- Egyptians carved the lotus on temple walls.
