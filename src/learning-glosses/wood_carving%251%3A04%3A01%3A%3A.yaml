simpleMeaning: Shaping wood with a knife in one hand, or a chisel held in both hands or hit with a mallet,
  to make a figure or decorate a wooden object.
scope: The activity of shaping or decorating wood with hand tools. It is not a finished carved object,
  and not wood engraving, which makes prints from a block.
examples:
- He learned wood carving from his grandfather, starting with simple spoons.
- The museum runs a wood carving class every Saturday.
