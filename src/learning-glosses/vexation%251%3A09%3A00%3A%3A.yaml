simpleMeaning: a person or thing that makes you feel worried and is a cause of unhappiness
scope: 'Also called worry, concern and headache: this is a person or thing that makes you worried and
  unhappy. It is not the anger itself, and not the state of feeling annoyed.'
examples:
- The broken lift was a constant vexation for everyone in the building.
- Traffic is a daily vexation for drivers in the city.
