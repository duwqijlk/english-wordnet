simpleMeaning: A thin spread of matter taken from the stomach, from the food tube that runs through the
  body.
scope: This is a thin spread of matter taken from the stomach, not a thin spread of blood and not a cut
  piece of stomach wall.
examples:
- The lab made a gastric smear from the stomach sample.
- A gastric smear showed the cells clearly.
