simpleMeaning: a person who demands that others follow rules and set forms exactly
scope: A person who demands that others follow rules and set forms exactly; it names the person, not the
  act of keeping order itself.
examples:
- Our new head teacher is a strict disciplinarian who checks every uniform.
- As a coach, he was a disciplinarian and made the team arrive on time every day.
