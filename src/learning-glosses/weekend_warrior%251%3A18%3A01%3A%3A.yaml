simpleMeaning: A homeowner takes the builder's own role on days off, trying big repair jobs without often
  knowing how much work is in them.
scope: This is the homeowner who does the builder's job on days off, not one who hires a builder to do
  it.
examples:
- The weekend warrior spent Saturday fixing the roof.
- The weekend warrior neighbour tried to build a new room.
