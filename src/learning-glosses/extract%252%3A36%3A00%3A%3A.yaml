simpleMeaning: to work out a rule or a meaning from facts or from what someone says or writes
scope: 'Also called evoke: this means working out a rule or meaning, not getting something out of a substance
  by pressing, and not the liquid made by soaking.'
examples:
- 'From his words, we extracted a clear meaning: he wanted to leave.'
- Scholars try to extract a general rule from these old texts.
