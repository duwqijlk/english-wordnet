simpleMeaning: Small birds of the Old World tropics, with bright feathers and short, wide bills.
scope: Small birds of the Old World tropics, with bright feathers and short, wide bills; not diving ducks
  of North America with a blue-grey bill, nor a fresh-water duck of the north half of the world with a
  broad, flat bill, nor a warm-land American heron kin to night herons.
examples:
- Their broadbill sang at dawn.
- The broadbill was seen at noon.
