simpleMeaning: A big rodent that digs burrows and comes out at night, living in the high lands of the
  Pacific coast of North America, the oldest kind of rodent still alive.
scope: 'Also called sewellel: a big burrowing rodent of the high lands of the Pacific coast of North America.'
examples:
- The mountain beaver dug a burrow in the hillside.
- We saw a mountain beaver at night near its burrow.
