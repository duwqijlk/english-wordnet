simpleMeaning: In horseshoes, a good throw, when a horseshoe or a flat round piece (a quoit) lands around
  a stake or peg
scope: A good throw in horseshoes, not a person who rings church bells and not a person who enters a contest
  by lying about who they are.
examples:
- In their game of horseshoes, he threw a ringer that landed around the stake.
- Her last throw was a ringer in their horseshoes game.
