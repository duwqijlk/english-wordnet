simpleMeaning: A brain swelling that spread widely between 1915 and 1926, leaving some people unable to
  move the muscles that move their eyes and very weak in their muscles.
scope: Also called encephalitis lethargica, lethargic encephalitis, sleeping sickness and sleepy sickness,
  this is the brain swelling that spread in 1915 to 1926, not a swelling of the brain lining and not a
  sleep problem.
examples:
- Epidemic encephalitis spread widely between 1915 and 1926.
- Many victims of epidemic encephalitis were left very weak in their muscles.
