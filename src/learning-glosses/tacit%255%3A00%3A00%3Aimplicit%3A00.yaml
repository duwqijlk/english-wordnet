simpleMeaning: not said openly, but understood from what a person does or says
scope: 'Also called silent, and also called understood: it is not said openly, but people get it from
  what someone does or says; it is not said clearly in words.'
examples:
- They had a tacit agreement not to talk about money.
- Her smile was a tacit sign that she agreed.
