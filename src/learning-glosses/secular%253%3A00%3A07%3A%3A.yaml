simpleMeaning: of or given to life in this world, with its goods and work, not to the life of the spirit
scope: 'Also called worldly and temporal: about life in this world, not about church leaders without monastery
  promises and not about turning away from religion.'
examples:
- His secular interests were money, land and power.
- The book is about secular life in the city, not about prayer.
