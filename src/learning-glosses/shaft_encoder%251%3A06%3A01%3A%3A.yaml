simpleMeaning: A code of numbers or waves comes from a machine worked by power and moving parts, which
  reads how far a rod or axle has turned.
scope: Also called a rotary encoder, it is a machine that reads the turn of a rod and gives it back as
  a code.
examples:
- The shaft encoder read how far the axle had turned.
- A shaft encoder on the rod turned its movement into a code of waves.
