simpleMeaning: In music, a thin plate that shakes and makes the notes of an instrument stronger
scope: In music, a thin plate that shakes and makes the notes of an instrument stronger; also called soundboard;
  not the wooden case of the instrument, and not a person asked for advice.
examples:
- The sounding board of the piano makes its notes ring out.
- A crack in the sounding board dulled the guitar's tone.
