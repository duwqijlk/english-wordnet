simpleMeaning: The spleen gets its blood from this tube, which starts at the main belly tube.
scope: Also called lienal artery and splenic artery, this tube leaves the main belly tube for the spleen.
examples:
- The arteria lienalis carries blood from the belly to the spleen.
- Blood from the belly reached the spleen through the arteria lienalis.
