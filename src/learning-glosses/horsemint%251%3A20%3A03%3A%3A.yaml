simpleMeaning: A plant that lives for one year, growing in the middle and west of the United States and
  the north of Mexico
scope: A one-year plant of the middle and west of the United States and northern Mexico, not the Old World
  water mint of the eastern United States, and not the tall perennial of the south-west.
examples:
- Horsemint grew thick along the dry creek bed.
- The horsemint in the field blooms in late summer.
