simpleMeaning: a worker who pulls wool fibres apart to get them ready for use
scope: A worker who gets wool ready by pulling its fibres apart, not a person who makes jokes at others
  or tries to make them curious.
examples:
- The teaser worked at the mill, pulling wool fibres apart all day.
- As a teaser, she got wool ready before it was made into cloth.
