simpleMeaning: A way of swimming where the arms go out together in front of the head and move back at
  both sides, while the legs kick like a frog
scope: This is the name of a way of swimming with both arms moving together and a frog-like leg kick.
  It is not the act of swimming in this way, and not other ways such as swimming on your back.
examples:
- She won the race doing breaststroke.
- He learned breaststroke by moving his arms together and kicking like a frog.
