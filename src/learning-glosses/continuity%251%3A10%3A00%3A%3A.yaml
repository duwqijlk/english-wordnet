senseId: 'continuity%1:10:00::'
synsetId: 07023509-n
simpleMeaning: The full written work for a film, giving each shot in detail so that no break shows between
  one shot and the next
scope: This is the detailed film script sense; not the sense of a time that goes on without a break.
examples:
- She read the continuity again before filming, to check that the cup stayed in the same hand from shot
  to shot.
- The continuity listed each shot in detail, so nothing changed by mistake between one shot and the next.
