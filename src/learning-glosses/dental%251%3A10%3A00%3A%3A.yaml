simpleMeaning: a speech sound that is not a vowel, made by putting the tongue against the upper teeth
scope: This is the name for a speech sound made with the tongue against the upper teeth; not the word
  for things to do with teeth or tooth care.
examples:
- The sound at the start of 'thin' is a dental.
- She learned that the 'th' sound in English is a dental.
