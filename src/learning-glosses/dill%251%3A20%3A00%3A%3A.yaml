simpleMeaning: a plant from Europe, Asia and Africa, with a strong smell, thin leaves like thread, and
  seeds used to add taste to food
scope: This is the whole plant, not just its thin leaves used on their own to add taste to food, and not
  another green herb like parsley.
examples:
- She grew dill in a pot by the kitchen window.
- Fresh dill grows fast in warm weather by the garden wall.
