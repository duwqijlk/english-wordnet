simpleMeaning: the outer cover that guards the front, back, and spine of a book
scope: The outer cover guarding the front, back, and spine of a book, also called back and cover; not
  a ski clip, and not a strip sewn along an edge.
examples:
- The book's binding was torn at the spine.
- A leather binding covered the old book.
