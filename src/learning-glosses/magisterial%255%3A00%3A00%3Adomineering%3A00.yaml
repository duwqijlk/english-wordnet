senseId: magisterial%5:00:00:domineering:00
synsetId: 00791150-s
simpleMeaning: Acting as if sure of oneself in a way that offends, and usually using power one has no
  right to use.
scope: Also called bossy, autocratic, dominating, or peremptory; sure of oneself in an offending way,
  and given to using power without right, not a manner that befits a great person, and not to do with
  a magistrate.
examples:
- His magisterial tone shut down all debate.
- She gave the order in a magisterial way that brooked no reply.
