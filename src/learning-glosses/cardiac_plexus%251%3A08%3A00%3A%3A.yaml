simpleMeaning: A net of nerve threads that send signals to the heart and the parts near it.
scope: A net of nerve threads that send signals to the heart and the parts near it; plexus cardiacus is
  another name for this sense, not a single nerve and not the heart muscle.
examples:
- The cardiac plexus sends signals to the heart.
- Nerves of the cardiac plexus reach the parts near the heart.
