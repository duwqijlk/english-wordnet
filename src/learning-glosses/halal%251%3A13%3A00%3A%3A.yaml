simpleMeaning: In Islam, meat from animals killed in the set way that follows shariah, the rules of Islam
scope: This is the meat itself, killed in the set way; it is not the adjective sense that describes food
  as following Muslim rules about what may be eaten.
examples:
- He bought halal from the butcher for the family dinner.
- The shop keeps its halal in a separate cold room from the other meat.
