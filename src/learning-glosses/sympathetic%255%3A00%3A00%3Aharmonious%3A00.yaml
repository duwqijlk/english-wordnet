synsetId: 01167133-s
simpleMeaning: about shaking movements in one thing that start because a nearby thing is shaking
scope: About shaking in one thing caused by shaking in a nearby thing; not about feeling care for a person,
  and not about a character in a story or play.
examples:
- The sympathetic vibration of the second string began when the first string was played.
- A sympathetic vibration in the glass started when the singer held the high note nearby.
