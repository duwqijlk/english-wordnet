simpleMeaning: full of refusal, opposition, or resistance, and having nothing good or hopeful about it.
scope: This describes an attitude, reaction, or state full of opposition with nothing positive in it;
  it is not a word or answer that says no.
examples:
- He has a very negative attitude towards new ideas.
- The film received negative reviews from the critics.
