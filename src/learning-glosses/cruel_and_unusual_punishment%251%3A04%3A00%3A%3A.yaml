schema: oewn-learning-gloss-v2
senseId: 'cruel_and_unusual_punishment%1:04:00::'
synsetId: 01163898-n
simpleMeaning: a penalty banned by the Eighth Amendment to the US Constitution, such as torture, humiliation
  or a sentence far harsher than the crime deserves
scope: The category of penalties barred by the Eighth Amendment, covering torture, humiliation and grossly
  excessive sentences; not one named punishment such as flogging, and not every harsh sentence.
examples:
- The court found that the sentence was cruel and unusual punishment.
- Cruel and unusual punishment is banned by the Eighth Amendment.
