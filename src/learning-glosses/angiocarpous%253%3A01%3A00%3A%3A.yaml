simpleMeaning: a fruit that stays hidden inside a case or an outer coat
scope: 'Another name for angiocarpic: a fruit with a case or coat round it, not a fruit that bursts open
  to free its seeds.'
examples:
- The hazelnut is angiocarpous, kept inside its hard case.
- They gathered the angiocarpous nuts while the fruit was still shut inside its case.
