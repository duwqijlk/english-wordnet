simpleMeaning: the stiff tissue that joins and supports the body, forming the skeleton of animals with
  a spinal column
scope: The body tissue itself, not the porous material it is built from or the pale colour sense.
examples:
- The X-ray showed a fine crack in the bone just above her ankle.
- Healthy bone is constantly being broken down and rebuilt.
