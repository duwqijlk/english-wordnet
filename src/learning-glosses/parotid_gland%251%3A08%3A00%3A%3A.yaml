simpleMeaning: In front of and below each ear, in people, sits a large gland that makes spit, half of
  all the spit made in the daytime.
scope: This is the gland in front of and below each ear that makes half of all the spit made in the daytime.
examples:
- Spit came from the parotid gland in front of the ear.
- Half of the spit made in the daytime comes from the parotid gland.
