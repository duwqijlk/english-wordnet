simpleMeaning: The quality of matching a standard of beauty, and of what is correct or proper
scope: 'Also called rightness: this is about following a standard of right, beautiful or proper form,
  not just being pleasant or polite in a general way.'
examples:
- The dance was done with great nicety, each step right and beautiful.
- He wrote the poem with nicety, choosing words that were correct and proper in form.
