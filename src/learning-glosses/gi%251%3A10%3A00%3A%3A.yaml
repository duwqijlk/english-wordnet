simpleMeaning: In law, a name or sign on some goods that points to the place they come from
scope: 'Also called geographical indication: in law, a name or sign tied to a place of origin, not a brand
  name and not a place name on its own.'
examples:
- Champagne is a GI that points to a region of France.
- The cheese carries a GI showing where it was made.
