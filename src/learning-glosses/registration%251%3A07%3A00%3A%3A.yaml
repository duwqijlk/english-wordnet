simpleMeaning: In music, the sound made by the organ knobs chosen for a piece, and the skill of choosing
  and setting them
scope: In music, the sound of the organ knobs chosen for a piece and the skill of choosing them, not a
  paper that shows a thing is listed and not a group of people who sign up together.
examples:
- The organist changed the registration for the soft passage.
- Her registration gave the hymn a full, warm sound.
