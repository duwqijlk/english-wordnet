simpleMeaning: Sense messages from the sense organs travel in toward the brain and spinal cord along nerves
  and their signals.
scope: This describes nerves and signals that carry sense messages inward, not nerves that carry orders
  outward from the brain.
examples:
- The afferent nerves carried the touch signal to the brain.
- Afferent impulses from the skin reached the spinal cord.
