simpleMeaning: Over the cup that holds the flower of some plants, such as the California poppy, sits a
  cover like a hood or a cap.
scope: This hood-like cover sits over the cup that holds a flower, not the flower itself.
examples:
- The calyptra covered the flower like a small hood.
- The calyptra of the California poppy covers the cup that holds the flower.
