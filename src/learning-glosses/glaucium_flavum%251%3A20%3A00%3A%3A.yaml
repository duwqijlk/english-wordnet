simpleMeaning: A yellow-flowered plant from Europe and Asia, with a grey-green waxy coat, now growing
  wild along sandy shores in the east of North America.
scope: Also called horn poppy, horned poppy, sea poppy or yellow horned poppy; a yellow-flowered plant
  with a grey-green waxy coat that grows wild along sandy shores in the east of North America.
examples:
- Glaucium flavum grew along the sandy shore, its yellow flowers open.
- We saw Glaucium flavum on the sandy shore in the east.
