simpleMeaning: a device that makes repeated movements smaller, and also makes sound waves, electric signals
  or movements of air weaker
scope: Also called muffler. This is a device that cuts down movement or waves, not the iron plate that
  controls the flow of air in a stove or chimney.
examples:
- A damper in the system made the shaking of the machine much smaller.
- The engineer fitted a damper to make the loud sound waves weaker.
