simpleMeaning: with the work of the organ that thinks gone for good, shown by a line that stays flat on
  a test of its activity
scope: A person whose thinking organ has stopped working for good, not a person in a deep sleep and not
  a person who has lost feeling in one part of the body.
examples:
- The doctors said he was brain dead after the accident.
- She was declared brain dead in the hospital.
