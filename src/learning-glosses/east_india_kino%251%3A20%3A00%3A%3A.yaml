simpleMeaning: A reddish or black juice or resin from some trees of the genus Pterocarpus, used in medicine,
  in tanning and in other ways.
scope: A dark juice from Pterocarpus trees used in medicine and tanning, also called kino gum and Malabar
  kino; not a fruit juice and not a sap used only as food.
examples:
- East India kino was used to tan leather.
- The East India kino came from trees of the genus Pterocarpus.
