simpleMeaning: any of several kinds of earth that have silica, alumina and ferric oxide in them, used
  to give colour
scope: This is earth used to give colour, also called ocher, not just the yellow-orange to orange colour
  itself.
examples:
- People long ago painted on rock with red ochre.
- The artist mixed ochre with water to make a yellow-brown paint.
