simpleMeaning: The way of thought of Albertus Magnus, a German school thinker who lived from 1193 to 1280.
scope: A way of thought tied to Albertus Magnus alone, set apart from other school ways of thought of
  the same age by its teacher and its time.
examples:
- Albertism was one of the schools of thought in the Middle Ages.
- Students read about Albertism beside Thomism and Scotism.
