senseId: 'anathematise%2:32:00::'
synsetId: 00866574-v
simpleMeaning: In the church, to speak against a person or thing as evil and call for God's punishment
  on it.
scope: This church curse is also called accurse, execrate, anathematize, anathemise, anathemize, and comminate.
examples:
- The bishop anathematised the man before the whole church.
- A priest may anathematise a person who breaks the rules of the church.
