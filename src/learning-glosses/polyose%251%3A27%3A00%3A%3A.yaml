simpleMeaning: Any of a group of carbohydrates, food stuffs whose tiny parts are long chains of single
  sugar units
scope: Any of a group of food stuffs whose tiny parts are long chains of single sugar units; polysaccharide
  is another name for this sense, not a single sugar unit and not a fat or a protein.
examples:
- Starch is a polyose found in bread.
- The polyose broke down into single sugar units.
