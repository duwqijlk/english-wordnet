simpleMeaning: Built on the meter, the kilogram and the second, this is a way of weighing and measuring
  in tens
scope: A set of units that counts in tens, not the old imperial units and not a single unit on its own.
examples:
- The country changed to the metric system in the 1970s.
- Lengths in the metric system are given in metres and centimetres.
