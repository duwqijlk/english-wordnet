simpleMeaning: so clear and fresh that it feels as if it is happening now, not as a past thing
scope: This is about a memory or feeling that seems clear and happening now; it is not about a bright,
  strong colour and not about a story told in a lively way.
examples:
- She has a vivid memory of her first day at school.
- His vivid recollection of the accident made it hard to sleep.
