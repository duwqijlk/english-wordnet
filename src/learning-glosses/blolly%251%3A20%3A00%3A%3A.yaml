simpleMeaning: 'A climbing evergreen shrub of southern Florida and the West Indies, grown for its scent
  and fruit: white or cream flowers in long clusters, then round, juicy white berries.'
scope: The climbing shrub itself, not its fragrant flowers or white berries alone.
examples:
- Blolly climbs over fences in southern Florida, covered in fragrant white flowers.
- Gardeners grow blolly for its fragrant flowers and its round white berries.
