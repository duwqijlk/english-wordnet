simpleMeaning: A tiny chip of silicon with electric circuits built into it, which does most of the work
  of a machine and controls its parts.
scope: A tiny chip with electric circuits built into it that does most of a machine's work and controls
  its parts.
examples:
- The microprocessor does most of the work in the computer.
- A disk drive holds a microprocessor to handle its own work.
