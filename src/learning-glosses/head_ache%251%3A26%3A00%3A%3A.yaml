simpleMeaning: Pain in the top of the body, caused by blood tubes in the brain getting wider, by muscles
  getting tight, or by a bad reaction to drugs.
scope: Pain in the top of the body from wider blood tubes, tight muscles, or drugs, also called headache
  and cephalalgia; not a sore tooth and not a knock on the top of the body.
examples:
- She had a head ache after staring at the screen all day.
- A head ache can come from tight muscles in the neck.
