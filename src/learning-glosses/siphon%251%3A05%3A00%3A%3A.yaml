simpleMeaning: a tube-like part of a water animal, above all in shellfish, through which water can flow
  in or out
scope: A tube-like part of a water animal, above all in shellfish, through which water can flow in or
  out; not a tube for moving liquid between jars, and not the act of moving liquid that way.
examples:
- The clam drew water in through its siphon.
- Mussels use a siphon to take in water and push it out again.
