simpleMeaning: A thin skin in two layers that wraps round the heart and makes a watery fluid.
scope: The thin skin round the heart, in two layers, that makes a watery fluid, not the heart itself.
examples:
- The pericardium wraps round the heart in two thin layers.
- Fluid can build up inside the pericardium after an injury.
