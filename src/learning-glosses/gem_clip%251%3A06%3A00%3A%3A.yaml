simpleMeaning: Sheets of paper stay in one bunch with this piece of wire or plastic
scope: A piece of wire or plastic that holds sheets of paper in one bunch, also called a paper clip or
  paperclip, not a pin that goes through paper and not a fold that holds pages.
examples:
- She used a gem clip to keep the pages of her report together.
- I need a gem clip for these loose sheets.
