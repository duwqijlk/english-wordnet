simpleMeaning: An X-ray picture of the teeth that can be held in place by the teeth.
scope: An X-ray picture of the teeth that can be held in place by the teeth; not a large X-ray of the
  whole head and not a picture taken from outside the mouth.
examples:
- The dentist took a bitewing to check for decay between the teeth.
- A bitewing shows the upper and lower teeth together.
