simpleMeaning: an oval lump of grey matter at the lower end of a small part deep in the brain, joined
  to the striate body, a part of the brain
scope: A small oval part deep in the brain, not a nerve cell and not the whole brain.
examples:
- The subthalamic nucleus sits deep in the brain.
- The doctor pointed to the subthalamic nucleus on the scan of the brain.
