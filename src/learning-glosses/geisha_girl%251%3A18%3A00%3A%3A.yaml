simpleMeaning: A Japanese woman taught to entertain men with talk, song and dance.
scope: This is a Japanese woman taught to entertain men with talk, song and dance; geisha is another name
  for this sense, not a woman who only sings and not a servant who brings food.
examples:
- The geisha girl danced and sang for the guests.
- She trained for years to become a geisha girl.
