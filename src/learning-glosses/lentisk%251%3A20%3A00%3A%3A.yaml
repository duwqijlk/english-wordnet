simpleMeaning: A green shrub of the lands round the Mediterranean Sea that stays green all year and is
  grown for its sticky gum
scope: A shrub of the Mediterranean lands grown for its sticky gum; mastic and mastic tree are other names
  for this sense, not the gum itself and not any other green shrub.
examples:
- Lentisk grows wild on the dry hills of the Mediterranean.
- Farmers tend lentisk for the resin in its bark.
