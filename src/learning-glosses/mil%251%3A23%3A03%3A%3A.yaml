simpleMeaning: a unit for measuring angles in artillery, 6,400 of which make a full turn
scope: The artillery angle unit, not the thousandth-of-an-inch length unit, the metric volume unit, or
  the Swedish ten-kilometre unit.
examples:
- The crew adjusted the gun by twenty mils.
- A full circle contains 6,400 mils.
