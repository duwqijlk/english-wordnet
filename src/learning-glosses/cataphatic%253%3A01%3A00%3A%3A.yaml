simpleMeaning: Of or about the religious belief that God can be known by people by saying what God is.
scope: Of or about the religious belief that God can be known by people by saying what God is; not the
  belief that God cannot be known, and not a belief about how people pray.
examples:
- Cataphatic words about God say what God is.
- His cataphatic view holds that God can be known by people.
