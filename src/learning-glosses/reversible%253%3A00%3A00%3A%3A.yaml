senseId: 'reversible%3:00:00::'
synsetId: 01763446-a
simpleMeaning: Able to turn a thing back, or to be turned back itself.
scope: Of a thing or a change that can turn something back or be turned back itself, not a coat that can
  be worn inside out, not a garment that can be used with either side out, not a thing that can take either
  of two states, and not a decision or order that can be taken back.
examples:
- The damage to the paint was reversible, and a good wash took it off.
- The change in the metal was reversible, and it went back to its first shape when it cooled.
