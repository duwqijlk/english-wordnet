simpleMeaning: a thin veil like a cobweb, made of silky threads and covering only part of a surface
scope: A thin veil like a cobweb, made of silky threads and covering only part of a surface; not a full
  covering, and not a spider's web.
examples:
- A cortina of silky threads partly covered the surface below.
- He lifted the cortina gently to look beneath it.
