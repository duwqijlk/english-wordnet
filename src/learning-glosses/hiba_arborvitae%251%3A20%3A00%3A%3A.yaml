simpleMeaning: Planted to look good, this tree from Japan keeps its leaves all year and grows slowly to
  a fair size
scope: A tree from Japan that keeps its leaves all year, grows slowly to a fair size, and is planted to
  look good, not a fast-growing tree and not a tree grown for wood.
examples:
- They planted a hiba arborvitae by the front gate.
- The hiba arborvitae in the garden grows slowly but keeps its green leaves all year.
