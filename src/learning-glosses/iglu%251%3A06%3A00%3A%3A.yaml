simpleMeaning: a hut of the Eskimo people, often built of blocks of earth or snow in the shape of a dome
scope: A dome-shaped hut of blocks of earth or snow; igloo is another name for this sense, not a tent
  and not a house of wood.
examples:
- The family built an iglu from blocks of snow.
- Inside the iglu, the air stayed warm through the night.
