simpleMeaning: Set patterns of small spots on a surface stand for the bits and bytes of what is kept there,
  and the surface holds it for later use
scope: It is also called magnetic medium and magnetic storage medium, and a hard disk is one such surface
  that holds what is put on it.
examples:
- The hard disk in her computer is magnetic storage.
- All her files were kept on magnetic storage.
