simpleMeaning: socks, stockings and tights taken together as a group; in Britain, underwear is also part
  of this group
scope: This is a group name for socks, stockings and tights; it is not the one tight leg covering men
  wore long ago, and not a pipe for water.
examples:
- The shop sells hose for women, including stockings and tights.
- He bought new hose, choosing thick socks for winter.
