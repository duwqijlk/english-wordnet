simpleMeaning: a bottle with two walls and no air between them, made to keep drinks hot or cold
scope: A bottle that keeps drinks hot or cold; thermos and thermos bottle are other names for this sense.
  Not a plain water bottle, and not a kettle.
examples:
- The thermos flask kept the soup hot until dinner.
- She took a thermos flask of coffee on the train.
