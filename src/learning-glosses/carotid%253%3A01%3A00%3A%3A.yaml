simpleMeaning: about either of the two large tubes that carry blood to the head and neck, one on each
  side
scope: About either of the two large tubes that carry blood to the head and neck, not about blood tubes
  in other parts of the body.
examples:
- The doctor pressed gently on his carotid artery to feel the pulse.
- A blocked carotid artery can stop blood reaching the head.
