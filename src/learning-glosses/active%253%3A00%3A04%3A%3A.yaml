simpleMeaning: In geology, describing a volcano that is pouring out lava or ash now, or seems about to.
scope: This means the volcano is erupting or likely to erupt soon, not merely able to erupt someday (the
  other volcano sense), and not any sense about energetic people, being disposed to act, taking part,
  exerting influence, being in operation, growing more severe, military readiness, the sun, grammar, or
  full-time work, nor the noun for a chemical agent, the grammatical voice, or a participating member.
examples:
- The active volcano sent ash over the nearby town.
- Scientists warned that the mountain was active and might blow at any moment.
