simpleMeaning: to write down the sounds of speech, using a special sign for each sound
scope: Writing speech sounds with special signs, not changing a piece of music for a new instrument and
  not copying information from DNA (the material inside living things that carries the instructions for
  how they are built) in the body.
examples:
- She transcribed the sentence using a special sign for each sound.
- He transcribed the speaker's words with signs for every sound.
