simpleMeaning: It means moving easily and without strain, in a flowing, graceful way.
scope: This is easy, flowing bodily movement, also called liquid, fluid or fluent, not a jolt-free ride
  or notes joined in music.
examples:
- The dancer crossed the stage with a smooth, flowing motion.
- He moved with smooth, unhurried strides across the field.
