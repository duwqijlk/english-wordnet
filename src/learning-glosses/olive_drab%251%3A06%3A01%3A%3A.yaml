simpleMeaning: Made from cloth of a dull green-brown colour, these are the clothes that soldiers of the
  American Army wear
scope: Clothes worn by soldiers of the American Army, also called olive-drab uniform; not the dull green-brown
  colour itself and not the clothes of another army.
examples:
- His olive drab hung in the closet after the war.
- She pressed his olive drab before the ceremony.
