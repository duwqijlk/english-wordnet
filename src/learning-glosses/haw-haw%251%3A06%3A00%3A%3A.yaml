simpleMeaning: A ditch with a wall holding back the earth on one side, used to mark off land without spoiling
  the view.
scope: This is a ditch with a wall holding back the earth on one side, used to mark off land without spoiling
  the view, not an open ditch; also called ha-ha and sunk fence.
examples:
- The haw-haw kept the cattle out of the garden.
- A haw-haw ran along the edge of the lawn.
