simpleMeaning: Loose bunches of pink or purple flowers grow on a plant of Europe and Asia with spiny stems
  and tough roots.
scope: This is a plant of Europe and Asia with loose bunches of pink or purple flowers, also called restharrow,
  not the woody plant of Europe with leaves of one part each.
examples:
- Rest-harrow grew along the path with loose bunches of pink flowers.
- The rest-harrow had spiny stems and tough roots.
