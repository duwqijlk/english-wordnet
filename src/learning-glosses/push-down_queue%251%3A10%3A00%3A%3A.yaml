simpleMeaning: In this waiting line, the last thing to go in is the first thing to come out, last in,
  first out
scope: A waiting line where the last thing in is the first thing out, not an ordinary line where the first
  thing in is taken first.
examples:
- The push-down queue sent out the newest job first.
- Items left the push-down queue in the reverse order they went in.
