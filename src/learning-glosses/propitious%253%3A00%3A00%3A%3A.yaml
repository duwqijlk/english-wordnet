simpleMeaning: giving good conditions for something to go well, and likely to end in success or to show
  signs of success
scope: Showing good conditions and signs of success ahead, not just pleasant now and not lucky by chance
  alone.
examples:
- They chose a propitious day to start the long journey.
- Propitious winds helped the ship move fast across the sea.
