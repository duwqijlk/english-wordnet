simpleMeaning: a flat animal of 15 to 173 body parts, each with two legs, mainly active at night and hunting
  other animals, its front legs changed to catch prey
scope: This is the flat, many-legged animal that hunts at night, not a worm and not an insect with only
  six legs.
examples:
- A centipede ran across the bathroom floor on its many legs.
- At night, the centipede hunted small insects under the stones.
