simpleMeaning: In Judaism, a small day of going without food, kept on the 17th day of the month when the
  walls of Jerusalem were broken through.
scope: This is a minor fast day in Judaism on the 17th of Tammuz, marking the breaching of the walls of
  Jerusalem, and so a lesser fast than the major fast days.
examples:
- The Fast of Tammuz falls on the 17th day of the month.
- On the Fast of Tammuz, people go without food in memory of the walls of Jerusalem.
