simpleMeaning: full of sudden jumps from one subject to another, with sharp breaks between them
scope: Writing or talk that jumps suddenly from one subject to another, also called abrupt; not the music
  sense of short, cut-off notes and not talk that simply lacks order.
examples:
- His disconnected prose jumped from one topic to the next.
- The disconnected speech left the crowd unsure what he meant.
