senseId: 'hence%4:02:00::'
synsetId: 00043413-r
simpleMeaning: a word used to bring in the point that follows from a fact or reason just given
scope: 'Also called therefore, thus, or so: a word that brings in a conclusion, not a word meaning ''from
  here'' in place or time.'
examples:
- The road was closed, and hence we took another way home.
- It is late, hence we must leave now.
