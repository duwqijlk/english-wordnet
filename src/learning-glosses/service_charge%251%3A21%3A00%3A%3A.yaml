simpleMeaning: a percentage of a bill, as at a hotel or eating place, added in payment for the work done
  for you
scope: A part of a bill added to pay for the work done for you; service fee is another name for it, not
  a charge for light and lifts in a block of flats and not a tax.
examples:
- A service charge was added to the bill.
- The service charge was ten per cent.
