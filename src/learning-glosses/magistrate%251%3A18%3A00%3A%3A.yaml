simpleMeaning: a judge who is not a trained lawyer, or a civil officer, who runs the law, most of all
  one who hears small cases in a low court
scope: A low-court judge or civil officer who runs the law, not a judge of a high court and not a police
  officer.
examples:
- The magistrate heard the case about the broken window.
- She took the matter to the local magistrate.
