simpleMeaning: to leave a plane while it is still in the air and drop to the ground under a big cloth
  that opens above you and slows the fall
scope: To leave a plane in the air and come down under a parachute, also called jump and parachute, not
  rescue gear that fills with air.
examples:
- He chuted from the plane at ten thousand feet.
- She loves to chute over the desert at sunrise.
