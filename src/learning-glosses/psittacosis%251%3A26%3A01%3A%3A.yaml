simpleMeaning: people catch this lung sickness, not the usual kind, from sick birds, after a tiny germ
  carried by birds gets into them
scope: Also called ornithosis and parrot fever, it is a lung sickness caught from birds, not the usual
  kind of lung sickness.
examples:
- A keeper caught psittacosis after handling a sick parrot.
- Psittacosis passed from sick birds to people.
