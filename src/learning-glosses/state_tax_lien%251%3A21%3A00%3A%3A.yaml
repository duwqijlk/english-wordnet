simpleMeaning: a legal claim on what a person owns that the money collector can use when the money owed
  to the government is not paid
scope: A legal claim on a person's property that can be used when payment is missed, not a fine and not
  a loan.
examples:
- The state tax lien let the collector take the house after the payments stopped.
- She found a state tax lien on the land she wanted to buy.
