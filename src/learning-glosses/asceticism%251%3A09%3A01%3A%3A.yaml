simpleMeaning: The belief that by giving up worldly pleasures a person can reach a high level in spirit
  or in thought
scope: This is the belief itself, not the personal quality of giving things up and not the act of strict
  self-control in daily life.
examples:
- Asceticism taught him to give up comfort for spiritual growth.
- In asceticism, people give up worldly pleasures to grow in spirit and thought.
