simpleMeaning: showing no soft or kind feelings and not willing to care about the feelings of others
scope: Also called stony, flint, and obdurate; this is about a person who shows no kind feelings, not
  about rock or soil that has hard stone in it.
examples:
- His flinty gaze did not change when the child cried.
- She gave a flinty reply and walked away without helping.
