simpleMeaning: a sound that rises so high it is like a person crying out
scope: 'Also called a scream, a screaming, a shriek, a screech, or a shrieking: a sound that rises so
  high it is like a person crying out, not a sharp cry that cuts through other sounds.'
examples:
- The screeching of the brakes made everyone cover their ears.
- We heard the screeching of gulls above the harbour.
