simpleMeaning: An infectious illness, usually started by bacteria, in which the tissues around the brain
  and spinal cord become inflamed, bringing headache, stiff neck, fever and nausea.
scope: This is inflammation of the protective tissues around the brain and spinal cord, not an infection
  of the brain tissue itself or an ordinary headache with fever.
examples:
- He had a high fever and a stiff neck, and the doctor feared meningitis.
- Meningitis is treated with antibiotics when bacteria are the cause.
