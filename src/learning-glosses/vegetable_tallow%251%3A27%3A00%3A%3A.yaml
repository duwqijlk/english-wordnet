simpleMeaning: A waxy fat got from some plants, such as bayberry, and used like the hard fat from animals.
scope: A waxy plant fat used like animal fat; not a cooking oil and not beeswax.
examples:
- Vegetable tallow from the bayberry was once used to make candles.
- The soap maker boiled vegetable tallow with lye.
