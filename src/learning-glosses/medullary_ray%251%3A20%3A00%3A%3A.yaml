senseId: 'medullary_ray%1:20:00::'
synsetId: 13119274-n
simpleMeaning: a thin flat sheet of plant tissue that stands between the bundles of tubes that carry water
  and food
scope: A thin sheet of plant tissue between the bundles of tubes; vascular ray is another name for this
  sense, not the bundle itself, and not the bark.
examples:
- The medullary ray separates one bundle of tubes from the next.
- In the stem, medullary rays run between the water-carrying bundles.
