simpleMeaning: A person loses consciousness as the muscles stiffen and hold, then jerks all over the body,
  in a form of epilepsy.
scope: Also called epilepsia major, generalized epilepsy and grand mal epilepsy, it is the form of epilepsy
  with loss of consciousness and jerking all over the body.
examples:
- He suffered a grand mal attack.
- During a grand mal fit, her muscles stiffened and then jerked.
