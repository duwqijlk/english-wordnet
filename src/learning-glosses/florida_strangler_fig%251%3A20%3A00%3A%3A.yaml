scope: A tree from south-east America and the West Indies that starts on another tree and chokes it, also
  called golden fig, strangler fig, wild fig and Ficus aurea; it starts life on a host tree, not in the
  ground.
examples:
- The Florida strangler fig began life high in another tree.
- A Florida strangler fig can cover a whole grove.
