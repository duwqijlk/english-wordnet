simpleMeaning: In old Greek and Roman tales, ugly snake-haired beings, most often three, who hunted down
  wrongdoers who went free.
scope: These are the snake-haired beings of old tales who hunted wrongdoers, also called Erinyes and Eumenides,
  not wild anger and not a single goddess.
examples:
- A Fury hunted the man who went free.
- The Fury had snakes for hair.
