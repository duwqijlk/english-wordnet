simpleMeaning: a vine or other plant that climbs, and that easily grows up a support or spreads over other
  plants
scope: A vine that grows up a support or over other plants, not the iron spike worn on a shoe and not
  a person who climbs mountains.
examples:
- The climber wound its way up the trellis all summer.
- This climber spreads over the wall and covers it with leaves.
