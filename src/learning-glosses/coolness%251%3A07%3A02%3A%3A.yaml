simpleMeaning: Staying calm and in full control of yourself when you are in danger, with no fear showing.
scope: Not the coolness of calm self-assurance in ordinary life; this is steady nerve when danger is close.
examples:
- The firefighter's coolness under fire saved the whole crew.
- He faced the armed robber with a coolness that surprised us all.
