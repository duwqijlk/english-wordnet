simpleMeaning: the act of listening to a telephone or telegraph line to get information
scope: The act of listening to a phone line to learn what is said; not the verb of doing it, not a part
  you turn to let water out, and not a light hit.
examples:
- The police put a tap on his phone to hear his calls.
- The tap on her phone picked up every word she said.
