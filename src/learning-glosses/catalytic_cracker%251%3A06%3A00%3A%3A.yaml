synsetId: 02985024-n
simpleMeaning: Fuels that boil at low heat come from oils that boil only at high heat, changed in a vessel
  with a chemical that speeds the change.
scope: Also called cat cracker, this is a vessel for changing oils into lighter fuels, not a tank for
  keeping oil.
examples:
- The catalytic cracker turns heavy oil into petrol.
- Oil flows into the catalytic cracker and comes out as lighter fuel.
