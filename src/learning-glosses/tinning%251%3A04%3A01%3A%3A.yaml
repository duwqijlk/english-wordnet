simpleMeaning: putting a thin coat of soft solder, a metal that melts to join parts, on the ends of wires
  before they are joined
scope: This is the putting of a thin coat of soft solder on wire ends before joining them; not the joining
  itself, and not a coat of paint.
examples:
- Careful tinning of the ends of wires makes a better joint.
- He did the tinning before he soldered the wires together.
