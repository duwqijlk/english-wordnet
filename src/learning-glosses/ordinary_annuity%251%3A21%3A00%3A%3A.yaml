senseId: 'ordinary_annuity%1:21:00::'
synsetId: 13316048-n
simpleMeaning: A set of payments, more or less the same size, made at the end of each of a set of equal
  gaps of time
scope: A set of even payments made at the end of set gaps of time, not a single lump sum and not payments
  made at the start of each gap.
examples:
- Her ordinary annuity is paid at the end of every year.
- He chose an ordinary annuity with equal payments each month.
