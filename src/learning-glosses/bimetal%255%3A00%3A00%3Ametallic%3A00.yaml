simpleMeaning: made of two unlike kinds of hard shiny stuff, most often as sheets joined together
scope: 'Also called bimetallic: made of two unlike kinds of hard shiny stuff, not made of one kind alone
  and not two sheets merely laid together.'
examples:
- The strip is bimetal, with copper on one side and steel on the other.
- A bimetal strip bends as it warms.
