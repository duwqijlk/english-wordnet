simpleMeaning: the fact that a book or other work can be got in a form made on paper
scope: This is a book or other work that people can still get in a form made on paper; not a picture,
  not cloth with a pattern on it, and not the act of making copies.
examples:
- His first book is still in print after ten years.
- We hope to get the new story into print before the end of the month.
