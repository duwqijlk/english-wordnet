senseId: 'blood-oxygenation_level_dependent_functional_magnetic_resonance_imaging%1:04:00::'
synsetId: 00904673-n
simpleMeaning: How much oxygen the substance in red cells that carries oxygen holds changes from within,
  and this scan shows what is at work inside the body from those changes.
scope: This scan shows what is at work inside the body, unlike a plain scan that shows only the shape
  of parts of the body.
examples:
- Blood-oxygenation level dependent functional magnetic resonance imaging follows changes in how much
  oxygen the blood holds.
- Blood-oxygenation level dependent functional magnetic resonance imaging can show which parts of the
  body are at work.
