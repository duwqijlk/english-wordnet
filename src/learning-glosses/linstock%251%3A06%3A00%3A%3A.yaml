simpleMeaning: A stick about a metre long, sharp at one end to push into the ground and forked at the
  other to hold a burning match, once used to fire cannons
scope: A stick about a metre long once used to fire cannons, not a ramrod for packing powder and not a
  slow-burning fuse.
examples:
- The gunner held the linstock ready beside the cannon.
- He pushed the linstock into the ground near the gun.
