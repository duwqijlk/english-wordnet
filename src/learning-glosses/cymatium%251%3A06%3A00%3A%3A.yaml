simpleMeaning: In architecture, the top trim of a wall is given a wavy S-shaped edge in side view, half
  hollow and half bulging
scope: In architecture, a wavy S-shaped strip along the top of a wall; also called cyma, not a flat strip
  or a round bead.
examples:
- The cymatium crowns the stone wall.
- The mason cut a cymatium along the cornice.
