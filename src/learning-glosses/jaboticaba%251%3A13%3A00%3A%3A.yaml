simpleMeaning: A purple fruit like a grape, with tough skin, from a hot country, grown in Brazil.
scope: A purple fruit like a grape, with tough skin, grown in Brazil; not a true grape and not a plum.
examples:
- Jaboticaba ripened on the tree in the Brazilian garden.
- She tasted jaboticaba for the first time at the market.
