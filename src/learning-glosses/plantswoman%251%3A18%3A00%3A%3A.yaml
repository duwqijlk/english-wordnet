simpleMeaning: A woman who knows a great deal about growing plants, fruit, flowers, vegetables and plants
  grown for show
scope: A woman who is expert at growing plants; the man with the same skill is a plantsman, and this is
  not just someone who tends a garden.
examples:
- The plantswoman raised prize vegetables and flowers for show.
- As a plantswoman, she knew how to grow fruit trees and ornamental plants.
