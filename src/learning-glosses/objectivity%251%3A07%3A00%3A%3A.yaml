simpleMeaning: a way of judging that is based on what you can see and is not changed by feelings or by
  opinions held before the facts are known
scope: Also called objectiveness. This is judging from facts you can see, not judging from feelings or
  from your own likes and dislikes.
examples:
- The judge showed objectivity in the court case.
- Good science needs objectivity when you look at the results.
