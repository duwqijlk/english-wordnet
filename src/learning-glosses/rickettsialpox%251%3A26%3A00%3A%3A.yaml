senseId: 'rickettsialpox%1:26:00::'
synsetId: 14165394-n
simpleMeaning: A mild infectious disease caused by a bacterium and spread by mites from rodents, bringing
  chills, fever, headache, and skin sores that look like chickenpox.
scope: This is a mite-borne illness with chickenpox-like sores, not chickenpox itself and not a more severe
  tick-borne infection.
examples:
- Rickettsialpox usually clears up on its own within a few weeks.
- The doctor suspected rickettsialpox after the patient mentioned mites from a rodent nest.
