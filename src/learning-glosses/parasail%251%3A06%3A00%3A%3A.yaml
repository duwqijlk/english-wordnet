simpleMeaning: When a motorboat or a car pulls it along, this cloth wing lifts a person into the air
scope: Pulled along by a motorboat or a car, this cloth wing lifts a person into the air, not a cloth
  that lets a person land safely on the ground and not a kite flown for fun.
examples:
- She tried a parasail ride over the bay behind a speedboat.
- The parasail lifted him high above the water as the boat sped on.
