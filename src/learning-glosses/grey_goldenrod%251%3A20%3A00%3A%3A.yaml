simpleMeaning: A weed of Canada and the eastern United States with yellow flowers, at times used to make
  dye.
scope: 'Also called a gray goldenrod: a weed of Canada and the eastern United States with yellow flowers
  used at times to make dye, not a garden flower grown for show and not a weed with white flowers.'
examples:
- The grey goldenrod grows along the road in Canada.
- Dyers once picked grey goldenrod for its yellow flowers.
