simpleMeaning: small, round and bright, like a bead or a small round fastener that catches the light
scope: 'Also called beady, beadlike and buttony: small, round and bright, not big and dull and not flat.'
examples:
- Her buttonlike eyes shone in the light.
- The buttonlike beads on the dress caught the light.
