senseId: 'compulsory_process%1:07:00::'
synsetId: 05185232-n
simpleMeaning: the right of a person on trial to have a court order key witnesses to appear in court,
  using its power to force them to come
scope: A defendant's right to get key witnesses into court by court order; not the right to a lawyer and
  not the right to stay silent.
examples:
- His lawyer used compulsory process to bring the witness to court.
- The defendant asked for compulsory process so the key witness would have to appear.
