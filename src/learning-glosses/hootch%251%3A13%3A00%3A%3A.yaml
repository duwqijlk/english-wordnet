simpleMeaning: Strong drink made in secret, outside the law, and usually of poor make
scope: Strong drink made in secret, outside the law, and usually of poor make, also called hooch; not
  drink made by a licensed maker, and not weak beer.
examples:
- He kept a bottle of hootch hidden under the floor.
- The hootch they sold was rough and burned the throat.
