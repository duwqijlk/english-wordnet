simpleMeaning: To wander from place to place with no fixed goal, often looking for work or food.
scope: This is drifting from place to place with no destination, not a throw of any kind or a stay in
  one place.
examples:
- After the mill closed, he cast about the country looking for work.
- The stray dogs cast about the streets each night, hunting for scraps.
