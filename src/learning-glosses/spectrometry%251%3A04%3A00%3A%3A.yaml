simpleMeaning: The study of spectra, the bands of colour in light, with an instrument that splits light
  apart.
scope: Also called spectroscopy, the study of spectra by means of an instrument that splits light into
  its bands of colour.
examples:
- Spectrometry showed what metals were in the rock sample.
- They used spectrometry to study the light from the far star.
