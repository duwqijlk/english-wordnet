simpleMeaning: Usually with a sucker at each end, a worm that lives in water or on land and feeds on flesh
  or blood.
scope: Also called a leech or a hirudinean, a worm of water or land that feeds on flesh or blood, usually
  with a sucker at each end.
examples:
- The bloodsucker fastened itself to the swimmer's leg.
- Leeches are bloodsuckers that live in ponds and marshes.
