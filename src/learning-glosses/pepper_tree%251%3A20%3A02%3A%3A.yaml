simpleMeaning: A small evergreen tree from Peru, with a broad rounded crown, hanging slender branches,
  clusters of greenish flowers and then rose-pink fruits.
scope: This is the Peruvian evergreen with drooping branches and rose-pink fruits, not the African deciduous
  tree with a spreading crown and lilac-like flowers.
examples:
- The pepper tree at the gate was covered in clusters of greenish flowers.
- By autumn the pepper tree hung low under small rose-pink fruits.
