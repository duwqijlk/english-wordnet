senseId: 'drain%1:06:01::'
synsetId: 03236861-n
simpleMeaning: a tube put into a hollow place in the body, as in an operation, to take out stuff that
  should not be there
scope: A tube put in the body to take out unwanted stuff, not the act of letting liquid run out of a thing
  and not the act of taking liquid out of a thing to make it empty.
examples:
- After the operation, the surgeon left a drain in the wound to carry away extra fluid.
- The nurse checked the drain to see how much fluid had come out of the patient's body.
