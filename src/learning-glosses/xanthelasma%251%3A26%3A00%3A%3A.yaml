simpleMeaning: yellow patches of fat under the skin of the eyelids, found most often in older people
scope: This is a skin growth on the eyelids found most often in older people, not a growth elsewhere on
  the body and not a normal change of age.
examples:
- Her xanthelasma showed as yellow patches on her eyelids.
- The doctor said the xanthelasma on his eyelids was common in older people.
