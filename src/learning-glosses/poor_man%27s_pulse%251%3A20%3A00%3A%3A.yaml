simpleMeaning: Grown in India to feed people and farm animals, this twining herb of the warm lands of
  the Old World is at times put in the Dolichos group.
scope: This is a twining herb of the warm lands of the Old World, also called horse grain and horse gram,
  not a herb of the New World.
examples:
- They grow poor man's pulse in India for food and fodder.
- Poor man's pulse climbed up and gave food for people and farm animals.
