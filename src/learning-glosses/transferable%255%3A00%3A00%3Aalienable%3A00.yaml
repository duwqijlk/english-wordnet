simpleMeaning: Under the law, able to pass from the person who owns it to another person
scope: 'Also called negotiable: under the law, able to pass from one owner to another person; not just
  able to be moved or used in a new place.'
examples:
- The bonds are transferable, so they can pass to a new owner.
- These shares are transferable to another person if you sign the form.
