simpleMeaning: strong and steady in purpose or belief, and not changing or giving way
scope: Firm and steady are other names for this sense. This is being strong in purpose or belief and not
  giving way, not a thing that cannot bend.
examples:
- The leader was stiff in his decision and would not change it.
- They put up stiff opposition and did not give way.
