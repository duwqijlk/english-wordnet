simpleMeaning: To turn food solid with cold very fast so that its natural juices and tastes stay in it.
scope: To turn food solid with cold very fast so that its natural juices and tastes stay in it; not to
  cool food slowly in a fridge, and not to dry food for keeping.
examples:
- Flash-freeze the berries to keep their taste.
- The cook will flash-freeze the shrimp for later.
