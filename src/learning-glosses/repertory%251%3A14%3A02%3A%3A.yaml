simpleMeaning: a group of actors that performs plays from a set list of plays it can perform
scope: This is the group of actors itself, not the set of plays it performs and not the full range of
  skills for a job.
examples:
- The repertory hired five new actors for the winter season.
- He works for a repertory that performs three plays each season.
