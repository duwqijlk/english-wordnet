simpleMeaning: A small to medium oak of east middle North America that loses its leaves in winter, with
  leaves that have sharply pointed lobes.
scope: Also called jack oak and northern pin oak; a small to medium oak of east middle North America,
  not a big oak of the south and not an evergreen oak.
examples:
- Quercus ellipsoidalis loses its leaves each winter.
- The leaves of Quercus ellipsoidalis end in sharp points.
