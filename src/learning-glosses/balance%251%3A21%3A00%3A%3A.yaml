simpleMeaning: a state in which the two sides of an account, money received and money paid, are equal
scope: This is not the pleasing arrangement of a design and not physical steadiness; it concerns the two
  sides of a financial account.
examples:
- After the audit, the account was in balance.
- The books were out of balance until the missing invoice was found.
