simpleMeaning: The plug that closes the top of a bottle, especially a wine bottle.
scope: The stopper that closes a bottle, not the bark of the tree it is cut from, not the bark tissue,
  and not the small float on a fishing line.
examples:
- He pulled the cork from the bottle.
- The cork would not come out of the wine bottle.
