simpleMeaning: A leafy plant of North America that grows in the wet, with yellow blooms whose pointed
  parts spread out from the middle.
scope: A leafy plant of North America with yellow blooms; mud plantain is another name for this sense,
  not a dry-land grass and not a plant with white blooms.
examples:
- The water star grass grows in the wet with yellow blooms.
- We found water star grass by the pond, its yellow blooms open.
