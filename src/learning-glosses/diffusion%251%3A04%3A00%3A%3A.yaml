simpleMeaning: The deed of scattering or spreading a thing.
scope: This sense is also called dispersal and dispersion, for the deed of scattering or spreading a thing,
  unlike the sense for, in physics, the course by which a substance moves from a place of high strength
  of that substance to a place of lower strength, and unlike the sense for the mark of being spread or
  scattered.
examples:
- Diffusion is the deed of scattering a thing.
- Diffusions spread.
