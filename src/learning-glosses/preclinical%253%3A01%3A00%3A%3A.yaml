simpleMeaning: about the first stage of a sickness, when a doctor can not yet tell what it is because
  no signs have shown
scope: This is a word also called presymptomatic, about the first stage of a sickness before any signs
  show, not about a sickness after signs have shown.
examples:
- In the preclinical stage, the sickness had not yet shown any signs.
- Doctors watched her preclinical illness, but they could not yet name it.
