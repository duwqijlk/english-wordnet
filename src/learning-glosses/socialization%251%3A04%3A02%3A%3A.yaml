senseId: 'socialization%1:04:02::'
synsetId: 01269238-n
simpleMeaning: the act of setting something up in a socialist way, where the state or the people together
  own and run it
scope: Also called socialisation. This is about changing who owns and runs things, not about learning
  the ways of people around you and not about meeting people for fun.
examples:
- The socialization of medical services put all hospitals under state control.
- Many people argued about the socialization of the railways.
