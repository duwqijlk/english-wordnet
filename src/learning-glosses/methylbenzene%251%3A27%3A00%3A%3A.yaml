simpleMeaning: a colorless, flammable liquid made from petroleum or coal tar; used to dissolve gums and
  lacquers and in high-octane fuels
scope: A liquid solvent from petroleum or coal tar, not benzene, a different chemical with a similar name.
examples:
- High-octane petrol contains methylbenzene.
- The workshop used methylbenzene to dissolve the old lacquer.
