simpleMeaning: A deep groove in the brain that runs upward on the outer side of both halves and sets apart
  the front and back lobes
scope: Also called central sulcus, sulcus centralis and fissure of Rolando; a deep groove in the brain,
  close to other brain grooves such as the lateral sulcus.
examples:
- Rolando's fissure separates the front and back lobes.
- The scan showed Rolando's fissure clearly.
