simpleMeaning: The teaching and ways of one wing of the Church of England that stresses the old Catholic
  tradition.
scope: Also called Anglo-Catholicism; the teaching and ways of one wing of the Church of England stressing
  the old Catholic tradition, not other wings of the Church and not the Roman Catholic Church.
examples:
- High Anglicanism stresses the old Catholic tradition of the Church of England.
- The priest's High Anglicanism shows in his love of old ritual.
