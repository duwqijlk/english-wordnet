simpleMeaning: A drug that makes the body pass more water, used to treat high blood pressure.
scope: Also called hydrochlorothiazide, HydroDIURIL, and Microzide, this drug makes the body pass more
  water and is used to treat high blood pressure, not any other drug for high blood pressure.
examples:
- The doctor gave her Esidrix for high blood pressure.
- Esidrix helps the body pass more water.
