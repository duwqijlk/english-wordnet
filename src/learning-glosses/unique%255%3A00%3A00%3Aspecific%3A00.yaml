senseId: unique%5:00:00:specific:00
synsetId: 01108735-s
simpleMeaning: 'used with ''to'': belonging only to one particular group, situation or place.'
scope: This is not the broader sense of being unlike anything else; it says the thing is limited to one
  category, condition or place, and it is followed by 'to'.
examples:
- This plant is unique to the island and grows nowhere else.
- The dialect is unique to a few fishing villages.
