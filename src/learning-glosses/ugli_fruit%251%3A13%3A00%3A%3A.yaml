scope: This is a big, sweet, juicy cross between a tangerine and a grapefruit, also called ugli and tangelo;
  not the other sense of the same name, a cross between a grapefruit and a mandarin orange grown in Florida.
examples:
- The ugli fruit was sweet and juicy.
- She peeled an ugli fruit for breakfast.
