simpleMeaning: With a ball on the end of one bone fitting into a round hollow in the other, this is a
  place where two bones meet and move freely
scope: This freely moving joint, also called articulatio spheroidea, ball-and-socket joint, cotyloid joint,
  enarthrosis, and spheroid joint, joins two bones with a ball in a round hollow.
examples:
- The enarthrodial joint in his shoulder moved freely in every way.
- Her hip is an enarthrodial joint where the ball turns in its hollow.
