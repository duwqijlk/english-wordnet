simpleMeaning: Iron from the furnace that holds manganese, used to take oxygen out and to add manganese
  when making steel.
scope: Also called spiegel and spiegeleisen, this is iron from the furnace that holds manganese, used
  to take oxygen out and to add manganese when making steel, not the steel itself.
examples:
- Spiegel iron was shovelled into the furnace with the ore.
- The spiegel iron gave the steel its manganese.
