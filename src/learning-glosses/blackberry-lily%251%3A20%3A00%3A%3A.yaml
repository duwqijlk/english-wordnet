simpleMeaning: When ripe, the seed case of this garden plant opens to show a mass of seeds that look like
  a dark fruit.
scope: Also called leopard lily, this garden plant's ripe seed case opens to show a mass of seeds that
  look like a dark fruit.
examples:
- The blackberry-lily opened its seed case in the garden.
- When ripe, the blackberry-lily showed a mass of seeds like a dark fruit.
