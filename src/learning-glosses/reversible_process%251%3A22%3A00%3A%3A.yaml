senseId: 'reversible_process%1:22:00::'
synsetId: 13572820-n
simpleMeaning: Any change in a thing that can be made to go back through the same steps, in the other
  order, when the change is undone.
scope: This is a change that can run back through the same steps, not a one-way change that cannot be
  undone.
examples:
- Melting ice is a reversible process.
- A reversible process can run back the way it came.
