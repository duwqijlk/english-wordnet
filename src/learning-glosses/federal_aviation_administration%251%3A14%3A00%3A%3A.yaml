simpleMeaning: Keeping flying safe for ordinary people is the work of this office in the transport department.
scope: This office looks after the safety of flying by ordinary people, also called FAA; it is not the
  office that checks food and drugs.
examples:
- The Federal Aviation Administration sets the rules for safe flying in the United States.
- Pilots must follow the rules of the Federal Aviation Administration.
