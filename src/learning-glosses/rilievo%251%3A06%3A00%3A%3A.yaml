simpleMeaning: a work of art made of shapes cut into a surface so they stand out from the ground behind
  them
scope: 'Also called relief, embossment, relievo and sculptural relief: shapes cut into a surface so they
  stand out, not a flat picture and not a free-standing statue.'
examples:
- The rilievo on the church wall showed figures in fine detail.
- She studied the rilievo, running her hand over its raised shapes.
