simpleMeaning: To refuse to give evidence in court by using a right in US law, which says no one can be
  forced to give words against himself or herself
scope: Also called take the Fifth; to refuse to give evidence in court by using the right in the Fifth
  Amendment, which says no one can be forced to speak against himself or herself.
examples:
- He took the Fifth Amendment and would not answer the judge's questions.
- She took the Fifth Amendment rather than speak against herself.
