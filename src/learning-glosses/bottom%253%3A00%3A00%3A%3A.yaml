simpleMeaning: placed in the lowest part or at the lowest level of something.
scope: This is not about a ship striking the seabed, and not the noun for the lowest part; it describes
  where something is placed.
examples:
- Put the heavy books on the bottom shelf.
- The bottom drawer of the desk is stuck.
