senseId: cooperative%5:00:00:noncompetitive:00
synsetId: 00515313-s
simpleMeaning: ready to change some of what you want or think when you differ from others, so that you
  can all agree
scope: Ready to change a little so a group can agree; not the noun for a business owned together by its
  members, and not just working together on a job.
examples:
- She was cooperative and agreed to change the plan a little so everyone was happy.
- The two sides were cooperative and soon reached an agreement.
