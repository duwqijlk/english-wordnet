simpleMeaning: The dried outer covering of the cascara buckthorn, used to loosen the bowels
scope: The dried outer covering of the cascara buckthorn, used to loosen the bowels; cascara, cascara
  sagrada and chittem bark are other names for this sense, not the covering of other trees and not a drug
  that works in other ways.
examples:
- The chemist sold chittam bark as a laxative.
- Chittam bark comes from the cascara buckthorn.
