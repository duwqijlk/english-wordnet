schema: oewn-learning-gloss-v2
senseId: pedantic%5:00:00:scholarly:00
synsetId: 02091054-s
simpleMeaning: paying attention only to a narrow part of learning, or showing learning, especially its
  small parts that do not matter
scope: 'Also called academic and donnish: it means caring too much about small points of learning, not
  just knowing a lot or liking study.'
examples:
- The teacher was so pedantic that he corrected every small spelling mistake in class.
- She gave a pedantic answer full of small facts that no one needed.
