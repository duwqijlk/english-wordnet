simpleMeaning: A wheel gear, the pinion, that locks teeth with a toothed bar, turning round-and-round
  motion into back-and-forth motion, and back again.
scope: A gear set that turns round-and-round motion into back-and-forth motion.
examples:
- Rack and pinion turns round-and-round motion into back-and-forth motion.
- Rack and pinion locks teeth with a toothed bar.
