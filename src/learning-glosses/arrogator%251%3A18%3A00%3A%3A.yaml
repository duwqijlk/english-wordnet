simpleMeaning: Rights, gains, and good points that are not theirs are claimed by this person, out of high
  regard for themselves.
scope: This is a person who claims for themselves rights, gains, and good points they do not have, out
  of high regard for themselves.
examples:
- The arrogator demanded a seat that was meant for someone else.
- The arrogator boasted of skills no one had ever seen them use.
