simpleMeaning: The set of nerve cells that takes in what the body feels and runs what the body does
scope: The whole set of nerves that feels and steers the body, not a single nerve and not the brain alone.
examples:
- Damage to the nervous system can leave a person unable to feel or move.
- The nervous system carries messages from the brain to the rest of the body.
