simpleMeaning: Usually a sign that the kidneys are unwell, this is too much protein, mostly albumin but
  also globulin, turning up in the urine.
scope: 'Also called albuminuria: too much protein in the urine, usually a sign that the kidneys are unwell,
  not a normal amount of protein in the urine.'
examples:
- The test found proteinuria, with too much protein in her urine.
- The doctor ordered a urine test after finding proteinuria.
