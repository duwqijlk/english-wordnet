simpleMeaning: A kind of frozen white flakes with almost no liquid water in it, so it is lighter than
  most and does not stick together.
scope: A kind of frozen white flakes with almost no liquid water in it, lighter than most and not sticky,
  not wet heavy flakes and not ice.
examples:
- Dry snow squeaked under our boots.
- You cannot build a snowman with dry snow.
