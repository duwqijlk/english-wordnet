simpleMeaning: the thin, narrow part of a bottle just below its top opening
scope: The thin neck of a bottle, not a place where traffic slows and not the verb sense of a road getting
  narrow.
examples:
- She held the bottle by its bottleneck.
- The bottleneck of the old glass bottle was chipped.
