senseId: 'hermaphrodite%1:18:00::'
synsetId: 10191752-n
simpleMeaning: A person who has both male and female sex parts and sex traits, so at birth it cannot be
  said clearly that the person is male or female
scope: 'Also called epicene, androgyne, epicene person, gynandromorph, and intersex: a person with both
  male and female sex parts, not a word for a plant or an animal.'
examples:
- The newborn was a hermaphrodite, so doctors could not say at once if the baby was a boy or a girl.
- A hermaphrodite may have both male and female sex parts.
