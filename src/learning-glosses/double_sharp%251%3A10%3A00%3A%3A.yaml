senseId: 'double_sharp%1:10:00::'
synsetId: 06879807-n
simpleMeaning: In music, a sign of two cross marks put before a note to show it is to be played two half-steps
  higher.
scope: In music, a sign that raises a note by two half-steps, not a single sharp mark and not a flat mark.
examples:
- The double sharp in the bar raises the note by two half-steps.
- She played the double sharp and the note sounded a whole step higher.
