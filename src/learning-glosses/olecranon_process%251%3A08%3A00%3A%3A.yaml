simpleMeaning: The part of the ulna forming the outer bump of the elbow, fitting into the fossa of the
  humerus when the arm is extended.
scope: It is also called olecranon, and it is the point of the forearm bone that fits into the hollow
  of the upper arm bone when the arm is straight.
examples:
- He felt the olecranon process at the outer bump of his elbow.
- When she straightened her arm, the olecranon process sat in the hollow of the upper arm bone.
