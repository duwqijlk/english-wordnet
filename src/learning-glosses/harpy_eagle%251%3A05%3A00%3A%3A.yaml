simpleMeaning: In the warm parts of America, this big bird of prey is black and white and has a crest
  of feathers on its head
scope: A large black-and-white crested bird of prey from tropical America, also called harpy, not the
  mythical creature with a woman's face and not a small hawk.
examples:
- A harpy eagle circled above the rainforest canopy.
- The harpy eagle snatched a monkey from the treetops.
