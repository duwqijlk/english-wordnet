simpleMeaning: a shield on its forehead and a farm hen's look tell this small water bird from rails; it
  is one of several kinds in the group Gallinula
scope: Also called gallinule, marsh hen, or swamphen; a small water bird with a shield on its forehead,
  not a rail and not a farm hen.
examples:
- A water hen paddled across the pond, its forehead shield easy to see.
- We watched a water hen walk along the bank like a small farm hen.
