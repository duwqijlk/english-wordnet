simpleMeaning: having an inner layer of material inside; often used joined to another word
scope: This describes clothes or other things that have an inner layer of material inside them; it is
  not about thin marks on paper or on skin.
examples:
- She wore a lined jacket on the cold day.
- He bought a silk-lined coat for the winter.
