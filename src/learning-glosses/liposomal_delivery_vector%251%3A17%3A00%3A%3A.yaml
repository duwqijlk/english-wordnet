simpleMeaning: A carrier that moves a chosen gene into cells by means of tiny bubbles of fat
scope: A carrier that moves a chosen gene into cells by means of tiny fat bubbles, not a carrier made
  of a virus and not a bare gene on its own.
examples:
- The team used a liposomal delivery vector to carry the gene into the cells.
- A liposomal delivery vector can take the new gene where it is needed.
