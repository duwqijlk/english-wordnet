simpleMeaning: A former British unit of length equal to 6,080 feet (1,853.184 meters), 800 feet longer
  than the usual land unit.
scope: Also called mile, mi, geographical mile, and nautical mile; a former British length unit, not the
  usual land unit and not the modern sea unit of 1,852 meters.
examples:
- The old chart gave the distance in naut mi, not in kilometres.
- One naut mi was 800 feet longer than the usual land unit.
