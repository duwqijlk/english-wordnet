simpleMeaning: any of several kinds of small animals or insects that are pests, such as cockroaches or
  rats
scope: Small animals or insects that are pests; not any small animal, and not a single rat alone.
examples:
- Cereals must be protected from mice and other vermin.
- The farmer shot vermin in the barn.
