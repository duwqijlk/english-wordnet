simpleMeaning: to move along over snow on a long, narrow sled with a front that curves up, or on a similar
  racing sled
scope: To ride over snow on this kind of sled; not the sled itself, which is the noun sense of the same
  word, and not to slide over snow with no sled.
examples:
- The children tobogganed down the hill all afternoon.
- We tobogganed over the fresh snow behind the house.
