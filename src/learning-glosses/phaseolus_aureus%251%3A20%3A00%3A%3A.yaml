simpleMeaning: A plant grown yearly in warm India, Indonesia and America for feed, above all its edible
  seeds; chief source of bean sprouts for Chinese cooking; sometimes put in that genus.
scope: Also called mung, mung bean, mung bean plant and Vigna radiata; a plant grown for its edible seeds,
  not a plant grown for its flowers and not a soybean plant.
examples:
- Phaseolus aureus is the chief source of bean sprouts.
- The farmer grew Phaseolus aureus for its edible seeds.
