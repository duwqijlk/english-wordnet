simpleMeaning: a chemical used in tests to make palladium or nickel form a solid and fall out of a liquid
scope: A chemical used in tests to make palladium or nickel form a solid and fall out of a liquid, and
  not a chemical used to clean metal or one used to make a dye.
examples:
- The chemist added dimethylglyoxime to the solution to bring down the nickel.
- Dimethylglyoxime showed that palladium was present in the sample.
