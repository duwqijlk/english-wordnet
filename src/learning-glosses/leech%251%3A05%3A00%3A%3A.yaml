simpleMeaning: a worm that eats meat or sucks blood, living in water or on land, usually with a sucker
  at each end
scope: A blood-sucking worm, not a person who lives off the work of others.
examples:
- A leech fastened itself to the swimmer's leg.
- Leeches live in the still water of the pond.
