simpleMeaning: About old Chaldea, its people, their tongue, or their way of life.
scope: 'Also called Chaldaean and Chaldean: it is the word for things of old Chaldea, not for one person
  who lived there and not for a wise man skilled in hidden learning.'
examples:
- The Chaldee songs of the old land told of its people and their ways.
- He read a Chaldee book about the old land and its people.
