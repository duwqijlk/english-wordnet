simpleMeaning: A place in a harbour, next to a pier, where ships are loaded and unloaded or put right,
  and that may have gates to let water in or out
scope: A landing place for ships in a harbour, not a platform built out over the water and not the plant
  with long roots.
examples:
- The ship arrived at the dock more than a day late.
- The men unloaded the cargo at the dock.
