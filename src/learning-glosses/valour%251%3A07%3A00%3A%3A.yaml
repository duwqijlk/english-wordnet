simpleMeaning: The brave heart that a hero or heroine keeps when danger comes, above all in battle.
scope: Valiance, valiancy, valorousness, valor, heroism and gallantry are other names for this sense,
  the brave heart of a hero or heroine facing danger.
examples:
- His valour in battle won him a medal.
- The heroine showed great valour when danger came.
