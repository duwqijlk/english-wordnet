scope: Also called pneumocystis carinii pneumonia, pneumocystis pneumonia, or pneumocytosis, it is a lung
  sickness of babies and people whose body defences are weak.
examples:
- The baby was found to have interstitial plasma cell pneumonia.
- People with AIDS can develop interstitial plasma cell pneumonia.
