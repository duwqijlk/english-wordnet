simpleMeaning: Grown a great deal in warm lands, this woody herb bears flat pods and striking yellow blooms.
scope: It is also called dhal, cajan pea, catjang pea, dahl, pigeon pea and red gram.
examples:
- He grew the pigeon-pea plant for its flat pods and yellow flowers.
- Farmers grow the pigeon-pea plant a great deal in the tropics.
