simpleMeaning: Any one of a number of bean-family plants of western North America that make farm animals
  act strangely when they eat them
scope: 'Also called crazy weed and crazyweed: any one of a number of bean-family plants of western North
  America that make farm animals act strangely, not a plant that farm animals can eat safely and not a
  garden weed.'
examples:
- The cattle sickened after eating locoweed.
- Locoweed grows across the dry western ranges.
