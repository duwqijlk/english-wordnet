simpleMeaning: a thick drink with no lumps, made from fresh fruit crushed and mixed to a liquid, with
  ice cream, yoghurt, or milk
scope: A thick fruit drink, not a person who speaks in a smooth, pleasing way to win people over.
examples:
- She made a banana smoothie with yoghurt and milk.
- He drank a cold strawberry smoothie after his run.
