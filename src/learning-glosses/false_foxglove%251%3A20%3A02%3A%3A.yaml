simpleMeaning: A North American plant living for years, with few branches and clusters of bright yellow
  flowers like foxglove's at the ends of its stems, sometimes placed in genus Gerardia.
scope: This is the yellow-flowered North American plant described, not the true foxglove whose flowers
  it resembles. It is a botanical name, and its placement in Gerardia is given only as a sometimes classification.
examples:
- False foxglove brightened the edge of the meadow in late August.
- Botanists still argue about whether false foxglove belongs in Gerardia.
