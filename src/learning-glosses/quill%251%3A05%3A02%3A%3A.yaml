simpleMeaning: the hollow middle part of a feather
scope: 'Also called shaft: the hollow middle part of a feather, not a stiff spine on an animal, not a
  large wing feather, and not a pen made from a feather.'
examples:
- She held the feather by its quill.
- The hollow quill runs down the middle of the feather.
