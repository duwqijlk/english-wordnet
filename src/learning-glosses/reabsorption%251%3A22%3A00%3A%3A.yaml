simpleMeaning: The body process in which matter made by the body in a formed part breaks down and is taken
  in again
scope: A body process in which matter made by the body breaks down and is taken in again, also called
  resorption; not the taking in of food and not the loss of matter from the body.
examples:
- Reabsorption of the fluid took several days.
- The doctor explained reabsorption to the patient.
