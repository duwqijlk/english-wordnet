simpleMeaning: Masses of large deep-red flowers come out on this small tree of Dominica before its fine,
  feathery leaves.
scope: A small tree of Dominica that bears masses of large deep-red flowers before its leaves come out,
  not one whose leaves come out first.
examples:
- Carib wood bears masses of large deep-red flowers.
- The fine leaves of the carib wood come out after the flowers.
