senseId: 'laugh%1:10:01::'
synsetId: 06790941-n
simpleMeaning: A joke or amusing remark.
scope: The joke itself, not the sound of laughter and not the expression on someone's face; it appears
  chiefly in phrases such as a good laugh or the biggest laugh.
examples:
- He opened with a laugh about the weather that put the audience at ease.
- The film's biggest laugh comes from a single line about the dog.
