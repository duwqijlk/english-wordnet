simpleMeaning: to end a person's job, or to take them out of an office or other post
scope: 'Also called can, fire, sack and displace: to end a person''s job, not to let a person leave after
  a meeting and not to stop thinking about an idea or a court case.'
examples:
- The boss dismissed him for stealing money from the shop.
- She was dismissed from her post after ten years of work.
