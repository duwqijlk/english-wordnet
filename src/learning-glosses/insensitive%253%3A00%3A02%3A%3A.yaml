schema: oewn-learning-gloss-v2
senseId: 'insensitive%3:00:02::'
synsetId: 02114041-a
simpleMeaning: having too little feeling for others, and not thinking or caring about what is right
scope: This sense is about a person who does not feel for others or care about right and wrong, not about
  a body or thing that does not react to pain, heat, or light.
examples:
- The manager was insensitive and laughed when the worker told him about her sick child.
- It was insensitive of him to ignore the old man's pain and walk away.
