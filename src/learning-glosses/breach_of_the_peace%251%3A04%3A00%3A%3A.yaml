simpleMeaning: Any deed that pesters, breaks in on, blocks, stirs up, or wakes folk from rest, or else
  takes from dwellers the calm and quiet that is theirs by right.
scope: This sense is also called disorderly behavior, disorderly conduct, and disturbance of the peace,
  any deed that pesters, breaks in on, blocks, stirs up, or wakes folk from rest, or else takes from dwellers
  the calm and quiet that is theirs by right.
examples:
- Breaches of the peace wake folk from rest.
- The breach of the peace took their calm and quiet.
