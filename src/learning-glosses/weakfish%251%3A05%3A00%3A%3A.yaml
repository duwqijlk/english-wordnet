simpleMeaning: a creature of the sea near the shores of North America, caught for food and sport, with
  a mouth that a hook pulls out of with ease
scope: A creature of the sea off the shores of North America, caught for food and sport, not a freshwater
  creature and not one with a hard mouth that holds a hook.
examples:
- We caught a weakfish off the pier at dusk.
- The weakfish slipped off the hook before he could land it.
