simpleMeaning: showing false pride and thinking far too much of one's own worth
scope: A way of acting that shows false pride; also called swollen, vain, conceited, egotistical, egotistic
  and swollen-headed, and not the same as pride in good work or plain confidence.
examples:
- His self-conceited manner put off everyone in the room.
- She gave a self-conceited speech about her own success.
