simpleMeaning: to do with the American colonies (lands ruled by another country) during the American Revolutionary
  War and just after it
scope: This use is only about the American colonies at the time of their war for freedom; it does not
  mean to do with a whole continent, such as North America or Europe.
examples:
- The Continental Army fought for the freedom of the American colonies.
- She studied the papers of the Continental Congress for her history class.
