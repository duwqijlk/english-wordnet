simpleMeaning: A group in the government of the United States, from nineteen forty-six to nineteen seventy-four,
  that studied the power of the atom and its uses in times of peace.
scope: A government group of the United States that studied the power of the atom for times of peace,
  not for war.
examples:
- The Atomic Energy Commission was set up in nineteen forty-six.
- The Atomic Energy Commission ended its work in nineteen seventy-four.
