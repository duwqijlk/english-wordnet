simpleMeaning: When winter comes, this small warbler is in Africa, having nested among reeds and wedges
  in Europe.
scope: Reedbird, sedge bird and sedge warbler are other names for this small European warbler, and it
  is not the small American wren of wet meadows.
examples:
- A sedge wren nested among the reeds.
- The sedge wren spent the winter in Africa.
