simpleMeaning: to scrape or move over the skin as if to ease an itch
scope: 'Also called scratch: scraping or moving over the skin as if to ease an itch, not cleaning a surface
  with hard strokes and not spreading cream on the skin.'
examples:
- He rubbed the bite on his arm to stop the itch.
- She rubbed her sore eyes until they felt less itchy.
