simpleMeaning: A machine for large mailings that stamps the right paid fee on each piece of mail and keeps
  a count of the whole cost
scope: A machine for large mailings that stamps the right paid fee on each piece of mail and keeps a count
  of the whole cost; not a hand stamp and not a machine that weighs letters.
examples:
- The office used a postage meter for the monthly mailing.
- A postage meter stamped each envelope and added up the cost.
