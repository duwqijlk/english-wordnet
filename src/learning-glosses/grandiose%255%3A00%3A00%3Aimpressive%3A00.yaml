simpleMeaning: So grand and large as to impress, yet more than is needed, said with disapproval.
scope: So grand and large as to impress, yet more than is needed, said with disapproval; not the use for
  a person who puts on grand airs and acts snobbish and haughty.
examples:
- The hall was grandiose, far grander than the small town needed.
- His plans were grandiose, far too grand for the small firm.
