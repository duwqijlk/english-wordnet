simpleMeaning: What is still to come is bad or sad, and the signs of it fill people with fear
scope: 'Also called minatory, threatening, ominous, menacing, sinister, forbidding and baleful: it shows
  bad or sad things still to come, not a kind word and not a plain fact about what will happen.'
examples:
- The minacious clouds gathered over the town.
- His minacious tone made the room fall silent.
