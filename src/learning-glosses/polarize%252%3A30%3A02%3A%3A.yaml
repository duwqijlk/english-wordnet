simpleMeaning: to make something shake back and forth in one fixed pattern, not in all directions at once
scope: To make waves shake in one fixed pattern, not to split people into opposing sides in a fight.
examples:
- The filter can polarize light waves so they move in one direction.
- Scientists polarize the beam to cut out the glare.
