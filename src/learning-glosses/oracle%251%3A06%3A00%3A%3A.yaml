simpleMeaning: a holy place where people go to ask a god questions and hear answers
scope: A holy place for asking a god, not the answer or message from a god, which is another sense of
  this word, and not a wise person who gives answers.
examples:
- The old oracle was a small stone building on the hill.
- At the oracle, visitors waited in silence before they asked their questions.
