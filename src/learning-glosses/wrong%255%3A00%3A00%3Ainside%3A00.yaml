simpleMeaning: the side of a piece of cloth or clothing that is meant to face inward, toward the body
scope: This is about the inner face of fabric, not about mistakes or improper behaviour.
examples:
- Turn the fabric so the wrong side faces up before you sew.
- He had put the sweater on with the wrong side out.
