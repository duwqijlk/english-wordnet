simpleMeaning: the space around a thing that sends out electric and magnetic waves, where those waves
  can push on another thing like it without the two touching
scope: 'Also called a field and a force field: the space around a thing that sends out waves, where the
  waves push on a like thing without touching, not a walled area and not a push made by touch.'
examples:
- The field of force around the radio tower reached the far side of the valley.
- A field of force lets the waves push on a second aerial without touching it.
