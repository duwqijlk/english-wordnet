simpleMeaning: to make other people in a game think you are worse at it than you are, so you can trick
  them, as in games played for money
scope: To hide how well you can play a game so others are tricked, as in games for money. This is not
  the bag full of sand, and not using such bags to protect a place.
examples:
- He sandbagged in the first card games, then won a lot of money.
- Do not sandbag your friends when you play poker for money.
