simpleMeaning: 'An opening piece of music: it is played before a fugue, or before an act in an opera begins'
scope: This is a piece of music at the start, not an early event that comes before something bigger, and
  not playing music or acting as an opening.
examples:
- The orchestra played a short prelude before the opera began.
- She played the prelude that comes before the fugue.
