simpleMeaning: a person whose job is to find people with great skill and get them to join, especially
  in sports or entertainment
scope: A person paid to find skilled new people for sports or entertainment, not a person who finds paths
  through land that no one knows yet.
examples:
- A football scout watched the young player in three matches.
- The film scout signed the singer after hearing her perform live.
