simpleMeaning: a loose piece of clothing made of wool, worn by men and women in Greece long ago
scope: A piece of clothing from Greece long ago, not the small sea animal with a hard covering made of
  eight plates that has the same name.
examples:
- In the museum, the Greek statue wears a chiton made of white wool.
- Men and women in ancient Greece wore a chiton every day.
