simpleMeaning: This point on the compass sits halfway between west and southwest.
scope: Also called west southwest, this is the point on the compass halfway between west and southwest,
  not the point halfway between west and northwest.
examples:
- The wind blew from the WSW all day.
- We walked towards the WSW.
