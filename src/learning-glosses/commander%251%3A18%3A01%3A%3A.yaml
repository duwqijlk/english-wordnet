simpleMeaning: A navy officer with a commission, ranking just below a captain and above the rank that
  comes right after a lieutenant
scope: A senior navy officer, not an army officer in charge of a unit and not a person in charge of others
  in general.
examples:
- The commander led the ship's crew through the storm.
- After years at sea, she rose to commander.
