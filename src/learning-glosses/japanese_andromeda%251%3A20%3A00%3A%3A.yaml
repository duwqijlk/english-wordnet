scope: A broad-leaved evergreen shrub with white flowers; andromeda, lily-of-the-valley tree and Pieris
  japonica are other names for this sense, not a small deciduous shrub or a tree grown for timber.
examples:
- Japanese andromeda flowered in hanging white clusters.
- We planted a Japanese andromeda where its glossy leaves would show.
