simpleMeaning: Sold to mix oil with water, it is a yellow fatty stuff in egg yolk and in many plant and
  animal cells, which the body needs to use fats.
scope: It is found in egg yolk and in many plant and animal cells, but it is not the yolk itself.
examples:
- The lecithin kept the oil mixed with the water.
- Lecithin from egg yolk helps the body use fats.
