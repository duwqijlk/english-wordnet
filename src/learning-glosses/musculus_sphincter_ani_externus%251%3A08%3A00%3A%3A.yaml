simpleMeaning: An outer ring of striped muscle that closes the end of the gut.
scope: An outer ring of striped muscle at the end of the gut; not the inner ring of smooth muscle, and
  not a muscle that opens the gut.
examples:
- The musculus sphincter ani externus tightens to close the gut.
- Damage to the musculus sphincter ani externus can weaken control.
