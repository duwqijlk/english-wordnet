simpleMeaning: The leaves of a bush called Catha edulis, chewed like tobacco or made into a hot drink,
  that lift the mood and wake the body up
scope: Also called cat, kat, khat, qat, quat and Arabian tea; not the leaves of other plants drunk as
  a hot drink.
examples:
- He chewed African tea leaves like tobacco.
- African tea lifted his mood and woke him up.
