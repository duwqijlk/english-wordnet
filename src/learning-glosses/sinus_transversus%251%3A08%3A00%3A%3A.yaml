simpleMeaning: One of a pair of blood channels in the tough covering of the brain that ends in the S-shaped
  channel
scope: One of a pair of blood channels in the tough covering of the brain, also called transverse sinus,
  ending in the S-shaped channel; not the large channel along the top of the head.
examples:
- The sinus transversus carries blood from the back of the head toward the ear.
- Damage to the sinus transversus can slow blood flow out of the brain.
