simpleMeaning: A side part of a church, set apart from the main middle part by rows of tall stone posts
scope: The side part of a church set apart by rows of stone posts, not a walkway between seats and not
  a narrow path through trees.
examples:
- Candles burned in the aisle of the old church.
- They sat in the side aisle near the tall stone posts.
