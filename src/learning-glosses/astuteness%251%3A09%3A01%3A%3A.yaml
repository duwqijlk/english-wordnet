simpleMeaning: The power of the mind to work through an idea to its depths and grasp what lies there.
scope: The power of the mind to work through an idea to its depths and grasp what lies there, also called
  depth, deepness, or profundity; not clever thinking shown in dealings with others, as in trade.
examples:
- Their astuteness let them see the flaw in the theory at once.
- The philosopher's astuteness carried them to the heart of the problem.
