senseId: 'rich%3:00:05::'
synsetId: 88455131-a
simpleMeaning: Making people angry because whoever says or does it is guilty of hypocrisy, claiming one
  standard while living by another.
scope: A statement or situation that provokes anger because the person responsible is acting hypocritically;
  not possessing material wealth, not having an abundant supply of something desirable, not high in mineral
  content or in fuel relative to air, not suggestive of great expense, not of great worth or quality,
  not marked by great fruitfulness, not strong or intense, not very productive, not containing plenty
  of fat, egg or sugar, not pleasantly full and mellow, not affording a large supply, and not the noun
  for wealthy people as a group.
examples:
- “That’s rich,” she said, when he complained about other people being late.
- It seemed rich of the bank to lecture customers about debt after its own bailout.
