simpleMeaning: In chess, a move that attacks the other player's king in a way that cannot be escaped or
  stopped
scope: In chess, a move that traps the king, not a South American drink and not having sex.
examples:
- With one more move he delivered mate and won the game.
- She saw the mate coming and tried to block it.
