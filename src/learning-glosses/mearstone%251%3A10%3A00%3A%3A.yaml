simpleMeaning: Long ago, a heap of rocks with a tall flat rock set on top served as the old way to mark
  where one piece of land ended.
scope: Also called meerestone and merestone, it was an old name for a heap of rocks that marked where
  one piece of land ended.
examples:
- The old mearstone still stood at the edge of the field.
- Walkers looked for the mearstone to know where the land ended.
