senseId: 'rehabilitation%1:04:00::'
synsetId: 00269862-n
simpleMeaning: the act of changing poor, unused land so that people can live on it or grow plants on it
scope: 'Also called renewal and reclamation: this sense is about making poor land fit for living on or
  for growing plants. It is not about treatment to help a hurt body get better, and not about bringing
  back a person''s good name.'
examples:
- The rehabilitation of the wasteland turned dry fields into farms.
- Through rehabilitation, the empty land became a place where families could live and grow food.
