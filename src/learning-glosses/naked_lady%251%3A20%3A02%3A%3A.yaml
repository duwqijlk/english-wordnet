simpleMeaning: From western and central Europe, a herb that grows from a bulb blooms in autumn with white,
  purple, or lavender-and-white flowers.
scope: It is also called autumn crocus and meadow saffron, and it is a bulb herb that blooms in autumn,
  not the South African amaryllis of the same name.
examples:
- The naked lady bloomed in autumn with lavender-and-white flowers.
- A naked lady grows from a bulb in western Europe.
