simpleMeaning: A rough, bushy plant that lives for one year, with leaves shaped like a hand and bunches
  of small green flowers, giving strong fibres and drugs that dull the senses.
scope: Any plant of the group called Cannabis, also called hemp, not the drug made from its dried leaves.
examples:
- Cannabis grows tall in the field behind the farm.
- The farmer cut the cannabis plants for their fibres.
