simpleMeaning: work clothes, usually in the plural, made of strong cotton cloth such as denim, usually
  trousers with a front piece covering the chest and straps over the shoulders.
scope: This is not the loose protective garment worn over other clothes; it is the denim work trousers
  with a chest piece and shoulder straps.
examples:
- The farmer wore denim overalls and a straw hat.
- He kept a pencil in the pocket of his overalls.
