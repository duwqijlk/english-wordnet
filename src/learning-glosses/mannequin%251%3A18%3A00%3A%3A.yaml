simpleMeaning: a woman who wears fashionable clothes to show them to people
scope: 'Also called model and manikin: a real woman who shows clothes by wearing them, not a figure made
  to stand in a shop window.'
examples:
- The mannequin wore a long red dress so buyers could see how it looked.
- She worked as a mannequin, walking in front of the crowd in the season's clothes.
