simpleMeaning: A common sweet-smelling herb that lives many years, from Eurasia, with round yellow flower
  heads and bitter feathery leaves sometimes used as medicine.
scope: A common sweet-smelling herb of Eurasia, close to other bitter-leaved herbs with yellow flower
  heads; also called tansy, golden buttons and scented fern.
examples:
- Tanacetum vulgare grew wild along the old wall.
- She cut Tanacetum vulgare for its bitter leaves.
