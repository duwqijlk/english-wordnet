simpleMeaning: Said of a thing that does not let rays used to see inside the body or other rays pass through
scope: 'Also called radiopaque: said of a thing that stops rays used to see inside the body or other rays,
  not of a thing that lets them pass almost fully.'
examples:
- Barium sulfate is radio-opaque, so it shows up on the picture.
- The radio-opaque plate stopped the rays from passing through.
