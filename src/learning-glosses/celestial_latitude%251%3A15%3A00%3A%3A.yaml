senseId: 'celestial_latitude%1:15:00::'
synsetId: 08650469-n
simpleMeaning: In astronomy, how far an object stands north or south of the sky's equator, measured in
  degrees; with right ascension it fixes a spot in the sky.
scope: Another name for declination and dec, the sky coordinate measured from the celestial equator; not
  earthly latitude.
examples:
- The star's celestial latitude told astronomers how far north of the sky's equator it lay.
- To pin down a faint object, she recorded its right ascension and celestial latitude.
