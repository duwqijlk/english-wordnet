simpleMeaning: Money or things given to a religious group for the group's religious use
scope: This is money or things given to a religious group for religious use, not a thing put forward as
  a deal and not the act of saying you will give something.
examples:
- The offering at the Sunday service went to help the poor.
- She placed her offering in the plate as it passed down the row.
