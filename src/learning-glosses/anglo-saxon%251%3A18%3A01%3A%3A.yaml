senseId: 'anglo-saxon%1:18:01::'
synsetId: 09721530-n
simpleMeaning: A person whose family roots lie with the early English-speaking peoples, especially in
  Britain, whose first language is English and whose way of life is strongly shaped by English ways.
scope: A person of this background, not a native of England before the Norman Conquest, and not the language
  or the adjective sense.
examples:
- As an Anglo-Saxon, she grew up speaking English in a home shaped by English customs.
- His ancestors were not just British, they were Anglo-Saxons.
