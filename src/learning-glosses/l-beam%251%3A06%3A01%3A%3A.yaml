simpleMeaning: A long piece of wood or metal, shaped like the letter L when you cut across it.
scope: A long piece of material cut in the shape of the letter L, not a flat board or a round post.
examples:
- The builders used an L-beam to hold up the corner of the roof.
- This L-beam fits into the frame where two walls meet at a right angle.
