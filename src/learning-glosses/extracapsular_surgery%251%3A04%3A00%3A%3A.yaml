simpleMeaning: While the back of the lens case stays whole and holds the new lens, an eye operation for
  a cloudy lens takes out only the front of the lens.
scope: This is the kind of eye operation that takes out only the front of a cloudy lens, not the whole
  lens.
examples:
- The extracapsular surgery took out only the front of the cloudy lens.
- After the extracapsular surgery, the new lens sat in the back of the case.
