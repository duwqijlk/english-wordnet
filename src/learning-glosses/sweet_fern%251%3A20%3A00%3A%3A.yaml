simpleMeaning: Its feathery leaves give off a nice smell, and the tiny white blooms mark this leaf-shedding
  bush of the east of North America.
scope: Among the bushes of the east, this one is known by its feathery leaves, its nice smell, and its
  tiny white blooms.
examples:
- The sweet fern by the path had tiny white blooms.
- We brushed past a sweet fern and caught its nice smell.
