simpleMeaning: Like the blade of a dandelion, this green blade has deep cuts along its edges, with the
  points or teeth between the cuts bending back toward the base.
scope: This leaf has deep cuts along its edges, with the points or teeth bending back toward the base,
  like a dandelion leaf and unlike one with plain smooth edges.
examples:
- We found a runcinate leaf among the dandelions.
- I can tell a runcinate leaf by the teeth that bend back toward the base.
