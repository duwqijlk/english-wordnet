simpleMeaning: Much sweet juice flows from the bunches of red flowers at the ends of this bushy shrub
  of eastern Australia, which stands upright.
scope: 'Also called honey-flower and honeyflower: a bushy shrub of eastern Australia, its red flowers
  in bunches at the ends of its stems giving much sweet juice.'
examples:
- Mountain devil grows in eastern Australia with red flowers at the ends of its stems.
- We saw a mountain devil with bunches of red flowers.
