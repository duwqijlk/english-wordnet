simpleMeaning: the brown color skin gets after a person spends time in the sun
scope: This brown color on the skin is also called a tan; it is not sunburn, which hurts the skin, and
  not sunstroke, which makes a person ill.
examples:
- She came back from the beach with a deep suntan.
- His suntan faded during the winter months.
