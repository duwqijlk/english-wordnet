simpleMeaning: A shore bird that nests in the far north and spends the winter in the far south.
scope: 'Also called a knot or a grayback: a shore bird that nests in the Arctic and winters in the Southern
  Hemisphere, not a duck and not a bird that stays north all year.'
examples:
- The greyback nests on the Arctic tundra in summer.
- Greybacks fly south to spend the winter in the Southern Hemisphere.
