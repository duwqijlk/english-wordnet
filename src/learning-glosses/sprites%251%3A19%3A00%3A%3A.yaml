simpleMeaning: Round flashes of red light made by electricity in the air, pink to dark red, lasting 10
  milliseconds and rising up to 60 miles high, sometimes seen with elves
scope: 'Also called red sprites: these are short red flashes high in the air, not small magical people
  in stories and not low lightning in a storm.'
examples:
- Sprites appeared for a moment high above the storm clouds.
- Scientists filmed sprites rising far above the clouds at night.
