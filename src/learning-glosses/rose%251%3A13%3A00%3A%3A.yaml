simpleMeaning: a pale pink table wine made from red grapes whose skins are taken out soon after fermentation
  begins.
scope: This is not the pink flower, the pink color, or a full red wine; it is a light pink wine made by
  removing the grape skins early.
examples:
- We ordered a bottle of dry rosé with lunch.
- The south of France is famous for its pale rose wine.
