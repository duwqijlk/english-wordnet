senseId: anorexic%5:00:00:thin:03
synsetId: 00992003-s
simpleMeaning: Said of a person who has the illness called anorexia nervosa, and is thin in a way that
  harms the body.
scope: Also called anorectic; suffering from anorexia nervosa and pathologically thin, not the noun sense
  of a person with the illness.
examples:
- The anorexic girl was far too thin for her height.
- Doctors worried that the anorexic patient was not eating enough.
