simpleMeaning: the act of stealing things that are out for sale in a store
scope: The act of stealing things from a store, also called shrinkage; not stealing from a home, and not
  the person who does the stealing.
examples:
- He was charged with shoplifting after taking a watch from the store.
- The shop put in cameras to stop shoplifting.
