simpleMeaning: Shaking and trembling of the earth's surface, caused by movement deep below along a crack
  or by a volcano
scope: 'Also called an earthquake, a quake, or a temblor: shaking of the earth''s surface from movement
  below, not a rock fall and not the slow settling of the ground.'
examples:
- The seism shook the town for a few seconds.
- A strong seism can crack walls and roads.
