simpleMeaning: A careful, orderly account that explains one topic, usually in writing.
scope: 'Also called expounding: a systematic explanation of one topic, usually written, not the music
  section where the main themes first appear and not a public display of things.'
examples:
- Her exposition of the theory filled two chapters.
- The book is an exposition of the new law.
