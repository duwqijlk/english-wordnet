simpleMeaning: The part of the study of the stars that looks at how the universe began, how it changed,
  and how it is put together.
scope: This is the part of the study of the stars that looks at how the universe began, how it changed,
  and how it is put together; cosmology and cosmogony are other names for this sense, not the study of
  one star and not a story about how the world was made.
examples:
- Cosmogeny asks how the universe began.
- She read a book on cosmogeny.
