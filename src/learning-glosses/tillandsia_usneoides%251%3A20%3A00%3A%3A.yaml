simpleMeaning: Dense hanging bunches of grey-green hairlike wavy strands, fixed to tree trunks and branches
  by few wiry roots; from the southeastern United States and the West Indies to South America.
scope: Also called black moss, long moss, old man's beard and Spanish moss; hanging grey-green strands
  fixed to tree trunks and branches by few wiry roots, not a plant that grows in the ground.
examples:
- Tillandsia usneoides hung from the oak trees along the road.
- We saw Tillandsia usneoides draped over the branches in the garden.
