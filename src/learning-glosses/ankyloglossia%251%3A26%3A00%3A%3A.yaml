senseId: 'ankyloglossia%1:26:00::'
synsetId: 14495695-n
simpleMeaning: A fault from birth in which the skin under the tongue is too short, so the tongue cannot
  move freely.
scope: 'Also called tongue tie: a fault from birth that keeps the tongue from moving freely, not a tongue
  hurt in an accident.'
examples:
- Ankyloglossia is a fault from birth that keeps the tongue from moving freely.
- His tongue could not lift because of ankyloglossia.
