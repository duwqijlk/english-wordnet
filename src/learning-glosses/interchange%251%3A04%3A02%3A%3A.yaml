simpleMeaning: giving money and getting back the same value in return, especially money of one country
  for money of another country
scope: Also called exchange, this is swapping money for the same value, especially between countries;
  it is not a general giving and taking of facts and news and not a place where roads join.
examples:
- The interchange of dollars for euros happens at the bank.
- She paid a small fee for the interchange of money between countries.
