simpleMeaning: A set of rules made in the 1970s for the internet, so that one machine on a network can
  send facts to another machine.
scope: A set of rules for the internet, made in the 1970s so machines on a network can send facts to each
  other, also called the transmission control protocol/internet protocol, unlike rules that move facts
  within a single machine only.
examples:
- Our office network uses TCP/IP to move data between computers.
- TCP/IP was made in the 1970s for the early internet.
