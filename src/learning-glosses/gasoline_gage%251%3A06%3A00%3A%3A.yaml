simpleMeaning: A dial that shows how much fuel is left in the tank of a vehicle.
scope: This is a dial that shows how much fuel is left in a tank; gas gage, gas gauge, gasoline gauge,
  petrol gage and petrol gauge are other names for this sense, not a dial that shows speed and not a pump
  that puts fuel in a tank.
examples:
- The gasoline gage showed the tank was nearly empty.
- I checked the gasoline gage before the long drive.
