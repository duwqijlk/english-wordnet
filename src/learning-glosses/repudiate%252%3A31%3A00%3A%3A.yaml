simpleMeaning: To refuse to accept that something counts or has been agreed; to treat it as if it were
  not real
scope: To refuse to accept something as agreed or as counting, not just to say that a claim is untrue
  or unfair.
examples:
- The woman repudiated the divorce settlement and refused to accept it.
- The government repudiated the agreement, saying it had no legal force.
