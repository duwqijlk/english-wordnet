senseId: 'splice%1:06:01::'
synsetId: 04289136-n
simpleMeaning: a place where two things, such as paper, film, or tape that can record sound, have been
  joined together
scope: The place where two pieces have been joined, such as paper, film or tape that can record sound,
  not the act of joining them and not a break in one piece.
examples:
- The break was at an old splice in the film.
- You can see the splice where the two pieces of tape join.
