simpleMeaning: trousers that fit tight and are used in the plural, usually made of tartan cloth
scope: Tight-fitting trousers, usually of tartan, used in the plural; not loose trousers and not a kilt.
examples:
- His trews were tight and made of green tartan.
- She bought a pair of trews in a tartan pattern for the dance.
