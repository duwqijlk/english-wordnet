simpleMeaning: plants that grow in clumps, mostly in warm lands, thin and bare like small hand brooms,
  with no roots
scope: A thin bare plant of warm lands that grows in clumps with no roots, not a leafy fern.
examples:
- The whisk fern grew in a bare clump on the warm rock.
- A whisk fern has no roots, only thin green stems.
