simpleMeaning: Leaves that stay green all year and pale yellow flowers mark this shrub from Europe, covered
  in pale grey hairs
scope: This shrub from Europe is also called silver-bush, and it is not the North American shrub of the
  same name that loses its leaves in winter.
examples:
- The silverbush was in flower.
- The silverbush kept its leaves through the winter.
