simpleMeaning: a number, or a comparison of two numbers, worked out from facts that have been seen, which
  can show how much things have changed compared with before, over time
scope: A number worked out from facts that shows change over time; index is another name for this sense,
  not a chemical that changes colour.
examples:
- The unemployment rate is an important economic indicator.
- This indicator shows how prices have changed over the year.
