simpleMeaning: Land stays covered for good under frozen water and snow, in a wide stretch such as the
  polar lands or the top of a mountain.
scope: Also called icecap, it is a wide stretch of land that stays covered with frozen water and snow
  for good.
examples:
- The polar lands lie under an ice cap.
- The ice cap on the mountain top never melts away.
