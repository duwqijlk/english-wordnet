simpleMeaning: A theory of organic evolution saying that traits a living thing gains in its life are passed
  on to its young.
scope: A theory of organic evolution saying traits gained in life pass to the young; its near kin are
  other theories of evolution, such as Darwin's theory of natural selection.
examples:
- Lamarckism says traits gained in life pass to the young.
- Lamarckism was an early theory of evolution.
