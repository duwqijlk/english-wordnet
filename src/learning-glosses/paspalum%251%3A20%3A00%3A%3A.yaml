simpleMeaning: a tall grass from warm parts of America, growing in thick clumps and living for years,
  now wild in the south of the United States as feed for farm animals
scope: 'Also called dallis grass and dallisgrass: a tall grass now wild in the south of the United States,
  feeding farm animals, not a lawn grass and not a grain crop.'
examples:
- Paspalum grows in thick clumps across the field.
- Farmers plant paspalum for their cattle to graze.
