simpleMeaning: The lasting hold of paints and glues comes from this tough man-made sticky stuff.
scope: Also called alkyd resin, the name marks the tough man-made stuff that gives paints and glues their
  lasting hold.
examples:
- The painters mixed alkyd into the paint for a lasting coat.
- The glue owed its lasting hold to the alkyd in it.
