simpleMeaning: Put on top of what is already there, this extra layer guards it, such as paint or varnish
scope: An extra layer put on top to guard what lies under it, also called overcoat; not the first coat
  of paint and not a coat worn for warmth.
examples:
- The overcoating of varnish kept the wood dry.
- He put an overcoating of paint on the old door.
