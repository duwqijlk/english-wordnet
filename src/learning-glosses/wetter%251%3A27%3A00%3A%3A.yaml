simpleMeaning: a chemical that is put into a liquid, spreads fully through it, and can lower its surface
  tension (the tight pull at the top of a liquid)
scope: Also called surfactant, surface-active agent and wetting agent, this is a chemical for use in a
  liquid, not a worker who wets work and not a person who wets the bed while asleep.
examples:
- The farmer added a wetter to the spray so it would spread over the leaves.
- This wetter helps the liquid cover the surface more evenly.
