simpleMeaning: made of many single living things joined together to form one whole group or colony
scope: Says a living thing is made of many small living things joined as one group; not the wider sense
  of a thing made of two or more parts, and not a chemical substance.
examples:
- Coral is a compound animal made of many tiny living things joined together.
- A compound organism like coral is really many small animals living as one.
