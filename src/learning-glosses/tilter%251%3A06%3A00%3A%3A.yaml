simpleMeaning: a tool for pouring out a barrel while it leans over, so the bits at the bottom stay still
scope: A tool for draining a barrel by leaning it over without stirring the bits at the bottom, not a
  tap and not a pump.
examples:
- He used a tilter to drain the cask of ale.
- With the tilter, the wine came out clear and the dregs stayed put.
