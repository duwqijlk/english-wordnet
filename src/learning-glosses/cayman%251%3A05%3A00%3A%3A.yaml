simpleMeaning: With a belly covered in thicker hard plates than an alligator's, this scaly animal lives
  partly in water and partly on land in Central and South America.
scope: Also called caiman, this is a scaly animal of Central and South America like an alligator, not
  an alligator itself.
examples:
- The cayman lives partly in water and partly on land.
- A cayman's belly is covered in thick hard plates.
