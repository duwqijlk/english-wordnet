simpleMeaning: A tall plant that lives for years, with hairy stems and leaves, widely grown for its large
  uneven tubers that people eat.
scope: A tall plant grown for its large uneven tubers, not a sunflower grown for its seeds.
examples:
- The girasol grew taller than the fence by late summer.
- They dug up girasol tubers to cook for dinner.
