simpleMeaning: a bad head pain that keeps coming back, caused by blood flow in the head, and seen more
  often in women than in men
scope: A bad head pain that keeps coming back, caused by blood flow in the head, also called migraine,
  hemicrania, or megrim; not a head pain from a cold and not a head pain from a blow.
examples:
- She gets a sick headache every few weeks.
- His sick headache kept him in bed all day.
