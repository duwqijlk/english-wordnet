simpleMeaning: A showy shrub or small tree of swampy ground in the south-western United States, with big
  pink or white sepals, giving Georgia bark for treating fever.
scope: This sense is a showy shrub or small tree of swampy ground in the south-western United States,
  with big pink or white sepals, giving Georgia bark for treating fever, also called bitter-bark, unlike
  the sense for any of several trees with leaves or bark used to allay fever or thought to mark regions
  free of fever, and unlike the sense for a tall fast-growing timber tree with leaves holding a medicinal
  oil, whose young leaves are bluish.
examples:
- The fever tree grows in swampy ground.
- Fever trees give Georgia bark.
