simpleMeaning: A tall rough herb of Europe and Asia with yellow flowers like daisies, with thin petals,
  whose thick underground roots are used as medicine
scope: Also called elecampane; a tall herb with yellow flowers like daisies, used for its roots.
examples:
- Inula helenium grew at the edge of the field, its yellow flowers open to the sun.
- The gardener dug up Inula helenium for its thick roots.
