simpleMeaning: a very brief, strong release of light or other energy
scope: A short, powerful burst of light or energy, not just a moment of brightness on a surface, and not
  a light burst used to send a signal.
examples:
- A flash of lightning lit up the whole sky.
- There was a blinding flash as the fireworks went off.
