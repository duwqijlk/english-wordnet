simpleMeaning: a tiny part inside a plant cell that holds colours other than the green of leaves, usually
  yellow or orange colours called carotenoids
scope: A tiny part inside a plant cell that holds colours other than the green of leaves, usually yellow
  or orange colours called carotenoids; not the green part that makes food and not the cell wall.
examples:
- Chromoplasts give the carrot its orange colour.
- The chromoplast in the petal held a bright orange colour.
