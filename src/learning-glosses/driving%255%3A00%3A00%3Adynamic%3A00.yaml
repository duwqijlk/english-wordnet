simpleMeaning: having the force needed to push something forward or to make things happen.
scope: This is not the golf stroke, and not the act of operating a vehicle; it describes a force or urge
  that pushes something on.
examples:
- Curiosity was the driving force behind her research.
- He has a driving need to be the best in his field.
