simpleMeaning: A sea animal with thick soft hair, found on the Pacific coast of California and to the
  south of it.
scope: A sea animal with thick soft hair, found on the Pacific coast of California and further south,
  not a sea lion and not a fur seal of Alaska.
examples:
- The guadalupe fur seal breeds on islands off Mexico.
- Guadalupe fur seals were once hunted almost to nothing.
