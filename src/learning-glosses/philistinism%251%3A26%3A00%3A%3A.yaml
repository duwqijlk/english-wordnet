simpleMeaning: A strong wish for wealth and things, with little care for what is right or for matters
  of the spirit.
scope: A strong wish for wealth and things, with little care for what is right or for matters of the spirit;
  materialism is another name for this sense, not simple greed for food and not a love of art.
examples:
- Critics accused him of philistinism for scorning the arts.
- Philistinism values money above books and music.
