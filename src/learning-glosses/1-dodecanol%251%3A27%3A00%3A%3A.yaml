simpleMeaning: a colourless solid that does not dissolve in water, a kind of alcohol used to make soaps
  for washing and medicines
scope: A colourless solid that does not dissolve in water, a kind of alcohol, also called lauryl alcohol;
  not a liquid alcohol and not a soap.
examples:
- 1-dodecanol is used to make detergents.
- The makers add 1-dodecanol to the soap.
