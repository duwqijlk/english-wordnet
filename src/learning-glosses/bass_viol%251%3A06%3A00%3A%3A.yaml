simpleMeaning: a stringed instrument that plays the low part in its family of bowed instruments, with
  about the range of the cello
scope: A low stringed instrument of the viol family, also called gamba; not a cello and not a double bass.
examples:
- She played the bass viol in the early music group.
- The bass viol sounds lower than the cello in that piece.
