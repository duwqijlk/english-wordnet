simpleMeaning: A foe that can be wiped out for using atom bombs will not use them, and that is the idea
  in war
scope: A war idea that holds a foe back from using atom bombs, not a plan to build more bombs and not
  a ban on all weapons.
examples:
- Both sides relied on nuclear deterrence to keep the peace.
- The two nations kept nuclear deterrence as the heart of their defence.
