simpleMeaning: an advertisement, usually printed on a page or on a small sheet of paper, made to reach
  many people
scope: 'Also called a bill, and another name for it is a flier: a printed advertisement for many people,
  not the word for round or for moving in a circle.'
examples:
- The shop sent a circular to every house on the street.
- She read the circular about the sale before throwing it away.
