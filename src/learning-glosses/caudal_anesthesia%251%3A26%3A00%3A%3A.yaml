synsetId: 14051888-n
simpleMeaning: Regional numbing from a shot into the low tip of the spine canal, deadening one region
  of the body, now largely replaced by epidural numbing.
scope: Regional anesthesia from an injection into the caudal end of the spinal canal; also called caudal
  anaesthesia and caudal block.
examples:
- Caudal anesthesia numbed his lower body.
- The doctor used caudal anesthesia.
