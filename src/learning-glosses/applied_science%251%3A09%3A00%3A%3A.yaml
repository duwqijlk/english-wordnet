simpleMeaning: the field of study that uses what is known about nature to solve real problems
scope: 'Also called technology, engineering, and engineering science: the use of knowledge about nature
  to fix real problems, not the search for new knowledge on its own.'
examples:
- He had trouble deciding which branch of applied science to study.
- She chose applied science because she wanted to solve real problems.
