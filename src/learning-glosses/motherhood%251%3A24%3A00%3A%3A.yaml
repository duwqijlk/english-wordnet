simpleMeaning: the family tie between a child and its mother
scope: The family tie between a child and its mother, with maternity as another name for this sense; not
  the time of being a mother and not motherly care.
examples:
- Motherhood is the tie that joins a child to its mother.
- Her motherhood is the tie between her and her child.
