simpleMeaning: A hot oven where a dead body is burned until only ash is left
scope: A furnace for burning a dead body to ash, also called a cremation chamber and a crematorium; not
  a room for burial and not a place for keeping bodies.
examples:
- The crematory stood at the back of the funeral home.
- They took the body to the crematory after the service.
