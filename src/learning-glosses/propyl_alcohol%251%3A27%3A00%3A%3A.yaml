simpleMeaning: a clear liquid with no colour that dries up fast, used to dissolve other things and to
  kill germs on skin
scope: A clear liquid with no colour that dries up fast, used to dissolve other things and to kill germs;
  also called propanol; not drinking alcohol, and not water.
examples:
- Propyl alcohol dries up fast when it is spilt on the bench.
- The nurse wiped the skin with propyl alcohol before the injection.
