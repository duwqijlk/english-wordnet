simpleMeaning: any of the main blood channels that carry blood back to the heart in grown animals of early
  kinds with backbones and in embryos of later ones
scope: Not an artery and not a small blood vessel; it is one of the main channels that return blood in
  grown animals of early kinds with backbones and in embryos of later ones.
examples:
- The cardinal vein carries blood from the head in the embryo.
- In the shark, a cardinal vein runs along each side of the body.
