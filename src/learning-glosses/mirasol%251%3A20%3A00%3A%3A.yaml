simpleMeaning: Found all over the United States and much of North America, this sunflower lives one year
  and is grown to feed farm animals and for seeds that give oil
scope: 'Also called a common sunflower: a sunflower that lives one year and is grown for its seeds and
  to feed farm animals, not a sunflower grown only for show.'
examples:
- The farmer planted mirasol for silage and oil.
- Mirasol is found all over the United States and much of North America.
