simpleMeaning: the years from 1920 to 1933 in the United States, when the country's basic laws were changed
  to make selling drinks with alcohol in them against the law
scope: This is the name for those years in the United States. It is not the general act of forbidding
  something, and not a single law or order that forbids something.
examples:
- During Prohibition, selling alcohol was against the law in the United States.
- Many people still drank alcohol in secret during Prohibition.
