simpleMeaning: Fitting closely or pressing in so that little space is left, or being squeezed.
scope: This is the general squeezed or space-limited sense, as in clothing, a fist or the chest, not stretched
  straight like a rope, pressed shut like lips, or fixed firmly in place.
examples:
- The collar was so tight that he could barely turn his head.
- Her chest felt tight whenever she thought about the exam.
