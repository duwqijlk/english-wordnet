simpleMeaning: Said of words that blame a person, meant to set them right and stop them doing wrong.
scope: Words that blame a person in order to set them right; also called reproachful, reproving, or admonishing.
examples:
- Her admonitory tone made the children sit up straight.
- The admonitory letter warned him to change his ways.
