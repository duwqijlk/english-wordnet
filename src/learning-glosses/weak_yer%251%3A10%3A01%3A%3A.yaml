simpleMeaning: In a modern Slavic tongue, a sound that began as a half-vowel shrank to almost nothing
  and then vanished.
scope: This is the sound in a modern Slavic tongue that shrank to almost nothing and then vanished, not
  the strong yer, which stayed full.
examples:
- In the word, the weak yer had gone.
- The weak yer in the middle of the word disappeared.
