simpleMeaning: a plan of car cover where a person hurt in a crash gets money, up to a set sum, from their
  own cover firm, whoever caused it
scope: A plan of car cover where a hurt person is paid by their own firm no matter who caused the crash;
  no fault automobile insurance is another name for this, not cover that pays only when the other driver
  is at fault and not health cover.
examples:
- No fault insurance means each driver claims from their own firm.
- After the crash she used her no fault insurance to pay for repairs.
