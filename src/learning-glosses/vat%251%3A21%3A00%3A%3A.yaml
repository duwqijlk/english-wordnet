simpleMeaning: a tax on the worth of goods, taken by the shop that sells them to the buyer
scope: Also called value-added tax, goods and service tax, or GST; a tax on goods at the point of sale,
  not income tax and not a customs duty.
examples:
- VAT is added to the price at the till.
- The shop must pay VAT on what it sells.
