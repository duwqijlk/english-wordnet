simpleMeaning: The armed forces of another land taking charge of a land and running it
scope: This is rule by the armed forces of a foreign land, not rule by a country's own soldiers and not
  a foreign land's rule through trade or diplomacy.
examples:
- After the invasion, the country lived under military control for five years.
- The generals imposed military control on the occupied land.
