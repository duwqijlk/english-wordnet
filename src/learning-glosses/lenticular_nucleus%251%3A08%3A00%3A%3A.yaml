simpleMeaning: a small group of nerve cells deep in the brain, shaped like a lens, with an outer red part,
  the putamen, and an inner pale yellow part, the pallidum
scope: 'Also called lentiform nucleus: a lens-shaped group of nerve cells deep in the brain, not a nerve
  and not another part of the brain.'
examples:
- The scan showed the lenticular nucleus deep in the brain.
- The lenticular nucleus has an outer red part and an inner pale yellow part.
