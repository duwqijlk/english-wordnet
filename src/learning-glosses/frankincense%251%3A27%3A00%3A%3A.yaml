simpleMeaning: Once prized in worship and in readying the dead, a sweet-smelling gum resin from trees
  in Arabia or East Africa, burned to fill a place with smoke.
scope: Also called thus, gum olibanum, and olibanum, this is a sweet-smelling gum resin from trees in
  Arabia or East Africa.
examples:
- Frankincense burned in the temple.
- The gift of frankincense was laid beside the gold.
