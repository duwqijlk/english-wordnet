simpleMeaning: A way of thinking in politics or religion that goes back to older ideas, against the freer
  or more radical ideas of the 1960s.
scope: A way of thinking in politics or religion that goes back to older ideas, not the freer ideas of
  the 1960s and not a wish to change things fast.
examples:
- His neoconservatism looked back to older ideas in politics.
- Neoconservatism grew as an answer to the freer ideas of the 1960s.
