simpleMeaning: to travel from place to place mending pots, pans, and other metal things for a living
scope: To travel from place to place mending pots, pans, and other metal things for a living; not to potter
  about with no plan, and not to play with machines for fun.
examples:
- He tinkered from town to town, mending kettles for a few coins.
- In those days he tinkered his way across the country, fixing pots.
