simpleMeaning: a medicine that kills the tiny living things that cause illness, made from mould or from
  germs themselves
scope: A drug that kills germs and cures illness caused by them, not the adjective sense meaning of or
  relating to such drugs.
examples:
- When antibiotics were first found, people called them wonder drugs.
- The doctor gave her an antibiotic for the infection.
