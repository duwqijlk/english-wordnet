simpleMeaning: a person who sews clothes together with long, loose stitches
scope: This is a person who sews clothes with long loose stitches, and baster is another name for this
  sense, not a worker who fastens things with small nails or quick welds.
examples:
- The tacker held the sleeve in place with long loose stitches.
- Before the tailor finished the jacket, the tacker stitched the lining to the coat.
