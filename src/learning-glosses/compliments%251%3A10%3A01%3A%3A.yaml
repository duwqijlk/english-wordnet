simpleMeaning: Kind words, usually more than one, given to a person to show you want them to be well and
  happy.
scope: 'Also called a wish or a regard: kind words that wish a person well, not praise for something they
  did.'
examples:
- Please give my compliments to your mother.
- She sent her compliments to her aunt, hoping she was well.
