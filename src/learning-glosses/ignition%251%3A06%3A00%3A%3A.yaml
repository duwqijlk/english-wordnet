simpleMeaning: the parts of an engine that burns its fuel inside itself, which set the fuel alight so
  the engine can run
scope: The parts that light the fuel in an engine that burns fuel inside itself, not the start of burning
  itself.
examples:
- The mechanic checked the ignition before he started the engine.
- A fault in the ignition stopped the engine from starting.
