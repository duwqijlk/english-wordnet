simpleMeaning: a machine for printing in which the letters sit on a level bed while a round drum holding
  paper rolls over them
scope: 'Also called a cylinder press: a printing machine with letters on a level bed and a drum that rolls
  over them, not a hand press and not a machine that prints on a moving belt.'
examples:
- The flatbed press printed the posters in the workshop.
- A flatbed press rolls the paper over the type.
