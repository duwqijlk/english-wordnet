simpleMeaning: To set a thing straight up and down, using a weighted line to check it.
scope: To set a thing straight up and down with a weighted line, not to look into a thing in depth, not
  the metal weight itself, and not standing straight up and down.
examples:
- The builder plumbed the wall before the plaster dried.
- He plumbed the post to make it stand straight.
