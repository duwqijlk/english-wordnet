simpleMeaning: Acting in line with the law, the custom, or the usual way of doing things
scope: Acting in line with the law, custom, or usual practice, not giving praise and not keeping a promise.
examples:
- The honoring of old customs kept the village feast alive.
- His honoring of the rules won him the trust of his men.
