simpleMeaning: a place that helps people without work find work, and helps bosses find workers for open
  jobs
scope: 'Also called employment office: a place that helps people without work find work, and helps bosses
  find workers for open jobs, not a place that trains people for work and not a boss hiring on his own.'
examples:
- She went to an employment agency to look for a job as a cook.
- The employment agency sent three workers to fill the open posts at the factory.
