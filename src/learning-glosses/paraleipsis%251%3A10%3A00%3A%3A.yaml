senseId: 'paraleipsis%1:10:00::'
synsetId: 07119399-n
simpleMeaning: Saying very little on purpose, so that much that matters is left out yet still hinted at.
scope: Saying little on purpose to hint at much left out, also called paralepsis and paralipsis; not irony
  and not plain understatement.
examples:
- Her paraleipsis left the crowd to guess the worst.
- He used paraleipsis, naming one fault and letting the rest hang in the air.
