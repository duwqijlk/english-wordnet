simpleMeaning: This check of the unborn baby before birth works by looking straight at it in the womb
  and taking a small amount of its blood.
scope: Also called foetoscopy, this names the check of an unborn baby before birth that looks straight
  at the baby in the womb and takes a small amount of its blood.
examples:
- The fetoscopy let the team see the baby and take a blood sample.
- She had a fetoscopy to check the baby's health before birth.
