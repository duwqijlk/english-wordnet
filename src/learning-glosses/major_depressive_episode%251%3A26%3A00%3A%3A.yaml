senseId: 'major_depressive_episode%1:26:00::'
synsetId: 14413871-n
simpleMeaning: 'In psychiatry, a bout of severe low mood with classic signs: loss of pleasure, tiredness,
  poor sleep, despair, grim thoughts, feeling worthless; sometimes suicide attempts, but no known physical
  cause.'
scope: A single period of serious depression recognized in psychiatry, with no physical cause; not ordinary
  sadness or grief, and not the ongoing disorder that such periods can be part of.
examples:
- After weeks of fatigue and loss of interest, she was diagnosed with a major depressive episode.
- His major depressive episode had no apparent physical trigger, so treatment focused on therapy.
