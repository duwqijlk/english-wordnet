simpleMeaning: (Of loans) asking for only a fairly small extra sum on the money lent.
scope: Of loans, asking for only a fairly small extra sum on the money lent, not a loan that asks for
  a large extra sum.
examples:
- They took out a low-interest loan to buy the house.
- The bank offered a low-interest rate on the new loan.
