scope: 'It is also called mussel shrimp and seed shrimp: the tiny shelled creature whose prawn-like body
  sits shut inside a shell of two parts.'
examples:
- Ostracods live in sea water and fresh water.
- The ostracod's body sits inside a shell of two parts.
