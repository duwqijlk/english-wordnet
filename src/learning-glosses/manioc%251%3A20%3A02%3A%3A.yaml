simpleMeaning: The root of the cassava plant, eaten as a main food after it is dried and soaked in water,
  and used to make tapioca
scope: 'Also called cassava: this is the root eaten as food, not the whole manioc plant and not the starch
  made from the root.'
examples:
- People in the village eat manioc at most meals.
- They ground manioc root to make tapioca.
