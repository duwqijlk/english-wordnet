simpleMeaning: Made after a substance that blocks X rays is put into the blood, this X-ray picture shows
  the blood vessels.
scope: This is a single X-ray picture of blood vessels, not a run of pictures showing the heart at work.
examples:
- The angiogram showed his blood vessels clearly.
- An angiogram was made after the blocking substance went into his blood.
