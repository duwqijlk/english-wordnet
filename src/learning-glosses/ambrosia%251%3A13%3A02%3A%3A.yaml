simpleMeaning: A sweet food eaten at the end of a meal, made of oranges and bananas with coconut cut into
  thin pieces
scope: This is a real sweet dish of fruit and coconut, not the food of the gods in old stories and not
  the food bees make for their young.
examples:
- For the last course, she served ambrosia made with oranges and bananas.
- He put a bowl of ambrosia, full of coconut, on the table.
