simpleMeaning: said of a mammal that belongs to the group of hoofed animals with an even number of toes
scope: 'Also called artiodactylous or even-toed: used of a mammal of this group, not the mammal itself
  and not a mammal with an odd number of toes.'
examples:
- Cows and pigs are artiodactyl animals.
- The artiodactyl group has many kinds of hoofed mammals.
