simpleMeaning: a process in the body that builds up tissue, or that helps the body build tissue up
scope: A process that builds up tissue in the body, not one that breaks tissue down, and not a drug itself.
examples:
- Some athletes take anabolic steroids to increase muscle size temporarily.
- An anabolic process helps the body build new muscle after hard work.
