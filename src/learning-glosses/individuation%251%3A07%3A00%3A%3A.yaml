simpleMeaning: The quality of being one thing on its own, apart from others.
scope: Also called individualism and individuality, this is the quality of being one thing on its own,
  not the act of telling one thing apart from its kind.
examples:
- She lost all sense of individuation in the crowd.
- The artist valued individuation above all else.
