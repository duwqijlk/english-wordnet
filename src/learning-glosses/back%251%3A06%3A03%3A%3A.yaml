simpleMeaning: The outer covering of a book, taking in the front panel, the rear panel, and the strip
  along the spine.
scope: This is a book's outer cover, including its spine, not a person's spine and not the rear part of
  a room.
examples:
- The leather back of the old book was cracked and peeling.
- The back of the dictionary had come loose from the pages.
