simpleMeaning: To try to keep from doing a duty, answering a question, or dealing with an issue, dodging
  round it
scope: 'Also called duck and skirt: putting off a question or duty, not a money-risk trick and not a fence
  of bushes.'
examples:
- He hedged when the reporter asked about the missing money.
- She hedged the question about the lost files.
