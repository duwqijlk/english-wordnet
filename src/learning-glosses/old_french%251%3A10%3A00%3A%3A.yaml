simpleMeaning: The first form of the tongue of France, used from the 800s to the 1400s.
scope: Also called Langue d'oil, Langue d'oil French and Old French language; the earliest form of French,
  used from the 9th to the 15th century, while later French came after it.
examples:
- Old French was the tongue of France in the 1100s.
- The songs of the troubadours were written in Old French.
