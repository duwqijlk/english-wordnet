simpleMeaning: considered pleasant or appealing, often used as the second part of a compound such as 'well-liked'.
scope: This describes how other people regard someone or something, not a momentary feeling of enjoyment
  that someone has.
examples:
- She is a well-liked teacher at the school.
- The most-liked posts appear at the top of the page.
