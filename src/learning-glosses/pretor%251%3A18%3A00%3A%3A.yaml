simpleMeaning: a judge and leader in old Rome, picked by vote to serve for one year
scope: Also called praetor, this is a judge and leader of old Rome who served for one year, not a judge
  of today.
examples:
- The pretor was picked by vote to serve Rome for one year.
- The new pretor took up his post after the yearly vote in Rome.
