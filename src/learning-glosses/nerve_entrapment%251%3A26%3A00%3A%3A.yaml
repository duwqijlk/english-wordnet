simpleMeaning: A cord that carries signals stays squeezed over a long time, squeezed again and again,
  most often near a joint that is sore or swollen.
scope: This state is a long-term squeezing of a cord that carries signals, most often near a sore or swollen
  joint, not a single brief pinch.
examples:
- Near a joint, nerve entrapment squeezed the cord that carries signals again and again.
- Long-term nerve entrapment left the cord that carries signals squeezed.
