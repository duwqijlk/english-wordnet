simpleMeaning: Fungi of the Monilia or Candida kind bring on an illness, above all the kind called Candida
  albicans.
scope: Also called monilia disease and moniliasis, this is the illness that fungi of the Monilia or Candida
  kind bring on.
examples:
- The doctor treated her candidiasis.
- The nurse explained candidiasis to the patient.
