simpleMeaning: With no right from the law to do it, a crowd kills a person for a crime no one has proved
scope: A crowd that kills a person for a crime no one has proved, acting with no right from the law, not
  a killing ordered by a court and not one person acting alone.
examples:
- The lynch mob dragged the man from his cell.
- A lynch mob gathered outside the jail that night.
