simpleMeaning: Flowers that smell of vanilla grow on a herb of warm America that winds itself up trees.
scope: Also called climbing hemp-vine, climbing hempweed and wild climbing hempweed, this is a herb of
  warm America with vanilla-scented flowers.
examples:
- The climbing boneset wound round a tree and opened its flowers.
- She found climbing boneset growing up a tree.
