simpleMeaning: In Hindu belief, a god, especially Vishnu, shown or present in the form of a person, a
  being with more than human power, or an animal
scope: This is a form taken by a Hindu god, especially Vishnu, not just any holy person and not a god
  with no such form taken.
examples:
- Some Hindus see Krishna as an avatar of Vishnu.
- In the story, the god came to earth as an avatar in animal form.
