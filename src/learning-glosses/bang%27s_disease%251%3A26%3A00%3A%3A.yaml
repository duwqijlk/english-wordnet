simpleMeaning: An illness that spreads among farm animals and often makes them lose their young before
  birth; people can catch it too.
scope: This is an illness that spreads among farm animals and often makes them lose their young before
  birth; brucellosis and contagious abortion are other names for it; people can catch it too, and it is
  not an illness of wild animals only.
examples:
- Bang's disease made the cows lose their young before birth.
- The vet tested the herd for Bang's disease.
