simpleMeaning: made pretty with bits of decoration fixed on it, often joined to another word
scope: A thing made pretty by decoration put on it, not a thing that is pretty in itself and not the act
  of putting it up.
examples:
- The brass-mounted carbine hung on the wall.
- Her mounted silver mirror caught the light.
