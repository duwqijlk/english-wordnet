simpleMeaning: A small European shrub whose bell-shaped red flowers open very early in the year
scope: A small European shrub whose bell-shaped red flowers open very early in the year; spring heath
  and winter heath are other names for it, not a heath that flowers late and not a tall shrub.
examples:
- Erica carnea flowers very early, before the snow has gone.
- The red bells of Erica carnea brighten the rock garden.
