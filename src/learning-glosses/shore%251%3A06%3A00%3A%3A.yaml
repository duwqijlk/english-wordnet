simpleMeaning: a long, strong piece of wood put against a building or other built thing to hold it up
scope: This is a long piece of wood put against a building or other built thing to hold it up. Not arriving
  on land from the water, and not being the land at the edge of the water for something.
examples:
- Workers put a wooden shore against the weak wall.
- The old building stayed up with the help of two shores.
