simpleMeaning: In building, a band for decoration that goes across, with figures carved on it, between
  the beam above the posts and the top part that sticks out
scope: This is the band for decoration on a building, not the heavy wool cloth with a soft, long surface
  that has the same name.
examples:
- The frieze above the posts showed horses and men carved in stone.
- Workers cleaned the old frieze at the top of the building wall.
