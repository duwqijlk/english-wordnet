senseId: 'posture%2:41:00::'
synsetId: 02524849-v
simpleMeaning: to act in a stiff, false way that is not natural, in order to make other people think well
  of you
scope: 'Also called pose: to act in a false way so others will think well of you. It is not holding your
  body still for an artist, and not a country''s strength for war.'
examples:
- He postured at the party, hoping everyone would think well of him.
- She postured and made a fool of herself in front of her friends.
