simpleMeaning: A fly whose front wings usually do the flying while the back pair has shrunk into tiny
  knobs, with a mouth made for sucking, lapping or piercing.
scope: Another name for the same fly group, also called dipteran, dipteron and two-winged insects; not
  a four-winged insect such as a dragonfly or bee.
examples:
- A housefly is a familiar dipterous insect.
- Every dipterous insect has mouthparts suited to sucking, lapping or piercing.
