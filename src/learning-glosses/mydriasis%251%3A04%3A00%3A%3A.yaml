senseId: 'mydriasis%1:04:00::'
synsetId: 00867757-n
simpleMeaning: Automatic widening of the pupil as a muscle pulls the iris outward, in response to less
  light or certain drugs
scope: The dark hole of the eye grows wide by itself when a muscle pulls the coloured ring outward, after
  the light grows dim or after certain drugs.
examples:
- The doctor noted mydriasis after the drug was given.
- Mydriasis made her eyes look wide in the dim room.
