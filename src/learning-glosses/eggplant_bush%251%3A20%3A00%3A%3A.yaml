simpleMeaning: A hairy, upright herb native to southeastern Asia but now grown widely for its big, shiny
  edible fruit, which is commonly treated as a vegetable.
scope: The plant itself, a hairy upright bush grown for its large shiny fruit. It is not the fruit sold
  and eaten as a vegetable. Aubergine, brinjal and eggplant are other names for this plant.
examples:
- The eggplant bush in the corner of the garden was taller than the fence.
- He tied the young eggplant bush to a stake so the wind would not break it.
