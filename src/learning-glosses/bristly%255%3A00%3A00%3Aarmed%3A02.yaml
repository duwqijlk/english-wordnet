simpleMeaning: having or covered with sharp bits that protect it, such as barbs, spines, thorns, quills,
  or stiff hairs
scope: Having or covered with sharp bits that protect it, such as barbs, spines, thorns, quills, or stiff
  hairs; prickly, bristled, barbed, and thorny are other names for this, not smooth and not soft.
examples:
- The bristly shrub scratched my legs.
- He had a short bristly beard that felt rough.
