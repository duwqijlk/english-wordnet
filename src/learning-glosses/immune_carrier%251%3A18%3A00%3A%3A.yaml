simpleMeaning: In medicine, a person or animal who carries a germ without falling ill, but can pass it
  to others
scope: In medicine, a person or animal who carries a germ without being ill but can pass it on, not a
  sick person and not a person who cannot pass it on.
examples:
- The immune carrier showed no signs of illness but infected others.
- She was an immune carrier of the disease, healthy herself yet able to spread it.
