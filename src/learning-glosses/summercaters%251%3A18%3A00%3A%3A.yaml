simpleMeaning: In Maine, people who live on the coast only for the warm months, not all year.
scope: In Maine, a name in everyday talk for people who live on the coast only in the warm months; not
  people who live there all year and not visitors who stay only a few days.
examples:
- The summercaters arrive in June and leave in September.
- Many summercaters rent cottages on the coast of Maine.
