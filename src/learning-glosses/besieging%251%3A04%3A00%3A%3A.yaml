simpleMeaning: The act of an armed force ringing a strong place, cutting it off, and keeping on attacking
  it.
scope: 'Also called a siege, a beleaguering, or a military blockade: the act of surrounding a strong place
  and cutting it off while attacking, not a single attack or a raid.'
examples:
- The besieging of the city lasted for months.
- After weeks of besieging, the fort ran out of food.
