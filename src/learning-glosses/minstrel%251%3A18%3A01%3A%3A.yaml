simpleMeaning: a person who sings, dances or acts in a stage show of music and jokes
scope: This is a person who performs in such a stage show, not the action of singing to mark or praise
  an event in the same old style.
examples:
- The minstrel sang and danced in the show each night.
- One minstrel led the songs while the others danced and told jokes.
