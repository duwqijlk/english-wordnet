simpleMeaning: Sore red lumps on the shins and legs are the mark of this skin problem
scope: A skin problem with sore red lumps on the lower legs, not a single sore spot and not a rash all
  over the body.
examples:
- Erythema nodosum left sore red lumps on her shins.
- The doctor saw erythema nodosum on the patient's legs and sent her for tests.
