simpleMeaning: Taken from a sweet-smelling herb, this pale yellow oil scents soaps and cosmetics.
scope: This oil is also called spike lavender oil, and it is the oil itself, not the herb it comes from.
examples:
- She put spike oil in the soap.
- The spike oil made the soap smell sweet.
