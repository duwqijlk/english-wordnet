simpleMeaning: A unit of length in the metric measures, one tenth of a meter
scope: This is a metric unit of length, also called a decimetre and dm; not a centimetre, which is one
  hundredth of a meter, and not a meter itself.
examples:
- The book is about two decimeters wide.
- A decimeter is one tenth of a meter, so ten of them make a meter.
