simpleMeaning: to make long, shallow, hollow lines in something
scope: This is the act of making long, shallow, hollow lines in something; not the groove or hollow line
  itself that is made, not the long thin music instrument you blow into, and not the tall narrow glass
  for wine.
examples:
- The stone worker fluted the sides of the column.
- He fluted the cloth by pressing it into narrow folds.
