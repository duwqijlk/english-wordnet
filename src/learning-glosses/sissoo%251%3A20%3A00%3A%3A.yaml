simpleMeaning: Farm animals eat the leaves of this East Indian tree, and its dense, dark brown, long-lasting
  wood goes into ships and railway ties.
scope: 'Another name for sisham and sissu: an East Indian tree that feeds farm animals with its leaves
  and gives dense wood for ships and railway ties.'
examples:
- Farmers fed their goats with sissoo leaves.
- Railway workers laid sissoo ties under the track.
