simpleMeaning: This word is about that church, and about things that have to do with it or are like the
  things of it.
scope: Also called Episcopal, it says a thing belongs to that church or is like its ways, and it does
  not name a person who belongs to it.
examples:
- They were married by an Episcopalian minister.
- The Episcopalian hierarchy met to choose a new bishop.
