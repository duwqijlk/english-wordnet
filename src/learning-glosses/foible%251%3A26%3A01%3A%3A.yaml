senseId: 'foible%1:26:01::'
synsetId: 92435289-n
simpleMeaning: A small fault in the way a person acts or in what they are like
scope: A small fault in a person's character or way of acting, not the weak part of a sword blade, and
  not a way of acting that is all a person's own.
examples:
- Everyone liked him in spite of his foibles.
- One of her foibles was talking to her plants.
