simpleMeaning: showing strong feeling or excitement that is not held back or kept under control
scope: 'Also called mad, excited, frantic, and delirious: showing feeling that is not held back; not about
  a thing simply not being held in place, and not about growth or spending with no limit.'
examples:
- The fans gave unrestrained cheers when their team won the game.
- She laughed with unrestrained joy when she heard the good news.
