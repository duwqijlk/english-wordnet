simpleMeaning: A blast throws up a great mass of dust and broken stone that climbs high, its head flat
  and wide like a fungus, especially after a nuclear bomb.
scope: It is also called mushroom and mushroom-shaped cloud, and it is the dust mass thrown up by a blast
  rather than a cloud that forms in the sky on its own.
examples:
- The mushroom cloud climbed high after the explosion.
- A mushroom cloud spread wide at the top as it rose.
