simpleMeaning: To give the people in a film or play the special clothes they wear in it
scope: Giving actors the clothes for a part, not putting the clothes on yourself and not the clothes themselves.
examples:
- The studio costumed the whole cast for the new film.
- She costumed the actors in bright clothes for the play.
