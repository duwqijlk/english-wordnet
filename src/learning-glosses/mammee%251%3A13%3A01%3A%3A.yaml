simpleMeaning: A warm-land fruit, round or egg-like, in a thick, brown-red, leather-like skin, with yellow
  or reddish flesh that is juicy inside.
scope: This sense is also called mamey and mammee apple, for a warm-land fruit, round or egg-like, in
  a thick, brown-red, leather-like skin, with yellow or reddish flesh that is juicy inside, unlike the
  sense for a warm-climate American tree with edible fruit in a leathery rind, and unlike the sense for
  a warm-climate American tree with wood like mahogany and sweet, edible, egg-shaped fruit, in some groupings
  put in the genus Calocarpum.
examples:
- Mammee tastes sweet and juicy.
- They ate mammee after lunch.
