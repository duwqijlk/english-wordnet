scope: Also called hog-nosed skunk, hognosed skunk, and rooter skunk, this is a skunk with a bare nose
  and a white back and tail, not a badger, that lives in the southwest of North America and in Mexico.
examples:
- A badger skunk showed its white back and tail.
- We saw badger skunks in the southwest of North America.
