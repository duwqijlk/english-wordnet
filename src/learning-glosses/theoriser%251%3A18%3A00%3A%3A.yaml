simpleMeaning: A person who makes up ideas that try to explain how things work, most of all in science
  or in art
scope: A person who makes up ideas that try to explain how things work, most of all in science or in art;
  theorist, theoretician and theorizer are other names for this sense; not a person who tests ideas by
  doing tests.
examples:
- The theoriser spent years building his ideas.
- As a theoriser, she loved big questions.
