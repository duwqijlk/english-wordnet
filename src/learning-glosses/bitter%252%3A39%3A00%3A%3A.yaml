simpleMeaning: to make something have a sharp, strong, unpleasant taste
scope: This is the verb for making a taste sharp and unpleasant, not the word for the taste itself and
  not harsh words in tone.
examples:
- A little lemon peel bittered the whole pot of sauce.
- She bittered the drink by adding a few bitter herbs.
