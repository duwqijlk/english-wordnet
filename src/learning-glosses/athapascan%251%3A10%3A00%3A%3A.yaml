simpleMeaning: A group of the tongues of the first peoples of America, a name made up by an American man
  who studied peoples, Edward Sapir.
scope: Also called Athabascan, Athabaskan, Athapaskan, and Athapaskan language; a group of tongues, not
  the people who speak them.
examples:
- Athapascan is a group of tongues of the first peoples of America.
- Edward Sapir gave the name Athapascan to the group of tongues.
