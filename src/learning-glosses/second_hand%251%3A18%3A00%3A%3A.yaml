simpleMeaning: a person through whom something passes from a source to someone else
scope: A person through whom something passes from a source to someone else, not the pointer on a clock
  and not someone who heard it direct from the source.
examples:
- He could learn at second hand from books.
- She heard the news at second hand, not from the witness herself.
