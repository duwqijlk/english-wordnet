simpleMeaning: the family link between a child and the child's mother and father
scope: 'Also called birth: the family link of a child to its mother and father, not the state of being
  a mother or father.'
examples:
- Questions about his parentage led him to look for his birth mother and father.
- Her parentage linked her to a mother and father from a small town in the north.
