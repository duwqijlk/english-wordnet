simpleMeaning: likely to help people learn more and know things they did not know before
scope: 'Also called illuminating and enlightening: said of something that helps people learn more and
  know things they did not know before. The nearest other senses of informative are about giving information,
  and about teaching or informing people.'
examples:
- The museum tour was very informative, and I learned how the city began.
- She gave an informative talk that taught us many new things about the sea.
