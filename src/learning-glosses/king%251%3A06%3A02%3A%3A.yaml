simpleMeaning: A piece in checkers that, after reaching the opponent's first row, is upgraded so it can
  move both forward and backward.
scope: This is the checkers piece, not a male ruler of a country, not the chess piece, not a playing card
  bearing a royal picture, not a very wealthy or powerful businessperson, not a top competitor, not the
  husband of a queen, and not being most important in a field.
examples:
- He slid his last piece to the far row and made it a king.
- In checkers, a king may move backward as well as forward.
