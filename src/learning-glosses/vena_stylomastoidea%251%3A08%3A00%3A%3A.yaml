simpleMeaning: Behind the eardrum, a small hollow place sends its blood away through this tube, which
  ends in the one behind the lower jaw.
scope: Also called a stylomastoid vein, this tube carries blood from the hollow place behind the eardrum
  to the tube behind the lower jaw.
examples:
- Blood from the hollow place behind the eardrum drains through the vena stylomastoidea.
- The vena stylomastoidea runs into the blood tube behind the lower jaw.
