simpleMeaning: placed in the northeast part of a place, or facing toward the northeast
scope: This sense means placed in or facing the northeast, also called northeast, and northeasterly is
  another name for it; it is not the sense about the north-east region of the United States.
examples:
- The northeastern corner of the field gets the morning sun.
- The house has a northeastern door that faces the hills.
