simpleMeaning: a search for a different choice that fits the standards a person uses when they think and
  judge
scope: 'Also called pursuit: a search in the mind for a different choice that fits one''s standards. It
  is not asking for gifts for religious reasons, and not a dog making long barking sounds.'
examples:
- The team's quest was to find a cheaper material that still passed all their tests.
- His quest for truth led him to check every answer against the facts he knew.
