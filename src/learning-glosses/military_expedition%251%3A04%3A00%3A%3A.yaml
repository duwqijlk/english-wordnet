simpleMeaning: A planned set of actions by armed forces in another country to reach one set aim.
scope: A campaign by armed forces in another country with one set aim; not a single armed action, and
  not a long war.
examples:
- The military expedition set out to free the port city.
- Historians still argue about the aims of that military expedition.
