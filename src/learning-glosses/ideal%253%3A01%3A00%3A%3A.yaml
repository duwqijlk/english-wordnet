simpleMeaning: In philosophy (the study of big questions about life and thought), about the teaching that
  ideas are what is real
scope: About a teaching in philosophy that ideas are real; not the noun for a best example, and not the
  sense for being perfect.
examples:
- 'This is an ideal argument in philosophy: it says ideas are what is real.'
- He studied the ideal teaching that the mind's ideas are real.
