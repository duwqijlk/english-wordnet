simpleMeaning: A big road vehicle fitted to lift and pull away crashed vehicles, or to take away vehicles
  left where parking is not allowed
scope: A big road vehicle fitted to lift and pull away crashed vehicles; wrecker and tow car are other
  names for this sense, and not an ordinary road vehicle or a parking attendant.
examples:
- A tow truck took the crashed vehicle away.
- The tow truck removed the vehicle from the no-parking zone.
