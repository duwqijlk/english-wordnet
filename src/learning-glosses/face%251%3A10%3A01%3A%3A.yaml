simpleMeaning: a twisted expression of the muscles around the eyes, nose and mouth, pulled out of their
  usual shape.
scope: This is a twisted expression, not the front of a person's head and not the working surface of an
  object.
examples:
- He made a face when he tasted the medicine.
- She pulled a face at the camera.
