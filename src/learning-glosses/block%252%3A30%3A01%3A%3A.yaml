simpleMeaning: To give shape to something by pressing it over a solid form.
scope: Giving shape to something by pressing it over a form; not forming something into solid pieces,
  not holding something up with a support, and not stamping a book cover.
examples:
- The hatmaker blocked the hat over a wooden form.
- The felt was blocked to the right size while still damp.
