simpleMeaning: To say the same words over and over in one flat voice, keeping a steady beat
scope: To repeat the same words in one flat voice with a steady beat, with chant and tone as other names
  for this sense, not speaking carefully with the voice rising and falling and not reciting a set text
  with musical rise and fall.
examples:
- The students intoned the slogan over and over again.
- The crowd intoned the chant in one flat voice.
