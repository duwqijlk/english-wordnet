senseId: 'spot%1:10:00::'
synsetId: 06408111-n
simpleMeaning: A part of a show reserved for one performer or one act.
scope: A performer's own turn inside a show; not the short advertising segment between programmes, and
  not a card (or the mark printed on it).
examples:
- They changed his spot on the programme at the last minute.
- The comedian's spot came right after the juggler.
