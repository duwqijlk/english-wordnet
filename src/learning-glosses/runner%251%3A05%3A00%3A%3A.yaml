simpleMeaning: A fish that lives in the west part of the Atlantic Ocean, from Cape Cod down to Brazil
scope: A fish of the west Atlantic, not a person who races on foot, not a person paid to carry messages,
  and not a stem of a plant that grows along the ground.
examples:
- The fisherman caught a runner off the coast of Brazil.
- Runners swim in the warm water near Cape Cod.
