simpleMeaning: a long loose coat of cotton or silk with wide sleeves and a sash, reaching to the ankles,
  worn by men in the Levant
scope: 'Also called a caftan: this is a long coat worn by men in the Levant, not a woman''s dress in that
  style.'
examples:
- He wore a kaftan of light cotton in the heat.
- The man's kaftan reached down to his ankles.
