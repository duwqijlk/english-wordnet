simpleMeaning: A way of counting by place that uses sixteen marks and sixteen as its base
scope: This is a way of counting by place that uses sixteen marks and sixteen as its base, also called
  hexadecimal number system and sexadecimal number system, and not a way of counting by place that uses
  ten marks and ten as its base.
examples:
- The hexadecimal system counts with sixteen marks.
- Programmers work with the hexadecimal system every day.
