simpleMeaning: to put a person in a jail or a place like a jail and keep them there
scope: 'Also called jail, imprison, and lag: to lock a person up so they cannot leave. Not the amount
  in a container, and not cooking food slowly in a pot.'
examples:
- The court jugged him for ten years for the robbery.
- The police jugged the man until his trial the next week.
