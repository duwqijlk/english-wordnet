simpleMeaning: the quality of having every detail and being complete in every way
scope: This sense is about a thing having every detail and leaving nothing out, not about a person being
  careful to do every part of a task.
examples:
- The thoroughness of the report left no question unanswered.
- She praised the thoroughness of his work, which covered every detail.
