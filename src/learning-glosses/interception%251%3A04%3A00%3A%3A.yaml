simpleMeaning: The act of stopping a thing on its way, so it does not reach where it was going.
scope: Stopping a thing on its way, not the catch of a football by the other team in American football.
examples:
- The interception of the letter kept it from reaching her.
- The interception of one missile by another would be impossible.
