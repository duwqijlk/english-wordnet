simpleMeaning: In basketball, a move where two players who guard the other team change jobs, so each one
  guards the player the other one usually guards
scope: This is a move in basketball where two players change who they guard, not a part for turning power
  on or off and not a part of a train track.
examples:
- The coach called for a switch, and the two guards changed who they were marking.
- On the switch, Lee took the tall player Parker had been guarding.
