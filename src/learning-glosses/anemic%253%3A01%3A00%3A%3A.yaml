simpleMeaning: having or connected with a health problem in which the blood has too few red cells
scope: This word means having or connected with the blood problem described here, also called anaemic.
  It is a health sense, not a general word for weak or lacking energy.
examples:
- The doctor said the tired, pale patient was anemic.
- An anemic child may need more iron in food.
