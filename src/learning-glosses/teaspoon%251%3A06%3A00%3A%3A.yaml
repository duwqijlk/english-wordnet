simpleMeaning: A small spoon used to stir tea or coffee. It holds about one fluid dram (a very small amount
  of liquid)
scope: This is the small spoon itself for tea or coffee, not the amount that such a spoon can hold.
examples:
- She stirred her tea with a teaspoon.
- He picked up a teaspoon and stirred his coffee with it.
