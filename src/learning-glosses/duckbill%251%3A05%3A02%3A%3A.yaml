simpleMeaning: An old kind of fish from the Mississippi valley, with a long flat snout shaped like a paddle.
scope: An old kind of fish from the Mississippi valley, with a long flat snout shaped like a paddle; paddlefish
  is another name for this sense, not the egg-laying animal with a flat bill and not a modern fish.
examples:
- The duckbill swims in the Mississippi River.
- A duckbill uses its long snout to find food.
