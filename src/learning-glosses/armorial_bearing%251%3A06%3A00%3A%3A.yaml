senseId: 'armorial_bearing%1:06:00::'
synsetId: 03012169-n
simpleMeaning: a picture or design shown on a shield as part of a family's coat of arms
scope: 'Also called a bearing, a charge, or a heraldic bearing: a picture or design shown on a shield,
  not a whole coat of arms and not a flag or badge.'
examples:
- The armorial bearing on the old hall showed a lion on a shield.
- She drew the armorial bearing for the family crest.
