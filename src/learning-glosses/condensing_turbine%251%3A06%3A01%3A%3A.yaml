simpleMeaning: Steam from a boiler drives a wheel and leaves it at a pressure well below that of the air,
  passing into a cooler.
scope: This steam-driven wheel sends its steam out at low pressure to be cooled.
examples:
- The condensing turbine drove the generator.
- Steam from the boiler passed through the condensing turbine.
