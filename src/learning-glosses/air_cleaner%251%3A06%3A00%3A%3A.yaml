simpleMeaning: a device that takes dust out of the stuff we breathe as it passes through it
scope: A device that takes dust out of passing air, also called an air filter; not a machine that cools
  the air and not one that takes dampness out of it.
examples:
- The air cleaner in the hall takes dust out of the air.
- We put a new air cleaner in the room.
