simpleMeaning: Love is marked by a fancy twist in a cord, made pretty for show
scope: Also called love knot and lovers' knot, this is a fancy twist in a cord that marks love and is
  made pretty for show, not a twist that holds things together.
examples:
- She wore a lover's knot brooch as a sign of her love.
- The lover's knot on the card was drawn in gold ink.
