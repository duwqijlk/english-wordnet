simpleMeaning: A smooth curve fitted to a set of paired data in regression analysis; for linear regression,
  the curve is a straight line.
scope: Also called a regression curve, this smooth curve through paired numbers is a straight line when
  the link is straight.
examples:
- The regression line was straight for the paired numbers.
- They drew a regression line through the paired numbers.
