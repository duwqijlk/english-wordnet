simpleMeaning: One of a group of drugs often used to make the body pass more water, to treat high blood
  pressure, by stopping the kidneys from taking sodium back in
scope: This is a drug that makes the body pass more water to treat high blood pressure; not a drug that
  lowers blood pressure in another way and not a water pill for another illness.
examples:
- The doctor gave her a thiazide to lower her blood pressure.
- Thiazides help the body pass more water by acting on the kidneys.
