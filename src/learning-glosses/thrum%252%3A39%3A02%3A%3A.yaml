simpleMeaning: to brush your fingers across the strings of a guitar or a similar instrument to make music
scope: To play a stringed instrument by brushing across its strings, not the low humming sound the word
  also names.
examples:
- He thrummed the guitar softly while she sang.
- She thrums the strings of her old banjo when she is thinking.
