simpleMeaning: having a sign on it, or seeming to have one, as named, often used joined to another word
scope: Used of a thing with a sign on it, often joined to another word; not singled out for notice, and
  not easy to see at once.
examples:
- They played with marked cards.
- He had a scar-marked face.
