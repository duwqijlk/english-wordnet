simpleMeaning: A big crab that people eat, living in the north Pacific, above all near the shores of Alaska
  and Japan.
scope: Also called king crab, Alaska crab, Alaska king crab, and Alaskan king crab; a large crab of northern
  waters for eating, set apart from small warm-water crabs by its size and its northern home.
examples:
- The fishermen hauled in a Paralithodes camtschatica nearly a metre wide.
- Paralithodes camtschatica is served boiled with butter in Juneau.
