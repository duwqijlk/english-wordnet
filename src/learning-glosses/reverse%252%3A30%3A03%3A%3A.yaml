simpleMeaning: to change something so that its position, order, link, or state is now the opposite way
  round
scope: To turn a position, order, link or state to the opposite; not the gear that makes a car go back
  and not the back side of a coin.
examples:
- Please reverse the order of the two names on the list.
- She reversed their positions so the tall boy stood at the back.
