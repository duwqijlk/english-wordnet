simpleMeaning: To take for yourself, by fraud, money or goods that were left in your care
scope: Also called embezzle, defalcate, misappropriate and peculate, this is taking money or goods left
  in your care and using them for yourself by fraud, not a plain theft and not an honest mistake.
examples:
- The treasurer was found to have malversated funds from the club account.
- He malversated the money his clients had trusted him to keep.
