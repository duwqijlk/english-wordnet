simpleMeaning: A gamete, a sex cell, is what this young cell in an animal or a plant turns into by a special
  kind of splitting.
scope: A young cell that turns into a sex cell, not a full-grown body cell and not the sex cell itself.
examples:
- The gametocyte in the blood sample was still young.
- Each gametocyte divides to form a cell that can join with another.
