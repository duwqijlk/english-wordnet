simpleMeaning: to equip something with a connecting point where two parts meet
scope: This means supplying an object with a connection between parts, not fastening pieces together with
  a joint, not fitting together as if linked, and not cutting meat at a joint.
examples:
- The dollmaker jointed the limbs so they could move.
- The model's wings were jointed so they could fold.
