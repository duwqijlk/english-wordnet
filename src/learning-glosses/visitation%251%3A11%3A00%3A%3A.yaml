simpleMeaning: an event that annoys or upsets people, or that brings great harm
scope: 'Also called trial and tribulation: a bad event that troubles people, not an official visit to
  check or watch over a place.'
examples:
- A visitation of the plague killed many people in the town.
- The long flood was a visitation for the whole village.
