senseId: 'low-pass_filter%1:06:00::'
synsetId: 03699522-n
simpleMeaning: A device that lets through waves under a set mark and weakens those above that mark.
scope: A device that lets through waves under a set mark and weakens those above it, not one that lets
  through only waves above a set mark.
examples:
- The low-pass filter cut the high hiss from the recording.
- A low-pass filter in the radio let the bass through and weakened the treble.
