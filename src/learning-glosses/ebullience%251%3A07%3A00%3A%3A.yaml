simpleMeaning: a very strong, eager feeling of joy and warm praise
scope: 'Also called enthusiasm and exuberance: a very strong, eager feeling of joy and warm praise, not
  a calm liking and not loud anger.'
examples:
- Her ebullience filled the room as she told us the good news.
- His ebullience showed in every word of praise he gave the team.
