simpleMeaning: A toy made of a Y-shaped stick with stretchy bands between its arms, used to throw small
  stones
scope: 'Also called sling: a toy of a forked stick and stretchy bands for throwing small stones, not the
  great war engine and not the device that throws planes from a ship.'
examples:
- The boy shot a stone from his catapult at the tin can.
- She made a catapult from a forked branch and rubber bands.
