synsetId: 05920154-n
simpleMeaning: A retirement savings arrangement paid into before tax, often employer-matched, growing
  untaxed until withdrawal, convertible to an individual retirement account, portable, with some say over
  investments.
scope: This is the same workplace retirement plan as 401-k, not a traditional pension paid for life and
  not the individual retirement account it can turn into.
examples:
- Her 401-k plan lets her choose how the money is invested.
- After eight years with the firm, his 401-k plan was worth more than a year's pay.
