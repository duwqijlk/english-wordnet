senseId: 'interpolate%2:30:00::'
synsetId: 00201771-v
simpleMeaning: Often making a text say what is not true, by slipping extra words into it.
scope: Also called alter or falsify, putting extra words into a text, often so it says what is not true.
examples:
- He interpolated a line into the old letter.
- The editor interpolated words that changed the meaning of the passage.
