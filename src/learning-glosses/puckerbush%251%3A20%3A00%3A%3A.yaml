simpleMeaning: Small hard berries thickly coated in white wax for candles grow on this small sweet-smelling
  tree that keeps its leaves all year, in the south-east United States.
scope: 'Also called bay myrtle: a small sweet-smelling tree of the south-east United States, with small
  hard berries coated in white wax for candles, not the wax itself.'
examples:
- The puckerbush berries were thickly coated in white wax.
- We saw a puckerbush in the south-east United States, green all year.
