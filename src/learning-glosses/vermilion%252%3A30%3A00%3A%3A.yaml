simpleMeaning: to give something a strong, bright red colour, sometimes with a little orange in it
scope: 'This is the verb: giving something this colour. It is not the noun that names the colour itself,
  and not the describing word for a thing that already has this colour.'
examples:
- The artist vermilioned the lips in her painting.
- He vermilioned the wooden door, and it stood out against the white wall.
