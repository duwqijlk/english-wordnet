senseId: 'heat_of_formation%1:19:00::'
synsetId: 11491165-n
simpleMeaning: The warmth given out or taken in while one mole, a set amount, of a substance is made from
  the parts that make it up
scope: This is the warmth given out or taken in while a substance is made from its parts, and not the
  warmth given out or taken in when a substance is dissolved.
examples:
- The heat of formation of water is a known value.
- Scientists measured the heat of formation of the new compound.
