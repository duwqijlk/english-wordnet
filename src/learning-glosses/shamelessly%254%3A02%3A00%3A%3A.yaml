simpleMeaning: in a way that shows you do not feel bad about doing something wrong
scope: Done with no sign of feeling bad about wrong behaviour; not doing something openly when there is
  nothing wrong with it.
examples:
- He shamelessly lied to his friends and did not feel bad about it.
- She shamelessly took the last piece and ate it in front of us.
