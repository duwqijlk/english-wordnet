simpleMeaning: one of the bars that run from the centre of a wheel to its rim, supporting it
scope: A bar joining the middle of a wheel to its outer edge, not the hub itself or the rim.
examples:
- One spoke of the bicycle wheel was bent out of shape.
- He replaced the broken spoke with a new one.
