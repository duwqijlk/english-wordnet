simpleMeaning: A person who, as a habit, doubts what others take as true.
scope: 'Also called a skeptic or a sceptic: a person who, as a habit, doubts what others take as true,
  not someone who is merely doubtful about one thing.'
examples:
- The doubter asked for proof before he would believe.
- She was a doubter all her life, questioning every claim.
