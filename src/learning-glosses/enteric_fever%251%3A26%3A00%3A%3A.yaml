simpleMeaning: Taken in with food or water, a germ called Salmonella typhosa causes a serious sickness
  of the gut, with swelling and open sores inside it.
scope: It is also called typhoid and typhoid fever, the sickness of the gut that comes from food or water.
examples:
- He caught enteric fever after drinking water that held the germ.
- Enteric fever brought swelling and open sores to her gut.
