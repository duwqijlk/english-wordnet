simpleMeaning: A vine of south India, of Sri Lanka, now settled wild in north Burma and Assam after being
  brought there, bearing berries of dark red, peppercorns, when quite ripe.
scope: This sense is also called pepper, common pepper, and white pepper, a vine of south India, and of
  Sri Lanka, wild now in north Burma, and in Assam, bearing berries of dark red, peppercorns, when quite
  ripe, where pepper is a climbing plant from the south of India and of Sri Lanka, growing wild now in
  north Burma and in Assam after being brought there, with berries of dark red when quite ripe.
examples:
- Black pepper vines bear dark red berries.
- The black pepper grows wild in north Burma.
