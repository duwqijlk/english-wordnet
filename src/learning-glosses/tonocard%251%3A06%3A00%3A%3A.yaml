simpleMeaning: A drug used to treat an uneven heartbeat in the lower heart when safer drugs have not worked.
scope: A heart drug, also called tocainide, used when safer drugs have failed, not a first drug for an
  uneven heartbeat.
examples:
- The doctor gave him Tonocard after safer drugs failed.
- Tonocard helped steady his heartbeat.
