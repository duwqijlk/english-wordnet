simpleMeaning: said with the tongue muscles held fairly tight, as in the vowel sound in the word 'beat'
scope: This word is about how a sound is said, with the tongue held fairly tight. It is not about the
  time form of a verb, and not about something stretched tight.
examples:
- The vowel sound in 'beat' is tense, with the tongue held tight.
- In the word 'feet', the long vowel sound is tense.
