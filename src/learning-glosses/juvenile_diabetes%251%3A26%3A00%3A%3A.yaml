simpleMeaning: A severe form of diabetes appearing early in life, causing heavy urination, great thirst,
  hunger and weight loss and bouts of blood acid build-up; diet and insulin injections are needed.
scope: Another name for the early-onset, insulin-dependent form of diabetes also called juvenile-onset
  diabetes; not the adult-onset type 2 form or diabetes insipidus.
examples:
- Juvenile diabetes can appear in toddlers as well as in teenagers.
- The summer camp is designed for children living with juvenile diabetes.
