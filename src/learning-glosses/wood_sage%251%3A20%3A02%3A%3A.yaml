simpleMeaning: a low shrub of North America with saw-edged leaves and flowers from cream to pink or purple
  in long spikes
scope: A low shrub of North America with saw-edged leaves, not the European wood sage with yellow flowers,
  and not true sage.
examples:
- Wood sage grows along the dry bank, its pale flowers in long spikes.
- The wood sage's saw-edged leaves stood out against the pale flowers.
