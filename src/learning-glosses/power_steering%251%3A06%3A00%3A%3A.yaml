simpleMeaning: Turning the wheel takes less strength from the driver, since a motor in the car lends force
  to the turn.
scope: Another name for power-assisted steering, this is a car system in which turning the wheel takes
  less strength from the driver.
examples:
- With power steering, the driver turns the wheel with little effort.
- The old car had no power steering, so parking took real strength.
