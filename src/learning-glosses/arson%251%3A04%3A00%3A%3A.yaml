simpleMeaning: the crime of setting fire to buildings or other property on purpose to destroy them
scope: This is the crime of setting fire to property on purpose; it is not a fire that starts by chance,
  and not burning wood or waste for heat.
examples:
- He was sent to prison for arson after setting fire to the empty shop.
- The police think the fire at the warehouse was arson.
