simpleMeaning: In chemistry, a change in which a simple substance pushes out and frees one part of a compound
scope: In chemistry, a change in which a simple substance pushes out and frees one part of a compound;
  not the mind moving a feeling to a new thing, and not a thing simply being moved.
examples:
- The displacement of copper by zinc is shown in the school test.
- In the displacement, iron pushed the copper out of the compound.
