simpleMeaning: In basketball, a shot that leaves the hand at the last touch and drops into the hoop.
scope: In basketball, a shot that leaves the hand at the last touch and drops into the hoop; not a hard
  throw from far off and not a shot that hits the board first.
examples:
- He scored with a finger-roll over the tall guard.
- Her finger-roll dropped into the hoop as the clock ran out.
