simpleMeaning: In thought, a way of thinking most of all in Europe in the 1900s that holds people wholly
  free and so must answer for what they make of their lives.
scope: In thought, a way of thinking that holds people wholly free, also called existentialism and existentialist
  philosophy; not a set of church rules and not a way of thinking about nature alone.
examples:
- Existential philosophy says we are free and must answer for what we make of our lives.
- He turned to existential philosophy after the war.
