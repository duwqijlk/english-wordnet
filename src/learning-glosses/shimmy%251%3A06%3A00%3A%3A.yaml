simpleMeaning: clothing with no sleeves that a woman wears under her other clothes
scope: shift, slip and teddy are other names for this sense; this is a sleeveless piece of clothing worn
  under other clothes, not the lively dance and not a wobble in a car.
examples:
- She wore a shimmy under her dress.
- The shimmy was made of soft cotton.
