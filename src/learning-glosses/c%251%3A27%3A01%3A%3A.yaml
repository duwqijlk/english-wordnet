simpleMeaning: A building bit of DNA, made from one of its four parts with deoxyribose sugar and a phosphate
  group joined on.
scope: This is a building bit of DNA made from one of its four parts, also called deoxycytidine monophosphate,
  deoxycytidylate, deoxycytidylic acid, and dCMP, not the element, not the vitamin, and not a letter.
examples:
- C is one building bit of DNA.
- The lab built C from cytosine, deoxyribose, and phosphate.
