simpleMeaning: to fix something that is torn or has a hole by putting a piece of cloth over it
scope: To fix a torn thing by putting cloth over the hole, not the piece of cloth itself and not covering
  a place with pieces here and there.
examples:
- She patched the hole in his shirt with a piece of blue cloth.
- He patched his torn jeans before school.
