simpleMeaning: a written order to a bank, marked by the bank to show the writer has enough money set aside
  to pay it
scope: 'Also called a certified cheque: a bank-marked order to pay, not an ordinary order to pay and not
  a promise to pay later.'
examples:
- She paid with a certified check so the seller knew the money was there.
- The bank gave him a certified check for the house deposit.
