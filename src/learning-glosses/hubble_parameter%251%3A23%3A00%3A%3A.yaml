synsetId: 13611801-n
simpleMeaning: In cosmology, how fast a galaxy moves away, as the universe grows, divided by its distance
  from us; not truly fixed, it measures how fast the universe grows today.
scope: A number in cosmology about the growing universe, also called Hubble's constant, Hubble's parameter,
  and the Hubble constant; not a fixed number in nature and not a speed.
examples:
- The Hubble parameter has changed as new data came in.
- She used the Hubble parameter to work out the age of the universe.
