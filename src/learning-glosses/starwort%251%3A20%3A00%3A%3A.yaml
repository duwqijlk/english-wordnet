simpleMeaning: Said to ease sharp pains in the side, this low herb from the cool lands of the north bears
  small white flowers with thin points spread wide.
scope: Also called greater stitchwort and stitchwort, it is a low herb with small white flowers, not a
  tall plant with big flowers.
examples:
- We found starwort growing low.
- The starwort opened its small white flowers.
