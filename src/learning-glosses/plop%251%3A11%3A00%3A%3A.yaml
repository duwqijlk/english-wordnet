simpleMeaning: the sound made when a round thing drops into a liquid without making a splash
scope: The sound of a round thing dropping into liquid without a splash, not a loud splash and not the
  act of dropping.
examples:
- We heard the plop of a stone falling into the pond.
- The plop of the pebble broke the quiet.
