simpleMeaning: Musical instruments such as clarinets are made from a dark red hard material that comes
  from the cocobolo tree.
scope: It is the dark red hard material from the cocobolo tree used for musical instruments, not the fruit
  that grows on granadilla vines.
examples:
- The granadilla wood of the clarinet shone dark red.
- Makers choose granadilla wood for clarinets.
