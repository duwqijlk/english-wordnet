simpleMeaning: A beetle from tropical America that clicks and has bright spots that glow in the dark.
scope: Also called firefly and fire beetle; a beetle from tropical America with bright glowing spots,
  not a fly that glows without clicking and not a dull beetle of cold lands.
examples:
- Pyrophorus noctiluca clicked as it crawled across the leaf.
- At night Pyrophorus noctiluca lit up the path with its bright spots.
