simpleMeaning: one of the two nerves, one on each side of the head, that control the eye muscles that
  turn the eyes
scope: This is a nerve that controls eye muscles; also called trochlear nerve, trochlearis and fourth
  cranial nerve. Not a nerve that carries sight and not a muscle of the eye.
examples:
- The trochlear on the left side sends signals to the eye muscle.
- Damage to the trochlear can make it hard to move the eye.
