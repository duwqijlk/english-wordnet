simpleMeaning: One base in DNA and RNA, made from pyrimidine, that joins with guanine.
scope: This is one of the building parts of DNA and RNA, also called cytosine, not the element, not the
  vitamin, and not a letter.
examples:
- C pairs with guanine in DNA.
- The C in RNA comes from pyrimidine.
