simpleMeaning: A piece of paper or ribbon put between the pages of a book to show where the reader stopped
scope: A paper or ribbon marker for a place in a book, not a folded corner and not a mark made in the
  book itself.
examples:
- She slipped a bookmark into the novel before closing it.
- He used a bookmark so he would not lose his place.
