simpleMeaning: A poisonous woody vine that stays green all year, of the south-east of the United States,
  with sweet-smelling yellow flowers shaped like funnels.
scope: This sense covers only the poisonous evergreen vine of the south-eastern United States, known by
  its sweet-smelling yellow flowers shaped like funnels; evening trumpet flower, yellow jasmine, yellow
  jessamine and Gelsemium sempervirens are other names for this sense.
examples:
- Carolina jasmine is a poisonous vine with yellow flowers.
- The Carolina jasmine by the fence smells sweet.
