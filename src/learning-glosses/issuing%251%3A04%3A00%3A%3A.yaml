simpleMeaning: the act of giving out something for general use or for official use, often in large numbers
scope: 'Also called issue: the act of giving something out for general or official use, not just handing
  one thing to one person.'
examples:
- The issuing of new stamps took place last week.
- The last issuing of penicillin was over a month ago.
