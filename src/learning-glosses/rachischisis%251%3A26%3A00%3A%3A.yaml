simpleMeaning: A birth flaw, not rare, where a backbone bone is misshapen, with few signs unless several
  backbone bones are hit or the cord pokes out, found by testing womb fluid.
scope: Also called schistorrhachis and spina bifida, it is a birth flaw, not rare, where a backbone bone
  is misshapen, with few signs unless several backbone bones are hit or the cord pokes out, found by testing
  womb fluid.
examples:
- Rachischisis is a birth flaw of the backbone.
- Rachischisis shows few signs unless several bones are hit.
