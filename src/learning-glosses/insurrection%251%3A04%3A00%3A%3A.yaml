simpleMeaning: a fight in which a group acts together against those in power, and one side tries to take
  control from the other
scope: 'Also called rising, rebellion, uprising, and revolt: a group fight against those in power, not
  a single protest and not a war between two countries.'
examples:
- The insurrection began when soldiers and workers joined together to take control of the city.
- After the insurrection failed, the leaders who had fought the government were put in prison.
