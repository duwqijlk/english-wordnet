simpleMeaning: a wound made when an object such as a knife, a bullet or a piece of burst shell pierces
  the body
scope: 'Also called a penetrating injury: a wound from a thing that pierces the body, not a bruise from
  a blow and not a burn.'
examples:
- The penetrating trauma was caused by a bullet.
- Doctors treated the penetrating trauma in the emergency room.
