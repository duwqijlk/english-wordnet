simpleMeaning: A long, narrow raised line or mark in the land, made by nature
scope: A long raised line in the land made by nature, not the beam at the top of a roof and not the farm
  work of throwing up soil.
examples:
- A ridge of high ground ran along the edge of the field.
- The ridge rose gently above the valley floor.
