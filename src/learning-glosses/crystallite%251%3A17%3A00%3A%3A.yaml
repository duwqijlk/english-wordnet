simpleMeaning: Hard rock made from cooled lava holds tiny, half-formed, glass-like bits of unknown make-up;
  they are one of many
scope: One of many tiny, half-formed, glass-like bits of unknown make-up in hard rock made from cooled
  lava goes by this name.
examples:
- We found crystallites in the hard rock made from cooled lava.
- The rock held many crystallites of unknown make-up.
