simpleMeaning: of a color, made dull by things mixed in, so it is not bright and clear; the word dirty
  is often used with another word
scope: 'Also called dirty, muddy, and dingy: this describes a dull color that is not bright and clear,
  not a thing covered in wet earth.'
examples:
- The muddied grey of the sea looked dull under the clouds.
- They painted the room a muddied white that was not bright at all.
