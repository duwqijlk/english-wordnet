simpleMeaning: said of some crystals, most of all cut stones, that show a star-like pattern of light
scope: A crystal that shows a star of light, not a plain clear stone and not a star in the sky.
examples:
- The asteriated stone showed a bright star when I turned it in the light.
- Only a few asteriated gems show the star clearly.
