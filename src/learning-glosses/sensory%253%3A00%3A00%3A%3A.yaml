simpleMeaning: that has to do with the senses, or comes from them
scope: Having to do with the senses, or coming from them, not a feeling in the mind alone and not a nerve
  that carries signals inwards to the brain.
examples:
- The sensory world of a baby is full of new sights and sounds.
- Sensory experience comes through sight, hearing, touch, taste, and smell.
