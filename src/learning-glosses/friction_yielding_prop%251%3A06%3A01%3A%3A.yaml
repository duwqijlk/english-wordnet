simpleMeaning: A steel post gives, and rubbing between two sliding faces or tubes that fit one inside
  the other holds back its give.
scope: Also called a friction prop and a mechanical yielding prop, this post gives, with rubbing holding
  back its give.
examples:
- The friction yielding prop gave as the load on it grew.
- The friction yielding prop gave, its sliding faces rubbing as it moved.
