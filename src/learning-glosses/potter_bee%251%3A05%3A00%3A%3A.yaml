simpleMeaning: From mud or small stones stuck together and fixed to a plant, this bee builds its nest,
  living alone.
scope: A bee that lives alone and builds a nest of mud or small stones on a plant.
examples:
- A potter bee built a nest of mud.
- We saw a potter bee on a plant.
