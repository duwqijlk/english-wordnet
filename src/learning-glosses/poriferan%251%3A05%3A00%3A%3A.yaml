simpleMeaning: an old kind of sea animal with many cells, its body full of holes and held up by a frame
  of tough fibres, most often found in fixed groups
scope: 'Also called a sponge or a parazoan: a simple sea animal full of holes, not a jellyfish or a coral.'
examples:
- A poriferan sits on the reef and takes in water through its holes.
- The diver saw a poriferan fixed to the rock.
