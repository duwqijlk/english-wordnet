simpleMeaning: to frighten or put a person off doing something with threats and a bossy manner
scope: 'Also called bully and swagger: this is frightening a person with threats and a bossy way, not
  hurting them with your hands.'
examples:
- The boss tried to browbeat her into working on Sunday.
- He would not be browbeaten by their threats.
