senseId: reversible%5:00:00:revocable:00
synsetId: 01765000-s
simpleMeaning: Able to be taken back or undone.
scope: Of a decision or an order, able to be taken back, not a coat that can be worn inside out, not a
  garment that can be used with either side out, not a thing that can simply turn back or be turned back,
  and not a thing that can take either of two states.
examples:
- The judge called the order reversible and set it aside.
- A reversible ruling can be appealed and changed.
