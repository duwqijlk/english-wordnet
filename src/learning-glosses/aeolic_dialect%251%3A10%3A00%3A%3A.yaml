simpleMeaning: The old Greek speech used in Thessaly, Boeotia and Aeolis.
scope: The form of Ancient Greek spoken in Thessaly, Boeotia and Aeolis, also called Aeolic and Eolic;
  its home in those three lands sets it apart from other forms of Ancient Greek.
examples:
- The Aeolic dialect was spoken in Thessaly and Boeotia.
- Poets wrote in the Aeolic dialect.
