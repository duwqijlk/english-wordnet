simpleMeaning: something you say or write back when someone asks you a question or wants you to do something,
  or criticizes or blames you.
scope: It is not the solution to a problem; it is a reply to a person's question, request or criticism.
examples:
- I asked her a question, but she gave no answer.
- His answer to the accusation was calm and clear.
