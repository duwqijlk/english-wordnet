simpleMeaning: Between the seeing part of the eye and its white outer skin sits this thin layer full of
  blood vessels, its dark colour keeping light from spreading inside
scope: This thin layer full of blood vessels in the eye is also called a choroid, and its dark colour
  keeps light from spreading inside.
examples:
- The choroid coat lies between the retina and the white of the eye.
- The choroid coat keeps light from spreading about inside the eye.
