simpleMeaning: a wide, flat, thin stretch of something, such as a layer of ice over a pond
scope: A broad, thin, flat area or surface, as of ice or paint; not a bed covering of cloth, not a single
  piece of paper, and not the mathematical plane.
examples:
- A thin sheet of ice covered the whole pond.
- Mist lay over the fields in a soft sheet.
