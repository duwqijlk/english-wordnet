simpleMeaning: a pattern of small, sharp-pointed squares on cloth, broken up and uneven
scope: Cloth with a pattern of small broken or jagged squares, also called dogs-tooth check, dogstooth
  check, hound's-tooth check or houndstooth check, and not plain cloth or cloth with stripes.
examples:
- Her coat was made of dog's-tooth check.
- He wore a jacket in dog's-tooth check.
