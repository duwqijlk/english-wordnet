senseId: 'democratize%2:41:00::'
synsetId: 02539573-v
simpleMeaning: to start being ruled by leaders the people vote for, or to move further in that way; of
  nations
scope: This is a nation itself moving to rule by leaders its people vote for; not a person or group bringing
  in new rules to make a nation more like this.
examples:
- After the ruler fell, the country began to democratize.
- Over ten years, the small nation slowly democratized and held free votes.
