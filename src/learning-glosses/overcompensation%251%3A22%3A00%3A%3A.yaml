simpleMeaning: Going much too far the other way is how a person tries to make up for a real or imagined
  fault or unwanted habit.
scope: In the study of the mind, trying to make up for a fault by going much too far the other way, not
  simply fixing the fault.
examples:
- His overcompensation for shyness made him talk too much.
- Overcompensation for his fear of heights made him climb higher than anyone.
