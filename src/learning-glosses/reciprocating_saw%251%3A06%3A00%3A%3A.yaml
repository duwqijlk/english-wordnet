simpleMeaning: A hand power tool whose blade moves back and forth, taking many kinds of blade for each
  job and cut, most often with a plate riding the piece being cut.
scope: Also called a jigsaw or a saber saw, it is the hand power tool for cutting with a blade that moves
  back and forth.
examples:
- A reciprocating saw cut through the pipe.
- Fit the right blade to the reciprocating saw for the cut you need.
