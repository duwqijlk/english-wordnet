simpleMeaning: The work of arranging how a company, or one of its activities, is run.
scope: The arranging of a business or its doings only; not the placing of people or things, the quality
  of being neat and orderly, the act of founding something, a group of people who work together, a classifying
  structure, or an administrative body.
examples:
- He was brought in to supervise the organization of a new department.
- She took charge of the organization of the company's annual conference.
