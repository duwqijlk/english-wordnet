simpleMeaning: A strong curved blade with a thick back, carried by soldiers on horseback.
scope: A strong curved blade for soldiers on horseback, not a thin duelling blade and not a short dagger;
  saber and sabre are other names for this sense.
examples:
- The officer drew his cavalry sword as the troop charged.
- A cavalry sword hung at the trooper's side, its blade curved and heavy.
