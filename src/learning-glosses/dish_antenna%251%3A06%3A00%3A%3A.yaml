simpleMeaning: A parabolic reflector, shaped like a bowl, that sends and catches radio waves and microwaves
  in one direction.
scope: Also called dish aerial, dish and saucer, this bowl-shaped parabolic reflector sends and catches
  radio waves and microwaves in one direction only.
examples:
- The dish antenna caught the microwaves.
- The dish antenna sent the radio waves in one direction.
