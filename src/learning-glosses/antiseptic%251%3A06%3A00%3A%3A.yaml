simpleMeaning: a substance that kills very small living things that cause illness, but does not hurt parts
  of the body
scope: A substance that kills things that cause illness, not the adjective sense that means very clean
  and free of such things, and not the sense about making something free of error.
examples:
- She put antiseptic on the cut to kill the germs.
- The nurse cleaned the wound with antiseptic before covering it.
