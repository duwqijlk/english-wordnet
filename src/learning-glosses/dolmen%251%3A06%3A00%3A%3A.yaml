simpleMeaning: A tomb of very old stone, usually built from two large stones set upright with a large
  flat stone laid across the top.
scope: This very old stone tomb is also called cromlech and portal tomb, and it usually has two upright
  stones with a flat stone laid across the top.
examples:
- The dolmen had two large upright stones with a capstone on top.
- We stopped to look at the dolmen on our walk.
