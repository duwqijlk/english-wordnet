simpleMeaning: to cut grain with a scythe, a long tool with a sharp curved blade, that has a frame to
  catch the stems as they fall
scope: This is cutting grain with the special tool, not holding something in your arms and not the place
  where something first began.
examples:
- Using the special tool, he cradled the ripe grain row by row.
- They cradled the wheat all morning, and the cut stems fell in neat rows.
