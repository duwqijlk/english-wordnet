simpleMeaning: In sailing, a rope used to stretch or fasten the ropes that hold up a ship's masts and
  sails.
scope: In sailing, a rope used to stretch or fasten the ropes that hold up a ship's masts and sails; lanyard
  is another name for this sense, not a rope worn round the neck, and not a rope that pulls a sail up.
examples:
- The sailor tightened the laniard on the rigging.
- A laniard held the ropes fast on deck.
