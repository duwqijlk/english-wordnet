simpleMeaning: a glow in the sky, the sun's rays bounced off dust in space along the sun's path, seen
  just before sunrise and just after sunset
scope: A glow in the sky at dawn and dusk, not the northern lights and not the light of the moon.
examples:
- We saw the zodiacal light just before sunrise.
- The zodiacal light glowed faintly after sunset.
