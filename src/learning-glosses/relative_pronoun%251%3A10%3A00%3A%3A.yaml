simpleMeaning: A word such as that, which or who that starts a group of words about a thing named just
  before.
scope: A word such as that, which or who that starts a group of words about a thing named just before;
  not a word that asks a question and not a word that stands for a person.
examples:
- The relative pronoun 'who' joins the two parts of the sentence.
- She used a relative pronoun to link the clause to the noun.
