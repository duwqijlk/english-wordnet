simpleMeaning: The system of muscles, tendons, ligaments, bones, joints, and related tissues that moves
  the body and keeps its form.
scope: This whole frame for moving the body is made of soft parts that pull, cords and bands, bones, joints,
  and tissues together.
examples:
- The musculoskeletal system lets us walk, lift, and bend.
- A fall can hurt the musculoskeletal system in more than one place at once.
