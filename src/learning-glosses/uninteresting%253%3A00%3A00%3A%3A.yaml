simpleMeaning: not making people want to look at it, listen to it, learn about it, or feel excited by
  it
scope: 'This is the general sense: a thing holds no attention and gives no excitement, not the other sense
  of seeming plain and dull like a large office or school.'
examples:
- The book was so uninteresting that I stopped after ten pages.
- He gave an uninteresting talk and many people left early.
