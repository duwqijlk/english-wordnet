simpleMeaning: In computer science, the bit (0 or 1) added to a group of bits so the group has an odd
  or even number of 1s; a mismatch signals an error.
scope: This sense is the computing bit, not the mathematical odd-or-even relation, the physics symmetry
  property, plain equality, or the number of children a woman has given birth to.
examples:
- The controller stores one parity for every byte it sends.
- The stored parity was wrong, so the receiver rejected the byte.
