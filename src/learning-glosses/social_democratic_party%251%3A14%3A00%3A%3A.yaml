simpleMeaning: A political group in Germany, Britain, and elsewhere, founded in the late 1800s, first
  Marxist and now backing the slow change of capitalism into a system run by the people
scope: A political group founded in the late 19th century, first Marxist and now backing the slow change
  of capitalism into a system run by the people, not a party that seeks sudden revolution.
examples:
- The Social Democratic Party won seats in the German election.
- In Britain, the Social Democratic Party backed slow change, not revolution.
