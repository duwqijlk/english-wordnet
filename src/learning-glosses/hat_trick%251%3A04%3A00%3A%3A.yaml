simpleMeaning: In sport, three scores in a row by one player, or three scores in one game, as in cricket
  or ice hockey and other games.
scope: In sport, this is three scores in a row by one player, or three scores in one game, not a single
  score.
examples:
- He scored a hat trick in the final.
- The hat trick won her the match.
