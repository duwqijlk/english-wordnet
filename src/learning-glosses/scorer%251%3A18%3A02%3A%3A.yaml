simpleMeaning: a person whose job is to write down the score as a game goes on
scope: This is the person who keeps the score in a game, not a player who makes a score and not a worker
  who marks trees to be cut down.
examples:
- The scorer wrote down every point as the match went on.
- She worked as the scorer for the school basketball team.
