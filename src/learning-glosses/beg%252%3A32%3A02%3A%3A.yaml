simpleMeaning: to get out of answering a hard point, or to take it as true without proof
scope: To get out of answering a hard point, or to take it as true without proof, not to ask for something
  again and again.
examples:
- Do not beg the question by taking the answer as true.
- He begged the point and never gave a straight answer.
