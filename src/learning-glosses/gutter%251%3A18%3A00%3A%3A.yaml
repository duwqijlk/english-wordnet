simpleMeaning: a person whose job is to take the insides out of things, such as fish, a building, or a
  car, or other such things
scope: A person who guts things for a job, not the rain channel along a roof and not the verbs of putting
  gutters in or cutting them.
examples:
- The gutter cleaned the fish at the dock.
- Gutters worked through the night on the old cars.
