simpleMeaning: With a long bent beak and big whitish or pale yellow flowers with purple marks, this one-year
  plant grows from the south of the United States to Mexico.
scope: Also called common unicorn plant, devil's claw, elephant-tusk, proboscis flower, and ram's horn,
  it is a plant that lives one year, with big flowers and a long bent beak.
examples:
- The common devil's claw has a long bent beak.
- The common devil's claw has big whitish flowers with purple marks.
