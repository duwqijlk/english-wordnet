simpleMeaning: a round piece of wood made on a machine that turns the wood as it is cut, used as a chair
  leg or a short post under a rail
scope: A turned piece of wood used as a chair leg or a short post under a rail; not the thin stick used
  for spinning thread, not a turning shaft in a machine, and not the thin parts seen when cells split.
examples:
- One spindle on the old chair broke and had to be fixed.
- The stairs have thin wooden spindles under the hand rail.
