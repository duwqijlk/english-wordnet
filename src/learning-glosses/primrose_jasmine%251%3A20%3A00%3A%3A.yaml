simpleMeaning: a green shrub from the west of China that keeps its leaves all year, grows in long loose
  stems, and has yellow flowers
scope: This is a green shrub from the west of China with yellow flowers and long loose stems, not a white-flowered
  jasmine and not a low garden bush.
examples:
- The primrose jasmine by the wall was full of yellow flowers.
- We planted a primrose jasmine to climb over the fence.
