simpleMeaning: A climbing plant of the Old World, with leaves in rounded parts that stay green all year,
  and with black fruits that look like berries.
scope: Also called ivy, common ivy and Hedera helix; a climbing plant of the Old World with leaves in
  rounded parts that stay green all year and black fruits that look like berries, not a grape vine and
  not a climbing rose.
examples:
- English ivy covers the old stone wall.
- She planted English ivy along the fence.
