simpleMeaning: One million bits make up this measure of how much data, which is also one thousand kilobits.
scope: Another name for this measure is Mb, and also megabit; it counts bits of data, not bytes.
examples:
- The connection moves data at five Mbit a second.
- A Mbit holds one million bits.
