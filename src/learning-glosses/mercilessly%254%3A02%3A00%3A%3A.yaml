simpleMeaning: in a way that shows no pity and no wish to be kind, even when someone suffers
scope: 'Also called pitilessly, unmercifully, and remorselessly: done with no pity and no wish to be kind,
  not just done in a hard or strict way.'
examples:
- The soldiers mercilessly attacked the small village.
- He was mercilessly beaten by his opponent in the match.
