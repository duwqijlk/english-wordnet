simpleMeaning: Bushy Asian tree with bark like cloth, planted for shade in Europe and America; its hanging
  male flower tassels and urn-shaped female flowers become small orange-red berry clusters.
scope: This is the ornamental Asian tree grown for shade and bark, not the common fruiting mulberry with
  berries people eat.
examples:
- Paper mulberry grows fast along riverbanks in southern China.
- They planted a paper mulberry beside the porch for shade.
