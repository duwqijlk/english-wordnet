simpleMeaning: Coral-red or orange blooms grow on a North American vine, a honeysuckle that keeps its
  leaves all year.
scope: Also called coral honeysuckle, trumpet honeysuckle, and trumpet vine, this North American honeysuckle
  vine keeps its leaves all year, not the Mexican plant of the same name.
examples:
- The trumpet flower showed coral-red blooms.
- The trumpet flower opened its orange blooms.
