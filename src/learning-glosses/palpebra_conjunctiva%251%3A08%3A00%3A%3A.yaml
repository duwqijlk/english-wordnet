senseId: 'palpebra_conjunctiva%1:08:00::'
synsetId: 05323162-n
simpleMeaning: Inside each eyelid, a thin skin lines the back of the lid and runs on to cover the white
  of the eye.
scope: Also called conjunctival layer of eyelids or tunica conjunctiva palpebrarum, this is the lining
  inside the eyelid, which runs on over the white of the eye.
examples:
- The palpebra conjunctiva lines the inside of the eyelid.
- The palpebra conjunctiva runs on to the white of the eye.
