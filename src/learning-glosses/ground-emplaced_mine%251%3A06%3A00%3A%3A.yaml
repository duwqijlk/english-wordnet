senseId: 'ground-emplaced_mine%1:06:00::'
synsetId: 03644989-n
simpleMeaning: A hidden bomb buried in the earth that blows up when a person steps on it or a vehicle
  drives over it
scope: This is a hidden bomb buried in the earth that blows up when stepped or driven on; booby trap and
  land mine are other names for this sense, not a bomb dropped from the air and not a bomb set off by
  hand.
examples:
- Soldiers found a ground-emplaced mine on the road.
- A ground-emplaced mine exploded when the truck drove over it.
