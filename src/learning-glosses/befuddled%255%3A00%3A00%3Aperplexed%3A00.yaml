simpleMeaning: very puzzled by many situations or things people say that do not agree with each other,
  and unable to think clearly
scope: 'Also called lost, confused, bewildered, baffled, bemused, confounded, at sea, mazed, and mixed-up:
  this means too puzzled by things that do not agree with each other to think clearly.'
examples:
- Befuddled by all the different instructions, he did not know where to start.
- She looked befuddled after hearing three explanations that did not agree.
