simpleMeaning: a garden made up of a small group of trees that people plant and look after, with no low
  plants growing under them
scope: A small area of trees kept like a garden, also called orchard, also called plantation; not a wild
  forest with thick growth under the trees.
examples:
- They walked through the grove behind the house in the cool shade.
- He planted a small grove of orange trees, with clear ground under them.
