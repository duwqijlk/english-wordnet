simpleMeaning: a fungus (a living thing like a mushroom) of the Tuber group, much wanted as food, that
  grows under the ground and grows wild in the south-west of Europe
scope: 'Also called earth-ball and earthnut: this is the living thing itself that grows under the ground,
  not the sweet chocolate with the same name.'
examples:
- Truffles grow under the ground near oak trees in the south-west of France.
- People pay a lot for a fresh truffle because it grows wild and is hard to find.
