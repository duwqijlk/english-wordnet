simpleMeaning: In law, the act of choosing not to obey, or of showing no respect for, a court or a group
  that makes laws
scope: 'A law sense: choosing not to obey a court or law-making body, or showing it no respect. It is
  not the feeling of looking down on someone, and not a rude manner.'
examples:
- He was jailed for contempt after he refused to answer the judge's questions.
- The court held the witness in contempt for shouting at the judge.
