simpleMeaning: Orgasm comes and fluid leaves his penis when, during sex between two people, a man puts
  his penis into the vagina of a woman.
scope: 'Also called relation, intercourse, coitus, carnal knowledge, coition, copulation, sex act, sexual
  congress, and sexual intercourse: the act of sex between two people.'
examples:
- A sexual relation ends when orgasm comes and fluid leaves his penis.
- Their sexual relation lasted only a few minutes.
