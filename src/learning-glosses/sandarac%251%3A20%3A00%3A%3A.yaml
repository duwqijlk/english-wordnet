simpleMeaning: A clear, faintly sweet-smelling resin that breaks easily, used to make varnish.
scope: A clear resin for varnish, also called sandarach; not the hard wood of the same name and not amber,
  a hard resin from trees.
examples:
- The cabinet maker brushed sandarac varnish over the table.
- Sandarac gives a clear, hard finish to wood.
