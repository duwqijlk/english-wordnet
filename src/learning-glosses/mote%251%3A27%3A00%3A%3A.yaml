simpleMeaning: in everyday talk, a very small bit of anything at all
scope: In everyday talk, a very small bit of anything; atom, speck, molecule and particle are other names
  for this sense, not a spot of dust only, and not the scientific sense of an atom.
examples:
- Not a mote of truth was in his story.
- A mote of dust floated in the sunlight.
