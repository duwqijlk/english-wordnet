simpleMeaning: A machine that makes pictures of thin slices through the body, showing how the body turns
  food and air into energy and growth.
scope: Also called positron emission tomography scanner; a machine that pictures thin slices of the body,
  set apart from plain X-ray machines by the way it shows the body's use of energy.
examples:
- The PET scanner showed where the drug had gone in his body.
- She lay still while the PET scanner made its pictures.
