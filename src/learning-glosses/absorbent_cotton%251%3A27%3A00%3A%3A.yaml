simpleMeaning: plant fibre with its natural wax taken out, so it soaks up liquid well
scope: This is plant fibre that soaks up liquid well; not plain raw fibre with its wax still on it, and
  not cloth.
examples:
- She pressed absorbent cotton against the cut.
- The nurse used absorbent cotton to clean the wound.
