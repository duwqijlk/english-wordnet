simpleMeaning: a game played on flat grass, where players roll wooden balls that are heavier on one side
  so they curve, toward a small target ball
scope: A game played outdoors on flat grass with balls that curve to one side; not the indoor game where
  a ball knocks down pins, and not a dish for food.
examples:
- They play bowls on the village green every Sunday.
- He joined the local bowls club last year.
