simpleMeaning: A food fish of the north Atlantic and the Mediterranean that matters much, with a green-blue
  body, dark bars and small scales if any
scope: A food fish of the north Atlantic and the Mediterranean that matters much, with a green-blue body,
  dark bars and small scales if any; shiner is another name for this sense, not a fresh-water fish and
  not a fish with big scales.
examples:
- Common mackerel is caught in the north Atlantic.
- They grilled the common mackerel for supper.
