simpleMeaning: In Judaism, a solemn feast day for Jews on the 1st, or the 1st and 2nd, of Tishri, known
  for the blowing of the shofar
scope: Also called the Jewish New Year, Rosh Hashana, Rosh Hashona, and Rosh Hashonah; it marks the start
  of the Jewish year, and its mark is the blowing of the shofar.
examples:
- We heard the shofar blown at Rosh Hashanah this morning.
- Rosh Hashanah falls on the 1st of Tishri, and sometimes lasts two days.
