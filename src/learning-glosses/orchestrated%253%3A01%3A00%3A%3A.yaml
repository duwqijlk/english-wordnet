simpleMeaning: written or changed so that many musical instruments of different kinds can play it together
scope: This is about music written or changed for many instruments to play together, not about an event
  or action that someone has planned with care.
examples:
- The song was orchestrated for a full band with strings and brass.
- He orchestrated the old piano piece so a large group of musicians could play it.
