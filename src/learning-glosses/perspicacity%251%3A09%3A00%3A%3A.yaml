simpleMeaning: Quick, sharp sense shown in the way one handles one's affairs, as in business.
scope: 'Also called shrewdness, and another name for it is astuteness: quick, sharp sense shown in the
  way one handles one''s affairs, as in business, not the wider power to size up a state of affairs and
  draw sound views from it.'
examples:
- Her perspicacity in business made her rich.
- His perspicacity showed in every deal he made.
