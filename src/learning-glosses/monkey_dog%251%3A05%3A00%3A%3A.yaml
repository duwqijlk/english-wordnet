simpleMeaning: From Europe comes a small animal like a terrier, with dark stiff hair and a tuft of hair
  on its nose.
scope: Also called affenpinscher and monkey pinscher, this small animal from Europe is like a terrier,
  with dark stiff hair and a tuft of hair on its nose.
examples:
- The monkey dog has a tuft of hair on its nose and looks much like a terrier.
- A monkey dog from Europe has dark stiff hair.
