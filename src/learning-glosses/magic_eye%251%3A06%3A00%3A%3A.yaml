simpleMeaning: Light and other rays are found by this device, which also tells how strong they are
scope: Also called electric eye, photocell, photoconductive cell and photoelectric cell, this is a device
  that senses light and other rays, not a human eye and not a lamp.
examples:
- The magic eye switched the light on when the room went dark.
- Engineers tested the magic eye to see how well it measured the rays.
