simpleMeaning: A check that counts how much of a protein made only by the prostate gland is in a man's
  body; men with prostate trouble often have high counts.
scope: A check that counts a protein made only by the prostate gland; the count is a level in the blood,
  and high counts often go with prostate trouble.
examples:
- His PSA blood test showed a high level of the protein.
- The doctor ordered a PSA blood test to check his prostate.
