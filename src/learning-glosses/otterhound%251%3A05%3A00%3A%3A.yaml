simpleMeaning: A hardy British hound with long drooping ears and a thick, rough, shaggy coat over an oily
  undercoat, bred to hunt otters.
scope: Another name for the otter hound, the hardy British breed with a shaggy coat; not the bloodhound
  or foxhound.
examples:
- The otterhound's long ears trailed in the water as it swam.
- She keeps two otterhounds on her farm.
