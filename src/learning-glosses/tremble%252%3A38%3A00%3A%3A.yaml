simpleMeaning: Your body twitches or shakes fast in a way you cannot stop, up and down or from side to
  side.
scope: The verb for shaking uncontrollably, not the noun that names the shaking itself and not a steady,
  deliberate movement.
examples:
- His hands were trembling so much that he spilled the coffee.
- She was trembling with cold by the time the bus came.
