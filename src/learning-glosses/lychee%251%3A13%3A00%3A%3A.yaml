simpleMeaning: A fruit from China with a thin, brittle shell round sweet, jelly-like flesh and one seed
  inside, often dried.
scope: Also called a leechee, a lichee, a lichi, a litchee, a litchi, or a litchi nut; a Chinese fruit
  with a thin, brittle shell, not a nut with a hard shell.
examples:
- She peeled a lychee and ate the sweet flesh.
- Dried lychees keep well in a jar.
