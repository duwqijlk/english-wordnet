simpleMeaning: A hard tightening of a muscle that hurts and that you cannot control
scope: A painful tightening of a muscle, also called a cramp; not the sudden closing of a hollow organ.
examples:
- A spasm in his leg made him cry out.
- She felt a spasm grip her back as she bent down.
