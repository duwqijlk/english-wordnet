simpleMeaning: to show that a claim or idea is wrong, while making fun of it, especially when the claim
  or idea is false or tries to look important
scope: To show a claim is wrong while making fun of it, especially a false claim or one that tries to
  look important; not simply to let light reach film and not simply to bring something into contact with
  an influence.
examples:
- The writer exposed the false claims of the so-called healer.
- Her article exposed the pretentious ideas behind the new diet.
