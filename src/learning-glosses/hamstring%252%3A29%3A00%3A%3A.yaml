simpleMeaning: to make a person or animal unable to walk by cutting the strong band at the back of the
  knee
scope: To cut the strong band at the back of the knee so a person or animal cannot walk, not the band
  itself and not making a plan or group weaker.
examples:
- The men hamstrung the horse so it could not run away.
- He hamstrung the animal by cutting the band behind its knee.
