simpleMeaning: Plants that grow in fresh water are where this tiny cone-shaped snail lives and feeds,
  though it only looks like the flat shell-creature it is named for.
scope: Also called freshwater limpet, this tiny cone-shaped creature lives and feeds on plants in fresh
  water, and only looks like a true limpet.
examples:
- The river limpet clung to a leaf in the stream.
- We found river limpets on the reeds at the edge of the pond.
