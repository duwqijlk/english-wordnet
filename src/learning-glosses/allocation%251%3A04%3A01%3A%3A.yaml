simpleMeaning: In computer science, choosing which parts of a magnetic disk will hold which data or instructions
scope: In computers, this is setting parts of a disk aside for data or instructions; it is not the general
  act of giving things out in shares by a plan.
examples:
- Disk allocation decides which parts of the disk hold each file's data.
- Good allocation on a magnetic disk leaves room for new instructions and data.
