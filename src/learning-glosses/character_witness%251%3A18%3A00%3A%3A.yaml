simpleMeaning: a person who swears in court that another person has a good name among the people where
  that person lives
scope: A person who swears in court that another person has a good name where that person lives, not a
  witness to the crime and not a person who speaks about the facts of the case.
examples:
- Her old teacher came as a character witness and told the court she was honest and kind.
- The lawyer called a character witness from the man's own town.
