senseId: 'pharmacologic%3:01:00::'
synsetId: 02923999-a
simpleMeaning: To do with the study of drugs and how they act on the body.
scope: This is about the study of drugs and their effects, also called pharmacological; it is not about
  the making of drugs, and not about the use of drugs in treating one patient.
examples:
- The pharmacologic study looked at how the drug works.
- She wrote a pharmacologic paper on the new medicine.
