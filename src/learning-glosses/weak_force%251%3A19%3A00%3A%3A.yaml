simpleMeaning: In physics, a basic force between particles that makes some atoms break down and release
  energy; it involves tiny particles called neutrinos and is carried by heavy particles.
scope: In physics this is one of the fundamental forces of nature, not everyday physical strength or a
  general lack of power; weak interaction is another name for the same force.
examples:
- Some kinds of radioactive decay happen because of the weak force.
- The weak force involves particles called neutrinos.
