simpleMeaning: to give someone a task and make them responsible for doing it
scope: 'Also called charge, and another name for this sense is burden: it means giving someone a task,
  not putting a seat on a horse or giving them a heavy load to carry.'
examples:
- They saddled him with the job of cleaning all the files.
- She was saddled with the care of three young children.
