simpleMeaning: to put a thick soft substance for the skin on your face or body
scope: This is putting a skin substance on your face or body, not the substance itself, not putting it
  in coffee, and not beating food to make it thick and smooth.
examples:
- She creams her face every night before bed.
- He creamed his hands to keep the skin soft.
