simpleMeaning: a way of keeping money records in which each sum is written in two places, taken from one
  record and put into another
scope: 'Also called double entry: a way of keeping money records with each sum written in two places,
  not a single list of payments and not a way of counting cash.'
examples:
- She learned double-entry bookkeeping in her first job at the bank.
- Double-entry bookkeeping makes it easy to spot a mistake in the accounts.
