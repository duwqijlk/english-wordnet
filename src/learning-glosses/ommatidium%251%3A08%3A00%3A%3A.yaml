simpleMeaning: One small cone-shaped eye among the many that join to form the large eyes of an animal
  with jointed legs.
scope: One small cone-shaped eye among the many that join to form the large eyes of an animal with jointed
  legs; not a single simple eye and not one of the eyes of a fish.
examples:
- Each ommatidium is one small eye in the fly's big eye.
- An ommatidium takes in light from one small part of the scene.
