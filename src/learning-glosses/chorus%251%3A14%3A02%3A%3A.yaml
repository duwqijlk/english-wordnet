simpleMeaning: In old Greek plays, a group of actors who speak or sing together to say what they think
  about what happens in the play
scope: This is the group of actors in an old Greek play, not the part of a song that is sung again and
  again and not a group that sings in a church or concert.
examples:
- In the old Greek play, the chorus spoke together about the king's choice.
- The chorus sang as one while the hero left the city.
