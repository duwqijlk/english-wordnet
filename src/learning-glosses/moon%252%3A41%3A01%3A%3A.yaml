simpleMeaning: to spend time lost in daydreams and imagined scenes while awake.
scope: This sense is about the imagined thoughts themselves, not about simply being idle with nothing
  to do.
examples:
- He mooned over the girl in his chemistry class all term.
- She sat by the lake, mooning over a life she might have had.
