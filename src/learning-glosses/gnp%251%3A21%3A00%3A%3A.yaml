simpleMeaning: The worth of all the goods and services its people and money made in one year, as a rule,
  is how this old way measures the United States economy.
scope: Also called gross national product; an old measure of the United States economy over one year,
  not the worth of one single business.
examples:
- The GNP grew slowly that year as factories made more goods.
- Economists once used the GNP to measure the United States economy.
