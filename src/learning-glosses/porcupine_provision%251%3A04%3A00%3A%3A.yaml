simpleMeaning: When a company does not want to be bought, it takes this step to put off a bid to take
  it over.
scope: A shark repellent is another name for this step, which a company takes to put off a bid to take
  it over rather than to invite a buyer in.
examples:
- The porcupine provision put off the bid to take the company over.
- A porcupine provision discourages a bid the company does not want.
