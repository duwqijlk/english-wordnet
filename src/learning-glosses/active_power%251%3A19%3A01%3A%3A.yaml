senseId: 'active_power%1:19:01::'
synsetId: 92466656-n
simpleMeaning: The share of electric flow that, over one full wave cycle, moves energy one way on balance.
scope: The share of an electric supply that moves energy in one direction and does real work, not the
  part that flows back and forth, and not the whole supply taken together.
examples:
- The active power used by the heater was easy to work out from the meter.
- Only part of the supply counts as active power, since some energy flows back to the source.
