simpleMeaning: One of several kinds of heron, a tall water bird, usually white, with long soft feathers
  in the season when birds have young
scope: A tall, usually white water bird with long feathers in the season when birds have young; it is
  one kind of heron, not a name for all herons or for other white water birds.
examples:
- An egret stood still in the shallow water, its white feathers bright in the sun.
- A group of egrets flew over the lake at sunset.
