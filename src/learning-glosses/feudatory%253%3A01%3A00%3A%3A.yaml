simpleMeaning: It is about the tie, in old times, between a lord and a person who held land from that
  lord
scope: To do with the bond between a landholder and their lord, not the landholder as a person and not
  a land under a king's rule.
examples:
- 'The two men had a feudatory relationship: one held land from the other, his lord.'
- Their feudatory bond lasted for many years.
