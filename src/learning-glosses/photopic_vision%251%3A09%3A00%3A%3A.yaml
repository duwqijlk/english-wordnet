simpleMeaning: When there is light enough for the colour-sensing cells of the eye to work and colours
  to be seen, that is seeing well in the light of day.
scope: It is also called daylight vision, and it is seeing well in the light of day.
examples:
- Photopic vision lets us see colours in daylight.
- In photopic vision the cones of the eye are at work.
