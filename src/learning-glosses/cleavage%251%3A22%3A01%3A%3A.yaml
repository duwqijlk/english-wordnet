simpleMeaning: the breaking of a link between the parts of a tiny bit of matter, so that it splits into
  smaller bits
scope: The breaking of a link between the parts of a tiny bit of matter, so it splits into smaller bits;
  not a groove between two parts of the body and not the splitting of a fertilised egg.
examples:
- Cleavage of the molecule made two smaller parts.
- The cleavage broke the bond and left smaller molecules.
