simpleMeaning: a plant of the cress kind from Europe, with a white underground stem that has lumps along
  it
scope: A European cress plant with a white underground stem that has lumps along it, also called coralroot
  and coralwort; not a sea coral, and not a garden cress grown for food.
examples:
- The coral-root bittercress grows in damp woods in Europe.
- We found coral-root bittercress with its knotted white rootstock under the soil.
