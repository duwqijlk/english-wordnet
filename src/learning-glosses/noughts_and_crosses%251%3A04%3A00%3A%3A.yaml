simpleMeaning: A game where two players by turns put crosses and rings in the boxes of a nine-spot square
  grid, to line up three crosses or three rings first.
scope: This sense is also called tic-tac-toe, tick-tack-toe, ticktacktoe, ticktacktoo and tit-tat-toe,
  for a game where two players by turns put crosses and rings in the boxes of a nine-spot square grid,
  to line up three crosses or three rings first.
examples:
- Noughts and crosses needs two players.
- Noughts and crosses lines up three in a row.
