simpleMeaning: a thick, heavy, oily stuff put on the rods that carry wheels so the wheels turn with ease
scope: A thick oily stuff for the rods that carry wheels, not a thin oil for a small machine and not a
  paste for the skin.
examples:
- He spread axle grease on the cart's rods before the long trip.
- The old axle grease had gone hard and had to be cleaned off.
