senseId: 'heterokontophyta%1:05:00::'
synsetId: 01402170-n
simpleMeaning: Algae with chlorophyll a and usually c, the green colouring that catches light, and whips
  of unequal length; the name takes the place of Chrysophyta in some lists of kinds.
scope: 'Also called division Heterokontophyta: algae with chlorophyll a and usually c and whips of unequal
  length; the name takes the place of Chrysophyta in some lists of kinds, while other algae have whips
  of equal length or no whips at all.'
examples:
- Heterokontophyta includes algae with whips of unequal length.
- Scientists now use Heterokontophyta where older books said Chrysophyta.
