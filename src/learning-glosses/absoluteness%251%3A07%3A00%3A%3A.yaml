simpleMeaning: The quality of being complete and not limited in any way
scope: The quality of being complete and not limited in any way, not a complete thing itself and not merely
  being certain.
examples:
- The absoluteness of his rule left no room for appeal.
- No one questioned the absoluteness of her power.
