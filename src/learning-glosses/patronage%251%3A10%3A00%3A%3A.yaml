schema: oewn-learning-gloss-v2
senseId: 'patronage%1:10:00::'
synsetId: 06732153-n
simpleMeaning: something said or written that shows lack of respect by treating the person who gets it
  as less clever or less important
scope: 'Also called disdain and condescension: something said or written that treats a person as less
  clever or less important, not support given to a person or place, and not jobs or favours given for
  support in politics.'
examples:
- Her reply was full of patronage, as if I knew nothing about my own job.
- The manager's patronage in his letter made the young worker feel small.
