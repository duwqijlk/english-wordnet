simpleMeaning: A dog from Wales, one of two kinds, with a long body and short legs, ears that stand up
  and a head like a fox
scope: A dog from Wales, one of two kinds, with a long body and short legs, ears that stand up and a head
  like a fox; not a long-legged dog, and not a dog with ears that hang down.
examples:
- The corgi trotted after its owner with its short legs.
- Our corgi has upright ears and a fox-like face.
