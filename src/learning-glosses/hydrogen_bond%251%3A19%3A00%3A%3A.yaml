simpleMeaning: A weak attraction between two negative atoms, such as oxygen or nitrogen, where an atom
  of the lightest element links one by sharing electrons and the other by opposite charge.
scope: This is the weak link formed through a tiny atom between two negative atoms, not a covalent bond
  with fully shared electrons or the attraction between fully charged ions.
examples:
- Water's unusually high boiling point comes from hydrogen bonds between its molecules.
- Each hydrogen bond is weaker than a covalent bond but strong enough to hold proteins in shape.
