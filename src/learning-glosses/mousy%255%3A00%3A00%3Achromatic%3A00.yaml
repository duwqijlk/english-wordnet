simpleMeaning: a pale brown colour, dull like the fur of a mouse
scope: Of a dull, pale brown colour like a mouse; not quiet and shy, which is the other sense of the word.
examples:
- Her mousy hair fell straight to her shoulders.
- The walls were painted a mousy brown.
