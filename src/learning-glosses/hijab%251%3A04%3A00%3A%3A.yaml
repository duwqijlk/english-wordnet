simpleMeaning: the custom in some Islamic societies for women to wear clothes that do not show much of
  the body when they are outside the home
scope: The custom of dressing in this covered way in some Islamic societies, not the headscarf itself
  that a woman wears.
examples:
- She follows the hijab and wears loose clothes that cover her body when she goes out.
- In her town, many women keep to the hijab outside the home.
