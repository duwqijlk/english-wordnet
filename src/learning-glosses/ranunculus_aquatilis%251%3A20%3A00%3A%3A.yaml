simpleMeaning: A plant of ponds and slow streams, with leaves under the water and leaves that float, and
  white flowers, from Europe and North America.
scope: Also called water buttercup and water crowfoot; a plant of ponds and slow streams with white flowers,
  not a buttercup of dry meadows and not a plant with yellow flowers.
examples:
- Ranunculus aquatilis floats its white flowers on the slow stream.
- We found Ranunculus aquatilis in the pond, its leaves under the water.
