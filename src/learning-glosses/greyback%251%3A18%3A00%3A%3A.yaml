simpleMeaning: a nickname, 'Johnny', that Northern soldiers gave to Southern soldiers in the American
  Civil War; the name came from the gray uniforms the Southern soldiers wore
scope: A nickname for Southern soldiers in the American Civil War, taken from their gray uniforms; not
  the sandpiper bird of the same name.
examples:
- During the Civil War, a greyback in a gray coat marched past the camp.
- The Northern soldiers called the captured greyback by his nickname.
