simpleMeaning: a thin insect that does not sting, with shining wings that change colour, held out flat
  at rest; grown ones and young ones eat mosquitoes and other small insects
scope: A thin insect that does not sting, with shining wings held out flat; not a bee or a wasp, and not
  a damselfly, which folds its wings.
examples:
- A dragonfly hovered over the pond.
- We watched the dragonfly's wings shine in the sun.
