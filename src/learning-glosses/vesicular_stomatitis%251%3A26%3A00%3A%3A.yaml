simpleMeaning: A sickness of horses, cattle, pigs, and now and then people, caused by a virus.
scope: A sickness of horses, cattle and pigs, now and then of people; not a cold and not a skin rash.
examples:
- Vesicular stomatitis struck the horses on the farm.
- The vet treated the cattle for vesicular stomatitis.
