simpleMeaning: The end of a voltaic cell or storage battery with a positive charge, from which the current
  flows.
scope: The positive end of a voltaic cell or storage battery, not the negative end that sends electrons
  into a device.
examples:
- The cathode gave out the current to the wire.
- He joined the wire to the cathode of the battery.
