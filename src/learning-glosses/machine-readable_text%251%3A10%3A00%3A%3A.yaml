simpleMeaning: Writing stored in a computer as strings of letters and signs, which the computer can show
  in many different forms
scope: Electronic writing a computer can show in different forms; not words printed on paper and not a
  picture.
examples:
- The library keeps the old books as machine-readable text.
- She turned the notes into machine-readable text so the computer could search them.
