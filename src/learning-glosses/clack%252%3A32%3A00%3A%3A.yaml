simpleMeaning: to talk on and on, fast, about things that do not matter
scope: Talking on and on, fast, about things that do not matter, also called chatter, not the sharp sound,
  not the valve, and not the sound hens make.
examples:
- She clacked on about her neighbours all morning.
- He clacked away about things that did not matter.
