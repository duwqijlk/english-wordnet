simpleMeaning: Without this U-shaped bone at the base of the tongue, the muscles that move the tongue
  would have nothing to hold them in place.
scope: This is the bone that gives the tongue muscles something to hold on to, also called hyoid bone
  and os hyoideum.
examples:
- The muscles that move the tongue are held in place by the hyoid.
- At the base of the tongue sits the hyoid.
