simpleMeaning: Having the right to go first, above all when one has served longer than others
scope: Having the right to go first, above all through longer service; not simply older in years, and
  not first by chance of arrival.
examples:
- She got precedential treatment as the longest-serving member.
- Precedential rights went to the senior staff.
