simpleMeaning: To urge others, by speaking, to support a person, plan or idea
scope: 'Also called preach: to speak in support of a person or idea. This is not the noun sense, a person
  who speaks for or supports others.'
examples:
- He advocates a new law to keep the air clean.
- She advocates for better food in schools.
