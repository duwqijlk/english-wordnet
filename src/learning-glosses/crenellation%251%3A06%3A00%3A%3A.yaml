simpleMeaning: a wall built around the top of a castle, with gaps at even spaces for shooting arrows or
  guns through
scope: 'Also called battlement and crenelation: a wall around the top of a castle with gaps for shooting,
  not the act of building such a wall.'
examples:
- The crenellation at the top of the castle had gaps for archers to shoot through.
- Soldiers stood behind the crenellation and fired through its gaps.
