simpleMeaning: to give a lot of something in a free and open way, also used with things you cannot touch,
  like praise
scope: Giving a lot of something, like praise, to a person, not washing your body under water and not
  the thing in the bathroom that sprays water.
examples:
- Her friends showered her with gifts on her birthday.
- The crowd showered the singer with praise after the song.
