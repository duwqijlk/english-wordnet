simpleMeaning: knowingly going against what people accept as right and wrong
scope: Knowingly going against accepted right and wrong, not merely breaking a small rule and not a person
  who knows no better.
examples:
- The judge called the plan immoral and refused it.
- It would be immoral to keep the money when you know whose it is.
