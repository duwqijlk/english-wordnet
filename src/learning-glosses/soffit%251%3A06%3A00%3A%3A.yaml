simpleMeaning: the underside of part of a building, such as an arch, a beam or a part that sticks out
scope: The underside face of part of a building, such as an arch or a beam; not the top of a roof, and
  not a wall.
examples:
- The painter cleaned the soffit above the porch.
- The soffit of the arch was stained with damp.
