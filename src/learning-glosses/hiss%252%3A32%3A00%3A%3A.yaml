senseId: 'hiss%2:32:00::'
synsetId: 01055643-v
simpleMeaning: To make a sharp, breathy sound by forcing air out, as though to show disapproval.
scope: The act of making the sharp sound, not the sound itself, the separate sense of showing displeasure
  after a performance, or the sense of uttering words with a hiss; other names for this sense are siss,
  sizz and sibilate.
examples:
- The snake hissed loudly when we stepped closer.
- Steam hissed from a crack in the pipe.
