senseId: 'life_cycle%1:22:00::'
synsetId: 13529030-n
simpleMeaning: the set of changes a living thing goes through from a fertilized egg cell to the time it
  is grown and can make a new egg cell
scope: The stages one living thing passes through from its start to the time it can make young; not one
  birth alone and not the story of a whole species.
examples:
- The frog's life cycle takes it from egg to tadpole to adult.
- Insects with a short life cycle can breed many times in one summer.
