synsetId: 05835577-n
simpleMeaning: A thing that wakes one set kind of behaviour in a person.
scope: Also called evocation, a thing that wakes one set kind of behaviour in a person, not the making
  of an electric current in a wire and not working out general rules from single facts.
examples:
- The induction of his testimony was not easy, and the lawyer tried again.
- One song brought an induction of tears she had held back for years.
