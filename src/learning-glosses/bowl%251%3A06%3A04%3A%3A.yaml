simpleMeaning: a wooden ball with flattened sides, rolled along a curved path in a game played on a grass
  lawn
scope: This is the small wooden ball rolled in the grass game, not the large finger-holed ball used with
  pins, and not a dish or container.
examples:
- She crouched to measure which bowl was nearer the jack.
- His bowl curved around the edge and stopped beside the jack.
