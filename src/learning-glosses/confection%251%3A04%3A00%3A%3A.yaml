senseId: 'confection%1:04:00::'
synsetId: 00928483-n
simpleMeaning: the act of making something, such as a medicine, a drink, or soup, by mixing different
  parts together
scope: This sense is also called concoction. It is the act of mixing parts to make something, not the
  verb sense with the same word.
examples:
- The confection of this medicine needs careful mixing of several herbs.
- Her confection of a hot soup used many different spices.
