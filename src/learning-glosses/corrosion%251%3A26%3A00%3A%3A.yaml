senseId: 'corrosion%1:26:00::'
synsetId: 14585587-n
simpleMeaning: a state in which metal gets worse when it joins with oxygen (the gas in air) or when chemicals
  act on it
scope: This is a state in which metal gets worse because oxygen or chemicals act on it, not wear from
  wind or water and not a break or crack in the metal.
examples:
- Corrosion had eaten holes in the old metal pipe.
- They painted the gate to stop corrosion.
