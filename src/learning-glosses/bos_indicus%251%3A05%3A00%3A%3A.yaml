simpleMeaning: One of several Indian cattle breeds, especially a large American breed, heat- and tick-resistant,
  greyish humped, crossed from Indian cattle in the Gulf States and now used chiefly for crossbreeding.
scope: Also called Brahma, Brahman and Brahmin; a kind of Indian cattle, not a dairy cow and not a wild
  ox.
examples:
- The rancher keeps Bos indicus for crossbreeding.
- Bos indicus stands the heat of the Gulf States well.
