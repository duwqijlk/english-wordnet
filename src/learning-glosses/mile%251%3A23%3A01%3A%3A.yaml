simpleMeaning: a land distance measure of 1,760 yards, or 5,280 feet, exactly 1,609.344 meters
scope: The everyday land unit, not the 1,852-meter nautical measure or the older 6,000- and 6,080-foot
  British sea units.
examples:
- The village is half a mile from the coast.
- She walks a mile to school each morning.
