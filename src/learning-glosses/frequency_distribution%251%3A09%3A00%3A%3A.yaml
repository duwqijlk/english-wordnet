simpleMeaning: A list or chart showing how often each value of a thing that can change has been seen to
  occur
scope: A showing of how often each value occurs, not a single counted value and not a list of chances
  for values that have not been seen.
examples:
- The frequency distribution shows most scores near the middle.
- A frequency distribution of heights tells how many pupils are of each height.
