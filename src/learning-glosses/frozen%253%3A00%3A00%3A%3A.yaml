simpleMeaning: Turned into ice, or changed by cold strong enough to make ice, or by long, very hard cold
scope: This sense is about ice and long, hard cold. It is not about prices that cannot change, and not
  about a cold, unfriendly look.
examples:
- Children skated on the frozen lake.
- The frozen pipes broke in the hard winter cold.
