simpleMeaning: the act of tying a ship that has just come in fast with ropes
scope: The act of tying a ship that has just come in fast with ropes, also called docking or moorage,
  and not the fee for using a dock or the landing of a ship next to a pier.
examples:
- Dockage took an hour as the crew tied the ship fast.
- The men finished the dockage of the freighter before dawn.
