simpleMeaning: thick flat layers of hard wood with no paint, glued together into a thick slab
scope: Thick flat layers of hard wood with no paint glued into a thick slab, not a thin board and not
  a painted one; butcher block is another name for this sense.
examples:
- She set the butcher board on the counter to cut bread.
- The butcher board was heavy with its thick glued layers.
