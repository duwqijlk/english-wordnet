simpleMeaning: words you say to show that what someone said is wrong, by giving a different idea or reason
scope: An answer in words that says another claim is wrong. Not the law paper that one side in a court
  case writes in reply to the other side.
examples:
- After the talk, she gave a clear rebuttal and showed why the claim was wrong.
- His rebuttal gave a different reason and answered every point the other speaker made.
