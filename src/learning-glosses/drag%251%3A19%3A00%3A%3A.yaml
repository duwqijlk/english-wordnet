simpleMeaning: the force that slows a thing as it moves through air or water, or another fluid (a liquid
  or gas)
scope: This is the slowing force in air or water, not moving something on a computer screen and not clothes
  worn by the opposite sex.
examples:
- Air drag slowed the fast car.
- Swimming is hard work because of the drag of the water.
