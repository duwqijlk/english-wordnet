simpleMeaning: A young Atlantic cod or haddock, above all one split open and with its bones taken out
  for cooking.
scope: A young Atlantic cod or haddock, split and boned for cooking, also called scrod; not the flesh
  of the fish sold on its own and not a grown cod.
examples:
- We ordered schrod, split and boned, for supper.
- The schrod was fresh and tender.
