simpleMeaning: A grave sugar sickness starting early, with passing much water, great thirst, much hunger,
  weight loss, and acid blood at times; diet and shots of insulin hold it in check.
scope: 'Also called autoimmune diabetes, growth-onset diabetes, insulin-dependent diabetes mellitus, juvenile-onset
  diabetes, juvenile diabetes, ketoacidosis-prone diabetes, ketosis-prone diabetes, or type I diabetes:
  a grave sugar sickness that starts early in life, not a sugar sickness that starts late in life and
  not a sickness of the kidneys.'
examples:
- IDDM starts early in life.
- She controls her IDDM with shots of insulin.
