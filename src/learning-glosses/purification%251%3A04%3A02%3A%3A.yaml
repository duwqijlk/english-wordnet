simpleMeaning: a cleaning done in a set ceremony, by carrying out the right holy acts, to remove uncleanness
scope: A cleaning done through a holy ceremony with set acts, not a cleaning of the mind or heart from
  sin and not the taking of unwanted parts out of oil, metal or other things.
examples:
- The purification of the temple was done with water and prayer in a set ceremony.
- After the birth, she took part in a purification held at the temple.
