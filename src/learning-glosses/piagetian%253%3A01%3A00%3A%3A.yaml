simpleMeaning: Like Jean Piaget, or of his ideas and his way of working.
scope: This word describes things in the manner of Jean Piaget; things in the manner of other thinkers
  and the work of Piaget himself are other senses.
examples:
- Her Piagetian view of how children learn shaped the lesson.
- The Piagetian idea of stages guides the new book.
