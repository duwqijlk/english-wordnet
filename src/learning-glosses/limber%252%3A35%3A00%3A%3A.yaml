simpleMeaning: to join a big gun to the two-wheeled cart that pulls it
scope: To join a big gun to its pulling cart so the gun can move; not to make a body bend freely, and
  not the cart itself.
examples:
- The soldiers limbered the cannon before the horses pulled it away.
- He limbered the big gun so it could be moved to a new place.
