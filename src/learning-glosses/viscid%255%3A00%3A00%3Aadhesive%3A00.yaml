simpleMeaning: With the clinging marks of glue.
scope: This sense is also called sticky, pasty, gummy, viscous, gluey, and glutinous, for having the clinging
  marks of glue, where sticky is that sticks to things it touches, like glue does.
examples:
- The sap was viscid, with the clinging marks of glue.
- The gum was viscid, clinging like glue.
