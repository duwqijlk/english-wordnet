simpleMeaning: A shrub that loses its leaves each year and grows flat, with branches in a fanned fish-bone
  pattern, reddish flowers and orange-red berries, used to cover the ground
scope: Among flat-growing shrubs, this one is known by its fanned fish-bone branches, reddish flowers
  and orange-red berries, and by its use as ground cover.
examples:
- Cotoneaster horizontalis spreads flat across the bank.
- We planted Cotoneaster horizontalis as ground cover.
