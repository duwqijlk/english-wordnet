simpleMeaning: A medium-sized evergreen from eastern North America to Mexico's east coast, often grown
  for shade under its wide-spreading crown, with very hard, tough, lasting wood once used in shipbuilding.
scope: Also called southern live oak; a medium-sized evergreen from eastern North America to the east
  coast of Mexico, grown for shade under its wide-spreading crown, with very hard, tough, lasting wood
  once used in shipbuilding.
examples:
- Quercus virginiana shaded the old house, its wide crown spreading over the roof.
- Shipbuilders once used the hard wood of Quercus virginiana.
