simpleMeaning: arrange for something to be kept for another person ahead of time
scope: This is not owning or gripping something; it is arranging in advance for something to be kept for
  another person.
examples:
- Could you hold two tickets for me until Friday?
- The travel agent held a room for us in Rome.
