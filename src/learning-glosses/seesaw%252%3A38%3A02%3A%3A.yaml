simpleMeaning: to move in a shaky way, rocking as you go
scope: 'Also called teeter or totter: moving in a shaky way, rocking as you go, not the playground board
  and not a smooth, steady move.'
examples:
- The old man seesawed along the path, unsteady on his feet.
- The boat seesawed in the waves as we tried to board.
