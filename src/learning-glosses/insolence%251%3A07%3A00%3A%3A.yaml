simpleMeaning: the habit of being rude and bold, taking more freedom than you should
scope: This is the habit of being rude and bold, taking more freedom than you should; crust, gall and
  freshness are other names for this sense, and it is not a single rude word or honest plain speaking.
examples:
- His insolence shocked the whole class.
- She answered the judge with insolence and was fined.
