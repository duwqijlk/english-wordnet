simpleMeaning: the thick bits that settle at the bottom of a liquid
scope: This is the thick bits that settle at the bottom of a liquid, not the clear liquid on top and not
  dirt in a river.
examples:
- He poured out the wine, leaving the dregs in the bottle.
- She did not drink the dregs of her coffee.
