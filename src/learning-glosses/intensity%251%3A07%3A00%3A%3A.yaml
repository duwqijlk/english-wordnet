simpleMeaning: how strong or great something is when it is at a high level
scope: This is about how strong something is in general. It is not how pure and bright a color is, and
  not the amount of energy sent out by sound or light.
examples:
- The intensity of the storm grew through the night.
- She spoke with such intensity that everyone in the room listened.
