simpleMeaning: The person who holds this paper may kill one kind of animal for a set time.
scope: Also called a hunting licence, a hunting license, or a hunting permit, this is a paper that lets
  its holder kill one kind of animal for a set time, not a permit to fish and not a permit to keep an
  animal as a pet.
examples:
- He bought a game license before the hunting season began.
- Her game license lets her hunt deer only until the end of November.
