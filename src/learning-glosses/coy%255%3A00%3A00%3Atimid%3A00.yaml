simpleMeaning: turning down offers or moves toward you in a modest and careful way
scope: Turning down offers or moves toward you in a modest and careful way; not a playful show of shyness
  and not a refusal to give a clear answer.
examples:
- The young horse was coy, stepping back from every hand held out to it.
- The shy girl was coy with strangers, turning away when they spoke to her.
