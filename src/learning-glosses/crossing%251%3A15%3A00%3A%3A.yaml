simpleMeaning: The one place where two paths, curves, or lines meet
scope: The place where two lines meet, not a path for getting over a road or stream and not a place where
  two roads meet.
examples:
- The crossing of the two paths was marked by a big stone.
- At the crossing of the two lines the map showed a small black dot.
