simpleMeaning: The teaching of Martin Luther, above all the central belief that God counts a person as
  right with him by faith alone.
scope: The teaching of Martin Luther on faith alone, not the teaching of Calvin and not a political party.
examples:
- Lutheranism teaches that faith alone makes a person right with God.
- The churches of Lutheranism follow the teaching of Martin Luther.
