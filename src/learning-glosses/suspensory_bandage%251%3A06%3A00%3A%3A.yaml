simpleMeaning: a part of the body that hangs down, such as the scrotum or a breast that hangs low, is
  held up by a band of stretchy cloth
scope: This band is also called a suspensory.
examples:
- A suspensory bandage held the part in place.
- She wore a suspensory bandage for support.
