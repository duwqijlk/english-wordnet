senseId: 'facial_recognition%1:10:00::'
synsetId: 06656868-n
simpleMeaning: a way of telling who a person is by scanning them and matching the scan with pictures of
  known people already stored
scope: This is telling who someone is from a scan; automatic face recognition and face recognition are
  other names for this sense; not telling who someone is from a fingerprint and not from a spoken name.
examples:
- Facial recognition identified the traveller at the gate.
- The shop used facial recognition to spot known shoplifters.
