simpleMeaning: a decoration made of an open pattern of thin parts that cross over each other
scope: This is a decoration in the form of an open pattern of thin parts that cross each other. It is
  not a solid decoration with no open spaces.
examples:
- The church window was filled with stone tracery.
- Thin iron tracery made the top of the gate look nice.
