simpleMeaning: Any of a group of insects with long thin front wings, able to fly fast and hang in the
  air over flowers to feed.
scope: This is any of a group of insects with long thin front wings that can fly fast and hang in the
  air over flowers, not a butterfly; also called hawkmoth, hummingbird moth, sphingid, and sphinx moth.
examples:
- A hawk moth hovered over the flowers at dusk.
- The hawk moth sipped nectar from the bloom.
