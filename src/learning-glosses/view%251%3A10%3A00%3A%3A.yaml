simpleMeaning: a statement of what someone believes about something, said with confidence although no
  direct knowledge or proof supports it
scope: This is an opinion someone puts into words, not a private judgment kept to oneself and not a picture
  of a scene.
examples:
- In her view, the new policy does more harm than good.
- He made his views on the matter clear at the meeting.
