simpleMeaning: Darkness when lights are put out, as in a town made dark so enemy planes cannot see it
scope: Darkness from putting out the lights so enemy planes cannot see, not a power cut by accident; blackout
  and brownout are other names for this sense.
examples:
- The dimout left the whole town in darkness.
- During the dimout, no lights showed from the windows.
