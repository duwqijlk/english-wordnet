simpleMeaning: a loud sound that rings out and goes on again and again
scope: 'Also called crash, clang, clash, and clank: a loud ringing noise, not the verb sense of making
  such a noise and not a quiet single sound.'
examples:
- The clangor of the factory bells filled the street.
- We heard the clangor of metal gates closing again and again.
