simpleMeaning: made not the same as others, especially while growing and changing, or shown to be not
  the same
scope: This sense means made or shown to be not the same, especially while growing. It is not the living-things
  sense about a body part that has grown for one special job.
examples:
- The teacher used differentiated lessons for fast and slow learners.
- The results were clearly differentiated by region, so each area could be seen on its own.
