simpleMeaning: The wood smells of cloves, and the red-brown blooms smell nice, on this tough bush of the
  south-east of the United States.
scope: Strawberry bush and strawberry shrub are other names for it, a tough bush of the south-east with
  clove-smelling wood and red-brown blooms.
examples:
- The sweet shrub in the garden had red-brown blooms.
- The cut branch of sweet shrub smelled of cloves.
