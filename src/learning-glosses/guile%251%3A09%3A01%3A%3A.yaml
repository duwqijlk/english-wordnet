simpleMeaning: the cleverness a person shows by being good at tricking others
scope: 'Also called craft, cunning and slyness: the cleverness a person shows in tricking others, not
  the act of using tricks to fool someone, usually to get money from them.'
examples:
- Her guile helped her talk her way past the guards without being caught.
- With great guile, he made his enemy trust him and tell him everything.
