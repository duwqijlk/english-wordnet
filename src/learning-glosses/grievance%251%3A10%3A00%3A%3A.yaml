senseId: 'grievance%1:10:00::'
synsetId: 07225461-n
simpleMeaning: A complaint about a wrong, real or only thought to be real, that makes a person bitter
  and gives a reason to act.
scope: A bitter complaint about a wrong that calls for action, not a claim about an unlawful duty.
examples:
- His main grievance was the unfair pay.
- She took her grievance to the manager.
