simpleMeaning: To manage to grab and hold someone or something, particularly after a chase.
scope: This is getting hold of someone or something that is running away, typically after a chase, as
  police do with a suspect; it is not trapping an animal in a snare, not closing the gap to someone ahead
  of you, not a door or window fastener, not a stop that limits how far a part can move, not noticing
  a mistake or slip, and not grabbing a moving object to stop it.
examples:
- The police caught the robber after a chase through the market.
- She caught the robber as he tried to climb the fence.
