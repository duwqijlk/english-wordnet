simpleMeaning: A paper that shows its holder is a person from another country allowed to live in the United
  States for good
scope: This is a paper that shows its holder may live in the United States for good, not a paper for a
  short visit and not a paper that shows citizenship.
examples:
- He showed his green card at the border.
- She got her green card after years in the United States.
