simpleMeaning: Stretched out, so the length from top to bottom is more than the length round the middle
scope: Longer from top to bottom than it is wide; not round like a ball and not wider than it is long.
examples:
- The prolate egg was longer from top to bottom than it was wide.
- A prolate ball is stretched out, not round.
