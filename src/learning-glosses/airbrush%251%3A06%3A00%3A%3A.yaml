simpleMeaning: a tool that uses air under strong pressure to push paint out as a spray
scope: This sense is the tool used to spray paint with pressed air; it is not the act of painting with
  this tool and not a brush with soft hairs used for dry paint.
examples:
- The artist used an airbrush to paint a smooth sky on the wall.
- He cleaned the airbrush after spraying the model car.
