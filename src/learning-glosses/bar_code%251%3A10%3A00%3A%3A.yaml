simpleMeaning: a pattern of thick and thin lines on a product package, read by a laser scanner so a computer
  can identify the item, find the price and track stock
scope: This is the printed stripe pattern read at a checkout, not a QR code or another square-pattern
  code.
examples:
- The cashier scanned the bar code on the cereal box.
- Each bar code gives the computer the item's price and stock number.
