simpleMeaning: one of the long main wing parts that help a bird fly and stick out along the outer edge
  of its wing
scope: Also called primary and primary quill, this is one of the long main wing parts at the outer edge
  of a bird's wing, not a soft down part and not a tail part.
examples:
- The hawk lost a primary feather during the storm.
- The vet checked the primary feathers on the owl's wing.
