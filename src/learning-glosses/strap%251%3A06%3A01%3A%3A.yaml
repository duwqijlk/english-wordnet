simpleMeaning: a long piece of leather, or of a similar material, used to tie things together or to keep
  a thing in place
scope: A long piece for tying things together or keeping a thing in place, not a loop to hold on a bus,
  not a whip for hitting, and not a band over the shoulder.
examples:
- He used a strap to tie the boxes together.
- She tightened the strap to keep the load in place on the roof.
