simpleMeaning: with the back end of a ship first, going backward
scope: Moving backward with the back end first, not just being at or near the back end of a ship or airplane.
examples:
- The large boat went astern slowly, back end first.
- The captain ordered the ship to move astern to leave the narrow place.
