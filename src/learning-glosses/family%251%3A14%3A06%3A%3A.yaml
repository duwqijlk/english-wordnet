simpleMeaning: A loosely organized group of criminals who run illegal activities together.
scope: This is not a group of relatives and not a household; it is a criminal organization.
examples:
- The police linked the killing to a crime family in the city.
- He was said to be a member of a family that ran illegal gambling across the city.
