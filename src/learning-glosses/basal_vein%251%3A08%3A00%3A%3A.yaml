simpleMeaning: This large blood tube drains into the large blood tube of the brain, after running along
  the inner face of the side part of the brain.
scope: Also called vena basalis, this is a large blood tube of the side part of the brain, not the large
  blood tube of the brain it drains into.
examples:
- The basal vein runs along the side part of the brain.
- The basal vein drains into the large blood tube of the brain.
