simpleMeaning: a small tube with a soft bulb at one end, used to suck liquid up and let it out in tiny
  amounts, one bit at a time
scope: A small tube for moving liquid in tiny amounts, also called eye dropper; it is not a bottle of
  medicine and not a large tube used in a science lab.
examples:
- She used a dropper to put two drops of medicine in the baby's mouth.
- Fill the dropper with water and let it out a little at a time.
