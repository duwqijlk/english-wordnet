simpleMeaning: In boxing, a hit made with the fist
scope: 'Also called punch, and also called lick: in boxing, a hit with the fist, not a sharp hand move
  that only looks like a hit and not a bag.'
examples:
- A quick poke to the nose knocked the boxer back.
- The boxer landed a hard poke with his right fist.
