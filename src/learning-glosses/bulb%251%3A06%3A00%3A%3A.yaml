simpleMeaning: an electric light made of clear or partly clear glass, with a thin wire inside, usually
  of tungsten (a hard metal), that gives light when electricity makes it hot
scope: 'Also called lightbulb: the glass electric light used in a lamp or on a ceiling, not the round
  underground part of a plant and not the lowest back part of the brain.'
examples:
- The bulb in the kitchen light has stopped working, so I bought a new one.
- He changed the old bulb for a brighter one.
