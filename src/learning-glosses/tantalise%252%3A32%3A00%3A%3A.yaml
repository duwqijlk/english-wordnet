schema: oewn-learning-gloss-v2
senseId: 'tantalise%2:32:00::'
synsetId: 00852181-v
simpleMeaning: To nag someone with steady fault-finding and carping words, without let-up.
scope: This sense is also called a ride, a rag, a tease, a rally, a cod, bait, a taunt, tantalize, a twit,
  and a razz, for nagging someone with steady fault-finding and carping words, without let-up, where a
  ride is teasing or mocking someone with unkind comments, kept up, a rag is finding fault with a person,
  over and over, a tease is picking on someone with unkind, fault-finding words, over and over, a rally
  is picking on a person with words that find fault, over and over, and a cod is saying unkind, fault-finding
  things to a person, over and over.
examples:
- He would tantalise his brother with steady carping.
- She tantalised him with fault-finding words all day.
