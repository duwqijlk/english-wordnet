simpleMeaning: Often found as a weed in the United States, this rough, bristly plant of Europe and Asia
  has white or reddish flowers and leaves like those of a stinging plant
scope: Also called dead nettle, this is a bristly weed of the United States, not a true nettle.
examples:
- Hemp nettle grows as a weed in the United States.
- The hemp nettle has white flowers and leaves like those of a stinging plant.
