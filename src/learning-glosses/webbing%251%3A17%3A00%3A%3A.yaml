simpleMeaning: a thin part that joins other parts, as the skin between the toes of birds
scope: A thin part that joins other parts, like the skin between a bird's toes; not strong cloth woven
  in strips and not the narrow tape used for seat belts or for covering chairs and sofas.
examples:
- The duck's webbing helps it push through the water as it swims.
- Webbing between the frog's toes helps it swim well.
