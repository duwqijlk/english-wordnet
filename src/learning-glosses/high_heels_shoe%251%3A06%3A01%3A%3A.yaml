simpleMeaning: The back of the foot is lifted well off the ground in this kind of shoe, far above the
  toes, by a tall raised part at the back.
scope: Also called high-heeled shoe and high heels, this is a shoe with a tall raised back part, not a
  flat shoe.
examples:
- The high heels shoe in the window had a tall raised back.
- She tried on a high heels shoe and felt her foot tip forward.
