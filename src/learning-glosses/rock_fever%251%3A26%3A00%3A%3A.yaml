simpleMeaning: A catching illness of people caused by germs, spread by touch with infected animals or
  their meat or milk, marked by high temperature and headache.
scope: A catching illness from infected animals or their meat or milk, with high temperature and headache;
  also called brucellosis, undulant fever, Gibraltar fever, Malta fever and Mediterranean fever.
examples:
- Rock fever spread through the village after the infected goats were sold.
- He caught rock fever from infected milk.
