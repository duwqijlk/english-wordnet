simpleMeaning: all the vehicles with wheels that a train company or a road haulage firm owns
scope: The wheeled vehicles a train or road-haulage firm owns, not the track and not the goods carried.
examples:
- The company added new cars to its rolling stock.
- Much of the rolling stock was old and needed repair.
