simpleMeaning: a piece of cloth that hangs down to cover something, most of all a window
scope: 'Also called curtain and drape: a hanging cloth that covers something, most of all a window, not
  a short cloak and not a layer inside a shell animal.'
examples:
- She drew the mantle across the window to keep out the light.
- The mantle hung over the tall window all day.
