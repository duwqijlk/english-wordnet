simpleMeaning: To put things in order under one clear set of rules
scope: To put things in order under one clear set of rules; systematise, systematize and systemize are
  other names for this sense, not to mix things up and not to sort things by size.
examples:
- We should systemise the records before the audit.
- He systemised his notes every evening.
