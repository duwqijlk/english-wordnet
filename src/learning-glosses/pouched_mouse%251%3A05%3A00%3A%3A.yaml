simpleMeaning: With their young in a pouch, many kinds of small sharp-nosed animals eat insects, yet on
  the outside they look like mice or rats.
scope: 'Also called the marsupial mouse and the marsupial rat: a small sharp-nosed animal that eats insects
  and carries its young in a pouch, not a true mouse or rat.'
examples:
- The pouched mouse darted through the grass, its pointed nose sniffing for insects.
- A pouched mouse carried its young in its pouch as it searched for insects.
