simpleMeaning: the part of a band or orchestra that plays drums and other instruments hit to make sounds
scope: This is the group of players who hit drums and like instruments, not tapping a person's body to
  check for illness and not setting off a small charge in a gun.
examples:
- The percussion at the back of the orchestra kept a steady beat.
- He plays in the percussion section and hits the big drum.
