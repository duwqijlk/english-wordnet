simpleMeaning: a way of taking pictures that keeps the picture as numbers so it can be made again later
scope: A way of taking pictures that keeps the picture as numbers for making again later, and not a way
  of taking pictures on film.
examples:
- With digital photography, she could see each shot at once on the back of the camera.
- Digital photography lets him keep hundreds of pictures on one small card.
