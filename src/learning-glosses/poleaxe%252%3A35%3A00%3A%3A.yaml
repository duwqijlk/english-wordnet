simpleMeaning: to knock down or cut down a person or animal with a long-handled axe, or as if with one
scope: 'Also called poleax: this is the act of knocking or cutting someone or something down, not the
  long-handled axe itself used for killing cattle or for fighting long ago.'
examples:
- The soldier poleaxed his opponent with one blow.
- The boxer was poleaxed by a hard punch and fell straight down.
