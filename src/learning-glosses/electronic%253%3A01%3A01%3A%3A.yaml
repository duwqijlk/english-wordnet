simpleMeaning: about electrons, the very small parts inside atoms that carry an electric charge
scope: This sense is about electrons themselves, not about machines or tools that work by using electrons.
examples:
- Electronic energy is linked to how electrons move.
- Electronic charge is a property of electrons themselves.
