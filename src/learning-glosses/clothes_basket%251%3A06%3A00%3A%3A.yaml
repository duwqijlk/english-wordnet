simpleMeaning: a container that holds soiled garments to wash or damp ones to dry
scope: A container for soiled or damp garments awaiting the wash; clothes hamper, laundry basket and voider
  are other names for this, not a machine that washes and not a bag for clean garments.
examples:
- Put the dirty clothes in the clothes basket by the door.
- She emptied the clothes basket into the machine.
