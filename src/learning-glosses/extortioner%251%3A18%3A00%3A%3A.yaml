simpleMeaning: a lawbreaker who gets money from a person by saying they will tell others a shameful secret
  about that person unless they pay
scope: 'Also called a blackmailer and an extortionist: a lawbreaker who gets money by saying they will
  tell a shameful secret unless they are paid, not a thief who steals openly and not a person who asks
  for money honestly.'
examples:
- The extortioner demanded cash and said he would tell the whole town her secret.
- Police arrested the extortioner after he threatened to expose the mayor's past.
