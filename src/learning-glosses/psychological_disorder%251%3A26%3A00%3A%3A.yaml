simpleMeaning: In psychiatry, a problem of thought or feeling, a softer word than mental illness.
scope: A problem of thought or feeling, also called disturbance, folie, mental disorder and mental disturbance;
  not a bodily illness and not a passing bad mood.
examples:
- A psychological disorder can change how a person thinks and feels.
- He was treated for a psychological disorder that made him fear crowds.
