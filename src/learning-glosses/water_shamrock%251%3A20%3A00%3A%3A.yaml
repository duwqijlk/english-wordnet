simpleMeaning: A perennial plant of Europe and America with intensely bitter three-part leaves and clusters
  of white or purplish flowers; it often roots at the water's edge and spreads over water.
scope: 'Another name for marsh trefoil and bogbean: a water-side plant with three-part leaves, not a shamrock
  or clover.'
examples:
- Water shamrock spreads across the surface of shallow water.
- Water shamrock bears white or purplish flowers above its bitter leaves.
