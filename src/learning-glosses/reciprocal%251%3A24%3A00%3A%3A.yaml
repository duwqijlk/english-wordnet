senseId: 'reciprocal%1:24:00::'
synsetId: 13865372-n
simpleMeaning: In mathematics, one of two numbers that give 1 when multiplied together, such as 3/2 for
  2/3 or 1/7 for 7
scope: In mathematics, this is a number that pairs with another to make 1 when multiplied together. It
  is not the adjective sense about an inverse amount or working, and not a general word for something
  with an opposite link.
examples:
- The reciprocal of 4 is 1/4.
- To divide by 2/3, multiply by its reciprocal, 3/2.
