simpleMeaning: The brain and the spinal cord, and the thin skins that wrap them, are swollen
scope: Swelling of the brain, the spinal cord and their thin skins, also called cerebromeningitis and
  encephalomeningitis; not swelling of the brain alone and not an infection of the blood.
examples:
- Meningoencephalitis left him with a fever and a stiff neck.
- The doctors treated her meningoencephalitis with strong drugs.
