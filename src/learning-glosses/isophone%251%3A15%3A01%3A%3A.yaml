schema: oewn-learning-gloss-v2
senseId: 'isophone%1:15:01::'
synsetId: 92408452-n
simpleMeaning: In linguistics, people in one area say a sound in one set way, while others say it another
  way; a line on a map shows where that area ends
scope: In linguistics, a line marking the area where a sound is said in one set way; not a line marking
  where a word is used and not a line joining places with the same number.
examples:
- People north of the isophone say the word with a hard 'g'.
- The isophone runs along the river, marking where the vowel is said in a new way.
