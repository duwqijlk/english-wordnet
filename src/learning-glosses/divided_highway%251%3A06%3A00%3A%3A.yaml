simpleMeaning: a road split down the middle by a barrier that keeps traffic going in opposite ways apart
scope: A road split down the middle by a barrier that keeps opposite traffic apart, also called a dual
  carriageway; not a single road with no barrier and not a one-way street.
examples:
- We joined the divided highway north of town.
- The divided highway has three lanes each way.
