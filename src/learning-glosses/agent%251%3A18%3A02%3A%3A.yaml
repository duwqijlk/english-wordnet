simpleMeaning: a person who acts or speaks for another person or for an organization.
scope: This is not a force that produces an effect and not a spy; it is a person who represents others
  in dealings.
examples:
- The actor's agent negotiated a better contract.
- Our travel agent booked the flights and hotel.
