simpleMeaning: the part of the body between the chest and the hips in an animal with a backbone
scope: 'Also called stomach: the part of the body between the chest and the hips, not the under side of
  a snake or fish.'
examples:
- The dog lay down and showed its soft belly.
- She put her hand on her belly and felt the baby move.
