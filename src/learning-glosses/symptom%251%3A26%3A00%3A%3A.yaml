senseId: 'symptom%1:26:00::'
synsetId: 14323139-n
simpleMeaning: In medicine, any feeling or change in how the body works that a sick person has and that
  is linked to a certain illness
scope: In medicine, a feeling or change in the body linked to an illness; not the wider sense of any sign
  that shows something else is present.
examples:
- A high fever is a common symptom of flu.
- He told the doctor about his symptoms, especially the pain in his chest.
