simpleMeaning: A member of one of four language groups of the early Greeks, spoken in Boeotia, Thessaly,
  on the Aegean island of Lesbos, and in the Greek colonies of Asia Minor.
scope: Not an Achaean, a Dorian, or an Ionian, the other Greek language groups; also called Eolian.
examples:
- The Aeolian spoke a form of early Greek.
- An Aeolian lived on Lesbos.
