simpleMeaning: Of or about the island country once called Ceylon, its people, or its way of life.
scope: Also called Ceylonese, this word is used of the island country once called Ceylon, its people,
  or its way of life, not of a person who lives there.
examples:
- Sri Lankan food is known for its hot spices.
- The Sri Lankan team played well in the match.
