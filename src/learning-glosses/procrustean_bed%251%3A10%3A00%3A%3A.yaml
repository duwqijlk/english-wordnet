simpleMeaning: Everyone is made to fit the same measure, and how each one differs is not taken into account
scope: A measure that everyone is made to fit; procrustean rule and procrustean standard are other names
  for this sense, not a measure that bends to fit each person.
examples:
- The school's procrustean bed made every child learn at the same speed.
- He called the new law a procrustean bed because it left no room for differences.
