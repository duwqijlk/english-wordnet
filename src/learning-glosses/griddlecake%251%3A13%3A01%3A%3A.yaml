simpleMeaning: A flat round of thin batter cooked on both sides on a hot flat pan.
scope: 'Also called a pancake, a flapjack, a hotcake, a battercake, a flannel-cake or flannel cake, a
  flapcake, or a hot cake: a flat round of thin batter cooked on both sides, not a scone made by dropping
  batter.'
examples:
- She made griddlecakes for breakfast on the hot pan.
- A griddlecake is best eaten warm with syrup.
