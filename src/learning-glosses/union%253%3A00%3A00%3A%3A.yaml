simpleMeaning: connected with groups of workers who join together to ask for better pay and conditions.
scope: This is not the noun for such a group itself, and not a country or organization formed by joining
  parts; it describes something belonging to worker groups.
examples:
- The union leader spoke to the workers outside the factory.
- Union rules say that overtime must be paid.
