simpleMeaning: Most often after hormone treatment, or when the glands above the kidneys go wrong, a woman
  grows the marks of a man in a wrong way.
scope: Also called masculinisation, masculinization, and virilization, it is a wrong change in a woman
  that gives her the marks of a man.
examples:
- The virilisation followed months of hormone treatment.
- The virilisation came from the glands above her kidneys going wrong.
