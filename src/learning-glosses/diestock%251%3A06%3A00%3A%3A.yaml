simpleMeaning: A tool that holds the hard cutting pieces that cut screw ridges on the outside of metal
  rods
scope: This is a tool that holds the hard cutting pieces that cut screw ridges on the outside of metal
  rods, not a tool that cuts threads inside a hole and not a tool that holds a drill.
examples:
- He fitted the diestock over the rod to cut the thread.
- A diestock holds the dies that shape the outside of the rod.
