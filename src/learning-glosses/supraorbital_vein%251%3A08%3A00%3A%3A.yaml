simpleMeaning: Blood from the front of the scalp leaves through this tube, which joins the tube above
  the eye so the two become one tube.
scope: Vena supraorbitalis is another name for this blood tube that drains the front of the scalp and
  joins the tube above the eye.
examples:
- The supraorbital vein drains blood from the front of the scalp.
- The supraorbital vein joins the supratrochlear vein to form the angular vein.
