simpleMeaning: the quality of being much larger than usual in size, in how far it reaches, or in number
scope: Also called greatness, immensity, grandness and wideness. This is about size, how far a thing reaches,
  or number, not about how good or important a thing is.
examples:
- The vastness of the sea made the small boat look tiny.
- She stood still, struck by the vastness of the desert.
