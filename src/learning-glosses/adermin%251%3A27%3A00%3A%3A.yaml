simpleMeaning: to break down starch and the building blocks of protein, the body must have this B vitamin
scope: It is also called pyridoxine, pyridoxal, or pyridoxamine, and it is a B vitamin the body must have
  to break down starch and the building blocks of protein.
examples:
- Without enough adermin, the body cannot break down starch well.
- A lack of adermin meant the body could not break down starch well.
