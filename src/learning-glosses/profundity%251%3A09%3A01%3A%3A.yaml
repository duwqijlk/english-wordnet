simpleMeaning: Wisdom that is deep and hard to follow, known to few and taking much thought to grasp.
scope: Wisdom that is deep and hard to follow, known to few and taking much thought to grasp, not the
  gift of seeing deeply into ideas, nor deep thought and keen insight in general.
examples:
- The profundity of the old proverbs struck the traveller, though their sense was hard to follow.
- She spoke with a profundity that left the room silent.
