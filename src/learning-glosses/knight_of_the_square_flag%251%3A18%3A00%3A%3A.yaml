simpleMeaning: A fighting man on horseback honoured for bravery, allowed to show a four-sided cloth sign
  and to hold higher command.
scope: This is a fighting man on horseback honoured for bravery, allowed to show a four-sided cloth sign
  and to hold higher command; banneret and knight banneret are other names for it, not an ordinary knight
  and not a lord.
examples:
- The knight of the square flag was honoured for bravery.
- A knight of the square flag could hold higher command.
