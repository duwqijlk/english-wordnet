simpleMeaning: an amount of alcohol that is enough to make a person drunk
scope: An amount of alcohol that makes a person drunk, not an amount carried or worked on at one time
  and not a device that uses electrical power.
examples:
- He got a load on at the party and could not stand up.
- She came home with a load on after drinking too much beer.
