simpleMeaning: cell molecules, in at least 20 kinds, each carrying one kind of amino acid to a growing
  protein chain at the cell's protein-making place, following orders from messenger molecules
scope: 'Also called acceptor RNA, soluble RNA and transfer RNA: cell molecules that carry amino acids
  to growing protein chains, not the messenger molecules that carry the orders.'
examples:
- tRNA carries amino acids to the protein chain.
- Each kind of tRNA carries one amino acid.
