simpleMeaning: In dentistry, the normal way the upper and lower teeth meet when the jaws are shut.
scope: The normal way the teeth meet when the jaws are shut; not the way teeth are set in a false set
  of teeth, and not a weather occlusion.
examples:
- The dentist checked her occlusion after fitting the crown.
- Good occlusion means the teeth meet evenly when the jaws shut.
