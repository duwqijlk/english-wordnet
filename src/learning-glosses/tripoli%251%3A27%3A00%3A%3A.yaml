simpleMeaning: A worn-down crumbly limestone rich in glass-like bits; ground to powder, it is used for
  polishing
scope: A worn-down crumbly stone used in powder form for polishing, also called rottenstone; not sandstone
  and not a hard building stone.
examples:
- The worker rubbed the metal bright with tripoli.
- Tripoli powder gives a fine polish to stone and metal.
