simpleMeaning: People who have done wrong suffer punishment that never ends in the place below where Satan
  and the forces of evil dwell, in Christianity.
scope: The pit, the infernal region, and perdition are also names for this place in Christianity where
  people who have done wrong suffer punishment that never ends.
examples:
- Sinners were sent to the nether region.
- The forces of evil dwell in the nether region.
