simpleMeaning: A set of air photos joined to make one big picture.
scope: A set of air photos joined to make one big picture; mosaic and aerial mosaic are other names for
  this sense, not a single photo and not a floor mosaic.
examples:
- The survey team built a photomosaic of the whole valley.
- A photomosaic showed the coastline in one view.
