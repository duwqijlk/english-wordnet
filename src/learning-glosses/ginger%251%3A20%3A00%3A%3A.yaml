simpleMeaning: A plant that lives for many years; it has thick underground stems that spread out and have
  a strong, pleasant smell, and it has tall, thin stems with leaves
scope: The whole living plant; not its underground stem used fresh in cooking, and not the dried ground
  powder used to add taste to food.
examples:
- Ginger grows well in warm, wet places.
- The garden has ginger with tall, leafy stems.
