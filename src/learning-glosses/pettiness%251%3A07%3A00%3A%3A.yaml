senseId: 'pettiness%1:07:00::'
synsetId: 05180732-n
simpleMeaning: the quality of being not important and not serious, and of caring too much about small
  things
scope: 'Also called triviality, also called puniness, and also called slightness: the quality of being
  not important and not serious, and of caring too much about small things; not a single small act or
  thing.'
examples:
- His pettiness showed when he argued for an hour about who got the extra pen.
- She was tired of the pettiness of office quarrels over small things.
