simpleMeaning: the quality of going against what a person feels is right or against good moral rules
scope: The moral badness of an act, not the fact that an answer or statement is not correct.
examples:
- He felt the wrongness of lying to his friend.
- She spoke about the wrongness of stealing from the poor.
