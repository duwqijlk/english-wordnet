senseId: 'remonstrate%2:32:04::'
synsetId: 00826456-v
simpleMeaning: to speak to a person in a hard and angry way to blame them for what they did
scope: Also called jaw, rag, lecture, scold, chide, rebuke, berate, reprimand, trounce, lambaste and lambast.
  This is blaming a person hard and angrily, not arguing against a plan or act in protest.
examples:
- The mother remonstrated with her son for taking the car without asking.
- The teacher remonstrated with the boy for breaking the window.
