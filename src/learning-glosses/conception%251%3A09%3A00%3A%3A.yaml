simpleMeaning: a general idea that is not about one real thing, formed in the mind from particular examples
  or cases
scope: 'Also called concept and construct: a general idea formed from particular examples, not the start
  of a pregnancy when a sperm joins an egg.'
examples:
- His conception of justice came from many real cases he had seen.
- Our conception of the world changes as we learn from examples.
