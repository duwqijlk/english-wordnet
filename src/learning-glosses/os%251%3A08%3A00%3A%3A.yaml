simpleMeaning: hard, stiff body tissue that holds the body up and makes its inside frame, in animals that
  have a back bone
scope: 'Also called bone: the hard tissue that makes the inside frame of the body, not skin, not muscle,
  and not the soft parts of the body.'
examples:
- In the science book, the word os is used for a bone.
- Each os in the hand is small but strong.
