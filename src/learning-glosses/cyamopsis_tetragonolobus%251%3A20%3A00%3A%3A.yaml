simpleMeaning: A plant that lives through dry weather, grown as feed for animals and for seeds that give
  a gum used to thicken liquids or stiffen materials
scope: This is a dry-weather plant grown for animal feed and for a gum from its seeds; guar, cluster bean
  and Cyamopsis psoraloides are other names for this sense, and it stands apart from other feed plants
  by the gum its seeds give.
examples:
- Cyamopsis tetragonolobus grows well in dry fields.
- Farmers plant Cyamopsis tetragonolobus for feed and for its gum.
