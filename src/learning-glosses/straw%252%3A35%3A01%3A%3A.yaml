simpleMeaning: to put a layer of dry plant stems, or something like them, over something, or to give it
  such a layer
scope: This is about laying dry plant stems, or something like them, over a thing, not the plant fibre
  itself, not a drinking tube, and not spreading things by throwing them about.
examples:
- The farmer strawed the beds to keep the young plants warm.
- They strawed the floor of the barn before the cold night.
