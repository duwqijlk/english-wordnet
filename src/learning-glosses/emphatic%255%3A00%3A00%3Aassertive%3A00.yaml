senseId: emphatic%5:00:00:assertive:00
synsetId: 00157841-s
simpleMeaning: strong and clear in your words or actions, and firm, so that people are in no doubt that
  you mean it
scope: 'Also called forceful: this is about being strong, clear and firm in words or actions. It is not
  the sense where a word is spoken with extra force.'
examples:
- She gave an emphatic no when I asked her to sell the house.
- 'His answer was emphatic: he would not change his mind.'
