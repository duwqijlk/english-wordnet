simpleMeaning: A news writer can keep quiet about who gives them secret information
scope: A news writer can keep quiet about who gives them secret information; not the right to print anything
  and not a right held by everyone who talks to the press.
examples:
- The paper went to court to defend the journalist's privilege.
- The journalist's privilege let her protect the name of the person who told her the news.
