schema: oewn-learning-gloss-v2
senseId: 'nominal%1:10:00::'
synsetId: 06327473-n
simpleMeaning: A group of words used as the subject (who or what the sentence is about) or the object
  (who or what the verb acts on) in a sentence
scope: This is a group of words used as a noun in a sentence; not the adjective sense for a word group
  that works as a noun, not a very small amount, and not the sense about a name.
examples:
- In 'the tall man by the door', the whole group of words is a nominal that acts as the subject.
- The teacher circled a nominal in the sentence and asked what work it did.
