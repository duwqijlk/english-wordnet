simpleMeaning: Silk or the soft fur of a beaver covers it most times, and the headwear for men rises to
  a tall crown.
scope: Also called a beaver, a stovepipe, a topper, a dress hat, an opera hat, a silk hat, or a top hat,
  it is a tall piece of headwear for men.
examples:
- He wore a high hat to the opera.
- The high hat has a tall crown covered in silk.
