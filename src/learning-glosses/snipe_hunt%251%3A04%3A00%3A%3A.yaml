simpleMeaning: An unsuspecting person sent to look for a bird is often left in darkness with a bag, waiting
  for the bird to run into it, as a detailed trick
scope: It is a detailed trick in which a person is sent to look for a bird and left waiting in the dark
  with a bag, not a real search for a bird.
examples:
- In the South, a snipe hunt is practically a rite of passage.
- He waited in the dark with a bag on a snipe hunt.
