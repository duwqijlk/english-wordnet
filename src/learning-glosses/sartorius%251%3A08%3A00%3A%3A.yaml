simpleMeaning: The longest band of flesh in the human body, in the upper leg, it turns the leg to the
  cross-legged way of sitting.
scope: Also called musculus sartorius and sartorius muscle, this band of flesh in the upper leg turns
  the leg to the cross-legged way of sitting and is the longest such band in the human body.
examples:
- Sitting cross-legged works the sartorius in the thigh.
- The sartorius helps turn the leg to sit cross-legged.
