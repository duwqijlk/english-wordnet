simpleMeaning: kept from being dimmed or made weaker
scope: This describes something that has not been dimmed or turned down, not one that simply gives out
  a lot of light, and not a polished shine or a mood.
examples:
- The houselights were still bright when the curtain went up.
- The headlights stayed bright as the car entered the tunnel.
