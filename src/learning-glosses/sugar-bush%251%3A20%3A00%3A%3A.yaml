simpleMeaning: In the south-east of the United States grows a green shrub that keeps its leaves all year,
  with flowers in red-yellow spikes and sticky hairy fruit.
scope: 'Also called sugar sumac: a green shrub of the south-east of the United States with spikes of red-yellow
  flowers.'
examples:
- The sugar-bush kept its leaves all year and bore spikes of red-yellow flowers.
- We found a sugar-bush with sticky hairy fruit in the south-east of the United States.
