simpleMeaning: Europe, Asia, Africa, and Australia all lie in this half of the earth
scope: 'Also called the orient: the half of the earth with Europe, Asia, Africa, and Australia in it,
  not the half with the Americas in it.'
examples:
- Most of the world's people live in the eastern hemisphere.
- Australia lies in the eastern hemisphere.
