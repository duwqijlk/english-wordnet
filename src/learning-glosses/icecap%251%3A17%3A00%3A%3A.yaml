simpleMeaning: Frozen water and snow cover a wide stretch of land for good, such as the polar lands or
  the top of a mountain.
scope: Also called ice cap, it is a mass of frozen water and snow lying over a wide stretch of land for
  good.
examples:
- The polar lands lie under an icecap.
- An icecap sits on the top of the mountain all year.
