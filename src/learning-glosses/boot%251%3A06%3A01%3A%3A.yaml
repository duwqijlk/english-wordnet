simpleMeaning: a separate storage area in a car for luggage, shopping or tools.
scope: The car's luggage space, also called the trunk, not footwear or a torture device.
examples:
- We packed the suitcases into the boot of the car.
- The spare tyre is kept under the floor of the boot.
