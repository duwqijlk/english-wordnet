schema: oewn-learning-gloss-v2
senseId: 'physical_object%1:03:00::'
synsetId: 00002684-n
simpleMeaning: A real thing that can be seen and touched, and that makes a dark shape when light falls
  on it.
scope: This is a real thing you can see and touch; object is another name for this sense, not a thought,
  a feeling or a sound.
examples:
- The physical object on the table cast a long shadow.
- A stone is a physical object you can pick up.
