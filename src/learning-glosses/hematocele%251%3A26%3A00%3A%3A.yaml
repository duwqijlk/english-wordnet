simpleMeaning: Where blood has gathered in a hollow of the body, a swelling appears there, most often
  in the thin cover round a testicle.
scope: Also called a haematocele, a haematocoele or a hematocoele, this is a swelling that forms where
  blood has gathered in a hollow of the body.
examples:
- The hematocele grew after blood gathered in the cavity.
- A hematocele swelled the thin cover round a testicle.
