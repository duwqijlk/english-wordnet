simpleMeaning: Round white fruit follow pink blooms on spikes on this bush of western North America that
  drops its leaves each year.
scope: Also called snowberry and common snowberry, it is a bush of western North America that drops its
  leaves each year, with spikes of pink blooms and then round white fruit; not the eastern kind with grey-green
  berries.
examples:
- The waxberry showed pink spikes before the round white fruit came.
- A waxberry dropped its leaves each year.
