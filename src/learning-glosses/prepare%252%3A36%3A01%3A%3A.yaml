simpleMeaning: To heat food so that it is ready to eat.
scope: This is about heating food so it can be eaten (cook, make, ready and fix are other names), not
  about getting things ready in general or composing a speech.
examples:
- He prepared a hot meal for the whole family.
- She prepared the vegetables by steaming them.
