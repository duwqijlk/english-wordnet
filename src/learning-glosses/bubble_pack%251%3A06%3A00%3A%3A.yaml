simpleMeaning: A way of wrapping a thing for sale, with the thing sealed between a card back and a clear
  plastic front.
scope: A way of wrapping a thing for sale between a card back and a clear plastic front; blister pack
  is another name for this sense, not a plain box and not a shrink-wrap.
examples:
- The toy came in a bubble pack you could see through.
- She cut the bubble pack open with scissors.
