simpleMeaning: getting money for work, or able to get money for work
scope: Also called compensated, this is about getting pay for work or being able to get it, not only the
  narrower sense of getting a regular fixed pay for a job.
examples:
- The salaried workers get money each month for their work.
- She is in a salaried job and can get pay even when she is ill.
