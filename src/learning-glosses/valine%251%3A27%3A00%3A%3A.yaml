simpleMeaning: A part of protein that the body must get from food; it helps children grow and keeps the
  body's nitrogen in balance in grown-ups.
scope: A part of protein that the body must get from food, helping children grow and keeping nitrogen
  in balance, not a fat and not a sugar.
examples:
- Valine is a part of protein that the body must get from food.
- Children need valine to grow.
