simpleMeaning: A small part of the brain, under the back of the band joining the two halves of the brain,
  that sends melatonin, a sleep-setting chemical, into the blood.
scope: It is also called epiphysis, epiphysis cerebri and pineal body.
examples:
- The pineal gland lies deep in the brain.
- Melatonin comes from the pineal gland.
