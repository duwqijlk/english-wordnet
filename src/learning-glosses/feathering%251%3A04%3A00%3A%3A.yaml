simpleMeaning: turning an oar so it lies flat, level with the water, between one pull and the next
scope: 'Also called feather: turning an oar flat between pulls when rowing, not the soft covering on a
  bird.'
examples:
- Good feathering keeps the oar clear of the water between pulls.
- He practised feathering until each turn of the oar was smooth.
