simpleMeaning: a rude word for a form that is not the real kind, or for a thing that is odd, worse, or
  from a source you cannot trust
scope: A rude word for a thing that is not the real kind or is worse, not a rude word for a person and
  not a child whose parents are not married.
examples:
- This cheap copy is a bastard of the real design.
- The house was a bastard, like the old style in shape but not true to it.
