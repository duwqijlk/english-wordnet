simpleMeaning: To spin round and round, fast, the way a turning ride does.
scope: To spin round and round fast, not the big turning ride itself, and not the spinning top that turns
  on a steel point.
examples:
- Leaves whirligigged down the street in the wind.
- The dancers whirligigged across the floor.
