senseId: 'hypocycloid%1:25:00::'
synsetId: 13932767-n
simpleMeaning: A line traced by a point on a circle that rolls around inside another circle.
scope: A line drawn by a point on a circle rolling inside another circle, not a line drawn by a circle
  rolling outside another and not a plain circle.
examples:
- The toy drew a hypocycloid as the small wheel turned inside the big ring.
- In class we traced a hypocycloid with a circle rolling inside a larger one.
