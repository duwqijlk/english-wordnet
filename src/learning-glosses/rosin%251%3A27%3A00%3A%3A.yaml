simpleMeaning: From the ooze of certain plants, or from joining small bits together, comes this hard or
  half-hard, thick, sticky stuff, one of many kinds
scope: Also called resin, it comes either from the ooze of certain plants or from joining small bits together,
  and it is hard or half-hard, thick, and sticky.
examples:
- The rosin felt hard and sticky to the touch.
- This rosin came from the ooze of certain plants.
