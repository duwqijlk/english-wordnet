simpleMeaning: A small shiny piece of material used to make clothing look pretty
scope: This is a small shiny piece fixed to clothing, also called a sequin and a diamante; not the verb
  senses of putting such pieces on something or of shining as if covered with them.
examples:
- Her dress was covered with silver spangles that shone in the light.
- She sewed a gold spangle onto the edge of her skirt.
