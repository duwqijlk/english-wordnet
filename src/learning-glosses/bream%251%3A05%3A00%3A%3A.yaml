simpleMeaning: Any of a number of perch-like freshwater fish, usually good to eat, with flat-sided bodies
  and bright scales, especially of the group called Lepomis, though not only of that group.
scope: A freshwater fish, also called freshwater bream, not the saltwater fish of the same name and not
  the flesh of such fish eaten as food.
examples:
- They caught bream in the lake at dawn.
- The bream on the plate had bright, shiny scales.
