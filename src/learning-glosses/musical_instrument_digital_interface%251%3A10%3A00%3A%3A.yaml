simpleMeaning: A set of shared rules that lets electronic music tools and computers talk to each other.
scope: A set of shared rules that lets electronic music tools and computers talk to each other; not a
  kind of music file, and not a cable that joins them.
examples:
- The keyboard sends notes to the computer through a musical instrument digital interface.
- His studio uses a musical instrument digital interface to link the tools.
