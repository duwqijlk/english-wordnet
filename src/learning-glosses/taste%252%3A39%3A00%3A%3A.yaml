simpleMeaning: to notice the flavor of something using the mouth and tongue.
scope: This is not to judge beauty or quality, and not to have a liking for something; it means to become
  aware of a flavor through the mouth.
examples:
- I can taste garlic in the sauce.
- He tasted the soup and added more salt.
