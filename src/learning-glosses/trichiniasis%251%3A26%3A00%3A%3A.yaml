senseId: 'trichiniasis%1:26:00::'
synsetId: 14373941-n
simpleMeaning: A parasitic disease caused by swallowing tiny worm larvae in undercooked meat, especially
  pork; the larvae move from the gut into muscles and form cysts there.
scope: The worm infection caught from undercooked pork; trichinosis and myositis trichinosa are other
  names for the same illness. Not a bacterial food poisoning, and not plain muscle inflammation.
examples:
- Trichiniasis is diagnosed by finding worm larvae in a sample of muscle.
- Cases of trichiniasis dropped sharply once pork inspection became standard.
