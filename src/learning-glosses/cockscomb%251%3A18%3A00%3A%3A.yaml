simpleMeaning: A proud showy man who thinks far too much of what he has done.
scope: This is a proud showy man who thinks far too much of what he has done; coxcomb is another name
  for it, not the red crest on a bird's head and not a jester's cap.
examples:
- The young cockscomb boasted of his fine clothes all evening.
- No one liked the cockscomb who talked only of himself.
