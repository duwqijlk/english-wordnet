simpleMeaning: a cabbage plant that can stand cold, with rough curly leaves that do not grow together
  into a round head
scope: 'Also called cole: this is the plant itself, not its leaves eaten as food.'
examples:
- Kale grows well in cold weather and does not form a head.
- She planted kale in the garden for its curly leaves.
