simpleMeaning: A block that keeps Black people out of jobs, clubs and other parts of life shared with
  white people
scope: A block that keeps Black people out of shared work and social life; color bar, colour bar and colour
  line are other names for this sense, not a wall or a ban on one person.
examples:
- The color line kept Black players out of the league.
- She crossed the color line to eat in the white dining room.
