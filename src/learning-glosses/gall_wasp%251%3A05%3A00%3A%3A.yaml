simpleMeaning: A small lone insect that makes round growths on oaks and other plants.
scope: This is a small lone insect that makes round growths on oaks and other plants, also called a cynipid
  gall wasp, a cynipid wasp or a gallfly; not a bee, and not a fly that lays eggs in fruit.
examples:
- The gall wasp laid its eggs in the oak leaf.
- A gall wasp made the round growth on the oak twig.
