simpleMeaning: When ripe, these seed cases, pinched in between the seeds, break apart into parts each
  holding one seed.
scope: These are seed cases pinched in between the seeds that break apart when ripe, not a pod that stays
  whole and not a single seed.
examples:
- The loment broke into single-seeded parts as it dried.
- Each loment splits between the seeds when it is ripe.
