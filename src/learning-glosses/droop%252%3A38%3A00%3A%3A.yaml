synsetId: 01989538-v
simpleMeaning: to sink down or settle under pressure, or as if under pressure, or when it is no longer
  pulled tight
scope: This is to sink down or settle under pressure, or as if under pressure, or when no longer pulled
  tight; flag and sag are other names for this sense. It is not just hanging loosely.
examples:
- The heavy branches drooped under the weight of the snow.
- The rope drooped as it stopped being pulled tight.
