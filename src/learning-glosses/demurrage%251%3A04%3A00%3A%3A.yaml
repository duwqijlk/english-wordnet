simpleMeaning: Holding back some other cargo, a ship, or a freight car, beyond the time it was set to
  leave.
scope: Holding back some other cargo, a ship, or a freight car, beyond the time it was set to leave; not
  a charge asked as payment for the delay of a ship, freight car, or other cargo, past its set time of
  leaving.
examples:
- Their demurrage held the ship.
- The demurrage was paid at dawn.
