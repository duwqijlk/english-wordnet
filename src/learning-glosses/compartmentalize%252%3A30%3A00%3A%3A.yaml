senseId: 'compartmentalize%2:30:00::'
synsetId: 00484732-v
simpleMeaning: to keep things apart in separate groups, with each group kept on its own
scope: To split things into separate groups and keep them apart, not to mix them together or treat them
  as one whole thing.
examples:
- You cannot compartmentalize your life like this!
- She compartmentalizes her feelings and never talks about them at work.
