senseId: 'teleology%1:09:00::'
synsetId: 05986486-n
simpleMeaning: In philosophy, a teaching that explains things by the ends or aims they serve
scope: In philosophy, a teaching that explains things by their aims, not by what caused them and not a
  teaching about God.
examples:
- Teleology asks what purpose a thing serves, not how it came to be.
- In his essay, he used teleology to explain the eye by what it is for.
