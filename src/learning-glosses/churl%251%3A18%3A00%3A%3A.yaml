simpleMeaning: A low, coarse person, ill-mannered and without learning or polish, who knows nothing of
  good taste.
scope: Also called peasant, barbarian, boor, and tyke; a low, coarse person, ill-mannered and without
  learning or polish, who knows nothing of good taste.
examples:
- The churl pushed past the ladies without a word of apology.
- He behaved like a churl at the feast, eating with his hands.
