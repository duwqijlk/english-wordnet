simpleMeaning: the conditions in the air, described by temperature, wind, clouds, and moisture falling
  from the sky
scope: This is the state of the air, not the side facing the wind, not the verb for surviving a storm,
  not causing a surface to slope, not sailing to the windward side, and not changing under exposure to
  the elements.
examples:
- The weather turned cold and wet by the afternoon.
- Bad weather delayed all flights out of the city.
