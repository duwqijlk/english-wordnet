simpleMeaning: the outer layer of the brain where signals from the eyes arrive by way of the lateral geniculate
  body of the thalamus
scope: 'Another name for the visual area: the part of the brain that takes in sight signals, not the part
  that moves the body and not the part that hears sounds.'
examples:
- The visual cortex takes in signals from the eyes and turns them into what we see.
- An injury to the visual cortex can leave a person blind in part of the field of sight.
