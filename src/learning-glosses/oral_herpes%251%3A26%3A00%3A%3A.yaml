simpleMeaning: A sore in or round the mouth, brought on by one kind of virus, the kind that gives cold
  sores
scope: A sore in or round the mouth, also called cold sore, fever blister and herpes labialis; not a sore
  elsewhere on the body and not a sore with another cause.
examples:
- Her oral herpes flared up when she was run down.
- He gets oral herpes on his lip in winter.
