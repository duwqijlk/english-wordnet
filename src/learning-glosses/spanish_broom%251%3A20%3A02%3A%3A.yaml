simpleMeaning: A tall shrub without thorns, with pale yellow flowers and bendy twigs like rushes used
  for making baskets; from southwestern Europe and the Mediterranean, now growing wild in California.
scope: Not a brush for sweeping floors; also called a weaver's broom and Spartium junceum.
examples:
- Spanish broom grows along the dry hillside.
- She cut Spanish broom twigs to weave a basket.
