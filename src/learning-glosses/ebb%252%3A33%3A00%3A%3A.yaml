simpleMeaning: to trap fish with stakes and nets so they cannot swim back to the sea as the tide goes
  out
scope: To fence fish in so they cannot return to the sea, not the tide itself going out.
examples:
- The fishermen ebbed the catch in the shallow pool with stakes and nets.
- At low tide they ebbed the fish behind the nets to keep them from the sea.
