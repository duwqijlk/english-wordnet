simpleMeaning: Showing an action again at once, straight after it happened, from a tape, most of all a
  moment in sport
scope: An action shown again at once from a tape, most of all in sport, also called a replay or an action
  replay; not a live showing and not a repeat of a whole game.
examples:
- The crowd cheered again when the instant replay showed the goal.
- The referee asked for an instant replay to check the foul.
