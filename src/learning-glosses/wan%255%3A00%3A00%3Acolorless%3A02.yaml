simpleMeaning: unusually washed out and colourless, as a person looks when unwell or deeply upset
scope: A colourless, sickly look, not dim or feeble light and not general weakness or listlessness; pale
  and pallid are other names for this sense.
examples:
- Her wan face lit up when she heard the good news.
- He still looked wan and tired after the fever.
