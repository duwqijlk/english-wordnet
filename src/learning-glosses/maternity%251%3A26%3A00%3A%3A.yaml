simpleMeaning: the state of being pregnant, and the time from when a baby starts to grow inside a woman
  until it is born
scope: The state of being pregnant and the time until the baby is born; pregnancy is another name for
  this sense, not a mother's loving manner and not the tie between a mother and her child.
examples:
- She found the last weeks of her maternity tiring.
- Good care during maternity helps both mother and baby.
