simpleMeaning: A way of looking inside the body by sweeping it with X-rays and using a machine to build
  a set of thin crosswise views along one line.
scope: Also called computed axial tomography, computed tomography, computerized axial tomography, computerized
  tomography, and CAT; a way of seeing inside the body, not an X-ray picture and not surgery.
examples:
- The CT showed a small break in his leg.
- She had a CT after the fall.
