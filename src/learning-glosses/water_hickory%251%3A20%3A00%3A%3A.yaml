simpleMeaning: a nut tree of the south of the United States with many thin leaves and nuts that taste
  rather bitter
scope: 'Also called bitter pecan and water bitternut: a nut tree of the southern United States, not a
  pecan tree grown for sweet nuts and not a hickory of the north.'
examples:
- The water hickory grows along the rivers of the southern United States.
- Squirrels crack the bitter nuts of the water hickory.
