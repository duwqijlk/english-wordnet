simpleMeaning: the act of giving up a thing, a right, a title or a special favour that one owns
scope: This is giving up something one owns, such as a right or title; forgoing and renunciation are other
  names for it, not a promise to do something or a gift to another person.
examples:
- His forswearing of the title surprised the court.
- Her forswearing of wealth was widely praised.
