simpleMeaning: having to do with, or made of, cerium, a metal, when it joins with other things three at
  a time
scope: It names cerium in its form that joins three at a time, not cerium in its four-join form, and not
  another metal.
examples:
- The chemist chose a cerous salt for the test.
- A cerous compound holds cerium that joins three at a time.
