simpleMeaning: A cap worn by a court fool, with a strip of red on it.
scope: This is a cap worn by a court fool, with a strip of red on it; coxcomb is another name for it,
  not the red crest on a bird's head and not a proud foolish man.
examples:
- The jester shook his cockscomb as he danced.
- His cockscomb flopped over one eye.
