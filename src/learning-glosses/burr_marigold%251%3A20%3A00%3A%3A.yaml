simpleMeaning: With yellow flowers and prickly fruits that cling to fur and clothing, any of several plants
  of the group Bidens.
scope: Also called beggar's-ticks, beggar-ticks, bur marigold, and sticktight, this is a Bidens plant
  with yellow flowers, set apart from other yellow-flowered plants by prickly fruits that cling to fur
  and clothing.
examples:
- Burr marigold grew with yellow flowers and prickly fruits.
- Burr marigold fruits clung to the dog's fur.
