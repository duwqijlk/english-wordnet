simpleMeaning: A large evergreen tree-like plant with huge paddle-shaped leaves and inedible banana-like
  fruit, though its young flower shoots can be eaten; sometimes put in the banana genus.
scope: A big banana-like plant, also called Abyssinian banana, Ensete ventricosum and Ethiopian banana,
  with inedible banana-like fruit and edible young flower shoots.
examples:
- Musa ensete grows in the highlands of Ethiopia.
- The young shoots of Musa ensete are eaten as food.
