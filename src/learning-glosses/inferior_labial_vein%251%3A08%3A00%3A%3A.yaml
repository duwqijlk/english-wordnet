simpleMeaning: A small blood tube that joins the main blood tube of the face and carries blood away from
  the lower lip.
scope: A small blood tube joining the main blood tube of the face, carrying blood from the lower lip,
  not a tube bringing blood to the lip and not the main face tube itself.
examples:
- The inferior labial vein drains the lower lip.
- The surgeon tied off the inferior labial vein.
