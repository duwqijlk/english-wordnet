simpleMeaning: the view that people should rule themselves, or be ruled by people they have chosen to
  speak for them
scope: The view that people should rule themselves or choose their rulers, not the rule that the larger
  part of a group can make choices that bind the whole group.
examples:
- She believed in democracy and voted in every election.
- Democracy means the people choose who leads them.
