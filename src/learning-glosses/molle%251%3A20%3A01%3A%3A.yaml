simpleMeaning: A small evergreen tree from Peru with a broad rounded crown and slender drooping branches,
  bearing attractive clusters of greenish flowers and then clusters of rose-pink fruit.
scope: This sense is the tree, with its rounded crown, greenish blooms and pink fruit clusters; not a
  spice or seasoning sold under a similar name.
examples:
- A molle tree stood at the corner of the plaza, its branches drooping almost to the ground.
- In spring the molle is covered with greenish flowers, and by autumn with rose-pink fruit.
