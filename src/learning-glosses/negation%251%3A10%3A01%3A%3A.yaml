senseId: 'negation%1:10:01::'
synsetId: 07295646-n
simpleMeaning: A statement that says no, refusing or denying another statement.
scope: A statement that says no, refusing or denying another statement, not a claim in logic that is true
  just when another claim is false and false just when the other is true, and not the act of saying no
  itself.
examples:
- His negation of the charge was short and firm.
- The negation came as a single sentence in her letter.
