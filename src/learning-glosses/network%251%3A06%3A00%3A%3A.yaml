simpleMeaning: It is a material made from strings, ropes, or wires crossed and tied with open spaces between
  them.
scope: Not a group of connected people or computers, and not a television company.
examples:
- She hung a network of rope over the window to keep birds out.
- The chair seat was a network of woven string.
