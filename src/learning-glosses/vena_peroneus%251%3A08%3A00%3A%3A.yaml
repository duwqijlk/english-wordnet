simpleMeaning: behind the knee, these veins meet the veins of the shin after running up the back of the
  leg from the heel beside the arteries of the lower leg
scope: 'Also called fibular vein and peroneal vein: veins that follow the arteries of the lower leg from
  the heel to behind the knee, not arteries and not veins of the arm.'
examples:
- The vena peroneus runs beside the peroneal artery up the back of the leg.
- Surgeons traced the vena peroneus from the heel to behind the knee.
