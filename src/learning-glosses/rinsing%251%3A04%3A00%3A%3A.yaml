simpleMeaning: the last part of washing, when soap is taken off with clean water
scope: 'Also called rinse: this is the last step of washing, when clean water takes soap off, not the
  earlier washing with soap itself.'
examples:
- 'Rinsing is the last step: she ran clean water over the soapy dishes.'
- After the wash, the rinsing left no soap on his shirt.
