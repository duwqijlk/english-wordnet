senseId: concentrated%5:00:00:undiluted:00
synsetId: 00760522-s
simpleMeaning: About a solution (a liquid with something mixed into it) that has less extra liquid mixed
  in, so it is stronger
scope: This is about a liquid mix made stronger by having less extra liquid in it; it is not the sense
  about a mix that is as strong as it can be and can take in no more.
examples:
- She used concentrated lemon juice, so a small amount was enough.
- This concentrated cleaning liquid must be mixed with water before use.
