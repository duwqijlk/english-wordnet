simpleMeaning: a board or small bridge put in place for a short time, for people to walk on and off a
  ship at a dock
scope: Also called gangplank. This is the way on and off a ship at a dock, not a passage between seats
  in a hall or vehicle, and not boards laid over mud where people are building.
examples:
- Sailors put the gangway in place so people could leave the ship.
- She walked up the gangway and stepped onto the ship.
