simpleMeaning: In sports, a player who hits or kicks a ball toward the goal, or in basketball one who
  throws it at the basket
scope: In sports, a player who hits or kicks a ball toward the goal, or in basketball one who throws it
  at the basket; not a gambler throwing dice, not a big marble, and not a person who shoots a gun.
examples:
- The shooter drove the ball hard at the goal.
- She is the team's best shooter from the free-throw line.
