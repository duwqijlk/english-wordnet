simpleMeaning: a thick web full of fine threads that a spider makes, which catches insects better than
  a round web
scope: A thick spider web that catches insects well, not a thin cloth like a web and not a round flat
  web.
examples:
- A cobweb filled the corner of the old barn.
- The spider's cobweb caught flies all summer.
