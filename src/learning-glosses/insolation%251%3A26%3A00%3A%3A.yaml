simpleMeaning: Out in the sun or in great heat, a person's body can collapse all at once
scope: A sudden collapse from sun or great heat, also called sunstroke; not a slow illness from heat and
  not the act of putting a thing out in the sun.
examples:
- He suffered insolation after working all day under the hot sun.
- The doctor warned that insolation can strike fast on a very hot day.
