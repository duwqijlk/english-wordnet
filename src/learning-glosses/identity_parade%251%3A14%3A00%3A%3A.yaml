simpleMeaning: Police put a row of people together so they can be looked at and one of them picked out
scope: A row of people put together by police to be looked at and picked out, also called lineup and police
  lineup; not a march in the street and not a single suspect shown alone.
examples:
- The witness picked the man out of the identity parade.
- Police held an identity parade so the victim could look at the suspects.
