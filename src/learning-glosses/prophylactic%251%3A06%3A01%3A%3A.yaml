simpleMeaning: A cure that stops an illness from starting or slows it down once it has begun.
scope: Also called a preventative or a preventive, a cure that stops an illness from starting or slows
  it down once it has begun, not the sheath of thin rubber or latex worn to stop a woman becoming with
  child, and not the adjective use for what stops or helps stop illness, or stops a woman becoming with
  child.
examples:
- The doctor gave them a prophylactic to keep the fever from taking hold.
- Quinine was used as a prophylactic against malaria in the old days.
