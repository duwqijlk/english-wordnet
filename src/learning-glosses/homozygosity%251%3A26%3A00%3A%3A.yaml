simpleMeaning: The two copies of a gene are the same in this state
scope: This is the state of having two matching copies of the same gene, not having two different copies;
  it is not a single gene itself.
examples:
- Homozygosity for the gene meant both copies were the same.
- The test showed homozygosity at that gene.
