simpleMeaning: A United States intelligence agency that guards past and present presidents, vice presidents,
  their families and guests from abroad, catches makers of false money, and stops forged bonds and papers
scope: Secret Service, United States Secret Service, US Secret Service and USSS are other names for this
  sense; not the Nazi SS and not an ordinary police force.
examples:
- The SS guards the president on every trip.
- An SS agent checked the doors of the hall.
