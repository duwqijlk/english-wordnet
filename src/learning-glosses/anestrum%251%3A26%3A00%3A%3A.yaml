simpleMeaning: A state in which a female mammal that is not a person shows no wish to mate, between two
  times when she is ready to mate.
scope: 'Also called anestrus, anoestrum and anoestrus: the quiet state of a female mammal between two
  heats, not the heat itself.'
examples:
- The anestrum is the quiet time between heats for a female dog.
- During anestrum the female shows no wish to mate at all.
