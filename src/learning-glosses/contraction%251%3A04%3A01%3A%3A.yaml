simpleMeaning: In the body, a part or organ growing short or tight, above all a muscle or a thread of
  muscle
scope: In the body, a part or organ growing short or tight, above all a muscle or a thread of muscle,
  not a thing made smaller in size.
examples:
- A contraction of the muscle closed the valve.
- Contractions of the womb mark the start of labour.
