simpleMeaning: Numbers that tell the player which chords to play go with the low part of a piece, which
  is set out in full
scope: 'Also called basso continuo and continuo: the low part of a piece set out in full with numbers
  showing the chords, not a part with no numbers and not the top part of a piece.'
examples:
- The organist played the figured bass from the old score.
- In the lesson, they worked out the chords from the figured bass.
