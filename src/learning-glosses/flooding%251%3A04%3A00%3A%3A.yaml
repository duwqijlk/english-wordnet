simpleMeaning: In behavior therapy, a way of treating a person by giving them a lot of one kind of event
  until they dislike it or no longer feel it
scope: In behavior therapy, a way of treating a person by giving them a lot of one kind of event until
  they dislike it or no longer feel it, not a flood of water.
examples:
- The flooding helped him face his fear of dogs.
- Her therapist used flooding to treat the phobia.
