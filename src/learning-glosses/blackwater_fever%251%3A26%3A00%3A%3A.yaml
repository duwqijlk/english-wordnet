simpleMeaning: Severe and often fatal malaria with kidney damage that makes the urine dark.
scope: This severe, often fatal mosquito-spread illness is the one that harms the kidneys and turns the
  urine dark.
examples:
- He had blackwater fever, and his urine turned dark.
- The dark urine was a sign of blackwater fever.
