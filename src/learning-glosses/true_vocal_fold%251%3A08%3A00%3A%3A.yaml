simpleMeaning: Each of the two lower flaps in the throat meets its pair to make the slit for sound; lung
  air runs between them as they close, giving a voice tone.
scope: Also called inferior vocal cord, inferior vocal fold, and true vocal cord, this lower flap in the
  throat closes as lung air runs between the pair to give a voice tone.
examples:
- The true vocal fold closed with its pair when he hummed.
- Air from the lungs ran between the true vocal folds as she held the note.
