simpleMeaning: A tree that keeps its green leaves all year and grows tall on the Pacific coast of North
  America, often planted because it looks good
scope: A tall evergreen tree of the Pacific coast, also called yellow cedar; not a redwood and not a fir.
examples:
- The yellow cypress by the lake is often grown for its looks.
- A tall yellow cypress shades the path.
