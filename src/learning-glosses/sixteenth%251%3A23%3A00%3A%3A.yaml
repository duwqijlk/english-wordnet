simpleMeaning: one of sixteen parts that are all the same size, from a whole divided into sixteen
scope: One of sixteen equal parts of a whole, not one of fifteen or seventeen parts.
examples:
- A sixteenth of the cake was left on the plate.
- Only a sixteenth of the class passed the test.
