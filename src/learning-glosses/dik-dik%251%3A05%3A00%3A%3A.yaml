simpleMeaning: A small antelope from east Africa, of the Madoqua kind, about the size of a big rabbit.
scope: A tiny east African antelope, about rabbit-sized, not a gazelle and not a hare.
examples:
- The dik-dik stood still among the dry bushes.
- A dik-dik is no bigger than a large rabbit.
