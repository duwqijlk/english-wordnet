simpleMeaning: Weak sight caused by the retina pulling away from the choroid at the back of the eye; treated
  with light (photocoagulation).
scope: Detached retina and retinal detachment are other names for it.
examples:
- The detachment of the retina was found during a routine eye check.
- He lost sight in one eye after the detachment of the retina, and doctors sealed it with light.
