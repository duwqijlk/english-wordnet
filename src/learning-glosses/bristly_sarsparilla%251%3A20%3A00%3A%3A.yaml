scope: This is a herb with stiff hairs from eastern and central North America, bearing black fruit and
  bark used as medicine; bristly sarsaparilla and dwarf elder are other names for it, not wild sarsaparilla
  and not a smooth-stemmed herb.
examples:
- The bristly sarsparilla grew beside the path.
- We found bristly sarsparilla with black fruit in the clearing.
