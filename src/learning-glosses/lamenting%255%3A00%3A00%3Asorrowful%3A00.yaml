simpleMeaning: using the voice to show grief or sorrow, or sounding like a voice that shows grief or sorrow
scope: 'Also called wailing and wailful: showing grief or sorrow in the voice or in sound, not just feeling
  sad in silence.'
examples:
- The lamenting mourners cried out beside the grave.
- A lamenting song came from inside the church.
