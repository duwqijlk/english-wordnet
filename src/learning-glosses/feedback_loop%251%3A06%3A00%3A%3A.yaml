simpleMeaning: Some of what a machine puts out is sent back in at the start, and then goes through the
  machine again
scope: 'Also called a feedback circuit: some of what a machine puts out is sent back in at the start,
  not a broken wire and not a wire that carries power one way.'
examples:
- The feedback loop kept the heater at the same heat.
- A feedback loop helps the car hold a steady speed.
