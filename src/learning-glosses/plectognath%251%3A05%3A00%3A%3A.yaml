simpleMeaning: a warm-sea fish whose teeth are joined into a beak, with thick skin covered in bony plates
  or spines
scope: Also called a plectognath fish; not a shark and not an ordinary fish with separate teeth.
examples:
- The plectognath swam among the coral with its beak-like teeth.
- A plectognath can crush shellfish with its fused teeth.
