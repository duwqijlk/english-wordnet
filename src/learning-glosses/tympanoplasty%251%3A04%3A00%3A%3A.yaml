simpleMeaning: An operation to put right faults or hurts in the small bones of the middle ear or in the
  thin skin of the ear.
scope: This operation puts right faults or hurts in the thin skin of the ear or in the small bones of
  the middle ear.
examples:
- Tympanoplasty put right the hurt in her ear.
- A tympanoplasty can put right faults in the small bones of the ear.
