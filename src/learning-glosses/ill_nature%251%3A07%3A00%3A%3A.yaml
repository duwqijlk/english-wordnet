simpleMeaning: a way of being that makes a person hard to get on with, quick to anger, and ready to wish
  others harm
scope: A person's bad temper and wish to harm others; not a short bad mood and not bad luck.
examples:
- His ill nature showed when he snapped at every visitor.
- No one wanted to work with her because of her ill nature.
