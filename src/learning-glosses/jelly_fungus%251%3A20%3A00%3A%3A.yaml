simpleMeaning: Any of the soft growths of the groups Tremellales or Auriculariales, whose spore-making
  body is soft and wobbly when fresh.
scope: Any of the soft growths of the groups Tremellales or Auriculariales, soft and wobbly when fresh;
  not a mushroom with a firm cap and not a mould on food.
examples:
- Jelly fungus grew on the damp log after the rain.
- The jelly fungus was soft and wobbly to the touch.
