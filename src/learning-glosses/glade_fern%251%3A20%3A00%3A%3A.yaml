simpleMeaning: A North American plant with narrow leaves on yellowish stalks
scope: This is a North American plant with narrow leaves on yellowish stalks; narrow-leaved spleenwort
  and silvery spleenwort are other names for this sense, not any other North American plant and not a
  tree.
examples:
