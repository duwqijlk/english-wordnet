simpleMeaning: a big muscle shaped like a triangle that covers the shoulder joint and lifts the arm away
  from the body, bends it, straightens it, and turns it
scope: 'Also called deltoid and musculus deltoideus: the big shoulder muscle that moves the arm, not a
  muscle of the chest or back, and not the shoulder joint itself.'
examples:
- He felt a pull in his deltoid muscle after lifting the box overhead.
- The deltoid muscle covers the top of the shoulder.
