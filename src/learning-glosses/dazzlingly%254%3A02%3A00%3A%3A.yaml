schema: oewn-learning-gloss-v2
senseId: 'dazzlingly%4:02:00::'
synsetId: 00082389-r
simpleMeaning: in a way or to a degree that is so bright it makes it hard to see, or so good it leaves
  the person who sees it amazed
scope: This says how something is done or how much, when the light is so bright it is hard to see or the
  quality is so good it amazes people; it does not name a bright or good thing itself, and it is stronger
  than just bright or good in a plain way.
examples:
- The lights shone dazzlingly in the dark hall.
- She sang dazzlingly well that night.
