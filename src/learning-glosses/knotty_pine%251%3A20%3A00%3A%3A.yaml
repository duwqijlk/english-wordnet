simpleMeaning: Wood of a kind of evergreen tree with many knots, used above all for wall boards and furniture.
scope: Wood of a kind of evergreen tree with many knots, used above all for wall boards and furniture,
  not smooth wood without knots and not wood used for building frames.
examples:
- The cabin walls were lined with knotty pine.
- Knotty pine gave the room a warm, rustic look.
