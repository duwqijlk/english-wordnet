simpleMeaning: the skill of putting the skins of dead animals onto a shape so that the animals look alive
scope: This is the skill of making dead animals look alive with their own skins, not hunting animals and
  not keeping live animals.
examples:
- He learned taxidermy so he could put a deer skin on a shape for the museum.
- Good taxidermy can make a dead bird look as if it is about to fly.
