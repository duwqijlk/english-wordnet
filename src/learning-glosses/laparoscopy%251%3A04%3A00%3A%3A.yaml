simpleMeaning: A look inside the belly through a small cut, made with a thin viewing tube, to check the
  inside, above all the ovaries and the tubes that carry eggs.
scope: A way to look inside the belly through a small cut, with a thin viewing tube.
examples:
- The doctor did a laparoscopy to look at her ovaries.
- A laparoscopy needs only a small cut in the belly.
