simpleMeaning: A clear, hard stuff blown into a ball, then made flat and spun round to form a round plate
scope: A clear hard stuff first blown into a ball, then flattened and spun into a disk; not a flat sheet
  and not a bottle.
examples:
- Old windows were often made of crown glass.
- The crown glass showed a faint swirl from the spinning.
