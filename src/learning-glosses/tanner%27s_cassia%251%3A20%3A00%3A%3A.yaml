simpleMeaning: An evergreen shrub of India with bright yellow flowers, its bark used to turn animal skins
  into leather; plant books at times put it in another group of shrubs.
scope: 'Also called avaram: an evergreen shrub of India with bright yellow flowers, its bark used to turn
  animal skins into leather.'
examples:
- The tanner's cassia was covered in bright yellow flowers.
- The bark of the tanner's cassia is used in tanning.
