senseId: 'capital_offense%1:04:00::'
synsetId: 00769842-n
simpleMeaning: a crime so grave that death is seen as a fitting punishment
scope: This sense names the crime itself, not the punishment; murder can be one in some places, but a
  small theft or a crime punished only by a fine is not.
examples:
- Murder can be a capital offense in some states.
- He was charged with a capital offense and faced the death penalty.
