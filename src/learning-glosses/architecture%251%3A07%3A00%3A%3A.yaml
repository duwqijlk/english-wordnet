simpleMeaning: In computer science, the way a computer is put together and works, in the parts you can
  touch and in the basic programs that run it
scope: This is about how a computer is built inside, not the study of buildings, not the job of planning
  buildings, and not a finished building.
examples:
- The architecture of this computer lets it work very fast.
- They changed the architecture of the programs that make the computer work.
