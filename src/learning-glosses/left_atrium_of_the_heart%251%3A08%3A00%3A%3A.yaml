simpleMeaning: Blood from the veins of the lungs flows into the upper room on one side of the organ that
  pumps blood
scope: 'Another name for left atrium and atrium sinistrum: the upper room of the organ that pumps blood,
  taking in blood from the veins of the lungs, not the lower room that pumps blood out.'
examples:
- The left atrium of the heart receives blood from the pulmonary veins.
- An ultrasound showed her left atrium of the heart was enlarged.
