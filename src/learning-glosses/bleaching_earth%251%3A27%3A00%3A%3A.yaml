simpleMeaning: soft ground that pulls the colour out of oils by taking it in
scope: Also called bleaching clay, this is a soft earth that pulls colour out of oils, not a clay used
  to make pots and not a chemical that makes cloth white.
examples:
- The bleaching earth pulled the yellow tint from the oil.
- They used bleaching earth to clean the oil before bottling it.
