simpleMeaning: a French poem form of 10 or 13 lines, using only two rhymes, with its first words repeated
  in the second and third groups of lines
scope: 'Also called rondeau: this is a set French poem form with only two rhymes; it is not a song and
  not just any short poem.'
examples:
- She wrote a rondel of thirteen lines, using only two rhymes.
- His rondel repeated its first words in the second and third parts of the poem.
