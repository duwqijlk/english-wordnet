simpleMeaning: By streams and river banks all over Europe, except the far north and the Mediterranean,
  grows a plant that lives for years, sometimes counted with the group Nasturtium
scope: A plant that lives for years and grows by streams across most of Europe, not a plant of the far
  north or the Mediterranean shore.
examples:
- Great yellowcress grew along the river bank.
- She found great yellowcress by the stream in spring.
