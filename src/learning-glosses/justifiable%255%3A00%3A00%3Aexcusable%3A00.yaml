schema: oewn-learning-gloss-v2
senseId: justifiable%5:00:00:excusable:00
synsetId: 01726375-s
simpleMeaning: able to be shown as right or fair, with good reasons
scope: This says there are good reasons that show an act is right or fair; it does not mean the act is
  only small or easy to forgive.
examples:
- His anger was justifiable after they broke their promise.
- The extra cost is justifiable because it keeps people safe.
