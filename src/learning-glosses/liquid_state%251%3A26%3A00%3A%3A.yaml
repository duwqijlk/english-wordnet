simpleMeaning: When a stuff flows with ease yet keeps its bulk, hardly spreading out and barely giving
  way to a squeeze, it is in this form.
scope: It is also called liquid, liquidity, or liquidness.
examples:
- Water is in the liquid state at room warmth.
- In the liquid state, water keeps its bulk as it runs from the cup.
