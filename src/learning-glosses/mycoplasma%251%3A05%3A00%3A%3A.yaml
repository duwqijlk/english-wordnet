simpleMeaning: Lung illness and illness of the urine tubes can come from some tiny germs with no walls
  round them that live off other creatures and can live with no air.
scope: Tiny germs with no walls round them that can live with no air, not germs that need air to live.
examples:
- The doctor said mycoplasma had caused her pneumonia.
- Mycoplasma can also cause an infection of the tubes that carry urine.
