senseId: 'negation%1:10:00::'
synsetId: 07221121-n
simpleMeaning: The act of saying no.
scope: The act of saying no, not a statement that says no to another statement, and not a claim in logic
  that is true when another claim is false and false when that claim is true.
examples:
- His negation of the charge was firm and clear.
- The negation came at once, before she could finish the question.
