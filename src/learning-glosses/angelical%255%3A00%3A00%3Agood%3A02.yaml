simpleMeaning: Showing complete kindness, like an angel or a saint, or fit for one.
scope: Also called saintly, angelic, sainted, beatific, or saintlike, it shows complete kindness like
  an angel or a saint, not a sweet nature like a cherub and not anything to do with angels in general.
examples:
- Her smile was angelical, full of kindness for everyone.
- His concern for the poor was angelical.
