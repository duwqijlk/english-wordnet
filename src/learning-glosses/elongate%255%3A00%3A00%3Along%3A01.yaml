simpleMeaning: much longer than it is wide, and long and thin in shape
scope: 'Also called elongated: long and thin, with much more length than width; not the verb sense of
  making something longer, and not just tall.'
examples:
- The fish has an elongate body, much longer than it is wide.
- She drew an elongate leaf, long and thin, on the paper.
