simpleMeaning: One of several small trees or bushes in the Prosopis group, with sharp points, small flowers
  in long thin groups at leaf bases, and then large sugar-rich pods
scope: Also called mesquit. This is one of the small spiny Prosopis trees or shrubs itself, not just its
  wood or its pods on their own.
examples:
- A mesquite grew by the fence, its thin branches covered in small flowers.
- Mesquite shrubs in the dry land produced long pods rich in sugar.
