simpleMeaning: A medicine used to treat asthma in the airways and to make the heart beat faster and stronger.
scope: A medicine for asthma and for making the heart beat faster and stronger, also called isoproterenol,
  and not the same as other heart or asthma medicines.
examples:
- Isuprel was given to ease her asthma.
- The nurse used Isuprel to make his heart beat faster and stronger.
