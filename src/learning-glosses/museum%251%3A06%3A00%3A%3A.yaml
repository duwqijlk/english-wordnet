simpleMeaning: a place where objects of scientific, historical or artistic value are collected, kept and
  shown to the public
scope: This is not a shop that sells art, and not a library of books; it is a place that keeps and displays
  valuable objects.
examples:
- The city museum has a new exhibit on ancient coins.
- We spent the afternoon at the art museum.
