simpleMeaning: Caring about the things of this world, and letting the needs of the spirit go.
scope: Caring about worldly things while letting spiritual needs go, not the quality of being intellectually
  sophisticated and worldly through cultivation, experience, or disillusionment.
examples:
- He disliked the worldliness of many bishops around him.
- Her worldliness left no room for prayer.
