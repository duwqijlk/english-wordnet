simpleMeaning: small in strength or amount, hard to notice, and not bright, loud or clear
scope: 'Another name for weak in this sense: it describes something slight and hard to notice, not the
  separate sense for unclear shapes or outlines and not about to lose consciousness.'
examples:
- A faint smell of smoke reached the bedroom.
- The path was only a faint line across the field.
