simpleMeaning: Dried by freezing in a space with almost no air so that its water is gone, said of body
  tissue, blood, serum, and other such matter.
scope: Also called freeze-dried and lyophilised, this is the word for body tissue, blood, serum, and other
  such matter whose water is gone after freezing in a space with almost no air.
examples:
- Lyophilized blood was ready for use.
- The lyophilized tissue was kept until it was needed.
