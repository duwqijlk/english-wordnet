simpleMeaning: Blowing from the north-west.
scope: This sense is also called northwest, for blowing from the north-west, where northwest is coming
  from the way that lies between north and west, unlike the sense for lying toward the north-west, or
  set there.
examples:
- The wind was northwesterly, blowing from the north-west.
- The breeze was northwesterly, blowing from the north-west.
