simpleMeaning: a cord of fibres that carries signals to the muscles inside the tongue and to the other
  tongue muscles
scope: A nerve that carries signals to the muscles of the tongue; hypoglossal, nervus hypoglosus and twelfth
  cranial nerve are other names for this sense, not a muscle itself and not a nerve of the face.
examples:
- The hypoglossal nerve carries signals to the tongue.
- Damage to the hypoglossal nerve makes speech hard.
