simpleMeaning: On a ship, a flat plate at the back end of a ship, with the ship's name written on it
scope: A name plate at the back of a ship, not a shield with a family sign and not a flat cover on a door
  or wall.
examples:
- The ship's name was painted in gold on the escutcheon at the stern.
- Workers cleaned the escutcheon at the back of the ship before the trip.
