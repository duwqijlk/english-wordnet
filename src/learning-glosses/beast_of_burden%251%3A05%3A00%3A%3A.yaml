simpleMeaning: An animal such as a donkey, an ox or an elephant, used to carry loads or do other heavy
  work
scope: An animal such as a donkey, ox or elephant, used to carry loads or do heavy work, also called jument,
  not a pet and not a wild animal left free.
examples:
- The beast of burden carried sacks of grain up the steep mountain path.
- For years the old beast of burden pulled the cart to market.
