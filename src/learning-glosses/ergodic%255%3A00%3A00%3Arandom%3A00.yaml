simpleMeaning: Likely, over time, to settle into a fixed end form that does not depend on the start, in
  a chance system that keeps coming back without a fixed round.
scope: Of a chance system that settles to one end form whatever its start, not a system that keeps its
  start in view and not a system that repeats in a fixed round; no other name is listed for this sense.
examples:
- The ergodic process forgot its start and settled to the same end form.
- In an ergodic system, long-run chance stays the same whatever the start.
