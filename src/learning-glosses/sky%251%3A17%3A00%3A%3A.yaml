simpleMeaning: the space above the earth, including the air around us and the stars beyond it, as we see
  it from the ground
scope: This is not a religious place where good people go after death, and not outer space considered
  on its own.
examples:
- The sky turned dark before the storm.
- There was not a cloud in the sky.
