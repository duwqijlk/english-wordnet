simpleMeaning: The sea round a nation and its lands, over which that nation has full rule
scope: The sea round a nation and its lands over which that nation has full rule; not the open sea and
  not the sea of another nation.
examples:
- The ship sailed into the territorial waters of France.
- Fishing in territorial waters needs the nation's leave.
