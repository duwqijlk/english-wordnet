simpleMeaning: a mark made by the skin of a thumb, especially by its soft front part
scope: The mark left by a thumb, especially its soft front part; not a mark from another finger and not
  the thumb itself.
examples:
- Her thumbprint was pressed onto the form in ink.
- The police took his thumbprint at the station.
