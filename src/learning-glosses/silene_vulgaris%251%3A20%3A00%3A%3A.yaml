simpleMeaning: A plant that lives for many years in Arctic Europe, with big white flowers whose green
  cup at the base is swollen
scope: A long-lived plant of Arctic Europe with big white flowers and a swollen cup at the base of each
  flower; bladder campion and Silene uniflora are other names for this sense.
examples:
- Silene vulgaris grows in the cold lands of Arctic Europe.
- The large white flowers of Silene vulgaris open above a swollen green cup.
