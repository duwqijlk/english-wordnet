simpleMeaning: This is the main guard against bacteria, one of the five main kinds of immunoglobulins,
  proteins in the blood that fight sickness.
scope: Another name for this sense is immunoglobulin G; it is the main guard against bacteria, not the
  other four kinds of immunoglobulins.
examples:
- IgG is the main antibody in the blood.
- The test showed a high level of IgG after the infection.
