simpleMeaning: cell molecules, in at least 20 kinds, each carrying one kind of amino acid to a growing
  protein chain at the cell's protein-making place, following orders from messenger molecules
scope: 'Also called soluble RNA, transfer RNA and tRNA: cell molecules that carry amino acids to growing
  protein chains, not the messenger molecules that carry the orders.'
examples:
- Acceptor RNA carries the right amino acid to the ribosome.
- Each kind of acceptor RNA joins with one kind of amino acid.
