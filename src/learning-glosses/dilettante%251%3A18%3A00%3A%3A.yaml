senseId: 'dilettante%1:18:00::'
synsetId: 10007234-n
simpleMeaning: a person who does an activity for fun, not as a job, and not in a serious way, and who
  acts as if they know more than they do
scope: 'Also called a dabbler: this is the noun for the person who plays at an activity without real skill
  or serious purpose, not the describing word for shallow, showy interest.'
examples:
- He is a dilettante who paints a little but has never studied art.
- The orchestra would not hire a dilettante with no training.
