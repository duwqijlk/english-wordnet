simpleMeaning: To see or deal with something as true only for one time, place, or way of looking
scope: To see or deal with something as true only for one time, place, or way of looking; relativize is
  another name for this sense, not to say a thing is untrue and not to judge it by one fixed rule.
examples:
- We should relativise the old claim to its own time.
- He relativised the rule to fit the new case.
