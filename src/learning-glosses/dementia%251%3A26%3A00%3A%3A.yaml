simpleMeaning: a slow worsening of the power to think and remember, coming from a change in the body or
  in how the mind works
scope: A loss of the power to think and remember, not just forgetting one thing and not a sudden illness.
examples:
- Dementia had slowly taken away her memory of names.
- The doctor said the dementia came from changes in his brain.
