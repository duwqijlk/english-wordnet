senseId: 'odd-toed_ungulate%1:05:00::'
synsetId: 02375988-n
simpleMeaning: A mammal whose young grow inside the mother, with hooves and an uneven number of toes on
  each foot.
scope: A hoofed mammal with an uneven number of toes on each foot, also called perissodactyl and perissodactyl
  mammal; not a hoofed mammal with an even number of toes.
examples:
- The horse is an odd-toed ungulate.
- An odd-toed ungulate has hooves with an uneven number of toes.
