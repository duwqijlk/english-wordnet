simpleMeaning: a sickness in which little or no bile is made, or bile cannot flow into the gut
scope: A sickness in which little or no bile is made, or bile cannot flow into the gut, also called acholia;
  not a sickness of the stomach itself and not a blocked blood vessel.
examples:
- Cholestasis kept bile from reaching his gut.
- The baby's cholestasis made her skin turn yellow.
