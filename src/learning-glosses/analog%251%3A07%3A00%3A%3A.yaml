simpleMeaning: a thing that is like another thing in some ways, so the two can be compared
scope: 'Also called analogue: a thing that is like another thing in some ways, not the sense about a circuit
  or a machine that works with signals.'
examples:
- The heart is often used as an analog for a pump.
- This plant is an analog of a plant that grows in hot, dry places.
