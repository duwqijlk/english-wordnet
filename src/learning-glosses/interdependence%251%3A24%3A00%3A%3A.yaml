senseId: 'interdependence%1:24:00::'
synsetId: 13864062-n
simpleMeaning: a link between two or more things, people, or groups in which each one needs the others
  and the others need it
scope: This is a link where each side needs the other, also called interdependency and mutuality; it is
  not one side needing help while the other side needs nothing.
examples:
- The interdependence of the two towns grew after they began sharing water and power.
- Interdependence between farmers and shops means each group needs the other to do well.
