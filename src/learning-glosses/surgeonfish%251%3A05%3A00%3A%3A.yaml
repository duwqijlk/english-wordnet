simpleMeaning: At its tail this sea creature of the coral reefs bears sharp spines like small knives,
  and its body is bright with colour.
scope: This sea creature of the coral reefs is bright with colour and bears sharp spines like small knives
  at its tail.
examples:
- A surgeonfish flashed bright colours as it swam over the reef.
- The surgeonfish kept its sharp tail spines clear of the other fish.
