simpleMeaning: a tool that shows how damp the air is, made of a dry-bulb thermometer and a wet-bulb thermometer;
  the gap between their readings shows how dry it is
scope: A tool with two thermometers for judging damp air, not a single thermometer and not a rain gauge.
examples:
- The psychrometer showed the air was dry after the heater had run all day.
- She read the two bulbs of the psychrometer to work out the dampness of the room.
