simpleMeaning: The quality of being able to move freely, because nothing holds it in place or holds it
  back.
scope: The quality of being able to move freely, because nothing holds it in place; not wild living for
  bodily pleasure, not frequent and watery bowel movements that can be a sign of infection or food poisoning,
  and not a lack of strict accuracy or slackness in how one works.
examples:
- The looseness of the joint let the door swing freely.
- They checked the looseness of the bolt before they tightened it.
