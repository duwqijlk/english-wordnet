senseId: corrosive%5:00:00:destructive:00
synsetId: 00590069-s
simpleMeaning: Describes a substance, especially a strong acid, that can destroy other things or slowly
  wear them away by a chemical change
scope: Also called caustic, mordant, vitriolic, and erosive. It describes what a substance does; it is
  not the noun that names such a substance itself.
examples:
- The corrosive liquid damaged the pipes within a year.
- She wore gloves because the cleaning fluid was highly corrosive.
