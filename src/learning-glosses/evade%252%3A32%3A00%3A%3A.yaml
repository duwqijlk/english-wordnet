simpleMeaning: To get out of doing a duty, answering a question, or dealing with a problem, or to try
  to
scope: To get out of a duty, a question, or a problem, also called duck, skirt, hedge, dodge, parry, or
  elude; not to escape by cunning and not to get away in body or mind.
examples:
- He evaded the question with a joke.
- She evaded her duties by staying out late.
