simpleMeaning: words that say someone is unhappy, said in a low voice that is hard to hear clearly
scope: Also called mutter, murmur, grumble, muttering and grumbling. This is a complaint said quietly,
  not just any low sound with no clear words.
examples:
- His murmuring about the cold food went on all through lunch.
- There was angry murmuring among the workers about the low pay.
