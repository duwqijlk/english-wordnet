simpleMeaning: A smooth, even movement of a liquid or gas in flat layers that slide past each other without
  mixing.
scope: Smooth, even movement of a liquid or gas in flat layers; not a rough, churning movement, and not
  a fast narrow stream.
examples:
- The laminar flow of water through the pipe stayed smooth and even.
- In laminar flow, the layers of air slide past each other without mixing.
