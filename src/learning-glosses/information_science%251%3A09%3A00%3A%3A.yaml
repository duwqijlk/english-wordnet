simpleMeaning: Facts kept in writing are collected, changed, kept, found again, and sorted into groups
  by this field of study.
scope: Also called informatics and information processing, this field of study works with facts kept in
  writing, collecting them, changing them, keeping them, finding them again, and sorting them into groups.
examples:
- They chose information science because they like sorting facts.
- Information science taught them how to keep facts and find them again.
