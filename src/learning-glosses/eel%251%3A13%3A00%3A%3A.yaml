simpleMeaning: The rich flesh of a long, thin fish of fresh water in Europe and America, the big ones
  usually smoked or pickled.
scope: The flesh of a long fresh-water fish, usually smoked or pickled when big, not a snake and not a
  sea fish.
examples:
- They ate smoked eel with brown bread.
- She bought pickled eel at the market.
