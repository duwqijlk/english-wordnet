simpleMeaning: a soft, wet piece of low land that sinks down when you step on it
scope: Also called slack, morass, and quagmire, this is a soft, wet area of low land. It is not a bad
  situation that is hard to get out of, and not mud or wet soil.
examples:
- After the rain, the low field turned into a deep mire.
- His boots sank into the mire at the edge of the lake.
