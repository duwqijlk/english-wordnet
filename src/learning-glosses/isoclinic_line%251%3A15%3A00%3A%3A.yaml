simpleMeaning: A drawn mark joining places where a compass needle dips at the same angle
scope: A drawn mark joining places where a compass needle dips the same; isoclinal is another name for
  this sense, not a mark of equal compass direction and not a weather mark.
examples:
- The isoclinic line runs through places with the same needle dip.
- Sailors once used the isoclinic line to check their compass.
