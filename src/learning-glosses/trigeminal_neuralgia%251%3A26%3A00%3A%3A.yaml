simpleMeaning: sudden, very strong pain in the face that comes in short bursts along a nerve
scope: This is sudden, very strong nerve pain in the face; tic douloureux is another name for this sense.
  Not a dull ache and not pain from a bad tooth.
examples:
- The trigeminal neuralgia struck her cheek without warning.
- His trigeminal neuralgia made eating painful.
