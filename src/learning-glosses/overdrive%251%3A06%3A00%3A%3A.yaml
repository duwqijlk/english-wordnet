simpleMeaning: a high gear in a vehicle, used when you go fast, that keeps the same speed while using
  less power
scope: A high gear in a car for fast driving; not the state of working with too much activity or energy.
examples:
- On the highway, he shifted the car into overdrive.
- Overdrive helps the engine use less power at high speed.
