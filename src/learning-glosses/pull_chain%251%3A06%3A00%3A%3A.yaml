simpleMeaning: Most often with a grip at its end, this length of linked rings is tugged to work a machine,
  such as the one that flushes a toilet.
scope: It is pulled by the grip at its end to work a machine, such as one that flushes a toilet.
examples:
- A tug on the pull chain flushed the toilet.
- The pull chain hung beside the bath, with a grip at its end.
