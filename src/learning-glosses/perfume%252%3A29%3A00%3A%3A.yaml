simpleMeaning: to put a sweet-smelling liquid on your skin or clothes
scope: To put a sweet-smelling liquid on your skin or clothes, not the liquid itself, not its pleasant
  smell, and not to fill a place with a smell.
examples:
- She perfumes herself every morning before she goes out.
- He perfumed his neck and wrists before the party.
