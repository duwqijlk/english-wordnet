senseId: 'freedom_of_speech%1:07:00::'
synsetId: 05191047-n
simpleMeaning: a civil right, promised by the First Amendment to the United States Constitution, to share
  opinions and ideas with anyone willing to listen
scope: This is the right to share what one thinks with anyone willing to listen; not the right to vote
  or the right to a fair trial.
examples:
- Freedom of speech lets her criticise the government.
- The newspaper relied on freedom of speech to print the story.
