simpleMeaning: a level or position showing how good or valuable something is compared with others in the
  same group
scope: It is a position on a scale of quality or value, not the act of judging or marking something.
examples:
- The tomatoes are sorted into three grades.
- Only the highest grade of leather is used for these bags.
