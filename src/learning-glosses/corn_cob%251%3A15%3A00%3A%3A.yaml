simpleMeaning: The hard long tube-shaped centre of an ear of maize that holds the seeds.
scope: This is the hard long tube-shaped centre of an ear of maize that holds the seeds; corncob is another
  name for this sense, not the whole ear with its seeds and not the stalk of the plant.
examples:
- She threw the corn cob away after eating the seeds.
- The corn cob was hard and long, with seeds all round it.
