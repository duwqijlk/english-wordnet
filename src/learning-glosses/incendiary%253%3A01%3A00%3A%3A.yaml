simpleMeaning: in which buildings or other property are burned on purpose
scope: This describes something in which property is burned on purpose, not a bomb made to start fires
  and not a thing that can catch fire easily.
examples:
- The police treated the blaze as an incendiary fire set on purpose.
- He was charged after an incendiary attack burned the empty shop.
