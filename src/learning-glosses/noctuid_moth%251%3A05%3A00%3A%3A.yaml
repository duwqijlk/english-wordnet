simpleMeaning: A night-flying moth of medium size, usually with dull coloring; its young are usually smooth-bodied
  and cause serious damage to crops on farms.
scope: This is the adult insect, not its caterpillars; owlet moth is another name for this same kind of
  moth.
examples:
- A noctuid moth landed on the lit window at midnight.
- The noctuid moth's larvae are destructive pests in farm fields.
