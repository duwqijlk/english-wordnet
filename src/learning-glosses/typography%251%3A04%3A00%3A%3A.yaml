simpleMeaning: the skilled work of putting together type, the letters used for printing, and printing
  with it
scope: This sense is the skilled work itself, putting type together and printing with it; not the other
  sense, the art and skill of printing with movable type.
examples:
- He learned typography and printed books by hand in the old shop.
- In the past, typography was done with metal letters set by hand.
