simpleMeaning: A chemical, often a sulfide, used to take hair, wool or bristles off animal skins
scope: A chemical, often a sulfide, used to take hair, wool or bristles off animal skins; not a razor
  and not a cream for removing hair from people.
examples:
- The depilatory stripped the hair from the hides.
- Workers spread depilatory on the skins before tanning.
