senseId: 'rifle%2:40:00::'
synsetId: 02349564-v
simpleMeaning: to take things that are not yours, as goods won in a fight or raid
scope: Also called strip, this is taking things that are not yours, not the long gun held at the shoulder
  and not going through someone's things to look for something.
examples:
- The men rifled the shops after the quake and took goods that were not theirs.
- Soldiers rifled the town and took food and goods as spoils of war.
