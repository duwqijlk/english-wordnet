simpleMeaning: The change of the coded facts in a unit of heredity first into a messenger RNA and then
  into a protein
scope: This is the change of coded facts into RNA and then into a protein, not the copying of DNA and
  not the making of a new cell.
examples:
- Gene expression rose after the drug was given.
- Scientists measured gene expression in the liver cells.
