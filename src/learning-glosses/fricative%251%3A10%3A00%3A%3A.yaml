simpleMeaning: a speech sound that can go on as air moves past a narrow gap in the parts that make voice
  sounds
scope: This is a speech sound made as air moves past a narrow gap; fricative consonant and spirant are
  other names for it, not a vowel or a sound made with the lips closed.
examples:
- The fricative in 'fish' is made with the teeth near the lip.
- She studied the fricative sounds of English.
