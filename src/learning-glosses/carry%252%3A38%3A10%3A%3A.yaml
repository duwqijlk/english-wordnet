simpleMeaning: Move an extra digit into the next column when adding or multiplying numbers.
scope: Moving an extra digit into the next column during arithmetic; not transferring entries between
  account books, not a bill being voted through, and not any of the scent, teamwork, or sailing senses
  here.
examples:
- Write down 5 and carry the 2.
- When a column adds up to more than nine, carry the extra ten to the next column.
