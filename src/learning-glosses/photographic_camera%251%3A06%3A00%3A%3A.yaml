simpleMeaning: A device for taking pictures, most often a light-proof box with a lens at one end and light-sensitive
  film at the other.
scope: A device for taking pictures, most often a light-proof box with a lens at one end and light-sensitive
  film at the other; camera is another name for this sense, not a film projector and not a phone.
examples:
- He loaded film into his photographic camera.
- Her photographic camera took sharp pictures on holiday.
