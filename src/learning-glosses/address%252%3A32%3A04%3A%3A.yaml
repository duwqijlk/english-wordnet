simpleMeaning: To deal with or take up a subject in speech, writing, or art.
scope: This is about handling a topic in speech, writing, or art, not about speaking to a person, giving
  a speech, greeting someone with a title, directing a question at someone, putting postal details on
  an envelope, turning effort to a practical task or question, locating data by a code, aiming a golf
  club, or any noun sense such as a place, a house sign, a speech, a way of speaking, written delivery
  details on mail, tact, a golfer's stance, or storage code.
examples:
- The documentary addresses the legacy of the war in the border region.
- Her later poems address themes of loss and exile.
