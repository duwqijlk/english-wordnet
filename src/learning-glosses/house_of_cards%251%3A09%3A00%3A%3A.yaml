simpleMeaning: A risky plan that rests on changing things the planner cannot control
scope: This is a risky plan resting on things the planner cannot control; bubble is another name for this
  sense, not a real building made of cards and not a safe plan with firm facts.
examples:
- His proposal was nothing but a house of cards.
- The whole house of cards fell apart when prices dropped.
