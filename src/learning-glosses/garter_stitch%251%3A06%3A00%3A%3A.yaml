simpleMeaning: Flat rows of raised lines appear when both sides of the work are knitted the same way.
scope: This is the knitting that leaves flat rows of raised lines, with both sides done the same way.
examples:
- She used a garter stitch for the scarf, knitting both sides the same way.
- The garter stitch gave the blanket flat rows of raised lines.
