simpleMeaning: not smooth or pleasing in the way a person or animal moves or holds the body
scope: 'Also called clumsy, ungainly, clunky, and gawky: this is about moving or holding the body in a
  way that is not smooth, not about a thing that is too big or heavy to carry or use.'
examples:
- With his long legs, the young deer looked unwieldy when it walked.
- He felt unwieldy as he heaved his large body out of the low chair.
