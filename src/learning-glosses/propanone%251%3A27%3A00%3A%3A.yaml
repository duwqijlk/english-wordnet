simpleMeaning: Used a lot to dissolve other chemicals and to make plastics, this very easily burning liquid
  is the plainest of a group of chemicals called ketones
scope: Also called acetone and dimethyl ketone, this is the plainest of the chemicals called ketones,
  a very easily burning liquid used a lot to dissolve other chemicals and to make plastics.
examples:
- They keep propanone away from flames because it burns so easily.
- The factory used propanone to dissolve chemicals for making plastics.
