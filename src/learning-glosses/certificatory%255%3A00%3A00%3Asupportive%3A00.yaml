simpleMeaning: saying, with the word of a person in charge, that something is true or good
scope: It is a word for what backs a claim with authority, not a plain statement and not a guess.
examples:
- Her certificatory letter gave the school's word that the student had passed.
- The certificatory note from the bank backed up the claim.
