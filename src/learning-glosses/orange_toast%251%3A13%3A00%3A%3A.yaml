simpleMeaning: Butter and sugar, with a little juice and the grated skin of a round citrus fruit, are
  spread on bread browned by heat.
scope: This is a dish of bread browned by heat, spread with butter and sugar and the grated skin of a
  round citrus fruit, with a little of its juice.
examples:
- We ate orange toast with butter and sugar.
- A little juice from a round citrus fruit went into the orange toast.
