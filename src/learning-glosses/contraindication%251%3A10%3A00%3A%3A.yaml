simpleMeaning: In medicine, a reason why a doctor should not give a certain drug or use a certain way
  of treating a sick person
scope: A medical reason not to give a drug or use a treatment; not a side effect and not a reason to stop
  all care.
examples:
- The allergy was a contraindication for that drug.
- Her heart trouble was a contraindication to the new treatment.
