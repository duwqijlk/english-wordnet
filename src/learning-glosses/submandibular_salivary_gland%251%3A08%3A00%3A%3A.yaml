simpleMeaning: Into the mouth under the tongue flows spit from a gland inside the lower jaw on both sides,
  the gland that makes most of the spit made at night.
scope: 'Also called mandibular gland, submandibular gland, submaxillary gland, and submaxillary salivary
  gland: a spit gland inside the lower jaw that makes most of the spit made at night.'
examples:
- The submandibular salivary gland lets spit out under the tongue.
- Most of the spit made at night comes from the submandibular salivary gland.
