simpleMeaning: Brought on by a doctor's words or care, above all a problem that comes from the care itself.
scope: Brought on by a doctor's words or care, above all a problem caused by the care itself, not an illness
  that starts on its own and not a harm done by a patient's own act.
examples:
- The rash was iatrogenic, brought on by the treatment itself.
- An iatrogenic cough followed the new drug.
