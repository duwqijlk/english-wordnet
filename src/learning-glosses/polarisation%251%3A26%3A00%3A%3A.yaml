simpleMeaning: The state of having two ends that are unlike each other, or of giving that state to something
  else
scope: The state of having two unlike ends, or of giving that state to something else, also called polarization;
  not the way light waves are held to one direction of movement.
examples:
- The polarisation of the magnet gives it a north and a south end.
- The polarisation of the battery makes one end positive and the other negative.
