simpleMeaning: a small thing that stays on top of the water, most often made of cork, tied to a fishing
  line
scope: 'Also called bob, bobber and cork: a small thing that stays on top of the water and is tied to
  a fishing line, not a weight that sinks and not a hook that catches fish.'
examples:
- He tied a bobfloat to his line before he cast it into the lake.
- The bobfloat dipped under the water when a fish took the bait.
