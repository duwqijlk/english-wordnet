simpleMeaning: not letting water go in or out
scope: This means no water can pass in or out at all; it is not just keeping some water out for a short
  time, and not tight in the sense of fitting with no room to move.
examples:
- The watertight box kept the papers dry in the rain.
- She shut the watertight door before the boat left the port.
