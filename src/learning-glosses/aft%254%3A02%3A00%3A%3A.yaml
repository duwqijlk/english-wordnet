simpleMeaning: At, near, or toward the back end of a ship or an aircraft.
scope: This adverb tells where something is or moves on a ship or plane, not the adjective that describes
  a part as being at the back.
examples:
- The cargo was stored aft, away from the crew quarters.
- She walked aft to check the engine.
