simpleMeaning: The smooth ring muscle that opens and shuts the main tube of the pancreas.
scope: The smooth ring muscle of the main pancreas tube; not the ring muscle of the bile tube, and not
  a muscle that moves food.
examples:
- The musculus sphincter ductus pancreatici controls the flow from the pancreas.
- The musculus sphincter ductus pancreatici stayed shut during the scan.
