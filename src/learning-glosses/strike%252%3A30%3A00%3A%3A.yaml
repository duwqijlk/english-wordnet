simpleMeaning: Make an electric arc — a bright, continuous spark of current — form between the two tips
  of an arc lamp.
scope: This is about starting an electric spark in an arc lamp, not about giving someone a blow or reaching
  an agreement.
examples:
- The engineer struck an arc and the lamp lit up.
- He struck a bright arc between the tips of the lamp.
