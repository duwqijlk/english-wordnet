senseId: 'rust%1:27:00::'
synsetId: 14913630-n
simpleMeaning: a red or brown oxide layer on iron or steel; this layer forms when oxygen joins with the
  metal, and water takes part in the change too
scope: The red or brown layer itself on iron or steel, not the act of forming it, not a plant disease,
  and not the verb for being harmed by water or air.
examples:
- Rust covered the old iron gate after years in the rain.
- He cleaned the rust off the steel knife.
