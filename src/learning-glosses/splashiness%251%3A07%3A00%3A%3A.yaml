senseId: 'splashiness%1:07:00::'
synsetId: 04825154-n
simpleMeaning: a lack of good taste that comes from showing off and thinking too much of yourself
scope: A lack of good taste from showing off; also called inflation, puffiness, ostentation, ostentatiousness,
  pomposity, pompousness and pretentiousness. Not plain bad manners and not a bright colour that stands
  out.
examples:
- There was a splashiness about his speech that put people off.
- Her splashiness showed in every boast she made.
