simpleMeaning: A limit put on the parts of a statement that can stand for different things, by words like
  'some', 'all' or 'no'
scope: This is the limit that words like 'some', 'all' or 'no' put on a statement, not the act of finding
  out or stating an amount.
examples:
- In 'all dogs are animals', the quantification comes from the word 'all'.
- The quantification in her statement was weak because 'some' did not say how many.
