simpleMeaning: the way a person acts or feels after a hard blow, such as a loss or a failure
scope: How a person reacts after a crisis or failure, not a ball bouncing back.
examples:
- After the defeat, his rebound was to train twice as hard.
- She is still on the rebound after losing her job.
