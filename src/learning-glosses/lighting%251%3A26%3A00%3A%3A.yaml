simpleMeaning: The condition of a place or time when there is a lot of brightness
scope: 'Also called light: this is the condition of a place or time when there is a lot of brightness,
  not the things used to make brightness and not the work of making it.'
examples:
- The lighting in the room was bright and clear, so we could read easily.
- We could keep playing outside while the lighting was still good.
