simpleMeaning: to talk or say something in a loud, sharp way, like the sound a hen makes
scope: This is talking in a loud, sharp way like a hen, not making a goose sound and not the hen sound
  itself as a noun.
examples:
- The women cackled as they talked about the film star.
- She cackled to her friends across the yard.
