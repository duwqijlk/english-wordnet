simpleMeaning: Any of the thin round threads that, as a rule, grow from the outer skin of an animal that
  feeds its young with milk.
scope: This is any thin round thread growing from the outer skin of an animal that feeds its young with
  milk; hair is another name for this sense, not a thread growing from a plant and not a scale.
examples:
- There is a pilus in my soup.
- A pilus grows from the skin of a mammal.
