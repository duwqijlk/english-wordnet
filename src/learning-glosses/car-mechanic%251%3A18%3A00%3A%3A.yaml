simpleMeaning: a person whose job is to fix and look after road vehicles
scope: 'Also called auto-mechanic, automobile mechanic, grease monkey and mechanic: a person whose job
  is to fix and look after road vehicles, not a person who sells them and not a driver.'
examples:
- The car-mechanic fixed the brakes in an hour.
- She took her car to a car-mechanic for a check.
