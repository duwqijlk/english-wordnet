simpleMeaning: Silvery flaky leaves cover this spiny shrub of the plains of the southwest of the United
  States and Mexico, where the soil is not acid.
scope: Also called quail brush and quail bush, this spiny shrub has silvery flaky leaves and grows on
  the plains of the southwest of the United States and Mexico, unlike the other white thistle, a plant
  of tropical America with large white or yellow flowers and prickly leaves.
examples:
- White thistle grew on the plains with its silvery leaves.
- The white thistle caught at my sleeve with its spines.
