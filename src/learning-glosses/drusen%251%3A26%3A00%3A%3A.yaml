simpleMeaning: an eye disease, in the plural, caused by small lumps of glassy matter gathering under the
  light-sensitive layer at the back of the eye
scope: An eye disease from small lumps gathering under the back layer of the eye, not a sudden injury
  and not a clouding of the lens.
examples:
- The eye doctor found drusen in both of her eyes.
- Drusen can build up under the retina over many years.
