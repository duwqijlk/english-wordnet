simpleMeaning: The approved speech of Britain, first based on the king's speech at public schools, Oxford
  and Cambridge, used widely elsewhere in Britain; until recently the speech of British broadcasting.
scope: Also called King's English, Received Pronunciation and Received Pronunciation language; the standard
  way of speaking in Britain, not a local way of speaking and not the speech of another country.
examples:
- Her Queen's English was clear and easy to follow.
- He spoke in Queen's English all his life.
