simpleMeaning: In botany, the outer ring of leaf-like parts, called sepals, that encloses and supports
  a flower bud; they are usually green.
scope: The outer ring of sepals around a flower bud, not the petals inside it or the whole flower.
examples:
- The calyx of the tomato flower was small and green.
- She pulled the calyx off each strawberry before slicing it.
