simpleMeaning: writing that looks like the old picture writing of Egypt, usually because it is too hard
  to read
scope: 'Also called hieroglyphic: a piece of writing that only looks like old Egyptian picture writing,
  usually because it cannot be read. It is not one real old Egyptian picture sign itself.'
examples:
- The doctor's notes looked like hieroglyphs, and no one could read them.
- His quick, messy handwriting looked like hieroglyphs to me.
