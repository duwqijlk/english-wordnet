senseId: 'identically%4:02:00::'
synsetId: 00362861-r
simpleMeaning: In a way that is the same in every part, with nothing at all different.
scope: In a way that matches another thing in every part; not merely alike, but the same throughout.
examples:
- The twins dressed identically for the party.
- Both rooms were identically furnished, down to the last chair.
