simpleMeaning: when rock dissolves or a cave roof falls in, a dip in the ground opens into a passage below,
  above all in limestone
scope: This dip is also called a sink and a sinkhole.
examples:
- A swallow hole opened in the ground.
- The swallow hole lay in the limestone country.
