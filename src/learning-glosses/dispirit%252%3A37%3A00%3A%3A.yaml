simpleMeaning: to make someone feel low and sad, so they lose hope and cheer
scope: 'Also called depress, dismay, deject, demoralize and demoralise: to make someone feel low and sad.
  Not to press a thing down or to push a price down.'
examples:
- The long wait for news dispirited the whole team.
- Losing the job dispirited him for weeks.
