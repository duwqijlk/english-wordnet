senseId: 'tamarind%1:20:00::'
synsetId: 12521707-n
simpleMeaning: A long-lived tropical tree with a spreading crown of feathery leaves, fragrant flowers,
  hard yellowish wood, and long pods whose sour, chocolate-brown pulp can be eaten.
scope: This is the tree that bears the pods, not the tangy pods themselves or the pulp sold in markets.
examples:
- A tamarind stood at the gate, its long brown pods hanging over the wall.
- The tamarind in the courtyard drops its pods every dry season.
