simpleMeaning: A picture cut into a smooth plate of copper, made by etching or engraving the metal.
scope: Also called a copperplate engraving; the picture cut into a copper plate, not the neat handwriting
  style and not a print made from such a plate.
examples:
- The copperplate showed a fine scene etched in the metal.
- He printed the picture from a copperplate.
