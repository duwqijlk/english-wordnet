simpleMeaning: A tall, symmetrical evergreen of western North America, with long blue-green needles in
  threes and long cones on spreading, somewhat drooping branches; sometimes classed as a kind of ponderosa
  tree.
scope: A tall western evergreen, also called black pine, Jeffrey pine and Pinus jeffreyi, close to the
  ponderosa pine and other tall western pines.
examples:
- Jeffrey's pine towered over the campsite.
- The cones of Jeffrey's pine littered the trail.
