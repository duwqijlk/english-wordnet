simpleMeaning: full of deep hate and ill will, and meant to cause harm on purpose
scope: Also called poisonous and venomous. This means full of hate and meant to harm, not so bad that
  it should bring strong blame, and not cruel in causing pain.
examples:
- She spread vicious gossip about the woman she worked with.
- He wrote a vicious note, full of hate, to hurt his old friend.
