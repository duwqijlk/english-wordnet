simpleMeaning: Zinc joined with oxygen makes this white powder, which colours paints and things put on
  the skin and goes into glass, inks, and a healing skin cream.
scope: It is also called flowers of zinc, philosopher's wool, and zinc oxide, and it is a white powder
  of zinc joined with oxygen.
examples:
- The chemist bought philosophers' wool for the white paint.
- The white powder in the jar was philosophers' wool.
