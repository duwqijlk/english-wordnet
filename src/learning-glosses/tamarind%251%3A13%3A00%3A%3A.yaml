simpleMeaning: a large seed pod from hot lands with very sharp, sour soft flesh inside, eaten fresh or
  cooked with rice and fish or kept for curries and chutneys
scope: Also called tamarindo, this is the large, very sour seed pod itself, eaten fresh or cooked, not
  a ready-made sauce or sweet made from it.
examples:
- She added tamarind to the rice to give it a sour taste.
- Fresh tamarind is very sour, so he cooked it with fish.
