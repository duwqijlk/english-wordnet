simpleMeaning: Inside the guts of animals with backbones, one of many kinds of worm lives off its host,
  its snout able to pull back and covered with many hooked spines.
scope: This worm, one of many kinds living inside the guts of animals with backbones and with a snout
  covered in hooked spines, is also called acanthocephalan.
examples:
- The spiny-headed worm lived in the gut of the fish.
- A spiny-headed worm with hooked spines was in the gut.
