simpleMeaning: a set of weights that uses the pound of 16 ounces, or 7,000 grains, as its base
scope: Also called avoirdupois weight, it is a set of weights built on the 16-ounce pound, not the metric
  set of weights and not a single weight on its own.
examples:
- Most goods in the shop were weighed in avoirdupois.
- The avoirdupois pound holds 16 ounces, unlike the troy pound.
