simpleMeaning: to cut meat or fish into thin, flat pieces that have no bones in them
scope: This is the verb for cutting meat or fish in this way, not the noun for a cut of beef or a side
  of fish, and not the verb for decorating cloth with a lace pattern.
examples:
- Please filet the fish before you cook it.
- He fileted the chicken breast into two thin pieces.
