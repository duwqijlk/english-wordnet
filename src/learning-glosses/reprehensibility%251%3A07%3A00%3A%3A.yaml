simpleMeaning: the state of being so bad that it ought to be blamed and told off in strong words
scope: Being bad enough to deserve strong blame, not a small fault and not an act that wins praise.
examples:
- The reprehensibility of the fraud shocked the whole town.
- No one could deny the reprehensibility of such cruelty.
