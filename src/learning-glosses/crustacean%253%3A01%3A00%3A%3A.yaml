simpleMeaning: of a large group of animals that live mainly in water and usually have hard outer shells,
  legs with joints, and bodies in parts
scope: Describes a thing as belonging to the group of animals called Crustacea, not the noun that names
  one animal in that group.
examples:
- Scientists studied the crustacean species living in the deep sea.
- Crabs and shrimps share many crustacean features.
