simpleMeaning: Of the eight bones that make up the skull, this small one is full of air spaces and helps
  form the eye sockets and the nose cavity.
scope: Also called ethmoid bone, this is one of the eight bones of the skull, a small bone full of air
  spaces that helps form the eye sockets and the nose cavity.
examples:
- The ethmoid sits between the eyes.
- A break in the ethmoid can affect the nose.
