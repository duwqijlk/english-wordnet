simpleMeaning: in electronics, a joint where two things, such as two electrical conductors, meet and touch.
scope: This is the electrical junction, not close interaction, not the act of touching physically, not
  the state of touching or being very near, not the physical coming together of two or more things, not
  a person able to give special help, not a channel for communication between groups, not a communicative
  exchange, not a lens worn on the eye, and not a verb meaning to communicate with or to touch.
examples:
- They forgot to solder the contacts on the switch.
- A loose contact in the battery compartment made the lamp flicker.
