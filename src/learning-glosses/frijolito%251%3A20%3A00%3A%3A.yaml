simpleMeaning: a small tree or shrub with leaves set like a feather that can poison farm animals, and
  thick bunches of blue flowers that smell very sweet and red beans
scope: 'Also called coral bean, frijolillo and mescal bean: a small tree or shrub with blue flowers and
  red beans, not a food bean plant and not a shade tree.'
examples:
- The frijolito stands by the fence, its blue flowers smelling sweet in the heat.
- Do not let the cattle eat the frijolito, whose leaves poison farm animals.
