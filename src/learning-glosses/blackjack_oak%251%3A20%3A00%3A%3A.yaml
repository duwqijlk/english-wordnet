simpleMeaning: A scrubby tree of mid and southeast United States that sheds its leaves, with black bark
  and wide leaves of three lobes, club-shaped, apt to grow in dense thickets.
scope: This sense is also called blackjack and jack oak, a scrubby tree of mid and southeast United States
  that sheds its leaves, with black bark and wide leaves of three lobes, club-shaped, apt to grow in dense
  thickets.
examples:
- Blackjack oaks grow in dense thickets.
- The blackjack oak sheds its leaves.
