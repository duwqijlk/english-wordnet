simpleMeaning: A long-lasting illness of the nerves that slowly gets worse, in which the soft covering
  round some nerve threads is lost.
scope: This is a nerve illness, not a letter name or a degree; also called disseminated multiple sclerosis,
  disseminated sclerosis and multiple sclerosis.
examples:
- MS slowly takes away the covering round nerve threads.
- She lives with MS, a long-lasting nerve illness.
