simpleMeaning: In a way that shows a person has lost the power to speak, through weakness of body or feeling.
scope: In a way that shows a person has lost the power to speak, through weakness of body or feeling,
  not in silence by choice.
examples:
- She stared speechlessly at the letter in her hands.
- He stood speechlessly before them, too moved to say a word.
