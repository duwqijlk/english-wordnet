simpleMeaning: In the rivers and streams of North America lives a big animal with a tail
scope: 'Also called a hellbender: a big animal with a tail that lives in the rivers and streams of North
  America, not a young dog and not the mud puppy with red feathery gills or the one from the mountain
  lakes of Mexico.'
examples:
- A mud puppy swam slowly along the river bed.
- We found a mud puppy under a rock in the stream.
