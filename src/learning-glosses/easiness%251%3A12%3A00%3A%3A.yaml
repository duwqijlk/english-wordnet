simpleMeaning: a calm, fresh feeling when body and mind are not tight or worried
scope: This sense is also called relaxation. It is a calm feeling in body and mind, not how easy a task
  is to do.
examples:
- After the swim, a warm easiness spread through her body.
- He slept with an easiness he had not felt for weeks.
