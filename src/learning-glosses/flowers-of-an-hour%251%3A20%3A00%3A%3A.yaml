simpleMeaning: a weedy plant that lives one year, with short-lived yellow blooms with purple centres,
  from the warm Old World lands, now wild as a weed in North America
scope: A weedy plant with short-lived yellow blooms, also called bladder ketmia and flower-of-an-hour,
  not the garden hibiscus with large blooms that last for days.
examples:
- The flowers-of-an-hour opened in the morning and were gone by night.
- We pulled the flowers-of-an-hour from the bed because it had spread like a weed.
