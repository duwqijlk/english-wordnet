simpleMeaning: how much more charge one point in a circuit has than another point, given as a number in
  volts
scope: 'Also called potential, voltage, potential difference and potential drop: how much more charge
  one point in a circuit has than another point, given as a number in volts, not the flow of charge through
  the circuit and not the charge at one point on its own.'
examples:
- The electric potential between the two ends of the wire was 12 volts.
- She worked out the electric potential across the battery terminals.
