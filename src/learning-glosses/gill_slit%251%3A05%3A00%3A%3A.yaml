simpleMeaning: One of a row of narrow openings in the throats of fish and of animals that live in water
  and on land lets water pass through.
scope: Also called a branchial cleft or a gill cleft, water passes through this one of a row of narrow
  openings in the throat.
examples:
- Water passed through the gill slit of the fish.
- Each gill slit in the row lets water flow through the throat.
