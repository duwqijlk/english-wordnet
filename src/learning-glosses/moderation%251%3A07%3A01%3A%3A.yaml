simpleMeaning: a settled habit of not going too far in what one does or has
scope: A settled habit of not going too far in what one does or has; close to the quality of keeping to
  the middle way, and not the act of making something less strong.
examples:
- His moderation in drink was well known.
- Moderation is a trait she learned from her parents.
