simpleMeaning: Air passing over the sharp edge of a narrow slit or a lip makes the tone of this tube in
  an organ.
scope: Air passing over the sharp edge of a slit or lip makes the tone of this organ tube, also called
  a flue and a flue pipe.
examples:
- Air passed over the sharp edge, and the labial pipe sounded.
- The labial pipe made its tone as air crossed the lip.
