simpleMeaning: to make something shorter in length or time than was planned at first
scope: This is about making a thing or a trip shorter than planned, not about cutting the size of a piece
  of writing while keeping its main points.
examples:
- He shortened his trip due to illness.
- She shortened the skirt because it was too long.
