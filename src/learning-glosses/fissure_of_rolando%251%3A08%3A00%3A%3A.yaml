simpleMeaning: A deep groove in the brain running up the outer side of both halves, marking off the front
  part from the back part.
scope: A deep groove running up the outer side of both halves of the brain, also called central sulcus,
  sulcus centralis and Rolando's fissure; it marks off the front part from the back part.
examples:
- The fissure of Rolando runs up the side of each half of the brain.
- Doctors use the fissure of Rolando to mark off the front part of the brain from the back part.
