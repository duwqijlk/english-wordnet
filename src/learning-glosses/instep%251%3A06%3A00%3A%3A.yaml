simpleMeaning: the part of a shoe or stocking that covers the curved middle top part of the foot
scope: This is the part of a shoe or stocking, not the foot itself and not the sole under the foot.
examples:
- The instep of his shoe was too tight over his foot.
- She wore stockings with a soft instep that did not rub.
