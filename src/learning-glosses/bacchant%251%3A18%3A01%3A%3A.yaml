simpleMeaning: a person who has drunk too much and makes a loud, wild show of joy, or one who follows
  the god of wine
scope: 'Also called a bacchanal: a drunk person at a wild party or a follower of the god of wine, not
  a priest of that god in old stories.'
examples:
- The bacchant sang and danced in the street after drinking too much wine.
- A bacchant raised his cup to the god of wine at the feast.
