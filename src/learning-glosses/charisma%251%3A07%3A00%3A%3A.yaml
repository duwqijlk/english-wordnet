simpleMeaning: a personal charm or interesting way about a person that helps that person change what other
  people think or do
scope: This is a person's personal charm or interesting way that helps them change what other people think
  or do; not just good looks, not fame, and not power from a high job.
examples:
- The new leader has great charisma and crowds love to listen to her.
- His charisma made the whole room pay attention.
