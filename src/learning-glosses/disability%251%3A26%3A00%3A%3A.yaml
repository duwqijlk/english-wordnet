simpleMeaning: the state of not being able to do things because the body or the mind is not fit enough
  to do them
scope: Not being able to do things because body or mind is unfit, not a lack of skill and not a short
  illness.
examples:
- A hearing disability made school harder for her.
- She lives with a disability that limits how far she can walk.
