simpleMeaning: the title for the head of an Eastern Orthodox Church in Istanbul, Alexandria, Moscow, or
  Jerusalem
scope: A church leader's title in those four cities, not an early father figure from the Bible and not
  the male head of a family.
examples:
- The Patriarch of Moscow led the church service.
- The Patriarch in Istanbul met with other church leaders.
