simpleMeaning: a link between genes on the chromosomes that fix gender, which makes some traits show up
  more often in one gender than in the other
scope: A link between genes on the chromosomes that fix gender, making some traits show up more in one
  gender; not a trait passed down by one parent and not a change in the body.
examples:
- Sex linkage helps explain why some traits show up more in boys.
- The teacher used sex linkage to show how genes on the chromosomes that fix gender are passed on.
