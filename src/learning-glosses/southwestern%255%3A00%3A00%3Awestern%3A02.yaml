simpleMeaning: Belonging to or connected with a part of the United States that generally includes New
  Mexico, Arizona, Texas and California, and sometimes Nevada, Utah and Colorado
scope: This names a set part of the United States made up of those states; it is not just placed in or
  pointing toward the southwest.
examples:
- She took a trip through the southwestern states, from Arizona to Texas.
- Southwestern cooking in New Mexico often uses hot peppers.
