simpleMeaning: When a push of one volt between two points on a carrier makes a flow of one ampere, the
  hold-back there is measured in this unit.
scope: A unit for the hold-back between two points on a carrier, not the push itself and not the flow
  itself.
examples:
- The ohm is a unit of hold-back.
- He measured the wire in ohms.
