simpleMeaning: A unit of electrical resistance, equal to the resistance between two points on a conductor
  when one volt between them makes a current of one ampere.
scope: A unit for the hold-back between two points on a carrier, not the push itself and not the flow
  itself.
examples:
- The ohm is a unit of hold-back.
- He measured the wire in ohms.
