simpleMeaning: a health problem in which a part of the body does not have the normal shape
scope: 'Also called malformation: a part of the body with the wrong shape, not a short illness and not
  a cut or wound.'
examples:
- The child was born with a deformity of the foot.
- His deformity made walking hard at first, but he learned to walk well.
