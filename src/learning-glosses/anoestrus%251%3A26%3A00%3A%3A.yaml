simpleMeaning: Set between two heats, a female mammal other than a person takes a rest from mating, with
  no wish to mate.
scope: Also called anestrum, anestrus, and anoestrum, this is a rest from mating for mammals other than
  people, not the heat itself.
examples:
- During anoestrus the doe ignored the buck and showed no wish to mate.
- Anoestrus ended only when the next heat began.
