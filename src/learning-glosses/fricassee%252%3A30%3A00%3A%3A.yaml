simpleMeaning: To cook in a white stew.
scope: This sense is to cook in a white stew, unlike the sense for bits of chicken or other meat, stewed
  in gravy with carrots and onions, and served with noodles or dumplings.
examples:
- They fricassee chicken, cooking it in a white stew.
- They fricassee meat.
