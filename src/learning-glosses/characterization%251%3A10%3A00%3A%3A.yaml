simpleMeaning: a description in words that is very clear and full of life
scope: This sense is also called picture, depiction and delineation; it is a clear description in words,
  not acting a part on stage. It is also not the act of describing what makes a person or thing special.
examples:
- The book gives a short, clear characterization of life in the small town.
- His characterization of the old sailor made me see his face and hear his voice.
