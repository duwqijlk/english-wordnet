simpleMeaning: Life in the country is what this piece of music brings to mind
scope: 'Also called a pastoral or an idyll: a piece of music that brings to mind life in the country,
  not a song about city life and not a piece of music for dancing.'
examples:
- The orchestra played a pastorale that made us think of green fields.
- She wrote a gentle pastorale full of birdsong.
