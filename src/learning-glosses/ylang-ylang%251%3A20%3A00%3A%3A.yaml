simpleMeaning: scented greenish-yellow flowers, carried on an Asian tree grown widely in hot lands for
  show, give an oil that turns to vapour; the tree keeps its leaves all year
scope: 'Also called ilang-ilang: a tree grown for show in hot lands, not a tree grown for its fruit and
  not a flower bed plant.'
examples:
- Ylang-ylang grows in the garden for its scented flowers.
- The ylang-ylang oil comes from its greenish-yellow flowers.
