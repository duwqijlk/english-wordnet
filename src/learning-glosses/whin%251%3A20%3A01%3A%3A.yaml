simpleMeaning: a small bush from Europe and Asia with groups of yellow flowers that give a dye, often
  a weed in Britain and the United States, sometimes grown for beauty
scope: A small bush with yellow flowers that give a dye, often a weed in Britain and the United States;
  not the sharp evergreen whin bush and not whin rock.
examples:
- Whin grew as a weed along the edge of the field.
- People once used the yellow flowers of whin to make dye.
