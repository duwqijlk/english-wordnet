simpleMeaning: a cat with grey or light brown fur, with black marks in patches or spots
scope: A cat of this kind, not the adjective sense that describes fur or cloth as having a grey or brown
  streaked pattern.
examples:
- Our tabby slept by the window all afternoon.
- The small tabby has grey fur with black marks on its back.
