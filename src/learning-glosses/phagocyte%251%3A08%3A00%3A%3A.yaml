simpleMeaning: A body cell that swallows and breaks down waste and germs that invade the body.
scope: A body cell that swallows and breaks down waste and germs that invade the body; not a red blood
  cell and not a germ itself.
examples:
- A phagocyte surrounded the germ and broke it down.
- Phagocytes clear dead cells from the wound.
