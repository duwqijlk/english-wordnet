simpleMeaning: This European hawkweed, a weed, bears bright orange-red flower heads and has taken hold
  in north-eastern North America, where it is especially troublesome; some botanists place it in Hieracium.
scope: This is the European hawkweed with flame-red flower heads, the one that spreads as a weed in North
  America; not the yellow-flowered hawkweeds.
examples:
- Orange hawkweed has spread through the pastures of Nova Scotia.
- Gardeners in the Northeast fight orange hawkweed, which forms dense patches of flame-coloured flowers.
