simpleMeaning: A wide band of stretchy material with straps that hang from it, worn by women to hold up
  their stockings
scope: This is a wide band of stretchy material with straps that hang from it, worn by women to hold up
  their stockings; suspender belt is another name for this sense, not a plain band and not a pair of tights.
examples:
- She wore a garter belt to hold up her stockings.
- The garter belt has straps that hang down to the stockings.
