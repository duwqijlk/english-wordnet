simpleMeaning: A butterfly from mild parts of the world, with dark purple wings edged in yellow.
scope: 'Also called mourning cloak, mourning cloak butterfly or Nymphalis antiopa: a butterfly from mild
  parts of the world, with dark purple wings edged in yellow, not a butterfly with plain brown wings.'
examples:
- A Camberwell beauty with dark purple wings edged in yellow settled on the garden wall.
- We saw the Camberwell beauty open its dark purple wings edged in yellow in the park.
