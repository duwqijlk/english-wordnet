simpleMeaning: A short tale or riddle that makes no sense and has no answer, used in Zen Buddhism to show
  that plain thinking falls short.
scope: A riddle with no answer, used in Zen Buddhism to show the limits of plain thinking.
examples:
- The master gave the student a koan to think on.
- She puzzled over the koan for weeks without finding an answer.
