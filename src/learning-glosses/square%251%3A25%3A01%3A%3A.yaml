simpleMeaning: A shape or outline that looks close to a four-sided figure with equal sides and corners
  of ninety degrees.
scope: This is a rough shape or outline, not the exact geometric figure studied in geometry and not a
  manufactured object formed that way.
examples:
- The dancers stood in a wide square, holding hands.
- The chairs were arranged in a rough square around the table.
