simpleMeaning: a place, such as a border post, where travellers are stopped so their papers and goods
  can be checked and they can be let through
scope: A place where travellers are stopped and checked before they can go on, not a stop on a road for
  rest and not a stage in a race.
examples:
- The checkpoint at the border was crowded with waiting travellers.
- We showed our passports at the checkpoint before crossing.
