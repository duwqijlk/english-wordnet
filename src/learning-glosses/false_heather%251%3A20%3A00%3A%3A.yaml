simpleMeaning: A low evergreen plant of North America, like a heath, that lies flat and bears yellow flowers.
scope: A low evergreen plant of North America, like a heath, that lies flat and bears yellow flowers,
  also called golden heather; not a true heather and not a yellow broom.
examples:
- False heather spread low over the rocky ground.
- The false heather showed small yellow flowers.
