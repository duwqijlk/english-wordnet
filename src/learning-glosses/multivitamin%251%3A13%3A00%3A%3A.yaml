simpleMeaning: a pill or small flat piece of medicine that has several vitamins in it
scope: One pill with several vitamins in it, not a pill with only one vitamin and not food that has vitamins
  in it.
examples:
- She takes a multivitamin every morning with her breakfast.
- The doctor told him to take a multivitamin each day.
