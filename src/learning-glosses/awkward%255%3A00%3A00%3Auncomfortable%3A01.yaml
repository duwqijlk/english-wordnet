simpleMeaning: feeling not at ease with other people, unsure of yourself, and held back in how you act
scope: Feeling not at ease with other people, not moving without skill or grace, and not about words that
  sound clumsy or not smooth.
examples:
- He felt awkward at the party and did not know what to say to anyone.
- She is awkward with strangers and often stays quiet in a new group.
