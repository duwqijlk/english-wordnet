simpleMeaning: a place on the internet where a number of people can talk to each other at the same time,
  often about one set topic
scope: A place on the internet where people talk to each other at the same time; chatroom is another name
  for this sense, not a phone call and not a message board where replies come later.
examples:
- We met in a chat room about old films.
- The chat room was full of fans talking at once.
