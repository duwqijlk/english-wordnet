simpleMeaning: With very sour fruit under orange peel, this is a cross of a mandarin orange and a lemon.
scope: Also called rangpur and lemanderin, this is a cross of a mandarin orange and a lemon with very
  sour fruit, not a sweet orange on its own.
examples:
- The rangpur lime tasted very sour.
- She peeled a rangpur lime and ate the fruit.
