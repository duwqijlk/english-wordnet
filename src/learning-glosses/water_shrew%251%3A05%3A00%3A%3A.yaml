simpleMeaning: any of several small mouse-like animals that live partly in streams, most often near fast-flowing
  streams
scope: Any of several small mouse-like animals that live partly in streams, most often near fast-flowing
  streams, not a mouse and not a shrew that lives only on dry land.
examples:
- A water shrew darted along the bank of the fast stream.
- The water shrew swam across the creek and vanished into the grass.
