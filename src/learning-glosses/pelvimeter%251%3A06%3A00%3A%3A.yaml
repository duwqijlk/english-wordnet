simpleMeaning: The wide bone at the base of the body is what this tool measures
scope: A tool that measures the wide bone at the base of the body, not a ruler for cloth and not a scale
  for weighing.
examples:
- The nurse used a pelvimeter to measure the mother's pelvis.
- A pelvimeter helps the doctor know the size of the mother's pelvis before the birth.
