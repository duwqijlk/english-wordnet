simpleMeaning: a king snake, tan and brown, harmless, marked on the back of its head with an arrow shape;
  in the south-east it shows red stripes like a coral snake
scope: 'Also called checkered adder, house snake, and milk adder: a harmless tan and brown king snake,
  not a snake with venom and not a coral snake.'
examples:
- The milk snake curled around the branch, tan and brown with an arrow-shaped mark on its head.
- A milk snake from the south-east showed red stripes like a coral snake.
