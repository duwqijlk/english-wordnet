simpleMeaning: Anxious feelings that wind you up and set you snapping.
scope: This sense is also called uneasiness, edginess, and inquietude, for anxious feelings that wind
  you up and set you snapping, where uneasiness is worried feelings leaving you tight with nerves and
  quick to snap at others.
examples:
- Disquietude wound her up and set her snapping.
- Disquietude is anxious feelings.
