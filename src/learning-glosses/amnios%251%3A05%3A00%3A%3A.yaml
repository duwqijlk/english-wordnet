simpleMeaning: The thin inner skin-like sack that holds a young still growing, of a higher back-boned
  beast, a reptile, a bird, or a mammal.
scope: This sense is also called amnion and amniotic sac.
examples:
- An amnios held the young.
- Amnios enclose the young.
