simpleMeaning: Something that turns up as a strange mix of things put together.
scope: This is a strange mixture that appears; not the act of making something, and not a food made by
  mixing things.
examples:
- The machine suddenly spewed out a thick green concoction.
- A strange concoction of smoke and dust rose from the old chimney.
