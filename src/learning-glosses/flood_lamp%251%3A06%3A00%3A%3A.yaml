simpleMeaning: A light made by people, not by nature, that gives out a wide beam, used for taking photos.
scope: A light made by people that gives out a wide beam for taking photos, also called flood, floodlight,
  and photoflood; not a narrow beam of light and not light from the sun.
examples:
- The flood lamp lit the whole stage for the photo.
- She set up a flood lamp beside the camera.
