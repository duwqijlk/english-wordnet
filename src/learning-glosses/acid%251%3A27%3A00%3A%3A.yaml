simpleMeaning: one of a group of chemicals that dissolve in water, taste sour, turn litmus (a test paper)
  red, and join with the opposite kind of chemical to make a salt
scope: A chemical of this kind, not the drug with the same name and not a harsh way of speaking.
examples:
- Vinegar has a weak acid in it.
- The acid in the bottle turned the test paper red.
