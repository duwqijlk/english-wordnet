simpleMeaning: a lord in old times who was owed loyalty and work by the people who lived on his land
scope: A lord of old times to whom people owe loyalty and work, not the person who owes that loyalty,
  and not the word for loyal itself.
examples:
- The knights swore to serve their liege in battle.
- Each tenant paid rent to his liege every year.
