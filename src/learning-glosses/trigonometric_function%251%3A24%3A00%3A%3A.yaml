simpleMeaning: A number that tells how the sides of a right-angled triangle with a given corner compare
  with each other.
scope: Also called circular function, it gives the ratio of the sides of a right-angled triangle with
  a given corner.
examples:
- The sine is a trigonometric function of the angle.
- In class we worked out a trigonometric function from the sides of the triangle.
