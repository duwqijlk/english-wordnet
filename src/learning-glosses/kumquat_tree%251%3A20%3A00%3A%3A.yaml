simpleMeaning: One of several kinds of Fortunella tree or shrub, it bears small edible orange fruit with
  thick sweet skin and sour flesh.
scope: Another name for the kumquat plant, a Fortunella shrub or tree bearing small orange fruit; not
  the fruit itself.
examples:
- The kumquat tree was covered in small orange fruit.
- They planted a kumquat tree beside the wall.
