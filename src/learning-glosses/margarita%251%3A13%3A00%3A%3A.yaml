simpleMeaning: a mixed strong drink made with tequila (a strong Mexican drink) and triple sec (a sweet
  orange drink), plus lime and lemon juice
scope: This is the mixed strong drink with tequila and lime; not a glass of plain tequila and not a soft
  fruit drink.
examples:
- She ordered a margarita with extra lime.
- He sipped his cold margarita at the bar.
