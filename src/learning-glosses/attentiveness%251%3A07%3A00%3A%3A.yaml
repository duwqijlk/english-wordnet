simpleMeaning: the quality of being kind and thinking about what other people need or feel
scope: The quality of being kind and thoughtful to others, not the quality of watching and listening with
  care.
examples:
- Her attentiveness to the sick child made him feel safe.
- We thanked him for his attentiveness to our needs during the stay.
