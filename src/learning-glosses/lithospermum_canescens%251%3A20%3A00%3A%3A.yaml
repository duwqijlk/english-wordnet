scope: A long-lived North American plant with grey hairy leaves, also called hoary puccoon and Indian
  paint; not a garden herb and not a wild mint.
examples:
- Lithospermum canescens grows on the dry plains of North America.
- A red dye can be got from the leaves of Lithospermum canescens.
