simpleMeaning: two curved bars of iron joined so they can move, used to lift heavy things
scope: Two curved bars of iron joined so they can move, used to lift heavy things; crampoon is another
  name for this sense, not the spiked shoe for ice and not a single hook.
examples:
- The workers used a crampon to lift the heavy stone block.
- A crampon held the beam while the men moved it into place.
