simpleMeaning: A fine food fish of the tropical Atlantic and Caribbean, with a wide yellow stripe down
  its sides and on its tail.
scope: Also called yellowtail and yellowtail snapper; among food fish of the warm Atlantic it is the one
  with a wide yellow stripe down its sides and on its tail.
examples:
- The cook grilled an Ocyurus chrysurus for dinner.
- Fishermen prize Ocyurus chrysurus for its sweet flesh and yellow stripe.
