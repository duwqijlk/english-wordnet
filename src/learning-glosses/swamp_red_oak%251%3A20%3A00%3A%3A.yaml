simpleMeaning: A large deciduous tree from New Jersey to Illinois and southward, with spreading branches,
  a rounded crown, narrow curved leaves with deeply wavy lobes, and wood resembling northern red oak.
scope: Another name for southern red oak and turkey oak; it is not the northern red oak, although their
  timber is similar.
examples:
- A swamp red oak stood at the edge of the wet ground.
- The swamp red oak by the creek was the tallest tree in the hollow.
