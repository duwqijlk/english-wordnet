senseId: 'effulgence%1:07:00::'
synsetId: 04961131-n
simpleMeaning: The mark of glowing bright, throwing out rays.
scope: This sense is also called shine and radiance, for the mark of glowing bright, throwing out rays,
  where shine is the brightness of a thing that gives off light in rays, and radiance is light streaming
  out from a thing, making it look bright.
examples:
- Effulgence glowed bright.
- Effulgence threw out rays of light.
