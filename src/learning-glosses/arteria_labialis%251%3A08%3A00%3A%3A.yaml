simpleMeaning: The lips of the mouth get their blood from this side tube, which leaves the face tube.
scope: Also called labial artery, this side tube leaves the face tube to feed the lips of the mouth.
examples:
- Blood reached the lips through the arteria labialis.
- The arteria labialis runs from the face tube to the lips.
