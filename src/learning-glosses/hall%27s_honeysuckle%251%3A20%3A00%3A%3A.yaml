simpleMeaning: A kind of Japanese climbing plant that grows like a vine and has spread fast on its own
  in the wild in the south-east of the United States.
scope: This is a Japanese climbing plant also called Lonicera japonica halliana, not a bushy plant or
  a plant that stays in gardens.
examples:
- Hall's honeysuckle climbs over the fence in our garden.
- Hall's honeysuckle has spread through the woods here.
