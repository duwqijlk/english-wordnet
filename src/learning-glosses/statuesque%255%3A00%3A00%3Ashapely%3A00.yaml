simpleMeaning: having the fine shape and beauty of a figure of a person made as a solid object
scope: This is about fine shape and beauty, like a figure of a person made as a solid object; it is not
  the other sense of this word, about being tall and grand in size.
examples:
- The dancer's statuesque figure drew every eye in the room.
- She stood statuesque in her long dress, her fine shape clear for all to see.
