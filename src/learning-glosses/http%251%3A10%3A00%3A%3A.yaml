simpleMeaning: A set of rules that uses TCP, a way for computers to send data, to move web pages, requests,
  and data between servers and browsers
scope: A web rule set, not a web page and not a web address; also called the hypertext transfer protocol.
examples:
- The browser uses HTTP to fetch the page from the server.
- HTTP moves the page from the server to your browser.
