simpleMeaning: the act of giving a person a small dose of a weak form of a germ, so the body learns to
  fight that disease
scope: 'Also called inoculating: the act of giving a person a small dose to keep them safe from a disease,
  not the act of treating a disease once it has started and not a test for a disease.'
examples:
- Vaccinating the children kept measles out of the school.
- The nurse was vaccinating patients against flu all morning.
