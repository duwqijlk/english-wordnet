simpleMeaning: A richly decorated display on a platform that a truck carries or pulls along in a parade
  or procession.
scope: A decorated display on a truck-drawn platform in a procession or parade, not a fish's air pouch,
  a plastering tool, or a sweet iced drink.
examples:
- The parade's final float carried a giant birthday cake.
- Workers spent all night decorating the float for the New Year's Day procession.
