simpleMeaning: deep-sea worm-like mollusks with no hard plates on the body, but fine slimy spines on the
  skin that covers them
scope: 'Also called solenogaster: a deep-sea worm-like mollusk with no hard plates, not a worm and not
  a shelled mollusk.'
examples:
- The aplacophoran lives in deep water, worm-like and without plates.
- An aplacophoran has fine slimy spicules on its covering mantle.
