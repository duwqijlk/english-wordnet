simpleMeaning: In baseball, the base made of a rubber slab where the batter stands, which a base runner
  must touch to score.
scope: This is the baseball base a runner must touch to score — another name for it is home, as in home
  plate — not the dish food is served on and not a flat sheet of material.
examples:
- The runner slid across the plate just ahead of the throw.
- The umpire ruled that he had missed the plate.
