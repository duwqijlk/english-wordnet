scope: This is a plant of Europe and Asia with leaves in three heart-shaped parts and white flowers lined
  with purple; shamrock, common wood sorrel and cuckoo bread are other names for this sense, and a plant
  with other leaves or other flowers is a different kind.
examples:
- Oxalis acetosella grows in the damp shade of the woods.
- The Oxalis acetosella had white flowers lined with purple.
