simpleMeaning: a long thin strip of cloth or paper used to tie things together or hold them in place
scope: A strip used to tie or hold things, not the measuring strip, not the recording, and not the act
  of fastening.
examples:
- He used a piece of tape for a belt.
- She wrapped a tape around the package.
