simpleMeaning: A gauge of the pull between two loops, the share of the push in one loop against the matching
  shift of flow in the next loop, usually sized in henries.
scope: This sense is also called coefficient of mutual induction, for a gauge of the pull between two
  loops, the share of the push in one loop against the matching shift of flow in the next loop, usually
  sized in henries.
examples:
- Mutual inductance links two circuits.
- Mutual inductance is sized in henries.
