simpleMeaning: a low, bushy tree of central Europe, with short bright green needles in pairs
scope: A low, bushy tree of central Europe, also called the mountain pine, the mugho pine, and the mugo
  pine; not a tall timber tree and not a low bush of North America.
examples:
- The dwarf mountain pine grows on rocky slopes in the Alps.
- Dwarf mountain pine needles grow in pairs.
