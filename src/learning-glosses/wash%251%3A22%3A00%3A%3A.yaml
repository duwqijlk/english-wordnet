simpleMeaning: the wearing away of soil or gravel by water, as from a road
scope: Water carrying off soil or gravel, not the dry bed of an old stream, the airflow driven back by
  a propeller, or a thin coat of paint.
examples:
- The wash of soil from the bare hillside turned the stream brown.
- Road crews blame the wash of gravel from the bank for the blocked drain.
