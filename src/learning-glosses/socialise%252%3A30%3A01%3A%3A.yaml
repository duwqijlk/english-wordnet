senseId: 'socialise%2:30:01::'
synsetId: 00406978-v
simpleMeaning: To get a person ready to live and mix with other people.
scope: Also called socialize, this is getting a person ready for life with others, not making them follow
  socialist ideas, and close in sense to the use for training a person for a social setting, not taking
  part in social life oneself.
examples:
- Children have to be socialised at school if they are to get on with others.
- Parents socialise their children by teaching them how to behave.
