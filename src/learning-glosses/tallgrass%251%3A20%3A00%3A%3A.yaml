simpleMeaning: any of several kinds of plant with thin leaves that grow high and do best where the ground
  is wet
scope: This is a kind of grass that grows high and does well where there is much water; tall-grass is
  another name for this sense. Not short grass and not grass that grows in dry ground.
examples:
- Tallgrass covered the wet fields.
- Cattle feed on tallgrass in the summer.
