simpleMeaning: going on all the time with no break and no clear end
scope: Also called constant, incessant, perpetual, ceaseless, and unremitting. It is about something that
  goes on with no break, not about something that just stays the same.
examples:
- The unceasing rain lasted for three days.
- The machine made an unceasing noise all night.
