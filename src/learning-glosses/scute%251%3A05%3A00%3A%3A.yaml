simpleMeaning: On an armadillo, a turtle, or the underside of a snake sit large flat pieces made of bone
  or horn.
scope: Such a large flat piece of bone or horn is found on an armadillo, a turtle, or the underside of
  a snake.
examples:
- The turtle's back was covered with scutes.
- A scute lay on the underside of the snake.
