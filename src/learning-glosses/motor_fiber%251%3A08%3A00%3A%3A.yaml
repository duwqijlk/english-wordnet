simpleMeaning: A nerve thread that carries signals to the muscles or glands
scope: 'Efferent fiber is another name for this sense: a nerve thread that carries signals to the muscles
  or glands, not a nerve thread that carries signals from the skin.'
examples:
- A motor fiber carries signals to the muscle.
- The motor fiber fired and the muscle moved.
