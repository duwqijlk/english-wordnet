simpleMeaning: A government that takes care of its people through schemes for health, housing, pensions
  and pay for people out of work and more.
scope: A government that takes care of its people; not a government that leaves people to fend for themselves
  and not a charity.
examples:
- The welfare state pays for health care and housing for its people.
- In a welfare state, people out of work get pay from the government.
