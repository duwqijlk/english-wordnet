simpleMeaning: A length of cord used by the person who carries out a hanging to put to death people who
  have been given death as a punishment.
scope: This is a cord used by the person who carries out a hanging to kill people given death as a punishment,
  not a rope for tying things; also called halter, hemp, hangman's halter, and hempen necktie.
examples:
- The hangman's rope was tied to the beam.
- He looked up at the hangman's rope.
