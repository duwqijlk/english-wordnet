simpleMeaning: to say a person or idea will not be thought about or chosen, or to put a person or team
  out of a contest
scope: 'Also called reject: this is about taking a person, team or idea out of a choice or contest, not
  the maths sense of taking a letter from equations and not taking something out of the body.'
examples:
- The judges eliminated him from the contest after the first round.
- We can eliminate that idea because it costs too much.
