simpleMeaning: a boat that carries people or vehicles across water and runs at set times again and again
scope: This is the boat itself that runs at set times across water, not the act of travelling on such
  a boat or of carrying things on it.
examples:
- The ferry leaves the island every hour in the morning.
- We took the ferry across the river with our car.
