simpleMeaning: Any of a group of sugars that break down fully, with water, into two one-part sugar pieces.
scope: A sugar that breaks down into two one-part sugars, not a sugar that stays whole and not a sugar
  that breaks into many pieces.
examples:
- Milk sugar is a disaccharide that splits into two parts.
- A disaccharide breaks into two one-part sugars.
