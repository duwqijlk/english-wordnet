simpleMeaning: A flap with two points in the heart, set between the upper and lower rooms on the left
  side.
scope: A flap with two points in the heart, also called left atrioventricular valve and mitral valve;
  not a flap on the right side and not a blood vessel.
examples:
- The bicuspid valve closed as the heart beat.
- Doctors checked the bicuspid valve for leaks.
