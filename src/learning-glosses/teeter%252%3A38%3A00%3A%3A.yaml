simpleMeaning: To move without keeping steady, swaying as you go
scope: To move without keeping steady, not a ride on a board that goes up and down; totter is another
  name for this sense.
examples:
- The old man teetered across the room, holding the wall for support.
- She teetered on her high heels, rocking from side to side.
