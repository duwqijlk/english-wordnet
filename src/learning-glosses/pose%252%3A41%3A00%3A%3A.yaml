simpleMeaning: To act in a stiff, false way, so that other people will think well of you
scope: This is acting in a false way to win praise, not holding still for a photo and not claiming to
  be someone else.
examples:
- He posed all evening, trying to impress the guests with his fine talk.
- She posed again and again to impress the visitors, and her talk sounded stiff and false.
