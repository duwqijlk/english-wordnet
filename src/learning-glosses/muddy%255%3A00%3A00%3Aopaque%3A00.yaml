simpleMeaning: Of a drink or other liquid, made cloudy by small bits that have sunk into it
scope: A drink that has gone cloudy, not mud on boots and not a dull color.
examples:
- The muddy coffee had bits at the bottom of the cup.
- After the storm, the river ran muddy and brown.
