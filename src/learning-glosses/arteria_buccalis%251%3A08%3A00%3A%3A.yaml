simpleMeaning: Blood reaches the cheek muscle and the cheek through a side tube off the blood tube of
  the jaw
scope: This side tube off the blood tube of the jaw is also called the buccal artery.
examples:
- The arteria buccalis carries blood from the blood tube of the jaw to the cheek.
- The arteria buccalis reaches the cheek muscle from the blood tube of the jaw.
