simpleMeaning: a thin, thread-like growth or outgrowth on the body of a living thing, such as a plant
  or an insect.
scope: This is not the strands that grow from a mammal's skin in a coat or on a head, but growths on other
  living things such as plants and insects.
examples:
- Fine hairs on the underside of the leaf hold a thin layer of air.
- The caterpillar's hairs can sting if you touch them.
