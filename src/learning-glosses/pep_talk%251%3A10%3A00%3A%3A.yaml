simpleMeaning: A rousing speech that tries to fill a team or a staff with strong feeling and firm purpose.
scope: A rousing speech that fills a team or staff with strong feeling and firm purpose, not a quiet talk
  with one person and not a speech that gives facts.
examples:
- The coach gave the team a pep talk before the game.
- Her pep talk lifted the whole staff.
