simpleMeaning: one of three basic shades of glow that can be mixed by adding them to make all other shades
scope: 'Also called primary colour for light: one of three basic shades of glow that can be mixed by adding
  them to make all other shades, not a basic shade used for paint.'
examples:
- The primary colors for light are red, blue, and green.
- Red is a primary color for light, so it can help make other shades when mixed with green and blue.
