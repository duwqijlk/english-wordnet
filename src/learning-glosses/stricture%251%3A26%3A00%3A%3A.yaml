senseId: 'stricture%1:26:00::'
synsetId: 14130856-n
simpleMeaning: a part of a tube or passage in the body that has become too narrow in a way that is not
  normal
scope: This is a narrow place in a passage inside the body, not a narrowing of a road or a pipe outside
  the body.
examples:
- The doctor found a stricture in the patient's bowel.
- A stricture can make it hard for food to pass through.
