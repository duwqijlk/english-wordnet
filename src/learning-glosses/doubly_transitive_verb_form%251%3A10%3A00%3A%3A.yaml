senseId: 'doubly_transitive_verb_form%1:10:00::'
synsetId: 06342470-n
simpleMeaning: 'two things follow this action word: first the thing acted on, then the person or thing
  that gets it'
scope: 'Also called a doubly transitive verb: an action word followed by two things, not one followed
  by only the thing acted on and not one followed by nothing.'
examples:
- The doubly transitive verb form of 'give' takes both a direct and an indirect object.
- In the sentence 'He told us a story', 'told' is a doubly transitive verb form.
