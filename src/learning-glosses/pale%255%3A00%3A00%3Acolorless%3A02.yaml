senseId: pale%5:00:00:colorless:02
synsetId: 00406956-s
simpleMeaning: unusually lacking in colour, the way a face looks when someone is ill or deeply upset
scope: This is a face drained of colour by illness or strong feeling, not dim light, not a colour made
  lighter with white, and not a dull, lifeless performance; wan and pallid are other names.
examples:
- Her face went pale when the doctor gave the diagnosis.
- He was pale and shaking after the accident.
