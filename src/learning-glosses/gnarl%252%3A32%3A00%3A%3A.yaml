simpleMeaning: to let out complaints or low sounds in a quiet voice, under your breath
scope: 'Also called mutter, murmur, grumble, and croak: to let out complaints or low sounds under your
  breath, not a twisted, tight swelling.'
examples:
- He would gnarl under his breath when the work piled up.
- The old man gnarled about the price of bread.
