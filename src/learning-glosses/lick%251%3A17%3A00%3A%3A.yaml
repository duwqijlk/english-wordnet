simpleMeaning: salt found in the ground or in rock, where animals come regularly to get it with their
  tongues
scope: This is salt in the ground that animals come for, not a hit with the fist in boxing and not the
  act of moving the tongue over something.
examples:
- Deer visit the salt lick in the woods every morning.
- A natural lick near the river draws many wild animals.
