simpleMeaning: the part of the outer layer of the brain that controls how the body moves
scope: 'Also called motor area, motor cortex and motor region: the part of the brain that controls movement,
  not a part that takes in what the senses report.'
examples:
- The excitable area of the brain sends the orders that start a movement.
- Damage to the excitable area left him unable to move his right hand.
