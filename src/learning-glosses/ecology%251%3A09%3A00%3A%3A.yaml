simpleMeaning: In biology, the study of how living things relate to each other and to their surroundings
scope: In biology, this is the study of how living things relate to each other and to their surroundings,
  not the study of the body and not the study of rocks.
examples:
- She studied ecology at university.
- The ecology of the lake changed when the fish died.
