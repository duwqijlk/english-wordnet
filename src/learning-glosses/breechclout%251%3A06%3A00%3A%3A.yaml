simpleMeaning: a piece of clothing that covers a person's lower body around the hips
scope: 'Also called loincloth and breechcloth: a simple piece of clothing that covers the lower body,
  not a full pair of trousers or a skirt.'
examples:
- He wore only a breechclout in the hot weather.
- The breechclout was made from a long piece of cloth.
