simpleMeaning: When something touches or stirs it, this part of the body answers through nerve ends in
  the skin, the inner parts, or the eye, ear, nose, or mouth.
scope: Also called sensory receptor and receptor, this part of the body answers through nerve ends in
  the skin, the inner parts, or the eye, ear, nose, or mouth when something touches or stirs it.
examples:
- Sense organs in the skin felt the touch.
- A sense organ in the nose caught the smell.
