senseId: 'blending%1:04:00::'
synsetId: 01005878-n
simpleMeaning: a slow change from one level to the next, with steps so small you can hardly tell them
  apart
scope: A slow change from one level to the next with steps too small to tell apart; not mixing things
  together and not a mixture of things.
examples:
- The blending from light to dark across the wall was so smooth you could not see where one shade ended.
- In the blending of grades, each step differs from the last by almost nothing.
