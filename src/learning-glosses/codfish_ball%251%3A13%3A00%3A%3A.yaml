simpleMeaning: A food, most often made from flaked salt cod mixed with mashed potato.
scope: This is a food most often made from flaked salt cod mixed with mashed potato; codfish cake is another
  name for it, not a dish of meat and not plain mashed potato.
examples:
- She fried a codfish ball until it was crisp outside.
- The codfish ball was soft inside with flaked fish and potato.
