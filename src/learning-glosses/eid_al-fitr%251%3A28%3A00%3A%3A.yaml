simpleMeaning: A day when Muslims feast together at the end of Ramadan, the month of fasting
scope: 'Also called Id al-Fitr: a Muslim day of feasting at the end of Ramadan, not the fast itself and
  not the feast at the start of Ramadan.'
examples:
- Families gather for Eid al-Fitr after the month of fasting ends.
- On Eid al-Fitr, children wear new clothes and visit their kin.
