simpleMeaning: Wide flowers shaped like a funnel, in blue, purple, pink or white, grow on a climbing herb
  that lives one year in warm lands all round the world.
scope: This is the wide-flowered kind that lives one year and grows in warm lands all round the world,
  not the kind from Central America with sky-blue flowers that people grow most often.
examples:
- The common morning glory climbed the fence.
- A common morning glory had pink flowers.
