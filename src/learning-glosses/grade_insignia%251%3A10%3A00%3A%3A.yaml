simpleMeaning: A V-shaped mark on the sleeve that shows a soldier's rank and time in service
scope: A V-shaped mark on the sleeve that shows a soldier's rank and time in service; also called stripe,
  stripes and chevron, not a medal and not a name tag.
examples:
- The soldier's grade insignia showed his rank on his sleeve.
- She sewed the grade insignia onto the uniform sleeve.
