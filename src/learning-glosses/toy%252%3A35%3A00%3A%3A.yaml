simpleMeaning: to move a thing about with your hands, or to turn something over in your mind and picture
  it
scope: 'Also called play: to move a thing about with the hands or to turn an idea over in the mind, not
  a copy that does not work, not a small pet dog, and not to treat a person or a thing with careless disregard.'
examples:
- She toyed with her wedding ring while she waited.
- He toyed with the idea of moving to a new city.
