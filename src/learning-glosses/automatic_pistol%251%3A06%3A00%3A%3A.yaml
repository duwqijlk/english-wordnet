simpleMeaning: a hand gun that keeps firing until its bullets are gone or the trigger is let go
scope: 'Also called an automatic: a hand gun that keeps firing until the bullets run out or the trigger
  is let go, not a hand gun that fires one shot at a time and not a long gun.'
examples:
- He fired the automatic pistol until the bullets were gone.
- The automatic pistol kept firing while she held the trigger down.
