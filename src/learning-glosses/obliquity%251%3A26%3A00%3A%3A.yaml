simpleMeaning: During the birth of a child, the head of the unborn child comes out at a wrong angle
scope: The head of the unborn child coming out at a wrong angle during birth, also called asynclitism;
  not a normal head-first birth and not a feet-first birth.
examples:
- The obliquity slowed the birth, and the doctor turned the baby.
- Obliquity was found when the head came at an angle.
