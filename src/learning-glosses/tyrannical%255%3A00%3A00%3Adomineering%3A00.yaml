simpleMeaning: using power in a way that is not fair, is very hard on people, and follows no clear rule
  but the person's own will
scope: 'Also called oppressive and tyrannous: using power in an unfair, hard way with no clear rule; not
  the sense about a ruler who simply has all the power.'
examples:
- His tyrannical boss made staff stay late for no reason and punished small mistakes hard.
- A tyrannical parent would not let her children speak or choose anything for themselves.
