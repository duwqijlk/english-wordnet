simpleMeaning: the body letting gas from the gut out on its own through the back opening where solid waste
  leaves
scope: This sense is the body's act itself, also called wind and fart, not the gas alone and not the sound
  or smell that can come with it.
examples:
- His farting after the big meal of beans made everyone laugh.
- She could not stop farting during the film, so she left the room.
