simpleMeaning: epilepsy in which a person loses awareness and forgets it; often the arms and legs move
  on purpose, and sometimes the person sees or hears things that are not there
scope: 'Also called temporal lobe epilepsy: a kind of epilepsy in which the person loses awareness and
  forgets the attack, not a fit that shakes the whole body.'
examples:
- During psychomotor epilepsy, he stared blankly and later could not recall what had happened.
- Her psychomotor epilepsy often made her arms move as if she were reaching for something.
