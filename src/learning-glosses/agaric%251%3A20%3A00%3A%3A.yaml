simpleMeaning: A mushroom from a large group of mushrooms that live on dead matter, with a cap like an
  umbrella and thin gills on the underside.
scope: This mushroom lives on dead matter rather than on living plants, with a cap like an umbrella and
  thin gills on the underside.
examples:
- We found an agaric with a cap like an umbrella and thin gills underneath.
- The agaric she picked had thin gills on the underside of its cap.
