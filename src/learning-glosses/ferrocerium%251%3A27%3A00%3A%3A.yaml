simpleMeaning: An alloy of iron and cerium that catches fire in air, used to make the sparking stones
  of lighters.
scope: An alloy of iron and cerium that catches fire in air, used to make the sparking stones of lighters;
  not ordinary steel and not a natural flint stone.
examples:
- A spark from the ferrocerium lit the cigarette lighter.
- Ferrocerium is used in the flints of many lighters.
