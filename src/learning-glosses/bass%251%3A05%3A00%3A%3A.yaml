simpleMeaning: A common name for any of many edible sea or fresh-water fish with fins that bear sharp
  spines
scope: A common name for many edible sea or fresh-water spiny-finned fish, not only the North American
  fresh-water kind with lean flesh and not the flesh of a salt-water fish or a low musical sound.
examples:
- They caught bass off the pier at dawn.
- Bass is a popular fish at the market.
