simpleMeaning: to give someone a person to work or take part with.
scope: This is not taking part as someone's partner yourself; it is arranging for someone to have a partner.
examples:
- The instructor partnered each new student with an experienced player.
- At the social, the organizers partnered shy guests with friendly hosts.
