simpleMeaning: A group of layered minerals that split easily into thin, clear sheets, and because electricity
  barely passes through them they serve as insulators in electrical equipment.
scope: A group of sheet-forming minerals also called mica; not the fish-derived glue that shares the name.
examples:
- Workers once used isinglass to insulate electrical parts.
- Lamplight glowed through the isinglass panel on the old stove.
