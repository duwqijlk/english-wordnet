simpleMeaning: In weather, the winds turn clockwise in the north and the other way round in the south
  as they blow out from the middle of a high-pressure area.
scope: In weather, this is a wind that blows out from a high-pressure centre, not a storm that turns in
  toward a low-pressure centre.
examples:
- The winds of the anticyclone blew out from the high-pressure centre.
- The anticyclone turned clockwise in the north and the other way round in the south.
