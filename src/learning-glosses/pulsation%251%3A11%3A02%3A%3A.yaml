simpleMeaning: The steady shrinking and swelling of the arteries as the heart beats.
scope: The steady shrinking and swelling of the arteries as the heart beats, also called beat, pulse,
  and heartbeat; not the repeated rise and fall of any amount, and not, in electronics, a sharp, short-lived
  wave in the normal electrical state or a series of such waves.
examples:
- The nurse felt the pulsation in the patient's wrist and counted the beats.
- A strong pulsation showed in the artery at the side of the neck.
