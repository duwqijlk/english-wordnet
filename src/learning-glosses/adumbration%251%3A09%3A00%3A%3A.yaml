senseId: 'adumbration%1:09:00::'
synsetId: 05784012-n
simpleMeaning: The act of giving a dim early sign of what is to come, shown before it happens.
scope: The act of giving a dim early sign of what is to come, also called foreshadowing; not a clear warning
  and not a full telling of what will happen.
examples:
- The adumbration of war hung over the talks.
- His speech was an adumbration of the plan to come.
