senseId: 'unequivocal%3:00:00::'
synsetId: 00899848-a
simpleMeaning: clear and sure, leaving no doubt and no room for a wrong reading; it has only one meaning
  and leads to only one end result
scope: 'Also called unambiguous: fully clear, with only one meaning, not partly clear or open to doubt.'
examples:
- She gave unequivocal support for the plan, with no conditions at all.
- The test gave unequivocal proof that the water was safe to drink.
