simpleMeaning: a set of one or more bars made to hold cloths used to dry the body
scope: A rack with bars for hanging cloths used to dry the body; towel horse is another name for this
  sense. Not a single hook and not a rack for coats.
examples:
- She hung the wet towel on the towel rack in the bathroom.
- The towel rack in the bathroom has three bars.
