simpleMeaning: a person who helps people stop fighting and stay calm with each other
scope: This is any person who helps others stop fighting and stay calm. It is not only a soldier sent
  to a troubled place to keep order.
examples:
- In their family, Grandma is the peacekeeper when the children argue.
- He acted as peacekeeper and helped the two friends talk calmly again.
