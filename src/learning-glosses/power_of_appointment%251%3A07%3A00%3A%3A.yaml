simpleMeaning: In law, the right given in a will or a deed by a giver to a receiver to choose who gets
  the giver's things
scope: In law, this is the right given in a will or a deed to choose who gets the giver's things, not
  the right to use the things oneself and not a gift made at once.
examples:
- The power of appointment let her choose who got the house.
- His will gave her a power of appointment over the farm.
