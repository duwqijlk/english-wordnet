simpleMeaning: the work and trade of a person who cuts up animals for meat to sell
scope: 'Also called butchery: this sense is the trade of cutting animals for meat to sell, not the cruel
  killing of many people.'
examples:
- He learned butchering from his father and opened his own meat shop.
- Their family has been in butchering for three generations, selling meat in the town market.
