simpleMeaning: a person who says little, holds back when with others, and gets little done
scope: Quiet and shy and not able to get things done, not a dull pale brown colour like a mouse.
examples:
- She was a mousy little girl who never spoke up.
- His mousy manner made him easy to overlook.
