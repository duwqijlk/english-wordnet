simpleMeaning: A tall cone-bearing tree with green needles and a dense cone-shaped crown; old trees grow
  tall and straight, with the lowest branches bending down.
scope: 'Also called silver spruce, Colorado spruce or Picea pungens: a tall spruce with blue-green needles
  and a dense cone-shaped crown, not a low bushy shrub and not a broad-leafed tree.'
examples:
- The Colorado blue spruce in the park had a dense cone-shaped crown.
- Old Colorado blue spruce trees grow tall and straight.
