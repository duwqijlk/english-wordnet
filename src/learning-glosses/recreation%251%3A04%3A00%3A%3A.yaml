simpleMeaning: something you do that takes your mind off other things, makes you happy, or holds your
  interest
scope: 'Also called diversion: this is something fun or interesting to do, not the sense about an activity
  that rests you and makes you feel well again.'
examples:
- For recreation, he wrote poems and did word puzzles.
- Scuba diving is offered as recreation for visitors to the island.
