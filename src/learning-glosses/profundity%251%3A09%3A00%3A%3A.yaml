simpleMeaning: Working through hard ideas until their full sense is clear.
scope: Also called depth, deepness, and astuteness, this is working through hard ideas until their full
  sense is clear, not the use for deep thought, knowledge that gets right inside ideas, keen insight,
  or the like, and not the use for deep wisdom that is hard to follow.
examples:
- Her profundity showed in the way she took apart every hard question.
- The book's profundity lay in how clearly it handled deep ideas.
