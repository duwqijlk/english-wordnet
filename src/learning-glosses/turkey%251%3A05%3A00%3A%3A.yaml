simpleMeaning: a large farm bird of the chicken kind with a wide, spreading tail, widely kept by people
  for food
scope: This is the live bird itself, not its cooked meat and not an event that fails badly.
examples:
- The turkey spread its wide tail in the farm yard.
- They keep turkeys on the farm and sell them for food.
