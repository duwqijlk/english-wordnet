simpleMeaning: A small tree of eastern North America that loses its leaves in winter, with creamy white
  flowers and large leaves that spread like umbrellas at the ends of its branches.
scope: This is a small tree of eastern North America with creamy white flowers and umbrella-like leaves;
  elk-wood, elkwood, umbrella magnolia and umbrella tree are other names for it.
examples:
- The Magnolia tripetala by the house has creamy white flowers.
- Magnolia tripetala loses its leaves in winter.
