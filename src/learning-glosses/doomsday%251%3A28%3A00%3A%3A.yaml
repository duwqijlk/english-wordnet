simpleMeaning: In the New Testament, the last day, after the last great battle, when God sets the fate
  of each person by the good and bad of their life on earth.
scope: The last day of judgement in the New Testament, also called doomsday, crack of doom, day of reckoning,
  end of the world, eschaton, Day of Judgement, Day of Judgment, Judgement Day, Judgment Day, Last Day,
  Last Judgement and Last Judgment; not a day in this life.
examples:
- On Doomsday, God will judge every soul.
- The preacher spoke of Doomsday as the end of time.
