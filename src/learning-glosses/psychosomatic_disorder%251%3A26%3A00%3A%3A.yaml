simpleMeaning: An illness of the mind that brings on signs in the body
scope: An illness of the mind that brings on signs in the body, not an illness that starts in the body
  and not a hurt to the body.
examples:
- Her psychosomatic disorder gave her a sore stomach when she was worried.
- A psychosomatic disorder can make the body ache though nothing is wrong with the body itself.
