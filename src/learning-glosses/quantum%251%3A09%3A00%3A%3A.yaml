simpleMeaning: In physics, the smallest bit of a quality of a thing in nature that a thing can have, by
  the theory of such bits
scope: In physics, the smallest bit of a thing in nature, not just any set amount of something.
examples:
- A quantum of light is the smallest amount of light energy.
- Physicists say energy comes in quanta, not in a smooth flow.
