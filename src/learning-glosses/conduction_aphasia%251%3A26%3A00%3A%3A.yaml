senseId: 'conduction_aphasia%1:26:00::'
synsetId: 14121560-n
simpleMeaning: A loss of speech where harm is thought to sit in paths joining the brain's speech hubs,
  so the sick find it hard to say back a line just heard.
scope: This sense is also called associative aphasia, a loss of speech where harm is thought to sit in
  paths joining the brain's speech hubs, so the sick find it hard to say back a line just heard.
examples:
- Conduction aphasia blocks saying back a line.
- The conduction aphasia sits in link paths.
