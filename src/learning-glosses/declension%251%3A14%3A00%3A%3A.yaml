synsetId: 08022953-n
simpleMeaning: a group of nouns, pronouns, or adjectives in Indo-European languages (a big family that
  includes Latin) that change their endings in the same or almost the same way
scope: This is a group of words that change their endings in the same way; it is not the act of changing
  endings itself and not a downward slope.
examples:
- In Latin, nouns in the first declension end in -a in many forms.
- She learned the third declension for her Latin class.
