simpleMeaning: Blood gets to the brain, the eyes, and the deep parts of the head through this tube, which
  comes off the big blood tube in the neck
scope: The blood tube that brings blood to the brain and eyes, not the tube that brings blood to the face
  and not the tube that carries blood back to the heart.
examples:
- The internal carotid artery supplies blood to the brain.
- A block in the internal carotid artery can cause a stroke.
