simpleMeaning: A kind of computer program that keeps a person's notes, dates, and contacts in order.
scope: This is a computer program that keeps a person's notes and dates in order, also called a personal
  information manager and a PIM tool, not a diary on paper or a calendar alone.
examples:
- She kept her dates in a PIM on her phone.
- His PIM held notes, dates, and contacts in one place.
