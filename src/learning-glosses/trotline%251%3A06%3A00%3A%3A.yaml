simpleMeaning: a long line for catching fish, with many short lines and hooks hanging from it, usually
  held between buoys (things that float and mark a place in water)
scope: 'Also called trawl, spiller, setline, and trawl line: this is a long fishing line with many hooked
  short lines, not a net and not a single line with one hook.'
examples:
- He set a trotline across the river before dark.
- They checked the trotline and found two fish on its hooks.
