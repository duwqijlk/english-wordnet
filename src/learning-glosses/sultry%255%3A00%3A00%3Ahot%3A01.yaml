simpleMeaning: very hot and wet in the air in a way that makes a person feel heavy and uncomfortable
scope: 'Also called stifling, sulfurous, and sulphurous: about weather that is very hot with wet air,
  not about a person or look that gives sexual interest.'
examples:
- It was a sultry summer day, hot and wet in the air.
- The sultry heat made us slow and tired all afternoon.
