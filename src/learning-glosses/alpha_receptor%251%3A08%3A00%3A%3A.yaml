simpleMeaning: A protein on nerve cells of the body's fight-or-flight system that certain substances act
  on, which may explain why those substances affect only some activities, such as narrowed blood vessels.
scope: This is the alpha receptor in the fight-or-flight system, also called alpha-adrenergic receptor
  or alpha-adrenoceptor, not a beta-type receptor.
examples:
- Alpha receptors make blood vessels narrow when the body is under stress.
- The medicine works by blocking alpha receptors on nerve cells.
