schema: oewn-learning-gloss-v2
senseId: 'irreversibly%4:02:00::'
synsetId: 00385261-r
simpleMeaning: in a way that cannot be changed back to how it was before
scope: This means a change that cannot be put back as it was, not a change for a short time and not a
  small change that is easy to fix.
examples:
- The old building was irreversibly damaged by the fire.
- Her health changed irreversibly after the illness.
