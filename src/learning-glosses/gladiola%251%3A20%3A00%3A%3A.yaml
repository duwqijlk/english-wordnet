simpleMeaning: A widely grown garden plant with sword-shaped leaves and tall one-sided spikes of bright
  trumpet-shaped flowers, native mainly to tropical and southern Africa.
scope: This is the garden flower also called gladiolus or sword lily, not the breastbone sense of gladiolus.
examples:
- She planted gladiolas along the back fence.
- A row of gladiola spikes stood against the wall.
