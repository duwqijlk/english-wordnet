simpleMeaning: Often kept as a pet and widely used in tests in labs, this tame animal has a thick body
  and almost no tail.
scope: This is the thick-bodied pet animal, not a person put through tests.
examples:
- The guinea pig sat in its cage and squeaked when the children came near.
- Our guinea pig is gentle and lets us hold it in our laps.
