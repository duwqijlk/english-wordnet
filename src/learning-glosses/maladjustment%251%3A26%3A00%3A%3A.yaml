simpleMeaning: The state of not being able to fit in well with your surroundings, which leaves your feelings
  unsteady and upset
scope: The state of not being able to fit in well with your surroundings, which leaves your feelings unsteady
  and upset; not a short bad mood and not a bodily illness.
examples:
- His maladjustment at the new school made him anxious and withdrawn.
- Maladjustment can follow a move to a strange place.
