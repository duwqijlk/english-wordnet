simpleMeaning: Something like glass or china that lets almost no heat or power pass through it.
scope: A material like glass or china that lets almost no heat or power pass through it, with insulator
  and dielectric as other names for this sense, not a metal wire that carries power well and not glass
  used for windows.
examples:
- Glass is a nonconductor that blocks heat and power.
- The nonconductor kept the wires from passing heat.
