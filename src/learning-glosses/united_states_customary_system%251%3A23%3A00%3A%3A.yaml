simpleMeaning: Weights and measures on the foot, pound, second, and pint, from colonial America, unlike
  the British Imperial measures in some ways; today in America it stands beside the SI measures.
scope: The weights and measures of the United States, based on the foot, pound, second, and pint; the
  British Imperial System is a different system, and the SI system is the other system used in America
  today.
examples:
- The United States Customary System measures length in feet and weight in pounds.
- Americans still use the United States Customary System beside the SI system.
