simpleMeaning: A sport in which players fire at clay discs thrown up into the air to copy the flight of
  a bird
scope: A sport of firing at clay discs thrown up to copy a bird in flight, also called skeet or trapshooting;
  not hunting live birds and not target practice at fixed marks.
examples:
- They spent the afternoon skeet shooting at the gun club.
- Skeet shooting taught her to lead a moving target.
