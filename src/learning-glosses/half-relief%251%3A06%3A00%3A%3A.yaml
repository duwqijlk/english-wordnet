simpleMeaning: a carving that stands out from a flat back by a middle amount, more than a low carving
  and less than a high one
scope: Also called mezzo-relievo and mezzo-rilievo, this is a carving that stands out by a middle amount,
  not a carving that stands out only a little and not one that stands out a lot.
examples:
- The half-relief on the wall shows figures that stand out by a middle amount.
- The artist chose half-relief for the panel, between low and high relief.
