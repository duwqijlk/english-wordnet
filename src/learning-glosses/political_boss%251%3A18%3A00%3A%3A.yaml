simpleMeaning: Who gets jobs in a party group, and how its members vote, is decided by this head
scope: 'Also called boss and party boss: the head of a party group who decides jobs and votes, not an
  elected leader and not the head of a firm.'
examples:
- The political boss decided who would stand for the council.
- No one in the party crossed the political boss.
