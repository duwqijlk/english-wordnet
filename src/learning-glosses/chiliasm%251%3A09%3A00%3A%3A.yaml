simpleMeaning: belief in the Christian teaching of the thousand-year rule named in the Book of Revelation
scope: Belief in the Christian teaching of the thousand-year rule named in the Book of Revelation; millenarianism,
  millenarism and millenniumism are other names for this sense, not a belief about the end of the world
  in general and not a church.
examples:
- Chiliasm was taught by some early Christians.
- He wrote a book about chiliasm and the thousand-year rule.
