simpleMeaning: a deal where you give a lender a claim on your property until you pay back the money you
  borrowed
scope: A loan deal where a lender holds a claim on your property until you pay it back, not a plain loan
  and not rent.
examples:
- They took out a mortgage to buy the house.
- The bank holds a mortgage on the farm until the loan is paid off.
