simpleMeaning: behavior that shows no respect for God or holy things, or an act that takes away the holy
  nature of something
scope: 'Also called desecration, sacrilege, and profanation: behavior or an act against holy things, not
  words that show no respect for God or holy things.'
examples:
- Burning the holy book on purpose was treated as blasphemy.
- He was punished for blasphemy after he damaged objects in the temple.
