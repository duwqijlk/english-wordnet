simpleMeaning: a copy that has small changes and is not exactly the same as the first one
scope: This sense is a thing, a copy with small changes; it is not the act of making something different,
  not a change from one state to another, and not the grammar sense where a word adds to the meaning of
  a phrase.
examples:
- This car is a modification of last year's model.
- The dress she wore was a small modification of the first design.
