schema: oewn-learning-gloss-v2
senseId: 'literalism%1:09:01::'
synsetId: 06209628-n
simpleMeaning: The plain, exact meaning of words is what this person takes from them
scope: A habit of reading words at their plain meaning, not the doctrine of realistic portrayal in art
  or literature.
examples:
- His literalism made him take the joke as a serious promise.
- The lawyer's literalism led her to read the contract word by word.
