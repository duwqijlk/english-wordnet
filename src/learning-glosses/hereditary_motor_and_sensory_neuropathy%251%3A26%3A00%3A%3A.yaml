senseId: 'hereditary_motor_and_sensory_neuropathy%1:26:00::'
synsetId: 14232069-n
simpleMeaning: 'Inherited nerve damage beginning in childhood or early adulthood: weak, wasting hand and
  lower-leg muscles, slow decline, normal lifespan; a gene on the X chromosome may be dominant or recessive.'
scope: A slowly progressive inherited nerve disorder affecting the hands and lower legs first; not a sudden
  paralysis, and not nerve damage caused by injury, diabetes or toxins.
examples:
- She was diagnosed with hereditary motor and sensory neuropathy after she began tripping and could no
  longer open jars.
- Hereditary motor and sensory neuropathy is passed down through families, so her siblings were offered
  genetic testing.
