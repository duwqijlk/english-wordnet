simpleMeaning: to have a particular look on your face or a particular quality in your manner that shows
  your feelings or character.
scope: This is not about having clothes on your body, and it is not about something becoming thin or damaged
  through use; it is only about the look or manner a person shows.
examples:
- She wore a puzzled frown all morning.
- He wore the calm smile of someone who had already won.
