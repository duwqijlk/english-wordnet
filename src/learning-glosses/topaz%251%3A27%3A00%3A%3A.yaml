simpleMeaning: a hard stone that is found in nature as crystals in many colors and is used as a gem; it
  is made of aluminum joined with fluorine and silicon
scope: This sense is the hard stone used as a gemstone, not the light brown color sense named after the
  stone.
examples:
- She wore a ring with a yellow topaz.
- The topaz in the shop window was clear and bright.
