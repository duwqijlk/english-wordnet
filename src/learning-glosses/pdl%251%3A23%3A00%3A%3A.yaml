simpleMeaning: Equal to 0.1382 newtons, it is the push that makes a one-pound weight gain one foot per
  second of speed each second.
scope: A poundal is another name for this unit of force, which speeds up a one-pound weight.
examples:
- The push measured one pdl.
- One pdl equals 0.1382 newtons.
