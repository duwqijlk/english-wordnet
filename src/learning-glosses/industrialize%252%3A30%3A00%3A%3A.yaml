senseId: 'industrialize%2:30:00::'
synsetId: 00501437-v
simpleMeaning: to build up making goods with factories in a place, or to change so that a place makes
  goods this way
scope: This is about a place building up factory work and changing to have it, not about setting up the
  making of one single thing as a new line of work.
examples:
- The country began to industrialize as new factories opened in its cities.
- South Korea industrialized quickly in the second half of the last century.
