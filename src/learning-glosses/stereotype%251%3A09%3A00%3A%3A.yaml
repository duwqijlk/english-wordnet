simpleMeaning: an idea about a kind of person or thing that people take as fixed and use again and again
  without fresh thought
scope: A fixed, ready-made idea about a kind of person or thing, not the act of judging someone by such
  an idea.
examples:
- The film relied on an old stereotype of the absent-minded professor.
- Regional stereotypes have been part of America since its founding.
