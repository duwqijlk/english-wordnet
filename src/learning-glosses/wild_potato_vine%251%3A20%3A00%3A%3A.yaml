simpleMeaning: lying flat or climbing, a soft-stemmed plant of tropical America lives for years and grows
  an enormous starchy root; some say the starchy root crop came from it
scope: Also called wild sweet potato vine, man-of-the-earth, manroot, and scammonyroot; a tropical American
  plant with an enormous starchy root, not the food plant grown for its starchy roots.
examples:
- The wild potato vine climbs over the fence in our garden.
- Wild potato vine has an enormous starchy root.
