simpleMeaning: small bits that give off harmful unseen rays and come down to the ground after a very powerful
  explosion that gets its power from atoms
scope: These are the small harmful bits that come down to the ground after such an explosion; this sense
  is not any bad and unwanted result that follows an event.
examples:
- Fallout from the test settled on fields many miles away.
- People were told to stay indoors to avoid the fallout after the explosion.
