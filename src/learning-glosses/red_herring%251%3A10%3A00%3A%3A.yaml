simpleMeaning: a first version of a paper that offers shares for sale, marked so readers know parts of
  it may change
scope: 'Also called a preliminary prospectus: an early version of a share offer paper, not a fish and
  not a false clue meant to mislead.'
examples:
- The company sent out a red herring before the final prospectus was ready.
- Investors knew the red herring might change before the shares went on sale.
