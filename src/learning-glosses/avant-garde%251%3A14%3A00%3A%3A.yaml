senseId: 'avant-garde%1:14:00::'
synsetId: 08482569-n
simpleMeaning: a group of people who make and use new ideas and new ways of working in a field, especially
  in the arts
scope: Also called van, vanguard, and new wave, it is a group that works on new ideas, not one artist
  alone and not a single new work.
examples:
- The avant-garde of the city put on a show with new kinds of music and light.
- Critics said the avant-garde had changed how plays were made.
