simpleMeaning: taking a vaccine (medicine put into the body to help stop sickness) to keep yourself from
  getting a sickness
scope: This is getting this medicine to stop a sickness before it starts, also called vaccination; it
  is not the sickness itself and not a cure after you are ill.
examples:
- The children had an inoculation before they travelled abroad.
- Inoculation against flu is offered each winter.
