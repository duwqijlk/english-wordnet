simpleMeaning: to be the person whose job is to gather the details of events and write them up for a newspaper,
  radio or television
scope: This sense is about covering events for the news media, not about telling someone something in
  ordinary conversation.
examples:
- She reports on local politics for the city paper.
- He was sent to report from the flood zone for the evening news.
