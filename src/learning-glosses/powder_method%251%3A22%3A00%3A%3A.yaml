simpleMeaning: A test that names a mineral or crystal by coating a thin rod with the crushed sample, firing
  X-rays at it and reading the rings that scatter back.
scope: This is the X-ray identification test for minerals and crystals, not the photographic powder techniques
  and not a microscope study of thin slices.
examples:
- They used the powder method to identify the unknown crystal.
- The powder method produced a clear ring pattern within an hour.
