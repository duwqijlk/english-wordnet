simpleMeaning: a worker at a bar who mixes and serves drinks with alcohol in them
scope: A worker who mixes and serves drinks with alcohol at a bar, also called bartender, barkeeper and
  mixologist; this is the person, not the bar itself or the drinks.
examples:
- The barkeep mixed her a drink and set it on the bar.
- Ask the barkeep for a glass of wine.
