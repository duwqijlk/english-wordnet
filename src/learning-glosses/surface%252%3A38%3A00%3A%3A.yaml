simpleMeaning: to rise up to the top or outer level of something.
scope: This is not applying a coating to an object, and not becoming known after being hidden; it means
  physically rising to the top.
examples:
- The submarine surfaced after three weeks at sea.
- The fish surfaced to catch insects on the water.
