simpleMeaning: easy to see, hear, smell, taste or feel
scope: This means a thing is easy to see, hear, smell, taste or feel, not that a person is aware of something
  in the mind, and not that a choice shows good judgment.
examples:
- A sensible odor of garlic filled the kitchen.
- He wrote about the sensible world that we can see and touch.
