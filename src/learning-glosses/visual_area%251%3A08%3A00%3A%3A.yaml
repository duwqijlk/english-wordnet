simpleMeaning: the part of the brain's outer layer that gets signals from the lateral geniculate body,
  a part of the thalamus
scope: 'Another name for the visual cortex: the part of the brain''s outer layer that handles sight signals,
  not the part that moves the body and not the part that hears sounds.'
examples:
- Damage to the visual area left him unable to make sense of what he saw.
- Signals from the eyes reach the visual area through the thalamus.
