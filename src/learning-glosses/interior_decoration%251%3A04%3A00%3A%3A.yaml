simpleMeaning: A person in this trade matches colours, paint, cloth, floor coverings, and the like, above
  all, to make the inside of a room or building look good.
scope: This trade is also called interior decorating, and it is not the layout and furnishings of a room,
  which is another sense of the same words.
examples:
- Interior decoration was her trade.
- He hired her for the interior decoration of the new hotel.
