simpleMeaning: A curved strip with an outward bulge whose cut-across shape is a quarter of a circle or
  an ellipse.
scope: Also called thumb and quarter round, this curved strip shows a quarter of a circle or a long round
  shape when cut across, not a flat strip and not a round bead.
examples:
- The carpenter added an ovolo along the edge of the shelf.
- An ovolo runs around the top of the wooden frame.
