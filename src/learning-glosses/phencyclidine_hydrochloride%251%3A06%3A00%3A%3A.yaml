simpleMeaning: a drug vets use to stop animals feeling pain during treatment, taken against the law, at
  first as a powder, for its power to change what people see and hear
scope: A drug vets use to stop animals feeling pain during treatment, also taken against the law for its
  mind-changing effects; angel dust and phencyclidine are other names for this sense, not a drug that
  stops people feeling pain during treatment and not a drug that calms pain.
examples:
- The vet used phencyclidine hydrochloride so the dog would feel no pain during the operation.
- He was caught with phencyclidine hydrochloride, taken in secret for its mind-changing effects.
