simpleMeaning: Soft and juicy, good to eat and about the size of an orange, is what grows on a tree of
  the West Indies and the north of South America.
scope: This is the tree, also called jagua and marmalade box, not the fruit it bears.
examples:
- The genipap fruit bore soft fruit.
- Genipap fruit grows in the West Indies.
