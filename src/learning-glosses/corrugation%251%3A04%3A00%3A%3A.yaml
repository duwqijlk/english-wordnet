simpleMeaning: the act of shaping a thing into lines that go side by side, with raised parts and low parts
scope: The act of shaping a thing into side-by-side raised lines and low parts; not the ridged material
  itself and not a single ridge.
examples:
- The corrugation of the metal sheet made it much stronger.
- They watched the corrugation of the paper as it passed through the machine.
