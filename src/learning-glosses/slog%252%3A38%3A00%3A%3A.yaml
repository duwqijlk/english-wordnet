simpleMeaning: to walk with heavy, firm steps, as when tired, or through mud
scope: 'Also called pad, trudge, tramp and plod: to walk with heavy steps when tired or in mud, not to
  hit someone or something hard.'
examples:
- We slogged through the mud back to the house.
- The tired walkers slogged up the hill for hours.
