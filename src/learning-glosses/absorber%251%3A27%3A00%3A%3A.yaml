simpleMeaning: In physics, a material in a nuclear reactor that takes in radiation, which is harmful energy
  sent out as rays
scope: This sense is the material inside a nuclear reactor that takes in harmful rays; it is not a soft
  part that stops bumps in a car and not a cloth that soaks up water.
examples:
- The absorber inside the reactor takes in harmful rays.
- Workers checked the absorber to make sure the reactor was safe.
