simpleMeaning: In psychiatry, a way the mind guards itself by cutting off the feeling that went with the
  memory of a bad act or urge.
scope: In psychiatry, a way the mind guards itself by cutting off the feeling that went with the memory
  of a bad act or urge, not the act of setting a thing apart from others.
examples:
- Isolation let him recall the act without feeling the shame that went with it.
- The doctor said isolation was keeping the memory apart from its feeling.
