simpleMeaning: A warm, open way with guests, liking to welcome them and look after them when they visit
scope: A warm, open way with guests, liking to welcome them and look after them when they visit; not mere
  politeness to strangers, and not a love of parties for oneself.
examples:
- Her hospitableness showed in the way she welcomed every guest.
- The hospitableness of the inn made travellers feel at home.
