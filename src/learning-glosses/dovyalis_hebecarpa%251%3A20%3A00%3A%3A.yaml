simpleMeaning: A small thorny bushy tree grown for its dark red-purple fruit, whose sweet purple flesh
  tastes like gooseberries; it grows in Sri Lanka and India.
scope: A small spiny tree grown for its dark fruit, also called ketembilla, the ketembilla tree, kitambilla,
  kitembilla, and Ceylon gooseberry; not a gooseberry bush itself.
examples:
- A Dovyalis hebecarpa grows beside the house in Colombo.
- They picked the dark fruit of the Dovyalis hebecarpa for jam.
