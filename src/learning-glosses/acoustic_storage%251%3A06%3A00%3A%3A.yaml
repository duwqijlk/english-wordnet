simpleMeaning: a device that holds sounds in lines that slow the sound down
scope: This is a device that holds sounds by slowing them down, not a box that keeps files and not a tape
  that plays music back.
examples:
- The early machine kept its working numbers in acoustic storage.
- Engineers built the acoustic storage from tubes that slowed the sound down.
