simpleMeaning: usually found in one place only, a group of sicknesses spread by a virus brings fever and
  stomach and gut troubles first, then small blood vessels bleed
scope: 'Also called viral hemorrhagic fever, haemorrhagic fever, and hemorrhagic fever: a group of sicknesses
  spread by a virus, usually found in one place only; not a single sickness.'
examples:
- Viral haemorrhagic fever is usually found in one part of the world.
- The fever and stomach troubles of viral haemorrhagic fever were followed by bleeding.
