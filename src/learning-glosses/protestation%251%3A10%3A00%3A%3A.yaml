simpleMeaning: a strong statement that says you are against something
scope: A strong statement against something, not the other sense of this word, which is a formal, serious
  statement that you do not agree with something.
examples:
- She made a loud protestation against the new tax.
- His protestation showed how strongly he was against the plan.
