simpleMeaning: A medicine used to treat allergies, over-strong reactions, and colds, by blocking the work
  of histamine, a substance in the body that brings on allergy signs, where it acts.
scope: For treating allergies, over-strong reactions, and colds, by blocking histamine where it acts.
examples:
- She took an antihistamine for her hay fever.
- The antihistamine stopped his sneezing within an hour.
