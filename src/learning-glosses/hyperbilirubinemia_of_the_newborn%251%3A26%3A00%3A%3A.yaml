senseId: 'hyperbilirubinemia_of_the_newborn%1:26:00::'
synsetId: 14342520-n
simpleMeaning: A common sickness in babies, usually caused by a liver that is not yet fully grown, that
  usually goes away on its own.
scope: A common sickness in babies, usually caused by a liver that is not yet fully grown, not jaundice
  in adults and not lasting liver disease; neonatal hyperbilirubinemia is another name for this sense.
examples:
- Hyperbilirubinemia of the newborn cleared up within a week.
- The newborn's yellow skin came from hyperbilirubinemia of the newborn.
