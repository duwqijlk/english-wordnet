simpleMeaning: with no way to show that it is right and no way to explain why it is right
scope: 'Also called indefensible, insupportable, and unjustifiable: so wrong that no good reason can make
  it right, not just done without permission or a good reason.'
examples:
- His cruel attack on the kind old man was unwarranted.
- Such rude words to a guest were completely unwarranted.
