simpleMeaning: A way of hurting a person by beating the soles of the feet with whips or sticks.
scope: A way of hurting a person by beating the soles of the feet with whips or sticks, also called bastinado;
  not a beating on the back and not a prison cell.
examples:
- The prisoners feared the falanga more than any other punishment.
- Falanga means beating the soles of the feet.
