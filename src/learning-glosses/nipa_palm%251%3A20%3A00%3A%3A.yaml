simpleMeaning: A creeping feather palm found in mangrove swamps and tidal river mouths; its sap makes
  a liquor, its leaves are used for thatch, and its fruit has edible seeds.
scope: The swamp-dwelling plant itself, not the liquor made from its sap or the thatch cut from its leaves,
  and not a tall upright palm of dry ground.
examples:
- The nipa palm spreads through the mud of tidal creeks behind the mangrove forest.
- Villagers thatch their roofs with leaves from the nipa palm and turn its sap into a strong drink.
