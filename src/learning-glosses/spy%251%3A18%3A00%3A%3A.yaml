simpleMeaning: a person hired to work in secret by a country to get facts about its enemies, or by a business
  to get secret facts about how rival businesses make things
scope: A hired person who gets secret facts for a country or a business; not a person who only secretly
  watches others, and not the act of getting facts in secret.
examples:
- The spy was hired by the country to learn the enemy's plans.
- The company found a spy who had been taking its secret plans for a rival business.
