simpleMeaning: Some lists count this small California tree, sometimes more like a shrub, with the pygmy
  kind and the Santa Cruz kind; it is often grown to look nice.
scope: A small California tree often grown to look nice, not a tall forest tree cut for wood.
examples:
- The gowen cypress by the house stayed small and neat.
- A gowen cypress grew in the garden as an ornamental tree.
