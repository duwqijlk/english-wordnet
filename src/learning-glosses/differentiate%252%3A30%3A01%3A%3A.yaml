simpleMeaning: to change while growing, so that a thing takes on a new form
scope: To change while growing, taking on a new form, not to show how things are unlike each other and
  not to work out a sum in maths.
examples:
- The cells differentiate as the embryo grows.
- In the early weeks, the young cells differentiate into many kinds of tissue.
