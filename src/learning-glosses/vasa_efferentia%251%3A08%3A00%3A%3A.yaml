simpleMeaning: From the net of tubes in the testis, several tightly coiled tubes run to the tube that
  carries seed out, making the head of the coiled tube beside the testis.
scope: These are the tubes that lead from the net of tubes in the testis to the tube that carries seed
  out, forming the head of the coiled tube beside the testis.
examples:
- The vasa efferentia carry seed from the testis toward the vas deferens.
- Several vasa efferentia form the head of the epididymis.
