simpleMeaning: In word meaning, the link in which one word names a wider group that holds a narrower word,
  such as animal for dog
scope: This is the word-meaning link of a wider group holding a narrower word, also called hypernymy,
  not the link of a narrower word inside a wider one and not a rank in an army or a job.
examples:
- In superordination, animal stands above dog.
- Superordination links fruit to apple and pear.
