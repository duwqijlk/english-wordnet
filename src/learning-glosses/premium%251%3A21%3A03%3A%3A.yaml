simpleMeaning: Money paid as a charge when one kind of money is changed into another
scope: This is a charge for changing one kind of money into another, not a prize given to buyers and not
  an extra amount paid for something scarce.
examples:
- The bank charged a premium for changing dollars into euros.
- There is a small premium when you exchange money at the airport.
