simpleMeaning: A person who signs a written promise to pay, for no pay and no gain, only to help the borrower.
scope: This is a person who signs a written promise to pay for no pay and no gain to help the borrower,
  not a person paid to stand behind a loan and not the borrower.
examples:
- He signed as accommodation endorser to help his friend borrow.
- An accommodation endorser takes on the debt for no reward.
