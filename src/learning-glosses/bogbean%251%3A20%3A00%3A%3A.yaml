simpleMeaning: A perennial plant of Europe and America with intensely bitter three-part leaves and clusters
  of white or purplish flowers; it often roots at the water's edge and spreads over water.
scope: 'Another name for bog myrtle and buckbean: a water-side plant with three-part leaves, not a clover.'
examples:
- Bogbean sends up clusters of white or purplish flowers.
- Bogbean often roots at the water's edge.
