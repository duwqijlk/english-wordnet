simpleMeaning: to act in a wild and violent way, as if very angry
scope: Also called storm and rage. This means to act in a wild way as if very angry, not a plant and not
  steps used to get on or off a plane.
examples:
- The angry crowd ramped through the streets, breaking windows as they went.
- He ramped about the room, shouting and throwing things to the floor.
