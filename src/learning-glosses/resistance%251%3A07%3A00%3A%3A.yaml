schema: oewn-learning-gloss-v2
senseId: 'resistance%1:07:00::'
synsetId: 05221162-n
simpleMeaning: how little a tiny living thing that causes disease is stopped by antibiotics (drugs made
  to kill or stop such living things) or other drugs
scope: This is about a germ not being hurt by a drug; it is not a person's body fighting disease, not
  a force that slows movement, and not fighting against an enemy or an idea.
examples:
- The bacteria showed strong resistance to penicillin, so the drug stopped working.
- Doctors tested the germ's resistance to several antibiotics before choosing a treatment.
