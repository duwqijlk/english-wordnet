simpleMeaning: The fatty coat round some nerve threads is lost, and the illness of the nerves lasts and
  slowly gets worse.
scope: Also called disseminated multiple sclerosis and disseminated sclerosis, it is a lasting illness
  of the nerves that slowly gets worse.
examples:
- The illness slowly got worse, and the doctor called it multiple sclerosis.
- Multiple sclerosis is a lasting illness of the nerves.
