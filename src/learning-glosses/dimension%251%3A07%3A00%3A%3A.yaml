simpleMeaning: how big a thing is in one direction, above all its length, width, or height
scope: How big a thing is in one direction, above all length, width, or height; not an idea by which things
  are told apart, not one of the three numbers that fix a place in space, and not the verbs that mark
  sizes on a thing or shape a thing to set sizes.
examples:
- Measure the dimensions of the box.
- The room's dimensions are ten feet by twelve.
