simpleMeaning: Bad people who work together from one place, such as law-breakers, secret agents, and people
  who attack others to spread fear
scope: A group of bad people gathered in one place, not a bird's home and not a warm quiet hiding place;
  not the act of settling down in a soft place.
examples:
- The police found a nest of thieves hiding in the old house.
- A nest of spies met in secret in the small town.
