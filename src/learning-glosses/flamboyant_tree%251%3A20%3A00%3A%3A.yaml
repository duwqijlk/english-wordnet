simpleMeaning: Sometimes put in the group Poinciana, this shrub or small tree of warm lands bears showy
  flowers, yellow to orange-red.
scope: Also called a paradise flower or the pride of barbados, this shrub or small tree of warm lands
  is sometimes put in the group Poinciana and bears showy yellow to orange-red flowers.
examples:
- The flamboyant tree in the garden was covered in orange-red flowers.
- They planted a flamboyant tree beside the house for its showy flowers.
