simpleMeaning: A part of the blood that helps it clot, whose lack is linked to hemophilia A
scope: Also called antihaemophilic factor, antihaemophilic globulin, antihemophilic factor, antihemophilic
  globulin, or factor VIII; a part of the blood that helps it clot, whose lack is linked to hemophilia
  A.
examples:
- Hemofil helps the blood to clot.
- Without Hemofil, the blood of a person with hemophilia A does not clot well.
