simpleMeaning: In geology, a crack in the earth's crust where the top side seems to have been pushed up
  as the rock was squeezed together
scope: 'Also called an overthrust fault and a thrust fault: a crack in rock where the top side was pushed
  up by squeezing, not a crack where the sides slid past each other and not a crack with no movement.'
examples:
- A reverse fault pushed the older rock up over the younger layers.
- The survey found a reverse fault where the top rock had been pushed up over the lower rock.
