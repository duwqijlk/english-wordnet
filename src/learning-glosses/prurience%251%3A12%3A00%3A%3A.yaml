simpleMeaning: A strong, unhealthy wish for sex, and a habit of liking dirty, sexy things
scope: 'Also called carnality, lasciviousness, lubricity and pruriency: an unhealthy wish for sex, not
  a healthy wish for sex and not simple curiosity about the body.'
examples:
- His prurience showed in the way he stared at every woman who passed.
- The book was banned for its prurience, not for its story.
