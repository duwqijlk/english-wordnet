simpleMeaning: A blood tube in the chest, part of the long blood tube that runs down from the heart, that
  splits into the two tubes going to the legs
scope: This is a blood tube in the chest that splits into the two tubes going to the legs; not the whole
  blood tube from the heart and not an artery in the belly.
examples:
- The thoracic aorta runs down the chest and splits into two tubes.
- Surgeons repaired a tear in the thoracic aorta.
