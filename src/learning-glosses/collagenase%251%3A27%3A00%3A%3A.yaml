simpleMeaning: Any enzyme that speeds the breaking down of collagen and gelatin with water.
scope: This is any enzyme that speeds the breaking down of collagen and gelatin with water; not an enzyme
  that builds collagen and not one that breaks down other stuff.
examples:
- The collagenase broke down the collagen in the sample.
- Collagenase softens gelatin by breaking it down with water.
