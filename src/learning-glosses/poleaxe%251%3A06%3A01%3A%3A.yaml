simpleMeaning: an ax used to kill cattle, with a hammer on the side away from the sharp blade
scope: 'Also called poleax: an ax for killing cattle, not the long battle ax used in the Middle Ages and
  not the act of knocking something down.'
examples:
- The worker used a poleaxe to kill the cow for meat.
- The poleaxe has a hammer on the back of its blade.
