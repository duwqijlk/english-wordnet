simpleMeaning: having or showing a very strong feeling of love or loyalty
scope: This is strong love or loyalty, not just liking someone a little, and not time or work set aside
  for a special use.
examples:
- He is a devoted husband who stands by his wife in hard times.
- She has devoted friends who give her help and support.
