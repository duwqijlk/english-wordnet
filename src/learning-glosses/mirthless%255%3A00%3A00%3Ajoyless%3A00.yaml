senseId: mirthless%5:00:00:joyless:00
synsetId: 01371573-s
simpleMeaning: having no joy or happy laughter
scope: This describes a person, or a look, smile or voice, when there is no joy or laughter. It is not
  joyful or cheerful, and it is not joy itself.
examples:
- He gave a mirthless smile and left the room at once.
- Her mirthless voice made even the joke sound sad.
