simpleMeaning: Short needles and cones shaped like eggs mark a tall fir of northwestern North America
scope: Also called douglas hemlock, douglas pine, and douglas spruce, this is a tall fir of northwestern
  North America with short needles and egg-shaped cones, not a fir with long needles.
examples:
- The green douglas fir towered over the other trees.
- A green douglas fir has short needles and egg-shaped cones.
