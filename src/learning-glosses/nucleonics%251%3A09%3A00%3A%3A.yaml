simpleMeaning: Physics has a branch that looks inside the tiny centres of matter to see how they are built
scope: The study of how the tiny centres of matter are built inside, also called atomic physics and nuclear
  physics, and not the study of whole atoms or of how matter moves.
examples:
- She took a course in nucleonics at university.
- Nucleonics helps scientists learn how the centres of atoms are built.
