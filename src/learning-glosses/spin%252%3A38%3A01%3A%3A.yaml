simpleMeaning: to turn round and round fast, again and again, on one fixed line through the middle
scope: Also called whirl, this is turning round and round fast on one fixed line through the middle, not
  sending out jets of water and not a fast turn of a thrown thing.
examples:
- The dancers spin round and round without getting dizzy.
- The top will spin on the table until it falls over.
