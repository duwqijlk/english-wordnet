senseId: 'adenomatous_polyp%1:26:00::'
synsetId: 14258093-n
simpleMeaning: A growth that sticks out from a lining, made of new tissue from the lining of a gland,
  and not cancer.
scope: This is a growth made of new tissue from the lining of a gland; it is not cancer, and not a growth
  that spreads through the body.
examples:
- The doctors found an adenomatous polyp on the lining of the colon.
- An adenomatous polyp grew on the lining of the rectum.
