schema: oewn-learning-gloss-v2
senseId: 'counterargument%1:10:00::'
synsetId: 06661853-n
simpleMeaning: a reason or set of reasons given to oppose reasons that someone else has already given
scope: This is a reason or set of reasons given to oppose reasons someone else has given; it is not a
  reason that supports those reasons and not simple agreement with them.
examples:
- His counterargument was that the plan would cost far too much money.
- She made a strong counterargument against the new rule.
