simpleMeaning: the tip of the large wing-like part of a bone at the side of the skull
scope: The tip of a wing-shaped part of a bone in the skull, not the whole bone and not a part of the
  jaw.
examples:
- The surgeon located the crotaphion before making the cut.
- Anatomy students learn to find the crotaphion on a skull.
