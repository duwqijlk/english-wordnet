simpleMeaning: with not a drop of wetness in it, as parched as a thing left out in the weather for a long
  time
scope: 'Also called bone dry: with no wetness at all, not just a little damp and not wet on the outside
  only.'
examples:
- The bone-dry leaves crackled under our feet.
- After a week in the sun, the soil was bone-dry.
