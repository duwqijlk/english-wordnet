simpleMeaning: A swell of sea water that follows the regular pull of the moon and sun on the tides
scope: This is a swell of sea water that follows the regular pull of the moon and sun on the tides; not
  an ordinary swell and not a storm surge.
examples:
- A tidal wave rolled in with the pull of the moon and sun.
- Fishermen watched the tidal wave rise and fall with the tides.
