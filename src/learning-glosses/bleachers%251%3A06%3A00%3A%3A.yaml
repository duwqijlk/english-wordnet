simpleMeaning: rows of uncovered seats outside, with no roof over them, where the people who sit there
  are out in the sun
scope: Open-air rows of seats at a sports ground, with no roof; not a covered stand and not seats inside
  a hall.
examples:
- We sat in the bleachers to watch the game.
- The bleachers were full of fans in the sun.
