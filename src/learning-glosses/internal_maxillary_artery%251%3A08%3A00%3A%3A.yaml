simpleMeaning: The deep parts of the face get their blood from this tube, and so do some of the thin covers
  around the brain
scope: The blood tube that feeds the deep parts of the face and some of the covers around the brain; not
  the tube that feeds the brain and eyes and not the tube that feeds the skin of the face.
examples:
- The internal maxillary artery supplies blood to the deep structures of the face.
- Bleeding from the internal maxillary artery can be hard to stop.
