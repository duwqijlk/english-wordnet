simpleMeaning: A thick tropical swamp fern, above all of tropical America, with big leaves whose undersides
  are covered in golden yellow spore cases.
scope: A thick tropical swamp fern with golden yellow spore cases under its leaves, also called golden
  fern and leather fern; its nearest kin are other ferns of tropical swamps.
examples:
- Acrostichum aureum grew thick in the swamp with golden yellow spore cases under its leaves.
- We found Acrostichum aureum in the wet ground near the river mouth.
