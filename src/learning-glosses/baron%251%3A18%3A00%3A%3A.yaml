simpleMeaning: in Britain, a person with a title of high birth, of the lowest rank
scope: A British title of high birth of the lowest rank, not the wider sense of a titled man of high birth
  in other countries, whose rank can differ.
examples:
- He was made a baron for his long service to the king.
- The baron lived in a small castle in the north of England.
