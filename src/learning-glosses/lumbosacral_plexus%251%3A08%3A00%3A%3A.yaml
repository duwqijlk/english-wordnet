simpleMeaning: A nerve network formed by front branches of the lumbar, sacral and coccygeal nerves, serving
  the lower limbs, the area between the genitals and the anus, and the tailbone area.
scope: The combined network of the lower back and pelvis that supplies the legs and pelvic floor, not
  the lumbar plexus or the sacral plexus taken alone.
examples:
- The lumbosacral plexus supplies the lower limbs, the area between the genitals and the anus, and the
  tailbone area.
- The lumbosacral plexus is formed where branches of the lumbar, sacral and coccygeal nerves join.
