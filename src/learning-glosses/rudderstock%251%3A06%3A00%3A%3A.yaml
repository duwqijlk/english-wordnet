simpleMeaning: a straight upright bar at the front edge of the blade that steers a boat, which lets the
  blade swing from side to side
scope: 'Also called a rudderpost: a straight upright bar that lets a boat''s steering blade turn, not
  the blade itself and not the bar used to move it.'
examples:
- The rudderstock held the rudder firm as the boat turned.
- A crack in the rudderstock meant the steering blade could not turn freely.
