simpleMeaning: An animal that lives in water and feeds its young on milk, such as a whale, a dolphin,
  a manatee, a dugong, a walrus, or a seal.
scope: This name covers whales, dolphins, manatees, dugongs, walruses, and seals, the animals that live
  in water and feed their young on milk.
examples:
- The aquatic mammal surfaced to breathe.
- Seals and whales are aquatic mammals that feed their young on milk.
