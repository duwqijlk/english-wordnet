simpleMeaning: to push someone to go on, especially by cheering and shouting for them
scope: 'Also called cheer and inspire: pushing people on with cheers and shouts, not a strong wish to
  do something and not telling someone strongly that they should do something.'
examples:
- The crowd urged the runners on with loud cheers and shouts.
- Fans urged their team forward, shouting from the stands.
