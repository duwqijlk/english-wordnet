simpleMeaning: A gauge that shows the level of water in a tank, boiler or reservoir
scope: Also called water gage and water gauge, this tool lets you see how high liquid stands in a tank,
  a boiler, or a reservoir, not the sticky glass used to keep eggs.
examples:
- We looked at the water glass before opening the boiler.
- The water glass told us the tank was nearly empty.
