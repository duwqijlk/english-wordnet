simpleMeaning: A brick laid on its side along the top of a wall.
scope: This is a brick laid on its side at the top of a wall; cope is another name for this sense, not
  an ordinary brick in a wall or the act of dealing with trouble.
examples:
- The coping on the garden wall had come loose after the frost.
- He laid the coping bricks along the top of the new wall.
