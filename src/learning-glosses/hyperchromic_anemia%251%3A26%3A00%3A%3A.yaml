simpleMeaning: A blood condition in which each red blood cell holds more of the red pigment that carries
  oxygen than usual.
scope: A blood condition in which each red cell holds more red pigment than usual; hyperchromic anaemia
  is another name for it, not the kind where red cells are too few.
examples:
- The doctor said her hyperchromic anemia came from too much red pigment in each cell.
- His hyperchromic anemia showed up in a blood test.
