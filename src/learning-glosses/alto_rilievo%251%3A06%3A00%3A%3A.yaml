simpleMeaning: shapes cut on a flat surface that stick out by at least half of how deep they are
scope: Shapes that stick out by at least half their depth from a flat back; alto relievo and high relief
  are other names for this sense, not a shallow carving and not a statue that stands on its own.
examples:
- The alto rilievo panel showed horses that seemed to leap from the wall.
- In the museum we looked at an alto rilievo of dancing figures.
