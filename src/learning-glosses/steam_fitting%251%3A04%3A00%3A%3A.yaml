simpleMeaning: the work of putting in and looking after machines that move air, heat rooms or cool things
scope: The work of putting in and caring for machines that move air, heat or cool a place, not the pipes
  themselves and not a plumber's work on water pipes.
examples:
- He learned steam fitting at the trade school.
- The firm does steam fitting for schools and offices.
