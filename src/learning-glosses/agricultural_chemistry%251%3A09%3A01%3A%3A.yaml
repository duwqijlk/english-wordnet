simpleMeaning: the study of the chemistry and living chemistry that matter for farming, for turning raw
  farm goods into food and drink, and for watching and cleaning nature
scope: The study of chemistry for farming and food making; not farming itself, and not chemistry in general.
examples:
- She studies agricultural chemistry to help farmers grow more food.
- Agricultural chemistry looks at how soil feeds the crops we eat.
