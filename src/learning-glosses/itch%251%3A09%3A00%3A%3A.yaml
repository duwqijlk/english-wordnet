simpleMeaning: an annoying feeling on the skin that makes a person want to scratch
scope: 'Also called itching: this is the annoying feeling on the skin that makes you want to scratch,
  not the skin sickness itself and not the act of scratching.'
examples:
- The mosquito bite gave me a strong itch.
- He felt an itch on his arm and tried not to scratch it.
