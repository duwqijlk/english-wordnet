simpleMeaning: Said of a place with few people round it and few roads that many people use, far from towns
  and busy roads
scope: Said of a place far from towns and busy roads, also called out-of-the-way and off the beaten track;
  not a place in the middle of a town and not a place on a main road.
examples:
- They found a quiet resort well out of the way.
- The little village is out of the way, far from any big town.
