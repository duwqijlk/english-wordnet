simpleMeaning: In chemistry, two or more atoms joined together as one part of a molecule
scope: In chemistry, two or more atoms joined as one part of a molecule; group and radical are other names
  for this sense, not a single atom and not a whole molecule.
examples:
- The chemical group sits at one end of the molecule.
- A chemical group can change how the molecule acts.
