simpleMeaning: A stem that grows flat along the ground from the bottom of a plant, with buds (small growth
  parts) at its ends that grow into new plants
scope: This is part of a plant, not a person who runs in races, not a person who carries messages, and
  not a fish.
examples:
- The strawberry plant sent out a long runner across the soil.
- A new plant grew where the runner touched the ground.
