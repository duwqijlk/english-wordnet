simpleMeaning: a rope used by the hangman to kill people who have been sentenced to death by hanging
scope: A rope used to hang people sentenced to death; not a horse's headgear and not a woman's top.
examples:
- The halter was placed around the condemned man's neck.
- In old times, the hangman carried his own halter to the scaffold.
