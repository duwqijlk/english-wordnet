simpleMeaning: a long, raised line of rock or coral (a hard thing made by small sea animals) under the
  water, near the top
scope: This is a long line of rock or coral under the sea, near the top of the water, not a strip of cloth
  on a sail that can be rolled up to make the sail smaller.
examples:
- The ship hit a reef just below the surface of the water.
- Many small fish live around the reef near the shore.
