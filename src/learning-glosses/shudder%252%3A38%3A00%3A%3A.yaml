simpleMeaning: to shake with sudden movements that you cannot control, as from fear or excitement
scope: 'Also called shiver and thrill: to shake with sudden movements you cannot control, as from fear
  or excitement. Not the shaking itself as a noun, and not the feeling of fear that you almost like.'
examples:
- She shuddered when she heard the loud bang behind her.
- He shuddered with fear as he stood in the dark house.
