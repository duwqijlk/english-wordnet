simpleMeaning: A swollen vein inside or outside the ring of muscle that closes the opening where solid
  waste leaves the body.
scope: A swollen vein inside or outside the ring of muscle that closes the opening where solid waste leaves
  the body; piles and hemorrhoid are other names for it, not the surgery that ties and cuts such swellings
  away and not a harmless swelling made of a mass of blood tubes.
examples:
- He had a haemorrhoid that made sitting hurt.
- The haemorrhoid was a swollen vein near the opening where solid waste leaves the body.
