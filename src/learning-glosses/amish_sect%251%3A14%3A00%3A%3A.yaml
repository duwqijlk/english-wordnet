simpleMeaning: A strict Anabaptist group that split from the Mennonites in the late 17th century and settled
  most of all in southeastern Pennsylvania.
scope: A strict Anabaptist group that split from the Mennonites in the late 17th century; its nearest
  kin are the Mennonites themselves and other plain Anabaptist groups.
examples:
- The Amish sect settled most of all in southeastern Pennsylvania.
- The Amish sect split from the Mennonites in the late 17th century.
