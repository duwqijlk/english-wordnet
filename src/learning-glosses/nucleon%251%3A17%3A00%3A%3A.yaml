simpleMeaning: One of the tiny bits, a proton or a neutron, that make up the heart of an atom
scope: One of the tiny bits, a proton or a neutron, that make up the heart of an atom; not an electron,
  and not the whole atom.
examples:
- A nucleon is either a proton or a neutron.
- Each nucleon sits in the heart of the atom.
