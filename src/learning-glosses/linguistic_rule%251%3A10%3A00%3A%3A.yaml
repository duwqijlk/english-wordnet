simpleMeaning: In linguistics, what people do with words, and what they ought to do, is laid down in one
  statement
scope: 'Another name for rule: a statement in linguistics about how words are used, not a law of the land
  and not a school rule.'
examples:
- The book lists a linguistic rule that says verbs come after the subject.
- She broke a linguistic rule when she put the adjective after the noun.
