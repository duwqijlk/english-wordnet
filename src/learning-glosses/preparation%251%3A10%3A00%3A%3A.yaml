simpleMeaning: In music, a note that later makes a group of notes sound harsh, but is first heard in a
  group that sounds smooth
scope: This is the music use, a note first heard in a smooth group, not getting ready for something and
  not a thing made ready to use.
examples:
- In this song, the preparation is first heard in a smooth chord before it makes a harsh sound.
- The teacher showed how the preparation sounds smooth at first and harsh later.
