simpleMeaning: Willing to welcome guests and strangers and to treat them in a warm, friendly and generous
  way
scope: This describes a person who welcomes guests and strangers warmly and generously, not just someone
  who is friendly to people they already know.
examples:
- Our hosts were hospitable and gave us food and a bed for the night.
- She is a hospitable woman who often invites strangers to dinner.
