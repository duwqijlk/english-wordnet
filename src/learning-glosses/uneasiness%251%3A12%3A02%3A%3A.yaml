simpleMeaning: worried feelings that leave you tight with nerves and quick to snap at others
scope: Worried feelings that make you tense and short-tempered, not embarrassment at being watched and
  not simply seeming ill at ease.
examples:
- A growing uneasiness made her tense and irritable all morning.
- His uneasiness kept him pacing the room, snapping at anyone who spoke.
