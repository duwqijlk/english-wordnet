simpleMeaning: To steer by something, such as a light or landmark, and treat it as a marker for direction.
scope: To find your way by following a light, landmark, or other fixed thing; it is not steering a vehicle
  yourself, not taking a person somewhere, and not being the mark that shows the way.
examples:
- Sailors once guided by the stars to cross open water.
- With no map, we guided on the line of lights along the coast.
