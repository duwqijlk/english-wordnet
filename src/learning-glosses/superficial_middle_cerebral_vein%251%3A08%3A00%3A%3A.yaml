simpleMeaning: a large blood tube that runs along the line of a deep groove in the brain to a blood space
  near the base of the skull
scope: This is a large blood tube in the brain that runs to a blood space near the base of the skull,
  not a blood tube in the neck and not a tube that drains blood from the face.
examples:
- The superficial middle cerebral vein runs along a deep groove in the brain.
- Doctors traced the superficial middle cerebral vein to a blood space near the base of the skull.
