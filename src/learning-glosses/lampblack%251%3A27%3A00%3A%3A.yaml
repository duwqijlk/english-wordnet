simpleMeaning: A black substance made up wholly or mostly of formless carbon, its tiny bits spread through
  it, used to make colours and ink
scope: This black substance is also called soot, crock, smut and carbon black; it is not charcoal and
  not coal dust.
examples:
- Lampblack was used to make black ink.
- The artist mixed lampblack into the paint.
