simpleMeaning: a feeling of anger because someone said or did something rude or hurtful to you
scope: This is the angry feeling you get when someone is rude to you, not the rude act itself and not
  a wrong act that breaks the law.
examples:
- He took offense at her rude joke.
- His offense was clear when he left the room in anger.
