simpleMeaning: This fresh-water animal, often found in the east of the United States, has bright yellow
  and red marks
scope: 'Also called painted terrapin and painted tortoise: a fresh-water turtle with bright yellow and
  red marks, common in the east of the United States, not a sea turtle and not a land tortoise.'
examples:
- A painted turtle climbed onto the rock to warm itself.
- The painted turtle in the marsh showed bright yellow and red marks.
