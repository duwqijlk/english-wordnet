simpleMeaning: having or showing the power to judge well and choose what is best, especially in matters
  of taste
scope: This is about having good taste and choosing well, especially in art and food; it is not the sense
  about noticing small differences, and not about treating people unfairly.
examples:
- The discriminating chef would buy vegetables from only one farm.
- She is a discriminating collector who buys only the finest paintings.
