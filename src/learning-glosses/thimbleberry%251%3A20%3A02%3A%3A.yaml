simpleMeaning: A raspberry with white flowers, from western North America and northern Mexico, with orange
  berries shaped like thimbles.
scope: Also called a salmon berry or salmonberry; a white-flowered raspberry of the west with orange thimble-shaped
  berries, not the eastern shrub with showy rose flowers and not the eastern raspberry with black berries.
examples:
- The thimbleberry bore orange berries in summer.
- They picked thimbleberry along the western trail.
