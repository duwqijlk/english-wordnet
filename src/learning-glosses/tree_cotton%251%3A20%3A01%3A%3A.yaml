simpleMeaning: Pale yellow to deep purple blooms mark a bush from the East Indies, grown most of all to
  look at.
scope: This is a bush from the East Indies grown most of all to look at for its pale yellow to deep purple
  blooms, not the small bushy kind grown on Caribbean islands for its cotton.
examples:
- The tree cotton was planted for the colour of its blooms.
- The tree cotton bore pale yellow blooms and deep purple ones.
