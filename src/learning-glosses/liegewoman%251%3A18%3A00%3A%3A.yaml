simpleMeaning: Land from a lord is held by this woman, who owes that lord loyalty and work in return
scope: A woman who holds land from a lord and owes loyalty and work, not the lord himself and not a man
  in the same place.
examples:
- The liegewoman brought her lord a gift of grain.
- A liegewoman of the manor signed the old deed.
