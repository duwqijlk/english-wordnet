simpleMeaning: to take away the air a person needs, and stop them from breathing
scope: To take away the air a person needs, and stop them from breathing; also called smother, not to
  fight for breath yourself, not to make it hard for someone to breathe, and not to hold back growth or
  new ideas.
examples:
- The child suffocated herself with a plastic bag that the parents had left on the floor.
- The pillow suffocated him in his sleep.
