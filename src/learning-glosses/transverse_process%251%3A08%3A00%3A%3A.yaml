simpleMeaning: One of the pair of parts that stick out from each bone in the spine and join to the ribs
scope: One of the two parts that stick out from a spine bone and join to a rib; not the spine bone itself
  and not the rib.
examples:
- The transverse process of the vertebra gives the rib a place to join.
- A broken transverse process can make the rib joint sore.
