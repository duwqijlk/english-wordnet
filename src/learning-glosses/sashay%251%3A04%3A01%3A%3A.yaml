simpleMeaning: a move in a square dance, where two partners go around each other by taking steps to the
  side
scope: A dance move for two partners in a square dance, not walking in a proud way to try to impress people.
examples:
- The dance teacher told each pair to do a sashay.
- In the sashay, the two partners circled each other with steps to the side.
