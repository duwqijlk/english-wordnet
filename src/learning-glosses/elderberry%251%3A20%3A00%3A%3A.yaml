simpleMeaning: a common bush with black fruit, or a small tree, from Europe and Asia; its fruit is used
  for wines and jellies
scope: Also called black elder, bourtree, or common elder. This is the bush or small tree itself, not
  only its fruit.
examples:
- An elderberry grows at the back of the garden and is covered in black fruit in late summer.
- The elderberry by the fence has grown into a small tree.
