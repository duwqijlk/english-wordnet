simpleMeaning: relating to the way a machine, process, or organization carries out its work.
scope: This is about how a machine, process, or organization does its work, not about being active or
  in force.
examples:
- Engineers monitored the operating conditions of the pump.
- The company cut its operating costs by closing two factories.
