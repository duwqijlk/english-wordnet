simpleMeaning: to change a substance by leaving it out in the open, so that at least part of it turns
  into a salt made from carbon
scope: To change a substance by leaving it in the open air, not to dry it and not to burn it.
examples:
- The builders let the lime air-slake in the yard.
- Lime will air-slake if it is left out in the open.
