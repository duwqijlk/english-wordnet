simpleMeaning: In ecology, a community of plants and animals living together in one region, with a few
  species dominating it.
scope: This is an ecological group of living things, not a club or other formal organization, not the
  act of spending time with others, not a social or business relationship, not a link between ideas held
  in memory, not the mental process of bringing ideas together, not a relation resulting from interaction
  or dependence, and not a chemical process of combination.
examples:
- The biologists recorded a plant association in which a few grasses dominate the meadow.
- This association of insects and flowering plants occupies only the wetter part of the valley.
