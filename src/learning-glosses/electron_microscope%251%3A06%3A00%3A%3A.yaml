simpleMeaning: A scope like a light scope in aim, but with far finer sight, using a straight beam of electrons
  to light the thing watched, not a beam of light.
scope: A microscope like a light microscope in aim, but with far finer sight, using electrons instead
  of light.
examples:
- Electron microscopes see finer than light scopes.
- The electron microscope lights things with electrons.
