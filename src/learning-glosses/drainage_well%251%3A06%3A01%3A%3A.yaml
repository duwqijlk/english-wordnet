simpleMeaning: extra water leaves a place through a set of channels and pipes
scope: 'Also called drain system and drainage system: extra water leaves a place through a set of channels
  and pipes, not one pipe on its own and not a ditch dug to carry water away.'
examples:
- The drainage well took the extra water away from the low field.
- After the rain, the drainage well kept the yard from flooding.
