simpleMeaning: bright flashes of light near the horizon with no thunder, above all on hot evenings, most
  often said to be far-off lightning bounced back by clouds
scope: Bright flashes of light near the horizon with no thunder, not a storm overhead and not fireworks.
examples:
- We watched heat lightning flicker along the horizon on a hot evening.
- Heat lightning lit the sky, but we heard no thunder.
