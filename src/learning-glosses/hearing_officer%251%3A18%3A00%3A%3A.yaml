senseId: 'hearing_officer%1:18:00::'
synsetId: 10185550-n
simpleMeaning: So that a state body can use the powers the law gives it, a person it picks looks into
  a matter or runs a formal meeting about it
scope: A person picked by a state body to look into a matter or run a formal meeting, also called a hearing
  examiner, not a judge and not a lawyer for one side.
examples:
- The hearing officer set the date for the formal meeting.
- Both sides gave their facts to the hearing officer.
