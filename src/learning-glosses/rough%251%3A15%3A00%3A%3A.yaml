simpleMeaning: An area of grass beside a golf fairway that is not mown short.
scope: This is the golf-course noun, an area of uncut grass, not the adjective for an uneven surface or
  a first, unfinished version.
examples:
- Her drive landed in the rough, well off the fairway.
- The ball sat deep in the rough, and she could only hack it back onto the short grass.
