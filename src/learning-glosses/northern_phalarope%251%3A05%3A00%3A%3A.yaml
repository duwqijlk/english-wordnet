simpleMeaning: A sea bird that breeds in the far north of both the Old and New Worlds, often seen in big
  flocks far out at sea
scope: A sea bird that breeds in the far north and is often seen in big flocks far out at sea; not a land
  bird, and not a bird of warm seas.
examples:
- Northern phalaropes gathered in large flocks far out at sea.
- The northern phalarope breeds in the far north.
