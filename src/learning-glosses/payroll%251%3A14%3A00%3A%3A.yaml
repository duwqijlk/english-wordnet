simpleMeaning: the part of a workplace that works out how much pay each worker is owed
scope: The office team that fixes each person's pay, not the money paid out itself and not the list of
  workers.
examples:
- The payroll office sorted out the new rates for every worker.
- She sent the hours sheet to payroll before Friday.
