simpleMeaning: In wet places through the cooler lands of the north grows a plant whose leaves are cut
  deep into narrow parts.
scope: This plant grows in wet places all over the cooler lands of the north, with leaves cut deep into
  narrow parts, not in dry ground.
examples:
- Marsh fern grew in the wet ground by the stream.
- We saw marsh fern in a wet place in the north.
