senseId: 'interlude%2:36:00::'
synsetId: 01717655-v
simpleMeaning: to give a short performance between parts of a longer performance
scope: This is the act of giving a short performance, not a period between events and not the short show
  itself as a thing.
examples:
- The guitar player interluded with a beautiful short piece between the acts.
- While the stage was being changed, a singer interluded for the crowd.
