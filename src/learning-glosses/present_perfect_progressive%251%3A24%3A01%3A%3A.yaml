simpleMeaning: A way of building verbs with has been or have been plus the -ing form, to show an action
  that started in the past and is still going on
scope: 'Also called present perfect continuous: a verb form that shows an action started in the past and
  still going on; not a simple past form and not a verb form for a finished action.'
examples:
- She has been working on the report all morning — that is the present perfect progressive.
- The present perfect progressive is used in 'They have been waiting since noon.'
