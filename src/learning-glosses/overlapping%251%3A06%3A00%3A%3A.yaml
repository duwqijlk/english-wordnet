senseId: 'overlapping%1:06:00::'
synsetId: 03566837-n
simpleMeaning: A way of covering a surface so that each piece lies over part of the next one, as tiles
  or shingles do.
scope: Covering in which each piece lies over part of the next, also called lapping, and not pieces set
  side by side.
examples:
- The overlapping tiles kept out the rain.
- Shingles are laid with an overlapping pattern.
