simpleMeaning: A fungus that attacks cereal plants, growing hard black lumps of threadlike growth in place
  of many grains; it supplies medicines called alkaloids and lysergic acid.
scope: The fungus itself, not the plant disease it causes in cereal crops.
examples:
- Ergot can ruin a rye crop if the grain is left damp.
- Bread made from flour contaminated with ergot caused strange hallucinations.
