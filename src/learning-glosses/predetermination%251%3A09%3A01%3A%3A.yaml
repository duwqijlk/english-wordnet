senseId: 'predetermination%1:09:01::'
synsetId: 05974996-n
simpleMeaning: 'In theology, what happens was fixed before: above all the teaching, usually tied to Calvin,
  that God fixed every event for all time, even who is saved at last.'
scope: 'Also called foreordination, predestination, and preordination: in theology, what happens was fixed
  long before, above all the teaching that God fixed every event for all time, even who is saved at last.'
examples:
- She spoke of predetermination, the teaching that God fixed every event long before.
- Predetermination holds that what happens was fixed before, even who is saved at last.
