senseId: 'guideword%1:10:00::'
synsetId: 06302383-n
simpleMeaning: A reader can tell what a page holds by the term printed at its top, which names the first
  or last item on the page
scope: A printed term at the top of a page in a book of meanings, also called catchword and guide word,
  not a title and not a page number.
examples:
- She checked the guideword before turning the page.
- The guideword 'apple' showed that the page started with that term.
