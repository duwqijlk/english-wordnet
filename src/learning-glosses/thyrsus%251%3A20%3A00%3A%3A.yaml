simpleMeaning: One main stalk bears a thick bunch of flowers, as on lilac or horse chestnut, with blooms
  along the stalk and on side shoots that end in a flower.
scope: A thick bunch of flowers, also called thyrse, with flowers along the main stalk and side shoots
  ending in flowers.
examples:
- The thyrsus stood tall on its main stalk.
- A thyrsus bears its flowers along the stalk and on side shoots.
