simpleMeaning: In mathematics, a number that is a root of another number (you get the other number by
  multiplying it by itself one or more times)
scope: In mathematics this is a number written as a root, not the chemistry group of atoms and not a person
  with strong new ideas.
examples:
- In the sum, the radical stands for the square root of nine.
- The teacher asked us to work out the value of the radical.
