simpleMeaning: a person who buys tickets to an event so that they can sell them again for more money
scope: A person who buys event tickets to sell again for more money, not a person who sells advice about
  gambling or horse racing.
examples:
- A tout outside the ground sold tickets at twice the price.
- The police stopped a tout who had bought fifty tickets to sell again.
