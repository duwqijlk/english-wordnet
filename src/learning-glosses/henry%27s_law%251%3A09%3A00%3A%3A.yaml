simpleMeaning: 'In chemistry, a rule set out by the English chemist it is named for: the more pressure
  on a gas, the more of it water will take in'
scope: A chemistry rule about gas and water; not a rule about how gases mix in air, and not a general
  rule about pressure in liquids.
examples:
- Henry's law explains why a fizzy drink keeps its bubbles under pressure.
- We used Henry's law to work out how much gas the water would take in.
