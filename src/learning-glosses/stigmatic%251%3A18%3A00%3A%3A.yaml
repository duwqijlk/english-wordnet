senseId: 'stigmatic%1:18:00::'
synsetId: 10675927-n
simpleMeaning: A person whose body is marked by holy stigmata, as marks like the wounds of the crucified
  Christ.
scope: A person whose body is marked by holy stigmata, as marks like the wounds of the crucified Christ;
  also called stigmatist; not to do with a lens, or lens set, free of astigmatism, able to form point
  images, nor to do with, or like, or having, stigmata.
examples:
- Their stigmatic bore the marks.
- The stigmatic was seen at dawn.
