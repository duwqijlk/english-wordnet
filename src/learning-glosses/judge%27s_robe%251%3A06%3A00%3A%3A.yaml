simpleMeaning: This gown is worn by people who work at a university or by people who decide cases in court
scope: This gown is worn by people who work at a university or decide cases in court, also called an academic
  gown or academic robe; not an everyday coat and not a robe worn only for warmth.
examples:
- He put on his judge's robe before taking his seat in court.
- The new judge's robe was black with wide sleeves.
