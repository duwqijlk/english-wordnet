simpleMeaning: in a rich way, using or giving a lot
scope: This says how an action is done, in a rich way with much spent or given; it is not a word for a
  rich person or a rich thing itself.
examples:
- The room was lavishly decorated with gold, flowers and fine cloth.
- The guests were lavishly fed, with dish after dish brought to the table.
