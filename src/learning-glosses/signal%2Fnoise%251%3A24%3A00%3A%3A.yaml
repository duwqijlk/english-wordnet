simpleMeaning: a figure that sets the strength of a wanted sound against the strength of unwanted sound
scope: A figure that sets the strength of a wanted sound against the strength of unwanted sound, also
  called signal-to-noise, signal-to-noise ratio and signal/noise ratio; not the strength of the wanted
  sound on its own and not the strength of the unwanted sound on its own.
examples:
- The signal/noise of the recording was too low for clear speech.
- We raised the signal/noise by cutting the background hiss.
