simpleMeaning: A large half-evergreen East Indies tree; trunk gives off sticky gum; its bitter bark is
  used as a tonic; its seeds give scented oil; sometimes put in the genus Melia.
scope: Also called neem, arishth, margosa, neem tree, nim tree and Melia azadirachta; a large tree of
  the East Indies with bitter bark and seeds that give oil, not a tree grown for its fruit and not a small
  shrub.
examples:
- Azadirachta indica grows in the East Indies.
- Farmers use Azadirachta indica for its oil.
