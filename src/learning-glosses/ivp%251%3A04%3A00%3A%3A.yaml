simpleMeaning: The act of taking a picture of the kidneys by putting a dye that shows up on the picture
  into a vein
scope: This is the act of taking a picture of the kidneys by putting a dye that shows up into a vein;
  intravenous pyelography is another name for this sense, and it is the doing of the test, not the picture
  that comes out of it.
examples:
- The doctor ordered an IVP to look at her kidneys.
- An IVP uses a dye put into a vein.
