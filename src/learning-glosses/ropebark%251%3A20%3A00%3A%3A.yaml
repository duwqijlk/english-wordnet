simpleMeaning: Small yellow flowers grow on a bush of eastern North America that loses its leaves in winter,
  with tough bendy branches and soft skin.
scope: Leatherwood, moose-wood, moosewood and wicopy are other names for this bush of eastern North America,
  which loses its leaves in winter and has tough bendy branches, soft skin and small yellow flowers.
examples:
- The ropebark grew in eastern North America.
- Ropebark bore small yellow flowers.
