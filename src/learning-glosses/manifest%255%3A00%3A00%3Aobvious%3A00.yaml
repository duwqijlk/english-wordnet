simpleMeaning: easy to see or feel or judge, and clear to the mind
scope: Easy to see or feel or judge, and clear to the mind; also called plain and apparent, and evident,
  unmistakable, palpable and patent are other names for this sense; not the customs paper, not showing
  a thing by what you do, and not writing things down in such a paper.
examples:
- His disapproval was manifest to all.
- The effects of the drought were manifest in the dry fields.
