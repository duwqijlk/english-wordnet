simpleMeaning: About people who live together in a religious group, about the way they live, or about
  what suits people who live that way.
scope: About people living together in a religious group, not about a person living alone and not about
  a crowd; cenobitical, coenobitic and coenobitical are other names for this sense.
examples:
- The cenobitic monks shared meals, work and prayer.
- Cenobitic life means living in a community under one roof.
