simpleMeaning: the set path a plane must follow in the air when it is getting ready to land at an airport
scope: The set path a plane follows to land at an airport, not a drawing that shows how radio waves spread
  from an antenna, and not the verb sense of taking a shape or order.
examples:
- The pilot stayed in the pattern until the tower said he could land.
- The traffic pattern around the airport was busy that morning.
