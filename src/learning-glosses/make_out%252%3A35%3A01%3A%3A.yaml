simpleMeaning: To show sexual passion by kissing, holding someone close, or touching them
scope: To show sexual passion by kissing, holding someone close, or touching them, not a friendly kiss
  on the cheek and not simply holding hands; neck is another name for this sense.
examples:
- The couple were making out in the back seat of the car.
- They made out on the sofa while the film played.
