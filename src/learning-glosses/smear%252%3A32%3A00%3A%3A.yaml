simpleMeaning: to say false bad things about someone because you want to hurt them, and to damage how
  others think of them
scope: This is hurting a person by saying false bad things about them, not making something dirty by rubbing
  a dirty substance on it and not covering a surface with a substance.
examples:
- They tried to smear her by spreading false stories about her work.
- He smeared his rival with lies about theft.
