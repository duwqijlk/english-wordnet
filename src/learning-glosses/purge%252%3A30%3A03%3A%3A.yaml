simpleMeaning: To clear a thing out by letting liquid flow through it, so it is washed or emptied.
scope: To wash a thing through with liquid or empty it that way; also called flush and scour, not clearing
  the bowels, not throwing up, not the sudden removal of people, and not making a person free from sin.
examples:
- He purged the tank with clean water before refilling it.
- The nurse purged the wound with a mild wash.
