simpleMeaning: a person who looks into insurance claims or claims for loss or harm and suggests a payment
  that settles the claim
scope: A person who looks into insurance claims or claims for loss or harm and suggests a payment that
  settles the claim, also called an adjustor, a claim agent, a claims adjuster or a claims adjustor; not
  an insurance seller and not a judge.
examples:
- The adjuster came to look at the damage to our roof.
- Our adjuster said the company would pay for the repairs.
