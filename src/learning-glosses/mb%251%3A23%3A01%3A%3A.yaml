simpleMeaning: A measure of how much data, equal to one thousand kilobytes, or one million bytes.
scope: Also called megabyte and M, this is a measure of data equal to one thousand kilobytes, not the
  measure equal to one thousand twenty-four kibibytes.
examples:
- The photo is one MB in size.
- One MB holds one thousand kilobytes.
