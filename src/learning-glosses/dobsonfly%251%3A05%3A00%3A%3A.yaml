simpleMeaning: The males of this big, soft-bodied insect have long, thin jaws, and its young spend their
  early life in water, where people often use them to catch fish.
scope: Also called dobson and dobson fly, this big, soft-bodied insect is named for the grown insect as
  well as its water-living young.
examples:
- A dobsonfly landed on the porch light.
- The dobsonfly larvae in the creek make good bait for fishermen.
