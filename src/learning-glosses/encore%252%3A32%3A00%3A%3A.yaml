simpleMeaning: to ask a person who has just performed to perform one more time
scope: To ask a performer to perform one more time; not the extra performance itself, and not just clapping
  or cheering.
examples:
- The crowd encored the singer until she came back and sang one more song.
- They encored the band loudly at the end of the concert.
