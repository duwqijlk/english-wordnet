simpleMeaning: full of great kindness and goodness, like an angel or a saint in the way a person looks
  or acts
scope: 'Also called saintly, angelic, sainted, angelical and saintlike: showing great kindness like an
  angel or saint, not just feeling great joy from heaven.'
examples:
- She gave him a beatific smile full of kindness.
- The old man's beatific face looked kind and good, like a saint's.
