simpleMeaning: the quality of feeling shy and holding back, so a person does not act or speak freely
scope: This is the quality of being shy and holding back. It is not the way nerves slow down a body part,
  not pushing unwanted thoughts out of the mind, and not the act of stopping or banning something.
examples:
- His inhibition made it hard for him to speak in front of a large group.
- She slowly lost her inhibition and began to dance with the others.
