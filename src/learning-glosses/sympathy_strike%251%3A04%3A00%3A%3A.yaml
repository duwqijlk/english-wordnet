senseId: 'sympathy_strike%1:04:00::'
synsetId: 01246674-n
simpleMeaning: A stoppage of work in support of other workers who have stopped work, not because of a
  direct complaint against one's own employer.
scope: This is a stoppage of work to back other workers, also called sympathetic strike, and not a walkout
  over one's own pay or a lockout.
examples:
- The dockers held a sympathy strike for the miners.
- A sympathy strike shut the port for a day.
