simpleMeaning: To get the ball up and over things in the way, this short club is used in golf
scope: A short club used in golf to lift the ball up and over things in the way, not a long club for hitting
  the ball far and not a tool for splitting wood.
examples:
- She used a pitching wedge to lift the ball over the trees.
- His pitching wedge got the ball up and over the low wall.
