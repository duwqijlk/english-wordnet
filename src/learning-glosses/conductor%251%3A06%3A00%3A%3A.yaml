simpleMeaning: a thing made to let electricity, heat, and such pass through it
scope: A made thing that lets electricity or heat pass through it, not the material itself that does this
  and not the person who collects fares on a bus or train.
examples:
- A lightning conductor on the roof carries electricity safely to the ground.
- This conductor is a wire made to carry electricity to the lights.
