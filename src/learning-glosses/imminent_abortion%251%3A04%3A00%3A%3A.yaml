simpleMeaning: The baby growing in a woman's womb is about to be lost, and signs show it
scope: Signs that a pregnancy is about to end in loss, not the loss itself and not a planned end to a
  pregnancy.
examples:
- Imminent abortion was feared when the bleeding began.
- The doctor watched for signs of imminent abortion after the pains started.
