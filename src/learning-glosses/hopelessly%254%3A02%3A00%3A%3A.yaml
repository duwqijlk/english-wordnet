simpleMeaning: In a way that gives up all hope, because no comfort or success seems left to come
scope: In a way that gives up all hope because no comfort or success seems left, not merely in a hopeless
  way.
examples:
- She waited hopelessly for a letter that never came.
- He stared hopelessly at the empty road.
