simpleMeaning: a lamp on a boat showing which way it goes; at night boats carry a red lamp on the left
  front and a green lamp on the right front
scope: 'Also called a sidelight: a lamp on a boat showing its direction, not a lamp on land and not a
  searchlight.'
examples:
- The boat's running light showed it was heading toward us.
- At night, each running light tells other boats which way to pass.
