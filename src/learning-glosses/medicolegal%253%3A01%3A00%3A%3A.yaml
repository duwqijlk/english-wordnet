simpleMeaning: About the law as it bears on doctors' work, such as wrong care by a doctor, a patient's
  yes to an operation, or a patient's facts
scope: This is about the law as it bears on doctors' work, not the care itself and not a single court
  case.
examples:
- The hospital asked a medicolegal expert to check whether the doctor's care had broken the law.
- Medicolegal questions came up when the patient had not agreed to the operation.
