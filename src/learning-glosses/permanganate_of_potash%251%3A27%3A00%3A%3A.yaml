simpleMeaning: a poisonous salt that forms dark purple crystals and turns reddish purple in water, used
  to add oxygen to things, to bleach, and to kill germs and clean wounds
scope: 'Also called potassium permanganate: a poisonous purple salt used to bleach and to kill germs,
  not table salt and not a drug to be swallowed.'
examples:
- Permanganate of potash turns the water purple-red.
- The nurse used permanganate of potash to clean the wound.
