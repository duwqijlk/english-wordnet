simpleMeaning: The branch of spectroscopy that measures gaps between atomic or molecular energy levels
  separated by about 10⁵ to 10⁹ hertz, versus about 6 × 10¹⁴ hertz for optical levels.
scope: The radio-frequency branch of spectroscopy, not optical spectroscopy, which uses far higher frequencies,
  nor the medical imaging that can use it.
examples:
- Radio-frequency spectroscopy can reveal the spacing between energy levels in a molecule.
- The lab used radio-frequency spectroscopy to study atomic energy levels.
