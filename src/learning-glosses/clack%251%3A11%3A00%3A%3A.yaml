simpleMeaning: a short, sharp sound like two things hitting together, which may come again and again
scope: A short sharp sound like two things hitting together, also called clap; not the valve, not fast
  empty talk, and not the sound hens make.
examples:
- We heard the clack of the two sticks hitting.
- The clack of the gate woke the dog.
