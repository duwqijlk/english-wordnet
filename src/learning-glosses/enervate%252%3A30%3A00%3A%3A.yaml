schema: oewn-learning-gloss-v2
senseId: 'enervate%2:30:00::'
synsetId: 00390527-v
simpleMeaning: to make a person weaker in mind or in their sense of what is right
scope: To make a person weaker in mind or in what they feel is right, not to make the body weak and not
  to give a person strength.
examples:
- Years of failure enervated him and took away his will to try again.
- The long, hopeless war enervated the soldiers and weakened their belief in the cause.
