synsetId: 00644632-n
simpleMeaning: an eye check that looks at the join of the coloured part and the clear front, to tell open-angle
  from closed-angle glaucoma, a disease that raises eye pressure
scope: An eye check of the front of the eye, not a test of sight and not a check of the back of the eye.
examples:
- The doctor ordered a gonioscopy to look at the front of her eye.
- A gonioscopy helped the doctor tell open-angle glaucoma from closed-angle glaucoma.
