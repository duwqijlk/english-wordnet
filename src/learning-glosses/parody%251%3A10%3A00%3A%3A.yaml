senseId: 'parody%1:10:00::'
synsetId: 06793148-n
simpleMeaning: a piece of writing or other work that copies or twists the way a person writes or works,
  usually to make people laugh
scope: Also called mockery, takeoff, travesty, burlesque, spoof, lampoon and pasquinade. It is the work
  itself, not the act of copying someone in a funny way and not the verb for making such a work.
examples:
- The students wrote a parody of the head teacher's long speeches.
- Her song is a funny parody of a famous love song.
