simpleMeaning: A meat-eating plant of the coastal plains of the Carolinas, with sensitive hinged leaf
  blades edged with bristles that shut and trap insects.
scope: Also called Dionaea muscipula and Venus's flytrap; a meat-eating plant of the coastal plains of
  the Carolinas whose leaf blades shut and trap insects, not the pitcher plant and not the sundew.
examples:
- Venus's flytraps snapped shut when the flies touched their leaves.
- Venus's flytraps grow on the coastal plains of the Carolinas.
