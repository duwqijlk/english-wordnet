simpleMeaning: In chemistry, the move of one atom or small group of atoms, not at random, from one spot
  to another inside a molecule
scope: Not the travel of birds or people; this is one atom or small group of atoms moving inside a molecule.
examples:
- The migration of the atom changed the shape of the molecule.
- In the lab we watched the migration of the radical from one place to another.
