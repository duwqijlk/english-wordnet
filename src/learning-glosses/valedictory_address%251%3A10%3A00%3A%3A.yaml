simpleMeaning: At the leaving ceremony, the best of a class that is leaving school gives a goodbye speech.
scope: Valediction, valedictory, and valedictory oration are other names for this goodbye speech, given
  by the best of a class that is leaving school.
examples:
- The best of the leaving class gave the valedictory address.
- The valedictory address was given at the end of school by the best of the class.
