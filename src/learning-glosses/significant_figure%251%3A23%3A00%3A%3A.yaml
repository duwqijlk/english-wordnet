senseId: 'significant_figure%1:23:00::'
synsetId: 13764151-n
simpleMeaning: A number's figure known beyond doubt, running from the leftmost figure that is not nought
  to the rightmost figure that is not nought, with a nought taken as true worth.
scope: This sense is also called significant digit.
examples:
- A significant figure is known beyond doubt.
- Significant figures start with the first non-nought figure.
