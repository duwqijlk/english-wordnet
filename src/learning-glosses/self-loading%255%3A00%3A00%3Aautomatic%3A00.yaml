simpleMeaning: Of guns, able to load and fire again and again without help from the shooter
scope: 'Also called semiautomatic or autoloading: a gun that fills and fires again and again on its own,
  not a gun loaded by hand and not a gun that fires one shot at a time.'
examples:
- The self-loading rifle fires again without hand loading.
- A self-loading pistol fills after each shot.
