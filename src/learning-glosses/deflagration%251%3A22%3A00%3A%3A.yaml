senseId: 'deflagration%1:22:00::'
synsetId: 13471590-n
simpleMeaning: Burning that spreads quickly through a gas or along the surface of an explosive, pushed
  on by heat passing from one part to another
scope: Burning that spreads fast through gas or over an explosive, driven by heat; not an explosion with
  a shock wave and not slow, steady burning.
examples:
- Deflagration spread through the gas in seconds.
- The deflagration moved across the surface of the explosive.
