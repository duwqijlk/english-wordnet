simpleMeaning: a change in a vowel sound, in kind or in length, that marks a difference in meaning, as
  in sing, sang, sung, song
scope: It names a change in a vowel sound that marks a difference in meaning, not a wholly new word.
examples:
- English shows ablaut in sing, sang, sung, song.
- The ablaut marks the change from present to past.
