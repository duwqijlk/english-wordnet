simpleMeaning: To reach someone who is ahead and perhaps pass them.
scope: Reaching someone or something ahead and perhaps moving past them; it is not taking hold of an object,
  not the thing taken, not a faithful copy, not something snagging, or a catcher's play.
examples:
- By the second mile he had caught the runners ahead of him.
- She caught the leader on the final bend and won the race.
