simpleMeaning: Light wood that smells of cedar, running in colour from pink to reddish brown, comes from
  a tree from Africa.
scope: Also called cedar mahogany, the name points to its cedar-smelling wood, which runs in colour from
  pink to reddish brown.
examples:
- The table was made of sapele mahogany, with wood that smells of cedar.
- They chose sapele mahogany for the pink to reddish brown wood.
