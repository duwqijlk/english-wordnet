simpleMeaning: the act of sending a person or a matter on to the right person or office
scope: This is the act of sending someone or a matter on to another person or office. It is not the note
  that tells you to go to that person, and not the person who is sent.
examples:
- The referral of her case to a higher court took a month.
- The office handles the referral of job seekers to local firms.
