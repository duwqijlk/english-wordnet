simpleMeaning: open, so people can go in and out with nothing in the way; not shut
scope: 'Another name for this sense is open: a door or gate that is not shut and lets people pass, not
  a thing that is not tied or fixed in place.'
examples:
- The door stood unfastened and wide open all afternoon.
- With the door unfastened, anyone could enter or leave freely.
