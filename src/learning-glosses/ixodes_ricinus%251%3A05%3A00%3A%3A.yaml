simpleMeaning: A tick that lives on sheep, cattle, and people; it can pass on louping ill in sheep, a
  sudden brain disease, and it carries the germ of Lyme disease.
scope: A tick that bites sheep, cattle, and people, also called sheep-tick and sheep tick; not a harmless
  tick, since it can pass on louping ill and Lyme disease.
examples:
- Ixodes ricinus bit the sheep and spread louping ill.
- Walkers check for Ixodes ricinus after crossing the moor.
