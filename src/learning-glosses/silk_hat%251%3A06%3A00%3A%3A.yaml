simpleMeaning: Most often covered with shiny cloth or beaver fur, this tall-topped head covering is worn
  by men.
scope: People also call it a beaver, a stovepipe, a topper, a dress hat, a high hat, an opera hat, and
  a top hat, and it is the tall-topped head covering a man wears.
examples:
- The silk hat was covered with beaver fur.
- The silk hat had a tall top.
