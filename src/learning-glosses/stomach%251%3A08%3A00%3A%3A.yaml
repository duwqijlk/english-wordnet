simpleMeaning: the large muscular bag in the digestive tract, the main organ of digestion
scope: This is the internal digestive organ, also called the tummy in everyday speech, not the outer belly
  area or a liking for conflict.
examples:
- The ulcer was found in the lower part of his stomach.
- Food leaves the stomach and passes into the small intestine.
