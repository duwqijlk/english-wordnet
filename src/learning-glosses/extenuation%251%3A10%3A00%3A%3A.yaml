senseId: 'extenuation%1:10:00::'
synsetId: 06754423-n
simpleMeaning: Showing the facts that soften the blame so a wrong act seems less bad than it looks, a
  reason given that only partly excuses it
scope: Mitigation is another name for a reason that only partly excuses a wrong act, not one that clears
  the blame away.
examples:
- He offered his youth as extenuation for what he had done.
- The court heard the extenuation and blamed him less.
