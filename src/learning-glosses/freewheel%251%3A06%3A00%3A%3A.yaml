senseId: 'freewheel%1:06:00::'
synsetId: 03398597-n
simpleMeaning: a clutch (a joining part), such as on the back wheel of a bicycle, that lets wheels keep
  turning even when you stop pushing
scope: This is the bicycle part itself, not the verb uses for rolling without power or for living in a
  free, easy way.
examples:
- The freewheel let the back wheel of his bicycle keep turning while he rested his legs.
- She replaced the worn freewheel on her bicycle.
