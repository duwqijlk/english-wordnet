simpleMeaning: Now growing wild in the United States, this green-all-year shrub of South America at times
  poisons farm animals.
scope: Also called tree tobacco, this green-all-year shrub of South America now grows wild in the United
  States and at times poisons farm animals, and it is not a tree.
examples:
- The mustard tree grew wild along the roadside.
- The mustard tree poisoned some farm animals.
