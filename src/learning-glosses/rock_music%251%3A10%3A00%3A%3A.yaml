simpleMeaning: a kind of popular song style that began in the 1950s, mixing black rhythm-and-blues with
  white country-and-western
scope: A kind of popular song style that began in the 1950s; rock, rock'n'roll, rock-and-roll, rock 'n'
  roll and rock and roll are other names for it, not jazz and not country music on its own.
examples:
- Rock music was everywhere in the 1960s.
- He turned the rock music up loud.
