simpleMeaning: A member of one of four language groups of the early Greeks, spoken on the Greek mainland,
  Crete, and Cyprus from the 16th to the 12th centuries BC.
scope: Not an Aeolian, a Dorian, or an Ionian, the other Greek language groups; also called an Achaean.
examples:
- The Achaian spoke a form of early Greek.
- An Achaian lived on the Greek mainland in the 14th century BC.
