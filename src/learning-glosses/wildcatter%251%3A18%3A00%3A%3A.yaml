simpleMeaning: A person who looks for oil by drilling test wells in land not known to hold oil
scope: This is a person who looks for oil by drilling test wells in land not known to hold oil; not an
  oil worker on a known oil field and not a person who buys and sells oil.
examples:
- The wildcatter drilled a test well on empty land far from any known field.
- A wildcatter risks his money on land that may hold no oil at all.
