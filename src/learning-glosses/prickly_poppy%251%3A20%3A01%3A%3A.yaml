simpleMeaning: a plant that lives for one year and comes from Europe, Asia, or Africa, with orange-red
  flowers and fruit covered in stiff hairs
scope: A one-year plant from Europe, Asia, or Africa with orange-red flowers and bristly fruit, not the
  tropical American plants with large white or yellow flowers.
examples:
- We saw a prickly poppy with orange-red flowers beside the path.
- The prickly poppy has fruit covered in stiff hairs.
