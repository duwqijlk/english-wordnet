simpleMeaning: Molasses and other sweet stuff are left to change with the sticky juice of evergreen trees,
  and the drink this makes at times has malt in it too.
scope: What sets this drink apart is the sticky juice of evergreen trees, left to change with molasses
  and other sweet stuff, at times with malt in it too.
examples:
- A batch of spruce beer was brewed with molasses and tree sap.
- This spruce beer sometimes has malt in it.
