simpleMeaning: a green plant from Europe that keeps its leaves all year and bears white or somewhat purple
  flowers that bloom in the cold months and look like cups
scope: This is a plant from Europe that stays green all year and blooms in the cold months; black hellebore
  is another name for this sense, and it is not a rose that blooms in summer.
examples:
- The winter rose bloomed in January despite the snow.
- She planted a winter rose beside the front steps.
