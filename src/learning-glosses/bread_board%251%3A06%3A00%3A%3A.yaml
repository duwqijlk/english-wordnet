simpleMeaning: Dough is worked by hand, and slices are cut from a loaf, on a flat slab of wood or hard
  plastic.
scope: Also called a breadboard, this flat slab of wood or hard plastic is where dough is worked by hand
  and slices are cut from a loaf.
examples:
- The dough was worked by hand on the bread board.
- Slices were cut from the loaf on the bread board.
