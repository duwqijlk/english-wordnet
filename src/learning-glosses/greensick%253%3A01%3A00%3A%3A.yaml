senseId: 'greensick%3:01:00::'
synsetId: 02706126-a
simpleMeaning: suffering from chlorosis (an illness of the blood that makes the skin pale), or relating
  to this illness
scope: This word links a person to one blood illness that makes the skin pale. It does not just mean green
  in colour, and it does not mean sick in a general way.
examples:
- The old doctor said the pale girl was greensick.
- The greensick girl rested while the doctor checked her blood.
