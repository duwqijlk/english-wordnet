simpleMeaning: Groups of people come together to pray in any building of this kind.
scope: Also called a house of prayer, a house of worship, and a place of worship, this is any building
  where groups of people come together to pray, not a building for living in.
examples:
- They went to the house of God to pray.
- The house of God was open all day for prayer.
