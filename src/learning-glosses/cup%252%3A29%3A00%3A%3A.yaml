simpleMeaning: to treat a patient by placing containers with the air removed against the skin
scope: This is the therapy that applies airless containers to the skin, not forming a hand or other thing
  into a hollow shape, not putting a liquid into a drinking vessel, and not the vessel, trophy, or golf-hole
  senses.
examples:
- The therapist cupped the patient's back.
- Cupping left round marks on his back for a few days.
