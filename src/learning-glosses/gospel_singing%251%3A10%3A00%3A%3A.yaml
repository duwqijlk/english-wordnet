simpleMeaning: Later popular music, above all soul, took shape from folk music of voices alone, begun
  by Black slaves in the United States, where a leader calls and the group answers.
scope: Also called gospel, this is folk music of voices alone with call and answer, not music played on
  instruments.
examples:
- The choir gave an evening of gospel singing at the church.
- Gospel singing filled the hall with voices and clapping.
