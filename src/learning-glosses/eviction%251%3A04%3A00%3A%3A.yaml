senseId: 'eviction%1:04:00::'
synsetId: 01196821-n
simpleMeaning: the act of making someone, such as a person who rents land or a home, leave it by using
  the law
scope: 'Another name for this sense is dispossession: a person is made by law to leave land or a home.
  It is not the sense where a landlord makes a home so bad to live in that the person leaves, with no
  action in court.'
examples:
- After months without rent, the family faced eviction from their flat.
- The court ordered the eviction of the people living on the land.
