senseId: 'polydipsia%1:26:00::'
synsetId: 14064448-n
simpleMeaning: thirst that is far too strong, as can happen with diabetes or when the kidneys do not work
  well
scope: This is thirst far beyond normal need, linked to illness such as diabetes or kidney trouble, not
  ordinary thirst after hard work or heat.
examples:
- Her polydipsia meant she drank glass after glass of water and still felt thirsty.
- The doctor asked about his polydipsia because it can point to diabetes or kidney trouble.
