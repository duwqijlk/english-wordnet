simpleMeaning: The activity of people going out at night for fun, to plays, dance clubs, and other places
  that stay open late.
scope: Also called night life; the activity of people going out at night for fun, to plays, dance clubs,
  and other places that stay open late, not the entertainment on offer itself.
examples:
- The city's nightlife kept us out until dawn.
- They came for the nightlife, not the beaches.
