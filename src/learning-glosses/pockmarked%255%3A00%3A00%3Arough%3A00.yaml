simpleMeaning: used of a paved surface, such as a road, that has holes or small deep marks in it
scope: 'Also called pocked and potholed: this is about a paved surface with holes, not about skin marked
  by disease.'
examples:
- Cars slowed down on the pockmarked road.
- The pockmarked street was full of small holes after the winter.
