simpleMeaning: a person who follows the law and the usual rules and ways of doing things, and does not
  bend them
scope: Of a person, keeping closely to the laws, rules and customs, not being quick to notice things.
examples:
- They were observant citizens who never broke the law.
- She was observant of the speed limit at all times.
