simpleMeaning: the quality of being well based and right, and of being strict and careful in every part
scope: Rigor is another name for this sense; it is how well based, right, strict and careful a thing is,
  not how long a card, ticket, or law can be used.
examples:
- The judges questioned the validity of the test because its steps were not carefully checked.
- Good checking gave the study validity that other work did not have.
