simpleMeaning: a person who acts too fast without thinking, takes big risks, and does not care about danger
  or duty
scope: Also called lunatic, hothead, madcap and swashbuckler; this is a person who acts without thinking
  and loves risk, not a careful person who plans before acting.
examples:
- The daredevil rode his bike down the steep hill at full speed.
- Everyone called Tom a daredevil because he jumped from high rocks into the sea.
