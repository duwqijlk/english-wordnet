simpleMeaning: Any of several winter squash plants that bear large grey-green, football-shaped fruit with
  a rough, warty skin.
scope: Also called hubbard squash; a winter squash plant with large grey-green fruit, not the plant with
  buff-coloured, bottle-shaped fruit.
examples:
- Cucurbita maxima fruit can grow very large.
- They grew Cucurbita maxima for winter squash.
