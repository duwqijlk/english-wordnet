senseId: 'insufficiency%1:26:00::'
synsetId: 14136953-n
simpleMeaning: In pathology, the state in which a body part cannot work in the normal way
scope: This is about a body part that cannot work as it should, not about having too little of something
  in general.
examples:
- The doctor said heart insufficiency was why he got tired so fast.
- Tests showed kidney insufficiency, so the kidneys could not clean the blood well.
