scope: 'Also called law of parsimony, principle of parsimony, and Ockham''s Razor: the rule that things
  should not be made more than need be, a guide for picking the plainest of two rival ideas.'
examples:
- Occam's Razor says to take the plainest idea.
- She used Occam's Razor to pick between the two ideas.
