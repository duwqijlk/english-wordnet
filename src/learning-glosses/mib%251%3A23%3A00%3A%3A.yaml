scope: Also called megabyte, mebibyte, M and MB, this is a measure of how much data, equal to one thousand
  twenty-four kibibytes, not the one-thousand-kilobyte measure.
examples:
- The file was two MiB in size.
- One MiB holds one thousand twenty-four kibibytes.
