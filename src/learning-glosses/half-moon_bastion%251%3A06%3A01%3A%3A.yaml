simpleMeaning: Guns set round a curve could not bring their fire to bear on one point, so this crescent-shaped
  bastion, in use in the 1500s, was given up.
scope: Also called a semi-circular bastion, this crescent-shaped bastion was used in the 1500s but given
  up because guns round a curve could not bring their fire to one point.
examples:
- The half-moon bastion was built in the 1500s.
- Half-moon bastions fell out of favour when guns round a curve could not bring their fire to one point.
