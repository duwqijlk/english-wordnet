simpleMeaning: a happy song, usually sung to mark the birth of Christ
scope: A happy song, usually for the birth of Christ; not the verb sense, which means to sing such songs,
  and not the other noun sense, which is only about a song of faith for the birth of Christ.
examples:
- We sang a carol outside their house at Christmas.
- The children learned a new carol for the school party.
