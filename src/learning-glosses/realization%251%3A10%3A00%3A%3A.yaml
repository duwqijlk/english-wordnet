schema: oewn-learning-gloss-v2
senseId: 'realization%1:10:00::'
synsetId: 07052802-n
simpleMeaning: a piece of music that someone other than the person who first wrote it has finished or
  made richer
scope: This is the finished piece of music itself, not the act of finishing a piece left with few notes,
  not a sale to get money, and not making something seem real.
examples:
- Her realization of the unfinished song was played at the concert.
- The record includes a realization finished by a student of the man who first wrote the music.
