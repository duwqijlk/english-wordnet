senseId: 'metrical_foot%1:10:00::'
synsetId: 07109509-n
simpleMeaning: In prosody, a group of 2 or 3 syllables that forms the basic beat of a poem's rhythm.
scope: In prosody, a group of 2 or 3 syllables that forms the basic beat of a poem's rhythm, also called
  a foot or a metrical unit; not a single syllable and not a whole line of verse.
examples:
- The metrical foot in this line has two syllables.
- Each metrical foot forms the basic beat of the poem's rhythm.
