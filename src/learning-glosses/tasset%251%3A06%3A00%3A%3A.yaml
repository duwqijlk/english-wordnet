simpleMeaning: one of a pair of flat armour plates that hang from the skirt of plates below the chest
  to cover the tops of the legs
scope: 'Also called tasse: one of two plates of armour that hang down to cover the tops of the legs, not
  a full suit of armour and not a shield.'
examples:
- The tasset protected his upper leg in the fight.
- He fastened the tasset below his breastplate.
