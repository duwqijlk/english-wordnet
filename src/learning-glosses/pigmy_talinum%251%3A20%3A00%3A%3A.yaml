simpleMeaning: A low plant of the southwestern United States, with crowded narrow fleshy leaves and fairly
  large deep pink blooms at the leaf joints, seeming to rest on the ground.
scope: It is the low plant of the southwestern United States whose fairly large deep pink blooms seem
  to rest on the ground.
examples:
- The pigmy talinum grew low, its deep pink flowers seeming to rest on the ground.
- We spotted the pigmy talinum by its deep pink flowers and crowded narrow leaves.
