simpleMeaning: In a mix of tiny bits, the substance that the bits of the other thing are spread through
scope: In a mix of tiny bits, the substance that the bits of the other thing are spread through; dispersing
  medium and dispersing phase are other names for this, not the thing spread through and not a plain liquid.
examples:
- The dispersion medium in the fog was air, with tiny drops of water spread through it.
- In the jelly, the dispersion medium held the tiny bits spread through it.
