simpleMeaning: Students doing higher study take this test to show they are good enough to go on.
scope: 'Another name for a prelim and a preliminary exam: a test taken by students doing higher study,
  to show they are good enough to go on; not a school test for children.'
examples:
- He sat his preliminary examination in June.
- The preliminary examination tests whether students are ready to go on.
