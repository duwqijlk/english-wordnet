simpleMeaning: the steel frame of a car or other road vehicle, held up on springs, that holds the body
  and the engine
scope: This is the frame of a vehicle that holds its body and engine; it is not a metal frame that holds
  the parts inside an electronic device.
examples:
- The car's chassis was bent in the crash.
- Workers built the body of the truck on a strong chassis.
