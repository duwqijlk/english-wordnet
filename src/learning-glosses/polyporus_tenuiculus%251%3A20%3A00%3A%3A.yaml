scope: A fungus with a pale cap shaped like a kidney and long small holes, which causes white rot in dead
  hardwoods, not the scaly polypore with a dark cap.
examples:
- The Polyporus tenuiculus grew on dead hardwood with a pale kidney-shaped cap.
- Polyporus tenuiculus causes white rot in the dead wood.
