simpleMeaning: A tiny hole in the skin of a leaf or stem through which gases and water vapour can pass
scope: A tiny hole in the skin of a leaf or stem, also called a pore and a stomate; not a tear in the
  leaf and not a spot of disease.
examples:
- A stoma lets gases pass through the skin of a leaf.
- Each stoma is a tiny hole in a leaf or stem.
