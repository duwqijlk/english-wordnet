simpleMeaning: A front sail set between the outer front sail and the sail on the front stay of a big ship
  with square sails.
scope: A front sail set between the outer front sail and the sail on the front stay of a big ship with
  square sails; not the outer front sail and not the sail on the front stay itself.
examples:
- The crew raised the inner jib as the wind rose.
- The inner jib caught the wind and pulled the ship along.
