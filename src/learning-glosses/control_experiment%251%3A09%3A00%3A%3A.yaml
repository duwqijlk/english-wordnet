simpleMeaning: a test set up to keep outside causes from changing the results of another test
scope: A test that keeps outside causes from changing another test's results; not the main test and not
  a test with no plan.
examples:
- They ran a control experiment to check that heat alone did not change the result.
- The control experiment used plain water while the other test used the new drug.
