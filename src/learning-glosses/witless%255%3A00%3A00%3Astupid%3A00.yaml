simpleMeaning: especially of a person, not able to think clearly or to judge what to do well
scope: Also called senseless. This is about a person who does not think clearly or judge well, not a person
  who is wise or clear in thought.
examples:
- He made a witless choice and gave his money to a stranger.
- The witless remark showed he had not thought at all before speaking.
