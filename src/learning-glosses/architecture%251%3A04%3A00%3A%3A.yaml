simpleMeaning: the job of planning buildings and the places around them, with care for how pleasing they
  will look
scope: This sense is the job of planning buildings. It is not the study of the rules of planning and building,
  not the way a computer is built inside, and not a finished building.
examples:
- He works in architecture, planning new schools and homes.
- After many years in architecture, she opened her own office to plan libraries.
