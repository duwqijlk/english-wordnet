simpleMeaning: a part on a limb of a crab-like animal or another jointed animal with a hard outer shell,
  used to grip things
scope: 'Also called a claw, a pincer or a nipper: a gripping part on a limb, not a whole leg and not a
  tool for cutting.'
examples:
- The crab closed its chela around the shell.
- Each chela of the lobster can grip and hold food.
