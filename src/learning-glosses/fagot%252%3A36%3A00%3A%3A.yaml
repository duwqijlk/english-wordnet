simpleMeaning: To join or trim cloth with an open stitch that holds the pieces apart with small gaps between
  them
scope: 'Also called faggot: to join or trim cloth with an open stitch, not to tie sticks into a bundle.'
examples:
- She fagoted the sleeves of the blouse to join the pieces with an open stitch.
- He fagoted the hem of the curtain to trim it.
