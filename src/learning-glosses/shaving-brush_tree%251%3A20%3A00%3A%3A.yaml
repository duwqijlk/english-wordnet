simpleMeaning: Before the leaves come out, long narrow petals crowd at the ends of the branches of a tree
  of Mexico and Guatemala, on thickly hairy flowers.
scope: A tree of Mexico and Guatemala whose long narrow petals crowd at the ends of the branches before
  the leaves appear.
examples:
- The shaving-brush tree flowered before its leaves came out.
- We saw a shaving-brush tree in flower in Mexico.
