simpleMeaning: a plan or arrangement that people have settled on
scope: This sense is the arrangement itself, not the spoken or written statement of promises, and not
  general harmony between people.
examples:
- Their agreement was to meet at the old bridge at dawn.
- The agreement calls for both teams to share the training ground.
