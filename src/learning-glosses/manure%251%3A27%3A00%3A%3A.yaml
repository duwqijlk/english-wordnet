simpleMeaning: animal or plant matter, most often animal dung with litter mixed in, spread on fields to
  help crops grow
scope: Animal or plant matter spread on fields to help crops grow, not a chemical feed and not the act
  of spreading it.
examples:
- The farmer piled manure by the barn to spread on the fields in spring.
- Fresh manure mixed with straw was dug into the vegetable beds.
