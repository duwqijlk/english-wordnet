simpleMeaning: A rare mallow found only in Illinois, like the common hollyhock, with pale pink-purple
  flowers, sometimes put in the genus Sphaeralcea
scope: A rare Illinois mallow like the common hollyhock; wild hollyhock and Sphaeralcea remota are other
  names for this sense, not a common garden hollyhock or a widespread wild mallow.
examples:
- Iliamna remota grows only in a few places in Illinois.
- Botanists protect Iliamna remota because it is so rare.
