simpleMeaning: A thin skin of body stuff that covers inner organs and other inner faces of the body
scope: This is a thin covering over inner organs and inner body faces; epithelial tissue is another name
  for this sense, not the outer skin and not a muscle or bone covering.
examples:
- The epithelium lining the gut keeps germs out.
- Injury to the epithelium can slow healing inside the body.
