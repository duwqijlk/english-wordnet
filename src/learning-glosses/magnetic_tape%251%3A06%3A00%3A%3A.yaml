simpleMeaning: A strip made to take in sounds and moving pictures and to hold computer information, its
  long thin plastic body covered with a rust-coloured coat
scope: It is also called tape and mag tape, and it names the strip that takes in sounds and pictures for
  later use.
examples:
- He took along a dozen magnetic tapes to record the interview.
- The magnetic tape held the sounds of the concert.
