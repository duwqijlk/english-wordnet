simpleMeaning: On the Pacific coast of northwestern America grows a tall fir with long curving branches
  and deep green leaves.
scope: Also called giant fir, grand fir, and lowland white fir, this is a tall fir of the Pacific coast
  of northwestern America, with long curving branches and deep green leaves.
examples:
- A lowland fir grew on the coast.
- The lowland firs had long curving branches and deep green leaves.
