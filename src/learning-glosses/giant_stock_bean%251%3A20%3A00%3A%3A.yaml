simpleMeaning: A bushy plant of warm South America that lives one year, grows half upright, and bears
  long pods with white seeds, grown above all to feed farm animals.
scope: Also called jack bean and wonder bean, this is a bushy bean plant of warm South America, not a
  bean grown for the table.
examples:
- Giant stock bean pods hang long and full of white seeds.
- Farmers grow giant stock bean to feed their animals.
