simpleMeaning: a thing made by people, especially a car, that has faults and is not good enough
scope: This is a made thing, especially a car, that works badly, not the yellow fruit and not the tree
  or its sour taste.
examples:
- The used car he bought turned out to be a lemon.
- She paid a lot for the phone, but it was a lemon that kept breaking.
