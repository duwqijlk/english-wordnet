simpleMeaning: to run or flow bit by bit, in drops or in a stream that starts and stops
scope: To run or flow bit by bit, in drops or in a stream that starts and stops; also called trickle,
  and filter is another name for this sense; not moving a ball along and not drops of liquid falling.
examples:
- Water dribbled onto the lawn from the broken hose.
- Reports dribbled in all morning.
