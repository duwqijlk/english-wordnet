simpleMeaning: such as a closet or fridge, so deep that a person can step inside it
scope: A closet or fridge deep enough for a person to step inside, not a small cupboard and not a spy
  who defects on their own.
examples:
- The walk-in closet is big enough for me to step inside and hang my coats.
- They kept the milk in a walk-in refrigerator that a worker could enter.
