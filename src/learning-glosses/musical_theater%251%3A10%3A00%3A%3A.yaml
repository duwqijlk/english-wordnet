simpleMeaning: The talk and the doing in a play or film have songs and dancing running through them
scope: 'Also called a musical or a musical comedy: a play or film with songs and dancing mixed through
  the story, not a play or film with no songs and not a show of songs alone.'
examples:
- The new musical theater piece told its story through songs and dancing.
- He works in musical theater, writing songs for plays.
