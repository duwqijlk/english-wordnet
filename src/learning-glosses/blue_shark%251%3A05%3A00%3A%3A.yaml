simpleMeaning: A thin open-sea shark of wide range, with a blue back that fades to a white belly, a danger
  to people most of all after wrecks at sea.
scope: This is a thin open-sea shark with a blue back and a white belly, also called great blue shark;
  not a shark that lives on the sea floor.
examples:
- The blue shark swam past the boat in the open sea.
- A blue shark can be a danger to people after a wreck at sea.
