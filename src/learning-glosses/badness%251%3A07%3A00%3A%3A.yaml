simpleMeaning: how far a person, act, or thing falls below what people expect for right and good behavior
scope: 'Also called bad: this sense is about how far a person, act, or thing falls below what people expect
  for right and good behavior, not about how strong pain or weather is.'
examples:
- The badness of the lie hurt everyone who trusted him.
- She could see the badness in a plan that cheated poor families.
