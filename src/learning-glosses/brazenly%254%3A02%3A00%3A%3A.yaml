senseId: 'brazenly%4:02:00::'
synsetId: 00077214-r
simpleMeaning: in a bold way that shows no shame, with no care for what others think
scope: Done in a bold way with no shame and no care for what others think. It is not a quiet or shy way
  of acting, and not just brave in a good way.
examples:
- He brazenly lied to the teacher in front of the whole class.
- She brazenly took the money and walked out without looking back.
