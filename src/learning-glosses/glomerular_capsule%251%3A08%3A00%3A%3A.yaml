simpleMeaning: a thin double skin round the tiny ball of blood tubes in a kidney unit
scope: A thin double skin round the tiny ball of blood tubes in a kidney unit; capsula glomeruli is another
  name for this sense, not a single skin and not the kidney itself.
examples:
- The glomerular capsule wraps round the tiny ball of tubes.
- Fluid passes through the glomerular capsule into the kidney tubes.
