scope: A church feast day that marks Christ’s presentation in the temple, also called Candlemas Day and
  Feb 2, kept as one of the four quarter days in Scotland.
examples:
- Candlemas falls on February 2 each year.
- The church held a Candlemas service on the quarter day.
