simpleMeaning: the liquid that female mammals make in their mammary glands to feed their young
scope: This is the fluid a mother mammal makes for her young, not the white drink sold as food, not a
  milklike liquid made from plants or nuts, and not the verb for drawing liquid from an animal.
examples:
- The mother's milk provides everything the baby needs.
- Cows produce milk to feed their calves.
