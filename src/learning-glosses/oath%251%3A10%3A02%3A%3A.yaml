senseId: 'oath%1:10:02::'
synsetId: 07241501-n
simpleMeaning: A serious promise about what you will do in the future, usually made by calling on a god
  to witness it
scope: A promise about how you will act in the future, not a promise to tell the truth in court and not
  a rude word said in anger.
examples:
- They took an oath of allegiance to the new king.
- He swore an oath that he would protect the land.
