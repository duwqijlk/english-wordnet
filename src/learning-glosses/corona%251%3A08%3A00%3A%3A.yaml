simpleMeaning: In the body, any part shaped like a crown.
scope: Any body part shaped like a crown, not the ring of light round the sun, not the flower part, and
  not the disease.
examples:
- The corona of the tooth shows above the gum.
- A corona of bone ringed the top of the skull.
