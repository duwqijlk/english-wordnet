simpleMeaning: Marketing is the activity of going to a market to buy things.
scope: 'This is an old-fashioned sense: the errand of shopping at a market, not the modern business of
  promoting and selling products. The phrase ''do the marketing'' survives in British English for grocery
  shopping, though it is now used of any shop rather than only a market. It is not the general sense ''the
  exchange of goods for money''.'
examples:
- In those days the weekly marketing meant a morning among the market stalls.
- She does the marketing early on Saturday, before the stalls get crowded.
