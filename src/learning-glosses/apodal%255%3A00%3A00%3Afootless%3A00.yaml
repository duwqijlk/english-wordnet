simpleMeaning: said of snakes and eels that are born with no feet at all
scope: 'Also called apodous: having no feet by nature, of snakes and eels, not a creature that has lost
  its feet and not a fish with fins in place of feet.'
examples:
- Eels are apodal, with no feet at all.
- The apodal snake moved by sliding along the ground.
