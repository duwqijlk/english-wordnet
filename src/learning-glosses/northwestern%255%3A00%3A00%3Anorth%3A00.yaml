simpleMeaning: placed in, or facing toward, the part of a place that lies between north and west
scope: 'Also called northwest, and another name for it is northwesterly: placed in or facing the part
  between north and west, not the sense about a named area of the United States in the west.'
examples:
- The northwestern corner of the field gets the least sun.
- They built the house with a northwestern door, facing the hills.
