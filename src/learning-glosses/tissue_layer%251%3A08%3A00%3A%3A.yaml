simpleMeaning: A soft, bendy sheet of living stuff that covers, lines, or joins the parts or cells of
  animals or plants
scope: A soft sheet of living stuff that covers or joins body parts; membrane is another name for this
  sense, and not a sheet of paper or a single cell.
examples:
- The tissue layer protects the organs beneath it.
- A tissue layer lines the inside of the organ.
