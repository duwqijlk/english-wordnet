simpleMeaning: the top layer of skin, made of dead cells that fall off
scope: 'Also called the corneum or the horny layer: the top layer of skin, made of dead cells that fall
  off, not the living skin below it.'
examples:
- Dead cells fall off the stratum corneum all the time.
- The stratum corneum is the top layer of skin on your hand.
