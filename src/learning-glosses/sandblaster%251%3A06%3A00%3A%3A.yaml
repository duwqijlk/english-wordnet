simpleMeaning: A tool for cleaning or grinding hard surfaces that throws out a jet of steam carrying fine
  grit
scope: A sandblaster is a tool that cleans hard surfaces with a jet of steam carrying fine grit, the way
  a steam cleaner uses steam alone.
examples:
- The sandblaster cleaned the dirt from the hard floor.
- The sandblaster ground the rough surface down until it was smooth.
