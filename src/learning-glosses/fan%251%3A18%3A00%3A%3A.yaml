simpleMeaning: A person who follows someone or something with strong interest and admiration.
scope: It is not a machine that moves air, but a devoted supporter of a person, team, or activity.
examples:
- Thousands of supporters packed the stadium to see their team play.
- She has read every book by that writer and admires her greatly.
