simpleMeaning: In physics and chemistry, the smallest bit of a chemical element that still acts like that
  element
scope: The smallest piece of an element that keeps its chemical nature, not the everyday sense of a tiny
  bit of anything.
examples:
- An atom of oxygen joins with two atoms of hydrogen to make water.
- The atom is the smallest part of gold that is still gold.
