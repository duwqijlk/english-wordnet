simpleMeaning: A tool for looking at tiny things, with one lens for the thing looked at and one lens for
  the eye, made for seeing with one eye
scope: A tool for looking at tiny things, with one lens for the thing looked at and one lens for the eye,
  made for seeing with one eye; not a tool with two eye lenses and not a telescope.
examples:
- He looked through the monocular microscope with one eye.
- The monocular microscope has one lens for the eye.
