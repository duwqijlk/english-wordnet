simpleMeaning: a long thin piece of metal that carries electricity from one place to another
scope: Metal that carries electricity from place to place, not metal used to hold things together or make
  cages and fences, and not sending a message by cable.
examples:
- A copper wire carries the electricity to the house.
- Do not touch the broken wire on the floor.
