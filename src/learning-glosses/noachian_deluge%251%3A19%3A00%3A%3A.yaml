simpleMeaning: In the Bible, the great flood told of in the Book of Genesis in the time of Noah, sent
  by God on the earth for the bad deeds of people.
scope: In the Bible, the great flood in the time of Noah, also called Noah's flood, Noah and the Flood
  and the Flood; its near kin are the other great floods told of in the Bible.
examples:
- The Noachian deluge covered the earth.
- The Noachian deluge came because of human wickedness.
