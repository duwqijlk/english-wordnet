simpleMeaning: A calming drug that eases worry and loosens tight muscles by boosting the calming action
  of the brain chemical GABA; it can also stop fits caused by nerve poison.
scope: Not Xanax or Librium, other calming drugs; also called diazepam.
examples:
- The doctor gave her Valium for her nerves.
- He took Valium to sleep before the flight.
