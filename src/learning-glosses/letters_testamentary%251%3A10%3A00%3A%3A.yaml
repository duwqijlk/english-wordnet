simpleMeaning: A lawful paper from the court that deals with wills, or from its officer, naming a person
  to carry out a will and giving them the power to do so.
scope: The court that deals with wills gives this lawful paper to the person named to carry a will out.
examples:
- The letters testamentary named him to carry out the will.
- With the letters testamentary, she had the power to carry out the will.
