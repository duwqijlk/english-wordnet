senseId: 'quench%2:30:04::'
synsetId: 00430716-v
simpleMeaning: to weaken the glow of tiny parts of matter that hold extra energy, by adding the right
  substance
scope: To weaken the glow of excited matter by adding a substance; not to stop sparks in a circuit, and
  not to put out a fire.
examples:
- The chemical quenches the glow of the material.
- Adding the substance quenched the light from the sample.
