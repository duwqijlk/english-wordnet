simpleMeaning: a dish, often long and curved, used to hold and pour gravy or other liquid topping for
  food
scope: This is a dish, often long and curved, for serving gravy or sauce, also called a boat, a gravy
  boat, and a gravy holder; not a soup bowl and not a jug for water.
examples:
- She passed the sauceboat so we could pour gravy on our meat.
- He filled the sauceboat with hot gravy for the roast.
