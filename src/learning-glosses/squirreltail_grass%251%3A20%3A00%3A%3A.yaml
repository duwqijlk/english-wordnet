simpleMeaning: A grain prized for its flower heads, with fine long soft hairs, grows in North America
  and the northeast of Asia.
scope: A grain prized for its fine-haired flower heads; foxtail barley and squirreltail barley are other
  names for it, not a grain grown for food.
examples:
- The squirreltail grass grows in North America and the northeast of Asia.
- Its flower heads have fine long soft hairs, and farmers grow squirreltail grass for their beauty.
