simpleMeaning: a person who feels tired and wants to go to sleep
scope: This is a friendly name for a person who feels tired and wants to sleep. It is not a person who
  is already fast asleep.
examples:
- Come on, sleepyhead, it is time to get up.
- The little sleepyhead could hardly keep his eyes open.
