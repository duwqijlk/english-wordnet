simpleMeaning: a computer that controls guns fired at planes in the air and works out where a plane will
  be when a shell gets there
scope: A machine that controls guns fired at planes in the air; it is not facts that help you guess what
  will happen, and not a person who says what will happen.
examples:
- The predictor aimed the guns at the moving plane.
- Soldiers used the predictor to work out where the shell would meet the plane.
