simpleMeaning: Any one of the many water animals with sharp fins that belong to the group Perciformes.
scope: Any one of the many water animals with sharp fins of the group Perciformes, also called a percoid
  and a percoidean, not a soft-finned fish and not a fish with no fins at all.
examples:
- The bass is a percoid fish with sharp fins.
- Many percoid fish live in warm seas.
