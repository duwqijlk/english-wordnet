simpleMeaning: to keep food for a long time by putting it in a salty or sour liquid
scope: To keep food in a salty or sour liquid so it lasts; not the food itself kept that way, often cucumbers,
  which is the noun sense.
examples:
- She pickled the onions in a sour liquid for the winter.
- They pickle cabbage in salty water to keep it for months.
