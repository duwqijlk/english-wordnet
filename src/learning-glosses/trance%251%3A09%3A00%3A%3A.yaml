simpleMeaning: a state of mind in which you are only dimly aware of things, and you act little or not
  at all, much like being in a deep sleep
scope: A dream-like state with only faint awareness, not the music style and not the state brought on
  by a magic spell.
examples:
- She fell into a trance and did not hear us call.
- The trance left him still and quiet for hours.
