simpleMeaning: to make a low, shaking sound that shows a cat is happy
scope: To make the low shaking sound that shows a cat is happy; not the sound itself, which is the noun
  sense of the word.
examples:
- The cat purred loudly as the girl stroked its back.
- Lying in the sun, the old cat purred with pleasure.
