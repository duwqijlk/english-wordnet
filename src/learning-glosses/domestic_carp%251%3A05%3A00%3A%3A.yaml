simpleMeaning: this big Asian freshwater fish, brought to Europe, feeds on the bottom of ponds and slow
  streams, often raised for food, and is now a pest in the United States
scope: A large food fish brought from Asia to Europe and now a pest in the United States, not a goldfish
  and not a koi.
examples:
- The domestic carp stirred up mud as it fed on the bottom of the pond.
- Farmers raise domestic carp for food in ponds across Europe.
