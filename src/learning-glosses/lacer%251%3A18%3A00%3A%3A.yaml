simpleMeaning: A worker who threads string through shoes, footballs, or books when they are bound
scope: A worker who threads string through shoes, footballs or books, not a person who makes the shoes
  and not a person who binds books by sewing pages.
examples:
- The lacer pulled the string tight on the new football.
- As a lacer, he spent his days threading string through shoes.
