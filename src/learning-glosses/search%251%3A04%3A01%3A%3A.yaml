simpleMeaning: The act of getting onto a ship far out from land and inspecting it.
scope: 'Maritime boarding sense: a legal inspection of a vessel on the open sea. Distinct from search%1:04:00
  (the everyday act of looking thoroughly for something), search%1:04:02 (an investigation that seeks
  answers), search%1:22:00 (a computing operation testing items for a property), search%1:09:00 (weighing
  rival hypotheses); from the verbs search%2:35:00 (trying to find or discover something), search%2:39:00
  (going to seek something), search%2:31:00 (inquiring into a matter), and especially search%2:35:01 (putting
  a person or place through an examination).'
examples:
- The navy invoked its right of search over the foreign ship.
- The captain submitted to a search of his vessel at sea.
