simpleMeaning: to do with plans made to win a fight or game or to reach a goal
scope: This is about plans made to win or reach a goal, not about one long plan for a whole war and not
  about taking care not to hurt people's feelings.
examples:
- Moving the soldiers at night was a tactical choice that helped them win the fight.
- She made a tactical plan to win the game by taking the middle squares first.
