simpleMeaning: Facts about the weather are written down at one of a set of places
scope: One place in a set of places that record facts about the weather, not a single weather station
  on its own and not a place that makes weather forecasts.
examples:
- The meteorological observation post sends its readings to the weather office each hour.
- A new meteorological observation post was set up on the hill to record rain and wind.
