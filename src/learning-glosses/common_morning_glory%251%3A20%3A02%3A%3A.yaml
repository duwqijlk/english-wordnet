senseId: 'common_morning_glory%1:20:02::'
synsetId: 12847828-n
simpleMeaning: The kind people grow most often, a climbing herb of Central America that lives one year
  or for many years and has sky-blue flowers.
scope: This is the Central American kind with sky-blue flowers that people grow most often, not the wide-flowered
  kind that lives one year and grows in warm lands all round the world.
examples:
- The common morning glory had sky-blue flowers.
- This common morning glory grows in Central America.
