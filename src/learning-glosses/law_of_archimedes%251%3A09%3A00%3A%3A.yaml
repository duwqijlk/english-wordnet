simpleMeaning: In hydrostatics, the seeming loss of weight of a body put in a fluid is the same as the
  weight of the fluid it pushes aside.
scope: In hydrostatics, the seeming loss of weight of a body put in a fluid, also called Archimedes' principle;
  its near kin are other rules of hydrostatics.
examples:
- The law of Archimedes tells us the loss of weight in a fluid.
- A stone in water loses as much weight as the water it pushes aside, as the law of Archimedes says.
