simpleMeaning: This word is used of the sea where the water is less than 200 metres deep, over the sea
  floor that runs out from the land
scope: Said of the sea over the sea floor near the land, where the water is less than 200 metres deep;
  not the deep sea, and not the shallow water right by the coast.
examples:
- Neritic waters are home to many kinds of fish.
- The company drills for neritic oil.
