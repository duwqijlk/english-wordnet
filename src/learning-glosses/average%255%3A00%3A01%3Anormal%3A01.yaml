simpleMeaning: Of or being the middle value in an ordered list, or the mean of the two middle values when
  the list has an even count.
scope: This is the middle value of an ordered set (or the mean of the two middle values when the count
  is even), not the value that occurs most often, not the value close to the statistical norm, not the
  everyday sense of ordinary or unremarkable, and not a noun or verb use.
examples:
- The average of 3, 7, and 10 is 7, the middle number once they are in order.
- With an even number of scores, the average is the mean of the two middle ones.
