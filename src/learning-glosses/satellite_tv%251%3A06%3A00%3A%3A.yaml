simpleMeaning: A television system in which the signal goes up to a craft in orbit and comes back down
  to earth after being made stronger.
scope: Also called satellite television; a television system that sends its signal up to a craft in orbit,
  not a system that sends its signal along wires.
examples:
- We watch the news on satellite TV.
- Satellite TV brings the signal back down to earth.
