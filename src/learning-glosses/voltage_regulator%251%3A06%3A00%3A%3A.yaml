simpleMeaning: a device that changes electric power from one level to another and lets the level be set
scope: A device that sets the level of electric power, not a device that only makes power and not a fixed
  transformer with one set level.
examples:
- The voltage regulator kept the output steady when the input changed.
- An engineer fitted a voltage regulator to the old transformer.
