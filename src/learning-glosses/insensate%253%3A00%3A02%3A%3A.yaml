senseId: 'insensate%3:00:02::'
synsetId: 00118565-a
simpleMeaning: having no feeling, not knowing what is around, and no life or movement
scope: This sense is about a thing with no feeling, not knowing what is around and with no life, not about
  a person who is cruel or does not care about others.
examples:
- The insensate stone lay cold and still on the ground.
- After the fall, he lay insensate on the floor, not moving at all.
