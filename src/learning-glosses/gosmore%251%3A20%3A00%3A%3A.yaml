simpleMeaning: Leaves shaped like cat ears and yellow flower heads mark a weed from Europe, now growing
  wild all over North America.
scope: Also called capeweed and cat's-ear, this is a European weed now wild in North America, not a garden
  flower grown for show.
examples:
- Gosmore grew along the edge of the field.
- The gosmore in the yard had bright yellow flower heads.
