simpleMeaning: an amount put in to fill a gap or make up what is missing
scope: An amount added to make up what is missing; not an added part that makes a thing work better, and
  not the act of adding.
examples:
- She took a vitamin supplement every morning.
- The grant was a supplement to his small pay.
