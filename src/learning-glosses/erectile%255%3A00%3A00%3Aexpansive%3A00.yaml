simpleMeaning: Able to swell up and grow stiff as blood fills it, because it is full of tiny spaces that
  hold blood.
scope: Also called cavernous, this is tissue that can swell and grow stiff when blood fills it.
examples:
- The tissue was erectile, swelling and stiffening as blood filled it.
- The organ was erectile, growing stiff when filled with blood.
