simpleMeaning: a unit for weighing pearls or diamonds, equal to 50 mg or 1/4 carat
scope: A unit for weighing pearls or diamonds, not the other weight units also called grain and not a
  tiny piece of sand or sugar.
examples:
- This pearl weighs ten grains.
- The diamond was measured at twenty grains.
