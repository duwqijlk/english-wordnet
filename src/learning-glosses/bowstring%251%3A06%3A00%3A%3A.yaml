simpleMeaning: The cord pulled back to shoot an arrow from a bow.
scope: This is the cord of a bow used for shooting arrows; not the string of a musical instrument, and
  not the bow itself.
examples:
- He fitted a new bowstring to his bow before the contest.
- The bowstring snapped as she drew the arrow back.
