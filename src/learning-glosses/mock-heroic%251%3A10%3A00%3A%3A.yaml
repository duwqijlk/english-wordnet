simpleMeaning: A poem that copies the grand style of old poems about great fighters in order to make fun
  of it
scope: A poem that copies grand old verse to make fun of it, not a true hero poem and not a plain joke.
examples:
- His mock-heroic poem treated a trip to the shops like a great battle.
- She wrote a mock-heroic verse about the school sports day.
