simpleMeaning: to give money to a good cause or service, above all at set times again and again
scope: Giving money to a good cause, above all at set times; not the promise itself and not tying someone
  to a promise.
examples:
- She pledged money each month to the children's home.
- He pledged a sum to the library fund every year.
