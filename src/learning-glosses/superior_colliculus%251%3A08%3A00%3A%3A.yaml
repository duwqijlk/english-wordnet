simpleMeaning: a key part of the brain for sight that sits between the back of the eye and the sight area
  of the brain
scope: This is a key part of the brain for sight between the back of the eye and the brain's sight area,
  not the eye itself and not the sight area at the back of the brain.
examples:
- Signals pass through the superior colliculus on their way from the eye to the sight area of the brain.
- Damage to the superior colliculus can harm sight even when the eye still works.
