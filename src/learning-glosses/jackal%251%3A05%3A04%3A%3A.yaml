simpleMeaning: a wild dog-like animal that lives in the dry lands of North Africa, kin to the golden kind
  and the grey wolf
scope: A wild dog-like animal that lives in the dry lands of North Africa, kin to the golden jackal and
  the grey wolf; not the night kind of the Old World and not the golden-coated kind.
examples:
- A jackal crossed the dry plain of North Africa at dusk.
- The jackal of the northern deserts hunts alone.
