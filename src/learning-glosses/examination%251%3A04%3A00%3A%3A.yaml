simpleMeaning: A close, careful check of something, such as seeing if there are mistakes in it
scope: This is looking at something closely to check it, not a set of test questions and not a careful
  look at your own sense of right and wrong.
examples:
- A close examination of the letter showed a mistake in the date.
- After an examination of the machine, she found the broken part.
