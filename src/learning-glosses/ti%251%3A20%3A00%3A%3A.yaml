simpleMeaning: A tropical shrub from southeastern Asia, Australia and Hawaii, with tufts of long leaves
  at branch ends used locally for thatching and clothing, and thick sweet edible roots.
scope: This is the tropical shrub grown for its leaves and sweet roots; not the musical note ti of solmization,
  and not the tea bush.
examples:
- Hawaiians traditionally used ti leaves to wrap food.
- A ti shrub can be recognised by the tuft of long leaves at the top.
