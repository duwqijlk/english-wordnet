simpleMeaning: showing poor judgment, a failure to notice what is happening, and little skill in saying
  or doing the right thing
scope: 'Also called inept: this sense shows poor judgment and a failure to notice things, not the sense
  about being unkind or not right in dealing with people.'
examples:
- His tactless comment showed he had not noticed how upset she was.
- It was a tactless choice of words that showed poor judgment.
