simpleMeaning: the breaking down of larger stuff in living things into smaller stuff, with energy set
  free
scope: The breaking down of larger stuff in living things into smaller stuff, with energy set free, with
  catabolism, dissimilation and katabolism as other names for this sense, and not the building up of stuff
  or the breakdown of dead things.
examples:
- Destructive metabolism breaks down food and sets free energy.
- During exercise, destructive metabolism works hard in the muscles.
