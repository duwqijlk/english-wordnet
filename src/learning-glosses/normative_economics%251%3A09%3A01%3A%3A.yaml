simpleMeaning: This part of the study of the economy judges what is fair and what the outcome of the economy
  and the aims of public plans ought to be.
scope: It is the judging part of the study of the economy, not the part that only describes what happens.
examples:
- In normative economics, the question is whether a tax is fair.
- The debate used normative economics to argue about what public plans ought to aim for.
