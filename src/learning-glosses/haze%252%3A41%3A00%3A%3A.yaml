simpleMeaning: to treat someone badly by making them do tasks that shame them or cause them pain, as in
  military schools and other military groups
scope: This is troubling someone by making them do tasks that shame them or cause them pain, as in military
  groups; not mist or dust in the air, not unclear thinking, and not becoming cloudy.
examples:
- Older soldiers hazed the new men by making them clean the floors all night.
- He was hazed at the army school with painful tasks meant to shame him.
