simpleMeaning: A kind of heat meter that measures heat sent out as rays, made of several heat-to-power
  joints joined in a row
scope: This is a heat meter made of several joints in a row; not a thermometer for air temperature and
  not a single heat sensor.
examples:
- The thermopile measures heat sent out as rays.
- A thermopile of several joints in a row stood on the bench.
