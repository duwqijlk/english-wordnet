senseId: 'vena_pulmonalis_superior%1:08:00::'
synsetId: 05385997-n
simpleMeaning: Either of two lung blood tubes, left and right, that carry blood back from the upper parts
  of the lungs.
scope: One of two lung blood tubes carrying blood back from the upper lungs; superior pulmonary vein is
  another name for this sense; not a tube from the lower lungs and not a tube from the heart.
examples:
- The vena pulmonalis superior returns blood from the upper lobes of the lungs.
- The vena pulmonalis superior joins the left side of the heart.
