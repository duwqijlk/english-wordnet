simpleMeaning: a container that holds a thing under pressure and lets it out as a fine mist, often by
  means of a gas that pushes it out
scope: 'Also called aerosol, aerosol bomb, aerosol can and aerosol container: a container that lets out
  a fine mist, not a plain bottle and not a pump that gives out a stream.'
examples:
- She shook the spray can before she used it.
- The spray can let out a fine mist of paint.
