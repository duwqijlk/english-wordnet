senseId: parochial%5:00:00:provincial:00
synsetId: 00640125-s
simpleMeaning: Seeing only what is close at hand, with a narrow view of the world.
scope: Also called insular; narrow in outlook and scope, not to do with a parish.
examples:
- His parochial views left him blind to the wider world.
- The town's parochial outlook kept it cut off from new ideas.
