simpleMeaning: A shift in the skin's electric traits under strain or worry, read either by noting the
  skin's electric push-back or by noting faint flows made by the body.
scope: Also called electrical skin response, electrodermal response, and galvanic skin response, it is
  a shift in the skin's electric traits under strain or worry, read either by noting the skin's electric
  push-back or by noting faint flows made by the body.
examples:
- A psychogalvanic response shows under strain.
- Psychogalvanic responses are read by noting the skin's push-back.
