senseId: 'contaminant%1:27:00::'
synsetId: 14846154-n
simpleMeaning: a thing in something else that makes that thing dirty or not pure
scope: This is a thing in something else that makes it dirty or not pure; contamination is another name
  for this sense. Not a clean part that belongs in the thing.
examples:
- Lead is a harmful contaminant in drinking water.
- Workers tested the soil for contaminants from the old factory.
