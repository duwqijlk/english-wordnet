simpleMeaning: a scientist who studies living things and how they are linked to the world around them
scope: A scientist who studies living things and the world they live in; not a scientist who studies only
  one plant or animal on its own.
examples:
- The ecologist studied how fish and plants live together in the river.
- An ecologist warned that cutting the trees would harm the birds that live there.
