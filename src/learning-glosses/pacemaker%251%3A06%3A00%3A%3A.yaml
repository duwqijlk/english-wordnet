simpleMeaning: A machine put inside the chest that does the work of the heart's own beat-setter.
scope: A machine put inside the chest that does the work of the heart's own beat-setter, not the bit of
  heart tissue that sets the heartbeat itself.
examples:
- The pacemaker kept her heartbeat steady after the operation.
- His pacemaker sends small pulses to the heart when it beats too slowly.
