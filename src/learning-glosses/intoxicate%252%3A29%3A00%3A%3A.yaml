simpleMeaning: for a drug, to have an effect on a person that changes how they feel and think
scope: This is what a drug does to a person, not making someone drunk on alcohol and not filling someone
  with high spirits.
examples:
- The strong drug began to intoxicate him within minutes.
- The medicine can intoxicate patients if the dose is too high.
