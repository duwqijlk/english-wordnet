simpleMeaning: a hollow container that liquid is poured into so it takes a set shape as it hardens
scope: 'Also called a cast: a hollow container for shaping liquid as it hardens, not the fungus, not the
  soil, not a shaped dish, and not the verbs.'
examples:
- She poured the jelly into a mold.
- The mold gave the soap its round shape.
