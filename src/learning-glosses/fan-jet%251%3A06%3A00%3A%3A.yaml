senseId: 'fan-jet%1:06:00::'
synsetId: 03326048-n
simpleMeaning: An engine in which a spinning set of blades, driven by a turbine, sends extra air to the
  burner and gives extra push.
scope: An engine in which a spinning set of blades driven by a turbine sends extra air to the burner for
  extra push, also called turbofan, fanjet and fanjet engine; not a plain engine without such blades and
  not a propeller engine.
examples:
- The fan-jet gave the plane extra thrust on take-off.
- A fan-jet uses a turbine-driven fan to push extra air into the burner.
