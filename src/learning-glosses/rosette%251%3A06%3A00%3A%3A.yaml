simpleMeaning: a thing worn to show a job or an honor won, or a pattern like this, both made in the shape
  of a rose
scope: This is a worn thing or pattern in the shape of a rose, not the same word for a round group of
  plant leaves close to the ground.
examples:
- She wore a rosette on her coat after she won the prize.
- The rosette on his jacket showed his high office.
