senseId: 'surround%2:33:01::'
synsetId: 01133033-v
simpleMeaning: to put a wall around a place so it is better protected
scope: Building a protective wall around a place, not merely being on every side of it or closing in to
  force surrender; the verbs wall, fence, palisade and fence in are other names for this sense.
examples:
- The villagers surrounded the town with a high stone wall.
- They surrounded the castle with a wall to keep attackers out.
