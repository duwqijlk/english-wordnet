simpleMeaning: having parts that go well together and make a pleasing whole
scope: 'Also called consonant: this sense means parts go well together in a pleasing way, not one tone
  in a set of musical tones and not the study of how musical sounds are made.'
examples:
- The singers made a rich, harmonic sound together.
- Their voices were harmonic, each part fitting well with the others.
