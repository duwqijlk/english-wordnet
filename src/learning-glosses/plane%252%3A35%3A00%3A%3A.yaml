simpleMeaning: to cut off or remove thin strips of material with a carpenter's smoothing tool
scope: This is cutting material away, not making a surface smooth and level, and not the aircraft.
examples:
- He planed away a thin layer from the top of the board.
- The joiner planed off the rough corner of the plank.
