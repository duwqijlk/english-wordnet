senseId: 'pluralism%1:14:00::'
synsetId: 08384610-n
simpleMeaning: A society in which many different kinds of people are let live as they wish
scope: A society that lets many different kinds of people live as they wish, not a society that forces
  all to live one way and not rule by one group alone.
examples:
- Pluralism lets people of many faiths live side by side in the town.
- The country prides itself on pluralism and the mix of cultures in its cities.
