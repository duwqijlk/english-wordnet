simpleMeaning: In Judaism, a holy day on the 22nd or 23rd of Tishri, marking the end of the year's cycle
  of readings from the holy book
scope: Also called Rejoicing in the Law, Rejoicing of the Law, Rejoicing over the Law, Shimchath Torah,
  Simchas Torah, Simhat Torah, and Simhath Torah; the Jewish holy day that ends the year's cycle of readings.
examples:
- Simchat Torah falls on the 22nd or 23rd of Tishri.
- On Simchat Torah the last reading of the year is finished.
