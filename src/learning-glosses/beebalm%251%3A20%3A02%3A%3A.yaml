simpleMeaning: An east North American herb that lives many years, sweet-smelling, with blooms shaped like
  tubes in many hues, packed in crowded bright heads.
scope: This sense is also called bee balm, bergamot mint, and oswego tea, an east North American herb
  that lives many years, sweet-smelling, with blooms shaped like tubes in many hues, packed in crowded
  bright heads, unlike the sense for a bushy long-lived Old World mint having small white or yellowish
  flowers and fragrant lemon-flavored leaves, a garden escapee in northern Europe and North America.
examples:
- Beebalm smells sweet in the garden.
- The beebalm bears tube-shaped blooms.
