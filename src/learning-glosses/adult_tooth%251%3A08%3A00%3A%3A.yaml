simpleMeaning: One of the 32 hard white mouth parts that take the place of a child's first set and may
  last a whole life.
scope: One of the 32 hard mouth parts that take the place of a child's first set, also called a permanent
  tooth; not a child's first tooth and not a false tooth.
examples:
- Her adult tooth came through where the milk tooth had been.
- An adult tooth should last until old age if it is cared for.
