simpleMeaning: 'An orchid in the genus Pholidota: its many white-to-brown blooms curl along a twisting
  spike like a rattlesnake''s tail, each tucked behind a slightly puffed leaf-like bract.'
scope: An orchid named for its coiled flower spike; it is not the rattlesnake plantain, a different orchid
  with mottled leaves, and it has nothing to do with snakes beyond the likeness.
examples:
- A rattlesnake orchid hung from the greenhouse roof, its spiral of flowers coiling downward.
- The rattlesnake orchid's blooms open white and fade to brown along the spike.
