simpleMeaning: The United States government has a group on its own that sorts the mail and brings it to
  people and firms in the United States.
scope: Also called US Postal Service and USPS, this is a group on its own in the United States government
  that sorts the mail and brings it to people and firms, not the Post Office, which delivers mail and
  at times phone and radio messages.
examples:
- He works for the United States Postal Service.
- The United States Postal Service sorts the mail and delivers it to firms.
