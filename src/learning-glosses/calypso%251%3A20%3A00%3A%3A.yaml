simpleMeaning: A rare orchid of cool northern bogs, with one white-to-pink flower tipped with purple on
  an upright reddish stem above a single leaf at the base.
scope: A rare northern bog orchid with a single purple-tipped flower; not the Caribbean song style, and
  not the sea nymph of Greek myth.
examples:
- Calypso grows in cool northern bogs and is easily overlooked.
- A lone calypso stood on the moss, its white flower tipped with purple.
