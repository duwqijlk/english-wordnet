simpleMeaning: Firms whose credit is in doubt sell this risky promise to pay, rated BB or lower, to fund
  takeovers bought with borrowed money and other takeovers too.
scope: Also called high-yield bond, it is a low-rated promise to pay sold by a firm whose credit is in
  doubt, not a safe bond from a sound firm.
examples:
- The firm sold junk bonds to fund the takeover.
- Investors bought the junk bond despite its low rating.
