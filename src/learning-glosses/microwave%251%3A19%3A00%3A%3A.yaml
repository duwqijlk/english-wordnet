simpleMeaning: A short wave of electric and magnetic power, longer than heat waves but shorter than radio
  waves, used for radar, ovens, and sending phone calls, faxes, pictures, and data.
scope: A short wave of electric and magnetic power used for radar and sending signals, not the kitchen
  box that cooks food and not the act of heating in one.
examples:
- Microwaves carry the phone signal across the valley.
- Radar works by sending out microwaves.
