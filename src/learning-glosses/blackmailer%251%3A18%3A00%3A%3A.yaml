simpleMeaning: a person who breaks the law by forcing someone to pay money, by saying they will tell others
  a secret that will shame that person
scope: A person who gets money by threats about a shameful secret, not a thief who steals things and not
  a person who asks for a loan.
examples:
- The blackmailer asked for money and said he would share her secret photos.
- Police caught the blackmailer who had forced a rich man to pay.
