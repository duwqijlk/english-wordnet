synsetId: 07429767-n
simpleMeaning: In astronomy, two or more bodies in the sky seem to meet or pass at the same point in the
  zodiac, the ring of star signs in the sky
scope: 'Also called alignment: bodies in the sky seeming to meet or pass, not a joining word such as ''and''
  and not the link that such a word makes between words or parts of sentences.'
examples:
- The conjunction of Mars and Venus was easy to see last night.
- Astronomers watched the close conjunction of the two planets.
