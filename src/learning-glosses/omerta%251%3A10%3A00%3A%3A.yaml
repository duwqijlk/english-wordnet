simpleMeaning: A refusal to tell the police about crimes, and a rule of silence kept by the Mafia, a secret
  criminal group
scope: A rule of silence kept by a criminal group and a refusal to tell the police about crimes, not a
  law and not a simple refusal to talk.
examples:
- Omerta kept the witnesses from talking to the police.
- He lived by omerta and said nothing about the gang's crimes.
