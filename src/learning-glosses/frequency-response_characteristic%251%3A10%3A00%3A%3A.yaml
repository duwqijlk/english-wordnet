simpleMeaning: At each pitch, this drawing from electronics shows how strong a signal stays, with its
  strength set out against the pitch.
scope: Also called a frequency-response curve, this names the drawing in electronics that sets the strength
  of a signal against its pitch.
examples:
- The engineer drew a frequency-response characteristic for the new speaker.
- A frequency-response characteristic shows where the sound grows weak.
