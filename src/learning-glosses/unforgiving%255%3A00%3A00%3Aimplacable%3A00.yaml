simpleMeaning: not able to be calmed or softened, or moved by begging
scope: 'Also called grim, stern, relentless, unrelenting, inexorable and unappeasable: not able to be
  calmed or moved by begging. Not the sense of a person who will not forgive or show mercy.'
examples:
- The unforgiving enemy would not listen to any begging for peace.
- She faced an unforgiving fate, and no begging could change it.
