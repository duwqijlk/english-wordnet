simpleMeaning: able to be bent in different ways or twisted without breaking
scope: 'Also called waxy, pliant, and bendable: able to be bent or twisted without breaking, not the sense
  about being shaped or pulled out into a new form.'
examples:
- The pliable wire can be bent round the post again and again.
- Young, pliable branches twist in the wind but do not break.
