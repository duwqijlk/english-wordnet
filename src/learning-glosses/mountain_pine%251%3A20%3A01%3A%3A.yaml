simpleMeaning: a low bushy tree of central Europe with short bright green needle leaves in pairs
scope: 'Also called a dwarf mountain pine, a mugho pine, or a mugo pine: a low bushy tree of central Europe
  with short bright green needle leaves in pairs; not the tall pine of western North America.'
examples:
- The mountain pine grows low on the rocky slopes.
- Mountain pine has short bright green needles in pairs.
