simpleMeaning: With purple, pink or white flowers, it is a plant that climbs and lives year after year,
  growing in central and southern Europe, now at home in North America.
scope: Also called broad-leaved everlasting pea, it is the plant that climbs and lives year after year,
  with purple, pink or white flowers, now at home in North America.
examples:
- Perennial pea grows in southern Europe.
- The perennial pea has purple flowers.
