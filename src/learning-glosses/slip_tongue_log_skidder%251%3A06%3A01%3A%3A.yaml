simpleMeaning: People dragged felled trees in the 1800s and early 1900s with this machine, whose tongs
  hung between its rolling wheels and raised one end off the ground.
scope: Also called slip-tongue log skidder and slip-tongue wheels, this machine lifts one end of a log
  with hanging tongs, not the whole log at once.
examples:
- The slip tongue log skidder lifted one end of the log with its dangling tongs.
- Workers in the 1800s used a slip tongue log skidder to drag logs.
