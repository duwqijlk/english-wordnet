simpleMeaning: Working with claims as whole units, joining them and linking them with words like and,
  or and if, this is one part of the study of reasoning with signs
scope: Also called propositional logic, this is one part of the study of reasoning with signs, working
  with whole claims and the words that link them.
examples:
- In propositional calculus, the claim 'it rains' can be joined to 'the ground is wet' with the word if.
- She used propositional calculus to check whether two claims joined by and could both be true.
