simpleMeaning: Fallen or rotted bits of a ruined monument are put back together, with new stuff added
  when it is needed, in the study of old things.
scope: In the study of old things, a ruined monument is put back together from its fallen or rotted bits,
  with new stuff added when needed.
examples:
- The anastylosis put the fallen stones back into the ruined monument.
- Anastylosis added new stuff only when the old bits could not be used.
