simpleMeaning: A crystal that shows one colour from one side and a different colour from another side
scope: A crystal that changes colour as you turn it, not a stone that is one colour all through and not
  a trick of the light.
examples:
- The dichroism of the gem made it look green from one side and blue from the other.
- He turned the crystal to show its dichroism.
