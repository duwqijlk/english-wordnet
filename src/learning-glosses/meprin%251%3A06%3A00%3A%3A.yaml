simpleMeaning: A drug that calms and soothes, sold under the trade names Miltown and Equanil, used to
  ease tense muscles and worry.
scope: This is a drug that calms and soothes, used to ease tense muscles and worry; meprobamate, Equanil
  and Miltown are other names for this sense.
examples:
- The doctor gave her Meprin for her tense muscles.
- Meprin helped him sleep through the worry of the night.
