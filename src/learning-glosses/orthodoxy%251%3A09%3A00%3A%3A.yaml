simpleMeaning: a belief or way of thinking that follows the ideas and rules that most people accept
scope: The belief or way of thinking itself that follows widely accepted ideas, not the quality of holding
  such beliefs, especially in religion.
examples:
- In those days, questioning the old orthodoxy about work was not welcome.
- He left the group because he could not agree with its orthodoxy on how to teach children.
