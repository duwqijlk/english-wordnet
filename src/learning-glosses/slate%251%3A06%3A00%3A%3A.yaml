simpleMeaning: a flat board made of rock that splits into thin layers, used in the past for writing on
scope: A writing board used in the past; not the thin pieces of rock used on roofs, and not a list of
  people put forward for an election.
examples:
- In the old school, each child wrote on a small slate.
- She wiped her slate clean and wrote the sum again.
