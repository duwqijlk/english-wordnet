simpleMeaning: A small lizard of warm Asia whose thin skin flaps on each side of its body open out so
  it can glide through the air, one of several kinds.
scope: This lizard is also called a flying lizard and a dragon, and it glides on thin skin flaps on each
  side of its body, not on wings.
examples:
- The flying dragon spread the thin flaps on its sides and glided through the air.
- We saw a flying dragon glide through the air.
