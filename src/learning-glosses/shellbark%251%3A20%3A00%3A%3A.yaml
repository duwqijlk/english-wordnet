simpleMeaning: Long strips of loose grey peel hang from this North American hickory, whose nuts can be
  eaten.
scope: Also called shagbark, shagbark hickory and shellbark hickory, it is a nut tree with loose grey
  bark in long strips, not a smooth-barked kind.
