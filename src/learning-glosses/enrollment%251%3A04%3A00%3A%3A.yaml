simpleMeaning: the act of joining something by giving your name so it can be put on its list
scope: This act of signing up is also called enrolment. It is not the group of people who have signed
  up at the same time.
examples:
- Enrollment for the new course starts next week.
- She finished her enrollment at the college this morning.
