simpleMeaning: 'about a clear liquid used in science, called ether: holding some of it, or mixed into
  it so it spreads out in it'
scope: In science, this sense is about ether, a clear liquid used in science; it is not the sense that
  means very light and fine, as if not of this world.
examples:
- The lab made an ethereal solution by mixing the powder into ether.
- They tested the ethereal mixture, which had ether in it.
