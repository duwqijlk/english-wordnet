simpleMeaning: In chemistry, the splitting of one thing into two or more things that may be different
  from each other and from the first thing
scope: In chemistry, this sense, also called breakdown, chemical decomposition reaction and decomposition
  reaction, is about one thing splitting apart; it is not the rotting or decay of dead plants or animals.
examples:
- The decomposition of water can produce hydrogen and oxygen.
- In the lab, we studied the decomposition of the compound into simpler substances.
