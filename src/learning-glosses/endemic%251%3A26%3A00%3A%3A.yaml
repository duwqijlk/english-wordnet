senseId: 'endemic%1:26:00::'
synsetId: 14097876-n
simpleMeaning: a disease that is always present, in a larger or smaller amount, in a certain group of
  people or in people living in a certain place
scope: The disease itself, named as a thing; not the describing word for such a disease, and not a new
  disease that spreads suddenly to many people at once.
examples:
- Malaria is an endemic in that warm, wet region.
- Doctors there treat the endemic all year, as it never fully goes away.
