simpleMeaning: A person who first took the Christian faith to a people, or an important early teacher
  of that faith
scope: 'Also called an Apostle: an important early teacher of the Christian faith or one who first took
  it to a people, not a later church leader and not an ordinary preacher of today.'
examples:
- An Apostolic Father carried the faith to a people who had never heard it.
- The Apostolic Father taught the new Christians in the city.
