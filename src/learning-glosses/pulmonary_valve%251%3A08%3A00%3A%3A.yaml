simpleMeaning: blood is stopped from flowing back into the heart by this half-moon-shaped flap between
  the lower right room of the heart and the blood tube to the lungs
scope: This half-moon-shaped flap keeps blood moving one way, out of the heart and into the blood tube
  to the lungs.
examples:
- Blood passed through the pulmonary valve on its way to the lungs.
- The pulmonary valve sits between the right side of the heart and the lungs.
