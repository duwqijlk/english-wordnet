scope: This is one of many trees or shrubs of one group, with leaves made of small leaflets and usually
  yellow flowers followed by long seed pods, not the Chinese tree whose bark gives a lesser cinnamon.
examples:
- The cassia was covered in yellow flowers.
- The long seed pods of the cassia hung from its branches.
