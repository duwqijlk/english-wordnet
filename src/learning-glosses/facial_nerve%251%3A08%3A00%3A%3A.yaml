simpleMeaning: One of the cords of the head that carries signals to the muscles of the face.
scope: A cord of the head that carries signals to the muscles of the face, also called the facial and
  the nervus facialis; not a cord that moves the jaw and not a cord for hearing.
examples:
- Damage to the facial nerve can freeze one side of the face.
- The facial nerve carries signals to the muscles of the face.
