simpleMeaning: A line that bends sharply at one point after a loop in the line is pulled tight
scope: 'Also called twist: a sharp bend in a line made by pulling a loop tight; not the act of turning
  or spinning round.'
examples:
- Pulling the rope tight left a twirl in it.
- A sharp twirl formed in the line when he pulled the loop hard.
