simpleMeaning: a way of making music where two or more tunes are played or sung at the same time
scope: This is a form of music with two or more tunes at the same time. It is not the act of writing music
  in this way, and not a single tune alone.
examples:
- The song uses counterpoint, with two different tunes sounding together.
- She studied counterpoint to learn how tunes can fit together at the same time.
