simpleMeaning: A thing that sends a show of fire and light high into the sky
scope: 'Also called skyrocket: this one makes a show of fire and light in the sky, not a space vehicle,
  not its engine, and not a signal tool for saving lives.'
examples:
- A rocket burst high above the park in red and gold light.
- Children watched as each rocket sent sparks across the night sky.
