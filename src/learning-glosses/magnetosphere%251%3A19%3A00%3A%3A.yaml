simpleMeaning: the space round a planet where small charged bits answer to the planet's pull more than
  to the pull of the sun
scope: The space round a planet where the planet's own pull rules, rather than the pull of the sun.
examples:
- Tiny charged bits move in the magnetosphere.
- The magnetosphere surrounds the planet.
