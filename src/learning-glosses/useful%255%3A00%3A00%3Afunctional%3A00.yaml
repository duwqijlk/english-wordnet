simpleMeaning: able to serve its intended practical purpose
scope: This describes a thing that works and has a practical job; it is not about a person being helpful,
  and not about something that is only pleasant to look at.
examples:
- The shed is old, but it is still useful as a workshop.
- The design is plain but useful, with nothing added just for show.
