simpleMeaning: a big sandwich on a long crusty roll cut along its length, filled with meat, cheese, tomato,
  onion, lettuce and sauces; its name changes in parts of the United States
scope: A big sandwich on a long roll cut along its length; hero, wedge, submarine, sub and bomber are
  other names for this sense, not a tooth for grinding and not a machine that grinds.
examples:
- He ordered a grinder with extra cheese for lunch.
- The shop sells grinders filled with meat and salad.
