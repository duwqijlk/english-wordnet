simpleMeaning: A pipe with no air inside holding a metal target, at which a fast stream of tiny charged
  bits is aimed to make X rays
scope: A pipe with no air inside that makes X rays when a stream of charged bits hits its metal target;
  not the rays themselves.
examples:
- The X-ray tube in the machine makes the X rays.
- A broken X-ray tube makes no X rays.
