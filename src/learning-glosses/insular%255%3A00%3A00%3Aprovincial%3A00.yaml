simpleMeaning: having a narrow way of seeing things, limited to one's own place or group and not open
  to others
scope: 'Also called parochial: having narrow views limited to one''s own group, not the sense about living
  on or relating to an island.'
examples:
- The small town had an insular way of thinking and did not welcome new ideas.
- He grew up in an insular group that never mixed with outsiders.
