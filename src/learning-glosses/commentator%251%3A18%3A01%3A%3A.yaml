simpleMeaning: a person who knows a lot about something and tells others what they think as they watch
  it
scope: An expert who watches and comments, not a reporter of plain facts and not a person who only watches;
  observer is another name for this sense.
examples:
- The commentator described the game as it happened.
- A commentator on the radio talked through each play.
