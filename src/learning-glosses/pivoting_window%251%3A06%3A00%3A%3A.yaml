simpleMeaning: Sideways or up and down, this opening in a wall turns to let it open
scope: An opening that turns to open, not one that slides up and not one that cannot open at all.
examples:
- The pivoting window in the study turns sideways when I open it.
- She chose a pivoting window for the bathroom because it opens from the top.
