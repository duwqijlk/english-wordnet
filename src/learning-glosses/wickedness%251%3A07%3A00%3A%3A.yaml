simpleMeaning: how bad a person or thing is in the way it acts, with no care for what is right
scope: The state of being bad in how one acts, not the quality of being disgusting to the senses and not
  the absence of moral values.
examples:
- The wickedness of the villain shocked the whole village.
- His wickedness showed in every cruel thing he did.
