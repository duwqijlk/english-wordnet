simpleMeaning: A way of looking at tiny things with light, where the thing is lit with rays that make
  glowing dyes in it shine.
scope: This is a way of looking at tiny things with light that makes glowing dyes shine, not looking with
  the bare eye or with sound.
examples:
- Fluorescence microscopy showed the glowing cells.
- They used fluorescence microscopy to study the sample.
