senseId: 'colour_line%1:09:00::'
synsetId: 05700199-n
simpleMeaning: A rule or custom that keeps Black people out of jobs, clubs and other parts of life shared
  with white people
scope: A rule or custom that keeps Black people out of shared work and social life; color bar, color line
  and colour bar are other names for this sense, not a wall or a ban on one person.
examples:
- The colour line kept Black players out of the league.
- He wrote about the colour line in the town's clubs.
