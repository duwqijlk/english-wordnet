simpleMeaning: a substance that lies between other things, and through which a job or change can be done
scope: This is a substance through which something is done, such as a liquid that breaks a solid down.
  It is not the material that signals move through for messages, and not a way of storing facts and news.
examples:
- This liquid is the medium in which the powder can dissolve.
- The gel is a medium through which the drug reaches the skin.
