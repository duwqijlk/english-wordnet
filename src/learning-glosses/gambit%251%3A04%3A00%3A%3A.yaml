senseId: 'gambit%1:04:00::'
synsetId: 00168771-n
simpleMeaning: In chess, an early move in which a player gives up less important pieces on purpose to
  get a better position
scope: This is the early chess move where a player gives up less important pieces to get a better position,
  not a first remark made to get an advantage in talk.
examples:
- She played a gambit early on, giving up a knight to get a stronger position.
- The gambit cost him a bishop but gave him a much better position.
