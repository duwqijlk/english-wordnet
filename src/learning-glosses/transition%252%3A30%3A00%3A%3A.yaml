simpleMeaning: To change from one state or way of doing things to another, or to be changed in that way
scope: Changing from one state or way of doing things to another, not making someone else change, and
  not a short piece that joins one subject to the next.
examples:
- The airline transitioned to more fuel-efficient jets.
- The adagio transitioned into an allegro.
