simpleMeaning: In law, freely giving up your legal right to claim something that could be yours
scope: In law, this is giving up a claim on purpose; it is not just saying that something is not true,
  and not giving a thing away by hand.
examples:
- He signed a disclaimer giving up any claim to his father's house.
- The disclaimer said he would not claim the land as his own.
