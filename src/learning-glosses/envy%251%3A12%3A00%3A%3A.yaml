senseId: 'envy%1:12:00::'
synsetId: 07565182-n
simpleMeaning: a feeling of thinking well of a person for what they have, wanting to have it too, and
  feeling unhappy that you do not have it
scope: This is the feeling of wanting what another person has; it is not the bad feeling at their success
  counted as one of the deadly sins, and not the verb for feeling this.
examples:
- She looked at her friend's new house with envy, wishing she could have one like it.
- He felt envy when he saw the award his classmate had won, and he wished he had won it too.
