simpleMeaning: to make a thing more lovely by adding pretty things, colour, or the like
scope: To make a thing more lovely by adding pretty things, colour, or the like; also called grace, decorate,
  and adorn, not to serve as a pretty thing yourself.
examples:
- She ornamented the room with flowers for the party.
- They ornamented themselves for the special day.
