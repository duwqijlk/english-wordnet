simpleMeaning: In the Middle Ages, a young person who served a knight and trained in this way as the first
  step toward knighthood.
scope: This is a young attendant in medieval knight training, not a sheet of a book or a servant in a
  modern hotel.
examples:
- As a page, the boy carried his lord's shield and learned to ride.
- The castle kept several pages who hoped one day to be dubbed knights.
