senseId: 'dysostosis_multiplex%1:26:00::'
synsetId: 14180645-n
simpleMeaning: An inherited disorder, passed on only when both parents carry the gene, in which the body
  mishandles complex sugars, causing severe bone and cartilage deformities and intellectual disability.
scope: Another name for gargoylism and lipochondrodystrophy, the same inherited disorder of sugar metabolism;
  it is not a bone disease that appears later in life.
examples:
- Dysostosis multiplex is diagnosed from the pattern of bone changes and the missing enzyme.
- Children with dysostosis multiplex often develop stiff joints and deformed bones.
