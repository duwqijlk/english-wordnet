simpleMeaning: A gap of two half steps between two musical notes.
scope: A distance in pitch of two half steps (step is another name for this sense), not the written symbol
  for a note or the character of a sound.
examples:
- The opening melody rises a whole tone before it falls again.
- The two notes are a tone apart.
