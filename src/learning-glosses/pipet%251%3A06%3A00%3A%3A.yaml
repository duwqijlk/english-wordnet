simpleMeaning: A measuring device made of a glass tube marked with a scale, used to measure or move exact
  amounts of liquid by pulling the liquid up into the tube.
scope: A tube that measures or transfers exact liquid amounts, not a dropper or a measuring cylinder;
  pipette is another name for the same instrument.
examples:
- She used a pipet to add exactly five milliliters of the solution.
- The pipet has a scale so precise volumes of liquid can be measured.
