simpleMeaning: the quality of not changing your mind or doubting, and of always keeping to what you decide
  and do
scope: A person's firmness in mind and action, not a thing being fixed firmly in place and not a pattern
  that stays regular and does not change.
examples:
- Her steadiness helped the team stay calm and finish the job they had promised.
- People trusted him for his steadiness; he never changed his mind once he gave his word.
