senseId: 'stratified_sample%1:09:00::'
synsetId: 06036477-n
simpleMeaning: A group is split into smaller groups and a few things are picked by chance from each small
  group
scope: 'Also called a proportional sample or a representative sample: a way of picking a few things by
  chance from each smaller group, not a pick from the whole group at once and not a pick by choice.'
examples:
- They used a stratified sample so each age group was counted.
- A stratified sample gave the town a fair picture of its people.
