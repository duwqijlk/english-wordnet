simpleMeaning: said of something that belongs to Australopithecus, an early group of creatures that walked
  on two legs
scope: Said of things that belong to the genus Australopithecus, not of the creatures themselves and not
  of other early humans.
examples:
- The australopithecine skull was found in South Africa.
- These australopithecine bones are millions of years old.
