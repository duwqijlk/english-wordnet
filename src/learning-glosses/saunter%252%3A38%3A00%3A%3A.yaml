simpleMeaning: to walk slowly and easily, going nowhere in particular
scope: 'Also called stroll: to walk slowly and easily, going nowhere in particular, not the noun sense
  of the way of walking itself.'
examples:
- They sauntered along the beach, stopping now and then to look at shells.
- He sauntered down the street with his hands in his pockets.
