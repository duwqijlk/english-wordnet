simpleMeaning: With the backbone running up into its top half, a tail of this kind has a bigger upper
  half than lower half.
scope: A tail is called heterocercal when its upper half is bigger than its lower half and holds the end
  of the backbone.
examples:
- The heterocercal tail had a much larger upper lobe than lower lobe.
- A heterocercal tail carries the backbone up into its upper lobe.
