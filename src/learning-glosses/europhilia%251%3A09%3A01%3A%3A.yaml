simpleMeaning: a warm feeling of praise and respect for Europe, its people, or the European Union
scope: Warm praise and respect for Europe, its people, or the European Union, not dislike of Europe and
  not a wish to leave the Union.
examples:
- His europhilia showed in his praise for European art and laws.
- Her europhilia led her to study in Paris and Rome.
