simpleMeaning: The United States government has a group of its own that looks after little firms and sees
  that they get a fair part of government work.
scope: 'Also called SBA: a group of the United States government, on its own, that looks after little
  firms, not a private firm and not another government group.'
examples:
- The Small Business Administration looks after the interests of small firms.
- A small firm asked the Small Business Administration for help with a government contract.
