simpleMeaning: a flight move in which an aircraft tilts sideways around its front-to-back axis, especially
  while turning
scope: This is not a row of objects or a place that keeps money; it is the sideways tilt of a plane in
  flight.
examples:
- The pilot made a steep bank to the left to avoid the storm.
- During the turn the plane's bank reached forty degrees.
