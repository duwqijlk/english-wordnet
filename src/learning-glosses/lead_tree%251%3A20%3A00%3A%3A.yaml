simpleMeaning: a low bushy woody plant of warm parts of North America, with white flowers touched with
  yellow like mimosa flowers and long flat pods
scope: 'Also called white popinac: a low bushy plant of warm America, not a tall tree and not a mimosa.'
examples:
- The lead tree by the road had long flat pods.
- White flowers covered the lead tree in spring.
