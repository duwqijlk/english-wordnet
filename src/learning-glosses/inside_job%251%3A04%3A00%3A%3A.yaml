simpleMeaning: A wrong act done with the help of a person the hurt person trusted.
scope: A wrong act done with help from a person the hurt person trusted, not a break-in by strangers and
  not a wrong act done alone.
examples:
- The police said the theft was an inside job.
- An inside job needs help from someone the victim trusts.
