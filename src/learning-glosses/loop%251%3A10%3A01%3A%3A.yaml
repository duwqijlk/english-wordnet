simpleMeaning: In computing, a set of steps a program does again and again until a condition that was
  set is met
scope: A program that repeats steps until a set condition is met, not one single run of those steps and
  not a ring-shaped network.
examples:
- The loop ran ten times before it stopped.
- She wrote a loop to add up the numbers.
