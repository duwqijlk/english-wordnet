simpleMeaning: a readiness to put up with views or acts that go against one's own, even shocking ones
scope: This is a readiness to put up with views or acts that go against one's own, even shocking ones,
  not narrow-mindedness and not mere indifference.
examples:
- Her broad-mindedness let her listen calmly to views she did not share.
- His broad-mindedness showed when he forgave the rude remark.
