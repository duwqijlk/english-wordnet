simpleMeaning: in baseball, a relief pitcher who can hold the lead for the final inning or two of a game
scope: This is the baseball pitcher who protects a lead at the end of a game, not a person who shuts something,
  and not the comparative word meaning at a shorter distance.
examples:
- The team brought in their closer to protect a one-run lead.
- Their closer struck out the side in the ninth inning.
