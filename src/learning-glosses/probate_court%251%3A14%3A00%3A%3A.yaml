simpleMeaning: the place where judges deal with wills and with the goods left by people who have died
scope: The place where judges deal with wills and dead people's goods, not a court for crimes and not
  a court for family rows.
examples:
- The probate court will meet next week to read the will.
- She went to the probate court to ask about her father's estate.
