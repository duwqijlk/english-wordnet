simpleMeaning: This hospital keeps people with catching illnesses, above all leprosy, apart for care
scope: 'Also called a lazaret, a lazarette, a lazaretto and a pesthouse: a place where people with catching
  illnesses, above all leprosy, are kept apart for care, not a general hospital and not a home for the
  old.'
examples:
- The sick were sent to a lazar house outside the town walls.
- In those days a lazar house kept lepers apart from the rest of the town.
