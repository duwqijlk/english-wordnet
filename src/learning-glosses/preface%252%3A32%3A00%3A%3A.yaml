simpleMeaning: to add an opening part to a book, talk, or other work, before the main part
scope: 'Also called introduce, precede, and premise: to add an opening part to a work, not the opening
  writing itself as a noun.'
examples:
- He prefaced his lecture with a short remark about the school.
- She prefaced the book with a note to her readers.
