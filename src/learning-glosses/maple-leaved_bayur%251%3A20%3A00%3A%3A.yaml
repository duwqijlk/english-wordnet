simpleMeaning: People often grow this Indian tree for its reddish wood, cut into planks, and for shade
  or show; its white flowers smell sweet and open at night
scope: Also called mayeng; an Indian tree grown for shade or show, with sweet white flowers that open
  at night and reddish wood for planks.
examples:
- The maple-leaved bayur shades the yard.
- They cut the maple-leaved bayur for reddish planks.
