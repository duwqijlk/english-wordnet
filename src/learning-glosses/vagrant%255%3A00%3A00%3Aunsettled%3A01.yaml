simpleMeaning: changing again and again, most of all in where you live or in the work you do
scope: 'Also called floating, drifting, aimless, and vagabond: this describes a person or life that keeps
  changing home or job, not the noun for a person who has no fixed home.'
examples:
- He lived a vagrant life, moving from town to town and job to job.
- In their vagrant years, they never stayed in one home for long.
