simpleMeaning: A group of Indo-European languages, languages of Europe and Asia that come from one old
  language, that covers the Slav languages and the Baltic languages.
scope: This is a group of Indo-European languages that covers the Slav languages and the Baltic languages;
  Balto-Slavic language and Balto-Slavonic are other names for it, and it is one branch of that family,
  beside groups such as the Germanic languages.
examples:
- Russian is part of the Balto-Slavic family of languages.
- Balto-Slavic covers the Slav tongues and the Baltic tongues.
