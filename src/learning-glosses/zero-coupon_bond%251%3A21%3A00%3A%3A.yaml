simpleMeaning: A loan paper that pays its holder nothing while it runs, sold far below what it pays back
  at the end, the most usual kind of such paper.
scope: Also called zero coupon bond, this loan paper pays its holder nothing while it runs.
examples:
- She bought a zero-coupon bond that pays nothing until it comes due.
- He held a zero-coupon bond through its whole life.
