senseId: 'functional_genomics%1:09:00::'
synsetId: 06084768-n
simpleMeaning: In biology, the study of what genes do and what the things they make do in living things.
scope: This is the study of what genes do, not the study of genes themselves, and not the study of how
  living things pass on traits.
examples:
- Functional genomics helps us learn what each gene does in the body.
- Her work in functional genomics looks at the products genes make.
