simpleMeaning: a machine that crushes roasted beans into small bits for making a hot drink
scope: This is a machine that crushes roasted beans into small bits for a hot drink, also called a coffee
  mill; not a coffee maker, which brews the drink, and not a mill for grain.
examples:
- She put the beans in the coffee grinder and turned the handle until they were fine bits.
- The old coffee grinder on the shelf still crushes beans each morning.
