simpleMeaning: a person in the armed forces killed or hurt in fighting
scope: A person in the armed forces killed or hurt in a fight, with injury and wound as other names for
  this sense, and not a harm from training or an accident away from battle.
examples:
- He suffered a combat injury when his unit came under fire.
- The combat injury kept her out of action for months.
