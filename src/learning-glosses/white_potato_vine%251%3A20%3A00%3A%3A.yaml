simpleMeaning: A South American plant living one season and bearing stems that creep underground, ending
  in starchy tubers to eat, much grown in the garden as food, its vines poisonous.
scope: This sense is also called potato and white potato, for a South American plant that lives one season,
  with stems that creep underground and end in edible starchy tubers, grown widely as a garden vegetable,
  with poisonous vines.
examples:
- White potato vines creep underground.
- White potato vine tubers can be eaten.
