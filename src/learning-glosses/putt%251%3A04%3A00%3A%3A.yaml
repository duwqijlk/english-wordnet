simpleMeaning: A stroke that rolls a golf ball across the green's smooth short grass, using a special
  flat club.
scope: The golf stroke itself — putting is another name for this sense — not the two verb senses meaning
  to strike the ball or to make this stroke.
examples:
- He sank a 20-foot putt to win the match.
- Her final putt stopped just short of the hole.
