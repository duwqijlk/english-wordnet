simpleMeaning: the part of a scene you can see, especially through a lens, telescope, or similar instrument.
scope: This is not the invisible region of physical influence around an object; it is the extent of what
  the eye or an instrument can see.
examples:
- The moon drifted slowly across the field of the telescope.
- Adjust the microscope until the cells fill the field of view.
