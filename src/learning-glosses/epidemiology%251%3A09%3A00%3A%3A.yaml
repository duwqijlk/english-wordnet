simpleMeaning: the part of medical study that looks at how diseases spread and how to stop them from spreading
scope: This is the study of how diseases spread and how to stop them, not the care of one sick person
  and not the study of the body alone.
examples:
- She studies epidemiology to learn how flu spreads through a city.
- Epidemiology helps health workers find out why many people in one town got sick.
