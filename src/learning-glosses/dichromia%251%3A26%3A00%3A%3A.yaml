senseId: 'dichromia%1:26:00::'
synsetId: 14177098-n
simpleMeaning: Any shade can be matched by a person with this lack of colour sight by mixing only two
  kinds of light, not the three most people need.
scope: Also called dichromacy, dichromasy, dichromatism and dichromatopsia; it is a lack in colour sight,
  not the full colour sight of most people, who need three kinds of light to match a shade.
examples:
- Dichromia lets him match any shade with only two kinds of light.
- Her dichromia means two kinds of light are enough to match a shade.
