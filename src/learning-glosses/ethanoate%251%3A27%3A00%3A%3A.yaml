simpleMeaning: a chemical stuff made from the acid in vinegar, either as a salt or as a substance made
  by joining the acid with an alcohol
scope: 'Also called acetate: a chemical stuff made from the acid in vinegar, not the acid itself and not
  a salt of some other acid.'
examples:
- The chemist made an ethanoate by mixing the acid in vinegar with alcohol.
- The ethanoate in the bottle is a salt of the acid in vinegar.
