simpleMeaning: One of a native wandering people of the far north, living in northern Scandinavia and herding
  reindeer.
scope: Not the tongue they speak, nor other herders of the far north; also called Same, a Lapplander,
  Saame, Saami and Sami.
examples:
- The Lapp moved with his reindeer herd.
- A Lapp family camps near the lake in summer.
