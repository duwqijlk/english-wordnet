senseId: 'crystal_rectifier%1:06:00::'
synsetId: 03207444-n
simpleMeaning: A part that lets electric current flow in one direction only, made of a material that partly
  carries current, with two layers joined where they meet.
scope: Also called diode and junction rectifier; a part that passes current one way, not a plain wire
  and not a battery.
examples:
- The crystal rectifier in the old radio let current flow only one way.
- He replaced the faulty crystal rectifier with a new one.
