simpleMeaning: In maths, with no brackets, each sign that joins values comes after the values it joins.
scope: Postfix notation is another name for this bracket-free way of writing maths.
examples:
- In suffix notation, the sum 2 3 + means two plus three.
- The teacher wrote the sum in suffix notation on the board.
