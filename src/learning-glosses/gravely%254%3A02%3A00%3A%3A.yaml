simpleMeaning: in a serious way, with no smile or joke
scope: 'This tells how a person speaks or acts: in a serious way, with no joking. Not the use that tells
  how serious or bad a thing is, as when a person is gravely ill.'
examples:
- He nodded gravely and said nothing for a moment.
- She looked at us gravely before she began to speak.
