simpleMeaning: fixed and held so that nothing can move them, most of all when they are ideas or beliefs
scope: An idea or belief fixed and held so that nothing can move it; deep-rooted, implanted, ingrained
  and planted are other names for this sense, not a new idea and not a fact that can be changed with ease.
examples:
- The deep-seated differences of opinion kept the two sides apart.
- His deep-seated need for quiet made the city hard to bear.
