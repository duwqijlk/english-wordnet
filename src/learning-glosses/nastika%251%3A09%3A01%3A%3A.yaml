simpleMeaning: Schools and thinkers that do not take the Vedas as the highest holy writings are called
  by this word in Hinduism.
scope: In Hinduism, this word names schools and thinkers that do not take the Vedas as the highest holy
  writings, not those that do.
examples:
- The Buddhist Nagarjuna comes from a nastika school.
- We read about nastika thinkers who do not take the Vedas as the highest holy writings.
