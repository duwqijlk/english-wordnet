simpleMeaning: bullets or shells that leave a line of smoke in the air, so people can see where they go
scope: Bullets or shells that leave smoke so their path can be seen, not a medical substance put in the
  body and not a person who looks for missing people or goods.
examples:
- The soldiers fired tracer rounds that left bright lines of smoke.
- Tracer bullets helped the gunner see where his shots were going.
