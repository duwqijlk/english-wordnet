simpleMeaning: To engrave or inscribe letters or symbols on something.
scope: This is the old verb for cutting or writing characters onto a surface. It is not the noun for a
  written symbol, nor the noun for a person in a story; modern writers would say 'engrave' or 'inscribe'.
examples:
- The silversmith charactered the couple's initials on the cup.
- The family name was charactered on the stone above the door.
