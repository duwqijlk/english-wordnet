simpleMeaning: To get by with what little you have, and still get the thing done.
scope: To get by with what little you have, and still get the thing done, also called deal, manage, cope,
  and contend, not the act of gripping in a fight and not the hooked tool.
examples:
- The family grappled on very little food through the winter.
- They grappled through the month on half pay.
