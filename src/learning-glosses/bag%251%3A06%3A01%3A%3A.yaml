simpleMeaning: A rectangular case you pack clothes in to carry with you.
scope: A travel case for clothes, not the small purse for money and personal items and not a soft, open
  container.
examples:
- She folded the shirts and put them in her bag.
- His bag was too heavy to lift into the overhead locker.
