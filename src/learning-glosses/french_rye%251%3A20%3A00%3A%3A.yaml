simpleMeaning: A coarse long-lived grass of Europe and Asia that looks like oats, growing on road edges,
  rough grassland and hay fields, brought to North America as feed for farm animals.
scope: 'Also called evergreen grass, false oat, tall meadow grass, tall oat grass, or Arrhenatherum elatius:
  a coarse grass that looks like oats, not wheat and not a lawn grass.'
examples:
- The French rye grows along the road edge.
- Farmers sow French rye for feed.
