simpleMeaning: to hold someone or something back in a way that makes it hard for them to move freely
scope: This sense is about making it hard for a person or thing to move, not about holding back feelings
  or stopping yourself from doing something.
examples:
- Guards restrained the prisoner with chains on his arms and legs.
- Two men restrained the dog so it could not run into the road.
