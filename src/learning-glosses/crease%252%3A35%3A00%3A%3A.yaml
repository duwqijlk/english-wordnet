simpleMeaning: to make small folds or lines on a smooth surface, or a pressed, folded or wrinkled line
  in it; crisp, an old word for this, is no longer used
scope: 'Also called wrinkle, crisp, crinkle and scrunch: making folds or lines in something, not the fold
  itself and not becoming folded on its own.'
examples:
- She creased the paper to make a sharp line for the fold.
- He creased his clean shirt by sitting on it.
