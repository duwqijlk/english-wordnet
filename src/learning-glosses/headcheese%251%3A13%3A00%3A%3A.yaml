simpleMeaning: Chopped bits of meat from the skull, and sometimes the feet and tongue of a calf or a pig,
  are set in jelly as a sausage or a loaf.
scope: Set in jelly, it is a sausage or a loaf made of chopped meat from the skull, and sometimes the
  feet and tongue, of a calf or a pig.
examples:
- She sliced the headcheese and put it on the plate.
- They made headcheese from the calf's head, feet, and tongue.
