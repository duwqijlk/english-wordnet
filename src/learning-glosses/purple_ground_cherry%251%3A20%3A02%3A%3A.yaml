simpleMeaning: With yellow-to-purple fruit you can eat, like small tomatoes, this one-year Mexican plant
  now grows wild in eastern North America.
scope: Also called tomatillo, jamberry, and miltomate, this one-year Mexican plant now growing wild in
  eastern North America stands apart from other fruit-bearing plants by its yellow-to-purple fruit.
examples:
- The purple ground cherry bore yellow-to-purple fruit like small tomatoes.
- We saw purple ground cherry growing wild in eastern North America.
