simpleMeaning: to catch a small part of a thing between two fingers and give it a hard press
scope: To catch a small part of a thing between two fingers and press it hard, also called squeeze, twitch,
  pinch and twinge; not the chirp of a small bird and not a message posted on Twitter.
examples:
- He gave her arm a quick tweet to get her attention.
- She tweeted the edge of the cloth between her fingers.
