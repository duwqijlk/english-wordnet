senseId: 'linguistic_universal%1:10:00::'
synsetId: 07274652-n
simpleMeaning: In linguistics, what is true of every language, from a rule of grammar to any other part
  of it
scope: 'Another name for universal: a part of language found in every language, not a rule that holds
  in one language only and not a word shared by chance.'
examples:
- The linguistic universal that all languages have nouns came up in class.
- She gave a linguistic universal as an example of what every tongue shares.
