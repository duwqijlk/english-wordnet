simpleMeaning: the way a thing grows soft and full of water after being left in water or some other liquid
scope: The way a thing grows soft and full of water after being left in water or some other liquid, also
  called soak and soaking; not a quick dip and not a wash with soap.
examples:
- After a long soakage, the dried beans were soft and full of water.
- The soakage of the wood in water made it bend without breaking.
