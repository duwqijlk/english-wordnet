simpleMeaning: A tube-shaped part that sticks out at the foot of the ring of petals in some kinds of flower
scope: This is the tube-shaped part at the foot of a flower's petals, not the sharp point on a rider's
  heel and not any pointed part that sticks out.
examples:
- The spur of the flower holds the sweet juice.
- Bees reach into the spur for food.
