simpleMeaning: A grass of Europe that spreads fast by stems that creep underground; it has settled in
  North America, where it grows as a weed
scope: A grass that spreads fast by creeping underground stems; couch grass, dog grass, quack grass, quackgrass,
  quick grass, witch grass and witchgrass are other names for this sense, not other European grasses that
  stay in one place.
examples:
- Agropyron repens spreads fast through the garden.
- We pulled up the Agropyron repens before it took over the lawn.
