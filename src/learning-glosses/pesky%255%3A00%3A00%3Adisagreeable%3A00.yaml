simpleMeaning: making people feel annoyed, bothered, and a little angry
scope: Making people feel annoyed and bothered, also called annoying, teasing, irritating, pestering,
  vexing, galling, bothersome, nettlesome, plaguey, and vexatious. It is not pleasant, welcome, or easy
  to like.
examples:
- A pesky mosquito kept biting her arm.
- He could not sleep because of the pesky noise next door.
