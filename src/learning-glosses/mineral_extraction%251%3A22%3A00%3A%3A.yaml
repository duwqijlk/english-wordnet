simpleMeaning: breaking up and sorting rock in many different ways to get the useful stuff out of it and
  leave the waste
scope: Breaking up and sorting rock to get the useful stuff out, also called beneficiation, mineral dressing,
  mineral processing, ore dressing and ore processing; not digging the rock out and not melting metal.
examples:
- Mineral extraction turns raw ore into useful stuff.
- The plant does mineral extraction before the metal is made.
