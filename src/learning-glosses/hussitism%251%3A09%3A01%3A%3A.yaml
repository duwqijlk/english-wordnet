simpleMeaning: A Christian movement following the Czech reformer Jan Hus, about 1369 to 1415, the best-known
  voice of the Bohemian Reformation and an early voice of the Protestant Reformation.
scope: A Christian movement after Jan Hus, not the Protestant Reformation itself and not a single church.
examples:
- Hussitism spread through Bohemia after Hus died.
- The Taborites were a branch of Hussitism.
