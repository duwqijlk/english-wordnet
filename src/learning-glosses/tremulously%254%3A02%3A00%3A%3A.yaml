simpleMeaning: in a way that shakes a little, with small, quick movements
scope: This means doing something with small shakes, not with strong shaking and not in a steady, still
  way.
examples:
- Her hands moved tremulously as she opened the letter.
- He nodded tremulously, too afraid to speak.
