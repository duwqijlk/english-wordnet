simpleMeaning: Able to produce the result that was wanted, or able to make a strong impact.
scope: This is not the sense of simply doing a job well; it is about producing the wanted result or making
  a strong impact.
examples:
- The new law was effective in cutting road deaths.
- Her short speech was simple but very effective.
