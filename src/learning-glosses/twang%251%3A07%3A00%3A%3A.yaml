simpleMeaning: a strong nasal sound in the way a person speaks, heard in some local ways of speaking
scope: A strong nasal sound in speech, heard in some local dialects; not the sharp sound of a plucked
  string, and not the verb sense of speaking this way.
examples:
- His Texas twang marked him out at once.
- She spoke with a twang that came from the north.
