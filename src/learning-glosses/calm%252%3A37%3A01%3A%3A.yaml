simpleMeaning: to grow quiet, especially after being upset or worked up
scope: To become quiet on one's own after being worked up, not the transitive sense of settling someone
  with a sedative, nor the adjective describing peaceful conditions.
examples:
- The crowd calmed when the speaker lowered his voice.
- It took an hour for the child to calm after the nightmare.
