simpleMeaning: The spot on the outside of an antigen, a thing that sets off the body's defences, where
  an antibody fastens on.
scope: The spot on an antigen where an antibody fastens on, not the maths set of numbers and not a cause
  in general.
examples:
- The antibody fastened to a determinant on the virus.
- Each determinant on the cell drew its own antibody.
