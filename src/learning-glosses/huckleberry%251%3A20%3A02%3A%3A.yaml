simpleMeaning: Any of many dark-fruited kinds, set apart from blue-fruited blueberries.
scope: Any of many dark-fruited kinds, set apart from blue-fruited blueberries; not any of several shrubs
  of the Gaylussacia kind bearing small berries like blueberries, nor a blue-black berry like blueberries
  and bilberries of the east of the United States.
examples:
- Their huckleberry grew at dawn.
- The huckleberry was picked at noon.
