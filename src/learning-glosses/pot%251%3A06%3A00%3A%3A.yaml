simpleMeaning: A cooking container made of metal or baked clay, usually deep and round; it often has a
  handle and a lid
scope: This is the thing used for cooking, not the toilet, not the small electric part in a radio or TV
  set, and not the amount that fills such a thing.
examples:
- She put the soup in a large pot and set it on the fire.
- He lifted the lid of the pot to check the rice.
