simpleMeaning: Calm is what this drug brings to a person whose mind has lost touch with what is real,
  when calm is wanted
scope: Also called antipsychotic, antipsychotic agent, antipsychotic drug, neuroleptic, neuroleptic agent,
  neuroleptic drug, major tranquilliser and major tranquillizer, this is a drug that calms a person whose
  mind has lost touch with what is real, not a drug that puts a person to sleep and not a drug for worry
  alone.
examples:
- The doctor gave him a major tranquilizer to calm his mind.
- A major tranquilizer was used because a calming effect was needed.
