simpleMeaning: In a coat of crumbs and cheese, young beef is fried quickly and served with tomato sauce.
scope: Also called veal parmesan, this is young beef fried quickly in a coat of crumbs and cheese, served
  with tomato sauce, not beef with no coat at all.
examples:
- They served veal parmigiana with tomato sauce.
- We ordered veal parmigiana at the restaurant.
