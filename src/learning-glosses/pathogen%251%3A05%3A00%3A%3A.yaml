senseId: 'pathogen%1:05:00::'
synsetId: 01388648-n
simpleMeaning: anything that can cause illness, especially a virus, a bacterium (a very small living thing),
  or another very small living thing
scope: This is the thing that causes illness, such as a virus or a bacterium; it is not the illness itself
  and not a medicine that treats it.
examples:
- The test found a dangerous pathogen in the water.
- Doctors washed their hands often to stop pathogens from spreading.
