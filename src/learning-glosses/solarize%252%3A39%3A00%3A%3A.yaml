simpleMeaning: To lay out in the sun's rays, or shape by sun's touch.
scope: To lay out in the sun's rays, or shape by sun's touch; also called sun; not to flip some of the
  shades of a film or print and bring in sharp rims of light, by baring it briefly to light, then washing
  and working it up again.
examples:
- Their farmer would solarize the cloth.
- The cook did solarize the grain.
