simpleMeaning: Its wood is much like that of its kin in Europe and America; this large tree has dark close
  bark low on the trunk but smooth and pale above.
scope: A large tree with dark close bark low on the trunk but smooth and pale above, giving wood much
  like that of its kin in Europe and America, not the rowan also called mountain ash.
examples:
- The white mountain ash stood tall with its smooth pale bark.
- They cut the white mountain ash for its wood.
