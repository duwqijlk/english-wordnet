simpleMeaning: Freedom from tax and from the usual law of a foreign land, given to people who work for
  their own country abroad.
scope: Freedom from tax and the usual law abroad for a country's own workers overseas, not freedom from
  all rules and not a right of ordinary visitors.
examples:
- Diplomatic immunity kept her from paying the tax.
- He claimed diplomatic immunity when the police stopped him.
