simpleMeaning: so good that it seems as if the gods gave the maker the power to make it
scope: A thing so fine it seems sent from the gods, not a person moved by a new idea.
examples:
- The choir gave an inspired performance that left the crowd silent.
- Her pies were simply inspired, light and full of taste.
