simpleMeaning: not thinking ahead about what will happen later, and seeing only a small part of a matter
scope: 'Also called short and shortsighted: about failing to think ahead about what happens later, not
  about eyes that cannot see far away.'
examples:
- The myopic plan saved money now but caused big problems later.
- Critics called the choice myopic because no one had thought about next year.
