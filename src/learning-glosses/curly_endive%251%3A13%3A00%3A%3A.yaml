simpleMeaning: crisp leaves with sharp points and a taste that is a little bitter
scope: Crisp leaves with sharp points and a slightly bitter taste, also called chicory; not a climbing
  plant with blue-purple flowers and not a bushy plant with wavy leaves.
examples:
- She tore curly endive into the salad for its bitter taste.
- The curly endive leaves were crisp with sharp points.
