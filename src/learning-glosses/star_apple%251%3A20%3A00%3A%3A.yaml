simpleMeaning: This evergreen tree of the West Indies and Central America bears purple fruit to eat, showing
  points when cut across, and leaves dark green above, gold and silky beneath.
scope: 'Also called caimito: an evergreen tree of the West Indies and Central America, with purple fruit
  good to eat and dark green leaves gold and silky beneath.'
examples:
- The star apple bore purple fruit that showed a pointed pattern when cut across.
- Dark green leaves with gold silky undersides grew on the star apple.
