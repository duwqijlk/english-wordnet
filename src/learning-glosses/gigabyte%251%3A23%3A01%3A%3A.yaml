simpleMeaning: a unit of information equal to 1,000 megabytes or 1,000,000,000 bytes
scope: This is the gigabyte unit equal to 1,000,000,000 bytes, not the other gigabyte unit equal to 1,073,741,824
  bytes and not a smaller unit such as a megabyte.
examples:
- The phone is sold with 64 gigabytes of space for files.
- She needs at least five gigabytes free to save the film.
