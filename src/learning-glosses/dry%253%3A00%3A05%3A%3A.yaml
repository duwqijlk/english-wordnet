simpleMeaning: In paint and coatings, a film that has lost its water and the liquid that carried it, and
  is no longer wet.
scope: This is the paint-film sense, not the ordinary moisture-free one, the sarcastic, anti-drink, abstinent
  or prohibitionist senses, the milkless, low-sugar wine, discharge-free, tearless, dull, solid-not-liquid,
  unproductive, undecorated, plain-food, strong-liquor or unemotional adjectives, nor the two verbs for
  taking water out or losing it.
examples:
- The tin says to apply a second coat once the first is dry to the touch.
- A dry film sands more evenly than a tacky one.
