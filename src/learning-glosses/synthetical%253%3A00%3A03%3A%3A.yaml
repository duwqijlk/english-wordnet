simpleMeaning: to do with putting separate parts together to make one whole thing, rather than taking
  a thing apart to study it
scope: This is about putting parts together into a whole, also called synthetic, and not about taking
  a thing apart to study it.
examples:
- Her synthetical approach joined the separate findings into one clear picture.
- A synthetical view of the subject brings the parts together as a whole.
