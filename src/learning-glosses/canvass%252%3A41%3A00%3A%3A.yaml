simpleMeaning: to go to people who can vote and ask for their votes, as part of a campaign to win an election
scope: Asking people for their votes in an election campaign, not asking people their views to study public
  opinion, and not the cloth or the mat floor of a fighting ring.
examples:
- Volunteers canvassed the whole street in the week before the election.
- She spent the weekend canvassing voters in the small towns nearby.
