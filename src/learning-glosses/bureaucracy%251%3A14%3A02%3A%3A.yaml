simpleMeaning: any group where work is held up by too many useless rules and steps
scope: Any group where work is held up by useless rules; not a government run by offices, and not a group
  that simply works slowly.
examples:
- The bureaucracy at the office delayed the permit for months.
- He hated the bureaucracy that made every small job take weeks.
