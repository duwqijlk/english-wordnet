senseId: 'acidic%3:00:00::'
synsetId: 00025351-a
simpleMeaning: Being an acid or having an acid in it; of a solution (a liquid mixture), having too many
  hydrogen atoms (a pH of less than 7)
scope: This describes a chemical or a liquid with acid in it; it is not about a base, which is the opposite
  kind of chemical.
examples:
- The soil here is acidic, so some plants grow badly.
- He tested the acidic liquid and found its pH was below 7.
