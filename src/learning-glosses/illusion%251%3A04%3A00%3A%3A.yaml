simpleMeaning: the act of fooling someone by making them believe false ideas
scope: 'Also called delusion: this is the act of fooling someone with false ideas, not a clever magic
  act that fools the eye.'
examples:
- He used illusion to make the villagers believe the god had spoken.
- The leader kept up the illusion that help was on its way, though he knew it was false.
