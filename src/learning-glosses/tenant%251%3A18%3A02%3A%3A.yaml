simpleMeaning: someone with a right to use buildings or land, whether that right comes from owning them
  or from renting them
scope: A person who holds buildings or land under some right, whether as owner or renter, not the verb
  sense of living in a place as a tenant.
examples:
- The tenant held the house under a lease.
- Each tenant in the building had a right to the land behind it.
