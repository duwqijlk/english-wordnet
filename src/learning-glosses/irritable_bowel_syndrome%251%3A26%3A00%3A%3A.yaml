senseId: 'irritable_bowel_syndrome%1:26:00::'
synsetId: 14329672-n
simpleMeaning: Belly pain and loose stools that keep coming back, often changing to times when stools
  will not pass; often linked to worry and strain of the mind.
scope: Belly pain and loose stools that keep coming back, often changing to times when stools will not
  pass; mucous colitis and spastic colon are other names for this sense, not a short stomach bug and not
  a lasting disease of the gut.
examples:
- Her irritable bowel syndrome flared up when she was under stress.
- He manages his irritable bowel syndrome with diet and rest.
