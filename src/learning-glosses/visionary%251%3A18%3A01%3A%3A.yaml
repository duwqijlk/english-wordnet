simpleMeaning: a person who loves wild ideas about what could happen, with little care for what can really
  be done
scope: This is a person who loves wild ideas about what could happen, not the adjective sense that describes
  an idea as not practical, and not a person who can truly see the future.
examples:
- The visionary talked for hours about cities on the moon, though no one could build them.
- As a visionary, he had big plans and never thought about money or time.
