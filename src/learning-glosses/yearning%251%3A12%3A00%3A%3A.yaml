simpleMeaning: a wish or need that lasts a long time and is not met
scope: 'Also called longing: a wish or need that lasts a long time and is not met, not a short wish and
  not a wish that has been met.'
examples:
- She felt a yearning for the home she had left years ago.
- His yearning to see his son again never went away.
