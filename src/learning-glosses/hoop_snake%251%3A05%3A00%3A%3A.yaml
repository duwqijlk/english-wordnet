simpleMeaning: any of several harmless North American serpents once thought to bite their tails and roll
  along like a ring
scope: Any of several harmless North American serpents once thought to bite their tails and roll along
  like a ring, not a real rolling animal and not a venomous snake.
examples:
- Old tales told of a hoop snake rolling down the hill like a wheel.
- The hoop snake in the old tale rolled down the hill like a hoop.
