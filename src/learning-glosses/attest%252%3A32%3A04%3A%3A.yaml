simpleMeaning: to prove that a word or other thing was used, or to check that it was used
scope: About proof that a word or other thing was in use; not about saying in an official job that a thing
  is true, and not about giving proof by how someone acts.
examples:
- This word is first attested in a book from 1993.
- Old letters attest the use of this name in the town long ago.
