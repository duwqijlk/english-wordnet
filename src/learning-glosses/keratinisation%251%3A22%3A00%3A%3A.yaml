senseId: 'keratinisation%1:22:00::'
synsetId: 13526452-n
simpleMeaning: A living process in which keratin, the hard stuff in nails and hair, is laid down in cells
  and the cells grow hard
scope: This is a living process in which keratin is laid down in cells and the cells grow hard; keratinization
  is another name for this sense, not the making of keratin itself and not the hardening of bone.
examples:
- Keratinisation hardens the cells of nails and hair.
- Keratinisation lays keratin down in the cells.
