senseId: 'neutralization%1:22:00::'
synsetId: 13542275-n
simpleMeaning: An acid and a base cancel each other out and leave a salt behind. If both are strong, hydrogen
  ions and hydroxyl ions join to make water.
scope: The chemistry sense in which an acid and a base form a salt, not the political sense of keeping
  a country neutral, the euphemism for killing a threat, or the general sense of cancelling an earlier
  action; 'neutralisation' is another name.
examples:
- The neutralization of stomach acid by an antacid leaves a harmless salt.
- She measured the heat given off during the neutralization of hydrochloric acid with sodium hydroxide.
