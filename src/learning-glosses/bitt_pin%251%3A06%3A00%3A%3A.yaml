simpleMeaning: a rod pushed through the top of a ship's post to stop the ropes that hold the ship from
  slipping off
scope: A rod that holds a ship's ropes in place, not the post itself and not a rope.
examples:
- The sailor pushed a bitt pin through the bitthead before the ship left.
- Without a bitt pin, the mooring lines could slip off the post.
