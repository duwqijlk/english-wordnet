senseId: episodic%5:00:00:divided:00
synsetId: 02491286-s
simpleMeaning: Of a book or a tale, made up of separate parts, each one a short bit of story on its own.
scope: Of a book or a tale, made up of separate parts, not turning up at odd times and not lasting for
  only one short spell.
examples:
- The novel is episodic, with each chapter telling its own short story.
- The play is episodic, made of short scenes that do not join up.
