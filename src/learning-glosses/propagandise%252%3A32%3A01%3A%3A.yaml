simpleMeaning: To put a person or group under the sway of words meant to change what they think
scope: To put a person or group under the sway of words meant to change what they think, also called propagandize;
  not to put out such words oneself, the rival sense in this batch.
examples:
- They propagandise the young to win their support.
- Schools were used to propagandise whole towns.
