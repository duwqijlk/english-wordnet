simpleMeaning: a creeping, fragrant mint-family plant from Europe, with round leaves and small purple
  flowers, often grown in hanging baskets, naturalized in North America, sometimes classed in genus Nepeta.
scope: Another name for this creeping mint; it is not true ivy, the woody climbing plant.
examples:
- Ground ivy grew thickly under the hedge, its round leaves and purple flowers hidden in the shade.
- A hanging basket of ground ivy trailed almost to the floor of the porch.
