senseId: 'conjugate%1:27:00::'
synsetId: 14844595-n
simpleMeaning: 'One of two mixtures made when two liquids only partly mix: one mixture is the first liquid
  in the second, and the other is the second in the first'
scope: 'Conjugate solution is another name for this sense: one of two mixtures made when two liquids only
  partly mix, each mixture holding one liquid in the other. Not the grammar sense about word forms, and
  not the sense about joining chemicals into one thing.'
examples:
- When the two liquids partly mixed, they formed a conjugate in the lab jar.
- Each conjugate holds some of the other liquid in it.
