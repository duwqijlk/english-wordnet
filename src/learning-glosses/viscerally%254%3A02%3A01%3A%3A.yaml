simpleMeaning: in a way that comes from strong feeling, not from thinking things through
scope: Done from strong feeling rather than from careful thought; not the sense of this word that means
  in the inner parts of the body.
examples:
- She reacted viscerally to the bad news, before she had time to think.
- He viscerally disliked the new plan, though he could not say why.
