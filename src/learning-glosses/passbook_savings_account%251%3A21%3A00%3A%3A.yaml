simpleMeaning: a bank store of money in which money put in and money taken out are written down in the
  saver's small book
scope: A bank store of money whose deposits and withdrawals are written in the saver's small book, not
  a bank store without a book and not a cheque book.
examples:
- She keeps her passbook savings account book safe at home.
- His passbook savings account shows every deposit in the small book.
