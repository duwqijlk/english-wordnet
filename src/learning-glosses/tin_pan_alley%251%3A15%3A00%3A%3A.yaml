simpleMeaning: A part of a city, first in New York, where people who write popular songs and people who
  sell them do their work.
scope: A part of a city where people who write popular songs and people who sell them do their work, not
  any other part of the city.
examples:
- Tin Pan Alley was full of songwriters in those days.
- He found work on Tin Pan Alley writing songs.
