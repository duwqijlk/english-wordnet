simpleMeaning: not sure how it will end, and especially full of risk or danger
scope: Also called dodgy and dicey, this means not sure how it will end and full of risk, not just open
  to chance or change.
examples:
- It was a chancy plan, and no one knew if it would work or end in harm.
- Crossing the thin ice was a chancy thing to do.
