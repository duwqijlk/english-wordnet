simpleMeaning: The top-billed performer in a show, whose name stands out above all others in its bills
  and credits.
scope: Also called a star, the performer given the most prominent billing in a show.
examples:
- The headliner took the stage last to the loudest cheers.
- She became the headliner after years of small gigs.
