simpleMeaning: A leafless, parasitic vine whose orange-yellow stems twine around clover or flax, carrying
  dense clusters of small white bell-shaped flowers.
scope: A leafless parasite that climbs over clover and flax, not a cultivated flowering garden vine.
examples:
- The love vine wrapped itself around the clover in the field.
- We found a love vine tangled in the flax.
