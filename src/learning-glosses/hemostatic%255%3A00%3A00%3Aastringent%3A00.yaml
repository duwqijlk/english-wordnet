simpleMeaning: Tending to stop bleeding by making body tissue or blood tubes tighten.
scope: Tending to stop bleeding by tightening tissue or blood tubes; not a drug that thins the blood,
  and not a bandage that merely covers a wound.
examples:
- The nurse pressed a hemostatic pad onto the cut to stop the bleeding.
- This hemostatic powder helps the blood vessels tighten and close.
