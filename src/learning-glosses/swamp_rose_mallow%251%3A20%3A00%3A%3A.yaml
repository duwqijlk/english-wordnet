simpleMeaning: A showy bush of salt marshes in the east of the United States, with large pink flowers.
scope: This is a showy bush of salt marshes with large pink flowers, also called common rose mallow, rose
  mallow, or swamp mallow, and not a garden hibiscus or a marsh reed.
examples:
- The swamp rose mallow bloomed pink beside the salt marsh.
- We saw a swamp rose mallow with wide pink flowers.
