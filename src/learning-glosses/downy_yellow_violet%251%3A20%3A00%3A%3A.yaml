simpleMeaning: Clear yellow flowers with brown-purple veins grow on this violet of eastern North America,
  whose leaves and stems are softly hairy.
scope: It is a violet of eastern North America with softly hairy leaves and stems and clear yellow flowers
  with brown-purple veins, and not one with smooth leaves or purple flowers.
examples:
- A downy yellow violet opened its clear yellow flowers.
- We found a downy yellow violet with softly hairy leaves.
