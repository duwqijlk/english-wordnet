simpleMeaning: In chemistry, the splitting of one thing into two or more things that can differ from each
  other and from the first thing.
scope: In chemistry, this is the splitting of one thing into two or more things, also called breakdown,
  decomposition, and chemical decomposition reaction, not the rotting of dead matter or the joining of
  two things into one.
examples:
- The decomposition reaction split the compound into two new substances.
- In the lab, a decomposition reaction broke the substance into parts.
