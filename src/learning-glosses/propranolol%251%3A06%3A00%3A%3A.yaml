  drug of its kind that slows the heart, sold as Inderal.
scope: The first heart-slowing drug of its kind, used for high blood pressure, chest pain, and shaking
  with no known cause.
examples:
- The doctor gave him propranolol for his high blood pressure.
- She takes propranolol to keep her shaking under control.
