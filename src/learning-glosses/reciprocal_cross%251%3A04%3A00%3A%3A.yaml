simpleMeaning: The breeding of two kinds of plant or animal in two matings, with the male and female roles
  swapped between the two matings
scope: Breeding in two matings with the male and female roles swapped, also called a reciprocal; not a
  single mating and not breeding within one kind.
examples:
- The reciprocal cross tested how the trait passed down.
- Breeders used a reciprocal cross to check the results.
