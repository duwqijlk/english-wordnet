simpleMeaning: A heavy stone or iron tool, often with a flat base and a handle, used to crush and mix
  grain, drugs or colour powders against a flat stone.
scope: A heavy tool for crushing and mixing things on a flat stone; pestle and pounder are other names
  for it, not a person who thinks quietly.
examples:
- The painter used a muller to grind the colour powder on the stone slab.
- She picked up the heavy muller and mixed the grain to a fine powder.
