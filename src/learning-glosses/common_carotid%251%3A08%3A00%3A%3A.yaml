simpleMeaning: a blood tube that runs up the neck and splits into an outer tube and an inner tube
scope: A blood tube that runs up the neck and splits in two; common carotid artery is another name for
  this sense; not a blood tube in the arm, and not a vein that carries blood back.
examples:
- The common carotid runs up the side of the neck.
- The doctor felt the pulse in the common carotid.
