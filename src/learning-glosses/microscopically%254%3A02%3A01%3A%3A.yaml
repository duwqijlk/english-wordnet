simpleMeaning: In a way that looks at the smallest points, with great care for every last detail, as if
  through a microscope.
scope: In a way that looks at the smallest points, with great care for every last detail, as if through
  a microscope; not by really using a microscope, so as to be seen only through one.
examples:
- Every manuscript was edited microscopically.
- She read the contract microscopically, checking every last detail.
