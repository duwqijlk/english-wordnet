simpleMeaning: a Chinese fruit with a thin shell that breaks easily, holding sweet soft flesh like jelly
  and one seed; it is often dried
scope: 'Also called lychee, lichee, lichi, litchee, litchi and litchi nut: a Chinese fruit with a thin
  shell and sweet jelly-like flesh, not a nut and not another Chinese fruit.'
examples:
- We ate fresh leechee with its sweet jelly-like flesh.
- Dried leechee kept well in the jar.
