simpleMeaning: A weak pull between tiny bits of matter that comes from how heavy they are, carried by
  tiny bits called gravitons
scope: A weak pull between tiny bits of matter, not the strong pull that holds atoms together and not
  the pull of magnets.
examples:
- A gravitational interaction holds the planets in their paths.
- The two particles felt only a weak gravitational interaction.
