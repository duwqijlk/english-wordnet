senseId: 'trinitroglycerin%1:27:00::'
synsetId: 14910730-n
simpleMeaning: A heavy yellow oily poisonous liquid, able to explode and made by adding nitrate to glycerol;
  used to make explosives, and medically opens blood vessels, sold as Nitrospan or Nitrostat.
scope: This sense is also called nitroglycerin, glyceryl trinitrate, and nitroglycerine, for a heavy yellow
  poisonous oily liquid that can explode, made by treating glycerol with nitrogen compounds or by nitrating
  it, used in making explosives and in medicine to widen blood vessels, sold under the trade names Nitrospan
  and Nitrostat.
examples:
- Trinitroglycerin can explode.
- Trinitroglycerin widens blood vessels.
