simpleMeaning: a person who goes into another person's private life or land or home without being allowed
  to
scope: 'Also called intruder and trespasser: a person who goes where they are not allowed, not a welcome
  guest or visitor.'
examples:
- The villagers saw the reporters as interlopers and asked them to leave.
- An interloper entered the garden through a broken gate without asking.
