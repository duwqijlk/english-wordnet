simpleMeaning: In cooler lands people grow this Pacific plant for show, for its big shiny leaves, while
  in warm lands they grow it for its root, which they eat
scope: Also called taro, dalo, or a taro plant; the plant itself, not just its starchy root sold as food.
examples:
- Dasheen grows well in the warm, wet soil behind the house.
- They dug up the dasheen and boiled its root for lunch.
