simpleMeaning: To tear something away from where it is fixed or where it began, most of all by turning
  and pulling it hard and all at once
scope: 'Also called twist: to tear something away by turning and pulling it hard, not the hand tool and
  not twisting as if in pain.'
examples:
- She wrenched the window off its hinges.
- He wrenched himself free from her grip.
