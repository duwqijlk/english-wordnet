simpleMeaning: a part of a train track with two moving rails and needed links, used to send a train to
  another track or to keep trains aside
scope: This is a part of a train track, not a part for turning power on or off and not a move in basketball.
examples:
- The switch sent the train onto the side track.
- The train waited while the switch moved it to another track.
