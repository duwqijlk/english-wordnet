simpleMeaning: to say things you do not mean, or to say things with no care for whether they are true
scope: 'Fake and bull are other names for this sense: to say things you do not mean, or with no care for
  what is true. It is not the other sense of fake, to make a copy that looks real.'
examples:
- He was bullshitting about how much money he made.
- Stop bullshitting me and tell me what really happened.
