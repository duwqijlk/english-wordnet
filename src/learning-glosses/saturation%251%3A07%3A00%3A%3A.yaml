senseId: 'saturation%1:07:00::'
synsetId: 04982607-n
simpleMeaning: how pure and strong a colour is, with no white mixed in, so the colour looks bright and
  clear
scope: Also called intensity, vividness and chroma. This is how pure a colour is, not the act of soaking
  something in liquid.
examples:
- The saturation of the red paint made it look bright and pure.
- With high saturation, the blue in the photo looks strong, with no white mixed in.
