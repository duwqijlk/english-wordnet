senseId: 'dream%2:36:00::'
synsetId: 01641175-v
simpleMeaning: to let your thoughts drift into pleasant made-up scenes and allow yourself to enjoy them
  while you are awake.
scope: This is not seeing images during sleep, and it is not simply wishing for something; it is letting
  the mind play with imagined scenes.
examples:
- He dreamed of winning the race while the teacher talked.
- She sat dreaming by the river all afternoon.
