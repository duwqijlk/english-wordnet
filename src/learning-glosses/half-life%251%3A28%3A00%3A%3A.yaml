simpleMeaning: Most of all, the time for 50% of the tiny bits in a substance giving off rays to break
  apart; also, the time for a thing to fall by 50%
scope: Also called half life, this is the time for a thing to fall by 50%, most of all for a substance
  giving off rays, not the time a thing lasts in full and not the age of a thing.
examples:
- The half-life of the drug in the body is about six hours.
- Scientists worked out the half-life of the new sample.
