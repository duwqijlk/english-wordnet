simpleMeaning: having a smart, new style in clothes and in the way a person acts
scope: 'Also called dashing, spruce, jaunty, snappy, dapper, natty, raffish and spiffy: smart and new
  in dress and in manners. It is not the sense of acting in a free, wild way that breaks rules.'
examples:
- In his rakish new suit, he looked smart and full of life.
- She had a rakish style, with neat clothes and an easy, bright way of acting.
