simpleMeaning: money put into something very risky, in the hope of a big gain
scope: Money put into a very risky thing in the hope of a big gain; venture is another name for this sense,
  and it is not a guess about what may be true or deep thinking over a subject.
examples:
- He knew the stock was a speculation when he bought it.
- She put her savings into a speculation on gold.
