simpleMeaning: To upset someone in their mind so that they feel uneasy, worried, or alarmed.
scope: This is upsetting someone's mind; trouble, distract, disorder and disquiet are other names for
  this sense, not frightening someone with a sudden shock or driving someone mad.
examples:
- The news of her father's illness unhinged her for days.
- Losing his job so suddenly unhinged him, and he could not sleep.
