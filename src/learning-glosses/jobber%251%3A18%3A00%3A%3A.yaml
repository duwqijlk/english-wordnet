simpleMeaning: A person who buys large amounts of goods and sells them again to shopkeepers, not to the
  people who will use them in the end.
scope: A person who buys large amounts of goods and sells them again to shopkeepers; wholesaler is another
  name for this sense, not a shopkeeper and not a person who buys for their own use.
examples:
- The jobber bought the cloth in bulk and sold it to shops.
- Jobbers supply the small stores in the town.
