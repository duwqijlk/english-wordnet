senseId: 'leach%2:38:00::'
synsetId: 02075555-v
simpleMeaning: To spread slowly into and through something, little by little.
scope: This is spreading slowly into and through something; not washing things out with running liquid,
  and not making liquid run through something.
examples:
- The fertilizer leached into the ground after the rain.
- Salt from the road leached slowly into the nearby stream.
