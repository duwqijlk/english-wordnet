simpleMeaning: Used in casual speech to mean very or completely, adding emphasis.
scope: This is not the sense meaning correct or suitable, and not the direction or hand senses; it only
  adds emphasis in casual speech.
examples:
- That was a right mess you left in the kitchen.
- He made a right fool of himself at the party.
