simpleMeaning: 'of a person: having the qualities that a fighter in war should have'
scope: Also called martial and soldierlike; this is about a person having the qualities a fighter in war
  should have, not about war itself.
examples:
- He stood tall and soldierly, and he did not fear the fight.
- Her soldierly bearing won the respect of the men she led.
