simpleMeaning: Blood tubes, thin cords that carry signals, or tubes that carry body fluid cross over each
  other to form this net.
scope: Also called plexus, it is a net in which blood tubes, thin cords that carry signals, or tubes that
  carry body fluid cross over each other.
examples:
- The rete of blood tubes formed a net where the vessels crossed and recrossed.
- A rete of thin cords that carry signals formed a net in the same way.
