simpleMeaning: long green pods with thick, sticky juice in them; they may be cooked slowly in water or
  fried quickly, but are used especially in soups and stews
scope: 'Also called gumbo: the green pods as food, used especially in soups and stews, not just the pods
  as part of the living plant.'
examples:
- She added sliced okra to the soup.
- We fried the okra in a little oil for dinner.
