senseId: 'probable_cause%1:09:00::'
synsetId: 05832838-n
simpleMeaning: In law, facts strong enough to give good reason for an arrest or for searching a person
  or place and taking things
scope: In law, facts strong enough to give good reason for an arrest or a search, not a mere guess and
  not proof that a crime was done.
examples:
- The officer said there was probable cause to search the house.
- Without probable cause, the police could not make the arrest.
