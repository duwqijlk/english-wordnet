simpleMeaning: a tube-shaped tool that hair is wound around so the hair takes a curved shape
scope: 'Also called roller, crimper, and hair curler: a tool that hair is wound around. Not a brush for
  hair and not a heated tool for making hair straight.'
examples:
- She put curlers in her hair before bed.
- He wound his hair around a curler to shape it.
