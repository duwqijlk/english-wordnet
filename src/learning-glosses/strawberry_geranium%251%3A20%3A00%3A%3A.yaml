simpleMeaning: Bunches of small red-and-white flowers mark this plant of the east of Asia, which spreads
  by many stems that creep along the ground.
scope: People also call it mother-of-thousands and strawberry saxifrage, and it is a plant of the east
  of Asia, with bunches of small red-and-white flowers, that spreads by creeping stems.
examples:
- A strawberry geranium spread across the bed.
- The strawberry geranium flowered.
