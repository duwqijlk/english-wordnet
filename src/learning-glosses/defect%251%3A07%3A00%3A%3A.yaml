simpleMeaning: A mark or fault that spoils how a thing looks, especially on a person's body
scope: A mark or fault that spoils how a thing looks, also called mar; not a fault in how a thing works.
examples:
- A small defect on her cheek showed in every photo.
- The vase had a defect that spoiled its smooth side.
