simpleMeaning: a small egg-shaped fruit from a tree grown in Europe, much used as food and as a source
  of oil
scope: The fruit as a food and a source of oil, not the tree it grows on and not the pickled fruit eaten
  as a relish.
examples:
- Workers pressed ripe olives to make oil for cooking.
- Farms pick olives in autumn and send many of them to be made into oil.
