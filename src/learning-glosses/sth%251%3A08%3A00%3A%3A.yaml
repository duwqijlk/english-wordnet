simpleMeaning: A body chemical made by a small gland under the brain, which makes people grow.
scope: This is the growth chemical made by a small gland under the brain, also called growth hormone,
  human growth hormone, somatotrophic hormone, somatotrophin, somatotropic hormone, and somatotropin,
  not a drug and not a body part.
examples:
- STH makes children grow.
- Doctors gave him STH to help him grow.
