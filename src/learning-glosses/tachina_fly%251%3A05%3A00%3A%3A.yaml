simpleMeaning: A hairy winged insect whose young live inside caterpillars and other insects, feeding off
  them, and one that helps keep harmful insects in check.
scope: This hairy winged insect's young live and feed inside caterpillars and other insects, and it holds
  harmful insects in check.
examples:
- Farmers are glad to see the tachina fly where caterpillars attack the crop.
- The gardener found the young of the tachina fly inside a caterpillar on the plant.
