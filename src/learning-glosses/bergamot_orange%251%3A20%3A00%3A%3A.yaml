simpleMeaning: A small tree in Italy that bears fruit shaped like a pear, with oil from the fruit used
  to make scents.
scope: A small Italian tree grown for the scented oil from its fruit, also called bergamot; not a sweet
  orange tree and not a perfume in itself.
examples:
- The bergamot orange grew in the garden in southern Italy.
- Workers pressed the oil from the bergamot orange to make perfume.
