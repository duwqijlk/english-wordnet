scope: 'Also called common ragweed: a yearly weed with finely cut leaves and green flower spikes, common
  in North America, unlike its perennial relative, which spreads by creeping roots in dry, barren lands.'
examples:
- Ambrosia artemisiifolia grows along the roadside and sheds pollen in late summer.
- Farmers pull out Ambrosia artemisiifolia before it sets seed.
