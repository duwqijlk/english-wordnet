senseId: 'direct_correlation%1:09:00::'
synsetId: 06042428-n
simpleMeaning: a link in which big values of one measure go with big values of the other and small with
  small, with the number for the link between 0 and 1
scope: A link between two measures in which big values go with big values and small with small, also called
  a positive correlation, and not a link in which big values go with small values and not no link at all.
examples:
- The direct correlation between hours of study and test scores was clear.
- A direct correlation showed that taller plants had more leaves.
