simpleMeaning: Of a flower, having soft coloured parts around its centre.
scope: Of a flower, this means it has soft coloured parts, also called petaled and petalous; it is not
  a flower with no such parts, and not a flower part itself.
examples:
- The petalled rose opened wide in the sun.
- A petalled flower has soft parts around its centre.
