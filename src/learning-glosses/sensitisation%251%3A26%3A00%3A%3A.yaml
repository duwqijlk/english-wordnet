simpleMeaning: the state of reacting strongly to something, such as a substance that sets off a reaction
  in the body
scope: The state of reacting strongly to something, such as a substance that sets off a reaction in the
  body; sensitization is another name for this sense; not a course of injections that makes the body react
  and not a growing response to events in the mind.
examples:
- Sensitisation to the drug made later doses risky.
- After sensitisation, even a small amount set off a reaction.
