synsetId: 06572930-n
simpleMeaning: In law, a 'no contest' plea by a person charged with a crime, who does not say they are
  guilty but still takes the punishment of a guilty finding
scope: In law, a 'no contest' plea that still brings a guilty finding; nolo contendere is another name
  for this, not a plea of guilty and not a plea of not guilty.
examples:
- He answered non vult and took the sentence.
- A plea of non vult does not admit guilt.
