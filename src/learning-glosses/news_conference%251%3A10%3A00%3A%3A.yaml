simpleMeaning: Reporters from the press and television come together to put questions to a well-known
  person in public life
scope: Reporters from the press and television come together to put questions to a well-known person in
  public life; a press conference is another name for this sense, not a private talk and not a meeting
  to make plans.
examples:
- The mayor held a news conference to answer questions about the new road.
- Reporters asked sharp questions at the news conference.
