simpleMeaning: To put a covered walkway all around something
scope: 'This is the general sense: putting a covered walkway around something, a garden included. Not
  shutting a person away from the world, and not the garden sense, which names a garden as its example.'
examples:
- They cloistered the old church court with a covered walkway on all sides.
- They cloistered the square by building a covered walkway around it.
