simpleMeaning: the act of turning around one fixed point, or as if on one fixed point
scope: The act of turning on one fixed point; not the pin that a thing turns on, and not the person in
  a line that the others turn around.
examples:
- The dancer's pivot was quick and smooth.
- His golf swing ends with a clean pivot on his front foot.
