simpleMeaning: words or acts that show kind, friendly feelings, especially when people meet; usually used
  in the plural
scope: This is about friendly words or acts on meeting, usually in the plural; it is not the meeting itself.
examples:
- She sent warm greetings to all her old friends.
- He offered greetings to each guest as they arrived.
