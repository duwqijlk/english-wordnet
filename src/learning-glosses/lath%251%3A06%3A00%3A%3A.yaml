simpleMeaning: a narrow thin strip of wood put behind plaster or joined to make a criss-cross frame
scope: A narrow thin strip of wood for plaster backing or latticework; not a plank and not a beam.
examples:
- He nailed the lath to the wall.
- The ceiling was made of lath and plaster.
