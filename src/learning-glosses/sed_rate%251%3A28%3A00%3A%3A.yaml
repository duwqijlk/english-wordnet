senseId: 'sed_rate%1:28:00::'
synsetId: 15302448-n
simpleMeaning: how fast red blood cells sink to the bottom of a tube of blood under set test conditions;
  a high reading usually means swelling or soreness inside the body
scope: This is a blood test that shows how fast red blood cells sink; erythrocyte sedimentation rate and
  sedimentation rate are other names for this sense. Not a count of red blood cells and not a test for
  one illness.
examples:
- The doctor ordered a sed rate to check for signs of swelling in her body.
- His sed rate was high, so the doctor looked for the cause of the swelling.
