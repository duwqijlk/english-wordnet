simpleMeaning: a way a gun works in which the sliding part that seals the barrel must push past some first
  push-back while it is not yet shut tight
scope: 'Also called delayed blowback: a way a gun works, not a gun that stays shut tight and not a gun
  worked by hand.'
examples:
- The retarded blowback design slows the bolt just enough to fire safely.
- Many small guns use retarded blowback instead of a locked breech.
