simpleMeaning: to die, when the body stops doing all the things it needs to stay alive
scope: 'Also called die, go, pass, choke, exit, croak, decease, expire and perish: to stop living, not
  to hit someone on the head and not about a machine stopping work.'
examples:
- After a long illness, the old man conked in his sleep.
- The sick dog conked during the night and did not wake up.
