simpleMeaning: A brittle yellow substance and a useful fiber come from the leaves of this Brazilian tree
  with fan leaves, whose root people can eat.
scope: Also called carnauba and carnauba palm, it is a Brazilian fan palm with an edible root, not a palm
  of the Andes that gives wax for candles.
examples:
- The wax palm gave a brittle yellow wax.
- People ate the root of the wax palm.
