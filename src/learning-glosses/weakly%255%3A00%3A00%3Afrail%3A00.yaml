simpleMeaning: not strong in the body, with little strength in the muscles and little energy
scope: Weak, feeble and rickety are other names for this sense. This is about a body that is not strong;
  it is not about doing something in a weak way or to a small degree.
examples:
- The weakly child needed help to climb the stairs.
- The weakly old dog could hardly stand on its own.
