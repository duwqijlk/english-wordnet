simpleMeaning: A bright-coloured spotted bug, small and round, that feeds on aphids and other small pests
  that harm plants, as a rule.
scope: This bug is also called ladybug, ladybird, lady beetle and ladybeetle, and it feeds on aphids and
  other small pests that harm plants as a rule.
examples:
- The ladybird beetle ate the aphids.
- Ladybird beetles feed on aphids and other small pests.
