senseId: 'escalator%1:10:00::'
synsetId: 06405443-n
simpleMeaning: a part of a contract that lets pay, prices or benefits go up or down when certain things
  change, such as the cost of living
scope: 'Also called escalator clause: a part of a contract about pay or prices changing, not the moving
  stairs that carry people up or down in a building.'
examples:
- The contract has an escalator that raises rent when living costs rise.
- The escalator in his work contract raised his pay when living costs rose.
