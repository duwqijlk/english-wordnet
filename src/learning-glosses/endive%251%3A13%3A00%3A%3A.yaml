simpleMeaning: A kind of the plant that shares its name, with leaves that have uneven, frilly edges.
scope: A kind of endive with leaves that have uneven, frilly edges, also called escarole; not the common
  salad endive, whose leaves are curly and jagged or broad and flat and usually blanched.
examples:
- The endive in the salad had frilly, uneven edges.
- She grew endive with frilled leaves for the table.
