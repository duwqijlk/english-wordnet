simpleMeaning: a ski-area lift that carries skiers or sightseers up or down a slope in open seats hanging
  from a looped cable
scope: Another name for the chair lift, with open seats on a moving cable; not an enclosed cable car or
  a rope tow that drags skiers along the snow.
examples:
- The chairlift carried us over the snowy slope.
- They waited in line for the chairlift.
