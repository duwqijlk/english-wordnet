simpleMeaning: In histology, keeping a piece of body tissue from changing and making it hard, so its parts
  stay in nearly the same arrangement as in the living body
scope: In histology, keeping a piece of body tissue from changing and making it hard, so its parts stay
  in nearly the same arrangement as in the living body; fixing is another name for this, not a strong
  interest in one thing and not a repair.
examples:
- In the lab, fixation kept the tissue sample from changing.
- The fixation hardened the tissue so it could be cut into thin slices.
