simpleMeaning: any kind of court proceeding in which a person asks the court for a legal remedy
scope: This is a court case seeking a legal remedy, not a set of matching clothes, not a business executive,
  not a man's courting of a woman, not a plea to someone of higher rank, and not one of the four groups
  of cards in a deck.
examples:
- The family brought suit against their landlord over the damaged roof.
- She filed suit against the company for breach of contract.
