simpleMeaning: A rite of old Japan had a warrior cut open his own belly with a sword and so take his own
  life.
scope: Also called hara-kiri, harakiri and seppuku, this rite is one in which a warrior of old Japan cuts
  open his own belly with a sword.
examples:
- Harikari was the way a warrior ended his life.
- The story tells of a samurai who chose harikari.
