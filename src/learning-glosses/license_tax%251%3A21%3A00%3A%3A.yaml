simpleMeaning: Money paid to the government for the right to do something that needs official permission,
  such as selling liquor or practising medicine
scope: License fee and licensing fee are other names for this money paid to the government for the right
  to do something that needs official permission; it is not a tax on income and not a fine.
examples:
- The license tax must be paid each year.
- She paid the license tax before opening her shop.
