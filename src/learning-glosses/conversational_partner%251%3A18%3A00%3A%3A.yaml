simpleMeaning: A person who talks with another person in a back-and-forth exchange.
scope: A person who talks with another in a back-and-forth exchange, not a person who gives a talk and
  not a person who only listens.
examples:
- She was a lively conversational partner at dinner.
- A good conversational partner listens as well as talks.
