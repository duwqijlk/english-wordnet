simpleMeaning: In Britain in the past, a test taken by pupils aged 11 and 12 to pick those fit for a grammar
  school
scope: This was a British test for pupils aged 11 and 12 to pick those fit for grammar school; 11-plus
  is another name for it, not a test for older pupils and not a school-leaving test.
examples:
- She passed the eleven-plus and went to grammar school.
- The eleven-plus picked pupils aged 11 and 12 for grammar school.
