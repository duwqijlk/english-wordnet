senseId: 'incident%3:00:00::'
synsetId: 01862869-a
simpleMeaning: small or not important in itself, sometimes used with 'to', coming along with something
  bigger as a side effect or chance result
scope: Something small that comes with a bigger thing, not a happening or event in itself, and not something
  planned.
examples:
- The extra costs were incidental to the job.
- The confusion was incidental to the quick change.
