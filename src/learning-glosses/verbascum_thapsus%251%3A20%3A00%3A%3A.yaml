senseId: 'verbascum_thapsus%1:20:00::'
synsetId: 12910473-n
simpleMeaning: A tall-stalked, very woolly mullein with thickly packed yellow flowers; long ago, Greeks
  and Romans dipped its stalks in animal fat to make torches for funerals.
scope: Not a foxglove or a sunflower, other tall yellow-flowered plants; also called a torch, common mullein,
  flannel mullein, great mullein, woolly mullein, and Aaron's rod.
examples:
- Verbascum thapsus grew tall by the stone wall.
- The Verbascum thapsus was covered in yellow flowers.
