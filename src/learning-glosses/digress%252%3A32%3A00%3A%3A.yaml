schema: oewn-learning-gloss-v2
senseId: 'digress%2:32:00::'
synsetId: 00782620-v
simpleMeaning: to stop being clear or to turn away, especially from the main subject or the main line
  of an argument, when writing, thinking, or speaking
scope: 'Also called wander and stray: turning away from the main subject when speaking or writing; not
  walking away from a place with no clear aim.'
examples:
- Please do not digress; tell us what happened at the meeting.
- She digressed from her story to talk about her childhood home.
