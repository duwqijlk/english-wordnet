simpleMeaning: to give a short, sharp push with a finger or a pointed thing
scope: 'Also called poke, dig, stab or jab: a short, sharp push, not a long steady shove and not the pointed
  tool sense of prod.'
examples:
- He prodded her ribs with his finger to get her attention.
- She prodded the sleepy dog with her foot until it moved.
