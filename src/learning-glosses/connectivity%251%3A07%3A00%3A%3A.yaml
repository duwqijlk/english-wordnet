simpleMeaning: the fact that things are joined to each other, or how much they are joined to each other
scope: This is the state of being joined, or how much things are joined; not the act of joining one thing
  to another at one moment.
examples:
- Good connectivity between the offices lets staff share files fast.
- Better roads improved connectivity between the two towns.
