simpleMeaning: Dug from the ground as old hard remains, this sticky stuff of New Zealand trees is gathered
  too to paint a bright coat on wood and to lay floors.
scope: Kauri, kauri copal, and kauri gum are other names for this sticky stuff of New Zealand trees, gathered
  to paint a bright coat on wood and to lay floors and most often dug from the ground as old hard remains.
examples:
- They held a piece of kauri resin dug from the earth.
- They brushed varnish made from kauri resin onto a wooden floor.
