simpleMeaning: a stone block for roads, with four straight sides and a top that curves up, once used to
  make roads
scope: A stone block for roads with a top that curves up, once used to make roads; not a round road stone
  and not a home dug under the ground by a badger.
examples:
- The old street was made of grey setts.
- Workers lifted each sett and put it back in place.
