simpleMeaning: any salt or ester (a substance made when an acid joins with something else) of cyclamic
  acid
scope: Any salt or ester of cyclamic acid, not the acid itself and not a salt of some other acid.
examples:
- The chemist made a new cyclamate from cyclamic acid.
- The cyclamate was one of the salts listed in the report.
