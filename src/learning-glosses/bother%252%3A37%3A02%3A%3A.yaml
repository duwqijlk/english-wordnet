simpleMeaning: to leave someone puzzled and unable to think clearly.
scope: Leaving someone puzzled and unable to think clearly, not irritating them, making them nervous,
  or putting them to inconvenience.
examples:
- The riddle bothered her for days; she could not work out the answer.
- Something about the story bothered the detective; the details did not add up.
