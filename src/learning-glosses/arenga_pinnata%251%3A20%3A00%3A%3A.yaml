simpleMeaning: A Malaysian feather palm whose base is thickly covered with fibers; it gives a sweet sap
  used in wine, and the core of its trunk gives sago, a starchy food.
scope: 'Also called gomuti, the gomuti palm, and the sugar palm: a Malaysian feather palm giving sweet
  sap and sago.'
examples:
- Arenga pinnata stood by the house, its base thick with fibers.
- Sap from Arenga pinnata was left to turn into wine.
