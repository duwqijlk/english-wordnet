simpleMeaning: A Malaysian feather palm whose base is thickly covered in fibers; it gives a sweet sap
  used in wine, and its trunk pith yields sago.
scope: The palm itself; gomuti palm is another name for the same tree, and this is not the wine or sago
  made from it.
examples:
- Farmers tap the gomuti for its sweet sap.
- Gomuti grows in the lowlands of Malaysia.
