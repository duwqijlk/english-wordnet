simpleMeaning: the giving of a drug that slows the clotting of blood
scope: Giving a drug to slow the blood from clotting, not the clotting itself and not the drug on its
  own.
examples:
- The nurse started anticoagulation to keep the blood from clotting too fast.
- Anticoagulation helps stop new clots from forming while the old one heals.
