simpleMeaning: strong worry in the mind that makes a sportsperson fail, especially a golfer who then misses
  a short putt
scope: This is a strong nervous feeling in sport that makes a player fail, especially in golf on short
  putts; it is not low skill and not being tired.
examples:
- He got the yips and missed three short putts in a row.
- To beat the yips, she slowed down and took deep breaths before each putt.
