simpleMeaning: of a leaf, wide and round at the tip and narrow at the foot
scope: 'Also called spatulate: a leaf shape that is wide and round at the tip and narrow at the foot;
  not a leaf that is wide at the foot and not a round leaf.'
examples:
- The spatula-shaped leaves grow close to the ground.
- This plant has spatula-shaped leaves with a narrow foot.
