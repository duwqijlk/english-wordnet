simpleMeaning: Feather-like leaves and bright flowers that are usually white mark these trees or bushes,
  grown to make a place look nice.
scope: People grow these trees and bushes to make a place look nice, and their feather-like leaves set
  them apart from other flowering trees and bushes.
examples:
- The inga had bright white flowers.
- We planted an inga for its showy flowers.
