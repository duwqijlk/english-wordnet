simpleMeaning: to place strong players or teams apart, so the best of them do not meet in the first games
scope: To place strong players or teams apart, so the best of them do not meet in the first games, not
  to put small hard parts in the ground, not to let a plant drop its small hard parts, and not to give
  money to a new firm.
examples:
- The top two players were seeded apart so they could only meet in the final.
- The organisers seeded the best teams so they would not meet in the early rounds.
