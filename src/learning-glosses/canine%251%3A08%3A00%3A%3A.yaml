simpleMeaning: one of four pointed teeth shaped like a cone, two in the top jaw and two in the bottom
  jaw, placed between the front teeth and the teeth behind them
scope: 'Also called canine tooth, cuspid, dogtooth, eye tooth and eyetooth: a pointed tooth, not the animal
  sense of canine and not a word describing a tooth.'
examples:
- Her upper canines are sharp and pointed.
- The dentist checked the canine between her front teeth and the teeth behind it.
