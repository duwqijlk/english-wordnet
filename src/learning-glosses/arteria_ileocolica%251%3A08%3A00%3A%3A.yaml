senseId: 'arteria_ileocolica%1:08:00::'
synsetId: 05354440-n
simpleMeaning: A branch of the superior mesenteric artery that supplies the end of the small intestine,
  the pouch where the large intestine begins, the appendix and the ascending colon.
scope: Another name for the ileocolic artery, the vessel that feeds the end of the small intestine, cecum,
  appendix and ascending colon; not the superior mesenteric artery it branches from, and not the right
  colic artery.
examples:
- The surgeon tied off the arteria ileocolica before removing the right side of the colon.
- A branch of the arteria ileocolica supplies the appendix.
