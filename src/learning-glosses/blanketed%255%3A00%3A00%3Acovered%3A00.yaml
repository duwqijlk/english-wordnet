simpleMeaning: covered over the whole surface by a thick soft layer
scope: This describes a thing covered over its whole surface by a layer; it is not the covering itself,
  and not the act of covering a thing.
examples:
- In the morning the hills were blanketed in fresh snow.
- The whole field was blanketed with a thin layer of white frost.
