simpleMeaning: speak to someone in a harsh, angry way to show strong disapproval
scope: This is angry verbal criticism of a person; scold, rebuke and reprimand are other names for it,
  not a mild complaint about something or a calm warning.
examples:
- The coach jawed the referee for the bad call.
- She jawed her son for coming home late.
