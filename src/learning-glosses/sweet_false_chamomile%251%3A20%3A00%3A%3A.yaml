simpleMeaning: Like the herb it is named for in smell and use, this plant of Europe and Asia lives one
  year, but tastes more bitter and is thought weaker in effect.
scope: Wild chamomile is another name for it, a plant of Europe and Asia that lives one year, like the
  herb it is named for in smell and use but more bitter and thought weaker in effect.
examples:
- Along the bank grew the sweet false chamomile.
- The sweet false chamomile smelled like its kin but tasted more bitter.
