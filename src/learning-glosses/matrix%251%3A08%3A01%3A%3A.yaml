simpleMeaning: the material in the body in which the cells that make up body parts are held in place
scope: The material that holds cells in the body, not the soft material at the base of a nail where the
  nail grows, and not a hard form used to make copies.
examples:
- The cells sit in a matrix that holds them in place.
- This matrix is the material around the cells in the body tissue.
