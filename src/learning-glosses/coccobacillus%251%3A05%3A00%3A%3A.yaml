simpleMeaning: a tiny living cell half-way in shape between a round germ and a rod-shaped germ; a very
  short rod-shaped germ
scope: A tiny living cell half-way in shape between a round germ and a rod-shaped germ, and a very short
  rod-shaped germ at that; not a fully round germ, and not a long rod-shaped germ.
examples:
- The coccobacillus is shorter than most rod-shaped germs.
- Under the lens, a coccobacillus looks half round and half rod-shaped.
