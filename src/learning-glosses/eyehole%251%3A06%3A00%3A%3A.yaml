simpleMeaning: a small hole, usually round and with neat edges, in cloth or leather, made for a cord,
  hook, or bar to go through
scope: 'Also called eyelet: a small hole in cloth or leather for a cord, hook, or bar, not a hole in a
  door or oven for looking through.'
examples:
- Tie the cord through the eyeholes in the leather.
- A small hook fits through the eyehole at the top of the curtain.
