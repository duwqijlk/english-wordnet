simpleMeaning: A measure of how fast a computer works out sums, equal to one billion sums with decimal
  points each second.
scope: Also called a gigaflop and a billion floating point operations per second; a measure of computer
  speed, set beside MIPS and TFLOPS, other measures of how fast a machine works.
examples:
- The new machine runs at ten GFLOPS, a fast speed for its time.
- GFLOPS counts how many billion sums a computer can do in a second.
