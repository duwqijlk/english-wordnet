simpleMeaning: A person held to be low and loathsome.
scope: This sense is also called rat, crumb, git, skunk, puke, bum, scumbag, stinker, lowlife, and rotter,
  for a person held to be low and loathsome, where rat is a person who other people think is very bad
  and not worth any respect, crumb is a person who other people think is very bad and not worth any respect,
  git is a low, hateful person that others hold in contempt, and skunk is a person that people look down
  on as low, mean, and not to be trusted, unlike the sense for a small fresh-water turtle that gives off
  a strong musky smell.
examples:
- The stinkpot is a person held to be low.
- Stinkpots are held to be loathsome.
