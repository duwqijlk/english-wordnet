scope: This tree of Brazil in the group Euterpe has young leaf buds that are eaten like the leafy green
  vegetable, and is not the low-growing palm of the southern United States and not the West Indian or
  Australian kinds.
examples:
- The cabbage palm grew in Brazil.
- Young cabbage palm buds were eaten like the leafy green vegetable.
