simpleMeaning: a health problem that shows only when a person has two changed genes on a chromosome that
  does not set sex
scope: 'Also called autosomal recessive defect: a health problem that needs two changed genes, not a health
  problem from one changed gene and not one from a gene on a sex chromosome.'
examples:
- The child had an autosomal recessive disease because both parents passed on the same changed gene.
- She learned that the autosomal recessive disease ran in her family.
