simpleMeaning: grey-green leaves, very thick and juicy, grow in tight clumps with no stem, feeling like
  lumps of stone; the plants come from South Africa
scope: 'Also called living granite and stone mimicry plant: stemless plants of South Africa with stone-like
  leaves, not a bare rock.'
examples:
- The living rock by the path looked like a stone until I saw its thick green leaves.
- Living rock forms tight clumps in South Africa.
