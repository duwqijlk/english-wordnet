simpleMeaning: a flash of light in the sky during a storm that moves fast in a zigzag path and splits
  into two at one end
scope: This is a flash in the sky that zigzags and splits at one end; chain lightning is another name
  for it, not a single straight flash or a sheet of light across the sky.
examples:
- Forked lightning lit up the whole sky.
- We watched the forked lightning split across the clouds.
