simpleMeaning: grown in warm lands, any of many fruits with thick skin outside and wet flesh within
scope: 'Also called citrus and citrous fruit: a thick-skinned, juicy fruit of the Citrus group grown in
  warm lands, not a stone fruit or a berry.'
examples:
- The market sold citrus fruit with thick rinds and juicy pulp.
- He squeezed a citrus fruit over the fish and ate the wet flesh.
