simpleMeaning: A small radio set you hold in your hand, used where the land is split into small parts,
  each with its own short-range sender and receiver.
scope: A small radio set you carry, used in small land parts each with its own sender and receiver; cell,
  cellphone, cellular telephone and mobile phone are other names for this sense.
examples:
- She spoke on her cellular phone while waiting for the bus.
- His cellular phone rang in the middle of the meeting.
