simpleMeaning: the muscle that people eat from a sea animal with a fan-shaped shell, served cooked under
  strong heat, in hot water, in salads, or in cream sauces
scope: 'Also called escallop and scollop: the soft meat people eat, not the whole living sea animal with
  its shell and not a thin slice of meat.'
examples:
- She ordered scallops cooked in a cream sauce.
- The scallops were cooked in hot water and served in a salad.
