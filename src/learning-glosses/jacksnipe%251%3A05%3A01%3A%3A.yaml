simpleMeaning: An American shore bird that wades and puffs out its chest to win a mate
scope: An American wading shore bird that puffs out its chest to win a mate; pectoral sandpiper is another
  name for this sense, not a plain snipe and not a bird that puffs its chest at other times.
examples:
- A jacksnipe puffed out its chest on the mudflat.
- The jacksnipe courts its mate in spring.
