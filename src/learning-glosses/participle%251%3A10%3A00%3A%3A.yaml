simpleMeaning: a verb form that cannot stand as the main verb alone; in English it describes nouns and
  helps form tenses made of more than one word
scope: 'Also called participial: a verb form used to describe a noun or build a longer verb form, not
  a verb that stands alone as the main verb in a sentence.'
examples:
- In 'the broken window', 'broken' is a participle used to describe a noun.
- The participle 'going' helps make the form 'is going'.
