simpleMeaning: Nearly gone from the world, this small Australian animal, striped and with a pouch for
  its young, has a long nose and strong claws for eating termites.
scope: This small striped animal is also called anteater and numbat.
examples:
- The banded anteater dug at the termite nest with its strong claws.
- A banded anteater with a pouch for its young fed on termites.
