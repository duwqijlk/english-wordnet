simpleMeaning: A tool that measures the push of a steady flow of power
scope: A tool that measures the push of a steady flow of power, not the kind with three points used to
  set the sound in a radio or television.
examples:
- He used a potentiometer to check the push in the wire.
- The potentiometer showed that the steady flow had a push of twelve volts.
