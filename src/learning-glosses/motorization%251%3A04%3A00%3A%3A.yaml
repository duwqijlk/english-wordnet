simpleMeaning: The act of fitting engines, or vehicles with engines, to something.
scope: Also called motorisation; the act of fitting engines or engine-driven vehicles to something, not
  the use of engines that are already fitted.
examples:
- Motorization changed the farm's old horse carts.
- The motorization of the army took years.
