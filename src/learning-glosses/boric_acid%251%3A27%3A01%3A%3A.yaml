simpleMeaning: A white or clear, slightly acid solid dissolving in water and ethanol, used for glass,
  paper, and glues, in cleaners, as a welding flux, also an antiseptic and food keeper.
scope: This sense is also called orthoboric acid.
examples:
- Boric acid dissolves in water.
- They used boric acid as an antiseptic.
