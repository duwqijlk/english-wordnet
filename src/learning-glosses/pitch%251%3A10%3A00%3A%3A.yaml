simpleMeaning: talk that tries to make people buy or accept something, by giving reasons and showing it
  to them
scope: A talk that tries to sell something or win support for it; not a baseball throw, not a soccer field,
  and not how high or low a sound is.
examples:
- Her pitch for the new phone gave good reasons and showed how it works.
- He made a short pitch to win support for his plan.
