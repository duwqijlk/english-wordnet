simpleMeaning: To put a person or thing deep into something, so they are covered by it
scope: To put a person or thing deep into something so they are covered by it, not closing around a thing
  on every side.
examples:
- The teacher immersed her pupils in the new language.
- He immersed himself in the study of birds.
