simpleMeaning: Too ready to think, without good reason, that a rival will take your place, and afraid
  that this will happen
scope: This word for fear of a rival taking your place is also called jealous and overjealous, and is
  not simple anger and not a wish to harm.
examples:
- The green-eyed lover watched every move his rival made.
- Her green-eyed fears grew as the new singer won praise.
