simpleMeaning: to comb flax or hemp with a special comb that splits the plant into thin parts
scope: To comb flax or hemp with a special comb; not the comb itself, and not shouting at a speaker to
  stop them talking.
examples:
- Workers heckle flax before it is made into cloth.
- She heckled the hemp to split it into thin parts.
