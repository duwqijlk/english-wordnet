simpleMeaning: Usually found in males and passed from mother to son, this is a condition people are born
  with that makes them bleed without stopping.
scope: Also called haemophilia and hemophilia, this is a condition people are born with that makes them
  bleed without stopping, usually found in males and passed from mother to son.
examples:
- A small cut bled without stopping because of his bleeder's disease.
- Bleeder's disease passed from his mother to him.
