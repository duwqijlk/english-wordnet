simpleMeaning: A poisonous mushroom with a pale top covered in fine grey threads
scope: A poisonous mushroom told apart from other mushrooms of its kind, which have yellow plates or white
  or tan-orange tops, by its pale top covered in fine grey threads.
examples:
- Tricholoma pardinum has a pale top covered in fine grey threads.
- Do not eat Tricholoma pardinum; its pale top hides a poison.
