simpleMeaning: The person, thing or scene that an artist or photographer chooses to show in a picture.
scope: This is not the topic of a talk or text, and not a person forced to obey; it is only what a picture
  shows.
examples:
- The artist chose a sleeping cat as the subject of her painting.
- Tourists were the main subject of his photographs.
