simpleMeaning: A plant from Europe that lives for many years, with leaves in rows on each side of a stem,
  and bright blue or white flowers
scope: This is a plant from Europe that lives for many years, with leaves in rows on each side of a stem
  and bright blue or white flowers; charity, Greek valerian, Polemonium caeruleum, Polemonium van-bruntiae
  and Polymonium caeruleum van-bruntiae are other names for this sense, and it is a plant with blue or
  white flowers, not the hanging ladder of ropes that sailors use.
examples:
- Jacob's ladder bloomed bright blue in the cottage garden.
- We planted Jacob's ladder along the path for its blue flowers.
