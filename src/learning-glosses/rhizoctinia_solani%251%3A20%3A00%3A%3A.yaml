simpleMeaning: A fungus that brings a disease to potatoes, marked by black rough spots on the underground
  stems.
scope: Also called potato fungus and Pellicularia filamentosa; a fungus that brings a disease to potatoes,
  not a fungus that eats dead wood and not a germ that harms people.
examples:
- Rhizoctinia solani left black spots on the potato tubers.
- Farmers dread Rhizoctinia solani in wet years.
