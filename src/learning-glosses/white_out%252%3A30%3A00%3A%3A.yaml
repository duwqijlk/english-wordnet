synsetId: 00304587-v
simpleMeaning: to make the gaps between lines of print wider by putting in thin strips of metal
scope: To widen the gaps between lines of print by adding thin strips of metal, not to cover up print
  with white fluid and not to blank out a word.
examples:
- The typesetter will white out the column before the proof is made.
- The printer had to white out the page to fit the extra lines.
