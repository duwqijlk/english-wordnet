simpleMeaning: This stuff makes moving parts slide smoothly and slows the tiny bits inside machines that
  make power from atoms.
scope: Also called graphite and black lead; a substance used to make moving parts slide smoothly and to
  slow the tiny bits inside machines that make power from atoms, not the plant of the same name and not
  a fuel.
examples:
- Workers put plumbago on the moving parts to keep them sliding smoothly.
- Plumbago slows the tiny bits inside machines that make power from atoms.
