simpleMeaning: The bulb of this plant is used as a medicine, and thick spikes of tiny white blooms rise
  from it.
scope: Sea squill and squill are other names for this plant, whose thick spikes of tiny white blooms rise
  over a bulb used as a medicine.
examples:
- The sea onion bears thick spikes of tiny white blooms.
- The bulb of the sea onion is used as a medicine.
