simpleMeaning: A hit from the bat in the bat game is this kind when it stays between the two lines that
  mark the sides of the field.
scope: In the bat game, the lines at the sides of the field decide it, and a hit from the bat that stays
  between them is this kind.
examples:
- The fair ball rolled past third base and into the outfield.
- He watched the fair ball land just inside the line.
