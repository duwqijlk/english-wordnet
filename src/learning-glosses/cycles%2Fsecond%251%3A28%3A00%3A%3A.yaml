simpleMeaning: 'A rate for repeats: it says how many times a thing happens in one unit of time, with one
  hertz for one repeat, named for Heinrich Rudolph Hertz.'
scope: Also called cycle, hertz, cps, and cycle per second, it gives the rate at which a thing repeats.
examples:
- The dial showed the rate in cycles/second.
- The book gave the wave rate as cycles/second.
