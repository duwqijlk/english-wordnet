simpleMeaning: A place where people pay to use machines and rooms for exercise, to get fit and stay healthy
scope: A place where people pay to use machines and rooms for exercise, to get fit and stay healthy; not
  a public park, and not a hospital.
examples:
- She goes to the spa three times a week to swim and work out.
- The hotel spa has a pool, a gym, and rooms for massage.
