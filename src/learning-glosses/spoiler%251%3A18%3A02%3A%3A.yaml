simpleMeaning: a person who treats someone too kindly and gives them far too much of what they want
scope: This is a person, also called a coddler, who gives someone far too much of what they want. It is
  not a part on a plane wing or on the back of a car, and not a person who takes things by force in war.
examples:
- As a spoiler, Grandma always gave the children sweets and let them stay up late.
- He is a spoiler who never says no to his daughter.
