simpleMeaning: A tall cereal grass with kernels set on large ears, grown in many varieties across America
  and long the chief grain of Mexico and Central and South America.
scope: The cereal plant and its crop, not the strong yellow colour also called maize; corn is the everyday
  name for the same plant.
examples:
- Maize reached Europe only after explorers brought it back from the Americas.
- In many African countries, maize is the main food crop.
