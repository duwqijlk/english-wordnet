simpleMeaning: this light liquid turns to air fast, catches fire easily, and can poison; it stops water
  freezing, dissolves things, and burns as fuel, and makes spirits unfit to drink
scope: Also called methanol, methyl alcohol, and wood spirit, a poisonous liquid that burns easily, not
  the alcohol in drinks.
examples:
- Wood alcohol can poison anyone who drinks it by mistake.
- Mechanics add wood alcohol to the tank to stop the water freezing.
