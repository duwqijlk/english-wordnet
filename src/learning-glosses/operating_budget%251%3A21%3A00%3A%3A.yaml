simpleMeaning: A plan for what will be spent on day-to-day costs, not on money deals or on lasting changes
  to what it owns
scope: A spending plan for running costs, not a book of how to use a machine and not a tool for seeing
  small things in surgery.
examples:
- The school set its operating budget for the coming year.
- Her operating budget covers pay and power but not a new roof.
