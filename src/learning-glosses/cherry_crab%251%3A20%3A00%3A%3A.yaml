simpleMeaning: This wild Asian tree is grown in many kinds, and its small sour fruit, usually red, is
  kept for later use.
scope: 'Also called cherry apple: a wild Asian tree grown for its small sour fruit, not a tree grown for
  sweet fruit to eat fresh.'
examples:
- The cherry crab bore small sour fruit.
- People kept cherry crabs for later use.
