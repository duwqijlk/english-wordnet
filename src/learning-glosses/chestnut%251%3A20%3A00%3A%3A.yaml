simpleMeaning: one of several good-looking trees that lose their leaves and turn yellow-brown in autumn,
  and give hard wood and nuts you can eat in a prickly case
scope: A tree that loses its leaves and turns yellow-brown in autumn, giving hard wood and nuts you can
  eat; not the nut itself, not the hard spot on a horse's leg, and not the wood or the brown colour.
examples:
- A chestnut stood at the end of the garden.
- The chestnuts turned yellow-brown in autumn.
