simpleMeaning: An exchange between different cultures or ways of thinking that helps both sides and brings
  forth good work
scope: An exchange between different cultures or ways of thinking that helps both sides, also called cross-fertilisation;
  not a quarrel and not a one-sided borrowing.
examples:
- The cross-fertilization of science and the creative arts led to new work.
- Cross-fertilization between the two schools enriched both.
