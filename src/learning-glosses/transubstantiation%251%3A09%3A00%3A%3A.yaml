  when they are made holy at the holy meal.
scope: The Roman Catholic teaching that the bread and wine wholly turn into the body and blood of Christ
  when made holy at the holy meal.
examples:
- Catholics hold transubstantiation as a teaching of their church.
- Transubstantiation means the bread and wine wholly become the body and blood of Christ.
