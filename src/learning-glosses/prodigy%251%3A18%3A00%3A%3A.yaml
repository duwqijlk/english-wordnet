simpleMeaning: a very able and smart young person, whose great skill makes other people feel wonder and
  strong respect
scope: This is a young person whose skill is rare and very great, not just a child who learns fast or
  does well at school.
examples:
- She was a music prodigy who could play hard pieces at age six.
- The young chess prodigy beat much older players.
