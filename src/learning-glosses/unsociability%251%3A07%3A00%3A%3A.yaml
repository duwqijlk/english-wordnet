simpleMeaning: the way of a person who keeps away from other people and does not want friends or company
scope: 'Also called unsociableness: a person''s wish to keep away from others, not shyness about talking
  and not a dislike of one person.'
examples:
- His unsociability showed in the way he ate alone and turned down every invitation.
- 'Her unsociability was clear: she avoided friendship and kept to herself.'
