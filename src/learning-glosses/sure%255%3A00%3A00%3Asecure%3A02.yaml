simpleMeaning: Firm and steady enough not to give way or fail.
scope: This is not being certain in your mind and not describing a person you can trust; it describes
  a thing that is physically firm and reliable.
examples:
- The climber found sure footing on the wet rock.
- A sure grip on the rope kept him from falling.
