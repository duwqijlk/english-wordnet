simpleMeaning: with a bad taste and not nice, spoiled by something mixed in
scope: This sense means bad to taste and spoiled by something mixed in, not the sense that means a little
  salty, as when sea water mixes with river water.
examples:
- The thin soup had a brackish taste and no one wanted a second bowl.
- He spat out the brackish drink, spoiled by something mixed into it.
