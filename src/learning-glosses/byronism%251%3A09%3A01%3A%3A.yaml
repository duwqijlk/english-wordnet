simpleMeaning: Copying the ways and beliefs of the poet Byron, or holding them as one's own.
scope: Copying the ways and beliefs of the poet Byron, not the marks of his poems themselves.
examples:
- His Byronism showed in the way he dressed and spoke like the poet.
- Byronism spread among young writers of the time.
