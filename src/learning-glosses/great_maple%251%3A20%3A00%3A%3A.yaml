simpleMeaning: A Eurasian maple with pale grey bark that peels off in flakes like a sycamore's, and leaves
  with five egg-shaped lobes that turn yellow in autumn.
scope: This sense is also called sycamore, for a Eurasian maple with pale grey bark that peels off in
  flakes like a sycamore's, and leaves with five egg-shaped lobes that turn yellow in autumn.
examples:
- The great maple shed its bark in flakes.
- Great maples turned yellow in autumn.
