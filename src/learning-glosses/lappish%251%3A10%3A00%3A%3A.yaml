simpleMeaning: One of the ways of speaking used by the Lapp people, generally held to be part of the Uralic
  family of languages
scope: One of the Lapp ways of speaking, also called Lappic, Lappic language and Lappish language; not
  the Lapp people themselves and not one single tongue, since it covers several.
examples:
- Lappish is spoken in the far north.
- Old songs in Lappish are still sung at festivals.
