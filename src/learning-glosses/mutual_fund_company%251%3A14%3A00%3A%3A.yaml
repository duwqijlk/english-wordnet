simpleMeaning: A business watched over by the law that puts together things of value from many people
  and keeps selling shares and buying them back.
scope: This is a business that joins things of value from many people into one store, also called a mutual
  fund, an open-end fund or an open-end investment company; not a bank and not a single share.
examples:
- The mutual fund company sold new shares this week.
- She put her savings into a mutual fund company.
