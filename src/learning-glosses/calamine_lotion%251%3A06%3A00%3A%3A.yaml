simpleMeaning: A liquid with calamine in it that you rub on the skin to ease itching or mild skin trouble.
scope: A skin liquid with calamine in it for itching, not a cream for burns or a wash for wounds.
examples:
- She put calamine lotion on the mosquito bites.
- Calamine lotion eased the itch on his arm.
