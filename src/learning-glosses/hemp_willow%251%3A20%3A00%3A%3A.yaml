simpleMeaning: Baskets are woven from the long twigs of this tree, which bend easily
scope: A tree with long twigs that bend easily, used for weaving baskets, also called common osier, not
  a tree grown for wood and not a tree with stiff twigs.
examples:
- They cut hemp willow twigs for the baskets.
- The hemp willow by the river had long, bendy twigs.
