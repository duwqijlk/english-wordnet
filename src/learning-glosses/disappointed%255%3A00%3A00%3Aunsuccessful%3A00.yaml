simpleMeaning: failing to do what was hoped for, and leaving people sad about it
scope: Used of hopes or plans that fail and leave people sad, not of a person who feels let down.
examples:
- The disappointed hopes of the team showed on every face.
- His disappointed plans for the trip were put aside.
