simpleMeaning: This group, in the government branch that runs the country, advises the president on other
  lands, fighting, and the country's safety, and watches over the Central Intelligence Agency.
scope: Also called the National Security Council; this is a group that advises the president, not the
  president himself and not a body that makes laws.
examples:
- The NSC met to talk about the crisis overseas.
- The president asked the NSC for advice before the meeting.
