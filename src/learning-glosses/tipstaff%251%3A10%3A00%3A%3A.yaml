simpleMeaning: a long stick with a metal end, carried to show that a person holds a job such as a bailiff
  or constable
scope: A long stick with a metal end carried as a sign of office, not a walking stick and not a weapon.
examples:
- The constable carried his tipstaff as a sign of his office.
- The bailiff's tipstaff had a bright metal tip.
