simpleMeaning: a tool marked at even spaces along its length, used as a guide when judging the size of
  something
scope: A tool with marks at even spaces, used as a guide in finding sizes; measure and measuring rod are
  other names for this sense, not a ruler for drawing lines, and not a tool that weighs things.
examples:
- The builder held the measuring stick against the wall to check its height.
- She laid the measuring stick along the cloth to mark where to cut.
