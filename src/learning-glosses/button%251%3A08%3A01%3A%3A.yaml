simpleMeaning: a woman's sex organ that is like a penis in how it is made and how it grows
scope: This is a word for a part of a woman's body; not the piece on clothes, not a badge, and not a switch
  or a screen area.
examples:
- Some women use the word button for the small, very sensitive part of their sex organs.
- The health book says the button can feel pleasure when it is touched.
