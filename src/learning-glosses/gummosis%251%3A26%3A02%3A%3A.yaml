simpleMeaning: Citrus trees fall sick when a kind of fungus called Phytophthora citrophthora gets into
  them
scope: A sickness of citrus trees, also called brown rot gummosis, not the sticky stuff that oozes from
  a tree and not a sickness of stone-fruit trees.
examples:
- Gummosis left dark wet patches on the bark of the orange tree.
- The farmer cut away the parts of the tree hurt by gummosis.
