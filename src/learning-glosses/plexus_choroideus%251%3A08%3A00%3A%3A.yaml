simpleMeaning: A net of blood tubes in the hollow spaces of the brain that keeps the pressure inside them
  steady
scope: A net of blood tubes in the hollow spaces of the brain that keeps the pressure inside them steady;
  choroid plexus is another name for this sense, and this is not a net of nerves.
examples:
- The plexus choroideus keeps the pressure steady in the brain's hollow spaces.
- A plexus choroideus is a net of blood tubes in the brain.
