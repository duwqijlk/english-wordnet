simpleMeaning: A cut in the trunk of a tree, made so the tree will fall in the direction you choose
scope: This is a cut in a tree trunk to guide its fall, not the soft meat sense and not a sports hit that
  spins a ball back.
examples:
- The worker made an undercut in the trunk so the tree would fall away from the house.
- A deep undercut helped the tree fall in the right direction.
