senseId: 'taboo%2:41:00::'
synsetId: 02514626-v
simpleMeaning: to say that something is holy and is not allowed
scope: This is the verb, to say a thing is holy and not allowed; it is not the noun for a ban that comes
  from custom, and not the word for a thing kept from common use because it is holy.
examples:
- The village elders tabooed the burial ground and said it was holy.
- The priest tabooed the spring, so no one was allowed to take water from it.
