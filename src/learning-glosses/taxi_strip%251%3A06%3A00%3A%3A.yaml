simpleMeaning: a long hard flat path on the ground where planes move slowly on their way to or from the
  runway
scope: 'Also called a taxiway: a path for planes to move slowly on at an airport, not the runway itself
  and not a road for cars.'
examples:
- The plane turned off the taxi strip and waited near the gate.
- Workers repaired a crack in the taxi strip before the morning flights.
