simpleMeaning: In logic, a claim that is true just when another claim is false, and false just when the
  other is true.
scope: In logic, a claim that is true just when another claim is false; not a spoken no to a claim and
  not the act of saying no to it.
examples:
- The negation of 'it is raining' is 'it is not raining'.
- In class, they wrote the negation of each claim on the board.
