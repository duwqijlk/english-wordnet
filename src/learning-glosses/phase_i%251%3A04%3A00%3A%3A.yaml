simpleMeaning: A first safety test of a new drug or a tool that enters the body, on a few people; for
  drugs, dose or the highest safe amount should be found
scope: This is the first safety test, on a few people, of a new drug or a tool that enters the body, also
  called phase I clinical trial, not a test on many people and not a test of a drug already in use.
examples:
- Phase I tested the new drug on a few people.
- The phase I trial checked whether the drug was safe.
