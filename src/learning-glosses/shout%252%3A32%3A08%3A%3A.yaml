simpleMeaning: To say something aloud, often from surprise, horror, or joy.
scope: Saying a word or phrase aloud out of strong feeling, also called a cry, not a wordless sudden burst
  of sound or a habitual loud manner of talking.
examples:
- '''I won!'' she shouted.'
- '''Look out!'' he shouted in horror.'
