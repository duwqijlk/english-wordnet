simpleMeaning: In music, a sign placed over a note, a chord, or a rest to show it should be held longer,
  with no set length given
scope: In music, a sign over a note, a chord, or a rest that shows it should be held longer, with no set
  length given; not a sign for loudness and not a rest on its own.
examples:
- The fermata held the last note long.
- She saw the fermata above the chord and waited.
