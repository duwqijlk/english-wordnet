senseId: 'organicism%1:09:00::'
synsetId: 06003591-n
simpleMeaning: The idea that what makes a living thing live is how all its parts work as one whole, not
  how each part works on its own
scope: A theory that the whole body makes life, not a slow change of kinds and not a body sickness.
examples:
- Organicism holds that life comes from the whole, not from single parts.
- The writer defended organicism against those who studied organs alone.
