simpleMeaning: A person sent to another country, above all to spread a faith or do good work for others
scope: A person sent abroad to spread a faith or do good work; missionary is another name for this sense,
  and not a person sent on a work trip of another kind.
examples:
- The young missioner sailed to India in 1902.
- As a missioner, she taught children and helped the sick.
