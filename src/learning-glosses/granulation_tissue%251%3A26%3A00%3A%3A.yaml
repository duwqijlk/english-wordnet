simpleMeaning: Tiny blood tubes run through fresh soft stuff that holds parts of the body together, forming
  on a wound while it heals.
scope: Also called granulation, this names the fresh soft stuff, threaded with tiny blood tubes, that
  forms on a wound while it heals.
examples:
- Granulation tissue formed over the wound as it healed.
- The granulation tissue held the edges of the cut together.
