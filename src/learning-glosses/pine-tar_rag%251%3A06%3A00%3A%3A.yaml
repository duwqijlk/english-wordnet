simpleMeaning: 'baseball gear: a cloth soaked in pine tar, rubbed on the handle of a baseball bat so the
  batter can hold it firmly'
scope: A cloth soaked in pine tar for a batter's grip, not a rosin bag and not a batting glove.
examples:
- He wiped the bat handle with a pine-tar rag before stepping up to bat.
- The pine-tar rag left a sticky smell on his hands.
