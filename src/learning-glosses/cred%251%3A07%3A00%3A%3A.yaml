simpleMeaning: the quality of being trusted and thought well of by young people in cities who like new
  styles
scope: This is being trusted and liked by young people in cities who like new styles, not being trusted
  by people in general.
examples:
- The singer gained cred with young fans in the city.
- Wearing those clothes gave him more cred among young people downtown.
