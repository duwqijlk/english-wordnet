senseId: tubercular%5:00:00:ill:01
synsetId: 02557624-s
simpleMeaning: Made up of, suffering from, or brought on by the disease tuberculosis or by the germ that
  causes it.
scope: Made up of, suffering from, or brought on by the disease tuberculosis or by the germ that causes
  it; not a word for having the marks or lumps the disease leaves, not a word for having to do with the
  disease or those who suffer from it, not a word for having to do with a normal lump or knob of bone,
  and not a person with the disease in the lungs.
examples:
- The child was tubercular and spent months in a sanatorium.
- Her cough was tubercular, the doctor said.
