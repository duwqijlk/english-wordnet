simpleMeaning: A yellow crystal drug got from a soil microbe; it is used to treat many ills caused by
  germs and by rickettsiae, tiny germs that live in cells.
scope: A yellow drug from a soil microbe, used against germ ills, close to other yellow germ-killing drugs;
  also called hydroxytetracycline, oxytetracycline and oxytetracycline hydrochloride.
examples:
- The vet gave the calf Terramycin for its chest infection.
- Terramycin cleared the infection in a few days.
