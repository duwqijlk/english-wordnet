simpleMeaning: a gambler who takes bets from other people and pays money to those who win, especially
  on horse races
scope: Also called bookmaker, this is a person who takes bets, especially on horse races, not a person
  who places a bet.
examples:
- He placed a bet on the horse with a local bookie.
- The bookie paid her money after her horse won the race.
