simpleMeaning: A set of programs made to run a store of facts kept as things, each with its own facts
  and ways of acting
scope: A set of programs made to run a store of facts kept as things, each with its own facts and ways
  of acting; not a set of programs for plain lists of facts, and not the store itself.
examples:
- The firm bought an object-oriented database management system for its records.
- An object-oriented database management system keeps each thing with its own facts.
