simpleMeaning: In a way that is unfair and rude, treating someone as if they count for nothing.
scope: In an unfair and rude way, also called foully; not merely in a disrespectful way.
examples:
- He insultingly brushed aside her hard work as worthless.
- The official insultingly refused even to hear their case.
