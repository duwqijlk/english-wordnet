simpleMeaning: an officer on a ship who keeps the money records and looks after the people travelling
  on the ship
scope: The ship officer for money records and for looking after people travelling on the ship, not the
  captain who sails the ship.
examples:
- The purser kept the ship's money records in his office.
- Passengers asked the purser for help with their rooms.
