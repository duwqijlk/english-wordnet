simpleMeaning: The back part of the front brain, joining the two halves of the brain to the middle brain
scope: The back part of the front brain that links the brain's halves to the middle brain, not the front
  brain itself and not the back brain; betweenbrain and interbrain are other names for this sense.
examples:
- The diencephalon links the two halves of the brain to the middle brain.
- The diencephalon sits at the back of the front brain.
