simpleMeaning: The mathematical study of limits and change, covering sequences, series, rates of change
  and accumulated totals.
scope: This is the mathematical field built on calculus and limits; it is not the Freudian talking therapy,
  not the general investigation or abstract separation of a whole into its parts, not literary criticism,
  and not the grammatical use of function words instead of endings.
