simpleMeaning: A thick woody plant of Australia with narrow leaves packed at the ends of its branches
  and bunches of white or pink flowers at the tips.
scope: 'Also called Richea dracophylla: a thick woody plant of Australia with narrow leaves packed at
  the ends of its branches and bunches of white or pink flowers, not a true grass and not a tall tree.'
examples:
- The Australian grass tree stood thick and low beside the track.
- White flowers crowned the Australian grass tree at the end of summer.
