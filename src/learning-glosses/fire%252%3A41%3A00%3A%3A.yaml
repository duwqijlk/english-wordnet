simpleMeaning: To bring someone's paid work to an end, or to remove them from an office or position they
  hold.
scope: This is not setting something alight, shooting a weapon or stirring up a feeling; it is ending
  someone's employment or removing them from a post.
examples:
- The company fired him for repeatedly arriving late.
- After the scandal, the board fired the director and appointed an interim replacement.
