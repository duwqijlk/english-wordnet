simpleMeaning: At rest, its shape cannot be told apart from the flesh next to it, so this ring of muscle
  cannot be seen at a post-mortem.
scope: It is a ring of muscle that cannot be seen at a post-mortem, because at rest it cannot be told
  apart from the flesh next to it.
examples:
- The physiological sphincter was not found at the post-mortem.
- At the post-mortem, the physiological sphincter could not be picked out from the flesh around it.
