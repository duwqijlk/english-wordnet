simpleMeaning: a chemical stuff made of many parts, with no carbon in it, that holds ammonia, a sharp-smelling
  gas
scope: A chemical stuff that holds ammonia in its parts, not a plain gas and not a compound made with
  carbon.
examples:
- The ammine was made by joining ammonia to a metal salt.
- Chemists study each ammine to see how its ammonia parts are held.
