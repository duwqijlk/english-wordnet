scope: A solid made from raw oil, used for candles and to keep things from going bad or getting wet; paraffin
  is another name for this sense, and it is not a liquid oil or a solid made from plants.
examples:
- The candle was made of paraffin wax.
- Paraffin wax coats the cheese to keep it fresh.
