simpleMeaning: Said of the Greek thinker Aristotle, or of the ideas he taught
scope: Also called Aristotelian and Aristotelic, and another name for it is peripatetic; not a follower
  of Aristotle, but of or relating to him and his ideas.
examples:
- Aristotelean logic follows rules set out by the Greek thinker.
- His Aristotelean ideas shaped much later thought.
