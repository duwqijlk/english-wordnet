simpleMeaning: a raised lump on a bone, most often where a muscle or a band joins the bone
scope: A raised part on a bone where a muscle or a band joins it; eminence and tubercle are other names
  for this sense. Not a broken bone and not a lump on the skin.
examples:
- The tuberosity on the heel bone gave the tendon a place to join.
- The surgeon felt the tuberosity where the muscle joined the bone.
