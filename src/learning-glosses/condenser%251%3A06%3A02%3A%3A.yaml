simpleMeaning: a hollow tube wound in a circle that turns gas into liquid by taking heat away
scope: This sense is the hollow tube wound in a circle that cools gas into liquid, not a lens for light
  and not just any device that does this work.
examples:
- The condenser is a hollow coil that cools the gas into liquid.
- Steam passed through the condenser and came out as water.
