senseId: 'ticktacktoe%1:04:00::'
synsetId: 00507218-n
simpleMeaning: A game of two players setting by turns a cross or a ring in a nine-space box, with the
  aim of a line of three, crosses or rings, first.
scope: This sense is also called noughts and crosses, tic-tac-toe, tick-tack-toe, ticktacktoo, and tit-tat-toe.
examples:
- Ticktacktoe is played on a grid.
- A ticktacktoe ended in three rings.
