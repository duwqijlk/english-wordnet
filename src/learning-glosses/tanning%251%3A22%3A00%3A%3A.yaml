simpleMeaning: the process by which skin becomes darker after being in ultraviolet light (light that you
  cannot see)
scope: This is skin becoming darker, not a beating with a whip, strap or rope used as a punishment.
examples:
- Tanning happens slowly if you stay in the sun for only short times.
- She noticed tanning on her arms after a week at the beach.
