simpleMeaning: showing a person has little learning or does not like books, art or thinking about ideas
scope: 'Also called lowbrow: about a person with little learning and no love of books or art, not about
  land that has not been made ready for growing plants.'
examples:
- He liked only simple games and jokes, and his friends called his tastes uncultivated.
- Her uncultivated tastes meant she never read books or went to see art.
