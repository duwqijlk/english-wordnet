simpleMeaning: To shape something into a long, narrow raised line
scope: Shaping something into a long raised line, not a line that runs on by itself and not the farm work
  of throwing up soil.
examples:
- The farmer ridged the field into long lines before planting.
- He ridged the soil into low banks for the seeds.
