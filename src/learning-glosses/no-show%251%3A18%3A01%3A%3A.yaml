senseId: 'no-show%1:18:01::'
synsetId: 10382716-n
simpleMeaning: A guest who fails to tell a hotel or eating place that a booking is off, and then fails
  to come.
scope: A guest who fails to tell a hotel or eating place that a booking is off, and then fails to come,
  not a guest who cancels in good time and not a guest who is merely late.
examples:
- The hotel charged the no-show guest for the room.
- A no-show at the restaurant loses the table.
