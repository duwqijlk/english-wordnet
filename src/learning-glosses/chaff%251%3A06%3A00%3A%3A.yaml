simpleMeaning: thin strips of metal foil thrown into the air to confuse radar (a system that finds planes
  by radio waves)
scope: Thin metal strips used against radar; it is not the dry seed coverings and stem bits left after
  grain is cleaned.
examples:
- The pilot released chaff to escape the enemy radar.
- Clouds of chaff floated down after the jet passed.
