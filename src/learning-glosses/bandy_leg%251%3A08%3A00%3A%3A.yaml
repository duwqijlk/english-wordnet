simpleMeaning: a lower limb that bends out at the knee or below it, so the knees sit wide apart when the
  feet are together
scope: 'Also called bandyleg, bow leg, bowleg and genu varum: a limb that bends out at the knee, not a
  straight limb and not one that bends in at the knee.'
examples:
- The doctor looked at his bandy leg and said the bend at the knee was mild.
- Her bandy leg made her walk with her feet close and her knees apart.
