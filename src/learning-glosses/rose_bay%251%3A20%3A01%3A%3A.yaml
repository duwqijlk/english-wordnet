simpleMeaning: Native to the East Indies, this shrub is grown in warm gardens for its narrow evergreen
  leaves and fragrant clusters of white, pink or red flowers, but it is poisonous.
scope: Another name for oleander, the poisonous evergreen shrub with fragrant pink or red flowers; not
  rosebay, the rhododendron, and not rosebay willowherb, the fireweed.
examples:
- A rose bay grew beside the garden gate, covered in pink flowers.
- The rose bay is poisonous, so keep animals away from it.
