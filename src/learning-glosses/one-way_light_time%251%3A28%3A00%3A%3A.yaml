simpleMeaning: How long a ray or a radio wave takes to get, in a single direction, from Earth to a far
  thing in the sky
scope: How long a ray or a radio wave takes to get from Earth to a far thing in the sky in a single direction,
  not the time for a return trip and not the time for a short trip on Earth.
examples:
- The one-way light time to Mars is about three minutes.
- Scientists worked out the one-way light time from Earth to the probe.
