simpleMeaning: the state of being a person who asks other people for food or money
scope: A life of asking other people for money or food; beggary and mendicancy are other names for this
  state, not a job and not a short spell of asking for help.
examples:
- They were reduced to mendicity after the fire took their home.
- Mendicity was the only way left for her to eat.
