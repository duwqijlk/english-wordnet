simpleMeaning: something that turns into a vitamin inside the body of an animal
scope: A substance that turns into a vitamin inside the body of an animal; not a vitamin itself, and not
  a mineral.
examples:
- Carotene is a provitamin that turns into vitamin A in the body.
- The provitamin in the food becomes a vitamin after it is eaten.
