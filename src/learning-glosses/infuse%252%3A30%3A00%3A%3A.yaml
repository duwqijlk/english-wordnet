simpleMeaning: to let something sit in a liquid until the liquid takes its flavour, or until the thing
  is clean
scope: To leave a thing sitting in liquid to give it flavour or to clean it, with steep as another name
  for this sense, and not to put liquid into a vein or to teach by repeating.
examples:
- She will infuse the tea leaves in hot water.
- Infuse the fruit in alcohol for a week.
