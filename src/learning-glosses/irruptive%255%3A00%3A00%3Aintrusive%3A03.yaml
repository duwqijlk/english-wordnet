simpleMeaning: Said of the kinds of rock, such as granite, diorite, and gabbro, that were born of fire
  and set hard far below the ground.
scope: It is said of the kinds of rock, such as granite, diorite, and gabbro, that were born of fire and
  set hard far below the ground, also called plutonic, and not of rock that set hard out in the open.
examples:
- Granite is an irruptive rock, since it hardened deep under the ground.
- Diorite is an irruptive rock that hardened far below the surface.
