simpleMeaning: Some tiny sea or freshwater animals crowd in floating sea life, while others live off fish;
  they have a hard shell and usually six pairs of legs on the chest
scope: A tiny sea or freshwater animal with a shell, also called a copepod; not a crab and not a shrimp.
examples:
- The copepod crustacean is one of the tiny animals in the plankton.
- Some copepod crustaceans live off fish.
