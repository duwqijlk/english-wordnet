simpleMeaning: A wider kind of system for measuring distances, in which two different points can be no
  distance apart
scope: This is a wider kind of system for measuring distances, in which two different points can be no
  distance apart; not a metric space, where two different points are always some distance apart.
examples:
- In a pseudometric space, two different points can sit at zero distance from each other.
- The teacher showed how a pseudometric space differs from a metric space by letting two points share
  one place.
