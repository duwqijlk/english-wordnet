simpleMeaning: 'Drops of silver nitrate put in the eyes usually stop it: sore eyes in a new baby, caught
  while coming through the birth canal.'
scope: It is sore eyes in a new baby, caught while coming through the birth canal, not sore eyes that
  come on later in life.
examples:
- The new baby had ophthalmia neonatorum after coming through the birth canal.
- The drops put in the baby's eyes kept ophthalmia neonatorum away.
