senseId: 'sudation%1:22:00::'
synsetId: 13556464-n
simpleMeaning: the way small glands in the skin make and send out a salty liquid
scope: This is the process of the skin letting out salty liquid; sweating, perspiration, diaphoresis and
  hidrosis are other names for this sense. Not the liquid itself and not a single act of letting it out.
examples:
- After the long run, sudation left his shirt wet.
- Sudation helps the body cool down in hot weather.
