simpleMeaning: A rough stuff made of hard crystals of silicon and carbon, used to wear down other hard
  things.
scope: A rough stuff made of hard crystals of silicon and carbon, used to wear down other hard things,
  not sandpaper and not a cutting blade.
examples:
- The worker smoothed the stone with carborundum.
- Carborundum wears down hard metal.
