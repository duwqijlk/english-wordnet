simpleMeaning: A musical instrument with strings, in the same family as the guitar, with a long neck and
  a round body
scope: This is one kind of instrument with strings, a round body and a long neck. It is not a guitar,
  though it is in the same family.
examples:
- He played the banjo at the country music show.
- Her banjo has a long neck and a round body.
