senseId: 'random_access_memory%1:06:00::'
synsetId: 04059869-n
simpleMeaning: the computer store most programs use while it runs; a chip where any bit can be kept or
  found in any order, and no spot is harder to reach
scope: Also called random-access memory, random memory, and read/write memory; the working store a computer
  uses while it runs, not the disk that keeps files when it is off.
examples:
- Random access memory lets you open many programs at once.
- The laptop's random access memory is full, so it runs slowly.
