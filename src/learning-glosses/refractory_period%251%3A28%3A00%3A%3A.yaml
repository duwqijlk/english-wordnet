senseId: 'refractory_period%1:28:00::'
synsetId: 15252187-n
simpleMeaning: In neurology, after a nerve cell fires or a muscle thread tightens, there is a time when
  a new push brings no answer.
scope: It is the time after a nerve cell fires, when a new push brings no answer, rather than the firing
  itself.
examples:
- The refractory period passed before the nerve cell fired again.
- After the refractory period, the muscle answered the next push.
