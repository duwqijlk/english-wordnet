simpleMeaning: a clever act that fools the eye and seems like real magic to people who do not know how
  it is done
scope: 'Also called magic, trick, and deception: a clever act that fools the eye, not the wider act of
  fooling someone with false ideas.'
examples:
- The magician's illusion made the coin seem to vanish.
- For his best illusion, he appeared to float in the air.
