simpleMeaning: anything that blocks the way or slows things down and is hard to deal with
scope: 'Also called hitch, interference, hindrance, preventative, encumbrance and incumbrance: this is
  a thing that blocks or slows you, not a medicine to stop illness and not a thing used to stop a woman
  having a baby.'
examples:
- Heavy snow was a preventive that kept cars from moving on the road.
- A fallen tree across the road became a preventive for all drivers.
