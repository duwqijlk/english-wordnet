simpleMeaning: the last point that something can reach, beyond which it cannot go.
scope: This is the endpoint itself that something reaches, not the act of holding something back and not
  a rule about how much is allowed.
examples:
- My patience has finally reached its limit.
- The team's endurance was stretched to the limit.
