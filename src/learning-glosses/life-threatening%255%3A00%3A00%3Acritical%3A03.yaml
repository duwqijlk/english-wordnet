simpleMeaning: A warning of great harm to come is what makes people feel fear and worry
scope: 'Another name for serious, dangerous, grave, severe and grievous: it puts people in fear and worry
  by warning of great harm, not a small risk and not a thing that is merely unpleasant.'
examples:
- The life-threatening illness kept him in hospital for weeks.
- She faced a life-threatening storm on the mountain.
