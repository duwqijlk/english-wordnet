simpleMeaning: To do with the system that moves blood round the body, or with the movement of the blood.
scope: Of the system that moves blood round the body, or of the movement of the blood itself; not the
  use for circulation in general.
examples:
- The illness was circulatory, affecting the flow of blood.
- Her troubles were circulatory, to do with the blood.
