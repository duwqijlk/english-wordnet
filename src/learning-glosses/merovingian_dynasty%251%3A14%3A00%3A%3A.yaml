simpleMeaning: A Frankish ruling house set up by Clovis I, that ruled Gaul and Germany from about 500
  to 750
scope: Also called Merovingian; a Frankish ruling house of about 500 to 750, not a later French ruling
  house and not a single king.
examples:
- The Merovingian dynasty began with Clovis I.
- The Merovingian dynasty ruled Gaul and Germany until about 750.
