simpleMeaning: the making of pictures for art, or of pictures with lines that show how a thing looks or
  works
scope: The act of making pictures or plans, not a picture printed in a book or paper, and not a game where
  people win prizes by chance.
examples:
- She learned drawing at school and now makes pictures of people and places.
- His drawing classes teach him how to make clear plans for buildings.
