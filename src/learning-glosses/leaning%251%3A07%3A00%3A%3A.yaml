simpleMeaning: the way a line or surface stands at a slant, not straight up and down
scope: Another name for this sense is lean, and it is also called list and tilt. It names the slant itself
  of a line or surface, not the word that describes a thing standing at a slant.
examples:
- The leaning of the tower grows a little each year.
- You can see the leaning of the old wall from the street.
