simpleMeaning: watch or find out how something changes and develops over time
scope: This is not obeying orders, going after a person, or subscribing online; it is watching or finding
  out how something develops.
examples:
- Reporters followed the negotiations closely for three months.
- We followed the project's progress in a shared spreadsheet.
