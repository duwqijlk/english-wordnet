simpleMeaning: the act of getting in the way and stopping something from going on
scope: The act of getting in the way and stopping something; not blocking a player in American football,
  not a thing that blocks the way and not bad radio sound.
examples:
- Her interference stopped the plan from going ahead.
- He complained about his sister's interference in his work.
