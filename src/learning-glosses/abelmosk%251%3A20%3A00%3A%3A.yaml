simpleMeaning: a bushy plant of warm Asia, grown for yellow, pink, or deep red flowers much like those
  of the hibiscus
scope: 'Also called musk mallow: a plant grown for its blooms, not the hibiscus itself.'
examples:
- Abelmosk grows in the garden for its pink blooms.
- The abelmosk bush bore yellow flowers all summer.
