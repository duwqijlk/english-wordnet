simpleMeaning: a person whose job is to stand at the door of a court or of a room where laws are made
scope: This is the person at the door of a court or a law-making room, not the act of taking someone to
  their seat in a theatre.
examples:
- The usher at the door of the court checked our names before we went in.
- An usher waited at the entrance of the chamber while the members came in.
