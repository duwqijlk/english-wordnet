simpleMeaning: The armed forces hold back news and words they do not want out, in every kind of such control
scope: Control over news and words by the armed forces, not control by a government office and not a ban
  on one book.
examples:
- Military censorship kept the battle plans out of the papers.
- Under military censorship, reporters could not print the names of the dead.
