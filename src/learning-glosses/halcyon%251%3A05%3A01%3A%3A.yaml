simpleMeaning: A bird of old stories, said to nest on the sea at the shortest day of winter and to calm
  the wind and waves.
scope: A bird of old stories said to nest on the sea and calm the wind and waves, not the adjective for
  calm and peaceful times.
examples:
- The halcyon was said to nest on the floating sea at midwinter.
- Sailors told tales of the halcyon calming the waves.
