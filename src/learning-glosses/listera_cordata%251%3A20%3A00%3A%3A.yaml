senseId: 'listera_cordata%1:20:00::'
synsetId: 12091978-n
simpleMeaning: An orchid with two three-sided leaves and a short loose cluster of green to rust-coloured
  flowers, the lip flushed mauve; found in Europe, Asia, North America, and Greenland.
scope: Also called lesser twayblade; an orchid with two leaves and green to rust-coloured flowers, not
  a tall lily and not a rose.
examples:
- Listera cordata grows in damp woods with two leaves and a cluster of small green flowers.
- We spotted Listera cordata by its mauve-flushed lip.
