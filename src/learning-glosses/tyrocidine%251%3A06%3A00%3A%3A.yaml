simpleMeaning: From a germ found in soil comes this germ-killing drug, a chain of protein blocks that
  is alkaline, not acid, and a main part of tyrothricin.
scope: Also called tyrocidin, it is a germ-killing drug from a soil germ and a main part of tyrothricin,
  made of a chain of protein blocks that is alkaline, not acid.
examples:
- The patient was given tyrocidine to fight the germs.
- The lab tested tyrocidine against the germs.
