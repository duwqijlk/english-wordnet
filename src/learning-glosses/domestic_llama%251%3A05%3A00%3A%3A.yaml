simpleMeaning: An animal kept in the Andes to carry loads and give wool, thought to be a tame kind of
  the guanaco
scope: An animal kept in the Andes to carry loads and give wool, a tame kind of the guanaco; not a wild
  guanaco and not a camel.
examples:
- The domestic llama carried the packs up the mountain trail.
- Domestic llamas give wool and carry loads in the Andes.
