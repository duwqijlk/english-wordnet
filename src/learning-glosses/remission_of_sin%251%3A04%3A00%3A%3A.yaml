simpleMeaning: A formal pardon given by a priest in the sacrament of penance, freeing a person from sin.
scope: Also called remission, absolution, and remittal, this is a formal pardon by a priest in the sacrament
  of penance.
examples:
- The remission of sin was pronounced by the priest.
- She sought remission of sin in penance.
