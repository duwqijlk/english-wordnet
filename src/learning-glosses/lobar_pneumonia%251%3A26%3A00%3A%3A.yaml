simpleMeaning: a lung illness that strikes one or more lobes of the lung, most often brought on by a kind
  of germ
scope: When a kind of germ gets into the lung, it most often brings on this illness, which takes hold
  in one or more lobes.
examples:
- Lobar pneumonia took hold in one lobe of the lung.
- Lobar pneumonia can strike more than one lobe at once.
