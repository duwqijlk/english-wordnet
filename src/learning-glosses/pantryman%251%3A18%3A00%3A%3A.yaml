simpleMeaning: Usually the head servant of a house, this male servant looks after the wine and the food
  served at meals
scope: A male servant in charge of the wine and the food at meals, usually the head servant of a house;
  not the female servant with the same job, and not a waiter who serves at table.
examples:
- The pantryman brought up a bottle of wine from the cellar.
- As pantryman, he set the table for dinner each night.
