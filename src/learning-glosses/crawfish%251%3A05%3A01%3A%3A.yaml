simpleMeaning: a large sea crustacean (an animal with a hard shell) that people eat; its shell has sharp
  points, but it has no large claws like a true lobster
scope: 'Also called crayfish, langouste, rock lobster, sea crawfish and spiny lobster: this is the large
  sea animal, not the small one that lives in rivers and lakes.'
examples:
- The crawfish from the sea had a spiny shell but no big claws.
- At the market, the large sea crawfish was sold as food.
