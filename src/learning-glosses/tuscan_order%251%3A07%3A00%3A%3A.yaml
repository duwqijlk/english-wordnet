simpleMeaning: A Roman way of building columns that looks like the Doric way, but with a shaft that has
  no grooves.
scope: This is a Roman way of building columns, close to the Doric way but with a shaft that has no grooves,
  different from the Doric way with its grooved shafts and from the Ionic way with its curled tops.
examples:
- The Tuscan order has a plain shaft with no grooves.
- This temple uses the Tuscan order for its columns.
