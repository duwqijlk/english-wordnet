simpleMeaning: a woody plant of low wet land near the sea in the southeastern United States, with shiny
  leaves and bunches of sweet-smelling white flowers
scope: This is a woody plant of low wet land near the sea in the southeastern United States, with shiny
  leaves and bunches of sweet-smelling white flowers; titi is another name for it, not the buckwheat grown
  for grain and not a magnolia.
examples:
- The buckwheat tree flowered white along the coast.
- A buckwheat tree stood in the low wet ground.
