simpleMeaning: a strong flap of flesh at the back of the mouth that shuts off the nose when you swallow
  or speak
scope: 'Another name for the soft palate: a flap at the back of the mouth, not the hard roof of the mouth
  and not the thin skin on a young mushroom.'
examples:
- When she swallowed, her velum closed off the back of her nose.
- The velum moved up as he spoke, shutting off his nose.
