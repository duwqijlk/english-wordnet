simpleMeaning: In genetics, the study of all proteins made under the instructions of a genome (the full
  set of instructions in a living thing)
scope: This studies all the proteins linked to one genome; it is not the study of a single protein alone
  and not genetics as a whole.
examples:
- Proteomics helps scientists list all the proteins made from a genome.
- Through proteomics, the team studied the full set of proteins made from the plant's genome.
