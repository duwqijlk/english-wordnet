simpleMeaning: Tears made by the tear glands collect in one of two wide ends of the tear tubes, at the
  inner end of each eye.
scope: Also called dacryocyst and tear sac, this is a wide end of a tear tube at the inner end of an eye,
  not the tear gland and not the tear duct itself.
examples:
- Tears collect in the lacrimal sac at the inner end of the eye.
- The doctor pressed gently on the lacrimal sac to check it.
