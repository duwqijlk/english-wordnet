simpleMeaning: anything added to a thing only to make it look better
scope: This is anything added to make a thing look better, in a broad way; it is not only the small food
  added to a dish, and not the act of putting such food on a dish.
examples:
- A lace garnish ran along the edge of the dress.
- She tied a gold garnish around the plain gift box to make it look nicer.
