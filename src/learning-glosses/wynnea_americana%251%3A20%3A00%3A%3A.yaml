simpleMeaning: A fungus made of several cup-like parts that look like long rabbit ears; the barren surface
  is dark brown and warty, and the spore-bearing surface is smooth and pinkish orange.
scope: A fungus made of several cup-like parts like long rabbit ears, with a dark brown warty barren surface
  and a smooth pinkish orange spore-bearing surface; the morel is a different cup fungus, and so is the
  saddle fungus.
