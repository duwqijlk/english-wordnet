simpleMeaning: A drug from the amphetamine family that wakes up the nerves and takes away hunger, sold
  as clear crystals of a salt form called hydrochloride
scope: 'Also called glass, ice, trash, chalk, and meth, and sold as Methedrine: a drug made from amphetamine
  that wakes up the nerves and takes away hunger, not a hand tool with a turning handle.'
examples:
- The police found crank hidden in the car.
- He had taken crank and could not sleep all night.
