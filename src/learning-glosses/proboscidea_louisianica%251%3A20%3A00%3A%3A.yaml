simpleMeaning: A plant that lives for one year, from the south of the United States to Mexico, with large
  whitish or yellowish flowers marked with purple and a long curving beak.
scope: Also called common devil's claw, common unicorn plant, devil's claw, elephant-tusk, proboscis flower,
  and ram's horn; a one-year plant with large whitish or yellowish flowers marked with purple.
examples:
- The Proboscidea louisianica by the fence has large whitish flowers marked with purple.
- A Proboscidea louisianica grew in the dry field, its long curving beak easy to see.
