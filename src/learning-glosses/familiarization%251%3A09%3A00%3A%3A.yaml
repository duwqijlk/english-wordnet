simpleMeaning: The act of getting to know something.
scope: The act of getting to know something; familiarisation is another name for this sense, not knowing
  a thing at first sight and not teaching it to someone else.
examples:
- His familiarization with the new job took a month.
- The familiarization of the new staff went well.
