simpleMeaning: In jousting, riders on each side of a wooden fence charge at one another, and the fence
  keeps them apart at the best angle to break lances.
scope: This fence stands between jousting riders, keeping them apart.
examples:
- The tilt barrier kept the two riders from crashing into each other.
- Knights rode along the tilt barrier.
