simpleMeaning: A large tuna of the open sea, the source of most canned tuna, reaching 93 pounds with long
  side fins, found worldwide in tropical and temperate waters.
scope: A large tuna of the open sea, the source of most canned tuna; the yellowfin tuna is a different
  large tuna, and so is the bluefin tuna.
examples:
- Thunnus alalunga is the tuna in most cans of tuna.
