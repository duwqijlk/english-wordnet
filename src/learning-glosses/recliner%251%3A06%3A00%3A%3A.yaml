simpleMeaning: a chair with arms whose back can be pushed down and whose part for the feet can be lifted
  up so the person in it can lean back
scope: 'Also called a lounger: a chair made for leaning back in comfort, not a plain chair whose back
  and foot part stay fixed.'
examples:
- He fell asleep in the recliner after dinner.
- She pushed the recliner back and put her feet up.
