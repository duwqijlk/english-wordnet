simpleMeaning: The commonest passed-down sickness, where the lungs, bowels and pancreas of a child choke
  with thick phlegm, from a flaw in a single gene, and no cure is known.
scope: This sense is also called cystic fibrosis, fibrocystic disease of the pancreas and mucoviscidosis,
  for the commonest passed-down sickness, where the lungs, bowels and pancreas of a child choke with thick
  phlegm, from a flaw in a single gene, and no cure is known.
examples:
- Pancreatic fibrosis chokes the lungs.
- Pancreatic fibrosis comes from one faulty gene.
