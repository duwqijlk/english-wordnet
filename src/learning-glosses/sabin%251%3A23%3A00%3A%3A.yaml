simpleMeaning: a unit of sound take-in, the same as the take-in by one square foot of a face that takes
  in all sound that hits it
scope: A unit measuring how much sound a face takes in, not a unit of loudness and not a unit of length.
examples:
- The hall's walls were rated in sabins.
- One sabin equals the sound taken in by a square foot of perfect absorber.
