simpleMeaning: a playing card, domino or die with half a dozen dots on its top face.
scope: It is not the number itself and not a group of that many things; it is a game piece that shows
  that many dots.
examples:
- He played the six of hearts and won the trick.
- She rolled a six and moved her counter forward.
