simpleMeaning: a large Australian bird that eats meat and sticks the animals it catches on sharp thorns
scope: This is the large Australian kind that sticks its food on thorns, not the wider group of shrikes
  that do the same thing.
examples:
- A butcherbird flew down and stuck the small lizard on a thorn.
- We saw a butcherbird in Australia with its catch hanging on a sharp branch.
