simpleMeaning: its dried leaves are taken as a drug that clears the bowels; the plant is an upright shrub
  with sprays of yellow-brown flowers, sometimes put in the group Cassia
scope: Also called tinnevelly senna; a shrub whose dried leaves are used as a bowel-clearing drug, not
  a shrub grown for show alone.
examples:
- True senna grows in the herb bed, its yellow-brown flowers bright in summer.
- The dried leaves of true senna were once a common bowel medicine.
