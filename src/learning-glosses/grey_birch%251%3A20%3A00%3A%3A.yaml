simpleMeaning: Where trees were cut down before, this birch of middle size often grows again in eastern
  North America, with white or pale bark and wood of no use.
scope: Also called gray birch, this is a birch of eastern North America with white or pale bark and wood
  of no use, not a birch grown for its wood.
examples:
- The grey birch by the road had white bark that stood out in the winter light.
- After the old trees were cut, grey birch grew back across the clearing.
