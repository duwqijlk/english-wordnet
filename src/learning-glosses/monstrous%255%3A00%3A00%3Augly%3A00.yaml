simpleMeaning: twisted out of its normal shape or size in a way that is not natural, and very ugly to
  look at
scope: 'Also called grotesque: this is about a shape or size that looks twisted and very ugly, not about
  an act that is shockingly cruel.'
examples:
- The story tells of a snake twisted into a monstrous shape.
- A monstrous face stared at them from the dark.
