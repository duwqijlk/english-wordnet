simpleMeaning: A hoofed animal whose young grow inside the mother before birth, with an even number of
  working toes on each foot
scope: A hoofed animal whose young grow inside the mother, also called an artiodactyl and an even-toed
  ungulate; not an animal with one hoofed toe on each foot and not a clawed animal.
examples:
- The pig is an artiodactyl mammal, with hooves that have an even number of toes.
- An artiodactyl mammal walks on hooves with an even number of working toes on each foot.
