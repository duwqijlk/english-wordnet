simpleMeaning: that you can see with your eyes alone, with no tool to help, especially in rocks and parts
  of the body
scope: This sense is about what you can see with your eyes alone, especially in rocks and the body, not
  about earning money and not about something clearly bad.
examples:
- The gross features of the rock can be seen without a microscope.
- Doctors checked the gross structure of the heart with their eyes alone.
