simpleMeaning: a drug that makes a person feel calm and less excited or active
scope: Also called sedative, this is a drug that makes a person calm and less excited, not a drug that
  makes a person more awake or active.
examples:
- The doctor gave him a downer to help him stay calm before the operation.
- She took a downer and soon felt calm and sleepy.
