simpleMeaning: By a set share tied to the payer's income band, a cut in the full sum on which the sum
  owed to the state is worked out leaves less owed.
scope: Also called deduction and tax write-off, this is a cut in the full sum on which the sum owed to
  the state is worked out, not a cut in the sum itself.
examples:
- She claimed a tax deduction on her return.
- His tax deduction saved him money.
