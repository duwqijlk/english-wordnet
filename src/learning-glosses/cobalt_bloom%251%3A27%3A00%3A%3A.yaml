simpleMeaning: a reddish mineral in which cobalt, arsenic and water form monoclinic crystals, used to
  color glass; it typically occurs in veins rich in those two elements.
scope: Another name for erythrite; it is the reddish cobalt-arsenic mineral used to color glass, not a
  flower or the metal cobalt.
examples:
- Cobalt bloom stained the rocks around the mine entrance pink.
- The miners called the pink crust cobalt bloom.
