simpleMeaning: Said of a thing that bears sharp points for its own defence, like barbs, quills, spines,
  thorns, or stiff hairs, and the like.
scope: This word is also called prickly, bristled, barbed, thorny, bristly, spiny, burred, barbellate,
  briary, briery, setaceous, and setose.
examples:
- The burry seed heads caught on her sleeve.
- His hands were scratched by the burry stems.
