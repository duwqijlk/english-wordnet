simpleMeaning: Made up of triangles, or with triangles marked on it.
scope: Of a thing made up of triangles or with triangles marked on it, not the verb use for cutting a
  thing into triangles or shaping it like a triangle, and not the use for finding a place by measuring
  triangles.
examples:
- The pattern was triangulate, with small triangles all over it.
- The design on the cloth is triangulate.
