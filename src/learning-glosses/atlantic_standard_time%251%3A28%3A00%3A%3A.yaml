simpleMeaning: The clock setting in the 4th zone west of Greenwich, set by the 60th line of longitude;
  used in Puerto Rico, the Virgin Islands, Bermuda, and the Canadian Maritime Provinces.
scope: 'Also called Atlantic Time: a clock setting, not daylight saving time, and not the time in other
  zones.'
examples:
- Atlantic Standard Time is four hours behind Greenwich.
- Puerto Rico keeps Atlantic Standard Time all year.
