simpleMeaning: To hurt someone's brain and cause a brain injury
scope: This sense is about hurting the brain itself. It is not about hurting another part of the body
  or just shaking a person.
examples:
- The fall concussed him and left him dizzy for hours.
- She was concussed when her head hit the ice.
