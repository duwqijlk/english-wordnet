simpleMeaning: a fish that few people know, active at night in warm, shallow seas, with a long body that
  is flat from side to side
scope: This is a fish, not a person who cleans floors or streets and not a machine that cleans carpets.
examples:
- A sweeper hid among the rocks in the warm sea at night.
- Sweepers live in shallow water near the shore.
