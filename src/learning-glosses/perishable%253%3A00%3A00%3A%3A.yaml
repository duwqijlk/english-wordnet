simpleMeaning: likely to die, be destroyed, or break down and go bad
scope: Describing a thing that can die, be destroyed or go bad; not the noun perishable, which is food
  that goes bad fast if it is not kept cold.
examples:
- All living things are perishable, so the old tree will not live forever.
- The museum stores its most perishable papers away from light.
