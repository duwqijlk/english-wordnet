simpleMeaning: A wasp that lives in a group and builds its nest from a substance like paper
scope: A wasp that lives in a group and builds a nest from a substance like paper, not a wasp that lives
  alone and not a bee that makes honey.
examples:
- A paper wasp built its nest under the roof of the shed.
- Paper wasps flew in and out of the grey nest by the door.
