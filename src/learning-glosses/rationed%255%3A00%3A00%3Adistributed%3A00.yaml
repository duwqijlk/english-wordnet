simpleMeaning: given out fairly, with each person getting only a small set amount
scope: This is about things given out in small, fair shares to each person; it is not about taking as
  much as you want, and not about food being kept in a shop.
examples:
- We lived on rationed bread and milk during the war.
- The rationed sugar was shared out in small bags for each family.
