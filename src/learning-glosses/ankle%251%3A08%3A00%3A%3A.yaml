simpleMeaning: the joint where the ends of the two bones of the lower leg meet the top bone of the foot
  and let the foot slide
scope: The joint where the lower leg meets the foot, not a bone in the leg and not a bone in the foot
  itself.
examples:
- She twisted her ankle on the step.
- His ankle hurt after the long walk.
