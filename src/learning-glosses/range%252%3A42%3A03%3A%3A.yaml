simpleMeaning: to be able to send a shot a certain distance when fired.
scope: It is not moving around without a plan or a piece of grazing land; it is about how far a gun can
  send a shot.
examples:
- The rifle ranges up to a mile.
- The old cannon ranged about two miles.
