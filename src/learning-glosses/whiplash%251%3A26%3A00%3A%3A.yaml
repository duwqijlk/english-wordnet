simpleMeaning: an injury to the bones in the neck, caused by a sudden quick change in speed, such as in
  a car crash
scope: 'Also called whiplash injury: this is hurt to the neck after a sudden change in speed, not a quick
  blow struck with a whip.'
examples:
- She wore a neck brace for weeks after getting whiplash in the crash.
- Whiplash can leave the neck sore and hard to move.
