simpleMeaning: lambs of this tough sheep of central Asia are prized for soft, curly black coats, and the
  sheep itself has rough hair
scope: 'Also called caracul and karakul: a tough sheep of central Asia with rough hair, whose lambs are
  prized for their soft, curly black coats.'
examples:
- The broadtail sheep of central Asia have rough hair and hardy bodies.
- Lambs of the broadtail are prized for their soft curly black fur.
