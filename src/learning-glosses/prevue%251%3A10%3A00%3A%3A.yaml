senseId: 'prevue%1:10:00::'
synsetId: 06901724-n
simpleMeaning: An ad made of short bits of a film that will soon be shown
scope: An ad made from a film that is coming soon, not the film itself; preview and trailer are other
  names for this sense.
examples:
- The prevue for the new film played before the main feature.
- We watched a prevue of the film coming out next month.
