simpleMeaning: an amount that can change by chance, with no fixed value
scope: An amount that changes by chance; not a group of living things that differ a little from others,
  and not the describing word for showing change.
examples:
- In the model, heat was treated as a variant that could rise or fall by chance.
- The throw of the dice gives a variant, an amount that no one can know before the dice stop.
