simpleMeaning: A person who gets two payments from the government, usually by taking both a wage and a
  pension.
scope: A person who gets two payments from the government, usually a wage and a pension, not a person
  with one government payment and not a person paid by a firm.
examples:
- The retired officer was a double dipper, drawing a salary and a pension.
- As a double dipper, she received two cheques from the government each month.
