simpleMeaning: A living thing that lives in jointed animals and fish, moves into their cells and kills
  them.
scope: A living thing that lives in jointed animals and fish, moves into their cells and kills them; not
  a harmless germ and not a parasite of plants.
examples:
- The microsporidian moved into the fish's cells and killed them.
- A microsporidian lives in jointed animals and fish.
