simpleMeaning: The bump at the back of the head that sticks out furthest is the point skulls are measured
  from
scope: The point at the back of the head that sticks out the most; not the top of the skull and not the
  forehead.
examples:
- The surgeon measured from the inion to plan the cut.
- The inion is the small bump you can feel at the back of your head.
