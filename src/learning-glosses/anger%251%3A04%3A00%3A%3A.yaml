simpleMeaning: aggressive hostility that flares up over a wrong, whether real or imagined, pictured as
  a person and one of the deadly sins
scope: 'This is the deadly-sin sense: aggressive hostility over a wrong; wrath, ire and ira are other
  names for this sense. Not the everyday anger sense, and not the bare state of being angry.'
examples:
- In the mural, Anger is shown as a snarling figure with a sword.
- The sermon counted anger among the deadly sins that ruin the soul.
