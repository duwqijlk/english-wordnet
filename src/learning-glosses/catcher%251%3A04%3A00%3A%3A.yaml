simpleMeaning: In baseball, the place on the team of the player who stands behind home plate and takes
  the balls the pitcher throws
scope: In baseball, the place on the team of the player behind home plate, not the player himself and
  not any other place on the team.
examples:
- He plays catcher for the school team this year.
- Catcher is the hardest place to play on a baseball team.
