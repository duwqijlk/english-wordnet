simpleMeaning: the act of throwing a fishing line out over the water using a long pole and a reel (a small
  round tool that winds the line)
scope: 'Also called cast: throwing a fishing line out over the water, not making something by pouring
  material into a hollow shape.'
examples:
- His casting was smooth, and the line landed far across the river.
- She practised casting at the lake every morning.
