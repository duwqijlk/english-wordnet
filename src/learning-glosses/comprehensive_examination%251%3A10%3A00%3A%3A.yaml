simpleMeaning: a hard test that checks how well a student knows one special subject
scope: A hard test of how well a student knows one special subject, also called a comp or comprehensive;
  not a short quiz and not a test of one short course.
examples:
- She took her comprehensive examination in English literature.
- He passed the comprehensive examination after months of study.
