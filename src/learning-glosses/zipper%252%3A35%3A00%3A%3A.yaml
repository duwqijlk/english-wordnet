simpleMeaning: to shut a bag, coat, or other thing by pulling the two toothed edges together with a sliding
  tab
scope: To fasten something shut with a sliding tab that joins its two toothed edges, not the noun sense
  of the fastener itself.
examples:
- He told her to zipper up her jacket before going out.
- She zipped the bag shut before she left.
