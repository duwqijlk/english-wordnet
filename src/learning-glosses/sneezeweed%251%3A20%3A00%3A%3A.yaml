simpleMeaning: any of a group of plants of the Helenium group that often make people give a sudden sharp
  breath out through the nose
scope: Any of a group of plants that make people give a sudden sharp breath out through the nose; not
  a weed that grows in crops and not a plant grown for food.
examples:
- Sneezeweed grew along the edge of the field.
- He pulled up the sneezeweed before it could flower.
