simpleMeaning: The United States federal office that runs all federal plans for teaching and learning,
  including federal help for schools and learners, set up in 1979.
scope: The United States federal office for teaching and learning, also called Education and the Department
  of Education; not a state office and not a school itself.
examples:
- The Education Department runs federal aid for schools.
- She wrote to the Education Department about her grant.
