simpleMeaning: The springy pull kept by living muscle, blood tubes, and the like is what lets them answer
  a touch or signal.
scope: This springy pull in living muscle and blood tubes is also called tone and tonicity.
examples:
- The doctor tested my tonus.
- The tonus of the muscle was measured in the test.
