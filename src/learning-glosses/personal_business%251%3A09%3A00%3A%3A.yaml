simpleMeaning: Things that touch a person's own life and are their own affair
scope: These are things that touch a person's own life; personal matters is another name for this sense,
  and not the affairs of a whole town or the trade of a firm.
examples:
- His personal business is no affair of ours.
- She keeps her personal business to herself.
