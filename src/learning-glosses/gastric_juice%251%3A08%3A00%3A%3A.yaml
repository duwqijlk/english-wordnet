simpleMeaning: The sour digestive fluid released by glands in the stomach lining, made up mainly of acid,
  mucus and enzymes that break down food.
scope: Another name for gastric acid, the sour digestive fluid from stomach glands; not saliva, which
  comes from the mouth.
examples:
- Gastric juice contains the enzymes needed to begin digesting protein.
- Samples of gastric juice were collected during the procedure.
