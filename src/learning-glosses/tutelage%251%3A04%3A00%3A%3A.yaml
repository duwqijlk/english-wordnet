simpleMeaning: teaching one pupil at a time, usually by a teacher hired privately for that pupil
scope: 'Also called tuition: teaching one pupil at a time, usually by a teacher hired privately; not a
  class with many pupils together.'
examples:
- He made good progress under the tutelage of a private teacher.
- The boy's tutelage was one hour of teaching alone with his teacher each day.
