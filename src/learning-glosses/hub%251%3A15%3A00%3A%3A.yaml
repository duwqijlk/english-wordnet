simpleMeaning: the busy middle place where much activity, trade, travel, or interest comes together, and
  where things around it turn
scope: A busy centre of activity or trade, not the middle part of a wheel.
examples:
- The airport is the hub of travel for the whole region.
- The playground is the hub of activity after school.
