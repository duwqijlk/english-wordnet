simpleMeaning: A written promise that guards the one who gets it from loss if a contract is not kept,
  with the firm that gives it taking on the loss.
scope: A written promise guarding the one who gets it from loss if a contract is not kept; also called
  performance bond; not a loan and not a simple promise with no firm behind it.
examples:
- The builder gave a surety bond before starting the work.
- A surety bond guards the owner if the builder fails to finish.
