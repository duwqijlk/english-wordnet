simpleMeaning: a sharp, burning stuff made by heating a kind of rock
scope: Also called calcium hydroxide, caustic lime, hydrated lime, lime and lime hydrate; it is not the
  white stuff that is used to make it, and not the stuff that gives bones their strength.
examples:
- They made calcium hydrate by heating limestone in a kiln.
- The calcium hydrate burned his skin when he touched it.
