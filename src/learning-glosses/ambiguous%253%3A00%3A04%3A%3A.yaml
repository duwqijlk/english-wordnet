senseId: 'ambiguous%3:00:04::'
synsetId: 00898735-a
simpleMeaning: Open to two or more ways of being understood, or of unclear kind or meaning, or often meant
  to mislead.
scope: Open to more than one reading, or unclear, or often meant to mislead; not something with no meaning
  at all.
examples:
- He gave an ambiguous answer to the question.
- The ambiguous message left everyone unsure what she meant.
