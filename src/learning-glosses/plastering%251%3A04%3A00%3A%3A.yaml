simpleMeaning: the act of putting a soft mix onto a surface so that it becomes hard and smooth when it
  dries
scope: This is the work of putting the soft mix onto a surface, not the mix itself and not a small covering
  for a cut on the skin.
examples:
- Plastering the kitchen wall took him all morning.
- They hired a man to do the plastering in the new house.
