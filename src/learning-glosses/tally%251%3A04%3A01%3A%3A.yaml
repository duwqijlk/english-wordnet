simpleMeaning: In baseball, a point scored when a runner safely touches all four bases.
scope: In baseball, a point scored when a runner safely touches all four bases, with run as another name
  for this sense, and not the act of counting or things agreeing with each other.
examples:
- Their first tally came in the third inning.
- The Yankees' first tally came in the bottom of the ninth.
