simpleMeaning: Any chemical made of carbon that forms when alcohol is added to another chemical called
  aldehyde.
scope: This is what forms when alcohol is added to aldehyde, and it is neither the alcohol nor the aldehyde
  on its own.
examples:
- When alcohol is added to aldehyde, acetal forms.
- The chemist made acetal by adding alcohol to aldehyde.
