simpleMeaning: a block of clay shaped like a box, baked by the sun or in a hot oven, used to build things
  or to cover ground
scope: A baked clay block used for building or for covering ground, not loose clay before it is baked
  and not a block made of stone.
examples:
- The wall was built from red bricks laid one on top of another.
- He laid each brick in a straight line to cover the path.
