senseId: 'scallopine%1:13:00::'
synsetId: 07892257-n
simpleMeaning: Beaten flat and dusted with flour, thin slices of meat, usually calf or bird, are fried
  fast in a pan.
scope: Also called scallopini, it is meat beaten flat, dusted with flour, and fried fast in a pan, not
  meat left thick and cooked slowly.
examples:
- The scallopine was dusted with flour before it went into the pan.
- She fried the scallopine fast in the pan.
