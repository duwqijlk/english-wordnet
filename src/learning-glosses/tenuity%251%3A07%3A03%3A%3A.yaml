simpleMeaning: the small measure of how thick something is, as against how long or wide it is
scope: 'Another name for thinness or slenderness: how thick a thing is through, not how long or wide it
  is.'
examples:
- The tenuity of a hair makes it hard to see.
- The tenuity of the rope worried the climber.
