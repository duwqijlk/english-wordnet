simpleMeaning: a basketball try from the foul line that no one blocks, given because the other team broke
  a rule
scope: A basketball try from the foul line with no one blocking it; charity throw, charity toss, foul
  shot, free throw and penalty free throw are other names for this sense, not a shot taken during open
  play.
examples:
- He sank the charity shot after the foul.
- The charity shot gave them one more point.
