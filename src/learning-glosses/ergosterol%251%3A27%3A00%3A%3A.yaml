simpleMeaning: A fat-like substance found in plants that rays of light which cannot be seen turn into
  vitamin D.
scope: A plant substance that light which cannot be seen turns into vitamin D, not vitamin D itself and
  not a fat from animals; no other name is listed for this sense.
examples:
- Light which cannot be seen turned the ergosterol in the plant into vitamin D.
- The lab shone light which cannot be seen on ergosterol to make vitamin D.
