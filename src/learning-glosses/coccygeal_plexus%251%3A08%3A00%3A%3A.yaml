simpleMeaning: a small web of nerves at the base of the spine, made from the fifth nerve of the lower
  spine and the tailbone nerve
scope: This is a small web of nerves at the base of the spine; plexus coccygeus is another name for this
  sense, not a single nerve and not a web of nerves higher up the spine.
examples:
- The coccygeal plexus sends signals from the tailbone area.
- Damage to the coccygeal plexus can cause pain near the base of the spine.
