simpleMeaning: to say openly, or declare by official judgment, that a person or thing is shameful
scope: Publicly condemning someone or something as shameful, not giving a grade or rank to work or a performance,
  and not the noun senses for a visible clue or a printed symbol; brand is another name for this sense.
examples:
- The newspaper marked the company as a cheat after the scandal.
- The committee marked the practice as disgraceful and demanded a ban.
