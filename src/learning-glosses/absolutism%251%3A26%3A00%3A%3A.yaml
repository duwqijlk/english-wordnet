senseId: 'absolutism%1:26:00::'
synsetId: 14467378-n
simpleMeaning: Rule by fear, through threats of punishment and harm.
scope: This sense is also called tyranny and despotism, for rule by fear, through threats of punishment
  and harm, unlike the sense for a form of rule where the ruler is an absolute dictator, held back by
  no constitution, laws, or opposition, or the like, unlike the sense for the doctrine of an absolute
  being, often tied to idealism in philosophy, and unlike the sense for a set of ideas holding that rule
  should have full power, held back by nothing.
examples:
- Absolutism ruled the land through fear and threats.
- The regime's absolutism relied on punishment and violence.
