simpleMeaning: strictly following old customs; not modern in style or outlook
scope: Not about honesty and not about tidiness; this sense criticizes stiff attachment to tradition.
examples:
- The club was too straight for her taste, with its rules and formal dinners.
- He comes from a straight, old-fashioned family that frowns on tattoos.
