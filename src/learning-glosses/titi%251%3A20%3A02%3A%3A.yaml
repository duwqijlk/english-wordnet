simpleMeaning: A shrubby tree that drops its leaves, of North America's east lands, with bark deeply split,
  with bunches of small blooms, white, sweet, and leaves that taste sour.
scope: This sense is also called sorrel tree and sourwood, unlike the sense for a tree of low-lying coastal
  areas of the south-east United States with glossy leaves and sprays of sweet white blooms.
examples:
- A titi grew in the east.
- Titis bear sour leaves.
