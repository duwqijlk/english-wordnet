simpleMeaning: In music, the leading part or section, or the player who takes the highest part.
scope: In an orchestra or band, said of a part, player, or instrument, as in first violin or first trumpet.
  It is not the ordinal first in time or order, and it means leading rather than simply best.
examples:
- She plays first violin in the city orchestra.
- He played first trumpet with the band for twenty years.
