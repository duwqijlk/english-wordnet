simpleMeaning: A piece of music that follows the beat of a Hungarian dance.
scope: Also called czardas; music in the beat of a Hungarian dance, not a piece written for that dance
  and not a folk song.
examples:
- The violinist played a csardas in the rhythm of the Hungarian dance.
- A csardas in dance rhythm closed the recital.
