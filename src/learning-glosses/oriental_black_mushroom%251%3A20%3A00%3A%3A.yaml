simpleMeaning: An east Asian food fungus with a gold or dark brown to very dark top and a stem you cannot
  eat.
scope: Also called golden oak mushroom, shiitake, shiitake mushroom, Chinese black mushroom and Lentinus
  edodes; this east Asian food fungus is told apart by a gold or dark brown to very dark top and a stem
  that is not eaten.
examples:
- The cook sliced an Oriental black mushroom into the soup.
- Oriental black mushrooms grow on logs in east Asia.
