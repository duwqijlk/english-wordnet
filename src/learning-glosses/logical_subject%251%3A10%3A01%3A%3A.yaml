schema: oewn-learning-gloss-v2
senseId: 'logical_subject%1:10:01::'
synsetId: 92464557-n
simpleMeaning: The part of a sentence that names the doer of the action, or the thing the sentence is
  about
scope: The part of a sentence that names the doer of the action, or the thing the sentence is about, not
  just the word that sits in front of the verb and not the object of the sentence.
examples:
- In 'it is your father speaking', the logical subject is 'father'.
- In 'it is hard to do right', the logical subject is 'to do right'.
