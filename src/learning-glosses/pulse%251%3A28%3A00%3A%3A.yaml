simpleMeaning: how fast the heart beats, usually counted to get a quick idea of a person's health
scope: How fast the heart beats, usually counted to check health, not the swelling of the blood vessels
  and not a seed that can be eaten.
examples:
- The nurse checked his pulse after the run.
- Her pulse was fast after she climbed the stairs.
