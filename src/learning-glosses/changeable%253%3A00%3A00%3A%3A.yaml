simpleMeaning: can become different or be made different, and often becomes different in a way that is
  easy to see
scope: 'Also called changeful: able to be made different and often becoming different, not the sense about
  color looking different in different light.'
examples:
- Her changeable moods went from happy to angry in minutes.
- He has a changeable way of working and often changes his plan in the same day.
