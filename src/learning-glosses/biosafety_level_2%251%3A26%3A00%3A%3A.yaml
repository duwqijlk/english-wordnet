simpleMeaning: A grade of safety work where germs that can make people ill are handled, though they do
  not spread easily.
scope: A grade of safety work where germs that can make people ill are handled, though they do not spread
  easily; not the highest grade and not a sickness itself.
examples:
- Biosafety level 2 work needs gloves and a closed bench.
- The lab met biosafety level 2 rules for the germs it kept.
