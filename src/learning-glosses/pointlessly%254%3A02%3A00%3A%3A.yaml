simpleMeaning: in a way that has no use, no aim, and no good result
scope: This says a thing is done with no use or aim behind it. It is not about a thing done by chance,
  and not about a thing done badly for lack of skill.
examples:
- He spent hours pointlessly moving papers from one pile to another.
- She argued pointlessly long after the choice had been made.
