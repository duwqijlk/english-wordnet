simpleMeaning: one of the natural parts of the twelve months, marked by the equinoxes and solstices or
  by the weather
scope: One of the natural parts of the twelve months, such as spring or winter; season is another name
  for this sense. Not a month, and not a date on the calendar.
examples:
- Autumn is my favorite time of year.
- The time of year changes what the farmers can grow.
