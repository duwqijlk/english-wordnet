simpleMeaning: To hold back a feeling or sound so that other people do not see or hear it
scope: Holding back a feeling or sound so no one knows it is there, not making a sound quieter by covering
  it, and not a small oven for firing things.
examples:
- She muffled her anger so no one would notice it.
- He muffled his laugh with his hand.
