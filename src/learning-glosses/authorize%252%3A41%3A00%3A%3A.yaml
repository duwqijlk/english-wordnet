simpleMeaning: to give someone the power to act or decide, or to hand that power to them
scope: To give someone else the power to act, not to approve a plan or give official clearance for it.
examples:
- She authorized her assistant to sign the papers.
- The director authorized her deputy to make decisions while she was away.
