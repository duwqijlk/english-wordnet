senseId: 'in_vitro%3:00:00::'
synsetId: 01362125-a
simpleMeaning: Outside a living body, in a place made by people, a life process takes place
scope: This is a life process that takes place in a man-made setting outside a living body, and ex vivo
  is another name for this sense, not a process that takes place inside the body.
examples:
- In vitro fertilization takes place outside the body, in a lab dish.
- Doctors study the cells in vitro to see how they grow.
