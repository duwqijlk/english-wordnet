simpleMeaning: A sign that a part of the body is making or holding pus
scope: A sign that a part of the body is making or holding pus; also called purulency. Not the pus itself
  and not a part of the body with no pus.
examples:
- The nurse noted purulence in the wound and cleaned it out.
- Purulence around the cut told the doctor the wound was infected.
