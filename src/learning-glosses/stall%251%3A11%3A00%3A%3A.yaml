simpleMeaning: A fault in flight when a plane loses lift all at once and drops down fast
scope: A loss of lift that drops a plane, not a stable compartment and not a trick to buy time.
examples:
- The plane went into a stall and I couldn't control it.
- A stall made the small plane drop sharply.
