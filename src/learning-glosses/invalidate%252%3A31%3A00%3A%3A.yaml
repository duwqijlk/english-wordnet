senseId: 'invalidate%2:31:00::'
synsetId: 00669020-v
simpleMeaning: to show that a claim, idea or result is not true or cannot be trusted
scope: This is about showing that something is not true, not about making a ticket or paper no good for
  use and not about saying by law that something has no force.
examples:
- New facts invalidated his claim that the road was safe.
- The test results invalidate the first report.
