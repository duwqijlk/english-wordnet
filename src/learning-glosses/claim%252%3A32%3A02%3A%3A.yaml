simpleMeaning: To ask for money or property officially, because the law says you have a right to it.
scope: This is not simply saying something is true, and not taking something that is yours; it is the
  official or legal request for money or property.
examples:
- You can claim the cost of the trip on your taxes.
- The workers claimed unpaid wages from the company.
