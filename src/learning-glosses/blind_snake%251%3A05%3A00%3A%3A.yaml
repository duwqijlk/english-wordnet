simpleMeaning: A worm-like animal that digs in the ground in warm lands and has eyes that barely work.
scope: A worm-like animal that digs in the ground in warm lands and has eyes that barely work, not a worm
  and not an animal with good eyes.
examples:
- The blind snake lives under stones in warm lands.
- A blind snake has eyes that barely work.
