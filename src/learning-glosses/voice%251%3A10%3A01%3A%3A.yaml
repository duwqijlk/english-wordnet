simpleMeaning: The act of putting something into clear, well-ordered words, spoken or written, so others
  can understand it.
scope: This is the act of putting something into words, not a publication or other channel that acts as
  a medium.
examples:
- The protest gave voice to anger that had built up for years.
- Her letters gave voice to grief she could not speak about at home.
