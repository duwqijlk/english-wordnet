simpleMeaning: a senior diplomat who speaks for their country in another country and ranks below an ambassador.
scope: It is a diplomatic post, not a member of the government in charge of a department and not a church
  leader.
examples:
- The minister at the embassy met the foreign secretary.
- She was posted as minister to Sweden.
