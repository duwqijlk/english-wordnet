simpleMeaning: A large two-year herb from Eurasia and Africa, new to North America and bearing white flowers
  and large fern-like leaves, usually in wet places, every part extremely poisonous.
scope: This sense is also called hemlock, poison hemlock, and poison parsley, for a large branching two-year
  plant from Eurasia and Africa, introduced to North America, with large fern-like leaves and white flowers,
  usually in damp places, extremely poisonous throughout.
examples:
- Winter fern grows in wet places.
- Winter fern is poisonous.
