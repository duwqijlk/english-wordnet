simpleMeaning: a rule that sets how far something may go or how much of it is allowed
scope: 'Also called a limitation: a rule that sets how far something may go, not the act of limiting people
  by a rule.'
examples:
- I am willing to accept certain restrictions on my movements while the road is closed.
- The restriction on the building's height keeps the view open.
