simpleMeaning: A body of the United Nations set up by a deal between many lands to grow trade by cutting
  taxes on goods and caps on goods brought in.
scope: Also called General Agreement on Tariffs and Trade; the United Nations trade body set up by many
  lands, not a single nation's trade office.
examples:
- GATT talks cut tariffs in the 1960s.
- The GATT deal opened markets.
