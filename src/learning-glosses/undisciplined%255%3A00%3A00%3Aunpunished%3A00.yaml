senseId: undisciplined%5:00:00:unpunished:00
synsetId: 01908425-s
simpleMeaning: not corrected or punished, and not made to follow rules by other people
scope: This describes a person or group that has not been corrected or punished, not the lasting way of
  not following rules, and not a wild person in all they do.
examples:
- The undisciplined children were never told their noise was wrong, so they kept shouting.
- He went undisciplined after breaking the rule, because no teacher saw him.
