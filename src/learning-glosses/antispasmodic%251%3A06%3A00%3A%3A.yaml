senseId: 'antispasmodic%1:06:00::'
synsetId: 02727458-n
simpleMeaning: a drug that eases or stops sudden tight cramps, most often in the soft muscles inside the
  body
scope: 'Also called antispasmodic agent: a drug that eases or stops cramps, not a drug that kills pain
  and not one that makes muscles strong.'
examples:
- The doctor gave her an antispasmodic for the cramps in her gut.
- He takes an antispasmodic before meals to stop the spasms.
