simpleMeaning: to sing or play music with quick wavering notes that move up and down by half a note
scope: To sing or play with quick wavering notes that move up and down by half a note, with trill and
  warble as other names for this sense, and not to sing with a shaking voice or play a single steady note.
examples:
- The singer quavered through the high notes.
- He quavered the tune on his violin.
