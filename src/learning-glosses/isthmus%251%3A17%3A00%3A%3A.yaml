simpleMeaning: A fairly narrow neck of land, with water on both sides, joining two larger pieces of land.
scope: A narrow neck of land with water on both sides joining two larger land areas, not the cord-like
  tissue in the body.
examples:
- Panama is an isthmus joining North and South America.
- They crossed the narrow isthmus on foot.
