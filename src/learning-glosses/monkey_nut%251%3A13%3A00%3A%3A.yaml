simpleMeaning: A hard case from the peanut vine that most often holds a pair of nuts or seeds; the British
  name for it is groundnut.
scope: This is the seed case of the peanut vine, also called peanut, goober, earthnut, goober pea, or
  groundnut, not the plant it grows on or the loose nuts inside.
examples:
- He cracked open a monkey nut and ate the two nuts inside.
- Monkey nuts are sold in their shells at the market.
