synsetId: 08286178-n
simpleMeaning: In maths, a square grid of numbers with numbers only on the line from the top left to the
  bottom right, and all of those numbers are one
scope: A square grid of numbers with ones down its middle line, not a grid with a different number down
  that line and not a plain list of numbers.
examples:
- The identity matrix has ones on its diagonal and zeros elsewhere.
- The 3 by 3 identity matrix has three ones down its middle line.
