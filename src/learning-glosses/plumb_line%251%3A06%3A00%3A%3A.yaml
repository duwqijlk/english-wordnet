simpleMeaning: The straight up-and-down from one spot is found with a cord and a heavy weight hung from
  it, which points straight down toward the middle of the earth.
scope: A perpendicular is another name for this cord with a heavy weight hung from it, which points straight
  down and shows the straight up-and-down from one spot.
examples:
- The plumb line hung straight down.
- We used a plumb line to find the straight up-and-down from that spot.
