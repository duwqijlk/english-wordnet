simpleMeaning: a problem with the way the body takes in and breaks down food, marked by an uncomfortable
  feeling, a burning feeling in the chest, or feeling sick
scope: This is a problem with the way the body takes in and breaks down food; dyspepsia, stomach upset
  and upset stomach are other names for this sense. Not just a burning feeling in the chest on its own.
examples:
- Spicy food gave him indigestion late at night.
- She took a tablet for her indigestion after the big meal.
