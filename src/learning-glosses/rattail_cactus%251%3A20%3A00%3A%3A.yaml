simpleMeaning: A commonly grown tropical American cactus with thin, creeping stems and huge showy crimson
  blooms that last several days.
scope: Another name for rat's-tail cactus, this same tropical American plant; not another kind of trailing
  cactus.
examples:
- The rattail cactus produced huge crimson blooms that lasted several days.
- She moved the rattail cactus to a hanging basket so its thin creeping stems could trail.
