simpleMeaning: Laid down or set out in level layers, one on top of another.
scope: Also called bedded, laid down or set out in level layers, one on top of another, not set out in
  a run of grades or ranks.
examples:
- The rock was stratified, with clear bands of colour.
- The cliff face looked stratified, layer upon layer of stone.
