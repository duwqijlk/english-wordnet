simpleMeaning: The everyday financial work of a firm that buys and sells investments for clients, including
  carrying out trades and keeping records of customer accounts.
scope: This is not military activity or the running of machines; it is the trade-handling and record-keeping
  side of a financial firm.
examples:
- She works in operations, making sure every trade is recorded correctly.
- Errors in operations can leave a client's account with the wrong balance.
