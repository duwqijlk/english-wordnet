simpleMeaning: an operation to take out part or all of the S-shaped bend of the gut, most often to take
  out a harmful growth
scope: An operation to take out part or all of the S-shaped bend of the gut, most often to take out a
  harmful growth; not an operation on the last straight part of the gut and not an operation on the upper
  gut.
examples:
- She had a sigmoidectomy to remove the growth.
- The sigmoidectomy took out part of his lower gut.
