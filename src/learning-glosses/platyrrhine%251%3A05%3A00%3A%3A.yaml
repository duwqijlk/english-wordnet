simpleMeaning: With hairy faces and wide-set nostrils, these tree monkeys have long tails that usually
  grip branches.
scope: Tree monkeys with hairy faces, wide-set nostrils and long tails that usually grip branches; platyrrhinian
  is another name for them, not a monkey that lives on the ground.
examples:
- The platyrrhine swung through the trees by its long tail.
- A platyrrhine's wide-set nostrils mark it out from other monkeys.
