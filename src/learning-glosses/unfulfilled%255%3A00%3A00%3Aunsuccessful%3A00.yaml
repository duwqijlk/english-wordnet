simpleMeaning: of a person, who has not become all that he or she could be, or done all that he or she
  could do
scope: 'Also called unrealized: this is about a person who has not become all he or she could be, not
  about a wish, plan, or promise that has not come true.'
examples:
- He felt unfulfilled in a job far below what he could do.
- Many unfulfilled artists never got the chance to show their best work.
