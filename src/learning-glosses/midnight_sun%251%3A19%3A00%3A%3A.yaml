simpleMeaning: The bright round light in the sky that can be seen at twelve at night inside the Arctic
  or Antarctic circles.
scope: The bright round light in the sky that can be seen at twelve at night inside the Arctic or Antarctic
  circles; not the light seen at noon and not the moon.
examples:
- In the far north, the midnight sun shines at twelve at night.
- Travellers came to see the midnight sun inside the Arctic Circle.
