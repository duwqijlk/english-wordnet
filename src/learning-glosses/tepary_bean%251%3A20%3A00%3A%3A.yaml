simpleMeaning: a plant that winds round other plants, found in the south-west of the United States and
  Mexico, with nearly round beans that are white, yellow, brown or black
scope: A plant that climbs by winding, known for its round beans; not the bean it bears and not another
  kind of bean plant.
examples:
- The farmer planted tepary bean in the dry field.
- Tepary bean plants wound round the fence posts.
