senseId: 'fluke%1:06:01::'
synsetId: 03374613-n
simpleMeaning: a sharp part that sticks out and points back on a harpoon or arrow
scope: This is the sharp part that points back on a harpoon or arrow, not the flat part of an anchor,
  not a part of a whale's tail, and not a small flat worm that lives inside animals.
examples:
- The harpoon's fluke is a sharp part that points back, away from the tip.
- Each fluke on the arrow is a sharp part that points back.
