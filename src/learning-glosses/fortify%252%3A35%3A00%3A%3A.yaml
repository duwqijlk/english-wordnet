simpleMeaning: To put strong walls or other defences around a place, as if it were shut in by a wall built
  for war
scope: To put strong defences around a place, not to get ready in your mind for a fight.
examples:
- They fortified the town with high walls and a deep ditch.
- The soldiers fortified the hill before the enemy arrived.
