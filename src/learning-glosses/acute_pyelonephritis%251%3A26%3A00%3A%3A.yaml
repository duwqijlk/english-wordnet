simpleMeaning: a kidney illness that comes when a bladder infection spreads to the kidney
scope: A kidney illness that starts when a bladder infection spreads, not a stomach or brain illness,
  and not a bladder infection that stays in the bladder.
examples:
- The doctor said her acute pyelonephritis came from a bladder infection that had spread.
- He was treated for acute pyelonephritis after his bladder infection moved to his kidneys.
