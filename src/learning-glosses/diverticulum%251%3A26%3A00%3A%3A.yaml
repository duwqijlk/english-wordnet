simpleMeaning: a bulge through the muscle wall of a tube-shaped organ, most of all the large gut
scope: A bulge through the muscle wall of a tube-shaped organ, most of all the large gut; not a swelling
  on the skin and not a hole right through the wall.
examples:
- A diverticulum can cause pain after meals.
- The scan showed a small diverticulum in the gut wall.
