simpleMeaning: To coat or soak through with rubber.
scope: This sense is also called rubber and rubberize, for coating or soaking through with rubber, where
  rubber is to cover a thing with the stretchy stuff, or soak it right through with it.
examples:
- They rubberise the cloth, coating it with rubber.
- They rubberise canvas, soaking it through with rubber.
