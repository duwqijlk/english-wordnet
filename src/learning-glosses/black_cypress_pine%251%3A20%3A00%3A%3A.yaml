simpleMeaning: Prized for its wood and its gum, this Australian tree bears small flat scales for leaves
  and many dark brown seeds.
scope: Also called red cypress pine, this is an Australian tree with small flat scales for leaves and
  many dark brown seeds, prized for its wood and its gum; other Australian trees with scale-like leaves
  are its nearest rivals.
examples:
- The black cypress pine grew in Australia.
- Black cypress pine is prized for its wood and its gum.
