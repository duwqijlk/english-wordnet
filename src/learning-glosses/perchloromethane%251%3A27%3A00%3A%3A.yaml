simpleMeaning: A clear, non-burning liquid used to dissolve fats and oils, whose use as a cleaner or fire-quencher
  has faded because it poisons.
scope: This sense is also called carbon tet, carbon tetrachloride and tetrachloromethane, for a clear,
  non-burning liquid used to dissolve fats and oils, whose use as a cleaner or fire-quencher has faded
  because it poisons.
examples:
- Perchloromethane dissolves fats and oils.
- Perchloromethane poisons if breathed.
