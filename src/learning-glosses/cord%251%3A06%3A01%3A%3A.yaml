simpleMeaning: a cloth with raised lines running down it, with a soft cut surface, usually made of cotton
scope: This cloth sense is not a thin rope, not an electric wire for home use, and not the act of tying
  something.
examples:
- He wore trousers made of brown cord.
- The chair was covered in soft green cord.
