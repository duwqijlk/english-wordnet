simpleMeaning: Painful swelling of the muscles and soft parts around the bony bump at the end of a bone.
scope: A painful swelling of the muscles and soft parts around the bony bump at the end of a bone, not
  a break in the bone and not a swelling of the joint itself.
examples:
- Epicondylitis made his elbow ache when he lifted things.
- She had epicondylitis around the bony bump of her elbow.
