simpleMeaning: Bright red and black feathers mark the grown male of a bird of warm parts of America, found
  as far north as southern Texas and Arizona.
scope: Also called the firebird, this is the bird of warm parts of America whose grown male has bright
  red and black feathers.
examples:
- The vermillion flycatcher in Arizona had bright red and black feathers.
- We saw a vermillion flycatcher in southern Texas.
