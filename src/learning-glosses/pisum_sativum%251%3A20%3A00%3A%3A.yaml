simpleMeaning: A plant that bears peas, which people most often eat fresh, not dried.
scope: This is the plant that bears peas eaten most often fresh, also called common pea, garden pea, and
  garden pea plant; other pea plants and peas eaten dried are other senses.
examples:
- Pisum sativum grew in rows in the garden.
- We picked Pisum sativum and ate the peas fresh from the pod.
