simpleMeaning: A high-voltage machine where parts that turn current one way fill store-houses of charge;
  these let go, pushing charged bits through a tube that speeds them up.
scope: Also called Cockcroft-Walton voltage multiplier, Cockcroft and Walton accelerator and Cockcroft
  and Walton voltage multiplier, this is a high-voltage machine that builds up charge and lets it go to
  push charged bits through a tube that speeds them up.
examples:
- The Cockcroft-Walton accelerator speeds up charged particles.
- Scientists use the Cockcroft-Walton accelerator to speed up tiny charged bits.
