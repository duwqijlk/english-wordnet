simpleMeaning: A bunch of strong threads by which a shellfish, such as a mussel, holds itself fast to
  a surface that does not move.
scope: A bunch of strong threads that hold a shellfish fast, also called a beard; not the shell itself
  and not the soft body inside.
examples:
- The mussel clung to the rock by its byssus.
- Byssus threads hold the mussel fast to the pier.
