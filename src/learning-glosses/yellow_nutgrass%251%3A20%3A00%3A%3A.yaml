simpleMeaning: a plant from Europe with small round parts you can eat, shaped like nuts, that grow under
  the ground
scope: This is a plant from Europe with small round parts you can eat; chufa, earth almond, ground almond
  and rush nut are other names for this sense, not a nut tree and not a grass used for lawns.
examples:
- We dug up yellow nutgrass and ate the small round tubers.
- Yellow nutgrass grows along the edge of the field in Europe.
