simpleMeaning: in a way that is different from the usual way or from what people expect
scope: 'Also called curiously: this is a way of acting, speaking or sounding that is not the usual way
  and not what people expect.'
examples:
- He spoke oddly, in a very slow and quiet voice.
- The dog behaved oddly, hiding from people it knew well.
