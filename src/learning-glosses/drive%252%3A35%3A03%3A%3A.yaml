simpleMeaning: To hit a golf ball with the long club that has a big head and is used for the first shot
  from a tee.
scope: This is the golf stroke with the long club from the tee, not the hard sideways swing of a baseball
  bat, not the broader sense of sending something moving fast by striking or throwing it, not pushing
  or propelling something with force, not operating a vehicle, not compelling someone, and not the noun
  sense of a golf shot.
examples:
- She drove the ball 280 yards off the first tee.
- He drove it past the fairway bunker on the long par-five.
