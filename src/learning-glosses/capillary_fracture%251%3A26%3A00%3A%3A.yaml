simpleMeaning: a break in a bone where the broken parts stay together and the line of the break is very
  thin
scope: 'Also called hairline fracture: a break in a bone where the parts stay together, not a break where
  the parts come apart and not a break with a wide line.'
examples:
- The doctor found a capillary fracture in her wrist.
- A capillary fracture can heal with rest because the bone parts stay in place.
