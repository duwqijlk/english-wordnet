simpleMeaning: A tall plant with a soft woolly coat and thick bunches of yellow flowers; in old times,
  Greeks and Romans dipped its stalks in fat to make torches for funerals.
scope: Also called torch, common mullein, flannel mullein, great mullein, woolly mullein, and Verbascum
  thapsus; a tall woolly plant with yellow flowers, not a low garden flower and not a plant used only
  for food.
examples:
- Aaron's rod grows tall along the old stone wall.
- In old times, people dipped the stalks of Aaron's rod in fat for torches.
