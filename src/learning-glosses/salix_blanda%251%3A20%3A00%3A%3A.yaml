simpleMeaning: A cross-bred willow that usually hangs down only a little.
scope: Also called Salix pendulina, Salix pendulina blanda, or Wisconsin weeping willow, this is a cross-bred
  willow that usually hangs down only a little, not a willow that weeps strongly.
examples:
- Salix blanda hangs down only a little in the garden.
- The Salix blanda by the pond is a cross-bred willow.
