senseId: 'bear%2:40:00::'
synsetId: 02307200-v
simpleMeaning: Hold a title, right, or office as the person entitled to it.
scope: This is holding an official rank, claim, or position, not carrying something in your hands or paying
  another person's bills.
examples:
- He bears the rank of captain but has no command.
- The family still bears an ancient claim to the land.
