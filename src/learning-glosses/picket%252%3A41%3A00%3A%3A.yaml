simpleMeaning: to stand outside a place on guard in protest, or to send people to do so
scope: To stand on guard outside a place in protest, or to put people there, not to tie a thing to a stake.
examples:
- Workers picketed the factory to protest the layoffs.
- The union will picket the store all week.
