simpleMeaning: A heavy metal that can be drawn out and pulls to a magnet, white when pure, quick to rust;
  used in building, tools, and arms, and helps blood carry oxygen
scope: A metal, also called iron and atomic number 26; not steel and not a tool made from it.
examples:
- The old Fe gate had rusted in the rain.
- Fe helps blood carry oxygen through the body.
