simpleMeaning: The sharp drop of the sea floor from the sea floor around a great land mass down to the
  deep sea floor
scope: The sharp drop of the sea floor from the edge of a great land mass down to the deep sea floor,
  also called the bathyal district and the bathyal zone, not the sea floor at the edge itself and not
  the dry land.
examples:
- The continental slope falls steeply beyond the shelf.
- Ships avoid the continental slope when they lay cables.
