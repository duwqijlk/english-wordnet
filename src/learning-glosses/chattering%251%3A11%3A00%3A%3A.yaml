simpleMeaning: the high, sharp sound that birds or monkeys make again and again without stopping
scope: 'Also called chatter: the high sound birds or monkeys make. Not people talking quickly, and not
  teeth knocking together in the cold.'
examples:
- The chattering of birds filled the trees at dawn.
- We heard monkey chattering from the next cage.
