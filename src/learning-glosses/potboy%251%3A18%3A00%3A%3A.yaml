simpleMeaning: A man whose job is in a place where people stay for the night or buy drinks. He serves
  the people there and does many different jobs.
scope: A man who serves people and does many jobs in a place where people stay or buy drinks, not a guest
  there and not the owner.
examples:
- The potboy brought drinks to the guests at the inn.
- The potboy swept the floor and cleaned the tables after closing.
