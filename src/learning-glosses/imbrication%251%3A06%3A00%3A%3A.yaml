senseId: 'imbrication%1:06:00::'
synsetId: 03566837-n
simpleMeaning: A pattern made by putting pieces so that each one covers part of another piece, as tiles
  or shingles do.
scope: A pattern where each piece lies over part of the next, not pieces laid side by side; lapping and
  overlapping are other names for this sense.
examples:
- The imbrication of the roof tiles kept the rain out.
- She admired the imbrication of the shingles on the old cottage.
