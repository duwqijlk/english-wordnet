simpleMeaning: In physics, the point where the weight of the under-water part of a ship or other thing
  that floats seems to act
scope: 'Also called center of immersion, centre of buoyancy and centre of immersion: the point where the
  weight of a floating thing''s under-water part seems to act, not the point where the whole thing''s
  weight acts and not the top of the ship.'
examples:
- The center of buoyancy moves when the ship takes on water.
- Engineers found the center of buoyancy of the new boat.
