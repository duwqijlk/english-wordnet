simpleMeaning: plain and open in the way a small child is, quick to trust what others say
scope: Also called simple, this is about open trust and a readiness to believe, not about looking or acting
  like a young child.
examples:
- She listened with childlike trust to the old story.
- His childlike wonder made the trip a joy.
