simpleMeaning: a cheap piece of bright jewellery, or a bright bit worn on clothes to show off
scope: Cheap bright jewellery or a bright bit on clothes; novelty and trinket are other names for this
  sense, not a ring worn round the wrist.
examples:
- She wore a bangle on her dress that caught the light.
- The market stall sold bangles of bright coloured glass.
