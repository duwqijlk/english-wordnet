simpleMeaning: In the south-west of North America and in Mexico lives a big animal with a bare muzzle,
  a white back and a white tail.
scope: This animal of the south-west of North America and Mexico is also called a badger skunk, a hognosed
  skunk, or a rooter skunk.
examples:
- A hog-nosed skunk has a bare muzzle.
- Hog-nosed skunks live in Mexico.
