simpleMeaning: Yellow cases on a North American bush hold seeds of a bright red, and the bush winds itself
  up other plants.
scope: Also called bittersweet, waxwork, false bittersweet, shrubby bittersweet and staff vine, this twining
  North American shrub is the one with yellow cases holding bright red seeds.
examples:
- The climbing bittersweet had wound itself round the fence.
- The climbing bittersweet wound round the trunk.
