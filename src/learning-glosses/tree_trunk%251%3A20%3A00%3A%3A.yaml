simpleMeaning: the main stem of a tall woody plant, usually with bark on it, and usually the part cut
  and sold as wood for building
scope: This is the main stem of a tall woody plant, also called a trunk or a bole; not a branch and not
  a root.
examples:
- The tree trunk was too wide for us to reach around.
- They cut the tree trunk into boards for building.
