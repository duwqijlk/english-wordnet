senseId: 'curlicue%1:25:00::'
synsetId: 13898609-n
simpleMeaning: a round shape made of rings, one inside another, as in the way leaves or flower petals
  curl round
scope: 'Also called roll, curl, scroll, coil, ringlet, whorl and gyre: this is a shape of rings one inside
  another. It is the shape itself, not the leaf or petal that makes it.'
examples:
- The young fern opened in a tight curlicue of green rings.
- Each petal curled into a small curlicue at the centre.
