simpleMeaning: a point used to measure the skull, at the tip of the sharp bony part of the lower jaw
scope: A point used to measure the skull, not the bony part itself and not a tooth.
examples:
- The coronion marks the tip of the jaw's bony point.
- Researchers placed the coronion at the top of the jaw bone.
