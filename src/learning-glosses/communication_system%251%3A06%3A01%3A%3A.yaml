simpleMeaning: A set of parts that work together to pass news or messages
scope: A set of parts that work together to pass news or messages; not the buildings and machines themselves,
  which is the other sense of the same words, and not a single way of passing news.
examples:
- The town has a new communication system.
- The communication system broke down in the storm.
