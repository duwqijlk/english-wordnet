synsetId: 14408808-n
simpleMeaning: a strong fear of times when other people may judge you, such as eating in front of others
  or speaking in public, but not a fear of open places
scope: A strong fear of being judged in public, such as eating or speaking in front of others; not a fear
  of open places, and not mild worry about meeting people.
examples:
- His social phobia made eating in public very hard.
- Her social phobia kept her from speaking in front of a crowd.
