simpleMeaning: feeling upset and confused and not able to think clearly
scope: Also called rattled, flustered and hot and bothered. It means feeling upset and confused, not calm
  and not able to think in a clear, steady way.
examples:
- She looked perturbed by the bad news and could not answer at once.
- He was perturbed when the lights went out and the room filled with noise.
