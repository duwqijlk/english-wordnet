simpleMeaning: A woman's shoe with a middle-sized heel, usually with the toe and heel in colours that
  stand apart from each other.
scope: A woman's shoe with a middle-sized heel, usually with toe and heel in colours that stand apart,
  not a person watching a game.
examples:
- She wore white spectators with black toes to the dance.
- The spectators in the shop window had red heels and cream toes.
