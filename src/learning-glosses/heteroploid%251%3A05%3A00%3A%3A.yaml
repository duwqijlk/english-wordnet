synsetId: 01322970-n
simpleMeaning: In genetics, a living thing or cell whose count of tiny threads carrying what parents pass
  on is not an even multiple of the single set for its kind.
scope: In genetics, a living thing or cell whose chromosome count is not an even multiple of the single
  set for its kind; not a living thing with a double set, and not one with a missing thread.
examples:
- The lab found the cell was heteroploid, with an odd number of chromosomes.
- A heteroploid plant had three sets of chromosomes instead of two.
