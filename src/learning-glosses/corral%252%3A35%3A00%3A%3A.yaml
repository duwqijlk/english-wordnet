simpleMeaning: to gather and shut in a fenced yard used for animals
scope: To gather and shut in a fenced yard; not to fence a field, and not to arrange wagons in a circle,
  which is another sense of corral.
examples:
- They corralled the horses before nightfall.
- The riders corralled the cattle in the south field.
