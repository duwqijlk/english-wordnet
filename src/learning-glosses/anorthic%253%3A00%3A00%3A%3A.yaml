simpleMeaning: Three lines through the middle of a crystal, all of unlike length and crossing at slanting
  angles, mark this word.
scope: Also called triclinic, this word is used of a crystal with three lines through its middle, all
  of unlike length, that cross at slanting angles.
examples:
- The three lines through its middle marked the crystal as anorthic.
- The anorthic crystals were sorted from the rest by their slanting lines.
