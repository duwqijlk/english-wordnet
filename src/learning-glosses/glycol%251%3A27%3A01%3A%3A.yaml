simpleMeaning: Any of a group of alcohols with two hydroxyl groups, parts made of oxygen and hydrogen,
  in each molecule.
scope: Any of a group of alcohols with two hydroxyl groups, parts made of oxygen and hydrogen, in each
  molecule, not the sweet but poisonous syrupy liquid used as an antifreeze and a solvent.
examples:
- Glycol is one of a group of alcohols with two hydroxyl groups.
- The lab tested a glycol for use in the mixture.
