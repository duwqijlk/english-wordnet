simpleMeaning: Harder and more tightly packed than bone, this chalky stuff forms the main bulk of a tooth.
scope: This is also called dentin, and is the tough chalky material that forms the main bulk of a tooth,
  not the ring round its soft middle.
examples:
- Dentine makes up the main bulk of every tooth.
- The dentine of the tooth was dense and hard.
