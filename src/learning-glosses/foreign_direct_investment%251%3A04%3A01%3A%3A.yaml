simpleMeaning: A business run together by a firm from another land and a firm from the United States
scope: This is a business run together by a firm from another land and a firm from the United States;
  it is not money put in by people abroad to buy part of a United States business.
examples:
- The foreign direct investment built a new factory in Ohio.
- The two firms formed a foreign direct investment to make cars together.
