simpleMeaning: At the same distance from the two far ends
scope: Middle, center, centre and halfway are other names for this sense; this is about a point in the
  middle, not the fun-fair ground at a carnival.
examples:
- They met at a midway point on the road.
- The house stood midway between the two villages.
