simpleMeaning: the inside part of a seed, grain, nut, or fruit stone, which is usually good to eat
scope: The inside of a seed, grain, nut, or fruit stone; meat is another name for this sense, and it is
  not the most important part of an idea.
examples:
- Black walnut kernels are hard to get out of the shell.
- She cracked the nut and ate the soft kernel inside.
