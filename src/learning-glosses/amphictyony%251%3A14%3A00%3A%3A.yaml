simpleMeaning: a league of nearby states or tribes in ancient Greece, first set up to guard a shared holy
  place
scope: A league of Greek neighbours joined to guard a shared holy place, not a trade league and not a
  single city.
examples:
- The amphictyony joined nearby states to guard a shared holy place.
- An amphictyony was formed by tribes who shared one holy centre.
