simpleMeaning: to begin to hold a title, position, duty or responsibility
scope: To take up a post, duty or title, another name for take on or adopt; not to suppose something true,
  seize power, or take on another's debts.
examples:
- She will assume the role of chair next month.
- When will the new President assume office?
