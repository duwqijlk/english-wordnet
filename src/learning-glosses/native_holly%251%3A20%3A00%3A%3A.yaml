simpleMeaning: An evergreen bush of southern Australia that stays low and spreads outward, bearing triangular
  or heart-like leaves and orange-yellow blossoms, then winged flat pods.
scope: Another name for the same low Australian shrub also called common flat pea, not a true holly and
  not a pea crop.
examples:
- Native holly stays low and spreads across the ground.
- Native holly bears orange-yellow flowers followed by flat pods.
