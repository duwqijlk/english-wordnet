senseId: 'longsightedness%1:26:00::'
synsetId: 14577603-n
simpleMeaning: A problem with the eyes in which far things look clear and near things look blurred.
scope: Seeing far things more clearly than near ones; farsightedness, hypermetropia, hypermetropy and
  hyperopia are other names for this sense, not short sight.
examples:
- His longsightedness meant he held the book at arm's length.
- Longsightedness made close work hard for her.
