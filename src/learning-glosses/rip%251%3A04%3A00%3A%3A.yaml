simpleMeaning: the act of tearing something apart, or of splitting it into parts
scope: Also called split and rent, this is the act of tearing a thing apart, not rough water in a river
  and not strong words of blame.
examples:
- He gave the envelope a quick rip to open it.
- One rip down the side ruined the whole sheet of paper.
