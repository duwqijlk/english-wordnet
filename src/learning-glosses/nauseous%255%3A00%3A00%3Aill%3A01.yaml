simpleMeaning: feeling sick in the stomach, as if about to vomit
scope: Feeling sick in the stomach, as if about to vomit; nauseated is another name for this sense, not
  a smell that makes one sick, and not a person who is ill in general.
examples:
- The rocking boat made her feel nauseous.
- He looked pale and nauseous after the long bus ride.
