simpleMeaning: 'Most often read as a sign that the universe is getting bigger: light from distant galaxies
  is moved toward longer waves, toward the red end of its band'
scope: Also called red shift; a change in the light from far-off galaxies, not a change in place and not
  a shift in meaning.
examples:
- The redshift of the galaxy's light points to an expanding universe.
- Scientists use redshift to judge how far away a galaxy is.
