simpleMeaning: Poison runs through this herb of Europe and Asia, which lives year after year with broad
  round leaves, yellow flowers, and a mass of thin roots below ground.
scope: Also called wolfsbane and wolf's bane, this is a poisonous herb of Europe and Asia with broad round
  leaves and yellow flowers.
examples:
- Wolfbane has yellow flowers and broad round leaves.
- Wolfbane lives year after year on a mass of thin roots.
