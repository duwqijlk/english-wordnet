simpleMeaning: A salt or ester (a substance made when an acid joins with alcohol) of carbonic acid, the
  acid with carbon in it; it has the charged part CO3
scope: A substance, a salt or ester with the part CO3, not the verb senses of treating something with
  gas or turning it into this substance.
examples:
- Chalk is mostly calcium carbonate.
- Sodium carbonate is used in making glass.
