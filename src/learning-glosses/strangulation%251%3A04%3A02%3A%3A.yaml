simpleMeaning: In pathology, the squeezing shut of a part of the body, so that blood or other fluid cannot
  flow through it.
scope: In pathology, the squeezing shut of a part of the body so blood or other fluid cannot flow; not
  the act of squeezing a person's windpipe, and not the state of being unable to breathe.
examples:
- The surgeon found strangulation of the intestine during the operation.
- Strangulation of the limb cut off the blood flow.
