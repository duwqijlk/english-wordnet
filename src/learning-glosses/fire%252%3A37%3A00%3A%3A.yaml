simpleMeaning: To bring out or stir up an emotion, a feeling or a reaction in someone.
scope: This is not setting something alight, dismissing someone from work or shooting a gun; it is bringing
  an emotion, feeling or reaction to life in someone.
examples:
- Her speech fired the enthusiasm of everyone in the hall.
- The story fired his imagination, and he began to write.
