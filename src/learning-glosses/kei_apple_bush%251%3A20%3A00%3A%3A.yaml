simpleMeaning: Grown for round yellow fruit, juicy and good to eat, this strong shrub from South Africa
  is covered in sharp points.
scope: Kei apple is another name for this strong South African shrub, which is covered in sharp points
  and grown for round yellow fruit, not the fruit it bears.
examples:
- We planted a kei apple bush for its round yellow fruit.
- They picked round yellow fruit from the kei apple bush.
