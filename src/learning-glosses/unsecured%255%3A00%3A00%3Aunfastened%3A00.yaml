simpleMeaning: Not held fast or made safe.
scope: This sense is also called unlocked, unlatched, unbolted, and unbarred, for not being held fast
  or made safe, where unlocked is not held shut or held in place in a firm way.
examples:
- The door was unsecured, not held fast.
- The gate was unsecured, not made safe.
