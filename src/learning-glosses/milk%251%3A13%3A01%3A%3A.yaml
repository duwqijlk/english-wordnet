simpleMeaning: A white, nourishing liquid that female animals produce for their young and that people
  also drink.
scope: This is the liquid from animals, not a drink made from plants or nuts that is merely similar to
  it.
examples:
- She poured milk into her coffee.
- The farm sells fresh milk from its cows.
