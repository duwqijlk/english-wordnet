synsetId: 00606927-n
simpleMeaning: the position of a warden, a person who is in charge of a place or a group of people
scope: This names the job or position itself. It is not the warden as a person, and not the day-to-day
  work the warden does.
examples:
- After ten years as a deputy, she was given the wardenship of the prison.
- His wardenship lasted five years, and the men under him said he was fair.
