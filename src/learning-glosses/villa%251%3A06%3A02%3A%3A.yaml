simpleMeaning: a house in the country in ancient Rome, with rooms to live in and farm buildings set around
  a courtyard
scope: A country house of ancient Rome with living rooms and farm buildings around a courtyard, not a
  showy modern country house and not a suburban house.
examples:
- The villa had a courtyard where the farm workers gathered at dusk.
- Archaeologists uncovered the remains of a Roman villa near the coast.
