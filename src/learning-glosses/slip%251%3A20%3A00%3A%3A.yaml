synsetId: 13148232-n
simpleMeaning: a part cut from a plant, sometimes a root, leaf or bud, used to grow a new plant by making
  roots or by joining it to another plant
scope: This is a part cut from a plant to grow a new plant, also called cutting. It is not the wet clay
  used on pots, and not a small fall.
examples:
- She took a slip from the rose bush and put it in water to grow roots.
- He planted a slip from the old vine and a new plant grew.
