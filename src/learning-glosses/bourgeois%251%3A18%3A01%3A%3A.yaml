simpleMeaning: a person who owns a business and makes money from making or selling goods
scope: A business owner who makes money from trade and making things, not a worker and not the adjective
  sense of belonging to the owning class.
examples:
- The bourgeois owned several factories in the city.
- Many bourgeois grew rich from trade in the nineteenth century.
