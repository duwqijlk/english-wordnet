simpleMeaning: A build-up of hard waste in the lowest part of the gut that the person cannot pass.
scope: A build-up of hard waste in the lowest part of the gut that the person cannot pass, not ordinary
  hard stools that still pass and not a blockage higher in the gut.
examples:
- The doctor treated the fecal impaction with an enema.
- Fecal impaction left him unable to pass anything for days.
