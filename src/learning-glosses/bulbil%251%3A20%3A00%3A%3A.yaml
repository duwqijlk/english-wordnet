simpleMeaning: This small round growth springs up from the joint where a leaf meets the stem, or in the
  place of flowers
scope: Also called bulblet, this growth is small and round, springing up from the joint where a leaf meets
  the stem, or in the place of flowers.
examples:
- A bulbil grew where the leaf met the stem.
- Bulbils took the place of flowers on the plant.
