simpleMeaning: happy, full of life, and sure of yourself in the way you act and look
scope: 'Also called chipper and debonair: happy and full of life in the way you act, not smart and up
  to date in dress and manners.'
examples:
- She walked in with a jaunty step and a big smile.
- He is a jaunty young man who always seems happy and sure of himself.
