simpleMeaning: a drug or remedy that makes a sick person better, keeps a sickness away, or eases the signs
  of it
scope: A drug or remedy that makes a sick person better, keeps sickness away, or eases its signs, also
  called medicine, not the act of giving such drugs.
examples:
- The doctor gave her medication for the pain.
- He takes medication every morning for his heart.
