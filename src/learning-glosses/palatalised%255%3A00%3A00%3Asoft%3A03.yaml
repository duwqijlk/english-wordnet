simpleMeaning: Said, tongue front or edge against the roof of the mouth, as the 'ch' of 'chin' or the
  'j' of 'gin'; 'y' is one such sound.
scope: This sense is also called palatal and palatalized, for a sound said, tongue front or edge against
  the roof of the mouth, as the 'ch' of 'chin' or the 'j' of 'gin', with 'y' as one such sound.
examples:
- The sound was palatalised, made with the tongue tip.
- The 'y' was palatalised, made at the hard roof.
