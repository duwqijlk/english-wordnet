simpleMeaning: Its stalk is grooved and pitted, and this kind of fungus of the group Helvella has a fertile
  part shaped like a saddle and a creamy colour.
scope: It is a fungus of the group Helvella, known by its saddle-shaped fertile part, creamy colour, and
  grooved, pitted stalk.
examples:
- The miter mushroom had a saddle-shaped fertile part.
- The stalk of the miter mushroom was grooved and pitted.
