synsetId: 03249974-n
simpleMeaning: a sheet of cloth that fills with air to make a fast thing go slower
scope: 'Also called a drogue or a drogue chute: a sheet of cloth that fills with air to slow a fast-moving
  thing, not the main parachute that carries a person down and not the small one that pulls the main parachute
  from its pack.'
examples:
- A drogue parachute slowed the spacecraft before the main parachute opened.
- The drogue parachute was released to slow the falling capsule.
