simpleMeaning: A building or a natural mark of old interest, kept by the country's government so the past
  is honoured and all can enjoy it.
scope: This place is kept by the country's government to honour the past and for all to enjoy, and it
  holds a building or a natural mark of old interest.
examples:
- We walked through the national monument and saw the old building.
- A national monument was set aside by the government for all to enjoy.
