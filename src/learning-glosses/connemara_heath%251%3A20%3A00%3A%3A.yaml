simpleMeaning: A low spreading green-all-year bush of west Europe, in a few kinds with flowers from white
  to rose-purple.
scope: Also called Daboecia cantabrica and St. Dabeoc's heath, this is a low bush of west Europe, not
  the tall heather of the moors.
examples:
- The Connemara heath spreads low over the rocks.
- Connemara heath flowers from white to rose-purple.
