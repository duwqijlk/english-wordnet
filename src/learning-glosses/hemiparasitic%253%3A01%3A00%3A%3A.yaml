senseId: 'hemiparasitic%3:01:00::'
synsetId: 02861586-a
simpleMeaning: to do with plants that take some of what they need from other plants
scope: To do with plants that live partly off other plants; not plants that live wholly off others and
  not plants that feed themselves alone.
examples:
- Mistletoe is a hemiparasitic plant that draws water from its host tree.
- The hemiparasitic vine takes some food from the tree it grows on.
