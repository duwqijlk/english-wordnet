simpleMeaning: in a way that shows your body or voice is not steady, moving in small quick jerks
scope: Doing or saying something with a trembling voice or unsteady hands, not in an unsure or unsafe
  way.
examples:
- '''I — I''m going to make you a cup of tea,'' she said shakily.'
- He held out the letter shakily, his hands trembling.
