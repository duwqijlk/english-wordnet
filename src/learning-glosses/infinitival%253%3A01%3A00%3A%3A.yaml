simpleMeaning: Relating to or made with the base form of a verb, the form that names the action without
  a subject
scope: Describes a word form made from the base form of a verb, not a verb form that shows tense and not
  a participle.
examples:
- An infinitival clause often starts with ‘to’.
- The infinitival form of the verb has no subject of its own.
