senseId: 'lacrimal_vein%1:08:00::'
synsetId: 05379771-n
simpleMeaning: Fluid from the tear gland drains through this blood tube into a larger blood tube above
  the eye.
scope: A larger blood tube above the eye takes the fluid this blood tube drains from the tear gland, also
  called vena lacrimalis.
examples:
- The lacrimal vein drained the tear gland.
- Fluid left the tear gland through the lacrimal vein.
