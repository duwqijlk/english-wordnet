simpleMeaning: A low plant with many branches that lives for years in the western United States, with
  silver-grey leaves; an important plant for animals to feed on and shelter in.
scope: A low much-branched plant of the western United States with silvery leaves, also called gray sage,
  grey sage, silver sage, silver sagebrush or Artemisia cana, not a tall shrub and not a plant of the
  east.
examples:
- Seriphidium canum grew on the dry plain.
- Deer sheltered in the Seriphidium canum.
