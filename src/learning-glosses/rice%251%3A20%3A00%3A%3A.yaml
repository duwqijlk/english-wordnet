simpleMeaning: A grass in wet land, living one year or many years, with stems under the ground, whose
  seed people eat and whose stems are used to make paper
scope: The grass plant and its seed and straw, not the grains on a plate and not putting food through
  a sieve.
examples:
- Rice grows in wet fields in Asia.
- The farmer cut the rice straw to make paper.
