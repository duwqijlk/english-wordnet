simpleMeaning: People in a group are tested for the genes they carry, to learn if they are likely to get
  one sickness
scope: A test of a group of people for a likely sickness from their genes, not a test of one person and
  not a test that finds a sickness already there.
examples:
- The hospital offered genetic screening of newborn babies for one sickness.
- Many parents chose genetic screening so they could learn if their child might get the sickness.
