simpleMeaning: Any of many trees or low bushes of the group called Acer, with seeds that have wings and
  grow in pairs, found in the cool lands of the north.
scope: A tree or low bush of the group called Acer, with winged seeds in pairs, not the wood of such a
  tree.
examples:
- A maple shaded the front yard all summer.
- Maples line the road through the village.
