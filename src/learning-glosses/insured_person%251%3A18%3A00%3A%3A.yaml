simpleMeaning: One who has a policy that guards their goods, life, or health and pays them back for loss
scope: A person who holds a policy that pays for loss, also called an insured; not the firm that sells
  the policy and not a person with no cover at all.
examples:
- The insured person filed a claim after the fire damaged her home.
- Every insured person on the plan must show proof of loss.
