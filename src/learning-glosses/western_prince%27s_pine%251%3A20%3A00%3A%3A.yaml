simpleMeaning: A plant of Europe and Asia with white or pinkish flowers in a bunch at the top of the stem.
scope: A plant of Europe and Asia with white or pinkish flowers; love-in-winter is another name for this
  sense, not a tree and not a plant with yellow flowers.
examples:
- The western prince's pine has white flowers in a bunch at the top.
- We found a western prince's pine growing in the woods of Europe.
