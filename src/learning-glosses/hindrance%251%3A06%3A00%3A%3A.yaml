schema: oewn-learning-gloss-v2
senseId: 'hindrance%1:06:00::'
synsetId: 03525974-n
simpleMeaning: a thing that blocks the way, slows action, and is hard to deal with
scope: This sense is a thing that blocks the way, also called hitch, interference, preventative, preventive,
  encumbrance, and incumbrance. It is not the act of blocking, and not something you cannot see or touch
  that slows progress.
examples:
- The fallen tree was a hindrance on the road to the village.
- A heavy gate at the entrance was a hindrance to the carts.
