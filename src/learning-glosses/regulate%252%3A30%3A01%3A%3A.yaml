simpleMeaning: to hold back the flow of sound, liquid, or other things
scope: To hold back the flow of sound, liquid, or other things, also called baffle; not setting rules
  for how people act.
examples:
- The valve regulates the flow of water.
- He regulated his voice to a whisper.
