simpleMeaning: A row of metal bars of growing size, fixed to a frame and struck with small hammers, is
  a music tool you hit.
scope: People also call it glockenspiel; it is a music tool of metal bars fixed to a frame and struck
  with small hammers.
examples:
- The orchestral bells rang out when struck with small hammers.
- She played the orchestral bells with small hammers.
