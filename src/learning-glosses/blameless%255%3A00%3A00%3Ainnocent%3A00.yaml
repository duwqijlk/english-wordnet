simpleMeaning: having done nothing wrong, so no one can fairly say you are at fault
scope: This describes a person who has done nothing wrong, in one matter or in life as a whole. Not a
  person who did wrong, and not a person who should take the blame.
examples:
- The driver was blameless in the crash; the other car caused it.
- She has lived a blameless life and harmed no one.
