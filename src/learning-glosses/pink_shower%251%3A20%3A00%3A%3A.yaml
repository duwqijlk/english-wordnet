simpleMeaning: a half-evergreen tree of warm America, with tall straight bunches of pink or rose flowers,
  grown to look at
scope: Also called a pink shower tree and horse cassia; a warm-climate tree grown for its pink flowers,
  not a fruit-bearing tree and not a tree of cool lands.
examples:
- A pink shower in the garden was full of pink flowers.
- The pink shower by the road is planted for its bright blooms.
