simpleMeaning: showing luxury and giving the senses much pleasure
scope: This is showing luxury and giving the senses much pleasure; luxurious, luxuriant, voluptuous, epicurean
  and voluptuary are other names for this sense, not plain comfort and not greed for food.
examples:
- They lived a sybaritic life of soft beds, rich food and fine wine.
- The hotel offered sybaritic comforts, from warm baths to silk sheets.
