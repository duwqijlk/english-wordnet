schema: oewn-learning-gloss-v2
senseId: 'head%1:10:03::'
synsetId: 06302589-n
simpleMeaning: in grammar, the word in a grammatical unit that fills the same grammatical role as the
  whole unit
scope: This is the key word that gives a grammatical unit its role, not the body part above the neck,
  not the person in charge, not the part of a disk drive that reads data, not the top or front of something,
  and not oral sex.
examples:
- In the phrase 'the big dog', the noun 'dog' is the head.
- In 'very quickly', 'quickly' is the head of the adverbial phrase.
