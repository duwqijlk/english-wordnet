simpleMeaning: one of several kinds of small, short-necked river duck of Europe and America that feeds
  near the top of the water
scope: This is a small river duck, not the blue-green color that shares the same name.
examples:
- A teal landed on the river near the bank.
- We saw several teal feeding in the shallow water.
