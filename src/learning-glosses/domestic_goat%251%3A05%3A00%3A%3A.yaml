simpleMeaning: a farm animal of one of many kinds kept for its milk, meat, or wool
scope: A farm animal of one of many kinds kept for its milk, meat or wool, and not a wild one or a sheep.
examples:
- The farmer keeps domestic goats for milk and cheese.
- Domestic goats graze on the hill behind the house.
