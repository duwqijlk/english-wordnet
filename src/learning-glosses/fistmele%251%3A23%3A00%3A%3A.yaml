simpleMeaning: With the thumb held out, a closed hand spans about seven inches, the gap archers use above
  all to set the bowstring from the bow.
scope: This is the measure of about seven inches, the width of a closed hand with the thumb held out,
  used above all in archery to set the right gap between bowstring and bow.
examples:
- The archer checked the fistmele to set the string the right distance from the bow.
- He held out his thumb and measured a fistmele across his closed hand.
