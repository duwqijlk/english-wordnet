simpleMeaning: a chemical used in a spray on plants to make their leaves fall off
scope: This is a chemical put on plants to make their leaves fall off. It is not a spray that kills the
  whole plant, and not food that helps plants grow.
examples:
- Farmers sprayed a defoliant on the fields so the leaves would fall before the harvest.
- The defoliant left the trees bare within a few days.
