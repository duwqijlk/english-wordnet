simpleMeaning: Any of a group of insects with long thin front wings, able to fly hard and stay still in
  the air over flowers while they feed.
scope: This is any of a group of insects with long thin front wings that can fly fast and hang in the
  air over flowers, not a butterfly; also called hawk moth, hummingbird moth, sphingid, and sphinx moth.
examples:
- A hawkmoth hovered over the flowers at dusk.
- The hawkmoth sipped nectar from the bloom.
