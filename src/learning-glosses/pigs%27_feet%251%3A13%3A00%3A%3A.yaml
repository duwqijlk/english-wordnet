simpleMeaning: The lower ends of the legs, or the joints, of hogs, eaten as food, kept in sour liquid,
  cooked slowly in liquid, or set in jelly.
scope: This is the feet or joints of hogs eaten as food; pigs' knuckles is another name for this sense,
  not fresh meat and not the feet of other farm animals.
examples:
- Pigs' feet were served pickled at the feast.
- He likes pigs' feet stewed with beans.
