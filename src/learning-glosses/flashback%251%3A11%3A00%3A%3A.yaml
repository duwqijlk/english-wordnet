senseId: 'flashback%1:11:00::'
synsetId: 07358313-n
simpleMeaning: a past experience that comes back without warning in a clear, strong way, especially the
  effects of a drug taken long before that made you see things not there
scope: A past experience that returns suddenly and clearly in the mind, not the part of a film or story
  that jumps back to an earlier time.
examples:
- Years later, he had a flashback to the accident and felt the fear again.
- The smell gave her a sudden flashback to her childhood home.
