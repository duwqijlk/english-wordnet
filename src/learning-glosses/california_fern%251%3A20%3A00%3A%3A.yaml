simpleMeaning: A large branching two-year plant, from Eurasia and Africa and now in North America, with
  large finely cut leaves and white flowers; usually in damp places, every part very poisonous.
scope: 'Also called hemlock, poison hemlock, poison parsley, winter fern, Conium maculatum, and Nebraska
  fern: a large branching plant with white flowers, every part very poisonous, not a true fern and not
  a garden herb.'
examples:
- California fern grew tall in the damp ditch.
- 'Do not eat California fern: every part is very poisonous.'
