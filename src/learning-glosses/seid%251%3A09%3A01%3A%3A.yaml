simpleMeaning: an old Norse word for a kind of magic used by people in the north in the late Iron Age
scope: This is an old Norse word for a kind of magic in the late Iron Age; seithr, seidh, seidhr, seidr
  and seith are other names for this sense, not modern stage magic and not a Norse god.
examples:
- In the old tales, seid was a kind of magic from the north.
- The story tells of a woman who knew seid.
