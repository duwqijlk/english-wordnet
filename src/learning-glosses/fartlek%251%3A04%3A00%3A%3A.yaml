senseId: 'fartlek%1:04:00::'
synsetId: 00895329-n
simpleMeaning: A way of training for sport, most of all for runners, in which hard effort and ordinary
  effort take turns without a break.
scope: A way of training for sport, most of all for runners, in which hard and ordinary effort take turns
  without a break; not training with rests between hard efforts and not steady running at one speed.
examples:
- The coach added fartlek to the runners' weekly training.
- During fartlek, she ran hard uphill and then jogged on the flat.
