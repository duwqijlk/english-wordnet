simpleMeaning: to say words with a spitting sound, as if very angry
scope: 'Also called splutter: to say words with a spitting sound in anger, not to spit out liquid and
  not the noun for such words.'
examples:
- '"Get out of my way!" he sputtered.'
- She sputtered an angry reply before she could stop herself.
