senseId: 'prattle%1:10:00::'
synsetId: 07151837-n
simpleMeaning: Silly empty talk about nothing that matters, going on with no point to it.
scope: This is empty talk about nothing that matters; not serious talk, and not the act of talking in
  this way.
examples:
- The meeting was wasted on prattle about holidays and football.
- She had no time for the prattle of the crowd at the gate.
