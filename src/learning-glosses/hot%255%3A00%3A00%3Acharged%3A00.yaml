simpleMeaning: Carrying electric current or holding an electric charge.
scope: This is the electrically charged sense, not the sense of having a high temperature, not sexually
  excited or exciting, not recently stolen or smuggled, not very fast, not wanted by the police, not very
  popular, and not producing a burning taste.
examples:
- Never touch a hot wire while the power is on.
- The electrician tested the terminal and found it was still hot.
