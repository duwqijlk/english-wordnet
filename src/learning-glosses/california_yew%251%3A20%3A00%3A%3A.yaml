simpleMeaning: A small or middle-sized tree of the Pacific shore of North America, with uneven branches,
  that gives fine hard wood with a tight grain.
scope: Also called the western yew, the Pacific yew and Taxus brevifolia, this small or middle-sized tree
  grows on the Pacific coast of North America, with uneven branches and fine hard wood with a tight grain,
  among the other yew trees of other lands.
examples:
- California yew grew in the cool coastal forest.
- Carvers prize California yew for its hard wood.
