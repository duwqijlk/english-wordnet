simpleMeaning: The great ring in the sky that sits halfway between the two poles of the sky.
scope: The great ring in the sky halfway between the sky's poles, also called celestial equator, equinoctial,
  and equinoctial circle; not the path of the sun and not a ring around one pole.
examples:
- The equinoctial line cuts the sky into two equal halves.
- The sun crosses the equinoctial line at the start of spring and autumn.
