simpleMeaning: People use this thick stuff as a glue, as a hard skin over things, and to keep eggs fresh;
  it is a soda salt mixed in water.
scope: Also called sodium silicate and water glass, it is a thick stuff used as a glue and a hard skin
  over things.
examples:
- Soluble glass works as a glue and as a hard skin over things.
- They kept eggs fresh with soluble glass.
