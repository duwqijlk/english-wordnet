simpleMeaning: How much of a dissolved stuff is in a liquid, counted by the number of moles, the chemist's
  counting unit, in each litre of the liquid
scope: How much of a dissolved stuff is in a liquid, counted by the number of moles in each litre of the
  liquid; molarity is another name for this measure, not the weight of the dissolved stuff.
examples:
- The molar concentration of the salt water was two moles per litre.
- To find the molar concentration, count the moles in each litre of liquid.
