simpleMeaning: A hard or partly hard, thick and sticky stuff that comes out of some plants, or is made
  by joining many small simple parts together
scope: Also called rosin; this thick sticky stuff comes from plants or is made by people, and it is hard
  or partly hard, not a thin liquid.
examples:
- Resin ran from the cut in the pine tree and grew hard.
- Workers use resin to make a hard, shiny covering for wood.
