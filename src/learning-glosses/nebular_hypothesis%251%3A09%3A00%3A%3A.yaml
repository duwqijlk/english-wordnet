simpleMeaning: In cosmology, the idea that the sun and planets grew out of a hot cloud of gas.
scope: In cosmology, the idea that the sun and planets grew from a hot cloud of gas, not the idea that
  they were made in a single burst.
examples:
- The nebular hypothesis says the planets grew from a hot cloud of gas.
- In class we learned the nebular hypothesis about the birth of the solar system.
