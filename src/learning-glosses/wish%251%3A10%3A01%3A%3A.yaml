simpleMeaning: a kind message that you hope good things will happen to someone.
scope: It is not a statement of what you want for yourself and not a magic request; it is a polite message
  for another person's happiness.
examples:
- We sent our best wishes to the couple on their wedding day.
- She ended the letter with warm wishes for the new year.
