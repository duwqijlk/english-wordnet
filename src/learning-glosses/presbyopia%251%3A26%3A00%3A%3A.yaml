senseId: 'presbyopia%1:26:00::'
synsetId: 14578806-n
simpleMeaning: less power to see near things well, because the lens in the eye can no longer bend well
  after the age of 45
scope: Also called farsightedness, it is less power to see near things well after the age of 45, not a
  loss of far sight.
examples:
- Presbyopia made it hard for her to read small print without glasses.
- He first noticed his presbyopia when near words looked blurred after he turned 45.
