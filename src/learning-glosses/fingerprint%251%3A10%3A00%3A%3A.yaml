simpleMeaning: any sign or way of being that makes a person or thing easy to know apart from others
scope: A general sign that makes a person or thing easy to know, not a dirty mark on a surface and not
  the skin print used to name a person.
examples:
- The short, plain sentences are a fingerprint of her writing style.
- That sweet smell is the fingerprint of this kind of flower; people know it at once.
