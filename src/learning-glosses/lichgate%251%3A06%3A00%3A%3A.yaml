simpleMeaning: Once used to give the stand that holds a coffin short shelter during a funeral, this roofed
  gate leads into a churchyard.
scope: Also called lychgate, this is the roofed gate into a churchyard that once gave the stand holding
  a coffin short shelter at a funeral.
examples:
- The coffin rested under the lichgate during the funeral.
- The lichgate is a roofed gate into a churchyard.
