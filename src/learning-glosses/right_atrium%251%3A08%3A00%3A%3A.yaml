simpleMeaning: the upper room on one side of the heart that takes in blood from the great veins and the
  heart's own vein
scope: Not the lower room of the heart, and not the room on the other side; also called atrium dextrum
  and right atrium of the heart.
examples:
- Blood flows into the right atrium first.
- The right atrium pumps blood down to the lower room.
