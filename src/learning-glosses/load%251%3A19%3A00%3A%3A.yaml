simpleMeaning: a store of valuable ore (rock with metal in it) found in the ground, with clear limits
  that set it apart from the rocks around it
scope: A store of valuable ore in the ground, not the front part of a missile or rocket, and not an amount
  carried or moved at one time.
examples:
- Miners found a rich load of gold ore in these hills.
- The load in this mine lies between two layers of rock.
