simpleMeaning: the part of the gut that runs from the cecum to the rectum, including the colon; it takes
  water from food remains, which leave the body as waste
scope: The last part of the gut, from the cecum to the rectum, not the small intestine and not the stomach.
examples:
- Water is taken out of food in the large intestine.
- The large intestine ends at the rectum.
