senseId: liquefied%5:00:02:melted:00
synsetId: 01510205-s
simpleMeaning: changed by heat from a solid into a form that can flow
scope: Also called molten; another name for this sense is liquified. It describes a solid that heat has
  changed so it can flow, not a thing that has always been able to flow.
examples:
- The liquefied wax ran down the side of the candle.
- Liquefied rock flowed out of the volcano.
