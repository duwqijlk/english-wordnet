simpleMeaning: a way of putting papers or records into groups, most often in order from A to Z
scope: 'Also called a filing system: a way of putting papers or records into groups, not a set of drawers
  and not a single list of names.'
examples:
- The office uses a file system that puts papers in order from A to Z.
- Our file system groups the records by subject.
