simpleMeaning: a storm in which small hard balls of ice fall from the sky
scope: A storm in which balls of ice fall, not a storm with rain only and not a storm with soft snow.
examples:
- A sudden hailstorm broke the glass roof of the greenhouse.
- The hailstorm was so strong that they stopped the car and waited.
