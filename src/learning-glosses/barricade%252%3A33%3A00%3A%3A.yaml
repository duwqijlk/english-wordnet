simpleMeaning: to close a road or a place with a wall of things put up to stop people passing
scope: To close a place off with a wall of things, not the wall itself, not stopping people getting in,
  and not making a place impossible to pass through.
examples:
- Police barricaded the street.
- They barricaded the road with carts.
