simpleMeaning: Under a coat of wall covering, thin strips of wood form the base of this building stuff.
scope: Under a coat of wall covering, thin strips of wood form the base of this building stuff; not bare
  wood strips, and not a wall of brick.
examples:
- Lath and plaster covered the old cottage walls.
- The builder repaired the lath and plaster in the hallway.
