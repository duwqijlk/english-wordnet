simpleMeaning: Of ammonia, holding it, or like it.
scope: This sense is also called ammoniacal, for what is of ammonia, holding it, or like it, unlike the
  sense for the sweet-smelling gum of the plant of the same name.
examples:
- The salt was ammoniac, holding ammonia.
- The fumes were ammoniac, smelling of ammonia.
