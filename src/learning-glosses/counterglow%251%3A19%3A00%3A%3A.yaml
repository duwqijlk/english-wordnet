simpleMeaning: A faint spot of light in the night sky right across from where the sun is, made by sunlight
  bouncing off tiny bits of matter in space
scope: This is a faint spot of light in the night sky right across from the sun; gegenschein is another
  name for it; not the bright band of the Milky Way, and not the light of dawn or dusk.
examples:
- On a clear dark night, the counterglow was just visible low in the east.
- Astronomers look for the counterglow opposite the setting sun.
