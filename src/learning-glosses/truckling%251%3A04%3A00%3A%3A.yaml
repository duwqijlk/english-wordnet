simpleMeaning: The act of obeying in a low, cringing way, above all obeying humbly or for low reasons
scope: The act of obeying in a low, cringing way, above all humbly or for low reasons; not firm obedience
  to a fair order and not open defiance.
examples:
- His truckling to the manager won him no respect.
- Truckling means obeying humbly, often for unworthy reasons.
