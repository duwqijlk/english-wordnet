simpleMeaning: A plant grown yearly in warm parts of India, Indonesia and the US for fodder and seeds,
  chief source of sprouts for Chinese cooking, sometimes classed in the Phaseolus group.
scope: This is the growing plant, not the seed taken from it or the food made from that seed; the same
  plant is also called mung bean.
examples:
- Farmers in the region grow mung as a fodder crop between rice seasons.
- Mung is often planted for its seeds, which are sprouted for Chinese dishes.
