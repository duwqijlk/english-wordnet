simpleMeaning: A long bendy steel coil for pushing blockages out of curved pipes
scope: A long bendy steel coil for pushing blockages out of curved pipes; snake and auger are other names
  for this sense, and this is not a brush for cleaning pipes.
examples:
- He fed the plumber's snake into the curved pipe to clear the blockage.
- A plumber's snake is a long steel coil for curved pipes.
