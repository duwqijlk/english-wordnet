simpleMeaning: A thick, bushy plant from Europe and Asia bears shiny, tough leaves longer than wide and
  yellow-green flowers.
scope: Also called spurge laurel, this is the thick, bushy plant of Europe and Asia with shiny, tough
  leaves longer than wide and yellow-green flowers, not the North American kind with white or rose flowers.
examples:
- Shiny, tough leaves longer than wide grow on wood laurel.
- Yellow-green flowers grow on wood laurel.
