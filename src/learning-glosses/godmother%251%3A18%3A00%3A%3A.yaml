simpleMeaning: a woman who has a special role for a child at its baptism (the church act of welcoming
  a child with water)
scope: A woman with this special church role for a child; not the child's mother and not a godfather,
  who is a man in the same role.
examples:
- Her godmother held her during the baptism.
- She stood as godmother for her friend's baby at the baptism.
