simpleMeaning: After special training, a person on the official list who looks after sick people can do
  much of what a doctor does
scope: After special training, a person on the official list who looks after sick people can do much of
  what a doctor does, and nurse clinician is another name for this sense; not a doctor and not a helper
  with little training.
examples:
- The nurse practitioner examined the child and told the parents what to do.
- She made an appointment with the nurse practitioner for her bad knee.
