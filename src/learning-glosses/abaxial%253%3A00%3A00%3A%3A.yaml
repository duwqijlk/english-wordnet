senseId: 'abaxial%3:00:00::'
synsetId: 00002312-a
simpleMeaning: turned away from the middle line, called the axis, of a part of a living thing
scope: This is the side of a part that faces away from its middle line, also called dorsal; not the side
  that faces toward the middle line.
examples:
- The abaxial side of the leaf is the underside, away from the stem.
- The abaxial surface of the petal faces away from the centre of the flower.
