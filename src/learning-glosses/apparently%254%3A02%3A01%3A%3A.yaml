simpleMeaning: in a way that is clear and easy to see, leaving no doubt.
scope: This means clearly and beyond doubt, not 'as it seems' when the truth is uncertain.
examples:
- The bridge was apparently unsafe, and engineers closed it that same day.
- 'The fire was apparently started on purpose: three separate seats of flame were found.'
