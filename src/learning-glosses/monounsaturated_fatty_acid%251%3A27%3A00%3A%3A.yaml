simpleMeaning: Olive oil, chicken and almonds are the main food sources of this acid, whose chain of carbon
  atoms carries just one double or triple link.
scope: One kind of fatty acid, with a single double or triple link; not a saturated fatty acid and not
  a polyunsaturated one.
examples:
- Olive oil is rich in monounsaturated fatty acids.
- The label says the spread contains mostly monounsaturated fatty acid.
