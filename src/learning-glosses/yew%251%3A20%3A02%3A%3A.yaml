simpleMeaning: the wood of the tree, above all the long-lasting light brown or red wood of the English
  kind, with fine lines, prized for fine furniture and for archery bows
scope: This is the wood of the tree, not the tree itself.
examples:
- The bow was made of yew.
- Yew from the old tree made fine furniture.
