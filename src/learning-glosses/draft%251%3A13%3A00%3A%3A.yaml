simpleMeaning: a serving of a drink, usually with alcohol in it, taken from a barrel
scope: 'Also called draught: one serving of a drink from a large barrel, not the pulling of a load, not
  a part that controls air in a fireplace, and not a paper that orders payment.'
examples:
- They served beer on draft at the bar.
- He ordered a draft of beer from the keg.
