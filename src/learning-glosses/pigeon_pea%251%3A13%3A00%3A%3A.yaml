simpleMeaning: A small seed, rich in food value, from a plant that grows in hot countries.
scope: This is a small seed, rich in food value, from a hot-country plant; cajan pea and dahl are other
  names for this sense, not the plant itself and not a seed of a cold-country plant.
examples:
- Pigeon peas are cooked in stews across the tropics.
- She grew pigeon peas for their small rich seeds.
