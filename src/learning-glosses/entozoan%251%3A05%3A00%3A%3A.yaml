senseId: 'entozoan%1:05:00::'
synsetId: 01387658-n
simpleMeaning: a small living thing that feeds off an animal by living inside its inner parts, in particular
  a worm in the gut
scope: 'Also called endoparasite, endozoan, entoparasite and entozoon: a small living thing that feeds
  off an animal by living inside it, not a small living thing on the outside of the body and not a worm
  that lives free in soil.'
examples:
- The vet found an entozoan living in the dog's gut.
- An entozoan can live for years inside the inner parts of its host.
