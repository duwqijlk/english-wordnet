schema: oewn-learning-gloss-v2
senseId: 'comma%1:05:00::'
synsetId: 02280676-n
simpleMeaning: a kind of butterfly with angled wings and a mark in the shape of a curved line with a dot
  below it on the underside of each back wing
scope: Also called comma butterfly, this sense is the butterfly itself; it is not the small mark used
  in writing to separate parts of a sentence.
examples:
- A comma landed on a flower, the curved mark under its back wing clear to see.
- The comma, a butterfly with angled wings, rested on a leaf in the garden.
