senseId: 'insinuation%1:04:00::'
synsetId: 00160893-n
simpleMeaning: the act of making people accept you or like you by using kind words and praise in a careful,
  not direct way
scope: 'Also called ingratiation: making people like or accept you with kind words and praise, not an
  indirect hint that suggests something bad.'
examples:
- She used insinuation, praising the boss in small, careful ways, to win a place in the group.
- By insinuation, praising the family and always speaking kindly to them, he slowly made them like him.
