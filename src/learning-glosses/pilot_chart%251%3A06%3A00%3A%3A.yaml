simpleMeaning: a sea map for a sailor that shows the usual weather, water and sailing conditions
scope: 'Also called naval chart and navigational chart: a sea map for a sailor showing usual weather and
  water conditions, not a land map and not a book of sailing rules.'
examples:
- The captain studied the pilot chart before the crossing.
- The pilot chart showed strong winds along the route.
