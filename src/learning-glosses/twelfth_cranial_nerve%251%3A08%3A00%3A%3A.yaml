simpleMeaning: The cord in the head that feeds the inner muscles of the tongue and the other tongue muscles.
scope: This is the cord in the head that feeds the tongue muscles, also called hypoglossal, hypoglossal
  nerve and nervus hypoglosus; not the cord that moves the face and not the cord that carries taste.
examples:
- The twelfth cranial nerve controls the tongue.
- Damage to the twelfth cranial nerve makes speech hard.
