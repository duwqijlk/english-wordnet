simpleMeaning: leaving no doubt and no way to be understood in a wrong way, having only one meaning and
  leading to only one result
scope: 'Also called unequivocal: clear with only one meaning, not just strong or firm, and not open to
  two readings.'
examples:
- The instructions were unambiguous, so no one made a mistake.
- 'He gave an unambiguous answer: no.'
