simpleMeaning: to get something, or to deserve it, because of what you have done or tried to do
scope: 'Also called win and earn: to get or deserve something through your own work, not a storehouse
  for grain or animal feed.'
examples:
- She garnered much praise for her hard work over many years.
- The team garnered support by helping people all over the town.
