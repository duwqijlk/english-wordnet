simpleMeaning: A small extinct eel-like fish with a finned tail, a stiff back rod (notochord), cone-shaped
  bone teeth, from the late Cambrian to the late Triassic, possibly an early jawless-fish relative.
scope: This is the whole extinct animal, not the tiny cone-shaped fossil tooth that also carries the name.
examples:
- Conodonts were small eel-like fish that swam in ancient seas.
- Fossils of the conodont show a finned tail and a stiff back rod.
