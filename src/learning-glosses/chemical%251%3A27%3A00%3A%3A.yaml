simpleMeaning: a substance made by, or used in, a reaction — a change that happens in atoms or molecules
  (the very small parts that make up all things)
scope: This is the noun for a substance itself, not the word used to describe things to do with the study
  of such substances or things made in this way.
examples:
- The factory stores chemicals in locked rooms.
- This chemical can clean metal but can hurt skin.
