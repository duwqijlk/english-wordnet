simpleMeaning: one thin sheet among several that usually go together, as in cloth, paper, or wood
scope: One layer of several that go together, not a strand twisted into yarn or rope and not the act of
  joining things.
examples:
- This board is made of three ply of wood glued together.
- The tissue has two ply of soft paper.
