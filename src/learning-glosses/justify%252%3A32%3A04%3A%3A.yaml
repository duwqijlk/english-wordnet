simpleMeaning: used of God, to say a person is not guilty and to free them from the punishment for their
  sins
scope: Used of God, this is saying a person is not guilty and freeing them from punishment for sin; it
  is not showing that an action or a claim is right.
examples:
- The priest taught that God justifies those who trust in him and frees them from sin.
- In the lesson, God justifies the man, saying he is not guilty.
