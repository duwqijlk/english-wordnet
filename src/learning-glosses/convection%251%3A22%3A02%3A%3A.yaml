simpleMeaning: In weather science, the up and down movement of heat or other things by great masses of
  air moving in the sky.
scope: In weather science, the up and down movement of heat by great masses of air, not heat moving through
  still air and not heat carried by light.
examples:
- Convection carried the warm air up over the hills.
- Thunderstorms grow by convection in hot air.
