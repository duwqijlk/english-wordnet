simpleMeaning: a place where buses, trains, or other vehicles stop to take people or goods on or off
scope: 'Also called terminal and depot: a station for people or goods, not a statue on top of a square
  pillar used as a mark in old Rome.'
examples:
- All passengers must leave the train at the terminus.
- The bus terminus was busy with people and boxes early in the morning.
