simpleMeaning: to catch fish by using boats that drag nets through the water
scope: This sense is the act of catching fish in this way; it is not the long fishing line with many hooks
  and not the net itself, which are things, not the act.
examples:
- The boats trawl for cod in deep water all winter.
- Crews trawled these waters for shrimp until the season ended.
