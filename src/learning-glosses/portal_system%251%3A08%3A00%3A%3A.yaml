scope: A set of tubes that carry blood from the belly organs to the liver, not the tubes that carry blood
  back to the heart and not the tubes that carry blood to the lungs.
examples:
- The portal system carries blood from the gut to the liver.
- Doctors check the portal system when the liver is under strain.
