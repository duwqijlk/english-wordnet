simpleMeaning: In illness, a sudden tightening of a hollow part of the body, such as a blood vessel
scope: In illness, a sudden tightening of a hollow part of the body, not a painful tightening of a muscle.
examples:
- A spasm of the blood vessel cut off the flow for a moment.
- The doctor blamed the pain on a spasm in her gut.
