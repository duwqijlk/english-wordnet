simpleMeaning: cloth put over a dead body to cover it before the funeral
scope: Cloth that covers a dead body before the funeral, not the clothes a person wears in life and not
  a coffin.
examples:
- The burial garment was white linen.
- They wrapped the body in a burial garment before the funeral.
