simpleMeaning: An idea that says a system at rest in balance shifts to a new balance that fights a change
  put on it.
scope: A rule saying a system at rest in balance shifts to fight a change, also called Le Chatelier's
  law, Le Chatelier's principle and Le Chatelier-Braun principle; its near kin are other rules of chemistry
  about systems in balance.
examples:
- The Le Chatelier principle says a system in balance fights a change.
- Le Chatelier principle is a rule of chemistry.
