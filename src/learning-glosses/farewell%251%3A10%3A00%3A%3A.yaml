simpleMeaning: words or a sign that show friendly good wishes when someone leaves or when people part
scope: This sense is the friendly good wish at the time people part; it is not the act of leaving itself.
examples:
- She waved in farewell as the train left the station.
- He said a warm farewell to his friends before moving abroad.
