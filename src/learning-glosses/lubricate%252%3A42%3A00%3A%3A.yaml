simpleMeaning: to have the power to make surfaces smooth and slippery, so that parts can move easily over
  each other
scope: This sense is about a thing itself having this power, not about a person putting oil on a machine
  and not about making a part slippery that way.
examples:
- This oil lubricates well, so the engine parts move freely.
- The liquid in the can lubricates, keeping the metal parts from rubbing hard against each other.
