simpleMeaning: to bend the knees as a sign of respect when greeting someone
scope: To bend the knees as a respectful greeting, not the noun for the gesture itself.
examples:
- She curtsied to the queen as she entered the room.
- The dancer curtsied deeply at the end of her performance.
