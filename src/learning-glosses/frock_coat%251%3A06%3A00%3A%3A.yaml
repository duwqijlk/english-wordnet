simpleMeaning: a man's long outer garment with knee-length skirts at the front and back, worn in the 19th
  century
scope: This is a man's long outer garment with knee-length skirts, worn in the 19th century; not a short
  jacket or a woman's dress.
examples:
- He wore a frock coat to the wedding in 1880.
- The frock coat hung in the museum.
