simpleMeaning: In botany, the long, thin stalk of a flower's pistil that links the ovary to the stigma.
scope: This is a part of a flower's female reproductive structure, not the way something is done, not
  a characteristic way of expressing something in language or art, not a particular kind or look, not
  the popular taste of a period, not editorial rules for spelling and punctuation, not stylish elegance,
  not a pointed writing or engraving tool, not a slender bristlelike or tubular process, and not the verb
  senses about naming, fashion, or applying style rules.
examples:
- Pollen grains stick to the stigma and send tubes down the style.
- The style of the lily is longer than its ovary.
