senseId: 'confession%1:04:00::'
synsetId: 01041339-n
simpleMeaning: In the Roman Catholic Church, telling a priest about your sins, as part of penance (a holy
  way to show sorrow), hoping to be forgiven
scope: This is the church act of telling a priest your sins; it is not a general admission of wrongdoing,
  not a signed written admission, and not a church's written statement of beliefs.
examples:
- She went to confession at her church on Saturday.
- The priest heard his confession in a quiet room in the church.
