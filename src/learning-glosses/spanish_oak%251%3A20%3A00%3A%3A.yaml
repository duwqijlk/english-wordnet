simpleMeaning: A small tree that loses its leaves in winter, its trunk forked near the ground with wide-spreading
  limbs, of Texas and the south of Oklahoma.
scope: Also called Quercus texana; a small tree that loses its leaves in winter, its trunk forked near
  the ground with wide-spreading limbs, of Texas and the south of Oklahoma.
examples:
- Spanish oak grows on the dry hills of Texas.
- The spreading limbs of Spanish oak give good shade.
