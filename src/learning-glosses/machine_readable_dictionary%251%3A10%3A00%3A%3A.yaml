simpleMeaning: A book of word meanings in a form a computer can use, with its words in A to Z order
scope: Also called electronic dictionary, this is a word book in a form a computer can use, not a printed
  book and not a word list in no order.
examples:
- The machine readable dictionary lists words in A to Z order.
- She looked up the word in a machine readable dictionary.
