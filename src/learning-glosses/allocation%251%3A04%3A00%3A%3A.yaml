simpleMeaning: the act of giving things out in shares, in the way a plan sets out
scope: 'Also called allotment, assignation and apportioning: this is the act of giving things out in shares
  by a plan, not the computer sense where parts of a disk are set for data or instructions.'
examples:
- The allocation of food was done by a clear plan, with each village getting its share.
- After the allocation of seats, each state knew how many it would have.
