simpleMeaning: It goes up or opens at the start and comes down or closes between acts and at the end,
  a hanging cloth hiding the stage from the people watching.
scope: Also called theater curtain, it is the hanging cloth that hides the stage and goes up at the start
  and comes down between acts and at the end.
examples:
- The theatre curtain went up and the play began.
- The theatre curtain came down between the acts.
