simpleMeaning: any bold thing that someone tries, especially one where no one knows how it will end
scope: Any bold thing a person tries when no one knows how it will end. Not a business plan that may lose
  money, and not money put in at great risk for a big gain.
examples:
- Climbing the mountain alone was a brave venture.
- Their venture to cross the desert by bike took months of planning.
