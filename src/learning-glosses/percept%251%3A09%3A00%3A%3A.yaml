senseId: 'percept%1:09:00::'
synsetId: 05938922-n
simpleMeaning: what you hold in your mind about something you see, hear, or feel, a basic part used to
  build an idea
scope: 'Also called perception: what the mind holds about something seen, heard, or felt, and a basic
  part in building an idea; not the act of noticing something itself.'
examples:
- A child's percept of a dog may rest mainly on its size and its sound.
- The percept stays in the mind after the thing itself is no longer there.
