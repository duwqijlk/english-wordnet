scope: Numbers from 1 to 10, where each step means a much bigger shake, once used to tell how strong an
  earthquake was from the size of shakes a machine recorded, not the scale that rates shaking by what
  people feel and not a scale still in wide use today.
examples:
- The Richter scale gave the quake a value of six.
- Before the new scale, the Richter scale was the usual measure.
