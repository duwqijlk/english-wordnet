simpleMeaning: a small flesh-eating fish of North American fresh water, usually with a flattened body
  and shiny sides, including crappies, black bass, bluegills and pumpkinseed
scope: The freshwater fish-family sense; sunfish is another name for these fish, and this is not the ocean
  sunfish or the flesh eaten as food.
examples:
- The lake holds many centrarchids, including bluegills and black bass.
- Biologists group crappies and pumpkinseeds among the centrarchids.
