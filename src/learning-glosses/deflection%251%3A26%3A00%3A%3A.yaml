senseId: 'deflection%1:26:00::'
synsetId: 14528328-n
simpleMeaning: a twist away from what is straight or right, especially a wrong and not normal way of judging
  or acting
scope: Also called warp. This is a twisted way of judging or acting, not a pointer moving on a measuring
  tool and not a wave being bent.
examples:
- Such a deflection in his judgment led him to treat innocent people as guilty.
- The story shows a deflection in how the town judged right and wrong.
