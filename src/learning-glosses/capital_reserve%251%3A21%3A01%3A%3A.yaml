senseId: 'capital_reserve%1:21:01::'
synsetId: 92441528-n
simpleMeaning: Money a firm sets aside to pay costs it can see coming and costs it cannot, and that it
  cannot pay out to shareholders.
scope: Money a firm sets aside for costs, seen and unseen, that it cannot pay out to shareholders; not
  money for day-to-day trade and not a loan.
examples:
- The firm built up its capital reserve after a good year.
- The capital reserve cannot be paid out as dividends.
