simpleMeaning: 'A way of counting the money in use: M2 with money held at places that are not banks, such
  as savings and loan groups.'
scope: This is a way of counting the money in use, made up of M2 with money held at places that are not
  banks; it is not M1, which counts only cash in use and money in bank accounts.
examples:
- M3 grew as savings and loan groups took in more money.
- The report gave M3 as M2 with money held at places that are not banks.
