simpleMeaning: a drawing made by laying thin clear paper over a first picture and copying its lines
scope: A drawing made by laying thin clear paper over a first picture and copying its lines, not a mark
  left by a passing person or animal and not the act of chasing or finding something.
examples:
- She made a trace of the old map on thin paper.
- He learned to draw by making traces of pictures in books.
