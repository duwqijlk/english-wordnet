simpleMeaning: A singer's high notes are felt as a shake in the top of the skull, and this is the voice
  working in its high range when speaking or singing
scope: The high range of the voice in speaking or singing, also called head register and head voice, not
  the low range of the voice and not the chest voice.
examples:
- She kept the head tone light as she rose to the top notes.
- His head tone rang out clearly in the last verse.
