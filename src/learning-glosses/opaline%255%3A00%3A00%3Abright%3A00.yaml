simpleMeaning: With shifting bright hues, like a rainbow.
scope: This sense is also called iridescent, pearlescent, opalescent, and nacreous, for having shifting
  bright hues, like a rainbow, where iridescent is showing bright colours that move and change like the
  colours of a rainbow.
examples:
- The shell was opaline, with shifting bright hues.
- The bead was opaline, like a rainbow.
