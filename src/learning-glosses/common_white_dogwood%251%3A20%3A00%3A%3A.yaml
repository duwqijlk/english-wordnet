simpleMeaning: People love this tree that loses its leaves in autumn for its big pale or pink leaf-like
  parts and its bright autumn colour, after which red berries come.
scope: Also called eastern flowering dogwood, this is the tree loved for its big pale or pink leaf-like
  parts and bright autumn colour, followed by red berries.
examples:
- The common white dogwood showed its pale leaf-like parts.
- A common white dogwood showed red berries in autumn.
