simpleMeaning: A spiny cactus bears this fruit, round or shaped like the fruit it is named for, and it
  is one of many kinds.
scope: The fruit, not the cactus itself, is what this names.
examples:
- The prickly pear on the cactus was round.
- Another prickly pear was shaped like the fruit it is named for.
