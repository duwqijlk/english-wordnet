simpleMeaning: the back of a body with a backbone, or a like face such as the top or outer face of a part
  of the body
scope: The back of a body with a backbone, or a like face such as the top or outer face of a part; not
  the front of the body and not the inside of an organ.
examples:
- The dorsum of the foot was bruised.
- The nurse looked at the dorsum of his hand.
