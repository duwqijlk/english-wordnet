simpleMeaning: one of several blood tubes that carry blood to the dark layer at the back of the eye
scope: One of the blood tubes that feed the dark layer at the back of the eye, also called arteria ciliaris;
  not a blood tube that feeds the coloured ring of the eye.
examples:
- The ciliary artery supplies blood to the choroid coat of the eye.
- Several ciliary arteries feed the dark layer at the back of the eye.
