simpleMeaning: A flat part with electric paths on it that can be taken out of a home computer and that
  slides into a slot in the computer's main plate.
scope: This is a flat part that slides into a home computer, not the main board of the computer and not
  a small chip on its own.
examples:
- The PC board slid into its slot.
- He took out the old PC board and put in a new one.
