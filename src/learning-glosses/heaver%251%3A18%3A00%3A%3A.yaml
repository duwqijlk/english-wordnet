simpleMeaning: A worker who lifts heavy loads of goods, most of all at a dock
scope: This is a worker who lifts heavy loads of goods, most of all at a dock, and not a machine that
  lifts loads or a worker who packs goods.
examples:
- The heavers loaded the crates onto the ship.
- A heaver carried the sacks from the dock.
