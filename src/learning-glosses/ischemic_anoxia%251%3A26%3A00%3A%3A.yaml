simpleMeaning: A lack of oxygen in the body caused by slow blood flow to the outer parts, as after the
  heart fails to pump well.
scope: A lack of oxygen caused by slow blood flow to the outer parts of the body; stagnant anoxia is another
  name for this sense, not a lack of oxygen from thin air and not a lack from a blocked lung.
examples:
- The ischemic anoxia followed the failure of his heart to pump well.
- Ischemic anoxia set in as blood flow to her hands slowed.
