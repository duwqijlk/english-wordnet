simpleMeaning: to move in a clumsy way, or to move without being able to see where you are going
scope: 'Also called blunder: to move in a clumsy way or without seeing where you are going, not to drop
  a ball in a game and not to spoil a job.'
examples:
- He fumbled towards the door in the dark room.
- She fumbled along the hall, feeling the wall as she went.
