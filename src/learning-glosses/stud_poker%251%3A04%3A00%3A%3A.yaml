simpleMeaning: a card game in which each player gets some cards face down and the rest face up, and bets
  are made after each card is dealt
scope: This is a card game in which some cards are face down and the rest face up, also called stud; not
  a game with all cards face down and not a game with no betting.
examples:
- They played stud poker until late at night.
- In stud poker, you bet after each card is dealt.
