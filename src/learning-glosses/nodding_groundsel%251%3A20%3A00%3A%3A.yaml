simpleMeaning: A plant with upright leafy stems bearing clustered yellow flower heads that lack petal-like
  outer rays, each on a bent stalk; found in damp parts of the southwestern United States.
scope: This is a groundsel of damp ground in the southwestern United States, not another kind of groundsel
  or a similar yellow-flowered weed.
examples:
- Nodding groundsel grows in damp ground in the Southwest.
- The nodding groundsel's yellow flower heads hang from bent stalks.
