senseId: 'podsol_soil%1:27:00::'
synsetId: 15017704-n
simpleMeaning: A grey, washed-out layer under a dark mat of decaying plant litter marks this soil of cool
  or cold, wet conifer woods and heaths.
scope: 'The soil type also called podsol, podzol and podzolic soil: a cool-climate ground with an organic
  mat over a grey leached layer, not ordinary garden loam.'
examples:
- Podsol soil supports the conifer forests of northern Europe.
- The pit showed podsol soil with a grey layer beneath a dark surface mat.
