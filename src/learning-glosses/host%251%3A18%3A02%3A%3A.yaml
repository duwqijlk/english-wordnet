simpleMeaning: a person who invites guests to a party or other social event and looks after them while
  they are there.
scope: This is a person who receives and looks after guests, not an animal or plant that carries a parasite.
examples:
- Our host met us at the door with a drink.
- She was a generous host and made sure everyone had enough to eat.
