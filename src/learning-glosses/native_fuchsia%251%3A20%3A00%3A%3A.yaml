  red flowers, from New Zealand.
scope: An upright shrub or tree that loses its leaves in winter, up to 10 feet tall, with dark red flowers,
  from New Zealand, also called konini and tree fuchsia; not a garden fuchsia and not a tall forest tree.
examples:
- Native fuchsia grew along the New Zealand track.
- The native fuchsia had dark red flowers in spring.
