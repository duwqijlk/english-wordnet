simpleMeaning: the skill of weighing what is going on and reaching good decisions about it
scope: 'Also called sound judgement, judgment, judgement, and perspicacity: the skill of judging things
  well, not a hunch and not a single decision.'
examples:
- His sound judgment saved the firm from a bad deal.
- She showed sound judgment when she turned down the offer after weighing the risks.
