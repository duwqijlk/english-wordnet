simpleMeaning: Guarded at the front by the kneecap, this hinge joint in the leg joins the thigh bone to
  the shin and the thin outer leg bone
scope: This joint is also called the knee, genu, human knee, and knee joint, and it bends on a hinge,
  not a joint that turns in all ways.
examples:
- The articulatio genus bends when she walks.
- Pain in the articulatio genus made the stairs hard.
