simpleMeaning: the belief that rulers should be picked for their skill and not for their wealth or birth
scope: The belief that rulers should be picked for skill, not wealth or birth; not rule by the rich, and
  not rule by the people as a whole.
examples:
- In a meritocracy, the most able people rise to rule.
- She believed in meritocracy, where skill matters more than birth.
