simpleMeaning: to build something by joining its parts together so they fit
scope: To build a thing by joining its parts; not to put a border around a picture, and not a drawing,
  a part of a game, or the part that holds a pair of glasses.
examples:
- The workers framed the house with strong wooden beams.
- He framed the small shed by joining the cut boards together.
