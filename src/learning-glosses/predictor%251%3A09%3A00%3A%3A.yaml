simpleMeaning: information that helps you judge how likely something is to happen in the future
scope: This sense is information used to judge likely future events, not a person who says what will happen
  and not a machine that works out where to aim guns in the air.
examples:
- Low test scores are a strong predictor of later trouble at school.
- Rainfall is used as a predictor of how good the harvest will be.
