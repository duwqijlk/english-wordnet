simpleMeaning: Sharp points cover the hard skin of its oval fruit, which can be eaten, on this tree of
  south-east Asia
scope: Durian and durian tree are other names for this south-east Asian tree, whose oval fruit can be
  eaten though its hard skin bears sharp points.
examples:
- A durion stood at the edge of the field, heavy with fruit.
- They planted a durion in the garden for its oval fruit.
