simpleMeaning: about a group that has its own beliefs about religion, or like such a group
scope: This sense describes a thing linked to a group with its own beliefs about religion, or like such
  a group; it is not the noun that names a member of such a group.
examples:
- Sectarian differences led to arguments between the two groups.
- The town had a long history of sectarian conflict.
