simpleMeaning: A dish made from a calf's head or other meat, cooked to taste like the dish made from a
  green sea reptile
scope: A dish of calf's head or other meat made to taste like turtle soup, not real turtle soup and not
  a plain meat broth.
examples:
- They served mock turtle soup at the old inn.
- She made a pot of mock turtle soup from a calf's head.
