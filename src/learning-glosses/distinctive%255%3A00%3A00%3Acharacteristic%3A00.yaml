simpleMeaning: a mark or part of a person or thing that lets you tell it apart from others like it
scope: A mark that sets a person or thing apart from others like it, not a thing that is merely strange
  or rare.
examples:
- The town has a distinctive smell of spices in its market.
- Her distinctive laugh told me it was her before I turned round.
