simpleMeaning: to keep someone or something safe by magic powers or by magic words or objects
scope: This is keeping someone safe with magic powers or magic objects, not controlling someone by magic
  and not a set of words used for magic.
examples:
- In the tale, a magic ring charmed the knight, so no sword could hurt him.
- She wore a stone that was said to charm her against illness.
