simpleMeaning: How big one amount is compared with another, usually shown as one number divided by the
  other
scope: How two amounts compare in size; not the amounts themselves, and not a single number on its own.
examples:
- The ratio of boys to girls in the class is two to one.
- Mix the paint in a ratio of one part blue to three parts white.
