simpleMeaning: 'A full metric set of measures for scientists: length in meters, mass in kilograms, time
  in seconds, current in amperes, temperature in kelvins, amount in moles, and brightness in candelas.'
scope: Not the older metric measures or a national set of measures; also called SI, the International
  System, the International System of Units, the SI unit, Systeme International, and Systeme International
  d'Unites.
examples:
- The SI system is used by scientists in nearly every country.
- Our lab reports all measures in the SI system.
