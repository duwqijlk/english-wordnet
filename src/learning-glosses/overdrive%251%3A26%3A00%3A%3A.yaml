simpleMeaning: a state of very high or too much work, activity, or focused thought, with a lot being done
scope: A state of doing and thinking a lot, or too much; not the high gear in a car used at high speed
  with less power.
examples:
- His brain went into overdrive as the test began.
- The team worked in overdrive to finish the job on time.
