simpleMeaning: In genetics, young from a cross of two kinds tend to turn out better than either parent.
scope: When young from a cross of two kinds turn out better than either parent, the gain is also called
  hybrid vigor.
examples:
- Heterosis showed in the cross, which grew better than either parent.
- Heterosis made the young stronger than either parent.
