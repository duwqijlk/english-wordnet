simpleMeaning: A shopkeeper who sells socks, stockings, and, in England, knitted clothes
scope: A shopkeeper who sells socks, stockings, and, in England, knitted clothes; not a maker of cloth,
  and not a seller of shoes.
examples:
- The hosier stocked socks and stockings of every size.
- She bought her winter stockings from the hosier on the high street.
