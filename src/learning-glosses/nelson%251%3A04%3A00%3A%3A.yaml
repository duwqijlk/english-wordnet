simpleMeaning: One of several holds in wrestling, where one arm goes under the other person's arm from
  behind, and the hand presses on the back of their neck.
scope: For wrestling holds, with one arm under the opponent's arm from behind pressing on the back of
  the neck.
examples:
- He caught his rival in a nelson and held him down.
- The nelson forced her head forward.
