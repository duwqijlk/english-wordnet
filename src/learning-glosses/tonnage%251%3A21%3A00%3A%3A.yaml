simpleMeaning: a tax that ships must pay when they enter the US, worked out from how much the ship can
  carry
scope: This is the tax itself, paid when a ship enters the US; it is not the weight a ship can carry and
  not the size of a ship measured in tons.
examples:
- The port charged tonnage on every foreign ship that entered.
- The ship's owners paid the tonnage before the goods could be unloaded.
