simpleMeaning: Marked by much sweating and many deaths, a sickness spread far in the 1400s and 1500s.
scope: This is a sickness of the 1400s and 1500s marked by sweating; sweating sickness is another name
  for this sense.
examples:
- Miliary fever took many lives in the 1500s, when people sweated much and died.
- Miliary fever came with much sweating, and many who caught it died.
