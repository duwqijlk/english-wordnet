simpleMeaning: Many plants of this kind grow masses of bright, usually yellow flowers shaped like daisies,
  and flower for a long time across the Americas.
scope: Also called tick-weed, tickseed, and tickweed, it is a plant with masses of daisy-like flowers,
  not a daisy itself.
examples:
- The coreopsis in the front bed is covered in yellow flowers.
- She planted coreopsis along the fence for color all summer.
