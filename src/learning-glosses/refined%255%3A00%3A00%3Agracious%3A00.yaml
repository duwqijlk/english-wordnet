simpleMeaning: the way a thing looks makes you think of good taste, an easy life, and plenty of money
scope: 'Also called elegant or graceful: a look that shows good taste, comfort and wealth, not a cleaned-up
  substance and not a person of good manners.'
examples:
- Her refined dress and calm manner impressed the guests.
- They lived in a refined house full of fine old furniture.
