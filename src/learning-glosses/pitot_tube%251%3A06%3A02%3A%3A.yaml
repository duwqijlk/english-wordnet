simpleMeaning: A tool that joins two measuring pipes to read both full and still-air pressure, used in
  planes to find air speed.
scope: Also called a Pitot-static tube and a Pitot head; a tool in planes that reads both full and still-air
  pressure to find air speed.
examples:
- The Pitot tube in the cockpit showed the plane's airspeed.
- A blocked Pitot tube can give a wrong airspeed reading.
