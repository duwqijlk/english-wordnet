simpleMeaning: Going on without a break in time, and going on for a very long time with no fixed end
scope: Going on without a break in time, and going on for a very long time with no fixed end, also called
  constant, incessant or perpetual; not simply happening often.
examples:
- The ceaseless rain kept us indoors all day.
- She worked with ceaseless care through the long night.
