simpleMeaning: A herb of eastern North America that lives for years, with hand-like leaves made of small
  leaflets and most often rose-purple blooms.
scope: Also called violet wood sorrel; it is a long-lived herb of eastern North America, not a short-lived
  herb from other lands, with hand-like leaves and most often rose-purple blooms.
examples:
- Oxalis violacea opened its rose-purple flowers in the wood.
- The Oxalis violacea in the garden comes back every year.
