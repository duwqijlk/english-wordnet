simpleMeaning: By fast spinning, usually, this tool finds how much of the blood is cells and how much
  is liquid.
scope: People also call this tool hematocrit, and it measures the share of cells and liquid in blood rather
  than being that share itself.
examples:
- The haematocrit showed the share of cells in her blood.
- Doctors use a haematocrit to test blood after fast spinning.
