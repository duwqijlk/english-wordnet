simpleMeaning: 'Cosmetic surgery that removes wrinkles and other signs of ageing from the face: the surgeon
  cuts near the hairline, pulls the skin back and trims away extra tissue.'
scope: This is a cosmetic operation on the face; the one-word form is chiefly British and dated, and it
  is not the machine that carries people between floors nor the insert that makes a person seem taller.
examples:
- She had a face lift last year to smooth the lines around her eyes.
- The surgeon said a face lift would pull the loose skin tight again.
