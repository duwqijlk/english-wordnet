simpleMeaning: a very loud sound that is sharp and hard to listen to
scope: A loud rough noise; din, blare, clamor, and cacophony are other names for this, not the adjective
  for unpleasantly loud sound.
examples:
- The blaring of the horns filled the street.
- We could hear the blaring of radios from the beach.
