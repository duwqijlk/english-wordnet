simpleMeaning: A lasting, worsening blood thinness in older grown-ups, held to spring from a want of intrinsic
  factor — stomach juice that helps the body soak up vitamin B12.
scope: This sense is also called malignant anaemia, pernicious anaemia and pernicious anemia, for a lasting,
  worsening blood thinness in older grown-ups, held to spring from a want of intrinsic factor — stomach
  juice that helps the body soak up vitamin B12.
examples:
- Malignant anemia strikes older adults.
- Malignant anemia comes from a lack of intrinsic factor.
