simpleMeaning: 'A drug sold as Dramamine, used to treat travel sickness: it blocks a body chemical and
  stops vomiting.'
scope: A travel-sickness drug sold as Dramamine, not a drug for pain and not a drug for sleep.
examples:
- She took dimenhydrinate before the boat trip.
- Dimenhydrinate kept him from feeling sick on the bus.
