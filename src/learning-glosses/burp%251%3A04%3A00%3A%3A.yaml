simpleMeaning: gas that comes noisily up from the stomach and out of the mouth, without you meaning it
  to
scope: Also called a belch; gas let out of the stomach through the mouth, not a cough or a hiccup.
examples:
- The baby let out a loud burp after her milk.
- He tried to hold back a burp at the table.
