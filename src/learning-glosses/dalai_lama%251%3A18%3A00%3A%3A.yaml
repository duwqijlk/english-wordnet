simpleMeaning: The chief holy man of Tibet, who once ruled there
scope: This is the chief holy man of Tibet, once its ruler; Grand Lama is another name for this sense.
  Not another holy man of Tibet, and not a ruler of another land.
examples:
- The Dalai Lama is the chief holy man of Tibet.
- People travel far to see the Dalai Lama.
