simpleMeaning: a kind of comparison made by quoting words many people know and then adding a funny ending
  that makes the quote seem silly
scope: A comparison made from a well-known quote with a funny ending, not a plain quote and not a joke
  told on its own.
examples:
- His wellerism quoted an old saying and then gave it a funny twist.
- She made the class laugh with a wellerism that ended a famous line in a silly way.
