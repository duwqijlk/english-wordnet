simpleMeaning: The state of being under the control of a national government.
scope: The state of being under the control of a national government; federalization is another name for
  this sense, not the act of putting a thing under such control, and not control by a state government.
examples:
- The federalisation of the mines lasted for decades.
- After federalisation, the schools answered to the national government.
