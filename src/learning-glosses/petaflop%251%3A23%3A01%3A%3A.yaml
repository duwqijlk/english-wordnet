simpleMeaning: One thousand million million calculations with decimal numbers in one second is what this
  unit counts in computer science to show how fast a computer works
scope: A unit that counts how fast a computer works, not a unit of size or weight and not the computer
  itself.
examples:
- The new machine can run at ten petaflops.
- Their computer reached a speed of three petaflops.
