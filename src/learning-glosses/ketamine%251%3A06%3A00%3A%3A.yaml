simpleMeaning: An anesthetic and sedative, not a barbiturate, given by injection; used by vets or in minor
  surgery on the old or young; large doses cause hallucinations like the drug PCP.
scope: This is the drug itself; the hydrochloride name is the same medicine in salt form, not a different
  drug, and PCP is a separate substance.
examples:
- The vet gave the injured dog a small dose of ketamine before setting its broken leg.
- Taken in large doses, ketamine can make people see and hear things that are not there.
