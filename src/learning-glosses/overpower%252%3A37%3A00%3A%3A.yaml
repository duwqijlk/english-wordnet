simpleMeaning: To beat a person down with strong feeling, or with so much to see and hear that they cannot
  stand against it.
scope: To beat a person down with strong feeling or with too much to see and hear, also called overwhelm,
  overcome, and overtake.
examples:
- Grief overpowered her at the news.
- The heat overpowered the climbers on the ridge.
