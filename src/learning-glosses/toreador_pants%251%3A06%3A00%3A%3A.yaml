simpleMeaning: tight trousers, used in the plural, that end at the lower leg and are worn by women and
  girls
scope: Tight trousers that end at the lower leg, worn by women and girls; pedal pushers is another name
  for this sense. Not full-length trousers and not short shorts.
examples:
- She wore toreador pants with flat shoes.
- The toreador pants ended just below her knees.
