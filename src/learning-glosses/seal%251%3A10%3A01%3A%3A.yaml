simpleMeaning: A mark fixed on a document to show that the document is real or to close it
scope: A mark put on a paper to show it is real or to close it. Not the tool that makes the mark, not
  the sea animal, and not the warm substance used to close letters.
examples:
- The letter from the court carried the judge's seal at the bottom.
- The document is not official without the seal in the corner.
