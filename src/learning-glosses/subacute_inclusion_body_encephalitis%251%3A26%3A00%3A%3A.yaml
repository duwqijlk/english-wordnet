simpleMeaning: A rare brain inflammation caused by measles virus, lasting and worsening, striking kids
  mostly, then young adults following a first-time measles bout before two, usually deadly in three years.
scope: Also called inclusion body encephalitis, sclerosing leukoencephalitis, subacute sclerosing leukoencephalitis,
  and subacute sclerosing panencephalitis, this is a rare brain inflammation caused by measles virus,
  lasting and worsening, striking kids mostly, then young adults following a first-time measles bout before
  two, usually deadly in three years, where inclusion body encephalitis is a rare, long-lasting brain
  swelling from measles virus that slowly worsens, hitting mostly kids, then young adults, following a
  first-time measles bout before two, usually deadly in three years.
examples:
- Subacute inclusion body encephalitis is rare.
- Doctors study subacute inclusion body encephalitis in children.
