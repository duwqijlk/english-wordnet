simpleMeaning: Of or like Hades or Tartarus, the underworld of the dead.
scope: This word is for what belongs to Hades or Tartarus, the underworld of the dead; Hadean and Plutonian
  are other names for this sense, not a word for heaven or the world of the living.
examples:
- The old poem speaks of Tartarean darkness below the earth.
- His Tartarean rage seemed to rise from the underworld.
