simpleMeaning: The usual beat of the brain in a person awake but at rest runs at 8 to 12 beats each second
  on a brain test
scope: Also called alpha rhythm, this is the usual beat of the brain on a brain test in a person awake
  but at rest, running 8 to 12 times each second.
examples:
- The alpha wave on the test was steady while he sat awake but relaxed.
- Her alpha wave ran at about nine beats each second.
