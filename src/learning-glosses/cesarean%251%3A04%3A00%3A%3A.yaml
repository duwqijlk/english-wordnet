simpleMeaning: The birth of a baby by cutting through the wall of the belly and the womb, named for the
  old belief that Julius Caesar was born that way.
scope: Also called a caesarian, an abdominal delivery, a caesarean, a caesarean delivery, a caesarean
  section, a caesarian delivery, a caesarian section, a cesarean delivery, a cesarean section, a cesarian,
  or a cesarian section; the birth of a baby by cutting through the belly and the womb, not the adjective
  for a birth of that kind.
examples:
- The doctor performed a cesarean when the labour stalled.
- She recovered slowly after the cesarean.
