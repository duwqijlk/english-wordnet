simpleMeaning: the seed-making part of a fungus, which holds its tiny seeds on special cells
scope: The fruiting part of a fungus, not the whole fungus and not a lichen that has a fungus in it.
examples:
- The basidiocarp of the mushroom rose above the leaf litter.
- Spores form on the basidiocarp before they drift away.
