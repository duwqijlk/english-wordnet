simpleMeaning: An automatic inborn answer to something that acts on the body, made without thought or
  learning.
scope: Also called a reflex, an inborn reflex, an innate reflex, or an instinctive reflex, this is a body
  answer that comes at once with no thought, not a move made on purpose and not a habit learned over time.
examples:
- A blink is a physiological reaction to dust in the eye.
- Her knee jerked in a physiological reaction when the doctor tapped it.
