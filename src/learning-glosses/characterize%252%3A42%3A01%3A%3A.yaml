synsetId: 02703792-v
simpleMeaning: to be a typical quality that sets a person, place or thing apart
scope: Also called characterise, this sense means to be a typical quality of something, not to describe
  a person or thing in words.
examples:
- Bright colours characterize his early paintings.
- A strong smell of garlic characterizes the dish.
