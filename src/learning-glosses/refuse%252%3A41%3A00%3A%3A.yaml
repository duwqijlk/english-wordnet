simpleMeaning: to bar someone from entering a place or joining a group
scope: Turning a person away or keeping them out of a group, not the body's immune reaction to a transplant
  and not withholding something from someone; reject, turn away and turn down are other names for this
  sense.
examples:
- The club refused him membership because of his age.
- The guards refused us entry to the building.
