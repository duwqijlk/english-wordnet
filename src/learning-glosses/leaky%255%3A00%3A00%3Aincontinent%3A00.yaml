senseId: leaky%5:00:00:incontinent:00
synsetId: 00594806-s
simpleMeaning: In informal use, not able to hold pee in the body, so it comes out when you do not want
  it to
scope: In informal use, this is about a person who cannot hold pee; it is not about a pipe or roof that
  lets water or gas through, and not about a person who tells secret news.
examples:
- After the operation, he was a bit leaky and needed special pants.
- She said, with a laugh, that she was leaky and had to stay near a toilet.
