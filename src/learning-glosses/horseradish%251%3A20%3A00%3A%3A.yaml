simpleMeaning: a rough plant from Europe and Asia, grown for its thick white root, which has a strong,
  sharp taste
scope: This is the living plant, also called horse radish and red cole; not its root on its own, and not
  the grated root used as food.
examples:
- Horseradish spreads fast in the garden if you do not control it.
- She planted horseradish along the fence for its strong white roots.
