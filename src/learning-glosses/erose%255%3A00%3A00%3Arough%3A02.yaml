simpleMeaning: With an edge cut into uneven points and gaps, as if it had been bitten away
scope: With an edge cut into uneven points and gaps; jagged, toothed, notched and jaggy are other names
  for this sense, not a smooth edge and not an edge cut in a straight line.
examples:
- The erose leaf edge looked as if it had been gnawed.
- An erose margin gives the leaf a ragged look.
