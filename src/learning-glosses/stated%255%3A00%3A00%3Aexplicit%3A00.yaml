simpleMeaning: Said openly and plainly as a fact.
scope: This applies to something that has been put into words as a fact; it is not about something only
  suggested or implied.
examples:
- The stated aim of the project is to cut costs by half.
- Her stated reason for leaving was a wish to travel.
