simpleMeaning: Very small animals like lobsters, usually cooked by boiling them for a short time.
scope: Also called a crawfish, a crawdad, or an ecrevisse, very small lobster-like animals usually boiled
  briefly, not the small freshwater kind, not the warm-water kind without claws, and not the large sea
  kind.
examples:
- They boiled the crayfish briefly and served them hot.
- The crayfish were tiny, no bigger than a thumb.
