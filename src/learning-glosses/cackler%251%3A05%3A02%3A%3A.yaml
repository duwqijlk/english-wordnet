simpleMeaning: any of several kinds of Old World bird that eat insects and sing a loud song that goes
  on and on, sometimes put in the flycatcher family
scope: Any of several kinds of Old World bird that eat insects and sing a loud song that goes on and on,
  sometimes put in the flycatcher family, also called babbler, and not a hen that has just laid an egg
  or a quiet songbird.
examples:
- The cackler sang loudly from the top of the bush.
- Cacklers kept up their song through the morning.
