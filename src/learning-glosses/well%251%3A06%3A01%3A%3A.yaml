simpleMeaning: An enclosed space in a ship or aircraft that holds something, such as fish or the landing
  gear, or shields machinery such as pumps.
scope: This is a built-in compartment on a ship or aircraft, not a hole dug for water and not a state
  of good health.
examples:
- The landing gear folded into a well beneath the cabin.
- The fish are kept in a well of seawater until the boat docks.
