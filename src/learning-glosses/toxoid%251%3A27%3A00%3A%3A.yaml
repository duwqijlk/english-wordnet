simpleMeaning: 'Lasting protection against one sickness comes from a germ poison made weak on purpose:
  it can no longer harm, yet it wakes the body to build defences.'
scope: Also called anatoxin, this is a germ poison made weak so it wakes the body to build defences without
  harming it.
examples:
- The clinic gave the child a toxoid against diphtheria.
- Diphtheria toxoid is made from a poison weakened until it cannot harm.
