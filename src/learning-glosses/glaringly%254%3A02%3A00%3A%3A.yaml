synsetId: 00143036-r
simpleMeaning: In a way that is clear to see at once, too plain to miss.
scope: So clear it cannot be missed, not merely clear after a close look.
examples:
- It was glaringly obvious that the figures did not add up.
- The mistake stood out glaringly in the report.
