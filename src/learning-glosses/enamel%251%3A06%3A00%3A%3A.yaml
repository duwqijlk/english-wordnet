simpleMeaning: a smooth, shiny coat that looks like the hard glaze baked onto pots
scope: A smooth, shiny coat like the glaze on pots, not the colored glassy stuff fused onto metal or pottery,
  and not the hard white cover of a tooth.
examples:
- The enamel on the old table was smooth and shiny.
- She chose a bright enamel for the kitchen cupboards.
