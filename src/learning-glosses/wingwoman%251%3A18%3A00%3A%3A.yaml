simpleMeaning: a woman pilot who keeps her plane outside and behind the lead plane in a group of planes
  flying in a set shape
scope: A woman pilot who flies outside and behind the lead plane in a group, not a woman who helps a friend
  meet people and not a male pilot in the same spot.
examples:
- The wingwoman held her plane just behind the leader during the flypast.
- As wingwoman, she kept her plane outside the leader's path.
