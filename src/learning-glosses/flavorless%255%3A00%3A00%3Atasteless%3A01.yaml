senseId: flavorless%5:00:00:tasteless:01
synsetId: 02408319-s
simpleMeaning: Having no taste, nothing sharp to notice.
scope: This sense is also called flat, bland, vapid, insipid, and flavourless, for having no taste, nothing
  sharp to notice, where being flat is having no flavor at all, with nothing sharp or strong in it, and
  being bland is having no taste in it at all, nothing sharp or strong to notice.
examples:
- The soup was flavorless, with no taste at all.
- The food was flavorless, nothing sharp to notice.
