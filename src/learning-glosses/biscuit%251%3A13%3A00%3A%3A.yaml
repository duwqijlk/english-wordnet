simpleMeaning: a small round bread made to rise with baking powder or baking soda
scope: This is a small round bread made to rise with baking powder or baking soda; not a sweet, flat baked
  food like a cookie, and not a thin, dry cracker.
examples:
- She ate a warm biscuit with her soup.
- He put butter on a fresh biscuit at breakfast.
