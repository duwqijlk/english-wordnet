simpleMeaning: A blood protein that takes in oxygen from the red part of the blood and keeps it in the
  body tissues until it is needed.
scope: A blood protein that takes in oxygen and keeps it in the body tissues until needed, not the blood
  protein that carries oxygen around the body and not a muscle itself.
examples:
- Myoglobin stores oxygen in the muscles until it is needed.
- The myoglobin in the seal's muscles holds extra oxygen for long dives.
