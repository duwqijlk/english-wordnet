senseId: 'penance%1:04:01::'
synsetId: 01041172-n
simpleMeaning: a Catholic sacrament (a holy church act) in which a person is sorry for wrong things done,
  admits them, makes up for them, and is forgiven
scope: This is the Catholic church act in which a person is forgiven after being sorry for wrong things,
  admitting them and making up for them; it is not punishing yourself by your own choice to make up for
  wrong you did.
examples:
- He went to penance and told the priest what he had done wrong.
- Through penance, she asked God to forgive the wrong things she had done.
