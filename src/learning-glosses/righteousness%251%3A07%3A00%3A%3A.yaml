simpleMeaning: the quality of living in a way that follows rules about what is right and good
scope: This is the quality of living by rules about what is right and good. It is not just doing one good
  act.
examples:
- People praised her righteousness because she always treated others fairly.
- His righteousness showed in the way he helped people even when no one was watching.
