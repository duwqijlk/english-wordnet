simpleMeaning: A Brazilian shrub with leaves split twice into small leaflets and small spike flowers,
  followed by flat or lumpy pods, sometimes put in the genus Piptadenia.
scope: A Brazilian shrub with leaves split twice into small leaflets, also called Piptadenia macrocarpa;
  its nearest kin are other Brazilian shrubs with small spike flowers.
examples:
- Anadenanthera colubrina grew on the dry hillside with flat pods.
- We saw Anadenanthera colubrina in flower with small spike flowers.
