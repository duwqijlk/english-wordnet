simpleMeaning: A long pod holding small beans and sweetish pulp that can be eaten, used to feed animals
  and to make a thing used in place of chocolate.
scope: A long pod with beans and sweet pulp, also called an algarroba, algarroba bean, carob bean, locust
  bean, or locust pod, not the powder made from it and not the tree that bears it.
examples:
- The farmer fed carob pods to the goats.
- Carob beans were ground up as a chocolate substitute.
