simpleMeaning: Its bright red spathe, a large leaf-like part, and spadix, a thick spike of tiny blooms,
  are why this anthurium is often grown.
scope: Also called a flamingo plant, this anthurium is often grown for its bright red spathe, a large
  leaf-like part, and spadix, a thick spike of tiny blooms.
examples:
- The flamingo flower on the table had a bright red spathe.
- She kept a flamingo flower in a pot by the window.
