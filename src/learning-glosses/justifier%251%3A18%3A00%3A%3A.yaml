simpleMeaning: A person who speaks or writes in defence of a policy or an institution
scope: 'Another name for an apologist: a person who defends a policy or institution in words, not the
  person who makes the policy.'
examples:
- He acted as a justifier of capital punishment in the debate.
- The justifier of the policy answered every critic.
