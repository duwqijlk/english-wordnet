simpleMeaning: someone who, in a public place, steals things from other people's pockets or purses
scope: 'Also called dip and cutpurse: someone who steals from pockets or purses in public places, not
  a robber who uses force and not a thief who goes into a home to steal.'
examples:
- A pickpocket took his wallet from his coat pocket on the busy train.
- Police watched the market for the pickpocket who took money from shoppers' pockets.
