simpleMeaning: A fairly rough open lace made by weaving and tying cords into knots.
scope: A fairly rough lace made by knotting cords; not fine needle lace and not woven cloth.
examples:
- She made a macrame wall hanging from thick cotton cord.
- The macrame plant holder hung by the window.
