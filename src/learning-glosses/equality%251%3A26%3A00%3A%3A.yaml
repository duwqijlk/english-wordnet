synsetId: 13969940-n
simpleMeaning: when two things are in effect the same in amount or worth, with neither one ahead of the
  other
scope: Also called par or equation, this is about two things matching in amount or worth, not about two
  things being the same in every way.
examples:
- The equality of the two teams showed in the final score.
- They fought for equality in pay for the same work.
