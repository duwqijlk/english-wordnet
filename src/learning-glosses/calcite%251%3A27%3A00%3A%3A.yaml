simpleMeaning: a common mineral made of calcium carbonate (a white chemical found in chalk) in the form
  of crystals, and a main part of limestone
scope: This names the mineral itself, not the rock limestone, which is mostly made of it.
examples:
- The white stone was mostly calcite.
- Calcite is found in many caves and rocks.
