simpleMeaning: in physical chemistry, a quantity of material in which substances present in different
  states are balanced with one another
scope: This is a quantity of material studied in chemistry, not a set of connected parts, a body's organs,
  a method, or an orderly way of doing things.
examples:
- When the liquid and its vapour are sealed together, the system reaches equilibrium.
- The system contains ice, liquid water, and steam at the same time.
