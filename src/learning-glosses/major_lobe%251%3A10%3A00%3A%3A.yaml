simpleMeaning: The largest bulge in the pattern of waves sent out, meant to run along the front line and
  to act like a straight stream of waves.
scope: The largest bulge in the pattern of waves sent out, meant to run forward like a straight stream;
  not a small side bulge and not the waves themselves.
examples:
- The major lobe of the signal pointed straight ahead.
- Engineers aimed the major lobe at the distant town.
