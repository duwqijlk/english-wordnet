simpleMeaning: Knowing about insects, this person gathers and studies butterflies and moths above all
scope: 'Also called a butterfly collector and a lepidopterologist: a person who studies insects and gathers
  and studies butterflies and moths, not a person who studies all insects alike and not a person who only
  keeps butterflies.'
examples:
- The lepidopterist spent the summer catching moths in the hills.
- As a lepidopterist, she knew every butterfly in the valley.
