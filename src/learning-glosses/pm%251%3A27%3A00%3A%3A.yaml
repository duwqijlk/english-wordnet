simpleMeaning: A soft, silvery metal of the rare-earth group, with no lasting kind; first found in a radioactive
  form left when uranium splits.
scope: Also called promethium, atomic number 61; not the other rare-earth metals.
examples:
- Scientists first found Pm in uranium waste.
- Pm is a rare-earth metal with no lasting form.
