simpleMeaning: A leaning to find fault with views that differ, or with shocking conduct.
scope: A leaning to find fault with views that differ or with shocking conduct; narrowness is another
  name for this, and it is not open-mindedness or a hatred of new things.
examples:
- His narrow-mindedness kept him from hearing the other side.
- Narrow-mindedness makes people quick to judge.
