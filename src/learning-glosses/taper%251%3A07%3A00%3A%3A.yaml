simpleMeaning: the way a shape gets narrower and narrower until it ends in a point
scope: The way a shape narrows to a point, like a wedge or cone, not the cord in a candle.
examples:
- The taper of the tower made it look taller than it was.
- The pencil had a slight taper toward its tip.
