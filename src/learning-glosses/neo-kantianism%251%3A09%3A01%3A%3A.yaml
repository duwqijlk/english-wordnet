simpleMeaning: A school of thought opposing mid-1800s materialism and idealism, growing from Kant's theory
  of knowledge, treating the thing-in-itself as a borderline idea and stressing rules in ethics and law.
scope: A school of thought growing from Kant's theory of knowledge, not Kant's own system and not the
  mid-1800s materialism or idealism it opposed.
examples:
- Neo-Kantianism grew out of Kant's theory of knowledge in the 1800s.
- Fischer's dispute with Trendelenburg helped spark neo-Kantianism.
