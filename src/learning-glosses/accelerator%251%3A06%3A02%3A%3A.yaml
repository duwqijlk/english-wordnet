simpleMeaning: The pedal you press with your foot to set how fast the engine runs.
scope: The foot pedal that controls the engine's speed; gun, gas and throttle are other names for this
  sense, and it is not the chemical substance nor the science instrument that speeds up particles.
examples:
- He pressed the accelerator and the car moved forward.
- She eased off the accelerator as she came to the corner.
