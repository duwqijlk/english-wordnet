senseId: 'synchronicity%1:24:00::'
synsetId: 13867436-n
simpleMeaning: the fact that things happen at the same time
scope: 'Also called synchronization, synchrony, synchronisation, and synchronizing: this is about things
  happening at the same time, not about making things happen at the same time.'
examples:
- The synchronicity of the two clocks kept the whole system working well.
- There was a clear synchronicity between the lights changing and the bells ringing.
