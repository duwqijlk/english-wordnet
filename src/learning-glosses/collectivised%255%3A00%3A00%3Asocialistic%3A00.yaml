simpleMeaning: Holding the belief that the people together should own things, with no one person owning
  them
scope: Describes a person who believes things should be owned by all the people together; collectivized,
  collectivist and collectivistic are other names for this sense, not a belief in owning things alone
  or in a few hands.
examples:
- She holds collectivised views about land and work.
- The collectivised plan gave the land to the people as a whole.
