simpleMeaning: A loud sound made to show dislike or scorn for something.
scope: 'Also called a bird, a hiss, a snort, a hoot, a boo, or a raspberry: a loud sound made to show
  dislike or scorn for something, not the act of harassing someone with unkind words again and again.'
examples:
- The crowd gave a loud razz when the singer forgot the words.
- A razz rose from the back rows as the play dragged on.
