simpleMeaning: a short saying that is easy to remember and tells an important truth from life that many
  people believe is true
scope: 'Also called saw, proverb, and byword: a short, well-known saying about life, not a long story
  and not a single new idea.'
examples:
- '''Look before you leap'' is an old adage.'
- She often quotes the adage 'Actions speak louder than words'.
