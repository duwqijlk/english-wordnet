simpleMeaning: a statement that says someone is guilty of doing something wrong or breaking the law
scope: Also called charge, this is the statement that someone has done wrong; it is not the formal act
  of bringing a case against a person.
examples:
- The newspaper printed an accusation that the mayor had taken money.
- She denied the accusation that she had cheated in the test.
