simpleMeaning: a measure of how bright a light is, counted in candelas, a unit for the brightness of light
scope: 'Also called light intensity: how bright a light is, not how much power a bulb uses and not the
  colour of the light.'
examples:
- The lamp was rated at 100 candlepower.
- Engineers measured the candlepower of the new headlight.
