simpleMeaning: This animal's teeth sit in no holes at all; they are joined hard to the top edge of its
  jawbone.
scope: This names the animal whose teeth are joined to the top edge of the jawbone instead of sitting
  in holes.
examples:
- In the acrodont, the teeth are fixed to the top edge of the jaw.
- The acrodont had no sockets for its teeth to sit in.
