senseId: 'concertina%2:38:00::'
synsetId: 02087941-v
simpleMeaning: To fall in on itself, folding up in a row of folds.
scope: A thing folding in on itself in a row of folds, as the musical instrument of the same name does;
  not the instrument itself, and not the coiled wire used as an obstacle.
examples:
- The front of the car concertinaed in the crash.
- The old fence concertinaed when the truck hit it.
