simpleMeaning: not having your mind or body changed by a chemical substance (a thing that can change how
  you think or feel), especially alcohol
scope: This is the state of not being changed by a drug or alcohol; not the act of becoming free from
  drink, and not the serious, promise-keeping sense.
examples:
- He stayed sober all evening and drove everyone home.
- The driver was sober and passed the alcohol test.
