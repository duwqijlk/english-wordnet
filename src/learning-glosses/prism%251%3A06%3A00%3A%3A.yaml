simpleMeaning: a tool made of glass or quartz (a hard clear stone), with three sides, used to bend a beam
  of light or turn a picture upside down
scope: 'Also called an optical prism: a glass or quartz tool for bending light, not the solid shape with
  two matching ends and flat sides studied in maths.'
examples:
- She held a prism up so the beam of light bent through it.
- The prism in the tool turned the picture upside down.
