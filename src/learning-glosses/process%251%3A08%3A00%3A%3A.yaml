simpleMeaning: a natural growth that extends out from a part of a living thing, whether an animal or a
  plant
scope: This sense is not a series of gradual changes, and not a legal action or a court paper.
examples:
- The xiphoid process is a small piece of bone at the lower end of the breastbone.
- The male beetle has a curved process on its head, which it uses in fights.
