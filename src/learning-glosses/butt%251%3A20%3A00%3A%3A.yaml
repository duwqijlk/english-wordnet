simpleMeaning: where the roots grow out of a plant, or the lowest part of its stem or tree trunk, closest
  to the roots
scope: The bottom part of a plant, not a large barrel for liquid and not the small end left of a cigarette.
examples:
- Cut the plant off just above the butt, where the roots begin.
- The butt of the tree trunk was thick and close to the ground.
