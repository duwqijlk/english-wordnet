simpleMeaning: A kind of arthritis that strikes children, in which the big joints swell and the growth
  of bone may slow.
scope: Also called juvenile rheumatoid arthritis; a kind of arthritis that strikes children, in which
  the big joints swell and the growth of bone may slow.
examples:
- Still's disease made the child's knees swell.
- The doctor said Still's disease can slow bone growth.
