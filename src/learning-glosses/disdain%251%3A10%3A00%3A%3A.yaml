senseId: 'disdain%1:10:00::'
synsetId: 06732153-n
simpleMeaning: something said or done that shows a lack of respect by treating the other person as if
  they were less clever or less important
scope: A message that shows a lack of respect, not the feeling of disdain itself and not a plain insult.
examples:
- Her disdain was clear when she spoke to him as if he were a child.
- The letter was full of disdain for the people who had written to complain.
