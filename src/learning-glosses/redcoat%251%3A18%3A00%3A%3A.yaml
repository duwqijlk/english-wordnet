simpleMeaning: a British soldier, called this because of his red coat, especially during the American
  Revolution
scope: 'Also called lobsterback: a British soldier named for his red coat, especially in the time of the
  American Revolution; not just any soldier, and not any person who wears a red coat.'
examples:
- A redcoat stood guard outside the town hall during the American Revolution.
- The redcoats marched into the village in their bright red coats.
