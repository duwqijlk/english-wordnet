simpleMeaning: Pink flowers most often, with petals cut into torn edges, mark this common plant of Europe
  and the west of Asia, which lives on year after year.
scope: This plant is also called cuckoo flower.
examples:
- We spotted a ragged robin with pink flowers.
- The ragged robin was in flower again this year.
