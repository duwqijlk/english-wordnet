simpleMeaning: the act of finding out what something is like or what its qualities are, usually by study
  or by working with numbers
scope: 'This act is also called finding: finding out facts about something, usually by study. It is not
  deciding an outcome, and not a person''s firm will to do something.'
examples:
- The determination of the water's quality took weeks of tests.
- Careful determination of the metal's strength is needed before building.
