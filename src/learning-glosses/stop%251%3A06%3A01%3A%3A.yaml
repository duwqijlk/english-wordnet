simpleMeaning: Something that blocks the inside of a pipe or tube.
scope: This is a blockage inside a pipe or tube, not a restraint on a moving part.
examples:
- A stop in the narrow tube kept the water from flowing.
- The plumber found a wad of paper blocking the drainpipe.
