simpleMeaning: an early work in wax or clay, shaped first so that a maker can copy it to make the finished
  piece
scope: An early work in wax or clay, shaped first so that a maker can copy it to make the finished piece;
  not a person showing clothes, and not a small copy of a thing.
examples:
- The artist showed the modeling in clay before casting the bronze.
- She made a modeling in wax of the horse's head.
