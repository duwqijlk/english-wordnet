simpleMeaning: one of certain rough wild plants with a long, deep main root, sometimes eaten as a green
  vegetable or used as a home cure
scope: 'Also called dock: a rough wild plant with a long main root, not the sour leaves used in salads
  and not a plant of the Oxalis group.'
examples:
- He pulled up the sorrel and found one long main root under its rough leaves.
- She dug up sorrel roots to make an old home cure.
