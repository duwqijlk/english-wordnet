simpleMeaning: The outer layer of the side of the brain gets its blood from a tube that runs to its front
  part
scope: Arteria temporalis anterior is another name for this blood tube, which runs to the front part of
  the side of the brain.
examples:
- The anterior temporal artery feeds the front part of the temporal lobe.
- The anterior temporal artery runs to the front part of the temporal lobe.
