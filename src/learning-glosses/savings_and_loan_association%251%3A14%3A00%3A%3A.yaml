simpleMeaning: a place that keeps people's money safe, which by law must use part of it to help people
  buy homes
scope: A savings bank that must by law put some of its money into home loans; savings and loan is another
  name for this sense. Not an ordinary bank and not a lender that only lends to businesses.
examples:
- The savings and loan association helped them buy their first house.
- She opened an account at a savings and loan association near her work.
