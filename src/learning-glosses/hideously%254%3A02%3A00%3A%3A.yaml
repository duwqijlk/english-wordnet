senseId: 'hideously%4:02:00::'
synsetId: 00358561-r
simpleMeaning: in a way that looks very ugly and is hard and upsetting to see
scope: This tells how something looks or is done in a very ugly, upsetting way. It does not name an ugly
  thing itself, and it is not about a brave act.
examples:
- His face was hideously scarred after the fire.
- The mask was hideously painted, with crooked eyes and a torn mouth.
