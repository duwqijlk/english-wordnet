simpleMeaning: a material made by melting and mixing two or more substances that conduct heat and electricity,
  or one such substance with another material, so that they blend together.
scope: This is not a single pure element such as iron or gold; it is a blend of two or more substances.
examples:
- Steel is a metal made by combining iron with a small amount of carbon.
- Bronze is a metal made from copper and tin.
