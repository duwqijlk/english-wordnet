simpleMeaning: Of a plant seed part, partly turned over and bent back at a right angle on its stalk.
scope: Of a plant seed part, partly turned over and bent back at a right angle on its stalk, not a seed
  part turned fully over and not a seed part standing straight on its stalk.
examples:
- The amphitropous ovule was bent back on its stalk.
- In this flower the ovule is amphitropous.
