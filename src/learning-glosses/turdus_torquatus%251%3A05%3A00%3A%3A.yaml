simpleMeaning: A thrush of Europe, often found in rocky places, whose male has dark feathers with a white
  ring round its neck
scope: A thrush of Europe found in rocky places, also called a ring blackbird, a ring ouzel and a ring
  thrush; not other European thrushes without a white ring round the neck.
examples:
- A male Turdus torquatus sang from a rock high on the fell.
- We knew the Turdus torquatus by the white ring round its neck.
