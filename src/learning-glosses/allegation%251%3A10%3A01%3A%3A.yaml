simpleMeaning: words that say a fact is true or is not true, and that you are ready to show proof for
  it
scope: This is words that say a fact is true or not true and can be backed with proof, not a claim made
  with no proof ready.
examples:
- The allegation in court was that the money had been paid, and he had papers to prove it.
- Her allegations set out facts she said she could prove.
