simpleMeaning: Prickly fruits that cling to fur and clothing grow on any of several plants of the group
  Bidens with yellow flowers.
scope: Also called beggar's-ticks, beggar-ticks, burr marigold, and sticktight, this is a Bidens plant
  with yellow flowers, set apart from other yellow-flowered plants by prickly fruits that cling to fur
  and clothing.
examples:
- Bur marigold showed yellow flowers above its prickly fruits.
- The bur marigold fruits clung to my coat.
