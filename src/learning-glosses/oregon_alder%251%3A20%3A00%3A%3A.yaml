simpleMeaning: A big tree on the Pacific coast of North America, with hard red wood that people use a
  lot to make furniture.
scope: Also called red alder and Alnus rubra; a large tree of the Pacific coast of North America with
  hard red wood, not a small tree and not a softwood tree.
examples:
- The Oregon alder by the road had hard red wood.
- They cut an Oregon alder to make a table.
