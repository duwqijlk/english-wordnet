simpleMeaning: showing strong dislike for someone and acting against them
scope: Showing strong dislike for a person and acting against them; not the sense that only shows opposition
  to a plan, not the sense that stirs up dislike in others, and not the sense about drugs or muscles that
  work against each other.
examples:
- The workers grew antagonistic toward their bosses after the pay cuts.
- He gave her an antagonistic look and refused to help.
