simpleMeaning: In genetics, during meiosis (the way sex cells are made), paired alleles (different forms
  of one gene) split apart, so each sex cell gets one from each pair
scope: In genetics, this is about forms of a gene splitting apart when sex cells are made; it is not the
  act of keeping a person or thing apart from others.
examples:
- In genetics class, we learned how segregation sends one allele from each pair into each new sex cell.
- Segregation during meiosis is why a child gets one form of a gene from each parent.
