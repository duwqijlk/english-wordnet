simpleMeaning: the front part of a guided missile, rocket, or torpedo, carrying a nuclear or other explosive
  charge, or chemicals or living agents that harm people
scope: The front part of a weapon such as a missile or rocket that carries the charge, not a store of
  valuable ore in the ground, and not an amount carried or moved at one time.
examples:
- Engineers checked the load of the missile before the test.
- The torpedo's load held the explosive charge.
