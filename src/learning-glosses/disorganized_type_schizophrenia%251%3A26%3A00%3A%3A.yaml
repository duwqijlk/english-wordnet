synsetId: 14422842-n
simpleMeaning: A form of schizophrenia with severe personality breakdown, unpredictable speech, immature
  mannerisms and strange behaviour; usually appears around puberty; the most commonly diagnosed type in
  psychiatric hospitals.
scope: Also called disorganized schizophrenia, hebephrenia or hebephrenic schizophrenia; not a separate
  diagnosis from those, and not the catatonic or paranoid forms.
examples:
- Disorganized type schizophrenia is marked by jumbled speech and behaviour that seems immature.
- The clinic's notes record several cases of disorganized type schizophrenia.
