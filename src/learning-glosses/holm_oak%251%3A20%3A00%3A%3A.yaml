simpleMeaning: 'Its wood is hard, and its green parts look much like those of the plant it is named for:
  this tree of southern Europe stays green all year.'
scope: This tree of southern Europe, which stays green all year and gives hard wood, is also called evergreen
  oak, holly-leaved oak, or holm tree.
examples:
- A holm oak stays green all year.
- The holm oak has hard wood.
