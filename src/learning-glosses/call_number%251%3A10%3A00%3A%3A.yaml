simpleMeaning: letters and numbers put on a book to show where it should sit on a shelf
scope: 'Also called a call mark and a pressmark: letters and numbers on a book that show its shelf place,
  not a phone number and not the book''s page count.'
examples:
- She copied the call number from the book so she could find it again.
- The call number on the cover told the student which shelf to check.
