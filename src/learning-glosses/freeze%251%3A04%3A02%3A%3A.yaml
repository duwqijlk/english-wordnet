simpleMeaning: the fixing of prices, pay, or other things at one set level
scope: The fixing of prices, pay, or other things at one set level, not a break in how things move forward
  and not cold weather.
examples:
- The pay freeze kept wages at the same level for a year.
- The government put a freeze on rents.
