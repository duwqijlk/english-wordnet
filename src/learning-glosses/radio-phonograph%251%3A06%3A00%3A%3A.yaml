simpleMeaning: A machine run by power that plays records and also picks up broadcasts
scope: 'Also called radio-gramophone: one machine that both plays records and picks up broadcasts, not
  a set that only picks up broadcasts and not a machine that only plays records.'
examples:
- Their radio-phonograph played old records and picked up the evening news.
- He switched on the radio-phonograph to hear a broadcast, then played a record.
