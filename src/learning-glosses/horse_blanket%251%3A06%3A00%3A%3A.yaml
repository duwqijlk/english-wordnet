simpleMeaning: A cloth put under the seat on a riding animal, as part of its gear
scope: A cloth put under the seat on a riding animal, as part of its gear, also called a saddlecloth;
  not a cloth put over the animal, and not a cloth for the rider.
examples:
- He put the horse blanket under the saddle before he rode out.
- The horse blanket kept the saddle from rubbing the animal's back.
