simpleMeaning: A form of plague that worsens fast and often kills, can pass through the air between people,
  and involves the lungs, with chills, coughing up blood, and high fever.
scope: 'Another name for plague pneumonia and pneumonic plague: the airborne form that attacks the lungs,
  not the flea-borne plague caught from rodents.'
examples:
- Pulmonic plague can pass from one person to another through the air.
- The patient with pulmonic plague had a high fever and a chill.
