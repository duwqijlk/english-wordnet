simpleMeaning: to make secret plans in a way that is dishonest and hidden from others
scope: 'Also called scheme and intrigue: this is making secret, dishonest plans, not quietly letting a
  wrong or illegal act happen and saying nothing against it.'
examples:
- They connived to steal the money from the office.
- The two men connived together to cheat the customers.
