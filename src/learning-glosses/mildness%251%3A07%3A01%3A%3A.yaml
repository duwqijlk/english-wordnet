simpleMeaning: acting in a gentle, calm and steady way, without getting angry easily
scope: 'Also called softness and gentleness: this is a gentle and calm way of acting, not kindness in
  letting someone go without punishment.'
examples:
- His mildness of manner soon calmed the crying child.
- She spoke with mildness even when the children kept shouting.
