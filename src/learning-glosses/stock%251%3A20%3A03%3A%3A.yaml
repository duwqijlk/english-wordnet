simpleMeaning: A plant or stem that a graft is attached to, particularly one raised to provide the roots
  for a grafted plant.
scope: The plant or stem that receives a graft only; not a cooking liquid, a thick perennial stem, a bright-flowered
  Old World plant, a Malcolmia ornamental, the goods a shop has on hand, a supply kept for future use,
  corporate equity, a share certificate, a person's ancestry, a breed of domesticated animals, a person's
  reputation, lumber, the handle end of a tool, the handle or butt of a gun, a white cravat, farm animals,
  a routine thing, an overused saying, a standard item regularly sold, or any verb use (keeping goods
  on hand, fitting something out, putting fish into a pond, putting livestock on land, gathering a store
  for later, supplying something with goods, putting out sprouts).
examples:
- The grower grafted the new apple variety onto a vigorous stock.
- A healthy stock gives the graft a strong root system.
