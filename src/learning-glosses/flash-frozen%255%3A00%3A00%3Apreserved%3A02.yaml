simpleMeaning: In a rush, food is made very cold and keeps its taste and the good things in it for health
scope: 'Frozen and quick-frozen are also names for this: food made very cold in a rush so that it keeps
  its taste and the good things in it for health, not food left to freeze slowly.'
examples:
- The flash-frozen peas kept their taste.
- Flash-frozen fish keeps its taste.
