simpleMeaning: having food needs that are hard to meet, and especially growing only in special man-made
  places for growing living things
scope: 'Also called fastidious: this is about a living thing with hard food needs, not about a person
  who wants very correct work or makes hard demands on others.'
examples:
- These exacting bacteria grow only in a special liquid made in the lab.
- The plant is exacting and needs a very special mix of foods to stay alive.
