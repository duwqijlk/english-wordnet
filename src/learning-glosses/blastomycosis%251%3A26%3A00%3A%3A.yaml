simpleMeaning: any of a group of infections of the skin or the wet lining inside the body, caused by a
  kind of fungus called Blastomyces
scope: An infection of the skin or the wet lining inside the body caused by a kind of fungus, not a growth
  of young cells and not an infection caused by bacteria.
examples:
- The blastomycosis left sore red marks on his skin.
- She was treated for blastomycosis after the infection spread across her cheek.
