simpleMeaning: Birth without mating where the egg's core fails to join in, so the young one is made only
  from the father's threads of inheritance.
scope: This is birth without mating in which the young one is made only from the father's threads of inheritance,
  also called androgenesis, and not ordinary birth from both a mother and a father.
examples:
- Androgeny leaves the young one with only the father's threads of inheritance.
- In androgeny, the egg's core takes no part in the joining.
