simpleMeaning: A traditional way of fighting from Japan, with no weapons. Hard, quick hits and kicks are
  aimed at parts of the other person's body that hurt when pressed.
scope: This is the Japanese way of fighting with hands and feet and no weapons, not a way of fighting
  that uses weapons.
examples:
- He learns karate and practises strong kicks.
- In karate class, she learned to hit with her hand.
