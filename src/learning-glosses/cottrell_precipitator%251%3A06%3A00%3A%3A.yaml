simpleMeaning: A device that clears dust from gases by using static electricity to pull the dust out
scope: A device that clears dust from gases with static electricity, also called electrostatic precipitator
  and precipitator, set apart from other dust-clearing devices by its use of static electricity.
examples:
- The Cottrell precipitator clears dust from the factory gases.
- A Cottrell precipitator uses static electricity to pull dust out of the air.
