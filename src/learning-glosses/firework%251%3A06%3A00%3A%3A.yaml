simpleMeaning: a thing made to burn slowly with colored flames, using material that can blow up; usually
  used in the plural for lighting up areas, sending signals and other such uses
scope: A made thing that burns slowly with colored flames, used to light up areas or send signals; not
  a bomb made to hurt people.
examples:
- Fireworks lit up the night sky in red and gold.
- A single firework rose and sent a bright signal over the sea.
