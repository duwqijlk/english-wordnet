simpleMeaning: A coarse, tall, one-season Old World tropical plant, widely farmed in the southern US and
  West Indies for long sticky green pods, a soup-and-stew base; sometimes placed in Hibiscus.
scope: The whole plant, also called okra plant, gumbo and lady's-finger; not the green pods eaten as a
  vegetable, nor the soup also called gumbo.
examples:
- Okra is widely grown in the southern United States and the West Indies.
- The okra in the field had long green pods.
