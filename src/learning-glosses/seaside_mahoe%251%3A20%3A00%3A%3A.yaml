senseId: 'seaside_mahoe%1:20:00::'
synsetId: 12209152-n
simpleMeaning: A tropical tree, usually coastal, sometimes grown as an ornamental for rounded heart-shaped
  leaves and showy yellow and purple flowers, yielding valuable pink to dark red wood and seed oil.
scope: This sense is the tropical coastal tree with yellow and purple flowers; bendy tree and portia tree
  are other names for it, and the blue mahoe of Cuba and Jamaica, with orange flowers, is a different
  tree.
examples:
- The seaside mahoe was planted as an ornamental along the coastal road.
- Its rounded heart-shaped leaves make the seaside mahoe easy to identify.
