simpleMeaning: a band of cloth, leather, or linked metal parts that holds a watch and goes around the
  wrist
scope: A band that holds a watch around the wrist, not a band worn around the wrist only to look pretty.
examples:
- The metal bracelet of his watch broke and the watch fell off.
- She picked a leather bracelet for her new watch.
