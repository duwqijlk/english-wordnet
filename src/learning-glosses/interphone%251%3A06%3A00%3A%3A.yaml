simpleMeaning: a set of handsets in different rooms of one building or ship or other such place, joined
  so people in the rooms can talk to each other
scope: Handsets in different rooms of one building or ship, joined so people in the rooms can talk to
  each other; not a public telephone and not a radio.
examples:
- Use the interphone to call the kitchen.
- The nurse spoke to the ward through the interphone.
