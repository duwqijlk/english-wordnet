simpleMeaning: dough pressed flat and spread with sweet spice and sugar, sometimes with dried grapes,
  then cut into rounds and baked
scope: Dough pressed flat and spread with sweet spice and sugar, cut into rounds and baked; cinnamon bun
  and cinnamon snail are other names for this sense, not a plain bread roll and not a cake.
examples:
- He bought a cinnamon roll with his coffee.
- The cinnamon rolls rose in the warm kitchen before baking.
