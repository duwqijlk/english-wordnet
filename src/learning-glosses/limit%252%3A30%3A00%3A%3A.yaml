simpleMeaning: It means to hold someone or something inside fixed bounds and allow no more than that.
scope: This is about confining someone to a set allowance, not about setting the overall cap on an amount
  or on who may enter.
examples:
- The coach limits each player to twenty minutes on the field.
- I limit myself to one cup of coffee a day.
