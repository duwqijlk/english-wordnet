simpleMeaning: Red and purplish blue look the same to an eye that is less quick to catch long waves of
  light, a kind of colour blindness.
scope: 'Also called red-blindness: a kind of colour blindness in which the eye is less quick to catch
  long waves of light, so red and purplish blue look the same.'
examples:
- His protanopia made red and purplish blue look the same to him.
- A test for protanopia asks which of two patches is red.
