simpleMeaning: the state of not getting oxygen (the gas in air that the body needs), for example when
  breathing is stopped
scope: 'Also called suffocation: the state of not getting the gas in air that the body needs, not just
  being short of breath for a short time after running.'
examples:
- The doctors said asphyxiation was the cause of death after smoke filled the room.
- Asphyxiation can happen when something stops a person from breathing.
