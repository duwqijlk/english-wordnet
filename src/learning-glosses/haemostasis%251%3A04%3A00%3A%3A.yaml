simpleMeaning: Blood is kept from flowing during an operation when a vessel is pinched shut with a tool
scope: 'Also called haemostasia, hemostasia and hemostasis: stopping the flow of blood during an operation,
  not a bandage on a small cut and not the blood clotting on its own.'
examples:
- Haemostasis was needed before the surgeon could close the cut.
- The nurse helped with haemostasis by holding the vessel shut.
