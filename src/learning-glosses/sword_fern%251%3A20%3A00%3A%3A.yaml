simpleMeaning: Leaves mostly long, narrow, and pointed mark one of many kinds of warm-land plant, one
  of them the parent of a later kind.
scope: Among the plants of warm lands, this one is set apart by leaves mostly long, narrow, and pointed,
  one of them the parent of a later kind.
examples:
- The sword fern in the pot had long, narrow leaves.
- Gardeners grow sword fern for its pointed leaves.
