simpleMeaning: To change something so it works as well as it can, using the least room, time, or money
scope: 'Also called optimize: to make something work at its best, not to make it bigger and not to fix
  what is broken.'
examples:
- She had to optimise the program so it used less memory.
- We optimise the code to run faster and cost less.
