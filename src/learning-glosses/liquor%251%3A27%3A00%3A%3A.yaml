simpleMeaning: a liquid used in or made by work in a factory, with another thing dissolved in it or mixed
  through it
scope: This is a liquid from factory work, not the strong alcoholic drink and not the liquid left from
  cooking meat or vegetables.
examples:
- The factory must clean its waste liquors before they go into the river.
- Workers stored the liquor from the paper-making process in large tanks.
