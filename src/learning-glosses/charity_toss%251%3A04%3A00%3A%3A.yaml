simpleMeaning: a basketball try from the foul line that no one blocks, given as a penalty when the other
  team breaks a rule
scope: A basketball try from the foul line that no one blocks; charity shot, charity throw, foul shot,
  free throw and penalty free throw are other names for this sense, not a shot taken during open play.
examples:
- The charity toss put them ahead by one.
- He missed the charity toss after the foul.
