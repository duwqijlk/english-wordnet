simpleMeaning: With leaves in rings round the stem, this North American herb bears bunches of flowers
  at the tips, spotted with purple.
scope: Also called marsh milkweed and trumpet weed, this North American herb stands apart from other herbs
  by its ringed leaves and purple-spotted flower bunches.
examples:
- The purple boneset bore bunches of flowers spotted with purple.
- We saw purple boneset with leaves in rings round the stem.
