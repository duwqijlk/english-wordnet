simpleMeaning: a made-up liquid that old alchemists hoped would dissolve anything
scope: A made-up liquid that old alchemists hoped would dissolve anything; alkahest is another name for
  this, not water and not a real liquid that dissolves metals.
examples:
- The alchemists searched for alcahest, a liquid that could dissolve anything.
- Alcahest was never found.
