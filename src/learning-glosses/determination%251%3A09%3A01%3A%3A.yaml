simpleMeaning: the act of deciding or having power over how something ends or what it is like
scope: This is deciding how something ends or what it is like. It is not finding out facts about something
  by study, and not a person's strong will to reach a goal.
examples:
- The determination of the winner was left to the judges.
- The final determination of the price will be made by the seller.
