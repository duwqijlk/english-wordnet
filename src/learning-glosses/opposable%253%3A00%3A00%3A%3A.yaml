simpleMeaning: able to be put across from another thing, so that the two face each other
scope: Able to be put facing something else, as a thumb can face the other fingers; not fixed in one place
  with no way to move across.
examples:
- The human thumb is opposable, so it can touch each fingertip.
- An opposable thumb helps monkeys hold branches tightly.
