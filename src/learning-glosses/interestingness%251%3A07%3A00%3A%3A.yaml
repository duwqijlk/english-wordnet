simpleMeaning: how much a thing draws a person in and keeps their mind on it, because it is new or stirs
  them or the like
scope: The power to catch and hold a person's attention, also called interest; not mere beauty and not
  the feeling of excitement itself.
examples:
- The interestingness of the story kept the children quiet.
- Her talk had an interestingness that held the whole room.
