simpleMeaning: a set of bells made to play certain notes, hit with a hammer, and played in an orchestra
scope: This is the set of bells itself, also called bell and gong, not just the sound the bells make.
examples:
- He struck the chimes with a small hammer during the song.
- The chimes are a set of metal bells at the back of the orchestra.
