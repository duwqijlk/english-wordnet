simpleMeaning: Men in Turkey, Iran, and the Caucasus wear this black head covering with a high crown,
  usually made of felt or sheepskin.
scope: Also called calpack and kalpac, this names the black head covering with a high crown worn by men
  in Turkey, Iran, and the Caucasus.
examples:
- He put on his calpac before leaving the house.
- The calpac sat high on his head.
