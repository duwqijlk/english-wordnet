simpleMeaning: A written roll put out by examiners that puts students in groups by the grade of honours
  they won in their degree tests.
scope: A roll from examiners that groups students by the grade of honours they won, also called honours
  list; not a list of who was present in class and not the exam paper itself.
examples:
- Her name stood at the top of the class list for first-class honours.
- The class list showed who had won first-class honours.
