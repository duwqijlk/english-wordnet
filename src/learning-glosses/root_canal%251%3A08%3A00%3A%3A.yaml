simpleMeaning: Through the base of a tooth runs this narrow way, letting its nerve and blood tubes pass
  into the soft centre
scope: It is the narrow way inside the base of a tooth, not the tooth itself.
examples:
- The dentist filled the root canal after cleaning it.
- Pain in the root canal made chewing hard.
