simpleMeaning: Of the air round a low-pressure center, or much like it.
scope: This sense is of the air round a low-pressure center, or much like it, unlike the sense for what
  is of, or to do with, or like, a fierce tropical storm.
examples:
- The winds were cyclonic, circling a low-pressure center.
- The storm was cyclonic, round a low-pressure center.
