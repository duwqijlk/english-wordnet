simpleMeaning: a very high level of skill or quality in which nothing is wrong or missing.
scope: This is not the surface texture, and it is not the end of a race; it is the high quality of work
  or manner.
examples:
- The pianist played with a finish that impressed the judges.
- Every detail of the room showed the finish of skilled craftsmen.
