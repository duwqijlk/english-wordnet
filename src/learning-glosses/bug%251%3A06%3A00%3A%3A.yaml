simpleMeaning: A small listening device put out of sight so people can hear what is said without being
  noticed
scope: A hidden device for listening in secret, not an insect and not the act of tapping a phone line.
examples:
- They found a bug hidden under the desk.
- The spy planted a bug in the office to hear the talks.
