simpleMeaning: Using one ear only, rather than both ears.
scope: Using one ear only, rather than both ears; not with both ears at once, and not with the sound split
  between the two ears.
examples:
- The sounds were played monaurally, to the left ear only.
- She listened monaurally while the other ear was blocked.
