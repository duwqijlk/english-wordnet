simpleMeaning: a person with many followers on social media who gets people interested in current issues
  or in goods for sale
scope: A person with many followers on social media who gets people interested in current issues or in
  goods for sale; not a person with power in a company, and not a famous actor.
examples:
- The influencer promoted the new phone to her followers.
- Brands pay influencers to show their goods.
