simpleMeaning: The broad bone at the front of the skull that also forms the upper rim of the eye sockets.
scope: The bone itself (also called the frontal bone or os frontale), not the skin and brow of the face
  above the eyes.
examples:
- The scan showed a fine fracture line in the forehead bone.
- The surgeon removed a small piece of forehead bone to reach the brain.
