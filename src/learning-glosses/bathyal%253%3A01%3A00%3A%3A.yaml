simpleMeaning: From 200 to 2000 metres down, the sea floor slopes away from the shelf — and this word
  is said of those depths.
scope: This word is used of sea depths from 200 to 2000 metres down, where the sea floor slopes down from
  the shelf.
examples:
- The bathyal depths lie between 200 and 2000 metres down.
- The bathyal depths start at 200 metres down and end at 2000.
