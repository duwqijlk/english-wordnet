synsetId: 13371458-n
simpleMeaning: In law, a promise made before a court to do what the law asks, with a sum of money lost
  if one fails to do it.
scope: In law, for a security given to a court, with money lost if the promise is broken.
examples:
- He was freed on recognizance until the trial.
- The court set her recognizance at five hundred pounds.
