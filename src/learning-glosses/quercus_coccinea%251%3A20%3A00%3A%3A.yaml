simpleMeaning: A medium-large winter-bare tree with a thick trunk, from the eastern United States and
  southern Canada; its wood is close-grained and its deep seven-lobed leaves turn scarlet in autumn.
scope: A medium-large oak of the eastern United States and southern Canada with scarlet autumn leaves;
  also called scarlet oak.
examples:
- Quercus coccinea turns scarlet in autumn.
