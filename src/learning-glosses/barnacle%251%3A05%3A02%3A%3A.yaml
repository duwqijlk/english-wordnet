simpleMeaning: a goose from Europe, smaller than the brant (a similar small goose), that has its young
  in the far north
scope: This is the goose from Europe that has its young in the far north, not the small sea animal with
  a hard shell that sticks to rocks and ships.
examples:
- The barnacle goose is smaller than the brant and breeds in the far north.
- In summer, barnacle geese nest in the far north of Europe.
