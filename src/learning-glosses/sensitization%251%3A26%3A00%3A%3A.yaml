simpleMeaning: the state of reacting strongly, for example to a substance that sets off a reaction in
  the body
scope: The state of reacting strongly, for example to a substance that sets off a reaction in the body;
  sensitisation is another name for this sense; not a course of injections that makes the body react and
  not a growing response to events in the mind.
examples:
- Sensitization to the drug made later doses risky.
- After sensitization, even a small amount set off a reaction.
