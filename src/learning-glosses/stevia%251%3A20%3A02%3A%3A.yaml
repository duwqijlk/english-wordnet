simpleMeaning: any plant in the group called Piqueria or in a group closely related to it
scope: Any plant in the Piqueria group or a group closely related to it, not the other stevia sense with
  sticky leaves and white or purplish flowers from Central and South America.
examples:
- The stevia in the garden belongs to the Piqueria group.
- Botanists put this stevia in the group closely related to Piqueria.
