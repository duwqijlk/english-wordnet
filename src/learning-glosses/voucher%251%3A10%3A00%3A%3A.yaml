simpleMeaning: a paper that can be taken off, given to another person, and handed in to get something
  when it is needed
scope: 'Also called a coupon: a paper you hand in to get something, not a paper that only shows money
  was spent and not a person who says something is true.'
examples:
- She tore off a voucher and handed it in for a free meal.
- He kept the voucher until he needed to use it for food.
