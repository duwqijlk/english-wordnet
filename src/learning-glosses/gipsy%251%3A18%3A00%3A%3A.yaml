simpleMeaning: a member of a dark-skinned, dark-haired people who speak Romany and traditionally live
  by seasonal work and telling fortunes, thought to come from northern India and now on all continents
scope: Also called Gypsy, Bohemian, Roma, Romani, Romany, or Rommany; a member of the Romany-speaking
  people, not a member of any other people.
examples:
- The Gipsy family camped near the fair.
- A Gipsy told her fortune at the market.
