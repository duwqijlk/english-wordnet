simpleMeaning: A large bat that eats meat, from the lands of Europe, Asia and Africa, with very big ears.
scope: Also called big-eared bat, this is a bat with very big ears that eats meat, not a small bat and
  not a fruit-eating bat.
examples:
- A Megaderma lyra hung in the cave, its big ears wide open.
- We saw a Megaderma lyra fly out of the dark at dusk.
