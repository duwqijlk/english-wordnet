senseId: 'slapstick%1:06:00::'
synsetId: 04241066-n
simpleMeaning: A noise-making device of two flat pieces joined by a hinge, used by an actor to make a
  loud noise when striking someone without hurting them.
scope: A hinged device of two flat pieces that makes a loud noise on stage, not the loud, rough comedy
  itself.
examples:
- The actor struck his partner with the slapstick, and the crowd laughed.
- A slapstick makes a loud crack without hurting anyone.
