simpleMeaning: the layer of foam that collects at the top when a fizzy liquid is poured into a container
scope: This is not the body part above the neck and not a leader; it is the foam on a poured drink.
examples:
- The bartender poured the beer slowly to keep a thick head on it.
- A white head formed on the cola as soon as she opened the bottle.
