simpleMeaning: A unit of length used in sea and air travel, exactly 1,852 meters, once based on the distance
  covered by one sixtieth of a degree of latitude.
scope: A unit of length used in sea and air travel, exactly 1,852 meters, also called naut mi, mile, mi,
  air mile and international nautical mile; not a land mile and not a former British sea mile.
examples:
- The ship was ten nautical miles from the port.
- One nautical mile is exactly 1,852 meters.
