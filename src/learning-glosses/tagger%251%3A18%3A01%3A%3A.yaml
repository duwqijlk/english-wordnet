simpleMeaning: a person who adds labels to a text to show the grammar job of each word or group of words
scope: A person who labels the grammar parts of a text, not the computer program that does the same job.
examples:
- Ms Carter, the tagger on our team, marked each noun and verb in the passage.
- Our tagger, a young man who knows grammar well, checks the labels before the book is printed.
