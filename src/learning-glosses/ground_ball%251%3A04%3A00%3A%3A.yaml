simpleMeaning: A hit in baseball that rolls or bounces along the ground
scope: Grounder and groundball are other names for this sense; in baseball it is a hit that stays low,
  not a hit that flies high through the air.
examples:
- The batter hit a ground ball to the shortstop.
- He fielded the ground ball and threw to first base.
