simpleMeaning: a door-like flap inside a hollow part of the body, such as the heart, that lets liquid
  pass through in one direction only
scope: This is a flap inside the body that lets fluid move one way only, not a shell half and not a tap
  that controls flow.
examples:
- The valve in her heart closed after each beat.
- A weak valve can let blood flow back the wrong way.
