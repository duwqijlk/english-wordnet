simpleMeaning: So a rope cannot slip free after it has gone through a hole or a pulley, a knot shaped
  like the number 8 is tied in it.
scope: This knot, also called figure of eight, is shaped like the number 8 and stops a rope from slipping
  free.
examples:
- Tie a figure eight in the rope.
- A figure eight stopped the rope from slipping through the hole.
