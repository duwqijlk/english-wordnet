simpleMeaning: The parts of this salad plant stay loose and curled and do not pack into a tight head
scope: Also called loose-leaf lettuce, this is a salad plant whose leaves stay loose and curled and do
  not pack into a tight head, not the kind known for the ring its leaves make.
examples:
- She grew leaf lettuce in the garden and cut the loose leaves for salad.
- The leaf lettuce in the market had loose, wavy leaves and no tight head.
