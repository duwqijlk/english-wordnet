senseId: 'gap%1:10:00::'
synsetId: 07198513-n
simpleMeaning: a difference between what two people think, or between two situations, especially a bad
  difference
scope: A difference between views or situations, especially a bad one; not a stop in something that should
  keep going and not a low place between mountain tops.
examples:
- There is a big gap between what the workers want and what the boss will pay.
- The gap in their views on schools made it hard for them to agree.
