simpleMeaning: a small syringe (a tube that pushes liquid out), with ends that come off, used to wash
  the vagina or put liquid into the back passage to clean it
scope: This tool is also called a douche bag; not the act of washing a body part with water, and not the
  verb that means doing that washing.
examples:
- She bought a douche at the drug store for medical cleaning.
- The nurse showed her how to fill the douche with warm water.
