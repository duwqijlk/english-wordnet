simpleMeaning: the habit of acting in a stupid or hasty way, without thinking first
scope: Also called folly; a habit of acting stupidly or rashly, not just the quality of being rash and
  foolish.
examples:
- His foolishness in spending all his money left him with nothing.
- Her foolishness showed when she drove too fast in the rain.
