simpleMeaning: to put a mark on mail to show the date and time it was sent
scope: This is the act of marking mail, also called frank; it is not the mark itself that is put on the
  letter.
examples:
- The clerk postmarked the letter before noon.
- All the parcels were postmarked on Monday.
