simpleMeaning: a motor, most often electric, that moves or turns by one small set amount at a time
scope: This is a motor that moves in small, fixed amounts, not a horse trained to lift its feet high as
  it walks.
examples:
- A stepper motor turns the wheel in small, exact movements.
- The printer uses a stepper to move the paper a tiny amount at a time.
