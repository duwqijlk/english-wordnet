simpleMeaning: A mix of two powders that take in wetness and gas, one from a metal that flares in water
  and the other from the stone that turns to mortar.
scope: This mix of two powders is the one that takes in wetness and gas.
examples:
- The soda lime took in the wetness from the air.
- The soda lime took in gas until it could take in no more.
