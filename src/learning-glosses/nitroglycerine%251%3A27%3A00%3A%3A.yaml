simpleMeaning: 'A poisonous, heavy, yellow, oily liquid that can explode, made by treating glycerol with
  nitrogen compounds; used in making explosives and, medically, to widen blood vessels. Trade names: Nitrospan,
  Nitrostat.'
scope: Nitroglycerin and glyceryl trinitrate are other names for this same substance, not a different
  explosive or a different medicine that widens blood vessels.
examples:
- Nitroglycerine is a heavy, yellow liquid that can explode.
- The nurse gave him nitroglycerine to widen his blood vessels.
