simpleMeaning: a lab-made drug given to heroin users to help them stop and stay off the drug; it dulls
  pain like morphine and is less likely to hook them
scope: Also called fixer, methadone, dolophine hydrochloride, methadon, and methadone hydrochloride; not
  morphine itself and not heroin itself.
examples:
- The clinic gave him synthetic heroin to help him stop using the drug.
- Doctors use synthetic heroin to keep patients off heroin.
