simpleMeaning: An English line of kings and queens that began with Henry VII; its rulers held the throne
  from Henry VII to Elizabeth I, from 1485 to 1603
scope: 'Also called Tudor: an English line of kings and queens that began with Henry VII, ruling from
  1485 to 1603, not a family of nobles and not a later royal line.'
examples:
- The House of Tudor ruled England from 1485 to 1603.
- Henry VII began the House of Tudor.
