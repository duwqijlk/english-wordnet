simpleMeaning: A medicine taken by mouth or by needle that slows the flow of calcium into heart and blood-vessel
  cells, used for high blood pressure, heart failure, chest pain, or migraine.
scope: 'Also called verapamil or Isoptin: a medicine that blocks calcium in heart and blood-vessel cells,
  taken by mouth or by needle for high blood pressure, heart failure, chest pain, or migraine.'
examples:
- Her doctor gave her Calan for her high blood pressure.
- Calan helped ease his chest pain.
