simpleMeaning: A sewing tool that puts two threads, one above and one below, through the same hole in
  the cloth and twists them together there
scope: In this sewing tool, two threads pass through the same hole in the cloth, one above and one below,
  and are twisted together there.
examples:
- The lockstitch machine twisted the two threads together in the hole.
- The lockstitch machine put one thread above the cloth and one below it.
