senseId: 'suture%1:06:00::'
synsetId: 04374292-n
simpleMeaning: thread made from animal gut, silk, or wire, used by doctors who do operations to join soft
  parts of the body together
scope: The thread a doctor uses to join cut body parts, not the fixed joint between bones in the head
  and not the act of joining with thread.
examples:
- The doctor used a strong suture to close the deep cut.
- These sutures are made of silk.
