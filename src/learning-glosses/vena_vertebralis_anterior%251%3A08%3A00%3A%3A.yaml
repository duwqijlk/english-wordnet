simpleMeaning: The main vein of the neck takes blood from a tube that runs beside the neck artery that
  climbs upward.
scope: Also called the anterior vertebral vein, this is the tube beside the neck artery that climbs upward.
examples:
- Blood from the vena vertebralis anterior flows into the main vein of the neck.
- The vena vertebralis anterior lies beside the artery that climbs up the neck.
