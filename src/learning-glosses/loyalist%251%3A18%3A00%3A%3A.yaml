simpleMeaning: a person who stays true to the side they support, especially when people rise up against
  a ruler
scope: Also called stalwart, this is a person who stays with their side especially in a revolt, not a
  person who rises up against it or changes sides.
examples:
- The loyalists kept the town for the king during the revolt.
- As a loyalist, she refused to join the rebels.
