simpleMeaning: a kind of beet plant with no swollen root, grown as a vegetable for its leaves and stems
  that people can eat
scope: Also called chard plant, leaf beet, and spinach beet. This is the whole plant grown for food, not
  just its leaves and stems as a food on their own.
examples:
- She planted chard in the garden this spring.
- We grow chard for its green leaves and thick stems.
