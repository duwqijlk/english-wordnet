scope: This fleshy plant lives year after year and bears small single blooms where leaf meets stem or
  at the tips.
examples:
- The seabeach sandwort bears small single blooms where leaf meets stem or at the tips.
- The seabeach sandwort is a fleshy plant that lives year after year.
