simpleMeaning: An odd but funny man of many years, spoken of with love
scope: A kind word for an odd but funny man of many years, also called codger; not a rude name for a man
  and not a young funny man.
examples:
- The old codger told us the same story every Sunday.
- Everyone in the village loved the old codger next door.
