simpleMeaning: a fierce hot wind full of sand that blows over the deserts of Arabia and North Africa
scope: A fierce hot wind full of sand that blows over the deserts of Arabia and North Africa, also called
  samiel or simoom; not a cool wind from the sea and not a hot wind of the American deserts.
examples:
- A simoon swept sand across the camp.
- The simoon blew hot and fierce over the desert.
