simpleMeaning: One of these units of force is the push that speeds a one-gram mass up by one centimetre
  each second, every second.
scope: It measures a push or pull by how fast it speeds a one-gram mass up.
examples:
- The push was only a few dynes, so the mass barely moved.
- Old books gave force in dynes.
