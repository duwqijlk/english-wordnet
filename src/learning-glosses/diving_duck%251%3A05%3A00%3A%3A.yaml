simpleMeaning: a water bird that goes under the water to find food, found most of all in bays and in the
  wide mouths of rivers
scope: A water bird that dives for food, most of all in bays and river mouths, and not a bird that feeds
  on the surface or one that lives far from water.
examples:
- A diving duck vanished under the water and came up with a small fish.
- We watched diving ducks in the bay as they went down to feed.
