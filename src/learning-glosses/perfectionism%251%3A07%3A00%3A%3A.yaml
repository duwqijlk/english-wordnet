simpleMeaning: A person's way of feeling that anything less than the best in every way cannot be accepted
scope: This is a way of thinking that will not accept anything less than the best; it is not one single
  act of doing work well or carefully.
examples:
- His perfectionism made him check every page again and again.
- Perfectionism can make it hard to finish a piece of work.
