simpleMeaning: spreading harmful matter into the area around it, especially radioactive matter, which
  gives off harmful rays
scope: 'Also called dirty in this sense: spreading harmful matter around, above all radioactive matter;
  not just unclean in the ordinary way, with dirt on it.'
examples:
- Contaminating fumes from the old plant spread over the town.
- A contaminating spill of radioactive waste closed the road for weeks.
