simpleMeaning: too little iron in the blood of young women, making them weak, with troubled monthly bleeding
  and greenish skin
scope: Too little iron in the blood of young women, with weakness, troubled monthly bleeding and greenish
  skin, also called greensickness; not a lack of iron in older people and not a skin disease.
examples:
- Chlorosis left the young woman weak and pale.
- The doctor said her chlorosis came from too little iron in her blood.
