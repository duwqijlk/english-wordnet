simpleMeaning: where two boards in a wall do not meet, the thin space left between them
scope: A thin gap between boards, not an offensive word for a person and not the act of filling or making
  such gaps.
examples:
- Light came through a chink in the wall.
- He filled the chink between the planks with putty.
