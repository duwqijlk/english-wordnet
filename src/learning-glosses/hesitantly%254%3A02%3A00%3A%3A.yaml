senseId: 'hesitantly%4:02:00::'
synsetId: 00147156-r
simpleMeaning: In a way that shows you are unsure, pausing before you act or speak.
scope: Doing a thing slowly and with doubt, pausing before you act, not doing it at once with no doubt.
examples:
- He accepted hesitantly, after a long pause.
- She nodded hesitantly when they asked her to speak.
