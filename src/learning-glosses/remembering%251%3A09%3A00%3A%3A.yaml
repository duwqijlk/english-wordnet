simpleMeaning: the way the mind holds past things and brings them back
scope: The way the mind brings back past things, also called memory; not forgetting and not a single thing
  one brings to mind.
examples:
- Remembering his father always made him smile.
- Her remembering of the old house was clear after all these years.
