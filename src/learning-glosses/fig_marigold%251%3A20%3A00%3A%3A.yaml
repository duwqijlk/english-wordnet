simpleMeaning: Grown for showy pink or white flowers, any one of several South African plants, all of
  one group.
scope: Also called pebble plant, this South African plant is one of several kinds in one group, grown
  for showy pink or white flowers.
examples:
- The fig marigold opened its pink flowers in the sun.
- She planted a fig marigold beside the path for its white flowers.
