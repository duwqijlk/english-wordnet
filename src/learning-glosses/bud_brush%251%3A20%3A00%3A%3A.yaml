simpleMeaning: a plant that lives for years and gives sheep good food in the United States
scope: 'Also called bud sagebrush: a plant that lives for years and gives sheep good food in the United
  States, not a plant grown for its flowers and not a bush cut for firewood.'
examples:
- Bud brush grows well on the dry range.
- The sheep fed on bud brush through the winter.
