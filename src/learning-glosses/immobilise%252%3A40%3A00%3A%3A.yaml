senseId: 'immobilise%2:40:00::'
synsetId: 02219646-v
simpleMeaning: To keep money back as a store, or take it out of use, said of capital
scope: 'Another name for this sense is immobilize: to hold money back as a reserve or take it out of use,
  said of capital, not the sense of forbidding money from being changed or used.'
examples:
- The bank had to immobilise part of its capital as a reserve.
- They immobilised the funds, taking them out of circulation.
