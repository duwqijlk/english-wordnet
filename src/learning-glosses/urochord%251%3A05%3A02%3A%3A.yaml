simpleMeaning: A stiff cord down its back stands out in the young of a simple sea animal with a body like
  a sac, in one piece.
scope: Also called tunicate and urochordate, it is a simple sea animal whose body is like a sac, in one
  piece, with a stiff cord down its back that stands out in its young.
examples:
- The urochord lives in the sea with a body like a sac.
- In its young, the urochord has a stiff cord down its back.
