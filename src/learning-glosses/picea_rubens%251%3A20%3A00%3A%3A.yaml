simpleMeaning: A spruce of middling size from eastern North America, the main spruce cut for wood there,
  and a source of wood for paper.
scope: Also called eastern spruce, red spruce, and yellow spruce; a spruce of eastern North America, set
  apart from other spruces of the east by its use as the main wood for lumber and paper.
examples:
- Picea rubens grows in the mountains of the east.
- Much of the paper in the mill came from Picea rubens.
