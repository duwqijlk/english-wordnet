simpleMeaning: A sign of deep feeling made from a fancy tied loop, shaped in a set pattern for show
scope: Also called a lover's knot or a lovers' knot, this is a fancy tied loop used as a sign of love,
  not a knot that holds things fast and not a bow.
examples:
- She wore a love knot on a chain around her neck.
- The card was sealed with a love knot in red ribbon.
