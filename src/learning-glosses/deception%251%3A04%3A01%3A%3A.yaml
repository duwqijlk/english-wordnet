simpleMeaning: An act that looks impossible to watchers who do not know the secret, so they think it is
  real magic.
scope: Also called magic, trick, or illusion, this is an act that looks impossible, not a lie told in
  words.
examples:
- The magician's best deception made the coin vanish before our eyes.
- Her deception with the cards left the crowd gasping.
