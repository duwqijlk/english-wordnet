simpleMeaning: to tell someone about something before it happens, so that they know about it early
scope: This means telling someone about something before it happens, so that they know about it early;
  it is not telling them only after it has happened.
examples:
- I forewarned him about the trouble he would face if he went there.
- The sign forewarns drivers about ice on the road ahead.
