simpleMeaning: The hot-tasting underground stem of the common spice plant, used fresh to give food flavour,
  most of all in Asian cooking
scope: This is the hot-tasting underground stem of the common spice plant, used fresh to give food flavour,
  most of all in Asian cooking; ginger is another name for this sense, not the dried powder and not any
  other spice.
examples:
- She grated gingerroot into the stir-fry.
- Fresh gingerroot smells sharp and warm.
