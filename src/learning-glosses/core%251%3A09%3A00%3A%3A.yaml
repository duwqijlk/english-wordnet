simpleMeaning: the part of an idea or experience that matters most and cannot be left out
scope: This sense is the part of an idea or experience that matters most, such as the main point of an
  argument; it is not the theme of a speech or book, and not a small essential group of people.
examples:
- The core of her argument is that the plan is too expensive.
- At the core of the story is a simple question about trust.
