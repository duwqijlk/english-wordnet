simpleMeaning: letting no brightness through
scope: Letting no brightness through, with lightproof as another name for this sense; not a cover that
  lets some brightness in, and not a cover that is merely dark.
examples:
- The film was kept in light-tight boxes.
- A light-tight lid kept the darkroom safe from light.
