simpleMeaning: a fall in how strong a disease is, or in how bad its signs are
scope: This sense is a fall in how strong a disease is or in how bad its signs are, not the act of a priest
  forgiving a person for wrongdoing.
examples:
- His cancer is in remission, and his pain is much less now.
- During remission, her fever went down and she felt better.
