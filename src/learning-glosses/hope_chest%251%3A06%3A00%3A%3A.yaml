simpleMeaning: While waiting to be married, you put your clothes and things for the home away in this
  box.
scope: It is also called a wedding chest, the box where clothes and things for the home are put by while
  waiting to be married.
examples:
- She kept her best sheets in the hope chest for her wedding day.
- Her grandmother gave her a hope chest to fill before she married.
