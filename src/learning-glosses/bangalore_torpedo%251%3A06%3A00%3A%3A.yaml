simpleMeaning: Hidden bombs in the ground can be set off with this metal pipe, filled with stuff that
  blows up, which also cuts a way through wire with sharp points.
scope: This metal pipe, filled with stuff that blows up, is used on land to set off hidden bombs or to
  cut a way through sharp wire, not a torpedo fired under water.
examples:
- A bangalore torpedo was laid across the wire to clear a path.
- The bangalore torpedo cleared a path through the wire.
