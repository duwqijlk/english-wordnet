simpleMeaning: An oral drug, trade name Arava, that works against TNF, a body chemical; it can slow the
  progression of rheumatoid arthritis by slowing white blood cell multiplication, reducing joint-lining
  inflammation.
scope: This drug itself; Arava is another name for it, not the whole anti-TNF class and not another arthritis
  medicine such as methotrexate.
examples:
- Leflunomide can slow the progression of rheumatoid arthritis.
- Leflunomide is sold under the trade name Arava.
