simpleMeaning: A North American plant living one year, with many stems and single dark golden-yellow flowers
  where leaves join the stem, like the foxglove; sometimes put in the genus Gerardia.
scope: 'Also called false foxglove and Gerardia pedicularia: a North American plant living one year with
  single dark golden-yellow flowers like the foxglove, not a tall shrub and not a true foxglove.'
examples:
- Aureolaria pedicularia stood alone in the dry field, its dark golden-yellow flowers open.
- We found Aureolaria pedicularia growing beside the path in the woods.
