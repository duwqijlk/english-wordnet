simpleMeaning: a small bag or pouch, most of all the smaller of two small bag-like parts in the inner
  ear
scope: 'Also called a sacculus: a small bag or pouch in the inner ear, not a large pouch in the body and
  not the larger of the two ear chambers.'
examples:
- The doctor pointed to the saccule in the diagram of the inner ear.
- A saccule is the smaller of the two chambers in the inner ear.
