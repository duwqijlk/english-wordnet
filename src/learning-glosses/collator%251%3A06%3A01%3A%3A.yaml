simpleMeaning: A machine that picks out, joins and pairs up stacks of cards with holes punched in them.
scope: This is a machine that picks out, joins and pairs up stacks of cards with holes punched in them;
  not a machine that prints cards and not a hand sorter.
examples:
- The collator matched the two decks of punch cards.
- She fed the cards into the collator to merge them.
