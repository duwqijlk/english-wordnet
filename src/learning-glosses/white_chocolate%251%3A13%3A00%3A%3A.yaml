simpleMeaning: A sweet food made from cocoa butter, milk solids, sugar and vanilla, used in candy bars,
  baking and coatings; it contains no chocolate liquor and so is not true chocolate.
scope: A sweet food made from cocoa butter, milk solids, sugar and vanilla. It is not true chocolate,
  unlike milk or dark chocolate, because it contains no chocolate liquor.
examples:
- She melted white chocolate and drizzled it over the strawberries.
- The cookies are dipped in white chocolate and topped with pistachio.
