simpleMeaning: In physics, the idea that the bright rays we see move as a flow of tiny bits
scope: This is the idea that the bright rays we see move as a flow of tiny bits, also called corpuscular
  theory; not the idea that those rays move as waves.
examples:
- The corpuscular theory of light says the rays move as tiny bits.
- In class we read about the corpuscular theory of light and its rival wave idea.
