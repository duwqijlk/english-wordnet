simpleMeaning: to make a short, sharp sound, as some speakers do with the tongue
scope: A person makes a short, sharp sound with the tongue when speaking; not a clock or a shoe making
  a ticking sound, and not pressing a mouse button.
examples:
- In Xhosa, people click with their tongues when they speak.
- She clicked her tongue to make the sound.
