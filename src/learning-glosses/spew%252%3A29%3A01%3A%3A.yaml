simpleMeaning: to force out spit or thick mucus from the mouth
scope: To force spit or thick mucus out of the mouth — spit is another name for this sense — not throwing
  up food from the stomach, and not pouring out in large amounts.
examples:
- He spewed phlegm onto the ground after coughing.
- The sick man spewed sputum into a cup.
