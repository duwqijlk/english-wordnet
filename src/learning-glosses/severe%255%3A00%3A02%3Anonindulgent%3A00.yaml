simpleMeaning: very strict in the way a person is judged or punished, with no soft treatment and no change
  of mind
scope: A very strict way of judging or punishing someone, not a threat of great harm and not a plain and
  simple style.
examples:
- The severe teacher gave no extra time, even when pupils asked for it.
- The judge took a severe view of the crime and gave a long sentence.
