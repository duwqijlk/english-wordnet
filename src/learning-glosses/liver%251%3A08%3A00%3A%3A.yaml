simpleMeaning: A large reddish-brown organ in the belly's upper right that makes bile, processes protein,
  fat and carbohydrate, helps blood clot, stores vitamin A, removes poisons and worn-out red blood cells.
scope: This is the body organ, not animal liver sold as food and not a person who lives somewhere.
examples:
- The scan showed a small shadow on her liver.
- Years of heavy drinking had damaged his liver.
