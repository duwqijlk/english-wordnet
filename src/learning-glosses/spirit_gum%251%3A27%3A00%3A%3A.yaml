simpleMeaning: a sticky liquid made of a plant resin and ether, used to hold fake hair on the skin
scope: A sticky liquid that holds fake hair on the skin; not a glue for paper or wood, and not a kind
  of drink.
examples:
- The actor used spirit gum to fix his false beard.
- She put on spirit gum before the wig went on.
