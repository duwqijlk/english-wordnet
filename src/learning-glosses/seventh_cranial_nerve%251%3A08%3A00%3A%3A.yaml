simpleMeaning: a cord in the head that carries signals to the muscles of the face
scope: Also called facial, the facial nerve, and nervus facialis; the cord in the head that works the
  face muscles, not a nerve for sight and not one for hearing.
examples:
- The seventh cranial nerve carries signals to the muscles that close the eye.
- Damage to the seventh cranial nerve can make one side of the face droop.
