simpleMeaning: A long thin fluffy scarf made of the soft light covering of birds or of fur.
scope: A long thin fluffy scarf made of the soft light covering of birds or of fur, also called a boa;
  not a warm wool scarf and not a fur stole worn over the shoulders.
examples:
- She wore a feather boa to the fancy-dress party.
- The feather boa trailed behind her on the floor.
