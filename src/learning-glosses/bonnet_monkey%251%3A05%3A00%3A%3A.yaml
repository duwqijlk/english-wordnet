simpleMeaning: an animal from India with a bunch of hair on its head shaped like a small hat
scope: 'Also called bonnet macaque, capped macaque and crown monkey: a monkey from India with a hat-shaped
  bunch of hair, not a monkey with no such bunch and not a monkey from another place.'
examples:
- The bonnet monkey sat in the tree, the bunch of hair on its head shaped like a small hat.
- We saw a bonnet monkey with a hat-shaped bunch of hair at the zoo.
