senseId: 'leptosporangium%1:20:00::'
synsetId: 13113861-n
simpleMeaning: A spore case (a sporangium) that forms from a single outer skin cell, typical of the Filicales
  or of almost all modern ferns
scope: A spore case that grows from a single cell, unlike spore cases that form from a group of cells;
  it belongs to ferns, not to seed plants.
examples:
- The leptosporangium opens to release its spores.
- Botanists study the leptosporangium of the fern under a microscope.
