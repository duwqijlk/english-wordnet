simpleMeaning: the long, planned work done together by rule-makers and local groups to help people in
  one place live better and keep money matters there strong
scope: Planned work by rule-makers and local groups to help people in one place live better, not the growth
  of one firm and not a rise in prices.
examples:
- The town's economic development plan brought new jobs and better roads.
- Economic development in the area raised pay and built new schools.
