simpleMeaning: From a strand of DNA or RNA already there, a helper in the body builds new strands of DNA
  and RNA.
scope: A helper in the body that builds new strands of DNA and RNA from a strand already there, not the
  strand, which only carries the pattern.
examples:
- Polymerase built new strands of DNA from the strand already there.
- The sample's polymerase built new strands of RNA from the old strand.
