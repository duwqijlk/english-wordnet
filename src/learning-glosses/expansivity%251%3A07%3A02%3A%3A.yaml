simpleMeaning: Things that are grand in size or that tend to grow bigger have this quality
scope: 'Also called expansiveness: the quality of being grand in size or tending to grow bigger, not the
  act of growing itself and not a large area of land.'
examples:
- The expansivity of the old palace impressed every guest.
- The expansivity of his plans grew with each new success.
