senseId: 'positive_reinforcing_stimulus%1:09:00::'
synsetId: 05837144-n
simpleMeaning: a thing that comes after an act and makes that act more likely to happen again
scope: This is a thing that follows an act and makes the act more likely again, also called a positive
  reinforcer, not a thing that stops an act.
examples:
- Food can be a positive reinforcing stimulus that makes the dog sit again.
- The teacher used praise as a positive reinforcing stimulus to help the children read again.
