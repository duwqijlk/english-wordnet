simpleMeaning: a rare illness passed down from both parents in which the blood cells that help blood clot
  do not work as they should, so the person bleeds
scope: A rare blood illness in which clotting fails and bleeding follows, not a blood clot itself and
  not bruising from low platelets.
examples:
- The doctors found that the boy's thrombasthenia kept his blood from clotting.
- Her thrombasthenia means that even a small cut can bleed for a long time.
