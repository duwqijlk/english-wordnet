simpleMeaning: A small swift flying animal that eats insects, with leathery ears and a long part sticking
  out at the back, is often found in warm lands.
scope: Also called free-tailed bat or freetailed bat, this is the name for the small swift flyer that
  eats insects, leathery-eared with a long part sticking out at the back, often found in warm lands.
examples:
- Freetails darted over the river at dusk.
- A freetail roosted in the roof.
