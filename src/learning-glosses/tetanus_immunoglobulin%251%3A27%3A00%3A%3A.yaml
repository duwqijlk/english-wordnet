simpleMeaning: A germ-free blend of globulins in blood water from a person shielded from lockjaw, that
  gives brief guard from lockjaw should the germ have been faced.
scope: This sense is also called tetanus immune globulin.
examples:
- A tetanus immunoglobulin gave brief guard.
- Tetanus immunoglobulins come from blood water.
