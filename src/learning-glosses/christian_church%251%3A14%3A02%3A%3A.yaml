simpleMeaning: A group of Protestants that takes the Bible as the only true source of its faith and dips
  new members right under the water.
scope: A group of Protestants that takes the Bible as the only true source of its faith, not a group that
  follows a book of church rules or a group led by one bishop; also called Disciples of Christ.
examples:
- The Christian Church meets each Sunday to read the Bible.
- New members of the Christian Church are dipped under the water.
