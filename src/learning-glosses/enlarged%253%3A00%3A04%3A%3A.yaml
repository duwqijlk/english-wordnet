simpleMeaning: Of a part of the body, grown far too big because its cells have grown bigger
scope: A body part grown too big because its cells grew; not a photo made bigger and not a thing made
  larger on purpose.
examples:
- The scan showed an enlarged heart.
- His enlarged glands made swallowing hard.
