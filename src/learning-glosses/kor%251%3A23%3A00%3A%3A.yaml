simpleMeaning: An old Hebrew measure of how much a container holds, equal to ten smaller measures called
  baths or ephahs
scope: 'Also called a homer: an old Hebrew measure of capacity, not a weight and not a length.'
examples:
- The merchant paid a kor of barley for the cloth.
- A kor held ten baths of grain.
