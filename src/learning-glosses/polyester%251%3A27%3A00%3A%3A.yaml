simpleMeaning: any of many man-made resins, thick sticky substances made in factories; they are light
  and strong and are not harmed by weather
scope: This is the resin itself, a light, strong material; not the related polyester substance used for
  making fibers and cloth.
examples:
- The boat's hard outer part is made of polyester, which stays strong in sun and rain.
- Workers shaped the warm polyester into a light, hard panel.
