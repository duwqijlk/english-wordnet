simpleMeaning: To throw up what the stomach holds, sending it back out through the mouth.
scope: To throw up what is in the stomach; also called sick, cat, cast, vomit, puke, purge, retch, honk,
  and spew, not the holding device, the cut of meat, or the fond pat under the chin.
examples:
- After drinking too much, he chucked in the bathroom.
- The sick child chucked up her supper.
