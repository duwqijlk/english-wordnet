simpleMeaning: A stripe, or a set of stripes, in a colour that stands out against the rest.
scope: Also called band or banding, a stripe or stripes of a colour that stands out from what is around
  them; not the tiny parallel grooves left by ice on rock or found in muscle.
examples:
- The striation on the wasp's back stood out in black and yellow.
- Chromosomes show striation in bands of light and dark.
