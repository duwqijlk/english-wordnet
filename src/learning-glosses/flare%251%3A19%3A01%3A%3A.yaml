simpleMeaning: light that bounces back where it should not in a lens or camera, which can make a photo
  look misty
scope: Light that bounces back where it should not in a lens or camera, making a photo look misty, not
  a bright light made to warn and not a burst of light itself.
examples:
- Flare from the sun spoiled the photo.
- The flare in the lens made the picture look misty.
