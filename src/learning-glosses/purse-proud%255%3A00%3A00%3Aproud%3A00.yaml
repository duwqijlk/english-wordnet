simpleMeaning: Looking down on others because of money, most often when nothing else sets the person apart
scope: Said of a person who thinks money makes them better than others, not of someone proud of real work
  or skill.
examples:
- He was purse-proud after selling his company for millions.
- Her purse-proud manner put off the neighbours.
