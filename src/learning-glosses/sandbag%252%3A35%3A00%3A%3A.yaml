simpleMeaning: to hit a person or thing hard, as if with a heavy bag full of sand
scope: To hit someone hard in this way, not to protect a place with bags of sand, not to force a person
  by threats, and not to hide how well you can play to trick others in a game.
examples:
- The robber sandbagged the guard with a heavy blow and ran off.
- A stranger sandbagged him in the dark alley and ran away.
