senseId: 'civilise%2:30:01::'
synsetId: 00412237-v
simpleMeaning: to bring a person or people from a wild and rough way of life into a settled, ordered way
  of life
scope: Also called civilize. This is about raising a person or people from a wild, rough life to a settled,
  ordered one, not about teaching better taste or a better way to judge things.
examples:
- The Romans tried to civilise the wild tribes they met.
- Missionaries worked to civilise the people in the remote villages.
