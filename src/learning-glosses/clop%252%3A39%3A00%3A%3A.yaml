simpleMeaning: to make a sound like a horse's feet hitting the ground, or to move along while making that
  sound
scope: Also called clump, clunk, and plunk. This is making the sound or moving with it, not the noun sense
  that is the sound itself.
examples:
- The horses clopped along the stone road.
- A single horse clopped past our house in the dark.
