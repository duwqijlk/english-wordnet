simpleMeaning: Toothed round parts joined in a row turn as one, carrying power along and changing how
  fast a thing moves or how hard it turns.
scope: Also called a train, a gear, a gearing, or a power train, this is a row of toothed round parts
  that turn as one to pass power along.
examples:
- His tie got caught in the geartrain.
- The geartrain passed power from the motor to the wheels.
