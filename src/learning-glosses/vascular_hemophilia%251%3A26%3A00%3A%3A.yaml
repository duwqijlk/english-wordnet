senseId: 'vascular_hemophilia%1:26:00::'
synsetId: 14194658-n
simpleMeaning: An inherited bleeding disorder identified by Erik von Willebrand and passed on only when
  both parents carry the gene; a clotting protein is lacking and mucous membranes bleed.
scope: The same inherited bleeding disorder that angiohemophilia names; not classic hemophilia A, which
  is carried on the X chromosome and affects mainly males.
examples:
- Vascular hemophilia often causes nosebleeds that are hard to stop.
- He was diagnosed with vascular hemophilia after a routine blood test.
