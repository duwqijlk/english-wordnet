simpleMeaning: Total, with nothing softened, weakened, or made less severe.
scope: This is a case with nothing softened, weakened or held back; it is not a straight, short path in
  space, not something with no go-between or middle step, not plain or frank in manner, not descent through
  an unbroken family line, not movement eastward across the sky, not a proportional relation to another
  quantity, not a one-way electrical flow, not something that follows at once as a result, not a word-for-word
  quotation, not the adverb meaning without swerving, and not any verb use (commanding, aiming at a goal,
  aiming a weapon, camera or blow, guiding actors, conducting music, governing or managing, taking or
  sending someone somewhere, steering a course, telling someone the way, designing for an audience, addressing
  an envelope, or planning a complex undertaking).
examples:
- Her statement was in direct contradiction to the evidence.
- The two accounts stand in direct opposition.
