simpleMeaning: the legal right to care for a child, decide where they live and correct their behaviour,
  especially after a divorce
scope: This is not the body part at the end of the arm; it is the legal right to raise a child.
examples:
- The court placed the child in the hands of her grandmother.
- After the divorce, the boy was in his father's hands.
