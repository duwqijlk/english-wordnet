simpleMeaning: a kind of earth that forms where the land is very dry
scope: This is a kind of earth that forms where the land is very dry; desertic soil is another name for
  it, not rich farm earth and not wet earth.
examples:
- The desert soil forms in a place with almost no rain.
- Farmers find it hard to grow crops in desert soil.
