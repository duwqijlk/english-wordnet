senseId: 'snow%2:32:00::'
synsetId: 00840873-v
simpleMeaning: Keep your real purposes hidden from others, especially by putting on an elaborate show
  of good intentions so you can gain what you want.
scope: This is about tricking people, not the frozen water that falls from clouds, the layer it makes
  on the ground, or the verb for that falling.
examples:
- He snowed the committee into approving the plan by promising them everything.
- She snowed her parents into thinking she had finished the course.
