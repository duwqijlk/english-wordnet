senseId: 'enrichment%1:04:00::'
synsetId: 00265209-n
simpleMeaning: the act of making a thing fuller, giving it more meaning, or making it more worth doing
  or having
scope: This is the act of making something fuller or better in meaning. It is not a gift of money that
  makes a person richer.
examples:
- The enrichment of the course came from new stories and songs.
- She added art and music for the enrichment of daily life.
