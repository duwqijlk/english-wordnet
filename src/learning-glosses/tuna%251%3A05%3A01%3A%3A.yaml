simpleMeaning: any of a group of very large sea fish that people eat and catch for sport, kin to the mackerel
  and found mostly in warm seas
scope: A very large sea fish eaten as food and caught for sport, not the warm-water fish served as steaks,
  and not the prickly pear plant.
examples:
- The fishermen caught a huge tuna off the warm coast.
- Tuna is a large fish that lives in warm seas.
