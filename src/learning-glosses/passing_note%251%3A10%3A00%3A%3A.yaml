senseId: 'passing_note%1:10:00::'
synsetId: 06883487-n
simpleMeaning: A sound that is not in the chord, the sounds played together at one time, put in to join
  two sounds that are
scope: 'Another name for this is a passing tone: a sound put in to join two sounds that are in the chord,
  not a sound that is part of the chord and not a sound played by mistake.'
examples:
- The passing note joined the two chord tones in the melody.
- She played a passing note between the two main notes.
