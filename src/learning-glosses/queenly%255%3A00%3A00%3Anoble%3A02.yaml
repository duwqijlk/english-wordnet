simpleMeaning: having the rank of a queen, or like a queen in look or in way of acting, or fit for a queen
scope: 'Another name for this sense is queenlike: it means having the rank of a queen, or looking or acting
  in a way fit for a queen.'
examples:
- She walked into the room with a queenly calm that made everyone turn to look.
- The queenly dress was long, rich, and fit for a great hall.
