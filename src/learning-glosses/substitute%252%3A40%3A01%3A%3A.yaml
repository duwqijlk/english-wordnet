simpleMeaning: To stand in for someone or something else
scope: To stand in for someone or something else, not to swap one thing for another and not to do the
  work of a person who is away.
examples:
- The young teacher had to substitute for the sick colleague.
- The skim milk substitutes for cream in this dish.
