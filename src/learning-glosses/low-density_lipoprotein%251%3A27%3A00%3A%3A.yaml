simpleMeaning: Mostly cholesterol, with some protein, this blood bit carries cholesterol in the blood,
  and high amounts are thought to raise the chance of heart disease and hardening of the arteries
scope: 'Also called beta-lipoprotein: a blood bit that carries cholesterol, whose high levels are linked
  to heart disease.'
examples:
- The doctor said my low-density lipoprotein was too high.
- A test can measure low-density lipoprotein in the blood.
