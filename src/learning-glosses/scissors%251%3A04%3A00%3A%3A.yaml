simpleMeaning: a hold in wrestling in which you wind your legs round the other person's body or head,
  put your feet together, and squeeze
scope: A wrestling hold with the legs wound round the other person, feet together, squeezing; not the
  move on the pommel horse and not the cutting tool.
examples:
- He caught his rival in scissors and squeezed.
- The wrestler used scissors to hold his opponent's head.
