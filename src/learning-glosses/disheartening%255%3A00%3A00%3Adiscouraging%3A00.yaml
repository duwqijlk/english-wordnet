simpleMeaning: making people feel they cannot keep going and cannot trust that they can do things on their
  own
scope: This sense is also called demoralizing, dispiriting, and demoralising. It is about losing the will
  to keep going, not about being rude or being made unable to think clearly.
examples:
- The disheartening losses made the players feel they could not keep going.
- It was disheartening to work hard for weeks and see no sign of getting better.
