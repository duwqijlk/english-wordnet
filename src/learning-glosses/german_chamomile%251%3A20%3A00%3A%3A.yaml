simpleMeaning: A one-year herb from Europe and Asia, like the herb of its name in smell and healing uses,
  but more bitter to taste and held to work less well.
scope: Also called sweet false chamomile, wild chamomile, Matricaria chamomilla, or Matricaria recutita;
  the annual herb like chamomile in smell and healing uses, but more bitter to taste and held to work
  less well.
examples:
- German chamomile smells like chamomile but tastes more bitter.
- We grew German chamomile for its healing uses, though it is held to work less well.
