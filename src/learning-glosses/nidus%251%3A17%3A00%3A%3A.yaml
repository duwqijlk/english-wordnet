simpleMeaning: A nest where spiders or insects lay their eggs.
scope: A nest where spiders or insects lay their eggs, not a bird's nest and not a web.
examples:
- The spider left a nidus of eggs under the leaf.
- A nidus holds the eggs until the young spiders hatch.
