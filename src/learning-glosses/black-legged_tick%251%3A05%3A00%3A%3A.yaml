simpleMeaning: An arachnid that feeds on mice and people, is the main carrier of Lyme disease in the eastern
  United States, especially New England, and was once called the deer tick.
scope: This is the biting arachnid itself, not the Lyme disease it transmits, and not the western species
  that spreads the same illness.
examples:
- A black-legged tick can pass Lyme disease to a person through a single bite.
- We found a black-legged tick on the dog after a walk in the woods.
