simpleMeaning: Busy all the time, with things happening or being done without a pause.
scope: Busy places, markets or accounts in continuous use; not a condition growing more severe or wider
  in scope, not readiness for military or naval operations, not a disposition to act or bring about change,
  not taking part in a group or cause, not a person's own liveliness, not exerting influence or producing
  an effect, not a machine merely in operation, not the grammatical voice where the subject is the doer
  or its noun, not verbs or participial adjectives expressing action rather than a state, not volcanoes
  that can erupt or are erupting, not full-time work, not the chemical noun, and not a member of an organization.
examples:
- The port is active day and night, with ships arriving constantly.
- Trading was active all week in the bond market.
