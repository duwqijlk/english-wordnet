simpleMeaning: a loud booming or crashing noise made by air that grows big fast along the path of a flash
  of power in the sky
scope: A loud booming or crashing noise made by air along the path of a flash of power, not a deep long
  noise on its own and not words said in a loud voice.
examples:
- Thunder rolled across the hills after the flash.
- We heard thunder in the far distance.
