simpleMeaning: A disorder of the chromosomes in girls and women with only one X chromosome, marked by
  short height, heart problems and sex organs that have not grown as they should.
scope: A chromosome disorder in girls and women with only one X chromosome, distinct from other chromosome
  disorders by that single X chromosome and by the mix of short height, heart problems and sex organs
  that have not grown as they should.
examples:
- Girls with Turner's syndrome have only one X chromosome.
- Turner's syndrome is marked by short height and heart problems.
