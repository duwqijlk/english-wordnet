simpleMeaning: of hair or clothes, worn loose, not tied or held in place
scope: For hair or clothes that are loose and free to move, not for a person who acts on sudden wishes.
examples:
- Her flyaway hair fell over her face in the wind.
- He wore a flyaway coat that moved as he walked.
