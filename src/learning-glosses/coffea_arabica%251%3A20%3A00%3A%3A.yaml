scope: 'Also called Arabian coffee: a bushy tree of north-eastern tropical Africa grown for its seeds,
  not a wild shrub with inedible fruit.'
examples:
- Coffea arabica grows in the warm hills of north-eastern Africa.
- Most of the coffee sold in shops comes from Coffea arabica seeds.
