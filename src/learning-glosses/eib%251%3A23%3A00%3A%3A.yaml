simpleMeaning: This measure of data is two to the power of sixty bytes, or one thousand twenty-four pebibytes,
  each a very large unit of data
scope: 'Also called exabyte, exbibyte, and EB: a very large measure of data, not the smaller unit Eibit
  and not a measure of weight.'
examples:
- One EiB is two to the power of sixty bytes of data.
- The new store of data holds more than one EiB.
