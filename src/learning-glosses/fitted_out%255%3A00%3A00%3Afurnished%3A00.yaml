simpleMeaning: Describes a person or group supplied with all the tools and gear needed for a job or task.
scope: Describes a person or group supplied with all the tools and gear needed for a job or task; outfitted
  is another name for this sense, not a person sent out with no gear, and not a person dressed only for
  show.
examples:
- The team was fitted out for a trip to the South Pole.
- They arrived fitted out with tents, boots and food.
