simpleMeaning: Used about military units or industries that use small equipment and need less heavy support.
scope: It describes small, lightly equipped military units or industries, not how bright something is
  or how much one object weighs.
examples:
- The army sent in light infantry to move quickly through the hills.
- Light industry in the region makes clothes and furniture.
