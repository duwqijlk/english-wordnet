simpleMeaning: a poisonous condition caused by swallowing or breathing in mercury; when it comes on suddenly,
  it causes a metallic taste, vomiting, diarrhea and kidney problems that can be fatal
scope: Illness from mercury entering the body, not simple contact with the metal and not poisoning by
  lead or another metal.
examples:
- He was diagnosed with mercury poisoning after inhaling fumes at the factory.
- Doctors treated the child for mercury poisoning after she swallowed some of the metal.
