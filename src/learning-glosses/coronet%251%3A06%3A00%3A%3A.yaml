simpleMeaning: a small crown that usually shows a person has high rank, but not as high as a king or queen
scope: This is a small crown worn by a person of high rank below a king or queen. It is not the band on
  a horse's foot.
examples:
- The princess wore a gold coronet at the ceremony.
- His coronet showed his rank was below the king's.
