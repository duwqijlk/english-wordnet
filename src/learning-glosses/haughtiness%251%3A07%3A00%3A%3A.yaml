schema: oewn-learning-gloss-v2
senseId: 'haughtiness%1:07:00::'
synsetId: 04895107-n
simpleMeaning: pride that is too strong, shown by acting as if you are better than people you see as below
  you
scope: This is pride shown by looking down on others, also called arrogance, hauteur, lordliness, and
  high-handedness; it is not quiet self-belief or pride in good work well done.
examples:
- Her haughtiness made new workers afraid to ask her a question.
- His haughtiness showed when he spoke to the waiter as if the man did not matter.
