simpleMeaning: The tiny young plant inside the grain seed, taken out before grinding and eaten for its
  vitamins.
scope: The tiny young plant inside the grain seed; not the whole seed and not the flour made from it.
examples:
- Wheat germ is taken out before the grain is ground into flour.
- She sprinkled wheat germ on her cereal for its vitamins.
