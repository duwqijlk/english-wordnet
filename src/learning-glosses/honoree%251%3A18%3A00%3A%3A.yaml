simpleMeaning: A person who is given praise for things they have done that are worth noting
scope: A person who is given praise for things they have done that are worth noting; not the person who
  gives the praise, and not a winner of a contest.
examples:
- The honoree rose to accept the medal for her work.
- Each honoree was praised for a lifetime of service.
