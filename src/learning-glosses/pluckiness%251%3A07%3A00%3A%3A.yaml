simpleMeaning: Even when one may lose something or be hurt, the quality of going on with courage and firm
  resolve
scope: Also called pluck or gutsiness, this is the quality of going on with courage even when one may
  lose something or be hurt, not just being unafraid and not acting without care.
examples:
- Her pluckiness showed when she kept going although she knew she might get hurt.
- His pluckiness was clear when he went on although he might lose what he had.
