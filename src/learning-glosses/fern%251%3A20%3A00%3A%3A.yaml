simpleMeaning: A plant with no flowers or seeds, with tubes that carry water and true roots from an underground
  stem, and leaves that uncurl upward, making more plants by spores
scope: A flowerless, seedless plant with leaves that uncurl, not a flowering plant and not a moss.
examples:
- Ferns grew thick along the damp path.
- She planted a fern in a shady corner of the garden.
