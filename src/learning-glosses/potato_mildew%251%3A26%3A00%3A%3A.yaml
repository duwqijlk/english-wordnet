simpleMeaning: A sickness that attacks and spoils the crop of a starchy root vegetable
scope: This is a sickness that attacks and spoils the crop of a starchy root vegetable; potato blight,
  potato disease, potato mold and potato murrain are other names for this sense, not a sickness of grain,
  and not the yellow dwarf sickness of the same crop.
examples:
- Potato mildew struck the crop after weeks of rain.
- The leaves showed potato mildew in late summer.
