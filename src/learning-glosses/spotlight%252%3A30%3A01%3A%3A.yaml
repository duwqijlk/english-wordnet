simpleMeaning: to bring a thing forward so that people notice it more
scope: To bring a thing forward so that people notice it more, also called highlight; not lighting a person
  on a stage with a beam, and not the lamp itself.
examples:
- The speech spotlighted the speaker's long work for peace.
- The report spotlighted the need for clean water.
