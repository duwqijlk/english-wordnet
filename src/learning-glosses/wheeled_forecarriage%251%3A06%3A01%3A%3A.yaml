simpleMeaning: a small cart with round parts that roll, fixed under the front end of the beam of a plow
scope: 'Also called fore carriage and forecarriage: a small cart fixed under the front end of a plow beam,
  not the plow itself and not a large cart for carrying goods.'
examples:
- The wheeled forecarriage steadied the plow as it moved across the field.
- He fixed the wheeled forecarriage under the front of the plow beam.
