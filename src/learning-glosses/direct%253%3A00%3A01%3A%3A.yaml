simpleMeaning: A current that keeps moving one way and never reverses.
scope: Only the adjective use for an electric current that flows one way without reversing; not straight
  and unbroken in space, not having no one or nothing in between, not frank and open in manner, not in
  an unbroken line of ancestry, not moving west to east across the sky or with the planets, not alike
  in nature or effect or tied to another quantity, not an immediate result, not word-for-word, not total
  and unqualified, not the adverb meaning without deviation, and not any verb use (commanding, aiming,
  guiding actors, governing, taking or sending someone, giving directions, planning an undertaking, or
  writing a delivery address on an envelope).
examples:
- A battery supplies direct current, while a wall socket supplies alternating current.
- The small motor runs on direct current, so a simple battery pack can drive it.
