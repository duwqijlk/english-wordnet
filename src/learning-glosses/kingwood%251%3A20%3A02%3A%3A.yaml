simpleMeaning: Good-looking wood with violet streaks, from the tree that bears its name, used above all
  in furniture work
scope: This is good-looking wood with violet streaks, from the tree that bears its name, used above all
  in furniture work, not ordinary building wood and not wood from any other tree.
examples:
- Kingwood is used in furniture work.
- The cabinet was made of violet-streaked kingwood.
