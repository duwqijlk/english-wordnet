simpleMeaning: Small underground parts shaped like the hard fruit it is named for, good to eat, grow on
  a long-lived grass-like plant found in many places.
scope: Also called nut grass, nut sedge, and nutgrass, this is the long-lived plant whose small underground
  parts, shaped like the hard fruit it is named for, are good to eat.
examples:
- The nutsedge had small tubers under the ground.
- The nutsedge came back each year.
