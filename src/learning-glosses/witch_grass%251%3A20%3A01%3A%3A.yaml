simpleMeaning: With thin brushy bunches of blooms, this plant of North America most often grows as a weed
  where crops are grown.
scope: Also called old witch grass, old witchgrass, tumble grass, and witchgrass, it belongs with the
  North American plants that are most often weeds on land where crops are grown.
examples:
- The witch grass grew thick where the crops stood.
- Thin brushy bunches of blooms marked the witch grass.
