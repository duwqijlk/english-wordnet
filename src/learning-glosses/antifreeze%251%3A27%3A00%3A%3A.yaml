simpleMeaning: A liquid mixed into the water of a cooling system so that it freezes only when colder.
scope: 'For a car''s cooling system: a liquid that stops the water freezing in winter.'
examples:
- They added antifreeze to the car's radiator before winter.
- Without antifreeze, the water in the pipes would freeze overnight.
