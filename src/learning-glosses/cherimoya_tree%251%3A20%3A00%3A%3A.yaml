simpleMeaning: a small woody plant from warm parts of the Americas that bears round or long fruit
scope: A small woody plant from warm parts of the Americas that bears round or long fruit; cherimoya is
  another name for this sense, not the fruit itself and not a custard apple tree.
examples:
- The cherimoya tree in the garden bears fruit each year.
- They planted a cherimoya tree beside the house.
