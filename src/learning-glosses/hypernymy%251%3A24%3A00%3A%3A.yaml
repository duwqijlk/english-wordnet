simpleMeaning: In the study of word meanings, the link in which one word names a wider group that holds
  another word.
scope: The word-meaning link in which one word stands above another as the wider term, not the link in
  which a word stands below as the narrower term (hyponymy), and not two words meaning the same thing.
examples:
- In class we learned that hypernymy links 'animal' to 'dog'.
- Hypernymy is the link between a wide word and a narrower one.
