simpleMeaning: The act of making a person lawful, with the same standing as a person born to married parents
scope: The act of making a person lawful, with the same standing as a person born to married parents,
  not adoption and not the marriage itself.
examples:
- His parents' marriage led to his legitimation.
- He sought legitimation so that he could inherit.
