simpleMeaning: A fold in the skin of the hand that, people who read hands say, shows how well you will
  do in life
scope: 'Also called line of fate: a fold in the hand said to show how well you will do in life, not the
  fold said to show love and not the fold said to show how long you will live.'
examples:
- The palmist studied the line of destiny on her hand.
- He said his line of destiny showed a long run of good luck.
