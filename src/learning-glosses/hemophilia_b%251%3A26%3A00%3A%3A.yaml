simpleMeaning: A blood-clotting illness like the A kind of the same illness, but caused by too little
  of a blood part called factor IX from birth.
scope: 'Also called Christmas disease or haemophilia B: a blood-clotting illness like the A kind of the
  same illness, but caused by too little of a blood part called factor IX from birth, close to other blood-clotting
  illnesses from birth.'
examples:
- Hemophilia B is rarer than the A kind.
- The child with hemophilia B lacks factor IX.
