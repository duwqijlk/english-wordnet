simpleMeaning: a thing that makes people laugh at it in scorn because it has no sense in it at all
scope: Also called ridiculous, absurd, and ludicrous; this is about a silly idea or act, not about a person
  who is not clever.
examples:
- It was idiotic to leave the door unlocked all night.
- She called the plan idiotic and walked out.
