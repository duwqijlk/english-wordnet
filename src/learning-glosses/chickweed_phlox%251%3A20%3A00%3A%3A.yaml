simpleMeaning: a low plant with no woody stem that spreads in a thick mat on rocky ground in the United
  States
scope: A low mat-forming herb of rocky places in the United States, not a tall garden flower and not a
  weed of wet fields.
examples:
- Chickweed phlox covered the rocky slope in a low green mat.
- We found chickweed phlox growing between the stones.
