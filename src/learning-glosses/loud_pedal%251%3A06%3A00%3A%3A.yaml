senseId: 'loud_pedal%1:06:00::'
synsetId: 04374098-n
simpleMeaning: A foot lever on a piano that lifts the small pads off the strings so they keep sounding.
scope: This is a foot lever on a piano that lifts the pads off the strings so they keep sounding, not
  the soft pedal and not a foot lever of an organ; sustaining pedal is another name for this sense.
examples:
- She pressed the loud pedal to let the last chord ring on.
- The loud pedal held the notes sounding after her foot left the keys.
