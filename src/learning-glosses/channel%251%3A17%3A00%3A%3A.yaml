synsetId: 09264153-n
simpleMeaning: A deep, fairly narrow stretch of water, found in a river, harbor or strait, that gives
  ships the best route through.
scope: This is a navigable waterway deep enough for ships, not any passage that liquid flows through,
  and not a long narrow cut or groove in land or in a record.
examples:
- The ferry slowed as it entered the narrow channel between the two islands.
- Dredging keeps the channel deep enough for cargo ships to reach the port.
