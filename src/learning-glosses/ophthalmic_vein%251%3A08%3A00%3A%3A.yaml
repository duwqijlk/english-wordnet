simpleMeaning: Draining into a large blood channel deep inside the head, this blood tube is one of two
  that serve the eye
scope: A blood tube that drains into a large blood channel deep inside the head, one of two that serve
  the eye; not a tube that feeds the eye and not a blood tube in the neck.
examples:
- The ophthalmic vein carries blood away from the eye.
- Damage to the ophthalmic vein can slow blood flow from the eye.
