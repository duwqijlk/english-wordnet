simpleMeaning: A Greek bishop of Smyrna who would not give up his Christian faith and was burned to death
  by pagans, about 69 to 155
scope: Also called Polycarp and St. Polycarp; a Greek bishop of Smyrna who died for his faith, close to
  other early bishops and martyrs such as Ignatius of Antioch.
examples:
- Saint Polycarp died for his faith.
- The church honours Saint Polycarp each year.
