simpleMeaning: A grass often grown for its long leaves with white ribs and big flower heads like those
  of pampas grass.
scope: Also called wool grass and Erianthus ravennae; a grass often grown for its long white-ribbed leaves
  and big flower heads, not a short lawn grass.
examples:
- Ravenna grass swayed by the gate, its white-ribbed leaves catching the light.
- The gardener planted Ravenna grass for its big soft flower heads.
