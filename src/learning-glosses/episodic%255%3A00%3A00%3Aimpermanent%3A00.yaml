senseId: episodic%5:00:00:impermanent:00
synsetId: 01761270-s
simpleMeaning: Lasting only as long as one short event, and no longer.
scope: Lasting only as long as one short event; not of a written work or a telling of a story made up
  of separate parts, and not coming and going with no set pattern, usually at uneven times.
examples:
- The pain was episodic, lasting only an hour each time.
- His cough was episodic, gone again by the next morning.
