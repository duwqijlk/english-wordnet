simpleMeaning: From this main office for the police of one part of a town, officers are sent out, and
  people under arrest are brought here
scope: Also called police headquarters and police station, this main office serves the police of one part
  of a town, sending officers out and taking in people under arrest.
examples:
- The station house sent out officers.
- People under arrest were taken to the station house.
