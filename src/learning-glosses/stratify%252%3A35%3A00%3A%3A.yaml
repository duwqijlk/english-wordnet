synsetId: 01311341-v
simpleMeaning: To set things out in layers, one laid on top of another.
scope: To set things out in layers, one on top of another; not to make things fertile and keep them fresh
  by packing them between layers of earth or sand, and close in sense to a thing forming layers of its
  own.
examples:
- Workers stratified the fish in barrels, layer upon layer.
- The rock was stratified by the force of the water over time.
