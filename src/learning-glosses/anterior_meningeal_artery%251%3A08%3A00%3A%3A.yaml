simpleMeaning: a blood tube that comes off the front nose blood tube and feeds the covers of the brain
  in the front hollow of the skull
scope: A blood tube feeding the brain's covers at the front of the skull, not a vein and not one of the
  main brain-feeding tubes.
examples:
- The anterior meningeal artery feeds the meninges at the front of the skull.
- Damage to the anterior meningeal artery can bleed into the front of the skull.
