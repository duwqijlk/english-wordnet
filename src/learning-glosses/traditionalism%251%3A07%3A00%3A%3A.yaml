senseId: 'traditionalism%1:07:00::'
synsetId: 04809126-n
simpleMeaning: A strict keeping to old ways and old teachings.
scope: A strict keeping to old ways and old teachings, close in sense to the act of holding to tradition,
  especially in cultural or religious matters, and not the teaching that all knowledge came by divine
  revelation.
examples:
- His traditionalism kept him to the old ways.
- The traditionalism of the village resisted change.
