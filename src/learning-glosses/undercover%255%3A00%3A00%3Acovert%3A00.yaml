simpleMeaning: Done in secret, with aims or ways that are kept hidden from others.
scope: This is action carried out in secret, with hidden aims; secret, underground and surreptitious are
  other names for this sense, not work done openly or merely in private.
examples:
- The undercover officers spent months watching the gang without being seen.
- She worked undercover for a year before the case went to court.
