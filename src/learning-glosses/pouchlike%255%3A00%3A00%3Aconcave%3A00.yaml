simpleMeaning: Made in the form of a small soft bag that holds things
scope: This describes a thing made in the form of a small soft bag that holds things; pouch-shaped is
  another name for this sense, not a thing shaped like a box, and not a flat thing.
examples:
- The pouchlike case held his glasses.
- She wore a pouchlike bag at her waist.
