simpleMeaning: a mental illness in which a person wrongly believes that others are trying to harm them,
  or that they are far greater than they are
scope: A mental illness of false beliefs about being harmed or being great, not ordinary fear and not
  simple pride.
examples:
- His paranoia made him think his friends were plotting against him.
- The paranoia grew until she trusted no one.
