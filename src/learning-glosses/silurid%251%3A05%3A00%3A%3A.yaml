simpleMeaning: A long bottom fin runs almost into the eel-like tail fin of these bare-skinned Old World
  river fish with whiskers round the mouth.
scope: These Old World river fish with bare skin and a long bottom fin are also called a silurid fish.
examples:
- The silurid has bare skin and a long bottom fin.
- Silurids live in the rivers of the Old World.
