simpleMeaning: made up of answers that people give back and forth, taking turns to speak or act
scope: This sense means made up of answers given back and forth, not quick to react or reply to a person
  or event in general.
examples:
- The church held a responsive reading, with the leader and the group taking turns to speak.
- Their responsive laughter went back and forth, one group answering the other.
