simpleMeaning: This herb of Eurasia bears pale flowers and is grown far and wide to feed farm animals
  and to stop the soil from washing away.
scope: Also called field lupine and white lupine, this pale-flowered herb of Eurasia is grown far and
  wide as food for farm animals and to hold the soil in place.
examples:
- To hold the soil in place, wolf bean is grown far and wide.
- Pale flowers grow on wolf bean, a herb of Eurasia.
