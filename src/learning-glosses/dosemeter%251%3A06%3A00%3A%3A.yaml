simpleMeaning: this tool reads how much ionizing radiation, such as X-rays or radioactivity, has been
  taken in
scope: 'Also called dosimeter: a tool that reads how much ionizing radiation has been taken in, not a
  Geiger counter and not a thermometer.'
examples:
- The worker wore a dosemeter to check how much radiation she had taken in.
- After the X-ray work, the dosemeter showed a small dose.
