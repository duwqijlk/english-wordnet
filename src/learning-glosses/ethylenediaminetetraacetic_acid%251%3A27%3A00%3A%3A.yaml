simpleMeaning: A molecule with many parts, used by doctors to catch and hold bits of metal in the body
  in cases of lead or heavy metal poisoning
scope: A molecule used by doctors to catch and hold bits of metal; not a pill that kills germs, and not
  a metal itself.
examples:
- The doctor gave ethylenediaminetetraacetic acid to clear lead from the blood.
- Ethylenediaminetetraacetic acid holds bits of metal so the body can pass them.
