senseId: crass%5:00:00:unrefined:01
synsetId: 01957533-s
simpleMeaning: of a person, so rough and rude that they show no good taste and no care for the feelings
  of others
scope: It describes people with no good taste and no care for others; it is not a word for things, and
  it is stronger than just being a little rude.
examples:
- The crass man laughed loudly at the sad story and showed no care for others.
- His crass words showed he had no good taste.
