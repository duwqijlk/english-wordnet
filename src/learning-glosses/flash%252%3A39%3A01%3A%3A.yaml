simpleMeaning: to show off something proudly, or behave in a showy, self-important way to impress others
scope: Showing something off proudly or behaving showily, not exposing something briefly, and not giving
  out a burst of light.
examples:
- He flashed his new watch at everyone at the party.
- She flashed a roll of cash to impress the crowd.
