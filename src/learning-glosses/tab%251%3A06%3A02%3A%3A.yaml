simpleMeaning: the key on a typewriter or a computer that moves the writing to a set place across the
  page
scope: The key that jumps the writing across a page, not a small strip of material fixed to a thing to
  help open or find it.
examples:
- Press the tab key to move to the next box.
- She hit tab and the cursor jumped across the form.
