simpleMeaning: made up of many different kinds of things or people gathered together into one group or
  mass
scope: This word describes a group made of different kinds of things or people. It does not name the rock
  that is made of small pieces of stone.
examples:
- The city has a conglomerate mix of cultures and languages.
- The conglomerate peoples of the area came from many different places.
