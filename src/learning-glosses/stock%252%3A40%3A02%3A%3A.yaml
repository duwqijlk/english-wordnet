schema: oewn-learning-gloss-v2
senseId: 'stock%2:40:02::'
synsetId: 02328055-v
simpleMeaning: To put a supply of goods into something so they are ready for use.
scope: This sense is putting a stock of goods into a place, not merely having goods on hand, not amassing
  goods for later sale, not equipping something with a stock, not supplying fish or livestock, not a plant
  sprouting, and not any noun sense (broth, shop merchandise, company shares, a share certificate, a stored
  supply, a gun or tool handle, lumber, a white cravat, farm animals or a breed of them, a family line,
  reputation, a thick perennial stem, a graft rootstock, a Malcolmia plant, an Old World garden plant)
  or adjective sense (overused, routine, standard).
examples:
- We stocked the pantry with rice and tinned fish before the storm.
- The new owner stocked the bar with local spirits.
