simpleMeaning: Only its white gills set this very poisonous, often white fungus apart from the edible
  Agaricus, and it has a clear cup at its foot.
scope: This fungus is also called death angel, death cup, and destroying angel, and only its white gills
  set it apart from the safe Agaricus.
examples:
- The death cap is a very poisonous white fungus.
- A death cap can be told from the edible Agaricus only by its white gills.
