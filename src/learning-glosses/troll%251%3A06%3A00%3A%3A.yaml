simpleMeaning: a thing put on a fishing line to catch fish, used when the line is pulled through the water
scope: A thing used to catch fish, not the act of fishing itself and not the creature in old stories.
examples:
- He used a bright spinner as his troll.
- She picked a silver troll that flashed in the water.
