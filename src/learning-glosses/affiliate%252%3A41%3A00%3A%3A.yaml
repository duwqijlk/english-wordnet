simpleMeaning: to come together with another group in a close link
scope: This is the verb for joining with a group. Not the noun for a person who is linked to a group,
  and not the noun for a smaller linked group itself.
examples:
- The small club affiliated with a big national group.
- The two colleges affiliated to share their work.
