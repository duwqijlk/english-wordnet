simpleMeaning: dazed and unable to think clearly and slow to act, as after blows, too much drink, or great
  tiredness
scope: A dazed, slow state after blows, drink, or exhaustion; dazed and foggy are other names for this
  state; not simply sleepy.
examples:
- He woke up groggy after the operation.
- She felt groggy after the long night.
