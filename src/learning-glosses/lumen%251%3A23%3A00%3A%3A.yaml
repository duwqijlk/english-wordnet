simpleMeaning: a unit for light given out by a point source of one candela, a set brightness measure,
  spread evenly through one steradian, a set measure of a cone of space
scope: 'Also called lm: a unit for measuring light, not a unit for measuring length or weight.'
examples:
- This bulb gives out 800 lumen.
- The lamp is rated at 1,200 lumen.
