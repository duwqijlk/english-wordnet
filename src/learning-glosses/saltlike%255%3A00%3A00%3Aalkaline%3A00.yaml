simpleMeaning: like a chemical made by swapping the hydrogen in an acid for a metal
scope: Like a chemical made from an acid by swapping in a metal; not a plain acid and not a common metal
  on its own.
examples:
- The saltlike powder formed when the acid met the metal.
- The saltlike crystals came from mixing the acid with a metal base.
