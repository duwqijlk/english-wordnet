simpleMeaning: The brightness of something that gives off light in rays.
scope: The brightness a thing gives off, with radiance, effulgence, radiancy, refulgence and refulgency
  as other names for it; not a happy inner feeling or a bright color in the face.
examples:
- The shine of the polished silver caught her eye.
- We could see the shine of the lighthouse far off.
