simpleMeaning: In leaves, having an edge that is cut, fringed or scalloped.
scope: This is a leaf-edge term for cut, fringed or scalloped margins, not the general uneven-surface
  adjective or the sense meaning not shaped by cutting.
examples:
- The leaves of this oak are rough along the edges, with deep scalloped cuts.
- Botanists describe the plant as rough because of its fringed leaf margins.
