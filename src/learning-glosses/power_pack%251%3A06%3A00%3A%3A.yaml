simpleMeaning: A thing that changes the current from its source into the form a piece of kit needs
scope: This is a thing that changes current into the form a piece of kit needs; not a battery that stores
  current, and not a wire that only carries current.
examples:
- He plugged the radio into a power pack.
- The power pack changed the current for the small lamp.
