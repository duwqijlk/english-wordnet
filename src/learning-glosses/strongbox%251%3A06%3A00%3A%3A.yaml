simpleMeaning: a box made to be hard to break, for keeping money or things of value in, and it can be
  locked
scope: A hard, lockable box for money and things of value, not a large safe fixed in a place and not an
  ordinary box with no lock.
examples:
- She kept the money in a strongbox under the bed.
- He opened the strongbox and took out the old letters.
