simpleMeaning: This tongue is one of the Semitic group of tongues, now dead, that an old people spoke
  who ruled trade in the old world.
scope: Also called Phoenician language; this is the tongue, not the people who spoke it and not a word
  about that land.
examples:
- Traders in the old world spoke Phoenician.
- Phoenician is no longer spoken anywhere.
