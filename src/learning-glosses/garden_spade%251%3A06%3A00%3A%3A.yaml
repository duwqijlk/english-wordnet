simpleMeaning: A tool with a flat blade for digging, used by people who work in patches of land where
  plants grow
scope: This is a tool with a flat blade for digging in a patch, not a tool with teeth for gathering leaves
  and not a big shovel for heavy work.
examples:
- She dug the bed with a garden spade.
- The garden spade was sharp and clean.
