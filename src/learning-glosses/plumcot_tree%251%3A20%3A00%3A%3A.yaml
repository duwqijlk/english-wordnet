simpleMeaning: A cross between a plum (Prunus domestica) and an apricot (Prunus armeniaca)
scope: A cross between a plum and an apricot; plumcot is another name for this sense, and this is not
  a plum alone or an apricot alone.
examples:
- The plumcot tree is a cross between a plum and an apricot.
- A plumcot tree grew in the garden.
