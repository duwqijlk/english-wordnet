schema: oewn-learning-gloss-v2
senseId: 'condition%1:10:01::'
synsetId: 06768279-n
simpleMeaning: A fact or belief that is accepted as true, and that something else depends on in order
  to be valid or to take effect.
scope: This is a premise that must hold for something else to work, not a requirement written into a contract,
  not a state of health, and not the act of training behavior.
examples:
- These results hold only under the condition that the sample is truly random.
- 'The forecast rests on one condition: that fuel prices stay steady.'
