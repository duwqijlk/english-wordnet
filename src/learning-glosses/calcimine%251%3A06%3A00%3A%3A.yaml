simpleMeaning: Paint for walls and ceilings, made with water, zinc oxide, glue and colour, and put on
  as a thin wash.
scope: A water-based paint for walls and ceilings, not an oil paint and not a dye for cloth.
examples:
- They put calcimine on the kitchen walls to freshen them up.
- The old calcimine had flaked off the ceiling.
