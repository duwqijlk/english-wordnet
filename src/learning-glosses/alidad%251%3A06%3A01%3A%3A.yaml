simpleMeaning: On top of a theodolite, an instrument for measuring angles, this moving part carries the
  telescope and its fittings for surveying
scope: Also called an alidade, this is the moving top part of a theodolite, not the part used with a plane
  table for drawing lines of sight.
examples:
- The alidad turned on top of the theodolite as the surveyor sighted the far hill.
- He fixed the telescope to the alidad before measuring the angle.
