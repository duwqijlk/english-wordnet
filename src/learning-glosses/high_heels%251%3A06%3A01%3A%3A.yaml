simpleMeaning: A person wearing these shoes stands with the back of each foot well above the toes, on
  tall raised back parts.
scope: Also called high-heeled shoe and high heels shoe, this is a shoe with a tall raised back part,
  not a flat shoe.
examples:
- She kicked off her high heels as soon as she got home.
- High heels make her feet ache after an hour.
