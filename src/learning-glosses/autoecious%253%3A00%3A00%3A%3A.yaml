simpleMeaning: Of living things that feed on others, above all rust fungi, that live out their whole life
  on one host
scope: This is of living things that feed on others, above all rust fungi, that live out their whole life
  on one host; homoecious is another name for it, not of a living thing that moves between two hosts and
  not of one that lives free.
examples:
- Autoecious rust fungi live out their whole life on one host plant.
- The autoecious fungus never leaves its single host.
