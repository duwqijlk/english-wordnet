simpleMeaning: to make a solid thing become liquid, for example by heating it
scope: 'Also called liquify, liquidise and liquidize: to make a solid thing turn into liquid, not the
  sense where a solid itself becomes liquid when heated.'
examples:
- The heat liquefied the butter in the pan.
- You can liquefy ice by warming it slowly.
