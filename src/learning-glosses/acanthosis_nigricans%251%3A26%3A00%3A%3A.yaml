simpleMeaning: Dark patches like small hard lumps appear in the folds of the body in this skin sickness,
  which can be harmless or can be the harmful kind.
scope: Keratosis nigricans is another name for this skin sickness, whose dark lumpy patches sit in the
  folds of the body and which can be harmless or harmful.
examples:
- The dark patches of acanthosis nigricans sat in the folds of the skin.
- The patches of acanthosis nigricans were dark and felt like small hard lumps.
