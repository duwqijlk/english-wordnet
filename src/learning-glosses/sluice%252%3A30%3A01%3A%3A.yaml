simpleMeaning: to water land by letting water run onto it from a channel with a gate
scope: To water land from a channel with a gate; not to pour out in a strong stream, not to pass water
  through a channel, and not to send things down a channel.
examples:
- Sluice the dry fields after planting.
- The farmer sluiced water onto the earth from the channel.
