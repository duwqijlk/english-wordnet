schema: oewn-learning-gloss-v2
senseId: 'perturb%2:38:01::'
synsetId: 02069580-v
simpleMeaning: to disturb the path that an electron or atom (very tiny parts that all things are made
  of) usually follows
scope: This is about the path of a tiny part of matter; not making a person feel worried, and not changing
  the path of a planet or moon in space.
examples:
- The passing ion perturbed the electrons in the atom.
- A strong field can perturb an atom and change the path of its electrons.
