simpleMeaning: In pure mathematics, study of a shape only for what stays true when changed into any other
  shape, each point matched to one point, with no break either way
scope: Also called analysis situs, this is the mathematics sense about shapes, not the sense about body
  parts in an area and not the sense about the shape and history of a place.
examples:
- She studies topology and how shapes can be changed without breaking them.
- His topology class looked at what stays the same when a shape is stretched.
