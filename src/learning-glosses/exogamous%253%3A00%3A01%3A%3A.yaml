simpleMeaning: Under this custom, a person weds only outside their own clan or tribe, never within it.
scope: Also called exogamic, this word marks the custom of wedding only outside one's own clan or tribe,
  never within it.
examples:
- In an exogamous tribe, no one could marry a person from the same clan.
- Their exogamous custom sent young people to wed in other tribes.
