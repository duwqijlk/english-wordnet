simpleMeaning: For a small computer, people keep facts or orders on this small round plastic thing with
  magnets, in a stiff cover with a cut from its middle to its edge.
scope: Also called floppy and diskette, this is a small store of computer facts and orders in a stiff
  cover, not a hard disk.
examples:
- She saved her work on a floppy disk.
- The floppy disk held the old program.
