simpleMeaning: A group of religious workers sent to a foreign country to teach their faith and carry out
  religious work.
scope: This is not a single trip or a personal aim; it is an organized group doing religious work in another
  country.
examples:
- The mission ran a school and a clinic in the village for many years.
- Donations from local churches supported the mission in East Africa.
