simpleMeaning: The state of being split into charged bits, as by heat, rays, a chemical change, or a burst
  of electricity.
scope: The state of being split into charged bits; ionization is another name for this sense, not the
  act of joining bits together and not the state of a gas on its own.
examples:
- Ionisation of the gas made it able to carry a current.
- Heat caused the ionisation of the air in the tube.
