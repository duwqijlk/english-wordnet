simpleMeaning: One of the four old Greek ways of speaking, used in Boethia, Thessaly, Lesbos, and the
  Greek colonies of Asia Minor.
scope: One of four old Greek dialects, also called Aeolian; not a word about wind and not modern Greek.
examples:
- Eolian was spoken on the island of Lesbos.
- The old poet wrote in Eolian.
