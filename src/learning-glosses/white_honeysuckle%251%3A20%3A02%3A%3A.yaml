simpleMeaning: A bush that grows in wet ground all over the east of the United States, with small pale
  to pinkish flowers like those of a sweet climbing plant
scope: A bush of wet ground with pale to pinkish flowers; swamp azalea and swamp honeysuckle are other
  names for this sense, and it is not a dry-ground rose bush or a tall tree.
examples:
- White honeysuckle grows thick in the swamp.
- We found white honeysuckle blooming by the pond.
