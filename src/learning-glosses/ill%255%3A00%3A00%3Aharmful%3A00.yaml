simpleMeaning: Bringing suffering or bad luck; harmful in its results.
scope: This describes something that causes harm or bad outcomes; it does not mean unwell or sick, and
  it is not the adverb for doing something badly.
examples:
- The drug had no ill effects on the patients.
- Ill fortune struck the family twice that year.
