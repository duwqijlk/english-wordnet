simpleMeaning: to suddenly leave a lover or a person you were going to marry, for no good reason and with
  no care for their feelings
scope: This means to leave a lover or a person you were going to marry suddenly and without care; it is
  not to leave a place in a normal way, and not to break a thing.
examples:
- She jilted her lover a week before the wedding.
- He felt hurt after he was jilted by his bride.
