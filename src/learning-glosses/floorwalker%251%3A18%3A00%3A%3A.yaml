simpleMeaning: A worker in a shop who watches over the sales staff and helps shoppers with problems.
scope: A worker in a shop who watches over the sales staff and helps shoppers with problems; not a sales
  assistant who sells things and not the manager of the shop.
examples:
- The floorwalker showed the woman where to find the coats.
- Ask the floorwalker if you need help with a return.
