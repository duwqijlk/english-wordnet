senseId: 'tympanic_cavity%1:08:00::'
synsetId: 05332436-n
simpleMeaning: The main hollow space in the ear, between the thin skin that moves when sound hits it and
  the inner ear
scope: This is the main space in the ear, between the eardrum and the inner ear; middle ear and tympanum
  are other names for this sense, and it is not the inner ear or the eardrum itself.
examples:
- The tympanic cavity sits between the eardrum and the inner ear.
- Fluid can build up in the tympanic cavity after a cold.
