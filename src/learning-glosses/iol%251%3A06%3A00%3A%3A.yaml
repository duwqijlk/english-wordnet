scope: A clear plastic lens put inside the eye, most often when the eye's own lens has been taken out
  in an operation for cataract, also called interocular lens implant and lens implant.
examples:
- The surgeon put an IOL in her eye after the cataract operation.
- His IOL lets him see clearly again.
