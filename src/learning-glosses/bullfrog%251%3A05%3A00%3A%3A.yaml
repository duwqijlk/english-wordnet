simpleMeaning: the largest frog in North America, one that lives mostly in water and makes a deep, low
  sound
scope: This is the largest frog in North America, which lives mostly in water and has a deep voice, not
  a frog of another place or a smaller kind.
examples:
- The bullfrog sat at the edge of the pond and made a deep sound.
- We heard a bullfrog calling from the water at night.
