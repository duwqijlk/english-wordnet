simpleMeaning: a careful, close look at your own sense of right and wrong, as done each day by Jesuits
scope: This is a careful look inside your own mind about right and wrong, not a set of test questions
  and not a close look at a thing to find mistakes.
examples:
- Each night, he made an examination of his conscience and thought about the wrong things he had done
  that day.
- Her daily examination of conscience helped her say sorry for her bad acts.
