simpleMeaning: a sticky substance used to fill small holes in a surface or to make cloth stiff.
scope: This is the sticky substance, not how big something is, and not a standard measure for clothes.
examples:
- The painter applied size to the wall before painting it.
- Workers used size to stiffen the fabric.
