simpleMeaning: too small in size or amount; not enough
scope: Also called bare and spare, this means not enough in size or amount, not uncovered and not kept
  as an extra.
examples:
- They lived on a scanty income and had to save every coin.
- The scanty harvest left little food for the winter.
