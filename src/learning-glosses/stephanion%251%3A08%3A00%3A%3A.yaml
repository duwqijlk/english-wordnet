simpleMeaning: a measured spot on the skull, on the join across the top of the head, above the opening
  of the ear
scope: A spot used to measure the skull, not a bone, not a part of the ear, and not a mark on the face.
examples:
- The doctor marked the stephanion before measuring the skull.
- The stephanion lies above the ear, on the join across the top of the head.
