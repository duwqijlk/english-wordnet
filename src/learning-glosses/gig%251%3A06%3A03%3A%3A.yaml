simpleMeaning: a fishing tool made of a long pole with a barbed point at the end, used to catch fish
scope: 'Another name for a spear or a lance: a long-handled tool with a barbed point for catching fish,
  not a small carriage and not a set of hooks without barbs.'
examples:
- The fisherman caught a large fish with his gig.
- He held the gig over the water, ready to strike.
