simpleMeaning: the most junior officer in the Army, Air Force or Marine Corps, below every other officer
  rank
scope: An officer in the Army, Air Force or Marine Corps who holds the lowest officer rank; not a first
  lieutenant and not a sergeant.
examples:
- The 2nd lieutenant holds the lowest officer rank.
- He joined as a 2nd lieutenant.
