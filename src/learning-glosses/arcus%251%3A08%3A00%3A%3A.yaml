simpleMeaning: a pale white build-up in the shape of a bow that at times shows on the clear front part
  of the eye
scope: 'Also called arcus senilis: a pale white build-up on the front of the eye, not a sore on the eye
  and not a cloud over the whole eye.'
examples:
- The eye test showed an arcus at the edge of her eye.
- An arcus had formed in the clear front part of his eye.
