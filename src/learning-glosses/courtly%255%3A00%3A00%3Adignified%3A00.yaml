simpleMeaning: polished and grand in how a person acts or looks, fit for a king or queen's home
scope: 'Also called formal and stately: polished and grand in how a person acts or looks, not plain, rough,
  or common.'
examples:
- The courtly gentleman bowed and spoke in a calm, polite way.
- She had a courtly manner, grand and polished, as she met the guests.
