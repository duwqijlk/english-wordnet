simpleMeaning: a person who is clever, or who will do dishonest things, and who knows a way around problems
scope: Also called operator, this is a clever or dishonest person who gets past problems, not a person
  who sells sex by walking the streets.
examples:
- As a hustler, he always found a clever way around any problem.
- People trusted the hustler, not knowing he would cheat them if it helped him.
