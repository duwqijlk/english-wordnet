simpleMeaning: the long-run average of a given power of the amounts by which the values of a distribution
  differ from a chosen reference point.
scope: This is the statistical average of a power of deviations, not a particular point in time, not a
  very short time, not the present time, not importance or influence, and not a turning force in physics.
examples:
- The second moment about the mean measures how spread out the values are.
- The first moment about zero is simply the mean.
