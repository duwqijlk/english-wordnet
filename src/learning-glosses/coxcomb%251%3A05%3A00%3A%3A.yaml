simpleMeaning: A cock or hen carries on top of its head a soft red fleshy crest; a bird of the chicken
  family has one too.
scope: The soft red crest on a chicken's head, also called a comb or a cockscomb; not the jester's cap
  and not the vain man.
examples:
- The cock's coxcomb stood bright red in the morning light.
- She stroked the hen, whose coxcomb was small and pale.
