simpleMeaning: showing deep respect for a god, in the heart, in what you do, or in what you say
scope: Deep respect for a god, felt, shown, or put into words, not a show of being good that is only for
  others to see.
examples:
- The pious readings moved the whole church.
- She lived a pious life of prayer and good works.
