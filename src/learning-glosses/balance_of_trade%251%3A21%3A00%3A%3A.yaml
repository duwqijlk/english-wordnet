simpleMeaning: how much more or less a country's goods bought from other countries are worth than the
  goods it sells to other countries over a set time
scope: The gap in worth between what a country buys from abroad and what it sells abroad over a set time,
  not a money worry when one side is far bigger and not a list of what a state owns and owes.
examples:
- A nation's balance of trade is favorable when its exports exceed its imports.
- The balance of trade turned in our favour last year as exports grew.
