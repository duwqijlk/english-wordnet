simpleMeaning: The sum counted for a good or a job once the buyer-paid tax is set aside and the state's
  gift to the seller is counted in.
scope: This is the starting sum for a good or a job, before tax is taken off and the seller's subsidy
  is added on.
examples:
- The basic price stayed the same while the tax on it went up.
- The shop set a basic price for the machine before adding the tax.
