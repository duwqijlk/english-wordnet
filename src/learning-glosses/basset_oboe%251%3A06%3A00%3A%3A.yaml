simpleMeaning: a woodwind instrument that sounds an octave lower than the usual one of its kind
scope: A low woodwind instrument, also called heckelphone; not an ordinary oboe and not a bassoon.
examples:
- The basset oboe sounded an octave below the others.
- He played the basset oboe in the wind band.
