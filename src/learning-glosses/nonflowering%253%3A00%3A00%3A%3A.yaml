simpleMeaning: Said of a plant with no bloom that makes no seeds
scope: 'Also called flowerless: a plant with no bloom that makes no seeds, not a plant that has flowers
  and not the group of plants that grow from spores.'
examples:
- Mosses are nonflowering and grow from spores, not seeds.
- The nonflowering shrub has no blooms in spring.
