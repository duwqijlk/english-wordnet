simpleMeaning: Drugs that hold back calcium salt flow, in nerve signals or the squeeze of the heart's
  smooth muscle, used for chest pain, uneven heartbeat, raised blood pressure, and migraine.
scope: This sense is also called calcium-channel blocker.
examples:
- Calcium blocker treats high blood pressure.
- The doctor gave a calcium blocker for migraine.
