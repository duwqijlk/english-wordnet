simpleMeaning: A barrier of bars set in a zigzag, each bar locked into the next
scope: A barrier of bars set in a zigzag, each bar locked into the next, also called snake-rail fence
  or worm fence; not a straight fence of posts and not a wire fence.
examples:
- The snake fence zigzagged across the meadow.
- He built a snake fence from split rails.
