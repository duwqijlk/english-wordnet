simpleMeaning: a needle pushed into the lower spine draws out fluid, to test it or to treat the patient
scope: Also called lumbar puncture and a spinal puncture; it takes fluid out for tests or treatment, not
  blood from a vein.
examples:
- The spinal tap showed no sign of infection.
- He was nervous before his first spinal tap.
