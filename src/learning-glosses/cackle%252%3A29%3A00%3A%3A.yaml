simpleMeaning: to laugh loudly in a way that is not pleasant to hear
scope: To laugh in a loud, unpleasant way, not to make a hen's cry and not the laugh itself as a thing.
examples:
- The old woman cackled at the boy's mistake.
- He cackled loudly, and everyone turned to look.
