simpleMeaning: one of the small butterflies in the Lycaenidae family, with red-brown wings
scope: This is a small butterfly, not the red-brown colour, not a coin, and not the act of putting a thin
  coat of metal on something.
examples:
- A copper fluttered over the grass, its red-brown wings bright in the sun.
- The children watched a copper rest on a leaf in the garden.
