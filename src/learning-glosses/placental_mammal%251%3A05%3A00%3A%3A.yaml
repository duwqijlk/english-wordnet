simpleMeaning: Animals whose young grow inside the mother, fed through the organ that joins mother and
  young; all of them except the egg-laying kinds and the pouched kinds.
scope: Animals whose young grow inside the mother, fed through the organ that joins mother and young;
  placental, eutherian and eutherian mammal are other names for this sense, not a marsupial and not a
  monotreme.
examples:
- Dogs and whales are placental mammals.
- The placental mammal carries its young inside the body until birth.
