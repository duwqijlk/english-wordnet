simpleMeaning: A stop worked by hand, usually through a set of linked rods or cables.
scope: A stop worked by hand, usually by linked rods, also called an emergency, a hand brake and a parking
  brake; not a foot stop and not an automatic stop.
examples:
- She pulled the emergency brake when the car rolled forward.
- The emergency brake held the truck on the hill.
