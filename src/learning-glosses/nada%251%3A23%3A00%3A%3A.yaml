simpleMeaning: not any thing; no amount or thing at all
scope: Also called nothing, zero, zip, naught, aught, nil, cipher, nix, null, cypher, zilch, goose egg
  and zippo. It means not any thing and no amount at all.
examples:
- We earned nada from the sale, not a single coin.
- He knew nada about the plan before today.
