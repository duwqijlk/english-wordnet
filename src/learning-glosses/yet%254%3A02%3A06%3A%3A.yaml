simpleMeaning: In spite of what has just been said, often used just before adding a fact that goes against
  it.
scope: This is not about whether something has happened by now or whether more may happen later; it introduces
  a contrasting fact despite what came before.
examples:
- He was strict, yet he listened to everyone.
- The plan was costly yet necessary.
