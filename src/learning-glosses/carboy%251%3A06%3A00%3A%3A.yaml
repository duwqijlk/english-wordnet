simpleMeaning: A big bottle for holding liquids that eat into other things, usually packed in a special
  case to keep it safe.
scope: A big bottle for holding liquids that eat into other things, usually packed in a special case,
  not a small medicine bottle and not a barrel.
examples:
- The acid was kept in a glass carboy.
- They packed the carboy in a wooden case.
