simpleMeaning: A beta blocker, a drug that slows the heart, used for high blood pressure, chest pain,
  uneven heartbeat and heart attack; it can cause low mood and worsen heart failure.
scope: A heart drug, also called metoprolol, one beta blocker among others for high blood pressure, chest
  pain, uneven heartbeat and heart attack.
examples:
- Her doctor prescribed Lopressor for her blood pressure.
- He takes Lopressor after his heart attack.
