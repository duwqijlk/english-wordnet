simpleMeaning: to name someone publicly as shameful or infamous.
scope: 'This is a historical, official use: a person''s name is set out in public as shameful, as in old
  military and town notices. It is not simply putting up a notice, and not publishing a message online,
  which is the modern sense most readers will expect. The verb in this sense is now archaic.'
examples:
- The deserter was posted as a coward on the town notice board.
- Sailors who refused duty were posted as traitors and shunned by the crew.
