simpleMeaning: A wrapping in which a thing is sealed between a stiff paper back and a clear plastic front.
scope: A pack in which a thing is sealed between a stiff paper back and a clear plastic front; bubble
  pack is another name for this sense, not a plain box and not a bag.
examples:
- The pills came in a blister pack.
- She opened the blister pack to take out the pills.
