simpleMeaning: a tame kind of animal kept for its long silky hair, which is the true mohair
scope: Also called Angora; a tame kind of animal kept for its long silky hair, which is the true mohair,
  not the wild goats of the hills and not the sheep kept for wool.
examples:
- The Angora goat gives long silky hair for mohair.
- Farmers keep Angora goats for the long silky hair that becomes mohair.
