simpleMeaning: The habit of staying calm and looking as if you do not care, a light and easy lack of care
scope: Staying calm and seeming not to care; indifference is another name for this sense, not true coldness
  and not a lack of feeling.
examples:
- His unconcern about the delay surprised them all.
- She faced the criticism with an unconcern that looked almost like calm.
