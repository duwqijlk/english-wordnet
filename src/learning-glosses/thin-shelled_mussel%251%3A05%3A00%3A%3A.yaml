senseId: 'thin-shelled_mussel%1:05:00::'
synsetId: 01967893-n
simpleMeaning: Only small, half-formed teeth sit where the covers join on this sea animal, whose pair
  of covers is not thick and breaks with ease.
scope: Among the sea animals with two covers, this one is told by covers so thin they break with ease
  and teeth so small they are barely formed.
examples:
- The thin-shelled mussel lay open in the water.
- We found a thin-shelled mussel and handled it with care.
