simpleMeaning: a step taken ahead of time to keep off danger, harm, or hurt that may be coming, or other
  such things
scope: A step taken ahead of time to keep off coming danger or harm — guard and safeguard are other names
  for this sense — not just being careful in general.
examples:
- He put an ice pack on the injury as a precaution.
- An insurance policy is a good precaution against a fire.
