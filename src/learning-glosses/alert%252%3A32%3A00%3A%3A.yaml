simpleMeaning: To tell a person about danger so they notice it, and to get them ready to act
scope: Also called alarm, this is to tell a person about danger and get them ready, not a sign that goes
  off by itself, and not a state of being watchful.
examples:
- We alerted the new neighbors to the high rate of burglaries.
- The guard alerted the camp when he saw smoke in the trees.
