simpleMeaning: A drug for the heart, sold as Quinidex and Quinora, used to treat some kinds of a heart
  that beats out of time
scope: A drug for the heart, not a drug for worms or for malaria, and not a drug that stops pain.
examples:
- The doctor gave her quinidine to steady her heartbeat.
- Quinidine, sold as Quinidex, helped his heart beat in a steady way.
