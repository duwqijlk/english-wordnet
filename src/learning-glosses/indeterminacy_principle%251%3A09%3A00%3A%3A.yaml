senseId: 'indeterminacy_principle%1:09:00::'
synsetId: 06117686-n
simpleMeaning: In quantum theory, you cannot measure both a thing's energy and time, or where it is and
  how fast it moves, with full exactness at once
scope: A rule of quantum theory about what cannot be measured at once; not a claim that things have no
  set place or speed, and not a rule about measuring one thing alone.
examples:
- The indeterminacy principle says we cannot know both where a particle is and how fast it moves.
- The indeterminacy principle limits how exactly energy and time can be measured together.
