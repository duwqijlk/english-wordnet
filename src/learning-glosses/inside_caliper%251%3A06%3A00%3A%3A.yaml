simpleMeaning: A measuring tool for the size of a hole or hollow space, whose leg ends bend out.
scope: A measuring tool for the size of a hole or hollow space, whose leg ends bend out; not a tool for
  the outside of a thing and not a plain ruler.
examples:
- He used an inside caliper to size the hole.
- The inside caliper showed the hollow was two inches wide.
