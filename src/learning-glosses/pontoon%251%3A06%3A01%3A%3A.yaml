simpleMeaning: In nautical use, a flat thing that floats, like a boat with a flat bottom, used as a dock
  or to hold up a bridge
scope: A floating support used as a dock or under a bridge, not a boat for travel and not the bridge itself.
examples:
- Workers stood on a pontoon while they fixed the side of the bridge.
- The small boats were tied to a pontoon at the edge of the harbour.
