simpleMeaning: The back part of the front brain, which joins the two halves of the brain to the midbrain.
scope: The back part of the front brain, which joins the two halves of the brain to the midbrain, also
  called betweenbrain and diencephalon; not the front brain itself and not the back brain.
examples:
- The interbrain joins the two halves of the brain.
- Signals pass through the interbrain to the midbrain.
