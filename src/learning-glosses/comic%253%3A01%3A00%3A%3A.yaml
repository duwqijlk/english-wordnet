simpleMeaning: to do with works, such as plays, stories, shows or acts, that are made to make people laugh,
  or like such works in style
scope: Of or typical of comedy as a kind, not a person who tells jokes for work, and not just funny in
  itself.
examples:
- He is known for his comic plays.
- She wrote a comic opera about a foolish king.
