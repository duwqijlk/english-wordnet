simpleMeaning: one flat part of a wheel that is turned by water or that pushes a boat through water
scope: One flat part of a boat wheel or a water wheel, not the hand-held oar used in a canoe and not the
  small bat used to hit balls in games.
examples:
- One paddle of the old water wheel was broken and had to be fixed.
- The boat moved slowly because a paddle on its wheel had come loose.
