simpleMeaning: To show a film or image on a large flat surface so an audience can watch it.
scope: This is showing a film or image to viewers, not the flat surface it appears on and not testing
  people or things to judge them.
examples:
- The festival will screen three new documentaries this weekend.
- They screened the film for a small audience of friends.
