simpleMeaning: not sure how it will end, and especially full of risk
scope: 'Also called dodgy and chancy: this describes something that may end badly and is full of risk,
  not something that is safe and sure.'
examples:
- The road was icy and the drive home looked dicey.
- Putting all his money into one new company is a dicey choice.
