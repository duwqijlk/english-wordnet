simpleMeaning: a tall upright stone of great size, found mostly in England and northern France
scope: A tall upright stone of great size, found mostly in England and northern France; standing stone
  is another name for this sense, not a grave stone, and not a pile of stones.
examples:
- A lone menhir stood upright on the hill, taller than a man.
- Menhirs are found mostly in England and northern France.
