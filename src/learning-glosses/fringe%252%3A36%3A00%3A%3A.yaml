simpleMeaning: to make something look nicer by adding a border of short hanging threads to its edge
scope: Adding a border of short hanging threads to something; not the border itself, not the bands of
  light made when light bends and mixes, and not decorating something with, or as if with, a border around
  it.
examples:
- The weaver fringed the edge of the scarf with white threads.
- She fringed the curtain to make it look prettier.
