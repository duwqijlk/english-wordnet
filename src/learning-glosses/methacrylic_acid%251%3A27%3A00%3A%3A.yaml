simpleMeaning: Used to make resins and plastics, this sharp chemical, C4H6O2, has spare links to join
  to other bits.
scope: Also called 2-methylpropenoic acid, this chemical is used to make resins and plastics, not a finished
  plastic itself.
examples:
- Methacrylic acid joins to other bits to make resins and plastics.
- Resins and plastics are made with methacrylic acid.
