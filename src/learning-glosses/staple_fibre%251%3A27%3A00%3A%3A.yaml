simpleMeaning: Twisting turns a natural strand of raw cotton, wool, hemp, or flax into yarn.
scope: Also called staple and staple fiber, this is a natural strand twisted into yarn; it is not a man-made
  strand.
examples:
- Staple fibres vary widely in length.
- The staple fibre in the basket was raw cotton.
