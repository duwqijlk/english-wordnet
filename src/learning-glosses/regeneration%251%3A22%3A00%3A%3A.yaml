simpleMeaning: In biology, the way a living thing grows new body material or a new body part to take the
  place of one that was lost or destroyed
scope: This is about a living thing growing back a lost body part. It is not the general act of making
  something new and better again, and not a signal in a machine that makes an input stronger.
examples:
- Regeneration lets a lizard grow a new tail after it loses one.
- Scientists study regeneration in animals that can grow back a leg.
