simpleMeaning: to damage a crop such as corn with a black plant disease, or with mildew (a white or grey
  growth on plants)
scope: This verb is about a crop being harmed by plant disease; not the plant disease as a thing, not
  staining something with soot, and not rude words or sexual material.
examples:
- Wet weather smutted the corn crop that year.
- The black disease began to smut the young corn plants.
