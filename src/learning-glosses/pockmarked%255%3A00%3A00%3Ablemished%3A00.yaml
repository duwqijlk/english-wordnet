simpleMeaning: Having skin marks made by smallpox, acne, or a like disease that comes out in spots, or
  marks that only look like them
scope: 'Also called pocked: this is skin marked by a disease that comes out in spots, or skin that only
  looks that way. Not holes in a paved road or street.'
examples:
- His pockmarked face showed the marks of the disease he had as a child.
- She put cream on her pockmarked skin.
