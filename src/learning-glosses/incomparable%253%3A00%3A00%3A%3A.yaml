simpleMeaning: so unlike other things, or with so few points in common, that things cannot be judged against
  each other
scope: This means things cannot be judged against each other because they share too little; it is not
  just saying that a thing is very good or a bit different.
examples:
- The two reports are incomparable because they break down the data in different ways.
- These two sets of numbers are incomparable, as they were collected in wholly different ways.
