simpleMeaning: a small cap that fits close to the head; in the past it was worn by schoolboys and by students
  in their first year at college
scope: 'Also called beany: this small close cap was worn in the past by schoolboys and new college students,
  not a hat with a wide brim.'
examples:
- In the old photo, every schoolboy wears a beanie.
- Students in their first year once had to wear a beanie on campus.
