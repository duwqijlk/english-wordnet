simpleMeaning: to set going the kind of activity that the named thing naturally allows, such as lighting
  a fire or getting a car's engine running.
scope: This sense is not for something that begins on its own, not the act of beginning in general, and
  not a marked line; here the object decides which activity is set going.
examples:
- He started a fire in the fireplace.
- She started the car and drove away.
