senseId: 'cauterisation%1:04:00::'
synsetId: 00669355-n
simpleMeaning: The act of making blood clot and killing tissue with a hot iron, a burning chemical, or
  by freezing.
scope: The act of sealing blood and killing tissue with heat, chemicals or cold; cauterization and cautery
  are other names for this sense.
examples:
- Cauterisation stopped the bleeding after the wound was cleaned.
- The surgeon used cauterisation to seal the small blood vessels.
