simpleMeaning: The act of changing or tuning by due measure and share, as for art's sake.
scope: The act of changing or tuning by due measure and share, as for art's sake; not, in electronics,
  the sending of a signal by using it to change a carrier wave, changing its loudness, pitch, or phase,
  nor a way of speaking in which the loudness, pitch, or tone of the voice is changed.
examples:
- Their modulation shaped the tune.
- The modulation was heard at dawn.
