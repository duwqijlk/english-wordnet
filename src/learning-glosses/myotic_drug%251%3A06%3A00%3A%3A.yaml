simpleMeaning: A person takes this medicine, and the black opening in the middle of the eye grows smaller
scope: 'Also called miotic, miotic drug or myotic: a medicine that makes the black opening in the middle
  of the eye grow smaller, not a medicine that makes it grow wider and not a word used of a thing that
  has to do with the shrinking.'
examples:
- The doctor gave him a myotic drug to make his pupils smaller.
- She put the myotic drug in her eye each night.
