simpleMeaning: a machine that can be put under water, made for taking small amounts of underground water
  and for drawing it up
scope: This is a machine that can be put under water to draw up underground water, also called groundwater
  pump; not a machine that stays on dry land and not a machine for moving water in a house.
examples:
- The submersible groundwater pump sat below the water in the well.
- They lowered a submersible groundwater pump to take samples.
