simpleMeaning: In mathematics, two bent lines or faces that touch at one point and share the same straight
  line that just touches them there
scope: In mathematics, two curves or surfaces that meet and share one tangent line, not a kiss and not
  two lines that cross.
examples:
- The two curves show osculation at the point where they share a tangent.
- Osculation of the two surfaces means they touch and share one tangent line.
