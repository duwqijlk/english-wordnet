simpleMeaning: a set of linked parts that sends pictures of still or moving things from one far place
  to another
scope: 'Also called television: the whole set of parts that sends pictures, not the TV set in a house
  and not a radio set that sends only sound.'
examples:
- The new television system sent clear pictures across the country.
- Engineers tested the television system before the first broadcast.
