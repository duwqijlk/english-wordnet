simpleMeaning: In sports, a return hit with the palm of the hand facing the way the ball goes, as in tennis,
  badminton or squash
scope: This is a return hit with the palm facing the way the ball goes; forehand and forehand shot are
  other names for it, not a backhand hit with the back of the hand facing forward.
examples:
- His forehand stroke landed deep in the corner.
- She won the rally with a strong forehand stroke.
