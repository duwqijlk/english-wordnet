simpleMeaning: To send out long, loud sounds with the voice.
scope: Long, loud wordless cries, not an animal's natural call, not the noise made by wind, water or vehicles,
  and not words shouted with force.
examples:
- She roared with grief when she heard the news.
- The injured climber roared in pain as they lifted him.
