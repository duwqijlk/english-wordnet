simpleMeaning: A mind-changing substance that makes a person see or hear things that are not there, or
  feel things in a changed way.
scope: This is a mind-changing substance that makes a person see or hear things that are not there, not
  a sleeping pill; also called hallucinogen and psychedelic drug.
examples:
- The hallucinogenic drug made him see bright shapes.
- After taking the hallucinogenic drug, she heard music that was not there.
