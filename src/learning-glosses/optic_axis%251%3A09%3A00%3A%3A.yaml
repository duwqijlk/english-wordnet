simpleMeaning: A straight line through the middle of the curve of a lens, along which light goes straight
  through without bending or bouncing back
scope: A line through a lens where light goes straight, not the line in a crystal where light does not
  split in two.
examples:
- In a normal eye the optic axis is the line along which things are seen most clearly.
- Light that runs along the optic axis is not bent by the lens.
