simpleMeaning: The very old peoples who lived on the islands in the sea east of Greece and in the lands
  around it.
scope: 'Also called Aegean civilisation and Aegean civilization: the very old peoples on the islands in
  the sea east of Greece and in the lands around it, not the peoples of today and not the sea itself.'
examples:
- Aegean culture left fine pots and wall paintings.
- The Aegean culture spread across the islands.
