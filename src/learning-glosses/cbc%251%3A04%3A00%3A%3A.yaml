simpleMeaning: A blood test that counts the white cells, the red cells, and the platelets in each cubic
  millimeter of blood.
scope: This is a blood test that counts the white cells, the red cells, and the platelets in each cubic
  millimeter of blood, also called blood profile and complete blood count, and not a test of one kind
  of cell alone.
examples:
- The doctor asked for a CBC to check her blood.
- His CBC showed too few red cells.
