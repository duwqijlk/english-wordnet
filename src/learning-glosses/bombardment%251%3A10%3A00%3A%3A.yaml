schema: oewn-learning-gloss-v2
senseId: 'bombardment%1:10:00::'
synsetId: 07097633-n
simpleMeaning: a lot of words sent or said very fast, one after another, without a stop, in speech or
  in writing
scope: This is many words coming fast without a stop, also called onslaught, barrage, and outpouring;
  it is not hitting a thing or body with tiny fast bits.
examples:
- After the news, she faced a bombardment of questions from reporters.
- He got a bombardment of letters complaining about the plan.
