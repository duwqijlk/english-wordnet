simpleMeaning: a tall woody plant with seeds and young seeds held inside a closed case
scope: 'Also called an angiospermous tree: a tall woody plant with seeds and young seeds in a closed case,
  not a pine or other cone-bearing plant and not a small bush.'
examples:
- The apple is a flowering tree whose seeds grow inside the fruit.
- A flowering tree keeps its seeds safe inside a closed case until they are ripe.
