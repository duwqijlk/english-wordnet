simpleMeaning: Fine leaves that branch out like the fingers of a hand mark one of many kinds of fern,
  small or large, that grow on land in the group Adiantum
scope: It is also called maidenhair fern, and it names one of many land ferns of the group Adiantum.
examples:
- Maidenhair grows on land, in small and large kinds.
- The maidenhair fern's fine leaves branched like the fingers of a hand.
