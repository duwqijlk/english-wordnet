simpleMeaning: The piece of hard stone that makes the spark to fire an old weapon.
scope: The piece of hard stone that makes the spark to fire an old weapon, not the chemical used in paints
  and explosives and not the part of a gun that you hold.
examples:
- He fitted a new gunflint into the old weapon.
- The gunflint struck and made the spark that fired the shot.
