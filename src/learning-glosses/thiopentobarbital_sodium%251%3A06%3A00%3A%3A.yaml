simpleMeaning: A barbiturate powder that loves water, sold as Pentothal; a strong barbiturate that acts
  fast, making for a loose, easy state when given by needle to deaden the whole body.
scope: This sense is also called thiopental and thiopental sodium.
examples:
- Thiopentobarbital sodium works fast.
- A thiopentobarbital sodium dose relaxed them.
