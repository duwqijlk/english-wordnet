simpleMeaning: In golf, to take a stance and line up the club for a shot before swinging.
scope: This is the golfer's action of getting into position and aiming the club at the ball before a swing,
  not the stance itself as a noun, and not mail delivery details, a house sign, the place where a person
  or organization can be reached, a formal speech, a way of speaking to someone, tact, computer storage
  code, speaking to someone, giving a speech, writing mail details on an envelope, directing a question
  at someone, applying oneself to a task, locating data by a code, or treating a subject in speech, writing,
  or art.
examples:
- Anna addressed the ball, took one last look at the flag, and swung.
- Before every drive he takes a few seconds to address the ball.
