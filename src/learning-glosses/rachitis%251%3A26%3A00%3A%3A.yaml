simpleMeaning: A childhood sickness from too little vitamin D and sun, when the body cannot use calcium
  and phosphorus well.
scope: Also called rickets; a childhood sickness from too little vitamin D and sun, not a sickness of
  grown people.
examples:
- The child had rachitis from too little sun and vitamin D.
- Rachitis comes from too little sun and vitamin D in a young child.
