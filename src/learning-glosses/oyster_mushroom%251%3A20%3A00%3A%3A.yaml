simpleMeaning: a soft grey-capped fungus that can be eaten, growing in flat layers on dead wood
scope: A soft grey-capped fungus that can be eaten, growing in flat layers on dead wood; oyster agaric
  and oyster fungus are other names for this sense, and it is not a poisonous fungus or a fungus that
  grows on the ground.
examples:
- The oyster mushroom grows in flat layers on a dead log.
- She cooked the oyster mushroom she had picked.
