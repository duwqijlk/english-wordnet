simpleMeaning: More or fewer tiny charged bits flow through a glass tube with no air in it when this metal
  part, set between the two ends, lets them pass.
scope: Also called a grid, this metal part set between the two ends inside a glass tube with no air in
  it lets more or fewer tiny charged bits flow through, not the tube itself.
examples:
- The old radio's control grid had worn thin.
- He replaced the control grid in the glass tube.
