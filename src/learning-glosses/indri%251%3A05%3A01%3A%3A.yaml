simpleMeaning: Of Madagascar, this big animal of the lemur kind has a short tail and thick soft fur in
  black, white, and light brown.
scope: This big short-tailed animal of Madagascar, of the lemur kind, is also called indris, and it is
  not a long-tailed kind of lemur.
