scope: A grey Japanese honeysuckle shrub with paired flowers, also called Morrow's honeysuckle; not a
  garden rose and not a wild lilac.
examples:
- Lonicera morrowii grows in the gardens of Japan.
- The paired flowers of Lonicera morrowii turn yellow as they age.
