simpleMeaning: A fungus with a top that turns to dark liquid once its dust-like seeds have grown ripe.
scope: A fungus with a top that turns to dark liquid once its dust-like seeds have grown ripe, also called
  inky-cap mushroom; not a fungus with a firm top and not a fungus that stays whole when old.
examples:
- The inky cap melted into dark liquid by morning.
- By dawn, the inky cap had turned to dark liquid on the grass.
