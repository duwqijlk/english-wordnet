senseId: 'border%1:06:01::'
synsetId: 03785780-n
simpleMeaning: A decorative band on an edge that is either sunk into the surface or raised above it.
scope: This is ornamental trim cut into or standing out from an edge, not the plain outer band of a thing
  and not the act of adding an edge.
examples:
- The picture frame has a carved border set back from its outer edge.
- The old chest features a raised border along the lid.
