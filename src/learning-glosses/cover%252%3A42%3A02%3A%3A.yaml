simpleMeaning: to include something within the range of a wider subject, group, or area of control
scope: Not to deal with a subject in a book, speech, or film, and not to take another person's place.
examples:
- The new safety rules cover part-time workers as well as full-time staff.
- The survey covers every household in the district.
