simpleMeaning: a person who works in a mill, especially one where grain is ground into flour
scope: This is a person who works in a mill, especially a grain mill; it is not a machine for cutting
  metal and not a moth with powdery wings.
examples:
- The miller ground the wheat into flour for the village.
- We bought a sack of flour from the miller by the river.
