simpleMeaning: strong wire with sharp points set at regular spaces along it, used to block the way through
scope: Strong wire with sharp points, used to block a way through. Not plain smooth wire, and not one
  sharp point on a plant.
examples:
- They put barbwire around the field to keep the cattle in.
- He cut his hand on the barbwire at the top of the fence.
