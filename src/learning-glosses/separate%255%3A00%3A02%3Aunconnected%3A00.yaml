simpleMeaning: Whatever linked the parts has given way, so they are no longer joined as one.
scope: This describes things whose link has been broken, not something that was never joined or that merely
  stands alone without support.
examples:
- Once the cable was pulled out, the two units were completely separate.
- The halves are separate now that the glue has failed.
