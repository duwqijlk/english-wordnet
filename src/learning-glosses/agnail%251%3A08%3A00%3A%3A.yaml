simpleMeaning: a loose narrow strip of skin by the base of a fingernail; tearing it makes a sore that
  hurts and catches germs fast
scope: Also called hangnail; a loose strip of skin by a fingernail, not a cut and not a wart.
examples:
- She caught her agnail on her sleeve and it tore.
- An agnail can turn into a sore if you pull at it.
