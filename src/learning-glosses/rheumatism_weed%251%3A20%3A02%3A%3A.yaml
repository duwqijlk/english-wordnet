simpleMeaning: Native Americans made rope from the tough fibre this Canadian dogbane gives, and folk cures
  for aching or swollen joints use it too.
scope: A Canadian dogbane that gives tough fibre for rope and is used in folk cures for aching or swollen
  joints, not the North American plant with pale pink flowers of the other sense.
examples:
- Native Americans made rope from the tough fibre of rheumatism weed.
- Folk healers used rheumatism weed for swollen joints.
