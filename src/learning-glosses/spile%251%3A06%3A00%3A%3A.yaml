simpleMeaning: a plug that closes a hole in a barrel or flask
scope: Also called bung, this is a plug for a barrel or flask hole, not the long post driven into the
  ground to hold up a building.
examples:
- He pushed a spile into the hole to close the barrel.
- The spile stopped the liquid from leaking out of the flask.
