simpleMeaning: In many fish, a pouch full of gas beside the backbone lets the fish hold its depth in the
  water, neither sinking nor rising.
scope: This gas-filled pouch beside the backbone is also called a float or a swim bladder.
examples:
- The fish filled its air bladder to rise toward the surface.
- When the air bladder was hurt, the fish could not hold its depth.
