synsetId: 05357609-n
simpleMeaning: a blood tube that starts at the celiac trunk, a large blood tube in the belly, and carries
  blood to the spleen
scope: This blood tube feeds the spleen; it is also called the splenic artery or arteria lienalis, not
  the trunk it starts from in the belly and not the tube that feeds the liver.
examples:
- The lienal artery was blocked, so blood could not reach her spleen.
- Surgeons tied off the lienal artery during the operation.
