simpleMeaning: a mechanical part of a camera that opens and closes to control how long light is let in
  to make a photo
scope: This is the part in a camera that opens and closes to let light in for a photo, not the act of
  closing window covers with shutters.
examples:
- The shutter clicked as she took the photo.
- A fast shutter helped him get a clear photo of the moving car.
