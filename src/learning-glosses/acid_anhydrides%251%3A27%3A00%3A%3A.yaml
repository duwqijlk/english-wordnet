synsetId: 14832787-n
simpleMeaning: substances made from carbon that join with water to make a sour substance
scope: Also called acyl anhydrides; these are carbon-based substances that join with water to make a sour
  substance, not the sour substances themselves and not a mix of water and a sour substance.
examples:
- The acid anhydrides in the flask joined with water and formed a sour liquid.
- He added water to the acid anhydrides to make the sour substance he needed.
