senseId: 'cosmogenic%3:01:00::'
synsetId: 02714174-a
simpleMeaning: About the start, past, build and motion of the universe, as studied by the branch of star
  study
scope: This word is used of the branch of star study that deals with how the universe began, its past,
  its build and its motion; cosmogonic, cosmogonical, cosmologic and cosmological are other names for
  this sense.
examples:
- The cosmogenic theory tries to explain how the universe began.
- She read a cosmogenic account of the early universe.
