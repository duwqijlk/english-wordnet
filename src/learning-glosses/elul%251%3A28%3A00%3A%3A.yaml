simpleMeaning: The month that is twelfth in the civil year and sixth in the church year of the Jewish
  calendar, falling in August and September.
scope: Also called Ellul; the twelfth month of the civil year but only the sixth month of the church year
  in the Jewish calendar, in August and September.
examples:
- Elul falls in August and September.
- They marked Elul on the Jewish calendar.
