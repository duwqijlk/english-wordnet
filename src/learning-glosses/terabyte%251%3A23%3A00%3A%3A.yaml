synsetId: 13650943-n
simpleMeaning: A measure of computer information, equal to 1,024 gibibytes, which is 2 to the power 40,
  or 1,099,511,627,776 bytes.
scope: A measure of computer information, 1,024 gibibytes, not the 1,000-gigabyte measure of the same
  name.
examples:
- The drive holds one terabyte of films.
- A terabyte of data took hours to copy.
