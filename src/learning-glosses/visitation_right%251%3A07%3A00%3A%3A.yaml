simpleMeaning: a court's permission for a parent or other family member who does not have care of a child
  to see the child at set times
scope: A court order that lets a parent without custody see their child on a regular basis, not a right
  to take the child home and not a right to decide where the child lives.
examples:
- After the divorce, the father was given a visitation right to see his daughter every weekend.
- Her visitation right lets her visit her son on Wednesday evenings.
