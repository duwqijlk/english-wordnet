simpleMeaning: Needing special kinds of food that are hard to give, especially growing only in special
  mixes made by people to grow living things in
scope: 'Also called exacting: this is about living things and the food they need, not about a person who
  is careful about small things or about keeping clean.'
examples:
- These fastidious bacteria grow only in a special liquid in the lab.
- Fastidious plants like this need a very special mix of food to live.
