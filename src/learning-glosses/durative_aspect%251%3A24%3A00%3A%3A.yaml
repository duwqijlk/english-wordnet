simpleMeaning: a form of a verb that shows an action going on for a time
scope: 'Also called durative: a verb form that shows how long an action lasts, not a form that shows when
  it happens and not one that shows it as finished.'
examples:
- In 'she was walking', the durative aspect shows the walk going on.
- The durative aspect of the verb tells us the action lasted a while.
