simpleMeaning: the way someone acts when they are with other people, in how they treat them
scope: 'Also called behavior, conduct, behaviour, demeanor and deportment: this is the way a person acts
  with other people, not one single action that a person does.'
examples:
- Her calm demeanour helped everyone in the room feel at ease.
- He kept a polite demeanour even when he was angry.
