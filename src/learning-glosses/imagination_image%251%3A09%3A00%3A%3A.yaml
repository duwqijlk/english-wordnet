simpleMeaning: A picture in the mind that one makes up by thinking.
scope: A picture in the mind that one makes up by thinking, not a picture seen with the eyes and not a
  picture drawn on paper.
examples:
- She held an imagination image of the house in her mind.
- The imagination image of a calm sea helped him sleep.
