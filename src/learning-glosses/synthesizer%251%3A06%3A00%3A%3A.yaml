simpleMeaning: In music, an electronic instrument, usually played with a keyboard, that makes and changes
  sounds in an electronic way and can copy the sounds of many other musical instruments
scope: An electronic music instrument, also called synthesiser; it is not the person sense of the same
  word, a thinker who brings ideas together, and not a plain piano.
examples:
- He played the melody on a synthesizer that sounded like a violin.
- The band uses a synthesizer to make deep electronic sounds.
