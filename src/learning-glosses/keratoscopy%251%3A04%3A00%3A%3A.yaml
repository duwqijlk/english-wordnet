simpleMeaning: An examination of the clear front of the eye with a special tool, to find uneven places
  on its front surface.
scope: This is an examination of the clear front of the eye with a special tool, to find uneven places
  on its front surface, not the tool itself and not a routine sight test.
examples:
- Keratoscopy showed uneven places on the front of his eye.
- She had keratoscopy to check the shape of her cornea.
