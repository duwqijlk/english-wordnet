simpleMeaning: having a bottom of the kind stated, such as a flat bottom or a round bottom
scope: About a thing that has a bottom of a stated kind. Not about reaching the lowest point, and not
  about a price falling to its lowest level.
examples:
- The flat-bottomed boat sat steady in the water.
- She picked a round-bottomed bowl for the soup.
