simpleMeaning: Used to make man-made resins, this clear liquid made of carbon and hydrogen is taken from
  oil or coal tar.
scope: A clear liquid from oil or coal tar used to make man-made resins, not a gas and not a resin itself.
examples:
- Indene is taken from coal tar in the factory.
- They used indene to make the new resin.
