simpleMeaning: a strong flow of water that turns in a circle, usually made when tides push against each
  other
scope: 'Also called a whirlpool and a vortex: a strong flow of water that turns in a circle in the sea,
  not a storm and not a wild, confused event.'
examples:
- The small boat was pulled into the maelstrom and spun round and round.
- Sailors kept away from the maelstrom, where the sea turned in a strong circle.
