simpleMeaning: to come before something and lead into it, as an opening part
scope: Coming before a thing and leading into it; not playing a piece of music at the start, and not the
  noun senses for an opening piece of music or a thing that comes first.
examples:
- A short speech preluded the main meeting that day.
- Small falls in prices preluded a much bigger crash.
