simpleMeaning: They dig into shores of soft earth and move in great groups, these small silver fish, long
  and thin in shape.
scope: This small silver fish is also called a launce, a sand eel, or a sand launce; it moves in great
  groups and digs into shores of soft earth.
examples:
- A sand lance swam with a great school of its kind.
- A sand lance dug itself into the sand.
