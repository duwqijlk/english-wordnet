simpleMeaning: A sickness one is born with, in which the colon lacks the web of nerves; with little urge
  to pass stools, they pile up and the colon grows very large.
scope: Also called congenital megacolon; a sickness one is born with, in which the colon lacks the web
  of nerves, so stools pile up and the colon grows very large.
examples:
- Hirschsprung's disease left the baby with little urge to pass stools.
- The doctor treated a child with Hirschsprung's disease.
