simpleMeaning: In physics, the basic rule that the total power to do work in a system cut off from the
  outside stays the same even when things change inside it.
scope: Also called first law of thermodynamics and law of conservation of energy; in physics, the rule
  that the total power to do work in a system cut off from the outside stays the same, not a rule about
  matter being made or lost.
examples:
- Conservation of energy explains why the swing keeps moving.
- Conservation of energy means the total stays the same even as heat turns into movement.
