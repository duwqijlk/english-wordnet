simpleMeaning: A drug that calms the body's swelling, sold as Decadron, Dexamethasone Intensol, Hexadrol
  or Oradexon, used to treat allergies or swelling
scope: Also called dexamethasone, Decadron, Dexamethasone Intensol, Hexadrol and Oradexon, it is a drug
  that treats allergies and swelling, standing apart from other allergy drugs by calming swelling too.
examples:
- The doctor gave her Dexone for her allergy.
- Dexone reduced the swelling in his knee.
