simpleMeaning: A musical instrument with sets of pipes. Air pushed by bellows (a tool that pushes air)
  goes through the pipes, and a large, complex set of keys controls it.
scope: This is the large pipe kind played with keys, not the smaller reed kind, not an electronic copy,
  and not a part inside a body.
examples:
- The organ in the church fills the room with sound from its many pipes.
- She learned to play the organ, using its large set of keys to control the pipes.
