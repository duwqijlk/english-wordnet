simpleMeaning: to adjust something so that it works correctly or meets a standard.
scope: This is not putting something in a place, not preparing things in advance for an event and not
  making a material harden; it is adjusting something to a standard.
examples:
- He set the clock to the correct time.
- The mechanic set the engine timing to the maker's specification.
