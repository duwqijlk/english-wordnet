simpleMeaning: In medicine, fixing a weak part of the backbone by joining two or more of its bones, most
  often by surgery, at times by pulling or holding it still
scope: In medicine, fixing a weak backbone by joining its bones; not the joining of atoms, and not the
  joining of sounds or words, which are other senses of fusion.
examples:
- The surgeon planned a fusion of two bones in her lower back.
- After the fusion, he wore a brace for six weeks.
