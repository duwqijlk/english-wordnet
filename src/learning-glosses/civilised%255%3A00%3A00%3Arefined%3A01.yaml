simpleMeaning: having fine taste and fine ways of behaving, in what a person likes and how a person acts
  with others
scope: 'Also called polite, cultivated, civilized, cultured and genteel: having fine taste and good ways
  with people, not rude or rough in speech or behaviour.'
examples:
- The civilised old lady spoke in a soft, kind way to every guest.
- He has civilised tastes in music and books.
