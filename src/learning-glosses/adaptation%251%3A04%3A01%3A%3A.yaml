simpleMeaning: In the body, how a sense organ, such as the eye, changes itself to fit changing states,
  such as the light
scope: In the body, a sense organ changing itself to fit changing states, not the general process of getting
  used to new conditions.
examples:
- Adaptation of the eye to the dark took several minutes.
- The adaptation of the ear to loud sound protects our hearing.
