simpleMeaning: In business, buying enough shares in a firm to threaten a takeover, so the owners must
  buy them back at a high price to stay in business
scope: A move in business to force a firm to buy back its own shares at a high price; not a real takeover
  and not blackmail.
examples:
- The raider used greenmail to force the firm to buy back its shares.
- The directors paid off the greenmail threat rather than lose the firm.
