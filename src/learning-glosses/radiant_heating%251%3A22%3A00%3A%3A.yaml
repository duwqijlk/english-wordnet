simpleMeaning: Panels holding hot water or electric heaters give off heat that warms a whole building
scope: Warming a building with heat from panels; not warming it with hot air blown through rooms, and
  not warming it with hot-water pipes that heat the air.
examples:
- Radiant heating keeps the floors warm in winter.
- They chose radiant heating for the new hall.
