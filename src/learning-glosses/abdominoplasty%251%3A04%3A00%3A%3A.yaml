simpleMeaning: Loose, wrinkled skin of the belly is cut away and the skin left is pulled tight over the
  stomach, to make the belly look better.
scope: Also called tummy tuck, this operation on the belly cuts away wrinkled skin and pulls what is left
  tight over the stomach.
examples:
- Loose skin over the stomach is tightened by abdominoplasty.
- Wrinkles in the skin of the belly can be cut away by abdominoplasty.
