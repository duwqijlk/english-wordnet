simpleMeaning: a person who moves along a line pulled tight high above the ground, doing tricks as they
  go
scope: 'Also called a ropedancer: a person who does tricks on a high line, not a juggler and not a clown.'
examples:
- The ropewalker crossed the high line without a safety net.
- Crowds cheered as the ropewalker balanced high above the street.
