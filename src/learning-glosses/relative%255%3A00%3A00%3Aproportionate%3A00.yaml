scope: Fitting well with another thing in size, amount, or other things that can be measured, usually
  used with the word to, not a person in the same family and not a word that only means judged by setting
  things against each other.
examples:
- The punishment ought to be relative to the crime.
- Her pay is relative to the hours she works.
