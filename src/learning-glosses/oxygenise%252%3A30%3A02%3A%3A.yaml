simpleMeaning: to add more of the electron-pulling part to a mix, or to raise matter from a lower to a
  higher positive charge by taking electrons away from it
scope: A change in a mix or a bit of matter that shifts its charge, also called oxygenize; not the act
  of burning something and not the act of mixing in oxygen gas.
examples:
- In the lab, they oxygenise the sample to raise its positive charge.
- The teacher showed how to oxygenise an ion by taking electrons away from it.
