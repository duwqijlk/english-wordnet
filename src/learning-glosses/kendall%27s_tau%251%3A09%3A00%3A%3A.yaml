simpleMeaning: This way of judging uses no set numbers, and it shows how much two lists in order agree.
scope: Also called Kendall rank correlation and tau coefficient of correlation; not a way of judging one
  list on its own, and not a measure that uses set numbers.
examples:
- They used Kendall's tau to see how much the two lists agreed.
- Kendall's tau gave a high score when the two rankings matched well.
