senseId: 'index_of_refraction%1:24:00::'
synsetId: 13847141-n
simpleMeaning: A number got by dividing the speed of light in empty space by its speed in some other stuff
scope: A number that tells how much light slows down in a material; not the speed of light itself and
  not the angle at which light bends.
examples:
- Water has an index of refraction of about 1.33.
- The index of refraction of glass is higher than that of air.
