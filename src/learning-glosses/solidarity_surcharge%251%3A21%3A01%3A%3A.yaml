simpleMeaning: a tax set by the government in special times, to pay for work that in theory brings people
  together
scope: A special government tax, also called solidarity tax; not an ordinary tax and not a fine.
examples:
- The government added a solidarity surcharge to pay for the new housing work.
- No solidarity surcharge is levied on small incomes.
