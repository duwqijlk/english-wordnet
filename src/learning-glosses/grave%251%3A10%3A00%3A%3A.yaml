simpleMeaning: a mark put above a vowel, a letter such as a or e, to show how to say that letter
scope: A mark put above a vowel to show how to say that letter. Not a place where a dead body is put,
  and not grave meaning very serious or very bad.
examples:
- In French, the word 'père' has a grave accent over the e.
- The teacher showed us how a grave accent changes the sound.
