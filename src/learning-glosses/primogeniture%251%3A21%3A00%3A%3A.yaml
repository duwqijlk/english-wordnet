simpleMeaning: Only the oldest son in the family can take what is left when a parent dies
scope: Only the oldest son in the family can take what is left when a parent dies; not a share for all
  the children.
examples:
- Under primogeniture, the eldest son took the whole estate.
- Primogeniture meant the younger sons had to find work of their own.
