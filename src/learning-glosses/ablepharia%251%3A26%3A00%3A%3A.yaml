simpleMeaning: born with no eyelids at all, or with only part of the eyelids
scope: A state of being born without eyelids; not an eye injury and not an eyelid that has been cut off.
examples:
- The baby's ablepharia meant her eyes had no lids to protect them.
- Ablepharia left the child with only part of one eyelid.
