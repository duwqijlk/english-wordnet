simpleMeaning: Pain that stays in one place, in the stomach or the belly
scope: Also called a bellyache or stomachache, this is pain felt in the stomach or belly, not a pain in
  the head or back.
examples:
- He stayed home with gastralgia after the rich meal.
- Gastralgia kept her awake most of the night.
