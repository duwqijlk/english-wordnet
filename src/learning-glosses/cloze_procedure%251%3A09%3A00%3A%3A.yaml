simpleMeaning: Words are taken out of a piece of writing for the reader to fill in, and how well the reader
  does this shows how well the reader can read.
scope: Also called a cloze test, this check of reading takes words out of a piece of writing for the reader
  to fill in.
examples:
- The teacher gave the class a cloze procedure to check their reading.
- In the cloze procedure, she filled in the missing words.
