simpleMeaning: using germs or poisons to kill people and animals or to spoil food
scope: 'Also called bioattack, biological attack and biological warfare: using germs or poisons to kill
  people and animals or to spoil food, not an attack with ordinary arms and not a spread of disease by
  chance.'
examples:
- A biologic attack on the city's water supply was feared.
- The army trained to spot a biologic attack before it could spread.
