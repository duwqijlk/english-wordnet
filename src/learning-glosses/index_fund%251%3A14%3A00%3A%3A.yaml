simpleMeaning: A shared pot of money put into the shares that make up a well-known list of shares or bonds.
scope: A shared pot of money put into the shares behind a well-known list, not one share on its own and
  not money kept in a bank.
examples:
- She put her savings in an index fund.
- The index fund follows the main list of shares.
