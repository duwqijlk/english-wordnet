simpleMeaning: A group of words in a poem that belong together and run on from one line to the next with
  no stop in the middle
scope: 'Also called enjambment: in a poem, a group of words that runs on past the end of a line, not a
  line that ends with a full stop and not a break between two separate thoughts.'
examples:
- The enjambement in the first stanza carries the sentence over into the next line.
- She used enjambement to let the thought run on without a pause at the line's end.
