simpleMeaning: A seed from Mexican shrubs in the plant group Sebastiana that holds a moth larva; the larva's
  movements make the seed jerk or tumble.
scope: The seed with a moth larva inside that makes it move, not the Mexican shrub that bears it and not
  the moth itself; jumping seed is another name for the same thing.
examples:
- She put the jumping bean on the table and it began to jerk and tumble.
- A moth larva inside the jumping bean makes it move.
