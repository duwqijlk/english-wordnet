simpleMeaning: The part of the study of crime that deals with running prisons and helping prisoners start
  a new life.
scope: 'Also called penology: the part of the study of crime that deals with prisons, not the study of
  crime as a whole and not the work of the police.'
examples:
- He studied poenology to work in prisons.
- Her course in poenology covered prison reform.
