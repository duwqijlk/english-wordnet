simpleMeaning: a way of eating that needs no chewing, given to people with gut problems
scope: 'Also called pap and soft diet: a way of eating that needs no chewing, not ordinary solid food
  and not a diet for losing weight.'
examples:
- After the operation, he was put on spoon food for a week.
- The doctor said spoon food would be easier on her stomach than solid meals.
