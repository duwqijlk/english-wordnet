simpleMeaning: He lived from seventeen eighty-four to eighteen forty-four, and as an architect in the
  United States he planned and built bridges held up by frames of beams.
scope: An architect from the United States who planned and built bridges held up by frames of beams, also
  called Town; not a town or a bridge.
examples:
- Ithiel Town designed many truss bridges in the United States.
- The truss bridges of Ithiel Town still stand today.
