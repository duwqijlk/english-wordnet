simpleMeaning: to make something take in water; to add water or wetness to it
scope: To add water to something else, not for a thing to take in water and join with it by itself, which
  is another sense of the same word.
examples:
- Please hydrate your skin with this cream each morning.
- Farmers hydrate the dry plants by adding water to the soil.
