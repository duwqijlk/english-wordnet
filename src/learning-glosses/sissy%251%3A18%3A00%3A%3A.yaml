simpleMeaning: a man or boy who people see as childish, afraid, and not strong in what he says or does
scope: Also called pansy and milksop. This names a man or boy seen as weak and childish, not a word for
  seeming like a woman.
examples:
- The other boys called him a sissy because he cried and would not fight back.
- They said Tom was a sissy for being afraid to speak in front of the class.
