simpleMeaning: a clear hard sheet made with flat layers of plastic, resin or other stuff between two clear
  sheets, so it does not break into pieces
scope: A clear hard sheet with flat layers of plastic, resin or other stuff between two clear sheets,
  also called laminated glass and safety glass; not plain window glass and not a plastic sheet alone.
examples:
- The car windows were made of shatterproof glass.
- They put shatterproof glass in the school doors so it would not break into pieces.
