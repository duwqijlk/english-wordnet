simpleMeaning: A count of the money supply, made up of M1 and net time deposits other than large certificates
  of deposit.
scope: Not the narrower count of money known as M1; a count of the money supply that adds net time deposits
  to M1.
examples:
- M2 counts the money supply.
- The bank tracks M2 each month.
