simpleMeaning: a camera glass that bends light sharply, made for taking pictures of things very near
scope: A camera glass that bends light sharply, made for taking pictures of things very near, not a glass
  made for far-off things.
examples:
- She put a closeup lens on the camera to photograph the bee.
- With a closeup lens, the tiny print filled the whole picture.
