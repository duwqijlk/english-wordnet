senseId: 'breach_of_warranty%1:04:00::'
synsetId: 00071035-n
simpleMeaning: A failure to meet a promise about a thing, when the thing does not meet what was promised.
scope: A failure to meet a maker's or seller's promise about a thing; not a breach of trust and not simply
  a faulty product.
examples:
- The cracked screen was a breach of warranty, so the shop replaced the phone.
- She claimed breach of warranty when the new car broke down in a week.
