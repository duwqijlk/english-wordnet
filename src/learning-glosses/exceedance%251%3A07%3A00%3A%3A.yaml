simpleMeaning: During a given length of time, the chance that a quake will shake the ground past a set
  level
scope: This is the chance that ground shaking passes a set level in a given time, not the strength of
  the quake itself.
examples:
- The idea of exceedance can be used for other kinds of risk too.
- The exceedance told them how likely strong shaking was.
