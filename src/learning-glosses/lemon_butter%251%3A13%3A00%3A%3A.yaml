simpleMeaning: Seasoned with the juice of a sour yellow fruit and parsley, clear butter browned bit by
  bit is this.
scope: It is clear butter browned bit by bit and seasoned with the juice of a sour yellow fruit and parsley,
  not plain butter.
examples:
- Lemon butter was poured over the food.
- The lemon butter gave the food the sour taste of the yellow fruit.
