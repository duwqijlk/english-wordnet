simpleMeaning: Stopping or getting rid of the banging sound in a motor that burns fuel
scope: Stopping or getting rid of the banging sound in a motor that burns fuel; antiknocking is another
  name for this sense, not a fuel that burns cleanly and not a quiet motor.
examples:
- Antiknock fuel stops the engine from knocking.
- The antiknock additive made the old motor run smooth.
