simpleMeaning: Force and threats are what this female person uses to push others around, and she is paid
  to guard a person
scope: 'Also called a muscle woman: a female person hired to use force or to guard someone, not a strong
  woman in sport and not a man hired for the same work.'
examples:
- The club hired a musclewoman to keep trouble out of the door.
- As a musclewoman, she guarded the singer on tour and pushed back the crowd.
