simpleMeaning: with short front legs and strong back legs for walking or running, these meat-eating dinosaurs
  lived from the Triassic to the Cretaceous, one of many kinds
scope: Also called a theropod or a theropod dinosaur, this meat-eater walked or ran on strong back legs.
examples:
- The bird-footed dinosaur ran on its strong hind legs.
- A bird-footed dinosaur hunted smaller animals in the Triassic.
