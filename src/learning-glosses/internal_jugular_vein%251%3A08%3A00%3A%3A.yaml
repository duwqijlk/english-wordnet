simpleMeaning: a blood vessel that carries on from a curved channel in the tough cover of the brain and
  joins the vessel below the collarbone to form a large vessel
scope: A blood vessel deep in the neck that forms a large vessel with the one below the collarbone, not
  the jugular vein nearer the skin and not an artery.
examples:
- The doctor pressed on the internal jugular vein in the patient's neck.
- Blood from the internal jugular vein flows toward the heart.
