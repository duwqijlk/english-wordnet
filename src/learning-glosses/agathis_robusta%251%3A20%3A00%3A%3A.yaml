simpleMeaning: An Australian tree grown for its wood, like a tree called the kauri, but with wood much
  lighter in weight and softer.
scope: 'Also called dundathu pine, queensland kauri, or smooth bark kauri: an Australian tree grown for
  its wood, set apart from the kauri by wood that is much lighter and softer.'
examples:
- Agathis robusta grows in the forests of Australia.
- The wood of Agathis robusta is light and soft.
