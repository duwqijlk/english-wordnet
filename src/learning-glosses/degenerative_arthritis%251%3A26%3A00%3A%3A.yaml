simpleMeaning: A long-term wearing down of the smooth pads in the joints, the most common kind of joint
  illness, that comes usually after middle age
scope: A long-term wearing down of joint pads after middle age; also called degenerative joint disease
  and osteoarthritis, not a sudden joint injury and not a short bout of joint pain.
examples:
- Her degenerative arthritis made her knees ache each morning.
- Degenerative arthritis wore down the joints in his hands.
