simpleMeaning: A short, squat, eatable fungus with a red-brown cap and a white stem; it bears fruit under
  pines in spring.
scope: A short squat eatable fungus with a red-brown cap and white stem, fruiting under pines in spring,
  not a tall thin fungus and not a poisonous one.
examples:
- Suillus albivelatus grew under the pines in spring.
- We found Suillus albivelatus with its red-brown cap and white stalk.
