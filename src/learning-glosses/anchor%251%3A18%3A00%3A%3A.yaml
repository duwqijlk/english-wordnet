simpleMeaning: a television reporter who puts together a show on television, using reports from several
  other reporters
scope: This is a person who puts together a show on television, using reports from several other reporters.
  It is not the metal device that stops a ship from moving, and not the act of fixing a ship in place.
examples:
- The anchor welcomed viewers and then spoke to reporters in three cities.
- She works as the main anchor on the evening news.
