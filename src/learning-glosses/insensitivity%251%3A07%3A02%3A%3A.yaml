simpleMeaning: not being able to respond to changes in how the people around you feel
scope: 'This is about feelings between people: not being able to respond to changes in how others feel,
  not a body part that cannot feel touch.'
examples:
- Her insensitivity meant she did not respond when her friend became sad.
- His insensitivity showed when the team's mood changed and he went on as if nothing was wrong.
