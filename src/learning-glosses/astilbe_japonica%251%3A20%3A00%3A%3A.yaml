simpleMeaning: A Japanese shrub like Spiraea shrubs, widely grown in many kinds for its thick branching
  clusters of flowers in many colours; florists often make it bloom early for Easter.
scope: Also called spiraea and spirea; a Japanese shrub grown for its clusters of flowers, not a shrub
  grown for its leaves and not a shrub grown for its fruit.
examples:
- Astilbe japonica bloomed in the garden in June.
- The florist forced Astilbe japonica for Easter.
