simpleMeaning: To cover food with something sweet, such as a hard coat of sugar
scope: Covering food with something sweet, such as a hard coat of sugar, not the coat for pots and metal
  and not putting a plain coat on a pot.
examples:
- The cook glazed the ham with honey and brown sugar.
- She glazed the cake with a hard sugar coat.
