simpleMeaning: One of two bits of matter that are mirror images of each other but are not the same.
scope: One of two bits of matter that are mirror images of each other but differ, also called an enantiomorph;
  not the pair itself and not a twin.
examples:
- Each enantiomer is the mirror image of the other.
- The drug works only as one enantiomer, not the other.
