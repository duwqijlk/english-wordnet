simpleMeaning: A mix of greasy acids and esters makes this thick yellow oil from animal fleece, which
  goes into some ointments and cosmetics
scope: Also called wool grease and lanolin, this thick yellow oil from animal fleece is used in some ointments
  and cosmetics.
examples:
- This wool fat is used in ointments and cosmetics.
- Wool fat is a thick yellow oil taken from animal fleece.
