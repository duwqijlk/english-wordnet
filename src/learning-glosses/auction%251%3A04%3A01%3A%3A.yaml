simpleMeaning: a kind of the card game bridge in which extra tricks beyond the agreed number count toward
  winning the game, now mostly replaced by contract bridge
scope: A kind of the card game bridge, not a sale where things go to the highest bidder.
examples:
- They played auction bridge at the club before contract bridge took over.
- The old book explains the rules of auction as it was played a century ago.
