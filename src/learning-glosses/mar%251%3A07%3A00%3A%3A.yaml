simpleMeaning: a spot or flaw that makes a thing look worse, most of all on a person's body
scope: 'Also called defect: a spot that spoils how a thing looks, not the act of damaging or ruining something.'
examples:
- A small mar on her cheek showed in every photograph.
- The scratch left a mar on the polished table.
