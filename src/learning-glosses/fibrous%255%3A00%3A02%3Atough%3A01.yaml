simpleMeaning: Made of, or like, thread-like strands, especially the strands used to make rope, such as
  those of jute.
scope: Also called hempen, made of or like thread-like strands, especially those used for rope; not the
  use for meat full of sinews and especially impossible to chew.
examples:
- The stalk was fibrous, full of strands fit for rope.
- The cloth felt fibrous and rough to the touch.
