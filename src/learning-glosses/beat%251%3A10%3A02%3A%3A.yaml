simpleMeaning: In poetry, the emphasis placed on one syllable within a metrical foot.
scope: This is the stressed position in a line of verse, not the basic rhythmic unit of a piece of music,
  not the heartbeat, not a stroke or blow, not the sound of a stroke or blow, not a regular rate of repetition,
  not the physics pulsation produced by two waves, not a member of the beat generation, not a sentry's
  regular route, not the act of sailing close to the wind, and not the verb senses meaning to hit, defeat,
  stir, move rhythmically, or sail.
examples:
- The student marked the beat in every foot of the opening line.
- In this metre, the beat falls on the second syllable of each foot.
