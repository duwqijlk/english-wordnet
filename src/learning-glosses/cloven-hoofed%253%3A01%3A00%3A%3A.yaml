simpleMeaning: having to do with the split feet of animals that chew cud or of pigs
scope: 'Another name for this sense is cloven-footed: it describes the split feet of cud-chewing animals
  or pigs, not a single solid hoof and not a foot with no split.'
examples:
- The cloven-hoofed deer crossed the field at dawn.
- We saw a cloven-hoofed cow near the fence.
