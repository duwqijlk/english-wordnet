simpleMeaning: The thick white fluid, holding sperm (the cells that can join with an egg to make a baby),
  that a man's body pushes out
scope: The fluid from a man's body, also called come, seed, cum, ejaculate and seminal fluid, not just
  the sperm cells inside it.
examples:
- The test checked the semen for sperm.
- Semen is the fluid that carries sperm out of a man's body.
