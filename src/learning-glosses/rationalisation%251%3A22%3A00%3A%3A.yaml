simpleMeaning: In mind science, a guard by which your true drive is hid, by telling your deeds and feelings
  in a way that does not threaten.
scope: In mind science, a guard by which your true drive is hid, by telling your deeds and feelings in
  a way that does not threaten; also called rationalization; not, in maths, the plain-making of a sum
  or equation by taking out roots, with no change to its worth or its roots, nor orderly setting-out,
  the act of setting a thing out by a system or a reason.
examples:
- Their rationalisation hid the drive.
- The rationalisation was plain in the test.
