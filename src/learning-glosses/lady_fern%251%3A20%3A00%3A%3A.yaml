simpleMeaning: The plant of the genus Athyrium grown more than any other of its kind, for its fine, delicate
  leaves
scope: This is the plant of the genus Athyrium grown more than any other of its kind, for its fine, delicate
  leaves, not a tree fern and not a garden flower.
examples:
- Lady fern lined the shady path with fine green leaves.
- She planted lady fern under the trees for its delicate leaves.
