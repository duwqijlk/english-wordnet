senseId: 'good_continuation%1:09:00::'
synsetId: 06260338-n
simpleMeaning: In Gestalt thought, a rule for how we group what we see, that we by nature tend to see
  a line as going on in the way it has started
scope: A Gestalt rule that we tend to see a line as going on in the way it has started; also called continuation
  and law of continuation, not a rule about colour and not a rule about size.
examples:
- Good continuation makes us see the broken line as one line.
- In the picture, good continuation joins the two parts of the curve.
