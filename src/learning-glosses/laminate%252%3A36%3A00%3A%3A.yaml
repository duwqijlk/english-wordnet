simpleMeaning: to make a flat sheet by joining sheets of material together with something that makes them
  stick
scope: To make a layered sheet by joining sheets together, not the sheet itself and not just covering
  a thing with a thin sheet.
examples:
- The workers laminate thin sheets of plastic to form a hard panel.
- We laminate the layers together before cutting them to size.
