simpleMeaning: The cup and the petals of a flower, taken together, get this name when they close round
  the parts that make seeds
scope: 'Also called floral envelope, perianth, perigone, and perigonium: the outer parts of a flower taken
  together, not the petals alone.'
examples:
- The chlamys is the flower's outer covering.
- In the chlamys, the cup and the petals hide the seed-making parts.
