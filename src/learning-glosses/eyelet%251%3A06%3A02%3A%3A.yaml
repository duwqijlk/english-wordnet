simpleMeaning: Cloth cut with small holes whose edges are sewn fine, set out to make a pretty pattern.
scope: Cloth cut with small sewn holes that make a pretty pattern, not a small hole itself and not the
  metal ring that lines one.
examples:
- Her white blouse was trimmed with eyelet.
- The eyelet around the collar made a pretty pattern.
