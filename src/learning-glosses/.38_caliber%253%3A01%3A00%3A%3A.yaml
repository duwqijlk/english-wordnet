simpleMeaning: telling the size of a gun, or the shot it fires, by the hole down its barrel, a little
  more than three eighths of an inch wide
scope: It is also called .38-caliber, .38-calibre, and .38 calibre, and it tells the size of a gun or
  its shot by the hole down its barrel, a little more than three eighths of an inch wide, not of one with
  a narrower bore.
examples:
- He loaded a .38 caliber shell.
- She held a .38 caliber pistol.
