simpleMeaning: On paper held by a turning drum, a pen draws a steady record, as of breathing or blood
  pressure, in this science tool.
scope: Also called cymograph, it is a science tool whose turning drum holds paper for a pen to draw a
  steady record on.
examples:
- The kymograph traced her breathing on paper.
- A kymograph recorded the patient's blood pressure.
