simpleMeaning: To move, or to make something move, freely inside a fixed area or range.
scope: This is not producing recorded sound, not pretending to be a character and not behaving carelessly;
  it is free movement inside a set space.
examples:
- The rope played through the pulley as the sail swung round.
- Check that the chain can play freely inside its guard.
