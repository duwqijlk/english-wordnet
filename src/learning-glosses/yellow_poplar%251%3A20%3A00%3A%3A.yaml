simpleMeaning: A tall North American tree that sheds its leaves, with big greenish-yellow cup-shaped flowers
  and cone-like fruit; its soft white wood is mainly used for making cabinets.
scope: This is the tree, another name for the tulip tree, not the light easily worked wood that is also
  called yellow poplar.
examples:
- A yellow poplar grew beside the barn, shading the whole yard.
- Yellow poplars are common in the forests of eastern North America.
