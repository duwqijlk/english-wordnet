simpleMeaning: a short-lived state of being drunk after drinking too much alcohol
scope: A short-lived state of drunkenness after too much drink, also called drunkenness, intoxication,
  inebriation or inebriety; not lasting alcoholism and not simply feeling unwell.
examples:
- His insobriety after the party made him stumble on the stairs.
- The judge noted her insobriety at the time of the arrest.
