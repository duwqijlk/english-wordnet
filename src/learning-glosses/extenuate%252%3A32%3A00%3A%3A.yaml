simpleMeaning: To soften how bad a wrong deed looks, or how far it reaches, or to try to do so.
scope: Also called mitigate, softening how bad a wrong deed looks or how far it reaches, or trying to
  do so.
examples:
- The lawyer tried to extenuate the crime by pointing to their hard youth.
- The circumstances extenuate the crime, the judge said.
