simpleMeaning: A tree from the East Indies bears yellow berries that are good to eat
scope: A tree from the East Indies with yellow berries that can be eaten, also called langset and lanseh
  tree; not the fruit itself and not another fruit tree.
examples:
- The langsat in our garden bears yellow berries in summer.
- We picked langsats from the tree and ate them.
