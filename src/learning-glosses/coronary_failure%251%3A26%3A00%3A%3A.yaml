simpleMeaning: The heart not being able to pump enough blood to keep the body working as it should.
scope: This is the heart not being able to pump enough blood to keep the body working as it should; heart
  failure is another name for this sense, not a blocked blood tube in the heart and not a heart that has
  stopped.
examples:
- Coronary failure left him short of breath.
- The doctor said coronary failure was why her legs were swollen.
