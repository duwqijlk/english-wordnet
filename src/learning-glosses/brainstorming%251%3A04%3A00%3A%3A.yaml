senseId: 'brainstorming%1:04:00::'
synsetId: 01205767-n
simpleMeaning: a way for a group to solve a problem, where people in the group say their ideas and ways
  to fix it as the ideas come to them
scope: This is a group way to get ideas to solve a problem, not one person thinking alone and not a plan
  that is already fixed.
examples:
- We did some brainstorming in class to find ideas for the school play.
- Brainstorming helped the team think of many ways to sell the new drink.
