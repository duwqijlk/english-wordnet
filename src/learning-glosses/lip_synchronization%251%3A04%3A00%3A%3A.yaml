synsetId: 00912231-n
simpleMeaning: Sound and picture in a film are put together so each sound falls with the move that made
  it, above all the mouth moves matching the words exactly.
scope: 'Also called lip sync, lip synch, and lip synchronisation: the sound of a film fitted to the picture,
  not a film with the sound left out.'
examples:
- The lip synchronization was perfect, and every word matched the speaker's mouth.
- They spent hours fixing the lip synchronization of the dubbed film.
