simpleMeaning: A way of living or talking that has settled into a dull, same-every-day round you cannot
  get out of
scope: A dull daily round you cannot escape, not a cut in a surface, not a hollow in the body, and not
  the act of cutting such a hollow.
examples:
- They fell into a conversational groove after years together.
- His days fell into the same groove of work and sleep.
