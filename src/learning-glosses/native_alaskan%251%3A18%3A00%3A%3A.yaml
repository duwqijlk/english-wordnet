simpleMeaning: A member of one of the first peoples of Alaska, or a person whose family comes from one
  of those peoples
scope: A member of one of the first peoples of Alaska, or a person whose family comes from one of those
  peoples, also called Alaska Native and Alaskan Native, not a person who moved to Alaska and not a member
  of another first people.
examples:
- A Native Alaskan elder welcomed us to the village.
- Native Alaskan artists carve ivory and bone.
