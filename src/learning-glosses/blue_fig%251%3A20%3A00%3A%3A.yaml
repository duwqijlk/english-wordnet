simpleMeaning: White flowers give way to one-seeded shiny sky-coloured fruit on this Australian tree,
  which has hard white wood and shiny green leaves.
scope: Also called quandong, quandong tree, and silver quandong tree, this Australian tree bears white
  flowers and one-seeded shiny sky-coloured fruit, with hard white wood and shiny green leaves, not a
  low bush.
examples:
- We saw blue figs growing in Australia.
- The blue fig's white flowers gave way to shiny sky-coloured fruit.
