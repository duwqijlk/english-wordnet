simpleMeaning: Harmless though it looks like a creature with claws and a curved tail that stings, this
  eight-legged animal has a long thin tail with no sting and no poison.
scope: Also called whip-scorpion, this eight-legged animal only looks like the stinging creature with
  claws; its long thin tail has no sting.
examples:
- The whip scorpion crept across the sand on its eight legs.
- We watched a whip scorpion wave its long thin tail.
