simpleMeaning: an illness in which the young of a tapeworm, a flat worm that lives inside animals, live
  and grow inside the body
scope: An illness in which young tapeworms live and grow inside the body, also called echinococcosis and
  hydatid disease; not an illness from grown tapeworms and not a wound.
examples:
- The scan showed hydatidosis in the sheep's liver.
- Hydatidosis had left cysts in the man's lungs.
