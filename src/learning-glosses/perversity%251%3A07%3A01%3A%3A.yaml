simpleMeaning: behaving badly on purpose and in a firm, set way, not doing what you are told and fighting
  against help or rules
scope: 'Also called contrariness and perverseness: behaving badly on purpose and refusing to be guided,
  not simple anger and not a mistake.'
examples:
- Out of sheer perversity, he refused all help and did the opposite of what he was told.
- Her perversity made her fight every rule, even when the rules were there to help her.
