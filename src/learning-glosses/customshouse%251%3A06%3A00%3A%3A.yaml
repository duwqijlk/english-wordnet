simpleMeaning: a building run by the state where fees on goods brought in from abroad are taken and ships
  are given leave to enter or leave
scope: 'Also called customhouse: a state building where ships are cleared and fees on goods are taken,
  not a warehouse for goods and not a port office that only books ships.'
examples:
- The customshouse was the first stop for every ship that reached the port.
- Traders paid their fees at the customshouse before they could unload.
