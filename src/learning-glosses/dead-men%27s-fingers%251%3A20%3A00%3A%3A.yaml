simpleMeaning: Spores are made and spread by parts of fungi of the kind Xylaria that stick up
scope: The spore-making parts of Xylaria fungi, also called dead-man's-fingers; not the fingers of a dead
  person and not another kind of mushroom.
examples:
- Dead-men's-fingers grew in dark bumps on the fallen log.
- The dead-men's-fingers on the old stump looked like black fingers poking up from the wood.
