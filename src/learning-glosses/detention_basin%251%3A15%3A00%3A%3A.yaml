simpleMeaning: a place to hold water, such as a small lake made by people, that slows water on its way
  down a river
scope: This is a place that holds water back for a time and slows it on its way downstream; not a dam
  that holds water back for good and not a lake that forms on its own.
examples:
- The new detention basin held back the rain water after the storm.
- Water from the detention basin flowed slowly into the river below.
