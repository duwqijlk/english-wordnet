simpleMeaning: Tiny one-celled living things with round bodies and stiff arms that stick out in all directions.
scope: Tiny one-celled living things with round bodies and stiff arms; not a one-celled animal with a
  tail or a jelly-like body with no stiff arms.
examples:
- The heliozoan floated in the pond water, its stiff arms spread out.
- Under the microscope, a heliozoan showed its round body and stiff arms.
