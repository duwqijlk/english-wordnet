simpleMeaning: a flow of electric power through the air, which charges the air around it
scope: A flow of electric power through the air, which charges the air around it; corposant, corona and
  electric glow are other names for this sense, not a flash of lightning, and not a spark from a wire.
examples:
- A faint corona discharge glowed around the wire.
- The corona discharge charged the air near the power line.
