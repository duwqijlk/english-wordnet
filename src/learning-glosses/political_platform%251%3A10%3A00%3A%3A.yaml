simpleMeaning: A paper that sets out the goals and guiding ideas of a political party.
scope: 'Also called platform, program and political program: a paper that sets out what a party group
  wants to do and what it stands for, not a speech and not a law.'
examples:
- The political platform promised lower taxes and better schools.
- She read the party's political platform before voting.
