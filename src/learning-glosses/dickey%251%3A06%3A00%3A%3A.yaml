simpleMeaning: A piece a man can take off and put on to look like the front of a shirt, usually made stiff
  with starch
scope: A false shirt front worn by a man, not a real shirt and not a tie; shirtfront, dicky and dickie
  are other names for this sense.
examples:
- His dickey showed white above his waistcoat.
- The waiter wore a dickey with his black jacket.
