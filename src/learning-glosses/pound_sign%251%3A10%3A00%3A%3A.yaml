simpleMeaning: A mark that stands for a kind of money, most often for British money
scope: This is a mark that stands for a kind of money, most often for British money, also called a pound;
  it is not a number and not a mark for weight.
examples:
- The pound sign in front of the number showed the price in British money.
- Type the pound sign before the amount.
