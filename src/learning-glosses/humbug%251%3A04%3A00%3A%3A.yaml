senseId: 'humbug%1:04:00::'
synsetId: 00755028-n
simpleMeaning: something made to fool people; a planned trick done on purpose to gain something for yourself
scope: This sense is a thing or trick made to fool people, also called fraud, hoax, fraudulence, and dupery.
  It is not just a small lie told once.
examples:
- The free prize was a humbug meant to take people's money.
- He sold a humbug cure that did nothing for sick people.
