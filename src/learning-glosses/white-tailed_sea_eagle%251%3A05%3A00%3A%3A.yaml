simpleMeaning: From Europe and Greenland comes a big greyish-brown bird of prey with a short wedge-shaped
  tail of one pale colour.
scope: Also called ern, erne, gray sea eagle, and grey sea eagle, it is a big greyish-brown bird of prey
  with a short wedge-shaped tail of one pale colour, from Europe and Greenland.
examples:
- We saw a white-tailed sea eagle in Greenland.
- The white-tailed sea eagle lived in Europe.
