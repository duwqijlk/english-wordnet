simpleMeaning: a quick running away, such as by people who have broken the law
scope: This is a quick running away, such as by people who have broken the law; getaway is another name
  for this sense. Not the verb lam, which means to run away fast.
examples:
- The thieves were on the lam after the bank robbery.
- He took it on the lam when the police came for him.
