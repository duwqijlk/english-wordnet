simpleMeaning: The act of making a thing smaller in size, in how much space it fills, in amount, or in
  range
scope: This is the act of making a thing smaller, not the shortening of a muscle.
examples:
- The contraction of the market hurt small shops.
- A contraction in spending followed the bad year.
