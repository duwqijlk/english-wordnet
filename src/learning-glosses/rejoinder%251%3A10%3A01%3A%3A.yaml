senseId: 'rejoinder%1:10:01::'
synsetId: 06575315-n
simpleMeaning: In law, a formal written answer made by the person being sued, in reply to the written
  answer of the person who brought the case.
scope: In law, a formal written answer made by the person being sued, in reply to the written answer of
  the person who brought the case, not a quick reply to a question or remark, especially a witty or critical
  one.
examples:
- The defendant's rejoinder denied every point in the plaintiff's replication.
- The judge read the rejoinder before setting the next hearing.
