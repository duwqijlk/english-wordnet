senseId: 'infrared%1:07:00::'
synsetId: 05063962-n
simpleMeaning: the part of the spectrum (the full range of light and other waves) below red light, made
  of waves that come less often than light people can see
scope: 'Also called infrared frequency: this sense names the part of the spectrum itself; not the rays
  that lie in that part, and not the describing word for things that use such rays.'
examples:
- The camera can pick up heat in the infrared.
- This part of the infrared lies just past the red light we can see.
