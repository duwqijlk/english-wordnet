simpleMeaning: Any Pterostylis orchid with leaves in a low base ring and green flowers, often striped
  purple, brown or red, whose top sepal, an outer petal, curls in like a cap.
scope: This is the green-flowered Pterostylis orchid whose top sepal curls like a cap; greenhood is another
  name for the same plant, and it is not the other helmet orchid, a Coryanthes species with a helmet-shaped
  lip.
examples:
- The helmet orchid's green flower is often striped with brown or purple.
- A helmet orchid grew in the shade of the scrub.
