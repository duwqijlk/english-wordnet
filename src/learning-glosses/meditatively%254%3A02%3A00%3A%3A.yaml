simpleMeaning: in a way that shows deep, calm thought
scope: Done while thinking deeply and calmly; not done in a worried way and not done quickly with no thought.
examples:
- He looked out at the sea meditatively, thinking about his life.
- She turned the letter over meditatively before she opened it.
