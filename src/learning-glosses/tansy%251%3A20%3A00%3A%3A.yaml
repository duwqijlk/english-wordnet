simpleMeaning: a common herb from Europe and Asia, living many years, with a strong smell, yellow flowers
  like buttons, bitter leaves of many small parts in rows, sometimes used as medicine
scope: 'Also called golden buttons and scented fern: a strong-smelling herb with yellow button-like flowers,
  not a true fern, despite one of its names.'
examples:
- Tansy grows wild along the road near our house.
- She planted tansy in the garden for its yellow flowers.
