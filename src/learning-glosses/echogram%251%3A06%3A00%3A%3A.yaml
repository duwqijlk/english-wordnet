simpleMeaning: A picture of a body part made from sound too high to hear bouncing back, used to watch
  an unborn baby grow or to study the organs inside the body.
scope: People also call it sonogram; the name marks a picture of a body part built from echoes of sound
  too high to hear.
examples:
- The echogram showed the baby growing before birth.
- An echogram can show the organs inside the body.
