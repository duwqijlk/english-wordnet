simpleMeaning: A person from the people of the north of the long peninsula south of Asia, of the country
  of the same name, and of parts of the western islands.
scope: This is a person of the Malay people, who live in the northern Malay Peninsula and Malaysia and
  in parts of the western Malay Archipelago; Malayan is another name for this sense, and it is not the
  Malay language.
examples:
- A Malay fisherman mended his nets by the shore.
- The Malay people live in the north of the Malay Peninsula.
