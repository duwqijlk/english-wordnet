simpleMeaning: To show that a vowel has a long sound, a short straight line is put over it
scope: This is a short straight line over a vowel to show a long sound, not a mark for stress and not
  a line under a letter.
examples:
- The macron over the a shows it is a long vowel.
- She added a macron to the Latin word.
