simpleMeaning: said of animals with no backbones in the group Arthropoda, the group of animals with jointed
  legs and hard outer shells
scope: 'Also called arthropodan and arthropodous: said of animals with no backbones in the Arthropoda
  group, not of animals with backbones and not of a worm or a snail.'
examples:
- The arthropodal features of the crab set it apart from soft-bodied sea animals.
- Scientists study arthropodal animals such as insects, spiders and crabs.
