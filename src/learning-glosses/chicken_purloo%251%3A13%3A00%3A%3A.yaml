simpleMeaning: a thick stew of grain, bird meat, and small wild game, from the southern United States
scope: A thick stew of grain, bird meat, and small wild game from the southern United States; poilu and
  purloo are other names for this sense, not a thin soup and not a dish of meat alone.
examples:
- Chicken purloo simmered on the stove.
- Grandma's chicken purloo fed the whole family.
