simpleMeaning: A small closed sac that forms in the small glands of the neck of the womb.
scope: A small closed sac in the glands of the neck of the womb; nabothian cyst is another name for this,
  and it is not a sore on the womb or a growth in the womb itself.
examples:
- The doctor found a nabothian follicle.
- A nabothian follicle forms in the neck of the womb.
