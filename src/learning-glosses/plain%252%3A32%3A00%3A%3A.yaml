simpleMeaning: to say that something is wrong and that you are not happy with it
scope: Also called kick and complain. This is saying you are not happy with something, not the word for
  clear to see or for simple with nothing added.
examples:
- In the old letter, she plained about the long winter and the lack of food.
- He plained that no one had helped him clean the house.
