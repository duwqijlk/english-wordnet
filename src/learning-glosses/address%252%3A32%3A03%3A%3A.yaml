simpleMeaning: to write on an envelope the details of where a person lives or works, so that it can be
  delivered.
scope: This is not giving a formal speech, and it is not dealing with a problem; it is only what you write
  on the outside of something to be sent.
examples:
- She addressed the envelope and posted it.
- He addressed all the wedding invitations by hand.
