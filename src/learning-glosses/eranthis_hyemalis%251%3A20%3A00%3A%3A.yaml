simpleMeaning: A small plant from the Old World that lives for many years, grown for its bright yellow
  flowers that open in early spring, often before the snow is gone.
scope: Also called winter aconite, this small plant lives for many years and bears bright yellow flowers
  in early spring, often before the snow is gone, not any other spring flower.
examples:
- Eranthis hyemalis opens its yellow flowers in early spring.
- We planted Eranthis hyemalis under the trees.
