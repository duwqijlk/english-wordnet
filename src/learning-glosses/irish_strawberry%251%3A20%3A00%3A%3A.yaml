simpleMeaning: A small evergreen European tree or large shrub with many-seeded scarlet berries that can
  be eaten but taste bland; it grows in Ireland, southern Europe, and Asia Minor.
scope: A small evergreen tree with scarlet berries, also called strawberry tree and Arbutus unedo; not
  a strawberry plant and not a tree of the Americas.
examples:
- The Irish strawberry by the wall was full of red berries.
- Birds eat the Irish strawberry fruit though it tastes bland.
