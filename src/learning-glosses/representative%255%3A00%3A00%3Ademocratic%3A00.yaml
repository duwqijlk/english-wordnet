simpleMeaning: of a government, where the people rule through men and women they have voted in to speak
  for them
scope: Of a government where citizens rule through people they vote in, not a person who speaks for others
  and not a typical example of a kind.
examples:
- The town chose a representative form of rule, with leaders voted in by the people.
- A representative system lets citizens act through men and women they elect.
