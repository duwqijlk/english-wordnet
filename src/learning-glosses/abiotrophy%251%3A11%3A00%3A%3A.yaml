simpleMeaning: a loss of life and strength, as the tiny parts of the body break down, with no clear harm
  to cause it
scope: This is a slow loss of life and strength as the parts of the body break down on their own; not
  a harm caused by a wound and not a sudden illness.
examples:
- The doctor said the abiotrophy came on slowly, with no wound to blame.
- Abiotrophy slowly took the strength from his hands.
