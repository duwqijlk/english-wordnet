simpleMeaning: putting warm wet cloths on a part of the body to ease pain and swelling
scope: Warm wet cloths put on the body to ease pain, not the starting of trouble on purpose and not a
  medicine taken by mouth.
examples:
- The nurse used fomentation to ease the swelling in his knee.
- Fomentation with warm cloths helped the sore muscle.
