simpleMeaning: Children with a condition that begins in the first years of life and brings great trouble
  in daily life were once described by this old name
scope: This name for a childhood condition that begins in the first years of life and brings great trouble
  in daily life is also called autistic disorder, childhood autism, classic autism, infantile autism,
  and infantile psychosis.
examples:
- Classical autism is an old name for the condition.
- The report calls it classical autism, a term doctors no longer use.
