simpleMeaning: a neat, ordered way of doing things, shown by working in a careful, planned way and keeping
  things in good order
scope: 'Also called system and organization: a neat, ordered way of working, not the work of putting people
  or things in place and not the group of people who run something.'
examples:
- Her organisation at work means every paper is in its right place.
- We need more organisation if we want to finish on time.
