simpleMeaning: the first coat of paint or of size (a glue-like liquid that seals a surface) put on a surface
  before more coats
scope: 'Also called ground, and another name for this sense is primer: the first coat of paint, or of
  a glue-like liquid that seals a surface, put on a surface before the main coats, not a thing used to
  start burning to fire a weapon.'
examples:
- The priming was still wet, so we waited before painting the wall blue.
- He put a thin priming on the wood before the main coat of paint.
