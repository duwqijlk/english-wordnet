simpleMeaning: a healer who treats hurt or poor working of the body with exercises and other bodily care
scope: A healer who treats hurt or poor working of the body with exercises and other bodily care; physiotherapist
  is another name for this sense, not a doctor who gives drugs and not a healer who works with the mind.
examples:
- The physical therapist gave her exercises to mend her hurt knee.
- After the fall, the physical therapist treated him with exercises and bodily care.
