simpleMeaning: In psychophysics, the thought that how strong a feeling seems grows as a power of how strong
  the thing felt is
scope: In psychophysics, this is the thought that how strong a feeling seems grows as a power of how strong
  the thing felt is; power law and Stevens' power law are other names for it, and its nearest neighbours
  are the other rules of psychophysics about how strong feelings seem.
examples:
- Stevens' law says how strong a feeling seems grows as a power of the stimulus.
- A louder sound feels stronger under Stevens' law.
