simpleMeaning: a person who makes small changes to a thing used to make music so that its notes sound
  right
scope: A person who sets a musical instrument so its notes sound right, not a machine that gets radio
  or TV signals.
examples:
- The tuner spent an hour working on our old piano.
- She called a tuner to make the piano's notes sound right before the concert.
