schema: oewn-learning-gloss-v2
senseId: 'negativeness%1:07:00::'
synsetId: 05175145-n
simpleMeaning: a habit of doubting most things and refusing what others suggest or order, in a way others
  find hard to take
scope: 'Also called negativity and negativism: a habit of doubt and refusal, not a single angry outburst
  and not a reasoned objection.'
examples:
- His negativeness made every meeting drag on, as he doubted each new idea.
- Her negativeness showed in the way she said no to every suggestion.
