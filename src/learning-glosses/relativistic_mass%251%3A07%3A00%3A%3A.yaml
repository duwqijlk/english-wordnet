simpleMeaning: 'In physics, the mass of a moving body as seen by the one watching it: its mass at rest
  times a number over 1 that grows as its speed grows'
scope: The mass of a moving body as seen by an observer, not its mass at rest and not its weight.
examples:
- The relativistic mass of the particle grows as it speeds up.
- At high speed, relativistic mass is more than mass at rest.
