senseId: 'completeness%1:07:00::'
synsetId: 04792642-n
simpleMeaning: In logic, a quality of a system in which adding any statement that cannot be proved from
  its starting statements leads to two statements that cannot both be true
scope: This is the logic sense, about a system and its basic rules, not the general idea of having everything
  that is needed.
examples:
- The teacher explained the completeness of this logic system with a simple case.
- They tried to prove the completeness of the formal system.
