simpleMeaning: to direct a look, smile, or gesture that carries a feeling or message
scope: This is about sending a look or gesture rather than words, not about confusing someone, and not
  about propelling a physical object through the air.
examples:
- She threw him a warning glance across the crowded room.
- He threw a quick smile at the photographer.
