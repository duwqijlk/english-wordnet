simpleMeaning: a small, rough place built in a simple way for a person to live in
scope: Also called hut, hovel, shack, and hutch. This is a small rough home, not a song sung by sailors
  at work.
examples:
- He lived in a small shanty near the sea.
- They built a shanty from old wood and metal sheets.
