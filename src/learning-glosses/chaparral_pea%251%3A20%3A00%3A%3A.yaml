simpleMeaning: a thorny evergreen shrub with bright rose and purple flowers that grows in dense thickets
  on dry rocky mountain slopes in California
scope: The wild shrub sense; not the garden pea or any edible pea, despite the name.
examples:
- Chaparral pea forms dense, prickly thickets on the dry slopes.
- In spring the chaparral pea is covered with showy rose and purple flowers.
