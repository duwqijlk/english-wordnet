simpleMeaning: Through small brushes touching still contacts, power keeps flowing to the turning part
  of a machine by way of a metal band on it.
scope: This metal band sits on a turning part of a machine, not on a still part, and keeps power flowing
  through brushes on still contacts.
examples:
- The slip ring carries power to the turning part of the machine.
- Brushes on still contacts feed power through the slip ring.
