simpleMeaning: make a person or thing go into or come out of an activity or condition, either by physical
  pressure or in a non-literal, figurative way
scope: This sense is about moving someone into or out of a state, not about making a person perform a
  particular act under urgent pressure, and not about taking something from someone.
examples:
- The injury forced him out of the final.
- Rising costs have forced many small shops into debt.
