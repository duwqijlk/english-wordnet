senseId: 'bridged-t%1:06:00::'
synsetId: 02903294-n
simpleMeaning: A wiring path built from a T-shaped network, with one more side link that joins the two
  lines of parts set in a row.
scope: This is a wired path with an added side link joining its two lines; not a plain T-shaped network
  with no extra link, and not a single side path on its own.
examples:
- The engineer tested the bridged-T in the new radio set.
- A bridged-T joined the two lines in the old amplifier.
