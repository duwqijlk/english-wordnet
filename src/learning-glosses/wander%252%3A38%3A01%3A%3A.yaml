simpleMeaning: to move, or to make something move, along a path that twists, turns round and round, or
  goes in a circle
scope: 'Also called wind, thread, and weave: moving along a twisting or circling path, not walking with
  no fixed goal and not being unfaithful in marriage.'
examples:
- The river wandered through the hills in wide curves.
- The path wandered in bends and circles through the fields.
