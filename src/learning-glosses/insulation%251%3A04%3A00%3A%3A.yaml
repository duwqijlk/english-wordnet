simpleMeaning: the act of putting material around something to stop sound, heat, or electricity from passing
  through it, or to cut how much passes
scope: This is the act of putting such material around something, not the material itself.
examples:
- Insulation of the pipes kept the heat from escaping into the cold room.
- The insulation of the wires stopped electricity from reaching the metal case.
