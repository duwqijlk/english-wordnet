simpleMeaning: a work that copies a person's way of writing or working, or twists it, usually to make
  people laugh
scope: This is a work that copies or twists a person's style, usually to make people laugh; mockery, parody,
  takeoff, travesty, burlesque, spoof, lampoon, pasquinade, put-on and sendup are other names for this
  sense, and it is not a serious copy or a plain insult.
examples:
- His send-up of the famous speech had the whole hall laughing.
- The magazine printed a send-up of the poet's latest book.
