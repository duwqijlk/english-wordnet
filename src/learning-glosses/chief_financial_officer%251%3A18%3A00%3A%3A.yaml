simpleMeaning: the top boss of a firm who holds the money power, sets aside funds, and lets spending go
  ahead
scope: The top boss of a firm in charge of its money, not the chief executive officer and not a lower
  money manager.
examples:
- The chief financial officer signed off on the new budget.
- Our chief financial officer must approve all large spending.
