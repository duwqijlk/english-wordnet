simpleMeaning: Bags that a traveller takes with them into the plane, not bags put in the hold.
scope: Bags that a traveller takes with them into the plane; not bags put in the hold, and not bags sent
  by post.
examples:
- Her carry-on fits under the seat.
- He took only a carry-on for the trip.
