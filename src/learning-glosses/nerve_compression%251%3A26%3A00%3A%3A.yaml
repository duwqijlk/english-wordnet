simpleMeaning: Muscles grow weak and the nerve is harmed when a nerve is squeezed hard, above all where
  it runs over a hard bump
scope: Harmful squeezing of a nerve, above all where it runs over a hard bump, that harms the nerve and
  weakens the muscles.
examples:
- The nerve compression in her wrist made her hand weak.
- Nerve compression can follow when a nerve is squeezed over bone.
