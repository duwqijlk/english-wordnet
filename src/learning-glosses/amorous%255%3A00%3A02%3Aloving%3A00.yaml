simpleMeaning: showing or causing feelings of sexual love or romance
scope: This sense, also called romantic, is about showing or causing feelings of sexual love or romance;
  it is not about friendly love and not about love for family.
examples:
- They gave each other amorous glances across the room.
- He wrote her an amorous letter full of love and desire.
