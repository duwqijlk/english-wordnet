synsetId: 13764498-n
simpleMeaning: a number that, when added to another number, leaves that number the same
scope: 'Also called zero, nought, and cypher: the number that changes nothing when it is added. Not cipher
  used for a thing of no importance, and not the verb cipher, which means to work out an answer with numbers.'
examples:
- When you add a cipher to five, the answer is still five.
- He put a cipher in the sum because adding it changed nothing.
