simpleMeaning: The basic unit for how much of a substance there is, set by the weight in grams of one
  amount of it, as used by the world system of units
scope: A unit for how much of a substance there is, also called a mol; not the small burrowing animal,
  not the stone wall that runs into the sea, and not the spicy sauce.
examples:
- Chemists count a mole of carbon in grams.
- One mole of water has a set weight in grams.
