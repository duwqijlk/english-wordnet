senseId: negotiable%5:00:00:passable:00
synsetId: 01729130-s
simpleMeaning: able to be passed through or travelled over
scope: This means a road or way can be passed through; it is not about a price or deal that can be talked
  over and changed, and not about a thing that can be given to a new owner.
examples:
- After the snow was cleared, the mountain road was negotiable again.
- The narrow path was negotiable only on foot.
