simpleMeaning: Knowledge got by catching and studying signals sent from far away by foreign machines.
scope: Knowledge got by catching and studying signals sent from far away by foreign machines, also called
  telemetry intelligence, unlike knowledge got the same way from machines in one's own country.
examples:
- The analysts used TELINT to learn what the foreign machines had sent.
- The TELINT report told them what the foreign machines had sent.
