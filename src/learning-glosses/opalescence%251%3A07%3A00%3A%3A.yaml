simpleMeaning: Changing colours show on the face of a thing that shines soft white
scope: The soft white shine and changing colours on the face of a thing, also called iridescence; not
  a plain white shine and not a single bright colour.
examples:
- The opalescence of the stone showed soft white light and shifting colours.
- She liked the opalescence of the shell in the sun.
