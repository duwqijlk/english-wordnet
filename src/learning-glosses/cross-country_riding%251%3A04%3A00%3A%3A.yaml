simpleMeaning: Horses ridden over open land and over things in the way, to show skill on horseback
scope: Horses ridden over open land and obstructions to show skill on horseback, also called cross-country
  jumping; not racing on a track and not a ride for pleasure alone.
examples:
- Cross-country riding took them over fences and ditches.
- He took up cross-country riding last spring.
