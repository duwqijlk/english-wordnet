simpleMeaning: For very short loans to other banks, a country's main bank sets the cost, and the banks
  give it approved things of worth as a pledge
scope: This is the cost a country's main bank sets for very short loans to other banks, not the charge
  banks set for each other and not the charge for a home loan.
examples:
- The Lombard rate rose by one per cent.
- Banks paid the Lombard rate for the overnight loan.
