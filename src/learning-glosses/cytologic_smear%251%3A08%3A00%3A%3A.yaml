simpleMeaning: To find disease, a doctor spreads a thin bit of tissue or blood on a small glass plate,
  gives it color, and looks at the cells under a microscope
scope: A thin bit of tissue or blood spread on glass and colored so its cells can be looked at under a
  microscope; also called smear and cytosmear, not a blood test done in a tube.
examples:
- The nurse made a cytologic smear from the tissue sample.
- A cytologic smear showed the cells under the microscope.
