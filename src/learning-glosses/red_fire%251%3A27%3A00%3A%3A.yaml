simpleMeaning: A material, often made from salts of lithium or strontium, that catches light and burns
  with a bright crimson glow, and is used in flares and festive sky displays.
scope: This is a material that burns with a bright crimson glow, used in flares and festive sky displays.
examples:
- Red fire burned bright crimson in the flare.
- Red fire lit up the night sky.
