simpleMeaning: a small airship with no stiff frame, used for watching an area from the air, or as a barrage
  balloon (a balloon kept in the sky to stop enemy planes)
scope: 'Also called sausage: this soft airship is used for watching an area or for stopping enemy planes,
  not a plane with wings and not a balloon that carries people in a basket.'
examples:
- A blimp floated slowly over the city.
- The blimp stayed in the sky to watch the coast.
