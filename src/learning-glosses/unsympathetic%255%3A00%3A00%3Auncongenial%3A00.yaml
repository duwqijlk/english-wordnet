simpleMeaning: not fitting what a person likes or expects
scope: 'Also called disagreeable: not fitting what a person likes or expects. Not the sense of being unkind
  to others, and not the sense about a character in a story whom people dislike.'
examples:
- 'She found the new office unsympathetic: too loud, too bright, and nothing like she had hoped.'
- Farming in the cold north was unsympathetic to him, and he moved south after one winter.
