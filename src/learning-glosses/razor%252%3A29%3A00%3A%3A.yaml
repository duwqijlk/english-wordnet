simpleMeaning: to cut hair close to the skin with a thin, sharp blade made for this job
scope: This is the act of cutting hair from the skin. It is not the tool you hold to do it.
examples:
- He razored his chin until it felt smooth.
- She carefully razored the short hairs from his neck.
