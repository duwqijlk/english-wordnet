simpleMeaning: to give a drug that brings deep sleep or takes away pain
scope: To give a drug that brings deep sleep or takes away pain; narcotize is another name for this sense,
  not to give a drug that wakes a person up and not to take such a drug oneself.
examples:
- The vet had to narcotise the injured dog.
- Doctors narcotise patients before some operations.
