schema: oewn-learning-gloss-v2
senseId: 'consist%2:42:02::'
synsetId: 02664128-v
simpleMeaning: to fit well together in form, tone, and character, and to agree and match well with something
scope: This sense means fitting together and matching well; it is not the sense of having something as
  a true nature or being found in it.
examples:
- Such rude words do not consist with good manners.
- His later story does not consist with what he said at first.
