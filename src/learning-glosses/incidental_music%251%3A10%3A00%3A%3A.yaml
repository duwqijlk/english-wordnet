simpleMeaning: Tunes written to go with the action of a play, or to fill the gaps between its scenes.
scope: Tunes written to go with a play, not tunes sung by the actors as part of the story and not the
  play's main songs.
examples:
- The incidental music played softly as the curtain rose.
- She wrote the incidental music for the school play.
