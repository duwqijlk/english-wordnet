simpleMeaning: In the study of machines that work with numbers, the moving, magnetic, and electric parts
  that make up such a machine
scope: In the study of machines that work with numbers, the moving, magnetic, and electric parts that
  make up such a machine; hardware is another name for this sense, not the programs that run on the machine
  and not a single part on its own.
examples:
- The computer hardware includes the moving and electric parts of the machine.
- New computer hardware made the machine run faster.
