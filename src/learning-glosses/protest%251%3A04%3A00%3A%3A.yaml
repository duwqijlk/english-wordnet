simpleMeaning: the act of showing you do not agree, in a public show of not agreeing, often as a planned
  group act
scope: A public act that shows people do not agree, often as a planned group act; not just a strong public
  show that people do not like something, not a formal statement that you object, and not saying in a
  formal way that something is true.
examples:
- The workers held a protest outside the factory to show they did not agree with the pay cuts.
- Students took part in a protest in the city square against the new plan.
