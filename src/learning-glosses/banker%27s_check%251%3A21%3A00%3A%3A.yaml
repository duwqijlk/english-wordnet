simpleMeaning: a paper given out by a bank or a firm that moves money, which can be cashed at any firm
  that works with the one that gave it out
scope: A paper that can be cashed at any firm linked to the one that gave it out, not a personal check
  written by one person and not cash itself.
examples:
- She paid with a banker's check so the seller knew the money was good.
- The banker's check was cashed at a branch in another city.
