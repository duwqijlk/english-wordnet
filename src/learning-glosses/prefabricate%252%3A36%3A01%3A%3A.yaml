schema: oewn-learning-gloss-v2
senseId: 'prefabricate%2:36:01::'
synsetId: 01625482-v
simpleMeaning: to make something by following a fixed pattern, in a way that is not natural and shows
  no new ideas
scope: This means making something in a fixed, unnatural way with no new ideas. It is not making parts
  of a building in a factory, to put together later where the building will stand.
examples:
- The band prefabricates love songs from the same tune and the same words.
- He prefabricated a dull speech from old phrases that he uses for every crowd.
