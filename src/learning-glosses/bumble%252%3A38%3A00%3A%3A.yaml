simpleMeaning: to walk in a way that is not steady, almost falling again and again
scope: 'Also called stumble and falter: walking in a way that is not steady, not the other sense of this
  word that means to spoil or ruin a thing.'
examples:
- The tired old man bumbled across the icy path.
- She bumbled down the dark hall and tripped on the rug.
