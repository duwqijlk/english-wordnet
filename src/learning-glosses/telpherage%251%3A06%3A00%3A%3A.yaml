simpleMeaning: A transport system in which cars, called telphers, hang from wires and run on electric
  power
scope: A transport system in which cars called telphers hang from wires and run on electric power, also
  called telferage; not a train on rails and not a road for cars.
examples:
- Telpherage moved the ore in cars hung from wires.
- The telpherage line crossed the gorge on a single cable.
