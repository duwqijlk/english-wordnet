simpleMeaning: the power a thing has to catch people's interest and pull them toward it
scope: The power of a thing to catch interest and pull people toward it, not a single pleasing part of
  a thing, not a performer, and not a pull between objects in nature.
examples:
- Her voice had a strange attraction for all who heard it.
- The town's old castle held a strong attraction for visitors.
