simpleMeaning: A bushy, fragrant perennial herb from Europe with clusters of small white daisy-like flower
  heads, long used in folk medicine; sometimes classified in the genus Chrysanthemum.
scope: This is the bushy, white-flowered herb grown in gardens, not chamomile or another daisy-flowered
  plant used in herbal medicine.
examples:
- Feverfew seeds itself freely between the paving stones.
- She grew feverfew beside the lavender for its small white flowers.
