simpleMeaning: An electronic box that changes the sound of a musical instrument or other sound source.
scope: An electronic box that changes the sound of a musical instrument or other sound source, not an
  amplifier and not the instrument itself.
examples:
- The guitarist plugged in an effects unit.
- This effects unit makes the guitar sound strange.
