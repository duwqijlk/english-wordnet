simpleMeaning: the S-shaped bend of the gut between the downward part and the last straight part
scope: The S-shaped bend of the gut between the downward part and the last straight part, also called
  sigmoid flexure; not the straight last part of the gut and not the upper part of the gut.
examples:
- The sigmoid colon bends before it joins the rectum.
- Doctors found the growth in his sigmoid colon.
