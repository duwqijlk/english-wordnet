simpleMeaning: A place where young people who have broken the law, or people who have broken the law for
  the first time, are kept, made to follow rules, and taught skills
scope: A place that holds and teaches young people who have broken the law; reformatory and reform school
  are other names for this sense. Not an ordinary school and not a prison for adults.
examples:
- The judge sent the boy to a training school for a year.
- At the training school, the boys learned a trade as well as lessons.
