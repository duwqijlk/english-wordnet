simpleMeaning: In military architecture, a part of a fort with only one front face and one side face sticks
  out
scope: Also called demi-bastion, this is a fort part with only one front face and one side face, not a
  full fort part with two of each.
examples:
- The old half-bastion still juts out from the fort wall.
- Builders raised a half-bastion at the corner of the fort.
