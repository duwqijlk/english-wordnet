simpleMeaning: A piece of furniture is decorated by setting curls of tortoise shell and yellow and white
  metal into its fine wood.
scope: This inlaid work is also called boule or buhl.
examples:
- The boulle on the cabinet door was made of shell and metal.
- The boulle on the cabinet was set with curls of shell and metal.
