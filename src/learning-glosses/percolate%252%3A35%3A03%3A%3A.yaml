senseId: 'percolate%2:35:03::'
synsetId: 01461093-v
simpleMeaning: to make coffee in a pot that sends hot water down through ground coffee again and again
scope: This is making coffee in this kind of pot. It is not about a liquid passing slowly through something
  to draw a part out of it, not about spreading slowly, and not the liquid made that way.
examples:
- She percolated coffee for breakfast.
- He let the coffee percolate while the toast cooked.
