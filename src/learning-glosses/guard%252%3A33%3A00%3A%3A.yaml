simpleMeaning: To watch over someone or something and keep them safe from danger or harm.
scope: This is the action of keeping someone or something safe; it is not a football player's position
  and not the person standing watch.
examples:
- Two soldiers guarded the entrance all night.
- The dog guards the sheep from wolves.
