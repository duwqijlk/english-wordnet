simpleMeaning: A strong electric shock that does not kill, given by a weapon to stop a person for a short
  time.
scope: Also called a stun gun, this weapon is made to stop a person for a short time, not to kill them.
examples:
- He carried a stun baton.
- He used the stun baton to stop the man without killing him.
