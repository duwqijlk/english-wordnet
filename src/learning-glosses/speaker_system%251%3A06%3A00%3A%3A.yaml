simpleMeaning: Electric signals go in and sound comes out loud enough to reach people far away, the parts
  working as one set.
scope: It is also called speaker, loudspeaker, loudspeaker system and speaker unit, its parts working
  as one set to turn electric signals into sound that reaches people far away.
examples:
- The speaker system carried the sound to the far end of the room.
- They turned down the speaker system when the music ended.
