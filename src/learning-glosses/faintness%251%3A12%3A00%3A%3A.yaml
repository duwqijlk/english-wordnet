senseId: 'faintness%1:12:00::'
synsetId: 07495806-n
simpleMeaning: a weak, dizzy feeling that makes a person feel they may suddenly stop being awake
scope: This is the body feeling of being weak and dizzy and close to stopping being awake; it is not a
  lack of courage, and not a light, colour or sound being dim or weak.
examples:
- She sat down at once because a sudden faintness came over her.
- After standing in the hot sun, he felt a faintness and had to hold on to the wall.
