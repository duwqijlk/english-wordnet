simpleMeaning: In chemistry, the idea that acids in water split into hydrogen ions and bases into hydroxyl
  ions, and that an acid plus a base makes a salt and water.
scope: Another name for the theory of dissociation, the early account of how acids and bases behave in
  water; not a theory of electrolysis itself, and not the modern proton-transfer view of acids and bases.
examples:
- Arrhenius proposed the theory of electrolytic dissociation in the 1880s.
- The theory of electrolytic dissociation treats acids as sources of hydrogen ions in water.
