simpleMeaning: Not letting through rays used to see inside the body or other rays
scope: 'Also called radio-opacity: not letting through rays used to see inside the body or other rays,
  not letting them pass almost fully as radiolucent things do.'
examples:
- The metal plate showed high radiopacity on the X-ray picture.
- The bone's radiopacity made it show up white on the picture.
