simpleMeaning: Sandflies spread tiny living things of the group Leishmania, and the tropical infection
  they bring on leaves sores.
scope: People also call these sores kala-azar, leishmaniasis, or leishmaniosis.
examples:
- Kala azar left sores on her legs.
- The kala azar sores came from a sickness spread by sandflies.
