simpleMeaning: The small gland in the brain that makes melatonin lies under the back of the band joining
  the two halves of the brain
scope: It is also called epiphysis cerebri, the pineal body, and the pineal gland, a small gland in the
  brain that makes melatonin.
examples:
- The epiphysis lies under the back of the band joining the two halves of the brain.
- Melatonin comes from the epiphysis.
