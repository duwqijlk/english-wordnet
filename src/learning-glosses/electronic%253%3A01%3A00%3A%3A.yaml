simpleMeaning: about the study of electrons (very tiny parts of atoms), and about devices that work by
  using the way they move and act
scope: This describes devices and the study behind them. It is not the narrower sense that means only
  about electrons themselves.
examples:
- She bought a new electronic notebook for school.
- The shop sells electronic tools that run on small electric signals.
