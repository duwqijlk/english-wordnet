senseId: 'westernization%1:22:00::'
synsetId: 13595785-n
simpleMeaning: The taking in of Western ways of life; the process in a society of getting used to, or
  changing to, the customs and ways of the West.
scope: Also called Westernisation; the process by which a whole society takes in Western customs and ways
  of life.
examples:
- Westernization changed the town's customs over a generation.
- The Westernization of the region took many years.
