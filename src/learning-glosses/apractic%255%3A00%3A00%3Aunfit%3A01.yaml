simpleMeaning: A person's muscles move in jerky, uneven ways when this is the matter, a sign of a sickness
  of the brain and nerves.
scope: Also called apraxic, this word marks jerky, uneven muscle movements as a sign of a sickness of
  the brain and nerves.
examples:
- The apractic patient could not lift the cup without spilling it.
- Writing was hard because of apractic movements.
