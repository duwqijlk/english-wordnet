simpleMeaning: Grain crops and alfalfa in the middle western states are eaten up by the young of a night-flying
  moth moving in big groups.
scope: These moth young are not the army worm young that eat grass and grain in huge crowds, but ones
  that eat grain crops and alfalfa in the middle western states.
examples:
- Army cutworms moved in big groups through the grain.
- The army cutworms ate the grain crops and the alfalfa.
