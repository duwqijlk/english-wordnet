simpleMeaning: Each side aims to ring the other's stones on a lined board so that the ringed stones come
  off the board.
scope: Also called go, this is the pastime for two people who take turns laying stones on a lined board
  to ring and take the other side's stones.
examples:
- They played a go game that lasted three hours.
- In a go game, each player takes turns placing stones on the grid.
