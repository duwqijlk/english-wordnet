simpleMeaning: Large plant-eating lizards of tropical America that live in trees and have a spiny ridge
  along the back, eaten as food by people in Central and South America
scope: Large tree-living lizards of tropical America; iguana and common iguana are other names for this
  sense, not a small ground lizard or a lizard kept only as a pet.
examples:
- An Iguana iguana sunned itself on the high branch.
- In the market, vendors sold Iguana iguana meat.
