simpleMeaning: To make something from separate parts, often in a quick, free way with no set plan
scope: Also called fashion, this is making something from parts, often with no set plan, not working metal
  in a hot place and not making a false copy.
examples:
- She forged a tent out of a sheet and a few sticks.
- He forged a shelter from the branches and leaves he found.
