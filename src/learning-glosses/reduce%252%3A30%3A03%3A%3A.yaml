simpleMeaning: To take oxygen out of a substance, make it combine with hydrogen, or give it extra electrons.
scope: A chemical change in a substance, not making something smaller or cutting an amount down, and not
  boiling a sauce until little liquid remains.
examples:
- Iron ore is reduced in a blast furnace to produce molten iron.
- In this step the copper ions are reduced and take up electrons.
