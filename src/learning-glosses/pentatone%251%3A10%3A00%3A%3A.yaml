simpleMeaning: Usually missing the fourth and seventh notes of the common scale, this set of five notes
  has gaps in it
scope: 'Also called a pentatonic scale: a set of five notes with gaps, not a full seven-note scale and
  not a scale with no gaps.'
examples:
- The pentatone left out the fourth and seventh notes.
- She played a pentatone on the piano.
