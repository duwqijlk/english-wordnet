senseId: 'unappealing%3:00:02::'
synsetId: 02385130-a
simpleMeaning: of a person in a story or play, tending to make people feel they do not like that person
scope: Also called unsympathetic, unlikable and unlikeable. This is about a person in a story or play
  whom people do not like, not about food, rooms or other things people do not like.
examples:
- The hero of the play was unappealing, and the crowd felt no care for him.
- In the novel, the king is unappealing because he is cruel and cold.
