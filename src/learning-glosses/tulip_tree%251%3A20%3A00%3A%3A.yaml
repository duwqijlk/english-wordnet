simpleMeaning: A tall North American tree that sheds its leaves, with big greenish-yellow cup-shaped flowers
  and cone-like fruit; its soft white wood is mainly used for making cabinets.
scope: This is the tall North American tree itself, another name for the yellow poplar, not the wood it
  yields.
examples:
- We sat under a tulip tree and watched the bees visit its flowers.
- The tulip tree is easy to recognize by its cone-like fruit.
