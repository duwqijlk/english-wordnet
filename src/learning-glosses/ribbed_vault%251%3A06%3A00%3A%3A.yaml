simpleMeaning: a curved roof that looks like one with crossing curves, but with raised bands that run
  along its arches
scope: Not a flat roof, and not a plain curved roof with no bands; a curved roof with raised bands on
  its arches.
examples:
- The ribbed vault rose high over the nave.
- Builders used a ribbed vault to spread the weight.
