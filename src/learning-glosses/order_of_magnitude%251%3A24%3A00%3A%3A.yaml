simpleMeaning: Counting gaps in steps of ten, a number sizes one amount against another, and two amounts
  share a class when one is under ten times the other.
scope: Magnitude is another name for this sense, which sizes one amount against another by steps of ten.
examples:
- The two amounts are of the same order of magnitude.
- They worked out the order of magnitude of the two amounts.
