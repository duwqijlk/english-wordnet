simpleMeaning: a round, wider part in a body tube, a blood tube, or a body part
scope: This is a round wider part inside the body, not a lamp that gives light and not the round part
  under the ground that a plant grows from.
examples:
- The doctor pointed to the bulb in the wall of the tube.
- A small bulb formed in the blood vessel.
