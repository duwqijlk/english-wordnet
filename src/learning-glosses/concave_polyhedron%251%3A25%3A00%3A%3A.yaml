synsetId: 13907041-n
simpleMeaning: a solid shape with flat faces, where some flat cuts through it make shapes with a dent
  in one side
scope: A solid with flat faces cut in a way that leaves a dent, not a solid with all flat cuts that bulge
  out and not a flat shape.
examples:
- This concave polyhedron looks like a box with a dent in one side.
- A concave polyhedron has some flat cuts that make shapes with a dent.
