simpleMeaning: A clear liquid that fills the spaces inside the brain and the cord down the back and keeps
  them safe, made in the hollow spaces of the brain
scope: This clear liquid is also called spinal fluid.
examples:
- The doctor drew off some cerebrospinal fluid for the test.
- The nurse held the tube of cerebrospinal fluid up to the light.
