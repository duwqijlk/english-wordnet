simpleMeaning: to open something in a formal ceremony, or to give it for a special use in such a ceremony
scope: This is opening something in a formal ceremony, or giving it for a special use in such a ceremony;
  it is not a plain everyday opening with no ceremony.
examples:
- The mayor will inaugurate the new library tomorrow.
- They inaugurated the bridge with a formal ceremony and speeches.
