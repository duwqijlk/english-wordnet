senseId: 'roll%1:25:00::'
synsetId: 13898609-n
simpleMeaning: a shape made of rings set one inside another, as when leaves or petals curl around a centre
scope: This sense is a flat pattern of rings curling inward, as in a rose or a cabbage; it is not a tube
  made by winding something up, and not a written document or a list.
examples:
- The rosebud was a tight roll of pale petals.
- The leaves of the young cabbage formed a small roll at its heart.
