simpleMeaning: To complain in a low, quiet voice that others can barely hear
scope: Complaining in a low voice under your breath, not the harsh sound of a frog, not dying, and not
  making a hoarse sound like a raven; also called mutter, murmur and grumble.
examples:
- She croaked about the long hours when she felt overworked.
- He croaked under his breath about the cold food.
