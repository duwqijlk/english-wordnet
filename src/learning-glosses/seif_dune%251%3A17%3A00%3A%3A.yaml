simpleMeaning: A long, high ridge of sand with a sharp top, common in the Sahara
scope: A long high ridge of sand, not a round sand hill and not a low drift of sand blown against a wall.
examples:
- The seif dune stood high above the flat sand.
- Travellers crossed the seif dune at dawn.
