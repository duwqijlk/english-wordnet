simpleMeaning: A body made up of skilled workers, run for their benefit
scope: A group made up of skilled workers, run for their benefit, also called a professional organisation;
  not a firm that sells things and not a trade union.
examples:
- The teachers' professional organization meets once a year.
- He pays dues to a professional organization for engineers.
