simpleMeaning: 'The sun-based year-count from Julius Caesar in Rome, 46 BC, slightly changed by Augustus:
  12 months, 365 days, 366 in leap years, months of 31 or 30 days except February'
scope: Also called the Julian calendar; the sun-based year-count set up by Julius Caesar in 46 BC, with
  12 months and a leap year each fourth year.
examples:
- They dated the letter by the Old Style calendar.
- The Old Style calendar gave February fewer days than the other months.
