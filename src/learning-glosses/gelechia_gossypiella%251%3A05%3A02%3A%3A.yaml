simpleMeaning: The young of a gelechiid moth that came from Asia; they eat the seeds inside cotton balls.
scope: Also called pink bollworm; these are the young that eat the seeds inside cotton balls, while the
  grown moth of the same name is a small brown moth whose young bore into cotton flowers and bolls.
examples:
- The Gelechia gossypiella larvae fed on the seeds inside the cotton bolls.
- Farmers watched for Gelechia gossypiella on their cotton plants.
