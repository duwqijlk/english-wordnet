simpleMeaning: A chemical made from nitric acid, used in quick-drying paint and in explosives.
scope: A chemical made from nitric acid, used in quick-drying paint and in explosives, with cellulose
  nitrate, guncotton and nitrocellulose as other names for this sense, not gunpowder and not plain cotton.
examples:
- Nitrocotton is used in lacquers and explosives.
- Nitrocotton burns fast, so it must be kept dry.
