simpleMeaning: Rules that many lands hold in common say what may be done at sea, on ships, and when fish
  are caught, and the like.
scope: Also called admiralty law and maritime law, these rules are shared by many lands for the sea, not
  made by one land alone.
examples:
- Marine law decides who may fish in waters shared by two lands.
- The ship's owners turned to marine law over the catch.
