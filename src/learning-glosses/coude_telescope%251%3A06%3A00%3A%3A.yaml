scope: A device with mirrors that gathers light, built so that the light is led to a plate holder or to
  an instrument that splits light into colours; coude system is another name for this sense, not a telescope
  that looks straight through its tube, and not a camera.
examples:
- The coude telescope led the light to a spectrograph in the next room.
- With a coude telescope, the light is led away to a spectrograph in a fixed room.
