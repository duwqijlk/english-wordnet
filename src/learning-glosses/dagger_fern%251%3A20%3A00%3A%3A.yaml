simpleMeaning: A North American fern that keeps its leaves all year, with feather-like leaves and thick
  bunches of narrow, spear-shaped fronds
scope: A North American evergreen fern with feather-like leaves and thick bunches of spear-shaped fronds;
  also called canker brake and evergreen wood fern, not a fern that loses its leaves in winter.
examples:
- Dagger fern grew thick along the shady bank.
- The dagger fern kept its leaves through the winter.
