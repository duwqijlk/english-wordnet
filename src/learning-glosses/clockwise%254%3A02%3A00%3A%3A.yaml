simpleMeaning: In a round movement that follows the hands on a clock as they turn
scope: This word tells how a thing moves, going round the way clock hands go. It is not movement the opposite
  way round, and not the describing word for what a movement is like.
examples:
- Turn the key clockwise to lock the door.
- Please walk clockwise round the circle.
