schema: oewn-learning-gloss-v2
senseId: 'falseness%1:07:00::'
synsetId: 04875102-n
simpleMeaning: the quality of not being open or true with others, and of saying one thing while you mean
  or do another
scope: This sense, also called hollowness and insincerity, is about hiding what you think and not being
  true with people; it is not being untrue to a person you should stay loyal to, and not a fact being
  wrong.
examples:
- Her smile hid a falseness that made people not trust her.
- He spoke with falseness, saying he cared while he planned to cheat them.
