simpleMeaning: Some of them put in a plant group called Lesquerella, these herbs live for one year or
  for many years and bear puffed-up seed cases.
scope: This herb bears puffed-up seed cases and lives for one year or for many years, some kinds placed
  in the Lesquerella group, not the hairy yellow-flowered kind and not the wild lobelia kind.
examples:
- We found bladderpod with puffed-up seed cases.
- This bladderpod lives for many years and bears puffed-up seed cases.
