schema: oewn-learning-gloss-v2
senseId: 'picture_show%1:10:00::'
synsetId: 06626039-n
simpleMeaning: A kind of fun that tells a story with sound and with a run of stills that look as if they
  move without a break.
scope: This is a story told with sound and stills that look as if they move; movie, film, picture, flick,
  pic, motion-picture show, motion picture, moving-picture show and moving picture are other names for
  this sense, not a play on a stage and not a set of stills with no sound.
examples:
- They went to a picture show every Saturday night.
- The picture show told the story of a sailor lost at sea.
