simpleMeaning: In northern Australia grows a small, thin tree whose grey-green leaves most often have
  smooth edges and hang down, and whose flowers are white or cream.
scope: Of the trees of northern Australia, this small, thin one is set apart by grey-green leaves that
  hang down and by white or cream flowers.
examples:
- The silver oak has grey-green leaves that hang down.
- A silver oak in northern Australia bears white or cream flowers.
