synsetId: 03499638-n
simpleMeaning: A musical instrument with piano keys, where air pushed by bellows (a tool that pushes air)
  goes through thin reeds that can move freely to make sound
scope: This is the smaller kind with reeds and piano keys, not the large pipe kind, not an electronic
  copy, and not a part inside a body.
examples:
- The small organ in the chapel has piano keys and reeds inside it.
- He pushed air through the organ with its bellows so the reeds could sound.
