simpleMeaning: the Buddha's teaching that wanting causes suffering, that suffering ends when wanting ends,
  and that enlightenment through right conduct, wisdom and quiet thought frees one from wanting, suffering
  and rebirth
scope: The Buddha's teaching about suffering and freedom from it, not the religion of the many groups
  that follow it.
examples:
- Buddhism teaches that wanting causes suffering.
- She studied Buddhism to learn how wanting causes suffering.
