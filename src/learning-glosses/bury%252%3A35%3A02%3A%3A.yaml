simpleMeaning: To surround and cover something completely, as water does to a sinking boat.
scope: 'Another name for swallow, immerse, eat up and swallow up: total coverage on every side, not placing
  something or a body in the ground, hiding it from view, or embedding it firmly.'
examples:
- The avalanche buried the road under metres of snow.
- By morning, drifting sand had buried the fence completely.
