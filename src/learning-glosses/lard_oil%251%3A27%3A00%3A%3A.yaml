simpleMeaning: Pressed from pork fat, this fat liquid, made mostly of its main fatty part, greases machines,
  cuts metal, or gives light.
scope: This fat, pressed from pork fat, greases machines, cuts metal, or gives light.
examples:
- The lard oil greased the saw as it cut.
- He filled the lamp with lard oil.
