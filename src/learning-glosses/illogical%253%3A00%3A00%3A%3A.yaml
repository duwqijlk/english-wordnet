schema: oewn-learning-gloss-v2
senseId: 'illogical%3:00:00::'
synsetId: 01433720-a
simpleMeaning: not following a clear, correct link between ideas, so the reason does not lead to the result
scope: About reasons and ideas that do not link in a correct way, not about speech or writing that lacks
  order and jumps from one thing to another.
examples:
- 'His answer was illogical: he said the shop was closed because it was open.'
- She gave an illogical reason that did not follow from the facts.
