simpleMeaning: First on big flat discs, usually in bright sleeves, and later on tape and on small silver
  discs, one or more recordings came out together.
scope: 'Also called an album: one or more recordings put out together, not a book of photos.'
examples:
- Her new record album came out on tape as well as on disc.
- We played the record album on a small silver disc.
