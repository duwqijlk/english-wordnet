simpleMeaning: Kinds of tropical climber live one season, with large yellow blooms, fruit young and fit
  to eat, raised for its dried fibre within the ripened fruit, to serve for sponging.
scope: Also called dishcloth gourd, luffa, rag gourd, and sponge gourd, this is one of several kinds of
  tropical climber living a single season, with large yellow blooms, fruit young and fit to eat, raised
  for its dried fibre within the ripened fruit, to serve for sponging, where dishcloth gourd is a one-season
  tropical vine with big yellow blooms and young fruit good to eat, whose ripe fruit gives dried fibres
  sold as sponges, luffa is a one-season tropical climber with big yellow blooms and young fruit good
  to eat, farmed for sponges from its ripe fruit's dried fibres, rag gourd is a one-season tropical climber,
  one of several kinds, with big yellow blooms and young fruit good to eat, its ripe fruit cut for dried
  fibres used as a sponge, and sponge gourd is a one-season tropical vine with large yellow blooms and
  young fruit good to eat, farmed for the sponge from its ripe fruit's dried fibrous core.
examples:
- The strainer vine bears yellow flowers.
- Strainer vines grow in the tropics.
