simpleMeaning: A metal that gives off rays, heavier than uranium, made by hitting plutonium with neutrons.
scope: This is a metal that gives off rays and is heavier than uranium; E, Es and einsteinium are other
  names for it; it is made by hitting plutonium with neutrons, and it is not one of the metals found in
  nature.
examples:
- Atomic number 99 stands for einsteinium in the table of elements.
- The lab made atomic number 99 by hitting plutonium with neutrons.
