simpleMeaning: A political group in the United States that no longer exists, set up in 1891 to push for
  more money in use and for the state to run the railways.
scope: This was a party of the past in the United States, also called the People's Party, not a party
  that still stands for election.
examples:
- The Populist Party was formed in 1891.
- The Populist Party wanted the state to control the railroads.
