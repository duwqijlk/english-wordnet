simpleMeaning: To go away from a place and leave it with nobody or nothing in it.
scope: This is leaving a place so that it is empty behind you, not taking things out of it or letting
  it become empty by itself.
examples:
- The tenants emptied the flat and handed back the keys.
- All staff were told to empty the building by six.
