simpleMeaning: In astrology, one of four groups in the zodiac, each made of three signs 120 degrees apart
scope: This is one of four groups of three zodiac signs; trigon is another name for this sense. Not a
  single sign and not a group of four signs.
examples:
- The astrologer spoke of the triplicity of fire signs.
- She looked up the triplicity her birth sign belonged to.
