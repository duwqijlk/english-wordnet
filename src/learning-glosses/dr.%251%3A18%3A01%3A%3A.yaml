simpleMeaning: A person who holds a PhD degree, or an equal degree, from a place of higher learning.
scope: Also called doctor, this is a person with a PhD or an equal degree from a place of higher learning,
  not a medical doctor who treats sick people.
examples:
- She earned her Dr. in physics after years of study.
- The new Dr. will teach at the university this fall.
