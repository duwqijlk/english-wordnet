simpleMeaning: In baseball, an out when the batter swings and misses the ball for the third time.
scope: This is an out from swinging and missing a third time, not a flat fish or the acts of swinging
  and missing or smelling.
examples:
- The whiff ended the game.
- His third whiff sent him back to the bench.
