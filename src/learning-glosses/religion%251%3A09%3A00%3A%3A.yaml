simpleMeaning: A firm belief in a power or powers beyond nature that decide what happens to people.
scope: This is a personal belief in a supernatural power; it is not the organized institution that expresses
  such belief.
examples:
- For him, religion means trusting that a higher power guides human fate.
- The tribe's religion centers on spirits that control the harvest.
