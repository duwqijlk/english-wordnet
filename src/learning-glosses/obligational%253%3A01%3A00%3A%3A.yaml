simpleMeaning: To do with a duty set by law or by money that a person must meet
scope: Said of a thing that has to do with a duty set by law or by money, not a duty a person takes on
  freely and not a simple promise.
examples:
- The obligational authority let the officer sign the contract.
- Obligational powers come from the law, not from custom.
