simpleMeaning: A secret plan to do something harmful or against the law, especially a political plan
scope: A secret plan to do harm or break the law, not the group of people who make the plan.
examples:
- The police found a conspiracy to kill the king.
- Rumours of a conspiracy spread through the city.
