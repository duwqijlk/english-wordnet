senseId: 'petty_morel%1:20:00::'
synsetId: 11818450-n
simpleMeaning: A thornless, woody, long-lived plant spreading by underground stems, with roots more fragrant
  than wild sarsaparilla and loose branching flower clusters; native from southeastern North America to
  Mexico.
scope: This is the woodland plant with fragrant roots and loose flower clusters, not wild sarsaparilla,
  which has less fragrant roots, and not the edible morel mushroom; life-of-man is another name for the
  same plant.
examples:
- Petty morel grows in rich woods from southeastern North America to Mexico.
- She mistook the petty morel for wild sarsaparilla until she smelled its roots.
