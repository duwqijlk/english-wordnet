simpleMeaning: to turn something soft into a firm, hard mass, or make it firmer and harder than before
scope: To make a thing firm and hard, not a thing turning firm and hard on its own.
examples:
- The cold will solidify the fat in the pan.
- Heating and cooling the mixture will solidify it into a block.
