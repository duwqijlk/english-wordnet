synsetId: 14830069-n
simpleMeaning: the bits left after seeds are taken out, made of seed coats and small pieces of stem or
  leaves
scope: Also called stalk, this is the bits left after seeds are taken out, not the dry stems woven into
  baskets and hats and not a thin tube for drinking.
examples:
- After the seeds were taken out, the straw was swept up from the threshing floor.
- The straw was a mix of seed coats and small bits of stem and leaf.
