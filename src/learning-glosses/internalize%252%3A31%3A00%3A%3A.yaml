schema: oewn-learning-gloss-v2
senseId: 'internalize%2:31:00::'
synsetId: 00731766-v
simpleMeaning: to take something into your own mind and make it your own in thought and feeling
scope: This sense is about taking an idea or belief into your own mind and making it your own. It is not
  about taking food or a thing into the body.
examples:
- She internalized her teacher's advice and began to trust her own judgment.
- Over time, the students internalized the rule and followed it without being told.
