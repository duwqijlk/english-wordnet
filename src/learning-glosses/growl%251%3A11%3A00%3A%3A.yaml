simpleMeaning: A long, low, rough noise that an animal makes.
scope: 'Growling is another name for this sense: the low animal noise itself, not the action of producing
  it and not an angry muttered remark.'
examples:
- We heard a low growl from behind the bushes.
- The dog's growl warned us to stay back.
