simpleMeaning: a member of a group of monks, friars, or nuns who has promised to live without personal
  wealth, to remain celibate, and to obey the group's leaders.
scope: This sense is not the adjective describing belief in a god or things connected with worship, but
  a person who belongs to an order and has taken vows.
examples:
- Several religious from the nearby convent teach at the school.
- He lived as a religious for forty years before retiring.
