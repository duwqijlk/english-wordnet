simpleMeaning: Using echoes of high-pitched sound waves to build a picture of a body part (a sonogram),
  often used to watch a baby grow before birth or to study body parts.
scope: Using echoes of high-pitched sound waves to build a picture of a body part (a sonogram), often
  used to watch a baby grow before birth or to study body parts, also called ultrasound, sonography, and
  ultrasonography.
examples:
- Echography builds a picture of the baby.
- They use echography to watch fetal growth.
