simpleMeaning: of cells or tissue taken from another member of the same species, whose genes differ so
  the body may reject them
scope: Cells or tissue from another member of the same species, not from the same person and not from
  another species.
examples:
- The doctors used allogeneic skin to cover the burn.
- Allogeneic cells come from a donor of the same species.
