simpleMeaning: Good at using two or more groups of muscles together, smoothly and with skill
scope: Good at using more than one set of muscles together with skill; not good with the hands in one
  simple task only, and not good at planning things together.
examples:
- She was usually good with her hands and well coordinated.
- The coordinated dancer moved arms and legs together with ease.
