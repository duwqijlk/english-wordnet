simpleMeaning: A large tree with dark close-set bark low on the trunk but smooth white bark higher up;
  it gives wood much like that of European or American ash trees.
scope: A large tree with dark close-set bark low on the trunk and smooth white bark above, also called
  white mountain ash; its wood is much like that of European or American ash trees.
examples:
- The Eucalyptus fraxinoides by the road has dark bark low down and white bark above.
- Eucalyptus fraxinoides gives wood much like ash.
