simpleMeaning: A light, highly flammable blend made from crude oil, used mainly to power the engines of
  cars and other vehicles.
scope: A variant spelling of gasoline, naming the same petroleum fuel; not diesel, a heavier fuel for
  different engines.
examples:
- The antique pump still advertised gasolene at a few cents a gallon.
- Early motorists bought gasolene from a hand-cranked pump.
