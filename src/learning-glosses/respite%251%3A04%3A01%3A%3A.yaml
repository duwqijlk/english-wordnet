simpleMeaning: the act of putting off or letting go of a punishment a person was due
scope: The act of putting off or letting go of a punishment, not a short break from harm and not the verb
  sense of putting off the punishment of a person already found guilty.
examples:
- The governor granted the prisoner a respite from his sentence.
- A respite from the fine gave her time to find the money.
