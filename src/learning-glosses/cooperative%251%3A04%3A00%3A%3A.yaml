simpleMeaning: A business owned together by its members, usually set up by farmers or buyers; it makes
  and gives out goods and services for the good of its owners
scope: Also called a co-op, this is a business owned by its members, not the word for a person who is
  willing to change to reach agreement.
examples:
- The farmers sold their milk through a cooperative.
- She bought her food at the local cooperative.
