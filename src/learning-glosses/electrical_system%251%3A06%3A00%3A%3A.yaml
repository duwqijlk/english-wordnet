simpleMeaning: To start the engine, light the fuel, and run the lights, wipers, heater, air conditioner,
  and radio, a vehicle has wires and parts that send power round it
scope: The wires and parts in a vehicle that send power to its engine and fittings, not the fuel system
  and not the battery alone.
examples:
- A fault in the electrical system left the car without lights.
- The mechanic checked the electrical system before the long trip.
