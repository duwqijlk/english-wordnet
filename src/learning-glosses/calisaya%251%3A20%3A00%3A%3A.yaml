simpleMeaning: People grow this small tree or bush of Peru for its bark, used as medicine; it has big
  shiny leaves and sweet-smelling flower heads in yellow, green or red.
scope: A small tree or bush of Peru grown for its healing bark, not a garden shrub grown for its flowers
  alone.
examples:
- The calisaya grew in the hills of Peru, its bark cut for medicine.
- Farmers planted calisaya for the bark, not for its flowers.
