simpleMeaning: In electronics, a drawing that shows how one feature of a device changes as other measures
  change
scope: In electronics, a drawing that shows how one feature of a device changes; characteristic function
  is another name for this sense, not a drawing of the device itself and not a list of numbers.
examples:
- The characteristic curve shows how the device acts as the heat rises.
- On the characteristic curve you can see the change at a glance.
