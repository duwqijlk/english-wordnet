simpleMeaning: a thin, runny sour stuff, a kind of fat, found in milk and sweat and in what is left when
  fuel is made
scope: Also called propionic acid, it is a thin, runny sour stuff, a kind of fat, found in milk and sweat,
  not a drink and not a fat you eat.
examples:
- Propanoic acid gives sweat its sharp smell.
- The lab found propanoic acid in the milk sample.
