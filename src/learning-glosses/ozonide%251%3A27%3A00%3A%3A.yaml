simpleMeaning: When ozone joins a double link in a chemical that can still take in more, one of a group
  of quick-to-break chemicals comes about.
scope: It is a chemical formed by ozone joining a double link, and not ozone itself.
examples:
- An ozonide formed when ozone joined the double link.
- Ozonides break apart fast.
