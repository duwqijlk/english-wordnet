senseId: 'counteract%2:41:03::'
synsetId: 02549571-v
simpleMeaning: to work against something and make its effects weaker by doing the opposite
scope: 'Also called neutralize, counterbalance and countervail: to work against something and make its
  effects weaker, not just to oppose or check it.'
examples:
- This medicine counteracts the effects of the poison.
- New rules were added to counteract the rise in prices.
