simpleMeaning: Showing things as they really are, not as ideas or as things made up
scope: Showing things as they really are in pictures or stories, not the idea that real things are there
  whether we think of them or not.
examples:
- Her realistic portraits look just like the people she paints.
- The novel gives a realistic picture of life in a small town.
