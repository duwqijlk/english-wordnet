simpleMeaning: A 1756 British Parliament law taxing the American Colonies with a printed mark on newspapers
  and legal or trade papers, ended in 1766 after the Colonies fought it.
scope: A 1756 British Parliament law that raised money from the American Colonies by a stamp duty on newspapers
  and legal or trade papers, repealed in 1766 after colonial opposition; it is the law itself, not the
  printed mark on the paper.
examples:
- The Stamp Act put a tax on every newspaper and legal paper in the Colonies.
- People fought the Stamp Act until it was ended in 1766.
