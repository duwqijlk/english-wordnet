simpleMeaning: Dark feathers run from its head down the back of its neck on this long-legged bird of the
  southwest United States to the north of South America.
scope: This long-legged bird has dark feathers from its head down the back of its neck, not the black-winged
  stilt of Europe, Africa and Asia.
examples:
- A black-necked stilt stood on long legs with dark feathers down the back of its neck.
- We saw a black-necked stilt in the southwest of the United States.
