simpleMeaning: an open cloth of string, rope or wire woven together with even spaces between the threads
scope: An open cloth of string, rope or wire woven with even spaces; network, net, mesh and meshing are
  other names for this sense, not a solid cloth, and not a single rope.
examples:
- The meshwork of the net was woven from strong rope with even gaps.
- She mended the meshwork where the threads had come apart.
