simpleMeaning: a life scientist who sorts living things into groups by how they are built, where they
  come from, and how they act
scope: This is a life scientist who groups living things; taxonomer and taxonomist are other names for
  this sense. Not a life scientist who only watches how living things act, and not a person who sorts
  things that are not alive.
examples:
- The systematist spent years sorting the new beetles into groups.
- A systematist helped name the fish found in the deep lake.
