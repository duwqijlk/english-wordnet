simpleMeaning: In verse, a line that is short of its full beat, above all one missing a sound or more
  in its last foot
scope: A verse line short of its full beat, not a full line and not one with beats to spare.
examples:
- The catalectic line ended one beat short.
- A catalectic verse lacks a syllable in its final foot.
