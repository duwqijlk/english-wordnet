simpleMeaning: a false outside look given on purpose to hide what a thing really is
scope: This is a false outside look put on to mislead, and color and colour are other names for it, not
  a note that explains a hard word and not making a surface shine.
examples:
- He gave his lies the gloss of honest talk.
- The plan had a gloss of fairness, but it was not fair at all.
