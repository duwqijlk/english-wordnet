simpleMeaning: A big fruit of warm lands, its skin prickly and its soft flesh sharp to the taste, a close
  kin of the custard apple.
scope: It is also called guanabana, a big tropical fruit, and not the tree that bears it.
examples:
- The soft flesh of the soursop is sharp to the taste.
- A soursop has a prickly skin and soft flesh.
