simpleMeaning: One of the open-chain carbon stuffs, built from single, double, or triple links between
  its atoms, or a stuff made from one of those chains.
scope: The word is the family name for carbon stuffs whose atoms form open chains, and for things made
  from them.
examples:
- The lab keeps a shelf of aliphatic compounds for the students to test.
- The teacher drew an aliphatic compound on the board to show its open chain.
