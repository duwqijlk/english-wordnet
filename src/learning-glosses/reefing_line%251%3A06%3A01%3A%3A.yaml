simpleMeaning: In sailing, one of a few short cords sewn through a sail, used to tie up part of the sail.
scope: 'Also called reef line or reef point: in sailing, one of a few short cords sewn through a sail
  to tie up part of it, not the rope that hoists the sail.'
examples:
- The sailor pulled the reefing line as the sail came down.
- A reefing line held the folded sail in place.
