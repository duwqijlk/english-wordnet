simpleMeaning: a short, sharp sound that happens all at once
scope: Also called crack. This is a sudden sharp sound in general; it is not only the sound made by a
  finger moving on the hand, and not speaking in an angry way.
examples:
- We heard the snap of a dry twig under his foot.
- The dry branch broke with a loud snap.
