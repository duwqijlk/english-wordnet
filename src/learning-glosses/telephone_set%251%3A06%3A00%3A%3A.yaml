simpleMeaning: Voice goes in one end as sound and comes out the other end as sound, after travelling far
  as electric signals in between.
scope: People also call it a phone or a telephone, and it carries talk far by turning voice into electric
  signals and back again.
examples:
- I talked to him on the telephone set yesterday.
- She picked up the telephone set when it rang.
