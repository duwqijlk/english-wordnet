simpleMeaning: Made at five degrees Centigrade, this tough stretchy stuff is harder than the usual kind
  and often used in car tyres
scope: A tough rubber made at a low temperature, not the usual rubber; car tyres often use it.
examples:
- Cold rubber is tougher than the usual kind.
- Car tyres often use cold rubber made at five degrees Centigrade.
