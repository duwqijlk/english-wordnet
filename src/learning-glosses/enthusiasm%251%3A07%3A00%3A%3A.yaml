simpleMeaning: a very strong feeling of happy interest in something, or of thinking something is very
  good
scope: A very strong feeling of happy interest and liking, not just quiet interest or a calm yes.
examples:
- She spoke with great enthusiasm about the new plan.
- His enthusiasm for the game made everyone want to join in.
