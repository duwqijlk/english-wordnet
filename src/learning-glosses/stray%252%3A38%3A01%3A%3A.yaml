simpleMeaning: to move from place to place with no clear goal or place to go to, often looking for food
  or work
scope: 'Also called range, roll, cast, drift, wander, swan, roam, tramp, and ramble: to move from place
  to place with no fixed goal, not to turn away from a main subject in speaking or writing and not a lost
  animal.'
examples:
- The cattle strayed across the wide fields looking for food.
- He strayed from town to town, looking for work.
