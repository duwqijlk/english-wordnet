simpleMeaning: a fighting weight group for fighters who weigh more than those in the next group down and
  less than those in the next group up
scope: A fighting weight group above the lightweight group and below the welterweight group; not the lightweight
  group itself and not the group for the heaviest fighters.
examples:
- He won the light welterweight title last year.
- She moved down to light welterweight for this fight.
