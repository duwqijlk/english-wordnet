senseId: 'magnetic_inclination%1:25:00::'
synsetId: 13915590-n
simpleMeaning: In physics, the angle between a needle pulled by the earth's pull and the flat line where
  earth meets sky
scope: In physics, the angle a needle makes with the flat line where earth meets sky, not the needle's
  swing from side to side and not the earth's tilt; dip, inclination, angle of dip and magnetic dip are
  other names for this sense.
examples:
- The magnetic inclination at this place is steep, so the needle points down sharply.
- Sailors once measured the magnetic inclination to find how far north they were.
