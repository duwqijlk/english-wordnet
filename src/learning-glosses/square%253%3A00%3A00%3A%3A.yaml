simpleMeaning: having four sides of the same length and four corners of ninety degrees, or forming a ninety-degree
  corner.
scope: This is not about being honest or fair; it describes a shape with four equal sides and right angles.
examples:
- The table was square, with room for four people.
- He drew a square box around the answer.
