senseId: 'polyneuritic_psychosis%1:26:00::'
synsetId: 14419001-n
simpleMeaning: A person forgets recent things but keeps old memories in this loss of clear thought, seen
  late in long, heavy drinking
scope: Also called alcohol amnestic disorder and alcoholic dementia, this is a loss of clear thought late
  in long, heavy drinking, in which old memories stay clear, not a loss of all memory.
examples:
- Polyneuritic psychosis left him unable to recall what had happened that morning, though he could still
  recall his childhood.
- With polyneuritic psychosis, she could still tell stories from years ago but not what she had done that
  morning.
