simpleMeaning: At times put in the Centaurea group, this Asian plant is grown far and wide for its pink
  flowers with a nice smell.
scope: This is the Asian plant grown far and wide for its pink flowers, not the plant of the mountains
  of Iran and Iraq and not the yearly plant of the Mediterranean with yellow flowers.
examples:
