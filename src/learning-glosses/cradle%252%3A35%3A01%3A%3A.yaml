simpleMeaning: to wash something in a long box that is rocked from side to side
scope: Washing something in a rocking long box, as miners do to find gold, not holding a baby in your
  arms and not cutting grain.
examples:
- The miners cradled the earth, washing it in the rocking box to find gold.
- He cradled the soil in water, shaking it from side to side to wash out the gold.
