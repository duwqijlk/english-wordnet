simpleMeaning: A plant with one or two white star-shaped flowers on short stalks with no leaves; from
  Alaska to California and east to Oregon and Montana.
scope: Also called bride's bonnet and queen's cup, this is a low plant of the far north-west with white
  star flowers, not a garden lily grown for show.
examples:
- The Clintonia uniflora blooms in the shady woods.
- Clintonia uniflora bears a single white flower.
