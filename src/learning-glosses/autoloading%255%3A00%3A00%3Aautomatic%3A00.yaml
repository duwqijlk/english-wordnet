simpleMeaning: Said of a gun that fills itself with bullets and keeps firing on its own.
scope: This word is used of a gun that fires again and again on its own, also called semiautomatic or
  self-loading, not a gun that must be loaded by hand each time.
examples:
- The autoloading rifle fired at the range.
- The autoloading rifle fired shot after shot without stopping.
