simpleMeaning: An upright shrub of California with leaves that have lobes shaped like the blood-pumping
  organ at their base.
scope: An upright California shrub with leaves that have lobes shaped like the blood-pumping organ at
  their base, not any other shrub of California and not a low bush that spreads along the ground.
examples:
- Heartleaf manzanita grows on the dry hills of California.
- The heartleaf manzanita has leaves with lobes shaped like a heart at the base.
