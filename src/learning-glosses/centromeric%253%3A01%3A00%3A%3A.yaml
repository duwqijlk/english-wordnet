simpleMeaning: 'Where the threads that pull it apart join when the cell splits: the thick special part
  of a chromosome, the body that holds a cell''s instructions.'
scope: Of the thick special part of a chromosome where the pulling threads join when the cell splits;
  not of the whole chromosome.
examples:
- The centromeric part of the chromosome is thick and special.
- The pulling threads join at the centromeric part when the cell splits.
