simpleMeaning: A way of sorting what runs in the veins by the marks on it, for putting it into a sick
  person; the four kinds are A, B, AB, and O
scope: This sorting of blood by the marks on it is used before giving blood to a sick person, and the
  four kinds are A, B, AB, and O; ABO blood group system and ABO group are other names for it.
examples:
- The ABO system sorts blood into four kinds.
- Doctors use the ABO system before a transfusion.
