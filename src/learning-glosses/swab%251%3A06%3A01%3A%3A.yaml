simpleMeaning: a small piece of cotton used to put on medicine, to clean a wound, or to take a small bit
  of fluid from the body for a test
scope: This is the small cotton piece used for medicine, cleaning a cut or taking a test bit, not the
  larger cleaning tool on a handle for floors and not the act of washing.
examples:
- The nurse used a swab to clean the small cut on his arm.
- She took a swab from inside his mouth for the test.
