simpleMeaning: to put events together in a story or picture so that they happen at the same time
scope: To set events so they happen at the same time in a story or picture, not to put events in the order
  they really happened; contemporize and synchronize are other names for this sense.
examples:
- The film contemporises the two wars, showing them side by side.
- She contemporised the kings' lives so they seemed to live at the same time.
