simpleMeaning: A tall cone-shaped tree of the Rocky Mountains and British Columbia, with blue-green needles
  and a sharply pointed crown; its wood is used for rough boards and boxes.
scope: A tall mountain spruce, also called Engelmann's spruce and Picea engelmannii; not a lowland spruce
  and not a pine.
examples:
- The Engelmann spruce grows high in the Rocky Mountains.
- Engelmann spruce wood makes light, strong boxes.
