simpleMeaning: to fight to beat or stop a force, or a leaning inside you, that works against you
scope: This is to fight to beat a force or a leaning inside you. It is not taking part in a sport match,
  and it is not moving the body by twisting and bending.
examples:
- He wrestled with fear all his life.
- She wrestled with a strong wish to give up.
