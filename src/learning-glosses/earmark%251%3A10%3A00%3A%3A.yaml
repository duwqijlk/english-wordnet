simpleMeaning: a mark on the ear of an animal kept by people, used to tell one animal from another
scope: This is a real mark on an animal's ear, used to know the animal; it is not the special quality
  that makes a person or thing easy to know.
examples:
- The farmer put an earmark on each cow so he could tell them apart.
- You can see the earmark on the sheep's left ear.
