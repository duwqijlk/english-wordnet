simpleMeaning: a way of measuring how much of a substance is in a sample by adding set amounts of a known
  liquid used in a test
scope: A way of measuring how much of a substance is in a sample by adding set amounts of a known liquid,
  not a way of weighing the sample and not a test that only names what is in it.
examples:
- Volumetric analysis showed how much acid was in the sample.
- The student used volumetric analysis to measure the salt in the water.
