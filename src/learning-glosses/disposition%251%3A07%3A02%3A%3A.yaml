simpleMeaning: a way a person or thing is likely to act or be, built in from birth or picked up over time
scope: This is a built-in or learned tendency, not a passing mood and not a decision made on the spot.
examples:
- A swelling with a disposition to rupture needs watching.
- Her cheerful disposition made her easy to work with.
