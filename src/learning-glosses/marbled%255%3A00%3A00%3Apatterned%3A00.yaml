simpleMeaning: having a pattern of thin lines and streaks of color like the natural stone used for floors
  and statues
scope: 'Also called marbleized and marbleised: having lines and streaks like stone, not made of solid
  stone itself and not meat with white fat lines through it.'
examples:
- The table has a marbled top with thin grey lines.
- She chose marbled paper with blue and white streaks.
