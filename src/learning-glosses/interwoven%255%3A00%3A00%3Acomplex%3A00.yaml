simpleMeaning: joined or held very close together, with parts fitting into each other
scope: 'Also called interlocking and interlacing: parts joined and held close together, with each part
  fitting into another; not just placed side by side or loosely tied.'
examples:
- The interwoven threads made a strong, thick cloth.
- Her long hair was interwoven with small white flowers.
