simpleMeaning: A warm sea current that flows to the north-east past the coast of Japan into the northern
  Pacific
scope: Also called the Japan current and the Kuroshio current, it is a warm sea current that flows to
  the north-east past Japan into the northern Pacific, not a cold current and not a current of the Atlantic.
examples:
- The Kuroshio flows past the coast of Japan.
- Warm water from the Kuroshio reaches the northern Pacific.
