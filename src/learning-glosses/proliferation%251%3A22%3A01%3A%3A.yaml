simpleMeaning: a quick growth in number, especially a quick growth in the number of deadly weapons
scope: A quick growth in number, especially of deadly weapons; not the weapons themselves and not a slow
  growth over time.
examples:
- The proliferation of nuclear weapons worried leaders around the world.
- The city tried to stop the proliferation of guns on its streets.
