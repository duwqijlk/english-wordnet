simpleMeaning: A small tree of southern Africa that sheds its leaves and bears fruit one can eat.
scope: A small tree of southern Africa that sheds its leaves and bears fruit one can eat, not the fruit
  itself, and not the small Eurasian tree grown for fruit like crab apples.
examples:
- A medlar grows wild in the hills of southern Africa.
- The medlar lost its leaves in the dry season and bore fruit in spring.
