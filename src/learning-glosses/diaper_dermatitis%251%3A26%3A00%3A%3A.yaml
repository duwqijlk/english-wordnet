simpleMeaning: Babies get sore red skin on their thighs and bottoms, thought to come from ammonia in the
  urine in their wet nappies
scope: Also called diaper rash; not other sore skin on a baby.
examples:
- The baby's diaper dermatitis made her thighs sore and red.
- His diaper dermatitis was thought to come from ammonia in his wet diapers.
