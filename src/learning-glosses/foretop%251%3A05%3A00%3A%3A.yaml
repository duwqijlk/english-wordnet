simpleMeaning: A tuft of a horse's mane that grows forward, between its ears.
scope: A tuft of mane between a horse's ears; forelock is another name for this sense, not the mane on
  the neck and not a horse's tail hair.
examples:
- The groom brushed the foretop flat between the horse's ears.
- Her foretop fell over her eyes when she shook her head.
