simpleMeaning: One of the parts in the wrist, set in line with the fourth and fifth fingers
scope: The wrist part in line with the fourth and fifth fingers, not another wrist part and not a finger
  part; hamate and os hamatum are other names for this sense.
examples:
- The hamate bone sits in line with the fourth and fifth fingers.
- He broke his hamate bone in the fall.
