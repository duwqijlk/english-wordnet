simpleMeaning: a long-lived evergreen that forms thick low tufts, with smooth round or heart-shaped leaves
  turning copper, maroon or purple in autumn and small white flowers on upright stems.
scope: This is the low evergreen plant also called galax, beetleweed or coltsfoot, not the star system
  or a glittering group of famous people.
examples:
- A patch of galaxy turned copper in the autumn.
- Florists use galaxy leaves in flower arrangements.
