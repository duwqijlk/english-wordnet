simpleMeaning: Water on top of a glacier runs down a steep shaft in the ice, boring down to the rock below
  or to the depth where cracks often form.
scope: Also called glacier mill, this is a steep shaft in a glacier through which water on top runs down,
  not a crack in the ice itself.
examples:
- The river plunged into the moulin and vanished into the glacier.
- A moulin bores down through the ice to the rock below.
