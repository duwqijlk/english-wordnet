senseId: 'cardiopulmonary_resuscitation%1:04:00::'
synsetId: 00834287-n
simpleMeaning: Emergency chest compressions and artificial breathing for someone who has collapsed with
  no pulse and stopped breathing, given first to restart the heart, restore blood flow and prevent brain
  damage.
scope: This is another name for cardiac resuscitation and the kiss of life; it is not mouth-to-mouth breathing
  on its own.
examples:
- She performed cardiopulmonary resuscitation until the ambulance arrived.
- Training in cardiopulmonary resuscitation is now part of the school curriculum.
