senseId: 'pheromone%1:27:00::'
synsetId: 14871060-n
simpleMeaning: A chemical given off by an animal, especially an insect, that changes how other animals
  of the same kind act or how their bodies work.
scope: A chemical given off by an animal that works on others of its own kind, not one made inside the
  body.
examples:
- The moth released a pheromone that drew others to it.
- Bees follow a pheromone trail left by their sisters.
