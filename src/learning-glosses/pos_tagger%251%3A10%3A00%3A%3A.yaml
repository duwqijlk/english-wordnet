simpleMeaning: Each word gets marked with its kind, such as noun or verb, by this computer program
scope: 'Also called part-of-speech tagger: a program that marks each word with its kind, not a program
  that checks spelling and not a list of words.'
examples:
- The pos tagger marked every word in the sentence with its part of speech.
- We ran the text through a pos tagger to find all the verbs.
