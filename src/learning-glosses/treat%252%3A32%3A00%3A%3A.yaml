simpleMeaning: to speak or write about a subject, or present it in a book, film or other work of art
scope: This is about dealing with a subject in speech, writing or art, not about giving medical care to
  a patient, and not about paying for someone's food or a present.
examples:
- The film treats the history of China through the eyes of one family.
- Her new book treats the history of the city in three parts.
