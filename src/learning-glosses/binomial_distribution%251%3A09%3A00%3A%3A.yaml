senseId: 'binomial_distribution%1:09:00::'
synsetId: 06046209-n
simpleMeaning: A pattern, worked out in theory, of how often each count of wins turns up in a set number
  of separate tries with the same chance of a win.
scope: This pattern, worked out in theory, shows how often each count of wins turns up in a set number
  of separate tries, not a count of wins from real tries and not a pattern where the chances change.
examples:
- The binomial distribution gives the chance of three wins in ten tries.
- She used the binomial distribution to work out the chances.
