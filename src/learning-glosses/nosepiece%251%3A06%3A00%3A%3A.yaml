simpleMeaning: The middle part of glasses that rests on the nose and holds the lenses together.
scope: The middle part of glasses that rests on the nose; also called a bridge; not a plate of armour
  that guards the nose, and not a strap of a bridle that goes over the animal's nose.
examples:
- The nosepiece of their glasses pressed on their nose.
- They bent the nosepiece so the glasses sat straight.
