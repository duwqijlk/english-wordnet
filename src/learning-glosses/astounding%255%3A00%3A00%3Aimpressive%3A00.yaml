simpleMeaning: So surprising and impressive that it leaves a person stunned and unable to take it in.
scope: So impressive it stuns, also called astonishing and staggering, and not merely strange or hard
  to believe.
examples:
- The astounding news left us speechless.
- Her astounding achievement won her wide praise.
