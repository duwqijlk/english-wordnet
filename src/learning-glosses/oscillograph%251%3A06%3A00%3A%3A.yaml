simpleMeaning: A tool that draws a record of the wave shapes made by electric push and flow as they go
  up and down
scope: A tool that records the wave shapes of changing electric push and flow, not a tool that measures
  steady current and not a screen that shows pictures.
examples:
- The engineer used an oscillograph to record the wave form of the current.
- An oscillograph drew the changing voltage as a wavy line on paper.
