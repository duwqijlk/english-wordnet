simpleMeaning: either of two blood tubes that branch from a neck blood tube and feed the face
scope: Either of two blood tubes branching from a neck blood tube; arteria maxillaris is another name
  for this sense, not a vein and not a blood tube of the arm.
examples:
- The maxillary artery supplies blood to the face.
- Surgeons take care near the maxillary artery.
