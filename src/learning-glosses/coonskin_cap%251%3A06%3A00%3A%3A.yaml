simpleMeaning: a hat made from the fur of a raccoon, with the tail left to hang down the back
scope: A hat made of raccoon fur with the tail hanging down the back, also called a coonskin; not a hat
  made of other fur and not one with no tail.
examples:
- He wore a coonskin cap to the frontier fair.
- The tail of his coonskin cap hung down his back.
