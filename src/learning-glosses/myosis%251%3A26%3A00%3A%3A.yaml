simpleMeaning: Many people at once are struck by sudden fits of pain, most times in the chest, when this
  sickness spreads.
scope: Also called diaphragmatic pleurisy, epidemic myalgia, and epidemic pleurodynia, this sickness strikes
  many people at once with sudden fits of pain, most times in the chest, and it is not the shrinking of
  the pupil in bright light.
examples:
- Myosis struck the whole town at once.
- After the myosis struck, sudden fits of pain came in the chest.
