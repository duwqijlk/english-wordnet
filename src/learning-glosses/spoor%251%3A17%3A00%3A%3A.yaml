simpleMeaning: a line of marks or signs left on the ground by a person or an animal, which a hunter follows
  to find the animal
scope: The marks or signs left behind on the ground; not the animal itself and not the act of hunting.
examples:
- The hounds followed the fox's spoor across the field.
- He found fresh spoor in the mud near the river.
