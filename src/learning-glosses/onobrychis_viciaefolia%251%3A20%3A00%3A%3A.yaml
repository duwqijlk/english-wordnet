simpleMeaning: A Eurasian perennial plant with pale pink flowers and curved pods; wild in Britain and
  North America grasslands on chalky soils; an important feed crop and honey source in Britain.
scope: Also called esparcet, holy clover, sainfoin, sanfoin and Onobrychis viciifolia; a plant with pale
  pink flowers and curved pods, not a clover of the lawn and not a pea plant.
examples:
- Onobrychis viciaefolia grows in the chalky grassland.
- Bees gather honey from Onobrychis viciaefolia.
