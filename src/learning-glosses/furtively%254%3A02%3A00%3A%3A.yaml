simpleMeaning: in a secret way, trying not to be seen or noticed
scope: This means done in a secret way, trying not to be seen or noticed; it is not done openly.
examples:
- He glanced furtively at the letter lying on her desk.
- The soldiers moved furtively through the dark fields.
