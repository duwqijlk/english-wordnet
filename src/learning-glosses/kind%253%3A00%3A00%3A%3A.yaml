simpleMeaning: describes a person, or the way a person acts, who cares about other people and gently tries
  to help them
scope: This describes a warm, caring character, not something that is merely pleasant or comfortable.
examples:
- It was kind of you to carry her bags.
- He gave the frightened child a kind smile.
