schema: oewn-learning-gloss-v2
senseId: 'unreality%1:07:00::'
synsetId: 04769747-n
simpleMeaning: A thing has this quality when it is not real
scope: This is the quality a thing has when it is not real. It is not the state sense, where something
  is not solid or not really there, or is only in the mind.
examples:
- The dream had a strong sense of unreality, as if nothing in it was real.
- He felt a feeling of unreality when he saw the empty street in the film.
