simpleMeaning: This word is used for the ringed worms of the group Annelida, and for anything to do with
  them or like them.
scope: Also called annelid, this word marks anything that belongs to, or is like, the ringed worms of
  the group Annelida.
examples:
- The annelidan worm had the ringed body of its group.
- Any worm of the group Annelida shows annelidan traits in its ringed body.
