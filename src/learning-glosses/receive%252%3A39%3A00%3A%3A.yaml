simpleMeaning: To take in something that is seen, heard, felt, or detected by a device, such as light
  or a signal.
scope: This sense is not about being given a particular treatment or response, but about taking in something
  that is seen, heard, felt, or detected by a device.
examples:
- The antenna receives signals from distant stations.
- Our eyes receive light and turn it into signals for the brain.
