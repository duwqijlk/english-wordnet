simpleMeaning: In physics, when the push on a perfect gas stays the same, its weight for its size goes
  up as it gets colder, and down as it gets hotter.
scope: In physics, a rule about how a gas changes with heat, not a rule about how fast a gas moves or
  how gases mix; also called law of volumes and Gay-Lussac's law.
examples:
- Charles's law tells us how a gas changes when it is heated.
- The teacher showed Charles's law with a balloon and hot water.
