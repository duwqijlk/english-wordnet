simpleMeaning: to stop trying, beaten and without hope, and say you have lost
scope: 'Also called quit, chuck up the sponge, drop out, fall by the wayside and give up: to stop trying,
  beaten and without hope, and say you have lost, not to stop for a rest and not to leave a place.'
examples:
- After two bad losses, the team dropped by the wayside and stopped trying.
- Many runners drop by the wayside when the race gets hard and hope runs out.
