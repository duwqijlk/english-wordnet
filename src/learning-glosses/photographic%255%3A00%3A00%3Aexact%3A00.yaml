simpleMeaning: showing people or nature in a way that looks as exact and true to life as a picture taken
  with a camera
scope: About how exact and true to life a drawing, painting, or other picture looks, not about taking
  pictures with a camera or the tools used for it.
examples:
- His paintings are almost photographic in how they show every small line on a face.
- The artist made a photographic copy of the forest, with each leaf clear and true.
