simpleMeaning: an American art movement from the Hudson River school, active 1850 to 1870, that painted
  real land scenes showing light in the air and far views made to look deep
scope: An American art movement of 1850 to 1870, not the Hudson River school it grew from and not a later
  style of painting.
examples:
- Luminism is known for its calm, glowing scenes of light on water.
- The show brought together fine examples of luminism from the 1860s.
