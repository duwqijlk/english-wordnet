simpleMeaning: a machine, especially one that runs on power, that moves or turns in small separate steps
scope: A machine that turns in small separate steps, not one that turns in one smooth turn, also called
  stepper.
examples:
- The stepping motor turned the wheel a little at a time.
- We used a stepping motor to move the camera in small steps.
