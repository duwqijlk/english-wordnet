simpleMeaning: An X-ray test of the kidneys and the tubes that carry urine, done after a dye is put into
  a vein to make them show up.
scope: An X-ray test of the kidneys done with dye put into a vein, not a plain X-ray and not a test done
  by putting dye straight into the kidneys.
examples:
- The doctor ordered intravenous pyelography to look at her kidneys.
- Intravenous pyelography showed a blockage in the tube from the kidney.
