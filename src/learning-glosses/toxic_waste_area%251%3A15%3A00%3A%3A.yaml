senseId: 'toxic_waste_area%1:15:00::'
synsetId: 08679205-n
simpleMeaning: a place where harmful rubbish has been left and the Environmental Protection Agency has
  said it must be cleared away
scope: This is a dump site marked by the Environmental Protection Agency for cleaning up, and toxic site
  is another name for it; it is not a place where rubbish is dumped each day and not a factory that makes
  harmful waste.
examples:
- The old toxic waste area on the edge of town is fenced off.
- Workers in suits tested the soil at the toxic waste area before the clean-up began.
