simpleMeaning: a small holder fixed to the top edge of a boat that keeps an oar in place and lets it turn
  as you row
scope: A small holder on a boat that keeps an oar in place, not a small piece of wood or metal used to
  hold things together and not a piece of jewellery worn on clothes.
examples:
- The oar slipped out of its pin as he rowed.
- He set the oar back in the pin and pulled hard.
