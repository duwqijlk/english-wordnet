simpleMeaning: A set of related tongues of the Kamarupan group, used in western Burma, in Bangladesh,
  and in the far east of India
scope: A set of tongues, also called the Chin language, Kuki, Kuki-Chin, the Kuki-Chin language, and the
  Kuki language; not one tongue and not a people.
examples:
- Chin covers tongues used in Burma, Bangladesh, and India.
- She grew up hearing Chin at home.
