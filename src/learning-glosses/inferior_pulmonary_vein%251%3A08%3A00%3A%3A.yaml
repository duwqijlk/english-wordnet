simpleMeaning: One of two blood tubes, left and right, that carry blood back from the lower parts of the
  lungs.
scope: One of the two blood tubes that carry blood back from the lower parts of the lungs, also called
  vena pulmanalis inferior; not a blood tube that carries blood to the lungs and not one from the upper
  parts.
examples:
- The inferior pulmonary vein returns blood from the lower lung.
- Blood from the left inferior pulmonary vein flows back to the heart.
