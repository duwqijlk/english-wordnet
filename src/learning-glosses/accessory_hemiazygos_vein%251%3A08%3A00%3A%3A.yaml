simpleMeaning: a blood tube made where the 4th to 7th tubes between the back ribs join, which drains into
  the azygos tube
scope: 'Also called accessory hemiazygous vein and vena hemiazygos accessoria: a chest blood tube that
  drains into the azygos vein, not the main azygos vein itself.'
examples:
- The accessory hemiazygos vein joins the azygos vein in the chest.
- Blood from the back ribs drains through the accessory hemiazygos vein.
