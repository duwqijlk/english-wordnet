simpleMeaning: In old Greek and Roman stories, a man who serves Bacchus, the god of wine, as a priest
  or follower
scope: A man who serves Bacchus in old stories, not a woman who serves him and not a priest of another
  god.
examples:
- The bacchant danced in the procession for Bacchus.
- In the play, a bacchant carried wine to the feast.
