senseId: 'lorentz_force%1:19:00::'
synsetId: 11496082-n
simpleMeaning: The push felt by a tiny charged bit moving along a wire in a magnetic field, at right angles
  to both the flow of current and the field.
scope: Not the pull of gravity or of a magnet on its own; the push that acts on a charged bit moving in
  a magnetic field.
examples:
- The Lorentz force can be used to suspend a current-carrying object between two magnets.
- A Lorentz force acts at right angles to the current.
