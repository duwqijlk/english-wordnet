schema: oewn-learning-gloss-v2
senseId: 'falsely%4:02:01::'
synsetId: 00338017-r
simpleMeaning: In a way that is not sincere, acting as if you mean things you do not truly mean.
scope: This is acting in a way that is not sincere; not simply saying something untrue by mistake, and
  not lying in a direct and open way.
examples:
- They chatted falsely about this and that, as though nothing had happened.
- He smiled falsely and said he was glad to see her.
