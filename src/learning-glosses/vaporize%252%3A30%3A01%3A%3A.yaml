senseId: 'vaporize%2:30:01::'
synsetId: 00367511-v
simpleMeaning: to lose liquid as it turns to gas, or make liquid turn to gas, leaving what is left more
  concentrated
scope: To lose liquid as it turns to gas, leaving what is left more concentrated; evaporate is another
  name for this sense, not to vanish quickly into nothing.
examples:
- Vaporize the milk slowly until it thickens.
- The sauce will vaporize if you leave it on high heat.
