simpleMeaning: to win against someone by using a cleverer plan or by moving in a cleverer way
scope: 'Also called outsmart: to win by a cleverer plan or move, not just to win by being stronger or
  faster.'
examples:
- The small team outmaneuvered the larger team with a clever plan.
- She outmaneuvered her rival by moving quickly to the other side.
