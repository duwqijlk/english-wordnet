senseId: 'elbow%2:35:00::'
synsetId: 01242058-v
simpleMeaning: to push the pointed part in the middle of your arm hard into another person's ribs
scope: This is pushing with the pointed part of the arm into another person's ribs; not pushing your way
  past people with the arms, not the arm joint itself, and not the part of a sleeve.
examples:
- He elbowed the man next to him in the ribs to get his attention.
- She elbowed her brother in the ribs and told him to be quiet.
