simpleMeaning: a part of an aircraft that pushes against the air as it moves, creating force to lift or
  steer the plane
scope: This means a physical aircraft part, not the outer layer of an object or the outward appearance
  of a situation.
examples:
- The plane's tail surface moves to keep the nose steady.
- Engineers tested every control surface in the wind tunnel.
