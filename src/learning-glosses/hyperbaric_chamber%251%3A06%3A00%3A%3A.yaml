simpleMeaning: To treat breathing troubles or poisoning by carbon monoxide, people go into a big room
  where the air holds more oxygen than usual.
scope: This is a room where patients breathe extra oxygen, not an ordinary hospital room.
examples:
- The diver spent two hours in the hyperbaric chamber after the accident.
- Doctors put the patient in a hyperbaric chamber to treat carbon monoxide poisoning.
