simpleMeaning: An upright small shrub with purple-tinted flowers and a swollen pod in which the ripe seeds
  shake and make a noise; it grows in India
scope: Also called Crotalaria spectabilis; a shrub of India whose seeds shake inside a swollen pod.
examples:
- The Indian rattlebox stood by the road, its pods dry and ready to shake.
- When the wind blew, the Indian rattlebox pods gave a soft rattle.
