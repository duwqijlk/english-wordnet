simpleMeaning: The small jumps of tiny bits hung in a gas or a liquid, moving every which way.
scope: Also called pedesis or Brownian motion; the random movement of tiny bits hung in a gas or a liquid,
  each bit moving on its own.
examples:
- Brownian movement makes the tiny bits dance in the water.
- We watched Brownian movement under the glass.
