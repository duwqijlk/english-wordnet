simpleMeaning: measured or counted in the opposite direction from the one called positive
scope: This is about a direction or value measured opposite to the positive one, not about a number below
  zero and not about electric charge.
examples:
- The bank began charging negative interest on large deposits.
- The meter showed a negative reading, meaning the flow had reversed.
