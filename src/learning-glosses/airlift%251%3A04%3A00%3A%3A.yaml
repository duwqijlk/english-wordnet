simpleMeaning: the carrying of people or goods by air, especially when no other way of reaching the place
  can be used
scope: 'Also called lift: carrying people or goods by air, especially when other ways cannot reach the
  place, not carrying them by road or by sea.'
examples:
- An airlift brought food to the town cut off by floods.
- The airlift carried sick people to a hospital in the city.
