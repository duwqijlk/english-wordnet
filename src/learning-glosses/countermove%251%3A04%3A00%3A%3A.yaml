senseId: 'countermove%1:04:00::'
synsetId: 00980259-n
simpleMeaning: An attack by soldiers on the defence against an attacking enemy force, to win back lost
  ground or cut off the enemy's front units, or the like.
scope: Also called a counterattack, an attack by soldiers on the defence against an attacking enemy.
examples:
- The general ordered a countermove to win back the lost hill.
- Their countermove cut off the enemy's front units.
