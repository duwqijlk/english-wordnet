simpleMeaning: A small fly like a mosquito, whose young feed on fungi or on dead and rotting plants
scope: This is a small fly like a mosquito whose young feed on fungi or dead plants; not the tiny dark
  flies that harm mushrooms and young plants.
examples:
- A fungus gnat flew around the damp soil.
- The fungus gnat lays eggs where fungi grow.
