simpleMeaning: giving yourself fully, in your thoughts and feelings, to one course of action
scope: 'Another name for this is loyalty, commitment, or allegiance: giving yourself fully to a course
  of action, not a short note written in a book for someone.'
examples:
- His dedication to public service lasted his whole life.
- She showed real dedication to the team, even when they kept losing.
