simpleMeaning: A past political group in the United States, set up in 1848 to fight slavery spreading
  into the new lands, which joined the Liberty group that year
scope: A past political group of the United States, set up in 1848 to fight slavery spreading into the
  new lands, which joined the Liberty group that year, to be told apart from the earlier Federal Party,
  which backed strong central rule.
examples:
- The Free Soil Party was formed in 1848.
- Members of the Free Soil Party opposed slavery in the territories.
