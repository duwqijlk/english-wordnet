simpleMeaning: A meter for finding, telling apart, or measuring small flows of electricity.
scope: This is a meter for finding, telling apart, or measuring small flows of electricity; not a meter
  for strong currents, and not a meter for heat.
examples:
- The galvanometer showed a small flow of electricity in the wire.
- She read the needle on the galvanometer.
