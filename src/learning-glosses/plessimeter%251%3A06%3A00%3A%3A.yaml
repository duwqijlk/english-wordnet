simpleMeaning: A small thin metal plate held on the body and tapped with a plexor (a small hammer) during
  tapping tests
scope: A small thin metal plate held on the body and tapped with a plexor during tapping tests; pleximeter
  is another name for this sense, and this is not the hammer itself.
examples:
- The doctor held the plessimeter against the patient's chest.
- She tapped the plessimeter with the plexor to test the chest.
