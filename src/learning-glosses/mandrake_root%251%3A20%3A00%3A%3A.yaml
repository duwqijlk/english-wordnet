simpleMeaning: As a drug or a medicine, this is the part of a plant that grows under the ground
scope: Also called mandrake, this is the underground part of the plant used as a medicine or a drug, not
  the whole plant and not any other root.
examples:
- The mandrake root was ground up for medicine.
- Old books say mandrake root can put a person to sleep.
