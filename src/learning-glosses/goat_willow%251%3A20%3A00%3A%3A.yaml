simpleMeaning: a much-branched tree of the Old World with big flower clusters and fairly big wide leaves
scope: A much-branched tree of the Old World with big flower clusters and fairly big wide leaves; florist's
  willow is another name for this sense, not a tree with hanging branches and not a poplar.
examples:
- Goat willows grow along the river.
- The goat willow had big flower clusters in spring.
