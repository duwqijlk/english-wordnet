simpleMeaning: A state of rest that comes back again and again, in which a person dreams and the sight
  organs move quickly from side to side
scope: A sleep state in which a person dreams, also called paradoxical sleep or rapid eye movement; not
  deep dreamless sleep and not the waking state.
examples:
- Rapid eye movement sleep is when most dreams happen.
- He spent much of the night in rapid eye movement sleep.
