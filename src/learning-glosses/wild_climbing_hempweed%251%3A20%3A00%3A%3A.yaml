simpleMeaning: Flowers that smell of vanilla mark this herb of warm America, which grows up the sides
  of trees.
scope: Also called climbing boneset, climbing hemp-vine, and climbing hempweed, this herb is known by
  vanilla-scented flowers and a habit of climbing trees.
examples:
- Up the side of a tree, wild climbing hempweed showed flowers that smell of vanilla.
- The wild climbing hempweed climbs trees in warm America.
