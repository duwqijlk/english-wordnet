simpleMeaning: For fixing dyes, keeping wood from rotting, and laying metal on things with an electric
  current, this powder with no colour melts in water.
scope: White vitriol, zinc sulfate, and zinc vitriol are other names for this powder, used to fix dyes,
  to keep wood from rotting, or to lay metal on things with an electric current.
examples:
- The tanner used zinc sulphate to fix the dye.
- A spoonful of zinc sulphate went into the wood wash.
