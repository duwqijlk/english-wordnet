simpleMeaning: having skin hurt by too much direct sun
scope: This sense is also called sunburned. It is about skin hurt by too much direct sun, not about just
  feeling warm in the sun.
examples:
- After a day at the beach without cream, his back was sunburnt and sore.
- She was sunburnt on her shoulders after working all day in the sun.
