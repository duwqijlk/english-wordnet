simpleMeaning: A moving belt that brings bags to air travellers so they can pick them up.
scope: This is a moving belt that brings bags to air travellers, not a belt that moves bags between planes
  and not a roundabout for children; carousel, carrousel and luggage carousel are other names for this
  sense.
examples:
- Our bags came round on the luggage carrousel.
- Passengers waited by the luggage carrousel for their suitcases.
