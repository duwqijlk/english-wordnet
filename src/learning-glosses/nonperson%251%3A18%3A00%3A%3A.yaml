senseId: 'nonperson%1:18:00::'
synsetId: 10381224-n
simpleMeaning: someone treated as if they do not exist and have no rights, whose being is set aside on
  purpose, above all for reasons of belief or power
scope: Someone treated as if they do not exist and have no rights; also called unperson, not a stranger
  and not a person who has simply been forgotten.
examples:
- The regime treated the writer as a nonperson, and her name vanished from the books.
- After the purge he became a nonperson with no rights at all.
