simpleMeaning: Of a person, awkward and rough in manner, with no elegance or social polish.
scope: This is a lasting lack of polish in a person's manner, not the sense of an animal of inferior or
  mixed breed.
examples:
- The underbred visitors did not know how to behave at the formal dinner.
- He seemed underbred beside the officers, for all his education.
