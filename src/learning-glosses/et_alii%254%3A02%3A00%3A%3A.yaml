simpleMeaning: Used after a name to mean 'and other men', the masculine plural form.
scope: The masculine plural, used for men or a mixed group; not the feminine 'et aliae' or the neuter
  'et alia'.
examples:
- The citation credits Moreau et alii with the original discovery.
- Because all four authors were men, the paper used 'Brown et alii'.
