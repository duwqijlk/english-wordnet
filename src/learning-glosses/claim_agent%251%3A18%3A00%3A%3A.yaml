simpleMeaning: a person who checks requests for money after loss or harm and says what fair payment should
  be
scope: A person who checks money requests after loss or harm; adjuster, adjustor, claims adjuster and
  claims adjustor are other names for this sense, not a lawyer and not the person who makes the request.
examples:
- The claim agent came to look at the damage to my car.
- After the fire, a claim agent checked what the policy would pay.
