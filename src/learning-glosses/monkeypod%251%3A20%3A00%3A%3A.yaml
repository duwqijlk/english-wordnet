simpleMeaning: This big tree of the American tropics, grown for its looks, has twice-divided feathery
  leaves, ball-shaped clusters of scarlet-stamened blooms, and seed pods that cattle feed on.
scope: Another name for that same tropical American ornamental tree, also called rain tree and zaman;
  it is the tree itself, not the pods alone.
examples:
- The monkeypod in the plaza is older than the church.
- Cattle gathered in the shade of the monkeypod.
