simpleMeaning: A B vitamin used to treat a serious illness of the blood
scope: 'Also called cobalamin and cyanocobalamin: a B vitamin used to treat a serious illness of the blood,
  not another B vitamin used for a different illness and not a drug that treats a different blood illness.'
examples:
- The doctor gave her antipernicious anemia factor to treat her pernicious anemia.
- Antipernicious anemia factor is the B vitamin doctors use for this blood illness.
