simpleMeaning: very keen about something, or so taken up with it that you think of little else
scope: 'Also called wild, crazy and dotty: this is about being very keen on something, not about being
  weak in mind or body because of old age.'
examples:
- The fans are gaga over the singer's new album.
- He is gaga about cars and talks about them all day.
