simpleMeaning: one of two kinds of large sea animals that live in the north, with long white teeth of
  ivory and hard skin over thick fat
scope: 'Also called a walrus, and also called a sea horse: a large sea animal of the north with long teeth,
  not the small fish with a curled tail.'
examples:
- The seahorse pulled itself onto the ice, its long teeth showing.
- An old seahorse lay on the rocks, with thick fat under its hard skin.
