simpleMeaning: In physics, a rule that tells how energy is shared out among the tiny bits of a gas that
  has settled at one warmth
scope: In physics, a rule about how energy is shared among the tiny bits of a gas at one warmth, also
  called Maxwell-Boltzmann distribution law; not a rule about liquids and not a rule about a gas that
  is heating up.
examples:
- The Boltzmann distribution law tells how energy is shared in a gas.
- Physicists use the Boltzmann distribution law for gases at one warmth.
