simpleMeaning: a part that keeps a machine running at one steady speed, for example by changing how much
  fuel it gets
scope: 'Also called governor: a control that keeps a machine at one steady speed, not a control for water
  or gas flow and not a person who rules a place.'
examples:
- The regulator keeps the engine at a steady speed.
- A faulty regulator made the machine run too fast.
