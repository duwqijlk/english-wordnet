simpleMeaning: a tune, at times made up on the spot, that guests sing at a grand meal
scope: A tune sung by guests at a grand meal, at times made up on the spot, not a song sung by paid singers
  and not a hymn sung in church.
examples:
- The guests ended the feast with a banquet song they had sung for years.
- He stood and led a banquet song that had everyone joining in.
