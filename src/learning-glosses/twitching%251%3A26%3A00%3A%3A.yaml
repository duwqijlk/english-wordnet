simpleMeaning: a sudden tight pull in a muscle, especially one caused by a problem with the nerves
scope: 'Also called twitch: a sudden pull in a muscle, especially from a problem with the nerves. Not
  a planned movement of the whole body.'
examples:
- The twitching in his eyelid would not stop.
- Twitching in her cheek kept coming back all day.
