simpleMeaning: any of a set of yearly Welsh meetings where people take part in contests of art, with singing
  standing out
scope: A yearly Welsh meeting with contests of art, singing standing out; not a music concert alone and
  not a village fair.
examples:
- She won a singing prize at the eisteddfod.
- The eisteddfod brings poets and singers together each year.
