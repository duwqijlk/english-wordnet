simpleMeaning: A plant from Europe and Asia with loose flower clusters of pink or purple blooms, spiny
  stems and tough roots
scope: This is a plant from Europe and Asia with spiny stems; rest-harrow and restharrow are other names
  for it, not its kin Ononis repens, which has no spines, and not a plant with white flowers.
examples:
- Ononis spinosa has spiny stems and pink flowers.
- The Ononis spinosa has tough roots and loose clusters of purple flowers.
