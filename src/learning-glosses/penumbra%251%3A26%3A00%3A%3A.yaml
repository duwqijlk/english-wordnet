simpleMeaning: The edge of a shadow, where the light is only partly cut off, round the darkest part
scope: The partly dark edge of a shadow, not the darkest middle and not full light.
examples:
- The penumbra lay round the dark middle of the shadow.
- We stood in the penumbra of the eclipse.
