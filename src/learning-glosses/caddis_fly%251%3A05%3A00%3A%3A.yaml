simpleMeaning: Two pairs of hairy, thin wings mark this small moth-like insect, whose young live in water.
scope: Also called caddice-fly, caddice fly, and caddis-fly, this is a small moth-like insect with two
  pairs of hairy wings whose young live in water, not a true moth.
examples:
- A caddis fly danced over the water.
- We found a caddis fly resting on a leaf.
