simpleMeaning: What you feel in the body when it hurts a lot
scope: 'Also called pain and pain sensation: a strong feeling of hurt in the body, not a tickle and not
  a dull ache.'
examples:
- The painful sensation in her ankle grew worse with every step.
- As the burn got worse, the painful sensation spread up his arm.
