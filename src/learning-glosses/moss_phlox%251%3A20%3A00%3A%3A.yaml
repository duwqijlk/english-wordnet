simpleMeaning: This low tufted plant from the United States lives for years as ground cover, with pink
  or white flowers and thin leaves like needles that stay green all year.
scope: Also called dwarf phlox, moss pink, and mountain phlox; this is a low tufted plant with needlelike
  evergreen leaves and pink or white flowers.
examples:
- Moss phlox spread over the bank in pink and white tufts.
- Gardeners plant moss phlox as a ground cover.
