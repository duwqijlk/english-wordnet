simpleMeaning: A federal agency in Atlanta, in the Department of Health, Human Services, looking into
  sicknesses, diagnosing them, trying to stop or limit them, especially new, unusual ones.
scope: Also called CDC, this is a national office in Atlanta that looks into sicknesses across the country,
  finds what causes them, and works to stop or limit them, with a focus on new and unusual ones, rather
  than a hospital that treats sick people or a local health office.
examples:
- The Center for Disease Control and Prevention looks into new, unusual sicknesses.
- The Center for Disease Control and Prevention is based in Atlanta.
