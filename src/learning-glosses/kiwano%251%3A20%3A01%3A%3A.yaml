senseId: 'kiwano%1:20:01::'
synsetId: 92414343-n
simpleMeaning: A fruit with orange skin and lime-green, jelly-like flesh that tastes refreshingly fruity
  and feels like passionfruit or pomegranate; it grows on an annual vine.
scope: This sense is the horned fruit, not the vine that bears it or a passionfruit, which has a similar
  texture.
examples:
- A ripe kiwano has orange skin and bright green, jelly-like flesh.
- She sliced the kiwano and scooped out its green flesh.
