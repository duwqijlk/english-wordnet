simpleMeaning: A New Zealand cone-bearing tree used for timber, whose dark wood is used for inside woodwork.
scope: A New Zealand cone-bearing tree used for timber, whose dark wood is used for inside woodwork; miro
  is another name for this sense, not the large two-needled timber tree of southeastern Europe and not
  the large Japanese tree with long needles in bunches of two.
examples:
- Black pine timber framed the old cottage.
- The black pine wood darkened the room's panels.
