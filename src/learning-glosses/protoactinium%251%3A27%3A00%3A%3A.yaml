simpleMeaning: A short-lived metal that gives off rays, made from uranium and changing first into actinium
  and then into lead
scope: This is a short-lived metal made from uranium that turns into actinium and then lead; Pa, atomic
  number 91 and protactinium are other names for this sense, and it stands beside uranium, the metal it
  comes from, and actinium and lead, the metals it turns into.
examples:
- Scientists found protoactinium in a sample of uranium ore.
- Protoactinium breaks down into actinium and then into lead.
