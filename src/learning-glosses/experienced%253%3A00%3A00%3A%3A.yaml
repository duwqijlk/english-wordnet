simpleMeaning: Having done a thing before, and knowing how to do it from seeing it or taking part
scope: This describes a person who has done a thing before and knows how to do it, not a beginner trying
  it for the first time and not a person who has only read about it.
examples:
- An experienced teacher knows how to keep a class calm.
- We need an experienced driver for the long mountain road.
