simpleMeaning: Almost never going into water, these animals live mostly on land, lay eggs in damp spots
  on land, and take in air through their thin wet skin.
scope: Also called a plethodont; a land animal that breathes through its thin wet skin.
examples:
- The lungless salamander lives mostly on land and breathes through its thin wet skin.
- A lungless salamander lays its eggs in a moist hollow on land.
