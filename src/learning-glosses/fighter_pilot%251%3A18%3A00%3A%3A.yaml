simpleMeaning: a person in the army, navy or air force who flies a plane made to shoot down enemy planes
scope: A person in the army, navy or air force who flies a war plane, not a pilot of a plane that carries
  people and not a person who flies for fun.
examples:
- The fighter pilot flew her plane into the fight.
- He trained for years to become a fighter pilot.
