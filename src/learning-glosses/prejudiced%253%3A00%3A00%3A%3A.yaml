simpleMeaning: having an unfair view or feeling that you formed before knowing the facts
scope: Also called discriminatory, this sense is an unfair view or feeling formed before you know the
  facts; not the sense in which something comes from a person's feelings and fixed views.
examples:
- A prejudiced judge cannot give a fair trial.
- He was prejudiced against the new students before he even met them.
