simpleMeaning: To speak or write in broad terms.
scope: This sense is also called generalize, for speaking or writing in broad terms, unlike the sense
  for wooing the crowd to spread a thing and bring it into wide use, and unlike the sense for to draw
  from set cases to wider cases.
examples:
- They generalise, speaking in broad terms.
- They generalise in print.
