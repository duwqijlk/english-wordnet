simpleMeaning: Almond-shaped nerve cluster in the front of the temporal lobe, linked to the hypothalamus,
  hippocampus and cingulate gyrus, and key to emotion and motivation as part of the limbic system.
scope: The almond-shaped brain area tied to emotion and motivation; amygdaloid nucleus and corpus amygdaloideum
  are other names for it, not the almond nut.
examples:
- Fear responses are processed partly in the amygdala.
- The amygdala links what we see with how we feel about it.
