simpleMeaning: In chemistry, any happening fixed by the tiny parts and the way they are put together in
  the things that take part
scope: In chemistry, a happening fixed by the tiny parts of the things that take part; chemical change
  and chemical process are other names for this sense, not a change in heat alone and not a thing made
  by joining parts.
examples:
- The chemical action slowed when the mixture cooled.
- Heat sped up the chemical action in the flask.
