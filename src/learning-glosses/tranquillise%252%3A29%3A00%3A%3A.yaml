senseId: 'tranquillise%2:29:00::'
synsetId: 00022309-v
simpleMeaning: To bring someone to calm and quiet by means of a sleepy drug.
scope: This sense is also called calm, sedate, tranquilize, and tranquillize, for bringing someone to
  calm and quiet by means of a sleepy drug, where calm is making someone quiet and at peace, as by giving
  a sleepy drug.
examples:
- The vet tranquillised the dog before the operation.
- They tranquillise the patient with a sedative to keep her calm.
