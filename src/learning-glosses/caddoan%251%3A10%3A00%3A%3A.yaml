simpleMeaning: A group of related tongues of the native peoples of North America, spoken widely in the
  middle west by the people of the same name.
scope: 'Also called Caddo and Caddoan language: this is a whole family of related tongues, not one tongue
  on its own and not the Caddo people who speak them.'
examples:
- Caddoan belongs to a family of related tongues.
- Linguists study Caddoan and its sister tongues.
