simpleMeaning: A tree of Australia, prized for wood and sticky sap, whose leaves are small flat scales
  and whose seed is dark brown and many in number.
scope: This tree of Australia is also called black cypress pine.
examples:
- We planted a red cypress pine beside the house.
- The red cypress pine dropped its dark brown seed on the ground.
