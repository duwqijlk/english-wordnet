simpleMeaning: The act of making sounds through the nose, so the sounds are shaped by the nose.
scope: The act of making sounds through the nose; nasalization is another name for this, and it is not
  speaking through the mouth alone or a cold.
examples:
- Nasalisation colours the vowel.
- His nasalisation made the sounds come through his nose.
