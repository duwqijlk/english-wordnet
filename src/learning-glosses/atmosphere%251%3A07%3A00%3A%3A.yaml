simpleMeaning: a special quality that you can feel around a person or thing, even though you cannot touch
  it
scope: 'This sense is also called air and aura: a quality you feel around a person or thing, not the layer
  of gases around a planet and not a unit of pressure.'
examples:
- The old house had an atmosphere of sadness.
- There was a warm, friendly atmosphere around the small shop.
