simpleMeaning: a tool with large holes, used to sort gravel by size so that big and small pieces come
  apart
scope: A sorting tool with large holes; not a hard question or puzzle, the better-known sense of riddle,
  and not any of the verb senses.
examples:
- He shook the gravel through a riddle to take out the big stones.
- The workers used a riddle to sort the sand and gravel by size.
