simpleMeaning: to put an organ from one person's body into another person's body
scope: 'Also called transplant: to put an organ from one person into another person''s body, not the piece
  of body that is put in and not the act of putting it in.'
examples:
- The doctors grafted a kidney from the father into his son.
- Surgeons grafted the new heart into the patient.
