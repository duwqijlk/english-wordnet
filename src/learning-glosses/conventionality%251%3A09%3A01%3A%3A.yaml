senseId: 'conventionality%1:09:01::'
synsetId: 06221890-n
simpleMeaning: Going along with the usual thoughts and ways of behaving.
scope: Going along with what is usual in thought and in how one acts; not the lack of fresh ideas that
  comes from sticking too closely to what is usual, and not holding usual views as the right ones.
examples:
- Their conventionality kept them from trying anything new.
- The conventionality of the town showed in its dress and manners.
