simpleMeaning: Grey leaves and small yellow fruits with shiny pale flakes grow on this bushy tree of Europe
  and western Asia, which loses its leaves each year and is sometimes spiny.
scope: A bushy tree of Europe and western Asia with grey leaves and small yellow fruits, not the North
  American shrub of the same name.
examples:
- The silver berry had small yellow fruits with shiny pale flakes.
- A silver berry loses its leaves each year.
