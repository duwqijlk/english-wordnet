simpleMeaning: a person who sells things and shouts out about them so people will buy them
scope: This is a seller who shouts about goods for sale. It is not a person who cries with tears, and
  not an official who shouts out public news.
examples:
- The crier walked through the market shouting about his fresh fish for sale.
- People heard the crier calling out prices for cloth in the street.
