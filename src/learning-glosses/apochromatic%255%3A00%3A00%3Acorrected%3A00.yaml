simpleMeaning: said of a lens that has been fixed so that both colour fringes and round-shape faults are
  gone
scope: A lens free of both colour and round-shape faults, not one that still shows coloured edges and
  not a plain lens with no such fix.
examples:
- An apochromatic lens gives a sharper image with no coloured fringe.
- The telescope used an apochromatic lens to keep stars clear.
