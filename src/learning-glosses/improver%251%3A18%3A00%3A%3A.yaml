simpleMeaning: 'This person spends their life on two things: helping others live well and pushing for
  change in society'
scope: A person who works for the good of others and for change in society, also called a do-gooder or
  a humanitarian; not a helper at one task and not a maker of goods.
examples:
- The improver gave her time to a charity that feeds the poor.
- As an improver, he campaigned for clean water in every town.
