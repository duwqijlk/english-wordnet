simpleMeaning: A much-branched willow of the Old World with large catkins, the hanging flower clusters,
  and fairly large broad leaves.
scope: Also called florist's willow, goat willow, or pussy willow, this is a much-branched willow of the
  Old World with large catkins and broad leaves, not a small willow of eastern North America.
examples:
- Salix caprea has large catkins in spring.
- The much-branched Salix caprea grows across the Old World.
