simpleMeaning: In music, sounds like those of a pipe instrument come from a machine run by electric power
scope: 'Also called electric organ and organ: in music, sounds like those of a pipe instrument come from
  a machine run by electric power, not a real pipe instrument and not a piano.'
examples:
- She played the hymn on the electronic organ in the small church.
- The electronic organ gave out sounds like a pipe instrument.
