simpleMeaning: Guests are shown to their seats by the person who runs the dining room and tells the waiters
  what to do
scope: Also called captain, headwaiter and maitre d'hotel, this is the person who runs the dining room,
  not a waiter and not the cook.
examples:
- The maitre d' showed us to a quiet table by the window.
- Ask the maitre d' if a table will be free soon.
