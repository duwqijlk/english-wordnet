simpleMeaning: A radioactive gas formed when radium breaks apart, the heaviest of the inert gases; found
  in nature, above all over granite, and thought to be a danger to health.
scope: 'Also called Rn and radon: a radioactive gas formed when radium breaks apart, not a light gas and
  not a safe gas.'
examples:
- Atomic number 86 is found in nature over granite.
- Radon, atomic number 86, is thought to be a danger to health.
