simpleMeaning: An illness in people with lung cancer, with weak hip and thigh muscles that tire and an
  aching back; caused by antibodies that attack the places where nerves meet muscle.
scope: An illness in people with lung cancer, with weak hip and thigh muscles and an aching back, also
  called carcinomatous myopathy, myasthenic syndrome or Lambert-Eaton syndrome.
examples:
- Eaton-Lambert syndrome left his legs weak and his back aching.
- The doctor linked her Eaton-Lambert syndrome to the lung cancer.
