simpleMeaning: a person who marks a path through trees by making clear marks on the trees along the way
scope: A person who marks a path through trees by making marks on the trees. Not a person who is first
  to do a new thing, and not the path itself.
examples:
- The trailblazer cut a clear mark on each tree so walkers would not get lost.
- Long ago, a trailblazer marked this path through the woods for people who came after him.
