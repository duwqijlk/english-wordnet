simpleMeaning: a bad feeling in the mind, a mix of pain and upset
scope: A bad feeling of pain and upset in the mind, also called discomfort; not anger at others and not
  the state of being annoyed.
examples:
- The long wait caused her great irritation.
- He felt irritation at the endless noise.
