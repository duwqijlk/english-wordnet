simpleMeaning: a fixed set of tasks or questions that measures a mental quality such as sensitivity, memory,
  intelligence, aptitude or personality.
scope: It is not a school exam on a subject and not a trial of a product; it measures a mental or personal
  quality.
examples:
- The doctor gave him a test to check his memory.
- She took a personality test before joining the company.
