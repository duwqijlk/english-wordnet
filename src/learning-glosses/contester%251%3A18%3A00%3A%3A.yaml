simpleMeaning: a person who argues against the result of a race, a vote, or a similar event, saying it
  should not stand
scope: A person who argues against the result of a race or a vote, not a person who simply takes part
  and not a judge who settles the result.
examples:
- The losing contester asked for the votes to be counted again.
- As a contester in the race, she claimed the finish had been judged wrong.
