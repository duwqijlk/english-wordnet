simpleMeaning: A kind of insurance that pays for things that can be moved, such as jewellery, if they
  are lost, wherever they are.
scope: Insurance that pays for movable things lost anywhere, also called a floating policy, not spots
  before the eyes, a debt with a changing rate, an illegal voter, a thing that floats, a wanderer, or
  a swimmer.
examples:
- Her floater covered the ring even when she wore it abroad.
- He took out a floater for his camera and his watch.
