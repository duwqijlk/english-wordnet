simpleMeaning: a small loop of rope that can slip, made by winding thin rope round it to hold it fast
scope: 'Also called clench: a small rope loop that can slip, not a loving hold with the arms and not a
  tool used by people who work with wood.'
examples:
- He tied the rope with a clinch so the loop could slip but stay fast.
- The sailor made a small clinch at the end of the line.
