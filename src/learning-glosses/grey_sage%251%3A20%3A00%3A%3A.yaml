simpleMeaning: A low plant of the western United States with many branches and silvery leaves, living
  for years and giving food and shelter to animals.
scope: 'Also called a gray sage: a low much-branched plant of the western United States with silvery leaves,
  giving food and shelter to animals, not a tall herb grown for cooking and not a desert bush with green
  leaves.'
examples:
- Grey sage grows across the dry plains of the west.
- Deer eat grey sage and shelter under it.
