simpleMeaning: White rays round yellow middles mark the flower heads of this bad-smelling plant, found
  in many places
scope: Also called dog fennel, stinking chamomile, and stinking mayweed, this bad-smelling plant is found
  in many places, its flower heads marked by white rays round yellow middles.
examples:
- The mayweed smelled bad.
- We could tell the mayweed by its white rays and yellow middles.
