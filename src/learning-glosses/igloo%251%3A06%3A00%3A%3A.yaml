simpleMeaning: a house of Eskimo people, usually made from blocks of snow or of earth with grass, with
  a round top like half a ball
scope: 'Also called iglu: a snow or earth house with a round top, not a tent and not a house made of wood
  or stone.'
examples:
- The family slept in an igloo made of snow blocks.
- An igloo kept them warm through the cold night.
