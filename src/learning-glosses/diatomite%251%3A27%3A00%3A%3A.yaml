scope: This is a light soil made of the glass-like remains of tiny water plants, often used to strain
  liquids; diatomaceous earth and kieselguhr are other names for it, not garden soil and not sand from
  a beach.
examples:
- Diatomite is spread in the filter to strain the water.
- The gardener mixed diatomite into the soil.
