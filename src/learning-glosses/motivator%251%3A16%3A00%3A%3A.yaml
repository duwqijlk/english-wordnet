senseId: 'motivator%1:16:00::'
synsetId: 09202673-n
simpleMeaning: a person or thing that has a good effect on people and helps them want to do something
scope: This is a person or thing that helps people want to do something. It is not the feeling of wanting
  to do something itself.
examples:
- Money can be a strong motivator for extra work.
- Her teacher was a great motivator who made the whole class want to learn.
