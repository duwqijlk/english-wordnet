simpleMeaning: The green cup and the ring of coloured petals wrap round the parts that make and take in
  pollen, and together they form the outer coat of a flower
scope: Also called chlamys, perianth, perigone and perigonium, this is the outer cover of a flower, not
  the flower's inner seed-making parts.
examples:
- The floral envelope of the lily opens to show the stamens inside.
- The teacher drew the floral envelope around the flower's centre.
