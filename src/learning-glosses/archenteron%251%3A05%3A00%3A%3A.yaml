senseId: 'archenteron%1:05:00::'
synsetId: 01465586-n
simpleMeaning: The middle hollow space inside the early ball of cells of an animal, which later becomes
  its gut.
scope: The middle hollow space of a very young animal before birth, which later becomes its gut; not the
  stomach of a grown animal.
examples:
- The archenteron forms early in the growth of the young animal.
- Food will pass through the archenteron once it becomes the gut.
