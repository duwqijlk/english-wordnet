simpleMeaning: From the south-east of Colorado to the east of Chihuahua lives a lizard whose marks are
  darker and stand out more than those of its western cousin
scope: This lizard, found from the south-east of Colorado to the east of Chihuahua, has darker marks that
  stand out more than those of the western whiptail, and is not the western whiptail itself.
examples:
- A checkered whiptail ran across the rocks.
- We saw a checkered whiptail in eastern Chihuahua.
