simpleMeaning: The work of making a steel ship's hull lose its pull as a magnet, by making a magnetic
  pull that works the other way
scope: Making a steel ship's hull lose its pull as a magnet, not painting the ship and not fixing its
  engines.
examples:
- Degaussing protected the ship from magnetic mines.
- The crew finished degaussing the hull before the ship sailed.
