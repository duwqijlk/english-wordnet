simpleMeaning: in a deep way, in your mind or in your feelings
scope: 'Also called deeply and intensely: in a deep way in mind or feeling, not far down in the ground
  and not in a very clever way.'
examples:
- They felt the loss profoundly and could not speak of it.
- She loved him profoundly, with all her heart.
