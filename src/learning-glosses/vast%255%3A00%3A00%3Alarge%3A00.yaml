simpleMeaning: much greater than usual in size, amount, or degree, and especially in how much it covers
  or how far it reaches
scope: Also called huge. This describes something very great in size, amount, or degree, not something
  only a little big.
examples:
- The desert is a vast area with almost no water.
- They spent a vast amount of money on the new road.
