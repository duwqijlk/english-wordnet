simpleMeaning: Most of this stiff part of a body is keratin, the tough stuff in hair and nails
scope: A stiff part of a body made mostly of keratin, not a bone and not a soft body part.
examples:
- The hoof is a horny structure on the horse's foot.
- Nails are horny structures that protect the tips of the fingers.
