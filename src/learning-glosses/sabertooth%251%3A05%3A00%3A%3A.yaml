simpleMeaning: one of many cats, now gone, that lived in the Old World and the New World, with long upper
  teeth like swords, in the Oligocene and Pleistocene times long ago
scope: Another name for this is saber-toothed tiger. It is a cat that lived long ago and is now gone,
  not a tiger living today.
examples:
- A sabertooth had two very long upper teeth.
- We saw bones of a sabertooth at the museum.
