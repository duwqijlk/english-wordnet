simpleMeaning: A heart defect from birth causing blue skin, with a narrowed lung valve, a hole between
  the lower heart chambers, the aorta over both chambers, and a thickened right chamber.
scope: Also called Fallot's tetralogy and tetralogy of Fallot; a heart defect from birth, not a heart
  defect from infection and not a heart defect of old age.
examples:
- The baby was born with Fallot's syndrome.
- Doctors found Fallot's syndrome when the child's skin turned blue.
