simpleMeaning: a strip of clean cloth of any width, rolled into a tube so it is easy to wind round a wound
scope: A roll of clean cloth for winding round a wound, not a sticky plaster and not a tight wrap for
  a sprain.
examples:
- The nurse took a roller bandage from the shelf.
- She wound the roller bandage round his arm.
