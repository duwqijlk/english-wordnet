simpleMeaning: the usual beat of a song-story, with short then long sounds in each line
scope: This is the beat most often used for a song-story; common measure is another name for this sense,
  not a way of counting or measuring things.
examples:
- Most old ballads are sung in common meter.
- The teacher showed how common meter gives the song a steady beat.
