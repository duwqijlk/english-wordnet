simpleMeaning: food or drink that is weak, has a lot of water in it, and does not look or taste good to
  eat, usually used in the plural
scope: Food or drink that is weak, has a lot of water in it and does not look or taste good, usually in
  the plural; not wet feed for pigs, not waste water to be thrown out, and not letting a liquid run out.
examples:
- The hospital served thin slops that no one wanted to eat.
- He lived on the weak slops from the soup kitchen.
