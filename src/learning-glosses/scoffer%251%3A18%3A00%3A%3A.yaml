senseId: 'scoffer%1:18:00::'
synsetId: 10580748-n
simpleMeaning: a person who laughs at something in scorn or shouts at it with contempt
scope: A person who laughs at something in scorn; mocker, flouter and jeerer are other names for this
  sense. Not a person who simply disagrees and not a person who asks a fair question.
examples:
- The scoffer laughed at the new plan before he had heard it out.
- The scoffer mocked the speaker from the back of the hall.
