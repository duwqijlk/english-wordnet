simpleMeaning: bright red haemoglobin, the part of blood that joins with oxygen from the lungs
scope: Bright red haemoglobin joined with oxygen from the lungs; oxyhemoglobin is another name for this
  sense, and it is not the dark red blood matter that has given up its oxygen or oxygen on its own.
examples:
- Oxyhaemoglobin carries oxygen from the lungs to the cells of the body.
- The bright red oxyhaemoglobin in the blood gives it its colour.
