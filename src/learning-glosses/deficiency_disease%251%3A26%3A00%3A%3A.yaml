senseId: 'deficiency_disease%1:26:00::'
synsetId: 14221682-n
simpleMeaning: an illness that comes from not getting enough of a food part the body needs, such as a
  vitamin or a mineral
scope: An illness caused by too little of a food part the body needs, such as a vitamin or a mineral;
  not an illness spread by germs, and not one caused by eating too much.
examples:
- Scurvy is a deficiency disease caused by too little vitamin C.
- The doctor said the child's deficiency disease came from a diet with too little iron.
