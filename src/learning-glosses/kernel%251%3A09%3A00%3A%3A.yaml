simpleMeaning: the best and most important part of an idea or something a person lives through
scope: The best and most important part of an idea or something a person lives through, also called heart,
  center, core, centre, meat, sum, substance, marrow or essence, and not the inner part of a seed or nut.
examples:
- 'The kernel of her argument was simple: people need work.'
- He could not find the kernel of the long story.
