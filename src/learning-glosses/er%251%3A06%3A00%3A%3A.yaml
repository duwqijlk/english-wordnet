simpleMeaning: A room in a hospital or clinic, with staff and tools to give quick help at once to sick
  folk who must have it now.
scope: A room in a hospital or clinic, with staff and tools to give quick care to people who need help
  at once; also called emergency room, and not a ward, and not a clinic on its own.
examples:
- Take him to the ER at once.
- The ER is full tonight.
