simpleMeaning: having something in common with other people, as friends or partners do
scope: 'Also called involvement: having something in common with others, not the act of taking part in
  an event.'
examples:
- The participation of the whole village in the same beliefs held it together.
- Her participation with her partners in the same aims gave her strength.
