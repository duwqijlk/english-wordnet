simpleMeaning: Any stuff that can break open red blood cells and let out the red stuff inside them that
  carries oxygen
scope: Any stuff that can break open red blood cells; erythrolysin, haemolysin and hemolysin are other
  names for this sense, not a stuff that builds blood cells and not a stuff that merely colours the blood.
examples:
- The erythrocytolysin broke open the red cells in the sample.
- Erythrocytolysin frees the red stuff that carries oxygen.
