synsetId: 14814429-n
simpleMeaning: A calcium salt of the fatty acids stearic and palmitic; it does not dissolve in water and
  forms the scum left by soap in hard-water areas.
scope: Another name for calcium stearate; it is the scum soap forms in hard water, not the fatty acids
  alone.
examples:
- Calcium octadecanoate built up as a grey film on the taps and tiles.
- In hard-water districts, calcium octadecanoate collects inside kettles and shower heads.
