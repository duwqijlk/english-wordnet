simpleMeaning: to fill something with a substance used to treat illness
scope: Putting a healing substance into a thing so the thing holds it; not treating a sick person directly,
  which is the other sense of this word.
examples:
- They medicate the bandages with a healing liquid before packing them.
- This soap is medicated with a substance that helps treat skin spots.
