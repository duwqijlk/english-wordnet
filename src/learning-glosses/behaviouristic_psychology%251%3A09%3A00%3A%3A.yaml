simpleMeaning: a way of studying the mind that gives most weight to what people do, as seen and measured
scope: 'Also called behaviorism, behavioristic psychology and behaviourism: a way of studying the mind
  from what people do, not from what they feel inside and not from the mind''s hidden parts.'
examples:
- Behaviouristic psychology asks what a person does, not what a person thinks.
- She chose behaviouristic psychology because it studies what people do, not what they think.
