simpleMeaning: In baseball, a move in which a runner on third base tries to score while the batter taps
  the ball softly
scope: In baseball, a move in which a runner on third base tries to score while the batter taps the ball
  softly; not a straight hit and not a run made with no batter's help.
examples:
- The squeeze play scored the winning run.
- With a squeeze play, the runner dashed home.
