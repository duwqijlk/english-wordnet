simpleMeaning: a movable chair on large wheels for people who are ill or disabled or cannot walk, often
  pushed along by the person sitting in it
scope: This is the chair on wheels itself for a person who is ill or disabled or cannot walk, not a normal
  chair and not a bed used to carry a sick person.
examples:
- After the accident, he used a wheelchair to get around the hospital.
- She moved her wheelchair up the ramp and into the building.
