simpleMeaning: to look at something with great care, bit by bit, to judge it or find what is wrong
scope: To look at something very closely and with care, not just to glance at it and not to check it for
  the sake of proof.
examples:
- She scrutinized the contract before she signed it.
- The teacher scrutinized every line of the essay.
