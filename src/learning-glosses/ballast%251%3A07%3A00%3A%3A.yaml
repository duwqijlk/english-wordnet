simpleMeaning: a quality that tends to keep a person's character and sense of right and wrong steady,
  and that keeps the mind and feelings steady
scope: This is a quality in a person that keeps them steady, not an electrical device for lamps and not
  gravel laid under streets or railway lines.
examples:
- His sense of duty acted as ballast, keeping his character steady.
- For her, family was a ballast that steadied her mind and feelings.
