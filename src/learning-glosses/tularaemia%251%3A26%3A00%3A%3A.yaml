senseId: 'tularaemia%1:26:00::'
synsetId: 14299862-n
simpleMeaning: rodents, above all rabbits and squirrels, carry a disease that spreads fast; at times it
  passes to people from ticks, flies, or handling sick animals
scope: Also called deer fly fever, rabbit fever, tularemia, and yatobyo; a fast-spreading disease of rodents,
  not a disease of people alone and not one spread by water.
examples:
- Tularaemia spread among the rabbits in the valley that summer.
- He caught tularaemia after handling a sick rabbit.
