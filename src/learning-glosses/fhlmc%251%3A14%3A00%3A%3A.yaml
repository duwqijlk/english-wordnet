simpleMeaning: A company allowed by Congress to buy house debts from banks and sell them on, so banks
  can lend more money
scope: 'Also called the Federal Home Loan Mortgage Corporation and Freddie Mac: a company that buys house
  debts from banks so they can lend more, not a bank that lends straight to people buying houses.'
examples:
- FHLMC buys house loans from banks.
- The bank sold its loans to FHLMC to free up money for new lending.
