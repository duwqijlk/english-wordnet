senseId: 'continuous_creation_theory%1:09:00::'
synsetId: 05897179-n
simpleMeaning: In cosmology, as galaxies move apart, new matter is made to fill the gaps, so the universe
  keeps the same average density
scope: The idea that new matter keeps the universe at the same density, also called steady state theory;
  not the big bang idea that the universe began in one great burst.
examples:
- The continuous creation theory says new matter keeps appearing as the universe grows.
- Under the continuous creation theory, the universe has no single beginning.
