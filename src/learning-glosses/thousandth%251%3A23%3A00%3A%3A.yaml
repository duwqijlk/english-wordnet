senseId: 'thousandth%1:23:00::'
synsetId: 13761310-n
simpleMeaning: one of a thousand equal parts that make up a whole thing
scope: This is a small part, one of a thousand equal parts of a whole. It is not the word for the place
  of number one thousand when you count in order.
examples:
- A thousandth of a second passed before the light changed.
- He measured the metal to a thousandth of an inch.
