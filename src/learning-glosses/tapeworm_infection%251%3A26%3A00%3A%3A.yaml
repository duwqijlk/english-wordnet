simpleMeaning: a sickness of the gut from a flat, ribbon-like pest that lives inside the body; it usually
  comes from eating meat or fish that was not cooked enough
scope: Among sicknesses of the gut, this is the one that comes from a pest in food.
examples:
- The tapeworm infection came from meat that had not been cooked through.
- A tapeworm infection was found in the gut.
