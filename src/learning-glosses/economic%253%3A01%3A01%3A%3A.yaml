simpleMeaning: connected with a country's system of producing, selling and using goods and money.
scope: This is about a country's real system of trade and money, not about the academic subject or about
  saving money.
examples:
- The country is going through a difficult economic period.
- Low wages are an economic problem, not just a personal one.
