simpleMeaning: belonging to or typical of the part of the United States that lies south of the old Mason-Dixon
  line.
scope: This is not about the south of any region in general and not about facing south; it refers specifically
  to the southern United States.
examples:
- He grew up in a small southern town near the Georgia border.
- The menu featured classic southern dishes such as fried chicken and grits.
