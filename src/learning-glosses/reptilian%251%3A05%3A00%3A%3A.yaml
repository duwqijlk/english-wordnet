simpleMeaning: any cold-blooded animal with a backbone that belongs to the group that includes tortoises,
  turtles, snakes, lizards, alligators, crocodiles, and kinds that no longer live
scope: Any cold-blooded animal with a backbone of the kind that includes snakes, lizards, turtles, alligators,
  and crocodiles; reptile is another name for it, not a warm-blooded animal and not a fish.
examples:
- The museum keeps several reptilians, from snakes to crocodiles.
- The zoo's newest reptilian is a young alligator.
