simpleMeaning: to put a thin white layer of ice on the outside of something
scope: This is putting white ice on a surface, not harming something with cold and not putting a sweet
  covering on a cake.
examples:
- Ice crystals frosted the glass in the morning.
- Cold air frosted the car windows white.
