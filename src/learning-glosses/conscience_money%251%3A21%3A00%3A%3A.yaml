simpleMeaning: a sum paid of one's own free will to ease the shame felt after dishonest dealings
scope: This is a sum paid freely to ease shame after dishonest dealings, not a fine set by a court and
  not a gift.
examples:
- He sent the shop conscience money for the goods he had once stolen.
- She paid conscience money years after cheating the tax office.
