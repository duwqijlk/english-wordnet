simpleMeaning: behaving in the way people think is right and proper, and doing what is morally right
scope: A person's quality of living up to what is thought right and proper, not a polite manner and not
  a rule or law.
examples:
- She showed real decency by apologizing and making things right.
- The decency of the old couple impressed everyone who knew them.
