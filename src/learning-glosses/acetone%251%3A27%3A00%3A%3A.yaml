simpleMeaning: The simplest of a group of chemicals called ketones, a liquid that catches fire very easily,
  much used to dissolve other things and to make plastics.
scope: Also called dimethyl ketone or propanone, this is a liquid that catches fire easily and is much
  used to dissolve other things and to make plastics.
examples:
- She used acetone to take off her nail polish.
- Acetone burns very easily, so keep it from flames.
