simpleMeaning: In golf, the set number of hits of the ball for each hole, or for the whole course
scope: In golf, a set number of ball hits for a hole or a course; not the sense that means being equal
  in value or level.
examples:
- Par for this course is 72.
- She finished the long hole at par, in five hits.
