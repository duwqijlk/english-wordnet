simpleMeaning: a burrowing egg-laying mammal covered in spines, with a long nose and claws for hunting
  ants and termites, found in Australia
scope: Also called an anteater and an echidna; the Australian kind, not the New Guinea kind of the same
  name.
examples:
- The spiny anteater dug for ants with its long claws.
- A spiny anteater rolled into a ball of spines when scared.
