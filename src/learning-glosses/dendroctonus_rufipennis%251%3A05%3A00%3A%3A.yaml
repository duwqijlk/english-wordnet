simpleMeaning: A small beetle that bores through the bark of spruce trees and eats the soft layer under
  the bark, which in time kills the tree.
scope: 'Also called spruce bark beetle: a small beetle that bores through spruce bark and eats the soft
  layer beneath, killing the tree in time, set apart from other bark beetles by its spruce host.'
examples:
- The Dendroctonus rufipennis bored into the spruce and killed it within two years.
- Forest wardens watch for Dendroctonus rufipennis in the spruce stands.
