simpleMeaning: a part that makes heat and is put right into the liquid to be warmed, as in a hot-water
  tank
scope: A heat-making part put into the liquid it warms, not a heater outside the tank and not a kettle.
examples:
- The immersion heater warmed the water in the tank.
- She switched on the immersion heater before her bath.
