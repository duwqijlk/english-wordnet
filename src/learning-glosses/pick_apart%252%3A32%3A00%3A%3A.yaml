simpleMeaning: Say what is wrong with a thing, and point out its faults, real ones or ones only thought
  to be there
scope: 'Also called knock or criticize: to say what is wrong with a thing and point out its faults, not
  to take a thing to pieces and not to praise it.'
examples:
- The reviewer picked apart every line of the report, finding fault after fault.
- She picked apart his plan in front of the whole team.
