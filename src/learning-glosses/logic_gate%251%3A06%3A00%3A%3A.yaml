simpleMeaning: In a computer, a part with several inputs but only one output, switched on by certain sets
  of inputs.
scope: In a computer, this is a part with several inputs and one output, not a switch worked by hand and
  not a part with many outputs; gate is another name for this sense.
examples:
- The logic gate opens only when both inputs are on.
- Each logic gate in the chip has one output.
