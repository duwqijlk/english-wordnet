simpleMeaning: A rude act that hurts other people's feelings because it is not polite and shows no care
  for them
scope: Also called offense and offence, this is a rude act that shows no care and hurts feelings. It is
  not just a rude way of behaving in general.
examples:
- Leaving without saying thank you was a discourtesy to the host.
- She took his cold reply as a discourtesy and felt hurt.
