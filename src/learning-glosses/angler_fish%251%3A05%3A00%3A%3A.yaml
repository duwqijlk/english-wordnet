simpleMeaning: To draw prey close, these fish use a thin worm-like thread fixed to them, beside their
  big mouths.
scope: These fish draw prey close with a thin worm-like thread fixed beside their big mouths, and are
  also called anglerfish, angler, monkfish, allmouth, goosefish and lotte.
examples:
- The angler fish drew prey close with its worm-like thread.
- An angler fish lured prey with the thread fixed beside its big mouth.
