simpleMeaning: In botany, the outer skin of bark, a guard layer of dead cells
scope: In botany, the outer skin of bark, a guard layer of dead cells; cork is another name for this sense,
  not the living green layer under the bark and not the wood inside.
examples:
- The phellem is the dead outer skin of the bark that guards the tree.
- In the cutting, the phellem showed as a thin dark layer of dead cells.
