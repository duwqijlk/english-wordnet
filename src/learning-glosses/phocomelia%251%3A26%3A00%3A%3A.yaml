simpleMeaning: 'A rare birth fault: the upper arm or leg is missing, so the hand or foot joins the body
  like a stump; it comes from thalidomide taken in pregnancy.'
scope: A birth fault in which the upper arm or leg is missing so the hand or foot joins the body like
  a stump, not a limb lost later in an accident.
examples:
- Phocomelia left the child with hands joined close to the body.
- Doctors linked phocomelia to a drug taken in pregnancy.
