simpleMeaning: An inherited disorder, passed on only when both parents carry the gene, in which the body
  mishandles complex sugars, causing severe bone and cartilage deformities and intellectual disability.
scope: Another name for dysostosis multiplex and lipochondrodystrophy, the same inherited disorder of
  sugar metabolism. The word is old and now considered offensive, so doctors no longer use it; it has
  nothing to do with stone gargoyles on buildings.
examples:
- Older medical papers called the condition gargoylism, a term doctors now avoid.
- The word gargoylism appears in old case reports but is no longer used.
