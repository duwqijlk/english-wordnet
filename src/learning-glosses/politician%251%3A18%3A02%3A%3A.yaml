simpleMeaning: a person who plans in secret, in sly and unfair ways, to get an advantage over others in
  a group
scope: A person who makes secret, dishonest plans inside a group to get ahead, not a person who works
  openly in party politics.
examples:
- People called him a politician because he quietly turned every team against the others to win the top
  job.
- As an office politician, she spread rumours so the boss would favour her.
