simpleMeaning: A weaker form of the germs causes this mild form of smallpox
scope: A mild form of smallpox caused by a weaker form of the germs; alastrim, milk pox and pseudosmallpox
  are other names for this sense, not the deadly form of the pox itself.
examples:
- The patient had pseudovariola, a mild smallpox that passed in a week.
- Pseudovariola spread through the village, but no one died of it.
