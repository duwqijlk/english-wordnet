simpleMeaning: in Jungian psychology, the outward face that a person shows to others
scope: This is the persona a person shows others, not a picture or other visual representation, not a
  mental picture, and not the general impression a person or company gives the public.
examples:
- Behind his confident image, he felt constantly anxious.
- She built an image of calm competence that few people saw through.
