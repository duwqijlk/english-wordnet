simpleMeaning: getting into other people's business in an unwanted way that upsets or offends them
scope: 'Also called busy, interfering, meddling, and officious: too ready to get into other people''s
  business; not just busy with your own work, and not kind help that people want.'
examples:
- Our meddlesome neighbour kept asking about our money and telling us what to do.
- He is a meddlesome man who reads other people's letters and spreads their news.
