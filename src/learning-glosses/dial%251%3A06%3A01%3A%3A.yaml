simpleMeaning: a round disc on a telephone that you turn a set distance for each number you call
scope: This is the round disc on a phone itself, not the act of using it to choose a number and not the
  round face that shows measurements on a tool.
examples:
- On the old phone, you put your finger in the dial for each number.
- The dial on this old telephone still turns smoothly.
