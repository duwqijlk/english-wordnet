simpleMeaning: The blood holds too few red cells, because the soft matter inside the bones makes too few
  of them; it can grow into a state with almost none made.
scope: Also called hypoplastic anaemia, it is a lack of red cells from marrow that works poorly, not the
  deeper state in which the marrow makes almost none.
examples:
- Her hypoplastic anemia came from marrow that did not work well enough.
- His hypoplastic anemia could grow into a deeper state with almost none made.
