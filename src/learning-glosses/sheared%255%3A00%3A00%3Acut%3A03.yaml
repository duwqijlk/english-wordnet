simpleMeaning: 'used especially of fur or wool: cut or trimmed to one even length to shape it or finish
  it'
scope: This is fur or wool cut to one even length to shape or finish it, not hair or wool simply cut off.
examples:
- Her coat was made of sheared wool, cut to one even length.
- The rug of sheared fur felt smooth and even under his hand.
