simpleMeaning: the high nest of a bird that hunts other animals for food, such as a hawk or an eagle
scope: Also called aerie, eyry and aery. It is the high nest of a hunting bird, not a nest on the ground
  or in a low tree.
examples:
- The eagle built its eyrie high on the cliff.
- From below, we could just see the eyrie at the top of the mountain.
