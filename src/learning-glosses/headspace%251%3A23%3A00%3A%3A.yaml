simpleMeaning: the amount of empty space left at the top of a bottle, jar, or tin that has been filled,
  before it is closed
scope: This is the empty space at the top of a filled bottle, jar, or tin; it is not a person's state
  of mind and not room for a person's head.
examples:
- Leave a little headspace at the top of each jar before you close it.
- The bottle was filled too full, with almost no headspace left under the cap.
