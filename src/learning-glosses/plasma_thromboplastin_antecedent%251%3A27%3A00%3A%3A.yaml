simpleMeaning: Too little of this thing in the blood that helps it clot leads to a tendency to bleed
scope: A thing in the blood that helps it clot, whose lack leads to bleeding; not a drug that stops bleeding
  and not a disease of the blood.
examples:
- The test showed too little plasma thromboplastin antecedent in his blood, so he tended to bleed.
- Doctors check plasma thromboplastin antecedent when a patient bleeds too easily.
