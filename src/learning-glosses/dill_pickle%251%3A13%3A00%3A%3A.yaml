simpleMeaning: The seeds of a strong-smelling herb give this food its taste, after it is kept in salty
  water or vinegar.
scope: Kept in salty water or vinegar, this food takes its taste from the seeds of a strong-smelling herb.
examples:
- We ate a dill pickle with the sandwich at lunch.
- She put a dill pickle on the plate beside the cheese.
