simpleMeaning: the plainest kind of sweet stuff that gives the body fuel, like sucrose or fructose; it
  does not break down in water into other sweet stuff
scope: The plainest kind of sweet stuff that gives the body fuel, like sucrose or fructose, also called
  monosaccharide or monosaccharose; not a sweet stuff that breaks down into other sweet stuff and not
  a fat.
examples:
- Glucose is a simple sugar.
- Fructose is a simple sugar found in fruit.
