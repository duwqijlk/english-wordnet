simpleMeaning: the end part of the arm, the hand, that can grip and hold things
scope: Also called a hand, this is the end of the arm that can grip and hold things, not the foot of an
  animal and not a clumsy touch.
examples:
- He reached out his paw to take the cup.
- She held the letter in one paw while she read it.
