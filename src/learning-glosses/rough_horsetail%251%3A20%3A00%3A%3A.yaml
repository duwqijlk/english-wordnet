simpleMeaning: People once scrubbed kitchen utensils with this plant, which stays green all year and stands
  straight on stems whose edges feel coarse.
scope: 'Also called scouring rush: a plant that stays green all year, with stems whose edges feel coarse,
  once used to scrub kitchen utensils.'
examples:
