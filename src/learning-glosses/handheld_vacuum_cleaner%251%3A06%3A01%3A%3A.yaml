simpleMeaning: A machine light enough to carry about and much used for small spills, run from batteries
  you can charge again or from a wall socket.
scope: Also called hand-held vacuum, hand-held vacuum cleaner and handheld vacuum, this is a light machine
  for small spills, not a big machine for whole rooms.
examples:
- The handheld vacuum cleaner is light enough to carry up the stairs.
- We bought a handheld vacuum cleaner for the car.
