simpleMeaning: The part of mind science that studies how the body shapes what the mind does.
scope: The study of body and mind together, also called neuropsychology and physiological psychology;
  not the study of the body alone and not the study of the mind alone.
examples:
- Psychophysiology looks at how the heartbeat changes when a person is afraid.
- She works in psychophysiology, studying the body during thought.
