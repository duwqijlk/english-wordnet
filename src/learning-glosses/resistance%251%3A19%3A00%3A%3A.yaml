simpleMeaning: any mechanical force that tends to slow a moving thing down or push against its movement
scope: A force that slows movement; not the way a material slows electric current, and not a living thing's
  power to keep itself safe from harmful things around it.
examples:
- The resistance of the water slowed the boat as it moved.
- As he pushed the box across the rough floor, resistance made it hard to move.
