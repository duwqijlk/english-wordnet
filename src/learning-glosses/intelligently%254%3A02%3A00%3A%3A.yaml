simpleMeaning: in a way that shows clear thinking and good sense
scope: This describes doing something with good sense and clear thinking; it is not just doing it fast,
  and not doing it by a set rule.
examples:
- She answered the hard questions intelligently.
- He used his money intelligently and saved some each month.
