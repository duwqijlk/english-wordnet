simpleMeaning: Crystals may take in new stuff and give up old stuff, yet keep the same shape, and the
  word for that change is this.
scope: When a crystal keeps its shape but not its make-up, the change has this name.
examples:
- The book says allomerism lets the make-up of a crystal change without changing its shape.
- They found allomerism in the sample when its make-up changed but its crystals kept the same form.
