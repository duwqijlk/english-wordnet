simpleMeaning: a rule that stops a person from taking the government to court unless the government agrees
  to it
scope: A rule that stops a person from taking the government to court unless the government agrees to
  it; not a right to break the law and not a shield for a private person.
examples:
- Under sovereign immunity, she could not sue the state without its consent.
- The doctrine of sovereign immunity means the government must agree before it can be taken to court.
