simpleMeaning: With a round sucking mouth and a rough tongue, an early jawless water animal, long and
  thin, lives in fresh water or swims up rivers from the sea.
scope: People also call it lamprey and lamper eel, the jawless water animal with a round sucking mouth
  and a rough tongue.
examples:
- The lamprey eel held on with its round sucking mouth.
- A lamprey eel swims up rivers from the sea.
