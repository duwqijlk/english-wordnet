simpleMeaning: a small piece of bread, used especially for covering food before cooking or for making
  a liquid thicker
scope: This is a small piece of bread used especially in cooking, not a whole slice of bread to eat on
  its own.
examples:
- She covered the chicken with breadcrumbs before frying it.
- He mixed breadcrumbs into the soup to make it thicker.
