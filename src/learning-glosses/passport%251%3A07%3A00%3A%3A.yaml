simpleMeaning: A quality or other part of a person that helps them be welcomed, accepted, or let in
scope: 'This sense is also called recommendation: a quality that helps a person be welcomed or let in.
  It is not the paper book used for travel to other countries.'
examples:
- His wealth was not a passport into the top circles of society.
- A good education can be a passport to a better job.
