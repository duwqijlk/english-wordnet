simpleMeaning: A large fruit, usually with a round middle part that sticks out at the blossom end, shaped
  a bit like a tall round head wrap.
scope: This is the fruit, not the plant that bears it.
examples:
- The turban squash had a round middle part sticking out at the blossom end.
- We ate turban squash with our dinner.
