senseId: 'dissipation%1:04:02::'
synsetId: 00743943-n
simpleMeaning: Work that brings no gain, done by using up time, money, or other things without thought
  or care.
scope: 'Also called waste or wastefulness: work that brings no gain, using up time, money, or other things
  without thought or care, not a life spent on sensual pleasure.'
examples:
- His dissipation of money left him with nothing.
- The dissipation of forests worried the villagers.
