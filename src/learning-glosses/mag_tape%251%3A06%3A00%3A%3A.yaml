simpleMeaning: A store for sounds, pictures, or computer files, made as a long thin strip of plastic with
  a rust-coloured coating.
scope: Also called tape and magnetic tape, it is a long thin plastic strip with a rust-coloured coating,
  made to store sounds, pictures, or computer files.
examples:
- He took along a dozen mag tapes to record the interview.
- The mag tape still held the films.
