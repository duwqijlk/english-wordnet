simpleMeaning: people across a whole country or state vote to choose leaders for every part of the land
scope: A vote for every seat across a whole country or state, not a vote for one seat or one area, and
  not a vote inside one party.
examples:
- Voters across the country took part in the general election.
- The general election chose new leaders for every part of the country.
