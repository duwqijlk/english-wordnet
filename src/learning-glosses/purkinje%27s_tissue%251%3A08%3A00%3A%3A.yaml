simpleMeaning: A web of fine threads in the heart that carry the beat signal from a small knot of cells
  to the lower chambers and make them squeeze.
scope: Also called Purkinje's system and Purkinje network; a web of fine threads in the heart that carry
  the beat signal to the lower chambers.
examples:
- The Purkinje's tissue carries the beat signal to the lower chambers of the heart.
- Doctors study the Purkinje's tissue to learn how the heart beats.
