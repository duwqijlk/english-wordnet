simpleMeaning: From the air itself, from noise in the set that takes them in, or from other senders come
  the unwanted signals.
scope: These are unwanted signals from outside sources, not the signals a set is meant to take in.
examples:
- Electrical disturbance reached the set from outside.
- Electrical disturbance got into the set from the air itself.
