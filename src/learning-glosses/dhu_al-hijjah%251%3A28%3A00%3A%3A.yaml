simpleMeaning: The last month of the Muslim year, when people make the holy trip to Mecca; it has one
  more day in leap years.
scope: 'Also called Dhu''l-Hijja, Dhu''l-Hijjah, and Dhu al-Hijja: the last month of the Muslim year,
  the time of the holy trip to Mecca.'
examples:
- Dhu al-Hijjah is the season of the holy trip.
- In leap years, Dhu al-Hijjah has one extra day.
