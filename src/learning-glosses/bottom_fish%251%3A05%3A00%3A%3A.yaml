simpleMeaning: Caught and sold in large numbers, these fish stay on the sea floor, above all the cod group,
  cod and haddock, and flat fish such as flounder.
scope: This fish is also called groundfish.
examples:
- The bottom fish on sale were cod, haddock, and flounder.
- Bottom fish are caught and sold in large numbers.
