simpleMeaning: to make a person, group, or animal march or move at a marching pace.
scope: This sense is not about walking yourself in an ordinary way, and not about walking as a protest.
examples:
- The officer marched the recruits across the parade ground.
- The guards marched the prisoner down the corridor to the cell.
