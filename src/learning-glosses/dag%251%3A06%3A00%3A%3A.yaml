simpleMeaning: a loose piece of cloth that hangs down along the edge of a piece of clothing, used in clothing
  of the middle ages
scope: 'Also called jag: this is a hanging piece of cloth on the edge of clothing from the middle ages,
  not a sharp point and not a cut in cloth.'
examples:
- In the old picture, the man's coat has a dag along its lower edge.
- The museum dress shows a pointed dag at the sleeve edge.
