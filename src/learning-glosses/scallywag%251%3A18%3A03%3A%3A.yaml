simpleMeaning: A white man of the South who took the side of the new order after the war, usually for
  his own gain.
scope: A white man of the South who took the side of the new order after the war, usually for his own
  gain; also called scalawag; not a lying cheat of a scoundrel, beyond all trust.
examples:
- Their scallywag voted with the North.
- The scallywag held office for years.
