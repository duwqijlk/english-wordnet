simpleMeaning: to hang over a place or person like a dark, frightening threat
scope: This is a dark threat hanging over a place or person; loom and hover are other names for this sense.
  Not being angry in a quiet way, and not showing anger openly.
examples:
- Dark clouds brooded over the town all day.
- A feeling of fear brooded over the house after the bad news.
