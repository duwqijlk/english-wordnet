simpleMeaning: A thin cut of meat, above all veal, most often fried or cooked under high heat
scope: A thin cut of meat, above all veal, most often fried or cooked under high heat, also called scallop,
  cutlet or escallop, and not the shellfish of the same name or a thick steak.
examples:
- She fried a scollop of veal for dinner.
- The scollop was thin and cooked fast in the pan.
