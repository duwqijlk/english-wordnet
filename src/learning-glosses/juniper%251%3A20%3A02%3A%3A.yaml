simpleMeaning: 'The plant of this name in the Old Testament: a desert bush of Syria and Arabia with small
  white flowers, sometimes placed in the plant group Genista'
scope: Also called juniper bush, raetam, and retem; this is the desert bush with small white flowers,
  not the bush or small tree with cones that look like berries and not its wood.
examples:
- A juniper grew in the dry desert, its small white flowers open in the sun.
- In the desert story, tired travellers rested by a juniper with small white flowers.
