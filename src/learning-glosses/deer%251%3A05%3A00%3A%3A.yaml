simpleMeaning: A wild animal with four legs, like a cow or a goat, but the male grows hard branching head
  growths that fall off each year
scope: A wild four-legged animal set apart from cattle, sheep and goats by the male's antlers, not a cow
  or a goat itself.
examples:
- We saw a deer in the woods at dawn.
- The male deer had wide antlers.
