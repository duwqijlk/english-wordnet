senseId: 'macroevolution%1:22:00::'
synsetId: 13531466-n
simpleMeaning: Change in living things over very long stretches of time, over whole ages of the earth,
  that gives rise to new groups of kinds.
scope: Change in living things over whole ages of the earth that gives rise to new groups; not small change
  within one kind and not change in a single lifetime.
examples:
- Macroevolution explains how new groups such as birds came to be.
- The fossil record shows macroevolution over millions of years.
