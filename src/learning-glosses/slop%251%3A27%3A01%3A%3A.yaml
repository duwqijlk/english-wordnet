simpleMeaning: 'usually used in the plural: dirty water from a kitchen or bathroom, or from a pot used
  in the bedroom as a toilet, that must be emptied by hand'
scope: 'Usually plural: dirty water that must be emptied by hand; not wet pig food, and not weak, watery
  food or drink for people.'
examples:
- She carried the slops out and emptied them by hand.
- The kitchen slops were taken away in a bucket each night.
