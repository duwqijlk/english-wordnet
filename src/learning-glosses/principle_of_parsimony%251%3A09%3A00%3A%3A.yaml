senseId: 'principle_of_parsimony%1:09:00::'
synsetId: 05999623-n
simpleMeaning: Of two rival theories, take the plainest one, and bring in no more things than are needed
scope: Also called the law of parsimony, this rule says to take the plainest of two rival theories and
  bring in no more things than are needed.
examples:
- The principle of parsimony led her to pick the simpler theory.
- By the principle of parsimony, he brought in no more things than were needed.
