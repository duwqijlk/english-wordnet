simpleMeaning: A picture of a part of the body made by sound waves too high to hear bouncing back, used
  to watch an unborn baby grow or to look at organs.
scope: Also called an echogram, it is a picture of a part of the body made by sound waves too high to
  hear bouncing back.
examples:
- The sonogram showed the baby moving in the womb.
- The doctor studied the sonogram of her heart.
