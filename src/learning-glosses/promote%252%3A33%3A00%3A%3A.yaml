simpleMeaning: when a chess pawn, its smallest piece, reaches the eighth row, or a checker piece reaches
  the row nearest the other player, to change it for a stronger piece
scope: This is doing the change in chess or checkers, not giving a person a higher job. The close game
  sense is about the piece being changed, not the act of changing it.
examples:
- She promoted her pawn when it reached the eighth row and chose a queen.
- In checkers, he promoted his piece after it reached the far row.
