simpleMeaning: a light that makes its glow from a burst of power passing between two metal rods inside
  a gas
scope: A light that makes its glow from power passing between two rods in gas, and not an oil lamp or
  a light bulb with a hot wire.
examples:
- The street was lit by a discharge lamp that gave off a pale green glow.
- They fitted a discharge lamp above the workshop bench for bright light.
