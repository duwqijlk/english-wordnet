simpleMeaning: A deer of the western Rocky Mountains, of the kind called a mule deer.
scope: Also called blacktail, black-tailed deer and blacktail deer; a mule deer of the western Rocky Mountains,
  while the white-tailed deer of the east is a different kind.
examples:
- The Odocoileus hemionus columbianus browsed on the hillside above the valley.
- Odocoileus hemionus columbianus lives in the high woods of the western mountains.
