simpleMeaning: The act of giving a formal talk to a group of people.
scope: This sense is not the general ability to talk or a person's way of speaking, but a formal talk
  given to an audience.
examples:
- Her speech at the ceremony moved everyone in the room.
- He practiced his speech for hours before the conference.
