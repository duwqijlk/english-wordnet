simpleMeaning: 'A chemistry law: when two elements form more than one compound, the amounts of one joining
  a fixed amount of the other show a simple multiple relation'
scope: In chemistry, this law is about the amounts in which elements join, with one joining a fixed amount
  of another in simple whole-number steps.
examples:
- The law of multiple proportions explains why one substance joins a set amount in amounts of one part,
  two parts, or three parts.
- By the law of multiple proportions, the amounts that joined the set amount stood in a simple whole-number
  link.
