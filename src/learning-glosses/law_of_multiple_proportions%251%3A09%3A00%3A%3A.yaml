simpleMeaning: When two kinds of stuff can join into more than one stuff, the amounts of one joining a
  set amount of the other come in simple whole-number steps.
scope: In chemistry, this rule is about the amounts in which kinds of stuff join, with one joining a set
  amount of another in simple whole-number steps.
examples:
- The law of multiple proportions explains why one stuff joins a set amount in amounts of one part, two
  parts, or three parts.
- By the law of multiple proportions, the amounts that joined the set amount stood in a simple whole-number
  link.
