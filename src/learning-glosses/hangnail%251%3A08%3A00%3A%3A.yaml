simpleMeaning: A thin narrow piece of skin that hangs loose near the base of a fingernail; pulling it
  off leaves a sore that hurts and can get infected easily
scope: This is a small strip of skin by a fingernail, also called agnail; it is not a break in the nail
  itself.
examples:
- She tore off a hangnail and the skin around it became sore.
- A hangnail near the base of his fingernail hurt when he washed his hands.
