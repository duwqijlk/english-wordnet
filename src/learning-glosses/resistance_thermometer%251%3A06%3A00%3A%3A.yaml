simpleMeaning: a tool that reads heat by how much a coiled thread of platinum wire fights the flow of
  power through it
scope: A heat-reading tool that works by a wire's fight against power, not a liquid-filled glass tube
  and not a digital read-out; also called platinum thermometer.
examples:
- The lab used a resistance thermometer to check the oven's heat.
- A resistance thermometer gave a steady reading all afternoon.
