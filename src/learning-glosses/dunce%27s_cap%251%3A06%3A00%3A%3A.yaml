simpleMeaning: a cone-shaped paper hat once put on the heads of slow or lazy schoolchildren
scope: A cone-shaped paper hat once put on slow or lazy schoolchildren, also called a dunce cap and a
  fool's cap; not a graduation hat and not a clown hat.
examples:
- The teacher made him wear a dunce's cap in the corner.
- In old schools, a dunce's cap marked a lazy pupil.
