senseId: tight%5:00:00:stingy:00
synsetId: 01117549-s
simpleMeaning: A person who gives or shares very little, or behavior that shows this unwillingness.
scope: This is about someone unwilling to give or share, and mean is another name for this sense; it is
  not about a shortage of money or about strict rules.
examples:
- He was too tight to buy his own round at the pub.
- She is tight with her money and never pays for anything.
