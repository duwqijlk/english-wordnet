simpleMeaning: material used to make a barrier of long bars, or those bars taken together as a whole
scope: This is the material for making barriers, or the barriers taken together, not one single finished
  barrier on its own.
examples:
- They bought metal railing to build a barrier along the steps.
- The workers stacked the wooden railing by the gate.
