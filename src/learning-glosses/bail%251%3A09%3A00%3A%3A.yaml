simpleMeaning: the rule that lets a person charged with a crime stay out of prison until the trial, usually
  after money is put down to make sure they turn up
scope: The legal system that frees an accused person before trial, not the money paid as a guarantee,
  and not emptying water from a boat.
examples:
- He is out on bail until his trial next month.
- The judge granted bail after the money was paid.
