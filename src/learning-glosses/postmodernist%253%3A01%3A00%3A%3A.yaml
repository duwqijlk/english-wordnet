simpleMeaning: Of or relating to a style of art and thought that doubts fixed rules and mixes old and
  new forms
scope: This is about a style that doubts fixed rules and mixes old and new forms; postmodern is another
  name for this sense, not the older modern style, and not a style with one fixed set of rules.
examples:
- The postmodernist architecture of the hall surprised visitors.
- She praised the postmodernist art in the show.
