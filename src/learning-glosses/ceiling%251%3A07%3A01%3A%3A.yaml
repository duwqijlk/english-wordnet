simpleMeaning: The greatest height a plane can reach in given conditions.
scope: An aircraft's upper limit in set conditions, not the cloud-base reading, the inner roof of a room,
  or a general cap on what is allowed.
examples:
- This old bomber has a ceiling of about thirty thousand feet.
- At its ceiling the plane could barely climb.
