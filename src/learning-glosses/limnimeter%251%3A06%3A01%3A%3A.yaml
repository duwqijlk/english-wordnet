simpleMeaning: A tool that shows how the level of water in a lake goes up and down
scope: A tool for measuring the level of water in a lake, not a tool for measuring rain and not a tool
  for measuring the sea's tides.
examples:
- The limnimeter showed the lake had risen by two inches overnight.
- Scientists checked the limnimeter each morning to track the lake level.
