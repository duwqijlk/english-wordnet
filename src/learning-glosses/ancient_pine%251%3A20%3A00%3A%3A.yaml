simpleMeaning: Small slow-growing conifer of the western US, bristlecone-like, with plated chocolate-brown
  bark, short needles in fives, rough twisted conical crown, living over 5,000 years on cold desert peaks.
scope: This is the gnarled, slow-growing high-mountain conifer famed for its great age, not the taller
  pines of lower forests and not a low desert shrub.
examples:
- An ancient pine clung to the rocky ridge, its trunk twisted by centuries of wind.
- Scientists drilled a core from an ancient pine to count its growth rings.
