simpleMeaning: To cut or pierce someone or something with a bladed tool.
scope: This is the verb for using a bladed tool on someone; it is another name for stab, not the cutting
  tool or the weapon.
examples:
- The fisherman knifed the tangled rope to free the net.
- The victim was knifed in the arm during the robbery.
