simpleMeaning: A blood tube in the neck that drains into the tube under the collarbone, made where the
  tubes behind the ear and behind the jaw meet
scope: This is a blood tube in the neck that drains into the one under the collarbone.
examples:
- The external jugular vein is formed where two smaller tubes meet.
- The external jugular vein empties into the tube under the collarbone.
