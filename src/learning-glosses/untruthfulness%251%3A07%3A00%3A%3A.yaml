simpleMeaning: The state of saying things that are not true, of not being honest in what one says.
scope: Not telling the truth, not a single lie and not a mistake made by accident.
examples:
- His untruthfulness made it hard for anyone to trust his words.
- The report showed a pattern of untruthfulness in her statements.
