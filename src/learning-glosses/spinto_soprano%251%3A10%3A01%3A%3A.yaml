simpleMeaning: an opera singer's voice with the clear sound and easy high notes of a light soprano, yet
  strong enough to be pushed to loud high points without strain
scope: An opera voice between a light soprano and a full dramatic soprano, not a mezzo-soprano and not
  a tenor.
examples:
- The spinto soprano sang the high notes with ease.
- As a spinto soprano, she could push her voice to a loud climax.
