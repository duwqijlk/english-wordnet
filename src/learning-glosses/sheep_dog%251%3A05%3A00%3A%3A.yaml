simpleMeaning: any of several kinds of animal, with long hair in most cases, reared to herd and guard
  woolly farm animals
scope: A long-haired dog reared to herd and guard sheep, also called a sheepdog and a shepherd dog; not
  a pet dog and not a hunting dog.
examples:
- The sheep dog ran round the flock to bring them back.
- Our sheep dog stays out with the flock all night.
