senseId: 'high-pass_filter%1:06:00::'
synsetId: 03524389-n
simpleMeaning: A device that lets through only waves that repeat above a set rate and weakens those below
  it.
scope: A device that lets through waves that repeat above a set rate and weakens those below it, not a
  low-pass filter that does the reverse.
examples:
- A high-pass filter lets the high notes through and cuts the low ones.
- The engineer fitted a high-pass filter to the radio.
