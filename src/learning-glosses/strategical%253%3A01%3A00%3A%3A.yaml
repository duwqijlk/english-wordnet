simpleMeaning: of or about a plan for getting the best result
scope: Of or about a plan for getting the best result; strategic is another name for this sense, not a
  clever trick in a small matter, and not a step taken with no plan at all.
examples:
- The islands were of strategical value in the war.
- They took a strategical view of the trade talks.
