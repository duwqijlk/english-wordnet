simpleMeaning: a worker who makes things from wood and helps to build wooden ships and put them into the
  water for the first time
scope: 'Also called shipbuilder: this is a person who helps build wooden ships, not a person who sails
  them or owns them.'
examples:
- The shipwright checked the wooden ship before it went into the water.
- A shipwright helped to build the tall wooden ship.
