simpleMeaning: A powder that blows up, made from nitroglycerin, guncotton, and petrolatum mixed in acetone,
  dried, and pushed out in brown cords.
scope: A powder that blows up, made in brown cords, not a powder for cooking or medicine.
examples:
- The soldiers loaded cordite into the shells.
- Old cordite was kept dry in the store.
