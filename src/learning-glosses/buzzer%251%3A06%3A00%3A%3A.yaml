simpleMeaning: A button by an outside door that rings or buzzes as a signal when someone presses it
scope: A door button that rings or buzzes when pressed, also called bell and doorbell; not a clock alarm
  and not the sound itself.
examples:
- She pressed the buzzer and waited at the door.
- The buzzer sounded, and he went down to let her in.
