synsetId: 08613892-n
simpleMeaning: On the side of a ship, lines show how deep the water may come when the ship is loaded as
  it should be.
scope: Also called load line, Plimsoll and Plimsoll line; lines on the side of a ship that show how deep
  the water may come when it is loaded as it should be, not lines for speed and not marks on the ship's
  deck.
examples:
- The Plimsoll mark showed the crew how deep the ship sat in the water.
- The water had reached the Plimsoll mark, so the ship was loaded as it should be.
