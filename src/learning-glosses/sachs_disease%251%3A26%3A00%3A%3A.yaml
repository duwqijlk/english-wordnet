simpleMeaning: A hereditary disorder of fat metabolism, most common in people of Jewish descent in eastern
  Europe; fats build up in nerve tissue and cause death in early childhood.
scope: Also called infantile amaurotic idiocy, Tay-Sachs, and Tay-Sachs disease; a hereditary disorder
  of fat metabolism in early childhood, not a sudden illness and not a food allergy.
examples:
- Sachs disease runs in families of eastern European Jewish descent.
- Children with Sachs disease die in early childhood as fats build up in nerve tissue.
