senseId: 'oxyphencyclimine%1:06:00::'
synsetId: 03874900-n
simpleMeaning: A drug, sold as Daricon, that blocks a nerve signal and is used to treat sores in the stomach
  or upper gut.
scope: A drug sold as Daricon for sores in the stomach or upper gut; not a drug for the heart and not
  a drug for the skin.
examples:
- The doctor gave him oxyphencyclimine for his ulcer.
- Oxyphencyclimine eased the pain of the stomach sore.
