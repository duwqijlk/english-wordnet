senseId: 'excuse%2:32:02::'
synsetId: 00894688-v
simpleMeaning: to let something wrong pass without blame, and to treat the person in a kind, not strict,
  way
scope: This means letting wrong behavior pass and being kind, not strict, with the person. It is not giving
  reasons to defend what was done, and not accepting a reason given for it.
examples:
- Please excuse my son's rude words; he was tired and upset.
- She excused her friend's bad behavior and never held it against her.
