simpleMeaning: The quality of touching only the outside of a thing, and going no deeper.
scope: The quality of touching only the outside of a thing, not a deep or thorough change.
examples:
- The superficiality of the scratch meant it healed in a day.
- The wound was slight, and its superficiality meant the doctor sent him home.
