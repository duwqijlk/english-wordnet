simpleMeaning: Any of the common trees that bear sour or bitter fruit, used as stock for grafting.
scope: One of the common orange trees, used as grafting stock for its sour or bitter fruit; bigarade,
  bitter orange, bitter orange tree, marmalade orange, sour orange and Citrus aurantium are other names
  for this sense, for the tree rather than the fruit of the same name.
examples:
- Gardeners planted Seville orange trees along the edge of the grove.
- Gardeners graft sweet kinds onto Seville orange stock.
