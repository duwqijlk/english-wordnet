simpleMeaning: Belonging to, showing, or done by a king, queen, or other ruler.
scope: This sense is not about an organization set up or approved by a monarch, but about things that
  belong to, show, or are done by a king, queen, or other ruler.
examples:
- The royal family attended the ceremony.
- The letter carried the royal seal.
