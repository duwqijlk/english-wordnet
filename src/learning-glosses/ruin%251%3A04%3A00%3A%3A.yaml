simpleMeaning: the act of breaking something down so badly that it is destroyed
scope: This is the act of destroying something, not the hopeless condition that results or the broken
  remains of a building; ruining, wrecking, ruination and laying waste are other names for it.
examples:
- The flood meant the ruin of the valley's crops.
- Years of neglect led to the ruin of the historic theater.
