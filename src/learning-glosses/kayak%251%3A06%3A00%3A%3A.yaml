simpleMeaning: a small canoe made of a light frame covered with animal skins so water cannot get in; used
  by Eskimos
scope: This small canoe, with a light frame covered with animal skins and used by Eskimos, is not a larger
  boat for many people and not a flat raft.
examples:
- The hunter crossed the icy water in a kayak covered with skins.
- A kayak made with a light frame and animal skins kept the water out.
