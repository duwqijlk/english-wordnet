simpleMeaning: Two things that stand against each other, in what they are like or where they lean
scope: 'Also called polarity: two things that stand against each other in what they are like or where
  they lean, not two things that agree and not one thing on its own.'
examples:
- He viewed good and evil as a mutual opposition, balanced between the two.
- The mutual opposition between hot and cold shapes much of the story.
