simpleMeaning: A person who goes too far with food, drink, and other wants of the body, most of all strong
  drink.
scope: Also called hard and heavy; said of a person who gives in too much to bodily wants, especially
  strong drink, not one who simply enjoys food or drink.
examples:
- His intemperate habits left him tired and short of money.
- She warned him that his intemperate drinking would ruin his health.
