simpleMeaning: a way of measuring heat in which water freezes at 0 degrees and boils at 100 degrees
scope: A way of measuring heat in which water freezes at 0 degrees and boils at 100 degrees; international
  scale is another name for this sense, not the Fahrenheit way of measuring heat and not a ruler.
examples:
- On the centigrade scale, water boils at 100 degrees.
- We used the centigrade scale to read the heat of the water.
