simpleMeaning: In criminal law, the prosecutor drops a heavier charge when the person charged admits guilt
  to a smaller one, in a deal struck between them.
scope: Also called plea bargaining, it is a deal in criminal law in which the prosecutor drops a heavier
  charge once the person charged admits guilt to a smaller one.
examples:
- His admission was part of a plea bargain with the prosecutor.
- He took the plea bargain.
