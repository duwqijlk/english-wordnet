simpleMeaning: A woman who stays with or marries a rich man to get costly things from him by gifts or
  by ending the marriage with money
scope: A woman who stays with or marries a rich man to get costly things from him, not a miner and not
  a woman who marries for love.
examples:
- They called her a gold digger after she married the rich old man.
- The gold digger asked her rich husband for jewels.
