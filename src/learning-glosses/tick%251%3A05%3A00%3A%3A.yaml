simpleMeaning: A small animal with eight legs, one of two kinds, that lives on warm animals, holds on
  with a sharp mouth part, and drinks their blood
scope: A small blood-drinking animal with eight legs, not a mark showing a thing is done and not the sound
  a clock makes.
examples:
- The dog came home with a tick on its ear.
- She found a tick on the cat and pulled it off.
