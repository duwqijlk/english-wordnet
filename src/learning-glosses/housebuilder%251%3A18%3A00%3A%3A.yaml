simpleMeaning: A person whose work is putting up new homes for pay.
scope: A person who puts up new homes as a trade; house-builder is another name for this sense, not a
  person who repairs homes and not a person who pulls homes down.
examples:
- The housebuilder put up ten new homes on the edge of town.
- Her father worked as a housebuilder all his life.
