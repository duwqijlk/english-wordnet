simpleMeaning: in a sad way that shows feeling alone and without hope
scope: In a sad, alone and hopeless way; not just in a quiet way or a slow way, and not a word for a sad
  place.
examples:
- She sat forlornly by the window, waiting for news that never came.
- A single dog barked forlornly in the empty street.
