senseId: 'hotline%1:06:01::'
synsetId: 80290977-n
simpleMeaning: a telephone line that gives a caller quick and direct information or advice about a set
  subject
scope: This is a phone line for quick information or advice on one subject, not the direct line between
  leaders of countries and not a general office number.
examples:
- She called the health hotline to get quick advice about her child's fever.
- The school set up a hotline so parents could get direct information about exam dates.
