simpleMeaning: A flap of tissue that keeps what lies beneath it safe.
scope: What it covers stays safe behind this flap of tissue; not a piece of clothing and not a wrinkle
  in the skin.
examples:
- The eyelid is a protective fold that covers the eye.
- A protective fold of skin guards the part beneath it.
