simpleMeaning: to make something more extreme, raising how much of it there is or how strong it is
scope: To make a feeling or amount more extreme, not just to make it stronger or clearer, and not to raise
  something higher.
examples:
- The news heightened interest in the new plan.
- Her words heightened the fear in the room.
