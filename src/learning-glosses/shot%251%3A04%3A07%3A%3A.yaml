simpleMeaning: the act of sending a missile or spacecraft into the air toward a chosen place
scope: Not the firing of a gun at a person, and not a throw of a ball.
examples:
- The Apollo 11 moon shot lifted off from Florida in 1969.
- The test flight was a missile shot aimed at a target in the Pacific.
