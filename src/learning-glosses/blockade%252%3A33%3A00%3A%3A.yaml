simpleMeaning: to shut off a place so that people and goods cannot get in or out
scope: To cut off a place so nothing can pass in or out; not the noun sense of the cut-off itself, and
  not merely closing a door.
examples:
- The navy moved to blockade the harbor.
- Troops blockaded the roads into the town.
