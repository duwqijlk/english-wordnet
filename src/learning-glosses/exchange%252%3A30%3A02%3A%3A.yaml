simpleMeaning: To replace a punishment with a less harsh one.
scope: This is replacing a punishment with a milder one, not swapping items of the same kind, and not
  two parties handing each other roughly equivalent things.
examples:
- The judge agreed to exchange the prison term for a fine.
- After the appeal, the harsh penalty was exchanged for a milder one.
