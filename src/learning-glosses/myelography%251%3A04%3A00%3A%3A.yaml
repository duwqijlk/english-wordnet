simpleMeaning: Usually after a dye that shows up is put into the fluid round the cord, an X-ray picture
  of the back cord finds places that may be hurt.
scope: An X-ray picture of the back cord used to find places that may be hurt, usually after dye is put
  into the fluid round the cord.
examples:
- Myelography can show places in the back cord that may be hurt.
- She had myelography after dye was put into the fluid round her cord.
