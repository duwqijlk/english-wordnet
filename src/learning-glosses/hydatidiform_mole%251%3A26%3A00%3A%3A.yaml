simpleMeaning: a pregnancy problem in which growths that join the baby to its mother break down and form
  bunches of sacs full of fluid, and the baby most often dies
scope: 'Also called hydatid mole or molar pregnancy: a problem in pregnancy where the tissue that feeds
  the baby turns into fluid-filled sacs, not a healthy pregnancy and not a skin growth.'
examples:
- A hydatidiform mole was found at her first scan.
- The hydatidiform mole meant the pregnancy could not go on.
