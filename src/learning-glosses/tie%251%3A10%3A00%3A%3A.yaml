simpleMeaning: In music, a curved line joining two notes of the same pitch, showing they are held for
  the total length of both.
scope: This is the music mark that joins two equal notes, not the act of joining them in music and not
  a cord or item used to fasten things.
examples:
- The two notes are joined by a tie, so you hold the sound through both beats.
- He drew a tie between the two identical notes.
