simpleMeaning: A person's opinion about questions of government and public affairs.
scope: This is someone's own set of views on public questions, not the study of government, the profession
  of governing, or the activities of running a state.
examples:
- Her politics are more liberal than her brother's.
- I never discuss my politics at work.
