simpleMeaning: a wash made from plant oils that is runny or like a paste, used to treat some skin problems
scope: A wash made from plant oils for some skin problems, also called green soap; not a hard bar of soap
  and not a wash made from animal fats.
examples:
- The nurse spread soft soap on the sore skin.
- Soft soap helped clear up the rash on his hands.
