simpleMeaning: any kind of plant that people grow inside a building for the way it looks
scope: This sense is a real plant grown inside to make a place look nice, not a plant grown outside in
  a garden and not one grown for food.
examples:
- She put a small houseplant on the window sill.
- He waters his houseplants every week.
