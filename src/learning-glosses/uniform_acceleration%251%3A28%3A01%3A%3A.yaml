senseId: 'uniform_acceleration%1:28:01::'
synsetId: 92443357-n
simpleMeaning: a kind of movement in which speed changes by the same amount in each equal stretch of time
scope: 'Another name for constant acceleration: speed that changes by equal amounts in equal times, not
  speed that stays the same and not speed that changes by amounts that differ each time.'
examples:
- A stone falling under gravity shows uniform acceleration.
- The car kept uniform acceleration as it sped up the hill.
