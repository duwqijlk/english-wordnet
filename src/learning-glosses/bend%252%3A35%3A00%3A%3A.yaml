simpleMeaning: to make something take a shape that is not straight, but curved or at an angle
scope: 'Also called turn and twist: to make a thing curved or at an angle, not the curved part of a road
  or river, and not to lean your body forward from the waist.'
examples:
- He bends the thin rod into a circle with his hands.
- She bends the wire to make a hook.
