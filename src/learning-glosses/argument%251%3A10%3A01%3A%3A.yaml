simpleMeaning: a short telling of the subject or main story of a piece of writing, a play or a film
scope: This sense is a short telling of a piece of writing, a play or a film, not a set of reasons, not
  an angry talk, and not a value in maths.
examples:
- The argument at the start of the play tells readers what will happen.
- She read the argument of the old poem before she read the poem itself.
