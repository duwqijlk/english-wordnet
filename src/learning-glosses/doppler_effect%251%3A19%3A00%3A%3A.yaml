simpleMeaning: A change in how often a wave seems to repeat as the watcher and the source move nearer
  or farther apart
scope: This is a change in how often a wave seems to repeat as the watcher and the source move nearer
  or farther apart; Doppler shift is another name for it, and it is not a change in the wave itself.
examples:
- The Doppler effect makes a siren sound higher as it nears.
- Astronomers use the Doppler effect to track moving stars.
