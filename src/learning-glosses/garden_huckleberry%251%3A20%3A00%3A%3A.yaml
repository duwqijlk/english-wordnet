simpleMeaning: A better grown kind of black nightshade, with small orange or black berries you can eat.
scope: This is a better grown kind of black nightshade with small orange or black berries you can eat;
  not wild black nightshade, and not a blueberry bush.
examples:
- Garden huckleberry bushes bore small black berries.
- She made jam from garden huckleberry berries.
