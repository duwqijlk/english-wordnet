simpleMeaning: A unit of stored facts, as big as 1,024 of the next smaller units, or 2 to the power 60
  bytes.
scope: Also called exabyte, exbibyte, and EiB; the 1,024-based big unit, not the 1,000-based one and not
  a bit unit.
examples:
- The disk holds two EB of data.
- One EB is huge next to a gigabyte.
