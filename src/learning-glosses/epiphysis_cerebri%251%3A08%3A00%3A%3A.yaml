simpleMeaning: Melatonin is given out by the small gland in the brain that lies under the back of the
  band joining the two halves
scope: It is also called epiphysis, the pineal body, and the pineal gland, the small brain gland that
  gives out melatonin.
examples:
- The epiphysis cerebri sits beneath the back of the corpus callosum.
- Melatonin is given out by the epiphysis cerebri.
