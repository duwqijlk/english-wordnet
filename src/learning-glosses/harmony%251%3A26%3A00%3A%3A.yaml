simpleMeaning: A state where things fit well together, in their looks and sounds, each part matching the
  others and the whole.
scope: A state where things fit well together, each part matching the others and the whole, not the way
  chords are put together in music.
examples:
- The colours of the room were in perfect harmony.
- There was harmony between the shapes and sounds of the garden.
