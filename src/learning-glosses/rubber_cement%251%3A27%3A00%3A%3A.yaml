simpleMeaning: A sticky stuff for joining things, made by mixing raw gum into a liquid such as benzene
  or naphtha until it comes apart in it.
scope: It is a kind of glue, a sticky stuff made by mixing raw gum into a liquid such as benzene or naphtha.
examples:
- The rubber cement held the two pieces together.
- The rubber cement stuck the paper down.
