scope: Also called shamrock pea; a ground-spreading plant of Asia and Africa, set apart from tall upright
  peas by its leaves in threes and its deep blue flowers.
examples:
- Parochetus communis spread across the bank in a mat of blue flowers.
- The Parochetus communis in the rock garden had leaves in threes.
