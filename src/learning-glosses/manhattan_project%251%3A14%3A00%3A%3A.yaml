simpleMeaning: A part of the government of the United States in the past made bombs that use the power
  of atoms during World War II.
scope: This was a part of the government of the United States in the past that made bombs that use the
  power of atoms, not another part of the government.
examples:
- The Manhattan Project built the first atomic bomb.
- The Manhattan Project was run by the United States government.
