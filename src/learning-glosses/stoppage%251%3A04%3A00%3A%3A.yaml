simpleMeaning: the act of making something stop moving or stop happening
scope: The act of stopping something. Not a block in a pipe or tube that stops a flow.
examples:
- His stoppage of the flow led to a flood in the fields.
- The sudden stoppage of the train left passengers waiting on the platform.
