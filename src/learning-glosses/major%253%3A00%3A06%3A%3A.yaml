simpleMeaning: more important, more serious, or higher in rank than others.
scope: It does not mean large in size, and it is not the musical term for a type of key; it describes
  importance, seriousness or rank.
examples:
- The storm caused major damage across the coast.
- She played a major role in the team's success.
