simpleMeaning: not able to spring back or rebound after being pressed, stretched, or hit
scope: This is about a material failing to spring back, not about loss of physical feeling or of echo.
examples:
- The old tennis ball had gone dead and barely bounced.
- This foam mattress feels dead and leaves a dent where you lie.
