simpleMeaning: a soft piece of skin with a suede feel, once made from a wild goat-like animal but now
  from sheep
scope: A soft piece of skin with a suede feel, once from a wild goat-like animal but now from sheep, also
  called chamois, chammy, chammy leather, chamois leather and shammy; not a rough hide and not cloth.
examples:
- Shammy leather is soft and soaks up water well.
- She wiped the windows with shammy leather.
