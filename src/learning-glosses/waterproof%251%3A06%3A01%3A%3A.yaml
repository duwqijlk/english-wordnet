simpleMeaning: A coat made to keep water out, so the wearer stays dry.
scope: A coat that keeps water out; not any cloth that keeps water out, and not the quality of keeping
  water out.
examples:
- She wore her waterproof in the storm.
- He hung his waterproof by the door.
