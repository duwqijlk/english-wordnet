simpleMeaning: a body chemical made by the front part of the gland below the brain and by the afterbirth,
  which switches on the sex glands and controls how young are made
scope: 'Also called gonadotrophic hormone, gonadotrophin, and gonadotropin: a body chemical that switches
  on the sex glands and controls how young are made, not a sex gland itself and not a medicine.'
examples:
- Gonadotropic hormone helps control the making of young in the body.
- The level of gonadotropic hormone rises when the sex glands start working.
