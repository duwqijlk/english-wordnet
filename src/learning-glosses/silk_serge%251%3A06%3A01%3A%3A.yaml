simpleMeaning: a cloth with a slanting weave made from thread spun by worms, used most often to line parts
  of a man's coat
scope: A cloth with a slanting weave made from thread spun by worms, used most often to line parts of
  a man's coat; not a plain cloth for lining and not a thick cloth for the outside of a coat.
examples:
- The tailor lined the coat with silk serge.
- The tailor used silk serge to line the inside of a man's coat.
