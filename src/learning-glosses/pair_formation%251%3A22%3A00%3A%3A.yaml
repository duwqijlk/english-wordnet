simpleMeaning: when a high-energy light particle goes close by an atom's core, it changes into two tiny
  charged bits, one negative and one positive
scope: 'Also called pair creation and pair production: a light particle turning into two charged bits
  near an atom''s core, not two things put together by hand.'
examples:
- Pair formation takes place when a gamma ray goes past a heavy nucleus.
- The class learned that pair formation makes an electron and a positron from one light particle.
