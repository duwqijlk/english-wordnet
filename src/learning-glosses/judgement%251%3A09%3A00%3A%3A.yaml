simpleMeaning: the act of thinking something through and coming to a choice or a firm view
scope: The thinking that leads to a decision, and judgment and judging are other names for this sense;
  not a court's decision and not the power to judge well.
examples:
- Her judgement of the plan was that it would fail.
- They reached a judgement after talking through all the facts.
