simpleMeaning: things that make life easy and pleasant, and help you feel at ease
scope: Things that make life easy, not a single feeling of comfort and not the act of soothing someone.
examples:
- All the comforts of home were waiting for her after the long trip.
- He missed the comforts of his own house while he was away.
