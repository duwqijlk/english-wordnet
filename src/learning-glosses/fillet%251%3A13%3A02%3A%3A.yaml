simpleMeaning: a long slice of fish, or one side of a fish with the bones taken out
scope: 'Also called filet: a slice or boned side of fish, not a boneless beef steak and not a narrow band
  worn on the head.'
examples:
- She fried a fillet of salmon for dinner.
- He ordered a fish fillet with lemon.
