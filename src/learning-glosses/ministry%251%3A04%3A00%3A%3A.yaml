simpleMeaning: the work done by a religious leader
scope: The work of a religious leader; not a government department, not a group of religious leaders taken
  as a whole, and not the building where a government department works.
examples:
- She chose the ministry and now leads a small church.
- After years in the ministry, he still visits sick people at home.
