simpleMeaning: a round, flat seed that grows on a plant and that people cook and eat as food
scope: This is the seed used as food; it is not the plant that the seed grows on.
examples:
- She cooked a big pot of lentil soup for dinner.
- Red lentils cook faster than green ones.
