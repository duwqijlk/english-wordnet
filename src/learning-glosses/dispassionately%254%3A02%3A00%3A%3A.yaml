simpleMeaning: in a fair way that does not let strong feelings change what you think or do
scope: Done in a fair way without letting strong feelings change your view, not in a way that favours
  one side and not just in a cold way.
examples:
- She listened to both sides and judged the case dispassionately.
- He spoke dispassionately about the loss, keeping his feelings out of it.
