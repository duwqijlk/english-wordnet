simpleMeaning: Two pieces of fabric are joined on this device, and the thread that joins them is out of
  sight, or nearly so
scope: This device is also called a blind stitch machine and a blindstitch sewing machine, and it joins
  two pieces of fabric with thread that stays out of sight.
examples:
- The blindstitch machine joined the two pieces of fabric, and the thread stayed hidden.
- The blindstitch machine left no thread showing on the finished cloth.
