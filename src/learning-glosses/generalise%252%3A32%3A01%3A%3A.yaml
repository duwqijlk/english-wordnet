simpleMeaning: To draw from set cases to wider cases.
scope: This sense is also called generalize, for drawing from set cases to wider cases, unlike the sense
  for speaking or writing in broad terms, and unlike the sense for wooing the crowd to spread a thing
  and bring it into wide use.
examples:
- They generalise, drawing from set cases to wider cases.
- They generalise from facts.
