simpleMeaning: A severe form of vaccinia that can be fatal, mostly in people with a weakened immune system,
  marked by the first sore steadily getting bigger.
scope: The severe form of vaccinia that can be fatal and mainly affects people with weak immunity, not
  the usual brief reaction to vaccination.
examples:
- Progressive vaccinia mostly affects people whose immune system is weakened.
- In progressive vaccinia, the first sore grows steadily larger.
