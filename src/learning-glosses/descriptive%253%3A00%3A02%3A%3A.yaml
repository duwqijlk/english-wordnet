simpleMeaning: that tells people details about a thing, or is full of details
scope: Giving details about a thing; not the language-study sense that sets out a language's forms and
  use as they are.
examples:
- The book has a long descriptive passage about the sea.
- She wrote a clear, descriptive account of the trip.
