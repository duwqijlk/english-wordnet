simpleMeaning: a washbasin fixed in a bathroom and joined to pipes that bring water in and take it away,
  for washing your hands and face
scope: A fixed bathroom washbasin joined to water pipes, basin being another name for this sense, and
  not a room with a toilet.
examples:
- He ran some water in the lavatory and splashed it on his face.
- The lavatory in the hotel room was clean and white.
