simpleMeaning: Used to describe land, things about land, or living things that live on land instead of
  in the sea or the air
scope: This is about land rather than sea or air, not about the planet Earth as a whole or the people
  who live on it.
examples:
- Deer are terrestrial animals that live on land, not in water.
- The turtle spends most of its life as a terrestrial animal on dry land.
