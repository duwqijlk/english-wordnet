simpleMeaning: The power of the body to do a bodily act, not a power of the mind
scope: The power of the body to act, set against a power of the mind; not mere strength of muscle.
examples:
- Climbing that wall needs great physical ability.
- His physical ability let him lift the heavy box with ease.
