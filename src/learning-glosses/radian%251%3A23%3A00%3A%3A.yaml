simpleMeaning: 'Take an arc along a circle''s edge as long as the radius: the angle it makes at the centre
  is the standard international measure of angles, about 57.3 degrees.'
scope: The same angle unit that the abbreviation rad names; not the rad used for absorbed radiation dose,
  and not the degree, a smaller angle measure.
examples:
- One full turn is about 6.28 radians.
- The telescope's tracking angle is recorded in radians, not degrees.
