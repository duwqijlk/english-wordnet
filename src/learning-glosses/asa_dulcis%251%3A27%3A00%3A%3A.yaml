simpleMeaning: a sticky plant juice used, above all, to soothe sore skin
scope: 'Also called benjamin, benzoin, gum benjamin or gum benzoin: a plant juice for sore skin, not a
  sweet food and not a medicine for the whole body.'
examples:
- The nurse spread asa dulcis on the child's sore skin.
- Asa dulcis was once used to calm red, itching skin.
