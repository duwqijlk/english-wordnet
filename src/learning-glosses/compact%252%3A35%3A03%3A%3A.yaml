simpleMeaning: To make a thing pack close together, by pressing it or as if by pressing it.
scope: To make a thing pack close together, by pressing it or as if by pressing it, not the state of being
  pressed close, not the way a thing packs down well, and not the small case for face powder.
examples:
- He compacted the soil with a heavy roller.
- She compacted the rubbish into the bin.
