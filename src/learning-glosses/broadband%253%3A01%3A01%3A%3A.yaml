simpleMeaning: About a network for sending sound, information and moving pictures, where the space for
  signals can be split and shared, so many signals can go at the same time.
scope: This describes a kind of network for sending sound, words and pictures at the same time, not a
  wide strip of material or land.
examples:
- The office uses a broadband network that carries calls and video at the same time.
- A broadband link lets many people send sound and pictures at once.
