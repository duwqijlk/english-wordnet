simpleMeaning: A short stick is spun by a girl or woman who marches with a band
scope: Also called drum majorette, this is a girl or woman who spins a short stick while marching with
  a band, not a band player and not a dancer alone.
examples:
- The majorette spun her baton at the head of the parade.
- She became a majorette and marched with the school band.
