simpleMeaning: the round face on a tool for measuring, with marks and numbers that show the amount measured
scope: The measuring face with marks on it, not the old disc on a telephone and not the act of calling
  a number.
examples:
- The dial on the scale showed that the bag weighed ten kilos.
- He watched the dial as the pressure rose slowly.
