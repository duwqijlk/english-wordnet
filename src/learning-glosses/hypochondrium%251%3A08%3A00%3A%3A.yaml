simpleMeaning: Under the lowest ribs, on the left and the right of the middle of the belly, is the upper
  part of the belly
scope: The upper part of the belly just under the lowest ribs, on the left and the right; not the middle
  of the belly and not the lower belly.
examples:
- Pain in the right hypochondrium can come from the liver.
- The doctor pressed the patient's left hypochondrium to check for pain.
