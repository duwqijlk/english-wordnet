simpleMeaning: A growth from North America with pale brown wood and hard-shelled fruit that can be eaten,
  and the source of a pale brown dye
scope: A growth from North America with pale brown wood and hard-shelled fruit that can be eaten; butternut
  is another name for this sense, not a small bush and not a growth grown only for shade.
examples:
- The butternut tree gave nuts every autumn.
- Butternut trees have pale brown wood.
