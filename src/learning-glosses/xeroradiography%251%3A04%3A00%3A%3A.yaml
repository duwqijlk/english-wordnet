simpleMeaning: A way of taking pictures of the inside of the body with X-rays, using a dry copying way
  instead of the usual film way
scope: A way of taking pictures inside the body with X-rays, not a plain X-ray on film and not a picture
  made with sound waves.
examples:
- Xeroradiography gave a clear picture of the broken bone.
- The hospital used xeroradiography for the chest pictures.
