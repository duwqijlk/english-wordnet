simpleMeaning: To keep an unwanted buyer from taking it over, a company takes a step that puts the buyer
  off.
scope: Porcupine provision is another name for a step a company takes to put off a buyer it does not want,
  so the buyer gives up trying to take it over.
examples:
- The company used a shark repellent to put off the unwanted buyer.
- A shark repellent makes a takeover hard to carry out.
