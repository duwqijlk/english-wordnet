simpleMeaning: How much a word part or a musical note stands out, most of all in how hard or high it sounds
scope: 'Also called stress: how much a word part or note stands out, not a way of speaking and not a mark
  written over a letter.'
examples:
- He put the accent on the wrong syllable.
- The accent falls on the first note of the tune.
