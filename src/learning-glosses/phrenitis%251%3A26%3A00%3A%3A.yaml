simpleMeaning: Headache and pain in the neck, sleepiness, sickness, and fever, a name doctors no longer
  use, mark a swelling of the brain, usually brought on by a virus.
scope: 'Also called cephalitis and encephalitis: a swelling of the brain, usually brought on by a virus,
  with headache and pain in the neck, sleepiness, sickness, and fever.'
examples:
- Phrenitis left him with a headache and a fever.
- Doctors no longer use the word phrenitis for a swelling of the brain.
