simpleMeaning: a change in chemicals in which one tiny bit of a substance breaks into two unlike bits
scope: A change in chemicals in which one tiny bit of a substance breaks into two unlike bits, not a change
  in which two bits join into one and not a change that leaves the stuff the same.
examples:
- In the elimination reaction, one molecule broke apart into two different ones.
- The chemist used an elimination reaction to break the large molecule into two smaller ones.
