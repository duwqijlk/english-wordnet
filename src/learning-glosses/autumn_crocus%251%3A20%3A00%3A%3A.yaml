simpleMeaning: Growing wild in the west and middle of Europe, this herb grows from a bulb and flowers
  in the fall, with white, purple, or pale purple-and-white blooms.
scope: Also called meadow saffron and naked lady, this is the bulb herb that flowers in the fall in western
  and central Europe, not one that flowers in the spring.
examples:
- The autumn crocus flowers in the fall, with white and purple blooms.
- An autumn crocus grows from a bulb and comes up each fall.
