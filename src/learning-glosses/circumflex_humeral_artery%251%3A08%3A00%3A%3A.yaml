simpleMeaning: A blood vessel that brings blood to the joint of the shoulder and to the muscles around
  it.
scope: A blood vessel that feeds the shoulder joint and its muscles, also called arteria circumflexa humeri;
  not the blood vessel that feeds the hip and not a vein.
examples:
- The circumflex humeral artery was cut during the operation.
- Blood reached the shoulder through the circumflex humeral artery.
