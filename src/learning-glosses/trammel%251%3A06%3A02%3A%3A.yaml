simpleMeaning: A hook that moves up and down, set in a hearth.
scope: This sense is a hook that moves up and down, set in a hearth, unlike the sense for a fishing net
  of three layers, the outer two of coarse mesh, the loose inner one of fine mesh, and unlike the sense
  for a bind that hems in or holds down freedom, especially a thing used to tie down or hold down a prisoner.
examples:
- The trammel is a hook that moves up and down.
- Trammels hang in hearths.
