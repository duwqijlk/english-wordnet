simpleMeaning: a way of covering a surface so that each piece lies over part of the next one, as tiles
  or shingles do
scope: A covering pattern in which each piece lies over part of the next, not a single flat layer and
  not the sound of water.
examples:
- The lapping of the roof tiles kept the rain out.
- Shingles are laid with lapping so each row covers the one below.
