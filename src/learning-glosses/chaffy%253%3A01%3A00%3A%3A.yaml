simpleMeaning: with a lot of chaff in it, or covered in chaff, or looking like chaff, or made from chaff
scope: 'Also called chafflike: with a lot of chaff in it, or covered in chaff, or looking like chaff,
  or made from chaff, not clean grain and not plain straw.'
examples:
- The chaffy straw pricked his hands.
- The floor was chaffy with dry bits from the grain.
