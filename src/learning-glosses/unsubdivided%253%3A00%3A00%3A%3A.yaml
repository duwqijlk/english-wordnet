simpleMeaning: In botany, of a leaf shape whose flat part is one unbroken piece, with no cuts that split
  it
scope: 'Also called simple: a leaf shape that is one unbroken piece, not a leaf split into small leaflets
  and not a leaf with a cut edge.'
examples:
- The unsubdivided leaf was one flat piece with no cuts splitting it.
- Botanists call a leaf unsubdivided when its shape has no parts cut off from the rest.
