simpleMeaning: a health problem in which a person is very restless, acts on a sudden urge, and has strong
  feelings they cannot keep in check
scope: 'Also called attention deficit hyperactivity disorder, hyperkinetic syndrome, minimal brain damage,
  or minimal brain dysfunction: a health problem marked by restlessness, sudden urges, and feelings that
  are hard to keep in check, not a lack of sleep and not bad behaviour alone.'
examples:
- The doctor said the boy's attention deficit disorder makes it hard for him to sit still at school.
- Her attention deficit disorder means she often acts before she thinks.
