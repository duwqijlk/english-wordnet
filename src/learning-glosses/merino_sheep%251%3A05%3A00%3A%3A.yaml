simpleMeaning: a white farm animal from Spain with a thick coat of very fine wool
scope: A white sheep from Spain with a thick coat of very fine wool; merino is another name for this sense,
  not a sheep kept for meat, and not a goat.
examples:
- Merino sheep are prized for their thick coats of fine wool.
- The farmer kept merino sheep from Spain for their wool.
