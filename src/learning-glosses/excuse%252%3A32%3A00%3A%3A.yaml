simpleMeaning: to accept the reason a person gives for something bad or wrong and not blame them for it
scope: To accept a person's reason for something and not blame them; not to give reasons to defend something
  and not simply to let a wrong thing pass.
examples:
- Please excuse my dirty hands; I was working in the garden.
- The teacher excused his late arrival because his bus had broken down.
