simpleMeaning: a person who lives in a way like a Romani (a member of a travelling people), moving from
  place to place and not living in the usual way
scope: 'Also called gypsy: this is a person who lives like a Romani, moving from place to place and not
  in the usual way; it is not a worker who moves where jobs need them.'
examples:
- With no fixed home, she lived as a gipsy, travelling from town to town.
- He was a gipsy at heart, always moving on and living as he pleased.
