simpleMeaning: care that helps people do everyday tasks that matter to them, above all so they can join
  in daily life even when body or mind is weak
scope: Care that helps people do daily tasks again, not exercise to build strength and not treatment that
  only uses drugs.
examples:
- After her stroke, she had occupational therapy to learn to dress herself again.
- His occupational therapy includes cooking a simple meal each morning.
