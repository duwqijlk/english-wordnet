simpleMeaning: These plain things to wear are fit to be seen in out in front of others, unlike a costume,
  sports kit, work wear, and the like.
scope: These are plain things to wear out in front of others, not a costume, not sports kit, and not work
  wear.
examples:
- She changed into street clothes.
- He wore street clothes, not a costume.
