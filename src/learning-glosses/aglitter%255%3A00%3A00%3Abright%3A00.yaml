simpleMeaning: Lit by brief, bright points of light, flashing on and off.
scope: This sense is also called glittering, glinting, sparkly, glittery, scintillating, and glistering,
  for being lit by brief, bright points of light, flashing on and off, where glittering is shining with
  short, bright flashes that come and go.
examples:
- The dew was aglitter in the sun.
- Her dress looked aglitter with bright points of light.
