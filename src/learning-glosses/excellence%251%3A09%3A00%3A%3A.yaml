simpleMeaning: a thing that stands out as very good, the best part of a person or a thing
scope: A part of something that stands out as very good, not the quality of being good in general.
examples:
- The use of herbs is one of the excellencies of French cuisine.
- Her kindness was one of her greatest excellences.
