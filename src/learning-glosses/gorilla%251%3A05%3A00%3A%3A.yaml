simpleMeaning: the largest ape (a large animal like a monkey, with no tail), which lives on the ground,
  eats only plants, and lives in the forests of central west Africa
scope: The largest ape, living on the ground in central west African forests and eating only plants, not
  a monkey and not a smaller ape.
examples:
- A gorilla sat on the ground eating green leaves.
- We saw a large gorilla in the forest in west Africa.
