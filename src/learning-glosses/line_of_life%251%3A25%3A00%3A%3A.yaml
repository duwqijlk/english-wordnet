simpleMeaning: How long this fold in the skin of the hand is, people who read hands say, shows how long
  you will live
scope: 'Also called lifeline and life line: a fold in the hand whose length is said to show how long you
  will live, not the fold said to show success and not the fold said to show what you feel.'
examples:
- Her line of life was long and clear.
- The palmist said his line of life showed many years ahead.
