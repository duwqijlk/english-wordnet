simpleMeaning: a person who performs in a way that people enjoy
scope: A performer who delights those who watch or hear them; not a thing that pleases, and not a person
  who merely tries to please.
examples:
- He is quite the crowd pleaser.
- The young singer was a real pleaser at the fair.
