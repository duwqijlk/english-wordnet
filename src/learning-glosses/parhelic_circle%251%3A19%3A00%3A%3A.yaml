simpleMeaning: High in the air, small bits of ice bend the light into a bright ring that runs level with
  the ground at the sun's height.
scope: This is the bright ring of light, also called a parhelic ring and a solar halo, that small bits
  of ice high in the air make by bending the light.
examples:
- A parhelic circle showed as a bright ring of light level with the ground.
- The parhelic circle ran level with the ground at the height of the sun.
