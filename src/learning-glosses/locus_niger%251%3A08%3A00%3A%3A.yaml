simpleMeaning: a dark layer of grey matter in the middle of the brain, joined to the striate body and
  tied up with chemical trouble in Parkinson and Huntington disease
scope: A dark layer of grey matter in the middle of the brain, also called nucleus niger and substantia
  nigra, not a part of the outer brain and not a nerve.
examples:
- The locus niger is a dark layer of grey matter in the midbrain.
- Damage to the locus niger is linked to Parkinson's disease.
