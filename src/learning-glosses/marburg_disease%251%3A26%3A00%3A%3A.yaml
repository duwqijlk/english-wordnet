simpleMeaning: A virus illness of green monkeys, spread by a virus of the same name, that brings grave
  or deadly sickness when it passes to people.
scope: 'Also called green monkey disease and Marburg hemorrhagic fever: a virus illness of green monkeys
  that brings grave or deadly sickness to people, not other illnesses of monkeys.'
examples:
- Marburg disease spread from green monkeys to the lab workers.
- The doctors feared Marburg disease after the monkeys fell ill.
