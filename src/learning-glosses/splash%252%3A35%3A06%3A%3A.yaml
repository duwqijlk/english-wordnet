simpleMeaning: to put spots or parts of a different color or feel on a thing, so that it looks as if drops
  of liquid were thrown on it
scope: This sense is to put spots of a different color or feel on a thing, not to throw water on it and
  not to move about in water.
examples:
- The hills were splashed with snow, white against the dark rock.
- Red flowers splashed the green field with color.
