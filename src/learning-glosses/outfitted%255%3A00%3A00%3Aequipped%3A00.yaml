simpleMeaning: having the right clothes and extra things to wear for a purpose
scope: Having the right clothes and things to wear, not having the tools or equipment needed for a job
  or task.
examples:
- The children were outfitted in warm coats, hats, and gloves for winter.
- She arrived outfitted for the party in a red dress and silver shoes.
