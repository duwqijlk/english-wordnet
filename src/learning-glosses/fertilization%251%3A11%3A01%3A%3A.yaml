simpleMeaning: Spreading plant food or dung on soil to make it rich enough for plants to grow well.
scope: Also called a dressing; making soil rich with plant food or dung, not the joining of male and female
  cells that starts new life.
examples:
- Fertilization of the fields began before the spring sowing.
- Good fertilization left the garden soil dark and rich.
