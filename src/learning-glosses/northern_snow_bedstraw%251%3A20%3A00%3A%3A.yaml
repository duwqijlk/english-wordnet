simpleMeaning: A plant of North America that lives for years, spreads by stems along the ground, and has
  white flowers; it is sometimes grown for show.
scope: Also called Galium boreale and Northern bedstraw; a North American plant with white flowers, sometimes
  grown for show, not a bedstraw of Europe or Asia.
examples:
- Northern snow bedstraw blooms in early summer.
- Northern snow bedstraw lines the woodland path.
