simpleMeaning: using the enormous destructive force released from atomic energy, as certain weapons do.
scope: This is not the sense relating to the nucleus of a cell or atom, and not about atomic energy used
  for peaceful power; it describes weapons powered by destructive atomic energy.
examples:
- The country tested a nuclear weapon in the desert.
- Nuclear bombs release enormous destructive energy.
