simpleMeaning: a layer of stuff that water cannot pass through, laid in the low walls of a building to
  keep wetness from rising into it
scope: A layer of stuff that water cannot pass through, laid in the low walls of a building; also called
  damp course, not a roof layer and not a drain.
examples:
- The damp-proof course keeps wetness from rising into the house.
- Builders laid a damp-proof course in the low walls.
