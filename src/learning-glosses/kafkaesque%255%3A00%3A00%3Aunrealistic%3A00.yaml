simpleMeaning: Marked by strange, dream-like twists and a feeling that danger is near.
scope: Marked by strange, dream-like twists and a feeling that danger is near, not plainly strange and
  not openly dangerous.
examples:
- The kafkaesque terror of the endless interrogations wore him down.
- His kafkaesque trial seemed to go on for ever.
