simpleMeaning: Admiralty Metal is a trade name for this mix of metals with tin in it, of the two-part
  kind, that stands up to sea water.
scope: This mix of metals holds tin and stands up to sea water, and Admiralty Metal is a trade name for
  it.
examples:
- Naval brass holds up well in sea water.
- Naval brass is a mix of metals with tin in it.
