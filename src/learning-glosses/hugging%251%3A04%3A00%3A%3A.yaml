simpleMeaning: loving play, or play before sex, that does not touch the sex parts of the body
scope: 'Also called kissing and petting: loving play with no touch of the sex parts, not just holding
  a person in your arms and not sex itself.'
examples:
- They spent the evening hugging and kissing on the sofa, with no touch of each other's sex parts.
- For them, hugging was loving play before sex, but it never touched the sex parts.
