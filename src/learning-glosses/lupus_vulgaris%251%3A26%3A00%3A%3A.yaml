simpleMeaning: 'It first shows on the face and heals slowly, leaving deep scars: this skin disease is
  a kind of tuberculosis, a slow disease that harms the body'
scope: A skin disease caused by tuberculosis, first on the face and slow to heal, not a common rash and
  not a spot that heals fast.
examples:
- The doctor said the lupus vulgaris on her cheek would heal slowly.
- Lupus vulgaris left deep scars on his face.
