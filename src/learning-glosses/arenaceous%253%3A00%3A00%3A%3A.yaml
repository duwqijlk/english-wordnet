simpleMeaning: Like sand, or full of sand, or growing where the ground is sandy.
scope: 'Also called sandy: like sand, or full of sand, or growing in sandy ground; not clay ground and
  not bare rock.'
examples:
- The arenaceous soil drains fast after rain.
- Arenaceous grasses grow where the ground is sandy.
