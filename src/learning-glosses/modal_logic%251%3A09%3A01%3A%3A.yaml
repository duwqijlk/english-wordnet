simpleMeaning: A set of rules for claims about what must be true and what may be true, shaped like ideas
  about duty and about what people know.
scope: This is a set of rules for sorting out claims about what must be true and claims about what may
  be true, built on ideas about duty and about what people know.
examples:
- In modal logic, 'it must rain' says more than 'it may rain'.
- The modal logic in the book deals with what has to be true, not only with what is true.
