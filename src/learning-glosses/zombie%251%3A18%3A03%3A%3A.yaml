simpleMeaning: In voodooism, a spirit or a power beyond nature that brings a dead body back to life
scope: In voodooism, the spirit or power that brings a dead body back to life, also called a zombi; it
  is not the rum drink, not a god that people worship, and not a person who moves and answers like a machine.
examples:
- The people feared the zombie, a spirit that could bring a dead body back to life.
- In voodoo belief, the zombie brings the dead back to life.
