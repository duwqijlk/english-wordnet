simpleMeaning: In photography, the size of a lens opening found by dividing the length of its focus by
  the width of the lens
scope: 'Also called speed and focal ratio: a measure of a lens opening, not the length of the lens itself
  and not how much light the picture needs.'
examples:
- A low f number lets in more light for night shots.
- She set the f number to 8 for the group photo.
