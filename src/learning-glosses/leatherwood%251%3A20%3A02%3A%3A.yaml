simpleMeaning: a shrub or small tree of the south-east United States, the West Indies and Brazil, grown
  for its thin sprays of white flowers and orange and red leaves
scope: 'Also called cyrilla and white titi: a shrub grown for its white flowers and bright leaves, not
  the tough-branched leatherwood shrub of eastern North America.'
examples:
- The leatherwood in the garden had thin sprays of white flowers.
- People grow leatherwood for its orange and red leaves.
