senseId: 'federalize%2:30:01::'
synsetId: 00505545-v
simpleMeaning: bring a thing under the rule of the government of the whole country
scope: To bring a thing under the rule of the government of the whole country; federalise is another name
  for this sense; not to join states together as a league, and not a change made by a local government.
examples:
- The government plans to federalize the railways.
- They voted to federalize the police force.
