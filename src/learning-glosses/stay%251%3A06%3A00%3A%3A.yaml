simpleMeaning: On a ship, a thick rope or wire cable holding a mast or spar in place.
scope: This is a piece of ship's rigging, not a period of remaining in a place or state, not a pause in
  activity, not a court order, not a strip that stiffens a corset, and not the verb meaning to remain.
examples:
- The sailor tightened the stay that supports the mainmast.
- One of the wire stays snapped in the storm.
