simpleMeaning: The beat of the blood tube in the arm, felt at the wrist
scope: The beat of the blood tube in the arm felt at the wrist, not the beat of the heart itself.
examples:
- The nurse felt the radial pulse at his wrist.
- Her radial pulse was steady and strong.
