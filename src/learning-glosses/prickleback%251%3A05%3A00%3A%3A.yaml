simpleMeaning: With a long back fin made up wholly of sharp points, these small, long-bodied fish live
  in shallow northern seas
scope: These small, long-bodied fish of shallow northern seas have a long back fin made up wholly of sharp
  points, and are not the small spiny-backed fish of northern fresh waters.
examples:
- The prickleback lived in the shallow northern sea.
- A prickleback swam in the shallow northern sea.
