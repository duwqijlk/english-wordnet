simpleMeaning: A tree in the south of the United States that keeps its leaves all year, with big stiff
  shiny leaves and huge white flowers that smell sweet.
scope: A tree in the south of the United States that keeps its leaves all year; also called a bull bay
  or a large-flowering magnolia, not a tree that loses its leaves in winter and not a small shrub.
examples:
- The evergreen magnolia blooms with huge white flowers in spring.
- An evergreen magnolia shades the garden all year round.
