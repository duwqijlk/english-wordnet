simpleMeaning: A person who holds back from doing too much, keeps a hard and firm line, and sets strong
  limits
scope: 'Another name for strict: a hard, firm way of being with strong limits, not a kind or easy-going
  way.'
examples:
- Her nonindulgent father set strict rules and never let her stay out late.
- The nonindulgent teacher gave no extra time, even when the work was hard.
