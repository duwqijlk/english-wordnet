simpleMeaning: a kind of invisible light with very short waves, made when fast-moving electrons, tiny
  parts that carry a charge, hit a solid target
scope: A kind of invisible light with very short waves, not the light we see and not a beam of heat.
examples:
- The doctor used a roentgen ray to look at the broken bone.
- A roentgen ray can pass through soft flesh but not bone.
