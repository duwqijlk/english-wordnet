simpleMeaning: In computer science, a fast store inside computers set aside and kept up to date, to speed
  up data movement between parts of the system that work in different ways
scope: In computer science, a fast store inside computers, also called cache; not the computer's main
  memory and not a disk.
examples:
- The memory cache keeps the data the computer needs most close at hand.
- A bigger memory cache can help the computer work faster.
