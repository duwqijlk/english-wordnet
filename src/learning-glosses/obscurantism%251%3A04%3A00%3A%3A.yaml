senseId: 'obscurantism%1:04:00::'
synsetId: 00757823-n
simpleMeaning: A deliberate act meant to keep something hard to see or hard to understand.
scope: A deliberate act meant to keep something hard to understand; not an honest mistake, and not simply
  keeping a secret for safety.
examples:
- The report's obscurantism hid the true costs from the public.
- His obscurantism made the plain facts hard to follow.
