senseId: 'mechanize%2:30:01::'
synsetId: 00481500-v
simpleMeaning: to make something dull and always the same, and to make it happen in a fixed, regular way
scope: This sense is about making work or an activity dull and fixed in its way, not giving armed vehicles
  to an army and not putting machines into a process.
examples:
- Too much paperwork mechanized his job and left him bored each day.
- The new rules mechanized the whole process, so every case was handled in exactly the same way.
