simpleMeaning: of a knight's helmet, having a plume (a large, showy feather) to make it look fine
scope: 'Also called crested: this use is only for a knight''s helmet with a plume for show, not for a
  bird or plant with a feathery bunch and not for things covered with many plumes.'
examples:
- The knight wore a plumed helmet with a tall red feather on top.
- A plumed helmet stood on the table next to his sword.
