simpleMeaning: In verse, a line with six beats, each beat a weak sound and then a strong one
scope: A line of verse with six beats, each a weak sound and then a strong one — not a line with fewer
  or more beats.
examples:
- The poet wrote the whole piece in Alexandrines.
- That Alexandrine has six beats, and each one falls the same way.
