simpleMeaning: A piece of jewelry made as one of two joined buttons, worn to hold the end of a shirt sleeve
  shut at the wrist
scope: This is one of a pair of joined buttons for a shirt sleeve; it is not a button sewn on a shirt
  and not other kinds of jewelry.
examples:
- He wore silver cufflinks with his best shirt.
- One cufflink fell off and rolled under the table.
