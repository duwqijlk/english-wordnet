simpleMeaning: With ten as the base, this way of writing numbers gives each digit its worth from the place
  where it stands
scope: This is a way of writing numbers by place value with ten as the base, also called the decimal number
  system and the decimal numeration system; not counting by twos, and not Roman numerals.
examples:
- The decimal system lets us write large amounts with just ten signs.
- Children first meet the decimal system when they learn to count in tens.
