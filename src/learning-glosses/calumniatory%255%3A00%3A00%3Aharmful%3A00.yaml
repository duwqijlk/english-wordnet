simpleMeaning: 'of words said about someone: harmful and often untrue, meant to make people think badly
  of them'
scope: 'Of words said about someone: harmful and often untrue, meant to make people think badly of them;
  denigrating, slanderous, calumnious, defamatory, denigrative, denigratory, libellous and libelous are
  other names for this sense, not words that are merely unkind.'
examples:
- Her calumniatory remarks ruined his good name.
- The court called the letter calumniatory and untrue.
