simpleMeaning: a run in which a plane drops its bomb while flying straight down at what it aims at
scope: A run in which a plane drops its bomb while flying straight down at its target, and not a level
  run or a run that drops the bomb from far away.
examples:
- The dive-bombing run began as the plane tipped down toward the bridge.
- During the dive-bombing, the pilot let the bomb go at the last moment.
