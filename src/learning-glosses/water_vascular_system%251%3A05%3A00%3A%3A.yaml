simpleMeaning: A set of tubes full of liquid that sea animals with spiny skins (echinoderms) use to move,
  feed, and breathe.
scope: A set of tubes full of liquid that sea animals with spiny skins use to move, feed and breathe;
  not a blood system and not a set of nerves.
examples:
- The water vascular system helps the sea animal move and feed.
- Starfish use their water vascular system to breathe and move.
