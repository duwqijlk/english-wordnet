simpleMeaning: feeling worried and not able to rest or stay calm
scope: 'Also called restless, itchy, fretful, and antsy: feeling worried and unable to stay still, not
  a body feeling of needing to scratch.'
examples:
- The fidgety child kept moving in his chair during the long wait.
- She felt fidgety before the test and could not sit still.
