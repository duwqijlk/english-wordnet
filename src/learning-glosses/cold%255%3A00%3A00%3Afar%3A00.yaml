simpleMeaning: used of someone searching for something, meaning they are still far from what they are
  trying to find
scope: This describes a searcher's distance from the goal, not the temperature of the air or a person's
  manner.
examples:
- 'You''re cold: the hidden key is on the other side of the room.'
- The children shouted 'cold' whenever the seeker moved farther from the toy.
