simpleMeaning: A tight water passage connecting two larger bodies of water.
scope: This is the noun for a tight sea passage joining two waters, not the adjective meaning not wide
  or the verb meaning to make something less wide.
examples:
- The little ferry crossed the narrow between the two islands.
- Strong tides sweep through the narrow connecting the bay and the open sea.
