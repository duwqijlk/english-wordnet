simpleMeaning: A woman who charms men with her looks, only to take advantage of them for herself.
scope: Also called a tease, a flirt, a coquette, or a vamp, a woman who charms men with her looks, only
  to take advantage of them for herself.
examples:
- She played the minx, charming the men at the party and then asking them for favours.
- The minx smiled at him and got him to carry her bags.
