simpleMeaning: Its tart-sweet purple flesh is used above all to make preserves; the fruit itself, from
  India, is deep red-purple and like a gooseberry.
scope: Also called kitambilla and kitembilla, this is a dark red-purple Indian fruit, not a gooseberry.
examples:
- She made ketembilla preserves from the tart fruit.
- The ketembilla fruit tasted both tart and sweet.
