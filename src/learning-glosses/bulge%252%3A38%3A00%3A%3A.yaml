simpleMeaning: to stick outwards
scope: This verb means to stick outwards, not the noun for a raised part and not making something else
  stick out; it does not by itself say the thing got bigger.
examples:
- His eyes bulged when he saw the price.
- The frog's eyes bulge out from its head.
