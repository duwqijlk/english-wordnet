simpleMeaning: In statistics, a summary number that tells where a distribution lies.
scope: This is a statistical summary of a distribution, not a sports success rate or an ordinary middle
  value on a scale.
examples:
- The average of the five test scores was 72.
- To find the average, add the values and divide by how many there are.
