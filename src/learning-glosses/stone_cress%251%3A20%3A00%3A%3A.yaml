simpleMeaning: a plant of the Old World, of the kind Aethionema, that grows in sunny places on chalky
  rock
scope: This is a plant of the Old World kind Aethionema, also called stonecress; not a water plant and
  not a garden herb grown for food.
examples:
- Stone cress grows wild on sunny limestone slopes.
- The stone cress in the rock garden came from the Old World.
