simpleMeaning: A rich band of needlework along the edge of a church robe
scope: A rich worked band on a church robe, not a plain hem and not a jewel.
examples:
- Gold thread ran through the orphrey on the priest's robe.
- The orphrey edged the front of the old vestment.
