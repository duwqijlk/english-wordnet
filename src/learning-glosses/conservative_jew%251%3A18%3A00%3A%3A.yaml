simpleMeaning: A person of the Hebrew faith who keeps some of the laws of Moses but fits others to life
  today.
scope: A person of the Hebrew faith who keeps some of the laws of Moses but fits others to life today;
  the point is the mix of keeping and adapting, not keeping all the laws or none.
examples:
- A Conservative Jew keeps some of the laws of Moses and adapts others to modern life.
- As a Conservative Jew, she follows some old laws and fits others to life today.
