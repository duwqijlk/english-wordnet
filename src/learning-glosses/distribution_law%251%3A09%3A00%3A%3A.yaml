simpleMeaning: 'In chemistry, all the energy in a group of bits of matter follows a pattern of chance:
  it is shared out round a middle value, not evenly.'
scope: In chemistry, the energy in a group of bits of matter is shared out round a middle value, not shared
  out evenly between them.
examples:
- The distribution law says energy is shared out round a middle value.
- Under the distribution law, the energy is not shared out evenly.
