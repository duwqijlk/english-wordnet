simpleMeaning: any of many wild trees that most often bear small, sharp-tasting fruit
scope: Also called crabapple, this is a wild tree with small, sharp-tasting fruit, not the small sour
  fruit picked for jelly.
examples:
- Wild crab apples grow along the old hedgerow.
- The crab apple tree in the wood was full of small, sharp fruit.
