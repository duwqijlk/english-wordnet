simpleMeaning: A fighting vessel, at rest or moving, that must stay readier for action than the others
  in its group.
scope: A fighting vessel, at rest or moving, that must stay readier for action than the others in its
  group, not a merchant vessel and not a warship kept in port for repair.
examples:
- The guard ship stayed on watch through the night.
- A guard ship must be ready to sail at short notice.
