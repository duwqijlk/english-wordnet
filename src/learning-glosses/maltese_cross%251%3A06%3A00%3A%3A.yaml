simpleMeaning: The arms of these bars are shaped like triangles or arrows, and their points turn toward
  the middle.
scope: This is a mark of bars whose arms point inward, not a plain cross and not the cross of Lorraine,
  whose bars run straight across.
examples:
- The Maltese cross has arms shaped like triangles.
- She wore a Maltese cross on a chain.
