simpleMeaning: Corticosterone and sex hormones come from the outer layer of the small gland that sits
  above each kidney.
scope: This is the outside part of the small gland above the kidney, not the gland as a whole or the part
  deep inside it.
examples:
- The lab test showed the adrenal cortex putting out corticosterone.
- Sex hormones from the adrenal cortex reached the blood.
