simpleMeaning: an account of one single case, made to fit that case alone
scope: An account of one single case, made to fit that case alone, also called particularization; not
  a broad account that fits many cases and not a short label.
examples:
- The particularisation of the case took a full page.
- Her particularisation showed how this case differed.
