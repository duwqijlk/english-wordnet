simpleMeaning: to think about something in detail and in a careful, ordered way to find its most important
  qualities or what it means
scope: 'Also called study: to think about a thing in detail to understand it; not to ask a person many
  questions and not just to look a thing over to check it.'
examples:
- She examined the poem closely to find what it really means.
- The students examined the story in detail to understand its main ideas.
