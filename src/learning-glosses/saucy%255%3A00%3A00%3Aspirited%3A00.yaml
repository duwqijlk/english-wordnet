simpleMeaning: full of life and fun, and a little bold in a way that is light, not unkind
scope: 'Also called impertinent, pert, and irreverent: lively, bold, and full of fun in a light way; not
  truly rude or unkind, and not food covered in sauce.'
examples:
- She gave a saucy grin and danced across the room.
- His saucy reply made everyone laugh, not feel hurt.
