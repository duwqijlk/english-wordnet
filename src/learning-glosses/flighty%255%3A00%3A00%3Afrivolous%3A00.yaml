simpleMeaning: acting on sudden wishes and ideas, not on careful thought or a steady plan
scope: 'Also called flyaway and scatterbrained: this means acting on sudden wishes, not being easily excited
  with no warning, as a horse can be.'
examples:
- The flighty young woman changed her plans three times in one day.
- He was too flighty to keep the same job for long.
