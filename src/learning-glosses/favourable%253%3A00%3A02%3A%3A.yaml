simpleMeaning: giving hope or support, showing that you think something is good, or making people pleased
scope: Showing support or praise or making people pleased, also called favorable. It is not about wind
  or weather that helps something happen.
examples:
- The teacher gave a favourable report about his work.
- People made favourable comments after seeing the new plan.
