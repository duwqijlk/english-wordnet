simpleMeaning: the money a business has left from its sales after all its costs for a set period are paid,
  including costs that are not paid in cash, such as the falling value of equipment.
scope: This is the sum of money left over, not the act of earning it and not the total money taken in.
examples:
- The company made a profit of two million dollars last year.
- After paying for materials and wages, the shop still showed a small profit.
