simpleMeaning: changing quickly and without warning in what a person feels or likes
scope: Changing quickly in feelings or likes; fickle is another name for this sense, not a substance that
  turns into gas and not a liquid that dries up fast.
examples:
- Her volatile affections changed from day to day.
- He is a volatile friend, warm one day and cold the next.
