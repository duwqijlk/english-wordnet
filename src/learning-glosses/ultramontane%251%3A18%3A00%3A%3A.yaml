simpleMeaning: A Roman Catholic who backs the teaching that the pope holds the highest power in matters
  of faith and church order.
scope: This is a Roman Catholic who backs the pope's highest power in matters of faith, not a person from
  beyond the Alps and not a priest of any other church.
examples:
- The ultramontane defended the pope's power.
- Ultramontanes backed Rome in the dispute.
