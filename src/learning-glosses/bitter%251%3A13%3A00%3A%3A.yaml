simpleMeaning: the English name for a dry ale (a kind of beer) with a sharp, strong taste of hops (flowers
  used in beer), usually poured from a large container
scope: This is a noun for a kind of beer, not the adjective for a sharp taste, not cold that hurts, and
  not a person full of anger about unfair treatment.
examples:
- He ordered a pint of bitter at the pub.
- She drank a glass of bitter with her meal.
