simpleMeaning: A flat piece put over a hole or box to shut it in
scope: This is a flat piece put over a hole or box to shut it in; not a lid that lifts off a pot, and
  not a door that swings open.
examples:
- He screwed the cover plate back over the hole in the wall.
- The cover plate hid the wires inside the box.
