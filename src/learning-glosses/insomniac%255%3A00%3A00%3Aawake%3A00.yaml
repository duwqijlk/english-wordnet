simpleMeaning: Of a person who cannot sleep, or of nights spent lying awake.
scope: Of a person who cannot sleep, or of nights spent lying awake, also called sleepless and watchful;
  not merely a person who stays up late by choice.
examples:
- The insomniac old man walked the halls till dawn.
- She spent another insomniac night staring at the ceiling.
