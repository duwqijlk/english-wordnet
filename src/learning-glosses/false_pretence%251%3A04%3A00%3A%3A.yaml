simpleMeaning: A person who tells someone something untrue, meaning to cheat them, and gets their goods
  by that untrue tale commits a crime in law.
scope: Also called false pretense, this is a crime of cheating by an untrue tale, not a plain lie told
  without getting anything.
examples:
- He was charged with false pretence after getting the goods by an untrue tale.
- She used false pretence to get the goods from him.
