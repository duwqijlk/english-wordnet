simpleMeaning: a curved mirror that brings the sun's rays together to one point, and can make things very
  hot
scope: Also called solar dish and solar furnace; a curved mirror that brings the sun's rays together to
  make heat, not a flat mirror and not a panel that makes power from light.
examples:
- The solar collector focused the sun's rays on the metal plate.
- The solar collector made the metal plate too hot to touch.
