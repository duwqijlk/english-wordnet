simpleMeaning: a soft-stemmed plant from tropical America that lies flat or climbs and lives for years,
  with a huge starchy root; some say the sweet potato came from it
scope: 'Also called manroot, scammonyroot, wild potato vine, and wild sweet potato vine: a low plant with
  a huge starchy root, not the sweet potato itself.'
examples:
- The man-of-the-earth in the garden climbs over the fence.
- Farmers dig up the man-of-the-earth for its huge starchy root.
