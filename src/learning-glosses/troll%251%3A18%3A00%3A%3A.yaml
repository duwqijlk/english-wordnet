simpleMeaning: In Scandinavian folklore, a being that is not real, either very small or very large, and
  said to live in caves or in the mountains
scope: A story being from Scandinavia, not fishing with a line drawn through water and not a song in which
  voices join one after another.
examples:
- In the old story, a troll lived in a cave under the mountain.
- The children heard tales of a huge troll who slept in the mountains.
