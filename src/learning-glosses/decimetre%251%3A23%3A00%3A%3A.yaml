simpleMeaning: One tenth of a meter, as one metric unit of length
scope: This is a metric unit of length, also called a decimeter and dm; not a centimetre, which is one
  hundredth of a meter, and not a meter itself.
examples:
- The ribbon was three decimetres long.
- One decimetre is a tenth of a meter.
