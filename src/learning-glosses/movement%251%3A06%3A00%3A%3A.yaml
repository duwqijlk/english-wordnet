simpleMeaning: The parts inside a machine that power it and control how it works, such as in a watch or
  clock.
scope: This is the set of working parts inside a machine, not a change of position that stays in one place
  (movement%1:04:00::), not a trip from one place to another (movement%1:04:04::), not a natural event
  in which something shifts position (movement%1:11:00::), not an organized group with shared beliefs
  (movement%1:14:00::), not a self-contained section of a symphony or sonata (movement%1:10:00::, the
  musical sense in this lane), not a campaign of actions for a cause (movement%1:04:03::), not the illusion
  of motion made by rapid still pictures (movement%1:19:00::), not a polite word for defecation (movement%1:22:00::),
  not a trend in opinion (movement%1:09:00::), and not the act of shifting something (movement%1:04:02::).
examples:
- The watchmaker cleaned and oiled the movement before putting the case back on.
- A cheap quartz movement keeps this kitchen clock accurate.
