simpleMeaning: a group in the United States that backs old ways in home life and in rule, prayer in schools,
  and money from the government for faith groups and schools
scope: A group in the United States that backs old ways and prayer in schools, not a church and not a
  group that backs new ways in home life.
examples:
- The religious right pressed for prayer in schools.
- Members of the religious right backed the plan to give money to faith schools.
