simpleMeaning: All over the south and east of the United States grows a rough weed with sharp points,
  pale yellow flowers, and yellow fruit like small berries.
scope: Also called a ball nettle, a ball nightshade, and a bull nettle, this rough weed of the south and
  east of the United States has sharp points, pale yellow flowers, and yellow fruit like small berries.
examples:
- The horse nettle caught at my sleeve with its sharp points.
- Horse nettle grew in the south of the United States, its yellow fruit like small berries.
