simpleMeaning: to fit well together or be alike, so that the parts of two things match in their main features
scope: 'Also called agree, match, check, fit, and tally: to fit well together or be alike in main features;
  not to write letters and not to be equal in size.'
examples:
- The two stories don't correspond in many details.
- The suspect's fingerprints don't correspond with those on the gun.
