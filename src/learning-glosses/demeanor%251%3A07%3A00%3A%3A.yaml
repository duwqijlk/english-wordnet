simpleMeaning: the way a person acts when they are with other people
scope: 'Also called behavior, conduct, and behaviour: the way a person acts toward other people, not their
  looks and not how they feel inside.'
examples:
- His calm demeanor put the guests at ease.
- Her demeanor toward strangers was always polite and warm.
