simpleMeaning: A Christian takes up church office with open palms laid on the head, to ask for a holy
  blessing.
scope: This rite of Christian ordination lays open palms on the head to ask for a holy blessing.
examples:
- The laying on of hands was part of the ordination service.
- The laying on of hands asked God's blessing on the person taking office.
