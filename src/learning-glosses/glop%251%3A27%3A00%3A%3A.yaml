simpleMeaning: any soft, sticky stuff with no clear shape, usually not pleasant
scope: This sense is soft, sticky stuff with no clear shape. It is not a hard solid thing and not a thin
  liquid that pours easily.
examples:
- A grey glop covered the bottom of the pan.
- He wiped the sticky glop off his shoes.
