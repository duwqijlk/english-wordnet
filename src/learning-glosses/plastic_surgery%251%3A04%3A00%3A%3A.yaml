simpleMeaning: Work by a doctor that heals flesh or reshapes it to make it look better.
scope: Work by a doctor that heals flesh or reshapes it to make it look better; anaplasty is another name
  for this sense, not general surgery and not dentistry.
examples:
- She had plastic surgery on her nose after the accident.
- Plastic surgery rebuilt the skin on his hand.
