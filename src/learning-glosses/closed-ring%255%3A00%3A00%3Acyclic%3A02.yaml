simpleMeaning: In chemistry, having its smallest parts joined by links shown as a circle or a triangle
scope: In chemistry, a shape of joined parts drawn as a circle or a triangle, also called closed-chain;
  not a straight chain of parts and not a single unjoined part.
examples:
- The closed-ring shape shows the atoms joined in a circle.
- Chemists draw the closed-ring form as a triangle.
