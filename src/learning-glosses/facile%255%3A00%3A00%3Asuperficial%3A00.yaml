simpleMeaning: Striking at first sight, but thin and careless about how hard the subject really is.
scope: Also called neat or slick; striking at first sight but thin and careless about the hard parts,
  not the use that calls a speaker facile when they speak easily and well.
examples:
- Her facile answer sounded clever but missed the hard parts of the question.
- The plan was facile, neat on the surface and thin underneath.
