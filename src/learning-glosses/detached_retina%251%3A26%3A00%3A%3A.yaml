simpleMeaning: A beam of light seals back the light-sensing layer at the back of the eye when it has come
  away from the dark layer behind, and sight grows poor
scope: Detachment of the retina and retinal detachment are other names for it.
examples:
- The detached retina left him with a dark patch across his sight.
- After the fall, doctors found a detached retina and sealed it with light.
