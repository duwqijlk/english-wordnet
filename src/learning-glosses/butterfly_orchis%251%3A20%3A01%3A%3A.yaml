simpleMeaning: Each flower has a fan-shaped lip of deep pink, marked with spots or stripes, on a plant
  of the Mediterranean whose flowers are usually purple
scope: This plant of the Mediterranean has flowers that are usually purple, each with a fan-shaped lip
  of deep pink, marked with spots or stripes; it is also called butterfly orchid, not the Mexican kind
  that grows on other plants.
examples:
- The butterfly orchis grew in the Mediterranean.
- Purple butterfly orchis bloomed.
