synsetId: 11492228-n
simpleMeaning: As a liquid turns solid and freezes, a fixed weight of it gives off this much warmth
scope: The warmth a fixed weight of liquid gives off as it turns solid, not the warmth taken in when a
  liquid splits apart and not the warmth taken in when a liquid turns to gas.
examples:
- The heat of solidification of water is given off as ice forms.
- Scientists use the heat of solidification to work out how much warmth freezing gives off.
