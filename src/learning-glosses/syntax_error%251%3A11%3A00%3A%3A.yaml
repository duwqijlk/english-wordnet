simpleMeaning: a mistake in a computer program where the written code breaks the rules of the language
  it is written in
scope: This is a mistake in the written code of a program, not a mistake in what the program is meant
  to do and not a fault in the machine.
examples:
- A missing bracket caused a syntax error in her program.
- The compiler found a syntax error on the first line.
