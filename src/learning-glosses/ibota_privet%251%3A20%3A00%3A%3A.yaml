simpleMeaning: This shrub is a cross of two kinds of one shrub group, and its branches crowd close together
  while it grows fast.
scope: Also called ibolium privet, it is a shrub made by crossing two kinds of one shrub group, with branches
  that crowd close together.
examples:
- The ibota privet by the gate grew fast.
- We cut back the ibota privet when it grew too tall.
