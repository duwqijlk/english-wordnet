senseId: 'vena_hepatica%1:08:00::'
synsetId: 05376597-n
simpleMeaning: A blood tube that drains the liver and empties into the great blood tube that leads to
  the heart.
scope: A blood tube that drains the liver; hepatic vein is another name for this sense; not a blood tube
  of the kidney and not one of the lungs.
examples:
- The vena hepatica drains blood from the liver.
- Blood leaves the liver through the vena hepatica.
