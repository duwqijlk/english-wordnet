simpleMeaning: A painful swelling of the big toe and foot, caused by faulty uric acid processing that
  leaves deposits of the acid and its salts in the blood and joints.
scope: Another name for gout, the metabolic joint disease; not arthritis from other causes or a plain
  toe injury.
examples:
- The doctor said the pain in his foot was gouty arthritis.
- Gouty arthritis can make the big toe and foot painful and swollen.
