senseId: 'idiot_savant%1:18:00::'
synsetId: 10217399-n
simpleMeaning: a person who has trouble with most kinds of thinking yet shows a striking gift in one narrow
  area, often in memory
scope: A person weak in most thinking but gifted in one narrow area, often memory, not a person gifted
  in everything and not a person with no gift at all.
examples:
- The idiot savant could work out the day of the week for any date in history.
- Though he struggled with most schoolwork, the idiot savant remembered whole books word for word.
