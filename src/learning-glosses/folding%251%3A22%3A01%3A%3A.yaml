simpleMeaning: In geology, a process inside the earth that makes a layer of rock bend
scope: 'Also called fold: in geology, a process inside the earth that bends a layer of rock; not the act
  of bending paper or cloth, and not the way a protein takes its shape.'
examples:
- Folding of the rock layers made the high hills in this area.
- Geologists study the folding that bent these layers of rock long ago.
