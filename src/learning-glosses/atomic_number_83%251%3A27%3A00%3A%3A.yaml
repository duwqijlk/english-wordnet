simpleMeaning: A heavy brittle metal joining three other atoms, pushed away by a magnet, chemically like
  arsenic and antimony; usually got as a by-product from the ores of other metals.
scope: 'Also called Bi and bismuth: a heavy brittle metal that joins with three other atoms, not arsenic
  itself and not a soft metal.'
examples:
- Atomic number 83 is usually got from the ores of other metals.
- Bismuth, atomic number 83, is heavy and brittle.
