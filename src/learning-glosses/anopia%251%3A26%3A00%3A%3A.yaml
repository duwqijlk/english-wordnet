senseId: 'anopia%1:26:00::'
synsetId: 14577465-n
simpleMeaning: not being able to see, most often because of a fault in the shape of an eye or because
  there is no eye
scope: Not being able to see at all, most often because of a fault in the shape of an eye or because there
  is no eye; not a short sight problem and not seeing badly in dim light.
examples:
- The doctor told her the anopia in her left eye would not get better.
- He was born with anopia after one eye failed to grow.
