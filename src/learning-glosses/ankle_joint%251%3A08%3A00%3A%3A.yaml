simpleMeaning: 'This sliding place joins the lower leg to the foot: the two leg bones end here, on the
  top bone of the foot, and the foot moves on it.'
scope: Also called the ankle, articulatio talocruralis, and mortise joint, this joint lies between the
  lower ends of the leg bones and the top bone of the foot.
examples:
- The ankle joint lets the foot slide and turn as we walk.
- A sprain of the ankle joint can stop the foot from moving freely.
