simpleMeaning: a straight-up pole or thick bar, especially one that holds something up
scope: This is not a rule or level used for judging, but a physical post that holds something up.
examples:
- The lamp standard on the corner was damaged by the lorry.
- The awning was supported by a wooden standard on each side.
