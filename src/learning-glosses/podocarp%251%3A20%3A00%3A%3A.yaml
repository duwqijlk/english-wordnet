simpleMeaning: A soft fruit with one hard seed is borne by this tree of the southern half of the world,
  which keeps its leaves all year.
scope: This tree of the southern half of the world keeps its leaves all year and bears a soft fruit with
  one hard seed, and it is not a tree that loses its leaves in winter.
examples:
- The podocarp keeps its leaves all year.
- The podocarp bears a soft fruit with one hard seed.
