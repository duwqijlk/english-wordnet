simpleMeaning: Violet-blue blooms hang down in bunches along a stem from a thick, bushy plant in Europe
  that comes back year after year.
scope: Spring vetchling is another name for this thick, bushy plant from Europe, whose violet-blue blooms
  hang down in bunches along a stem and which comes back year after year.
examples:
- The spring vetch has violet-blue blooms hanging down in bunches.
- This spring vetch comes back year after year.
