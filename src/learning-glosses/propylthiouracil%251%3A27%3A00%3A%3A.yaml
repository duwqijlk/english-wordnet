senseId: 'propylthiouracil%1:27:00::'
synsetId: 14716363-n
simpleMeaning: A drug made of small hard bits that slows down the thyroid, a small gland in the neck,
  to treat a swelling in the neck
scope: A drug that slows down the small gland in the neck to treat a swelling there; not a drug that speeds
  the gland up, and not an operation on the neck.
examples:
- The doctor gave him propylthiouracil for his overactive thyroid.
- Propylthiouracil helped shrink the swelling in her neck.
