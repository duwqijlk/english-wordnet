simpleMeaning: the group of people in a country who hold titles passed down in families and have special
  rights
scope: The class of people holding titles passed down in families; not high character or fine ideals,
  which is another sense of the word.
examples:
- The nobility owned much of the land in those days.
- Only the nobility could sit in that part of the hall.
