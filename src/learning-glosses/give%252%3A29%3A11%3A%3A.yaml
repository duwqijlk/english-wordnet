simpleMeaning: to agree to have sex with a man.
scope: 'This is a dated, blunt use: it describes a woman agreeing to sex with a man, and it survives mainly
  in older fiction in the reflexive phrase ''give herself to''. It is not the neutral sense of handing
  something to someone, and not the sense of devoting yourself to a cause or activity. Use it only in
  reading old texts; it is not current polite English.'
examples:
- She would not give herself to any man she did not love.
- He asked her to give herself to him, and she refused.
