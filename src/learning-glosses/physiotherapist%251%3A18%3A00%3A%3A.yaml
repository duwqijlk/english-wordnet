simpleMeaning: a healer who treats hurt or poor working of the body with exercises and other bodily care
scope: A healer who treats hurt or poor working of the body with exercises and other bodily care; physical
  therapist is another name for this sense, not a doctor who gives drugs and not a healer who works with
  the mind.
examples:
- The physiotherapist treated his hurt back with exercises.
- A physiotherapist works with exercises and other bodily treatments.
