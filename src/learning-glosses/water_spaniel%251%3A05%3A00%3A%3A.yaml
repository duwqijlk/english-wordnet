simpleMeaning: a dog of either of two big kinds with thick curly hair, used to hunt ducks and other birds
  that swim
scope: A hunting dog with curly hair, not a small pet dog and not a dog that hunts on dry land.
examples:
- The water spaniel plunged into the lake after the fallen duck.
- Her water spaniel has thick curly hair that keeps it warm in cold ponds.
