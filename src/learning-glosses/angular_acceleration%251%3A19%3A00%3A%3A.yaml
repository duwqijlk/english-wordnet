simpleMeaning: In physics, how fast the spin of a turning thing speeds up or slows down
scope: In physics, the rate at which a turning thing's spin changes, not the spin itself and not the speed
  of a thing moving in a straight line.
examples:
- The angular acceleration of the wheel rose as the motor gained power.
- Engineers measured the angular acceleration of the spinning disc.
