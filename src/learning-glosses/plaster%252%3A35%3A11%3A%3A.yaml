simpleMeaning: to cover a surface thickly or in a way that is easy to see, as by sticking something all
  over it
scope: This means covering a surface thickly so people notice it, as with posters; it is not coating a
  wall with a building mix and not treating a hurt part of the body.
examples:
- They plastered the walls with posters.
- He plastered the notice board with photos.
