simpleMeaning: A wire path made of two matching lines of parts in a row, with a cross link between them.
scope: This is one fixed shape of wire path, built from two matching lines joined by a cross link, and
  the shape is what sets it apart from other wire paths.
examples:
- The T-network joins the two lines of parts.
- A T-network has a cross link in the middle.
