simpleMeaning: The middle hollow in the deep part of the brain and the hollow at the side of the brain
  are joined by this small hole, one on each side
scope: This small hole, one on each side, links the middle hollow deep in the brain with the hollow at
  its side.
examples:
- In the brain, the interventricular foramen joins the middle hollow to the hollow at the side.
- The interventricular foramen on the left side joins the same two hollows as the one on the right.
