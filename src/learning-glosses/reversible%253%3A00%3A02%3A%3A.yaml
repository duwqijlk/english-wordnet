senseId: 'reversible%3:00:02::'
synsetId: 01764188-a
simpleMeaning: Able to be turned back, or used with either side showing.
scope: Able to be turned back, or to be used with either side out; close in sense to a thing that can
  turn back or be turned back, not a coat that can be worn inside out, not a thing that can take either
  of two states, and not a decision or order that can be taken back.
examples:
- The coat was reversible, so she wore it with the blue side out.
- This reversible lining lets the bag show either face.
