simpleMeaning: This fairly large butterfly lives across the globe and is usually recognized by broad bright
  wings and shrunken front legs that do nothing, folded on the breast.
scope: Another name for the same medium-to-large butterfly group also called nymphalid, nymphalid butterfly
  or brush-footed butterfly, not a moth or a skipper.
examples:
- The four-footed butterfly grips a leaf with its working legs while the front pair stays folded.
- Gulf fritillaries are four-footed butterflies with bright orange wings.
