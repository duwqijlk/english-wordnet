simpleMeaning: A plant that gets water and food from the air and rain and most often grows on another
  plant without feeding on it.
scope: 'Also called an aerophyte, an air plant and an epiphytic plant: a plant that gets water and food
  from the air and rain and most often grows on another plant without feeding on it, not a plant that
  feeds on its host and not a plant that grows in soil.'
examples:
- The epiphyte grows on a tree but does not feed on it.
- An epiphyte gets its water from the air and rain.
