simpleMeaning: A long chain of nucleotides in the nucleus, mostly in the cytoplasm, with microsomes, carrying
  genetic instructions from DNA to the cytoplasm and directing certain chemical steps in the cell.
scope: This is a chain of nucleotides that carries genetic instructions, also called ribonucleic acid,
  not DNA itself nor a protein.
examples:
- RNA carries the instructions for making proteins.
- Some viruses use RNA as their genetic material.
