simpleMeaning: a person who takes someone away by force and against the law and holds them, usually to
  get money for letting them go
scope: 'Also called kidnapper, abductor and kidnaper: this is a person who holds someone by force, usually
  for money, not a thief who takes things and runs away.'
examples:
- The snatcher held the child for three days and asked the family for money.
- Police caught the snatcher before he could take the boy out of the city.
