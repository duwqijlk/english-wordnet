simpleMeaning: a pretty cover for a bed, usually quilted (sewn in lines through layers to hold soft filling
  in place)
scope: This is a pretty top cover for a bed, usually sewn in lines through layers; it is not a thick blanket
  used only for warmth and not a sheet you sleep under.
examples:
- She spread a white coverlet over the bed.
- The coverlet on the bed had pretty flowers sewn into it.
