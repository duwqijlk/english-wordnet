simpleMeaning: A spinning wheel lets this tool show the pilot a line where sky meets land, though the
  line is only made up
scope: This tool is also called a flight indicator and gyro horizon, and it shows a made-up line, not
  the real line outside.
examples:
- The artificial horizon gave the pilot a line to follow.
- The pilot looked at the artificial horizon for the line where sky meets land.
