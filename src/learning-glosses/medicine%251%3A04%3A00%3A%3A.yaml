simpleMeaning: a scholarly profession that requires graduate training at a school for doctors and is devoted
  to preventing, easing or curing illness and injury
scope: This is the profession devoted to preventing and curing illness, not a drug that treats symptoms,
  not the branches of medical science that use nonsurgical methods, not punishment for one's actions,
  and not the verb meaning to treat someone with medicine.
examples:
- She went into medicine after volunteering at a hospital.
- He has practiced medicine in this town for thirty years.
