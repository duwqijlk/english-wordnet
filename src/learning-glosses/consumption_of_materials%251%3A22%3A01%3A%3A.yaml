simpleMeaning: the amount of main stuff, helper stuff, power and wear on tools and machines used for each
  thing made, counted in set amounts
scope: 'Material intensity is another name for this sense: the amount of stuff, power and wear on tools
  and machines used for each thing made, not the total used by a whole factory and not money spent.'
examples:
- The factory cut its consumption of materials by reusing scrap metal.
- To work out the consumption of materials, they count how much steel goes into each car.
