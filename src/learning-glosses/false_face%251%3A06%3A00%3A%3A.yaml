simpleMeaning: At a party where people hide who they are, this mask is part of what they wear to dress
  up
scope: A mask worn with a dress-up outfit at a party, not a face painted for the stage and not a mask
  worn for work.
examples:
- She put on a false face before the masquerade ball.
- His false face hid him so well that no one knew him at the party.
