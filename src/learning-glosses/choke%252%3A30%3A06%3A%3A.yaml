simpleMeaning: to stop someone or something from growing, or from making new things or new ideas
scope: This is stopping a person or thing from growing or making new things, not being stopped yourself
  and not stopping someone from breathing.
examples:
- Strict rules choked the young artists and stopped them making new work.
- Too much control choked the small shops and left them no room to grow.
