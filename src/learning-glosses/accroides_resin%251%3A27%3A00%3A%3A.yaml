simpleMeaning: What melts in alcohol and goes into varnish and paper is a sticky stuff from trees of Australia.
scope: Also called acaroid resin, accaroid resin, accroides, accroides gum, and gum accroides, this is
  a sticky stuff from trees of Australia that melts in alcohol and goes into varnish and paper.
examples:
- The paper maker used accroides resin in the mix.
- In the factory, accroides resin melted in alcohol.
