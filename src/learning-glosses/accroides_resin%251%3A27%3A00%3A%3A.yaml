simpleMeaning: A sticky resin from Australian trees that melts in alcohol and is used in varnishes and
  in making paper
scope: Also called acaroid resin, accaroid resin, accroides, accroides gum, and gum accroides, this is
  a sticky resin from Australian trees that melts in alcohol and is used in varnishes and in paper-making.
examples:
- The paper maker used accroides resin in the mix.
- In the factory, accroides resin melted in alcohol.
