simpleMeaning: the thin middle part of a shoe, joining the heel to the wide front part under the foot
scope: The thin middle part of a shoe, also called a waist; not the lower leg of a horse, and not the
  cut of meat from the upper leg.
examples:
- The shank of the shoe gave way under his weight.
- A broken shank made the shoe bend in the middle.
