simpleMeaning: a dark tube-shaped food made with the red liquid from a pig and other things
scope: Also called black pudding or blood pudding, this is a dark food made with pig's blood, not a plain
  meat sausage and not a sweet pudding.
examples:
- They fried slices of blood sausage for breakfast.
- The blood sausage on the plate was dark and made with pig's blood.
