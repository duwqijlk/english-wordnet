senseId: 'eurasiatic%3:01:00::'
synsetId: 03035646-a
simpleMeaning: Things that come from Asia and Europe, or that have to do with those two lands, are what
  this word is about.
scope: Another name for this sense is Eurasian; it is about things of Europe and Asia, not a person of
  mixed European and Asian descent.
examples:
- The Eurasiatic trade routes linked Asia with Europe.
- They studied the Eurasiatic cultures of the region.
