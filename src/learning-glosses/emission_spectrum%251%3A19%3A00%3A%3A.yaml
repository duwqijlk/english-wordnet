simpleMeaning: The range of waves of energy given off by a thing that shines by itself.
scope: The range of waves given off by a self-shining thing, not the waves it takes in and not its colour.
examples:
- The emission spectrum of the star showed lines of hydrogen.
- Each hot gas has its own emission spectrum.
