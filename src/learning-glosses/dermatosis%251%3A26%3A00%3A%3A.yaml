simpleMeaning: A skin problem with sore spots or raised marks on the skin, usually with no redness, heat
  or swelling
scope: This is a skin problem with sore spots or raised marks, usually with no redness, heat or swelling,
  not a skin problem with redness, heat or swelling and not a single cut.
examples:
- The doctor said the dermatosis on his arm would clear with time.
- Her dermatosis left raised marks on her skin.
