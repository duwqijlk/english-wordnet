simpleMeaning: any thing that can be touched and that people get to meet their needs and wants
scope: This is a thing that can be touched and that people get to meet a need or want; physical goods
  is another name for this sense. Not a thing that cannot be touched, such as a service.
examples:
- A table is a tangible good you can touch and carry home.
- Tangible goods are easier to return than things you cannot touch.
