simpleMeaning: qualities passed down in a family that you share with your blood relations
scope: This is qualities passed down in a family and shared with your blood relations; not the family
  tree itself and not the tie between a child and its parents.
examples:
- His lineage gave him his mother's dark eyes.
- She was proud of her lineage and of the gifts it had passed down.
