simpleMeaning: loose clothes worn for sleeping or resting, usually used in the plural, with a top like
  a jacket and trousers
scope: These clothes are also called pajama, pyjama and pj's; this sense is clothes for sleeping, not
  clothes worn in the day.
examples:
- The children put on their jammies before going to bed.
- He wore his jammies while resting on the sofa all morning.
