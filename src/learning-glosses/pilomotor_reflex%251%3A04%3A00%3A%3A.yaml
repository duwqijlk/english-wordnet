senseId: 'pilomotor_reflex%1:04:00::'
synsetId: 00868284-n
simpleMeaning: Cold, strong feelings, or something that bothers the skin make the hairs of the skin stand
  up on their own
scope: Also called goosebump, gooseflesh, goose pimple, goose skin, or horripilation, this is the hairs
  of the skin standing up on their own, not a shiver and not a rash.
examples:
- The cold wind gave him a pilomotor reflex, and the hairs on his arms stood up.
- A pilomotor reflex made the hairs on her neck stand up when she felt afraid.
