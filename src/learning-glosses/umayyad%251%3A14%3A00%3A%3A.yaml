simpleMeaning: The first line of Arab caliphs, rulers of the early Muslim state, whose capital was Damascus.
scope: The first Arab ruling line, also called Omayyad and Ommiad; not later ruling lines and not a single
  ruler.
examples:
- The Umayyad dynasty began in the seventh century.
- Damascus was the Umayyad capital.
