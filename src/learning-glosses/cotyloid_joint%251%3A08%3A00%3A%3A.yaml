simpleMeaning: Two bones meet here and turn freely, the ball on the end of one sitting in a round hollow
  in the other
scope: Also called ball-and-socket joint, articulatio spheroidea, enarthrodial joint, enarthrosis and
  spheroid joint, this is a place where two bones meet and turn freely, not a stiff joint that cannot
  move.
examples:
- The cotyloid joint in his shoulder let his arm swing in all directions.
- The cotyloid joint in her hip moved freely as she walked.
