simpleMeaning: In Jean Piaget's ideas, the way a person changes the pictures in their mind so they fit
  new facts about the world
scope: In Piaget's ideas, changing the pictures in your mind to fit new facts; not the eye changing its
  focus and not a place to stay.
examples:
- The child showed accommodation when she changed her idea of what a dog was after seeing a new kind.
- Accommodation helps us learn when new facts do not match our old pictures of the world.
