simpleMeaning: This device uses a rough stuff and a turning wheel to make the outsides of many things
  smooth and shiny
scope: A device that uses a rough stuff and a turning wheel to make the outsides of many things smooth
  and shiny, not a hand tool for rubbing and not a machine that cuts or shapes things.
examples:
- The polishing machine made the marble shine.
- She switched on the polishing machine and got to work.
