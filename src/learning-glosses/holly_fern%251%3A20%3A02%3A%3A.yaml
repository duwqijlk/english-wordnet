simpleMeaning: With shiny fronds like the spiky leaves of a well-known evergreen, this Old World fern
  of warm lands is at times put in the group Polystichum.
scope: It is one warm-land fern, not any of the many ferns of the group Polystichum.
examples:
- We saw a holly fern with shiny fronds.
- She planted a holly fern.
