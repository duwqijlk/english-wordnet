simpleMeaning: a cloth that Muslim and Hindu women wear over the head, also as a veil and shawl
scope: A cloth that Muslim and Hindu women wear over the head, also as a veil and shawl; chador, chadar
  and chuddar are other names for this sense, not a hat and not a dress.
examples:
- She wrapped a chaddar around her head.
- A chaddar can be worn as a veil or a shawl.
