simpleMeaning: To feed the legs and feet, this blood tube goes on from the one in the thigh and splits
scope: 'Also called arteria poplitea: the blood tube that goes on from the one in the thigh and splits
  to feed the legs and feet, not the blood tube in the thigh itself and not the one that feeds the arms.'
examples:
- The popliteal artery supplies blood to the lower leg.
- A block in the popliteal artery can cause pain in the leg.
