simpleMeaning: To pull out hairs that are not wanted, a warm sticky mix is spread on the skin; as it cools
  it is torn off with the hairs in it
scope: It pulls off hairs that are not wanted and is spread on the skin while warm.
examples:
- She spread the epilating wax on her skin and waited for it to cool.
- He pulled the epilating wax away once it had cooled.
