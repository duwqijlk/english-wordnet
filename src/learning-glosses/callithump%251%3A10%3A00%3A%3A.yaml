simpleMeaning: The banging of pans and kettles makes a false song to mock a new husband and wife.
scope: Also called belling, callathump, charivari, chivaree, and shivaree, this is the loud false song
  banged out for a newly married couple, not a song played in earnest.
examples:
- Someone started a callithump for the newly married couple with pans and kettles.
- The newly married couple heard the callithump and its banging pans and kettles.
