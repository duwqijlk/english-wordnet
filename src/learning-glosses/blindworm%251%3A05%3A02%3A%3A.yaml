simpleMeaning: Any of the small, slim, limbless, burrowing, worm-like amphibians of the order Gymnophiona,
  living in damp soil in hot lands.
scope: This sense is also called caecilian, for worm-like amphibians of the order Gymnophiona, unlike
  the sense for a small burrowing legless European lizard with tiny eyes, popularly believed to be blind.
examples:
- Blindworms live in damp soil.
- The blindworm burrows in damp soil.
