simpleMeaning: A small unit of money in Russia; one hundred of them make one ruble
scope: Also called a kopek and a copeck, it is a small unit of money in Russia, worth one hundredth of
  a ruble, not the ruble itself and not a coin of another country.
examples:
- One hundred kopecks make one ruble.
- The kopeck is a small unit of Russian money.
