senseId: 'semiconductor_unit%1:06:00::'
synsetId: 04178892-n
simpleMeaning: an item that carries electric current and is made from a substance that partly carries
  it
scope: It is an item that lets current pass through a substance that passes it only in part; semiconductor
  and semiconductor device are other names for this sense, not a wire and not a part made of plain metal.
examples:
- A semiconductor unit controls the flow of current in the radio.
- The semiconductor unit failed and the set went dead.
