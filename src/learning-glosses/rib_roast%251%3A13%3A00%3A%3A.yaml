simpleMeaning: a cut of meat, from a cow or a deer, that holds more than one bone from the chest with
  the meat along the outside of the bones
scope: Not a single bone with meat, and not a cut from the leg; also called standing rib roast.
examples:
- We cooked a rib roast for Sunday lunch.
- The butcher cut a rib roast from the side of beef.
