senseId: 'apyretic_tetanus%1:26:00::'
synsetId: 14333931-n
simpleMeaning: A nerve disorder with muscle twitching and cramping that may become seizures; it comes
  with low calcium, too little vitamin D, or an imbalance in the body's acid level.
scope: One of several names for this calcium-linked nerve disorder, not the infectious disease tetanus
  that causes lockjaw.
examples:
- The doctor suspected apyretic tetanus when the patient's muscles began twitching.
- Blood tests confirmed that his apyretic tetanus was caused by low calcium.
