simpleMeaning: A company buys back its own shares; they are given out but not held, carry no vote, and
  pay no money, and it may cancel them or sell them again.
scope: Also called treasury shares and treasury stock, these are shares a company has bought back, given
  out but not held, carrying no vote and paying no money.
examples:
- The company bought back the reacquired stock.
- The reacquired stock was kept back for resale.
