simpleMeaning: A tree of Australia with feather-like leaves and orange-yellow flowers, then large woody
  pods with 3 or 4 seeds that look like large brown nuts; it gives dark strong wood.
scope: Also called Moreton Bay chestnut; a tree of Australia with feather-like leaves and large woody
  pods, distinct from other Australian trees with small pods or soft wood.
examples:
- The Australian chestnut in the park has large woody pods.
- Australian chestnut wood is dark and strong.
