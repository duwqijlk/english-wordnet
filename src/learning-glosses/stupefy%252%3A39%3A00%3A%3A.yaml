senseId: 'stupefy%2:39:00::'
synsetId: 02120101-v
simpleMeaning: to make a person not able to think well and confused, by being drunk or by very strong
  love for someone
scope: This sense is about drink or very strong love making a person's mind slow and confused. It is not
  the sense where a blow makes a person unable to feel or think.
examples:
- He drank so much wine that it stupefied him and he could not think clearly.
- She was stupefied by her very strong love for him and could not think well.
