senseId: 'infection%1:07:01::'
synsetId: 04818548-n
simpleMeaning: In international law, an act against the law that spoils a ship or its goods, so the ship
  or goods can be taken away
scope: In law between countries, this is about a ship or its goods spoiled by breaking the law; not an
  illness in the body and not bad morals.
examples:
- Because of the infection, officers at the port took the ship and its goods.
- The court said the infection of the goods meant they could be taken away.
