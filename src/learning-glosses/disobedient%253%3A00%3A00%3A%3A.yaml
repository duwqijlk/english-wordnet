simpleMeaning: not doing what you are told to do by a person in power
scope: Not doing what a person in power tells you to do. It is not turning against a leader or cause,
  and not just being rude.
examples:
- The disobedient children would not go to bed when told.
- A disobedient soldier refused the order to leave his post.
