schema: oewn-learning-gloss-v2
senseId: 'countdown%1:04:00::'
synsetId: 00654761-n
simpleMeaning: saying or showing numbers in falling order from a chosen number, to show how much time
  is left before something happens, such as sending a space ship up
scope: This is the backward count before an event, not the event itself and not counting up to reach a
  total.
examples:
- The countdown to the rocket launch began at ten.
- We watched the final countdown on the screen before the new year began.
