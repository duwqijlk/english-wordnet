simpleMeaning: With a disposition as sweet as an angel's or a cherub's.
scope: Also called sweet, and also called angelic, angelical, or seraphic, this is said of a person with
  a sweet nature like an angel's.
examples:
- Her smile was cherubic, warm and kind.
- The baby looked cherubic as he slept.
