simpleMeaning: From the southwest of the United States to Brazil, one of a group of plants with deep ribs
  and many sharp spines.
scope: Also called echinocactus, this is a plant with deep ribs and many sharp spines, not a smooth plant
  without spines.
examples:
- The barrel cactus had deep ribs and many sharp spines.
- A barrel cactus can be found from the southwest of the United States to Brazil.
