simpleMeaning: In Christianity, the members of a church group who do not carry out the holy duties of
  ordained priests.
scope: In Christianity, the members of a church group who do not carry out the holy duties of ordained
  priests, not the priests themselves and not monks living apart from the world.
examples:
- The laity sang the hymns while the priest led the service.
- Members of the laity help with the running of the church.
