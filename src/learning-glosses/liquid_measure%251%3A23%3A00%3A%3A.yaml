simpleMeaning: A unit of size for fluids, for working out the volume of fluids or of the holders they
  go in
scope: Liquid unit is another name for this unit of size for fluids; it is not a unit of weight and not
  a unit of length.
examples:
- A liquid measure tells you how much the jug holds.
- Pints and litres are liquid measures.
