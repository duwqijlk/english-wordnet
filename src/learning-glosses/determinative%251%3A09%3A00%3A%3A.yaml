simpleMeaning: A thing that fixes or brings about an outcome.
scope: This sense is also called a determinant, for a thing that fixes or brings about an outcome, unlike
  the sense for one of a small class of noun modifiers that fix what noun phrases point to.
examples:
- The determinative fixed the outcome.
- Determinatives bring about outcomes.
