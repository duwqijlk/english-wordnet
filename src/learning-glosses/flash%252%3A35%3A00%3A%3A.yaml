simpleMeaning: to fit a thin metal sheet over something to keep it safe
scope: To protect a surface with thin metal sheeting, not to give out a burst of light and not to appear
  briefly.
examples:
- They flashed the roof with thin copper to keep it dry.
- The builder flashed the chimney before fitting the tiles.
