simpleMeaning: This tool reads the rays that put an electric charge on atoms and shows how much of them
  is in a place
scope: A tool that shows how much radiation is in a place, also called an ionization chamber; not a tool
  that makes rays and not a tool that counts whole atoms.
examples:
- The ionization tube gave a high reading near the source.
- A new ionization tube was put in the lab to check the air.
