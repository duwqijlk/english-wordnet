simpleMeaning: 'A maple from eastern and central parts of North America: hard close-grained furniture
  wood, three- to five-lobed leaves, many subspecies, and sap that yields most maple syrup and sugar.'
scope: Another name for sugar maple, the maple whose sap is the main source of maple syrup and sugar;
  other maples, such as red maple, are not the main syrup source.
examples:
- The rock maple by the barn turns red in early autumn.
- Furniture makers value rock maple for its hard, close-grained wood.
