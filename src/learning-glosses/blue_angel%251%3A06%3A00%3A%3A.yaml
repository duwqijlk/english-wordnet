simpleMeaning: People take this salt form of amobarbital, a drug of the barbiturate group, to calm down
  and fall asleep.
scope: Also called blue, amobarbital sodium, or blue devil, this is the salt form of amobarbital, a drug
  of the barbiturate group that calms people and brings on sleep.
examples:
- One blue angel was enough to bring on sleep.
- They took a blue angel to calm down and fall asleep.
