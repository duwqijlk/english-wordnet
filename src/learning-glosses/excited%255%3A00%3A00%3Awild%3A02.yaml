simpleMeaning: filled with wild, unrestrained feeling that cannot be controlled.
scope: This is not the milder sense of being worked up by feeling, and not anger or mental illness; it
  means frantic and unable to restrain the feeling.
examples:
- The children were wildly excited at the sight of the fireworks.
- The excited crowd pushed forward against the gates.
