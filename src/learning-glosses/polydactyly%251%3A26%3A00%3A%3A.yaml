simpleMeaning: A fault from birth in which there are more fingers or toes than usual
scope: 'Also called hyperdactyly: a fault from birth that gives more fingers or toes than usual, not a
  fault that takes fingers or toes away.'
examples:
- The doctor noted polydactyly in the newborn baby.
- Polydactyly means a child is born with extra fingers or toes.
