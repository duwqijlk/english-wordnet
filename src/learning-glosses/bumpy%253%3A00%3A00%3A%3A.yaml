simpleMeaning: that shakes you with sudden jerks as you move over it, instead of letting you move smoothly
scope: 'Also called rough; rocky is another name for it: a road or ride that shakes you with sudden jerks,
  not a smooth one.'
examples:
- It was a bumpy ride over the dirt track.
- The bumpy road made the cups rattle in the car.
