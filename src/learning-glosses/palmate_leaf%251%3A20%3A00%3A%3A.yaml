simpleMeaning: This part of a plant looks like an open hand, with parts that spread out from one point
scope: A part of a plant shaped like an open hand, with parts spreading from one point; not a leaf cut
  into finger-like pieces and not a plain round leaf.
examples:
- The maple has a palmate leaf with five lobes.
- She pressed a palmate leaf between the pages of her book.
