simpleMeaning: A heavy metal that breaks easily, one of the platinum group; used in mixtures with other
  metals; found in natural mixtures with platinum or osmium.
scope: A heavy metal of the platinum group, also called Ir and iridium; set apart from platinum and osmium
  themselves and from other heavy metals.
examples:
- Atomic number 77 is found with platinum in natural mixtures.
- Jewellers mix atomic number 77 with other metals.
