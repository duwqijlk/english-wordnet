simpleMeaning: A tiny seed-like cell made without mating that forms inside the cell of some germs and
  water plants.
scope: A tiny seed-like cell made without mating inside the cell of some germs and water plants, not a
  seed from a flowering plant and not a cell that forms outside another cell.
examples:
- The endospore formed inside the germ cell.
- Endospores can stay alive for a long time.
