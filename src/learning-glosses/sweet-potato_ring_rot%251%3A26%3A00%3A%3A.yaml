synsetId: 14305886-n
simpleMeaning: a disease of the plant grown for its roots, in which bands of dry decay cut round the roots
scope: This is a disease of the roots of the plant grown for its roots, not a disease of the leaves and
  not a disease of other root crops.
examples:
- The sweet-potato ring rot spread through the stored crop.
- Farmers dug up the roots to check for sweet-potato ring rot.
