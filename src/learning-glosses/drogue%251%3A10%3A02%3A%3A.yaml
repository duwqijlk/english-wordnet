simpleMeaning: A cut-off cloth cone on a mast, used, as at airports, to show the wind's way.
scope: A cut-off cloth cone on a mast, used, as at airports, to show the wind's way; also called windsock,
  air-sleeve, air sock, wind cone, wind sleeve, or wind sock; not a check made of a canvas-covered frame
  that trails behind a boat, keeping it from drifting, or holding its head to the wind, nor a parachute
  used to slow a thing moving fast, nor a funnel-shaped thing towed by a plane as a mark.
examples:
- Their drogue turned in the wind.
- The drogue flew at the field.
