simpleMeaning: A germ-killing drug got from a tiny living thing that grows in threads, used in surgery
  as a gut cleanser in its salt form sold under this trade name
scope: 'Also called fradicin and neomycin: a germ-killing drug got from a tiny living thing that grows
  in threads and used in surgery as a gut cleanser, not the skin drug sold for cuts and sore eyes.'
examples:
- The surgeon used Neobiotic to clean the gut before the operation.
- Neobiotic was given as a salt in surgery.
