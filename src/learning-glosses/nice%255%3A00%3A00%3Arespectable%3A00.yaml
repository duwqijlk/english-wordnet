simpleMeaning: behaving in a polite and proper way that society expects.
scope: This is not about something being pleasant or enjoyable; it is about good, respectable behaviour.
examples:
- He came from a nice family and always behaved politely at dinner.
- It is not nice to talk with your mouth full.
