simpleMeaning: the way things are linked when they happen at the same time
scope: 'Also called synchronicity, synchrony, synchronisation, and synchronizing: things happening at
  the same time. It is not the act of setting clocks to show the same time, and not a change that makes
  things happen together again and again.'
examples:
- The synchronization of the two dancers' steps made the show look smooth.
- There was a clear synchronization between the music and the lights, as each change came at the same
  moment.
