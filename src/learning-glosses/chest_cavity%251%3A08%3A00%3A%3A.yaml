simpleMeaning: The lungs and heart sit in this hollow space in a body with a backbone, shut in by the
  ribs between the breathing muscle and the neck.
scope: 'Also called thoracic cavity: the hollow space in the body holding the lungs and heart, not the
  hollow space of the belly.'
examples:
- The chest cavity holds the lungs and heart.
- His chest cavity was shut in by the ribs.
