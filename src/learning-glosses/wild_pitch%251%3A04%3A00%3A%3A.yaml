simpleMeaning: a bad throw in baseball that the catcher cannot catch, and that lets a runner move on one
  base
scope: A throw in baseball that goes off target and lets a runner move on one base, not a normal throw
  the catcher catches and not a passed ball.
examples:
- The wild pitch got past the catcher and the runner moved to second.
- After the wild pitch, the runner on first moved on to second base.
