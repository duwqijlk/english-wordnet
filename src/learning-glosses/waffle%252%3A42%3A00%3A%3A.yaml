simpleMeaning: to wait before acting because you are unsure or do not want to act
scope: This is waiting before acting because you are unsure or do not want to act; hesitate and waver
  are other names for this sense, and it is not the food sense of a cake cooked in an iron.
examples:
- The authorities waffled over the exact figures.
- Do not waffle; give me a straight answer.
