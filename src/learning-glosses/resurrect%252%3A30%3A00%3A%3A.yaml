simpleMeaning: to bring back something that had grown low, quiet, still, or unused, and make it active
  again
scope: To bring back something that had grown low, quiet, still, or unused, and make it active again;
  revive is another name for this sense, not to bring a dead person back to life.
examples:
- He resurrected the tango in a small town in Argentina.
- The new director resurrected an old style of opera.
