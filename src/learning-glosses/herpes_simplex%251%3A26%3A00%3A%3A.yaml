simpleMeaning: A virus infection that affects the skin and nervous system and raises small blisters that
  do not last, though they may hurt, on the skin and moist body linings.
scope: A medical term for a virus infection of the skin and nerves that brings small blisters, not the
  herpes simplex virus itself, not shingles and not a bacterial skin infection.
examples:
- Small blisters on his skin turned out to be herpes simplex.
- Herpes simplex made small blisters that sometimes hurt but did not last.
