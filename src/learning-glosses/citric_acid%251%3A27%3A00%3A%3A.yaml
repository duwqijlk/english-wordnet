simpleMeaning: A mild sour stuff that melts away in water, found in many fruits, above all the sour ones,
  and put in food to give it a sharp taste
scope: This mild sour stuff is found in many fruits and put in food to give it a sharp taste, and it is
  not a strong acid.
examples:
- Lemons are rich in citric acid, which gives them their sharp taste.
- The cook added citric acid to the drink to make it taste fresh and sour.
