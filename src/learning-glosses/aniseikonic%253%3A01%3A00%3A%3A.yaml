simpleMeaning: To do with a sight fault in which the two eyes see things at unlike sizes
scope: To do with a sight fault where the two eyes see things at unlike sizes, not a fault of the eye
  lens and not being short-sighted.
examples:
- Aniseikonic vision can make reading hard.
- The aniseikonic patient saw one image bigger than the other.
