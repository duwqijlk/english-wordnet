simpleMeaning: A marsh herb with a long spike of purple flowers, first of Europe but now spreading fast
  in the eastern United States.
scope: This is a marsh herb with a long spike of purple flowers; purple loosestrife and spiked loosestrife
  are other names for it, not the small one-year loosestrife of wet places.
examples:
- Lythrum salicaria grows thick along the river bank.
- The Lythrum salicaria in the marsh has a long spike of purple flowers.
