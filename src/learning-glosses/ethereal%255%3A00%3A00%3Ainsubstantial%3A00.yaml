simpleMeaning: very light and without a solid body, that cannot be touched or held, like air
scope: 'Also called airy, aerial, aeriform and aery: light and without a solid body like air, not the
  sense that means fine and delicate, and not the sense about ether (a chemical liquid).'
examples:
- The mist formed an ethereal shape that seemed to float and fade.
- Her ethereal dress moved as if it had almost no weight.
