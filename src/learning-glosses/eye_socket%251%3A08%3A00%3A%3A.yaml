simpleMeaning: The bony hollow in the skull that holds the ball that lets you see.
scope: The bony hollow in the skull that holds the seeing ball, also called the orbit, the cranial orbit
  or the orbital cavity; not the cheekbone and not the nose hollow.
examples:
- The blow left a deep bruise around her eye socket.
- The doctor checked the eye socket for a broken bone.
