simpleMeaning: To trade on price gaps, as in the share market.
scope: This sense is to trade on price gaps, as in the share market, unlike the sense for a safe kind
  of stake, meant to catch small gaps in price, where, when prices differ across two markets, the buyer
  buys low and sells high at once.
examples:
- They arbitrage, trading on price gaps.
- They arbitrage shares.
