simpleMeaning: To understand something in a particular way, or for it to give a particular meaning or
  impression.
scope: This is not finding hidden signs in a person’s behavior or in the sky, retrieving computer data,
  or a gauge displaying a value; it is an interpretation or impression.
examples:
- She read his note as an apology.
- The final line reads like a threat.
