simpleMeaning: a group of separate parts that are linked to each other and together form one whole
scope: Also called system, this is a group of separate but linked parts that form one whole; it is not
  a picture in the mind and not a statement that avoids a question.
examples:
- In this scheme, farms, factories and shops all work together as one whole.
- A scheme of roads and railways joins all parts of the country into one whole.
