simpleMeaning: One word set against another in sense, the two being opposites of each other.
scope: This sense is also called an opposite, for one word set against another in sense, the two being
  opposites of each other, where an opposite is a word whose sense is the exact contrary of another word's.
examples:
- Hot is an antonym of cold.
- Antonyms stand against each other in sense.
