synsetId: 00306817-r
simpleMeaning: In a way that shows you do not want to do it
scope: In a way that shows you do not want to do it; not gladly, and not in a keen or eager way.
examples:
- She went unwillingly to the meeting, hoping it would end soon.
- He gave up the money unwillingly, knowing he had no choice.
