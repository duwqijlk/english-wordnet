simpleMeaning: A note of urgency you can hear in someone's voice.
scope: The urgent tone in a person's voice, not a sharp side of an object, and not a small advantage over
  a rival.
examples:
- There was an edge in her voice when she told him to hurry.
- His voice had an edge to it that made everyone listen.
