simpleMeaning: A vowel can carry this small sign above it, telling the reader to stress it or to say it
  in a special way.
scope: Accent is another name for this small sign above a vowel, which tells the reader to stress the
  vowel or say it in a special way.
examples:
- The accent mark over the e tells you to say it with stress.
- The accent mark above the vowel showed where the stress fell.
