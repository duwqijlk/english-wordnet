simpleMeaning: The same for all who take it, a set of questions or tasks measures feeling, memory, wit,
  skill, character, and more such things.
scope: Also called test, mental testing, and psychometric test, it gives the same set of tasks or questions
  to all who take it, not a single question asked on the spot.
examples:
- The mental test was given to a large group of students.
- A mental test measured their memory and wit.
