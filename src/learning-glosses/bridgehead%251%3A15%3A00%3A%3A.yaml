simpleMeaning: a piece of enemy land that soldiers have taken and hold while they wait for more men and
  supplies
scope: This is enemy land taken and held while more men and supplies are awaited; foothold is another
  name for it, not a base camp and not a landing place.
examples:
- The soldiers fought to keep their bridgehead behind enemy lines.
- They held the bridgehead until fresh troops arrived.
