simpleMeaning: a clever, dishonest plan with many parts, made to get what you want, usually for an evil
  end
scope: 'Also called intrigue: a clever, dishonest plan, usually with an evil aim; not an honest, open
  plan and not the working of a machine.'
examples:
- His machinations helped him take control of the company in secret.
- The king fell because of the machinations of men at his court.
