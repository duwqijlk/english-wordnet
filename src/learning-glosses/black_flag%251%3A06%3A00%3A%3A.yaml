simpleMeaning: A pirate ship is marked by this cloth, most often with a white skull and crossed bones
  on a dark ground.
scope: Also called blackjack and pirate flag, this is the cloth that marks a pirate ship.
examples:
- The black flag rose above the pirate ship.
- A black flag with a white skull flew in the wind.
