simpleMeaning: a surface on an edge, made for beauty, that is sunk in or raised up
scope: Also called border, and another name for this sense is molding. This is the sunk-in or raised surface
  on an edge itself, not a separate strip put on for finishing and not a first model made in wax or clay.
examples:
- The moulding along the edge of the door is cut with small flower shapes.
- Light showed up the moulding on the edge of the wooden panel.
