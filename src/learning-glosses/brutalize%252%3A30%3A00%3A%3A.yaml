simpleMeaning: to become cruel and hard, and stop caring about the feelings of other people
scope: About a person changing and becoming cruel and uncaring, not about making another person change
  and not about treating someone in a cruel way.
examples:
- After the hard years of war, he brutalized and stopped caring about anyone.
- She felt herself brutalizing as she grew hard and cold to the people around her.
