simpleMeaning: speaking or acting in a plain, direct way, without hints and without trying to hide what
  you mean
scope: 'Also called blunt, frank, candid, outspoken, free-spoken, plainspoken and point-blank: speaking
  in a plain, direct way, not with hints and not hiding what you mean.'
examples:
- She gave a forthright answer and said exactly what she thought.
- His forthright criticism helped us see the problem clearly.
