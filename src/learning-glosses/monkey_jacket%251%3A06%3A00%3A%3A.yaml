simpleMeaning: Officers wear this short jacket at formal dinners in their dining room, and it ends at
  the waist and narrows to a point at the back.
scope: Also called mess jacket and shell jacket, this short jacket ends at the waist and narrows to a
  point at the back, and officers wear it at formal dinners in their dining room.
examples:
- The officer wore his monkey jacket to the formal dinner in the mess.
- The monkey jacket narrowed to a point at the back.
