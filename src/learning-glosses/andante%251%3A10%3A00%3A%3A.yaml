simpleMeaning: a piece of music, or part of a piece, that should be played at a slow speed, but not very
  slow
scope: This is the piece of music itself, not the speed word that tells players how slow to play.
examples:
- The orchestra played a gentle andante after the fast opening.
- She wrote an andante for piano and violin.
