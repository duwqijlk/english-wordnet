simpleMeaning: A small salmon, prized as food, with crimson flesh, that lives in the rivers and streams
  of the northern Pacific, and whose grown fish die after laying eggs.
scope: This small salmon is also called blueback salmon, sockeye, and sockeye salmon.
examples:
- We caught red salmon in the rivers of the northern Pacific.
- The red salmon died after laying eggs.
