simpleMeaning: the part of medical science that deals with using X-rays or other rays that go through
  the body for medical care
scope: This is the part of medicine that deals with using X-rays and other such rays for medical care;
  it is not the single act of using X-rays to look at the inside of things that light cannot pass through.
examples:
- She chose radiology as her area of medicine.
- He works in radiology at the city hospital.
