simpleMeaning: A poison made by germs of one kind, used in war to leave people unable to act.
scope: A poison made by germs of one kind, also called staphylococcal enterotoxin B, not a poison that
  kills and not a poison made by plants.
examples:
- The army used SEB to disable enemy troops.
- SEB is a poison that leaves people too weak to fight.
