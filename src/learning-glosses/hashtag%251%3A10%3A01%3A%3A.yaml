simpleMeaning: A label for a message's subject or content, used on social network sites and sites for
  short posts, that helps people find messages on that subject
scope: 'This is a label used to find posts on one subject, not the # sign on its own and not a tag with
  a person''s name.'
examples:
- She put a hashtag on her post so people could find all the posts on that subject.
- The hashtag at the end of his short post helped readers find other posts with the same content.
