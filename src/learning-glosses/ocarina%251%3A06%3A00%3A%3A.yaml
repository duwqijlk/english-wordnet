simpleMeaning: Shaped like an egg and made of baked clay, this wind instrument sounds when air is blown
  through its mouthpiece and fingers cover its holes.
scope: Also called sweet potato, this is the egg-shaped clay wind instrument played through a mouthpiece
  with finger holes.
examples:
- A tune came from the ocarina.
- Fingers covered the ocarina's holes to change the notes.
