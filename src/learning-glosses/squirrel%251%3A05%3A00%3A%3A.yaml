simpleMeaning: an animal that lives in trees, in the rodent group (animals with strong front teeth for
  biting), with a long tail with thick hair
scope: The living animal that lives in trees, not the hair and skin that come from it.
examples:
- A squirrel ran up the tree with a nut in its mouth.
- We saw a squirrel jump from one branch to another.
