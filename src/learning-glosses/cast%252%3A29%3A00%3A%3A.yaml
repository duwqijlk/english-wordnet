simpleMeaning: 'To vomit: to bring food or liquid back up from the stomach through the mouth.'
scope: This is vomiting, not throwing a fishing line or wandering from place to place.
examples:
- The sick puppy cast up its breakfast on the kitchen floor.
- The sea was so rough that several passengers cast up their lunch.
