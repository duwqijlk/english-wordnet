simpleMeaning: a computer tool that puts labels on the words and phrases in a text to show what part each
  plays
scope: This is a computer tool that labels the words and phrases in a text to show what part each plays,
  and tagger is another name for this sense, not a tool that checks spelling and not one that writes text.
examples:
- The tagging program marked each word in the sentence with its part of speech.
- We ran the tagging program over the whole book to label its words.
