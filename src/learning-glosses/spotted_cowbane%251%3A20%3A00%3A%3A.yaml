simpleMeaning: A tall water hemlock from northeastern North America that lives two years, with purple-streaked
  stems and clusters of very poisonous roots shaped like small sweet potatoes.
scope: Another name for spotted hemlock and spotted water hemlock; this is the tall, two-year water hemlock
  of northeastern North America, not the different plant called poison hemlock.
examples:
- Spotted cowbane grows in wet ground and is deadly to cattle.
- Its purple-streaked stems make spotted cowbane easier to identify in late summer.
