simpleMeaning: a low, spreading bush with narrow leaves lying over each other, green all year, and early
  white star-shaped flowers, in sandy pine land in New Jersey and the Carolinas
scope: 'This plant is also called pixie and pyxie. It is a low bush, not the pixy of old stories: fairies
  that are somewhat mischievous.'
examples:
- The pixy grows low along the sandy ground under the pines.
- In spring, the pixy opens small white flowers shaped like stars.
