simpleMeaning: Winds that blow from the west, in the mild parts of the Earth
scope: 'Also called a westerly: winds that blow from the west in the mild parts of the Earth; not winds
  from the east and not winds near the poles.'
examples:
- Prevailing westerlies brought rain to the coast.
- The prevailing westerly blew all night.
