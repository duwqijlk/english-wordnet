simpleMeaning: something no one can make sense of or give a reason for
scope: 'Also called incomprehensible: what no one can explain or give a reason for, not something that
  is only strange or surprising.'
examples:
- His sudden departure for inexplicable reasons left everyone puzzled.
- The inexplicable errors in the report had no clear cause.
