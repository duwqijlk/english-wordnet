simpleMeaning: Most rocks, sandstone and granite above all, contain a hard, shiny mineral of silicon dioxide
  crystals; iron impurities give yellow sand its color.
scope: The natural mineral found in rocks, not the clear glass made from nearly pure silica that is also
  called quartz.
examples:
- The cliff is mostly quartz, veined with darker minerals.
- She turned the piece of quartz over and watched the light catch its crystals.
