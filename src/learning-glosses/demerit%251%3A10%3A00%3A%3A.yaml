simpleMeaning: a bad mark given to a person for bad behaviour or for failing, usually given in school
  or in the armed forces
scope: A bad mark for bad behaviour or for failing, usually in school or the armed forces, not a weak
  point or fault in a thing or a plan.
examples:
- The student got a demerit for being late to class again.
- In the army, he received two demerits for not following orders.
