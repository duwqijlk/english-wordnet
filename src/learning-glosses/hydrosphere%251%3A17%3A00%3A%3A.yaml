simpleMeaning: All the water on and around the earth, in seas and lakes and in the air as vapor
scope: All the water on and around the earth, not the air itself and not the rock of the earth.
examples:
- Rain and rivers are part of the hydrosphere.
- The hydrosphere holds the water that fills the seas and falls as rain.
