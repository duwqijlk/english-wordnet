simpleMeaning: a furnace with a special hearth, a flat floor for a fire, where metal is heated before
  it is shaped
scope: A furnace with a hearth for heating metal, not the whole workshop where metal is heated and hammered.
examples:
- The blacksmith put the iron in the forge to heat it.
- The forge glowed red as the metal grew hot.
