simpleMeaning: to pass in front of a body in the sky, such as a planet or star, so that it can no longer
  be seen
scope: 'Also called eclipse: this is about one body in space hiding another. It is not about magic or
  hidden powers, and it is not the sense where a light itself goes out of sight.'
examples:
- The moon occults the bright star as it passes in front of it.
- A planet can occult a distant star for a short time.
