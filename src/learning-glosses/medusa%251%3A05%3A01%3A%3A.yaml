simpleMeaning: One of the two shapes taken by soft-bodied sea creatures, the free-swimming stage in which
  they breed, with a jelly-like body shaped like an open umbrella and long, thin arms.
scope: Also called medusan and medusoid, this is one of the two shapes taken by soft-bodied sea creatures.
examples:
- The medusa drifted through the water.
- A medusa's tentacles trailed behind it.
