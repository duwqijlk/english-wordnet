simpleMeaning: playful and bold in a way that people find pleasing
scope: 'Also called devilish and rascally: playful and bold in a pleasing way; it is not the sense about
  having no care for right and wrong.'
examples:
- He gave her a roguish grin and took the last cake.
- With a roguish smile, she winked at the children.
