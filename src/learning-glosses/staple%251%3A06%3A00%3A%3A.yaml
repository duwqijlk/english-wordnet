simpleMeaning: goods that people always need, usually named in the plural, and keep buying in steady amounts
scope: 'Also called a basic: a good people always need and keep buying, not a paper fastener and not raw
  material for making things.'
examples:
- Rice and bread are staples in many homes.
- Flour is a staple that every kitchen keeps.
