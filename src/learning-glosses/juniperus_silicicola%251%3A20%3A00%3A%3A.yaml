scope: A tree of wet land near the sea in the southeast United States, much like the eastern red cedar;
  southern red cedar is another name for this sense; not the eastern red cedar itself, and not a tree
  of dry inland land.
examples:
- Juniperus silicicola grows in the swampy coastal regions of the southeast.
- The Juniperus silicicola by the marsh looks much like an eastern red cedar.
