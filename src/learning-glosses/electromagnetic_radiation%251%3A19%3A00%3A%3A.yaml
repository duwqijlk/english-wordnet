simpleMeaning: Energy that travels in waves comes from a charged bit of matter speeding up, and the waves
  stay tied to unseen forces of power and moving charge
scope: This energy, also called electromagnetic wave and nonparticulate radiation, travels in waves tied
  to unseen forces of power and moving charge.
examples:
- Light is a form of electromagnetic radiation that our eyes can see.
- The sun sends out electromagnetic radiation that warms the earth.
