simpleMeaning: a European plant that climbs weakly and lives for years, with white or pink flowers; it
  now grows wild in North America, where it is a weed that spreads fast
scope: A weakly climbing European plant with white or pink flowers, also called wild morning-glory, not
  a morning glory grown in gardens and not a tree.
examples:
- Field bindweed had climbed over the fence by summer.
- Farmers pull out field bindweed because it spreads so fast.
