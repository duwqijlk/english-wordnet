simpleMeaning: From the main craft, this craft takes space travellers down to the moon and back
scope: Also called a lunar module, this is the craft that takes astronauts to the moon's surface and back,
  not the main craft that stays in orbit.
examples:
- The lunar excursion module landed gently on the moon's surface.
- Two astronauts rode the lunar excursion module back to the command module.
