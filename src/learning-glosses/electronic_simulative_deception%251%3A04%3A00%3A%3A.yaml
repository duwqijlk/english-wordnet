simpleMeaning: acts that show friendly powers, real or made up, to fool enemy troops
scope: Acts that show friendly powers to fool enemy troops, also called simulative electronic deception;
  not a real show of strength and not a lie told in words.
examples:
- Electronic simulative deception made the enemy think more troops were near.
- The army used electronic simulative deception to fake a friendly force.
