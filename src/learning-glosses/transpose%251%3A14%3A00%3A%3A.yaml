simpleMeaning: a set of numbers in rows and columns, made by swapping the rows and columns of another
  such set
scope: This is the noun for the set of numbers made by swapping rows and columns, not the verb for moving
  a number in an equation and not moving a thing to another place or time.
examples:
- The transpose of this set has the old rows as columns.
- Write down the transpose and check that its first row is right.
