simpleMeaning: A short chain or a strip of cloth; a man uses it to join his pocket watch to his vest
scope: 'Also called watch chain and watch guard: the short chain or cloth strip itself, not the small
  pretty thing that hangs from it and not the vest pocket that holds the watch.'
examples:
- His gold fob held his pocket watch safely to his vest.
- He wore a fob made of black cloth ribbon with his watch.
