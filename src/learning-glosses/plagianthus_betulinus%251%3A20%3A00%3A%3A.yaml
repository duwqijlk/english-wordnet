simpleMeaning: A New Zealand tree that loses its leaves in winter, whose inner bark gives a strong thread
  like flax, called New Zealand cotton
scope: Also called ribbon tree, ribbonwood and Plagianthus regius, it is a New Zealand tree that sheds
  its leaves in winter and has inner bark that gives a strong flax-like thread known as New Zealand cotton.
examples:
- The Plagianthus betulinus grew in New Zealand with bark like strong thread.
- Plagianthus betulinus loses its leaves in winter.
