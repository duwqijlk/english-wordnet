simpleMeaning: slowly moving into a place without a right to be there and without being allowed to be
  there
scope: Also called trespassing and encroaching, this sense is about slowly entering or taking over a place
  without right or permission; it is not about a disease spreading in the body and not about an army attack.
examples:
- Invasive tourists slowly took over the quiet village, though no one had invited them.
- Invasive plants kept spreading into the garden, even though no one had planted them there.
