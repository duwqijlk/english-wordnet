simpleMeaning: a fruit with a hard stone inside, full of oil, that grows on a bush called rabbitwood
scope: 'Also called elk nut and oil nut: a fruit with a hard stone inside full of oil, not the shrub itself
  and not another oily fruit.'
examples:
- He cracked open a buffalo nut to get at the oily fruit inside.
- Buffalo nuts are the oily fruits of rabbitwood.
