simpleMeaning: Worthy only of a passing penalty.
scope: This sense is also called minor, for being worthy only of a passing penalty, where minor is bad
  enough only for a punishment that lasts for a time, not for one that lasts for ever.
examples:
- The sin was venial, worthy only of a passing penalty.
- The fault was venial, worthy of a passing penalty.
