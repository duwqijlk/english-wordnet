simpleMeaning: A very small shiny dark insect that lives outside but comes into homes to find food.
scope: This is a very small dark insect that nests outside and comes into homes for food, not a large
  stinging ant and not an insect that lives only in houses.
examples:
- The little black ants marched across the kitchen floor in search of crumbs.
- We found little black ants nesting under the back step.
