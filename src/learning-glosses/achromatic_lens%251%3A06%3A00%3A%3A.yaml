simpleMeaning: a set of two or more glass pieces joined together that makes a clear picture with no false
  colours at the edges
scope: A joined set of glass pieces that makes a picture with no false colours, not a single glass piece
  and not a lens that leaves coloured edges.
examples:
- The achromatic lens in the telescope gave a sharp, true-coloured view.
- She fitted an achromatic lens to the camera to stop the coloured fringes.
