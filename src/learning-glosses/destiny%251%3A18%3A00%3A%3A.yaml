simpleMeaning: the highest power that people think decides in advance what will happen in life and in
  the world
scope: 'Also called fate: the highest power that people think decides what will happen. It is not a person''s
  own choice, and not just one event that happens.'
examples:
- He believed destiny would bring them together again one day.
- They felt helpless in the face of destiny and could not change what would happen.
