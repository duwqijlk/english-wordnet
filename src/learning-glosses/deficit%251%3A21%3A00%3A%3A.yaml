simpleMeaning: the amount by which what a person or group owes is more than what they own, usually counted
  over a set time
scope: A money gap where what is owed is more than what is owned, usually over a set time; not a gap in
  how the mind works.
examples:
- Last year the firm ran a large deficit.
- The budget deficit grew after spending rose.
