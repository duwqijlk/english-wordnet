simpleMeaning: The act of paying someone back for harm they did, by harming them in return, above all
  in the life after death
scope: The act of paying someone back for harm they did, by harming them in return, above all in the life
  after death, also called vengeance; not a fair penalty set by law.
examples:
- He swore retribution on the man who betrayed him.
- The story tells of divine retribution after death.
