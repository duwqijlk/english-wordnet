simpleMeaning: Any of a few kinds of woody plant whose leaves or bark are used to bring down a high body
  heat, or are held to mark places free of it
scope: Any of a few kinds of woody plant whose leaves or bark are used to bring down a high body heat,
  or are held to mark places free of it; not a tree grown for its wood and not a tree of wet places with
  large pink flowers.
examples:
- She boiled leaves from the fever tree to bring down her child's high body heat.
- They cut bark from the fever tree to treat the sick man.
