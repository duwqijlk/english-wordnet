simpleMeaning: a mark put above a vowel to show how to say it
scope: A mark above a vowel showing how to say it, also called acute and acute accent; not a mark below
  a letter and not a word on its own.
examples:
- The aigu sits above the e to show how it sounds.
- She added an aigu over the vowel in the French word.
