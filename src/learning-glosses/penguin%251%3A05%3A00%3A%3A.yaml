simpleMeaning: Birds with short legs that cannot fly, living in cold southern places, most of all in Antarctic
  regions, with skin between their toes and flat wings used for swimming
scope: A sea bird that cannot fly and lives in cold southern seas, not a flying bird from cold northern
  places.
examples:
- A penguin dived into the cold sea to catch fish.
- Penguins stood together on the ice in Antarctica.
