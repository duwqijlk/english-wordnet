simpleMeaning: With a round to long head marked by an uneven pattern of pits and ridges, this mushroom
  can be eaten and is prized as food.
scope: Also called sponge morel and sponge mushroom, it is a mushroom that can be eaten, with a head marked
  by pits and ridges.
examples:
- The common morel can be eaten and is prized as food.
- The common morel has a round to long head with pits and ridges.
