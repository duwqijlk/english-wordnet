simpleMeaning: A small bit found in body flesh that helps turn food into power; it can turn into ADP and
  ATP, and back.
scope: Also called adenosine monophosphate and adenylic acid; not the electric unit of the same short
  name.
examples:
- AMP is found in muscle cells.
- AMP can turn into ATP when the body needs power.
