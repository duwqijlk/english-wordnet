simpleMeaning: the way of making a general idea by taking what a group of single things have in common
scope: 'Also called generalization and generalisation: the way of making a general idea from what things
  share, not a painting that does not show real things.'
examples:
- The word 'tree' is an abstraction made from many single trees.
- In class, we learned abstraction by finding what all these shapes have in common.
