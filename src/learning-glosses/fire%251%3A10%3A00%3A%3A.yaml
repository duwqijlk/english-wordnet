simpleMeaning: Very strong criticism that is directed against a person or thing.
scope: This is not a burning blaze or a burst of anger; it is a heavy wave of hostile criticism.
examples:
- The minister came under fire for his remarks about the poor.
- The proposal drew heavy fire from local residents at the public meeting.
