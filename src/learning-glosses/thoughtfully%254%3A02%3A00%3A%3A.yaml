simpleMeaning: in a way that shows care for other people and what they need
scope: This sense is about doing something in a way that shows care for other people. It is not the sense
  of thinking deeply or quietly by yourself.
examples:
- She thoughtfully left a note and some food for her tired roommate.
- He thoughtfully held the door and carried the bags for the old woman.
