simpleMeaning: a sore swelling of the small bag that stores seed fluid, most often with a sore swelling
  of the gland below the bladder
scope: A sore swelling of the small bag that stores seed fluid, most often with a sore swelling of the
  gland below the bladder, not a swelling of the bladder itself and not an infection of the skin.
examples:
- The doctor said his vesiculitis came with a sore swelling of the gland below the bladder.
- Vesiculitis made the small bag that stores seed fluid sore and swollen.
