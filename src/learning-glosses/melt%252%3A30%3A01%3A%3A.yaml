simpleMeaning: to turn from solid into liquid, or to make something do this, usually by making it hot
scope: 'Also called run: to turn from a solid into a liquid, usually with heat, not to lose shape and
  mix in and not to become hard to see.'
examples:
- The butter melted in the warm pan.
- The sun melted the ice into a pool of water.
