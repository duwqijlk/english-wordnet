simpleMeaning: A lawyer who fights a person's case and pays its costs gets a share of any money the court
  awards, under a deal the law calls wrong
scope: This wrong deal has a lawyer fight a person's case and pay its costs, in return for a share of
  the money the court awards.
examples:
- The champerty deal gave the lawyer a share of the money the court awarded.
- The judge said the champerty deal was wrong because the lawyer stood to gain from the case.
