simpleMeaning: Single yellow or white flowers and thick leaves that look like small rocks belong to one
  of many kinds of African plant in the Lithops group.
scope: Flowering stone, lithops, living stone, stone-face, stone plant, and stoneface are other names
  for one of the Lithops plants of Africa, with single yellow or white flowers and thick leaves that look
  like small rocks.
