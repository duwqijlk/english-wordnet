simpleMeaning: A tiny bright bit put on clothes to make them look pretty
scope: This is a small shiny piece used to decorate clothes; sequin and spangle are other names for it,
  not a cloth covered with shiny pieces and not a jewel set in gold.
examples:
- Her dress was trimmed with diamante along the hem.
- A single diamante caught the light on her collar.
