simpleMeaning: The way of making art that marks one maker, one school or one movement, so you can tell
  their work apart
scope: One maker's way of making art, not the subject of the work and not mere skill.
examples:
- Her artistic style is easy to spot in any gallery.
- The artistic style of the painter changed late in life.
