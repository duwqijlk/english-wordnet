simpleMeaning: In baseball, to run to the next base safely during a pitch, without help from a hit, walk,
  passed ball or wild pitch.
scope: The baseball sense of advancing a base, not moving quietly and secretly and not the noun for this
  act.
examples:
- He stole second base in the fifth inning.
- She stole third base on the first pitch.
