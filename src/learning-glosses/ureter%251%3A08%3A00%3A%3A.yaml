simpleMeaning: From the kidney, urine runs through one of a pair of thick-walled tubes to the bag that
  holds it.
scope: This is one of a pair of thick-walled tubes that carry urine from the kidney to the bag that holds
  it.
examples:
- The ureter carries urine from the kidney to the bladder.
- One ureter was blocked, so urine could not reach the bladder.
