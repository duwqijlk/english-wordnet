simpleMeaning: one of two forms taken by simple sea animals like hydra and coral, usually fixed in place,
  hollow and tube-shaped, usually with feelers in a ring around its mouth
scope: This is a sea animal in one of its two body forms, not a small growth inside the body, such as
  in the nose.
examples:
- The coral polyp stayed fixed to the rock and spread its tentacles around its mouth.
- A hydra in its polyp form has a hollow, tube-shaped body.
