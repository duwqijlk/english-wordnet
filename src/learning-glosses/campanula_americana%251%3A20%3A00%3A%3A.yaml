simpleMeaning: A plant of eastern North America that lives one year or many, with long spikes of blue
  or white flowers.
scope: Also called a tall bellflower; a plant of eastern North America that lives one year or many, with
  long spikes of blue or white flowers, not a plant with pink flowers and not a plant of the west.
examples:
- Campanula americana grew tall along the woodland edge.
- The blue spikes of Campanula americana brightened the garden.
