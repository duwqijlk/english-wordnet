schema: oewn-learning-gloss-v2
senseId: 'conjunctive%1:10:00::'
synsetId: 06336819-n
simpleMeaning: A joining word that does not change its form and links words, word groups, clauses, or
  whole sentences
scope: A joining word that links words and sentences, also called conjunction, connective, and continuative,
  not a word that names a thing and not a word that changes form.
examples:
- And is a conjunctive that joins two words.
- The conjunctive 'but' links two clauses.
