simpleMeaning: a tall grass grown for show that lives for years, with long flower heads that hang down,
  from warm parts of Africa and Asia
scope: A tall garden grass with drooping flower heads, not a short lawn grass and not a wild grain grass.
examples:
- Fountain grass lines the path, its tall plumes nodding in the wind.
- We planted fountain grass by the pond for its long, drooping flower heads.
