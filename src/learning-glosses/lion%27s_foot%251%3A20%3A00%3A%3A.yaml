simpleMeaning: a common perennial herb across the southern and eastern United States whose drooping pink
  flower clusters and thick lower leaves look like a paw; sometimes placed in genus Prenanthes.
scope: Another name for gall of the earth; it is this pink-flowered herb, not an actual animal's paw.
examples:
- Lion's foot grows along woodland edges in the southern United States.
- Its drooping pink flowers and paw-shaped leaves make lion's foot easy to recognize.
