simpleMeaning: a guard at an airport who checks people and their bags at the place where people must pass
  a safety check before a flight
scope: This person works at an airport and checks people and bags for safety before a flight. It is not
  a guard elsewhere in the airport and not a person who chooses people for a job.
examples:
- A screener asked her to open her bag at the airport.
- The screener checked my ticket and bag before I went to my flight.
