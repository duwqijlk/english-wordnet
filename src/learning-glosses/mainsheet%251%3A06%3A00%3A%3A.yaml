simpleMeaning: a line on a boat, rope or chain, that holds a sail at the right slant to the wind
scope: Also called sheet, tack, shroud, and weather sheet, this line holds a sail at the right slant to
  the wind.
examples:
- He pulled the mainsheet to set the sail to the wind.
- She eased the mainsheet and the sail swung out.
