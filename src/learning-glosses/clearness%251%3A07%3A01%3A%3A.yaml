simpleMeaning: Words so free of anything hard to follow that what they say is easy to take in.
scope: Words free of anything hard to follow; also called clarity or lucidity, not the clearness of water.
examples:
- We praised the clearness of her writing.
- The clearness of his speech made the hard point easy.
