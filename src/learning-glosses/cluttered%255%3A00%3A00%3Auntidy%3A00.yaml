simpleMeaning: full of things piled or spread about in no order, or with rubbish lying all over
scope: 'Also called littered: a place full of things or rubbish lying about in no order, not simply untidy
  in dress or manner.'
examples:
- His cluttered desk was covered with papers and books.
- The cluttered room had piles of books on every chair.
