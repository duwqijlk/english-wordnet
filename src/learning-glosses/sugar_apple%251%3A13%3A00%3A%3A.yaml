simpleMeaning: With a thick rough skin and shiny black seeds inside, this sweet soft fruit grows in warm
  lands.
scope: Annon, annona and sweetsop are other names for this sweet fruit of warm lands, with a thick rough
  skin and shiny black seeds inside.
examples:
- She cut open a sugar apple and ate the sweet flesh inside.
- The sugar apple on the table had shiny black seeds.
