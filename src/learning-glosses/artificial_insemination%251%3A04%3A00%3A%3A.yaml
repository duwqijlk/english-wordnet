simpleMeaning: The womb or the egg tube receives seed from outside the body, not through sex.
scope: The sense covers seed placed in the womb or the egg tube by any means other than sex.
examples:
- The seed reached the womb by artificial insemination, not by sex.
- Sex alone had not worked, so artificial insemination was tried.
