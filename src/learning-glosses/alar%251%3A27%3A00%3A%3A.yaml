simpleMeaning: A substance sprayed on fruit trees to control their growth, so the whole crop can be picked
  at one time.
scope: 'Also called daminozide: a substance sprayed on fruit trees to control their growth, so the whole
  crop can be picked at one time, set apart from other tree sprays by its use in timing the whole harvest.'
examples:
- The grower sprayed Alar on the apple trees.
- Alar helped the orchard ripen all at once.
