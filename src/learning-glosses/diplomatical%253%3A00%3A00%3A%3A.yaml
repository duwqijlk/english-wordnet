simpleMeaning: showing care and good judgment when handling people or matters that could easily cause
  hurt or trouble
scope: 'Also called diplomatic: careful and wise in dealing with touchy people or matters, not about the
  work of officials who represent a country in another country.'
examples:
- She gave a diplomatical answer that calmed everyone in the room.
- It was diplomatical of him not to mention the mistake in front of guests.
