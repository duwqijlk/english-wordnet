simpleMeaning: Plain drink with no added taste, 95 percent strong, used to mix with plain whiskies and
  to make gin and sweet drinks.
scope: A plain drink with no added taste, 95 percent strong, used for mixing and making gin, also called
  ethyl alcohol; not a flavoured whisky and not a wine.
examples:
- The distiller sold neutral spirits to makers of gin.
- Neutral spirits are used to blend with straight whiskies.
