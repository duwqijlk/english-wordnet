senseId: 'coattails_effect%1:19:00::'
synsetId: 11433107-n
simpleMeaning: In politics, the way one liked person seeking votes in an election pulls in votes for others
  in the same party
scope: In politics, the way one liked person seeking votes pulls in votes for others in the same party,
  not a single person's own win and not votes won by each person alone.
examples:
- He counted on the coattails effect to help his party win more seats.
- The coattails effect gave the whole party a boost when their lead runner was so liked.
