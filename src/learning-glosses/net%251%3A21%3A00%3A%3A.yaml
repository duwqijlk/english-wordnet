simpleMeaning: the amount of profit left when all costs for a period are subtracted from earnings, including
  non-cash costs such as wear on equipment.
scope: This is the money left after costs, not the global computer system or a mesh for catching fish.
examples:
- The company reported a net of ten million dollars for the year.
- After all costs were counted, the net came to less than a thousand dollars.
