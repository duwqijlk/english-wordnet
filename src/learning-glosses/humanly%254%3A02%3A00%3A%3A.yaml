simpleMeaning: in the way that people do things
scope: This word tells how a thing is done, in the way people do it or as far as people can do it. It
  does not name a person, and it is not about a machine-like way of doing a thing.
examples:
- It is not humanly possible to finish all that work in one hour.
- She did all that was humanly possible to help them.
