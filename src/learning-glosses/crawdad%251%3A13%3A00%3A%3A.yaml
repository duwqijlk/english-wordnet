simpleMeaning: Very small lobster-like creatures, usually boiled briefly and then eaten as food.
scope: Tiny lobster-like creatures served as food after brief boiling, also called a crawfish, a crayfish,
  or an ecrevisse; not the live animal in fresh water.
examples:
- The cook dropped the crawdads into the boiling pot.
- We ate crawdads with butter at the riverside table.
