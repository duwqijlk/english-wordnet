simpleMeaning: The person who is the head of that part of the government that looks after people who served
  in the army.
scope: The person in charge of the government part that looks after people who served in the army, not
  the head of any other government part.
examples:
- The new Secretary of Veterans Affairs took office this week.
- The Secretary of Veterans Affairs spoke about help for people who served in the army.
