simpleMeaning: a common shiny green beetle of Europe, whose young feed on plant roots and whose grown
  ones feed on leaves and flowers, such as roses
scope: Also called a rose chafer; a shiny green beetle of Europe, not a ladybird and not a beetle that
  eats wood.
examples:
- A rose beetle sat on the leaf in the sun.
- The rose beetles feed on the roses in June.
