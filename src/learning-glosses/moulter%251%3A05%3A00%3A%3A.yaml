simpleMeaning: From time to time, an animal — above all a bird, a jointed creature, or a creeping one
  — casts off its outer layer of feathers, hard skin, skin, or hair.
scope: Also called molter; this is an animal that casts off its outer layer from time to time.
examples:
- The moulter shed its outer layer of feathers.
- A moulter casts off its skin from time to time.
