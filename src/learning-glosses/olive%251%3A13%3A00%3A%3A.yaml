simpleMeaning: a fruit with one seed, from a European tree, usually kept in salt water or a sour liquid
  and eaten in small amounts with other food to give it taste
scope: The fruit kept in salt water or a sour liquid and eaten with other food, not the similar fruit
  grown for food and oil, not the tree it grows on, and not its wood or its yellow-green colour.
examples:
- She put green olives on the salad.
- He ate an olive with his cheese and bread.
