simpleMeaning: to plan, create, set, control, measure, or estimate something according to a particular
  rate or standard.
scope: This is not about climbing or attacking a wall, and not about weighing something on a device; it
  is about setting or judging things by a rate or standard.
examples:
- Salaries are scaled according to experience and performance.
- The difficulty of the exercises is scaled to the age of the students.
