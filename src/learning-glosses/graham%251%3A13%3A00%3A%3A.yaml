simpleMeaning: flour made by grinding the whole wheat grain, with its outer covering (the bran) left in;
  in Britain it is called whole meal flour
scope: 'Also called graham flour, whole meal flour and whole wheat flour: flour made from the whole wheat
  grain, not white flour made from only part of the grain.'
examples:
- She made the bread with graham flour.
- This recipe calls for graham instead of white flour.
