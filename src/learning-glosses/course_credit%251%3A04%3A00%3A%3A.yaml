simpleMeaning: A college or university's formal note that a student has finished a set of classes well,
  usually counted in hours for each term
scope: This is a college or university's formal note that a student has finished a set of classes well;
  credit is another name for it; not the whole degree itself, and not a mark given for one piece of work.
examples:
- She earned three course credits last term.
- He needs one more course credit to finish the year.
