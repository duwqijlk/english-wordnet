simpleMeaning: A tropical American aroid with underground stems good to eat, cooked and eaten like yams
  or potatoes
scope: Also called malanga, spoonflower, tannia, yautia and Xanthosoma atrovirens; the name for one kind
  of food plant, not for yams or potatoes themselves.
examples:
- Xanthosoma sagittifolium grows in warm wet ground.
- We cooked Xanthosoma sagittifolium tubers like potatoes.
