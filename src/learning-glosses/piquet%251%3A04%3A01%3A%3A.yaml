simpleMeaning: a military punishment used by the British in the late 1600s, in which a soldier had to
  stand on one foot on a sharp stake
scope: 'Also called picket: a military punishment used by the British in the late 1600s, in which a soldier
  stood on one foot on a sharp stake, not a prison term and not a beating.'
examples:
- The soldier was given piquet for falling asleep on guard.
- Piquet forced a man to stand on one foot on a pointed stake.
