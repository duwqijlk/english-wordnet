simpleMeaning: the curved bone under the eye that makes the raised part of the cheek
scope: This is the curved bone under the eye that makes the raised part of the cheek, also called zygomatic
  bone, cheekbone, jugal bone, malar, malar bone and os zygomaticum; not the jaw and not the bone above
  the eye.
examples:
- Her zygomatic was broken in the fall and her cheek sank.
- The doctor pressed gently on the zygomatic to check for a crack.
