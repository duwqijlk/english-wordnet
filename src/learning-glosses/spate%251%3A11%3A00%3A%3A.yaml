simpleMeaning: a flow of water caused by sudden rain or by melting snow
scope: 'Also called freshet: this is water flowing after sudden rain or melting snow, not the rain or
  the melting on its own.'
examples:
- After the storm, a spate carried muddy water down the river.
- A sudden spate from the melting snow filled the stream.
