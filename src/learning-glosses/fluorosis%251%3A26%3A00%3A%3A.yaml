simpleMeaning: A sickness caused by taking in too much fluorine, usually in drinking water.
scope: A sickness caused by taking in too much fluorine, usually in drinking water; not a sickness from
  too little fluorine and not a sickness from dirty water.
examples:
- Fluorosis can mark the teeth when children take in too much fluorine.
- Drinking water with too much fluorine can lead to fluorosis.
