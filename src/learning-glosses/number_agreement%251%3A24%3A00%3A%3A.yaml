senseId: 'number_agreement%1:24:00::'
synsetId: 13819773-n
simpleMeaning: In grammar, words in the same group matching in being one or more than one, as when a word
  that tells more about a noun matches it
scope: In grammar, words in the same group matching in being one or more than one; not words matching
  in time and not words matching in person.
examples:
- Number agreement means 'these books' matches, but 'this books' does not.
- Number agreement fails when a singular verb follows a plural noun.
