simpleMeaning: A mental illness with false beliefs of persecution, greatness or jealousy, and anger, anxiety,
  aloofness and gender doubts; they usually appear presentable and function normally unless acting on
  them.
scope: Its own condition, a mental illness dominated by false beliefs; it is not simply another name for
  paranoid schizophrenia or paranoic type schizophrenia.
examples:
- The psychiatrist used the term paraphrenia for a chronic delusional illness that had left the patient's
  day-to-day functioning largely intact.
- In paraphrenia, the patient may seem perfectly presentable while holding elaborate false beliefs.
