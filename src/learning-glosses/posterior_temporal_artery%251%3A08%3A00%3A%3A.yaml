simpleMeaning: The back part of the outer layer of the brain by the ear gets its blood from this tube.
scope: Also called arteria temporalis posterior, this tube feeds the back part of the outer layer of the
  brain by the ear.
examples:
- Blood reaches the back of the brain's outer layer through the posterior temporal artery.
- The posterior temporal artery runs by the ear, feeding the brain there.
