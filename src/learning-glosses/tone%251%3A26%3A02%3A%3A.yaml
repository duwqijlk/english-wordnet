simpleMeaning: the elastic firmness of living muscles, arteries and similar tissue that lets them respond
  to stimulation.
scope: The firmness of body tissue, not the mood of a place, a shade of colour, or a musical sound.
examples:
- The doctor checked the tone of my muscles after the injury.
- Good muscle tone helps you stay steady on your feet.
