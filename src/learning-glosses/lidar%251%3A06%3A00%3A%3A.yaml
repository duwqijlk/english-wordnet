simpleMeaning: A system that finds where things are, like radar (which finds things with radio waves)
  but with light from a laser, and may find rough air that can affect planes
scope: This is the light-based system for finding things and rough air, not radar itself, which uses radio
  waves.
examples:
- The plane uses lidar to check the air ahead of it.
- Lidar helped the car find things in the dark.
