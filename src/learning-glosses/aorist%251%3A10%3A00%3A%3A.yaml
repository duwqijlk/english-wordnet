simpleMeaning: A verb form in some tongues, as Greek and Sanskrit, that tells of an act, especially a
  past act, without saying if it is done or goes on.
scope: Of a verb form in Greek or Sanskrit, marking the past without saying if the act is done.
examples:
- Their aorist marked the past.
- The aorist was plain in the text.
