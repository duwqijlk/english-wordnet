senseId: 'presymptomatic%3:01:00::'
synsetId: 02794218-a
simpleMeaning: about the first part of an illness, before signs of it have shown and when doctors can
  not yet tell what it is
scope: Also called preclinical, this is about the first part of an illness before its signs have shown,
  not the time after signs have shown and a doctor can tell what it is.
examples:
- Doctors studied presymptomatic patients to learn how the illness starts.
- The presymptomatic stage of the disease is hard to spot.
