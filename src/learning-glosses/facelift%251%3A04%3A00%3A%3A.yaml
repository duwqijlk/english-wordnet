simpleMeaning: surgery to take lines and other signs of age from the face; a cut is made near the hair
  line, skin is pulled back, and extra flesh is cut away
scope: 'Also called lift, cosmetic surgery, face lift, face lifting, nip and tuck, rhytidectomy and rhytidoplasty:
  surgery on the face to take away signs of age, not new work that only makes a building look better.'
examples:
- She had a facelift to remove the deep lines on her face.
- After his facelift, his face looked younger and the skin felt tight.
