simpleMeaning: A well-known garden plant from North America with sweet-smelling flowers in red, purple,
  yellow or white that open late in the day.
scope: Also called common four-o'clock, marvel-of-Peru and Mirabilis jalapa; a garden plant with sweet-smelling
  flowers of many colours that open late in the day, not the California four o'clock with purple-red flowers
  only.
examples:
- Mirabilis uniflora opened its flowers late in the afternoon.
- She planted Mirabilis uniflora by the fence.
