simpleMeaning: Its fat young give a grease used in place of butter, and this fruit eater from South America
  flies at night.
scope: Also called guacharo, it is known for its fat young, whose grease is used in place of butter, and
  for flying at night to eat fruit in South America.
examples:
- The oilbird flew out at night to feed on fruit.
- The oilbird's fat young gave a grease used in place of butter.
