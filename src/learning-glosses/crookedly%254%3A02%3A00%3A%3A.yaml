simpleMeaning: in a way that is not straight, with one side lower or different from the other
scope: 'Also called lopsidedly: in a way that is not straight or even, not in a dishonest way.'
examples:
- The picture hung crookedly on the wall.
- He smiled crookedly, with one side of his mouth higher than the other.
