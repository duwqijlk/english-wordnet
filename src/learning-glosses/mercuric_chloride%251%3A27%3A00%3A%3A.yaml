simpleMeaning: Vapour turns into a white poisonous crystal of quicksilver; it comes apart in water and
  is used to kill pests, to clean wounds, and to keep wood from rotting.
scope: Bichloride of mercury, corrosive sublimate and mercury chloride are other names for this white
  poisonous crystal made from quicksilver.
examples:
- Mercuric chloride was used as a pesticide.
- Mercuric chloride was used to keep wood from rotting.
