simpleMeaning: A program on a computer that makes copies of itself and spreads to other computers over
  a network
scope: A self-copying computer program, not a small soft animal, not a nasty person, and not a thread
  on a gear.
examples:
- Worms spread fast because computers send files to each other on their own.
- A worm got into our office computers and made copies of itself on every one.
