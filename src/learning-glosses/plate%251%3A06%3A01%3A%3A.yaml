simpleMeaning: A protective metal covering of even thickness, such as the shield fixed to an artillery
  gun that guards the soldiers firing it.
scope: This is a protective metal covering of even thickness — scale is another name for it — not a plain
  sheet of metal and not the charged part inside a vacuum tube.
examples:
- A steel plate on the gun shielded the crew from fragments.
- The gunners crouched behind the plate while they loaded.
