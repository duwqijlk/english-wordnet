simpleMeaning: A small sore raised spot on the skin that does not make pus, as in chicken pox.
scope: A small raised sore spot on the skin, not a blister full of fluid and not a pimple with pus.
examples:
- A papule appeared on his arm after the rash.
- Chicken pox left papules across her back.
