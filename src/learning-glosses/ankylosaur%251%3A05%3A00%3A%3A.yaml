simpleMeaning: A creature whose back was covered with thick hard plates and whose walk, it is thought,
  spread its legs wide like a lizard
scope: This is also called an ankylosaurus, and it is not a lizard, though its walk is said to have looked
  like a lizard's.
examples:
- The ankylosaur had thick hard plates over its back.
- The ankylosaur is thought to have walked with its legs spread wide like a lizard.
