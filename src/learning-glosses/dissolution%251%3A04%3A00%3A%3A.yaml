simpleMeaning: the end of a link between people or between countries, when the link breaks apart
scope: 'Also called breakup: the end of a link between people or countries, not the sense about giving
  in too much to bodily pleasure.'
examples:
- The dissolution of their marriage was agreed after long talks.
- Talks failed and led to the dissolution of the union between the two countries.
