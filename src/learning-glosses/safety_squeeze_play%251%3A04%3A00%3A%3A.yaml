simpleMeaning: In baseball, a move in which the runner at third base holds back until the batter's bunt
  has worked
scope: 'Also called a safety squeeze: in baseball, a move in which the runner at third holds back until
  the batter''s bunt has worked, not a steal of home and not a hit-and-run.'
examples:
- The safety squeeze play scored the winning run in the ninth.
- They tried a safety squeeze play, but the bunt went foul.
