simpleMeaning: A small parakeet of Australia, usually light green in the wild, with black and yellow marks,
  and bred in many colours.
scope: A small Australian parakeet, also called a budgie, a lovebird, a budgereegah, a budgerygah, or
  a grass parakeet, usually light green with black and yellow marks in the wild, but bred in many colours.
examples:
- The budgerigar sang from its cage, light green with black and yellow marks.
- Her budgerigar was bright blue, one of the many colours they are bred in.
