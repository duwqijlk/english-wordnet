simpleMeaning: any of three substances, including a common solvent and two acids, produced when fats are
  broken down for energy; they build up in blood and urine in some metabolic disorders
scope: Another name for the same three-substance group as ketone body; not acetone on its own or ketones
  in general.
examples:
- Doctors found acetone bodies in the urine sample.
- The old test looked for acetone bodies in the blood.
