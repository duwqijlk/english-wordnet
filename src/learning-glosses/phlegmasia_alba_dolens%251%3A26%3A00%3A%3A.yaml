simpleMeaning: A sore clot in the big vein of the leg that comes after giving birth.
scope: A sore clot in the big vein of the leg that comes after giving birth; milk leg is another name
  for this sense, not a bruise and not a clot in the arm.
examples:
- Phlegmasia alba dolens left her leg swollen after the birth.
- The doctor treated phlegmasia alba dolens with blood thinners.
