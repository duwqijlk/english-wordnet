simpleMeaning: to rewrite a mathematical equation in a simpler form by swapping one expression for another
scope: This is about changing the written form of an equation, not about making an idea or problem less
  complicated, not about making an amount smaller and not about shortening a text.
examples:
- The teacher showed us how to reduce the equation to x = 4.
- After you reduce the formula, the answer becomes obvious.
