simpleMeaning: A vehicle light setting that gives enough light ahead and to the sides without blinding
  other road users, used whenever other vehicles are ahead.
scope: The dipped setting of a vehicle headlight, not the bright main or high beam; low, passing and meeting
  are different names for the same thing.
examples:
- The mechanic replaced the cracked low beam headlamp on the driver's side.
- Switch to your low beam headlamps when a car comes toward you.
