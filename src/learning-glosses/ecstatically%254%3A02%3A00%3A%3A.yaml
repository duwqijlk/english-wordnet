simpleMeaning: in a way that shows very great joy and excitement
scope: This describes doing something with very great joy. It is stronger than just happily, and not in
  a calm or sad way.
examples:
- She shouted ecstatically when she heard she had won.
- The fans cheered ecstatically as the team scored the winning goal.
