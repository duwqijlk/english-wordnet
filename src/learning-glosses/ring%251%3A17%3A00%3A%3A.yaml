simpleMeaning: In chemistry, a closed loop of atoms joined together within a molecule
scope: This is a loop of atoms inside a molecule; it is not a solid metal band and not the general round
  shape.
examples:
- Benzene contains a ring of six carbon atoms.
- The molecule has a nitrogen ring at its centre.
