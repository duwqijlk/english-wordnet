simpleMeaning: easily taking part in chemical changes with other substances
scope: For a substance, taking part in chemical changes easily; not the sense of a person or thing answering
  to a signal or to something acting on it.
examples:
- Sodium is a reactive metal that changes fast in water.
- Free radicals are very reactive and join with other substances at once.
