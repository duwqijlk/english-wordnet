simpleMeaning: In this form of a severe mind illness, only mild signs show, or a leaning toward the illness
  is already there.
scope: Also called latent schizophrenia, this is a mild form of a severe mind illness, not the full illness
  with strong signs.
examples:
- His borderline schizophrenia showed only in small ways.
- Her borderline schizophrenia meant only mild signs showed.
