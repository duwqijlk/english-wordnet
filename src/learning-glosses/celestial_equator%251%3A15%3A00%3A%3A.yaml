simpleMeaning: the great ring on the round sky above us, halfway between its north and south poles
scope: The great ring on the round sky above us, halfway between its poles; equinoctial, equinoctial circle
  and equinoctial line are other names for this sense, not the Earth's equator and not the line where
  sky meets land.
examples:
- The celestial equator runs halfway between the sky's two poles.
- Stars cross the celestial equator as the Earth turns.
