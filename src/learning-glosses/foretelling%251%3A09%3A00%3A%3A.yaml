simpleMeaning: the skill or gift of saying what will happen before it happens, or pretending to have that
  gift, by means beyond the natural world
scope: 'Also called divination: saying what will happen by means beyond the natural world, or pretending
  to do so, not a plain guess based on facts.'
examples:
- Her foretelling came from dreams she believed were sent by spirits.
- People paid him for foretelling, though he only pretended to see the future.
