simpleMeaning: The ideas of the people who began the Oxford movement, set out in small books called ‘Tracts
  for the Times’
scope: These are the ideas of the people who began the Oxford movement, set out in small books called
  ‘Tracts for the Times’; Tractarianism is another name for this sense, and it is the teaching of the
  movement, the ideas behind it rather than the movement as a whole.
examples:
- Puseyism set out the ideas of the Oxford movement in the ‘Tracts for the Times’.
- The founders of the Oxford movement spread Puseyism in small books.
