simpleMeaning: The forward step in a motor vehicle's set of toothed wheels that is one step above the
  lowest step
scope: The forward step in a motor vehicle's set of toothed wheels that is one step above the lowest step,
  also called second; not the lowest step and not the next step up.
examples:
- He had to shift down into second gear to make the hill.
- Second gear gave the car more pull on the slope.
