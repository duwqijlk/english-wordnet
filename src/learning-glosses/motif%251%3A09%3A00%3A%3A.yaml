senseId: 'motif%1:09:00::'
synsetId: 05928866-n
simpleMeaning: an idea that links a piece of writing or art together and comes back again and again in
  it
scope: An idea that comes back in writing or art, also called theme; it is not a pattern of shapes or
  colors, and not a part that comes back in music.
examples:
- Love is a common motif in her novels.
- The book uses the sea as a motif that comes back in every part.
