simpleMeaning: A way of building that follows the books and buildings of Andrea Palladio (1508-80), a
  thinker and builder from Vicenza.
scope: It is a way of building that follows the books and buildings of Andrea Palladio of Vicenza; other
  ways of building follow other builders and other books.
examples:
- Palladianism shaped the great houses of the 1700s.
- The villa shows Palladianism in its plain front and tall windows.
