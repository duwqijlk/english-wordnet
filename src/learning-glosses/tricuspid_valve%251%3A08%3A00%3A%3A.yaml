senseId: 'tricuspid_valve%1:08:00::'
synsetId: 05401339-n
simpleMeaning: A flap with three points, set between the right upper and lower heart rooms, letting blood
  pass down and shutting to stop back-flow when the lower room squeezes.
scope: This sense is also called right atrioventricular valve.
examples:
- A tricuspid valve shut to stop back-flow.
- Tricuspid valves sit in the heart.
