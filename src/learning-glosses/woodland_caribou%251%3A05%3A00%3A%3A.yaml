simpleMeaning: One of several kinds of big deer-like animals in the cone-bearing forests of south Canada,
  counted by some as part of the kind called Rangifer tarandus.
scope: Some count this big deer-like animal of the cone-bearing forests of south Canada as part of the
  kind called Rangifer tarandus.
examples:
- The woodland caribou live in the cone-bearing forests of south Canada.
- Some count the woodland caribou as part of the kind called Rangifer tarandus.
