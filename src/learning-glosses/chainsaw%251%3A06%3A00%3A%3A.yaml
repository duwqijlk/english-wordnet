simpleMeaning: A saw you can carry, driven by power, with teeth joined in a chain that goes round without
  end
scope: A portable power saw with teeth in an endless chain; not a hand saw and not a saw for cutting metal.
examples:
- He cut the fallen tree with a chainsaw.
- The chainsaw buzzed as it bit into the log.
