simpleMeaning: An ordinary share in a firm known across the country, whose worth and payouts can be trusted,
  most often costly with a small return.
scope: An ordinary share in a firm known across the country, whose worth and payouts can be trusted, most
  often costly with a small return; blue chip is another name for this sense, not a share in a small firm
  and not a share with a high return.
examples:
- A blue-chip stock is a safe place for savings.
- He holds blue-chip stocks from big firms.
