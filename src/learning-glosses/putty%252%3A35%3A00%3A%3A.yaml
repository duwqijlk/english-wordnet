simpleMeaning: to put a soft material on or into a place to fix it or fill a space in it
scope: This sense is the act of putting the soft material into a place to fix or fill it. It is not the
  soft material itself.
examples:
- He puttied the hole in the wooden door before painting it.
- They puttied around the window to fill the gaps.
