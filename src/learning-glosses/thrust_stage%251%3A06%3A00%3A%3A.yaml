simpleMeaning: a raised floor for actors that sticks out into the part of the room where the crowd sits,
  with seats on three sides
scope: This is a raised floor for actors with seats on three sides, not the usual flat stage at the front
  of the room and not a device that holds a turning part.
examples:
- The actors used the thrust stage to play close to the crowd.
- Our thrust stage has seats on three sides of the actors.
