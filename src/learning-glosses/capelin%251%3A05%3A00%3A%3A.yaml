simpleMeaning: A very small fish from northern seas that is food for sea birds, sea mammals, and other
  fishes.
scope: A tiny northern fish, also called capelan and caplin; not a larger food fish and not a freshwater
  fish.
examples:
- Capelin gather in huge shoals off the northern coast.
- Whales eat capelin in great numbers.
