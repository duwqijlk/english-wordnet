simpleMeaning: In cosmology, the idea that the universe began 10 to 20 billion years ago when a tiny bit
  of stuff burst apart at high heat, its matter packed tight.
scope: Also called big bang theory, this is the idea in cosmology that the universe began 10 to 20 billion
  years ago from a tiny bit of stuff bursting apart.
examples:
- The big-bang theory says the universe began 10 to 20 billion years ago.
- In the big-bang theory, a tiny bit of stuff burst apart at high heat.
