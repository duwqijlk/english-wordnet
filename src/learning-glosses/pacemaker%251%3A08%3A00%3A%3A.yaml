simpleMeaning: A small part of the heart, made of special tissue, that sets the pace of the heartbeat.
scope: A small part of the heart itself that sets the pace of the heartbeat, not the implanted electronic
  device that takes over this work.
examples:
- The pacemaker sends the signal that starts each heartbeat.
- Doctors checked the pacemaker to see why their heart beat so slowly.
