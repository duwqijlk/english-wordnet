simpleMeaning: Too heavy or too long, monthly bleeding can point to growths in the womb and can leave
  the blood weak if it lasts.
scope: Hypermenorrhea is another name for this monthly bleeding that is too heavy or goes on too long.
examples:
- Her menorrhagia pointed to growths in her womb.
- Her menorrhagia left her blood weak.
