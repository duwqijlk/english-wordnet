simpleMeaning: A climbing shrub that loses its leaves in winter, with sweet-smelling yellow-white flowers
  in rings around the stem joints.
scope: Also called Italian woodbine and Lonicera caprifolium, this climbing shrub loses its leaves in
  winter and bears sweet-smelling yellow-white flowers in rings around the stem joints; not a low bush
  or a shrub with single flowers at the stem tips.
examples:
- Italian honeysuckle climbed over the fence.
- The Italian honeysuckle smelled sweet in the evening.
