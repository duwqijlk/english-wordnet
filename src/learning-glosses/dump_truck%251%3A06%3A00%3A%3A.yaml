synsetId: 03260869-n
simpleMeaning: 'This motor vehicle empties its load without handling: the front end is lifted by air,
  and the load slides out by its own weight'
scope: It is also called tipper, dumper, tip truck, tipper lorry, and tipper truck, a motor vehicle that
  empties its load by lifting its front end, not a vehicle that must be unloaded by hand.
examples:
- The dump truck emptied its load without handling.
- Air lifted the front end of the dump truck, and the load slid out.
