simpleMeaning: The part of a key that goes into a lock and lifts the small moving parts inside.
scope: This is not the cutting end of a drill, a unit for measuring information, or the metal piece in
  a horse's mouth; it is the working end of a key.
examples:
- The key's bit was worn smooth, so the lock would not open.
- He filed the bit until the key slid easily into the lock.
