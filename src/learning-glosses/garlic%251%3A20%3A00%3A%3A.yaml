simpleMeaning: A plant with a round bulb from southern Europe, now growing in many places; its bulb splits
  into small parts with a strong taste.
scope: The plant itself, with its round bulb that splits into strong-tasting parts, not the bulb used
  only as a seasoning.
examples:
- Garlic grows well in the warm south.
- She planted garlic along the edge of the garden.
