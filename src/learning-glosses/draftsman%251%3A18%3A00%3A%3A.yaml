simpleMeaning: a man whose job is to put the plans for a building or a machine down on paper
scope: A man who draws plans for buildings or machines, also called a draughtsman, not a builder and not
  an artist who draws pictures.
examples:
- The draftsman drew the plans for the new school.
- She asked the draftsman to change the size of the kitchen.
