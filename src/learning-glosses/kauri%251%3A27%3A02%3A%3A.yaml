simpleMeaning: Most often found as old buried remains, this resin from trees of New Zealand is also gathered
  to make shiny coats for wood and floor cover.
scope: Kauri copal, kauri gum, and kauri resin are other names for this resin from trees of New Zealand,
  not the pale wood of the same tree.
examples:
- Kauri was found as old buried remains in the ground.
- They gathered kauri to make shiny coats for wood.
