simpleMeaning: A tube that glows when power runs through it gives the light from this lamp fixed in place
scope: 'Also called a fluorescent: a lamp fixed in place whose light comes from a glowing tube, not a
  lamp with a bare bulb and not a lamp you can carry.'
examples:
- The fluorescent fixture above the workbench buzzed softly.
- They replaced the old fluorescent fixture in the kitchen.
