simpleMeaning: After green flowers in bunches come red berries, on a common harmless shrub of eastern
  North America with waxy leaves split into small leaflets.
scope: Also called scarlet sumac and smooth sumac, it is a common harmless shrub of eastern North America
  with green flowers in bunches and red berries.
examples:
- The vinegar tree stood by the path, its red berries following the green flowers.
- We saw a vinegar tree in the woods of eastern North America.
