simpleMeaning: in a way that shows you want to keep a person or thing for yourself alone
scope: Done in a way that shows you want to keep a person or thing for yourself alone, not just owning
  something or holding it in your hand.
examples:
- He put one arm possessively around his wife as they walked in.
- She held the bag possessively and would not let anyone else touch it.
