senseId: 'external_auditory_canal%1:08:00::'
synsetId: 05256010-n
simpleMeaning: one of the two tubes in the outer ear that carry sound from the outer flap to the thin
  skin that vibrates
scope: This is a tube in the outer ear; acoustic meatus, auditory canal, auditory meatus and ear canal
  are other names for this sense; not the inner ear and not the ear flap itself.
examples:
- The external auditory canal leads from the ear flap to the eardrum.
- Wax can block the external auditory canal.
