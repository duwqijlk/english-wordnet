simpleMeaning: a change in how well something lets power flow through it when it takes in light or other
  rays
scope: A change in how well a substance lets power flow through it when it takes in light or other rays;
  photoconduction is another name for this sense, not a change in how well a substance lets heat flow
  and not the power itself.
examples:
- Photoconductivity is the change in how well a substance lets power flow when it takes in light.
- They measured the photoconductivity of the new material under a bright lamp.
