simpleMeaning: the study of shapes and their features that stay the same when a shape is shown on a flat
  surface
scope: The study of shape features that stay the same when a shape is shown on a flat surface, also called
  projective geometry; not the study of lengths or angles.
examples:
- Descriptive geometry shows which features of a shape stay the same in a drawing.
- In descriptive geometry, she learned which parts of a shape stay the same when it is drawn flat.
