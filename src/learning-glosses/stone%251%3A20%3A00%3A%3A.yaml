simpleMeaning: the hard, usually woody inner layer of a fruit's wall that holds its seed, as in peaches
  or plums
scope: This is the hard pit inside fruit that holds the seed, not the unit of weight, not a polished gemstone,
  and not ordinary building rock.
examples:
- She bit into the plum and cracked a tooth on the stone.
- Remove the stones from the olives before serving the salad.
