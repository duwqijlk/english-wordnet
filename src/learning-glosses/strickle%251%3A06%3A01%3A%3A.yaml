senseId: 'strickle%1:06:01::'
synsetId: 04344641-n
simpleMeaning: a tool or rod used to scrape the top level of grain or other loose stuff piled up in a
  measure
scope: A tool or rod used to scrape the top level of grain in a measure; not a knife and not a scoop for
  moving grain.
examples:
- He used a strickle to level off the grain in the measure.
- The miller ran a strickle across the top of the full measure.
