simpleMeaning: To stand firm in holding to one's own views and rights until others accept them
scope: Standing firm in holding to one's own views and rights until others accept them, not stating a
  thing as true in a solemn formal way and not merely putting forward a claim.
examples:
- She asserted herself at the meeting and would not be talked down.
- He asserted his right to speak before the crowd.
