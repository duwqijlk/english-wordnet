simpleMeaning: A brief sudden spell in which a person loses awareness and does not remember it, sometimes
  with slight twitching or fluttering eyelids; common in petit mal epilepsy.
scope: 'Another name for the medical absence: a brief spell of lost awareness, not a convulsive fit and
  not an ordinary period away.'
examples:
- The doctor said the staring spells were absence seizures.
- Absence seizures are common in children with petit mal epilepsy.
