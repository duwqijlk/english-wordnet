simpleMeaning: In verse, each stressed beat in a line starts with the same consonant sound
scope: In verse, the same consonant sound at the start of each stressed beat in a line, also called alliteration,
  beginning rhyme or head rhyme; not rhyme at the ends of lines and not mere repetition of a word.
examples:
- The poet used initial rhyme in 'around the rock the ragged rascal ran'.
- Her initial rhyme gives the verse a strong beat.
