simpleMeaning: a person trained in the study of language and in how machines work who uses machines to
  work with human language
scope: A person trained in language and machines who gets machines to work with human speech and writing;
  not a translator and not a machine builder.
examples:
- The computational linguist built a tool that sorts text by topic.
- As a computational linguist, she teaches machines to read human writing.
