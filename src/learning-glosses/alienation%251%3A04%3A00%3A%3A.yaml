simpleMeaning: the act of making a person or group stop being friendly towards someone
scope: This is the act of making a person or group stop being friendly towards someone; it is not a separation
  that comes from hostility, not the law sense about giving land or buildings to another person, and not
  the feeling of being cut off from others.
examples:
- His rude words led to the alienation of his old friends.
- The new rules caused the alienation of many workers from the boss.
