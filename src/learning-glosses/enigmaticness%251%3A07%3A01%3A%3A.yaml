schema: oewn-learning-gloss-v2
senseId: 'enigmaticness%1:07:01::'
synsetId: 92418479-n
simpleMeaning: the state of being hard to make sense of, with many hard parts, so a thing seems full of
  mystery and cannot be explained
scope: The state of being hard to make sense of, not a thing that is clear and simple and not a secret
  kept from others on purpose.
examples:
- The enigmaticness of her smile left us all guessing what she meant.
- He was struck by the enigmaticness of the old house, with its locked doors and strange sounds.
