simpleMeaning: Feel deep happiness and well-being, as when you are healthy or moved by strong emotion.
scope: To feel deeply happy and well inside, with glow, beam and radiate as other names for it; not giving
  out light or having a bright face.
examples:
- She shone with pride at her son's graduation.
- His eyes shone with joy when he saw the gift.
