senseId: 'formol%1:27:00::'
synsetId: 14872649-n
simpleMeaning: A mix of one part formaldehyde, a strong-smelling chemical, in nine parts water, used to
  kill germs or to keep dead plants and animals from rotting.
scope: A weak mix of formaldehyde in water used to kill germs or keep dead things; formalin is another
  name for this sense, not pure formaldehyde and not a medicine for living people.
examples:
- The formol in the jar kept the frog from rotting.
- She wore gloves when she poured the formol.
