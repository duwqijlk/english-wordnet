simpleMeaning: A flat card with electrical paths printed on it that fits into an empty connector inside
  a computer to give it new abilities.
scope: This sense is a circuit card added inside a computer, not a panel of switches and meters used to
  control machinery.
examples:
- He opened the case and slid a new graphics board into an empty slot.
- The old computer kept freezing until she added a memory board.
