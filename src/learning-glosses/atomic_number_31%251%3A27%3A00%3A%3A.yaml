simpleMeaning: A rare silver-coloured metal, most often with three joins; it breaks easily when cold but
  melts just above room heat, found in tiny amounts in bauxite and zinc ores.
scope: Also called Ga and gallium; a rare silver-coloured metal, not one that stays solid when warm.
examples:
- Atomic number 31 is the place of gallium in the list of elements.
- Gallium has atomic number 31.
