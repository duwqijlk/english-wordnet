simpleMeaning: on a shield that bears coats of arms, set in the two quarters that lie across from each
  other
scope: On a shield, set in the two quarters that lie across from each other; not once every three months,
  and not a book that comes out four times a year.
examples:
- The two coats of arms were borne quarterly on the shield.
- Quarterly, the lion and the tower stood across from each other.
