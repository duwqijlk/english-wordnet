simpleMeaning: A doctor cuts through the belly and womb of the mother to bring out the baby, a way of
  birth once thought to be how Julius Caesar was born.
scope: Also called cesarean, caesarian, cesarian, abdominal delivery, caesarean, caesarean section, caesarian
  delivery, caesarian section, cesarean delivery, cesarean section, and cesarian section, this is a birth
  by a cut through the belly and womb, not a birth through the birth canal.
examples:
- Her caesarean delivery went well, and the baby was healthy.
- The hospital plans a caesarean delivery for next week.
