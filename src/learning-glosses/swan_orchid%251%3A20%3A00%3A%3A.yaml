simpleMeaning: any of several orchids of the group Cycnoches, with slim curving stalks of blooms that
  call to mind a big white water bird
scope: Also called a swan-flower, a swan-neck, a swanflower, and a swanneck; an orchid with slim curving
  flower stems, not a swan and not a water lily.
examples:
- The swan orchid opened its blooms on slender arching stems.
- A swan orchid in the glasshouse looked like a flock of white birds.
