simpleMeaning: The swapping of parts between paired, matching chromosomes (parts in a cell that carry
  genes) at the first stage of meiosis (when a cell splits to make sex cells)
scope: 'Also called crossing over: the swapping of parts between matching chromosomes in a cell. It is
  not the music sense, not a path across a road or railway, and not a voter who votes in another party''s
  primary vote.'
examples:
- Crossover between the two chromosomes swapped small sections of DNA.
- During meiosis, crossover helps mix genes from the mother and the father.
