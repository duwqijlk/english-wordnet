simpleMeaning: a bush or tree from cool northern areas with toothed leaves and cone-like fruit; its bark
  is used to make leather and dye, and its wood does not rot easily
scope: This sense is the living bush or tree, also called alder tree; it is not the wood that comes from
  such a tree.
examples:
- The alder grows well near the wet river bank.
- Small cones hang from the alder in winter.
