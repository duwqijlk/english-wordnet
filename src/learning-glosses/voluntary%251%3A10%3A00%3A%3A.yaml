senseId: 'voluntary%1:10:00::'
synsetId: 07054871-n
simpleMeaning: a piece of music, often made up as it is played, for one instrument alone, especially an
  organ, and not a regular part of a religious service or a performance
scope: This is a piece of music for one instrument; it is not the word for something done by choice, or
  work done for free with no pay.
examples:
- She made up a voluntary on the organ as people were leaving the church.
- For his exam, he wrote a voluntary for one violin alone.
