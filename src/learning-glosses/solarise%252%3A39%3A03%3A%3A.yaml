simpleMeaning: To turn back some tones of a film or print and bring in sharp rims round the lights, by
  a short flash of light, then washing and working it again.
scope: This sense is also called solarize.
examples:
- They solarise the print, turning back some tones.
- Solarise the film to bring in sharp rims.
