simpleMeaning: a word whose meaning changes with the speaker, hearer, and the place and time of the talk,
  naming who or what is meant or where or when something is
scope: 'Also called deictic: a word whose meaning shifts with who speaks and where and when, not a word
  with a fixed meaning, and not the act of pointing itself.'
examples:
- The deictic word 'here' means a different place each time a new speaker uses it.
- In the sentence 'I will meet you there', the deictic word 'there' points to a place known from the talk.
