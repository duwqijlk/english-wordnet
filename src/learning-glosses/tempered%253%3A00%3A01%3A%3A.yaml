schema: oewn-learning-gloss-v2
senseId: 'tempered%3:00:01::'
synsetId: 01525258-a
simpleMeaning: changed to be more balanced by adding something that works against it
scope: This describes a thing made more balanced by adding an opposite part; it is not metal made hard
  by heat and cold, and it is not a person holding back anger.
examples:
- His praise was tempered with honest words about what was wrong.
- Hope tempered by real facts kept her calm and clear.
