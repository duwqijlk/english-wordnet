simpleMeaning: One of many kinds of plant in one group, its leaves are leaflets set in pairs along a stalk,
  and seeds in a long thin pod follow mostly yellow flowers.
scope: Also called pea tree, it is one of many kinds of plant in one group, with mostly yellow flowers
  and seeds in a long thin pod.
examples:
- We planted a caragana for its yellow flowers.
- The caragana had seeds in a long thin pod after the flowers faded.
