simpleMeaning: the power to produce a lot of growth and to keep that growth strong and rich
scope: 'Also called richness: the power to produce a lot of strong, rich growth, not the power to have
  young and not a count of births in a place.'
examples:
- The fertility of the soil helped the crops grow tall and thick.
- Farmers praised the fertility of the fields after the spring rain.
