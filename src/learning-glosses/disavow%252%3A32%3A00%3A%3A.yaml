simpleMeaning: To refuse to own a thing, saying one knows nothing of it and has no part in it.
scope: Of refusing to own a thing, or to admit any knowledge of it or part in it.
examples:
- The company disavowed the letter, saying it had not sent it.
- He disavowed all knowledge of the plan.
