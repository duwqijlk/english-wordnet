simpleMeaning: A plant with wine, lavender, purple and black flowers in several groups on the upper half
  of leafy stems, from Montana south through the Rockies to Arizona and New Mexico.
scope: Also called Whipple's penstemon; one of many kinds of penstemon, this one with dark flowers in
  groups on leafy stems, growing in the Rocky Mountains from Montana to Arizona and New Mexico.
examples:
- Penstemon whippleanus bloomed in dark purple clusters on the mountain slope.
- We found Penstemon whippleanus growing beside the trail in New Mexico.
