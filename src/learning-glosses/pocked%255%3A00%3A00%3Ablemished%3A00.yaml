simpleMeaning: having small marks on the skin, like the marks left by a skin disease such as acne or smallpox
scope: 'Also called pockmarked: having small marks on the skin from disease, not having holes or pits
  in a paved surface.'
examples:
- His face was pocked after years of bad acne.
- Her pocked skin still showed marks from the disease.
