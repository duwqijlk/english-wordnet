simpleMeaning: In old Greek tales, ugly monsters with snakes for hair, most often three of them, who hunted
  down wrongdoers who had gone unpunished.
scope: Ugly snake-haired monsters of old Greek tales, also called Fury and Eumenides; they hunted down
  wrongdoers who had gone unpunished, most often three of them together.
examples:
- The Erinyes pursued the killer who had escaped all punishment.
- In the play, the Erinyes appear with snakes writhing in their hair.
