simpleMeaning: A flower from China whose rose-lilac blooms have edges cut deep and a purplish centre,
  most often grown for one year only.
scope: This flower is also called a china pink, and unlike flowers that live for many years, it most often
  lives for one year only.
examples:
- The rainbow pink showed rose-lilac blooms with a purplish centre.
- They grew rainbow pink again this year, since it lives for one year only.
