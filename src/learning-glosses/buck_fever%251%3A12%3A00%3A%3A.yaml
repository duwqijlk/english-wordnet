simpleMeaning: the excited, uneasy feeling of a hunter with little practice
scope: The excited, uneasy feeling of a hunter with little practice, not the calm of a hunter with much
  practice and not a real illness with a high temperature.
examples:
- The young hunter got buck fever when the deer stepped out.
- Buck fever made his hands shake as he raised his rifle.
