simpleMeaning: A bad-smelling, somewhat fleshy tropical plant from southeastern Asia, grown for edible
  underground stems, or in greenhouses for its large leaves and showy dark red hood around its flower
  spike.
scope: Also called devil's tongue, snake palm and umbrella arum; a bad-smelling tropical plant grown for
  its underground stems or for show, not a plant grown for its flowers alone and not a tree.
examples:
- Amorphophallus rivieri is grown for its edible corms.
- The dark red hood of Amorphophallus rivieri opened in the greenhouse.
