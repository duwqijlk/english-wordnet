simpleMeaning: shares, or goods to be traded at a later date, that the trader does not own, in the hope
  of buying them back later for less money
scope: Selling shares or goods you do not own, also called short selling; not an ordinary sale of what
  you own, and not a bet on a share price rising.
examples:
- He made money on the short sale after the share price fell.
- A short sale lets a trader gain when prices drop.
