simpleMeaning: A tall plant from North America in the east and from Asia, with berry-like blue fruit and
  a thick, knotty rootstock, used as medicine in former times.
scope: This sense is also called blue cohosh, papoose root, papooseroot, squaw root, and squawroot.
examples:
- Blueberry root has blue fruit.
- Blueberry root was once used as a medicine.
