simpleMeaning: a chemical made by joining parts together, used as plant food and to give nitrogen chemicals
scope: 'Another name for this is cyanamide: a chemical used as plant food and as a source of nitrogen
  chemicals, not plain lime and not a spray that kills weeds.'
examples:
- The farmer spread calcium-cyanamide on the field before sowing.
- Calcium-cyanamide feeds the soil and adds nitrogen to it.
