simpleMeaning: A ceremony in which a person is formally given the symbols of an office and raised to that
  rank.
scope: This is the ceremony that grants an office and its badges, not the simple act of putting on robes,
  money put into a business, or an anatomical covering.
examples:
- The bishop's investment took place in the cathedral before a large congregation.
- The investment of the new chancellor was followed by a banquet in the great hall.
