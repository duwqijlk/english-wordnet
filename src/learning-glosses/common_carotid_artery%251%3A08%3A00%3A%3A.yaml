simpleMeaning: a blood tube that runs up the neck and splits into an outer blood tube and an inner blood
  tube
scope: A blood tube that runs up the neck and splits in two; common carotid is another name for this sense;
  not a blood tube in the arm, and not a vein that carries blood back.
examples:
- The doctor felt the common carotid artery in his neck.
- The common carotid artery splits into two tubes near the jaw.
