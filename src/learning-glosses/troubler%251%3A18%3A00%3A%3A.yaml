simpleMeaning: a person who makes problems for others on purpose
scope: A person who starts problems on purpose, also called troublemaker and trouble maker; not a person
  who argues by chance.
examples:
- The troubler whispered lies until the whole street was quarrelling.
- Do not listen to that troubler; he only wants a fight.
