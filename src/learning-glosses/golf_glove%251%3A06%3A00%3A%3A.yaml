simpleMeaning: A close-fitting hand covering worn by players of the game to hold the club handle firmly.
scope: A hand covering that helps players hold the club handle firmly, not a work glove and not a winter
  glove.
examples:
- He pulled on his golf glove before teeing off.
- Her golf glove gave her a firm grip on the club.
