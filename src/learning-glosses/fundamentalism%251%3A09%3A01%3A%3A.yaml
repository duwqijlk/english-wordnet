simpleMeaning: Holding fast to the first, basic beliefs or teachings of a faith, a set of ideas, or the
  like.
scope: Holding fast to the first, basic beliefs or teachings of a faith, a set of ideas, or the like;
  not the form of Protestantism that takes every word of the holy books as plain truth.
examples:
- His fundamentalism left no room for doubt about the old teachings.
- The movement's fundamentalism held fast to the first beliefs of the faith.
