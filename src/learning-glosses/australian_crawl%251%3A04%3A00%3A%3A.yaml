simpleMeaning: A way of swimming in which the arms reach forward over the head in turn, with quick small
  kicks of the legs.
scope: This is a way of swimming with arms reaching forward over the head in turn and quick small kicks;
  crawl and front crawl are other names for it, and it is not the breaststroke, where the arms move together
  under the water, or a stroke done on the back.
examples:
- He crossed the pool with a fast Australian crawl.
- She learned the Australian crawl at her swimming lessons.
