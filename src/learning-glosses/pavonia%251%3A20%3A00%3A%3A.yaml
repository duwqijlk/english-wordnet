simpleMeaning: Any of many green plants that stay green all year and bear white, yellow, or purple flowers
scope: Any of many green plants that stay green all year and bear white, yellow, or purple flowers, not
  a tree and not a plant that loses its leaves in winter.
examples:
- The pavonia in the garden had purple flowers.
- She planted pavonia along the sunny wall.
