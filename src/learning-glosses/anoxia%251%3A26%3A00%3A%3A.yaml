simpleMeaning: When the air breathed in, the blood, and the body tissues hold no oxygen at all, the body
  is left with far too little of it.
scope: A state of no oxygen at all in the body, not just a small lack of it.
examples:
- The test showed anoxia, with no oxygen in the blood or tissues.
- Anoxia means the body is getting no oxygen at all.
