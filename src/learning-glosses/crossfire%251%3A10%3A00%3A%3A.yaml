simpleMeaning: A lively talk in which people give ideas and opinions to each other with strong feeling
scope: A lively talk where ideas and opinions go back and forth with strong feeling, not gunfire coming
  from two or more points so that the lines of fire cross.
examples:
- There was lively crossfire between the two writers about how schools should teach reading.
- The meeting turned into crossfire as members argued strongly about the new budget.
