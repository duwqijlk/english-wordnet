simpleMeaning: A great shaking or violent change in the land or in the order of things, as in an earthquake
scope: A violent shaking of the land or of a whole order of things, not a fit of shaking muscles in the
  body.
examples:
- The convulsion of the earthquake shook the whole city.
- The war brought a great convulsion to the old order of the country.
