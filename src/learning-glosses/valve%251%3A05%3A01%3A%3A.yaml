simpleMeaning: the whole single shell of a snail or of certain other soft sea animals
scope: The whole single shell of a snail or a similar soft sea animal, not a device that controls the
  flow of a liquid and not one of a pair of hinged shells.
examples:
- The whole valve of the snail lay empty on the sand.
- He picked up a valve from a sea snail and put it in his pocket.
