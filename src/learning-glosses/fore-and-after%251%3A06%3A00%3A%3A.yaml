simpleMeaning: A boat with sails that run from the front to the back, along the boat's length.
scope: A boat with front-to-back sails, not a boat with sails across it and not a boat with no sails at
  all.
examples:
- The fore-and-after slipped out of the harbour at dawn.
- They crossed the bay in a fore-and-after with two sails.
