synsetId: 04258901-n
simpleMeaning: a wide board, like a wide ski or a small board for riding waves, used when you stand on
  it to slide down sloping ground covered in snow
scope: This is the board itself that you stand on. It is not the act of riding down a snow-covered hill
  on such a board.
examples:
- She bought a new snowboard before the winter trip.
- He stood on his snowboard and slid down the white slope.
