simpleMeaning: cut in an uneven way, with rough pointed edges, as if torn
scope: 'Also called lacerate: this describes a thing cut unevenly with rough edges, not a thing cut smoothly
  or cleanly and not a person hurt in feelings.'
examples:
- The lacerated leaves had rough, uneven edges.
- He picked up a lacerated piece of cloth, torn into sharp, uneven strips.
