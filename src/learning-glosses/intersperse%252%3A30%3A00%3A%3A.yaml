simpleMeaning: to add certain words or phrases here and there in what you write or say
scope: 'Only for writing or speech: adding words or phrases here and there, not putting things in places
  among other things.'
examples:
- She interspersed her talk with short phrases in French.
- He interspersed his letter with words from his home language.
