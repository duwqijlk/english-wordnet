simpleMeaning: a cabbage plant that can live through cold, with rough, curly leaves that do not grow into
  a round head
scope: Also called kale, this is the living cabbage plant that can live through cold and has no round
  head, not the leaves picked as food.
examples:
- This cole grows well in cold weather and never forms a head.
- He planted cole in rows because it stays strong through winter.
