simpleMeaning: To do with length, width and height, or with several sides of a thing, and giving the feeling
  of depth
scope: This is to do with length, width and height, also called 3-dimensional, third-dimensional and three-dimensional;
  not flat and not a trick of the eye alone.
examples:
- They shot the movie in three-d.
- The three-d characters looked lifelike on screen.
