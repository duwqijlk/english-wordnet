simpleMeaning: Moved by feeling, as from a shock, thrilling.
scope: Also called electric or galvanizing; this describes thrilling emotion as if from an electric shock,
  not an actual electric current.
examples:
- The speaker had a galvanic effect on the crowd.
- The performance sent a galvanic thrill through the audience.
