simpleMeaning: A fern from Europe and Asia Minor with a short, thin underground stem and bright green
  fronds that grow in dense tufts and look like parsley.
scope: A fern whose fronds look like parsley, not parsley itself or another fern.
examples:
- The mountain parsley fern grows in dense tufts of bright green fronds.
- The bright green fronds of the mountain parsley fern resemble parsley leaves.
