simpleMeaning: a part of the blood that helps it clot, sold under the name Hemofil, and its lack goes
  with the blood illness called haemophilia A
scope: 'Also called antihaemophilic factor, antihaemophilic globulin and antihemophilic globulin: a part
  of the blood that helps it clot, not a drug that thins the blood and not a drug that breaks up clots.'
examples:
- Without antihemophilic factor, her blood took a long time to clot.
- The hospital keeps antihemophilic factor on hand for patients with haemophilia A.
