simpleMeaning: 'Not treated as it should be: with no care, in the wrong way, or for a purpose that is
  wrong'
scope: It describes something treated in a wrong way or for a wrong end; it is not something that is simply
  old or broken.
examples:
- He chose a misused word and everyone laughed at the mistake.
- Her talent was misused on small jobs that did not need it.
