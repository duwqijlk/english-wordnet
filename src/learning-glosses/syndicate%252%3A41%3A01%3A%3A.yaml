simpleMeaning: to join with other people or companies to form a group that works together on a shared
  plan
scope: To join with others to form a group that works together for a shared aim. Not to organize or form
  a syndicate, and not to sell stories, photos, or programmes to many papers or stations at the same time.
examples:
- The banks syndicated to share the risk of the large loan.
- Several small companies syndicated so they could bid for the big project.
