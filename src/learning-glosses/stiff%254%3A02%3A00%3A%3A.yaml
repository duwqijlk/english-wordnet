senseId: 'stiff%4:02:00::'
synsetId: 00187654-r
simpleMeaning: in a way that does not bend or move easily
scope: This tells how something is done or held, in a way that does not bend easily; it is not the word
  for a thing that cannot bend, and not for a person who will not change his mind.
examples:
- His hands lay stiffly on the table.
- She sat stiffly in the hard chair, not moving at all.
