simpleMeaning: One thing hits another, and the hit makes the sound of this thing used to make music
scope: 'Also called a percussive instrument: a music-making thing whose sound comes from hitting, not
  from blowing air through it and not from plucked strings.'
examples:
- The percussion instrument that led the rhythm was a large drum.
- She played a percussion instrument made of wooden bars.
