simpleMeaning: A group of low deciduous shrubs with showy brushlike spikes of white flowers in spring
  and fiery red and orange autumn color, from Alabama to the Allegheny Mountains.
scope: The low spring-flowering shrub also sold as witch alder; not witch hazel, whose yellow ribbon-like
  flowers open in winter.
examples:
- A row of fothergilla lines the drive and turns fiery orange each autumn.
- Fothergilla grows best in moist, acidic soil with some shade.
