simpleMeaning: A low bushy tree of California with pale blooms that stand out.
scope: A low bushy tree of California with pale blooms that stand out; not the southwestern tree with
  sweet-smelling white blooms and not the southern Mediterranean tree that gives manna.
examples:
- The flowering ash in the garden had pale blooms that stood out.
- Flowering ash is a low bushy tree of California.
