simpleMeaning: to turn a thing round and round by turning its handle
scope: To turn a thing round by its handle, not the hand tool itself, not the drug, not a boat that tips
  easily, and not bending, fastening, or starting with it.
examples:
- He cranked the handle until the engine caught.
- She cranked the old mill by hand.
