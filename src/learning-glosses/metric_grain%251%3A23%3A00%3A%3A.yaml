simpleMeaning: Pearls or diamonds are weighed with this unit, equal to 50 mg or a quarter of a carat
scope: 'Also called grain: a unit for weighing pearls or diamonds, not a weight for gold and not a measure
  of length.'
examples:
- The jeweller weighed the pearl in metric grains.
- Each diamond was priced by the metric grain.
