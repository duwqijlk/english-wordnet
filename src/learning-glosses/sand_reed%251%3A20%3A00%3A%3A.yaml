  of Europe has an underground stem that works like sarsaparilla.
scope: It is also called sand sedge, a sedge of the sea coast of Europe now growing wild along the Atlantic
  coast of the United States, whose underground stem works like sarsaparilla.
examples:
- Sand reed grew along the Atlantic coast of the United States.
- The sand reed spread along the Atlantic coast.
