senseId: 'forgiveness%1:12:00::'
synsetId: 07570205-n
simpleMeaning: kind feelings toward a person who has hurt you, which make you ready to stop being angry
  and not punish them
scope: These are kind feelings that make you ready to stop being angry with a person who has hurt you.
  This is the feeling itself, not the act of telling that person you no longer blame them, and not anger
  or a punishment.
examples:
- Her forgiveness came from love, not from forgetting what he did.
- He felt deep forgiveness toward the man who had hurt him.
