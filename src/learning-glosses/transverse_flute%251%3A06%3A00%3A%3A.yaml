simpleMeaning: Blow across a hole near one end of a thin tube shut at the other end, with finger holes,
  to make high notes on a woodwind instrument.
scope: 'Also called a flute: a high woodwind instrument played by blowing across a hole, not the metal
  concert flute.'
examples:
- She played the transverse flute.
- He held the transverse flute sideways and blew across the hole near one end.
