simpleMeaning: the extra amount by which something grows or becomes larger, compared with what it was
  before.
scope: This is not the act of making something larger; it is the size of the rise itself.
examples:
- This year's increase in ticket prices was ten percent.
- The report noted a small increase in average rainfall.
