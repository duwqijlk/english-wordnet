simpleMeaning: To give paint its colour, this poison is made with the soft grey metal
scope: A poison that colours paint, not a paint on its own and not a poison used to kill insects.
examples:
- The yellow paint got its bright colour from lead chromate.
- Workers were warned that lead chromate in old paint could poison them.
