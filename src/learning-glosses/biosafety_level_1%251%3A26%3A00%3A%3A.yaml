simpleMeaning: contact only with germs that do not often make people ill
scope: This is contact only with germs that do not often make people ill, not work with germs that can
  make people ill and not work with germs that can kill people.
examples:
- In a biosafety level 1 lab, students handle germs that rarely cause disease.
- The class works at biosafety level 1 with microbes that do not often make people ill.
