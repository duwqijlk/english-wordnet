simpleMeaning: Sliced pieces of a starchy food grown underground, cooked in a pan in hot fat until brown
  and crisp.
scope: Sliced pieces of a starchy food grown underground, cooked in a pan until brown and crisp, not chips
  cut for deep frying and not boiled mash; also called home fries.
examples:
- We had home-fried potatoes with our eggs.
- She cooks home-fried potatoes in a pan until they are brown and crisp.
