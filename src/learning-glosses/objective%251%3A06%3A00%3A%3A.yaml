simpleMeaning: the glass part, or set of glass parts, in a telescope or microscope that is nearest to
  the thing being looked at
scope: The glass part in a telescope or microscope that sits nearest the thing being looked at; not a
  goal or aim, and not the adjective sense about the object of a verb.
examples:
- The objective of the microscope was dirty, so the image was not clear.
- He turned the objective toward the small plant to see it up close.
