simpleMeaning: to think that someone or something is the one most likely to win
scope: To think someone or something is most likely to win; not a small gift given to guests at a party
  and not a feeling of liking and support.
examples:
- The local team is favored to win the final.
- Bookmakers favor the home team to win Saturday's game.
