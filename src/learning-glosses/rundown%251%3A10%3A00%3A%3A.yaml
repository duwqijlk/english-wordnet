simpleMeaning: a last talk that sums up the main points, as when a case is put before a court
scope: 'Also called summation: a last talk that sums up a case, not a short report on recent events and
  not a state of being tired or in bad shape.'
examples:
- The lawyer gave a clear rundown of the case at the end.
- In his rundown, he went over the main facts one last time.
