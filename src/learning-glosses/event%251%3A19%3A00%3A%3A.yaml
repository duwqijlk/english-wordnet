simpleMeaning: In relativity theory, the basic thing that can be observed, namely something that occurs
  at one precise point in space and time.
scope: This is the technical relativity term, not an occasion that happens, a set of circumstances, or
  a result caused by something else.
examples:
- In relativity, two observers may disagree about the time of the same event.
- A flash of light marks an event at a particular point in space and time.
