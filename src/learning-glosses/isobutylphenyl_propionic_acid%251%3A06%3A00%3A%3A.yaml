simpleMeaning: A drug that eases swelling and pain and brings down a fever, sold as Advil, Motrin, and
  Nuprin, and used to ease the pain of sore joints
scope: Also called ibuprofen, this is a drug for swelling and pain.
examples:
- She took isobutylphenyl propionic acid for her sore knee.
- The doctor said isobutylphenyl propionic acid would ease the swelling in his joints.
