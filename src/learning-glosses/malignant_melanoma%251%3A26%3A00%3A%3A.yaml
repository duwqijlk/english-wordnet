simpleMeaning: The cells that give skin its dark colour make up one of a few kinds of cancer, usually
  found in the skin
scope: Also called melanoma, this is a cancer made of the cells that give skin its dark colour, not a
  harmless mole and not a growth that stays put.
examples:
- The doctor found a malignant melanoma on his back and sent him for tests.
- A malignant melanoma can grow fast if it is not caught early.
