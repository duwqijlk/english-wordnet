simpleMeaning: Large lizards that eat only plants and live in trees in hot parts of America, with sharp
  points along the back; people in Central and South America eat them
scope: Also called the common iguana, this is the large tree lizard itself, not any other kind of small
  lizard.
examples:
- An iguana lay in the sun on a high branch.
- In some villages, people cook iguana for food.
