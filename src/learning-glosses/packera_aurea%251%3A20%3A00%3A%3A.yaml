simpleMeaning: A weed-like herb of the east of the United States down to Texas with gold-yellow blooms,
  at times spreading out of hand and at times put with Senecio.
scope: Also called golden groundsel, golden ragwort and Senecio aureus; among the gold-yellow-flowered
  herbs of the east of the United States down to Texas, this is the weed-like one that at times spreads
  out of hand.
examples:
- Packera aurea spread through the damp meadow.
- The Packera aurea by the stream had gold-yellow flowers.
