simpleMeaning: the judge or judges, or a magistrate (a judge in a lower court), who sit in court to judge
  cases and together make up the court
scope: The judge or judges, or a lower-court judge, sitting in court together as the court itself; not
  a long seat in a park, and not a strong table for work.
examples:
- The bench ordered the man to leave the court.
- Lawyers must stand when they speak to the bench.
