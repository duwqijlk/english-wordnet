simpleMeaning: an activity that takes up your time and holds your thoughts, usually in a pleasant way
scope: 'Also called interest and pursuit: an activity that takes up your time and holds your thoughts,
  usually in a pleasant way. Not a job or work you must do.'
examples:
- Reading is her favourite pastime on quiet evenings.
- His main pastime is sailing with friends.
