senseId: 'therapeutic%3:01:00::'
synsetId: 02925526-a
simpleMeaning: connected with treatment given to help a person with an illness or another problem
scope: This word describes something connected with treatment for illness; it is not the medicine itself,
  and it does not by itself say that something makes a person well again.
examples:
- The doctor used a therapeutic approach to treat the illness.
- She went to a therapeutic centre for help with her back pain.
