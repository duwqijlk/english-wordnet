simpleMeaning: This is the ruling a scholar of Islam gives on a point of law
scope: A ruling on a point of law in Islam, not a law made by a state and not a judge's order in a court.
examples:
- The scholar issued a fatwah on the question of fasting.
- Many people asked the imam for a fatwah about the new rules.
