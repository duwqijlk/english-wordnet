senseId: 'intonation%1:04:01::'
synsetId: 01257565-n
simpleMeaning: the first part of plainsong (old church singing with one line of notes), sung alone by
  one person
scope: This is the first part of plainsong, sung alone by one person at the start; not singing in one
  tone that stays the same, and not the sense about how true the pitch of notes is.
examples:
- The intonation was sung by one singer before the rest of the choir joined in.
- In the old church service, the intonation opened the plainsong.
