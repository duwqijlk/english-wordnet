senseId: 'hypovolaemia%1:26:00::'
synsetId: 14218594-n
simpleMeaning: Less blood than there should be moves round the body in this blood sickness
scope: A blood sickness in which the amount of blood moving round the body falls, also called hypovolemia;
  not a loss of blood from a wound and not low blood pressure.
examples:
- Severe dehydration can lead to hypovolaemia as the blood volume drops.
- The doctors treated her hypovolaemia with fluids to restore the blood volume.
