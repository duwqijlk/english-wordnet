simpleMeaning: A nonmetal that forms four bonds and, after oxygen, is the most common element in the earth's
  crust; it occurs in clay, quartz and sand and is used in transistors.
scope: This sense is the element with atomic number 14; it is not the numeral 14 or a compound such as
  quartz or silicone.
examples:
- Silicon is used to make the wafers inside computer chips.
- Silicon makes up a large part of the earth's crust.
