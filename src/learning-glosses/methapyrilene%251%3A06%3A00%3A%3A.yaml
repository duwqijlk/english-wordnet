simpleMeaning: a drug that blocks the body's reaction to things it is allergic to, easing a runny nose,
  sore skin, or itching
scope: A drug that eases allergy signs; not a drug that fights germs and not a painkiller.
examples:
- The doctor gave her methapyrilene for her hay fever.
- He took methapyrilene when his skin itched after touching the plant.
