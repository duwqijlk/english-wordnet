senseId: 'wavelength%1:07:00::'
synsetId: 05093476-n
simpleMeaning: the distance from a point on a wave to the matching point on the next repeating part of
  the wave, measured along the way the wave moves
scope: This is a measure of the distance between matching points on waves that follow each other; it is
  not the height of a wave and not the speed at which it moves.
examples:
- The wavelength of red light is longer than that of blue light.
- They measured the wavelength of the radio signal.
