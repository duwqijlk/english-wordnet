simpleMeaning: A muscle-wasting illness starting in the teens or later, moving slowly, first weakening
  limbs and trunk, then all voluntary muscles, milder than Duchenne's, carried by women but striking only
  men.
scope: A muscle-wasting illness that starts in youth or later; not Duchenne's illness, which is worse,
  and not a sudden weakness.
examples:
- He was found to have Becker muscular dystrophy at sixteen.
- Becker muscular dystrophy moves slowly over many years.
