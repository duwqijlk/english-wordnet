simpleMeaning: brought out of a hidden state, in which a thing is present but not yet active, by something
  that acts on it
scope: 'Another name for this is elicited: it describes something brought out from a hidden, not yet active
  state by an outside action, not something that starts on its own.'
examples:
- The evoked response in the muscle was measured after each shock.
- Scientists recorded the evoked signals from the patient's brain.
