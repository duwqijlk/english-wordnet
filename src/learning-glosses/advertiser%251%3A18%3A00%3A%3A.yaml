simpleMeaning: a person whose business is making and placing notices that try to get people to buy goods
  or use services
scope: This is a person whose business is making and placing notices to sell things. It is not the notice
  itself, and not just a person who buys something after seeing one.
examples:
- The advertiser placed bright ads for the new car in three newspapers.
- As an advertiser, he helps small shops tell more people about what they sell.
