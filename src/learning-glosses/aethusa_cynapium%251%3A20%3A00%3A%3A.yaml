senseId: 'aethusa_cynapium%1:20:00::'
synsetId: 12951991-n
simpleMeaning: A European weed that has spread in America and looks like parsley but causes sickness and
  poisoning when eaten.
scope: A European weed that looks like parsley but causes sickness and poisoning when eaten, also called
  fool's parsley and lesser hemlock; its nearest kin are parsley itself and hemlock, which it can be mistaken
  for.
examples:
- Aethusa cynapium grew by the path and looked just like parsley.
- She warned the children not to eat Aethusa cynapium, which poisons people.
