simpleMeaning: In medicine, the power of the body to act and keep its key parts working
scope: In medicine, the body's power to keep its key parts working, not a thing kept for later use and
  not a shy manner.
examples:
- The doctor said his reserve was low after the illness.
- Her reserve helped her body fight off the fever.
