simpleMeaning: A plant of the western Mediterranean that lives for one year, with deep purple-red flowers
  that sit above three large heart-shaped leaf-like parts.
scope: A plant of the western Mediterranean that lives for one year, with deep purple-red flowers above
  three large heart-shaped leaf-like parts; not a shrub and not a plant with yellow flowers.
examples:
- Malope bloomed along the dry hillside.
- The malope opened its purple-red flowers in June.
