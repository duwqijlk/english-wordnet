simpleMeaning: On the first joint of a bird's front limb sits a small tuft of stiff feathers.
scope: This small tuft of stiff feathers on the first joint of a bird's front limb is also called the
  alula and the spurious wing.
examples:
- The bastard wing sits where the front limb bends.
- The bastard wing showed as a small tuft at the front of the wing.
