simpleMeaning: A feast of the Eastern Orthodox Church for the Virgin Mary taken up into heaven when her
  earthly life ended, matching the Roman Catholic Assumption, also kept on August 15th.
scope: A feast for the Virgin Mary's being taken up into heaven, also called the Feast of Dormition; not
  the Annunciation and not the Nativity.
examples:
- The Dormition is kept on August 15th in the Orthodox Church.
- Our parish marked the Dormition with a procession and hymns.
