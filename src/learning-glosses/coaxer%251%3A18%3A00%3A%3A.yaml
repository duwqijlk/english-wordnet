simpleMeaning: a person who tries to get someone to do something by saying kind, flattering things
scope: This is a person who tries to win someone over with kind, flattering words; wheedler is another
  name for this sense, not someone who gives orders or threatens.
examples:
- The coaxer spoke sweetly until her brother agreed to lend her the car.
- Our coaxer used praise and soft words to get the cat out from under the bed.
