simpleMeaning: a one-year North American plant with thin wiry stems, tiny scale-like leaves and small
  yellow flowers
scope: A one-year North American plant with wiry stems and tiny scale-like leaves; also called orange
  grass, pine-weed and pineweed, not a grass and not a garden flower.
examples:
- Nitweed grows along the dry roadsides of the plains.
- The botanist found nitweed with its small yellow flowers.
