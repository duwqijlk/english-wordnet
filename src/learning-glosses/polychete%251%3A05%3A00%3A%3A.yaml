simpleMeaning: A mostly sea-living worm with male and female parts together in one body, and pairs of
  side flaps bearing stiff hairs
scope: 'Also called polychaete, polychaete worm, and polychete worm: a sea worm with pairs of hairy flaps,
  not a leech and not a land worm.'
examples:
- The polychete hid among the rocks at low tide.
- Polychete bristles help the worm grip the sea floor.
