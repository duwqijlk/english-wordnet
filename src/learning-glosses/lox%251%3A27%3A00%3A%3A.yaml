simpleMeaning: A pale blue liquid you can partly see through, drawn to a magnet, made by squeezing oxygen
  gas cold till it turns to liquid; used to help rocket fuel burn.
scope: Also called liquid oxygen; cold liquid oxygen for rockets, not drinking water and not air.
examples:
- The rocket tanks were filled with LOX before launch.
- LOX is kept very cold so it stays liquid.
