simpleMeaning: The time since the late 1900s when facts became easy to get through print and through computers
  joined in networks.
scope: The time since the late 1900s when facts became easy to get through print and computers; not the
  time of factories and steam, and not the time before print.
examples:
- The information age began when computers made facts easy to find.
- In the information age, news travels through computer networks.
