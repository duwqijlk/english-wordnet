senseId: 'subjunctive%1:24:00::'
synsetId: 13824149-n
simpleMeaning: In grammar, a verb form used to speak of what might be or could be, not of what is a fact.
scope: In grammar, a verb form for what might be, not for what is; not the adjective use for things to
  do with that form.
examples:
- The subjunctive in 'If I were rich' shows a wish, not a fact.
- English uses the subjunctive less than it once did.
