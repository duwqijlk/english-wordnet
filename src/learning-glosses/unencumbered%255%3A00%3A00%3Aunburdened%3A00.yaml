simpleMeaning: free from worries and free from duties a person must take care of
scope: This describes a person who is free from worries and from duties they must do; it is not about
  carrying a heavy load, and not about being free from a debt or from money owed.
examples:
- After his children grew up, he lived an unencumbered life and traveled a lot.
- She felt unencumbered by worries once her work was done.
