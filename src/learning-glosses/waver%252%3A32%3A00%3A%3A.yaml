simpleMeaning: to make sounds that are not steady, going up and down in how loud or how high they are
scope: This sense is about a sound that is not steady; it is not about a thing moving up and down, and
  not about stopping because you are not sure.
examples:
- His voice wavered as he sang the long note.
- Her voice wavered and shook as she called out in the cold.
