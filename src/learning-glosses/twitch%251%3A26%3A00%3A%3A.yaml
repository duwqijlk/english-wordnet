simpleMeaning: a sudden short shake of a muscle, especially one that comes from a problem with the nerves
scope: A sudden shake of a muscle, not a quick move of the whole body and not a hard pinch between the
  fingers.
examples:
- A twitch in her eyelid kept coming back all afternoon.
- The doctor saw a twitch in his cheek and asked about his nerves.
