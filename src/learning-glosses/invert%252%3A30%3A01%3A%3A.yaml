simpleMeaning: In music, to change a set of notes by turning them the other way round in a piece of music
scope: In music, turning notes the other way round in a piece; not turning a real thing upside down and
  not putting things in the opposite order.
examples:
- The composer inverted the theme in the second part of the song.
- Here, she inverts the tune so the low notes come where the high notes were.
