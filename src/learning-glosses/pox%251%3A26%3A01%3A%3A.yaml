simpleMeaning: a common sex disease caused by a tiny spiral-shaped germ; its signs change as it moves
  through stages, and it can pass from a mother to her unborn child
scope: A common sex disease that moves through stages and can pass to an unborn child, not the skin disease
  that leaves pock marks.
examples:
- The doctor said the pox had reached its second stage.
- Pox can be passed from a mother to her baby before birth.
