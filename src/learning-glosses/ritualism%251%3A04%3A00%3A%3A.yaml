simpleMeaning: putting too much weight on the set acts and forms used in worship, as if the forms themselves
  were the most important part
scope: Putting too much weight on the set acts and forms used in worship; not the rites themselves, and
  not a plain order of worship.
examples:
- His ritualism made every small act of worship seem all-important.
- Ritualism can put the form before the faith.
