simpleMeaning: A small eastern Mediterranean tree with masses of purplish-red flowers that grow straight
  from old stems before the leaves; widely grown in mild lands, its wood prized for thin layers.
scope: A small tree with purplish-red flowers that open before its leaves, also called a love tree, Circis
  siliquastrum or a Judas tree.
examples:
- The Cercis siliquastrum by the gate was covered in purplish-red flowers.
- We planted a Cercis siliquastrum because its flowers open before the leaves.
