senseId: 'hebephrenic_schizophrenia%1:26:00::'
synsetId: 14422842-n
simpleMeaning: A form of schizophrenia with severe personality breakdown, unpredictable speech, immature
  mannerisms and strange behaviour; usually appears around puberty; the most commonly diagnosed type in
  psychiatric hospitals.
scope: Also called hebephrenia, disorganized schizophrenia or disorganized type schizophrenia; not a separate
  form, and not the catatonic or paranoid types.
examples:
- The case report describes hebephrenic schizophrenia beginning in the patient's teens.
- Hebephrenic schizophrenia usually appears around puberty.
