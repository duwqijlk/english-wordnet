simpleMeaning: In economics, using goods to meet needs or to make things
scope: 'Also called use, consumption, economic consumption, and use of goods and services: in economics,
  the taking of things to meet needs or to make things, not the buying of things and not the making of
  money.'
examples:
- The usance of timber rose when the factory made more chairs.
- In the report, usance of coal was counted as the coal used to heat homes and run machines.
