simpleMeaning: An artificial fishing bait, built on a hook and decorated to look like an insect.
scope: An artificial fishing bait shaped like an insect, not the insect itself and not the opening on
  a pair of trousers.
examples:
- He tied a small fly that looked like a mayfly and cast it into the stream.
- Trout rise to a dry fly on warm evenings.
