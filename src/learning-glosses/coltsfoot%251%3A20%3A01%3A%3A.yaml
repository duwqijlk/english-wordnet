simpleMeaning: a clump-forming evergreen herb whose smooth, rounded or heart-shaped leaves change to copper,
  maroon or purple in autumn, with minute white flowers on upright spikes.
scope: Another name for the evergreen plant also called beetleweed, galax and galaxy, not the other coltsfoot
  whose yellow blooms appear before its leaves.
examples:
- This coltsfoot keeps its shiny leaves through winter.
- Gardeners grow this coltsfoot for its round, heart-shaped leaves.
