simpleMeaning: keeping most people or things out, or all of them; it lets in only a certain group or,
  especially, a group that is less than half of all people
scope: About keeping most people or things out, especially all but a certain group; not the sense about
  being given to only one aim and not shared among others.
examples:
- The exclusive club lets in only a few rich members.
- An exclusive restaurant serves only a small group of rich guests.
