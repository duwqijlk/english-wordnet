simpleMeaning: A small sweet-smelling tablet that you suck to make your breath smell fresh, for example
  to hide the smell of tobacco smoke.
scope: A small tablet sucked to make the breath smell fresh, not a sweet eaten for pleasure.
examples:
- He took a cachou after his cigarette.
- She keeps cachous in her bag to sweeten her breath.
