simpleMeaning: to spread things out by throwing them about, in an old use of the word
scope: This is an old way to say spreading things by throwing them about, not putting dry plant stems
  over something and not a thin tube for drinking.
examples:
- In the old tale, they strawed flowers along the path.
- The children strawed toys all over the carpet.
