simpleMeaning: Any of several evergreen trees that bear seeds good to eat, shaped like small hard shells
  with food inside
scope: Any of several evergreen trees that bear seeds good to eat, shaped like small hard shells with
  food inside; not a tree that bears cones with no food in them, and not a nut tree.
examples:
- The nut pine drops seeds that people gather to eat.
- We roasted seeds from a nut pine over the fire.
