simpleMeaning: In physics, a system's return to balance after being disturbed, where the move back gets
  smaller by the same part in each equal time
scope: In physics, a system going back to balance after a change, not the calm, fresh feeling sense and
  not the slow lengthening of a resting muscle.
examples:
- After the magnet was disturbed, its relaxation back to a steady state took only seconds.
- They measured the relaxation of the system after the sudden change in temperature.
