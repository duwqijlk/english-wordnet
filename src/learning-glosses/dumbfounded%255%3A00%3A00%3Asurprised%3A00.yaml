senseId: dumbfounded%5:00:00:surprised:00
synsetId: 02366833-s
simpleMeaning: So taken aback by shock and surprise that you cannot speak at all
scope: So shocked and surprised you cannot speak; not merely puzzled, and not struck silent by fear alone.
examples:
- The policemen stood dumbfounded by her denial of the accident.
- He was dumbfounded by the news of his promotion.
