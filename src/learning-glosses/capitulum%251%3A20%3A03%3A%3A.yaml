simpleMeaning: the leafy branches set out at the top of a tree, making its crown
scope: The leafy branches that make the top of a tree, not a bunch of flowers and not the grain head of
  a cereal plant.
examples:
- The capitulum of the old oak spread wide over the garden.
- Birds nested in the capitulum of the tall pine.
