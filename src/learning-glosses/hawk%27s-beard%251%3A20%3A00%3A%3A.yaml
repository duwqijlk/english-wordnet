simpleMeaning: In the Northern Hemisphere, a long leafy stem that splits into branches carries loose heads
  of yellow flowers, and belongs to one of several kinds in the group Crepis.
scope: Also called hawk's-beards, it is one of several kinds in the group Crepis, and hawkweed is a different
  plant.
examples:
