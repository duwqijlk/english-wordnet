senseId: 'longitude%1:15:00::'
synsetId: 08614224-n
simpleMeaning: the distance, measured in degrees, between a place's north-south line and the main north-south
  line through Greenwich
scope: A measure of how far east or west a place is, not latitude, which is how far north or south a place
  is.
examples:
- The city's longitude is about 120 degrees east.
- Sailors used longitude to know how far east they had sailed.
