simpleMeaning: a part that holds a signal back for as long as the signal takes to travel through it as
  a wave
scope: A part that holds a signal back by travel time, not a timer that counts time and not a part that
  holds a signal back with sound waves.
examples:
- The electromagnetic delay line held the signal back by a fraction of a second.
- Engineers put an electromagnetic delay line in the set to line up the two signals.
