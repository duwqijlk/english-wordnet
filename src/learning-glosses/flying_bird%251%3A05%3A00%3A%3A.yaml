simpleMeaning: Animals with feathers that have a ridged breastbone where the muscles that move the wings
  join on.
scope: Animals with feathers that have a ridged breastbone where the muscles that move the wings join
  on, also called carinate or a carinate bird; not a feathered animal without a ridged breastbone and
  not a bat.
examples:
- The flying bird has a ridged breastbone for its wing muscles.
- Most flying birds have keeled breastbones.
