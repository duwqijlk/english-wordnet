simpleMeaning: a drawing that shows only the outer lines of a shape or a thing
scope: Also called delineation and limning. This is a drawing of outer lines only, not a full picture
  made by drawing or painting and not a description in words.
examples:
- The depiction in the book is just black lines around the shape of a house.
- She made a simple depiction of the leaf, drawing only its outer line.
