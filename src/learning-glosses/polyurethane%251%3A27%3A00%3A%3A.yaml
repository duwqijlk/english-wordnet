simpleMeaning: Any of various polymers holding the urethane group, made in many forms and used as glue,
  plastic, paint, or rubber.
scope: Also called polyurethan. The name covers the whole group of polymers, not one single chemical.
examples:
- The chair was coated in polyurethane to keep it dry.
- Polyurethane foam filled the gaps in the wall.
