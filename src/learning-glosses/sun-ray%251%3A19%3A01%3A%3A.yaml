simpleMeaning: a beam of man-made light that the eye cannot see, given off by a special lamp
scope: A beam of man-made light from a special lamp, also called a sunray, not light from the sun in the
  sky and not light from an ordinary lamp.
examples:
- The sun-ray from the lamp was aimed at the sore patch of skin.
- He sat under a sun-ray for ten minutes each day.
