simpleMeaning: a small thing put on a railway track that blows up when a train runs over it; the loud
  sound warns the train driver of danger ahead
scope: This is the railway track warning sense, not the underwater weapon and not the small firework that
  blows up when thrown at a hard surface.
examples:
- The worker put a torpedo on the track to warn the train driver.
- When the train ran over the torpedo, the loud bang warned the driver of danger ahead.
