simpleMeaning: To narrow a hollow organ or blood vessel until blood or air stops flowing through it.
scope: The squeezing shut of a hollow organ or blood vessel so that blood or air stops flowing.
examples:
- The swelling began to strangulate the blood vessel and stop the flow of blood.
- Doctors feared the hernia would strangulate the gut.
