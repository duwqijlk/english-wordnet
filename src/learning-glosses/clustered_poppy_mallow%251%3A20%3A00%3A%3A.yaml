scope: A hairy plant with pink-purple flowers in branching bunches, not a poppy and not a mallow with
  single flowers.
examples:
- Clustered poppy mallow grows along the dry bank with pink-purple flowers.
- The clustered poppy mallow leaves are thick with hairs.
