simpleMeaning: The meaning role of a noun group that names the time of a state or action named by the
  verb
scope: What a noun group does in meaning when it names the time of a state or action in a sentence, also
  called temporal; not the noun group that names a place and not the noun group that names a person.
examples:
- In 'She left on Monday', 'on Monday' has a temporal role.
- The temporal role tells us when the action took place.
