simpleMeaning: The main group for study and making new things for that department, that makes new ways
  of watching since the eleventh of September, two thousand one.
scope: Not the Defense Information Systems Agency, which looks after ways of passing on facts, and not
  a fighting force; this is the department's central body for study and for making new things.
examples:
- The Defense Advanced Research Projects Agency gave the team money to build a new way of watching.
- People at the Defense Advanced Research Projects Agency test new things before soldiers use them.
