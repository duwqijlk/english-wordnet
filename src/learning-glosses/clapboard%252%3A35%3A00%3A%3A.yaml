simpleMeaning: to cover the outside of a building with long thin boards, each board lying partly over
  the one below it
scope: This sense is the act of covering a building with such boards, not the long thin board itself that
  is used for this.
examples:
- They will clapboard the new house before winter comes.
- He clapboarded the side wall of the barn last summer.
