simpleMeaning: in mathematics, to break a number or mathematical expression into quantities that multiply
  together to produce it
scope: This is the mathematical verb for splitting something into multipliers, not a cause that contributes
  to a result, not treating something as relevant when deciding, not one of the numbers multiplied together,
  not a number that divides another exactly, not an abstract element of something, not an independent
  variable in statistics, not a gene, and not a commission agent.
examples:
- The students learned to factor large numbers into primes.
- A computer can factor that expression in seconds.
