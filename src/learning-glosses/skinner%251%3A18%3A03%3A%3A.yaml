simpleMeaning: a person whose job is to get animal skins ready for use, or to buy and sell them
scope: A person who works with animal skins, not a worker who drives mules.
examples:
- The skinner cleaned and dried the animal skins before selling them.
- A skinner bought fresh skins from the hunters each morning.
