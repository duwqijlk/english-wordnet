simpleMeaning: A bit of braid, usually worn on the sleeve, that shows rank in the armed forces or how
  long they have served
scope: This is a bit of braid on a sleeve that shows rank or length of service, not a strip put on a thing
  to look nice and not a plain mark of a different colour.
examples:
- He earned a new stripe on his sleeve after five years of service.
- The sergeant's stripes showed his rank at a glance.
