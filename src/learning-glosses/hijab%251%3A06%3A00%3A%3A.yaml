senseId: 'hijab%1:06:00::'
synsetId: 03525656-n
simpleMeaning: a scarf for the head worn by Muslim women, hiding the hair and neck, usually with a veil
  that covers the face
scope: A head scarf worn by a Muslim woman, not the wider custom of women dressing in a modest way outside
  the home.
examples:
- She wore a blue hijab that covered her hair and neck.
- Before going out, she put on her hijab and checked the veil over her face.
