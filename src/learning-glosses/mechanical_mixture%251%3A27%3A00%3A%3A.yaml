simpleMeaning: You can take the parts of this thing apart again, by touch or by a machine
scope: Things mixed together that can be taken apart again, not things joined by a chemical change and
  not one thing on its own.
examples:
- Sand and salt make a mechanical mixture that can be pulled apart.
- The cook stirred the mechanical mixture of nuts and seeds.
