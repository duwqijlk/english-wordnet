simpleMeaning: a home built from blocks of grass-covered earth or sun-dried mud brick, laid in flat rows
scope: 'Also called adobe house and soddy: a home built of blocks of earth or mud brick in flat rows,
  not a wooden cabin and not a stone house.'
examples:
- The family lived in a sod house on the open plains.
- They built a sod house from blocks of earth cut from the ground.
