simpleMeaning: a small mark (,) that goes under the letter c and tells you to say it like s
scope: A small mark put under the letter c to show it sounds like s, not a mark above a letter and not
  a letter itself.
examples:
- The cedilla under the c tells you to say it like an s.
- French words often use a cedilla under the letter c.
