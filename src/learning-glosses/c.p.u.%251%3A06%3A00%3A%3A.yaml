simpleMeaning: In computer science, the small chip inside a computer that does most of the work with data
scope: In computer science, the part of a computer that does most of the work with data; processor, mainframe,
  central processing unit, central processor and CPU are other names for this sense, not the screen or
  the keyboard.
examples:
- The C.P.U. does most of the work in this computer.
- If the C.P.U. fails, the whole computer stops.
