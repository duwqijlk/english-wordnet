simpleMeaning: to move back and forth from one side to the other while walking or standing
scope: Also called swing, this is moving back and forth from one side to the other, not changing what
  a person thinks and not holding power over people.
examples:
- The tall grass began to sway in the wind.
- He swayed as he walked down the narrow path.
