simpleMeaning: In Europe and North America, in the Permian or late Paleozoic time, there lived a large
  early reptile with a tall sail along its back.
scope: A large early reptile with a tall sail along its back, from long ago in Europe and North America,
  not a reptile of today.
examples:
- The pelycosaur had a tall sail along its back.
- Pelycosaurs lived in Europe and North America long ago.
