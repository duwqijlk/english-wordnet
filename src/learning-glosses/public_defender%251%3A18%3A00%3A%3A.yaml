simpleMeaning: A lawyer who speaks for poor people on trial, paid for by the state
scope: A lawyer who speaks for poor people on trial, paid for by the state; not a lawyer paid by the person
  on trial, and not a judge.
examples:
- The public defender argued that her client could not pay for a lawyer.
- He was given a public defender because he had no money for his own lawyer.
