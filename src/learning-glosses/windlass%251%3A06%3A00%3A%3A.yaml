simpleMeaning: A flat-lying cylinder turned by a crank, with a rope or cable winding on it, used for lifting
  things.
scope: Also called a winch; a lifting tool whose rope winds on a flat-lying cylinder turned by a crank.
examples:
- They used a windlass to raise the anchor.
- The windlass creaked as the rope wound round it.
