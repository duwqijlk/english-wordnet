simpleMeaning: Yellow or orange flowers that look like a dandelion mark one of many kinds in the group
  Hieracium, often with hairs.
scope: It is one of many kinds in the group Hieracium, and hawk's-beard is a different plant of the group
  Crepis.
examples:
- The hawkweed had yellow flowers that looked like a dandelion.
- Hawkweed opened its yellow or orange flowers that looked like dandelions.
