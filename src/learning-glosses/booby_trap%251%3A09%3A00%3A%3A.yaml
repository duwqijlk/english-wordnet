simpleMeaning: a hard problem that no one sees coming and that comes as a surprise
scope: 'Also called pitfall: a hard problem that no one sees coming, not a plain hard problem and not
  a hidden bomb that goes off when stepped on.'
examples:
- The new tax rule was a booby trap for small shops.
- She walked into a booby trap in the contract and lost a lot of money.
