simpleMeaning: cubes of meat left in a sauce and cooked on a stick, most often with vegetables
scope: Cubes of meat left in a sauce and cooked on a stick, most often with vegetables, also called a
  kebab and a kabob; not a roast and not meat cooked in a pan.
examples:
- We ate shish kebab with vegetables off the skewer.
- He grilled shish kebab over the coals.
