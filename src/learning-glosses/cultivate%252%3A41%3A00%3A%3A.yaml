simpleMeaning: to train and make taste or judgment better at noticing small differences and judging quality
  well
scope: This sense, also called school, train, educate, and civilize, is about making taste and judgment
  better; it is not about growing plants or preparing land for crops.
examples:
- Reading good books can cultivate your taste in stories.
- He cultivated his judgment by tasting many kinds of cheese and learning about each one.
