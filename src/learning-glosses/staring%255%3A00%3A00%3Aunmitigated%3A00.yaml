simpleMeaning: used in informal speech to make a word stronger, meaning complete or total, often showing
  disapproval
scope: Another name for the intensifier sense also carried by perfect and complete, meaning 'complete'
  or 'total'; it is not the sense of eyes held open and fixed in fear or wonder.
examples:
- By the end of the trial he was stark staring mad with worry.
- You would have to be stark staring mad to sign that contract.
