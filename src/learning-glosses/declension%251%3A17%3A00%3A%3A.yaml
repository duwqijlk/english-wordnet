simpleMeaning: a slope or bend that goes down
scope: 'Also called fall, decline, descent, declination, downslope and declivity: a slope or bend that
  goes down. It is not a set of word forms, and not the way words change their forms in some languages.'
examples:
- The path follows a gentle declension down to the river.
- A steep declension led from the hill down to the field.
