simpleMeaning: The seed case of any of several low plants that live for years looks like the pointed hat
  a bishop wears; the plants spread by stems under the ground.
scope: Also called bishop's cap and mitrewort; a low plant that lives for years, with a seed case shaped
  like the pointed hat a bishop wears.
examples:
- The miterwort in the wood had seed cases like small pointed hats.
- Gardeners grow miterwort for its odd hat-shaped seed cases.
