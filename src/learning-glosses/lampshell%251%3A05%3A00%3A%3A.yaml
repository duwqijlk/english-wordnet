simpleMeaning: With two arms bearing small feelers for catching food, this sea animal has a hard cover
  in two parts and is found all over the world.
scope: Also called brachiopod and lamp shell, this sea animal lives all over the world, with a hard cover
  in two parts and two arms with small feelers for catching food.
examples:
- A lampshell clung to the rock.
- The lampshell opened and closed its cover.
