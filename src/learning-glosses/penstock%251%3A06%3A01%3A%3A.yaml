simpleMeaning: a gate or valve that sets how fast water flows through a channel
scope: 'Also called a floodgate, a head gate, a sluice valve, a sluicegate and a water gate: a gate or
  valve setting how fast water flows through a channel, not the channel itself and not a dam.'
examples:
- The penstock was opened to let water into the mill race.
- Workers closed the penstock when the river rose.
