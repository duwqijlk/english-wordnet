simpleMeaning: From the front mast to the deck or the spar at the front of the boat runs a rope that can
  be tightened, keeping the mast from bending.
scope: This names the rope that can be tightened, running from the front mast to the deck or the spar
  at the front of the boat, which keeps the mast from bending.
examples:
- The sailor tightened the forestay before the wind rose.
- A loose forestay let the mast bend too far.
