simpleMeaning: water in the air that has turned into small drops of liquid because of cold
scope: These are the small drops of water that form in cold air. This is not the sense where two ideas
  join into one in a dream, and it is not a short form of a book.
examples:
- Condensation covered the cold window in the morning.
- We wiped the condensation off the bathroom mirror.
