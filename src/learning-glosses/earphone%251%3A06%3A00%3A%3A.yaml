simpleMeaning: a small piece of equipment that turns electric signals into sound, held over the ear or
  put inside it
scope: 'Also called phone, headphone, and earpiece: a small piece of equipment for listening that sits
  over or in the ear, not a speaker that plays sound out into a room.'
examples:
- She listened to the lesson through one earphone on the bus.
- He took out his earphones so he could hear me speak.
