simpleMeaning: a character, an animal, or a thing that a team or group chooses as a sign that stands for
  them
scope: A figure chosen to stand for a team or group, not a team member and not a prize the team wins.
examples:
- The school mascot is a friendly lion.
- Our team mascot danced at the game and waved to the children.
