simpleMeaning: When a person is knowingly made to take part in an unwanted bodily act by force or by threat,
  the law treats it as a wrong.
scope: Sex crime, sex offense and sexual assault are other names for this wrong under the law.
examples:
- The sexual abuse was done by force and threat.
- The sexual abuse made a person do an unwanted bodily act.
