simpleMeaning: After an egg splits, a being at its first stage, liquid ball with a wall one cell thick,
  eight or so days on fixed in the wall of the uterus.
scope: This sense is also called blastosphere.
examples:
- The blastula forms after the egg splits.
- A blastula fixes itself in the womb wall.
