simpleMeaning: not caring about the things of everyday life, such as money or success, and not changed
  by thoughts of such things
scope: It describes a person who does not care about the things of everyday life, such as money or success,
  not a person who simply lacks knowledge of how people act.
examples:
- She lived a quiet, unworldly life and gave away most of her money.
- The unworldly monk cared little for fame or success.
