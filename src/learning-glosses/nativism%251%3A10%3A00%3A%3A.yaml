simpleMeaning: A plan to keep the ways of life of a land going, against taking in the ways of others
scope: A plan to keep the ways of life of a land going against taking in the ways of others, not a plan
  to take in new ways and not a love of one's own land alone.
examples:
- Nativism shaped the country's laws about who could come in.
- The party's nativism called for keeping old customs alive.
