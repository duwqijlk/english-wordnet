simpleMeaning: Two rails or beams are held together at their sides by this flat piece of metal, fixed
  on with bolts
scope: This flat piece of metal joins two rails or beams at their sides, not a plate that covers a wall
  and not a rail on its own.
examples:
- The workers fitted a fishplate where the two rails met.
- A cracked fishplate can make the track unsafe.
