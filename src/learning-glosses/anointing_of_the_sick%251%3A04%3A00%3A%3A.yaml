simpleMeaning: A Catholic sacrament in which a priest puts oil on a dying person and prays for that person's
  salvation
scope: This is also called extreme unction and last rites, and it is for a person near death, not for
  one in good health.
examples:
- The priest gave the anointing of the sick to the dying woman and prayed for her to be saved.
- The anointing of the sick is a rite of the Catholic Church for a person near death.
