simpleMeaning: a form of baptism (a church act that uses water to mark a person joining a church) where
  part or all of the body goes under water
scope: This is a church act of baptism in which part or all of a person's body goes under water. It is
  not the sense in the study of space, where a body in space goes out of sight just before an eclipse
  (a time when the sun or the moon grows dark).
examples:
- At the immersion, the man went all the way under the water.
- Their church practises immersion, putting the whole body under water.
