simpleMeaning: A net of bare nerve threads and nerve cell bodies past the nerve knots, working on their
  own, in the muscle wall of the food pipe, stomach, and gut.
scope: This is the net of nerves in the muscle wall of the food pipe, stomach, and gut, also called plexus
  myentericus — not other nets of nerves elsewhere in the body.
examples:
- The myenteric plexus helps move food through the gut.
- Signals in the myenteric plexus control the muscles of the stomach.
