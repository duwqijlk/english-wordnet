simpleMeaning: the way you notice touch, where your body is, and feelings deep inside your body
scope: Noticing touch, body position, or inner feelings, also called somaesthesia, somatic sensation and
  somesthesia; not the body's whole sense system and not sight or hearing.
examples:
- Somatesthesia warned him of the change in pressure.
- She lost somatesthesia in her legs after the injury.
