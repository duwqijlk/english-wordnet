simpleMeaning: A large fish of warm seas far from shore, with a long tail like a whip that it uses to
  herd small fish together to eat.
scope: 'Another name for thresher, fox shark and thrasher: a big shark of warm open seas, not a farm machine
  for grain.'
examples:
- The thresher shark swept its long tail through the school of small fish.
- A thresher shark passed under the boat in the warm open sea.
