simpleMeaning: a seat on wheels for a person who cannot walk, most often pushed by a helper, as at a spa
scope: A seat on wheels for a person who cannot walk, most often pushed by a helper, not a seat a person
  pushes by hand and not a bed on wheels.
examples:
- An attendant pushed her bath chair along the path at the spa.
- He hired a bath chair to take his mother round the gardens.
