senseId: misanthropic%5:00:00:distrustful:00
synsetId: 02472810-s
simpleMeaning: Expecting the worst of people and what drives them, and scoffing at the idea that anyone
  acts without thinking of themselves.
scope: Also called cynical or misanthropical, this is a way of thinking that expects the worst of people
  and doubts that anyone acts without thinking of themselves.
examples:
- His view of people was misanthropic, always expecting the worst of them.
- She was misanthropic in her outlook, doubting every kind act she saw.
