simpleMeaning: A toad that comes out at night and digs, living in the bush land and open grass land of
  the south-west of the United States.
scope: 'Also called Anaxyrus speciosus and Bufo speciosus: a toad that comes out at night and digs in
  the bush land and open grass land of the south-west, not a day animal.'
examples:
- The Texas toad came out at night.
- A Texas toad dug a hole in the dry ground.
