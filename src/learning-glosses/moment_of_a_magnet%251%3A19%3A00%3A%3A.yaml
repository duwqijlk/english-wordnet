simpleMeaning: The twisting pull on a piece of metal that pulls iron, or on a thing with two poles, when
  it is set where such a pull is felt
scope: The twisting pull on a piece of metal that pulls iron, or on a thing with two poles, when it is
  set where such a pull is felt; magnetic moment is another name for this, not the pull of gravity and
  not the strength of the metal itself.
examples:
- The moment of a magnet turns it to line up with the field.
- They worked out the moment of a magnet from the twist it felt.
