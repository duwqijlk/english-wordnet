simpleMeaning: The lowest of the small holy ranks in the old Western Church, a rank the Roman Catholic
  Church has now done away with
scope: 'Also called doorkeeper or ostiary: the lowest of the small holy ranks in the old Western Church,
  now done away with, not a priest and not a bishop.'
examples:
- The ostiarius was the lowest of the small holy ranks.
- The old Church did away with the rank of ostiarius.
