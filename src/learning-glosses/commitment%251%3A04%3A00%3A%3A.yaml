simpleMeaning: the act of tying yourself, in your mind or in your feelings, to a way of acting
scope: 'Also called loyalty, allegiance and dedication: the act of tying yourself to a way of acting;
  not the quality of firm purpose, and not a contract with a duty to pay money.'
examples:
- His commitment to public service lasted his whole life.
- Joining the movement was a serious commitment for her.
