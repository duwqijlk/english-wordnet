simpleMeaning: a person who cares too much about doing and saying only what is proper and polite
scope: 'Also called puritan: a person who cares too much about proper, polite behaviour, not just a person
  who is polite or follows the rules in a normal way.'
examples:
- Some people called him a prude because he would not listen to rude jokes.
- As a prude, she always told the children to sit properly and speak politely.
