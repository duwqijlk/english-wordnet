simpleMeaning: Signs come on slowly in this long-lasting infection by bacteria of the inner lining of
  the heart and its valves.
scope: This long-lasting infection by bacteria of the inner lining of the heart and its valves brings
  signs on slowly, not a sudden infection that strikes fast.
examples:
- The illness was subacute bacterial endocarditis, and its signs came on slowly.
- The signs of subacute bacterial endocarditis came on slowly over time.
