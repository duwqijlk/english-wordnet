simpleMeaning: One of many plants of Africa whose thick leaves look like stones, with single yellow or
  white blooms.
scope: Also called flowering stone, living stone, stone-face, stone life face, stone plant, and stoneface,
  it is not a true stone but a plant with stone-like leaves.
examples:
- The lithops in Africa bears single yellow flowers.
- Its thick leaves make the lithops look like a stone.
