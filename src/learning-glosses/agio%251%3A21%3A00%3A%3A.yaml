simpleMeaning: a fee paid for changing one kind of money into another kind
scope: A charge for changing money, also called premium, agiotage, or exchange premium, not a tax and
  not the price of the money itself.
examples:
- The bank took a small agio when we changed dollars into euros.
- He paid an agio to change his pounds into francs.
