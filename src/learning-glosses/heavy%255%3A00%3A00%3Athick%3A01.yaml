simpleMeaning: Made of thick cloth, such as a winter coat.
scope: This describes an item made from cloth of considerable thickness, not physical weight or density,
  not unusually great degree, quantity, or number, not military or industrial armaments or equipment,
  not emotional burden, sadness, or weariness, not a stout person with a large frame, not compact fine-grained
  soil, not a sky darkened by clouds, not great intensity, power, or force, not an isotope of greater
  atomic mass, not an actor playing a villain, not dense matter that lets little light through, not relatively
  large extent and density, not something prodigious, not a full, loud, deep sound, not overindulgence
  in drink, not grave or important matters, not slow, laborious movement, not equipment built for rough
  work, not food that upsets digestion, not a steep slope, not being full of or bearing great weight,
  not work that requires effort, not effort to the point of exhaustion, not dullness or lack of liveliness,
  not deep, complete sleep, not advanced pregnancy, not the noun for an actor in villain roles, not the
  noun for a serious or tragic role, and not the adverb meaning slowly under a burden.
examples:
- He wore a heavy coat and still felt the cold wind.
- The tailor chose a heavy cloth that would last for years.
