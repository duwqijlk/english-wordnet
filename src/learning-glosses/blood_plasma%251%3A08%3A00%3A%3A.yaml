simpleMeaning: Red cells, white cells and platelets float in this watery part with no colour of the red
  liquid and of lymph, which has no cells of its own.
scope: Also called plasma and plasm, this is the watery part of the blood with no colour, in which red
  cells, white cells and platelets float, not the red cells themselves.
examples:
- Blood plasma is the watery part of the blood that holds no cells of its own.
- Red cells, white cells and platelets float in blood plasma.
