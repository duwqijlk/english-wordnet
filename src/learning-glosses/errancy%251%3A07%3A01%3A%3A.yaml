simpleMeaning: In Christianity, holding views that go against the faith as it is taught, above all going
  against the belief that the pope cannot be wrong in faith.
scope: In Christianity, holding views against the taught faith, above all on the pope, not a leaning to
  make mistakes and not a small slip in words.
examples:
- He was charged with errancy for denying what the church taught.
- Her errancy lay in her stand against the pope's word on faith.
