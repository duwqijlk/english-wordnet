simpleMeaning: an open area where fairs are held, where things are shown to people, and where circus acts
  are shown
scope: This is an open area for fairs, for shows where things are shown to people, and for circus acts.
  It is not an indoor hall and not a sports ground.
examples:
- The fairground was full of lights, rides and music.
- They set up tents and stalls on the fairground for the weekend show.
