simpleMeaning: the act of making a mix stronger by taking out the stuff that makes it weak, so the mixed-in
  part takes up more of the mix
scope: Making a mix stronger by taking out what makes it weak; not a person's close attention to one thing,
  and not the amount of a thing in a mix.
examples:
- Concentration of the juice by taking out water left a thick, sweet liquid.
- Through concentration, the workers took water out of the mix and made it stronger.
