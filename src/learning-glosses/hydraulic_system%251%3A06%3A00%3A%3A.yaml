senseId: 'hydraulic_system%1:06:00::'
synsetId: 03556970-n
simpleMeaning: A machine worked by the push or pressure sent when a liquid is forced through a small hole
  or tube
scope: This is a machine worked by the push or pressure sent when liquid is forced through a small hole
  or tube, not a machine worked by steam and not a set of pipes that only carry water.
examples:
- The hydraulic system lifted the heavy load with ease.
- A leak stopped the hydraulic system from working.
