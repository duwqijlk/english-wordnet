simpleMeaning: With crossed lines marked on it, this tool tells a watcher how high clouds sit, where they
  are headed, and how quickly they drift.
scope: A watcher uses this tool to measure clouds by height, direction and speed, and the tool is not
  a cloud itself.
examples:
- The nephoscope showed the clouds moving fast.
- They used a nephoscope to measure the height of the clouds.
