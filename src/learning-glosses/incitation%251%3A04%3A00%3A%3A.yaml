simpleMeaning: the act of pushing people to do something, by waking them up and getting them moving
scope: The act of pushing people to act; incitement is another name for this sense, not the thing that
  does the pushing and not a call for calm.
examples:
- The incitation of mutiny was blamed on the speaker.
- Her fiery incitation moved the crowd to act.
