simpleMeaning: A disorder present from birth in which the blood carries high levels of cholesterol, and
  the arteries harden and narrow early in life.
scope: A disorder present from birth with high cholesterol and early hardening of the arteries, not high
  cholesterol from diet alone and not the slow hardening of the arteries in old age.
examples:
- Her familial hypercholesterolemia was found when her cholesterol was tested as a child.
- People with familial hypercholesterolemia often need treatment to lower their cholesterol.
