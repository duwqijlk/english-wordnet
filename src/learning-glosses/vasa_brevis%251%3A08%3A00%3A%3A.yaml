simpleMeaning: Several small arteries that branch off the spleen's artery and run to the big curve of
  the stomach.
scope: 'Also called arteria gastrica breves and short gastric artery: several small arteries from the
  spleen''s artery to the big curve of the stomach, not the main artery of the stomach and not a vein.'
examples:
- The vasa brevis run from the spleen's artery to the stomach.
- Several vasa brevis feed the big curve of the stomach.
