simpleMeaning: A hairy upright herb from southeastern Asia, widely grown for its large glossy fruit, commonly
  eaten as a vegetable.
scope: Also called eggplant, aubergine, brinjal, eggplant bush, garden egg, and mad apple; not a tomato
  and not a pepper plant.
examples:
- The Solanum melongena bore large glossy fruit in summer.
- We cooked Solanum melongena as a vegetable.
