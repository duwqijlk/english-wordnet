simpleMeaning: To drive a nail or screw in so that its head sits below the surface of the material.
scope: This is not sharpening a blade, not adjusting a device to a standard and not preparing a room in
  advance; it is sinking a nail or screw head below the surface.
examples:
- He set the nail with a hammer and then filled the hole.
- The carpenter set each screw below the surface of the wood.
