simpleMeaning: to show that you think little of someone by breathing out loudly and hard through your
  nose
scope: This is breathing out in this way to show you think little of someone; it is not the noun for the
  noise itself, and not just any hard breath out through the nose.
examples:
- She snorted at his bad idea to show she thought it was worth nothing.
- He snorted when he heard the plan, making clear his low opinion of it.
