simpleMeaning: a plant that grows very hot long fruit, thin and sharp at the end, most often red
scope: 'Also called jalapeno, cayenne, cayenne pepper, chilli pepper and long pepper: the plant that grows
  very hot long fruit, not the fruit itself and not a plant that grows mild sweet fruit.'
examples:
- The chili pepper in her garden grew tall and bore long red fruit.
- He watered the chili pepper every day until its fruit turned red.
