simpleMeaning: A movement in image-making that began in Britain in the 1950s and spread in the United
  States and Britain in the 1960s, copying ads, mass culture and the mass media.
scope: A movement in image-making of the 1950s and 1960s that copied ads and mass culture, using images
  such as Andy Warhol's soup cans.
examples:
- Pop Art filled the gallery with soup cans.
- Pop Art took its looks from ads and the mass media.
