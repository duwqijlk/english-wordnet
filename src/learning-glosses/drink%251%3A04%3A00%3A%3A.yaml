simpleMeaning: the act of taking in alcohol in amounts that are far more than is healthy or sensible.
scope: This is not any liquid that can be consumed, and not an ordinary act of taking a normal amount
  of liquid.
examples:
- Years of heavy drinking had damaged his liver.
- His drinking had become a serious problem.
