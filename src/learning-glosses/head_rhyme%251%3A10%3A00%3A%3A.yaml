simpleMeaning: In a line of verse, every stressed beat starts with the same consonant sound
scope: The use of the same consonant at the start of each stressed syllable in a line of verse, also called
  alliteration, beginning rhyme and initial rhyme, not a rhyme at the ends of lines and not a repeated
  word.
examples:
- The head rhyme in 'around the rock the ragged rascal ran' links every word with r.
- Poets use head rhyme to give a line a strong beat.
