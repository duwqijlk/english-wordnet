simpleMeaning: A fungus whose top part is shaped like a bell and joins its stem only at the top, and there
  it makes its spores.
scope: 'Also called bell morel: a fungus whose bell-shaped top joins its stem only at the top.'
examples:
- The Verpa had a bell-shaped top that joined its stem only at the top.
- We found a Verpa whose bell-shaped top was fixed to its stem only at the top.
