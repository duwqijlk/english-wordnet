senseId: 'elasticity%1:07:00::'
synsetId: 05027524-n
simpleMeaning: the way a thing goes back to its first shape after it is pulled longer or pressed into
  a smaller shape
scope: Also called snap, this is the way a thing goes back to its first shape after being pulled or pressed;
  it is not about how hard or stiff a thing is.
examples:
- A rubber band's elasticity lets it stretch and then go back to its first shape.
- The old waistband lost its elasticity and no longer held tight.
