simpleMeaning: red, sore skin caused by being out in very strong, fast wind
scope: This is red, sore skin from strong wind. It is not a burn from the sun, from heat, or from fire.
examples:
- After a day of skiing, his face was red with windburn.
- She put cream on her cheeks to help the windburn.
