simpleMeaning: A Chadic tongue spoken south of Lake Chad, above all in Borno State, in the Biu and Askira-Uba
  areas, and in Adamawa State, in the Gombi area.
scope: Also called Bura language, Pabir, and Pabir language; a Chadic language spoken south of Lake Chad,
  above all in Borno State and Adamawa State.
examples:
- Many people in Borno State speak Bura.
- She grew up speaking Bura at home.
