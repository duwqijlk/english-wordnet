simpleMeaning: To give formal approval to a thing, showing that you accept it and will stand by it.
scope: To give formal approval to a thing, also called sign, not merely to sign your name on a paper.
examples:
- Parliament ratified the treaty after weeks of debate.
- The members ratified the new rules at the meeting.
