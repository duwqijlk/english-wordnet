simpleMeaning: In microbiology, a possible infectious particle thought to cause scrapie and other degenerative
  brain diseases; it is genetic material inside a coat of host-cell proteins.
scope: This is an unproven particle proposed for scrapie and similar brain diseases, not a proven virus;
  a rival idea is the prion, which carries no genetic material.
examples:
- Some researchers once argued that a virino, rather than a virus, caused scrapie in sheep.
- The virino hypothesis faded because no one could isolate such a particle from infected tissue.
