simpleMeaning: Made as a wide triangle of cloth that hangs from around the neck, it is a support for a
  hurt lower arm.
scope: Also called sling and triangular bandage, it is a support for a hurt lower arm that hangs from
  around the neck, not one wound round the arm itself.
examples:
- The scarf bandage hung from around his neck.
- His scarf bandage held up his hurt forearm.
