simpleMeaning: a walnut tree from North America with hard dark wood and nuts that can be eaten
scope: Also called black walnut and black walnut tree, it is a walnut tree with hard dark wood and nuts
  that can be eaten, not the tree with bitter nuts also called black hickory.
examples:
- The black hickory in the garden gives nuts we can eat.
- Carpenters prize black hickory for its hard dark wood.
