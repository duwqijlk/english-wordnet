simpleMeaning: a round shape made of rings, one inside another, as in leaves or flower petals that curl
  round
scope: A round shape of rings one inside another, also called roll, curl and coil. Not a written paper
  that you roll up to keep.
examples:
- The young leaves formed a tight scroll in the centre of the plant.
- She drew a scroll made of small rings on the paper.
