senseId: 'backwardation%1:26:01::'
synsetId: 92463549-n
simpleMeaning: a state of a market in which the price of a deal to buy at a later date is below the price
  expected when that date comes
scope: A market state where future prices sit below the price expected at the end, not a rise in prices
  and not a single deal.
examples:
- Backwardation in the wheat market meant future prices were lower than expected.
- Traders watched for backwardation before they bought grain for later delivery.
