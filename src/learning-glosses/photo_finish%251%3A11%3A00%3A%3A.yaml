simpleMeaning: A race end so close that only a picture taken at the line can show who won; more broadly,
  any very close end.
scope: A race end so close that only a picture taken at the line can show who won, and more broadly any
  very close end; not a clear win and not a draw.
examples:
- It was a photo finish, with both horses crossing the line together.
- The photo finish showed her ahead by a nose.
