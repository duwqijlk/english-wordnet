simpleMeaning: the time when an embryo (a young living thing before birth) grows and develops, about 266
  days in humans
scope: This is the time while a young living thing grows before birth, not just the state of a woman being
  pregnant.
examples:
- Gestation lasts about 266 days in humans.
- During gestation, the young animal grows inside its mother.
