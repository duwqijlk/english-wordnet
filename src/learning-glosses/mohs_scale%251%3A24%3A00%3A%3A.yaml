simpleMeaning: 'A list that ranks how hard solids are: talc is 0 and diamond is 10, by which solid can
  scratch another.'
scope: This is a hardness list, not a weighing scale or a set of marks; it has no other name in this set.
examples:
- On the Mohs scale, talc is 0 and diamond is 10.
- The Mohs scale ranks solids by what can scratch what.
