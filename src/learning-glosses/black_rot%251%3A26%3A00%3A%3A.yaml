simpleMeaning: Leaves of fruit and vegetable plants turn dark and fall apart in this sickness, brought
  on by a fungus.
scope: This is the fungus sickness that darkens the leaves of fruit and vegetable plants and rots them
  away.
examples:
- Black rot darkened the leaves of the fruit plants.
- The leaves fell apart where black rot had spread.
