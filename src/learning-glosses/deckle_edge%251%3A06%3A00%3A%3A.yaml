simpleMeaning: the rough outer side of a sheet of paper, formed when the paper is made by hand or copied
  on purpose in paper made by a machine
scope: This is the rough outer side of a sheet of paper, also called a deckle; not a smooth cut side and
  not the frame used to make the paper.
examples:
- The deckle edge gave the handmade book a soft, rough look.
- He ran his thumb along the deckle edge of the page.
