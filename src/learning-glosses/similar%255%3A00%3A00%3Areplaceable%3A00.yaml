simpleMeaning: able to replace another thing or swap places with it, with no loss of how well it works
  or how suitable it is
scope: This describes things that can stand in for one another, not things that merely look alike or words
  with related meanings.
examples:
- Either battery will do; they are similar enough to be swapped with no loss of power.
- The two brackets are similar, so each can be fitted in place of the other without any change in fit.
