senseId: 'accented%3:00:00::'
synsetId: 02327216-a
simpleMeaning: with one part given more force in speech than the other parts
scope: 'Also called stressed: having more force in speech. Not the narrower sense of a syllable that has
  the main force, usually with a change in how high the voice is.'
examples:
- In the word 'delay', the second part is accented.
- The accented syllable is said with more force than the others.
