simpleMeaning: A fish of the sea near the Atlantic coast, often used as food to catch other fish.
scope: A fish of Atlantic coastal waters often used as bait, also called big-eyed scad and goggle-eye;
  not a deep-sea fish and not a food fish for people.
examples:
- The bigeye scad darted through the shallow water.
- Bigeye scad were sold as bait at the dock.
