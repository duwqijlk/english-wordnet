simpleMeaning: full of great kindness and goodness, like an angel or a very holy person
scope: This sense is also called saintly, angelic, beatific, angelical and saintlike. It means full of
  great kindness, like an angel; it is not just about a person a church has named as holy.
examples:
- Everyone spoke of his sainted mother, who was kind to every person she met.
- The sainted old woman spent her life helping poor people.
