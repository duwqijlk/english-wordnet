simpleMeaning: The fruit of a plant used in many foods and as feed for animals, most of all in place of
  meat, it holds more protein than any other vegetable known
scope: Soybean, soy, and soya are other names for this fruit, not the plant itself.
examples:
- The soya bean holds more protein than any other vegetable known.
- The soya bean goes into many foods and into feed for animals.
