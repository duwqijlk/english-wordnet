simpleMeaning: A large, thin fish caught for food and for sport, found in many warm seas, above all around
  Hawaii
scope: A large, thin fish caught for food and for sport, found in many warm seas, above all around Hawaii,
  not its flesh as food and not a cold-sea fish; dolphin and dolphinfish are other names for this sense.
examples:
- The fishermen caught a mahimahi off the coast of Hawaii.
- Mahimahi is a fast fish that leaps clear of the warm sea.
