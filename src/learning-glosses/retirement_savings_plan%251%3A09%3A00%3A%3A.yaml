simpleMeaning: A scheme for putting money by while a person still works, to use once work has ended for
  good.
scope: This is a scheme for putting money by while a person still works, not a monthly sum paid out after
  work ends; it is also called retirement account, retirement plan, retirement program, and retirement
  savings account.
examples:
- They pay into a retirement savings plan each month.
- A retirement savings plan helps you put money by for later life.
