simpleMeaning: To make something get hooked or tangled in something else, by accident or suddenly.
scope: Making something snag or tangle in something else by accident; it is not something tangling by
  itself, not a hand grab, not the thing taken, not a faithful copy, not a catcher's play, or a pursuit
  gaining ground.
examples:
- I caught my sleeve on the door handle as I walked past.
- She caught her scarf in the closing elevator door.
