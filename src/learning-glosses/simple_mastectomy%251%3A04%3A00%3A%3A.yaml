simpleMeaning: The breast is taken away, yet the muscles beneath it and the small glands near them are
  left whole.
scope: It is the kind of breast removal that leaves the muscles beneath and the glands nearby whole.
examples:
- The surgeon chose a simple mastectomy, which takes the breast but leaves the muscles beneath it whole.
- After the simple mastectomy, the glands near the breast were still in place.
