senseId: 'assonance%1:10:00::'
synsetId: 07112012-n
simpleMeaning: The same vowel sounds coming back in the stressed parts of words that follow one after
  another.
scope: In poetry and verse, for vowel sounds repeated in stressed syllables of words close together.
examples:
- The assonance in 'fleet feet sweep by sleeping geese' links the words by their vowels.
- Poets use assonance to tie lines together with matching vowel sounds.
