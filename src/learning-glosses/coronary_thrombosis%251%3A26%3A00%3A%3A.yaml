simpleMeaning: A blood clot that blocks the flow of blood in one of the heart's blood tubes.
scope: This is a blood clot that blocks the flow of blood in one of the heart's blood tubes; coronary
  is another name for this sense, not a clot in the leg and not a weak heart that cannot pump.
examples:
- Coronary thrombosis blocked the blood flow to his heart.
- She was rushed to hospital with coronary thrombosis.
