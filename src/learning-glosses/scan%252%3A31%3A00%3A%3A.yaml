simpleMeaning: to take in information that is stored on magnetic tapes or in other digital form
scope: Also called read, this is about a machine getting information from tapes or digital sources, not
  about moving a light beam over something or looking closely at something.
examples:
- The computer scanned the old tape to get the stored information.
- The machine can scan data from the digital file.
