simpleMeaning: something that happens and ends in complete failure
scope: 'Also called bomb, and another name for it is turkey: a failed event, not a shell that does not
  go off and not a blast that never happens.'
examples:
- The launch party was a dud, and almost no one came.
- Their big plan turned out to be a dud.
