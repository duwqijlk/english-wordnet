simpleMeaning: A man-made body chemical made to act like the pregnancy hormone, sold under its trade name,
  used in pills that stop pregnancy and to treat the womb-lining sickness.
scope: A man-made body chemical, also called norethandrolone, norethindrone and norethindrone acetate;
  its near kin are the other man-made body chemicals used in pills that stop pregnancy.
examples:
- Norlutin is used in oral contraceptives.
- The doctor gave Norlutin for endometriosis.
