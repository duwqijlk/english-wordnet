simpleMeaning: Behind the small flap that hangs down in the throat, this mass of lymph tissue sits on
  the back wall and roof of the passage behind the nose.
scope: Also called an adenoid, a third tonsil, tonsilla adenoidea, and tonsilla pharyngealis, this mass
  of lymph tissue lies in the throat behind the small flap that hangs down.
examples:
- The pharyngeal tonsil lies on the back wall and roof of the passage behind the nose.
- When the pharyngeal tonsil grows too big, it is called adenoids.
