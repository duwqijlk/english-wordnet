simpleMeaning: To mark the edge of a field or garden, people often plant this bushy tree from Europe and
  Asia in a row
scope: A bushy tree from Europe and Asia, also called field maple, often planted as a row at the edge
  of a field or garden, not a tall forest tree and not a fence.
examples:
- They planted hedge maples along the edge of the garden.
- The hedge maple by the gate had grown into a thick bush.
