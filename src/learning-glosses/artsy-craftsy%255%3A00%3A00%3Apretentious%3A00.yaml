simpleMeaning: said of a thing or a person that tries too hard to seem fine and clever, and whose sweet
  charm soon becomes tiresome
scope: 'Also called arty-crafty: used of work that tries too hard to please, not work that is simply well
  made and not a plain show of warmth.'
examples:
- The artsy-craftsy shop was full of painted jars and lacy cushions.
- Her artsy-craftsy manner soon wore thin with her guests.
