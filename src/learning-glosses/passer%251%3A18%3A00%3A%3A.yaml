simpleMeaning: In football, a player with the ball who tries to help their team gain ground by throwing
  the ball forward
scope: This is a football player who throws the ball forward, not a person seen as part of a different
  group of people, not someone walking by, and not a student who does well in a test.
examples:
- The passer threw the ball far down the field to a teammate.
- As the team's best passer, he threw more balls than anyone else that season.
