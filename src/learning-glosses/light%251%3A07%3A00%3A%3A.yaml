senseId: 'light%1:07:00::'
synsetId: 04958550-n
simpleMeaning: in a picture, the way brightness and shadow fall on objects and scenes and affect how they
  look
scope: Not the physical rays themselves, not the quality of an object that gives out or reflects them,
  and not a place having plenty of light; it is how illumination is shown in a picture.
examples:
- The artist spent hours getting the light on the water just right.
- In the painting, the light falls from the left and leaves the right side in shadow.
