simpleMeaning: A short lack of the gas the body takes from air, in the cells, after hard exercise.
scope: A short lack of the gas the body takes from air, in the cells; not a lasting lack and not a lack
  of food.
examples:
- An oxygen deficit follows a hard sprint.
- The oxygen deficit in her legs faded as she caught her breath.
