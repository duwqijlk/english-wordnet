simpleMeaning: In flying, how the full weight of a plane stands against the thing that fixes how much
  it can lift.
scope: In flying, how the full weight of a plane stands against what fixes its lift, not the work of putting
  goods on a plane, and not the amount carried at one time.
examples:
- The loading of the small plane was too high for a short runway.
- Pilots check the loading before they take off.
