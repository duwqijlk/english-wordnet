simpleMeaning: One outlet takes all the water from the whole stretch of land drained by a river and its
  smaller streams.
scope: This stretch of land is also called basin, watershed, catchment area, drainage area, drainage basin
  and river basin.
examples:
- The catchment basin takes in every stream that feeds the Missouri.
- All the water in the catchment basin leaves by one outlet.
