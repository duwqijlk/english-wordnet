simpleMeaning: to make a loud noise when fuel explodes in the wrong part of an engine
scope: This is making the loud engine noise, not the noise itself, not the fire set to stop a wild fire,
  and not a plan that goes wrong.
examples:
- My old car backfires all the time when I start it.
- The truck backfired loudly as it went up the hill.
