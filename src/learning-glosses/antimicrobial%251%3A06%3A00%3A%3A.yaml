senseId: 'antimicrobial%1:06:00::'
synsetId: 03212950-n
simpleMeaning: a thing, such as heat, rays, or a chemical, that kills tiny living things too small to
  see that could bring sickness
scope: 'Also called antimicrobic, disinfectant, or germicide: a thing that kills germs that could bring
  sickness, not the adjective use that describes a substance as able to kill germs, and not a plain cleaner
  that only washes dirt away.'
examples:
- The nurse cleaned the wound with an antimicrobial to kill germs that could cause sickness.
- Heat can work as an antimicrobial in a hospital kitchen.
