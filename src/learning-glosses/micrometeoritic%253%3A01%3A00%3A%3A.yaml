simpleMeaning: Of or relating to tiny bits of rock and metal that move through space.
scope: Of or relating to tiny bits of rock and metal that move through space, also called micrometeoric;
  not the tiny bit of rock itself, and not a rock that burns up in the sky.
examples:
- The micrometeoritic layer in the ice holds tiny grains from space.
- Micrometeoritic dust is found in deep-sea mud.
