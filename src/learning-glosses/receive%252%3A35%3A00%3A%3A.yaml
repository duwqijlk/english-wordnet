simpleMeaning: To show you are willing to have someone stay in your home or area.
scope: This is agreeing to take a person into your home or community, not merely greeting them on arrival
  and not hosting a formal party.
examples:
- The village received the refugees with open arms.
- The family agreed to receive a student from abroad for the summer.
